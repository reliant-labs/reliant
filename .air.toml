root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["monolith"]
  bin = "./dist/reliant"
  # Build to temp file then atomically rename to prevent race condition where
  # Temporal SDK tries to read the binary while it's being rebuilt.
  # The SDK's initBinaryChecksum() is called on worker start regardless of BuildID.
  cmd = "CGO_ENABLED=0 go build -buildvcs=false -o ./dist/reliant.tmp ./cmd/reliant/ && mv ./dist/reliant.tmp ./dist/reliant"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "mobile", "dist", ".claude_plan", "test", "electron", "node_modules", "e2e", "internal/gen", "web/src/gen", ".reliant"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "proto", "yaml"]
  include_file = []
  kill_delay = "5s"  # Allow time for graceful shutdown before SIGKILL
  log = "./data/build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u SSL_CERT_FILE -u SSL_CERT_DIR buf generate"]
  rerun = false
  rerun_delay = 500
  send_interrupt = true  # Send SIGINT first to trigger graceful shutdown
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  keep_scroll = true