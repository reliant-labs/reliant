# Forge Changes: the app behavior that can differ between users without a
# deploy (forge docs/changes.md). This file says what each change CAN be: its
# key, type, variants and default. Who gets which variant is decided in the
# console (Analytics › Experiments), per environment; launching or ramping one
# in prod is a person's action there, never a code change.
#
# `forge generate` turns each entry into a typed accessor:
# frontends/web/src/lib/changes_gen.ts (and internal/changes/changes_gen.go).
# A change the snapshot does not carry evaluates to its declared default, so
# merging an entry here changes nothing for anyone.
#
# The unit is chosen at launch, in the console. Launch these with unit `user`:
# the web app evaluates them with the signed-in person's id
# (frontends/web/src/lib/changesStore.ts userChangeContext), and a guest is
# never enrolled.
version: 1
changes:
  pending-provider-copy:
    description: >-
      The "Connect your <subscription>" banner on the home new-chat view
      (PendingProviderBanner), shown to a signed-in user who chose a
      subscription sign-in during onboarding and has not connected a model.
      current is today's banner; outcome-first leads with what connecting gets
      them (a model to chat with) and offers the API key as a second button.
      Success metric: pending_provider_connect_clicked per exposed user.
    type: bool
    default: current
    variants:
      current: false
      outcome-first: true
