# pnpm settings for the pinned protoc-gen-es plugins. A workspace root of its
# own (one package, no members), so a pnpm-workspace.yaml higher up never
# swallows it and these settings apply here and nowhere else.
#
# Every buf.gen*.yaml runs a plugin as
# [node, tools/protoc-gen-es/node_modules/<alias>/bin/protoc-gen-es]: pnpm
# links each `npm:` alias at node_modules/<alias> with its own dependencies,
# so two versions side by side each load the @bufbuild/protoplugin they were
# resolved with.

# Refuse to install on a Node outside a dependency's engines, as the other
# pnpm projects here do.
engineStrict: true
