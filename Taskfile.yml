version: '3'

# ┌──────────────────────────────────────────────────────────────┐
# │ reliant's tasks. Born from `forge project rescaffold          │
# │ Taskfile.yml`, then edited for this repo (P8 lane L1,         │
# │ research/forge-migration/12-p8-devtooling-plan.md §2/§3).     │
# │ This file is where every build, test, generate, lint, pin     │
# │ and release command lives; there is no Makefile.              │
# │                                                              │
# │   task test:affected     Only what your diff reaches (start)  │
# │   task test:short        Inner loop: Go, -short, cached       │
# │   task test              Go (-race) + web + electron          │
# │   task test:integration  `integration`-tagged tests           │
# │   task test:e2e          e2e/stories (Temporal dev server)    │
# │   task ci                The whole local gate, one table      │
# │   task ci:checks         Static + build lane of it            │
# │   task ci:merge          The merge tier (~5 min, affected)    │
# │   task release:gate      The slow tier, on main, per sha      │
# │   task generate          forge generate (+ hooks), then docs  │
# │   task generate:check    Pinned forge generate is a no-op     │
# │   task generate:docs:check  Docs generators are a no-op       │
# │                                                              │
# │ Every forge call runs the forge forge.yaml pins (FORGE),      │
# │ never whichever forge is first on PATH. `task --list` names   │
# │ every task.                                                   │
# └──────────────────────────────────────────────────────────────┘

env:
  # GOFLAGS gets -trimpath, merged into whatever GOFLAGS you already use (from
  # the environment, `go env -w` or the toolchain's go.env). Without it Go
  # hashes each package's ABSOLUTE directory into its build-cache key, so every
  # worktree and scratch copy of this module (forge ci verify-generated
  # regenerates in a fresh one every run) compiles the whole module again and
  # re-runs every test instead of reusing what a sibling already built.
  # Measured: a second worktree of one commit compiled 267 packages and cached
  # 0 of 73 test packages without it; 0 and 58 with it. A GOFLAGS already in
  # your environment wins over this block (Task never overrides one), and
  # -trimpath=false in it, or in `go env -w GOFLAGS`, opts out. Code here must
  # not locate files from runtime.Caller (internal/architecture/trimpath_guard_test.go).
  GOFLAGS:
    sh: 'f="$(go env GOFLAGS 2>/dev/null)"; case " $f " in *" -trimpath"*|*" --trimpath"*) echo "$f" ;; *) echo "${f:+$f }-trimpath" ;; esac'
  # The forge pin is a commit pseudo-version (dev-docs/pinning.md), which
  # proxy.golang.org may not have ingested yet: fetch reliant-labs modules
  # straight from GitHub. Yours wins when set.
  GOPRIVATE: github.com/reliant-labs/*

vars:
  # FORGE runs the forge THIS PROJECT pins: forge.yaml's forge_version, which
  # `forge generate` keeps equal to go.mod's forge require. It is never
  # whatever `forge` is first on PATH — that is routinely another version (a
  # bundled forge, a months-old `go install`), and an older forge rejects a
  # newer forge.yaml ("unknown key") or lints, gates and generates with
  # templates the project did not pin. `go run module@version` builds the
  # pinned forge once and then reuses the cached executable.
  #
  # Overrides, for forge developers and pins no proxy serves:
  #   FORGE_BIN=/path/to/forge task lint   (environment), or
  #   task lint FORGE=forge                (command line).
  # A pin that names no published forge (a +dirty build, `dev`) falls back to
  # the forge on PATH, which then hands the command to the pin when it can.
  FORGE_YAML:
    sh: cat forge.yaml
  FORGE: '{{$pin := index (fromYaml .FORGE_YAML) "forge_version" | default "" | toString}}{{if .FORGE_BIN}}{{.FORGE_BIN}}{{else if or (eq $pin "") (eq $pin "dev") (contains "+" $pin)}}forge{{else}}go run github.com/reliant-labs/forge/cmd/forge@{{$pin}}{{end}}'
  # GOTESTRACE is a TOP-LEVEL var on purpose: only global vars can be
  # overridden from the command line (`task test GOTESTRACE=`). Clearing it
  # drops the race detector for one run; leave it set otherwise.
  GOTESTRACE: '-race'
  # SLOT runs the heavy lanes (`test`, `test:integration`, `coverage`, a full
  # `test:affected` lane, the docs check) inside one of this machine's
  # host-wide heavy slots: `forge slot run` waits while N other heavy jobs
  # (builds, test lanes, codegen, lints — from any agent, worktree or
  # terminal) are running, because past a handful every one of them slows
  # down. N comes from the machine; set FORGE_HEAVY_SLOTS=<n> to change it or
  # =off to switch it off. Inside a slot already (a gate check, a parent
  # `forge slot run`) it does not wait. Empty when forge is absent or predates
  # `forge slot` (the probe fails), so these tasks still run without it;
  # `task test SLOT=` skips the slot for one run. `test:short` takes no slot:
  # the scoped inner loop is not heavy and must not queue.
  #
  # The one deliberate use of the forge on PATH rather than FORGE: slots are
  # machine-wide (every project and forge version shares one queue), and this
  # probe runs on every `task` invocation, so it must cost nothing — never a
  # `go run`.
  SLOT:
    sh: forge slot status --class heavy >/dev/null 2>&1 && echo 'forge slot run --class heavy --' || true

  # ── Code generation: local, pinned, reproducible ──────────────────────
  # Generated code is committed, and CI fails on any diff a regenerate makes.
  # That only holds if every machine writes the same bytes, so nothing a
  # generator runs may come from the machine it happens to run on:
  #
  #   protoc plugins  Local, never `remote:` — the Buf Schema Registry
  #                   rate-limits. protoc-gen-go and protoc-gen-connect-go are
  #                   `tool` directives in go.mod, run with `go tool`;
  #                   protoc-gen-es is pinned by tools/protoc-gen-es's lockfile
  #                   (deps:protoc-gen-es installs it).
  #   buf             go.mod's `tool github.com/bufbuild/buf/cmd/buf` line, the
  #                   one pin forge reads too (BUF below).
  #   Go toolchain    GOTOOLCHAIN is exactly go.mod's. protoc-gen-go formats
  #                   its output with the go/printer of the Go that BUILT it,
  #                   and doc comment layout changes between releases.
  #   GOWORK=off      A machine-local go.work (`use ../forge`) would compile
  #                   the plugins and docgen tools against a sibling checkout
  #                   instead of go.mod's pins (cli.md embeds forge's whole
  #                   command tree).
  #
  # GEN_ENV is spelled into each generation command rather than set in an
  # `env:` block because Task never overrides a variable your shell already
  # exports, and these must win.
  GEN_GOTOOLCHAIN:
    sh: 't="$(sed -n "s/^toolchain //p" go.mod)"; [ -n "$t" ] || t="go$(sed -n "s/^go //p" go.mod)"; echo "$t"'
  GEN_ENV: 'env GOWORK=off GOTOOLCHAIN={{.GEN_GOTOOLCHAIN}}'
  GEN_GO: '{{.GEN_ENV}} go'
  # buf at go.mod's pin, built in its own module graph as forge builds it:
  # reliant's newer protovalidate (cel.dev/cel-go) does not build buf
  # v1.57.0, so `go tool buf` cannot run it. GOFLAGS is reset to -trimpath
  # because `go run pkg@version` refuses a repo-level -mod.
  BUF_VERSION:
    sh: "awk '$1 == \"github.com/bufbuild/buf\" { print $2; exit }' go.mod"
  BUF: 'env GOWORK=off GOFLAGS=-trimpath go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}'

  # ── Which Postgres the Go tests use ────────────────────────────────────
  # No task configures one. DB-backed tests take a database of their own from
  # forge pgtest (internal/db/testutil.go): an embedded Postgres of the major
  # forge.yaml declares, booted on a free port on first use and shared by
  # every test process on the machine. FORGE_TEST_POSTGRES_URL (a maintenance
  # DSN, database "postgres", on that major) points a run at a server of your
  # own instead. DATABASE_URL is never read by a test.

  # Docs generator paths.
  REFERENCE_DIR: generated/docs-source/reference
  WORKFLOWS_DIR: generated/docs-source/workflows
  SETTINGS_DIR: generated/docs-source/settings
  MINTLIFY_DOCS_DIR: docs
  FROZEN_FIXTURES_DIR: internal/workflow/runtime/replaytest/fixtures/frozen

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── Dependencies ──────────────────────────────────────────────────────

  deps:
    desc: Install Go modules and the web (pnpm), electron and protoc-gen-es (npm) packages
    cmds:
      - go mod download
      - task: deps:protoc-gen-es
      - task: deps:web
      - task: deps:electron

  deps:web:
    desc: Install the web app's packages (frontends/web, pnpm install --frozen-lockfile)
    dir: frontends/web
    cmds:
      - pnpm install --frozen-lockfile

  deps:electron:
    # Not --ignore-scripts: electron's postinstall fetches the Electron binary
    # its tests and the package build load.
    desc: Install the electron app's npm packages (electron, npm ci)
    dir: electron
    cmds:
      - npm ci --no-audit --no-fund

  deps:protoc-gen-es:
    # npm ci rewrites node_modules/.package-lock.json, so it doubles as the
    # stamp: a lockfile edit (a version bump) reinstalls, an unchanged one is a
    # no-op. Every buf template's TypeScript plugin runs from here.
    desc: Install the pinned protoc-gen-es (tools/protoc-gen-es) when its lockfile changed
    status:
      - test tools/protoc-gen-es/node_modules/.package-lock.json -nt tools/protoc-gen-es/package-lock.json
    cmds:
      - npm ci --prefix tools/protoc-gen-es --ignore-scripts --no-audit --no-fund --loglevel=error

  deps:go-protoc-plugins:
    # buf runs protoc-gen-go and protoc-gen-connect-go as `go tool <name>`,
    # which compiles the tool on first use, and forge runs `buf generate`
    # without --timeout, so buf's default 2m deadline covered that compile.
    # Cold, on a 4-core runner beside the merge gate's other phases, it ran
    # out and buf killed the plugins ("plugin go tool protoc-gen-connect-go:
    # signal: killed", PR #1771). Built here first, the executables are in
    # the build cache and the deadline covers only generation; a cached run
    # is a no-op of about a second.
    desc: Build the `go tool` protoc plugins buf.gen.yaml runs, before buf's deadline starts
    cmds:
      - '{{.GEN_GO}} tool protoc-gen-go --version'
      - '{{.GEN_GO}} tool protoc-gen-connect-go --version'

  # ── Build ─────────────────────────────────────────────────────────────

  build:
    desc: Build dist/reliant with the release identity stamped in (internal/version)
    cmds:
      - task: go:release
        vars: {GO_ARGS: build -o dist/reliant}

  build:cross:
    desc: Build release binaries for linux/amd64, darwin/amd64, darwin/arm64 and windows/amd64 into dist/
    cmds:
      - for: [linux/amd64, darwin/amd64, darwin/arm64, windows/amd64]
        task: go:release
        vars:
          GOOS: '{{index (splitList "/" .ITEM) 0}}'
          GOARCH: '{{index (splitList "/" .ITEM) 1}}'
          GO_ARGS: 'build -o dist/reliant-{{index (splitList "/" .ITEM) 0}}-{{index (splitList "/" .ITEM) 1}}{{if eq (index (splitList "/" .ITEM) 0) "windows"}}.exe{{end}}'

  install:
    desc: go install reliant with the release identity stamped in
    cmds:
      - task: go:release
        vars: {GO_ARGS: install}

  go:release:
    # The version stamp is load-bearing (internal/version/release_identity_test.go):
    # VERSION is the release identity — 1.8.1 at a tag, 1.8.2-dev+<sha8> after
    # it — from scripts/release-identity.sh, the resolver every shipped build
    # (web bundle, release.yml, control-plane's prod image) stamps from.
    # CGO_ENABLED defaults to 0; yours wins.
    internal: true
    vars:
      VERSION:
        sh: ./scripts/release-identity.sh 2>/dev/null || echo unknown
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      COMMIT_TIME:
        sh: ./scripts/release-identity.sh --commit-time 2>/dev/null || echo 0
      DATE:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
      BRANCH:
        sh: git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown
      PKG: github.com/reliant-labs/reliant/internal/version
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist
      - >-
        {{if .GOOS}}GOOS={{.GOOS}} GOARCH={{.GOARCH}} {{end}}go {{.GO_ARGS}} -buildvcs=false
        -ldflags="-s -w -X {{.PKG}}.Version={{.VERSION}} -X {{.PKG}}.Commit={{.COMMIT}} -X {{.PKG}}.Date={{.DATE}} -X {{.PKG}}.Branch={{.BRANCH}} -X {{.PKG}}.CommitTime={{.COMMIT_TIME}}"
        ./cmd/reliant/

  build:packages:
    # Every package compiled, nothing linked, no test variants: the build
    # cache CI saves on main for every job to restore (-trimpath, so it is a
    # hit in any checkout). The e2e stories' imports are compiled too.
    desc: Compile every package (and what the e2e stories import) into the Go build cache
    cmds:
      - go build ./...
      - go test -tags e2e -c -o /dev/null ./e2e/stories

  build:dev-cli:
    desc: Build dist/reliant-dev, the internal forensics CLI (reads the DB directly)
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist
      - go build -buildvcs=false -o dist/reliant-dev ./tools/reliant-dev

  build:web:
    desc: Build the web application (frontends/web/dist)
    dir: frontends/web
    cmds:
      - npm run build

  clean:
    desc: Remove build artifacts (dist/, coverage, logs)
    cmds:
      - go clean
      - rm -rf dist/ reports/ artifacts/ coverage.out coverage.html
      - rm -f ./*.log

  # ── Tests ─────────────────────────────────────────────────────────────

  test:affected:
    # The first thing to run before pushing. Reads the diff (committed,
    # staged, unstaged, untracked) against the merge-base with origin/main,
    # maps each path to the Go packages and their reverse dependencies, the
    # vitest files that import it, and the electron tests, runs those and the
    # codegen checks it can affect (task generate:check,
    # task generate:docs:check), and prints why each ran. A path it cannot
    # place, a go.mod/package.json/Taskfile/config change, or a diff it
    # cannot compute runs the whole lane.
    #
    #   task test:affected                  every lane
    #   task test:affected LANES=go,web     some lanes
    #   task test:affected -- -dry-run      any other tools/test-affected flag
    #
    # TEST_BASE=<rev> moves the diff base, TEST_FULL=1 runs everything. A
    # migration also runs the DB-backed packages it reaches. A FULL lane waits
    # for a host heavy slot; a scoped one does not. Design and the rule table:
    # dev-docs/testing-affected.md.
    desc: "Run ONLY the tests and codegen checks your diff can reach, and say why (LANES=go,web,electron,forge-generate,docs-generate)"
    cmds:
      - TEST_AFFECTED_SLOT='{{.SLOT}}' go run ./tools/test-affected run {{if .LANES}}-lanes {{.LANES}} {{end}}{{.CLI_ARGS}}

  test:affected:plan:
    desc: Print what test:affected would run and why, without running it
    cmds:
      - go run ./tools/test-affected {{if .LANES}}-lanes {{.LANES}} {{end}}{{.CLI_ARGS}}

  test:short:
    # The inner loop: run this after each edit, scoped to the packages you
    # touched (`task test:short -- ./internal/lifecycle/...`), and
    # `task test:affected` before you push. Every flag difference from
    # `task test` is on purpose:
    #
    #   -short        slow paths sit behind `if testing.Short() { t.Skip() }`;
    #                 the full lane still runs them. DB-backed tests run:
    #                 each gets its own copy of a migrated template.
    #   no -count=1   Go's test cache keys on the test binary, its flags, and
    #                 the files and env vars the test reads, so a cached pass
    #                 is a real pass for any test that builds its own state.
    #                 The cache sees only what the TEST PROCESS reads: a test
    #                 that execs a child (go, git, node, cat...) which reads
    #                 repo files not go:embed'd and not written into
    #                 t.TempDir() must read those inputs itself or skip under
    #                 -short, or this tier can report a stale pass.
    #   no -race      the race detector rebuilds every package under its own
    #                 cache key and slows tests 2-10x; `task test` keeps it on.
    #   -timeout 5m   per package BINARY, not per test. The DB-backed
    #                 packages run in this tier too (D-P8-3), and their tests
    #                 are t.Parallel() (each owns its database), so the
    #                 slowest package takes ~50s on an idle machine and ~130s
    #                 at load 100; 5m is about twice the worst seen. A single
    #                 test that needs seconds under -short still wants a
    #                 testing.Short() gate, not a bigger budget.
    #   no stop       nothing here stops another agent's environment.
    #
    # Go only — web and electron run in `task test` / `task test:web`.
    desc: "Inner-loop Go tests: -short, cached, no race. Scope it: task test:short -- ./internal/foo/..."
    cmds:
      - go test -short -timeout 5m {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}

  test:
    # Everything after `--` REPLACES the default `./...`, so it takes both
    # flags and package patterns:
    #
    #   task test                                  whole module + web + electron
    #   task test -- ./internal/lifecycle/...       only those Go packages
    #   task test -- -run TestFoo ./internal/...    one test
    #   task test GOTESTRACE=                       without the race detector
    #
    # A scoped run skips the web and electron lanes — a Go package pattern
    # says nothing about them. Integration and e2e tests are guarded by the
    # `integration` and `e2e` build tags, so they are excluded here.
    #
    # -timeout 300s per package (the retired Makefile's budget); P8 moves it
    # toward forge's 120s once the overruns are measured and gated. It stops
    # nothing: other agents' environments are not this task's to touch.
    desc: Run Go unit tests (-race -count=1) and the web and electron tests (excludes integration + e2e)
    cmds:
      - '{{.SLOT}} go test {{.GOTESTRACE}} -count=1 -timeout 300s {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}'
      - task: test:web
        if: '[ -z "{{.CLI_ARGS}}" ]'
      - task: test:electron
        if: '[ -z "{{.CLI_ARGS}}" ]'

  test:integration:
    desc: Run integration tests (-tags=integration)
    cmds:
      - '{{.SLOT}} go test {{.GOTESTRACE}} -tags=integration -count=1 -timeout=10m {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}'

  test:e2e:
    # e2e/stories: real Postgres (pgtest's, as every DB-backed test) + an
    # ephemeral Temporal dev server (the test starts it) + a scripted LLM.
    # `--` args replace the default package.
    desc: Run the hermetic story e2e tests (-tags e2e, ./e2e/stories/)
    cmds:
      - go test -tags e2e -count=1 -timeout=10m -v {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./e2e/stories/{{end}}

  test:all:
    desc: Run the unit (Go + web + electron) and integration suites (e2e has its own task)
    cmds:
      - task: test
      - task: test:integration

  coverage:
    desc: Run Go unit tests with coverage and emit coverage.html
    cmds:
      - '{{.SLOT}} go test -race -coverprofile=coverage.out -covermode=atomic ./...'
      - go tool cover -html=coverage.out -o coverage.html

  bench:
    desc: Run Go benchmarks (go test -bench=. across the module)
    cmds:
      - go test -bench=. -benchmem -run=^$ ./...

  replay-fixtures:
    # See internal/workflow/runtime/replaytest/fixtures/README.md: regenerating
    # accepts a replay break for in-flight runs. The generator's database is
    # pgtest's, as every DB-backed test's.
    desc: Regenerate the Temporal replay-compatibility history fixtures, then verify they replay
    cmds:
      - go test -tags replayfixtures -count=1 -timeout=10m -v ./internal/workflow/runtime/replaytest/
      - go test -count=1 -timeout=5m -v -run TestReplayFixtures ./internal/workflow/runtime/replaytest/
      - cmd: echo "Replay fixtures regenerated and verified — commit fixtures/*.json with your change"
        silent: true

  replay-fixtures:freeze:
    # Run BEFORE `task replay-fixtures` when a change alters the workflow
    # command sequence: the current fixtures are the shape in-flight runs were
    # recorded with, and the change must stay replay-compatible with them
    # (gate it with workflow.GetVersion). A frozen set is never rewritten;
    # TestReplayFixtures replays it and TestFrozenFixturesAreUnchanged pins
    # its bytes.
    desc: "Pin the current replay fixtures as a frozen set that must keep replaying (NAME=<yyyy-mm-dd>-<what-changed>)"
    requires:
      vars: [NAME]
    preconditions:
      - sh: '[ ! -e "{{.FROZEN_FIXTURES_DIR}}/{{.NAME}}" ]'
        msg: "frozen set {{.NAME}} already exists; frozen sets are never rewritten"
    cmds:
      - mkdir -p "{{.FROZEN_FIXTURES_DIR}}/{{.NAME}}"
      - cp internal/workflow/runtime/replaytest/fixtures/*.json "{{.FROZEN_FIXTURES_DIR}}/{{.NAME}}/"
      - cd "{{.FROZEN_FIXTURES_DIR}}/{{.NAME}}" && shasum -a 256 *.json > SHA256SUMS
      - cmd: echo "Froze the current fixtures as {{.FROZEN_FIXTURES_DIR}}/{{.NAME}} — add a README.md saying which shape it pins and which version gate keeps it replaying"
        silent: true

  test:web:
    desc: Run the web unit tests (vitest, every file — prefer task test:affected LANES=web)
    dir: frontends/web
    cmds:
      - '{{.SLOT}} npm test -- --run'

  test:web:coverage:
    desc: Run the web unit tests with coverage
    dir: frontends/web
    cmds:
      - '{{.SLOT}} npm test -- --run --coverage'

  test:web:watch:
    desc: Run the web unit tests in watch mode
    dir: frontends/web
    cmds:
      - npm test

  test:electron:
    desc: Run the electron tests (node --test)
    dir: electron
    cmds:
      - npm test --silent

  # ── The gate ──────────────────────────────────────────────────────────

  ci:
    # The whole local gate: forge's checks (verify-generated, golangci-lint,
    # buf-lint, migration-safety, go-build, vuln-go, license-check) plus
    # forge.yaml's ci.gate.extra_checks (test-affected in place of forge's
    # unit-tests, web, electron, docs-generate, the pin and repo checks), in
    # ONE summary table. Every check runs even if an earlier one failed; a
    # check that could not run is SKIPPED, and fails the gate unless named
    # (CI_SKIP=<check> task ci). CI_ONLY=<check>,... runs a subset.
    #
    # Not run under SLOT: the gate schedules host slots itself, one per heavy
    # check.
    desc: "The whole local gate, one summary: forge's checks + reliant's ci.gate.extra_checks (forge.yaml)"
    cmds:
      - '{{.FORGE}} ci gate all'

  ci:checks:
    desc: "Static + build lane of the gate (forge ci gate checks)"
    cmds:
      - '{{.FORGE}} ci gate checks'

  ci:merge:
    # The MERGE tier, the one the merge queue runs on every branch: only what
    # the diff from origin/main can affect, in about five minutes, inside ONE
    # host heavy slot. tools/test-affected decides the Go/web/electron tests
    # and whether forge generate / the docs generators must be checked; then
    # go build, forge lint --scope <changed dirs> and (for a migration)
    # migration-safety run at the same time. Prints a per-phase table: slot
    # wait vs run. `-- --base <rev>` moves the diff base.
    # dev-docs/merge-and-release-gates.md.
    desc: "The merge tier: affected tests + build + scoped lint (+ generate/docs checks when their inputs changed), ~5 min"
    cmds:
      - ./scripts/merge-gate.sh {{.CLI_ARGS}}

  release:gate:
    # The SLOW tier: everything ci:merge leaves out (unscoped lint, the full
    # -race suite with every slow test, integration, e2e, generate and docs
    # drift), on a commit of main (default origin/main) in a private checkout,
    # recorded per sha. release:tag refuses a commit without a green record.
    # 40-70 minutes on a loaded host: run it in the background.
    desc: "The release gate: the whole suite on origin/main (or `-- <rev>`), recorded per sha; release:tag requires it"
    cmds:
      - ./scripts/release-gate.sh run {{.CLI_ARGS}}

  release:gate:check:
    desc: "Is HEAD (or `-- <rev>`) release-ready? exit 0 green | 1 red | 3 no record"
    cmds:
      - ./scripts/release-gate.sh check {{.CLI_ARGS}}

  # ── What CI adds to the two gates ─────────────────────────────────────
  # .github/workflows/ci.yml is a thin wrapper: a pull request runs
  # `task ci:merge`, main and the nightly run `task release:gate`, and the
  # lanes below are the rest, each one task. Every one runs on a laptop too.

  ci:lanes:
    desc: "Which path-selected CI lanes a change reaches (web, playwright, electron, cp_contract): -- --base <rev> | --full"
    cmds:
      - ./scripts/ci-lanes.sh {{.CLI_ARGS}}

  ci:repo-checks:
    # Cheap repo guards no gate runs: no committed binaries in BASE..HEAD (the
    # pre-commit hook is opt-in, and --no-verify skips it), the committed
    # electron/release.config.json values are shippable, the unit tests of the
    # scripts the release and health workflows run, and the pre-commit hook's
    # staged-file formatter.
    desc: "No committed binaries since BASE (default origin/main), shippable release config, .github/scripts and hook tests"
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - .githooks/check-binary-files-ci.sh {{.BASE}} HEAD
      - node .github/scripts/sync-release-config.mjs --check
      - node --test .github/scripts/*.test.mjs
      - ./scripts/test-fmt-staged.sh

  test:flake:
    desc: "Run each Go test this change adds or edits three times (-short -count=3); -- --base <rev>"
    cmds:
      - ./scripts/test-flake.sh {{.CLI_ARGS}}

  build:web:verify:
    # The release's renderer build and artifact gate, exactly as release.yml's
    # prepare job runs them (.github/scripts/verify-bundle.test.mjs pins the
    # two together). `npm run build` is `tsc -b && vite build`, so a type
    # error fails it. NODE_ENV=production is on the build command only: npm
    # reads it too, and on an install it would skip devDependencies.
    desc: Lint, then build the renderer exactly as a release does (production, no config) and verify the bundle
    cmds:
      - cd frontends/web && npm run lint
      - cd frontends/web && NODE_ENV=production npm run build
      - node .github/scripts/verify-bundle.mjs --dist frontends/web/dist

  test:web:e2e:
    # Playwright against the built renderer, no Go backend, one worker (the
    # tests share one preview server). The runtime config document is the
    # public KCL-sourced renderer config committed in
    # electron/release.config.json; `vite preview` serves it as config.js.
    # PLAYWRIGHT_DEPS=--with-deps also installs the browser's system
    # packages (CI does; it needs sudo).
    desc: Run the Playwright suite against the built renderer (chromium)
    cmds:
      - |
        set -euo pipefail
        doc="$(mktemp -d)/config.js"
        printf 'window.__FORGE_CONFIG__ = %s;\n' "$(jq -e '.renderer' electron/release.config.json)" > "$doc"
        cd frontends/web
        npm run build:alpha
        npx playwright install chromium {{.PLAYWRIGHT_DEPS}}
        FORGE_RUNTIME_CONFIG_FILE="$doc" npm run test:e2e -- --project=chromium {{.CLI_ARGS}}

  build:electron:smoke:
    # dist:pr runs with-release-config -> build:config -> build:web:alpha ->
    # electron-builder --dir: the same config path a release takes (the class
    # of defect that shipped v1.7.5). It compiles no Go and signs nothing.
    desc: Package the electron app without publishing (npm run dist:pr)
    dir: electron
    env:
      CI: 'true'
    cmds:
      - npm run dist:pr

  contract:controlplane:check:
    # proto-vendor/controlplane/ is a generated `buf export` of control-plane's
    # public protos, and its SOURCE names the control-plane commit it came
    # from. This judges the tree against that declaration, never against
    # control-plane's moving main: the tree must be exactly SOURCE's export,
    # and SOURCE must be on control-plane main. CONTROL_PLANE_DIR is a
    # control-plane checkout holding that commit (default ../control-plane);
    # control-plane is private, so CI reads it with a deploy key. --require: a
    # missing sibling, commit or buf fails rather than reporting a pass that
    # checked nothing.
    desc: "Fail unless proto-vendor/controlplane/ is exactly what its SOURCE control-plane commit exports, and SOURCE is on control-plane main (CONTROL_PLANE_DIR, buf on PATH)"
    cmds:
      - node .github/scripts/sync-controlplane-proto.mjs --check --require

  contract:controlplane:drift:
    # How far proto-vendor/controlplane/ is behind CONTROL_PLANE_DIR's checked-
    # out tree (control-plane main). The script exits 3 when behind (Task
    # reports that as 201; `task --exit-code` keeps the 3). Never a gate:
    # .github/workflows/cp-contract-drift.yml runs the script directly and
    # turns it into one open issue.
    desc: "Report whether proto-vendor/controlplane/ is behind control-plane main (exit 3 when it is; CONTROL_PLANE_DIR, buf on PATH)"
    cmds:
      - node .github/scripts/sync-controlplane-proto.mjs --upstream --require {{.CLI_ARGS}}

  contract:controlplane:sync:
    # Pull control-plane main's public contract into proto-vendor/controlplane/
    # (a `buf export` over its proto/public-api.txt, plus SOURCE naming the
    # commit), then regenerate the clients from it. CONTROL_PLANE_DIR must be a
    # clean checkout of a commit on control-plane main.
    desc: "Re-vendor control-plane's public protos into proto-vendor/controlplane/ and regenerate the clients (CONTROL_PLANE_DIR, buf on PATH)"
    cmds:
      - node .github/scripts/sync-controlplane-proto.mjs
      - task: generate:controlplane

  licenses:
    desc: "Every Go and npm dependency is on the license allowlist (.license-allowlist, .license-allowlist-npm)"
    cmds:
      - task: licenses:go
      - task: licenses:npm

  licenses:go:
    desc: Every Go dependency's license is allowlisted (scripts/check-licenses.sh)
    cmds:
      - go mod download
      - ./scripts/check-licenses.sh {{.CLI_ARGS}}

  licenses:npm:
    desc: Every npm dependency of frontends/web is allowlisted (scripts/check-npm-licenses.sh)
    cmds:
      - ./scripts/check-npm-licenses.sh {{.CLI_ARGS}} frontends/web

  # ── Lint and format ───────────────────────────────────────────────────

  lint:
    desc: Run the pinned forge lint (golangci-lint, buf lint, the contract/convention/migration-safety lanes)
    cmds:
      - '{{.FORGE}} lint'

  lint:web:
    desc: Lint the web app
    dir: frontends/web
    cmds:
      - npm run lint

  lint:electron:
    desc: Lint the electron app
    dir: electron
    cmds:
      - npx eslint src/

  proto:lint:
    desc: buf lint the protos, at go.mod's buf pin (forge lint's buf-lint lane runs the same)
    cmds:
      - '{{.BUF}} lint'

  fmt:
    # The whole repo. The pre-commit hook formats only the staged files
    # (.githooks/fmt-staged.sh, tested in `task ci:repo-checks`).
    desc: Format Go code (go fmt)
    cmds:
      - go fmt ./...

  fmt:web:
    desc: Format the web app (eslint --fix)
    dir: frontends/web
    cmds:
      - npm run lint -- --fix

  fmt:electron:
    desc: Format the electron app (eslint --fix)
    dir: electron
    cmds:
      - npx eslint src/ --fix

  proto:fmt:
    desc: buf format -w the protos, at go.mod's buf pin
    cmds:
      - '{{.BUF}} format -w'

  # ── Code generation ───────────────────────────────────────────────────

  generate:
    desc: "Regenerate everything: the pinned forge generate (protos, ORM, mocks, forge.yaml generate.hooks), then every docs generator"
    cmds:
      - task: generate:forge
      - task: generate:docs

  generate:forge:
    # forge generate runs buf (go.mod's pin) over buf.gen.yaml, projects the
    # ORM, mocks, descriptor and composition graph, then forge.yaml's
    # generate.hooks: the compiled-code generators forge does not own (the
    # control-plane client, the YAML bindings, the tool catalog, the
    # integration manifest schema, the integration event projections).
    desc: Run the pinned forge generate (protos, ORM, mocks and the forge.yaml generate hooks)
    deps: [deps:protoc-gen-es, deps:go-protoc-plugins]
    cmds:
      - '{{.GEN_ENV}} {{.FORGE}} generate'

  generate:check:
    # It judges only what generate changes, so it runs on a tree with
    # uncommitted edits too. `task test:affected` runs it when the diff
    # touches a forge input. `-- --github` adds CI annotations. FORGE=<binary>
    # in the environment uses a prebuilt forge, refused unless it is the pin.
    desc: Run the pinned forge generate and fail, naming each file, if it changes anything
    deps: [deps:protoc-gen-es, deps:go-protoc-plugins]
    cmds:
      - '{{.GEN_ENV}} ./scripts/check-forge-generate.sh {{.CLI_ARGS}}'

  generate:controlplane:
    # The `controlplane-client` generate hook, alone: the control-plane clients
    # (Go + TS) from proto-vendor/controlplane/, a generated export of
    # control-plane's public contract. To pull a new contract first:
    # task contract:controlplane:sync (which also runs this). Both output dirs are
    # replaced wholesale, but only after buf succeeds.
    desc: Regenerate the control-plane clients (gen/controlplane, frontends/web/src/gen/controlplane) from proto-vendor/
    deps: [deps:protoc-gen-es, deps:go-protoc-plugins]
    cmds:
      - '{{.GEN_ENV}} scripts/proto-generate-atomic.sh buf.gen.controlplane.yaml gen/controlplane frontends/web/src/gen/controlplane'

  generate:docs:
    # Every docs generator — each tools/docgen program and the Mintlify
    # conversion — in dependency order (the assembler and the Mintlify
    # conversion read what the reference generators write). It is the ONE
    # list: `task generate` runs it, `task generate:docs:check` checks it, and
    # so do CI and `task test:affected`'s docs-generate lane.
    # tools/test-affected's TestDocGenTargetsCoverEveryDocsGenerator fails
    # when a docs generator is missing from it, or when a path one reads or
    # writes is not a docs-generate input. Not forge generate hooks on
    # purpose: they are docs, not compiled code, too slow for every
    # `forge generate`, and they need python3.
    desc: Regenerate the reference docs, the workflow-builder skill and the keyboard-shortcut tables
    cmds:
      - task: generate:docs:schema
      - task: generate:docs:scenario-schema
      - task: generate:docs:refcheck
      - task: generate:docs:cel-reference
      - task: generate:docs:cli
      - task: generate:docs:tools-ref
      - task: generate:docs:shortcuts
      - task: generate:docs:nodes
      - task: generate:docs:types
      - task: generate:docs:models
      - task: generate:docs:presets
      - task: generate:docs:workflow-builder-skill
      - task: generate:docs:changelog
      - task: generate:docs:mintlify-reference

  generate:docs:check:
    # It judges only what the generators change, so it runs on a tree with
    # uncommitted edits too, and it leaves what it regenerated in the tree:
    # commit that, or, if it reverted a hand edit, move the edit into the
    # generator. `-- --github` adds CI annotations.
    desc: Run every docs generator (task generate:docs) and fail, naming each file, if it changes anything
    cmds:
      - ./scripts/check-docs-generate.sh {{.CLI_ARGS}}

  generate:docs:schema:
    desc: Generate the workflow schema reference from proto types
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/schema/... {{.REFERENCE_DIR}}/workflow-schema.md'

  generate:docs:scenario-schema:
    desc: Generate the scenario schema reference from internal/workflow/scenario types
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/scenarios/... internal/workflow/scenario {{.REFERENCE_DIR}}/scenario-schema.md'

  generate:docs:refcheck:
    desc: Validate the reference data from proto descriptors (a check; writes nothing)
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/refcheck/...'

  generate:docs:cel-reference:
    desc: Generate the CEL reference for the discovery tools
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/celref/...'

  generate:docs:cli:
    desc: Generate the CLI reference from the Cobra command tree
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/cli/... {{.REFERENCE_DIR}}/cli.md'

  generate:docs:tools-ref:
    desc: Generate the tool reference from the tool registry
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/tools/... {{.REFERENCE_DIR}}/tools.md'

  generate:docs:shortcuts:
    desc: Generate the keyboard shortcuts from config/shortcuts.yaml
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/shortcuts/... config/shortcuts.yaml frontends/web/src/store/shortcutsData.generated.ts {{.SETTINGS_DIR}}/keyboard-shortcuts.generated.md'

  generate:docs:nodes:
    desc: Generate the node type I/O reference from the node type registry
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/nodes/... {{.REFERENCE_DIR}}/nodes.md'

  generate:docs:types:
    desc: Generate the types reference
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/types/... {{.REFERENCE_DIR}}/types.md'

  generate:docs:models:
    desc: Generate the models reference from the registry
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/models/... {{.REFERENCE_DIR}}/models.md'

  generate:docs:presets:
    desc: Generate the presets reference from the preset YAML files
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/presets/... {{.WORKFLOWS_DIR}}/presets-reference.generated.md'

  generate:docs:workflow-builder-skill:
    desc: Generate the workflow-builder SKILL.md
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/assembler/... {{.REFERENCE_DIR}} internal/skills/catalog/builtin/workflow-builder/SKILL.md'

  generate:docs:changelog:
    desc: Generate the Mintlify changelog page from the release YAML files
    cmds:
      - '{{.GEN_GO}} run ./tools/docgen/changelog/... {{.MINTLIFY_DOCS_DIR}}/data/releases {{.MINTLIFY_DOCS_DIR}}/changelog.mdx'

  generate:docs:changelog:draft:
    # What the release workflow runs before ./scripts/release.sh (control-plane
    # scripts/release-chain/reliant-bump.sh). Deterministic; refuses to replace an
    # existing file (FORCE=1 does).
    desc: Write docs/data/releases/VERSION.yaml from the PR titles merged since SINCE_TAG, grouped by conventional-commit type
    requires:
      vars: [VERSION, SINCE_TAG]
    cmds:
      - '{{.GEN_GO}} run ./tools/releasenotes --version {{.VERSION}} --since {{.SINCE_TAG}} --to {{.TO | default "HEAD"}} --out {{.MINTLIFY_DOCS_DIR}}/data/releases/{{.VERSION}}.yaml{{if .FORCE}} --force{{end}}'

  generate:docs:mintlify-reference:
    desc: Convert the generated reference markdown into Mintlify .mdx pages
    cmds:
      - python3 scripts/generate-mintlify-reference.py

  # ── Database ──────────────────────────────────────────────────────────

  db:migration:
    # Migrations are forge migrations (db/migrations/<YYYYMMDDHHMMSS>_<name>.up.sql,
    # forward only), created by the pinned forge so the version allocator is
    # the one the migrator was built with; never hand-type the version.
    # forge.yaml sets
    # database.migration_safety.require_compat_declaration, so forge opens the
    # file with both compatibility declarations as a comment to replace, and
    # `forge lint --migration-safety` fails it until it says one, with a
    # reason.
    desc: "Create a new forge migration (NAME=my_changes), then: write the SQL and its compat declaration, task generate:check, queries in internal/store (internal/db/SCHEMA.md)"
    #
    # The version must clear origin/main's NEWEST migration, not the wall
    # clock: a long-lived branch, a skewed clock or a future-dated main head
    # otherwise mints a version under one that already merged, which is never
    # applied and crash-loops the migrator (reliant#1399). So origin/main is
    # refreshed first (forge allocates above its tip), and the result is checked
    # against it after, whatever forge pin is installed.
    requires:
      vars: [NAME]
    cmds:
      - git fetch -q origin main || echo "WARNING - could not refresh origin/main; the version is checked against the ref as it is" >&2
      - '{{.GEN_ENV}} {{.FORGE}} db migration new {{.NAME}}'
      - MIGRATION_ORDER_OFFLINE=1 go run ./tools/test-affected migration-order

  migrate:
    desc: Apply pending database migrations (wraps `reliant db migrate up`)
    cmds:
      - go run ./cmd/reliant db migrate up

  # ── Pins, releases, docs site ─────────────────────────────────────────

  pin:forge:
    # Pre-launch we pin by COMMIT, not tag (dev-docs/pinning.md).
    # `task pin:forge -- <sha|branch|tag>` pins something else.
    desc: Pin forge to forge's current origin/main commit (or `-- <ref>`)
    cmds:
      - ./scripts/pin-forge.sh {{.CLI_ARGS}}

  pin:drift:
    desc: "Report how many commits behind forge's main the pin has fallen (-- --github for CI annotations)"
    cmds:
      - ./scripts/pin-drift.sh {{.CLI_ARGS}}

  pin:ancestry:
    # The self-test first: a detector that can pass vacuously is worse than
    # none, so prove it still FAILS on an off-main pin before trusting it.
    desc: "Fail if the forge pin is not a commit on forge's main (-- --github for CI annotations)"
    cmds:
      - ./scripts/test-pin-ancestry.sh
      - ./scripts/check-pin-ancestry.sh {{.CLI_ARGS}}

  # A release is TWO steps. `release:<bump>` opens the version-bump PR;
  # `release:tag` tags the commit once that PR has MERGED. They are separate
  # because main squash-merges: tagging before the merge strands the tag off
  # the trunk (v1.7.8..v1.7.12). See the header of scripts/release.sh.
  release:rc:
    desc: Open the version-bump PR for a release candidate (0.0.1-rc38 → 0.0.1-rc39)
    cmds:
      - ./scripts/release.sh prerelease

  release:patch:
    desc: Open the version-bump PR for a patch release (0.0.1-rc38 → 0.0.1, 0.0.1 → 0.0.2)
    cmds:
      - ./scripts/release.sh patch

  release:minor:
    desc: Open the version-bump PR for a minor release (0.0.1 → 0.1.0)
    cmds:
      - ./scripts/release.sh minor

  release:major:
    desc: Open the version-bump PR for a major release (0.1.0 → 1.0.0)
    cmds:
      - ./scripts/release.sh major

  release:tag:
    desc: STEP 2 — tag the merged release commit on main (run after the PR merges)
    cmds:
      - ./scripts/release-tag.sh

  release:tag:dry-run:
    desc: Preview which commit release:tag would tag, creating nothing
    cmds:
      - ./scripts/release-tag.sh --dry-run

  release:lock:test:
    desc: Self-test of scripts/release-lock.sh (one release of the repo at a time, heartbeat, stale replacement, re-check of main) against a bare remote
    cmds:
      - ./scripts/test-release-lock.sh

  release:check-tags:
    desc: Verify every release tag is an ancestor of main
    cmds:
      - ./scripts/check-release-tags.sh

  docs:serve:
    desc: Serve the Mintlify docs (docs/) locally on MINTLIFY_PORT (default 3000)
    vars:
      MINTLIFY_PORT: '{{.MINTLIFY_PORT | default "3000"}}'
    cmds:
      - |
        export NVM_DIR="$HOME/.nvm" && unset npm_config_prefix && . "$NVM_DIR/nvm.sh" && nvm use 22 --silent
        cd {{.MINTLIFY_DOCS_DIR}}
        echo "Site available at: http://localhost:{{.MINTLIFY_PORT}}/"
        if command -v mint >/dev/null 2>&1; then
          exec mint dev --port {{.MINTLIFY_PORT}}
        elif command -v mintlify >/dev/null 2>&1; then
          exec mintlify dev --port {{.MINTLIFY_PORT}}
        fi
        echo "Neither the 'mint' nor the 'mintlify' CLI is installed: nvm use 22 && npm i -g mint" >&2
        exit 1
