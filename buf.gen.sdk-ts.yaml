# buf.gen.sdk-ts.yaml - the TypeScript SDK's generated protobuf code
# (sdk/ts/src/gen), run by the `sdk-ts-client` generate hook in forge.yaml.
#
# Only the services the SDK's client layer calls are generated, with just the
# messages they reach (`types`): the published package must stay small, and
# every added service is a public-surface decision. Same local, version-pinned
# protoc-gen-es as buf.gen.yaml (see its header); internal/buildmode/
# buf_plugin_pins_test.go holds the pin.
version: v2
managed:
  enabled: false
inputs:
  - directory: proto
    exclude_paths:
      - proto/forge/v1
      - proto/buf/validate
plugins:
  - local: [node, tools/protoc-gen-es/node_modules/protoc-gen-es-v2.15.0/bin/protoc-gen-es]
    strategy: all
    out: sdk/ts/src/gen
    include_imports: true
    types:
      - reliant.v1.StreamingService
      - reliant.v1.BackgroundService.StreamProcessOutput
      - reliant.v1.ChatService.SendMessage
      # What /react drives besides the stream: transcript paging and the run
      # controls, the gates (approvals and questions), the inbox and run reads.
      - reliant.v1.ChatService.ListMessages
      # The bodies a TOOL_BODY_MODE_STUB transcript read left out.
      - reliant.v1.ChatService.GetContentBlockBodies
      - reliant.v1.ChatService.PauseChat
      - reliant.v1.ChatService.ResumeChat
      - reliant.v1.ChatService.InterruptThread
      - reliant.v1.ApprovalService
      - reliant.v1.QuestionService
      - reliant.v1.InboxService.ListInbox
      - reliant.v1.InboxService.DismissInboxItem
      - reliant.v1.InboxService.RestoreInboxItem
      - reliant.v1.RunService.GetRun
      - reliant.v1.RunService.CancelRun
      # Enums the typed events name directly (events.ts).
      - reliant.v1.NodeExecutionEventType
      - reliant.v1.WorkflowExecutionEventType
      - reliant.v1.ExecutionLogLevel
    opt:
      - target=ts
      - ts_nocheck=true
      # Node ESM resolves no extensionless specifier, and this is the published artifact.
      - import_extension=js
