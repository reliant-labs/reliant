name: ralph-wiggum
apiVersion: "0.0.5"
description: |
  Ralph Wiggum — brute-force iteration for complex tasks.

  The insight: for sufficiently complex tasks, an LLM often needs multiple passes
  to get it right. Rather than accumulating context (which degrades with noise),
  each attempt starts completely fresh. There is NO bridge between iterations —
  the implement agent sees only the original request each time.

  Loop: implement → review → done?
    1. implement — Build the requested changes. Sees ONLY the original request.
       No review feedback, no prior iteration context. Pure brute force.
    2. review — Evaluate the implementation. Either approve (done) or reject.
       Review feedback is NOT forwarded to the next attempt.

  Context management:
    NOTHING is saved to the parent thread. The parent thread stays clean.
    The implement agent gets a fresh thread each iteration (memo: false).
    Implementation narratives and review feedback are discarded between iterations.
    Diversity comes from LLM sampling randomness (temperature).

  Thread architecture:
    attempt loop inherits main thread.
    implement forks from parent — sees only original request (memo: false = fresh thread).
    review forks from parent — clean evaluation each time (memo: false = fresh thread).

entry: [attempt]

inputs:
  model:
    type: model
    description: LLM model to use for all phases
    default:
      tags: [flagship]

  max_iterations:
    type: integer
    default: 3
    min: 1
    max: 10
    description: Maximum implement→review iterations

  mode:
    type: enum
    ui: toolbar
    default: auto
    description: Execution mode for agent steps.
    enum: [manual, auto, plan]

  ask:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review after each iteration.

  temperature:
    type: number
    default: 1.0
    min: 0
    max: 1
    description: Response randomness

  thinking_level:
    type: enum
    enum: [low, medium, high, xhigh]
    default: medium
    description: Extended thinking level

nodes:
  - id: attempt
    type: loop
    while: >
      (has(outputs.review_strategy) && outputs.review_strategy != "pass")
      && iter.iteration < inputs.max_iterations
    ask: "inputs.ask"
    inline:
      entry: [implement]

      outputs:
        review_strategy: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.strategy : 'pass'}}"
        review_feedback: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.feedback : ''}}"

      nodes:
        - id: implement
          type: workflow
          ref: builtin://agent
          presets:
            default: general
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
          thread:
            mode: fork
            memo: false
            inject:
              role: user
              content: |
                ## Ralph Wiggum — Attempt {{iter.iteration + 1}} of {{inputs.max_iterations}}

                Implement the requested changes. Start by investigating the relevant code, then make your changes.
                You have no context from prior attempts — implement from scratch.

                After finishing, summarize:
                1. What you changed and why
                2. What tests you ran and their results
                3. What you're uncertain about

        - id: review
          type: workflow
          ref: builtin://structured-agent
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
            response_tool_name: submit_review
            response_tool_description: "Submit your review of the implementation attempt"
            response_schema:
              type: object
              required:
                - strategy
                - feedback
              properties:
                strategy:
                  type: string
                  enum: ["pass", "retry"]
                  description: |
                    "pass" — implementation is correct and complete. Break the loop.
                    "retry" — implementation needs work. A fresh attempt will be made.
                feedback:
                  type: string
                  description: |
                    Your assessment of the implementation. Note what was wrong or incomplete.
                    This feedback is logged but NOT forwarded to the next attempt —
                    the next agent starts completely blind.
          thread:
            mode: fork
            memo: false
            inject:
              role: user
              content: |
                ## Ralph Wiggum — Review Attempt {{iter.iteration + 1}}

                Review the implementation attempt above. Your job is to determine:
                1. Is the implementation correct and complete? If yes, strategy: "pass".
                2. If not, what specific feedback would help a fresh attempt succeed?

                **Important:** The next agent starts completely from scratch — it won't see
                your feedback or the code from this attempt. Your review is purely a gate:
                pass if the task is done correctly, retry if not. Don't over-optimize.
      edges:
        - from: implement
          default: [review]

outputs:
  review_strategy: "{{nodes.attempt.review_strategy}}"
  review_feedback: "{{nodes.attempt.review_feedback}}"
  iterations: "{{nodes.attempt._iterations}}"

edges: []
