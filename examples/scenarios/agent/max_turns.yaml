# Max Turns: Loop yields when iteration limit is reached
#
# Tests the max_turns safeguard with yield-based behavior:
# 1. LLM keeps calling tools on each iteration
# 2. At max_turns, the loop yields (pauses for user input) rather than stopping
# 3. The while condition only checks tool_calls, not max_turns
# 4. A final iteration runs where LLM returns no tool calls, exiting the loop
# 5. max_turns_notification is shown
#
# With max_turns=3:
# - Iterations 0, 1, 2 run with tool calls
# - Yield fires at iteration 3 (3 >= 3)
# - Iteration 3 runs, LLM returns no tool calls, loop exits
# - _iterations = 4, max_turns_notification fires (4 >= 3)

name: max_turns
description: Loop yields when max_turns limit is reached

inputs:
  max_turns: 3  # Low limit for testing

events:
  # Iteration 0: LLM calls tools
  - node: agent_loop.call_llm
    type: llm_response
    text: "Working on it..."
    tool_calls:
      - name: bash
        input:
          command: "step 1"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 1 done"

  # Iteration 1: LLM calls tools again
  - node: agent_loop.call_llm
    type: llm_response
    text: "Still working..."
    tool_calls:
      - name: bash
        input:
          command: "step 2"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 2 done"

  # Iteration 2: LLM calls tools again
  - node: agent_loop.call_llm
    type: llm_response
    text: "Almost there..."
    tool_calls:
      - name: bash
        input:
          command: "step 3"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 3 done"

  # Iteration 3: yield fires (iter >= max_turns), LLM returns no tool calls, loop exits
  - node: agent_loop.call_llm
    type: llm_response
    text: "All three steps are complete."

expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
    - max_turns_notification  # Should show max turns warning
  not_reached:
    - agent_loop.approval