# Max Turns: While condition enforces max_turns limit
#
# Tests the max_turns safeguard:
# 1. LLM keeps calling tools on each iteration
# 2. The while condition includes: iter.iteration < inputs.max_turns
# 3. Once iteration reaches max_turns, while becomes false and loop exits
# 4. max_turns_notification is shown
#
# With max_turns=3:
# - Iterations 0, 1, 2 run with tool calls
# - After iteration 2: iter.iteration becomes 3, 3 < 3 = false → loop exits
# - _iterations = 3, max_turns_notification fires (3 >= 3)

name: max_turns
description: Loop stops when max_turns limit is reached

inputs:
  max_turns: 3  # Low limit for testing

events:
  # Iteration 0: LLM calls tools
  - node: agent_loop.call_llm
    type: llm_response
    text: "Working on it..."
    tool_calls:
      - name: bash
        input:
          command: "step 1"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 1 done"

  # Iteration 1: LLM calls tools again
  - node: agent_loop.call_llm
    type: llm_response
    text: "Still working..."
    tool_calls:
      - name: bash
        input:
          command: "step 2"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 2 done"

  # Iteration 2: LLM calls tools again
  - node: agent_loop.call_llm
    type: llm_response
    text: "Almost there..."
    tool_calls:
      - name: bash
        input:
          command: "step 3"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "step 3 done"

  # Loop exits here: iter.iteration=3, 3 < 3 = false

expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
    - max_turns_notification  # Should show max turns warning
  not_reached:
    - agent_loop.approval
