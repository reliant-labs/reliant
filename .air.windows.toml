root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["server", "api"]
  bin = "dist/reliant.exe"
  # Windows version: Build to temp file then rename using move command
  # Using cmd /c to properly chain commands on Windows
  cmd = "go build -buildvcs=false -o dist/reliant.exe ./cmd/reliant/"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "mobile", "dist", ".claude_plan", "test", "electron", "node_modules", "e2e", "internal/gen", "web/src/gen", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "proto", "yaml"]
  include_file = []
  kill_delay = "5s"
  log = "./data/build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  # Skip proto generation in Air on Windows - it's done by dev.ps1
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true