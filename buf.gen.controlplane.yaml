# buf.gen.controlplane.yaml — every control-plane client in this repo, Go AND
# TypeScript, generated from ONE input: proto-vendor/controlplane/.
#
# That directory is NOT authored here. It is a verbatim `buf export` of the
# control-plane repo's public proto contract (the `export` lines of
# control-plane/proto/public-api.txt), written by
# .github/scripts/sync-controlplane-proto.mjs, pinned to the control-plane commit
# its SOURCE names (task contract:controlplane:check). No *Admin or
# internal-service API is in it.
#
# Output mirrors the proto paths under a `controlplane/` root, e.g.
#   services/deploy/v1/deploy.proto -> frontends/web/src/gen/controlplane/services/deploy/v1/deploy_pb.ts
#   services/billing/v1/billing.proto -> gen/controlplane/services/billing/v1/*.go
#
# Regenerate with:  task generate:controlplane  (forge.yaml's `controlplane-client`
# generate hook, so `task generate:forge` runs it too)
# (after `node .github/scripts/sync-controlplane-proto.mjs` when the contract changed)
version: v2
managed:
  enabled: true
  override:
    # control-plane's go_package options point into control-plane's own module,
    # which this repo must never import (control-plane depends on reliant, not
    # the reverse). Rewrite them into this repo's gen/ tree.
    - file_option: go_package_prefix
      value: github.com/reliant-labs/reliant/gen/controlplane
  disable:
    # forge.proto keeps its own go_package (forge/pkg/forgepb), so imports of it
    # resolve to forge's package rather than a rewritten path under gen/.
    - file_option: go_package
      path: forge/v1/forge.proto
    # buf/validate/validate.proto is protovalidate's option-definition file,
    # imported by control-plane protos for `(buf.validate.field)` rules. Its own
    # go_package is the BSR module this repo already links, so generated Go must
    # import THAT rather than a rewritten copy under gen/controlplane/.
    - file_option: go_package
      path: buf/validate/validate.proto
inputs:
  - directory: proto-vendor/controlplane
plugins:
  # Go: forge/v1/forge.proto is excluded because it already has a Go home,
  # github.com/reliant-labs/forge/pkg/forgepb, which the generated code imports.
  # A second copy would register forge/v1/forge.proto twice and panic at init.
  # buf.validate is excluded for the same reason: protovalidate's descriptor is
  # already registered by the BSR package this module links.
  #
  # Every plugin is local and pinned, exactly as in buf.gen.yaml (see its
  # header). protoc-gen-es runs at v2.12.0 here and v2.15.0 there: they write
  # different directories, and the two outputs were generated at those
  # versions. Moving this one to v2.15.0 is a regeneration, not a config edit.
  #
  # `strategy: all` runs each plugin once over all ~26 files instead of once
  # per directory (23 here): buf's per-directory default ran ~65 plugin
  # processes concurrently, which crossed the daemon's per-command thread
  # limit (cgroup pids.max). buf.gen.yaml's plugins header has the detail.
  - local: [go, tool, protoc-gen-go]
    strategy: all
    out: gen/controlplane
    exclude_types: [forge.v1, buf.validate]
    opt:
      - paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    strategy: all
    out: gen/controlplane
    exclude_types: [forge.v1, buf.validate]
    opt:
      - paths=source_relative
  - local: [node, tools/protoc-gen-es/node_modules/protoc-gen-es-v2.12.0/bin/protoc-gen-es]
    strategy: all
    out: frontends/web/src/gen/controlplane
    # forge/v1/forge.proto is imported for method annotations only; it has to be
    # emitted too or the generated descriptors reference a file that is absent.
    include_imports: true
    # Secret values are a daemon/CLI capability, never a browser capability.
    # Keep the Go client above, but do not export its service descriptor to
    # the frontend (including generated per-service mock defaults).
    exclude_types: [controlplane.v1.LocalSecretService]
    opt:
      - target=ts
      - ts_nocheck=true
