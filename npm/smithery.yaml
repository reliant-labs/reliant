# Smithery listing for `forge mcp` (https://smithery.ai). The listing's text is
# npm/README.md: forge for ANY repo — standalone lint lanes, agent playbooks,
# runtime libraries, no-account deploys, and the `benefits` tool that says what
# applies to the repo the agent is in. A local stdio server: Smithery's clients
# start it with npx, which downloads the forge binary that matches the package
# version on first run. Nothing to configure: every tool takes an optional
# `dir`, works with or without a forge.yaml, and deploy_claimable needs no
# account.
# Set the Smithery project's base directory to `npm/`.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    () => ({ command: 'npx', args: ['-y', '@reliantlabs/forge', 'mcp'] })
  exampleConfig: {}
