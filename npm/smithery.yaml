# Smithery listing for `forge mcp` (https://smithery.ai). The listing's text is
# npm/README.md, which opens with the one definition every listing shares (npm
# description, npm/server.json, gemini-extension.json; held equal by
# TestListingsShareOneDefinition): "Guardrails for apps in any agent harness.
# Deploy with no account: a live URL plus a claim link." A local stdio server: Smithery's clients
# start it with npx, which downloads the forge binary that matches the package
# version on first run. Nothing to configure: every tool takes an optional
# `dir`, works with or without a forge.yaml, and deploy_claimable needs no
# account.
# Set the Smithery project's base directory to `npm/`.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    () => ({ command: 'npx', args: ['-y', '@reliantlabs/forge', 'mcp'] })
  exampleConfig: {}
