version: "2"
sql:
  # PostgreSQL configuration
  - engine: "postgresql"
    queries: "internal/db/postgres/queries"
    schema: "internal/db/postgres/schema.sql"
    gen:
      go:
        package: "pgdb"
        out: "internal/db/postgres/generated"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        sql_package: "database/sql"
        overrides:
          - column: "*.created_at"
            go_type:
              type: "time.Time"
          - column: "*.updated_at"
            go_type:
              type: "time.Time"
          - column: "*.finished_at"
            go_type:
              type: "sql.NullTime"
          - column: "*.deleted_at"
            go_type:
              type: "sql.NullTime"
          - column: "*.last_active"
            go_type:
              type: "time.Time"
          - column: "*.edited_at"
            go_type:
              type: "sql.NullTime"
          - column: "*.completed_at"
            go_type:
              type: "sql.NullTime"
          - column: "*.requested_at"
            go_type:
              type: "time.Time"
          - column: "*.responded_at"
            go_type:
              type: "sql.NullTime"
          - db_type: "REAL"
            go_type: "float64"
          - db_type: "REAL"
            nullable: true
            go_type:
              type: "sql.NullFloat64"
          # tool_calls.input is the schema's only jsonb column. sqlc's default
          # for a nullable jsonb is pqtype.NullRawMessage, which would pull in
          # github.com/sqlc-dev/pqtype as a new dependency for this one column;
          # []byte carries the same value (nil == SQL NULL) without it.
          - column: "tool_calls.input"
            go_type:
              type: "byte"
              slice: true