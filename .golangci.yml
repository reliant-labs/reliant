version: "2"

run:
  timeout: 10m
  tests: true

formatters:
  enable:
    - goimports

linters:
  # Use standard defaults (govet, staticcheck, errcheck, ineffassign, unused)
  default: standard
  
  # Enable additional industry-standard linters
  enable:
    - gosec        # Security-focused linter
    - revive       # Extensible linter, golint replacement
    - forbidigo    # Typed-config guardrail (forge.yaml config.enforce_typed_access: error)
  
  # Exclusions for paths
  exclusions:
    # Exclude standalone utility directories
    paths:
      - scripts
      - tools/dev
      - cmd/test-analytics
      - cmd/test-vertexai
      # Gitignored scratch space for throwaway reproduction programs. Not part
      # of the build or the repo, so it should not gate the lint.
      - tmp
      # npm packages that ship Go sources (frontends/web/node_modules/flatted/golang)
      # once `task deps` installs frontends/web/ and electron/: not this module's code,
      # and `task ci` needs them installed for its web and electron rows.
      - node_modules
    
    # Rules-based exclusions
    rules:
      # Test files can use deprecated APIs
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA1019"
      
      # DEFERRED MIGRATION, not an endorsement: golang.org/x/net/http2 is
      # deprecated in favour of net/http's own HTTP/2 support. Moving the
      # gRPC server, the daemon gateway's h2c transport and the tool-exec
      # client over changes how h2c prior-knowledge and the ping/idle timers
      # are configured, and needs the network tests, so it is its own change.
      - linters:
          - staticcheck
        text: "SA1019: .*golang.org/x/net/http2"

      # Same: worker.Options.BuildID -> WorkerDeploymentOptions.Version moves
      # Temporal worker versioning to the Worker Deployments API, which has
      # server-side rollout semantics and must not ride along with a lint fix.
      - linters:
          - staticcheck
        text: "SA1019: .*worker.Options.*BuildID"

      # These tool results are read by the model, not by Go callers: they are
      # deliberately multi-sentence, capitalised and end in the instruction the
      # model should follow, which ST1005 (written for errors that get wrapped)
      # would strip.
      - path: internal/llm/tools/
        linters:
          - staticcheck
        text: "ST1005"

      # Allow unchecked errors in test files
      - path: _test\.go
        linters:
          - errcheck
      
      # Allow gosec issues in test files
      - path: _test\.go
        linters:
          - gosec
      # The generated config loader is the one package allowed to read the
      # environment; the typed-config guardrail does not flag it.
      - path: ^pkg/config/
        linters:
          - forbidigo
      # Tests and the developer binaries under tools/ are not reliant
      # processes. A test reads harness knobs (RELIANT_TEST_*, DATABASE_URL)
      # and hands its environment to the subprocesses it runs; tools/* are
      # separate dev CLIs. The guardrail is about how a reliant PROCESS reads
      # its configuration, so neither is in its scope.
      - path: _test\.go
        linters:
          - forbidigo
      - path: ^tools/
        linters:
          - forbidigo

  settings:
    forbidigo:
      # Typed-config guardrail (forge.yaml: config.enforce_typed_access: error).
      # GATING: forbidigo is in `linters.enable` above, so a direct
      # environment read fails `golangci-lint run` and `forge lint`. Every
      # process setting is declared in proto/reliant/config/v1 and read through
      # pkg/config (exempt above, as the generated loader). A read that is not
      # configuration — an ambient OS variable, an environment passed through
      # to a child, a forge-owned FORGE_* knob — takes a scoped
      # //nolint:forbidigo naming why.
      forbid:
        - pattern: 'os\.Getenv'
          msg: &typed-config >-
            Read configuration from the typed config (pkg/config) instead:
            declare the setting in proto/reliant/config/v1/*.proto with a
            (forge.v1.config) annotation and run `forge generate`. A read
            that is not configuration (an ambient OS variable such as HOME)
            takes //nolint:forbidigo with the reason.
        - pattern: 'os\.LookupEnv'
          msg: *typed-config
        - pattern: 'os\.Environ'
          msg: *typed-config
    errcheck:
      # Exclude common deferred close patterns and best-effort operations
      # Note: Internal package methods use //nolint comments instead (exclude-functions doesn't match them reliably)
      exclude-functions:
        # Close operations - safe to ignore in defer
        - (*os.File).Close
        - (io.Closer).Close
        - (*bufio.Writer).Flush
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (net.Conn).Close
        - (*net/http.Response.Body).Close
        - (net.Listener).Close
        - (*os.File).Sync
        # Gorilla websocket - common defer patterns
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/gorilla/websocket.Conn).WriteJSON
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        # HTTP writes - client disconnect is unrecoverable in handlers
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        # Print to stdout/stderr - if these fail, program is in bad state
        - fmt.Printf
        - fmt.Println
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # OS operations - often best-effort cleanup
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - (*os.Process).Kill
    
    revive:
      rules:
        # Disable overly pedantic rules
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    
    gosec:
      # ==========================================================================
      # GOSEC EXCLUSIONS RATIONALE
      # ==========================================================================
      # Reliant is a CLI tool that executes commands and manipulates files by design.
      # Many gosec rules flag patterns that are intentional and necessary for this
      # type of application. Rather than littering the codebase with //nolint comments,
      # we exclude rules that fundamentally conflict with the tool's purpose.
      #
      # If you're adding new code that triggers these rules, ensure you've validated:
      # - User input is properly sanitized before use in commands/paths
      # - Sensitive data doesn't use weak random sources
      # - File permissions are appropriate for the use case
      # ==========================================================================
      excludes:
        # G104: Errors unhandled - Already covered by errcheck linter
        - G104
        # G115: Integer overflow int->int32 - False positives on list lengths/counts
        # that will never exceed int32 max value in practice
        - G115
        # G204: Subprocess with variable - Core feature of the tool. We execute:
        # bash commands, git operations, ripgrep searches, etc. All by design.
        - G204
        # G301: Directory permissions 0750 - We use 0755 for directories which is
        # standard for CLI tools and necessary for proper operation
        - G301
        # G302: File permissions 0600 - We use 0644 for non-sensitive config files,
        # certificates, and generated content. Appropriate for shared access.
        - G302
        # G304: File path from variable - Core feature. We read/write files specified
        # by users or discovered at runtime (configs, patches, certs, etc.)
        - G304
        # G306: WriteFile permissions 0600 - Same as G302, we use 0644 for files
        # that need to be readable by other processes or users
        - G306
        # G404: Weak random (math/rand vs crypto/rand) - Used only for non-security
        # purposes: retry jitter, port selection, temp file names. Not for crypto.
        - G404
        # G117: Marshaled struct with secret-pattern field names - We intentionally
        # serialize auth tokens (access_token, refresh_token) for storage/transport.
        - G117
        # G118: Goroutine with background context - Intentional fire-and-forget or
        # long-lived goroutines that outlive the request scope by design.
        - G118
        # G120: Form parsing without body size limit - Only used in internal dev
        # server endpoints, not exposed to public traffic.
        - G120
        # G122: filepath.Walk race-prone path - Acceptable for a CLI tool that
        # operates on the local filesystem under user control.
        - G122
        # G702: Command injection via taint - Same rationale as G204; the tool
        # executes shell commands with user-provided inputs by design.
        - G702
        # G703: Path traversal via taint - Same rationale as G304; the tool reads
        # and writes files at user-specified paths by design.
        - G703
        # G704: SSRF via taint - We make intentional HTTP requests to external
        # services (OAuth providers, API endpoints) with user-configured URLs.
        - G704
        # G706: Log injection via taint - We use structured logging (slog) with
        # key-value pairs; the tainted data is in value position, not format string.
        - G706

output:
  formats:
    text:
      print-linter-name: true

issues:
  # Report every finding: `forge lint` gates PR CI on this config, and a
  # finding hidden behind a cap is one nobody is asked to fix.
  max-issues-per-linter: 0
  max-same-issues: 0