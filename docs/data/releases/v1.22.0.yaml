version: "v1.22.0"
date: "2026-11-18"
title: "3 new features, 5 fixes and 2 other changes"
summary: "Every pull request merged since v1.21.3, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "cli: reliant project delete deletes a project by id, name or path"
        description: "[#2874](https://github.com/reliant-labs/reliant/pull/2874)"
      - title: "web: walk a first-time user on the forge site through the existing welcome wizard, then back"
        description: "[#2866](https://github.com/reliant-labs/reliant/pull/2866)"
      - title: "web: Settings › API tokens lists your CLI logins and revokes one"
        description: "[#2883](https://github.com/reliant-labs/reliant/pull/2883)"
  - title: "Changed"
    items:
      - title: "worktree: a copied node_modules is the source checkout's install; reinstall when the lockfile differs"
        description: "[#2858](https://github.com/reliant-labs/reliant/pull/2858)"
      - title: "forge: compare forge's guide and start-here by their rendered text, not a byte count or exact heading"
        description: "[#2876](https://github.com/reliant-labs/reliant/pull/2876)"
  - title: "Fixed"
    items:
      - title: "prompt: point agent scratch at a persistent per-chat directory, not /tmp"
        description: "[#2872](https://github.com/reliant-labs/reliant/pull/2872)"
      - title: "workflows: record a tolerated node's workflow-side failure as its failed attempt"
        description: "[#2877](https://github.com/reliant-labs/reliant/pull/2877)"
      - title: "lint: drop task lint:electron and fmt:electron, which never ran a linter"
        description: "[#2878](https://github.com/reliant-labs/reliant/pull/2878)"
      - title: "ci: seed the Playwright system-package cache before the suite; responsive leg gets 30 minutes"
        description: "[#2879](https://github.com/reliant-labs/reliant/pull/2879)"
      - title: "llm: key validation returns fixed, key-free messages with reason codes and logs provider errors only redacted"
        description: "[#2857](https://github.com/reliant-labs/reliant/pull/2857)"
