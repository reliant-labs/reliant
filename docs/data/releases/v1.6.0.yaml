version: "v1.6.0"
date: "2026-08-17"
title: "Async spawn, workflow lifecycle, and interruptible turns"
summary: "Reworks how spawned work is tracked and torn down: a dedicated runs service and workflow lifecycle package, plus interrupt and pause handling that can stop a turn mid-tool without losing the conversation. Also commits generated code so a fresh clone compiles, moves onto Temporal SDK 1.47 and forge v0.1.0, and adds a supervisor that makes the Electron dev chain actually stop when told."
items:
  - title: "Async spawn and the runs service"
    description: "spawned work is tracked through a dedicated internal/runs service and a workflow lifecycle package, replacing the ad-hoc bookkeeping that made a spawn's state hard to reason about once it outlived the turn that started it."
  - title: "Interrupt and pause handling"
    description: "a turn can now be interrupted or paused mid-tool and resumed, with the cancel and terminate paths split so stopping a run and tearing it down are no longer the same operation."
  - title: "Workflow state and stop reasons recorded"
    description: "new migrations persist workflow state and why a run stopped, restore workflow checkpoints, and scope update-stream counters, with added indexes on the hot write path."
  - title: "Generated code is committed"
    description: "a fresh clone or new worktree now compiles without running codegen first. The sqlc output, proto stubs, and docgen artifacts were previously gitignored, so every new checkout started broken and generator changes produced no reviewable diff."
  - title: "Temporal SDK 1.47 and forge v0.1.0"
    description: "moves to Temporal SDK v1.47.0 with api v1.63.4, and forge v0.1.0 for the scaffold-stub sentinel and target-scoped env up."
  - title: "Dev chain teardown that works"
    description: "the Electron dev chain is supervised by a real process that owns its process group, so a scripted SIGTERM tears the whole chain down instead of leaving orphaned processes holding their ports."
