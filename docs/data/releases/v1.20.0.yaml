version: "v1.20.0"
date: "2026-11-14"
title: "3 new features, 2 fixes and 3 other changes"
summary: "Every pull request merged since v1.19.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "telemetry: workflow, agent and tool spans for AI monitoring"
        description: "[#2732](https://github.com/reliant-labs/reliant/pull/2732)"
      - title: "cli: reliant workflow run --daemon picks the machine a run executes on"
        description: "[#2748](https://github.com/reliant-labs/reliant/pull/2748)"
      - title: "orgs: the org provider and model policy where runs resolve their model and account, shipped in audit (org-policies R2)"
        description: "[#2766](https://github.com/reliant-labs/reliant/pull/2766)"
  - title: "Changed"
    items:
      - title: "clear forge test-waits findings ahead of the v1.6.0 pin"
        description: "[#2730](https://github.com/reliant-labs/reliant/pull/2730)"
      - title: "merge-queue: check the vendored control-plane contract before the merge when a group changes it"
        description: "[#2747](https://github.com/reliant-labs/reliant/pull/2747)"
      - title: "pin: forge@7c169e587003 + @reliantlabs/forge-web-runtime@0.13.15, as promoted in v1.18.1-rc.1"
        description: "[#2769](https://github.com/reliant-labs/reliant/pull/2769)"
  - title: "Fixed"
    items:
      - title: "prove_test: a C-family or Swift compile failure in the baseline is baseline_does_not_compile, not proven"
        description: "[#2767](https://github.com/reliant-labs/reliant/pull/2767)"
      - title: "workersetup: the org-key notice sweep claims due marks fairly, so a mark whose start keeps failing never starves a newer one"
        description: "[#2768](https://github.com/reliant-labs/reliant/pull/2768)"
