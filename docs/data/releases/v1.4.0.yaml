version: "v1.4.0"
date: "2026-04-09"
title: "Workflow routing, faster loads, and stronger distributed reliability"
summary: "Adds smarter workflow building with routing and parallel loops, improves performance across initial load and streaming updates, hardens distributed-mode reliability, and fixes a wide set of auth, MCP, and workflow execution issues."
items:
  - title: "Smarter workflow building"
    description: "with the new router node for choosing between multiple workflows, support for parallel loops, surfaced presets in custom workflows, and better context retention during iterative flows."
  - title: "Faster startup and streaming performance"
    description: "by reducing what loads on initial app open, scoping streamed updates more efficiently, and improving provider retry behavior for OpenRouter."
  - title: "Stronger distributed and remote daemon reliability"
    description: "with better remote daemon behavior, MCP requests correctly routed through the daemon boundary in distributed mode, and daemon heartbeat updates pushed more reliably over gRPC."
  - title: "Auth and security improvements"
    description: "including JWT validation hardening, CORS improvements, fixes for Google login and OAuth callback/timeout issues, and better reliability for Claude subscription login flows."
  - title: "Bug fixes across workflows, MCP, and web"
    description: "including fixes for loop execution and CEL compilation on first iteration, workflow loading in web, MCP reliability, empty task handling, message saving in loops, thread state, tip display, and general validation and SQL query issues."
