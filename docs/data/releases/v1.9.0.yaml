      - title: "skills: follow forge's split skills — FK fact from db/birth, forge skill descriptions spelled for the mount"
        description: "[#2252](https://github.com/reliant-labs/reliant/pull/2252)"
      - title: "web: let the execution-mode picker return to Default"
        description: "[#2268](https://github.com/reliant-labs/reliant/pull/2268)"
      - title: "forge: a forge-project read whose machine is asleep is asked of another checkout"
        description: "[#2233](https://github.com/reliant-labs/reliant/pull/2233)"
      - title: "web: describe the cert-authorization CNAME as TLS issuance, not routing"
        description: "[#2279](https://github.com/reliant-labs/reliant/pull/2279)"
      - title: "web: the forge console links the sites the platform serves for a self-managed environment"
        description: "[#2280](https://github.com/reliant-labs/reliant/pull/2280)"
      - title: "web: Domains page says how long issuing takes, and when a domain is stuck"
