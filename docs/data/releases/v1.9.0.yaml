version: "v1.9.0"
date: "2026-11-06"
title: "20 new features, 17 fixes and 24 other changes"
summary: "Every pull request merged since v1.8.19, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "sdk: sdk/go as a standalone module (PR A): public protos, Go client, follow engine"
        description: "[#2197](https://github.com/reliant-labs/reliant/pull/2197)"
      - title: "web: forge journey — /forge/demo on fixture data, 9 steps, Ask-an-agent handoff"
        description: "[#2218](https://github.com/reliant-labs/reliant/pull/2218)"
      - title: "web: declutter the workflow builder (assistant closed unless new, header actions behind More)"
        description: "[#2224](https://github.com/reliant-labs/reliant/pull/2224)"
      - title: "web: new workspaces start with the terminal closed"
        description: "[#2225](https://github.com/reliant-labs/reliant/pull/2225)"
      - title: "web: forge shell runs the forge journey — public /forge/demo, JourneyTour, landing ?journey="
        description: "[#2227](https://github.com/reliant-labs/reliant/pull/2227)"
      - title: "sdk: the app imports the Go SDK's protos and follow engine, pinned by version (PR B)"
        description: "[#2222](https://github.com/reliant-labs/reliant/pull/2222)"
      - title: "web: demo.reliantlabs.io shell — one route, read-only, tour on every visit, forge-demo analytics"
        description: "[#2239](https://github.com/reliant-labs/reliant/pull/2239)"
      - title: "release: propose the version the PR titles compute (feat → minor, else patch); refuse a breaking change"
        description: "[#2241](https://github.com/reliant-labs/reliant/pull/2241)"
      - title: "dashboards: draw a sql panel's rows as bars with display.style: bars"
        description: "[#2245](https://github.com/reliant-labs/reliant/pull/2245)"
      - title: "forge-console: services, processes and jobs in their own shapes on the Overview, plus traces and sessions tiles"
        description: "[#2244](https://github.com/reliant-labs/reliant/pull/2244)"
      - title: "ci: the merge gate fails a breaking proto change or an unapproved breaks-rollback migration"
        description: "[#2246](https://github.com/reliant-labs/reliant/pull/2246)"
      - title: "sdk: plain-http opt-in, follow log writer, resume needs-recovery, cancel/pause messages (R2 PR A)"
        description: "[#2236](https://github.com/reliant-labs/reliant/pull/2236)"
      - title: "web: demo data on forge's mock transport, cross-service fixtures, the demo host's ≤10-step tour, e2e"
        description: "[#2253](https://github.com/reliant-labs/reliant/pull/2253)"
      - title: "auth: enforce runs/triggers token scopes per rpc; auth token create --scope (R7)"
        description: "[#2235](https://github.com/reliant-labs/reliant/pull/2235)"
      - title: "sdk: Go SDK inbox and read-only approvals (PR A)"
        description: "[#2258](https://github.com/reliant-labs/reliant/pull/2258)"
      - title: "web: simplified chat thread — fold each agent turn's tool work into one line"
        description: "[#2266](https://github.com/reliant-labs/reliant/pull/2266)"
      - title: "sdk: the app uses the SDK's inbox and tools_daemon protos; pin sdk/go 6bd651353 (PR B)"
        description: "[#2267](https://github.com/reliant-labs/reliant/pull/2267)"
      - title: "auth: enforce inbox and question token scopes per rpc; pin forge a54d7bcc"
        description: "[#2261](https://github.com/reliant-labs/reliant/pull/2261)"
      - title: "sdk: Go SDK approval decisions behind approvals:decide (PR A)"
        description: "[#2271](https://github.com/reliant-labs/reliant/pull/2271)"
      - title: "auth: approval decisions need an explicit approvals:decide; machine-bound tokens refused"
        description: "[#2274](https://github.com/reliant-labs/reliant/pull/2274)"
  - title: "Changed"
    items:
      - title: "terminology: say Workspace for worktrees/branches in the app and docs"
        description: "[#2223](https://github.com/reliant-labs/reliant/pull/2223)"
      - title: "web: a claim started on the forge origin finishes there (provider upgrade returns to the initiating origin)"
        description: "[#2226](https://github.com/reliant-labs/reliant/pull/2226)"
      - title: "toolexec: remove flaky TestTerminalOutputQueue_OverflowEndsWithError (flake:removed #2228)"
        description: "[#2229](https://github.com/reliant-labs/reliant/pull/2229)"
      - title: "tools_daemon: fmt.Fprintf into the want buffer (staticcheck QF1012)"
        description: "[#2231](https://github.com/reliant-labs/reliant/pull/2231)"
      - title: "web/e2e: Chat options lists manual and plan, not auto (#2203 removed auto from the selector)"
        description: "[#2232](https://github.com/reliant-labs/reliant/pull/2232)"
      - title: "sdk/go: compile-checked examples for the SDK guide (runs, gates, triggers, webhooks, errors)"
        description: "[#2238](https://github.com/reliant-labs/reliant/pull/2238)"
      - title: "pin: forge@10926048 (forge#1710 for cp #1947)"
        description: "[#2242](https://github.com/reliant-labs/reliant/pull/2242)"
      - title: "notes: reliant has launched; changes stay backwards compatible within major 1"
        description: "[#2247](https://github.com/reliant-labs/reliant/pull/2247)"
      - title: "console: 8 telemetry reads at once, visible tiles before polls; cancelled reads free their slot at once"
        description: "[#2254](https://github.com/reliant-labs/reliant/pull/2254)"
      - title: "forge: reliant always takes the newest forge; the upgrade procedure and its log"
        description: "[#2255](https://github.com/reliant-labs/reliant/pull/2255)"
      - title: "cli: workflow supervision and trigger reads ride the Go SDK (R2 PR B)"
        description: "[#2257](https://github.com/reliant-labs/reliant/pull/2257)"
      - title: "sdk: an SDK group: overview, Go guide, TypeScript guide, API reference (R6)"
        description: "[#2237](https://github.com/reliant-labs/reliant/pull/2237)"
      - title: "sdk/go: examples answer a gate with a person's choice, bound the trigger wait, and cover the new methods"
        description: "[#2262](https://github.com/reliant-labs/reliant/pull/2262)"
      - title: "web: chatStore folds the chat stream with the SDK's reduceChat (R4, PR 2 of 2)"
        description: "[#2265](https://github.com/reliant-labs/reliant/pull/2265)"
      - title: "sdk/react: useApprovals under a project scope shares the chat's session, and another scope does not"
        description: "[#2251](https://github.com/reliant-labs/reliant/pull/2251)"
      - title: "sdk/go: drop the forge module dependency"
        description: "[#2270](https://github.com/reliant-labs/reliant/pull/2270)"
      - title: "db: drop the Repository's dead statement executor and sqlc leftovers"
        description: "[#2273](https://github.com/reliant-labs/reliant/pull/2273)"
      - title: "web: move SettingsService callers onto the generated hooks; delete settings-grpc.ts"
        description: "[#2275](https://github.com/reliant-labs/reliant/pull/2275)"
      - title: "errors: build handler-edge Connect errors through svcerr"
        description: "[#2277](https://github.com/reliant-labs/reliant/pull/2277)"
      - title: "deps: pin forge 7ad8943c (identity v2: forge#1816, forge#1817)"
        description: "[#2269](https://github.com/reliant-labs/reliant/pull/2269)"
      - title: "db: match store misses with svcerr.IsNotFound, not sql.ErrNoRows"
        description: "[#2276](https://github.com/reliant-labs/reliant/pull/2276)"
      - title: "deps: pin sdk/go 9d2ac59c6 (no forge dependency #2270, approval decisions #2271)"
        description: "[#2281](https://github.com/reliant-labs/reliant/pull/2281)"
      - title: "inbox: ListInbox reads each workflow catalog and draft once, not once per activation"
        description: "[#2283](https://github.com/reliant-labs/reliant/pull/2283)"
      - title: "naming: say platform-api, not admin-server, in prose and comments"
        description: "[#2285](https://github.com/reliant-labs/reliant/pull/2285)"
  - title: "Fixed"
    items:
      - title: "auth: decide forge #1757's runs/triggers scopes (pin forge 8b49eee3, widen access_tokens_scopes)"
        description: "[#2205](https://github.com/reliant-labs/reliant/pull/2205)"
      - title: "toolexec: a failed terminal output queue never holds its lock while waiting on the consumer"
        description: "[#2230](https://github.com/reliant-labs/reliant/pull/2230)"
      - title: "web: the Apps list counts self-managed environments as deployed"
        description: "[#2234](https://github.com/reliant-labs/reliant/pull/2234)"
      - title: "console: each Overview tile owns its state — one timeout never hides another; Retry keeps siblings; stale-while-revalidate"
        description: "[#2240](https://github.com/reliant-labs/reliant/pull/2240)"
      - title: "fs: a preview of a file that is not on the machine is NotFound, not Internal"
        description: "[#2249](https://github.com/reliant-labs/reliant/pull/2249)"
      - title: "web: rpc-timeout reports group by method, with the in-flight snapshot as an attribute"
        description: "[#2248](https://github.com/reliant-labs/reliant/pull/2248)"
      - title: "daemon: one unsendable message no longer leaves the gateway stream half-dead for 95s"
        description: "[#2256](https://github.com/reliant-labs/reliant/pull/2256)"
      - title: "release: sync semver-next.sh and check-compat.sh with forge's and control-plane's"
        description: "[#2260](https://github.com/reliant-labs/reliant/pull/2260)"
      - title: "web: switch the right sidebar to a chat's workspace on the first click"
        description: "[#2263](https://github.com/reliant-labs/reliant/pull/2263)"
      - title: "chat: run-to-run messages and async ask_user answers never render as the user's"
