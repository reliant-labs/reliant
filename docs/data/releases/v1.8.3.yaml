version: "v1.8.3"
date: "2026-10-25"
title: "A security fix, several accounts per provider, and a Run now button for workflows"
summary: "This release fixes a critical security issue in how the API server handled MCP server configs (GHSA-f79v-cfj6-wx37). Self-hosted operators should upgrade. It also lets you connect more than one account per provider, with automatic failover when an account hits its usage limit. Workflows can be started by hand with Run now, and automations have their own home. Machines handle disk and memory pressure better, and the app can be used on a phone."
items:
  - title: "Security: MCP server configs are resolved on your machine, not on the server"
    description: "References like ${VAR} in an MCP server's command, arguments, URL or headers are now resolved by your daemon when the server launches, using your own environment. The API server no longer resolves them and no longer looks up stdio commands through a shell. Older versions could expose the API server's environment and could run shell syntax placed in a command name. Self-hosted operators should upgrade to this release and rotate every secret in the API server's environment. Details: GHSA-f79v-cfj6-wx37."
  - title: "Several accounts per provider, with failover at usage limits"
    description: "Settings → Providers now lists every account you connect, and you can connect more than one account per provider. Each chat picks an account by policy, and the composer shows which account is serving it. When an account hits its usage limit, the chat moves to another account, or waits for the limit to reset and then retries by itself. One action resumes the whole chat after a provider runs out. A chat's model and settings are now kept on the server, so they follow you between devices."
  - title: "Run now, and a home for automations"
    description: "You can start a workflow by hand with typed inputs, choose which machine it runs on, and replay a past event into it. Automations have their own information architecture: one unit per automation, a Needs you section, setup and health in plain words, and their runs are kept apart from your chats. Successful automation runs archive themselves. A workflow can declare an on_failure handler, and a run that resumes after a hold wakes its machine and tells you the machine had been asleep."
  - title: "Machines that look after their disk and memory"
    description: "The daemon now reclaims space at 90% disk use and refuses new heavy commands at 95%. It also keeps the Go and npm caches within budget, queues agents' heavy commands behind the machine's heavy slots, and cleans up archived worktrees after saving any unpushed commits under refs. When memory pressure kills a process or crashes the machine, you are told. Tool results survive a daemon restart, and the terminal reconnects as soon as the page wakes or the network returns."
  - title: "Reliant on your phone, and a deeper Apps console"
    description: "The chat timeline, composer, Inbox, Apps and observability now have phone layouts. The Apps console gains an Overview with workloads, Releases, native dashboards you can edit, a metrics explorer, error issues, and session replays. Protected environments ask you to confirm before secrets change, and show who set each version."
  - title: "Smaller fixes"
    description: "A stale tab now offers to reload when a new build ships. ask_user questions are asynchronous by default and never render as nothing. Server-side fetch and other egress tools have size, time, redirect and rate limits. The servers and the desktop app's main process now report errors to Reliant's own telemetry instead of Sentry. Git credentials are never stored in a remote URL."
