version: "v1.8.15"
date: "2026-11-01"
title: "Rename machines, see each chat's project, faster inbox reads"
summary: "Machines can be renamed, the sidebar shows which project each chat is in, the new-chat pickers only offer pairs that work, inbox and workflow reads do less work, and the Temporal worker no longer crash-loops at boot."
sections:
  - title: "Added"
    items:
      - title: "machines: rename a machine from Settings -> Machines, the CLI, or DaemonRegistryService.RenameMachine"
        description: "[#1974](https://github.com/reliant-labs/reliant/pull/1974)"
      - title: "web: the sidebar shows which project each chat is in"
        description: "[#1975](https://github.com/reliant-labs/reliant/pull/1975)"
      - title: "web: the new-chat pickers never offer a project/machine pair that fails"
        description: "[#1976](https://github.com/reliant-labs/reliant/pull/1976)"
      - title: "tracing: RPC server spans carry chat.id, workflow.id and thread.id"
        description: "[#1982](https://github.com/reliant-labs/reliant/pull/1982)"
  - title: "Changed"
    items:
      - title: "chat: GetWorkflowExecutions' save probe keys the loop scope, not filters it"
        description: "[#1979](https://github.com/reliant-labs/reliant/pull/1979)"
      - title: "inbox: ListInbox reuses workflow-tree verdicts instead of re-validating every activation on every read"
        description: "[#1981](https://github.com/reliant-labs/reliant/pull/1981)"
      - title: "deps: pin forge 820b3ef — trace filters by span attribute, forge.ExternalDatabase"
        description: "[#1984](https://github.com/reliant-labs/reliant/pull/1984)"
      - title: "pin: forge v1.0.12 — merge-friendly generated output, release_dependencies fix, ExternalDatabase, obs attribute filter"
        description: "[#1989](https://github.com/reliant-labs/reliant/pull/1989)"
  - title: "Fixed"
    items:
      - title: "cli: reliant github token|gh load CLIConfig instead of failing before they run"
        description: "[#1978](https://github.com/reliant-labs/reliant/pull/1978)"
      - title: "worker: build the Temporal worker on the SDK client under stopnudge's decorator (worker crash-looped at boot)"
        description: "[#1983](https://github.com/reliant-labs/reliant/pull/1983)"
      - title: "release-tag: --skip-release-gate is honoured with --rc (it was silently ignored)"
        description: "[#1987](https://github.com/reliant-labs/reliant/pull/1987)"
