version: "v1.25.0"
date: "2026-11-21"
title: "11 new features, 29 fixes and 7 other changes"
summary: "Every pull request merged since v1.24.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "llm: repair message history before every provider request"
        description: "[#3076](https://github.com/reliant-labs/reliant/pull/3076)"
      - title: "cli: send Reliant-Client and refuse with the upgrade command"
        description: "[#3061](https://github.com/reliant-labs/reliant/pull/3061)"
      - title: "triggers: webhook URL and token at activate, trigger rotate, HMAC secrets on enable, no proxy request ids in dedupe"
        description: "[#3124](https://github.com/reliant-labs/reliant/pull/3124)"
      - title: "cli: reliant auth token create --expires-in"
        description: "[#3113](https://github.com/reliant-labs/reliant/pull/3113)"
      - title: "cli: reliant chat list, show and set-machine"
        description: "[#3107](https://github.com/reliant-labs/reliant/pull/3107)"
      - title: "integrations: GitHub branch.rules, release.create/update, compare, commit.statuses and Slack conversations.replies actions"
        description: "[#3121](https://github.com/reliant-labs/reliant/pull/3121)"
      - title: "workflows: forge one-shot exposes the reviewer's inspection evidence"
        description: "[#3134](https://github.com/reliant-labs/reliant/pull/3134)"
      - title: "workflows: builtin://agent takes max_turns and tool_params"
        description: "[#3114](https://github.com/reliant-labs/reliant/pull/3114)"
      - title: "record the effective thinking level on messages"
        description: "[#3160](https://github.com/reliant-labs/reliant/pull/3160)"
      - title: "mcp: offer dir-scoped MCP servers' tools, apply mcp.json edits at the next turn, and reliant mcp list|tools|restart"
        description: "[#3132](https://github.com/reliant-labs/reliant/pull/3132)"
      - title: "runs: SignalRunResponse.not_delivered_reason, beside the X-Reliant-Not-Delivered-Reason header (#2465)"
        description: "[#3161](https://github.com/reliant-labs/reliant/pull/3161)"
  - title: "Changed"
    items:
      - title: "handlers: tenant-isolation tests for plan, task and attachment"
        description: "[#3064](https://github.com/reliant-labs/reliant/pull/3064)"
      - title: "web: vite 8 and vitest 5, matching forge's scaffold"
        description: "[#3018](https://github.com/reliant-labs/reliant/pull/3018)"
      - title: "settings: document MCP dir, dirScoped, requiresFiles and ${projectPath}"
        description: "[#3104](https://github.com/reliant-labs/reliant/pull/3104)"
      - title: "web: preserve boot mock history and remove flaky root probe"
        description: "[#3127](https://github.com/reliant-labs/reliant/pull/3127)"
      - title: "package-commands: ListProcesses probes each machine's liveness concurrently, not one after another"
        description: "[#3149](https://github.com/reliant-labs/reliant/pull/3149)"
      - title: "daemon: check framed background credential environment"
        description: "[#3159](https://github.com/reliant-labs/reliant/pull/3159)"
      - title: "proctree: LimitNote's own-limit check accepts the either-limit wording on kernels before 6.13"
        description: "[#3169](https://github.com/reliant-labs/reliant/pull/3169)"
  - title: "Fixed"
    items:
      - title: "codex: keep image generation available outside the chat catalog"
        description: "[#3063](https://github.com/reliant-labs/reliant/pull/3063)"
      - title: "test: telemetry tests stub the SDK forge-web-runtime 0.13.20 starts; drop a flaky shell_kill probe"
        description: "[#3075](https://github.com/reliant-labs/reliant/pull/3075)"
      - title: "cli: a scoped token refused for a missing scope is told which scope, not to re-authenticate"
        description: "[#3115](https://github.com/reliant-labs/reliant/pull/3115)"
      - title: "docs: generated reference pages parse in Mintlify; keyword descriptions; true credential-sandbox text"
        description: "[#3106](https://github.com/reliant-labs/reliant/pull/3106)"
      - title: "workflows: a call_llm node's messages render their templates"
        description: "[#3116](https://github.com/reliant-labs/reliant/pull/3116)"
      - title: "cli: trigger deactivate says it reaches every project and takes --project; activate and deactivate name the built-in a bare --workflow meant"
        description: "[#3118](https://github.com/reliant-labs/reliant/pull/3118)"
      - title: "cli: auth status says when the login cannot manage machines"
        description: "[#3120](https://github.com/reliant-labs/reliant/pull/3120)"
      - title: "cli: workflow validate runs a sample only through its triggers, counts lint warnings, checks credentials and no-machine"
        description: "[#3119](https://github.com/reliant-labs/reliant/pull/3119)"
      - title: "triggers: a trigger with no workflow runs the default one; an unresolvable workflow is recorded"
        description: "[#3110](https://github.com/reliant-labs/reliant/pull/3110)"
      - title: "workflow: approval outputs declare denial_reason; data is deprecated and documented as never set"
        description: "[#3122](https://github.com/reliant-labs/reliant/pull/3122)"
      - title: "launch: refuse an org_only automation on any unserved model input, not only one named model"
        description: "[#3123](https://github.com/reliant-labs/reliant/pull/3123)"
      - title: "tools: update_task changes only the caller's plan chain, and a sub-agent only the task it holds"
        description: "[#3097](https://github.com/reliant-labs/reliant/pull/3097)"
      - title: "web: links in question cards are clickable"
        description: "[#3128](https://github.com/reliant-labs/reliant/pull/3128)"
      - title: "trigger: activation approval preview validates each workflow once, and is bounded"
        description: "[#3129](https://github.com/reliant-labs/reliant/pull/3129)"
      - title: "chat: a message sent to a paused run is delivered after the queued mailbox"
        description: "[#3130](https://github.com/reliant-labs/reliant/pull/3130)"
      - title: "workflows: forge one-shot's gate holds an unattended run to its decisions section"
        description: "[#3131](https://github.com/reliant-labs/reliant/pull/3131)"
      - title: "daemonerr: a worktree-recovery refusal is a retryable Unavailable, not Internal, and the web does not report it"
        description: "[#3137](https://github.com/reliant-labs/reliant/pull/3137)"
      - title: "workflow: a native function's list result (regex.extractAll) converts to structpb"
        description: "[#3139](https://github.com/reliant-labs/reliant/pull/3139)"
      - title: "web: telemetry tests stub the SDK the runtime starts again; smoke test waits for React to mount"
        description: "[#3141](https://github.com/reliant-labs/reliant/pull/3141)"
      - title: "workflows: nodes.?X type-checks like nodes.X for a node whose outputs are known only at run time"
        description: "[#3142](https://github.com/reliant-labs/reliant/pull/3142)"
      - title: "triggers: EnableWorkflow re-reads an owner's integration access once per request, not per trigger per phase"
        description: "[#3143](https://github.com/reliant-labs/reliant/pull/3143)"
      - title: "triggers: enabling a workflow's triggers together gets a budget for several, not 10s"
        description: "[#3147](https://github.com/reliant-labs/reliant/pull/3147)"
      - title: "spawn: a stopped sub-agent no longer holds a concurrency slot while it unwinds"
        description: "[#3150](https://github.com/reliant-labs/reliant/pull/3150)"
      - title: "prompt: each sub-agent gets its own scratch subdirectory under the chat's"
        description: "[#3151](https://github.com/reliant-labs/reliant/pull/3151)"
      - title: "triggers: a webhook delivery pins its catalog once and gives each trigger its own deadline"
        description: "[#3154](https://github.com/reliant-labs/reliant/pull/3154)"
      - title: "shell: GetProcessStatus reads lifecycle state without a port scan"
        description: "[#3153](https://github.com/reliant-labs/reliant/pull/3153)"
      - title: "llm: an OpenAI cyber_policy refusal is the user's prompt, not a server error"
        description: "[#3155](https://github.com/reliant-labs/reliant/pull/3155)"
      - title: "cli: reliant auth token revoke takes the --name token create took"
        description: "[#3152](https://github.com/reliant-labs/reliant/pull/3152)"
      - title: "cli: worktree help says reclaim only reports by default; models reference names the app's AI settings"
        description: "[#3158](https://github.com/reliant-labs/reliant/pull/3158)"
