version: "v1.8.11"
date: "2026-10-29"
title: "Faster chats and clearer workflow failures"
summary: "Chats open with less work, invalid workflow files fail safely, and browser errors use one observability pipeline."
items:
  - title: "Open chats with less waiting"
    description: "Opening a chat no longer loads workflow state, ownership reads are leaner, and the connection pool stays warm."
  - title: "Fail invalid workflows safely"
    description: "A workflow file that cannot be parsed blocks its name instead of allowing another workflow with the same name to run."
  - title: "Use one browser error pipeline"
    description: "ClickStack is the browser error sink; the separate web Sentry integration has been removed."
  - title: "Understand environment deletion"
    description: "The confirmation dialog explicitly warns that deleting an environment also deletes its databases."
