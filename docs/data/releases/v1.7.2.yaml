version: "v1.7.2"
date: "2026-08-20"
title: "The desktop app can reach the backend again"
summary: "Fixes the two defects that made the packaged app unable to connect: it was pointed at a hostname that does not exist, and even with that corrected it derived a second hostname that also does not exist. Also adds a release-time check that resolves and connects to every endpoint before publishing, so a build that points at nothing fails in seconds rather than reaching users."
items:
  - title: "The app was pointed at a domain that does not exist"
    description: "every build since the endpoint was last changed shipped with api.reliant.so compiled in — a hostname with no DNS record at all. Nothing could connect, on any machine. It survived because the value lived in a GitHub secret, and a secret cannot be read back, diffed, or reviewed; the existing guard only checked the URL was non-empty and not localhost, and a dead domain passes both. These are public hostnames that ship inside the app, so they now live in a version-controlled file where a change is a reviewable diff."
  - title: "The daemon gateway address was derived incorrectly for production"
    description: "the gateway host is worked out from the API host, and the rule assumed the leading part of the name is an environment label — correct for preprod, which becomes gateway-preprod. Production is named for the service instead, so the rule produced gateway-api.reliantapi.com, which also does not exist. Production was the one environment the derivation got wrong, and production is what ships."
  - title: "A release now refuses to publish an unreachable endpoint"
    description: "before any platform builds, each endpoint is checked for four things: that it is set, that it is not localhost, that its DNS resolves, and that it answers over HTTPS. The first two were already checked and neither would have caught this. The build now fails in about ten seconds instead of producing signed artifacts that were never going to work."
  - title: "Sign-in and setup no longer stall without a terminal"
    description: "several daemon and sign-in paths assumed they could prompt at a terminal. The packaged app has none, so those flows waited on input that could never arrive instead of reporting the problem. They now handle the non-interactive case explicitly, and the app waits for credentials to be ready rather than racing them."
  - title: "Billing and environments settings, and chat navigation shortcuts"
    description: "the cloud billing and environments screens have been reworked, along with the compute step in setup and the connect-machine dialog. Chat navigation gains keyboard shortcuts, with the shortcut list and its documentation generated from one source so they cannot disagree."
