version: "v1.35.0"
date: "2026-11-27"
title: "2 new features, 4 fixes and 3 other changes"
summary: "Every pull request merged since v1.34.1, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "diskwatch: trim every Go build cache by forge/pkg/gocache's policy; pin forge@eaf3a164 (supersedes #3869)"
        description: "[#3909](https://github.com/reliant-labs/reliant/pull/3909)"
      - title: "mergequeue: run candidate builds, changed paths and pipeline.yaml reads as gate pool daemon jobs"
        description: "[#3924](https://github.com/reliant-labs/reliant/pull/3924)"
  - title: "Changed"
    items:
      - title: "db: call trigger event store within delivery transaction"
        description: "[#3895](https://github.com/reliant-labs/reliant/pull/3895)"
      - title: "perf(web): typecheck with tsgo, TypeScript's native compiler (#3881)"
        description: "[#3885](https://github.com/reliant-labs/reliant/pull/3885)"
      - title: "refactor(db): delete the six deprecated trigger-event and run-list forwards from the facade (#3630)"
        description: "[#3788](https://github.com/reliant-labs/reliant/pull/3788)"
  - title: "Fixed"
    items:
      - title: "mergequeue: no code operations on the server roles; guard the api, worker and gateway closure"
        description: "[#3898](https://github.com/reliant-labs/reliant/pull/3898)"
      - title: "architecture: deps guard skips when git history is unavailable"
        description: "[#3897](https://github.com/reliant-labs/reliant/pull/3897)"
      - title: "web: size an attachment upload's client budget by its bytes, not a fixed 60s"
        description: "[#3899](https://github.com/reliant-labs/reliant/pull/3899)"
      - title: "coverage: restore the coverage-source blob read on the API server, bounded in memory"
        description: "[#3904](https://github.com/reliant-labs/reliant/pull/3904)"
