version: "v1.7.14"
date: "2026-09-17"
title: "Cancelled commands clean up after themselves, images survive the trip, and a workflow gets exactly the tools it asked for"
summary: "A substantial maintenance release. Cancelling a command no longer strands a git lock that blocks every later write, large generated images make it through the daemon instead of failing on a size limit, and workflows now receive precisely the tools they declare. Stalled model streams are bounded so a turn is no longer silently truncated, and skill suggestions no longer edit the words you typed."
items:
  - title: "Cancelling a command no longer leaves git wedged"
    description: "A cancelled subprocess was killed outright, so it never got to clean up after itself. Git made this visible: killed mid-write, it leaves behind a lock file it cannot remove, and every later git operation in that repository then fails while blaming a process that is no longer running. One was found still blocking work twelve hours later, fixable only by deleting a file by hand inside .git. Cancelled commands are now asked to stop first and given a moment to tidy up before being forced, and a lock stranded by an earlier crash is detected and recovered instead of stopping you."
  - title: "Large images make it through instead of failing"
    description: "Generated images bigger than the messaging layer's payload limit were rejected in transit, so the work completed and then the result never arrived. Images are now chunked to fit, so a large one arrives the same as a small one."
  - title: "A workflow gets exactly the tools it declares"
    description: "Tool availability had drifted into several overlapping mechanisms, with the result that workflows which had moved off the old filter setting silently lost their tools entirely, and parameter bindings configured on a workflow or preset were not applied. Declared tools are now what a run receives — no more, no less — and tool grants are scoped to the run that earned them, failing closed rather than open."
  - title: "A stalled model response no longer cuts your turn short"
    description: "The existing safeguards watched for silence on the network, so they could not see a provider that had sent its data and then stopped producing anything meaningful. That shape ran until an outer deadline and truncated the turn with no explanation. Stalls are now caught where they happen, and a turn that hits a deadline is no longer lost."
  - title: "Skill suggestions no longer rewrite your message"
    description: "The suggester was appending its note onto the end of your last message, which meant the transcript no longer matched what you actually sent and the model saw you asking for things you never mentioned. Suggestions are now delivered as their own message, positioned so the model still reads them alongside your request — but your words stay yours."
  - title: "Daemons are identified by where they actually run"
    description: "A daemon is now keyed by its origin, account and workspace together, so separate workspaces no longer contend over the same identity. A daemon that comes up without credentials repairs itself rather than waiting, and a workspace that takes several minutes to provision is no longer reported as a failure."
  - title: "Sign-in helper opens only when it is needed"
    description: "The localhost helper used for provider sign-in now starts on demand over the existing daemon connection, and corrects itself if a previous attempt left it in a bad state — so a cancelled sign-in no longer blocks the next one."
