      - title: "machines: let a cleared default machine forget its remembered choice (1/2)"
        description: "[#2502](https://github.com/reliant-labs/reliant/pull/2502)"
      - title: "cli: reliant github tries the next account when one has no GitHub connection"
        description: "[#2508](https://github.com/reliant-labs/reliant/pull/2508)"
      - title: "web: sheets opened by a tap Safari never focused restore focus to it again"
        description: "[#2509](https://github.com/reliant-labs/reliant/pull/2509)"
