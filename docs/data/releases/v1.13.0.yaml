    items:
      - title: "pin: forge@0a3a89d5 (accessible drawer and modal adoption)"
        description: "[#2468](https://github.com/reliant-labs/reliant/pull/2468)"
      - title: "web: drop the unused better-sqlite3 dev dependency and admit Node 26"
        description: "[#2506](https://github.com/reliant-labs/reliant/pull/2506)"
      - title: "forge: hosting is generally available; deploy any language and third-party images"
        description: "[#2507](https://github.com/reliant-labs/reliant/pull/2507)"
  - title: "Fixed"
    items:
      - title: "workflow: run node honors work_dir and templates writable_checkouts"
