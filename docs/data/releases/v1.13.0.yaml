version: "v1.13.0"
date: "2026-11-09"
title: "1 new feature, 4 fixes and 3 other changes"
summary: "Every pull request merged since v1.12.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: read-only storage browser in the Apps console"
        description: "[#2364](https://github.com/reliant-labs/reliant/pull/2364)"
