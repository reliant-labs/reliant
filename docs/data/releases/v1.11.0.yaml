version: "v1.11.0"
date: "2026-11-08"
title: "10 new features, 27 fixes and 17 other changes"
summary: "Every pull request merged since v1.10.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "chat: long pastes are ordinary attachment chips; draft attachments survive a reload"
        description: "[#2400](https://github.com/reliant-labs/reliant/pull/2400)"
      - title: "web: the forge demo as its own bundle and env — forge console on the mock transport, Reliant-free, deploy/kcl/demo"
        description: "[#2335](https://github.com/reliant-labs/reliant/pull/2335)"
      - title: "config: deprecate DEMO_APP_HOST now that demo.reliantlabs.io is its own env (behavior kept within v1); demo deploy and rollback docs"
        description: "[#2336](https://github.com/reliant-labs/reliant/pull/2336)"
      - title: "projects: browse, create and attach projects on any machine; detach without deleting"
        description: "[#2338](https://github.com/reliant-labs/reliant/pull/2338)"
      - title: "workflow: add durable opt-in ambient memory exclusion"
        description: "[#2379](https://github.com/reliant-labs/reliant/pull/2379)"
      - title: "web: manage projects per machine; pick the machine when adding a project or folder"
        description: "[#2342](https://github.com/reliant-labs/reliant/pull/2342)"
      - title: "web: workflows tour shows a finished Fix my PR on the canvas (drag demo, no required build steps, phone deck)"
        description: "[#2359](https://github.com/reliant-labs/reliant/pull/2359)"
      - title: "web: time chat open as one chat.open interaction span, click to usable timeline"
        description: "[#2433](https://github.com/reliant-labs/reliant/pull/2433)"
      - title: "web: simplified thread never folds the agent's prose, only runs of tool work"
        description: "[#2438](https://github.com/reliant-labs/reliant/pull/2438)"
      - title: "workloads: view redacted config values on demand"
        description: "[#2381](https://github.com/reliant-labs/reliant/pull/2381)"
  - title: "Changed"
    items:
      - title: "e2e: the one-step demo page tour shows no step count"
        description: "[#2403](https://github.com/reliant-labs/reliant/pull/2403)"
      - title: "app: remove flaky TestPersistenceRolesAreTheDatabase (#2401)"
        description: "[#2402](https://github.com/reliant-labs/reliant/pull/2402)"
      - title: "dev: build each Air host binary once per save, with -trimpath"
        description: "[#2410](https://github.com/reliant-labs/reliant/pull/2410)"
      - title: "pin: forge@v1.2.0 (the tag on the commit already pinned, 7a1f5720c)"
        description: "[#2417](https://github.com/reliant-labs/reliant/pull/2417)"
      - title: "ci: claim the service catalog and demo scripts in test-affected"
        description: "[#2418](https://github.com/reliant-labs/reliant/pull/2418)"
      - title: "pin: forge@88cb28c2f (pgtest owner leases #1918, dev telemetry, obs instance scope); web-runtime 0.13.6"
        description: "[#2421](https://github.com/reliant-labs/reliant/pull/2421)"
      - title: "forge: bump to 88cb28c2f; dev stack ships telemetry to the hosted store (dev_telemetry = auto)"
        description: "[#2411](https://github.com/reliant-labs/reliant/pull/2411)"
      - title: "pin: forge@6d8c0ab60 (ShellBuild inputs skip: forge #1935)"
        description: "[#2422](https://github.com/reliant-labs/reliant/pull/2422)"
      - title: "setup: cache Task, ripgrep and buf; fetch them with retries and an API fallback"
        description: "[#2426](https://github.com/reliant-labs/reliant/pull/2426)"
      - title: "electron: cache the Electron zip and electron-builder's tools by version"
        description: "[#2427](https://github.com/reliant-labs/reliant/pull/2427)"
      - title: "release-gate: restore the Electron zip in every part, not only web"
        description: "[#2428](https://github.com/reliant-labs/reliant/pull/2428)"
      - title: "ci: merge-gate --skip-lint drops vet and lint without queue-entry semantics"
        description: "[#2431](https://github.com/reliant-labs/reliant/pull/2431)"
      - title: "chat: record transcript byte share on every read"
        description: "[#2439](https://github.com/reliant-labs/reliant/pull/2439)"
      - title: "golangci-lint on changed packages before merge (parallel job)"
        description: "[#2436](https://github.com/reliant-labs/reliant/pull/2436)"
      - title: "web: adopt published forge devlog and record frontend migration gaps"
        description: "[#2448](https://github.com/reliant-labs/reliant/pull/2448)"
      - title: "pin: forge@56e8024f (two-phase trace page query, fast ListTraces: forge #1960)"
        description: "[#2453](https://github.com/reliant-labs/reliant/pull/2453)"
      - title: "web: use published forge demo mock helpers"
        description: "[#2454](https://github.com/reliant-labs/reliant/pull/2454)"
  - title: "Fixed"
    items:
      - title: "web: quiet idempotent setting cleanup and make settings-sync startup logs accurate"
        description: "[#2405](https://github.com/reliant-labs/reliant/pull/2405)"
      - title: "web: share one ListDaemons query instead of a burst of aborted duplicates"
        description: "[#2404](https://github.com/reliant-labs/reliant/pull/2404)"
      - title: "web: the telemetry service.name test accepts a project with more than one frontend"
        description: "[#2408](https://github.com/reliant-labs/reliant/pull/2408)"
      - title: "web: the chat transcript can never scroll sideways"
        description: "[#2409](https://github.com/reliant-labs/reliant/pull/2409)"
      - title: "credsandbox: a credentials:none command run inside another one is no longer refused"
        description: "[#2415](https://github.com/reliant-labs/reliant/pull/2415)"
      - title: "dev: air-build marks a build reusable only when its input graph held still"
        description: "[#2414](https://github.com/reliant-labs/reliant/pull/2414)"
      - title: "worktreereclaim: tracked secrets/ and data/ directories and forge generate output no longer hold every worktree from retirement"
        description: "[#2406](https://github.com/reliant-labs/reliant/pull/2406)"
      - title: "dev: air-build delegates staleness to go's build cache"
        description: "[#2419](https://github.com/reliant-labs/reliant/pull/2419)"
      - title: "ci: the merge gate checks pgtest's shared Postgres before generate and test"
        description: "[#2420](https://github.com/reliant-labs/reliant/pull/2420)"
      - title: "worktree: a create on a slow machine takes back a failed checkout, fsyncs a made one, and warns instead of paging"
        description: "[#2293](https://github.com/reliant-labs/reliant/pull/2293)"
      - title: "worktreereclaim: apply De Morgan in repairRegistration's lock check (main red on Release gate lint)"
        description: "[#2425](https://github.com/reliant-labs/reliant/pull/2425)"
      - title: "credsandbox: credentials: none can no longer write what a later credentialed step trusts (sandbox v2)"
        description: "[#2368](https://github.com/reliant-labs/reliant/pull/2368)"
      - title: "test-affected: apply De Morgan in the Electron cache test's step-order check (main red on Release gate lint)"
        description: "[#2430](https://github.com/reliant-labs/reliant/pull/2430)"
      - title: "credsandbox: mark credScratchRecordName as not a credential (main red on Release gate lint, gosec G101)"
        description: "[#2432](https://github.com/reliant-labs/reliant/pull/2432)"
      - title: "web: keep demo page callouts below the screen-action row"
        description: "[#2437](https://github.com/reliant-labs/reliant/pull/2437)"
      - title: "chat: scroll-back keeps paging past hidden rows; \"Start of conversation\" only at the real start"
        description: "[#2440](https://github.com/reliant-labs/reliant/pull/2440)"
      - title: "web: simplified thread keeps cards, media and mail at their place in the timeline"
        description: "[#2441](https://github.com/reliant-labs/reliant/pull/2441)"
      - title: "observability: always show Sessions, with a replay-off empty state"
        description: "[#2442](https://github.com/reliant-labs/reliant/pull/2442)"
      - title: "daemonruntime: an archived worktree is held only by its own processes and terminals, not by any on the machine"
        description: "[#2434](https://github.com/reliant-labs/reliant/pull/2434)"
      - title: "db: UpdateChatUnread hands a serialization failure to its transaction's retry"
        description: "[#2445](https://github.com/reliant-labs/reliant/pull/2445)"
      - title: "runtime: a user's cancel and the identical-failure guard are outcomes, not ERRORs"
        description: "[#2446](https://github.com/reliant-labs/reliant/pull/2446)"
      - title: "server: flush telemetry on root startup failures"
        description: "[#2447](https://github.com/reliant-labs/reliant/pull/2447)"
      - title: "ci: green reliant main — the apps e2e finds the deploy card in place, with no fold (#2441)"
        description: "[#2449](https://github.com/reliant-labs/reliant/pull/2449)"
      - title: "workflow: a stopped spawn is no longer repaired as stranded while its run reports the stop"
        description: "[#2452](https://github.com/reliant-labs/reliant/pull/2452)"
      - title: "spawn: accept providers sent as a JSON-encoded string"
        description: "[#2444](https://github.com/reliant-labs/reliant/pull/2444)"
      - title: "workflow: a worker stop retries the LLM turn instead of saving its partial as the answer"
        description: "[#2451](https://github.com/reliant-labs/reliant/pull/2451)"
      - title: "demo: keep mobile workload controls reachable and notices in flow"
        description: "[#2456](https://github.com/reliant-labs/reliant/pull/2456)"
