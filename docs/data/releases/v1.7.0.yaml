version: "v1.7.0"
date: "2026-08-19"
title: "The desktop app loads, and sign-in stops sending you to nowhere"
summary: "Fixes the release-blocking bugs found in v1.6.3: the packaged desktop app never rendered at all, OAuth handed identity providers a local address they could not reach, and a user whose machine failed to start was ejected out of onboarding with no way to reach settings or log out. Also closes two paths that could run a cloud machine without funding."
items:
  - title: "The packaged desktop app actually loads"
    description: "the renderer's JavaScript was never fetched. The bundle asks for /assets/… and the app loaded its page from the filesystem, where a root-absolute path resolves against the filesystem root rather than the app — so the window came up blank. It was invisible by construction: the page itself loaded fine, so every success signal fired. The renderer is now served over an app:// scheme, which also lets deep routes survive a reload. This had been broken since v1.4.1."
  - title: "OAuth no longer redirects to a local address"
    description: "sign-in sometimes came back to http://127.0.0.1:<random-port>/auth/callback. The desktop app was handing providers its own local origin, because the method meant to supply the real one was declared in the type definitions and never implemented — so the fallback ran every time. A browser at localhost keeps its origin, as web development requires; only the desktop app substitutes the hosted URL."
  - title: "Onboarding no longer ejects you mid-setup"
    description: "choosing a cloud machine navigated away from onboarding before the \"still starting\" screen could render, dropping the user into the project picker with setup marked complete and no machine. The picker is what showed the daemon list people mistook for a second onboarding flow."
  - title: "Settings and sign-out are reachable without a working machine"
    description: "the only link to settings lived in a sidebar that renders inside the main app shell, which needs a selected project, which needs a machine. A user whose machine failed to provision could not open settings or even log out. The header now carries a settings control on the picker, and onboarding has its own settings and sign-out row."
  - title: "Signing out no longer leaks onboarding state to the next account"
    description: "the checklist mirrored itself to device-wide storage that sign-out never cleared, so the second account on a machine inherited the first account's progress — which is how the API-key dialog could appear over a new user's onboarding."
  - title: "Cloud machines cannot run unfunded"
    description: "resuming a suspended machine did not re-check compute funding, and the background reconciler would republish a machine every five minutes with no funding check at all, racing the enforcement sweeper. Resume now refuses when funding cannot be confirmed; the reconciler suspends instead of resurrecting, and deliberately allows the machine through when the funding lookup itself errors so a database blip cannot suspend paying customers."
  - title: "Production CLI commands are copy-pasteable again"
    description: "the web UI printed every CLI command behind five environment-variable overrides, including the auth key, for a binary that already has all of those values compiled in. Production now shows the bare command."
  - title: "Per-provider sign-in feedback"
    description: "clicking Google also showed GitHub as connecting, since one shared flag drove every button. Each provider now tracks its own pending state, and the sign-in request no longer times out at ten seconds while the user is still on the provider's consent screen."
