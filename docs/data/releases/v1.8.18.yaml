version: "v1.8.18"
date: "2026-11-04"
title: "Faster chat opens, person-only approvals, terminals on the chat's machine"
summary: "Opening a chat is faster: its backlog replays in a few batches, only the errors in view are sent, and database connections stay warm. Only a person signed in to the app can decide an approval. A chat's terminal opens on the chat's machine and never hangs. Tool-result images and PDFs reach the model, and a stalled LLM stream is cut after 3 minutes and retried. Sessions, errors and traces show who and where, and link to each other."
sections:
  - title: "Added"
    items:
      - title: "observability: sessions, errors and traces show who and where; sessions and traces link both ways"
        description: "[#2149](https://github.com/reliant-labs/reliant/pull/2149)"
      - title: "web: a chat open reports when its transcript is on screen, joined to the server trace"
        description: "[#2173](https://github.com/reliant-labs/reliant/pull/2173)"
      - title: "chat: a scroll-back page brings the errors of the history it loads"
        description: "[#2171](https://github.com/reliant-labs/reliant/pull/2171)"
      - title: "approval: only a person signed in to the app can decide an approval (CLI, API and OAuth-client tokens refused)"
        description: "[#2175](https://github.com/reliant-labs/reliant/pull/2175)"
  - title: "Changed"
    items:
      - title: "stream: a chat open replays its delta backlog as a few batches, without thinking tokens"
        description: "[#2166](https://github.com/reliant-labs/reliant/pull/2166)"
      - title: "chat: GetWorkflowExecutions sends the newest root once"
        description: "[#2168](https://github.com/reliant-labs/reliant/pull/2168)"
      - title: "chat: a chat open sends only the errors inside its window, and none stack above it"
        description: "[#2170](https://github.com/reliant-labs/reliant/pull/2170)"
      - title: "db: keep 20 connections warm, topped up every 2s, so a chat open does not dial"
        description: "[#2172](https://github.com/reliant-labs/reliant/pull/2172)"
      - title: "privacy: disclose browser, OS, device type and app version in browser telemetry"
        description: "[#2176](https://github.com/reliant-labs/reliant/pull/2176)"
  - title: "Fixed"
    items:
      - title: "tools: tool-result images and PDFs reach the model"
        description: "[#2165](https://github.com/reliant-labs/reliant/pull/2165)"
      - title: "electron: pin @reliantlabs/forge-web-runtime ^0.13.1 (was ^0.10.2)"
        description: "[#2169](https://github.com/reliant-labs/reliant/pull/2169)"
      - title: "web: desktop composer status band expands inline again; the sheet is phone-only"
        description: "[#2174](https://github.com/reliant-labs/reliant/pull/2174)"
      - title: "llm: cut a stream with no output token after 3 minutes, for retry"
        description: "[#2145](https://github.com/reliant-labs/reliant/pull/2145)"
      - title: "terminal: a chat's terminal opens on the chat's machine, says which, and never hangs"
        description: "[#2147](https://github.com/reliant-labs/reliant/pull/2147)"
