version: "v1.21.0"
date: "2026-11-14"
title: "6 new features, 1 fix and 2 other changes"
summary: "Every pull request merged since v1.20.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: your own spend against the org's limits on the Policies page, with the G2 contract vendored (org-policies W1)"
        description: "[#2763](https://github.com/reliant-labs/reliant/pull/2763)"
      - title: "mcp: Reliant Forge connector at /forge/mcp — forge's account tools under a forge connector grant"
        description: "[#2716](https://github.com/reliant-labs/reliant/pull/2716)"
      - title: "sdk: a funding warning on creating or enabling an automation no organization account can run yet (protos)"
        description: "[#2776](https://github.com/reliant-labs/reliant/pull/2776)"
      - title: "orgs: GetPolicyImpact previews how many of the org's chats a proposed provider and model policy would refuse (org-policies R2)"
        description: "[#2772](https://github.com/reliant-labs/reliant/pull/2772)"
      - title: "orgs: an enforced automations policy replaces an automation's unattended-funding stamp (P11, §11.3)"
        description: "[#2774](https://github.com/reliant-labs/reliant/pull/2774)"
      - title: "orgs: org admins with billing:read see the AI usage the org pays for; GetLLMUsage gains org_id and funding/account breakdowns (org-provider-accounts P9)"
        description: "[#2775](https://github.com/reliant-labs/reliant/pull/2775)"
  - title: "Changed"
    items:
      - title: "merge-gate: scoped forge lint in the merge queue, vitest on a FULL web fallback, and the forge demo build"
        description: "[#2726](https://github.com/reliant-labs/reliant/pull/2726)"
      - title: "org-notify: a suppressed NotifyOrgAdmins answer settles the incident and is never resent"
        description: "[#2783](https://github.com/reliant-labs/reliant/pull/2783)"
  - title: "Fixed"
    items:
      - title: "temporal: the deadlock-pausing converter names workflow.Context, which temporal sdk v1.51 still exports"
        description: "[#2777](https://github.com/reliant-labs/reliant/pull/2777)"
