version: "v1.30.0"
date: "2026-11-24"
title: "7 new features, 3 fixes and 2 other changes"
summary: "Every pull request merged since v1.29.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "llm-usage: record each model call's run, node, project, provider request id, time to first token and cost"
        description: "[#3475](https://github.com/reliant-labs/reliant/pull/3475)"
      - title: "telemetry: trigger.fire spans on every fire path, skips included"
        description: "[#3289](https://github.com/reliant-labs/reliant/pull/3289)"
      - title: "sharing: share saved workflows with the org (SetWorkflowDraftSharing)"
        description: "[#3306](https://github.com/reliant-labs/reliant/pull/3306)"
      - title: "telemetry: record the LLM gateway's call id on every gateway-routed chat span"
        description: "[#3484](https://github.com/reliant-labs/reliant/pull/3484)"
      - title: "workflows: accept an observe: block on any node and the workflow (release A: schema, tolerant reader, lint)"
        description: "[#3478](https://github.com/reliant-labs/reliant/pull/3478)"
      - title: "web: a floating Setup Guide for the whole app, a Help row beside Settings, and the workflows outro fits the one shell"
        description: "[#3377](https://github.com/reliant-labs/reliant/pull/3377)"
      - title: "collab: attribution columns, approvalkind min_role and the transcript author-tag renderer (chat collaboration C1)"
        description: "[#3480](https://github.com/reliant-labs/reliant/pull/3480)"
  - title: "Changed"
    items:
      - title: "web: expect canonical project scope in responsive composer URLs"
        description: "[#3488](https://github.com/reliant-labs/reliant/pull/3488)"
      - title: "web: the shell reads a session port, not the auth store"
        description: "[#3494](https://github.com/reliant-labs/reliant/pull/3494)"
  - title: "Fixed"
    items:
      - title: "web: mobile project pickers follow the URL"
        description: "[#3477](https://github.com/reliant-labs/reliant/pull/3477)"
      - title: "web: the workflow serializer keeps daemon, outcome, tolerate_failure and observe"
        description: "[#3486](https://github.com/reliant-labs/reliant/pull/3486)"
      - title: "proto: reads whose response carries a secret or is per-call are not NO_SIDE_EFFECTS"
        description: "[#3466](https://github.com/reliant-labs/reliant/pull/3466)"
