version: "v1.33.0"
date: "2026-11-26"
title: "7 new features, 18 fixes and 17 other changes"
summary: "Every pull request merged since v1.32.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: label Experiments (Forge Changes) Beta in the nav and on its pages"
        description: "[#3623](https://github.com/reliant-labs/reliant/pull/3623)"
      - title: "web: every chart is highlightable: sparklines on UPlotChart, hover on HeadlineBars and heatmaps"
        description: "[#3626](https://github.com/reliant-labs/reliant/pull/3626)"
      - title: "web: first signed-in Forge Change — pending-provider banner copy (unit user), launch is a separate console step"
        description: "[#3639](https://github.com/reliant-labs/reliant/pull/3639)"
      - title: "db: pipeline enrolment and settings tables (inert)"
        description: "[#3660](https://github.com/reliant-labs/reliant/pull/3660)"
      - title: "mergequeue: GitHub and git ports with a git-backed fake GitHub (test-only)"
        description: "[#3658](https://github.com/reliant-labs/reliant/pull/3658)"
      - title: "pipeline: pipeline.yaml v1 schema, parser and defaults (unused)"
        description: "[#3659](https://github.com/reliant-labs/reliant/pull/3659)"
      - title: "workflow: concurrency.cancel_running supersedes a key's running run"
        description: "[#3666](https://github.com/reliant-labs/reliant/pull/3666)"
  - title: "Changed"
    items:
      - title: "runevents: the run-event emitter takes its own store; the activities and the reconciler stop reaching it through the facade"
        description: "[#3608](https://github.com/reliant-labs/reliant/pull/3608)"
      - title: "web: AccessTokenService calls run on its generated hooks"
        description: "[#3534](https://github.com/reliant-labs/reliant/pull/3534)"
      - title: "facade: plan, task and attachment rpcs run on forge CRUD"
        description: "[#3253](https://github.com/reliant-labs/reliant/pull/3253)"
      - title: "chatupdates: the plan, task, dependency and worktree tools announce through a Refetcher backed by chatupdates"
        description: "[#3373](https://github.com/reliant-labs/reliant/pull/3373)"
      - title: "hosting: link the public status page from Limits"
        description: "[#3619](https://github.com/reliant-labs/reliant/pull/3619)"
      - title: "db: test fixtures and the activation restore write triggers through the generated store, and the facade's CreateTrigger and UpdateTrigger are deleted"
        description: "[#3581](https://github.com/reliant-labs/reliant/pull/3581)"
      - title: "forge: feature flags and experiments (Forge Changes, beta)"
        description: "[#3620](https://github.com/reliant-labs/reliant/pull/3620)"
      - title: "hosting: document static sites' _redirects file"
        description: "[#3624](https://github.com/reliant-labs/reliant/pull/3624)"
      - title: "hosting: the free static tier is one org per person with no site limit"
        description: "[#3638](https://github.com/reliant-labs/reliant/pull/3638)"
      - title: "db: GetWorkflow leaves the facade; the chat handler and runs read workflows through their WorkflowLoader"
        description: "[#3640](https://github.com/reliant-labs/reliant/pull/3640)"
      - title: "pin: forge@83053473 (v1.11.0 + the fresh-user funnel fixes)"
        description: "[#3645](https://github.com/reliant-labs/reliant/pull/3645)"
      - title: "idlereclaim: no detached git maintenance races the harness's age walk (rc-red v1.33.0-rc.2)"
        description: "[#3652](https://github.com/reliant-labs/reliant/pull/3652)"
      - title: "trigger: the trigger handler reads rows, firings and registrations through generated stores"
        description: "[#3642](https://github.com/reliant-labs/reliant/pull/3642)"
      - title: "chatupdates: question updates go through chatupdates; CreateQuestion and ResolveQuestion put their own on the feed"
        description: "[#3667](https://github.com/reliant-labs/reliant/pull/3667)"
      - title: "db: GetChat and GetChatRow leave the facade; every caller reads the generated chat store"
        description: "[#3651](https://github.com/reliant-labs/reliant/pull/3651)"
      - title: "what Reliant replaces, and how one declared model does it"
        description: "[#3670](https://github.com/reliant-labs/reliant/pull/3670)"
      - title: "pin: forge@f76d611 (graph variant reach, ci.license, affected rules, stale-flake closing, real license check)"
        description: "[#3636](https://github.com/reliant-labs/reliant/pull/3636)"
  - title: "Fixed"
    items:
      - title: "projects: a clone onto another machine never takes a path it cannot create, and a GitHub SSH remote clones over https"
        description: "[#3616](https://github.com/reliant-labs/reliant/pull/3616)"
      - title: "release: rc-shape accepts a fix merged onto an RC branch (matches control-plane check-pin-ancestry, cp#3641)"
        description: "[#3582](https://github.com/reliant-labs/reliant/pull/3582)"
      - title: "web: rename modules that differ only by case from their neighbours"
        description: "[#3615](https://github.com/reliant-labs/reliant/pull/3615)"
      - title: "web: one New chat per sidebar heading; the main checkout's is the project's"
        description: "[#3628](https://github.com/reliant-labs/reliant/pull/3628)"
      - title: "web: a sub-agent row's title opens its thread"
        description: "[#3629](https://github.com/reliant-labs/reliant/pull/3629)"
      - title: "web: the nav's footer stays in a short window on macOS"
        description: "[#3632](https://github.com/reliant-labs/reliant/pull/3632)"
      - title: "web: the phone's chat home opens on the URL's scope, not the desktop frame's"
        description: "[#3617](https://github.com/reliant-labs/reliant/pull/3617)"
      - title: "worktreereclaim: finish interrupted deletions; shared hard links, sandbox inits and own rollbacks no longer hold every reclaim"
        description: "[#3643](https://github.com/reliant-labs/reliant/pull/3643)"
      - title: "prove_test: say when the command ran above the repository holding the files"
        description: "[#3649](https://github.com/reliant-labs/reliant/pull/3649)"
      - title: "workflow: a missing workflow, a sign-in the user must refresh and a sub-agent ended on a provider overload are not ERROR issues"
        description: "[#3655](https://github.com/reliant-labs/reliant/pull/3655)"
      - title: "workflow: a message that reaches a sub-agent after its last turn gets a turn before it completes"
        description: "[#3662](https://github.com/reliant-labs/reliant/pull/3662)"
      - title: "tools: tools that act as the user see the run's session on every worker, not only the one that ran the turn"
        description: "[#3648](https://github.com/reliant-labs/reliant/pull/3648)"
      - title: "web: Changes panel sync buttons match the Commit button's height; plan mode calls the autonomous mode Default"
        description: "[#3635](https://github.com/reliant-labs/reliant/pull/3635)"
      - title: "workflow: retry PreflightDaemonCheck on a lost heartbeat instead of failing the run"
        description: "[#3664](https://github.com/reliant-labs/reliant/pull/3664)"
      - title: "prompt: tell agents a chat's agent-id scratch subdirectories are not theirs to delete"
        description: "[#3679](https://github.com/reliant-labs/reliant/pull/3679)"
      - title: "workflow: recognize released run steps as worker shutdown fallout"
        description: "[#3695](https://github.com/reliant-labs/reliant/pull/3695)"
      - title: "worktreereclaim: retire a checkout whose gitignored never-listed files the main checkout holds copies of"
        description: "[#3646](https://github.com/reliant-labs/reliant/pull/3646)"
      - title: "web: shop app pack answers the Inbox, the cloud machine's build and every read a page makes"
        description: "[#3687](https://github.com/reliant-labs/reliant/pull/3687)"
