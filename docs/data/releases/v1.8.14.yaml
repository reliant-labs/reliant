version: "v1.8.14"
date: "2026-10-30"
title: "Faster chat lists, steadier workflow streams"
summary: "Chat and inbox reads do less work, slow heartbeat requests no longer terminate an active model stream, and archiving a chat stops its run and clears queued delivery."
items:
  - title: "Read chat and inbox lists more efficiently"
    description: "Chat and inbox reads probe activity per chat instead of hashing every user's rows, reducing database work."
  - title: "Keep streaming through a slow heartbeat"
    description: "A slow workflow heartbeat RPC no longer kills a running model stream."
  - title: "Archive chats without leaving queued work behind"
    description: "Archiving a chat drops its queued delivery and stops its run under the run-control lock."
  - title: "Share filesystem watchers across worktrees"
    description: "Worktree activity observers share one inotify instance and release deleted worktrees."
  - title: "Distinguish expected errors from product issues"
    description: "Expected conditions are reported as user errors rather than being filed as issues."
