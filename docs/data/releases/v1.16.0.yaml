version: "v1.16.0"
date: "2026-11-11"
title: "3 new features, 1 fix and 4 other changes"
summary: "Every pull request merged since v1.15.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "retention: compact chat update logs and prune finished runs' internal steps"
        description: "[#2536](https://github.com/reliant-labs/reliant/pull/2536)"
      - title: "console: forge's built-in product dashboards in the demo, and a Users card on the Overview"
        description: "[#2597](https://github.com/reliant-labs/reliant/pull/2597)"
      - title: "inbox: keep or reclaim now a worktree marked to be reclaimed"
        description: "[#2584](https://github.com/reliant-labs/reliant/pull/2584)"
  - title: "Changed"
    items:
      - title: "handlers, streaming, daemonstate, …: wait on events, not the wall clock"
        description: "[#2616](https://github.com/reliant-labs/reliant/pull/2616)"
      - title: "toolexec: wait on events, not the wall clock"
        description: "[#2614](https://github.com/reliant-labs/reliant/pull/2614)"
      - title: "llm, daemonruntime: wait on events, not the wall clock"
        description: "[#2615](https://github.com/reliant-labs/reliant/pull/2615)"
      - title: "workflow, triggers, auth, …: wait on events, not the wall clock"
        description: "[#2617](https://github.com/reliant-labs/reliant/pull/2617)"
  - title: "Fixed"
    items:
      - title: "gateway: re-subscribe NATS subscriptions the broker refused, with capped backoff"
        description: "[#2618](https://github.com/reliant-labs/reliant/pull/2618)"
