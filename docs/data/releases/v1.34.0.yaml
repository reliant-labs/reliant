version: "v1.34.0"
date: "2026-11-27"
title: "8 new features, 9 fixes and 2 other changes"
summary: "Every pull request merged since v1.33.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "mergequeue: dispatch a batch's gate to a gate pool member and wait for its verdict (unused)"
        description: "[#3820](https://github.com/reliant-labs/reliant/pull/3820)"
      - title: "mergequeue: wire the gate runner, gate.allow_unisolated and a per-repo runner (inert)"
        description: "[#3847](https://github.com/reliant-labs/reliant/pull/3847)"
      - title: "mergequeue: lander with tree checks, GitHub REST port, display check (unenforced until the Queue App exists)"
        description: "[#3848](https://github.com/reliant-labs/reliant/pull/3848)"
      - title: "mergequeue: run the merge queue in the worker behind pipeline.enabled (inert)"
        description: "[#3854](https://github.com/reliant-labs/reliant/pull/3854)"
      - title: "pipeline: builtin://pipeline-pr-sweep and sweep.pr@1, the daily PR sweep (inert)"
        description: "[#3859](https://github.com/reliant-labs/reliant/pull/3859)"
      - title: "workflow: record_due trigger fires once per due pipeline row (inert)"
        description: "[#3853](https://github.com/reliant-labs/reliant/pull/3853)"
      - title: "mergequeue: gate image and a per-repo warm cache for opted-in runc gates"
        description: "[#3861](https://github.com/reliant-labs/reliant/pull/3861)"
      - title: "pipeline: pipeline-pr wakes on its record_due row"
        description: "[#3863](https://github.com/reliant-labs/reliant/pull/3863)"
  - title: "Changed"
    items:
      - title: "pipeline: opt in to unisolated runc gates until sysbox gate machines exist"
        description: "[#3858](https://github.com/reliant-labs/reliant/pull/3858)"
      - title: "db: drop the pinned-base migration version test #3846's fixer added"
        description: "[#3850](https://github.com/reliant-labs/reliant/pull/3850)"
  - title: "Fixed"
    items:
      - title: "pipeline: the API server takes only pipeline.enabled, so the queue's caller secret reaches the worker alone"
        description: "[#3860](https://github.com/reliant-labs/reliant/pull/3860)"
      - title: "attachments: serve uploads as attachments unless the sniffed type is inline-safe"
        description: "[#3840](https://github.com/reliant-labs/reliant/pull/3840)"
      - title: "mergequeue: one warm cache per repository, never a volume the gate backend did not create"
        description: "[#3862](https://github.com/reliant-labs/reliant/pull/3862)"
      - title: "mergequeue: the gate image carries git 2.47, which the merge queue's gitport needs"
        description: "[#3866](https://github.com/reliant-labs/reliant/pull/3866)"
      - title: "reliant main's release gate (config-deps lint, inbox test race)"
        description: "[#3871](https://github.com/reliant-labs/reliant/pull/3871)"
      - title: "mergequeue: gates get the warm cache and the batch's base commit; cliupdate tests are hermetic"
        description: "[#3872](https://github.com/reliant-labs/reliant/pull/3872)"
      - title: "workflow: name the rejected concurrency.cancel_running value"
        description: "[#3837](https://github.com/reliant-labs/reliant/pull/3837)"
      - title: "workflow: name the rejected concurrency.waiting value"
        description: "[#3826](https://github.com/reliant-labs/reliant/pull/3826)"
      - title: "electron: retire the alpha update channel; every install follows latest"
        description: "[#3773](https://github.com/reliant-labs/reliant/pull/3773)"
