version: "v1.19.0"
date: "2026-11-14"
title: "8 new features, 9 fixes and 2 other changes"
summary: "Every pull request merged since v1.18.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "orgs: email an org's owners and admins, durably, when a provider rejects an org API key"
        description: "[#2727](https://github.com/reliant-labs/reliant/pull/2727)"
      - title: "cli: reliant trigger get shows the activation's acting identity"
        description: "[#2734](https://github.com/reliant-labs/reliant/pull/2734)"
      - title: "triggers: an org_only automation no org account can run fails at launch with no_org_account, and pauses on the second in a row"
        description: "[#2740](https://github.com/reliant-labs/reliant/pull/2740)"
      - title: "llm: an org_only run with no org account pauses with the reason, and an org account change wakes the org's blocked chats"
        description: "[#2741](https://github.com/reliant-labs/reliant/pull/2741)"
      - title: "chat: offer the running agents when a run refuses a message as ambiguous, and send to the one picked (#2465)"
        description: "[#2743](https://github.com/reliant-labs/reliant/pull/2743)"
      - title: "orgs: approval floors and forced credentials:none, shipped in audit (org-policies R5)"
        description: "[#2714](https://github.com/reliant-labs/reliant/pull/2714)"
      - title: "sdk: inbox items for an automation paused with no org account, and for automations still on personal accounts (protos)"
        description: "[#2746](https://github.com/reliant-labs/reliant/pull/2746)"
      - title: "orgs: a new daemon honours the org stamp — no disallowed MCP spawn, credentials:none terminals (org-policies D1)"
        description: "[#2722](https://github.com/reliant-labs/reliant/pull/2722)"
  - title: "Changed"
    items:
      - title: "e2e: delete the flaky step-10 Next of the forge-shell journey walk (reliant main red, flake:removed #2749)"
        description: "[#2750](https://github.com/reliant-labs/reliant/pull/2750)"
      - title: "pin: forge@7c169e58 with graph reach and rollback fixes"
        description: "[#2711](https://github.com/reliant-labs/reliant/pull/2711)"
  - title: "Fixed"
    items:
      - title: "web: a human forge login sends no org to /oauth/approve"
        description: "[#2733](https://github.com/reliant-labs/reliant/pull/2733)"
      - title: "workflow: validation refuses an inline body's read of an enclosing graph's node"
        description: "[#2738](https://github.com/reliant-labs/reliant/pull/2738)"
      - title: "daemon: pin that a released ExecDeadline survives a parent cancel that wins the watcher's select (#2731)"
        description: "[#2735](https://github.com/reliant-labs/reliant/pull/2735)"
      - title: "workflow: no 'matches nothing' warning for a scoped input with a non-empty default"
        description: "[#2737](https://github.com/reliant-labs/reliant/pull/2737)"
      - title: "workflow: parallel edit_workflow calls on one workflow both apply"
        description: "[#2742](https://github.com/reliant-labs/reliant/pull/2742)"
      - title: "workflow: get_workflow pages a large workflow in whole lines"
        description: "[#2744](https://github.com/reliant-labs/reliant/pull/2744)"
      - title: "triggers: trigger.origin attributes a workflow's own label echo on a pull request"
        description: "[#2745](https://github.com/reliant-labs/reliant/pull/2745)"
      - title: "workflow: a user's misconfigured workflow, refused prompt or stale selection is not an ERROR issue"
        description: "[#2758](https://github.com/reliant-labs/reliant/pull/2758)"
      - title: "merge-gate: name tsc errors and show a failed phase's log tail in the gate report"
        description: "[#2760](https://github.com/reliant-labs/reliant/pull/2760)"
