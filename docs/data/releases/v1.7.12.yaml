version: "v1.7.12"
date: "2026-09-10"
title: "Choosing a machine tells you what you get, buying credit is one screen, and running low no longer takes you by surprise"
summary: "Onboarding does less guessing on your behalf. Each machine size now says how much CPU and memory it actually has, the free option sits with the paid ones instead of below them, and buying credit happens on a single screen rather than handing you off partway through. The app also warns you before your balance runs out, and shows the processing fee before you pay rather than after."
items:
  - title: "Machine sizes now say what you are getting"
    description: "The sizes were named Small through XL with a price and nothing else, so choosing one meant guessing what was behind the name. Each option now states its memory and CPU — 4 GB RAM and 1 CPU for Medium, for instance — along with how far it can burst above that when a build needs the headroom. Memory and CPU stretch by different amounts, and the page says so separately rather than rounding both to one reassuring number."
  - title: "Running on your own computer is presented as a normal choice"
    description: "The option to use your own machine sat below a divider, after the paid sizes, which read as a footnote rather than an alternative. It now appears first, in the same list as everything else, with the instructions for connecting it directly beneath. Choosing it no longer scrolls you past a card you had already decided against."
  - title: "Buying credit happens on one screen"
    description: "Payment used to hand you off to a separate embedded checkout partway through, which meant the price you were agreeing to and the details you were entering lived on different screens. Both now sit together on a single card, so what you are buying stays visible while you pay for it."
  - title: "The processing fee is shown before you pay"
    description: "A processing fee is added to credit purchases. It was previously only visible after the fact, including on automatic top-ups, where the amount charged and the amount credited quietly differed. Both figures are now shown at the point of purchase, on manual purchases and automatic ones alike."
  - title: "You are warned before your credit runs out"
    description: "Running out of credit was something you discovered by being stopped. The app now shows an indicator when your balance is within about a week of empty, based on how quickly you have been spending, and explains what has happened if you do reach zero rather than simply refusing to continue."
  - title: "Signed-out screens stop retrying in the background"
    description: "After signing out, parts of the app kept polling for data they were no longer allowed to fetch, producing a stream of failed requests behind an otherwise idle screen. Those requests now stop when the session does."
  - title: "The background command tools have consistent names"
    description: "The tools for running and managing background commands were named inconsistently — some after the shell they happened to use, others after what they do. They now share one naming scheme. Behaviour is unchanged; only the names differ."
