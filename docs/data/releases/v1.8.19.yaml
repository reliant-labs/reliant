version: "v1.8.19"
date: "2026-11-05"
title: "Workflow secrets, lossless terminals, plan changes and onboarding journeys"
summary: "Workflows can declare secrets that authenticate a step's request without ever appearing in its output. Terminal output is no longer dropped, and a slow machine no longer resets every open terminal. Machine subscribers can change plan in the app, with today's prorated charge shown first. Onboarding becomes two guided journeys, the settings menu is regrouped, and the Workflows list is decluttered. The dashboard panel editor builds every panel kind and style, and the observability console shows each session's device, client and app version."
sections:
  - title: "Added"
    items:
      - title: "workflows: declare secrets by name and environment; they authenticate a step's request through a credential slot and never appear in text a step can print or return"
        description: "[#2037](https://github.com/reliant-labs/reliant/pull/2037)"
      - title: "web: existing machine subscribers change plan in the app, with today's prorated charge shown before they confirm"
        description: "[#2151](https://github.com/reliant-labs/reliant/pull/2151)"
      - title: "web: onboarding offers two guided journeys, \"Use AI workflows\" and \"Explore a forge app\", from a picker"
        description: "[#2206](https://github.com/reliant-labs/reliant/pull/2206)"
      - title: "web: the dashboard panel editor builds every panel kind and display style the renderer draws"
        description: "[#2152](https://github.com/reliant-labs/reliant/pull/2152)"
      - title: "observability: sessions, traces and errors show device, client and app version; filter by browser, OS and build"
        description: "[#2167](https://github.com/reliant-labs/reliant/pull/2167)"
      - title: "sdk: @reliantlabs/sdk, a TypeScript client for Reliant's API; the web app's live streams now run on it"
        description: "[#2196](https://github.com/reliant-labs/reliant/pull/2196)"
  - title: "Changed"
    items:
      - title: "web: the settings menu is regrouped into Account, AI, Connections, Machines & projects, Preferences and a collapsed Advanced group"
        description: "[#2216](https://github.com/reliant-labs/reliant/pull/2216)"
      - title: "web: the Workflows list shows each ready-made Autopilot workflow once and hides columns with no values"
        description: "[#2217](https://github.com/reliant-labs/reliant/pull/2217)"
      - title: "web: the execution-mode selector no longer lists \"auto\"; it stays the default"
        description: "[#2203](https://github.com/reliant-labs/reliant/pull/2203)"
      - title: "chat: chats with many sub-agents open faster: their spawn links read a chat-scoped index"
        description: "[#2161](https://github.com/reliant-labs/reliant/pull/2161)"
      - title: "docs: who can decide an approval, including the shared-key limitation of self-hosted API-key mode"
        description: "[#2183](https://github.com/reliant-labs/reliant/pull/2183)"
      - title: "docs: Deploy without an account (forge env deploy --claimable)"
        description: "[#2213](https://github.com/reliant-labs/reliant/pull/2213)"
  - title: "Fixed"
    items:
      - title: "terminal: output is never dropped silently, so TUIs no longer render garbage; bursts go out in fewer frames"
        description: "[#2210](https://github.com/reliant-labs/reliant/pull/2210)"
      - title: "web: a slow wake probe on a busy machine no longer replaces every open terminal with a new shell"
        description: "[#2209](https://github.com/reliant-labs/reliant/pull/2209)"
      - title: "web: the file tree no longer re-reads paths it cannot list on every file change"
        description: "[#2207](https://github.com/reliant-labs/reliant/pull/2207)"
      - title: "daemon: a command the machine cannot fork says the process table is full"
        description: "[#2185](https://github.com/reliant-labs/reliant/pull/2185)"
      - title: "daemon: a project whose pinned forge is too old no longer re-runs that forge on every config poll"
        description: "[#2208](https://github.com/reliant-labs/reliant/pull/2208)"
      - title: "web: a 401 that does not reject an API key no longer signs the API-key session out"
        description: "[#2182](https://github.com/reliant-labs/reliant/pull/2182)"
      - title: "web: a refused telemetry read shows the server's reason instead of blaming the user's role"
        description: "[#2186](https://github.com/reliant-labs/reliant/pull/2186)"
      - title: "web: onboarding download buttons read as enabled, commands have copy buttons, providers show their logos, and machine start states are accurate"
        description: "[#2202](https://github.com/reliant-labs/reliant/pull/2202)"
      - title: "security: bump golang.org/x/net (HTML parsing in the fetch tool) and dompurify"
        description: "[#2115](https://github.com/reliant-labs/reliant/pull/2115)"
