version: "v1.8.1"
date: "2026-10-11"
title: "Messages that always arrive, GPT-6.1, and cloud machines you can resize"
summary: "The first published build of Reliant 1.8, so it carries everything in the 1.8.0 notes: forge, cloud dev-boxes, connected workflows and the web app. On top of that, a message you send is no longer lost when your machine is asleep or a run fails to start, GPT-6.1 models are available, cloud machines can be resized from settings, and a fresh chat starts with far less duplicated context."
items:
  - title: "A message you send always arrives"
    description: "A message sent while your machine was down, or while a run was failing to start, could disappear. It now waits for the machine and is delivered once it is back, and a run that stalls carries your message on rather than dropping it. A new chat's first message shows at once, a send that does fail says Not sent with a Retry button, and sending the same message twice can no longer post it twice."
  - title: "GPT-6.1 models are available"
    description: "GPT-6.1 models join the model list, and gpt-6.1-sol, gpt-6-sol and gpt-6-luna are offered through Codex. A send never refuses a model its provider cannot serve: it moves to the same tier on a provider you have connected. Every model and provider pair now uses its published context window and output limit."
  - title: "Resize a cloud machine from settings"
    description: "Cloud machines can be resized from settings. A workflow that starts while its machine is waking now waits for it instead of failing, Try again on a failed machine actually resumes it, and a machine whose workspace volume was lost restarts its container instead of sitting broken."
  - title: "Git credentials are fetched when needed and never stored on the machine"
    description: "A cloud machine now asks for your current git token at the moment it needs one, instead of keeping a token on disk."
  - title: "A fresh chat starts lighter"
    description: "About 150,000 tokens of duplicated memory and skills no longer load into every new chat, and conversations no longer get stuck repeatedly compacting their history without making progress."
  - title: "Smaller fixes"
    description: "Disconnecting a provider says which one and confirms the rest stay connected. A stale page no longer freezes a tab in an update loop. A long press on mobile no longer starts a text selection that hides the actions sheet."
