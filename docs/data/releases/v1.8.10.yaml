version: "v1.8.10"
date: "2026-10-29"
title: "Device login and richer observability"
summary: "Sign in with a device code, inspect traces and RPC traffic, and browse more consistent tables. Conversation streaming and tool-command recovery are more reliable."
items:
  - title: "Sign in with a device code"
    description: "The CLI supports device-code login, and daemon credentials inherit the signed-in user's scopes."
  - title: "Inspect traces and RPC traffic"
    description: "New tracing, RPC explorer, service graph, errors, and alerts views help explain what the system is doing."
  - title: "Browse consistent tables and custom-domain links"
    description: "Shared tables bring consistent navigation across the web interface, including custom-domain links."
  - title: "Recover tool commands without duplicate execution"
    description: "Shell commands are resent only when there is proof they never ran, and pending daemon commands are delivered when their consumer is created."
  - title: "Keep conversations responsive"
    description: "Streaming snapshot and replay work is reduced, and agent messaging supports a subject."
