version: "v1.8.0"
date: "2026-10-08"
title: "Our biggest update yet"
summary: "Reliant now ships with forge, cloud dev-boxes that keep your agents working while you sleep, and workflows that connect to the tools you already use."
items:
  - title: "Forge: production-grade code from the first prompt"
    description: "Reliant now includes forge, a scaffolding framework that keeps your LLM writing production-grade code."
  - title: "Cloud dev-boxes that work while you sleep"
    description: "Reliant dev-boxes are hosted in the cloud, so your agents keep working after you close your laptop."
  - title: "Workflows that connect to GitHub, Slack, Gmail and more"
    description: "Workflows can now start on a schedule, a webhook, or an event in GitHub, Slack, Gmail or Twilio, and they can act in those tools too."
  - title: "Run Reliant from the web, your phone, or the desktop"
    description: "Start and follow your agents from the web app at app.reliantlabs.io, from your phone's browser, or from the desktop app, all on the same chats."
  - title: "Update your desktop app"
    description: "Desktop versions older than 1.8.0 can no longer start new chats. The app offers the update on its next launch, or run brew upgrade --cask reliant."
