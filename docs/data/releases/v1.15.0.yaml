version: "v1.15.0"
date: "2026-11-11"
title: "21 new features, 14 fixes and 11 other changes"
summary: "Every pull request merged since v1.14.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "worktreereclaim: an Inbox approval delivered by the server removes the approved worktree; approvals.json alone never does"
        description: "[#2559](https://github.com/reliant-labs/reliant/pull/2559)"
      - title: "web: org members page, invitations, accept-invite and create organization"
        description: "[#2501](https://github.com/reliant-labs/reliant/pull/2501)"
      - title: "orgs: projects, chats, saved workflows, triggers and runs belong to one org, and the org boundary is enforced"
        description: "[#2537](https://github.com/reliant-labs/reliant/pull/2537)"
      - title: "console: tighten the Overview and Dashboards, one field style for every input"
        description: "[#2568](https://github.com/reliant-labs/reliant/pull/2568)"
      - title: "desktop: sidebar update button, and a Check for Updates menu item that always answers"
        description: "[#2561](https://github.com/reliant-labs/reliant/pull/2561)"
      - title: "dashboards: standard dashboards show as built-ins, not templates"
        description: "[#2499](https://github.com/reliant-labs/reliant/pull/2499)"
      - title: "daemon: remove and reclone of a checkout are durable operations the machine acknowledges"
        description: "[#2549](https://github.com/reliant-labs/reliant/pull/2549)"
      - title: "sdk: an inbox item kind for worktrees marked to be reclaimed (protos, PR A)"
        description: "[#2581](https://github.com/reliant-labs/reliant/pull/2581)"
      - title: "web: people × environments permission grid in Settings › Members"
        description: "[#2583](https://github.com/reliant-labs/reliant/pull/2583)"
      - title: "sdk: Trigger.paused_reason, why Reliant paused a trigger itself (protos, PR A)"
        description: "[#2585](https://github.com/reliant-labs/reliant/pull/2585)"
      - title: "web: navigate explicit Data and Identity subjects"
        description: "[#2382](https://github.com/reliant-labs/reliant/pull/2382)"
      - title: "worktrees: the daemon places, reports and honours a reclaim tombstone"
        description: "[#2579](https://github.com/reliant-labs/reliant/pull/2579)"
      - title: "web: lists, the user stream and machine pickers follow the active org"
        description: "[#2586](https://github.com/reliant-labs/reliant/pull/2586)"
      - title: "web: name each dashboard panel's read with Forge-Panel"
        description: "[#2150](https://github.com/reliant-labs/reliant/pull/2150)"
      - title: "worktrees: reclaim in two phases: mark a quiet worktree, reclaim it a day later only if nothing contradicted the mark"
        description: "[#2580](https://github.com/reliant-labs/reliant/pull/2580)"
      - title: "triggers: pause a trigger whose creator left its org (creator_left_org) instead of failing every firing"
        description: "[#2587](https://github.com/reliant-labs/reliant/pull/2587)"
      - title: "sdk: org_id on ListArchivedChats, SearchChats and ListInbox requests (protos, PR A)"
        description: "[#2589](https://github.com/reliant-labs/reliant/pull/2589)"
      - title: "console: Dashboards is a compact dashboard browser; a brighter console text ramp"
        description: "[#2596](https://github.com/reliant-labs/reliant/pull/2596)"
      - title: "console: a top-level Users page for who can sign in to each environment"
        description: "[#2594](https://github.com/reliant-labs/reliant/pull/2594)"
      - title: "worktrees: under disk pressure a reclaim mark needs an hour of quiet and stands an hour"
        description: "[#2598](https://github.com/reliant-labs/reliant/pull/2598)"
      - title: "workflows: a run waiting on a provider no longer counts against concurrency.max_running"
        description: "[#2602](https://github.com/reliant-labs/reliant/pull/2602)"
  - title: "Changed"
    items:
      - title: "remove unreachable Go packages and dead code"
        description: "[#2566](https://github.com/reliant-labs/reliant/pull/2566)"
      - title: "db: drop chat_updates and messages indexes nothing reads (~2.3 GB)"
        description: "[#2564](https://github.com/reliant-labs/reliant/pull/2564)"
      - title: "deps: pin sdk/go to #2537's squash commit on main"
        description: "[#2575](https://github.com/reliant-labs/reliant/pull/2575)"
      - title: "web: a chat switch sends its stream before rendering the cached transcript"
        description: "[#2572](https://github.com/reliant-labs/reliant/pull/2572)"
      - title: "web: lift the catch-up overlay the frame the timeline is usable; time mobile chat opens"
        description: "[#2565](https://github.com/reliant-labs/reliant/pull/2565)"
      - title: "privacy: draft help text for cookieless visitor counting on hosted apps"
        description: "[#2577](https://github.com/reliant-labs/reliant/pull/2577)"
      - title: "chat: materialize the chat snapshot's update heads in chat_update_heads"
        description: "[#2569](https://github.com/reliant-labs/reliant/pull/2569)"
      - title: "pin: forge de8e6d23 for coherent root command compatibility"
        description: "[#2512](https://github.com/reliant-labs/reliant/pull/2512)"
      - title: "add a Connect action to Settings → Integrations"
        description: "[#2582](https://github.com/reliant-labs/reliant/pull/2582)"
      - title: "worktreereclaim: remove the flaky sandbox-init ledger test (#2590)"
        description: "[#2591](https://github.com/reliant-labs/reliant/pull/2591)"
      - title: "workflows: pin that an unattended give-up runs on_failure and a driver-pinned reviewer falls back"
        description: "[#2606](https://github.com/reliant-labs/reliant/pull/2606)"
  - title: "Fixed"
    items:
      - title: "db: prod keeps 20 idle connections warm, as #2172 intended"
        description: "[#2563](https://github.com/reliant-labs/reliant/pull/2563)"
      - title: "demo: subtract the demo's chrome, repeated copy and auto-opening tips; make the tour spotlight robust"
        description: "[#2567](https://github.com/reliant-labs/reliant/pull/2567)"
      - title: "dev: make the local merge gate and host-dependent tests work on macOS"
        description: "[#2574](https://github.com/reliant-labs/reliant/pull/2574)"
      - title: "reliant main is green again after #2559, #2567 and #2537 (optional Sender guard, journey e2e follows the demo polish, two org-era tests)"
        description: "[#2576](https://github.com/reliant-labs/reliant/pull/2576)"
      - title: "worktreereclaim: never retire a worktree that was used after it was archived"
        description: "[#2571](https://github.com/reliant-labs/reliant/pull/2571)"
      - title: "worktrees: count usage-limit waits and daemon-seen path use as worktree activity"
        description: "[#2578](https://github.com/reliant-labs/reliant/pull/2578)"
      - title: "credsandbox: the sandbox init dies with the process that started it"
        description: "[#2560](https://github.com/reliant-labs/reliant/pull/2560)"
      - title: "workflow: opt out of configured skill catalog per call"
        description: "[#2519](https://github.com/reliant-labs/reliant/pull/2519)"
      - title: "demo: one coherent sample dataset for the public demo"
        description: "[#2573](https://github.com/reliant-labs/reliant/pull/2573)"
      - title: "pdfutil: PDF reads no longer panic where pdfcpu cannot write its config dir"
        description: "[#2588](https://github.com/reliant-labs/reliant/pull/2588)"
      - title: "web: transport tests build requests with context values, as Connect does (#2586's org stage reads them)"
        description: "[#2593](https://github.com/reliant-labs/reliant/pull/2593)"
      - title: "deps: Go toolchain 1.27.4 for GO-2026-6859"
        description: "[#2600](https://github.com/reliant-labs/reliant/pull/2600)"
      - title: "ci: exempt unreachable docker/docker advisories GO-2026-4883/4887 from vuln-scan"
        description: "[#2603](https://github.com/reliant-labs/reliant/pull/2603)"
      - title: "deps: web vite 7.3.8, zod 4.6.7, source-map-js 1.2.2 for high npm advisories"
        description: "[#2604](https://github.com/reliant-labs/reliant/pull/2604)"
