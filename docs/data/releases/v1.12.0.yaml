version: "v1.12.0"
date: "2026-11-09"
title: "3 new features, 4 fixes and 3 other changes"
summary: "Every pull request merged since v1.11.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "workflow: a run step's retry reattaches to the command its first attempt started"
        description: "[#2473](https://github.com/reliant-labs/reliant/pull/2473)"
      - title: "web: show a spinner while a hosted app is deploying"
        description: "[#2476](https://github.com/reliant-labs/reliant/pull/2476)"
      - title: "web,sdk: open chats with tool bodies fetched on expand; SDK toolBodies option and fetchContentBlockBodies (TS + Go)"
        description: "[#2470](https://github.com/reliant-labs/reliant/pull/2470)"
  - title: "Changed"
    items:
      - title: "cmd: the transcript kill-switch test evaluates KCL with the pinned forge, not PATH's"
        description: "[#2485](https://github.com/reliant-labs/reliant/pull/2485)"
      - title: "web: use generated definitions for transient filesystem reads"
        description: "[#2487](https://github.com/reliant-labs/reliant/pull/2487)"
      - title: "pin: forge@56e8024f38c5 + @reliantlabs/forge-web-runtime@0.13.9, as promoted in v1.11.0-rc.2"
        description: "[#2492](https://github.com/reliant-labs/reliant/pull/2492)"
  - title: "Fixed"
    items:
      - title: "dev: pin pnpm and Node so a dev install never edits tracked files"
        description: "[#2463](https://github.com/reliant-labs/reliant/pull/2463)"
      - title: "accountlimits: a Codex account served from credits past its weekly window is not limited"
        description: "[#2484](https://github.com/reliant-labs/reliant/pull/2484)"
      - title: "runs: input to a run reaches the agent running in it, and never restarts a workflow"
        description: "[#2464](https://github.com/reliant-labs/reliant/pull/2464)"
      - title: "web: keep filesystem move deletion on the captured machine"
        description: "[#2488](https://github.com/reliant-labs/reliant/pull/2488)"
