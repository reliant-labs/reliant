version: "v1.7.15"
date: "2026-09-18"
title: "Antigravity joins the provider list, a failed branch no longer breaks the chat it came from, and the app stops telling you things are fine when they are not"
summary: "Antigravity — Google's agentic coding backend — is now available as an OAuth provider, with image generation included. A worktree that fails to create now cleans up after itself instead of leaving a half-built workspace that broke every file request for that chat. And three places where the system knew something was wrong but said nothing now say it: a terminal whose machine has gone away, a daemon that is too old for the command it was sent, and a model that is advertised but unavailable."
items:
  - title: "Antigravity is available as a provider"
    description: "You can now connect Antigravity, Google's agentic coding backend, the same way you connect Claude or Codex — sign in with Google and it appears alongside the others in settings, onboarding and mobile. Image generation is included through the existing tool, so nothing new to learn. Connecting a third provider also fixed a class of bug that only a third provider could expose: several places in the app chose between exactly two providers and quietly routed anything else to the wrong one, so signing in could attach the wrong account with no error shown anywhere."
  - title: "A branch that fails to create no longer breaks the chat"
    description: "Branching a chat into a worktree could fail for ordinary reasons — a name that collides with an existing branch, for instance — and the failure left behind an empty directory and a workspace record pointing nowhere. Every later file request for that chat then failed, blaming the project rather than the branch, which sent you looking in the wrong place. A failed branch now removes what it created and the chat falls back to the project checkout, so a failure costs you the attempt and nothing else."
  - title: "The terminal admits when its machine is gone"
    description: "The terminal connects through the server rather than straight to your machine, so when the machine went away the connection stayed open and the terminal kept showing a healthy prompt for something that no longer existed. Chat and the connection banners had it right; only the terminal was wrong, and only a refresh corrected it. It now notices and says so, with enough delay to ride out a brief reconnect rather than ending healthy sessions."
  - title: "An out-of-date machine says so instead of reporting an internal error"
    description: "Sending a command to a machine running an older build produced an opaque internal error naming only the command. That shape reads like a bug worth reporting, when the answer is simply to update. It now names the version it is running and what to do about it."
  - title: "A model that is unavailable tells you to pick another one"
    description: "A model listed in the catalog but not actually available on the backend returned a raw provider error mid-stream — a block of JSON naming infrastructure you have never seen. It now names the model you picked and tells you to choose a different one."
  - title: "Reliant AI is no longer switched on for accounts that never purchased it"
    description: "Selecting the Reliant provider during onboarding without completing the purchase still enabled it, and the resulting refusal blamed a shared free-tier budget — a mechanism that no longer exists. Access is now granted only at the point of purchase, and when credit runs out the message says so in its own words. References to a free tier have been removed from the product, since we do not offer one."
  - title: "Background commands keep running on their own"
    description: "Background commands are now detached by the component that actually owns the process, so a long-running command started in the background is no longer tied to the lifetime of the request that launched it."
