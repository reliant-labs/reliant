version: "v1.14.0"
date: "2026-11-10"
title: "2 new features, 8 fixes and 7 other changes"
summary: "Every pull request merged since v1.13.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: environment Promotions timeline on the env Overview"
        description: "[#2514](https://github.com/reliant-labs/reliant/pull/2514)"
      - title: "models: add Claude 5.2 Fable on the claude subscription driver"
        description: "[#2531](https://github.com/reliant-labs/reliant/pull/2531)"
  - title: "Changed"
    items:
      - title: "mcp: EnsureProjectServersLoaded tests start no built-in server (#2424)"
        description: "[#2516](https://github.com/reliant-labs/reliant/pull/2516)"
      - title: "forge-version tests skip when forge is replaced by a local checkout (forge's consumer canary)"
        description: "[#2518](https://github.com/reliant-labs/reliant/pull/2518)"
      - title: "daemonruntime: preview forwarder port tests hold their ports so no other process can take them (#2479)"
        description: "[#2526](https://github.com/reliant-labs/reliant/pull/2526)"
      - title: "toolexec: restore TestTerminalOutputQueue_OverflowEndsWithError (#2228)"
        description: "[#2528](https://github.com/reliant-labs/reliant/pull/2528)"
      - title: "shell: restore the archived-workspace kill notice assertion, waited for (#2128)"
        description: "[#2530](https://github.com/reliant-labs/reliant/pull/2530)"
      - title: "authz: one authorization seam for chats, projects, machines, workflows and triggers"
        description: "[#2533](https://github.com/reliant-labs/reliant/pull/2533)"
      - title: "demo: demo.reliantlabs.io ships with prod's release; the demo env is deprecated"
        description: "[#2515](https://github.com/reliant-labs/reliant/pull/2515)"
  - title: "Fixed"
    items:
      - title: "proctree: a command prepared alongside another no longer fails to start with ENOENT"
        description: "[#2517](https://github.com/reliant-labs/reliant/pull/2517)"
      - title: "prove_test: admit files in another git worktree of a workspace repository"
        description: "[#2520](https://github.com/reliant-labs/reliant/pull/2520)"
      - title: "worktree: a base branch whose local copy is behind origin's starts at origin's"
        description: "[#2521](https://github.com/reliant-labs/reliant/pull/2521)"
      - title: "store: a NUL in a step's output no longer fails its step_executions insert"
        description: "[#2522](https://github.com/reliant-labs/reliant/pull/2522)"
      - title: "toolexec: the daemon refusing a credential file is a user error, not an ERROR"
        description: "[#2523](https://github.com/reliant-labs/reliant/pull/2523)"
      - title: "workflow: a step that cannot run as configured no longer reports \"workflow validation failed\""
        description: "[#2527](https://github.com/reliant-labs/reliant/pull/2527)"
      - title: "web: scrolling back no longer loads a chat's whole history with the view stuck at the top"
        description: "[#2513](https://github.com/reliant-labs/reliant/pull/2513)"
      - title: "db: allocate chat updates at READ COMMITTED, as user updates already are"
        description: "[#2524](https://github.com/reliant-labs/reliant/pull/2524)"
