version: "v1.7.16"
date: "2026-09-26"
title: "Claude Opus 5.5 arrives, workflows can be saved as drafts, and long conversations stop running into a wall"
summary: "Claude Opus 5.5 is available and is now the default when you ask for the most capable model. Workflows can be saved as drafts while you are still building them, long-running conversations no longer end abruptly once their history grows large, and signing in from the command line now happens in your browser. The terminal also stops leaking sessions — a leak that could eventually break terminals across your whole machine, not just in Reliant."
items:
  - title: "Claude Opus 5.5 is available, and it is the flagship pick"
    description: "Claude Opus 5.5 is available through Anthropic, OpenRouter, Vertex AI and Reliant's own provider. Choosing the flagship model now gives you Opus 5.5 on each of them, with double the output length of earlier Claude models. The choice of a merely powerful model is unchanged, so nothing you have already configured quietly becomes more expensive."
  - title: "Workflows can be saved as drafts"
    description: "A workflow you are still building no longer has to be valid before you can save it. Drafts always save, carry a Draft badge in the builder, and are never offered anywhere a runnable workflow is needed. When it is ready, mark it complete — at which point it is checked in full, and a complete workflow that fails its checks offers to go back to being a draft instead of throwing your edits away."
  - title: "Long conversations no longer end without warning"
    description: "Every run keeps a history of what it has done, and that history had a hard size limit. Large tool results and file contents counted against it, so a long, busy conversation could hit the limit and be stopped outright. Bulky data is now stored alongside the run instead of inside its history, and a run that does need a fresh start carries its background agents across with it rather than abandoning them."
  - title: "Signing in from the command line happens in your browser"
    description: "reliant auth login now opens your browser, asks you to approve the sign-in, and stores a single kind of access token that the whole product understands. Personal access tokens from earlier versions no longer work and the reliant context command has been removed — run reliant auth login once to get a new token."
  - title: "The desktop app replaces an out-of-date saved credential on its own"
    description: "After the change to access tokens, a machine could hold on to a saved credential in the old format and sit disconnected, since that credential can no longer sign in. The desktop app now recognises an old-format credential, removes it and fetches a new one, including when the server is still starting and the first attempt has to be retried."
  - title: "The terminal no longer leaks sessions until your machine runs out"
    description: "Each time the terminal reconnected — after a reload, a laptop sleep or a network blip — the shell it had been using was left running with nothing attached to it. One machine collected more than five hundred of them in two days, which used up the system-wide supply of terminals: after that, every program on the computer failed to open one, Terminal.app included. Closing a connection now closes its shell, and each machine caps how many it will keep open, so a problem of this kind can no longer spill beyond Reliant."
  - title: "Onboarding no longer stops on an empty screen"
    description: "Setting up with your own computer and your own API key ended on a card with nothing on it but a Continue button, because there was nothing left to set up. That step now finishes by itself and moves you on. A setup that did have work to do still shows its checklist and still waits for you if anything failed."
  - title: "The last traces of a free machine trial are gone"
    description: "Reliant does not offer a free trial machine, but the upgrade prompt could still describe one as having expired, and the billing screen still made an exception for a free plan that no longer exists. Both are gone, so the app no longer mentions a trial you never had."
