version: "v1.23.0"
date: "2026-11-19"
title: "2 new features, 4 fixes and 1 other change"
summary: "Every pull request merged since v1.22.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "machines: bind trigger activations to a machine pool from the agent tools; label machines and manage pools with an approval card"
        description: "[#2963](https://github.com/reliant-labs/reliant/pull/2963)"
      - title: "machines: reliant daemon start --label declares durable machine labels; reliant machine label and machine pool"
        description: "[#2964](https://github.com/reliant-labs/reliant/pull/2964)"
  - title: "Changed"
    items:
      - title: "web: reset the global query client between tests; make ForgeEnvPage.liveNoDaemon hermetic"
        description: "[#2939](https://github.com/reliant-labs/reliant/pull/2939)"
  - title: "Fixed"
    items:
      - title: "chat: never send redacted thinking ciphertext to clients"
        description: "[#2956](https://github.com/reliant-labs/reliant/pull/2956)"
      - title: "files: browse a chat-less project on a machine that has it, and never name a machine by its id"
        description: "[#2905](https://github.com/reliant-labs/reliant/pull/2905)"
      - title: "web: a Monaco CDN load failure raises no unhandled rejection"
        description: "[#2967](https://github.com/reliant-labs/reliant/pull/2967)"
      - title: "projects: retry trigger sync after project delete/restore without a restart"
        description: "[#2957](https://github.com/reliant-labs/reliant/pull/2957)"
