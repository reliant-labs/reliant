version: "v1.28.0"
date: "2026-11-22"
title: "11 new features, 13 fixes and 17 other changes"
summary: "Every pull request merged since v1.27.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: one project selector — pinned, recent, apps, ⌘K (U7)"
        description: "[#2995](https://github.com/reliant-labs/reliant/pull/2995)"
      - title: "web: Overview vulnerabilities card (SBOM W2)"
        description: "[#3226](https://github.com/reliant-labs/reliant/pull/3226)"
      - title: "projects: read coverage source from GitHub at view time"
        description: "[#3182](https://github.com/reliant-labs/reliant/pull/3182)"
      - title: "web: filter the chat list by several projects (choose N of M)"
        description: "[#3027](https://github.com/reliant-labs/reliant/pull/3027)"
      - title: "cli: reliant update installs the newest signed release"
        description: "[#3240](https://github.com/reliant-labs/reliant/pull/3240)"
      - title: "web: one shell — the nav model (U6 2a/16)"
        description: "[#3191](https://github.com/reliant-labs/reliant/pull/3191)"
      - title: "workflow: built-in vuln-patch workflow (deterministic bump, agent takeover, verify gate, PR)"
        description: "[#3236](https://github.com/reliant-labs/reliant/pull/3236)"
      - title: "web: Tests pages — coverage, runs and flaky tests in the project shell"
        description: "[#3207](https://github.com/reliant-labs/reliant/pull/3207)"
      - title: "web: the one shell lists Experiments behind CHANGES_UI; re-capture the visual baselines"
        description: "[#3265](https://github.com/reliant-labs/reliant/pull/3265)"
      - title: "tools: present_image shows a file from the machine in the chat timeline"
        description: "[#3224](https://github.com/reliant-labs/reliant/pull/3224)"
      - title: "web: Patch and Patch-with-agent buttons start the vuln-patch workflow (SBOM W3)"
        description: "[#3251](https://github.com/reliant-labs/reliant/pull/3251)"
  - title: "Changed"
    items:
      - title: "tools: ask_user questions say who 'I' and 'you' are"
        description: "[#3216](https://github.com/reliant-labs/reliant/pull/3216)"
      - title: "web: assert DesktopUpdateRequiredError after #2989 removed the bridge fallback"
        description: "[#3231](https://github.com/reliant-labs/reliant/pull/3231)"
      - title: "electron: release-config KCL tests skip when kcl or forge is missing, not only the control-plane checkout"
        description: "[#3218](https://github.com/reliant-labs/reliant/pull/3218)"
      - title: "one canonical definition of each product; agent-facing deploy guide"
        description: "[#3220](https://github.com/reliant-labs/reliant/pull/3220)"
      - title: "seed: drop vocab workarounds forge now handles and pin the new inbox and incident tables"
        description: "[#3228](https://github.com/reliant-labs/reliant/pull/3228)"
      - title: "pin: forge@7cb21c2dc (G8 upstream-token passthrough, forge test flakes, PGO refresh)"
        description: "[#3245](https://github.com/reliant-labs/reliant/pull/3245)"
      - title: "pin: @reliantlabs/forge-web-runtime@0.13.21, as promoted in v1.30.0-rc.1"
        description: "[#3249](https://github.com/reliant-labs/reliant/pull/3249)"
      - title: "daemon: exec.bg_list reads listening ports from procfs, not lsof, on Linux"
        description: "[#3234](https://github.com/reliant-labs/reliant/pull/3234)"
      - title: "web: re-capture the chat filter baselines over main's shell after #3027"
        description: "[#3250](https://github.com/reliant-labs/reliant/pull/3250)"
      - title: "llm: ask every account's availability report at once, not one after another"
        description: "[#3238](https://github.com/reliant-labs/reliant/pull/3238)"
      - title: "web: the Playwright e2e follows the one shell (#3191)"
        description: "[#3259](https://github.com/reliant-labs/reliant/pull/3259)"
      - title: "contract: re-vendor control-plane's public protos at 47c387280172"
        description: "[#3138](https://github.com/reliant-labs/reliant/pull/3138)"
      - title: "Learn pages for the project shell"
        description: "[#3089](https://github.com/reliant-labs/reliant/pull/3089)"
      - title: "facade: plan, task and attachment handlers take the generated stores"
        description: "[#3246](https://github.com/reliant-labs/reliant/pull/3246)"
      - title: "prove_test: say how to prove a fix in another git worktree"
        description: "[#3223](https://github.com/reliant-labs/reliant/pull/3223)"
      - title: "release: declare server-image inputs and stamp the commit time so releases reuse the image"
        description: "[#3232](https://github.com/reliant-labs/reliant/pull/3232)"
      - title: "advertise the docs MCP server (docs.reliantlabs.io/mcp) to coding agents"
        description: "[#3271](https://github.com/reliant-labs/reliant/pull/3271)"
  - title: "Fixed"
    items:
      - title: "cli: scenario run for one named workflow reports an orphan scenarios dir instead of refusing"
        description: "[#3222](https://github.com/reliant-labs/reliant/pull/3222)"
      - title: "mcp: let the daemon resolve the global skills directory"
        description: "[#3225](https://github.com/reliant-labs/reliant/pull/3225)"
      - title: "tools: carry user attachments to sub-agents and warn on save_attachment extension mismatch"
        description: "[#3219](https://github.com/reliant-labs/reliant/pull/3219)"
      - title: "hosteduse: never read the proxy environment for the private controller"
        description: "[#3227](https://github.com/reliant-labs/reliant/pull/3227)"
      - title: "electron: stop setting the dead RELIANT_DATA_DIR for the backend"
        description: "[#3230](https://github.com/reliant-labs/reliant/pull/3230)"
      - title: "observability: list process.* and system.* metrics as forge built-ins in the metric catalog"
        description: "[#3242](https://github.com/reliant-labs/reliant/pull/3242)"
      - title: "mailbox: drain queued agent messages at READ COMMITTED so concurrent drains in one chat stop failing with 40001"
        description: "[#3221](https://github.com/reliant-labs/reliant/pull/3221)"
      - title: "projects: drop the per-user project keys so a path can be a project in each org"
        description: "[#2887](https://github.com/reliant-labs/reliant/pull/2887)"
      - title: "proto: buf-format coverage_source.proto so the release gate's lint is green"
        description: "[#3257](https://github.com/reliant-labs/reliant/pull/3257)"
      - title: "web: the Playwright e2e follows the one shell (apps, claim, onboarding)"
        description: "[#3261](https://github.com/reliant-labs/reliant/pull/3261)"
      - title: "web: the phone drawer's rows are 44px touch targets; the e2e opens it at its top level"
        description: "[#3262](https://github.com/reliant-labs/reliant/pull/3262)"
      - title: "web: Projects says what a finished claim did — the app is yours, which free site is paused — and highlights its row (#3258)"
        description: "[#3266](https://github.com/reliant-labs/reliant/pull/3266)"
      - title: "ci: release-config renders through forge env kcl eval --format json; stock kcl lacks forge's kcl_plugin"
        description: "[#3272](https://github.com/reliant-labs/reliant/pull/3272)"
