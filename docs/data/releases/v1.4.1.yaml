version: "v1.4.1"
date: "2026-08-13"
title: "Agent messaging, thread lifecycle repair, and a hardened release pipeline"
summary: "Adds an agent message mailbox with queued composer input, records how each thread was created instead of guessing, and repairs thread lifecycle and workflow history handling. Also brings daemon reliability work, workflow preview delivery and CEL hardening, and a release pipeline that now builds and publishes macOS, Linux, and Windows."
items:
  - title: "Agent messaging and spawn lifecycle"
    description: "with an agent message mailbox, queued composer input so a message typed mid-run is delivered rather than dropped, and parent threads woken when a sub-agent reports back."
  - title: "Thread identity recorded, not inferred"
    description: "threads now store how they were created, so a spawned sub-agent is never mistaken for a graph-node thread — a class of bug that previously made spawn threads render inline."
  - title: "Thread lifecycle and workflow history repair"
    description: "including reduced workflow history retention, a recorded verdict for each run so failures stop being reported as successes, and fixes to loop execution and transition handling."
  - title: "Daemon reliability and workspace management"
    description: "with a daemon reliability overhaul, worktree auto-init and adopt, more models, and more reliable workspace handling."
  - title: "Workflow preview delivery and CEL hardening"
    description: "covering preview forwarding, workflow simplification with transition_to, and hardening of CEL compilation."
  - title: "Release and build fixes"
    description: "the web build now type-checks again after 20 accumulated errors, the desktop release builds all three platforms including Windows, and the timestamp migration no longer fails on managed Postgres that owns views in the public schema."
