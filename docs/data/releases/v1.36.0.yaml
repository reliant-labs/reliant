version: "v1.36.0"
date: "2026-11-28"
title: "6 new features, 10 fixes and 11 other changes"
summary: "Every pull request merged since v1.35.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "web: Settings › Organization GitHub links the Reliant GitHub App's installations to an org"
        description: "[#3708](https://github.com/reliant-labs/reliant/pull/3708)"
      - title: "web: offer \"Add to <machine>\" when a new chat's project isn't on the chosen machine"
        description: "[#3631](https://github.com/reliant-labs/reliant/pull/3631)"
      - title: "console: rename Speed insights to Site insights"
        description: "[#3735](https://github.com/reliant-labs/reliant/pull/3735)"
      - title: "web: call a Reliant-hosted box a sandbox; sync the Sandboxes dashboard fixture"
        description: "[#3621](https://github.com/reliant-labs/reliant/pull/3621)"
      - title: "console: Site insights SEO view"
        description: "[#3799](https://github.com/reliant-labs/reliant/pull/3799)"
      - title: "console: label site-audit release-health findings"
        description: "[#3937](https://github.com/reliant-labs/reliant/pull/3937)"
  - title: "Changed"
    items:
      - title: "worktreereclaim: remove flaky TestWholeRetirementItsOwnRollbackIsNotUseAfterArchive"
        description: "[#3901](https://github.com/reliant-labs/reliant/pull/3901)"
      - title: "auth: record Forge identity cutover readiness gates"
        description: "[#3920](https://github.com/reliant-labs/reliant/pull/3920)"
      - title: "web: the Releases pages' DeployService reads run on its generated hooks; ReleasesApiContext is deleted"
        description: "[#3703](https://github.com/reliant-labs/reliant/pull/3703)"
      - title: "triggers: ListTriggers decodes the body of each trigger's newest firing only"
        description: "[#3914](https://github.com/reliant-labs/reliant/pull/3914)"
      - title: "triggers: redrive a waiting capacity head only when its scope frees a slot"
        description: "[#3749](https://github.com/reliant-labs/reliant/pull/3749)"
      - title: "chat: trace web chat stream delivery"
        description: "[#3932](https://github.com/reliant-labs/reliant/pull/3932)"
      - title: "triggers: ListTriggers reads its independent inputs together and its activations' drafts in one query"
        description: "[#3925](https://github.com/reliant-labs/reliant/pull/3925)"
      - title: "merge-queue: the visual baseline is advisory in the merge queue"
        description: "[#3945](https://github.com/reliant-labs/reliant/pull/3945)"
      - title: "web: remove flaky releases sample enumeration case"
        description: "[#3949](https://github.com/reliant-labs/reliant/pull/3949)"
      - title: "report_bug test survives -count=3; reclaim tests skip on an openat2-less host"
        description: "[#3950](https://github.com/reliant-labs/reliant/pull/3950)"
      - title: "db: a warm supply of test databases takes the copy and drop off serial tests"
        description: "[#3951](https://github.com/reliant-labs/reliant/pull/3951)"
  - title: "Fixed"
    items:
      - title: "files: every folder in the Files tab opens, gitignored hidden and symlinked ones included"
        description: "[#3729](https://github.com/reliant-labs/reliant/pull/3729)"
      - title: "web: the phone nav drawer is the shell's nav column, on chats too"
        description: "[#3845](https://github.com/reliant-labs/reliant/pull/3845)"
      - title: "daemon: the stat in front of a write or edit gets the write's 30s budget, not 5s"
        description: "[#3902](https://github.com/reliant-labs/reliant/pull/3902)"
      - title: "web: the last message keeps its copy, branch and timestamp actions"
        description: "[#3721](https://github.com/reliant-labs/reliant/pull/3721)"
      - title: "machines: wait_for_machine says connected only when the run's next command would reach its daemon"
        description: "[#3907](https://github.com/reliant-labs/reliant/pull/3907)"
      - title: "shell: a background process a signal from outside the daemon ended says so in its output"
        description: "[#3913](https://github.com/reliant-labs/reliant/pull/3913)"
      - title: "trigger: refresh an owner's GitHub access outside the caller's transaction"
        description: "[#3916](https://github.com/reliant-labs/reliant/pull/3916)"
      - title: "worktrees: a resumed sub-agent gets back the worktree archived under it"
        description: "[#3921](https://github.com/reliant-labs/reliant/pull/3921)"
      - title: "workflow: a run node's step row keeps its node path and run id"
        description: "[#3917](https://github.com/reliant-labs/reliant/pull/3917)"
      - title: "main: commit main's generated drift, fix the web tests it broke, move the demo bundle budget"
        description: "[#3946](https://github.com/reliant-labs/reliant/pull/3946)"
