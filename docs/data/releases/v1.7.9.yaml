version: "v1.7.9"
date: "2026-08-27"
title: "Signing in with Claude or Codex works in the browser, and the desktop app stops going blank"
summary: "A maintenance release. Signing in to Claude and Codex now works from a normal browser rather than only in the desktop app, the packaged app no longer opens to an empty window, and a chat whose model returns an unusual answer keeps going instead of stalling. Text everywhere now honours your font-size preference."
items:
  - title: "Signing in with Claude or Codex now works outside the desktop app"
    description: "These sign-ins have to hand control back to something running on your own machine, which previously only the desktop app could do — in a browser the sign-in simply had nowhere to return to. There is now a small command you can run in a terminal that receives the hand-back, so the same sign-in completes in a browser. It only bridges that one step: your account details are still exchanged and stored by the server, never by the local helper."
  - title: "The packaged app no longer opens to an empty window"
    description: "The desktop app loaded its interface in a way that made every internal address resolve against your filesystem instead of the app itself, so nothing ever loaded and the window stayed blank. The failure was silent by construction — the page itself loaded fine, so no error appeared. The app now serves its own interface through a dedicated internal address, and the packaging step is checked so a build that would have shipped this cannot be released."
  - title: "A chat no longer stalls when the model returns nothing or declines"
    description: "If the model finished a turn without producing any text, or declined to answer, the conversation could be left waiting on a reply that was never coming. Those endings are now recognised as real endings, so the chat continues and you can send the next message. Long-running turns are also cancelled properly when you stop them, rather than continuing invisibly in the background."
  - title: "Your font-size preference now applies everywhere"
    description: "Parts of the interface were written with fixed text sizes, so they stayed the same no matter which font size you chose — enlarging the type to read them did nothing. Those places now scale with the rest of the app, and a check has been added so a fixed size cannot quietly reappear."
  - title: "The desktop app reconnects more reliably"
    description: "When the background service the app depends on restarted or dropped its connection, the app could be left showing a stale state. Restarts, disconnections and leftover processes from a previous run are now detected and reported, so the app recovers on its own instead of needing to be quit and reopened."
