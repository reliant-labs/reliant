version: "v1.8.12"
date: "2026-10-30"
title: "A cleaner chat list and steadier machines"
summary: "Automation and agent runs stay out of your chat list, chat lists refresh without request storms, workflows load from the machine they run on, and Reliant Forge moves to v1.0.6."
items:
  - title: "Keep automation runs out of the chat list"
    description: "Runs started by automations, agents and the CLI no longer crowd the chat list. Each chat records where it came from, and only the conversations you start appear there."
  - title: "Refresh chat lists without request storms"
    description: "Streaming updates are coalesced into one list refresh, and a superseded chat-list request is cancelled instead of racing the new one."
  - title: "Load long chats faster"
    description: "A new index on messages makes counting a chat's messages an index-only read."
  - title: "Run workflows from the machine's own catalog"
    description: "A run loads its workflow, child workflows and presets from the catalog of the machine it runs on, so a machine's local changes apply to its own runs."
  - title: "See each repository's state from the daemon"
    description: "Daemons report every repository's branch, commit and uncommitted changes with each snapshot."
  - title: "See forge-applied rollout slots separately"
    description: "The Rollout tab groups slots that Forge applies apart from the rest."
  - title: "Reliant Forge v1.0.6"
    description: "The embedded `reliant forge` moves to v1.0.6 plus the environment validation fix: the service catalog no longer records source lines, and environments have no arbitrary entry-count limit."
