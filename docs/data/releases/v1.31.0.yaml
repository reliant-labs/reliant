version: "v1.31.0"
date: "2026-11-25"
title: "9 new features, 14 fixes and 21 other changes"
summary: "Every pull request merged since v1.30.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "analytics: chat_pr_links — link chats to the pull requests they produced"
        description: "[#3482](https://github.com/reliant-labs/reliant/pull/3482)"
      - title: "tool-usage: record each tool call's outcome, closed error class and duration (agent analytics A2)"
        description: "[#3483](https://github.com/reliant-labs/reliant/pull/3483)"
      - title: "shell: every chat shell command carries RELIANT_THREAD_ID, so a chat's sub-agents can be told apart"
        description: "[#3514](https://github.com/reliant-labs/reliant/pull/3514)"
      - title: "daemon: heartbeat resource stats from forge/pkg/resmetrics"
        description: "[#3233](https://github.com/reliant-labs/reliant/pull/3233)"
      - title: "web: list the Inbox in the Agents nav too"
        description: "[#3523](https://github.com/reliant-labs/reliant/pull/3523)"
      - title: "web: the public demo runs in the app's shell"
        description: "[#3519](https://github.com/reliant-labs/reliant/pull/3519)"
      - title: "web: generate React Query hooks for the 24 control-plane services the app calls (forge.imported_hooks)"
        description: "[#3530](https://github.com/reliant-labs/reliant/pull/3530)"
      - title: "web: share a chat and its saved workflow from the chat row's ⋯ menu, and saved workflows from the library"
        description: "[#3531](https://github.com/reliant-labs/reliant/pull/3531)"
      - title: "deploy: preview env — the production web build on shop fixtures"
        description: "[#3454](https://github.com/reliant-labs/reliant/pull/3454)"
  - title: "Changed"
    items:
      - title: "contract: re-vendor control-plane's public contract (NO_SIDE_EFFECTS markers from control-plane#3513 and #3523)"
        description: "[#3467](https://github.com/reliant-labs/reliant/pull/3467)"
      - title: "web: the local TransportScope matches forge#2735 byte for byte"
        description: "[#3500](https://github.com/reliant-labs/reliant/pull/3500)"
      - title: "web: the shell's nav body, nav config and keyboard overlays are seams"
        description: "[#3501](https://github.com/reliant-labs/reliant/pull/3501)"
      - title: "app: every root builds a service with the same Deps keys, or says why not"
        description: "[#3505](https://github.com/reliant-labs/reliant/pull/3505)"
      - title: "web: observability reads take their client from the scope"
        description: "[#3509](https://github.com/reliant-labs/reliant/pull/3509)"
      - title: "web: the release gate holds the demo bundle to a size budget"
        description: "[#3491](https://github.com/reliant-labs/reliant/pull/3491)"
      - title: "web: forge console reads take their client from the scope"
        description: "[#3512](https://github.com/reliant-labs/reliant/pull/3512)"
      - title: "web: tests, security, data and identity reads take their client from the scope"
        description: "[#3513](https://github.com/reliant-labs/reliant/pull/3513)"
      - title: "bump forge to abfa4d8c (forge.Fixtures, fixedSession, idempotency lint)"
        description: "[#3511](https://github.com/reliant-labs/reliant/pull/3511)"
      - title: "web: remove intermittent shell-scope and activity-indicator e2e tests (#3516, #3517)"
        description: "[#3518](https://github.com/reliant-labs/reliant/pull/3518)"
      - title: "threads: index live threads by workflow so the terminal cascade and the orphan reap stop scanning threads"
        description: "[#3239](https://github.com/reliant-labs/reliant/pull/3239)"
      - title: "db: repository_agent_messages.go leaves the facade (9 more methods); activities, reconciler and spawn_send take narrow mailbox roles"
        description: "[#3345](https://github.com/reliant-labs/reliant/pull/3345)"
      - title: "triggers: read a capacity scope's occupied slots through its partial index instead of scanning trigger_events"
        description: "[#3237](https://github.com/reliant-labs/reliant/pull/3237)"
      - title: "db: the workflow and scenario tools read and write drafts through workflowdrafts"
        description: "[#3340](https://github.com/reliant-labs/reliant/pull/3340)"
      - title: "a top-level Deploy your app page for agents and people; llms.txt points at the .md form"
        description: "[#3524](https://github.com/reliant-labs/reliant/pull/3524)"
      - title: "web: the every-dashboard realClient sweep gets a 30s budget (main red)"
        description: "[#3537](https://github.com/reliant-labs/reliant/pull/3537)"
      - title: "workflow: deprecate llm_gateway step keys and requires.cli_login"
        description: "[#3421](https://github.com/reliant-labs/reliant/pull/3421)"
      - title: "workflows: a ref'd child's outcome: failure does not fail its parent"
        description: "[#3535](https://github.com/reliant-labs/reliant/pull/3535)"
      - title: "facade: usage, org_usage and org_policy_impact handlers take the generated stores"
        description: "[#3255](https://github.com/reliant-labs/reliant/pull/3255)"
      - title: "triggers: a run event's dispatch reads and pins each catalog once, not once per trigger"
        description: "[#3539](https://github.com/reliant-labs/reliant/pull/3539)"
      - title: "web: BillingService calls run on its generated hooks"
        description: "[#3548](https://github.com/reliant-labs/reliant/pull/3548)"
  - title: "Fixed"
    items:
      - title: "worker: wire the automation-token store into the worker's trigger service"
        description: "[#3499](https://github.com/reliant-labs/reliant/pull/3499)"
      - title: "web: Settings always opens Settings' own sections, never Agents › Sandboxes"
        description: "[#3504](https://github.com/reliant-labs/reliant/pull/3504)"
      - title: "accountpurge: account purge and project delete remove the chat-keyed tables they left behind"
        description: "[#3510](https://github.com/reliant-labs/reliant/pull/3510)"
      - title: "main red — re-version tool_call_usage migration above main (#3483) and fix release-gate parts test (#3491)"
        description: "[#3515](https://github.com/reliant-labs/reliant/pull/3515)"
      - title: "web: pin Settings opening its own page from Agents › Sandboxes, end to end"
        description: "[#3521](https://github.com/reliant-labs/reliant/pull/3521)"
      - title: "web: a control plane without the tests or vulnerability stores is a state, not an error report"
        description: "[#3525](https://github.com/reliant-labs/reliant/pull/3525)"
      - title: "prove_test: run in the files' worktree when the project root cannot reach it"
        description: "[#3527](https://github.com/reliant-labs/reliant/pull/3527)"
      - title: "workflows: accept tolerate_failure on action, call_llm and execute_tools nodes"
        description: "[#3526](https://github.com/reliant-labs/reliant/pull/3526)"
      - title: "workflows: stop advising loop args for inline bodies; warn that inline bodies ignore args, passthrough and presets"
        description: "[#3528](https://github.com/reliant-labs/reliant/pull/3528)"
      - title: "diskwatch: a process refused for capabilities we lack no longer fails the work-dir proof"
        description: "[#3529](https://github.com/reliant-labs/reliant/pull/3529)"
      - title: "tools: a resumed agent whose workspace was archived can still run machine-less tools"
        description: "[#3536](https://github.com/reliant-labs/reliant/pull/3536)"
      - title: "reconciler: don't reap a thread while an ancestor of its workflow is live"
        description: "[#3541](https://github.com/reliant-labs/reliant/pull/3541)"
      - title: "repo: commit the dev env's scaffold-ledger entry instead of ignoring it"
        description: "[#3544](https://github.com/reliant-labs/reliant/pull/3544)"
      - title: "reconciler: the background pass ends when the reconciler stops"
        description: "[#3547](https://github.com/reliant-labs/reliant/pull/3547)"
