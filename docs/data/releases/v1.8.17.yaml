version: "v1.8.17"
date: "2026-11-04"
title: "Mobile and tablet chat, batch approvals, the Reliant color scheme"
summary: "Chat is redesigned for mobile and tablet; a turn's approval cards arrive together and are decided at once; the Reliant color scheme becomes the default; the Environments tab summarizes each environment; and daemon, MCP, workflow and disk-reclaim paths get a round of reliability and security fixes."
sections:
  - title: "Added"
    items:
      - title: "web: the Reliant color scheme, the default for everyone"
        description: "[#2065](https://github.com/reliant-labs/reliant/pull/2065)"
      - title: "approvals: batch approval — a turn's cards arrive together and are decided at once"
        description: "[#1988](https://github.com/reliant-labs/reliant/pull/1988)"
      - title: "web: responsive mobile, tablet and Duo chat UI with desktop settings parity"
        description: "[#2094](https://github.com/reliant-labs/reliant/pull/2094)"
      - title: "daemon: stop a finished chat's background processes after 4 idle hours"
        description: "[#2102](https://github.com/reliant-labs/reliant/pull/2102)"
      - title: "mobile: mobile and tablet chat redesign"
        description: "[#2121](https://github.com/reliant-labs/reliant/pull/2121)"
      - title: "heavyjob: cap each heavy-slot command at its CPU share with cgroup cpu.max"
        description: "[#2134](https://github.com/reliant-labs/reliant/pull/2134)"
      - title: "daemon: log a machine-health sample a minute on managed machines"
        description: "[#2139](https://github.com/reliant-labs/reliant/pull/2139)"
      - title: "web: the Environments tab summarizes each environment: health, workloads, last deploy, obs check, drift, links"
        description: "[#2146](https://github.com/reliant-labs/reliant/pull/2146)"
  - title: "Changed"
    items:
      - title: "gateway: a disconnect reaches listeners only after the status source drops the daemon"
        description: "[#2104](https://github.com/reliant-labs/reliant/pull/2104)"
      - title: "remove the worktree ssh-agent test and the two package-timeout tests (flaky, #2113)"
        description: "[#2114](https://github.com/reliant-labs/reliant/pull/2114)"
      - title: "worktreereclaim: drop waitListening, unused once the ssh-agent test was removed (#2113)"
        description: "[#2117](https://github.com/reliant-labs/reliant/pull/2117)"
      - title: "deps: pin forge a88d3c30 (placement owners for every forge.Manifests group, forge#1679)"
        description: "[#2116](https://github.com/reliant-labs/reliant/pull/2116)"
      - title: "remove flaky and package-timeout tests found by rc.7's release gate (#2113)"
        description: "[#2118](https://github.com/reliant-labs/reliant/pull/2118)"
      - title: "deps: pin forge 02954132 (forge#1683 hosted-tier Secrets per tier, forge#1684 namespaces before RBAC)"
        description: "[#2120](https://github.com/reliant-labs/reliant/pull/2120)"
      - title: "deps: pin forge 0dd8256d (deploy orchestration tests for the hosted-tier Secret gate and namespace-first writes)"
        description: "[#2122](https://github.com/reliant-labs/reliant/pull/2122)"
      - title: "shell: drop the flaky kill-notice assertion of TestReaper_ArchivedWorkspaceStopsItsProcessesAtOnce (#2128)"
        description: "[#2129](https://github.com/reliant-labs/reliant/pull/2129)"
      - title: "privacy: analytics kept up to 90 days, logs by severity, and desktop-window replay is on"
        description: "[#2131](https://github.com/reliant-labs/reliant/pull/2131)"
      - title: "forge: how forge works, deploys, monitoring and every lint rule"
        description: "[#2142](https://github.com/reliant-labs/reliant/pull/2142)"
      - title: "worktreereclaim: metadata-only, heartbeat-paced activity observation within an inotify budget"
        description: "[#2143](https://github.com/reliant-labs/reliant/pull/2143)"
      - title: "web: delete two flaky tests found by v1.8.16-rc.9's release gate"
        description: "[#2157](https://github.com/reliant-labs/reliant/pull/2157)"
      - title: "deps: pin forge to fe9fb2df0f25 (backend traces join browser sessions; schema-aware session reads)"
        description: "[#2153](https://github.com/reliant-labs/reliant/pull/2153)"
      - title: "electron: drop the wall-clock assertion of waitForReady's awaiting-credentials test"
        description: "[#2159](https://github.com/reliant-labs/reliant/pull/2159)"
  - title: "Fixed"
    items:
      - title: "web: observability reads share one queue across every console tab"
        description: "[#2020](https://github.com/reliant-labs/reliant/pull/2020)"
      - title: "approvals: activation cards say what they grant, in plain words, before Approve"
        description: "[#2072](https://github.com/reliant-labs/reliant/pull/2072)"
      - title: "forge: reliant forge runs the forge the project pins, decided before parsing; an unobtainable pin fails"
        description: "[#1871](https://github.com/reliant-labs/reliant/pull/1871)"
      - title: "web: a bad dashboard panel stays in its cell; org Metrics is the real explorer; Logs controls reach 32px"
        description: "[#2067](https://github.com/reliant-labs/reliant/pull/2067)"
      - title: "lint: clear main's two golangci-lint findings (ineffassign, QF1001)"
        description: "[#2095](https://github.com/reliant-labs/reliant/pull/2095)"
      - title: "shell: process listers read Status, ExitCode, EndTime and Ports under the process lock"
        description: "[#2107](https://github.com/reliant-labs/reliant/pull/2107)"
      - title: "release: release-tag.sh --rc and the tag guard accept an RC set fixed in place"
        description: "[#2106](https://github.com/reliant-labs/reliant/pull/2106)"
      - title: "workflow: a database outage never permanently fails a run"
        description: "[#2109](https://github.com/reliant-labs/reliant/pull/2109)"
      - title: "web: serve security.txt on app.reliantlabs.io naming security@ and abuse@"
        description: "[#2111](https://github.com/reliant-labs/reliant/pull/2111)"
      - title: "diskwatch: the go-build work-dir trim removes only this user's dirs, by file descriptor"
        description: "[#2112](https://github.com/reliant-labs/reliant/pull/2112)"
      - title: "security: credentials-none env is an allowlist; the file viewer refuses credential stores"
        description: "[#2110](https://github.com/reliant-labs/reliant/pull/2110)"
      - title: "release-gate: clear main's lint reds and remove 4 load-sensitive tests (rc v1.7.89-rc.3)"
        description: "[#2125](https://github.com/reliant-labs/reliant/pull/2125)"
      - title: "cli: reliant github token|gh ask only with daemon sessions, within a 60s budget"
        description: "[#2127](https://github.com/reliant-labs/reliant/pull/2127)"
      - title: "web: keep Chat Settings on-screen on touch; uniform 44px composer controls"
        description: "[#2130](https://github.com/reliant-labs/reliant/pull/2130)"
      - title: "web: a running chat shows a small spinner, not a chip"
        description: "[#2126](https://github.com/reliant-labs/reliant/pull/2126)"
      - title: "web: console ClickHouse reads wait to just under the gateway; Needs attention keeps its alerts"
        description: "[#2135](https://github.com/reliant-labs/reliant/pull/2135)"
      - title: "web: replay seeks land past the full snapshot, so restarting a replay redraws its page"
        description: "[#2136](https://github.com/reliant-labs/reliant/pull/2136)"
      - title: "ci: Reliant review reads a head's FIRST review marker, its one verdict"
        description: "[#2137](https://github.com/reliant-labs/reliant/pull/2137)"
      - title: "web: title traces by what they did, not \"HTTP POST\""
        description: "[#2138](https://github.com/reliant-labs/reliant/pull/2138)"
      - title: "onboarding: provision the machine size the server admits, so a coupon redeemed at checkout gets its M"
        description: "[#2140](https://github.com/reliant-labs/reliant/pull/2140)"
      - title: "daemon: back off project watchers whose path is gone instead of retrying every 2s"
        description: "[#2141](https://github.com/reliant-labs/reliant/pull/2141)"
      - title: "mcp: never hold a turn more than 3s on a machine's MCP loading"
        description: "[#2144](https://github.com/reliant-labs/reliant/pull/2144)"
      - title: "diskwatch: reclaim killed builds' Go work dirs once proven dead; give each command its own GOTMPDIR"
        description: "[#2132](https://github.com/reliant-labs/reliant/pull/2132)"
      - title: "diskwatch: reclaim killed builds' Go work dirs every 10m, on the Go-cache cadence, not only with the hourly full pass"
        description: "[#2148](https://github.com/reliant-labs/reliant/pull/2148)"
      - title: "mcp: a machine that was offline gets its MCP servers as soon as it reconnects"
        description: "[#2154](https://github.com/reliant-labs/reliant/pull/2154)"
      - title: "observability: Sessions lists only sessions with a replay; drop the \"no replay was recorded\" state"
        description: "[#2133](https://github.com/reliant-labs/reliant/pull/2133)"
