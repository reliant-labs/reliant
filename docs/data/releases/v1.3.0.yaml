date: "2026-04-03"
title: "First open source release, onboarding polish, and split architecture support"
summary: "Introduces the first open source release, improves onboarding and bug fixes, adds stronger support for remote daemons and split deployments, and expands telemetry and diagnostics."
items:
  - title: "First open source release"
    description: "with the new public release flow, packaging updates, and release process improvements."
  - title: "Better onboarding tips"
    description: "with clearer setup guidance, improved post-onboarding prompts, and less eager tip display."
  - title: "Remote daemons and split architecture support"
    description: "with stronger support for distributed deployments, full daemon flows, and the new single-binary backend command architecture."
  - title: "More telemetry and diagnostics"
    description: "with improved telemetry, error reporting, and better signal quality for production debugging."
  - title: "Bug fixes and reliability improvements"
    description: "including migration fixes, auth fixes, MCP listing fixes, workspace restore fixes, and UI polish across settings and diff tabs."
