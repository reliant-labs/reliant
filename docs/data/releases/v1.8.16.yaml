      - title: "workflows: a run node's timeout above the 12h cap fails validation, not silently hours in"
        description: "[#2006](https://github.com/reliant-labs/reliant/pull/2006)"
      - title: "web: observability tells an unread environment list from an empty one, and lists platform-sourced processes"
        description: "[#2023](https://github.com/reliant-labs/reliant/pull/2023)"
