version: "v1.8.16"
date: "2026-11-02"
title: "Observability dashboards, Integrations settings, project commands on the right machine"
summary: "Observability gains real dashboards, trace charts and replay verdicts; Settings lists every integration connection; project commands run on the machine holding the checkout; one account per machine; and the daemon, workflow and usage paths get a round of reliability fixes."
sections:
  - title: "Added"
    items:
      - title: "web: traces latency scatter and histogram, with click-to-open and brush-to-filter"
        description: "[#2021](https://github.com/reliant-labs/reliant/pull/2021)"
      - title: "web: Observability opens on Dashboards; Service graph moves last in its tabs"
        description: "[#2015](https://github.com/reliant-labs/reliant/pull/2015)"
      - title: "web: dashboard charts — a real legend, palette, top-N + Other, and every panel kind the spec has"
        description: "[#2022](https://github.com/reliant-labs/reliant/pull/2022)"
      - title: "daemon: name the connected account by email"
        description: "[#2029](https://github.com/reliant-labs/reliant/pull/2029)"
      - title: "web: read each environment's declared shape on demand from the slim Live roster"
        description: "[#2047](https://github.com/reliant-labs/reliant/pull/2047)"
      - title: "release: release-tag.sh --rc accepts the RC commit's green release-gate record (the RC train's local gate), Actions' Release gate job as the fallback"
        description: "[#2084](https://github.com/reliant-labs/reliant/pull/2084)"
      - title: "web: one chart palette, --chart-1..6: brand blue, then violet, no green or red"
        description: "[#2069](https://github.com/reliant-labs/reliant/pull/2069)"
      - title: "web: chat and sidebar UX fixes: live tool groups, archive vs delete, status chips, keyboard parity"
        description: "[#2081](https://github.com/reliant-labs/reliant/pull/2081)"
      - title: "settings: Settings → Integrations lists every connection, to test, rename, re-default or revoke"
        description: "[#2074](https://github.com/reliant-labs/reliant/pull/2074)"
      - title: "web: the console hands broken things to an agent, and says when it cannot read deploy state"
        description: "[#2068](https://github.com/reliant-labs/reliant/pull/2068)"
      - title: "auth: one account per machine — login and daemon sign-in stay in step"
        description: "[#2059](https://github.com/reliant-labs/reliant/pull/2059)"
      - title: "web: Geist by default, the Reliant mark in the shell, one focus ring"
        description: "[#2062](https://github.com/reliant-labs/reliant/pull/2062)"
      - title: "web: split accent text (--primary-ink) off the --primary fill"
        description: "[#2058](https://github.com/reliant-labs/reliant/pull/2058)"
      - title: "web: settings UX fixes — dev-only Developer, true Privacy copy, project scope, IA, accessible tabs and theme"
        description: "[#2077](https://github.com/reliant-labs/reliant/pull/2077)"
  - title: "Changed"
    items:
      - title: "web: the settings layout test mocks the Automations section (#1971 added it without a QueryClient)"
        description: "[#1977](https://github.com/reliant-labs/reliant/pull/1977)"
      - title: "release: release candidates — gate a frozen commit off main, never main's tip"
