version: "v1.26.0"
date: "2026-11-21"
title: "8 new features, 10 fixes and 5 other changes"
summary: "Every pull request merged since v1.25.0, grouped by its conventional-commit type."
sections:
  - title: "Added"
    items:
      - title: "projects: internal ensure-for-app endpoint — a deploy's app gets a linked project in its org"
        description: "[#3088](https://github.com/reliant-labs/reliant/pull/3088)"
      - title: "config: typed client version policy, served on SystemService"
        description: "[#3062](https://github.com/reliant-labs/reliant/pull/3062)"
      - title: "web: restyle — chat"
        description: "[#3010](https://github.com/reliant-labs/reliant/pull/3010)"
      - title: "workflows: pin a workflow or node to a machine pool or labels"
        description: "[#2966](https://github.com/reliant-labs/reliant/pull/2966)"
      - title: "web: App hosting billing tab — editable budget, usage projection, free tier, limits strip, and billing for any org"
        description: "[#3068](https://github.com/reliant-labs/reliant/pull/3068)"
      - title: "worktree: list and archive workspaces from the CLI, scan --capture, and reclaim mode on without the storage reaper"
        description: "[#3163](https://github.com/reliant-labs/reliant/pull/3163)"
      - title: "deploy: declare the reliant CLI as build-only GoBuild variants"
        description: "[#3037](https://github.com/reliant-labs/reliant/pull/3037)"
      - title: "grpc: identify clients by Reliant-Client and refuse ones below the minimum"
        description: "[#3069](https://github.com/reliant-labs/reliant/pull/3069)"
  - title: "Changed"
    items:
      - title: "playwright: run the E2E jobs in the pinned Playwright image instead of installing system packages"
        description: "[#2916](https://github.com/reliant-labs/reliant/pull/2916)"
      - title: "call a hosted Forge API from a frontend hosted elsewhere, preview fork guard, declared direct apply"
        description: "[#3148](https://github.com/reliant-labs/reliant/pull/3148)"
      - title: "release: one desktop pack script for release.yml and forge's ShellBuild"
        description: "[#3041](https://github.com/reliant-labs/reliant/pull/3041)"
      - title: "ci: main's release gate runs static as three parts, four balanced go shards, a warm golangci-lint and 2 Playwright workers"
        description: "[#3166](https://github.com/reliant-labs/reliant/pull/3166)"
      - title: "handlers: one rpc per file in project, worktree, worktree_reclaim, plan, task, repo"
        description: "[#3007](https://github.com/reliant-labs/reliant/pull/3007)"
  - title: "Fixed"
    items:
      - title: "workflow: an interrupt settles the tool step in flight instead of re-dispatching it"
        description: "[#3135](https://github.com/reliant-labs/reliant/pull/3135)"
      - title: "workflow: YAML aliases expand templates like the value they point to"
        description: "[#3015](https://github.com/reliant-labs/reliant/pull/3015)"
      - title: "grpc: validate the ensure request's ids without a raw UserID comparison (TestNoRawOwnershipComparisons, red on main since #3088)"
        description: "[#3184](https://github.com/reliant-labs/reliant/pull/3184)"
      - title: "cli: daemon logs -n past 1MB, token rejection reasons, status while pairing, hidden token prompt, data dir held while awaiting credentials"
        description: "[#3112](https://github.com/reliant-labs/reliant/pull/3112)"
      - title: "workflow: a command node reattaches to its daemon command after a transport drop"
        description: "[#2985](https://github.com/reliant-labs/reliant/pull/2985)"
      - title: "triggers: ListTriggers resolves next fire times in parallel under a 3s budget"
        description: "[#3144](https://github.com/reliant-labs/reliant/pull/3144)"
      - title: "daemon: remove the credential.helper an old daemon wrote into each clone"
        description: "[#2987](https://github.com/reliant-labs/reliant/pull/2987)"
      - title: "mcp: chrome-devtools screenshots are saved by the daemon under the chat's path rules"
        description: "[#2925](https://github.com/reliant-labs/reliant/pull/2925)"
      - title: "merge-gate: mark a failed phase the runner's OOM killer ended with GATE-INFRA: oom"
        description: "[#3175](https://github.com/reliant-labs/reliant/pull/3175)"
      - title: "web: read observability usage from ObservabilityBillingService and derive env kind from placement fields"
        description: "[#3013](https://github.com/reliant-labs/reliant/pull/3013)"
