<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #111827; }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 14px; fill: #4b5563; }
    .note { font-size: 14px; fill: #6b7280; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, "Liberation Mono", monospace; font-size: 14px; fill: #374151; }
    .box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
    .slot { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ln { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="420" height="400" fill="#ffffff"/>

  <text x="14" y="28" class="t">Heavy slots: 16 vCPU, 32 GiB machine</text>
  <text x="14" y="50" class="s">min(CPUs/2, memory GiB/8) = min(8, 4) = 4 slots</text>

  <rect class="box" x="14" y="66" width="392" height="104" rx="6"/>
  <rect class="slot" x="28" y="82" width="86" height="72" rx="4"/>
  <rect class="slot" x="122" y="82" width="86" height="72" rx="4"/>
  <rect class="slot" x="216" y="82" width="86" height="72" rx="4"/>
  <rect class="slot" x="310" y="82" width="86" height="72" rx="4"/>
  <text x="71" y="123" text-anchor="middle" font-size="15">test</text>
  <text x="165" y="123" text-anchor="middle" font-size="15">lint</text>
  <text x="259" y="123" text-anchor="middle" font-size="15">generate</text>
  <text x="353" y="123" text-anchor="middle" font-size="15">gate</text>

  <line class="ln" x1="210" y1="232" x2="210" y2="174" marker-end="url(#ag)"/>
  <text x="222" y="206" class="s">a slot frees up</text>

  <rect class="wait" x="14" y="236" width="392" height="82" rx="6"/>
  <text x="28" y="262">the rest wait, roughly in order</text>
  <text x="28" y="288" class="mono">waiting for a heavy slot</text>
  <text x="28" y="307" class="s">a queue, not a hang</text>

  <text x="14" y="350" class="note">A slot is a file held with flock. If its</text>
  <text x="14" y="370" class="note">holder crashes, the OS frees the slot.</text>
</svg>
