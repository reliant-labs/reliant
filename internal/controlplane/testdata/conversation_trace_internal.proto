// TestGetConversationTrace_SpeaksTheVendoredContract holds the client to it.
syntax = "proto3";

// ConversationTraceInternalService is reliant's one door onto the spans of a
// chat that Reliant's own servers exported to tenant zero's ClickHouse (the
// staff store): the per-chat Trace tab of reliant's ChatTraceService
// (reliant dev-docs/design/agent-analytics.md §2.3, option A; plan item B1).
//
// THE TENANT BOUNDARY HERE IS THIS QUERY, NOT THE DATABASE. Every customer's
// agent spans live in tenant zero's database, so the statement is fixed and
// typed: it takes no filter, no attribute key, no trace id and no SQL. It
// selects only spans whose `org.id` span attribute equals the request's
// org_id AND whose `gen_ai.conversation.id` equals its conversation_id, that
// Reliant's own platform services exported (`reliant.source = platform`,
// stamped by the gateway from the token's signed claim), in a window of at
// most seven days. A span of another org, or with no `org.id`, is never
// returned, even when it carries the same conversation id. Each span comes
// back with an allowlist of its attributes only (reliant
// dev-docs/observability-attributes.md); no resource attribute, status
// message or other key ever leaves.
//
// AUTHORIZATION OF THE PERSON IS THE CALLER'S. reliant decides that its
// caller may read the chat (authz.ReadChatAccess) and passes only that chat's
// own id and org. This service trusts the internal-service identity for that
// and checks nothing about people.
//
// Every RPC here requires an internal-service JWT (sub=internal-service,
// role=admin, signed with INTERNAL_SERVICE_SECRET) and refuses every other
// caller, a human session and any `rlat_` access token included.
//
// It is WITHHELD from the public contract (proto/public-api.txt): reliant
// speaks it as plain Connect HTTP+JSON.
package controlplane.v1;

import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/conversation_trace_internal/v1;conversation_trace_internalv1";

service ConversationTraceInternalService {
  option (forge.v1.service) = {
    name: "ConversationTraceInternalService"
    version: "1.0.0"
    description: "the spans of one chat, in one org, from tenant zero's store, for reliant's per-chat Trace tab"
  };

  // GetConversationTrace answers the spans of one conversation in one org,
  // oldest first, at most MaxSpans (2000) of them; truncated says there were
  // more. To read the rest, ask again with start_time at the last returned
  // span's start time and skip the span ids already read.
  //
  // Errors:
  //   - INVALID_ARGUMENT: no org_id or conversation_id, either one that is
  //     not an id, no start_time or end_time, end_time not after start_time,
  //     or a window longer than seven days.
  //   - RESOURCE_EXHAUSTED: this org asked too often (reason rate_limited,
  //     Retry-After set). The caller shows the trace as unavailable.
  //   - UNAVAILABLE / FAILED_PRECONDITION: the span store is not configured
  //     here or tenant zero is not provisioned. The caller shows the trace as
  //     unavailable, never as empty.
  rpc GetConversationTrace(GetConversationTraceRequest) returns (GetConversationTraceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {none: "read-only: one chat's spans; changes nothing"}
    };
  }
}

message GetConversationTraceRequest {
  // The org the chat belongs to (reliant's chat org id). Required. A span is
  // returned only when its `org.id` attribute is exactly this.
  string org_id = 1;
  // The chat id, matched against `gen_ai.conversation.id`. Required.
  string conversation_id = 2;
  // The window, start inclusive and end exclusive, both required, at most
  // seven days long (the span store's TTL). Spans are matched by start time.
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

message GetConversationTraceResponse {
  // Oldest first (start time, then span id).
  repeated ConversationSpan spans = 1;
  // More spans matched than were returned.
  bool truncated = 2;
}

// ConversationSpan is one span, reduced to fields the attribute reference
// allows out of the staff store.
message ConversationSpan {
  string trace_id = 1;
  string span_id = 2;
  // Empty for a root span.
  string parent_span_id = 3;
  // The span name: `chat <model>`, `execute_tool <tool>`, `workflow.node <id>`.
  string name = 4;
  // OTel span kind as stored (`Internal`, `Client`, `Server`, ...).
  string kind = 5;
  // The resource's service.name (`reliant-temporal-worker`, ...).
  string service_name = 6;
  google.protobuf.Timestamp start_time = 7;
  int64 duration_ns = 8;
  // `Unset`, `Ok` or `Error`. The status description is never returned: a
  // failure's class is the `error.type` attribute.
  string status_code = 9;
  // Span attributes, only keys in the allowlist
  // (internal/handlers/conversation_trace_internal/allowlist.go); every value as stored.
  map<string, string> attributes = 10;
  // Span events, only those in the event allowlist (`gen_ai.first_token`,
  // `gen_ai.retry_wait`), each with only its allowlisted attributes.
  repeated ConversationSpanEvent events = 11;
  // Span links (another span's ids, nothing else).
  repeated ConversationSpanLink links = 12;
}

message ConversationSpanEvent {
  string name = 1;
  google.protobuf.Timestamp time = 2;
  map<string, string> attributes = 3;
}

message ConversationSpanLink {
  string trace_id = 1;
  string span_id = 2;
}
