name: one_ring_planning_inline_model
workflow_ref: builtin://one-ring
canonical_workflow_ref: builtin://one-ring

core:
  use_workflow_loader: false
  expected_contracts:
    - node_path: planning
      input_policy: inline_inherit_parent_inputs
      workflow_identity: builtin://one-ring
      load_strategy: inline_embedded
    - node_path: planning/plan
      input_policy: ref_presets_args_defaults
      load_strategy: load_by_workflow_ref

validation:
  should_pass: true
  use_workflow_loader: false

runtime:
  checks:
    - type: one_ring_nested_plan_inherits_model
      node_path: planning/plan
      parent_inputs:
        mode: auto
        model: gpt-5
        ask: false
      expected_model: gpt-5