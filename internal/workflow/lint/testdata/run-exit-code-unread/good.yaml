name: fixture
entry: [backoff]
nodes:
# A fixed sleep's failure means nothing: not reported.
- id: backoff
  type: run
  timeout: 2m
  args: {command: sleep 60}
- id: build
  type: run
  timeout: 20m
  args: {command: make build}
- id: ok
  type: save_message
  args: {role: assistant, content: 'built (exit {{ nodes.build.exit_code }})'}
edges:
- {from: backoff, default: build}
- {from: build, default: ok}
