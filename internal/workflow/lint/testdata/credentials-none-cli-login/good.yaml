name: fixture
requires:
  cli_login: [claude]
entry: [review]
nodes:
- id: review
  type: run
  timeout: 15m
  args:
    credentials: inherit
    command: claude -p 'Review the diff in this checkout' > review.md
- id: done
  type: save_message
  args: {role: assistant, content: 'exit {{ nodes.review.exit_code }}'}
edges:
- {from: review, default: done}
