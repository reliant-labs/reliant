name: fixture
entry: [review]
nodes:
- id: review
  type: run
  timeout: 15m
  args:
    credentials: inherit
    command: |
      # claude in a comment is not a call
      echo "codex is mentioned, not called"
      git diff origin/main | claude -p 'Review this diff' > review.md
      ~/.local/bin/codex exec 'Summarise review.md'
- id: done
  type: save_message
  args: {role: assistant, content: 'exit {{ nodes.review.exit_code }}'}
edges:
- {from: review, default: done}
