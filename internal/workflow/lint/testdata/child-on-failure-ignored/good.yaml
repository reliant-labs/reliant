name: fixture
entry: [release]
nodes:
# A child with no on_failure of its own; this run's handler is the one that runs.
- id: release
  type: workflow
  ref: project://plain
on_failure:
  sequence:
  - id: reconcile
    type: save_message
    args: {role: assistant, content: 'failed at {{ failure.node_id }}'}
