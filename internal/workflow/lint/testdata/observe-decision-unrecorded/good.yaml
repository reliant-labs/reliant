name: fixture
entry: [plan]
nodes:
- id: plan
  type: compute
  outputs:
    cut: '{{ false }}'
    hold: '{{ "main_unchanged" }}'
  observe:
    events:
    - name: decision
      attributes:
        name: cut
        value: "{{ output.cut ? 'cut' : 'no_cut' }}"
        reason: '{{ output.hold }}'
- id: report
  type: save_message
  args: {role: assistant, content: 'cut={{ nodes.plan.cut }}'}
edges:
- {from: plan, default: report}
