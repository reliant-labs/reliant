name: fixture
entry: [plan]
observe:
  # `nodes` is not in observe's scope: a default is evaluated on every node.
  attributes: {first: '{{ nodes.plan.cut }}'}
nodes:
- id: plan
  type: compute
  outputs:
    cut: '{{ false }}'
    hold: '{{ "main_unchanged" }}'
  observe:
    events:
    - name: decision
      attributes:
        name: cut
        # A typo: plan has no output named `reason`.
        reason: '{{ output.reason }}'
- id: report
  type: save_message
  args: {role: assistant, content: 'cut={{ nodes.plan.cut }}'}
edges:
- {from: plan, default: report}
