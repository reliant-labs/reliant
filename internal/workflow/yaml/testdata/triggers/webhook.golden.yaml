name: deploy-hook
automation_only: true
description: Run when CI posts a deploy notification.
inputs:
    ref:
        type: string
entry: [deploy]
triggers:
    - name: ci-deploy
      webhook:
        hmac:
            header: X-Hub-Signature-256
            algorithm: sha256
            prefix: sha256=
            encoding: hex
      filter: trigger.payload.body.status == 'success'
      inputs:
        ref: '{{ trigger.payload.body.ref }}'
      prompt: Deploy {{ trigger.payload.body.ref }} and report the result.
    - name: zapier
      description: Unsigned hook for Zapier; the token in the URL authenticates it
      webhook: {}
nodes:
    - id: deploy
      type: call_llm
