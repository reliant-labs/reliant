name: pipeline-pr-sweep
title: Pipeline · daily PR sweep
hidden: true
automation_only: true
apiVersion: "0.0.5"
description: |
  The PR pipeline's daily sweep (redesign §6.4, the `pr_sweep` instance). Once a day it looks at every
  open PR of the project's enrolled repositories for one that fell through the cracks, and acts on each
  once (sweep.pr@1):
  - finish: wake builtin://pipeline-pr for it with the reason (a lost or overdue due time, a queue eject
    nothing acted on, a row its PR's own state left behind);
  - close: pr.close with the cited evidence (superseded by another PR), never on age alone, and never
    again for evidence a person overruled by reopening the PR;
  - ask: pr.needs_person (a person's page that was lost, a draft untouched for two weeks).
  The run's output is the report of every action. In a repository in shadow mode nothing is written to
  GitHub; the report shows what would have been. Inert until a repository is enrolled and the server's
  pipeline.enabled switch is on.

concurrency: {max_running: 1}
timeout: 1h

inputs:
  checks:
    type: array
    default: []
    description: The checks to run (superseded, stuck_in_queue, stale_needs_person, draft_abandoned, stale_pr); empty runs every one.

triggers:
  - name: daily
    description: Every day at 06:00 UTC
    schedule: {cron: ["0 6 * * *"]}

entry: [sweep]

nodes:
  - id: sweep
    type: action
    uses: reliant/sweep.pr@1
    with:
      checks: "{{ inputs.checks }}"

  - id: report
    type: save_message
    args:
      role: assistant
      content: "{{ nodes.sweep.is_error ? 'The PR sweep could not run: ' + nodes.sweep.content : nodes.sweep.content }}"

edges:
  - from: sweep
    default: report
