name: agent
title: Agent
apiVersion: "0.0.5"
description: |
  Standard interactive agent. Loops while LLM returns tool calls, returns when LLM responds with no tool calls.
  Will always start on a thread that is seeded with the user's message. User interaction occurs outside of the workflow. Uses inline save_message for frontend activity association.
presets:
  tag: agent
  default: general

inputs:
  mode:
    type: enum
    ui: toolbar
    enum: ["manual", "auto", "plan"]
    default: "auto"
    description: "Execution mode: manual = requires approval, auto = auto-approves, plan = read-only tools"

  model:
    type: model
    description: LLM model to use
    default:
      tags: ["flagship"]

  tools:
    type: tools
    default: ["tag:coding:default"]
    description: Available tools for the agent (empty = no tools)
  spawn_presets:
    type: preset
    tags: [agent]
    multi: true
    default:
      - general
      - researcher
      - code_reviewer
    description: Presets available for spawn tool (empty = spawn disabled)

  skills:
    type: array
    default: []
    description: |
      Namespaced skill paths (e.g. "forge/getting-started") to preload into the
      agent's context before the first turn, so it works from the source-of-truth
      skills instead of loading them by hand.

  system_prompt:
    type: string
    default: ""
    ui: hidden
    description: Override the system prompt (empty = use default)

  ask:
    type: boolean
    default: false
    description: When true, ask user for feedback after agent completes before returning
    ui: hidden

  # Hidden: prepended to system_prompt when mode='plan' (concatenates planning_prompt + system_prompt)
  planning_prompt:
    type: string
    ui: hidden
    default: |
      # PLANNING MODE ACTIVE

      You are currently operating in PLANNING MODE. Your role is fundamentally different from implementation mode:

      ## What Planning Mode Means

      You do NOT have access to code-modifying tools (write, edit, patch, create, delete, etc.). This is intentional and by design. Your job is to plan and organize, not to implement.

      ## Your Responsibilities

      1. **Understand Requirements** - Ask clarifying questions to fully understand what needs to be done
      2. **Break Down Tasks** - Decompose complex problems into clear, actionable tasks
      3. **Create Plans** - Use create_plan to document the approach
      4. **Define Tasks** - Use add_task to create specific, implementable tasks
      5. **Identify Dependencies** - Note what needs to happen in what order
      6. **Research & Analyze** - Use read-only tools (view, and the shell for searching) to understand the codebase
      7. **Document Findings** - Capture important patterns, constraints, and decisions

      ## Tools You Have

      - **Planning tools**: create_plan, update_plan, add_task, update_task, list_tasks, get_plan
      - **Read-only tools**: view, fetch, websearch, and the shell for searching (prefer `rg`, scoped to a relative path)
      - **Analysis tools**: Any MCP tools for reading/searching

      ## What You Should NOT Do

      - Do NOT attempt to modify code - you don't have those tools
      - Do NOT say "I'll create a file" or "I'll edit this" - you can't
      - Do NOT apologize for not having tools - this is the expected mode
      - Do NOT try to work around the restriction - embrace the planning role

      ## Workflow Example

      User: "Add a dark mode feature"

      Good response:
      1. "Let me analyze the current theming system" (use view/grep)
      2. "I'll create a plan for dark mode implementation" (use create_plan)
      3. "Breaking this into tasks:" (use add_task)
         - Task 1: Add dark mode state management
         - Task 2: Create dark mode color palette
         - Task 3: Update components to use theme
      4. "Here's the plan. Ready to switch to Auto or Manual mode?"

      Bad response:
      "I'll create the dark mode files now..." (trying to implement)

      ## Exiting Planning Mode

      When planning is complete, inform the user they can switch to Auto or Manual mode to execute the plan. You cannot switch modes yourself - the user controls this.
    description: System prompt appended when mode is 'plan' (customizable)

outputs:
  # The final assistant message from the agent
  message: "{{nodes.agent_loop.message}}"
  # The final response text (convenience accessor)
  response_text: "{{nodes.agent_loop.response_text}}"

# Entry point - replaces from: started edge
entry: [agent_loop]

nodes:
  - id: agent_loop
    type: loop
    # Continues while the last turn left work unfinished, OR the user said
    # something the model has not seen yet.
    #
    # stop_reason is the ONE answer to "did the model finish?" — call_llm
    # derives it in Go from the provider's finish reason, the tool calls, and
    # whether our stream was cut (internal/workflow/stopreason). This loop
    # continues on the four values where the model has more to do:
    #
    #   tool_use     it asked for tools; their results are new input
    #   incomplete   the provider paused the turn and expects it handed back
    #                (OpenAI end_turn:false, Anthropic pause_turn) — chat
    #                b43b41fe ended on "I'll inspect the local dev auth setup…"
    #                with no tool call, and exited here as if finished
    #   truncated    it hit its output cap mid-thought (chat 2308c394: 868s,
    #                64000 output tokens, reported as complete)
    #   interrupted  our stream was cut mid-flight (chat 7da3935c, thread
    #                5e3fe370: killed 1.75s in with two edits applied, reported
    #                to its parent as a clean finish)
    #
    # done / refused / error exit and yield to the user. stop_reason is a fact
    # about the turn that just ran, recomputed every iteration, so a healthy
    # turn always clears it — none of these can wedge the loop open. It is
    # never empty here: the runtime fills a missing value from tool_calls
    # before this condition runs.
    #
    # Note structured-agent.yaml STOPS on truncated. It is a sentinel loop, so
    # re-entering would re-issue the same doomed request; here, re-entering
    # resumes real unfinished work.
    #
    # has_feedback and pending_inbox are the other half: input from the user,
    # not a verdict on the turn. pending_inbox means exactly one thing — a real
    # queued message exists and the next call_llm will deliver it before
    # reading history (so re-entering ends history with a USER message). It is
    # set from an actual mailbox probe and nothing else. It used to also be set
    # from "the stream was interrupted", and that bricked chats: with an empty
    # mailbox the loop re-entered, the drain delivered nothing, history still
    # ended with the assistant, and every retry reproduced it. Keep it
    # truthful.
    #
    # The assistant-tail guard in call_llm is the backstop: a re-entered turn
    # whose history still ends with the assistant yields instead of calling
    # the provider — unless continue_turn says the previous turn was
    # "incomplete", where that tail is the expected shape.
    while: outputs.stop_reason in ['tool_use', 'incomplete', 'truncated', 'interrupted'] || outputs.has_feedback == true || outputs.pending_inbox == true
    inline:
      outputs:
        tool_calls: "{{nodes.call_llm.tool_calls}}"
        message: "{{nodes.call_llm.message}}"
        response_text: "{{nodes.call_llm.response_text}}"
        has_feedback: "{{has(nodes.ask_question) && has(nodes.ask_question.has_feedback) ? nodes.ask_question.has_feedback : false}}"
        # Guarded like its siblings: an iteration that has not reached call_llm
        # (or a replayed shape where the node output is absent) must evaluate
        # to false, not blow up the whole output evaluation.
        pending_inbox: "{{has(nodes.call_llm) && has(nodes.call_llm.pending_inbox) ? nodes.call_llm.pending_inbox : false}}"
        # Why the last turn ended (see the while-condition above). Defaults to
        # 'done' when call_llm has not run, so an iteration that never reached
        # it cannot hold the loop open on this term alone.
        stop_reason: "{{has(nodes.call_llm) && has(nodes.call_llm.stop_reason) ? nodes.call_llm.stop_reason : 'done'}}"

      entry: [call_llm]

      nodes:
        - id: call_llm
          type: call_llm
          save_message:
            role: "{{output.message.role}}"
            content: "{{output.message.text}}"
            tool_calls: "{{output.tool_calls}}"
          args:
            model: "{{inputs.model}}"
            skills: "{{inputs.skills}}"
            # The previous turn was paused by the provider, so history ends
            # with the assistant on purpose — call the provider anyway rather
            # than yielding. False on the first iteration (no outputs yet).
            continue_turn: "{{has(outputs.stop_reason) && outputs.stop_reason == 'incomplete'}}"
            system_prompt: >
              {{inputs.mode == 'plan' && inputs.planning_prompt != '' ? (inputs.system_prompt != '' ? inputs.system_prompt + "\n\n" : '') + inputs.planning_prompt : inputs.system_prompt}}
            # Plan mode gets plan-tagged tools plus the shell family — search runs
            # through the shell, since there are no dedicated grep/glob tools;
            # spawn available in all modes (child inherits preset config).
            #
            # preloaded_tools is the STARTING BUNDLE — what the agent is handed
            # with full schemas. In plan mode that is the plan-tagged tools plus
            # the shell family, which shapes what the agent reaches for first.
            #
            # loadable_tools is "*" because this is an assistant: it starts with
            # a focused set and reaches for the rest on demand. Some tools are
            # deliberately outside every default bundle for cost rather than
            # policy — generate_image spends real money on a provider the user
            # may not have configured — and load_tool is their only route.
            # Written out rather than left to the default so the intent is
            # visible, not inferred.
            #
            # `permission` is no longer varied by mode. It used to read
            # 'readonly' for plan, which promised more than it delivered — the
            # shell was granted at that tier too, so a plan-mode agent could
            # always redirect into a file. The tier was removed rather than left
            # to imply a guarantee it never made; a real read-only mode needs OS
            # containment and will return on that footing.
            tools_config:
              preloaded_tools: "{{inputs.mode == 'plan' ? ['tag:coding:plan', 'tag:shell'] : inputs.tools}}"
              loadable_tools: ["*"]
              spawn: "{{[spawn(workflow.name, inputs.spawn_presets)]}}"
              permission: mutating

        - id: approval
          type: approval
          args:
            title: Approve tool execution?
            timeout: 1h

        - id: execute_tools
          type: execute_tools
          save_message:
            role: tool
            content: ""
            tool_results: "{{output.tool_results}}"
          args:
            tool_calls: "{{nodes.call_llm.tool_calls}}"
            compaction_threshold: "{{nodes.call_llm.compaction_threshold}}"

        - id: compact
          type: compact
          timeout: "10m"
          args:
            # Summarize with the loop's own model: compaction only fires because
            # the thread outgrew THIS model's window, so a smaller-window
            # summarizer cannot hold the history it is being asked to summarize.
            model: "{{inputs.model}}"

        - id: ask_question
          type: ask_question
          args:
            metadata: '{"type":"ask_user","questions":[{"question":"The workflow is ready to continue. What would you like to do?","options":[{"label":"Continue","description":"Continue to the next step in the workflow"},{"label":"Provide feedback","description":"Give feedback or instructions to adjust before moving on"}]}]}'

      edges:
        - from: call_llm
          cases:
            - to: approval
              condition: size(nodes.call_llm.tool_calls) > 0 && inputs.mode == 'manual'
              label: "require_approval"
            # Plan mode falls through here too — plan-tagged tools are read-only, so auto-approve is safe
            - to: execute_tools
              condition: size(nodes.call_llm.tool_calls) > 0 && inputs.mode != 'manual'
              label: "auto_approve"

        # From call_llm: when no tool calls and ask is enabled, go to ask_question
        - from: call_llm
          cases:
            - to: ask_question
              condition: size(nodes.call_llm.tool_calls) == 0 && nodes.call_llm.stop_reason != 'incomplete' && inputs.ask
              label: "ask_user"

        # No edge when denied - iteration ends, loop continues (user can re-prompt)
        - from: approval
          cases:
            - to: execute_tools
              condition: nodes.approval.status == 'approved'
              label: "approved"

        - from: execute_tools
          cases:
            - to: compact
              condition: "nodes.execute_tools.thread_token_count > nodes.call_llm.compaction_threshold"
              label: "compact"

      ui:
        positions:
          workflow:
            x: -385
            y: 77
          call_llm:
            x: -89
            y: 79
          approval:
            x: 506
            y: -11
          execute_tools:
            x: 781
            y: 115
          compact:
            x: 1127
            y: 112
        switches:
          switch-call_llm:
            source_node: call_llm
            position:
              x: 211
              y: 63
            cases:
              - id: case-0
                condition: size(nodes.call_llm.tool_calls) > 0 && inputs.mode == 'manual'
                label: require_approval
              - id: case-1
                condition: size(nodes.call_llm.tool_calls) > 0 && inputs.mode != 'manual'
                label: auto_approve


edges: []

ui:
  positions:
    workflow:
      x: 150
      y: 270
    agent_loop:
      x: 446
      y: 254