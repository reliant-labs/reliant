name: directory_absolute_path_refused
description: >-
  An absolute directory names a tree outside the run's worktree: it is refused before a worktree is made.
inputs: {"env": "/etc"}
events: []
expect:
  outcome: failed
  completed: [check, invalid]
  not_reached: [wt, dir, patch, listing, fix, publish, pr]
  node_outputs:
    check: {valid: false, dir_mode: true}
