name: agent_loop_runs_for_real_across_attempts
description: >-
  The agent takeover with nothing black-boxed: the restricted autopilot-agent loop runs on its real graph, so
  the first attempt's brief and the second attempt's retry message (built from the previous attempt's
  outputs) are both rendered. The first attempt's verify fails, the second passes, and the PR opens.
inputs: {"env": "prod", "patch_mode": "agent", "advisories": ["CVE-2024-45338"], "verify_command": "task test:short"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: listing
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-list/v1", "env": "prod", "release": "v1.4.0",
         "findings": [{"id": "GO-2024-3333", "aliases": ["CVE-2024-45338"], "severity": "high",
                       "package": {"name": "golang.org/x/net", "version": "v0.30.0"}, "fixed_in": ["v0.33.0"]},
                      {"id": "GO-2024-9999", "aliases": null, "severity": "low",
                       "package": {"name": "golang.org/x/text", "version": "v0.3.0"}, "fixed_in": ["v0.3.8"]}]}
  # Attempt 1: the agent bumps and submits; the workflow's verify fails.
  - node: fix.attempts.fix.agent_loop.call_llm
    output:
      message: {role: assistant, text: ''}
      response_text: ''
      stop_reason: tool_use
      tool_calls: [{id: c0, name: submit_result, input: '{"outcome":"done","summary":"Bumped x/net.","pr_title":"fix(deps): bump x/net","commit_message":"fix(deps): bump x/net"}'}]
  - node: fix.attempts.fix.agent_loop.execute_tools
    output:
      message: {role: tool, text: ''}
      tool_results: [{tool_call_id: c0, content: 'ok'}]
      response_data: {submit_result: {outcome: done, summary: "Bumped x/net.", pr_title: "fix(deps): bump x/net", commit_message: "fix(deps): bump x/net"}}
      thread_token_count: 1000
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum"}
  - node: fix.attempts.verify
    output: {"exit_code": 1, "stdout": "--- FAIL: TestParse\nFAIL"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  # Attempt 2: told why, the agent fixes the caller and submits again; the check passes.
  - node: fix.attempts.fix.agent_loop.call_llm
    output:
      message: {role: assistant, text: ''}
      response_text: ''
      stop_reason: tool_use
      tool_calls: [{id: c1, name: submit_result, input: '{"outcome":"done","summary":"Bumped x/net and fixed the parser.","pr_title":"fix(deps): bump golang.org/x/net to v0.33.0","commit_message":"fix(deps): bump golang.org/x/net to v0.33.0"}'}]
  - node: fix.attempts.fix.agent_loop.execute_tools
    output:
      message: {role: tool, text: ''}
      tool_results: [{tool_call_id: c1, content: 'ok'}]
      response_data: {submit_result: {outcome: done, summary: "Bumped x/net and fixed the parser.", pr_title: "fix(deps): bump golang.org/x/net to v0.33.0", commit_message: "fix(deps): bump golang.org/x/net to v0.33.0"}}
      thread_token_count: 1000
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum\nfile:internal/feed/parse.go"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": [{\"id\": \"GO-2024-9999\", \"aliases\": null}]}"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 3, "insertions": 6, "deletions": 4}
  - node: pr
    output: {"is_error": false, "data": {"number": 17, "html_url": "https://github.com/acme/app/pull/17"}}
expect:
  outcome: completed
  skipped: [patch]
  completed: [listing, fix, fix.attempts.fix.agent_loop.execute_tools, publish, pr, opened]
  node_outputs:
    fix: {passed: true, iterations: 2, summary: "Bumped x/net and fixed the parser."}
    compose: {title: "fix(deps): bump golang.org/x/net to v0.33.0"}
