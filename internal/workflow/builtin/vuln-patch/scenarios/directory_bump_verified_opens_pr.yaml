name: directory_bump_verified_opens_pr
description: >-
  env `.` names the forge project's own directory, as `forge vuln patch .` reads it: the patcher scans the tree
  instead of reading an env's recorded findings. It is passed to forge quoted, the bump verifies, and the PR and
  its commit name the directory, not an env.
inputs: {"project": "forge", "env": "."}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws/forge\n/w/ws/forge\nacme/forge"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/forge"}}
  - node: patch
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "", "release": "", "dir": "/w/ws/forge", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2025-3487", "aliases": ["CVE-2025-22869"], "severity": "high",
                       "package": {"name": "golang.org/x/crypto", "version": "v0.31.0", "type": "go-module"}, "ecosystem": "go",
                       "installed": "v0.31.0", "target": "v0.35.0", "manifests": ["go.mod"], "status": "fixed"}],
         "bumps": [{"ecosystem": "go", "manifest": "go.mod", "package": "golang.org/x/crypto", "from": "v0.31.0", "to": "v0.35.0", "direct": true,
                    "commands": [["go", "get", "golang.org/x/crypto@v0.35.0"], ["go", "mod", "tidy"]]}],
         "verify": {"command": "task test:short", "source": "taskfile", "passed": true, "rescanned": ["."]},
         "summary": {"fixed": 1}, "exit_code": 0, "refusals": null, "notes": null}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 3, "deletions": 3}
  - node: pr
    output: {"is_error": false, "data": {"number": 21, "html_url": "https://github.com/acme/forge/pull/21"}}
expect:
  outcome: completed
  completed: [check, wt, dir, where, repo_info, patch, parsed, plan, route, compose, publish, pr, opened]
  skipped: [listing]
  not_reached: [fix, invalid, nothing, cannot_patch]
  outputs: {result: opened, pr_url: "https://github.com/acme/forge/pull/21"}
  node_outputs:
    check:
      valid: true
      dir_mode: true
      subject: "directory `.`"
      patch_args: ["'.'", "--no-pr", "--verify", "--json"]
    route: {kind: publish}
    compose:
      title: "fix(deps): patch GO-2025-3487"
      commit_message: "fix(deps): patch GO-2025-3487\n\nPatches GO-2025-3487 found in directory `.`."
