name: unreadable_repository_fails_before_patching
description: >-
  The checkout's origin names a GitHub repository the connection cannot read, so no PR could ever open. The
  run fails before the patcher or the agent spends anything.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/private"
  - node: repo_info
    output: {"is_error": true, "content": "404 Not Found"}
expect:
  outcome: failed
  completed: [repo_info, no_repo]
  not_reached: [patch, listing, fix, publish, pr]
