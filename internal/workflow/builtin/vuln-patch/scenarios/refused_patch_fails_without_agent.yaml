name: refused_patch_fails_without_agent
description: >-
  forge vuln patch exits 4: a named advisory's fix needs a major bump and nothing was changed. The run fails
  with the refusal and the hint to re-run in agent mode; no agent, branch or PR.
inputs: {"env": "prod", "advisories": ["GHSA-maj0-only-fix1"]}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 4
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": false,
         "findings": [], "bumps": [], "summary": {}, "exit_code": 4,
         "refusals": ["GHSA-maj0-only-fix1: the fix is only in v3.0.1, a new major (--allow-major)"]}
expect:
  outcome: failed
  completed: [route, cannot_patch]
  not_reached: [fix, compose, publish, pr]
  node_outputs:
    route:
      kind: refused
      detail: "forge vuln patch refused and changed nothing: GHSA-maj0-only-fix1: the fix is only in v3.0.1, a new major (--allow-major). Re-run with patch_mode agent to have the agent take it (a fix only in a new major needs that)."
