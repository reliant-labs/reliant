name: deterministic_bump_verified_opens_pr
description: >-
  forge vuln patch exits 0: every finding bumped and verified. No agent runs; git_publish pushes vuln-patch/<run>
  and the PR opens against the default branch.
inputs: {"env": "prod", "advisories": ["CVE-2024-45338"]}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "aliases": ["CVE-2024-45338", "GHSA-w32m-9786-jp63"], "severity": "high",
                       "package": {"name": "golang.org/x/net", "version": "v0.30.0", "type": "go-module"}, "ecosystem": "go",
                       "installed": "v0.30.0", "target": "v0.33.0", "manifests": ["go.mod"], "status": "fixed"}],
         "bumps": [{"ecosystem": "go", "manifest": "go.mod", "package": "golang.org/x/net", "from": "v0.30.0", "to": "v0.33.0", "direct": true,
                    "commands": [["go", "get", "golang.org/x/net@v0.33.0"], ["go", "mod", "tidy"]]}],
         "verify": {"command": "task test:short", "source": "taskfile", "passed": true, "rescanned": ["."]},
         "summary": {"fixed": 1}, "exit_code": 0, "refusals": null, "notes": null}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/default-", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 3, "deletions": 3}
  - node: pr
    output: {"is_error": false, "data": {"number": 12, "html_url": "https://github.com/acme/app/pull/12"}}
expect:
  outcome: completed
  completed: [check, wt, dir, where, repo_info, patch, parsed, plan, route, compose, publish, pr, opened]
  skipped: [listing]
  not_reached: [fix, approve, agent_failed, nothing, cannot_patch, invalid]
  node_outputs:
    route: {kind: publish}
    compose: {title: "fix(deps): patch GO-2024-3333"}
