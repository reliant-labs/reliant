name: nothing_to_patch_completes_without_pr
description: >-
  forge vuln patch exits 0 having changed nothing: the env has no finding with a fix. The run completes with a
  message, and no agent, branch or PR.
inputs: {"env": "staging"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "staging", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": false,
         "findings": [], "bumps": [], "summary": {}, "exit_code": 0, "notes": ["2 finding(s) with no fixed version left out (name one to see why)"]}
expect:
  outcome: completed
  completed: [patch, route, nothing]
  not_reached: [fix, compose, publish, pr, cannot_patch]
  node_outputs:
    route: {kind: nothing}
