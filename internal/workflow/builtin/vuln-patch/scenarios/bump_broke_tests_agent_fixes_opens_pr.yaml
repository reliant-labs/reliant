name: bump_broke_tests_agent_fixes_opens_pr
description: >-
  forge vuln patch exits 1: the bump applied but the project's tests broke. The agent takes over, adapts the
  code, and the workflow's own check (no test weakened, verify passes, rescan clean of the target) passes on the
  first attempt, so the branch is published and the PR opens with the agent's title. A finding that is not a
  target still showing in the rescan does not block it.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "aliases": ["CVE-2024-45338"], "severity": "high",
                       "package": {"name": "golang.org/x/net", "version": "v0.30.0"}, "ecosystem": "go",
                       "installed": "v0.30.0", "target": "v0.33.0", "manifests": ["go.mod"], "status": "still_present", "reason": "verification failed"}],
         "bumps": [{"ecosystem": "go", "manifest": "go.mod", "package": "golang.org/x/net", "from": "v0.30.0", "to": "v0.33.0", "direct": true,
                    "commands": [["go", "get", "golang.org/x/net@v0.33.0"]]}],
         "verify": {"command": "task test:short", "source": "taskfile", "passed": false,
                    "output": "--- FAIL: TestParseFeed (0.01s)\n    feed_test.go:40: html.Parse: unexpected EOF", "rescanned": ["."]},
         "summary": {"still_present": 1}, "exit_code": 1, "refusals": null, "notes": null}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "model": "test-model", "stop_reason": "done", "turns": 14,
             "response": {"outcome": "done", "summary": "Bumped golang.org/x/net to v0.33.0 and handled the new EOF error in the feed parser.",
                          "pr_title": "fix(deps): bump golang.org/x/net to v0.33.0 (CVE-2024-45338)",
                          "commit_message": "fix(deps): bump golang.org/x/net to v0.33.0\n\nCVE-2024-45338."}}
  - node: fix.attempts.guard
    output:
      exit_code: 0
      stdout: "file:go.mod\nfile:go.sum\nfile:internal/feed/parse.go"
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok  example.com/app/internal/feed"}
  - node: fix.attempts.scan
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-list/v1", "findings": [{"id": "GHSA-unrelated-0000", "aliases": null, "severity": "low"}]}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 3, "insertions": 12, "deletions": 5}
  - node: pr
    output: {"is_error": false, "data": {"number": 13, "html_url": "https://github.com/acme/app/pull/13"}}
expect:
  outcome: completed
  completed: [patch, fix, fix.attempts, fix.attempts.guard, fix.attempts.verify, fix.attempts.scan, compose, publish, pr, opened]
  not_reached: [agent_failed, approve, denied, cannot_patch]
  node_outputs:
    route: {kind: agent}
    fix: {passed: true, iterations: 1, code_files: ["internal/feed/parse.go"]}
    compose: {title: "fix(deps): bump golang.org/x/net to v0.33.0 (CVE-2024-45338)"}
