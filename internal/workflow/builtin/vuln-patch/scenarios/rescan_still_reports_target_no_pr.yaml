name: rescan_still_reports_target_no_pr
description: >-
  The agent reports done and the verify command passes, but `forge vuln scan . --json` still reports the
  targeted finding under one of its aliases. With max_agent_iterations 1 the run ends failed: a green build is
  not enough, the rescan must show the target gone.
inputs: {"env": "prod", "max_agent_iterations": 1}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "aliases": ["CVE-2024-45338"], "severity": "high", "package": {"name": "golang.org/x/net", "version": "v0.30.0"},
                       "installed": "v0.30.0", "target": "v0.33.0", "status": "failed", "reason": "go get: module lookup disabled"}],
         "bumps": [{"ecosystem": "go", "manifest": "go.mod", "package": "golang.org/x/net", "from": "v0.30.0", "to": "v0.33.0", "direct": true,
                    "commands": [["go", "get", "golang.org/x/net@v0.33.0"]], "error": "go: module lookup disabled by GOPROXY=off"}],
         "verify": {"command": "task test:short", "source": "taskfile", "passed": true, "rescanned": ["."]},
         "summary": {"failed": 1}, "exit_code": 1}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Bumped golang.org/x/net.", "pr_title": "fix(deps): bump x/net", "commit_message": "fix(deps): bump x/net"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-list/v1", "findings": [{"id": "GHSA-w32m-9786-jp63", "aliases": ["CVE-2024-45338"], "severity": "high"}]}
expect:
  outcome: failed
  completed: [fix, agent_failed]
  not_reached: [compose, publish, pr]
  node_outputs:
    fix: {passed: false, iterations: 1, still_present: ["GO-2024-3333"], reasons: ["the rescan still reports GO-2024-3333"]}
