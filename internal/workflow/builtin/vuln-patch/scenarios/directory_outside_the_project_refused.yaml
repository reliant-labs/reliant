name: directory_outside_the_project_refused
description: >-
  A directory env that climbs out of the forge project (`..`) is refused before a worktree is made, like any
  env that is not a plain token.
inputs: {"env": "../control-plane"}
events: []
expect:
  outcome: failed
  completed: [check, invalid]
  not_reached: [wt, dir, patch, listing, fix, publish, pr]
  node_outputs:
    check: {valid: false}
  outputs: {result: failed, pr_url: ""}
