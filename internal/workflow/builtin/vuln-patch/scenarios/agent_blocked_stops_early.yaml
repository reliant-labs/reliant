name: agent_blocked_stops_early
description: >-
  The agent reports blocked on its first attempt (the fix needs something it must not do). The loop stops at
  once rather than spending the remaining iterations, nothing is verified or published, and the run fails.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 2
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": false,
         "findings": [{"id": "CVE-2025-0001", "severity": "critical", "package": {"name": "openssl", "version": "3.0.1"},
                       "installed": "3.0.1", "status": "skipped", "reason": "no Dockerfile builds this image"}],
         "bumps": [], "summary": {"skipped": 1}, "exit_code": 2}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "blocked", "summary": "The image is built from deploy/ configuration, which I must not change."}}
expect:
  outcome: failed
  completed: [fix, agent_failed]
  skipped: [fix.attempts.guard, fix.attempts.verify, fix.attempts.scan]
  not_reached: [compose, publish, pr]
  node_outputs:
    fix: {passed: false, blocked: true, iterations: 1, reasons: ["the agent reported blocked"]}
