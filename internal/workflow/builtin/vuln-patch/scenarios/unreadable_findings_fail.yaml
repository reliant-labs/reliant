name: unreadable_findings_fail
description: >-
  forge vuln patch exits 2 without printing a document (the env's findings could not be read: no scan of its
  release). There is nothing to hand an agent, so the run fails with forge's error.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output: {"exit_code": 2, "stdout": "", "stderr": "nothing to patch from: no artifact of prod release v1.4.0 has a scan"}
expect:
  outcome: failed
  completed: [route, cannot_patch]
  not_reached: [fix, compose, publish, pr]
  node_outputs:
    route: {kind: error}
