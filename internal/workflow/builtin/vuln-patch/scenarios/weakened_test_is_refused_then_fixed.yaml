name: weakened_test_is_refused_then_fixed
description: >-
  forge vuln patch exits 2: one finding had no deterministic route. On the first attempt the agent deletes a
  failing test; verify and rescan pass, but the workflow's guard sees the deleted test, so the attempt does not
  pass and the next one is told to revert it. The second attempt is clean and the PR opens.
inputs: {"env": "prod", "advisories": ["GHSA-1111-2222-3333"]}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 2
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": false,
         "findings": [{"id": "GHSA-1111-2222-3333", "severity": "high", "package": {"name": "github.com/acme/rpc", "version": "v1.2.0"},
                       "installed": "v1.2.0", "target": "", "status": "skipped", "reason": "the fix is only in v2.0.0 (a new major): --allow-major takes it"}],
         "bumps": [], "summary": {"skipped": 1}, "exit_code": 2}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Moved to v2.", "pr_title": "fix(deps): acme/rpc v2", "commit_message": "fix(deps): acme/rpc v2"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum\nfile:internal/rpc/client_test.go\ndeleted:internal/rpc/client_test.go"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Moved to acme/rpc v2, restored the test and adapted the client to the new Dial signature.",
                                             "pr_title": "fix(deps): move to acme/rpc v2 (GHSA-1111-2222-3333)", "commit_message": "fix(deps): move to acme/rpc v2"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum\nfile:internal/rpc/client.go"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 3, "insertions": 20, "deletions": 11}
  - node: pr
    output: {"is_error": false, "data": {"number": 15, "html_url": "https://github.com/acme/app/pull/15"}}
expect:
  outcome: completed
  completed: [patch, fix, publish, pr, opened]
  node_outputs:
    route: {kind: agent}
    fix: {passed: true, iterations: 2, code_files: ["internal/rpc/client.go"]}
