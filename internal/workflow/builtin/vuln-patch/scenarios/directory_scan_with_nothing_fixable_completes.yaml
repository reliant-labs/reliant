name: directory_scan_with_nothing_fixable_completes
description: >-
  patch_mode agent on `./tools`: the scan reports only a finding with no fixed version, so nothing is targeted.
  The run completes with a message naming the directory and the scan, and no agent, branch or PR.
inputs: {"env": "./tools", "patch_mode": "agent"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: listing
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-list/v1",
         "findings": [{"id": "GHSA-nofx-left-0002", "severity": "medium",
                       "package": {"name": "left-pad", "version": "1.0.0"}, "fix_state": "not-fixed"}]}
expect:
  outcome: completed
  skipped: [patch]
  completed: [listing, route, nothing]
  not_reached: [fix, compose, publish, pr, cannot_patch]
  node_outputs:
    check: {list_args: ["scan", "'./tools'", "--json"]}
    route: {kind: nothing}
  messages:
    nothing:
      saved: true
      content_contains: ["Nothing to patch in directory `./tools`:", "forge vuln scan reports no fixable finding"]
