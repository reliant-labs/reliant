name: agent_exhausts_iterations_no_pr
description: >-
  The bump broke the tests and the agent cannot make them pass: the verify command still fails after
  max_agent_iterations (2) attempts. The loop stops there, nothing is published, no PR opens, and the run ends
  failed with the agent's summary and the verify output.
inputs: {"env": "prod", "max_agent_iterations": 2}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GHSA-abcd-1234-wxyz", "severity": "critical", "package": {"name": "left-pad", "version": "1.2.0"},
                       "ecosystem": "npm", "installed": "1.2.0", "target": "1.3.1", "status": "still_present", "reason": "verification failed"}],
         "bumps": [{"ecosystem": "npm", "manifest": "package-lock.json", "package": "left-pad", "from": "1.2.0", "to": "1.3.1", "direct": true,
                    "commands": [["npm", "install", "left-pad@1.3.1"]]}],
         "verify": {"command": "npm test", "source": "npm", "passed": false, "output": "1 failing", "rescanned": ["."]},
         "summary": {"still_present": 1}, "exit_code": 1}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Adapted the padding call.", "pr_title": "fix(deps): bump left-pad", "commit_message": "fix(deps): bump left-pad"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:package.json\nfile:package-lock.json\nfile:src/pad.js"}
  - node: fix.attempts.verify
    output: {"exit_code": 1, "stdout": "  1 failing\n  pad() pads to width: AssertionError"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Tried a different width calculation; the assertion still fails.", "pr_title": "fix(deps): bump left-pad", "commit_message": "fix(deps): bump left-pad"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:package.json\nfile:package-lock.json\nfile:src/pad.js"}
  - node: fix.attempts.verify
    output: {"exit_code": 1, "stdout": "  1 failing\n  pad() pads to width: AssertionError"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
expect:
  outcome: failed
  completed: [fix, agent_failed]
  not_reached: [approve, compose, publish, pr, opened]
  node_outputs:
    fix: {passed: false, blocked: false, iterations: 2, summary: "Tried a different width calculation; the assertion still fails.", reasons: ["the verify command failed (`npm test`)"]}
