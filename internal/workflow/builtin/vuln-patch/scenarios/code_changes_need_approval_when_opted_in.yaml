name: code_changes_need_approval_when_opted_in
description: >-
  approve_code_changes is on and the agent changed a source file beyond the manifests, so a person is asked
  before the PR opens. They approve, and the PR opens.
inputs: {"env": "prod", "approve_code_changes": true}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "severity": "high", "package": {"name": "golang.org/x/net", "version": "v0.30.0"},
                       "installed": "v0.30.0", "target": "v0.33.0", "status": "still_present", "reason": "verification failed"}],
         "bumps": [], "verify": {"command": "go build ./... && go test -short ./...", "source": "go", "passed": false, "rescanned": []},
         "summary": {"still_present": 1}, "exit_code": 1}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Adapted the parser.", "pr_title": "fix(deps): bump x/net", "commit_message": "fix(deps): bump x/net"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum\nfile:internal/feed/parse.go"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: approve
    output: {"status": "approved", "approval_id": "a1", "action_taken": "approved"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 3, "insertions": 4, "deletions": 2}
  - node: pr
    output: {"is_error": false, "data": {"number": 16, "html_url": "https://github.com/acme/app/pull/16"}}
expect:
  outcome: completed
  completed: [fix, approve, compose, publish, pr, opened]
  not_reached: [denied]
