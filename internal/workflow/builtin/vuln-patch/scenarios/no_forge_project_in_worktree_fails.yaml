name: no_forge_project_in_worktree_fails
description: >-
  The project input names a directory with no forge.yaml. The run fails before anything is patched, saying
  what to set.
inputs: {"env": "prod", "project": "web"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 1, "stdout": "", "stderr": "/w/ws/web has no forge.yaml: set the project input to the forge project's path in the worktree"}
expect:
  outcome: failed
  completed: [proj, dir, where, no_checkout]
  not_reached: [repo_info, patch, listing, fix, publish, pr]
  node_outputs:
    proj: {path: /w/ws/web}
