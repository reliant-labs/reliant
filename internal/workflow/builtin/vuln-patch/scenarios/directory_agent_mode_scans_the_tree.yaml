name: directory_agent_mode_scans_the_tree
description: >-
  patch_mode agent with a directory: `forge vuln list` takes only an env, so the findings come from
  `forge vuln scan <dir> --json` (exit 1: a blocking finding, document printed). A scan has no --fixable, so the
  workflow keeps only the findings with a fix; the agent patches that one and the PR opens.
inputs: {"env": "frontends/web", "patch_mode": "agent"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: listing
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-list/v1",
         "findings": [{"id": "GHSA-fix0-able-0001", "aliases": ["CVE-2025-2222"], "severity": "critical",
                       "package": {"name": "vite", "version": "5.4.0"}, "fixed_in": ["5.4.12"], "fix_state": "fixed"},
                      {"id": "GHSA-nofx-left-0002", "severity": "medium",
                       "package": {"name": "left-pad", "version": "1.0.0"}, "fix_state": "not-fixed"}]}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Bumped vite to 5.4.12.",
                                             "pr_title": "fix(deps): bump vite to 5.4.12 (CVE-2025-2222)", "commit_message": "fix(deps): bump vite"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:frontends/web/package.json\nfile:frontends/web/package-lock.json"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 4, "deletions": 4}
  - node: pr
    output: {"is_error": false, "data": {"number": 22, "html_url": "https://github.com/acme/app/pull/22"}}
expect:
  outcome: completed
  skipped: [patch]
  completed: [listing, fix, publish, pr, opened]
  node_outputs:
    check:
      valid: true
      dir_mode: true
      list_args: ["scan", "'frontends/web'", "--json"]
    plan:
      targets:
        - {"id": "GHSA-fix0-able-0001", "names": ["GHSA-fix0-able-0001", "CVE-2025-2222"], "package": "vite",
           "installed": "5.4.0", "fixed_in": "5.4.12", "status": "", "reason": ""}
    route: {kind: agent}
    fix: {passed: true, iterations: 1}
