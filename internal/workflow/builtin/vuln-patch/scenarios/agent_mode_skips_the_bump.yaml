name: agent_mode_skips_the_bump
description: >-
  patch_mode agent: forge vuln patch never runs. The targets come from `forge vuln list <env> --json --fixable`,
  the agent does the whole patch, the workflow's check passes, and the PR opens. With no verify_command and no
  patcher document, the verify command is the fallback gate.
inputs: {"env": "prod", "patch_mode": "agent"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws/api\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "trunk", "full_name": "acme/app"}}
  - node: listing
    output:
      exit_code: 1
      stdout: |
        {"schema": "forge.dev/vuln-list/v1", "env": "prod", "release": "v2.0.1",
         "findings": [{"id": "GHSA-maj0-only-fix1", "aliases": ["CVE-2025-1111"], "severity": "high",
                       "package": {"name": "github.com/acme/yaml", "version": "v2.4.0"}, "fixed_in": ["v3.0.1"]}]}
  - node: fix.attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Moved to github.com/acme/yaml/v3 and updated the two call sites.",
                                             "pr_title": "fix(deps): move to acme/yaml v3 (CVE-2025-1111)", "commit_message": "fix(deps): move to acme/yaml v3"}}
  - node: fix.attempts.guard
    output: {"exit_code": 0, "stdout": "file:api/go.mod\nfile:api/go.sum\nfile:api/internal/config/load.go"}
  - node: fix.attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: fix.attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 3, "insertions": 9, "deletions": 9}
  - node: pr
    output: {"is_error": false, "data": {"number": 14, "html_url": "https://github.com/acme/app/pull/14"}}
expect:
  outcome: completed
  skipped: [patch]
  completed: [listing, fix, publish, pr, opened]
  node_outputs:
    route: {kind: agent}
    fix: {passed: true, iterations: 1}
    compose: {title: "fix(deps): move to acme/yaml v3 (CVE-2025-1111)"}
