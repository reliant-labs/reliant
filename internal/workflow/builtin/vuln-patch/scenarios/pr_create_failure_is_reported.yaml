name: pr_create_failure_is_reported
description: >-
  The patch verified and the branch was pushed, but GitHub refused the pull request. The run fails naming the
  pushed branch.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "severity": "high", "package": {"name": "golang.org/x/net", "version": "v0.30.0"},
                       "installed": "v0.30.0", "target": "v0.33.0", "status": "fixed"}],
         "bumps": [], "verify": {"command": "task test:short", "source": "taskfile", "passed": true, "rescanned": ["."]},
         "summary": {"fixed": 1}, "exit_code": 0}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "vuln-patch/x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 2, "deletions": 2}
  - node: pr
    output: {"is_error": true, "content": "422 Validation Failed: a pull request already exists"}
expect:
  outcome: failed
  completed: [publish, pr, pr_failed]
  not_reached: [opened]
