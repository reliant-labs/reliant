name: git_publish_refusal_opens_nothing
description: >-
  The patch verified, but git_publish refuses the push (a protected branch pattern). No PR opens and the run
  fails with the refusal.
inputs: {"env": "prod"}
events:
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output:
      exit_code: 0
      stdout: "/w/ws\n/w/ws\nacme/app"
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/app"}}
  - node: patch
    output:
      exit_code: 0
      stdout: |
        {"schema": "forge.dev/vuln-patch/v1", "env": "prod", "release": "v1.4.0", "dir": "/w/ws", "allow_major": false, "changed": true,
         "findings": [{"id": "GO-2024-3333", "severity": "high", "package": {"name": "golang.org/x/net", "version": "v0.30.0"},
                       "installed": "v0.30.0", "target": "v0.33.0", "status": "fixed"}],
         "bumps": [], "verify": {"command": "task test:short", "source": "taskfile", "passed": true, "rescanned": ["."]},
         "summary": {"fixed": 1}, "exit_code": 0}
  - node: publish
    output: {"pushed": false, "refused": true, "refusal": "branch vuln-patch/x is protected", "branch": "vuln-patch/x", "sha": "", "files_changed": 0, "insertions": 0, "deletions": 0}
expect:
  outcome: failed
  completed: [publish, publish_failed]
  not_reached: [pr, opened]
