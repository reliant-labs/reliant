name: directory_segment_that_reads_as_a_flag_refused
description: >-
  A directory env whose path starts with `-` would reach forge as a flag, not a directory: it is refused before
  a worktree is made.
inputs: {"env": "-rf/x"}
events: []
expect:
  outcome: failed
  completed: [check, invalid]
  not_reached: [wt, dir, patch, listing, fix, publish, pr]
  node_outputs:
    check: {valid: false, dir_mode: true}
