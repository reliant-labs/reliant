---
# Max turns without response - loop stops when max_turns reached without response tool
#
# The while condition includes max_turns enforcement:
#   (outputs.completed != true || outputs.has_feedback == true)
#     && (inputs.max_turns == 0 || iter.iteration < inputs.max_turns)
#
# With max_turns=3, the LLM never calls tools for 3 iterations
# After iteration 2, iter.iteration=3, 3 < 3 = false → loop exits
# completed is never set to true since response tool was never called
name: max_turns_without_response
description: Loop stops when max_turns reached and agent never called response tool
inputs:
  mode: auto
  max_turns: 3
  response_tool_name: submit_response
events:
  # Iteration 0: LLM responds without tools, gets reminded
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "I'm thinking about how to approach this."
      response_text: "I'm thinking about how to approach this."
      tool_calls: []
  # remind_response triggers because no tool calls

  # Iteration 1: LLM still doesn't use tools
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Let me analyze the problem more."
      response_text: "Let me analyze the problem more."
      tool_calls: []
  # remind_response triggers again

  # Iteration 2: LLM still doesn't use response tool
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "I need more time to think."
      response_text: "I need more time to think."
      tool_calls: []
  # remind_response triggers again
  # Ask fires at iteration 3 (3 >= 3), loop asks/exits
  # Note: completed is never set to true since response tool was never called
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.remind_response
  not_reached:
    - agent_loop.execute_tools
    - agent_loop.approval

---
# Custom response tool name with regular tools first
# Regression test for "CEL evaluation error: no such key: submit_review"
# When checklist invokes structured-agent with response_tool_name=submit_review,
# and the LLM calls regular tools before the response tool, the response_data
# map doesn't contain "submit_review" yet. The output expressions must handle this.
name: custom_response_tool_with_regular_tools
description: Custom response_tool_name (submit_review) with regular tools called first
inputs:
  mode: auto
  max_turns: 100
  response_tool_name: submit_review
  response_schema:
    type: object
    required: [grade, summary]
    properties:
      grade:
        type: string
        enum: [pass, fail]
      summary:
        type: string
events:
  # Iteration 1: LLM uses bash tool (not submit_review)
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Let me check the code changes."
      response_text: "Let me check the code changes."
      tool_calls:
        - id: call_0
          name: bash
          input: '{"command":"git diff HEAD~1"}'
  # execute_tools runs for bash — response_data does NOT contain submit_review
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_0
          content: "diff --git a/main.go b/main.go\n+func hello() { ... }"
      response_data:
        submit_review: null
      thread_token_count: 500
  # Iteration 2: LLM now calls submit_review
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Review complete."
      response_text: "Review complete."
      tool_calls:
        - id: call_1
          name: submit_review
          input: '{"grade":"pass","summary":"Implementation looks clean and follows best practices."}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_1
          content: '{"grade": "pass", "summary": "Implementation looks clean and follows best practices."}'
      response_data:
        submit_review:
          grade: "pass"
          summary: "Implementation looks clean and follows best practices."
      thread_token_count: 600
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    - agent_loop.remind_response
    - agent_loop.approval

---
# Spawn with regular tools: response_data absent from execute_tools output
# Tests the fix for the CEL "no such overload" crash that occurred when:
# 1. LLM calls a spawn tool alongside regular tools (not the response tool)
# 2. buildFinalToolResult drops response_data from the combined result
# 3. normalizeOutput backfills response_data as nil (proto pointer zero-value)
# 4. CEL "in" operator has no overload for "string in null" → crash
#
# The fix adds null guards in the agent_loop outputs so response_data == null
# is handled gracefully instead of crashing.
name: spawn_drops_response_data
description: |
  When spawn tools mix with regular tools, buildFinalToolResult only includes
  tool_results and message — response_data is absent. normalizeOutput backfills
  it as nil. The null guard in the CEL expression must prevent "in null" crash.
inputs:
  mode: auto
  max_turns: 100
  response_tool_name: submit_response
  spawn_presets:
    - researcher
    - code_reviewer
events:
  # Iteration 1: LLM calls regular tool
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Let me check the file."
      response_text: "Let me check the file."
      tool_calls:
        - id: call_0
          name: grep
          input: '{"pattern":"TODO","path":"src/"}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_0
          content: "src/main.go:42: // TODO: refactor"
      response_data:
        submit_response: null
      thread_token_count: 500

  # Iteration 2: LLM calls spawn + regular tool.
  # In the real runtime, buildFinalToolResult constructs a combined result
  # with ONLY tool_results and message — response_data is dropped entirely.
  # normalizeOutput then backfills response_data as nil.
  # Simulate this by omitting response_data from the output entirely.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Spawning a researcher and also checking the file."
      response_text: "Spawning a researcher and also checking the file."
      tool_calls:
        - id: call_spawn
          name: spawn
          input: '{"preset":"researcher","prompt":"Investigate TODO items"}'
        - id: call_view
          name: view
          input: '{"file_path":"src/main.go"}'
  # response_data is ABSENT — this is the bug trigger.
  # Without the null guard fix, CEL evaluates "submit_response" in null → crash.
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_spawn
          content: '{"agent_id": "spawned-123", "status": "started"}'
        - tool_call_id: call_view
          content: '{"result": "package main\\n\\nfunc main() {}\\n"}'
      thread_token_count: 600

  # Iteration 3: LLM calls response tool
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Analysis complete."
      response_text: "Analysis complete."
      tool_calls:
        - id: call_response
          name: submit_response
          input: '{"choice":"complete","value":"Found 1 TODO item. Spawned researcher for deeper analysis."}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_response
          content: '{"choice": "complete"}'
      response_data:
        submit_response:
          choice: complete
          value: "Found 1 TODO item. Spawned researcher for deeper analysis."
      thread_token_count: 700
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    - agent_loop.remind_response
    - agent_loop.approval