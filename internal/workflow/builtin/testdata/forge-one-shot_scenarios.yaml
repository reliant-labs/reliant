# Test scenarios for forge-one-shot.yaml workflow
#
# Five-phase workflow:
#   scope_conversation → scaffold_and_verify → frontend_polish → frontend_done →
#   mvp_backend (single agent) → mvp_verify (run: generate+build) → mvp_done →
#   production_polish → success
#
# scaffold_and_verify and production_polish are get-it-right loops (emit strategy/stuck).
# mvp_backend is a single agent pass; mvp_verify is the fail-loud build gate.
#
# Failure / escalation paths (collapsed terminals):
#   get-it-right stuck (tooling/env)      → stuck
#   scaffold/production strategy != pass  → failed
#   mvp_verify exit_code != 0             → failed

---
name: happy_path
description: All phases pass. Full pipeline to success.

events:
  - node: scope_conversation
    output:
      message: "FORGE_PLAN.md written. Ready to scaffold."
      response_text: "I've written FORGE_PLAN.md with the project spec."

  - node: scaffold_and_verify
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Project scaffolded, proto files generated, build passes, FORGE_PLAN.md exists."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: frontend_polish
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Frontend polished with working CRUD integration."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: mvp_backend
    output:
      response_text: "Core features implemented. Ran forge generate + build; green."

  - node: mvp_verify
    output:
      exit_code: 0

  - node: production_polish
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "All features complete, tests pass, production ready."
      iterations: 3
      lint_exit: 0
      test_exit: 0
      build_exit: 0

expect:
  outcome: completed
  reached:
    - scope_conversation
    - scaffold_and_verify
    - frontend_polish
    - frontend_done
    - mvp_backend
    - mvp_verify
    - mvp_done
    - production_polish
    - success
  not_reached:
    - stuck
    - failed

---
name: scaffold_fails
description: Scoping passes but scaffold phase fails verification. No other phases run.

events:
  - node: scope_conversation
    output:
      message: "FORGE_PLAN.md written."
      response_text: "Plan is ready."

  - node: scaffold_and_verify
    output:
      strategy: "continue"
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Proto files have errors, build fails."
      iterations: 5
      lint_exit: 1
      build_exit: 1

expect:
  outcome: completed
  reached:
    - scope_conversation
    - scaffold_and_verify
    - failed
  not_reached:
    - frontend_polish
    - frontend_done
    - mvp_backend
    - mvp_verify
    - mvp_done
    - production_polish
    - success
    - stuck

---
name: mvp_build_fails
description: Scaffold and frontend pass, but the MVP pass leaves a broken build. Fails loud, no production.

events:
  - node: scope_conversation
    output:
      message: "FORGE_PLAN.md written."
      response_text: "Plan is ready."

  - node: scaffold_and_verify
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Scaffold complete."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: frontend_polish
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Frontend polished."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: mvp_backend
    output:
      response_text: "Implemented features but hit a build error I could not resolve."

  - node: mvp_verify
    output:
      exit_code: 1

expect:
  outcome: completed
  reached:
    - scope_conversation
    - scaffold_and_verify
    - frontend_polish
    - frontend_done
    - mvp_backend
    - mvp_verify
    - failed
  not_reached:
    - mvp_done
    - production_polish
    - success
    - stuck

---
name: production_fails
description: All phases pass except production polish (strategy != pass).

events:
  - node: scope_conversation
    output:
      message: "FORGE_PLAN.md written."
      response_text: "Plan is ready."

  - node: scaffold_and_verify
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Scaffold complete."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: frontend_polish
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Frontend polished."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  - node: mvp_backend
    output:
      response_text: "MVP features done. Build green."

  - node: mvp_verify
    output:
      exit_code: 0

  - node: production_polish
    output:
      strategy: "continue"
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Remaining features incomplete after max retries."
      iterations: 5
      lint_exit: 0
      test_exit: 1
      build_exit: 0

expect:
  outcome: completed
  reached:
    - scope_conversation
    - scaffold_and_verify
    - frontend_polish
    - frontend_done
    - mvp_backend
    - mvp_verify
    - mvp_done
    - production_polish
    - failed
  not_reached:
    - stuck
    - success
