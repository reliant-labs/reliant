# Test scenarios for forge-one-shot.yaml workflow
#
# Pipeline (current node graph):
#   scaffold_and_verify → build_mvp → build_done → launch_preview → success
#
# The build is structured SCAFFOLD → FAN-OUT → SYNTHESIS → REVIEW:
#   scaffold_and_verify lays the whole substrate SERIALLY (review off — the
#   generate/lint/test/build gate IS the gate). build_mvp then fans out parallel
#   per-seam units, synthesizes, and runs the get-it-right review WITH TEETH — so
#   scaffold_and_verify and build_mvp are both get-it-right loops (emit
#   strategy/eval_strategy/stuck). build_done is the success marker after the build;
#   launch_preview then starts the finished app and posts its URL as the run's last
#   step, so the pipeline ends on a link the user can open.
#
# Failure / escalation paths (collapsed terminals):
#   get-it-right stuck (tooling/env)   → stuck
#   scaffold/build != pass             → failed

---
name: happy_path
description: All phases pass. Full pipeline through the preview handoff to success.

events:
  - node: scaffold_and_verify
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Project scaffolded, proto files generated, build passes, FORGE_PLAN.md exists."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  # Fan-out → synthesis → teethed review: parallel per-seam units landed together and
  # were verified by the get-it-right gate (backend generate/lint/test/build AND every
  # frontend build), against a rubric that also covers hardening.
  - node: build_mvp
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Per-seam frontend + backend fanned out, synthesized, and verified live; build green."
      iterations: 3
      lint_exit: 0
      test_exit: 0
      build_exit: 0

  # The finished app is launched and its URL posted as the last step of the run.
  - node: launch_preview
    output:
      response_text: "Orders, billing, and the ops dashboard are live.\n\n**[Open your app](https://preview.example/3000)**"

expect:
  outcome: completed
  reached:
    - scaffold_and_verify
    - build_mvp
    - build_done
    - launch_preview
    - success
  not_reached:
    - stuck
    - failed

---
name: scaffold_fails
description: Scoping passes but scaffold phase fails verification. No other phases run.

events:
  - node: scaffold_and_verify
    output:
      strategy: "continue"
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Proto files have errors, build fails."
      iterations: 5
      lint_exit: 1
      build_exit: 1

expect:
  outcome: completed
  reached:
    - scaffold_and_verify
    - failed
  not_reached:
    - build_mvp
    - build_done
    - launch_preview
    - success
    - stuck

---
name: mvp_build_fails
description: Scaffold passes, but the fan-out/synthesis build fails verification. Fails loud, no preview.

events:
  - node: scaffold_and_verify
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Scaffold complete."
      iterations: 1
      lint_exit: 0
      build_exit: 0

  # The build phase leaves a broken build after its retries — strategy != pass routes
  # straight to the failed terminal; build_done and the preview never run.
  - node: build_mvp
    output:
      strategy: "continue"
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Implemented features but hit a build error I could not resolve."
      iterations: 7
      lint_exit: 0
      build_exit: 1

expect:
  outcome: completed
  reached:
    - scaffold_and_verify
    - build_mvp
    - failed
  not_reached:
    - build_done
    - launch_preview
    - success
    - stuck
