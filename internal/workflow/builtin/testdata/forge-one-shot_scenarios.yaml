# Test scenarios for forge-one-shot.yaml workflow
#
# Pipeline (current node graph):
#   build_app → build_done → launch_preview → success
#
# build_app is ONE get-it-right loop carrying the whole arc: scope → scaffold →
# green gate → parallel per-seam fan-out → synthesis → review. It emits
# strategy/eval_strategy/stuck like any get-it-right loop. Its review runs WITH
# TEETH — it opens the LIVE app — and its rubric also covers hardening.
# build_done is the success marker after the build; launch_preview then starts
# the finished app and posts its URL as the run's last step, so the pipeline
# ends on a link the user can open.
#
# Failure / escalation paths (collapsed terminals):
#   get-it-right stuck (tooling/env)   → stuck
#   build strategy != pass             → failed

---
name: happy_path
description: The build passes. Full pipeline through the preview handoff to success.

events:
  # One loop: scoped with the user, scaffolded the substrate green, fanned out
  # per-seam units, synthesized them, and passed the teethed review that opened
  # the live app.
  # build_app EXECUTES its get-it-right body. forge-one-shot sets max_retries: 7,
  # so the "never reaches green" premise needs a verdict for EVERY attempt —
  # one mock would be consumed once and the loop would then default to green.
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 1 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 2 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 3 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 4 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 5 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 6 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
  - node: build_app.attempt.implement
    output:
      response_text: "Attempt 7 for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "continue"
        feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
expect:
  outcome: completed
  reached:
    - build_app
    - failed
  not_reached:
    - build_done
    - launch_preview
    - success
    - stuck

---
name: build_stuck
description: The loop escalates on a tooling/environment blocker, not a code defect.

events:
  # build_app EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: build_app.attempt.implement
    output:
      response_text: "Implementation attempt for build_app."
  - node: build_app.attempt.review
    output:
      response:
        grade: fail
        strategy: "stuck"
        feedback: "The app genuinely will not start — a forge command crashes. Not the protos or the code."
expect:
  outcome: completed
  reached:
    - build_app
    - stuck
  not_reached:
    - build_done
    - launch_preview
    - success
    - failed
