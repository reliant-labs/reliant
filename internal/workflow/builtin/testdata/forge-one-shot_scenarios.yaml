# Test scenarios for forge-one-shot.yaml workflow
#
# Pipeline (current node graph):
#   build_app → build_done → launch_preview → success
#
# build_app is ONE get-it-right loop carrying the whole arc: scope → scaffold →
# green gate → parallel per-seam fan-out → synthesis → review. It emits
# strategy/eval_strategy/stuck like any get-it-right loop. Its review runs WITH
# TEETH — it opens the LIVE app — and its rubric also covers hardening.
# build_done is the success marker after the build; launch_preview then starts
# the finished app and posts its URL as the run's last step, so the pipeline
# ends on a link the user can open.
#
# Failure / escalation paths (collapsed terminals):
#   get-it-right stuck (tooling/env)   → stuck
#   build strategy != pass             → failed

---
name: happy_path
description: The build passes. Full pipeline through the preview handoff to success.

events:
  # One loop: scoped with the user, scaffolded the substrate green, fanned out
  # per-seam units, synthesized them, and passed the teethed review that opened
  # the live app.
  - node: build_app
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Substrate green, per-seam frontend + backend fanned out and synthesized, verified live; build green."
      iterations: 4
      lint_exit: 0
      test_exit: 0
      build_exit: 0

  # The finished app is launched and its URL posted as the last step of the run.
  - node: launch_preview
    output:
      response_text: "Orders, billing, and the ops dashboard are live.\n\n**[Open your app](https://preview.example/3000)**"

expect:
  outcome: completed
  reached:
    - build_app
    - build_done
    - launch_preview
    - success
  not_reached:
    - stuck
    - failed

---
name: build_fails
description: The build never reaches a green, complete state. Fails loud, no preview.

events:
  # strategy != pass after the retries routes straight to the failed terminal;
  # build_done and the preview never run.
  - node: build_app
    output:
      strategy: "continue"
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
      iterations: 7
      lint_exit: 0
      test_exit: 0
      build_exit: 1

expect:
  outcome: completed
  reached:
    - build_app
    - failed
  not_reached:
    - build_done
    - launch_preview
    - success
    - stuck

---
name: build_stuck
description: The loop escalates on a tooling/environment blocker, not a code defect.

events:
  - node: build_app
    output:
      strategy: "stuck"
      eval_strategy: "stuck"
      stuck: true
      review_grade: "fail"
      review_feedback: "The app genuinely will not start — a forge command crashes. Not the protos or the code."
      iterations: 3
      lint_exit: 1
      test_exit: 0
      build_exit: 1

expect:
  outcome: completed
  reached:
    - build_app
    - stuck
  not_reached:
    - build_done
    - launch_preview
    - success
    - failed
