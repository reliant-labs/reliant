---
name: max_retries_exhausted
description: >
  max_retries=2. Both iterations fail. Review never says "pass".
  Loop exits at max_retries. Workflow reaches max_retries_reached.

inputs:
  steps: [implement]
  max_retries: 2

events:
  # Router: this scenario's assertions require the full-pipeline entry
  # (planning branch), so make that decision explicitly rather than letting the
  # router silently default to its first candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Enter at the top of the pipeline."

  # Iteration 0
  - node: impl_loop.attempt.implement
    output:
      response_text: "First implementation attempt."

  - node: impl_loop.attempt.review
    output:
      response:
        grade: fail
        strategy: "refactor"
        feedback: "Fundamental design flaw. Restructure to match existing schema patterns."

  - node: impl_loop.attempt.refactor
    output:
      response_text: "Restructured data model."

  # Iteration 1
  - node: impl_loop.attempt.implement
    output:
      response_text: "Second attempt, still flawed."

  - node: impl_loop.attempt.review
    output:
      response:
        grade: fail
        strategy: "refactor"
        feedback: "Data model fix wasn't sufficient. Try a completely different approach."

  - node: impl_loop.attempt.refactor
    output:
      response_text: "Applied further changes but issues remain."

expect:
  outcome: completed
  reached:
    - planning
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - impl_loop.attempt.refactor
    - max_retries_reached
  not_reached:
    - planning.plan
    - write_tests
    - success

