# Test scenarios for one-ring.yaml workflow
#
# One-ring workflow structure:
#   Top-level nodes (linear):  planning → write_tests → impl_loop → success | max_retries_reached
#
#   Planning sub-workflow (type: workflow, thread.mode: fork):
#     Inner nodes: research → plan → criticize → revise
#
#   write_tests (type: workflow, condition: 'tdd' in inputs.steps)
#
#   impl_loop (type: workflow, ref: builtin://get-it-right):
#     Delegates to get-it-right which has: attempt loop containing:
#       implement → lint/test/build (parallel) → join_checks → review → refactor
#     Node paths use impl_loop.attempt.* prefix since get-it-right has an attempt loop.
#
#   Completion:
#     success             — when eval_strategy == 'pass'
#     max_retries_reached — when eval_strategy != 'pass' after loop
#
# Inputs:
#   steps (enum, multi): default [plan, implement]
#     Valid: research, plan, criticize, revise, tdd, implement, lint, test, build, start_app
#   max_retries (integer): default 3

---
name: default_steps
description: >
  Default steps (plan, implement). All pass on first try.
  Review says "pass", refactor skipped.

events:
  # Router: this scenario's assertions require the full-pipeline entry
  # (planning branch), so make that decision explicitly rather than letting the
  # router silently default to its first candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Enter at the top of the pipeline."

  - node: planning.plan
    output:
      response_text: "Plan: implement the feature with modular design."

  - node: impl_loop.attempt.implement
    output:
      response_text: "Implemented the feature as planned."

  - node: impl_loop.attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Implementation is correct. All checks passed."

expect:
  outcome: completed
  reached:
    - planning
    - planning.plan
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - success
  not_reached:
    - write_tests
    - impl_loop.attempt.refactor

---
name: plan_only
description: >
  steps: [plan]. Planning runs. Everything else is skipped.
  impl_loop and write_tests are skipped due to conditions.

inputs:
  steps: [plan]

events:
  # Router: this scenario's assertions require the full-pipeline entry
  # (planning branch), so make that decision explicitly rather than letting the
  # router silently default to its first candidate.
  - node: classify
    output:
