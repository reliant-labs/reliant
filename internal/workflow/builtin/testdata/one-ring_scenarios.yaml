        strategy: "pass"
        feedback: "Everything passes. Implementation is clean and correct."

expect:
  outcome: completed
  reached:
    - planning
    - planning.plan
    - write_tests
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.lint
    - impl_loop.attempt.test
    - impl_loop.attempt.build
