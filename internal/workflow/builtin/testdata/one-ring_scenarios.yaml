    - impl_loop.attempt.refactor

---
name: implement_only
description: >
  steps: [implement]. Straight to implementation, no checks, no review.
  eval_strategy defaults to "pass". Loop exits after 1 iteration.

inputs:
  steps: [implement]

events:
  # Router: this scenario is NAMED for a routing outcome — "straight to
  # implementation" — so the decision is made explicitly here.
  - node: classify
    output:
      selected_node: impl_loop
      reasoning: "Simple, well-defined task — go straight to implementation."

  - node: impl_loop.attempt.implement
    output:
      response_text: "Minimal implementation done."

expect:
  outcome: completed
  reached:
    - classify
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - success
  # The implement branch really EXECUTED — `reached` alone would also hold for
  # skipped nodes, so the routing outcome is pinned with `completed`.
  completed:
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.review
    - success
  not_reached:
    # The router dispatched straight to impl_loop, so the planning branch is
    # never scheduled. (`planning` was previously asserted REACHED — true only
    # because the unmocked router defaulted to refine_prompt.)
    - refine_prompt
    - planning
    - planning.plan
    - write_tests
    - impl_loop.attempt.refactor

---
name: evaluate_fails_then_passes
description: >
  Review gives fail grade and "refactor" strategy. Refactor fixes issues.
  Second iteration passes. Tests the review → refactor → retry cycle.

inputs:
  steps: [implement]

events:
  # Router: this scenario's assertions require the full-pipeline entry
  # (planning branch), so make that decision explicitly rather than letting the
  # router silently default to its first candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Enter at the top of the pipeline."

  # Iteration 0 — review fails, says refactor, refactor fixes
  - node: impl_loop.attempt.implement
    output:
      response_text: "Initial implementation attempt."

  - node: impl_loop.attempt.review
    output:
      response:
        grade: fail
        strategy: "refactor"
        feedback: "Implementation has critical issues. Null pointer in handler, missing validation. Add null check before accessing request.body. Add validation middleware."

  - node: impl_loop.attempt.refactor
    output:
      response_text: "Added null check and validation middleware."

  # Iteration 1 — passes
  - node: impl_loop.attempt.implement
    output:
      response_text: "Built on refactored code. Issues resolved."

  - node: impl_loop.attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "All issues resolved. Implementation complete."

expect:
  outcome: completed
  reached:
    - planning
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - impl_loop.attempt.refactor
    - success
  not_reached:
    - planning.plan
    - write_tests

