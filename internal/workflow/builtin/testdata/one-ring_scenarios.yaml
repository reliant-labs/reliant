      reasoning: "Enter at the top of the pipeline."

  - node: planning.plan
    output:
      response_text: "Here is the plan for the task."

expect:
  outcome: completed
  reached:
    - planning
    - planning.plan
    - success
  not_reached:
    - write_tests
    - impl_loop

