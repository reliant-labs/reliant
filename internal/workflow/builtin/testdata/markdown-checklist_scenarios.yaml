---
name: happy_path
description: >
  The markdown checklist is completed successfully on the first implement-review cycle.

events:
  # complete_checklist EXECUTES (not black-boxed): mocking implement-review's
  # inner loop nodes with qualified ids makes the ref transparent, so its
  # project.path ({{inputs.working_directory}}) and the injected checklist
  # prompt are actually compiled and evaluated.
  - node: complete_checklist.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implemented every unchecked task in TASKS.md and ticked the boxes."
      response_text: "Implemented every unchecked task in TASKS.md and ticked the boxes."
      tool_calls: []
  - node: complete_checklist.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_review
          name: submit_review
          input:
            verdict: "pass"
            issues: []
            summary: "All checklist items in TASKS.md are complete and the underlying work is implemented."
  - node: complete_checklist.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_review:
          verdict: "pass"
          issues: []
          summary: "All checklist items in TASKS.md are complete and the underlying work is implemented."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - complete_checklist
    - complete
  # `reached` also holds for SKIPPED nodes, so it cannot prove the sub-workflow
  # body ran. `completed` can, and is the point of this scenario.
  completed:
    - complete_checklist
    - complete_checklist.attempt
    - complete_checklist.attempt.implement
    - complete_checklist.attempt.review
    - complete
  node_outputs:
    complete_checklist:
      verdict: "pass"
      summary: "All checklist items in TASKS.md are complete and the underlying work is implemented."
      # Now DERIVED from the loop actually running once, not asserted as a literal.
      iterations: 1

---
name: retry_then_pass
description: >
  First review finds remaining unchecked checklist items. A later attempt completes them and passes.

events:
  # Iteration 1: review finds remaining unchecked items -> loop continues.
  - node: complete_checklist.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Completed part of TASKS.md; some items still open."
      response_text: "Completed part of TASKS.md; some items still open."
      tool_calls: []
  - node: complete_checklist.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_review
          name: submit_review
          input:
            verdict: "fail"
            issues: ["TASKS.md still has unchecked items under 'API'."]
            summary: "Remaining unchecked checklist items."
  - node: complete_checklist.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_review:
          verdict: "fail"
          issues: ["TASKS.md still has unchecked items under 'API'."]
          summary: "Remaining unchecked checklist items."
      tool_results: []
      thread_token_count: 100
  # Iteration 2: the rest is finished and review passes.
  - node: complete_checklist.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Finished the remaining TASKS.md items and updated the file."
      response_text: "Finished the remaining TASKS.md items and updated the file."
      tool_calls: []
  - node: complete_checklist.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_review
          name: submit_review
          input:
            verdict: "pass"
            issues: []
            summary: "Previously unchecked items were completed, TASKS.md was updated, and no remaining checklist tasks are open."
  - node: complete_checklist.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_review:
          verdict: "pass"
          issues: []
          summary: "Previously unchecked items were completed, TASKS.md was updated, and no remaining checklist tasks are open."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - complete_checklist
    - complete
  completed:
    - complete_checklist
    - complete_checklist.attempt
    - complete_checklist.attempt.implement
    - complete_checklist.attempt.review
    - complete
  node_outputs:
    complete_checklist:
      verdict: "pass"
      # iterations: 2 was previously a scenario LITERAL — the loop never ran.
      # It is now produced by the loop genuinely taking two iterations.
      iterations: 2
