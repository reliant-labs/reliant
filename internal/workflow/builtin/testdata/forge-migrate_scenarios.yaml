              kind: "package"
              source_paths: ["internal/domain"]
              depends_on: []
              notes: "Pure types, port first."
            - name: "api"
              kind: "service"
              source_paths: ["internal/api"]
              depends_on: ["domain"]
              notes: "Connect handlers."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: approved

  # scaffold_baseline EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: scaffold_baseline.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for scaffold_baseline."
      response_text: "Implementation attempt for scaffold_baseline."
      tool_calls: []
  - node: scaffold_baseline.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Scaffold green, contracts floor set."
  - node: scaffold_baseline.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Scaffold green, contracts floor set."
      tool_results: []
      thread_token_count: 100
  # port_loop.port EXECUTES its get-it-right body: mocking the innermost
  # agent_loop nodes makes the nested ref transparent, so port's own args CEL
  # (the working_directory-interpolated lint/build/test commands and
  # implementer_preset: forge) is compiled and evaluated.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Ported the domain package."
      response_text: "Ported the domain package."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
