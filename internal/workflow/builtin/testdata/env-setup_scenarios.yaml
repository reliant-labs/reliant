# Test scenarios for env-setup.yaml workflow
#
# Env-setup workflow structure:
#   Entry: [setup_loop]
#
#   setup_loop (type: loop):
#     While: validation_grade == 'fail' && iter.iteration < inputs.max_retries
#     Inline nodes: cleanup → setup → validate
#     - cleanup   type: run (condition: iter.iteration > 0) — tears down stale state on retries
#     - setup     type: workflow (builtin://agent)
#     - validate  type: workflow (builtin://structured-agent) → response {grade, findings, issues}
#     Loop outputs: validation_grade (from validate.response.grade, default 'fail')
#
#   Completion:
#     success             (type: save_message) — when validation_grade != 'fail'
#     max_retries_reached (type: save_message) — when validation_grade == 'fail' after loop
#
# Inputs:
#   mode (enum): manual | auto, default auto
#   model (model): default tags: [flagship]
#   max_retries (integer): default 5, min 1, max 15
#
# NOTE: For loop scenarios, provide events for EACH iteration in order.
#       The simulator consumes events sequentially per node name.
#       The cleanup node is a 'run' type and does not need events.

---
name: happy_path
description: >
  Setup runs, validation passes on first try.
  Cleanup is skipped on iteration 0 (condition: iter.iteration > 0).
  Loop exits after 1 iteration because grade is 'pass'.
  Reaches success.

events:
  - node: setup_loop.setup
    output:
      response_text: "Environment configured: ports allocated, databases isolated, scripts created."

  - node: setup_loop.validate
    output:
      response:
        grade: pass
        findings: "All checks passed. Ports listening, databases accessible, processes named correctly, teardown clean."
        issues: []

expect:
  outcome: completed
  reached:
    - setup_loop
    - setup_loop.setup
    - setup_loop.validate
    - success
  node_outputs:
    setup_loop:
      validation_grade: "pass"

---
name: validation_fails_then_passes
description: >
  First iteration: cleanup skipped, setup runs, validation fails with issues.
  Second iteration: cleanup runs (tears down stale state), setup retries, validation passes.
  Loop exits after 2 iterations. Reaches success.

events:
  # Iteration 0
  - node: setup_loop.setup
    output:
      response_text: "Initial setup complete."

  - node: setup_loop.validate
    output:
      response:
        grade: fail
        findings: "Port 8080 not listening. Binary missing worktree suffix."
        issues:
          - "Port 8080 is not listening after startup"
          - "Binary at ./dist/myapp has no worktree suffix"

  # Iteration 1 — cleanup runs first (run node, no event needed), then setup retries
  - node: setup_loop.setup
    output:
      response_text: "Fixed port binding and binary naming."

  - node: setup_loop.validate
    output:
      response:
        grade: pass
        findings: "All checks passed after fixes."
        issues: []

expect:
  outcome: completed
  reached:
    - setup_loop
    - setup_loop.setup
    - setup_loop.validate
    - success
  node_outputs:
    setup_loop:
      validation_grade: "pass"

---
name: max_retries_exhausted
description: >
  max_retries: 2. Both iterations: validation fails.
  Cleanup runs on iteration 1 (skipped on iteration 0).
  Loop exits after 2 iterations because iter.iteration reaches max_retries.
  Reaches max_retries_reached.

inputs:
  max_retries: 2

events:
  # Iteration 0
  - node: setup_loop.setup
    output:
      response_text: "Setup attempt 1."

  - node: setup_loop.validate
    output:
      response:
        grade: fail
        findings: "Database isolation failed."
        issues:
          - "SQLite DB not in ephemeral dir"

  # Iteration 1 — cleanup runs (no event needed)
  - node: setup_loop.setup
    output:
      response_text: "Setup attempt 2."

  - node: setup_loop.validate
    output:
      response:
        grade: fail
        findings: "Database isolation still failing."
        issues:
          - "SQLite DB still not in ephemeral dir"

expect:
  outcome: completed
  reached:
    - setup_loop
    - setup_loop.setup
    - setup_loop.validate
    - max_retries_reached
  node_outputs:
    setup_loop:
      validation_grade: "fail"
