# Implementation failure scenario - one impl fails, others succeed
# With the parallel loop using on_failure: continue, a failed iteration
# still produces an entry in _results. The _failed count reflects the failure.
name: implementation_failure
description: One implementation fails but workflow continues with review
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Implement error handling"
      response_text: "Implement error handling"
      tool_calls: []

  - node: implementations.create_wt
    output:
      path: "/wt/1"
      branch: "b1"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation 1 complete with error handling"
      response_text: "Implementation 1 complete with error handling"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "ERROR: Unable to complete implementation due to unforeseen issue"
      response_text: "ERROR: Unable to complete implementation due to unforeseen issue"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation 3 complete with robust error handling"
      response_text: "Implementation 3 complete with robust error handling"
      tool_calls: []

  # Reviewer notes impl 2 failed and picks from remaining
  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 3
          strategy: "use_winner"
          confidence: 8
          rationale: "Only viable option with complete error handling. Candidate 2 failed to complete."
          synthesis_instructions: ""
  - node: apply_winner
    output:
      exit_code: 0
