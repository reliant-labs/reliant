# Test scenarios for parallel-compete.yaml workflow
#
# Parallel Compete workflow:
# 1. improve_prompt -> save_improved_prompt
# 2. implementations (parallel loop: create_wt -> impl for each of [1, 2, 3])
# 3. review (structured response with winner/strategy)
# 4. apply_winner OR synthesizer (conditional based on strategy)
# 5. complete
#
# NOTE: implementations is a parallel loop with inline sub-workflow.
# The simulator runs per-iteration mocking: provide one event per iteration (3 total).
# Each event's output matches the inline outputs: worktree_path, worktree_branch, response_text.
# The simulator assembles these into _results keyed by candidate number.
#
# review is a `type: workflow` node referencing builtin://structured-agent (BLACK BOX).
# synthesizer is a `type: workflow` node referencing builtin://agent (BLACK BOX).

---
# Happy path: All three implementations complete, reviewer picks winner (use_winner strategy)
name: parallel_compete_use_winner
description: Three implementations complete in parallel, reviewer selects candidate 2 using use_winner strategy
events:
  # Improve prompt (call_llm node - direct)
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: |
          ## Refined Specification
          - Implement user authentication
          - Support OAuth and password auth
          - Include rate limiting
          - Write unit tests
      response_text: |
        ## Refined Specification
        - Implement user authentication
        - Support OAuth and password auth
        - Include rate limiting
        - Write unit tests
      tool_calls: []

  # Per-iteration mocks for the parallel loop (one per candidate)
  # impl is a `type: workflow` ref to builtin://agent nested in the loop body.
  # Mocking its INTERNALS (implementations.impl.agent_loop.call_llm) makes the
  # agent body execute rather than being replaced by a scenario literal, so the
  # ref's own arg expressions and its loop's exit condition are really tested.
  # An empty tool_calls list is what ends the agent loop after one turn.
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-1"
      branch: "compete-impl-1"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Candidate 1 implementation complete. Used basic password auth."
      response_text: "Candidate 1 implementation complete. Used basic password auth."
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-2"
      branch: "compete-impl-2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Candidate 2 implementation complete. Full OAuth + password with tests."
      response_text: "Candidate 2 implementation complete. Full OAuth + password with tests."
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-3"
      branch: "compete-impl-3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Candidate 3 implementation complete. OAuth only, minimal tests."
      response_text: "Candidate 3 implementation complete. OAuth only, minimal tests."
      tool_calls: []

  # Reviewer with structured response (use_winner strategy)
  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 2
          strategy: "use_winner"
          confidence: 8
          rationale: "Candidate 2 has the most complete implementation with proper OAuth and password auth support, plus good test coverage."
          synthesis_instructions: ""
  # apply_winner runs rsync command
  - node: apply_winner
    output:
      exit_code: 0
      stdout: "sent 1234 bytes  received 56 bytes\n"
      stderr: ""

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    # The nested agent ref really executed — under black-box mocking this node
    # is never entered no matter what the scenario writes.
    - implementations.impl
    - implementations.impl.agent_loop.call_llm
    - review
    - apply_winner
    - complete
  not_reached:
    - synthesizer

---
# Synthesize path: Reviewer decides to combine best parts from multiple implementations
name: parallel_compete_synthesize
description: Reviewer chooses to synthesize best parts from multiple implementations
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Build a cache layer with TTL support"
      response_text: "Build a cache layer with TTL support"
