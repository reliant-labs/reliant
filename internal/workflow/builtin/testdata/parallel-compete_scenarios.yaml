---
# Implementation failure scenario - one impl fails, others succeed
# With the parallel loop using on_failure: continue, a failed iteration
# still produces an entry in _results. The _failed count reflects the failure.
name: implementation_failure
description: One implementation fails but workflow continues with review
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Implement error handling"
      response_text: "Implement error handling"
      tool_calls: []

  - node: implementations
    output:
      worktree_path: "/wt/1"
      worktree_branch: "b1"
      response_text: "Implementation 1 complete with error handling"
  - node: implementations
    output:
      worktree_path: "/wt/2"
      worktree_branch: "b2"
      response_text: "ERROR: Unable to complete implementation due to unforeseen issue"
  - node: implementations
    output:
      worktree_path: "/wt/3"
      worktree_branch: "b3"
      response_text: "Implementation 3 complete with robust error handling"

  # Reviewer notes impl 2 failed and picks from remaining
  - node: review
    output:
      message:
        role: assistant
        text: |
          ## Review Summary

          Candidate 1: Complete implementation
          Candidate 2: FAILED - no implementation
          Candidate 3: Complete implementation with robust error handling
      response_text: |
        ## Review Summary

        Candidate 1: Complete implementation
        Candidate 2: FAILED - no implementation
        Candidate 3: Complete implementation with robust error handling
      response:
        winner: 3
        strategy: "use_winner"
        confidence: 8
        rationale: "Only viable option with complete error handling. Candidate 2 failed to complete."
        synthesis_instructions: ""
      completed: true

  - node: apply_winner
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review
    - apply_winner
    - complete

---
# Parallel loop with degraded review - null response
# When the review node runs but produces a null response (no strategy chosen),
# the edge conditions correctly handle it: neither use_winner nor synthesize
# matches, so the workflow completes without routing to either branch.
name: loop_failure_null_review
description: Parallel loop completes, review has null response, no edge matches
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Build a feature"
      response_text: "Build a feature"
      tool_calls: []

  - node: implementations
    output:
      worktree_path: "/wt/1"
      worktree_branch: "b1"
      response_text: "Implementation 1 done"
  - node: implementations
    output:
      worktree_path: "/wt/2"
      worktree_branch: "b2"
      response_text: "ERROR: Failed"
  - node: implementations
    output:
      worktree_path: "/wt/3"
      worktree_branch: "b3"
      response_text: "ERROR: Failed"

  # Review runs but response is null (no response tool called or incomplete)
  - node: review
    output:
      response: null
      completed: true

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review

