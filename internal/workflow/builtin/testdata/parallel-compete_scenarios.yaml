    output:
      message:
        role: assistant
        text: "Implementation 1 done"
      response_text: "Implementation 1 done"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "ERROR: Failed"
      response_text: "ERROR: Failed"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "ERROR: Failed"
      response_text: "ERROR: Failed"
      tool_calls: []

  # Review runs but response is null (no response tool called or incomplete)
  - node: review
    output:
      response: null
      completed: true

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review

