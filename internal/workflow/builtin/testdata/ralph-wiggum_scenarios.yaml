# Test scenarios for ralph-wiggum.yaml workflow
#
# Ralph Wiggum is a thin wrapper around get-it-right with context_bridge: none.
#
# Workflow structure:
#   get_it_right (type: workflow, ref: builtin://get-it-right, BLACK BOX)
#
# The get_it_right node is treated as a black box since it references an external workflow.
# The simulator mocks its output directly. The outputs mapped back are:
#   review_strategy ← get_it_right.eval_strategy
#   review_feedback ← get_it_right.review_feedback
#   iterations      ← get_it_right.iterations

---
name: happy_path_first_try
description: >
  First implementation succeeds. get-it-right returns eval_strategy="pass"
  on the first iteration. No retry needed.

events:
  - node: get_it_right
    output:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Implementation is correct and complete. Code follows existing patterns."
      iterations: 1

expect:
  outcome: completed
  reached:
    - get_it_right
  node_outputs:
    get_it_right:
      eval_strategy: "pass"

---
name: retry_then_pass
description: >
  get-it-right runs 2 iterations internally (brute force, no context bridge)
  before succeeding. Returns eval_strategy="pass" with iterations=2.

events:
  - node: get_it_right
    output:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Implementation is correct. Repository layer usage follows codebase conventions."
      iterations: 2

expect:
  outcome: completed
  reached:
    - get_it_right
  node_outputs:
    get_it_right:
      eval_strategy: "pass"

---
name: max_iterations_exhausted
description: >
  get-it-right exhausts all retries without passing review.
  Returns eval_strategy="continue" (the last review strategy) with iterations
  equal to max_retries.

inputs:
  max_retries: 2

events:
  - node: get_it_right
    output:
      eval_strategy: "continue"
      review_grade: "fail"
      review_feedback: "Still incomplete. The websocket layer maintains its own auth state that conflicts with the changes."
      iterations: 2

expect:
  outcome: completed
  reached:
    - get_it_right
  node_outputs:
    get_it_right:
      eval_strategy: "continue"
