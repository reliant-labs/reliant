# Test scenarios for pitch-deck.yaml workflow
#
# Pitch Deck workflow structure:
#   classify (router) → scrape_website → [research_competitors, research_market] → research_done (join)
#   → founder_interview → plan_deck (structured-agent) → slide_pipeline (parallel loop)
#   → slides_loop (while loop: build_slides → start_dev_server → screenshot_slides → visual_review → stop_dev_server)
#   → complete (save_message)
#
# Node types:
#   - classify           type: router — routes to starting phase
#   - scrape_website      type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_competitors type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_market     type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_done       type: join
#   - founder_interview   type: workflow, ref: builtin://agent (BLACK BOX)
#   - plan_deck           type: workflow, ref: builtin://structured-agent (BLACK BOX)
#   - slide_pipeline      type: loop (parallel) — per-slide content writing only (no per-slide review)
#   - slides_loop         type: loop (while) — build → screenshot → visual_review (combined visual + content gate)
#   - complete            type: save_message

---
# Happy Path: All phases succeed, reviews pass on first try
#
# Tests the full pipeline:
# 1. scrape_website — agent
# 2. research_competitors + research_market — parallel agents
# 3. research_done — join
# 4. founder_interview — agent
# 5. plan_deck — structured-agent (standalone)
# 6. slide_pipeline — parallel loop (write_slide per slide; content only)
# 7. slides_loop — while loop (build_slides → start_dev_server → visual_review [visual+content] → stop_dev_server)
# 8. complete — save_message

name: happy_path
description: Full pipeline succeeds, all reviews pass on first iteration

inputs:
  mode: auto
  yield: false
  website_url: "https://example.com"
  deck_purpose: seed
  pitch_deck_dir: "pitch-deck"
  existing_deck_dir: ""

events:
  # The builtin://agent phase nodes below are EXECUTED rather than black-boxed:
  # a qualified id (`<node>.agent_loop.call_llm`) makes the ref transparent, so
  # each node's own args CEL — tools, and scrape_website's website_url-dependent
  # system prompt — is compiled and evaluated.
  # Router: this scenario runs the pipeline from scratch, so the scrape entry is
  # chosen explicitly rather than inherited from the router's default candidate.
  - node: classify
    output:
      selected_node: scrape_website
      reasoning: "No prior work exists — start by scraping the company website."

  # Phase 1: Scrape website
  - node: scrape_website.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
          ## Company Overview
          Example Corp builds developer tools with AI workflows.

          ## Products
          - Example Code: shipped, beta
          - Example Engine: waitlist only

          ## Traction Claims
          - "5,000+ downloads" — PLAUSIBLE
          - GitHub: 340 stars — VERIFIED

          ## Brand Identity
          Colors: #a855f7 purple, #0a0a0a bg
          Font: Inter
          Tone: Technical, casual

      response_text: |
        ## Company Overview
        Example Corp builds developer tools with AI workflows.

        ## Products
        - Example Code: shipped, beta
        - Example Engine: waitlist only

        ## Traction Claims
        - "5,000+ downloads" — PLAUSIBLE
        - GitHub: 340 stars — VERIFIED

        ## Brand Identity
        Colors: #a855f7 purple, #0a0a0a bg
        Font: Inter
        Tone: Technical, casual

      tool_calls: []
  # Phase 2a: Competitive research
  - node: research_competitors.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
          ## Direct Competitors
          - Cursor: $2.5B valuation, 20M+ downloads
          - Copilot: 15M users

          ## Honest Assessment
          Behind on users, ahead on workflows.

      response_text: |
        ## Direct Competitors
        - Cursor: $2.5B valuation, 20M+ downloads
        - Copilot: 15M users

        ## Honest Assessment
        Behind on users, ahead on workflows.

      tool_calls: []
  # Phase 2b: Market research
  - node: research_market.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
          ## Market Size
          AI-assisted dev tools: $22.1B by 2028 (IDC)

          ## Comparable Raises
          Codeium: $150M Series C, Augment: $227M Series B

      response_text: |
        ## Market Size
        AI-assisted dev tools: $22.1B by 2028 (IDC)

        ## Comparable Raises
        Codeium: $150M Series C, Augment: $227M Series B

      tool_calls: []
  # Phase 3: Founder interview
  - node: founder_interview.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
          ## Founder Brief
          Downloads: 3,200. WAU: 800. Revenue: $0.
          Raising $2M seed. 2 founders (AWS, Google).

          ## Claims to Soften
          - 5,000 → 3,200 real downloads
          - Remove big company name-dropping

      response_text: |
        ## Founder Brief
        Downloads: 3,200. WAU: 800. Revenue: $0.
        Raising $2M seed. 2 founders (AWS, Google).

        ## Claims to Soften
        - 5,000 → 3,200 real downloads
        - Remove big company name-dropping

      tool_calls: []
  # Phase 4a: Plan deck (standalone structured-agent)
  # plan_deck EXECUTES its structured-agent body rather than being replaced by a
  # literal. The response tool is `submit_deck_plan` (pitch-deck.yaml sets
  # response_tool_name); using any other key leaves `completed` false and spins.
  - node: plan_deck.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_plan
          name: submit_deck_plan
          input: {}
  - node: plan_deck.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_deck_plan:
          narrative_arc: "Demo-first: open with product, build through traction to the ask."
          slides:
            - filename: "01-hook.md"
              title: "What if your IDE could run multi-agent workflows?"
              purpose: "Hook with a demo-first opening"
              key_content: "AI-powered IDE with workflow automation, 3,200 downloads"
              layout_hint: centered-hero
              sources: "phase-1-scrape/website-analysis.md, phase-3-interview/founder-brief.md"
            - filename: "02-traction.md"
              title: "3,200 downloads, 800 weekly active"
              purpose: "Show honest traction"
              key_content: "3,200 downloads (not 5K), 800 WAU, 40% retention"
              layout_hint: full-bleed-stat
              sources: "phase-3-interview/founder-brief.md"
            - filename: "03-ask.md"
              title: "Raising $2M seed"
              purpose: "The ask"
              key_content: "$2M seed, 18 months runway, hire 3 engineers"
              layout_hint: centered-hero
              sources: "phase-3-interview/founder-brief.md"
  - node: slide_pipeline
    # Deliberate black box: this scenario mocks the parallel loop's AGGREGATE
    # result (_results/_completed) rather than exercising the per-slide body,
    # which builtin://agent black-boxes anyway. Loop bodies execute by default.
    black_box: true
    output:
      _completed: 3
      _failed: 0
      _parallel: true
      _results:
        "01-hook.md":
          response_text: "Wrote hook slide."
          verdict: pass
          feedback: "Strong opening with specific product angle."
        "02-traction.md":
          response_text: "Wrote traction slide."
          verdict: pass
          feedback: "Honest numbers, well-sourced."
        "03-ask.md":
          response_text: "Wrote ask slide."
          verdict: pass
          feedback: "Clear and direct ask."

  # Phase 5: slides_loop — while loop inner nodes
  - node: slides_loop.build_slides
    output:
      response_text: "Built 3 React slide components in pitch-deck/src/slides/"

  - node: slides_loop.start_dev_server
    output:
      exit_code: 0
      stdout: "Dev server started on http://localhost:5174"
      stderr: ""

  - node: slides_loop.visual_review
    output:
      response_text: "Slides pass visual review."
      response:
        verdict: pass
        summary: "Clean, professional slides. Brand colors match. Good layout variety."
        slide_issues: []
        brand_consistency: "Colors match brand identity. Inter font used throughout."
        layout_issues: []
        ai_visual_tells: []
        typography_issues: []
      completed: true

  - node: slides_loop.stop_dev_server
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

  # handoff EXECUTES: previously this node had NO event at all, so it fell
  # through to the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Deck served; posted the preview URL."
      response_text: "Deck served; posted the preview URL."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - classify
    - scrape_website
    - research_competitors
    - research_market
    - research_done
    - founder_interview
    - plan_deck
    - slide_pipeline
    - slides_loop
    - complete

