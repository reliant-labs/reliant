        content_issues:
          - slide_number: 2
            severity: critical
            description: "Slide shows '5,000 downloads' but founder-brief.md says 3,200. Use the real number and cite the source."
      completed: true

  - node: slides_loop.stop_dev_server
    iteration: 0
    output:
      exit_code: 0

  # Phase 5, Iteration 1: Rebuild
  - node: slides_loop.build_slides
    iteration: 1
    output:
      response_text: "Rebuilt slides. Fixed colors, varied layouts, removed gradient blobs and emoji icons."

  - node: slides_loop.start_dev_server
    iteration: 1
    output:
      exit_code: 0
      stdout: "Dev server started"

  # Phase 5, Iteration 1: Visual reviewer PASSES
  - node: slides_loop.visual_review
    iteration: 1
    output:
      response_text: "Rebuilt slides pass visual review."
      response:
        verdict: pass
        summary: "Brand colors correct, layout variety good, text readable at projection size."
        slide_issues: []
        brand_consistency: "Matches. Purple #a855f7, #0a0a0a bg, Inter font."
        layout_issues: []
        ai_visual_tells: []
        typography_issues: []
      completed: true

  - node: slides_loop.stop_dev_server
    iteration: 1
    output:
      exit_code: 0

  # handoff EXECUTES: previously this node had NO event at all, so it fell
  # through to the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Deck served; posted the preview URL."
      response_text: "Deck served; posted the preview URL."
      tool_calls: []

