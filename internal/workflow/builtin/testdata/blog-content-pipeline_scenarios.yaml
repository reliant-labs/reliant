# Test scenarios for blog-content-pipeline.yaml workflow
#
# Blog Content Pipeline workflow structure:
#   context_intake → classify (router) → topic_discovery → research_brief → writing
#   → evaluation → visual_generation → distribution → de_ai → reddit_summary
#   → validate_artifacts (run) → complete (save_message)
#
# Node types:
#   - context_intake    type: workflow, ref: builtin://agent (BLACK BOX) — asks for missing site/source context
#   - classify          type: router — routes to starting phase
#   - topic_discovery   type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_brief    type: workflow, ref: builtin://agent (BLACK BOX)
#   - writing           type: workflow, ref: builtin://agent (BLACK BOX)
#   - evaluation        type: workflow, ref: builtin://agent (BLACK BOX) — adversarial content critique + eval
#   - visual_generation type: workflow, ref: builtin://agent (BLACK BOX)
#   - distribution      type: workflow, ref: builtin://agent (BLACK BOX)
#   - de_ai             type: workflow, ref: builtin://get-it-right (BLACK BOX) — iterative voice polish loop
#   - reddit_summary    type: workflow, ref: builtin://agent (BLACK BOX)
#   - validate_artifacts type: run — checks output files exist
#   - complete          type: save_message

---
# Full pipeline happy path: all phases reached in order from context_intake to complete.

name: full_pipeline_happy_path
description: All phases reached in order from context_intake to complete

inputs:
  yield: false

events:
  # Context intake: no missing website/source context for this run
  - node: context_intake.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Context already provided or not required."
      response_text: "Context already provided or not required."
      tool_calls: []

  # Router selects the default full-pipeline starting point
  - node: classify
    output:
      selected_node: topic_discovery
      reasoning: "Start from scratch with topic discovery."

  # Phase 1: Topic Discovery
  - node: topic_discovery.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Selected topic: ai-agent-repetition-pattern. Slug: ai-agent-repetition-pattern."
      response_text: "Selected topic: ai-agent-repetition-pattern. Slug: ai-agent-repetition-pattern."
      tool_calls: []

  # Phase 2: Research + Brief
  - node: research_brief.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Research complete. Brief written with 6 sections."
      response_text: "Research complete. Brief written with 6 sections."
      tool_calls: []

  # Phase 3: Writing
  - node: writing.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Draft complete. All 6 sections written. Word count: 3200."
      response_text: "Draft complete. All 6 sections written. Word count: 3200."
      tool_calls: []

  # Phase 4: Evaluation (adversarial content critique + quality eval)
  - node: evaluation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Evaluation complete. All sections present. Q1-Q3 passed."
      response_text: "Evaluation complete. All sections present. Q1-Q3 passed."
      tool_calls: []

  # Phase 4.5: Visual Generation
  - node: visual_generation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Visual generation complete. 2 visuals generated."
      response_text: "Visual generation complete. 2 visuals generated."
      tool_calls: []

  # Phase 6: Distribution
  - node: distribution.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Final assembly complete. Title applied, images embedded."
      response_text: "Final assembly complete. Title applied, images embedded."
      tool_calls: []

  # Phase 7: De-AI Pass (get-it-right loop — black box)
  # de_ai EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count is derived instead of asserted as a literal.
  - node: de_ai.attempt.implement
    output:
      response_text: "Applied the de-AI edits to the assembled post."
  - node: de_ai.attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Reads like genuine practitioner writing."

  # Phase 8: Reddit Summary
  - node: reddit_summary.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reddit post written to final/reddit-post.md."
      response_text: "Reddit post written to final/reddit-post.md."
      tool_calls: []

  # handoff EXECUTES: it previously had NO event, so it silently fell through to
  # the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the result."
      response_text: "Handoff complete; posted the result."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete

---
