# Test scenarios for blog-content-pipeline.yaml workflow
#
# Blog Content Pipeline workflow structure:
#   context_intake → classify (router) → topic_discovery → research_brief → writing
#   → evaluation → visual_generation → distribution → de_ai → reddit_summary
#   → validate_artifacts (run) → complete (save_message)
#
# Node types:
#   - context_intake    type: workflow, ref: builtin://agent (BLACK BOX) — asks for missing site/source context
#   - classify          type: router — routes to starting phase
#   - topic_discovery   type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_brief    type: workflow, ref: builtin://agent (BLACK BOX)
#   - writing           type: workflow, ref: builtin://agent (BLACK BOX)
#   - evaluation        type: workflow, ref: builtin://agent (BLACK BOX) — adversarial content critique + eval
#   - visual_generation type: workflow, ref: builtin://agent (BLACK BOX)
#   - distribution      type: workflow, ref: builtin://agent (BLACK BOX)
#   - de_ai             type: workflow, ref: builtin://get-it-right (BLACK BOX) — iterative voice polish loop
#   - reddit_summary    type: workflow, ref: builtin://agent (BLACK BOX)
#   - validate_artifacts type: run — checks output files exist
#   - complete          type: save_message

---
# Full pipeline happy path: all phases reached in order from context_intake to complete.

name: full_pipeline_happy_path
description: All phases reached in order from context_intake to complete

inputs:
  yield: false

events:
  # Context intake: no missing website/source context for this run
  - node: context_intake
    output:
      response_text: "Context already provided or not required."

  # Router selects the default full-pipeline starting point
  - node: classify
    output:
      selected_node: topic_discovery
      reasoning: "Start from scratch with topic discovery."

  # Phase 1: Topic Discovery
  - node: topic_discovery
    output:
      response_text: "Selected topic: ai-agent-repetition-pattern. Slug: ai-agent-repetition-pattern."

  # Phase 2: Research + Brief
  - node: research_brief
    output:
      response_text: "Research complete. Brief written with 6 sections."

  # Phase 3: Writing
  - node: writing
    output:
      response_text: "Draft complete. All 6 sections written. Word count: 3200."

  # Phase 4: Evaluation (adversarial content critique + quality eval)
  - node: evaluation
    output:
      response_text: "Evaluation complete. All sections present. Q1-Q3 passed."

  # Phase 4.5: Visual Generation
  - node: visual_generation
    output:
      response_text: "Visual generation complete. 2 visuals generated."

  # Phase 6: Distribution
  - node: distribution
    output:
      response_text: "Final assembly complete. Title applied, images embedded."

  # Phase 7: De-AI Pass (get-it-right loop — black box)
  - node: de_ai
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Reads like genuine practitioner writing. Authenticity 4/5."
      iterations: 4

  # Phase 8: Reddit Summary
  - node: reddit_summary
    output:
      response_text: "Reddit post written to final/reddit-post.md."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete

---
# Start from evaluation: router skips phases 1-3, resumes at evaluation.

name: start_from_evaluation
description: Router routes to evaluation, skipping topic/research/writing phases

inputs:
  yield: false

events:
  - node: context_intake
    output:
      response_text: "Existing draft artifact is the relevant context."

  - node: classify
    output:
      selected_node: evaluation
      reasoning: "Draft ready — critique, evaluate quality, and fact-check."

  - node: evaluation
    output:
      response_text: "Evaluation complete."
  - node: visual_generation
    output:
      response_text: "Visuals generated."
  - node: distribution
    output:
      response_text: "Assembly complete."
  - node: de_ai
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Authentic voice. Passed on iteration 2."
      iterations: 2
  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - evaluation
    - visual_generation
    - distribution
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing

---
# Start from de_ai: router skips all earlier phases, resumes at the de-AI voice pass.

name: start_from_de_ai
description: Router routes to de_ai, skipping all phases through distribution

inputs:
  yield: false

events:
  - node: context_intake
    output:
      response_text: "Existing final blog post artifact is the relevant context."

  - node: classify
    output:
      selected_node: de_ai
      reasoning: "Content is finalized and needs de-AI treatment."

  - node: de_ai
    output:
      strategy: "pass"
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Cleaned up remaining AI tells. Authenticity 4/5."
      iterations: 3

  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
