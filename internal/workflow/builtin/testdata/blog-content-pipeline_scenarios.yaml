# Test scenarios for blog-content-pipeline.yaml workflow
#
# Blog Content Pipeline workflow structure:
#   context_intake → classify (router) → topic_discovery → research_brief → writing → copyedit
#   → [da_content, da_style] → da_reviews_done (join) → evaluation → visual_generation
#   → distribution → deai_prep → deai_loop (while loop: rewrite → select → check_continue)
#   → reddit_summary → validate_artifacts (run) → complete (save_message)
#
# Node types:
#   - context_intake    type: workflow, ref: builtin://agent (BLACK BOX) — asks for missing site/source context
#   - classify          type: router — routes to starting phase
#   - topic_discovery   type: workflow, ref: builtin://agent (BLACK BOX)
#   - research_brief    type: workflow, ref: builtin://agent (BLACK BOX)
#   - writing           type: workflow, ref: builtin://agent (BLACK BOX)
#   - copyedit          type: workflow, ref: builtin://agent (BLACK BOX)
#   - da_content        type: workflow, ref: builtin://agent (BLACK BOX)
#   - da_style          type: workflow, ref: builtin://agent (BLACK BOX)
#   - da_reviews_done   type: join
#   - evaluation        type: workflow, ref: builtin://agent (BLACK BOX)
#   - visual_generation type: workflow, ref: builtin://agent (BLACK BOX)
#   - distribution      type: workflow, ref: builtin://agent (BLACK BOX)
#   - deai_prep         type: workflow, ref: builtin://agent (BLACK BOX)
#   - deai_loop         type: loop (while) — paragraph-by-paragraph de-AI editing
#   - reddit_summary    type: workflow, ref: builtin://agent (BLACK BOX)
#   - validate_artifacts type: run — checks output files exist
#   - complete          type: save_message

---
# De-AI loop runs multiple iterations
#
# Tests that the loop continues while check_continue returns exit_code 0.

name: deai_loop_multi_iteration
description: De-AI loop processes 3 paragraphs then exits

inputs:
  yield: false

events:
  # Iteration 1
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 0\nNO_ISSUES: false"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: B\nSTATUS: continue"
  - node: deai_loop.check_continue
    output:
      exit_code: 0

  # Iteration 2
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 1\nNO_ISSUES: true"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: ORIGINAL\nSTATUS: continue"
  - node: deai_loop.check_continue
    output:
      exit_code: 0

  # Iteration 3
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 2\nNO_ISSUES: false"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: A\nSTATUS: done"
  - node: deai_loop.check_continue
    output:
      exit_code: 1

  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - deai_loop
    - deai_loop.rewrite
    - deai_loop.select
    - deai_loop.check_continue
    - reddit_summary
    - complete

---
# De-AI loop terminates after 1 iteration
#
# Tests that the loop exits when check_continue returns exit_code 1.

name: deai_loop_single_iteration
description: De-AI loop runs one paragraph and exits

inputs:
  yield: false

events:
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 0\nOPTION_A: Better version.\nNO_ISSUES: false"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: A\nAPPLIED: true\nSTATUS: done"
  - node: deai_loop.check_continue
    output:
      exit_code: 1
  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - deai_loop
    - deai_loop.rewrite
    - deai_loop.select
    - deai_loop.check_continue
    - reddit_summary
    - complete

---
# Full pipeline happy path: all phases reached in order from context_intake to complete
#
# Tests that all nodes are reached when running the full pipeline.
# Covers: context_intake → classify → topic_discovery → research_brief → writing → copyedit
#   → [da_content, da_style] → da_reviews_done → evaluation → visual_generation
#   → distribution → deai_prep → deai_loop → reddit_summary → validate_artifacts → complete

name: full_pipeline_happy_path
description: All phases reached in order from context_intake to complete

inputs:
  yield: false

events:
  # Context intake: no missing website/source context for this run
  - node: context_intake
    output:
      response_text: "Context already provided or not required."

  # Router selects the default full-pipeline starting point
  - node: classify
    output:
      selected_node: topic_discovery
      reasoning: "Start from scratch with topic discovery."

  # Phase 1: Topic Discovery
  - node: topic_discovery
    output:
      response_text: "Selected topic: ai-agent-repetition-pattern. Slug: ai-agent-repetition-pattern."

  # Phase 2: Research + Brief
  - node: research_brief
    output:
      response_text: "Research complete. Brief written with 6 sections."

  # Phase 3: Writing
  - node: writing
    output:
      response_text: "Draft complete. All 6 sections written. Word count: 3200."

  # Phase 3.5: Copyedit
  - node: copyedit
    output:
      response_text: "Copy edit complete. 12 changes applied."

  # Phase 3.6a: DA Content
  - node: da_content
    output:
      response_text: "Content critique complete. 8 findings."

  # Phase 3.6b: DA Style
  - node: da_style
    output:
      response_text: "Style critique complete. 6 findings."

  # Phase 4: Evaluation
  - node: evaluation
    output:
      response_text: "Evaluation complete. All sections present. Q1-Q3 passed."

  # Phase 4.5: Visual Generation
  - node: visual_generation
    output:
      response_text: "Visual generation complete. 2 visuals generated."

  # Phase 6: Distribution
  - node: distribution
    output:
      response_text: "Final assembly complete. Title applied, images embedded."

  # Phase 7: De-AI Prep
  - node: deai_prep
    output:
      response_text: "Manifest written with 22 paragraphs."

  # Phase 7: De-AI Loop — 2 iterations then done
  # Iteration 1: rewrite
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 0\nORIGINAL: Test paragraph.\nOPTION_A: Revised test.\nOPTION_B: Another revision.\nNO_ISSUES: false"
  # Iteration 1: select
  - node: deai_loop.select
    output:
      response_text: "SELECTED: A\nREASON: Removed em dash.\nAPPLIED: true\nSTATUS: continue"
  # Iteration 1: check_continue
  - node: deai_loop.check_continue
    output:
      exit_code: 0

  # Iteration 2: rewrite
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 1\nORIGINAL: Second paragraph.\nOPTION_A: Revised second.\nOPTION_B: Another revision.\nNO_ISSUES: true"
  # Iteration 2: select
  - node: deai_loop.select
    output:
      response_text: "SELECTED: ORIGINAL\nREASON: No issues found.\nAPPLIED: false\nSTATUS: done"
  # Iteration 2: check_continue (exit 1 = done)
  - node: deai_loop.check_continue
    output:
      exit_code: 1

  # Phase 8: Reddit Summary
  - node: reddit_summary
    output:
      response_text: "Reddit post written to final/reddit-post.md."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - topic_discovery
    - research_brief
    - writing
    - copyedit
    - da_content
    - da_style
    - da_reviews_done
    - evaluation
    - visual_generation
    - distribution
    - deai_prep
    - deai_loop
    - reddit_summary
    - validate_artifacts
    - complete

---
# Start from deai: skip all earlier phases via router
#
# Tests that the classify router can route to deai_prep, skipping earlier phases.

name: start_from_deai
description: Router routes to deai_prep, skipping all phases through distribution

inputs:
  yield: false

events:
  # Context intake: existing final artifact should be enough
  - node: context_intake
    output:
      response_text: "Existing final blog post artifact is the relevant context."

  # Router selects deai_prep as starting point
  - node: classify
    output:
      selected_node: deai_prep
      reasoning: "Content is finalized and needs de-AI treatment."

  # De-AI Prep
  - node: deai_prep
    output:
      response_text: "Manifest written with 10 paragraphs."

  # De-AI Loop — 1 iteration then done
  - node: deai_loop.rewrite
    output:
      response_text: "PARAGRAPH_INDEX: 0\nNO_ISSUES: true"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: ORIGINAL\nSTATUS: done"
  - node: deai_loop.check_continue
    output:
      exit_code: 1

  # Reddit Summary
  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - deai_prep
    - deai_loop
    - reddit_summary
    - validate_artifacts
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing
    - copyedit
    - da_content
    - da_style
    - evaluation
    - visual_generation
    - distribution

---
# Start from evaluation: skip phases 1-3.6 via router
#
# Tests that the classify router can route to evaluation, skipping earlier phases.

name: start_from_evaluation
description: Router routes to evaluation, skipping writing/copyedit/DA phases

inputs:
  yield: false

events:
  # Context intake: existing edited draft should be enough
  - node: context_intake
    output:
      response_text: "Existing edited draft artifact is the relevant context."

  # Router selects evaluation as starting point
  - node: classify
    output:
      selected_node: evaluation
      reasoning: "Edited draft ready — evaluate quality and fact-check."

  - node: evaluation
    output:
      response_text: "Evaluation complete."
  - node: visual_generation
    output:
      response_text: "Visuals generated."
  - node: distribution
    output:
      response_text: "Assembly complete."
  - node: deai_prep
    output:
      response_text: "Manifest written."
  - node: deai_loop.rewrite
    output:
      response_text: "NO_ISSUES: true"
  - node: deai_loop.select
    output:
      response_text: "SELECTED: ORIGINAL\nSTATUS: done"
  - node: deai_loop.check_continue
    output:
      exit_code: 1
  - node: reddit_summary
    output:
      response_text: "Reddit post written."

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - evaluation
    - visual_generation
    - distribution
    - deai_prep
    - deai_loop
    - reddit_summary
    - validate_artifacts
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing
    - copyedit
    - da_content
    - da_style