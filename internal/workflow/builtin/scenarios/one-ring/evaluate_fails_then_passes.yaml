# Evaluate Retry: Evaluate fails, says refactor, refactor fixes, second attempt passes

name: evaluate_fails_then_passes
description: Evaluate fails, triggers refactor, passes on retry

inputs:
  steps: [implement]

events:
  # Router: This scenario exercises the review -> refactor -> retry cycle, not routing.
  # Its assertions require the full-pipeline entry, so that decision is made
  # explicitly here instead of falling out of the router's default candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Enter at the top of the pipeline."

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Initial implementation attempt."
      response_text: "Initial implementation attempt."
      tool_calls: []

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "Implementation has critical issues: null pointer in handler, missing validation. Add null check before accessing request.body in the handler. Add validation middleware for the incoming request payload."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "Implementation has critical issues: null pointer in handler, missing validation. Add null check before accessing request.body in the handler. Add validation middleware for the incoming request payload."
      tool_results: []
      thread_token_count: 100

  - node: impl_loop.attempt.refactor.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Added null check in handler and input validation middleware."
      response_text: "Added null check in handler and input validation middleware."
      tool_calls: []

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Built on refactored code. All issues resolved."
      response_text: "Built on refactored code. All issues resolved."
      tool_calls: []

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Implementation is clean and complete."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Implementation is clean and complete."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - planning
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - impl_loop.attempt.refactor
    - success
  not_reached:
    - planning.plan
    - write_tests
