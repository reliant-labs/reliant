# Implement Only: Straight to implementation, nothing else

name: implement_only
description: "steps: [implement] — straight to implementation, no planning or checks"

inputs:
  steps: [implement]

events:
  # Router: "straight to implementation" — this is the whole point of the
  # scenario, so the routing decision is made explicitly here.
  - node: classify
    output:
      selected_node: impl_loop
      reasoning: "Simple, well-defined task — go straight to implementation."

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Minimal implementation done."
      response_text: "Minimal implementation done."
      tool_calls: []

  # review is a structured-agent ref. Mocking its inner agent_loop nodes makes
  # the sub-workflow body EXECUTE rather than taking its output from here, so
  # get-it-right's own response/completed CEL is compiled and evaluated.
  # get-it-right declares response_tool_name: submit_evaluation.
  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Minimal implementation is correct."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Minimal implementation is correct."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - classify
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - success
  # The implement branch really EXECUTED — reached alone would also be true of
  # skipped nodes, so the routing outcome is pinned with completed.
  completed:
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.review
    - success
  not_reached:
    # The router dispatched straight to impl_loop, so the planning branch is
    # never scheduled at all. (Previously `planning` was asserted REACHED —
    # true only because the unmocked router defaulted to refine_prompt.)
    - refine_prompt
    - planning
    - planning.plan
    - write_tests
    - impl_loop.attempt.refactor
