# Max Retries Exhausted: Loop exits after hitting the retry limit

name: max_retries_exhausted
description: Loop exits after max_retries iterations without reaching pass

inputs:
  steps: [implement]
  max_retries: 2

events:
  # Router: This scenario exercises the retry limit, not routing.
  # Its assertions require the full-pipeline entry, so that decision is made
  # explicitly here instead of falling out of the router's default candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Enter at the top of the pipeline."

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "First implementation attempt."
      response_text: "First implementation attempt."
      tool_calls: []

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "Fundamental design flaw. Restructure to match existing schema patterns."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "Fundamental design flaw. Restructure to match existing schema patterns."
      tool_results: []
      thread_token_count: 100

  - node: impl_loop.attempt.refactor.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Restructured data model."
      response_text: "Restructured data model."
      tool_calls: []

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Second attempt, still flawed."
      response_text: "Second attempt, still flawed."
      tool_calls: []

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "Data model fix wasn't sufficient. Try a completely different approach."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "Data model fix wasn't sufficient. Try a completely different approach."
      tool_results: []
      thread_token_count: 100

  - node: impl_loop.attempt.refactor.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Applied further changes but issues remain."
      response_text: "Applied further changes but issues remain."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - planning
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - impl_loop.attempt.refactor
    - max_retries_reached
  not_reached:
    - planning.plan
    - write_tests
    - success
