# Default Steps: Plan, Implement — all pass first try
#
# Tests the default configuration with no input overrides.
# Evaluate and refactor are always-on inside get-it-right.

name: default_steps
description: Default steps (plan, implement) all pass on first try

events:
  # Router: default configuration takes the full pipeline from the top.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Multi-step feature — plan before implementing."

  - node: planning.plan.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Plan: implement the feature with modular design."
      response_text: "Plan: implement the feature with modular design."
      tool_calls: []

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implemented the feature as planned."
      response_text: "Implemented the feature as planned."
      tool_calls: []

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Implementation is correct. Clean code following the plan."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Implementation is correct. Clean code following the plan."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - planning
    - planning.plan
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - success
  # The planning branch really EXECUTED — reached would also hold for skipped
  # nodes, so the routing outcome is pinned with completed.
  completed:
    - planning
    - planning.plan
    - impl_loop
    - success
  not_reached:
    - write_tests
    - impl_loop.attempt.refactor
