# Plan Only: Only the planning step is enabled
#
# Tests the minimal planning-only configuration.
# impl_loop runs but inner nodes are skipped.

name: plan_only
description: "steps: [plan]. Planning runs. Everything else is skipped. impl_loop ref'd workflow runs but eval_strategy defaults to \"pass\"."

inputs:
  steps: [plan]

events:
  # Router: this scenario is NAMED for the planning branch — route there
  # explicitly rather than relying on the router's default candidate.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Planning-only request — enter the pipeline at the planning phase."

  - node: planning.plan
    output:
      response_text: "Here is the plan for the task."

expect:
  outcome: completed
  reached:
    - classify
    - planning
    - planning.plan
    - success
  # The planning branch really EXECUTED, not merely got scheduled.
  completed:
    - planning
    - planning.plan
    - success
  not_reached:
    - write_tests
    - impl_loop