# Full Pipeline: All steps enabled, everything passes first try

name: full_pipeline_all_pass
description: All steps enabled, all pass on first try

inputs:
  steps: [plan, tdd, implement, lint, test, build]

events:
  # Router: all steps enabled — enter at the top of the pipeline.
  - node: classify
    output:
      selected_node: refine_prompt
      reasoning: "Full pipeline requested — start from planning."

  - node: planning.plan.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Comprehensive plan for the feature."
      response_text: "Comprehensive plan for the feature."
      tool_calls: []

  - node: write_tests.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Wrote failing unit and integration tests."
      response_text: "Wrote failing unit and integration tests."
      tool_calls: []

  - node: impl_loop.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Full implementation complete."
      response_text: "Full implementation complete."
      tool_calls: []

  - node: impl_loop.attempt.lint
    output:
      exit_code: 0

  - node: impl_loop.attempt.test
    output:
      exit_code: 0

  - node: impl_loop.attempt.build
    output:
      exit_code: 0

  - node: impl_loop.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Everything passes. Implementation is clean and correct."
  - node: impl_loop.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Everything passes. Implementation is clean and correct."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - planning
    - planning.plan
    - write_tests
    - impl_loop
    - impl_loop.attempt.implement
    - impl_loop.attempt.lint
    - impl_loop.attempt.test
    - impl_loop.attempt.build
    - impl_loop.attempt.join_checks
    - impl_loop.attempt.review
    - success
  completed:
    - planning
    - planning.plan
    - write_tests
    - impl_loop
    - success
  not_reached:
    - impl_loop.attempt.refactor
