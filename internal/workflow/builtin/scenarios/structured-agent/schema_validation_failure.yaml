# Schema Validation Failure Test: Response data fails JSON Schema validation
#
# This scenario tests that structured-agent keeps looping when the response
# tool call fails schema validation, and completes once valid data is submitted.
#
# Key aspects tested:
# 1. A failed response tool call (is_error) does NOT count as a structured
#    response: response_data[tool] stays null, so outputs.completed is false
# 2. The loop continues — the error tool result is in context, and the LLM
#    retries with corrected data
# 3. remind_response does NOT fire (it only fires for text-only responses
#    with no tool calls at all)
# 4. Once validation passes, the loop exits with the structured response

name: schema_validation_failure
description: LLM response fails schema validation twice, then succeeds with valid data

inputs:
  response_tool_name: "submit_review"

  response_schema:
    type: object
    required: [verdict, findings]
    additionalProperties: false
    properties:
      verdict:
        type: boolean
      confidence:
        type: integer
        minimum: 1
        maximum: 10
      findings:
        type: string
        minLength: 10

events:
  # Iteration 1: LLM calls response tool with INVALID data
  - node: agent_loop.call_llm
    type: llm_response
    text: "Here's my review."
    tool_calls:
      - name: submit_review
        input:
          # Missing required field "findings"
          verdict: true
          confidence: 8

  # Response tool execution FAILS validation (missing required field).
  # is_error keeps response_data[submit_review] null, so the loop continues.
  - node: agent_loop.execute_tools
    type: tool_result
    tool: submit_review
    is_error: true
    output:
      error: "Response tool schema validation failed: missing required property 'findings'"

  # Iteration 2: LLM tries again with wrong type
  - node: agent_loop.call_llm
    type: llm_response
    text: "Let me fix that."
    tool_calls:
      - name: submit_review
        input:
          verdict: "yes" # Wrong type - should be boolean
          findings: "Code looks good with proper tests"

  # Response tool execution FAILS validation (type mismatch)
  - node: agent_loop.execute_tools
    type: tool_result
    tool: submit_review
    is_error: true
    output:
      error: "Response tool schema validation failed: property 'verdict' has type 'string', expected 'boolean'"

  # Iteration 3: LLM provides VALID data
  - node: agent_loop.call_llm
    type: llm_response
    text: "Now with the correct schema."
    tool_calls:
      - name: submit_review
        input:
          verdict: true
          confidence: 8
          findings: "Code quality is excellent with comprehensive tests and error handling"

  # Response tool execution succeeds
  - node: agent_loop.execute_tools
    type: tool_result
    tool: submit_review
    output:
      verdict: true
      confidence: 8
      findings: "Code quality is excellent with comprehensive tests and error handling"

expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    - agent_loop.approval
    - agent_loop.compact
    # remind_response only fires for text-only turns (no tool calls at all);
    # failed validation retries are driven by the error tool result instead.
    - agent_loop.remind_response

  # Final output should be the valid response
  outputs:
    response.verdict: true
    response.confidence: 8
    response.findings: "Code quality is excellent with comprehensive tests and error handling"
    completed: true
