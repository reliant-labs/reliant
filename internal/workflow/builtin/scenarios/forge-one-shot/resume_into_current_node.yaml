# Resume-into-current-node (Task 4) on the single-loop forge-one-shot chain.
#
# The user paused while build_app — the one get-it-right loop that carries the
# whole arc — was running, then sent a message. Resume must re-enter build_app
# (the currently-active node) and continue through build_done to the
# launch_preview handoff, rather than restarting the workflow from node zero.
#
# Mirrors the runtime resume-at-checkpoint path (resolveResumeTarget /
# resume_test.go TestDynamicWorkflow_Resume_EntersAtCheckpointNode): a new run
# begins at the checkpointed node, earlier node outputs are not reconstructed, so
# the workflow's cross-node edge refs are all has()-guarded. start_at models it.
#
# build_app is the entry node, so resuming into it is also the shortest possible
# chain: its own completion event drives every edge the rest of the run takes.

name: resume_into_current_node
description: Pausing during build_app resumes into that node and runs on to the preview

start_at: build_app

events:
  - node: build_app
    output:
      response_text: "The build resumed from where it paused and completed."
      strategy: pass
      eval_strategy: pass
      stuck: false
      iterations: 4

  - node: launch_preview
    output:
      response_text: "Started the finished build and posted the preview URL."

expect:
  outcome: completed
  reached:
    - build_app
    - build_done
    - launch_preview
    - success
  not_reached:
    - stuck
    - failed
