# Start from de_ai: skip all earlier phases via router
#
# Tests that the classify router can route directly to the de_ai phase,
# skipping everything through distribution. The de-AI pass operates on the
# already-assembled post on disk, so no upstream node outputs are required.

name: start_from_de_ai
description: Router routes to de_ai, skipping all phases through distribution

events:
  # Context intake: existing final artifact should be enough
  # EXECUTED (not black-boxed): a qualified id makes the ref transparent, so
  # this node's own args CEL — e.g. tools: {{inputs.tools + ['ask_user']}} — is compiled.
  - node: context_intake.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Existing final blog post artifact is the relevant context."
      response_text: "Existing final blog post artifact is the relevant context."
      tool_calls: []

  # Router selects de_ai as starting point
  - node: classify
    output:
      selected_node: de_ai
      reasoning: "Content is finalized and needs de-AI treatment."

  # De-AI pass — EXECUTED. Mocking get-it-right's inner loop nodes means the
  # `iterations` value below is produced by the loop rather than asserted as a
  # scenario literal.
  - node: de_ai.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Applied the de-AI edits to the assembled post."
      response_text: "Applied the de-AI edits to the assembled post."
      tool_calls: []
  - node: de_ai.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Reads like genuine practitioner writing."
  - node: de_ai.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Reads like genuine practitioner writing."
      tool_results: []
      thread_token_count: 100

  # Reddit Summary
  - node: reddit_summary.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reddit post written."
      response_text: "Reddit post written."
      tool_calls: []

  # handoff EXECUTES: it previously had NO event, so it silently fell through to
  # the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the result."
      response_text: "Handoff complete; posted the result."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
  completed:
    - context_intake
    - context_intake.agent_loop.call_llm
    - de_ai
    - de_ai.attempt.implement
    - de_ai.attempt.review
    - reddit_summary
    - reddit_summary.agent_loop.call_llm
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
