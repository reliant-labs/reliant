# Resume-into-current-node (Task 4): pausing during the de-AI (style/voice) loop
# re-enters it via resume, not a restart.
#
# The user paused while the de_ai get-it-right loop — the style/voice pass — was
# running, then sent a message. Resume must re-enter de_ai (the currently-active
# node) and continue to the handoff. It must NOT restart from context_intake or
# re-run writing/evaluation/etc.
#
# This is the resume-at-checkpoint mechanism (start_at models resolveResumeTarget /
# resume_test.go): a new run begins directly at the checkpointed node. The de_ai
# loop re-derives its state from the assembled post on disk, so no upstream node
# outputs need reconstructing — which is why the pipeline's cross-phase refs are
# all has()-guarded. (blog also has a router-based start_from_de_ai scenario; this
# one exercises the resume/start_at path specifically.)

name: resume_into_current_node
description: Pausing during the de-AI (style) loop resumes into de_ai, not from node zero

start_at: de_ai

events:
  # Phase agents below are EXECUTED, not black-boxed: the qualified id makes the
  # builtin://agent ref transparent so each node's own args CEL is compiled.
  # de_ai EXECUTES its get-it-right body rather than standing in for it.
  - node: de_ai.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Applied the de-AI edits to the assembled post."
      response_text: "Applied the de-AI edits to the assembled post."
      tool_calls: []
  - node: de_ai.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Reads like genuine practitioner writing."
  - node: de_ai.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Reads like genuine practitioner writing."
      tool_results: []
      thread_token_count: 100

  - node: reddit_summary.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reddit summary written."
      response_text: "Reddit summary written."
      tool_calls: []


  # handoff EXECUTES rather than silently falling through to the default empty
  # mock: it previously had NO event at all, so its builtin://agent body never
  # ran and none of its config was compiled.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the finished artifacts."
      response_text: "Handoff complete; posted the finished artifacts."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
    - handoff
  not_reached:
    - context_intake
    - classify
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
