# Full pipeline happy path: all phases reached in order from topic_discovery to complete
#
# Tests that all nodes are reached when running the full pipeline.
# Covers: context_intake → classify → topic_discovery → research_brief → writing
#   → evaluation → visual_generation → distribution → de_ai → reddit_summary
#   → validate_artifacts → complete

name: full_pipeline_happy_path
description: All phases reached in order from context_intake to complete

events:
  # Context intake: no missing website/source context for this run
  - node: context_intake
    output:
      response_text: "Context already provided or not required."

  # Router selects the default full-pipeline starting point
  - node: classify
    output:
      selected_node: topic_discovery
      reasoning: "Start from scratch with topic discovery."

  # Phase 1: Topic Discovery
  - node: topic_discovery
    output:
      response_text: "Selected topic: ai-agent-repetition-pattern. Slug: ai-agent-repetition-pattern."

  # Phase 2: Research + Brief
  - node: research_brief
    output:
      response_text: "Research complete. Brief written with 6 sections."

  # Phase 3: Writing
  - node: writing
    output:
      response_text: "Draft complete. All 6 sections written. Word count: 3200."

  # Phase 4: Evaluation
  - node: evaluation
    output:
      response_text: "Evaluation complete. All sections present. Q1-Q3 passed."

  # Phase 5: Visual Generation
  - node: visual_generation
    output:
      response_text: "Visual generation complete. 2 visuals generated."

  # Phase 6: Distribution
  - node: distribution
    output:
      response_text: "Final assembly complete. Title applied, images embedded."

  # Phase 7: De-AI pass (get-it-right sub-workflow, black-box mocked)
  - node: de_ai
    output:
      response_text: "De-AI pass complete. Post reads like practitioner writing."
      review_grade: pass
      eval_strategy: pass
      iterations: 2

  # Phase 8: Reddit Summary
  - node: reddit_summary
    output:
      response_text: "Reddit post written to final/reddit-post.md."

  # validate_artifacts is a run node — default mock exit_code 0 (success)

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - topic_discovery
    - research_brief
    - writing
    - evaluation
    - visual_generation
    - distribution
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
    - handoff
