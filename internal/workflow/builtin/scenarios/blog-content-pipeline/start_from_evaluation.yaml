# Start from evaluation: skip phases 1-3 via router
#
# Tests that the classify router can route to evaluation, skipping
# topic discovery, research, and writing.

name: start_from_evaluation
description: Router routes to evaluation, skipping discovery/research/writing phases

events:
  # Phase agents below are EXECUTED, not black-boxed: the qualified id makes the
  # builtin://agent ref transparent so each node's own args CEL is compiled.
  # Context intake: existing edited draft should be enough
  - node: context_intake.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Existing edited draft artifact is the relevant context."
      response_text: "Existing edited draft artifact is the relevant context."
      tool_calls: []

  # Router selects evaluation as starting point
  - node: classify
    output:
      selected_node: evaluation
      reasoning: "Edited draft ready — evaluate quality and fact-check."

  - node: evaluation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Evaluation complete."
      response_text: "Evaluation complete."
      tool_calls: []
  - node: visual_generation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Visuals generated."
      response_text: "Visuals generated."
      tool_calls: []
  - node: distribution.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Assembly complete."
      response_text: "Assembly complete."
      tool_calls: []
  # de_ai EXECUTES its get-it-right body rather than standing in for it.
  - node: de_ai.attempt.implement
    output:
      response_text: "Applied the de-AI edits to the assembled post."
  - node: de_ai.attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Reads like genuine practitioner writing."
  - node: reddit_summary.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reddit post written."
      response_text: "Reddit post written."
      tool_calls: []

  # handoff EXECUTES: it previously had NO event, so it silently fell through to
  # the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the result."
      response_text: "Handoff complete; posted the result."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - context_intake
    - classify
    - evaluation
    - visual_generation
    - distribution
    - de_ai
    - reddit_summary
    - validate_artifacts
    - complete
  not_reached:
    - topic_discovery
    - research_brief
    - writing
