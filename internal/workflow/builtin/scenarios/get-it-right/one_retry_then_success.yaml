# One Retry Then Success: First attempt has issues, refactor undoes them, second succeeds
#
# Tests the implement → review → refactor → loop cycle:
# 1. Iteration 0: implement runs, review says strategy="refactor" with feedback
# 2. Refactor agent UNDOES the problematic work (does not reimplement)
# 3. Loop condition: strategy != "pass" → re-iterate
# 4. Iteration 1: implement starts fresh with review insights, review says strategy="pass"
# 5. Conditional edge: strategy == "pass" → skip refactor
# 6. Loop exits
#
# Flow: implement → review → refactor → implement → review → done

name: one_retry_then_success
description: First attempt has issues, refactor undoes them, second attempt starts fresh and succeeds

events:
  # Iteration 0: implement has issues
  - node: attempt.implement
    output:
      response_text: "Attempted the feature but tests fail. The data model doesn't match expectations."

  - node: attempt.review
    output:
      response:
        grade: fail
        strategy: "refactor"
        feedback: "The implementation assumed a flat data model but the schema is actually nested with foreign key constraints. Use the repository layer instead of direct SQL — follow the existing pattern in UserRepository. Check the migration files for the actual schema shape before writing queries."

  - node: attempt.refactor
    output:
      response_text: "Reverted the direct SQL queries and flat data model code. Workspace is clean for the next attempt to use the repository layer instead."

  # Iteration 1: implement starts fresh with review insights, succeeds
  - node: attempt.implement
    output:
      response_text: "Built using the repository layer as suggested by the review. All tests pass, implementation is clean."

  - node: attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."

  # refactor is skipped (conditional edge: strategy == "pass")

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.review
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."
