# Max Retries Exhausted: Loop exits after hitting the retry limit
#
# Tests the loop's max_retries safeguard with the full implement → review → refactor cycle:
# 1. Iteration 0: implement fails, review says "refactor", refactor undoes work
# 2. Iteration 1: implement tries again, review says "refactor", refactor undoes work
# 3. Loop condition: iter.iteration(2) == max_retries(2) → loop exits despite not passing
#
# Verifies that:
# - The loop correctly stops at max_retries even when strategy != "pass"
# - Refactor only undoes work, does not reimplement
#
# Flow: implement → review → refactor → implement → review → refactor → done (max retries)

name: max_retries_exhausted
description: All retries fail, loop exits at max_retries limit

inputs:
  max_retries: 2

events:
  # Iteration 0: fundamentally wrong, refactor undoes
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "First attempt. Tried to refactor the auth module but broke session handling."
      response_text: "First attempt. Tried to refactor the auth module but broke session handling."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "Auth module is tightly coupled to session management. Can't change one without the other. Introduce an event bus to decouple auth, sessions, and websockets before attempting any refactoring. Start from the middleware layer rather than the module boundaries."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "Auth module is tightly coupled to session management. Can't change one without the other. Introduce an event bus to decouple auth, sessions, and websockets before attempting any refactoring. Start from the middleware layer rather than the module boundaries."
      tool_results: []
      thread_token_count: 100

  - node: attempt.refactor.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reverted auth module changes. Workspace is clean for the next attempt to try the middleware-first approach with an event bus."
      response_text: "Reverted auth module changes. Workspace is clean for the next attempt to try the middleware-first approach with an event bus."
      tool_calls: []

  # Iteration 1: better but still not there
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Second attempt. Event bus approach works for auth/sessions but the websocket layer also has coupling issues."
      response_text: "Second attempt. Event bus approach works for auth/sessions but the websocket layer also has coupling issues."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "The event bus approach is right but incomplete. Websockets maintain their own auth state that also needs to go through the bus. Extend the event bus to cover all three systems: auth, sessions, and websocket connection state."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "The event bus approach is right but incomplete. Websockets maintain their own auth state that also needs to go through the bus. Extend the event bus to cover all three systems: auth, sessions, and websocket connection state."
      tool_results: []
      thread_token_count: 100

  - node: attempt.refactor.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Reverted the incomplete event bus implementation. Workspace is clean for a fresh attempt that covers all three systems: auth, sessions, and websocket connection state."
      response_text: "Reverted the incomplete event bus implementation. Workspace is clean for a fresh attempt that covers all three systems: auth, sessions, and websocket connection state."
      tool_calls: []

  # Loop exits: iter.iteration(2) == max_retries(2)

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.review
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "refactor"
      review_grade: "fail"
      review_feedback: "The event bus approach is right but incomplete. Websockets maintain their own auth state that also needs to go through the bus. Extend the event bus to cover all three systems: auth, sessions, and websocket connection state."
