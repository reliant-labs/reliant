# Happy Path: First attempt succeeds immediately
#
# Tests the simplest successful path:
# 1. Iteration 0: implement runs, review says strategy="pass"
# 2. Conditional edge: strategy == "pass" → skip refactor
# 3. Loop condition: strategy == "pass" → loop exits after 1 iteration
#
# Flow: implement → review → done

name: happy_path_no_retry
description: First attempt succeeds, no refactoring needed

events:
  - node: attempt.implement
    output:
      response_text: "Implemented the feature. Tests pass, code looks correct."

  - node: attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Implementation is correct. The codebase patterns were straightforward."

  # refactor is skipped (conditional edge: strategy == "pass")

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Implementation is correct. The codebase patterns were straightforward."
