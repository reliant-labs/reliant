# Restart From Scratch: Review says scrap it, refactor agent undoes everything
#
# Tests the "refactor" strategy where review determines the approach is
# fundamentally wrong and the refactor agent undoes the work:
# 1. Iteration 0: implement builds duplicate infrastructure
# 2. Review says strategy="refactor" — approach fights the codebase
# 3. Refactor agent undoes the custom code (does NOT reimplement)
# 4. Iteration 1: implement starts fresh using existing infrastructure, review says "pass"
# 5. Loop exits
#
# Flow: implement → review → refactor → implement → review → done

name: restart_from_scratch
description: Approach is fundamentally wrong, refactor agent undoes it, next attempt starts fresh

events:
  # Iteration 0: wrong approach entirely
  - node: attempt.implement
    output:
      response_text: "Built a custom event system to handle notifications. Tests pass but the implementation is 400 lines and duplicates existing functionality."

  - node: attempt.review
    output:
      response:
        grade: fail
        strategy: "refactor"
        feedback: "The implementation works but fights the codebase. There's already a pub/sub system in the message broker module that handles exactly this. Delete the custom event system entirely and use internal/broker's pub/sub for all notification routing. Search for existing infrastructure before building new systems."

  - node: attempt.refactor
    output:
      response_text: "Deleted the entire custom event system (400 lines removed). Workspace is clean for the next attempt to use the existing internal/broker pub/sub system."

  # Iteration 1: fresh start using existing infrastructure
  - node: attempt.implement
    output:
      response_text: "Built on the existing broker infrastructure. Implementation is 50 lines, all tests pass, and it integrates cleanly with the existing notification flow."

  - node: attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "Clean implementation using existing infrastructure. The pub/sub integration is correct and the code follows the established patterns in the broker module."

  # refactor is skipped (conditional edge: strategy == "pass")

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.review
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "Clean implementation using existing infrastructure. The pub/sub integration is correct and the code follows the established patterns in the broker module."
