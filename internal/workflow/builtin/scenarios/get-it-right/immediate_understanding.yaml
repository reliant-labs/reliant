# Immediate Understanding: First try fully succeeds with no issues
#
# Tests the case where the codebase is simple enough that the first attempt
# needs no review feedback:
# 1. Iteration 0: implement succeeds cleanly, review confirms pass
# 2. Conditional edge: strategy == "pass" → skip refactor
# 3. Loop exits
#
# Flow: implement → review → done

name: immediate_understanding
description: Codebase is simple enough that first attempt fully succeeds

events:
  - node: attempt.implement
    output:
      response_text: "Added the new endpoint. Followed the existing pattern from the adjacent routes. All tests pass."

  - node: attempt.review
    output:
      response:
        grade: pass
        strategy: "pass"
        feedback: "The implementation is complete and correct. The codebase has consistent patterns that made this straightforward."

  # refactor is skipped (conditional edge: strategy == "pass")

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
      review_feedback: "The implementation is complete and correct. The codebase has consistent patterns that made this straightforward."
