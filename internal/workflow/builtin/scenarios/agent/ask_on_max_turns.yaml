# Ask on Max Turns: Agent stops at max_turns with ask input enabled
#
# Tests the max_turns enforcement in the while condition:
#   ((outputs.tool_calls != null && size(outputs.tool_calls) > 0) || outputs.has_feedback == true)
#     && (inputs.max_turns == 0 || iter.iteration < inputs.max_turns)
#
# With max_turns=1, the agent gets one iteration (iteration 0).
# After iteration 0, iter.iteration becomes 1, and 1 < 1 = false → loop exits.
# The max_turns_notification fires because _iterations (1) >= max_turns (1).

name: ask_on_max_turns
description: Agent stops when max_turns limit is hit

inputs:
  mode: "auto"
  max_turns: 1
  ask: true

events:
  # Single iteration: LLM calls a tool
  - node: agent_loop.call_llm
    type: llm_response
    text: "Let me search for that..."
    tool_calls:
      - name: grep
        input:
          pattern: "TODO"

  # Tool executes
  - node: agent_loop.execute_tools
    type: tool_result
    tool: grep
    output:
      result: '["file1.go:10", "file2.go:20"]'

  # max_turns_notification fires because _iterations >= max_turns (1 >= 1)
  - node: max_turns_notification
    type: tool_result
    tool: save_message
    output:
      result: "Agent reached maximum iteration limit (1 turns)."

expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
    - max_turns_notification
  not_reached:
    - agent_loop.approval
    - agent_loop.compact
