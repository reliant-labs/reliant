# Winner Candidate 3: Reviewer selects the third implementation
#
# Tests that the winner selection logic works for any candidate number.
# The apply_winner node uses a map lookup on _results with the winner number
# to get the correct worktree path.

name: winner_candidate_3
description: Reviewer selects candidate 3 as the winner via use_winner strategy

events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Create a REST API for user management with pagination"
      response_text: "Create a REST API for user management with pagination"
      tool_calls: []

  - node: implementations.create_wt
    output:
      path: "/wt/1"
      branch: "b1"
  - node: implementations.impl
    output:
      response_text: "Basic CRUD implementation, no pagination"
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl
    output:
      response_text: "CRUD with offset pagination, missing input validation"
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl
    output:
      response_text: "Full REST API with cursor pagination, input validation, and comprehensive tests"

  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 3
          strategy: "use_winner"
          confidence: 9
          rationale: "Candidate 3 has cursor-based pagination (more scalable than offset), input validation, and comprehensive tests. The other candidates are incomplete."
          synthesis_instructions: ""
  - node: apply_winner
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review
    - apply_winner
    - complete
  not_reached:
    - synthesizer
