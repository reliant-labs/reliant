# Happy Path: All 3 implementations complete, reviewer picks a winner
#
# Tests the most common successful path through parallel-compete:
# 1. improve_prompt refines the task spec
# 2. Parallel loop creates 3 worktrees and runs 3 implementation agents
# 3. Reviewer picks candidate 2 with use_winner strategy
# 4. apply_winner runs rsync to copy winning implementation
# 5. complete saves final summary
#
# The implementations node is a parallel loop with inline sub-workflow.
# Provide one mock per iteration — the simulator assembles them into _results.

name: happy_path
description: All 3 implementations complete, reviewer selects candidate 2 via use_winner strategy

events:
  # Step 1: Prompt improvement (call_llm node)
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: |
          ## Refined Specification
          - Implement user authentication with OAuth and password support
          - Include rate limiting on login endpoints
          - Write unit tests for all auth flows
      response_text: |
        ## Refined Specification
        - Implement user authentication with OAuth and password support
        - Include rate limiting on login endpoints
        - Write unit tests for all auth flows
      tool_calls: []

  # Step 2: Per-iteration mocks for the parallel loop (one per candidate)
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-1"
      branch: "compete-impl-1"
  # implementations.impl is a ref INSIDE a parallel loop body. The simulator
  # cannot make such a ref transparent (executeLoopIteration has no
  # NodeTypeWorkflow branch), so it stays a black box — see the report.
  - node: implementations.impl
    output:
      response_text: "Candidate 1: Basic password auth only, no OAuth."
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-2"
      branch: "compete-impl-2"
  # implementations.impl is a ref INSIDE a parallel loop body. The simulator
  # cannot make such a ref transparent (executeLoopIteration has no
  # NodeTypeWorkflow branch), so it stays a black box — see the report.
  - node: implementations.impl
    output:
      response_text: "Candidate 2: Full OAuth + password auth with comprehensive test suite."
  - node: implementations.create_wt
    output:
      path: "/tmp/worktrees/compete-impl-3"
      branch: "compete-impl-3"
  # implementations.impl is a ref INSIDE a parallel loop body. The simulator
  # cannot make such a ref transparent (executeLoopIteration has no
  # NodeTypeWorkflow branch), so it stays a black box — see the report.
  - node: implementations.impl
    output:
      response_text: "Candidate 3: OAuth only, minimal tests."

  # Step 3: Review — structured-agent, EXECUTED (not black-boxed).
  # Mocking the inner call_llm/execute_tools makes the ref transparent, so the
  # sub-workflow's own node config and CEL are compiled and evaluated.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_1
          name: submit_review
          input:
            winner: 2
            strategy: "use_winner"
            confidence: 8
            rationale: "Candidate 2 has the most complete implementation."
            synthesis_instructions: ""
  - node: review.agent_loop.execute_tools
    output:
      response_data:
        submit_review:
          winner: 2
          strategy: "use_winner"
          confidence: 8
          rationale: "Candidate 2 has the most complete implementation with both OAuth and password auth, plus comprehensive tests."
          synthesis_instructions: ""
      tool_results: []
      thread_token_count: 100

  # Step 4: apply_winner rsync
  - node: apply_winner
    output:
      exit_code: 0
      stdout: "sent 1234 bytes  received 56 bytes\n"
      stderr: ""

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review
    - apply_winner
    - complete
  completed:
    - improve_prompt
    - implementations
    - implementations.create_wt
    - review
    - review.agent_loop.call_llm
    - review.agent_loop.execute_tools
    - apply_winner
    - complete
  not_reached:
    - synthesizer
