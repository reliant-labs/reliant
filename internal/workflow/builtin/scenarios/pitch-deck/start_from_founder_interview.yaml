# Start from founder interview: router skips scrape + research phases
#
# REGRESSION for the production failure:
#   "Step 'founder_interview' config evaluation failed:
#    workflow.thread.inject.content: ... CEL evaluation error: no such key: scrape_website"
#
# The classify router can dispatch directly to founder_interview when the user
# says research is already done. In that case nodes.scrape_website /
# nodes.research_competitors / nodes.research_market were never populated, so
# every cross-phase reference in downstream inject content must be guarded
# with has() and fall back to reading the pitch-deck-content/ files.

name: start_from_founder_interview
description: Router dispatches straight to founder_interview; unran phase outputs must not break inject evaluation

inputs:
  website_url: "https://example.com"
  deck_purpose: seed

events:
  # The builtin://agent phase nodes below are EXECUTED rather than black-boxed:
  # a qualified id (`<node>.agent_loop.call_llm`) makes the ref transparent, so
  # each node's own args CEL — tools, and scrape_website's website_url-dependent
  # system prompt — is compiled and evaluated.
  # Router skips scrape + research: the user already has research on disk
  - node: classify
    output:
      selected_node: founder_interview
      reasoning: "Research artifacts already exist — go straight to the interview."

  # Phase 3: Founder interview (guarded inject must evaluate with fallbacks)
  - node: founder_interview.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
          ## Founder Brief
          Downloads: 3,200. WAU: 800. Raising $2M seed.

      response_text: |
        ## Founder Brief
        Downloads: 3,200. WAU: 800. Raising $2M seed.

      tool_calls: []
  # Phase 4a: Plan deck
  # plan_deck EXECUTES its structured-agent body rather than being replaced by a
  # literal. The response tool is `submit_deck_plan` (pitch-deck.yaml sets
  # response_tool_name); using any other key leaves `completed` false and spins.
  - node: plan_deck.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_plan
          name: submit_deck_plan
          input: {}
  - node: plan_deck.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_deck_plan:
          narrative_arc: "Traction-first."
          slides:
            - filename: "01-hook.md"
              title: "3,200 downloads and climbing"
              purpose: "Hook with traction"
              key_content: "3,200 downloads, 800 WAU"
              layout_hint: full-bleed-stat
              sources: "phase-3-interview/founder-brief.md"
  - node: slide_pipeline
    # Deliberate black box: this scenario mocks the parallel loop's AGGREGATE
    # result (_results/_completed) rather than exercising the per-slide body.
    # Loop bodies execute by default; this opts out explicitly.
    black_box: true
    output:
      _completed: 1
      _failed: 0
      _parallel: true
      _results:
        "01-hook.md":
          response_text: "Wrote hook slide."

  # Phase 5: slides_loop inner nodes
  - node: slides_loop.build_slides
    output:
      response_text: "Built slide components."
  - node: slides_loop.start_dev_server
    output:
      exit_code: 0
  - node: slides_loop.visual_review
    output:
      response_text: "Slides pass visual review."
      response:
        verdict: pass
        summary: "Clean slides."
        slide_issues: []
        ai_visual_tells: []
  - node: slides_loop.stop_dev_server
    output:
      exit_code: 0

  # handoff EXECUTES: it previously had NO event, so it silently fell through to
  # the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the result."
      response_text: "Handoff complete; posted the result."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - classify
    - founder_interview
    - plan_deck
    - slide_pipeline
    - slides_loop
    - complete
  not_reached:
    - scrape_website
    - research_competitors
    - research_market
    - research_done
