# Start from research: router enters at the research phase
#
# The research phase is TWO parallel nodes joined by research_done (an "all"
# join). Dispatching to research_competitors alone would deadlock the join, so
# the classify edge fans out to BOTH research nodes. This scenario verifies:
# 1. Both research tracks run when the router selects the research entry
# 2. The research_done join fires and the pipeline continues
# 3. The guarded scrape_website references fall back cleanly (scrape never ran)

name: start_from_research
description: Router enters at research phase; both parallel research nodes run and the join fires

inputs:
  website_url: "https://example.com"
  deck_purpose: seed

events:
  # The builtin://agent phase nodes below are EXECUTED rather than black-boxed:
  # a qualified id (`<node>.agent_loop.call_llm`) makes the ref transparent, so
  # each node's own args CEL — tools, and scrape_website's website_url-dependent
  # system prompt — is compiled and evaluated.
  # Router: website content is available, start at research
  - node: classify
    output:
      selected_node: research_competitors
      reasoning: "Website analysis already exists — run the research phase."

  # Phase 2a + 2b run in parallel (both must run for the all-join)
  - node: research_competitors.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Competitive landscape researched."
      response_text: "Competitive landscape researched."
      tool_calls: []
  - node: research_market.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Market sizing researched."
      response_text: "Market sizing researched."
      tool_calls: []

  # Phase 3: Founder interview
  - node: founder_interview.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Founder brief captured."
      response_text: "Founder brief captured."
      tool_calls: []

  # Phase 4a: Plan deck
  # plan_deck EXECUTES its structured-agent body rather than being replaced by a
  # literal. The response tool is `submit_deck_plan` (pitch-deck.yaml sets
  # response_tool_name); using any other key leaves `completed` false and spins.
  - node: plan_deck.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_plan
          name: submit_deck_plan
          input: {}
  - node: plan_deck.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_deck_plan:
          narrative_arc: "Traction-first."
          slides:
            - filename: "01-hook.md"
              title: "Hook"
              purpose: "Hook"
              key_content: "Key stat"
              layout_hint: centered-hero
              sources: "phase-2-research/market-sizing.md"
  - node: slide_pipeline
    # Deliberate black box: this scenario mocks the parallel loop's AGGREGATE
    # result (_results/_completed) rather than exercising the per-slide body.
    # Loop bodies execute by default; this opts out explicitly.
    black_box: true
    output:
      _completed: 1
      _failed: 0
      _parallel: true
      _results:
        "01-hook.md":
          response_text: "Wrote hook slide."

  # Phase 5: slides_loop inner nodes
  - node: slides_loop.build_slides
    output:
      response_text: "Built slide components."
  - node: slides_loop.start_dev_server
    output:
      exit_code: 0
  - node: slides_loop.visual_review
    output:
      response_text: "Slides pass visual review."
      response:
        verdict: pass
        summary: "Clean slides."
        slide_issues: []
        ai_visual_tells: []
  - node: slides_loop.stop_dev_server
    output:
      exit_code: 0

  # handoff EXECUTES: it previously had NO event, so it silently fell through to
  # the default empty mock and its builtin://agent body never ran.
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Handoff complete; posted the result."
      response_text: "Handoff complete; posted the result."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - classify
    - research_competitors
    - research_market
    - research_done
    - founder_interview
    - plan_deck
    - slide_pipeline
    - slides_loop
    - complete
  not_reached:
    - scrape_website
