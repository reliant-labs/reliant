name: parallel-compete
title: Best of Three
apiVersion: "0.0.5"
description: |
  3 agents implement in parallel worktrees, reviewer picks winner or synthesizes.
  Thread mode: new (isolated context). Each worktree is independent.
  Apply path: use_winner applies the winner's changes to the project with git apply, synthesize merges best parts.

entry: [improve_prompt]

outputs:
  strategy: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.strategy : ''}}"
  winner: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.winner : 0}}"
  confidence: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.confidence : 0}}"
  rationale: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.rationale : ''}}"
  test_exit: "{{has(nodes.verify_test) && has(nodes.verify_test.exit_code) ? nodes.verify_test.exit_code : -1}}"
  build_exit: "{{has(nodes.verify_build) && has(nodes.verify_build.exit_code) ? nodes.verify_build.exit_code : -1}}"

inputs:
  mode:
    type: enum
    enum: ["manual", "auto", "plan"]
    default: "auto"
    description: "Execution mode: auto = auto-approve tools, manual = require approval"
  model:
    type: model
    default:
      tags: ["flagship"]
    description: Default LLM model for all agents (can be overridden per group)

  test_command:
    type: string
    default: npm test
    description: Command to run tests after applying the result.

  build_command:
    type: string
    default: npm run build
    description: Command to run build after applying the result.

  implementer:
    type: group
    presets:
      tag: agent
      default: general
    description: Settings for implementer agents (all 3 candidates)
    inputs:
      model:
        type: model
        description: Model override for implementer agents
        default:
          tags: ["flagship"]
      max_turns:
        type: integer
        default: 200
        min: 1
        max: 500
        description: Maximum agent loop iterations
      tools:
        type: tools
        default: ["tag:coding:default"]
        description: Available tools for implementers
      system_prompt:
        type: string
        default: |
          You are an implementation candidate in a competitive coding challenge.
          Your implementation will be compared against other candidates and judged by a reviewer.

          ## Guidelines
          - Implement the feature completely and correctly
          - Write clean, well-documented code
          - Include any necessary tests
          - Follow project conventions and best practices
          - Handle edge cases appropriately
        description: System prompt override for implementers
      spawn_presets:
        type: preset
        tags: [agent]
        multi: true
        default: []
        description: Presets available for implementer's spawn tool (empty = spawn disabled)
      skills:
        type: array
        default: []
        description: |
          Namespaced skill paths (e.g. "forge/getting-started") to preload into each
          implementer agent's context before the first turn, so it works from the
          source-of-truth skills instead of loading them by hand.

nodes:
  # Prompt improvement - ephemeral call, saves improved result to main thread
  - id: improve_prompt
    type: call_llm
    args:
      model: "{{inputs.model}}"
      # No tools_config = no tools for this LLM call
      system_prompt: |
        You are a prompt engineer. Your job is to take the task description and improve it into a clear, detailed specification that multiple developers could implement independently.

        Include:
        - Clear acceptance criteria
        - Edge cases to handle  
        - Any constraints or requirements
        - Expected behavior

        Output ONLY the improved prompt, no preamble.

  - id: save_improved_prompt
    type: save_message
    args:
      role: assistant
      content: |
        ## Improved Task Specification

        {{nodes.improve_prompt.message.text}}

  # Parallel loop: create worktree + run implementation for each candidate
  # items expression maps [1,2,3] into objects carrying the prompt text so inner
  # nodes can reference it via iter.item.prompt (inner scope can't see parent nodes).
  - id: implementations
    type: loop
    parallel: true
    items: "{{[1, 2, 3].map(n, {'num': n, 'prompt': nodes.improve_prompt.message.text})}}"
    key: "{{string(iter.item.num)}}"
    on_failure: continue
    inline:
      entry: [create_wt]
      outputs:
        worktree_path: "{{nodes.create_wt.path}}"
        worktree_branch: "{{nodes.create_wt.branch}}"
        response_text: "{{has(nodes.impl) && has(nodes.impl.response_text) ? nodes.impl.response_text : ''}}"
      nodes:
        - id: create_wt
          type: create_worktree
          args:
            name: compete-impl-{{iter.item.num}}-{{workflow.id}}
            # Start every candidate from what the chat's checkout has now: its
            # worktree branch, or the project checkout's current commit. Then a
            # candidate's changes apply back onto that checkout as-is.
            base_branch: "{{has(workflow.branch) ? workflow.branch : 'HEAD'}}"
            copy_files:
              - .env
              - .env.local
            force: true

        # mode: new = isolated thread (not fork/inherit which would share/copy context)
        # project.path = working dir for sub-workflow tools
        - id: impl
          type: workflow
          ref: builtin://agent
          thread:
            mode: new
            inject:
              role: user
              content: |
                You are Implementation Candidate #{{iter.item.num}}.

                ## Task
                {{iter.item.prompt}}
          project:
            path: "{{nodes.create_wt.path}}"
          presets:
            default: general
          args:
            mode: "{{inputs.mode}}"
            model: "{{inputs.implementer.model != '' ? inputs.implementer.model : inputs.model}}"
            max_turns: "{{inputs.implementer.max_turns}}"
            tools: "{{inputs.implementer.tools}}"
            system_prompt: "{{inputs.implementer.system_prompt}}"
            spawn_presets: "{{inputs.implementer.spawn_presets}}"
            skills: "{{inputs.implementer.skills}}"

      edges:
        - from: create_wt
          default: impl

  # Fork: reviewer needs parent context. Uses response tool for structured decision.
  - id: review
    type: workflow
    ref: builtin://structured-agent
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          You are a senior code reviewer. Three implementations have been completed for the task described above.

          REFINED SPECIFICATION:
          {{nodes.improve_prompt.message.text}}

          IMPLEMENTATION LOCATIONS:
          - Candidate 1: {{nodes.implementations._results["1"].worktree_path}}
          - Candidate 2: {{nodes.implementations._results["2"].worktree_path}}
          - Candidate 3: {{nodes.implementations._results["3"].worktree_path}}

          REVIEW INSTRUCTIONS:
          1. Use your tools to browse each worktree and examine the code
          2. Evaluate code quality, correctness, and completeness
          3. Consider maintainability, performance, and best practices
          4. Make your decision using the response tool

          DECISION OPTIONS:
          - **use_winner**: One implementation is clearly best. Pick it and we'll apply it directly.
          - **synthesize**: The best solution combines parts from multiple implementations. Provide detailed instructions on what to cherry-pick from each.
    save_message:
      # No decision (the reviewer returned no structured response) means there
      # is nothing to report; routing handles that case.
      condition: "has(output.response) && output.response != null"
      role: assistant
      content: |
        ## Review Complete

        **Decision:** {{output.response.strategy}} (Candidate {{output.response.winner}})
        **Confidence:** {{output.response.confidence}}/10

        **Rationale:**
        {{output.response.rationale}}
        {{output.response.strategy == 'synthesize' ? '\n**Synthesis Instructions:**\n' + output.response.synthesis_instructions : ''}}
    presets:
      default: code_reviewer
    args:
      mode: "{{inputs.mode}}"
      model: "{{inputs.model}}"
      system_prompt: |
        You are a SENIOR CODE REVIEWER evaluating competing implementations.

        ## Your Mission
        Thoroughly review each implementation and select the best approach.
        Use your tools to actually examine the code - don't guess based on summaries.

        ## Review Criteria

        **Correctness (Most Important)**
        - Does it actually implement the requirements?
        - Are there obvious bugs or edge cases missed?
        - Does it handle errors appropriately?

        **Code Quality**
        - Is the code clean and readable?
        - Does it follow project conventions?
        - Is it well-structured and maintainable?

        **Completeness**
        - Are tests included?
        - Is documentation adequate?
        - Are edge cases handled?

        **Best Practices**
        - Security considerations addressed?
        - Performance reasonable?
        - No unnecessary complexity?

        ## Review Process
        1. Browse each worktree thoroughly using glob/view
        2. Compare similar files across implementations
        3. Look for tests and examine their coverage
        4. Check for obvious issues or antipatterns

        ## Making Your Decision
        Use the response tool to submit your decision:

        - **use_winner**: Choose this when one implementation is clearly superior.
          The winning implementation will be copied directly to the main worktree.

        - **synthesize**: Choose this when the best solution combines elements from
          multiple implementations. Provide detailed synthesis_instructions explaining
          exactly what to take from each candidate (specific files, functions, approaches).

        Be objective and evidence-based in your evaluation.
      response_tool_name: "submit_review"
      response_tool_description: "Submit your review decision - choose use_winner to apply the best implementation directly, or synthesize to combine the best parts from multiple implementations."
      response_schema:
        type: object
        required:
          - winner
          - strategy
          - confidence
          - rationale
        properties:
          winner:
            type: integer
            enum: [1, 2, 3]
            description: "The best implementation candidate (1, 2, or 3)"
          strategy:
            type: string
            enum:
              - use_winner
              - synthesize
            description: "use_winner to apply directly, synthesize to combine best parts"
          confidence:
            type: integer
            description: "Confidence in decision (1-10)"
          rationale:
            type: string
            description: "Explanation of why this decision was made"
          synthesis_instructions:
            type: string
            description: "If strategy=synthesize, detailed instructions on what to take from each implementation"

  # Mutually exclusive paths via edge cases from review
  #
  # apply_winner applies the winning candidate's CHANGES to the chat's checkout
  # with `git apply`. It used to `rsync --delete` the candidate over the
  # checkout, which (a) deleted every file the candidate lacked, including the
  # user's uncommitted work, and (b) on 2026-10-06 ran as
  # `rsync --delete <winner>/ /` because workflow.path rendered empty. git apply
  # cannot do either: it refuses any path outside the repository it runs in,
  # touches only the files the candidate changed, and checks every patch before
  # applying any. The runtime fails this step before it starts if src or dest
  # renders empty; the script re-checks both and refuses anything that is not
  # this run's checkout and one of its candidates.
  - id: apply_winner
    type: run
    command: |
      set -euo pipefail
      src='{{nodes.implementations._results[string(nodes.review.response.winner)].worktree_path}}'
      dest='{{workflow.path}}'
      winner='{{nodes.review.response.winner}}'

      refuse() { printf 'apply_winner: refusing: %s\n' "$*" >&2; exit 1; }

      case "$dest" in /*) ;; *) refuse "project path '$dest' is not an absolute path" ;; esac
      case "$src" in /*) ;; *) refuse "candidate path '$src' is not an absolute path" ;; esac
      [ -d "$dest" ] || refuse "project path $dest is not a directory"
      [ -d "$src" ] || refuse "candidate path $src is not a directory"
      dest=$(cd "$dest" && pwd -P)
      src=$(cd "$src" && pwd -P)
      home=$(cd "$HOME" && pwd -P)

      # The destination is this run's own checkout — the directory the daemon
      # started this step in — and never / or $HOME.
      [ "$dest" != / ] || refuse "project path is /"
      [ "$dest" != "$home" ] || refuse "project path is the home directory $home"
      [ "$dest" = "$(pwd -P)" ] || refuse "project path $dest is not this run's checkout $(pwd -P)"

      # The source is one of this run's candidate worktrees, not the project.
      case "$src/" in "$home/.reliant/worktrees/"?*) ;; *) refuse "candidate $src is not under $home/.reliant/worktrees" ;; esac
      case "$src" in */compete-impl-*) ;; *) refuse "$src is not a parallel-compete candidate worktree" ;; esac
      [ "$src" != "$dest" ] || refuse "candidate and project are the same directory"

      # One patch per git checkout in the candidate: the workspace root for a
      # single-repo project, each nested repo otherwise.
      repos=()
      while IFS= read -r rel; do repos+=("$rel"); done < <(cd "$src" && find . -name node_modules -prune -o -name .git -print -prune | sed 's|/\.git$||' | LC_ALL=C sort)
      [ "${#repos[@]}" -gt 0 ] || refuse "candidate $src contains no git checkout"

      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      for i in "${!repos[@]}"; do
        rel=${repos[$i]}
        s="$src/$rel"
        d="$dest/$rel"
        [ -d "$d" ] || refuse "$rel is a checkout in the candidate but not in the project"
        [ "$(git -C "$d" rev-parse --show-toplevel)" = "$(cd "$d" && pwd -P)" ] || refuse "$d is not the root of a git checkout"
        [ "$(cd "$s" && cd "$(git rev-parse --git-common-dir)" && pwd -P)" = "$(cd "$d" && cd "$(git rev-parse --git-common-dir)" && pwd -P)" ] \
          || refuse "$s is not a worktree of the project's repository at $d"
        base=$(git -C "$s" merge-base HEAD "$(git -C "$d" rev-parse HEAD)") || refuse "$s shares no history with $d"

        # Everything the candidate changed since it started, committed or not.
        # Staged in the candidate's own throwaway worktree; gitignored files,
        # the files create_worktree copied in, and nested checkouts (which get
        # their own patch) stay out.
        pathspec=(. ':(exclude).env' ':(exclude).env.local' ':(exclude).dev-ports.sh')
        for other in "${repos[@]}"; do
          case "$other" in "$rel"/*) pathspec+=(":(exclude)${other#"$rel"/}") ;; esac
        done
        git -C "$s" add -A -- "${pathspec[@]}"
        git -C "$s" diff --cached --binary --no-ext-diff --no-textconv --ignore-submodules=all "$base" > "$work/$i.patch"
        if [ -s "$work/$i.patch" ]; then
          git -C "$d" apply --check "$work/$i.patch" \
            || refuse "candidate #$winner's changes do not apply cleanly to $d (uncommitted edits there?); nothing was changed"
        fi
      done

      # Every patch checked; now apply them.
      for i in "${!repos[@]}"; do
        [ -s "$work/$i.patch" ] || continue
        d="$dest/${repos[$i]}"
        git -C "$d" apply --stat "$work/$i.patch"
        git -C "$d" apply "$work/$i.patch"
      done
      echo "Applied candidate #$winner ($src) to $dest. Review with: git status && git diff"

  # The synthesizer works directly in the chat's checkout. workflow.path is that
  # checkout; a run without one fails here rather than starting an agent that
  # copies files into an unknown directory.
  - id: synthesizer
    type: workflow
    ref: builtin://agent
    project:
      path: "{{workflow.path}}"
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Synthesis Task

          The code reviewer has analyzed three competing implementations and determined
          the best solution combines elements from multiple candidates.

          **Original Task:**
          {{nodes.improve_prompt.message.text}}

          **Implementation Locations:**
          - Candidate 1: {{nodes.implementations._results["1"].worktree_path}}
          - Candidate 2: {{nodes.implementations._results["2"].worktree_path}}
          - Candidate 3: {{nodes.implementations._results["3"].worktree_path}}

          **Base Implementation:** Candidate {{nodes.review.response.winner}}

          **Synthesis Instructions from Reviewer:**
          {{nodes.review.response.synthesis_instructions}}

          **Project directory (your working directory — the result goes here):**
          {{workflow.path}}

          **Your Task:**
          1. Start with the base implementation (Candidate {{nodes.review.response.winner}})
          2. Follow the synthesis instructions to incorporate the best parts from other candidates
          3. Copy whole files with `cp <candidate>/<file> <file>`, or edit to merge specific code sections
          4. Ensure the final result is coherent and working
          5. The result should be in your current working directory (the project directory above)

          Never run `rsync --delete`, `rm -r`, or any command that removes files outside the
          specific files you are replacing: the project directory holds the user's own work.
    save_message:
      role: assistant
      content: |
        ## Synthesis Complete

        {{output.response_text}}
    presets:
      default: general
    args:
      mode: "{{inputs.mode}}"
      model: "{{inputs.model}}"
      system_prompt: |
        You are an implementation specialist combining the best parts from multiple code implementations.

        You have access to three worktrees containing different implementations of the same feature.
        Your job is to follow the synthesis instructions to create the optimal combined solution.

        ## Guidelines
        - Use glob/view to examine each worktree
        - Use cp to copy entire files when appropriate — one file at a time, never `rsync --delete` or `rm -r`
        - Use edit to merge specific code sections
        - Ensure imports, dependencies, and references are consistent
        - Test that the combined code is coherent
        - Work in your current directory (the main worktree)

  # Verify the applied result actually builds and passes tests. An empty
  # command skips its check (a run command that renders empty fails instead).
  - id: verify
    type: parallel
    branches:
      - id: verify_test
        type: run
        condition: "inputs.test_command != ''"
        command: "{{inputs.test_command}}"
      - id: verify_build
        type: run
        condition: "inputs.build_command != ''"
        command: "{{inputs.build_command}}"

  - id: complete
    type: save_message
    args:
      role: assistant
      content: |
        ## Parallel Competition Complete

        **Strategy Used:** {{nodes.review.response.strategy == 'use_winner' ? 'Applied Winner (Candidate ' + string(nodes.review.response.winner) + ')' : 'Synthesized from multiple candidates (base: Candidate ' + string(nodes.review.response.winner) + ')'}}
        **Confidence:** {{nodes.review.response.confidence}}/10

        **Verification:**
        - Test: {{has(nodes.verify_test) && has(nodes.verify_test.exit_code) ? (nodes.verify_test.exit_code == 0 ? 'passed' : 'FAILED (exit ' + string(nodes.verify_test.exit_code) + ')') : 'unknown'}}
        - Build: {{has(nodes.verify_build) && has(nodes.verify_build.exit_code) ? (nodes.verify_build.exit_code == 0 ? 'passed' : 'FAILED (exit ' + string(nodes.verify_build.exit_code) + ')') : 'unknown'}}

        **Result Directory:**
        ```
        {{workflow.path}}
        ```

        **Candidate Worktrees (for reference):**
        - Candidate 1: {{nodes.implementations._results["1"].worktree_path}}
        - Candidate 2: {{nodes.implementations._results["2"].worktree_path}}
        - Candidate 3: {{nodes.implementations._results["3"].worktree_path}}

        **Next Steps:**
        ```bash
        cd {{workflow.path}}
        git status
        git diff
        git add -A && git commit -m "Apply parallel-compete result"
        ```

        **Rationale:**
        {{nodes.review.response.rationale}}

edges:
  - from: improve_prompt
    default: save_improved_prompt

  - from: save_improved_prompt
    default: implementations

  - from: implementations
    default: review

  - from: review
    cases:
      - to: apply_winner
        condition: "has(nodes.review.response) && nodes.review.response != null && nodes.review.response.strategy == 'use_winner'"
      - to: synthesizer
        condition: "has(nodes.review.response) && nodes.review.response != null && nodes.review.response.strategy == 'synthesize'"

  - from: apply_winner
    default: verify
  - from: synthesizer
    default: verify
  - from: verify
    default: complete

ui:
  positions:
    implementations:
      x: 1506
      y: 270
    improve_prompt:
      x: 476
      y: 273
    review:
      x: 2571
      y: 254
    apply_winner:
      x: 3000
      y: 150
    synthesizer:
      x: 3000
      y: 358
    verify:
      x: 3400
      y: 254
    complete:
      x: 3800
      y: 254
    save_improved_prompt:
      x: 797
      y: 273
    workflow:
      x: 150
      y: 270