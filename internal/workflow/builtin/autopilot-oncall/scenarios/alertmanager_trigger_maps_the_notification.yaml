name: alertmanager_trigger_maps_the_notification
description: >-
  An Alertmanager notification fires the alertmanager trigger: its filter checks the body carries alerts, and its
  mapping supplies the group key and the alerts. A resolved alert no open issue carries files nothing.
trigger:
  name: alertmanager
  payload:
    body:
      groupKey: g
      status: resolved
      alerts:
        - status: resolved
          fingerprint: 469e6b810b31bcc6
          labels: {alertname: WorkerDown}
          annotations: {summary: WorkerDown is firing}
          startsAt: "2026-10-14T20:00:00Z"
          endsAt: "0001-01-01T00:00:00Z"
inputs: {"service_repos": {"reliant-api-server": "reliant-labs/reliant", "temporal-worker": "reliant-labs/reliant", "forge": "reliant-labs/forge"}, "default_repo": "reliant-labs/control-plane"}
events:
  - node: classify.search
    output: {"is_error": false, "data": {"total_count": 0, "items": []}}
expect:
  outcome: completed
  completed: [classify, fresh]
  not_reached: [classify.comment, file.created]
  node_outputs:
    verdicts: {summary: "469e6b810b31bcc6=resolved_no_issue"}
    fresh: {new: []}
