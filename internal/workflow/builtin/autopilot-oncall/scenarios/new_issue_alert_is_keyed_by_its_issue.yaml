name: new_issue_alert_is_keyed_by_its_issue
description: >-
  A NewIssue alert (an error from the platform's issue registry) is keyed by its issue id, not its Alertmanager
  fingerprint, so the error's later regression or spike finds the same GitHub issue. It is filed with the
  error as its title and investigated with the issue's detail.
inputs: {"service_repos": {"web": "reliant-labs/reliant"}, "default_repo": "", "group_key": "g", "alerts": [{"status": "firing", "fingerprint": "aaaaaaaaaaaaaaaa", "labels": {"alertname": "NewIssue", "severity": "warning", "issue_id": "0B0C6D7E-1F2A-4B3C-8D9E-0F1A2B3C4D5E", "service": "web", "env": "prod", "reliant_env_id": "env-1", "platform": "browser", "fingerprint": "fp1", "title": "TypeError: x is undefined", "culprit": "src/cart.tsx in addItem", "first_build": "b1", "console_url": "https://app.example.test/forge/p/shop/observability/errors?env=prod&issue=0B0C6D7E-1F2A-4B3C-8D9E-0F1A2B3C4D5E"}, "annotations": {"summary": "New issue in web (prod): TypeError: x is undefined. Details: https://app.example.test/x"}, "startsAt": "2026-10-14T20:00:00Z", "endsAt": "0001-01-01T00:00:00Z"}]}
events:
  - node: classify.search
    output: {"is_error": false, "data": {"total_count": 0, "items": []}}
  - node: file.labels
    black_box: true
    output: {}
  - node: file.created
    output: {"is_error": false, "data": {"number": 914}}
  - node: file.lease
    black_box: true
    output: {"status": "acquired", "lease_id": 78, "started_at": "2026-10-14T20:01:00Z", "expires": "x", "takeover_from": "", "holder": "", "detail": "ACQUIRE"}
  - node: file.dir
    output: {"exit_code": 0, "stdout": "/r/x"}
  - node: file.agent
    black_box: true
    output: {"completed": true, "response": {"severity": "medium", "summary": "addItem reads a cart before it loads", "evidence": "e", "suspected_cause": "c", "proposed_fix": "f", "confidence": "medium"}, "model": "m"}
  - node: file.publish
    output: {"is_error": false, "data": {"number": 914}}
  - node: file.release
    black_box: true
    output: {"recheck_found": 0, "other_live_lease": false}
expect:
  outcome: completed
  completed: [plan, classify, fresh, file, file.issue_detail, file.agent, summary]
  not_reached: [nothing]
  node_outputs:
    routes: {repos: "reliant-labs/reliant"}
    verdicts: {summary: "0b0c6d7e1f2a4b3c8d9e0f1a2b3c4d5e=new"}
    capped: {to_investigate: ["0b0c6d7e1f2a4b3c8d9e0f1a2b3c4d5e"]}
