# Happy path: the full content → style → handoff chain.
#
# scope_conversation → content_pass (get-it-right, content lens) →
# style_pass (get-it-right, style lens) → handoff. Both review loops pass, so
# the workflow reaches the handoff and never routes to stuck/failed.

name: happy_path
description: scope → content-loop → style-loop → handoff, all reviews pass

inputs:
  mode: auto
  ask: false

events:
  # scope_conversation EXECUTES: it is a builtin://scope-conversation ref whose
  # own `conversation` node is a builtin://agent ref, so the qualified id below
  # makes BOTH transparent and compiles scope-conversation's prompt CEL
  # (question_areas, plan_filename, max_questions, max_turns).
  - node: scope_conversation.conversation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Scoped the landing page and wrote LANDING_PLAN.md."
      response_text: "Scoped the landing page and wrote LANDING_PLAN.md."
      tool_calls: []
  # Content lens (get-it-right sub-workflow) — EXECUTED, not black-boxed.
  # Mocking the innermost agent_loop nodes makes both nested refs transparent, so
  # get-it-right's own config is compiled: implementer_preset: ux, max_retries,
  # and the content-lens review_instructions this node passes down.
  # get-it-right declares response_tool_name: submit_evaluation.
  - node: content_pass.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Copy and structure in place."
      response_text: "Copy and structure in place."
      tool_calls: []
  - node: content_pass.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_content_review
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Message, sections and the single CTA all match LANDING_PLAN.md."
  - node: content_pass.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Message, sections and the single CTA all match LANDING_PLAN.md."
      tool_results: []
      thread_token_count: 100

  # Style lens (get-it-right sub-workflow) — EXECUTED. This one additionally
  # carries start_app_command, whose CEL branch builds the reviewer's
  # "bring the app up yourself" prompt; black-boxing never compiled it.
  - node: style_pass.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Visual design polished."
      response_text: "Visual design polished."
      tool_calls: []
  - node: style_pass.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_style_review
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Hierarchy, responsiveness and brand consistency all hold up on every route."
  - node: style_pass.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Hierarchy, responsiveness and brand consistency all hold up on every route."
      tool_results: []
      thread_token_count: 100

  # Handoff agent: serves the page and posts the preview URL
  - node: handoff.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Your landing page is live at the preview URL."
      response_text: "Your landing page is live at the preview URL."
      tool_calls: []
expect:
  outcome: completed
  reached:
    - scope_conversation
    - content_pass
    - style_pass
    - handoff
  not_reached:
    - stuck
    - failed
