name: vuln-patch-agent
title: Patch vulnerabilities · agent takeover
hidden: true
apiVersion: "0.0.5"
description: |
  The agent half of vuln-patch: a building block, not something to start. A restricted agent (the
  autopilot-agent loop: a shell with no credentials, nothing loadable) finishes a vulnerability patch that
  `reliant forge vuln patch` could not: it fixes the build or tests the bump broke, or applies a bump the
  patcher had no deterministic route for. After every attempt the workflow itself, not the agent, checks
  the result with no credentials: no test file changed and no skip or exemption added, the verify command
  passes, and `reliant forge vuln scan . --json` no longer reports any targeted finding. It stops when that
  check passes, when the agent reports blocked, or after max_iterations attempts. It never commits, pushes
  or opens anything: vuln-patch does that, and only when `passed` is true.

inputs:
  dir:
    type: string
    description: Absolute path of the forge project to patch, inside the run's worktree.
  env:
    type: string
    default: prod
    description: >-
      The env whose findings are being patched (named in the agent's brief), or the directory vuln-patch
      scanned for them (`.` or a relative path holding a `/`).
  targets:
    type: array
    default: []
    description: >-
      The findings that must be gone, each {id, names, package, installed, fixed_in, status, reason}. names
      holds the id and its aliases; a scan finding named by any of them is still present.
  brief:
    type: string
    default: ""
    description: What the deterministic patcher already did, for the agent. Empty when it did not run.
  verify_command:
    type: string
    description: The project's gate, run in dir with no credentials after every attempt. It must exit 0.
  model:
    type: model
    description: The agent's model.
    default:
      tags: [flagship]
  max_turns:
    type: integer
    default: 80
    min: 10
    max: 200
    description: The most agent turns in one attempt.
  max_iterations:
    type: integer
    default: 3
    min: 1
    max: 10
    description: The most attempts. Each one is an agent pass followed by the verify and rescan check.

outputs:
  passed: "{{ nodes.attempts.passed }}"
  blocked: "{{ nodes.attempts.blocked }}"
  summary: "{{ nodes.attempts.summary }}"
  reasons: "{{ nodes.attempts.reasons }}"
  pr_title: "{{ nodes.attempts.pr_title }}"
  commit_message: "{{ nodes.attempts.commit_message }}"
  code_files: "{{ nodes.attempts.code_files }}"
  still_present: "{{ nodes.attempts.still_present }}"
  verify_tail: "{{ nodes.attempts.verify_tail }}"
  iterations: "{{ nodes.attempts._iterations }}"

entry: [attempts]

nodes:
  - id: attempts
    type: loop
    while: "outputs.passed != true && outputs.blocked != true && iter.iteration < inputs.max_iterations"
    inline:
      entry: [fix]
      outputs:
        passed: "{{ nodes.judge.passed }}"
        blocked: "{{ nodes.judge.blocked }}"
        summary: "{{ nodes.judge.summary }}"
        reasons: "{{ nodes.judge.reasons }}"
        pr_title: "{{ nodes.judge.pr_title }}"
        commit_message: "{{ nodes.judge.commit_message }}"
        code_files: "{{ nodes.facts.code_files }}"
        still_present: "{{ nodes.facts.still_present }}"
        verify_tail: "{{ nodes.facts.verify_tail }}"
      nodes:
        # One thread across attempts (memo), so a later attempt remembers what the earlier ones tried.
        - id: fix
          type: workflow
          ref: builtin://autopilot-agent
          project:
            path: "{{ inputs.dir }}"
          thread:
            mode: new
            memo: true
            inject:
              role: user
              content: |
                {{ iter.iteration == 0 ? '' : '## Attempt ' + string(iter.iteration + 1) + ' of ' + string(inputs.max_iterations) + '\n\nYour previous attempt did not pass the check the workflow ran after it:\n' + (has(outputs.reasons) ? outputs.reasons.map(r, '- ' + r).join('\n') : '- (no result was recorded)') + (has(outputs.verify_tail) && outputs.verify_tail != '' ? '\n\nVerify output (tail):\n```\n' + outputs.verify_tail + '\n```' : '') + '\n\nFix what it reports, then call submit_result again. The worktree still holds your earlier changes.\n\n' }}Patch the vulnerabilities below in the forge project at `{{ inputs.dir }}` ({{ inputs.env == '.' || inputs.env.contains('/') ? 'found by scanning its directory `' + inputs.env + '`' : 'env `' + inputs.env + '`' }}). It is a fresh git worktree; leave every change uncommitted.

                {{ inputs.brief != '' ? inputs.brief + '\n\n' : '' }}Targeted findings. Every one must be gone from `reliant forge vuln scan . --json` when you finish:
                {{ inputs.targets.map(t, '- ' + string(t.id) + (has(t.names) && size(t.names) > 1 ? ' (' + t.names.filter(n, n != t.id).join(', ') + ')' : '') + ': ' + (has(t.package) ? string(t.package) : '?') + ' ' + (has(t.installed) ? string(t.installed) : '') + (has(t.fixed_in) && string(t.fixed_in) != '' ? ', fixed in ' + string(t.fixed_in) : '') + (has(t.status) && string(t.status) != '' ? '; patcher: ' + string(t.status) : '') + (has(t.reason) && string(t.reason) != '' ? ' (' + untrustedText(string(t.reason), 300) + ')' : '')).join('\n') }}

                When you submit `done`, the workflow checks your work itself, with no credentials, in `{{ inputs.dir }}`:
                1. No test file changed (including assertions), no test skipped, no vulnerability exemption added.
                2. Verify: this must exit 0.
                   ```
                   {{ inputs.verify_command.trim() }}
                   ```
                3. Rescan: `reliant forge vuln scan . --json` must report none of the targeted findings.
                Run the same commands yourself before you submit.
          args:
            model: "{{ inputs.model }}"
            max_turns: "{{ inputs.max_turns }}"
            tools: [view, edit, write, find_replace, shell, shell_output, shell_wait, shell_list, shell_kill, code_context, skill]
            tool_params:
              shell:
                credentials: none
            response_tool_name: submit_result
            response_tool_description: Report the outcome. Call it once per attempt, when the worktree holds your final changes.
            response_schema:
              type: object
              required: [outcome, summary]
              properties:
                outcome:
                  type: string
                  enum: [done, blocked]
                  description: >-
                    done = every targeted finding is fixed and the verify command passes; blocked = it cannot be done
                    without something you must not do (say what in summary).
                summary:
                  type: string
                  description: 2-5 sentences for the pull request, or for the person reading why it failed. Name each package you bumped and anything you changed beyond the manifests.
                pr_title:
                  type: string
                  description: 'Conventional-commit style, under 72 characters, e.g. "fix(deps): bump golang.org/x/net to v0.33.0 (CVE-2024-45338)". Required when done.'
                commit_message:
                  type: string
                  description: Conventional-commit subject, blank line, short body. Required when done.
            system_prompt: |
              You finish a vulnerability patch in ONE forge project, inside an isolated git worktree, and report with `submit_result`. Nobody is watching this run: never ask a question; decide and finish.

              The deterministic patcher (`reliant forge vuln patch`) bumps a vulnerable dependency to the lowest fixed version with the ecosystem's own tool. You take over where it stopped: a bump that broke the build or the tests, a finding it skipped (an ambiguous manifest, a fix only in a new major, an ecosystem it has no patcher for), or, when it did not run, the whole patch.

              1. Read the targeted findings and the patcher's notes. Load the `vuln/patch` skill (`reliant forge skill load vuln/patch`) and the repo's agent guidance (reliant.md, AGENTS.md, CLAUDE.md) if present.
              2. Bump with the ecosystem's own tool so lockfiles stay consistent: `go get mod@vX && go mod tidy`, `npm install pkg@X` (an `overrides` entry for a transitive one), `pnpm update`, `yarn up`, `pip-compile`, `poetry update`, `uv lock --upgrade-package`. Prefer the lowest fixed version, in the installed major when one exists.
              3. When a bump breaks the build or the tests, fix the CODE to work with the new version: an API that moved, a changed default, a type that changed. A major bump may need real migration work; do it in the style of the surrounding code.
              4. Run the verify command and `reliant forge vuln scan . --json` yourself before you submit.

              Hard rules. The workflow checks the first three after you and refuses the patch when one is broken:
              - NEVER change a test file: the guard rejects all test-file edits, additions, deletions and renames, including assertion changes. Do not skip (t.Skip, it.skip, xit, pytest.mark.skip), loosen an assertion in, or exclude a test to make it pass. A test that fails because behaviour changed is a real failure: fix the code, or report blocked.
              - NEVER add a vulnerability exemption (`reliant forge vuln exempt`, forge.VulnExemption, ci.vuln_scan.exemptions) or pin a package below its fix.
              - NEVER touch CI (.github/), deploy configuration (deploy/, KCL, Helm), releases, or another repository.
              - Do not commit, push, create branches or open PRs. vuln-patch publishes the branch and opens the PR only when its own check passes.
              - Your shell has no credentials, on purpose. Do not look for tokens or credential files, and do not use gh, the GitHub API or git remotes.
              - Work only inside this worktree. Never run the repo's full lanes (`task ci`, `task test`): run the verify command named in the brief.

        # Reject all test-file changes, not just recognizable assertion/skip edits: integrity is
        # checked independently of the agent. Disable rename detection so moving a test cannot hide it.
        # Also check added lines that skip a test or exempt a finding.
        - id: guard
          type: run
          condition: "nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'done'"
          timeout: 2m
          args:
            command: |
              cd '{{ inputs.dir }}' || exit 2
              root=$(git rev-parse --show-toplevel) || exit 2
              cd "$root" || exit 2
              { git -c core.quotePath=false diff --no-renames --name-only HEAD; git -c core.quotePath=false ls-files --others --exclude-standard; } | sort -u | sed 's/^/file:/'
              git diff -U0 HEAD | grep -E '^\+[^+]' \
                | grep -E 't\.Skip|\.skip\(|\bxit\(|\bxdescribe\(|\bxtest\(|pytest\.mark\.(skip|xfail)|unittest\.skip|\.only\(|VulnExemption|vuln_scan|exemptions' \
                | cut -c1-200 | sed 's/^/added:/'
              exit 0
            credentials: none

        - id: verify
          type: run
          condition: "nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'done'"
          timeout: 30m
          args:
            command: |
              {
              cd '{{ inputs.dir }}' || exit 2
              {{ inputs.verify_command }}
              } 2>&1
            credentials: none

        - id: scan
          type: run
          condition: "nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'done'"
          timeout: 15m
          args:
            command: "cd '{{ inputs.dir }}' && reliant forge vuln scan . --json"
            credentials: none

        - id: facts
          type: compute
          outputs:
            done: "{{ nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'done' }}"
            code_files: >-
              {{ nodes.?guard.stdout.orValue('').split('\n').filter(l, l.startsWith('file:')).map(l, l.substring(5))
                   .filter(f, !f.matches('(^|/)(go\\.mod|go\\.sum|go\\.work|go\\.work\\.sum|package\\.json|package-lock\\.json|npm-shrinkwrap\\.json|pnpm-lock\\.yaml|yarn\\.lock|requirements[^/]*\\.(txt|in)|pyproject\\.toml|poetry\\.lock|uv\\.lock|[^/]*Dockerfile[^/]*)$')) }}
            weakened: >-
              {{ nodes.?guard.stdout.orValue('').split('\n')
                   .filter(l, l.startsWith('added:') || (l.startsWith('file:') && l.substring(5).matches('(_test\\.go|\\.(test|spec)\\.[cm]?[jt]sx?|(^|/)test_[^/]*\\.py|_test\\.py)$|(^|/)(__tests__|tests?|specs?)/'))) }}
            guard_ok: "{{ nodes.?guard.exit_code.orValue(-1) == 0 }}"
            verify_ok: "{{ nodes.?verify.exit_code.orValue(-1) == 0 }}"
            verify_tail: >-
              {{ nodes.?verify.exit_code.orValue(0) != 0
                 ? cel.bind(out, nodes.?verify.stdout.orValue(''), out.substring(math.greatest(0, size(out) - 3000))) : '' }}
            scan_ok: >-
              {{ nodes.?scan.exit_code.orValue(-1) in [0, 1]
                 && json.decode(nodes.?scan.stdout.orValue('')).?schema.orValue('') != '' }}
            still_present: >-
              {{ cel.bind(found, json.decode(nodes.?scan.stdout.orValue('')).?findings.orValue([]),
                   inputs.targets.filter(t, found.exists(f,
                     ([string(f.id)] + (has(f.aliases) && f.aliases != null ? f.aliases : [])).exists(n, n in t.names)))
                     .map(t, string(t.id))) }}
            scan_error: >-
              {{ !(nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'done') ? ''
                 : (nodes.?scan.exit_code.orValue(-1) in [0, 1] && json.decode(nodes.?scan.stdout.orValue('')).?schema.orValue('') != '' ? ''
                 : 'the rescan could not run (exit ' + string(nodes.?scan.exit_code.orValue(-1)) + '): ' + untrustedText(nodes.?scan.stderr.orValue(''), 400)) }}

        - id: judge
          type: compute
          outputs:
            passed: >-
              {{ nodes.facts.done == true && nodes.facts.guard_ok == true && size(nodes.facts.weakened) == 0
                 && nodes.facts.verify_ok == true && nodes.facts.scan_ok == true && size(nodes.facts.still_present) == 0 }}
            blocked: "{{ nodes.?fix.completed.orValue(false) == true && nodes.?fix.response.outcome.orValue('') == 'blocked' }}"
            summary: >-
              {{ nodes.?fix.completed.orValue(false) == true ? string(nodes.fix.response.summary)
                 : 'The agent ended without submitting a result (stopped: ' + string(nodes.?fix.stop_reason.orValue('unknown')) + ').' }}
            reasons: >-
              {{ nodes.facts.done != true
                 ? [nodes.?fix.completed.orValue(false) == true ? 'the agent reported blocked' : 'the agent ended without a result']
                 : (nodes.facts.guard_ok != true ? ['the workflow could not read the changes in the worktree'] : [])
                   + (size(nodes.facts.weakened) > 0 ? ['a test file was changed or a skip/exemption added, which is not allowed; revert it: ' + nodes.facts.weakened.join('; ')] : [])
                   + (nodes.facts.verify_ok != true ? ['the verify command failed' + (inputs.verify_command.contains('\n') ? '' : ' (`' + inputs.verify_command.trim() + '`)')] : [])
                   + (nodes.facts.scan_error != '' ? [nodes.facts.scan_error] : [])
                   + (nodes.facts.scan_ok == true && size(nodes.facts.still_present) > 0 ? ['the rescan still reports ' + nodes.facts.still_present.join(', ')] : []) }}
            pr_title: "{{ nodes.facts.done == true ? string(nodes.?fix.response.pr_title.orValue('')) : '' }}"
            commit_message: "{{ nodes.facts.done == true ? string(nodes.?fix.response.commit_message.orValue('')) : '' }}"

      edges:
        - from: fix
          default: guard
        - from: guard
          default: verify
        - from: verify
          default: scan
        - from: scan
          default: facts
        - from: facts
          default: judge
