name: migrate
apiVersion: "0.0.5"
description: |
  Guided migration workflow for importing useful configuration from Claude Code, Cursor,
  Codex, or Windsurf into Reliant.
presets:
  tag: agent
  default: migrate
entry: [announce]

inputs:
  mode:
    type: enum
    ui: toolbar
    enum: ["manual", "auto"]
    default: "auto"
    description: "Execution mode for migration agents"

  model:
    type: model
    description: LLM model to use
    default:
      tags: [flagship]

  temperature:
    type: number
    default: 0.4
    min: 0
    max: 1
    description: Response randomness

  thinking_level:
    type: enum
    enum: [low, medium, high, xhigh]
    default: medium
    description: Extended thinking level

  system_prompt:
    type: string
    default: ""
    ui: hidden
    description: Hidden compatibility input for agent-style presets

  tools:
    type: tools
    default: ["tag:default"]
    ui: hidden
    description: Hidden compatibility input for agent-style presets

  spawn_presets:
    type: preset
    tags: [agent]
    multi: true
    default:
      - general
      - researcher
      - planner
      - documentation
      - refactor
      - tester
      - debug
    ui: hidden
    description: Hidden compatibility input for agent-style presets

  import_memory:
    type: boolean
    default: true
    description: Import instructions and persistent memory into Reliant memory/skills

  import_mcp:
    type: boolean
    default: true
    description: Import MCP server configuration into .reliant/mcp.json

  import_skills:
    type: boolean
    default: true
    description: Convert reusable rules into Reliant skills

  generate_workflows:
    type: boolean
    default: true
    description: Build Reliant workflows for reusable commands worth preserving

outputs:
  message: "{{has(nodes.final_summary) ? nodes.final_summary.message : (has(nodes.denied_summary) ? nodes.denied_summary.message : null)}}"
  response_text: "{{has(nodes.final_summary) ? nodes.final_summary.response_text : ''}}"

nodes:
  - id: announce
    type: save_message
    args:
      role: assistant
      content: |
        ## Migration kickoff

        I’ll inspect common Claude Code, Cursor, Codex, and Windsurf config locations, summarize what looks worth carrying forward, and wait for approval before writing any Reliant files.

        Planned migration targets:
        - `reliant.md`
        - `.reliant/mcp.json`
        - `.reliant/skills/...`
        - reusable workflows derived from source-tool commands

  - id: discover
    type: workflow
    ref: builtin://agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Discovery phase

          Inspect the user's project and home-directory locations for configuration from Claude Code, Cursor, Codex, and Windsurf.

          Focus on these source types:
          - instruction/memory files
          - MCP config files
          - rule/skills directories
          - custom command directories that may deserve workflow conversion

          Use normal tools only. Prefer `glob`, `grep`, `view`, and targeted `bash` when checking home-directory paths.

          Deliver a conversational summary that covers:
          1. what you found
          2. what should be migrated
          3. what should be skipped
          4. any risks, ambiguity, or conflicts

          Do not write files in this phase.
    save_message:
      role: assistant
      content: |
        ## Discovery summary
        {{output.response_text}}

  - id: confirm_intent
    type: save_message
    args:
      role: assistant
      content: |
        ## Approval required

        Review the discovery summary above, then approve to continue. This workflow will only write the migration categories enabled in the workflow inputs:
        - Memory/instructions: {{inputs.import_memory ? 'enabled' : 'disabled'}}
        - MCP config: {{inputs.import_mcp ? 'enabled' : 'disabled'}}
        - Skills: {{inputs.import_skills ? 'enabled' : 'disabled'}}
        - Workflow generation: {{inputs.generate_workflows ? 'enabled' : 'disabled'}}

  - id: confirm
    type: approval
    args:
      title: Approve migration changes?
      timeout: 24h

  - id: denied_summary
    type: save_message
    args:
      role: assistant
      content: |
        Migration stopped before any files were written.

        If you want to continue later, rerun the migration workflow and approve the write phase.

  - id: migration_started
    type: save_message
    args:
      role: assistant
      content: |
        ## Migration in progress

        Approval received. Running the selected migration branches now.

  - id: migrate_memory
    type: workflow
    condition: "inputs.import_memory && nodes.confirm.status == 'approved'"
    ref: builtin://agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Memory and instruction migration

          Migrate the user's persistent instructions into Reliant memory.

          Your goals:
          1. inspect relevant source files such as `CLAUDE.md`, `.claude/CLAUDE.md`, `.cursorrules`, `AGENTS.md`, `AGENTS.override.md`, `.windsurfrules`, and any always-on rules
          2. merge the useful guidance into a coherent `reliant.md`
          3. avoid duplicating or preserving tool-specific cruft
          4. keep source intent, but rewrite where needed so it feels native to Reliant

          Important:
          - create or update project `reliant.md`
          - if the repo already has `reliant.md`, merge instead of clobbering blindly
          - mention exact files read and written
          - use spawn if you want separate readers for different source tools
    save_message:
      role: assistant
      content: |
        ## Memory migration
        {{output.response_text}}

  - id: migrate_mcp
    type: workflow
    condition: "inputs.import_mcp && nodes.confirm.status == 'approved'"
    ref: builtin://agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## MCP migration

          Migrate MCP server configuration into `.reliant/mcp.json`.

          Your goals:
          1. inspect source MCP files such as `~/.claude.json`, `.mcp.json`, `.cursor/mcp.json`, and `.windsurf/mcp.json`
          2. preserve useful server definitions
          3. merge with any existing `.reliant/mcp.json` instead of destroying it
          4. deduplicate obvious overlaps and prefer the clearest surviving config

          Important:
          - write valid JSON
          - skip empty or broken source configs rather than forcing them through
          - mention exact files read and written
          - use spawn if you want parallel readers for multiple source files
    save_message:
      role: assistant
      content: |
        ## MCP migration
        {{output.response_text}}

  - id: migrate_skills
    type: workflow
    condition: "inputs.import_skills && nodes.confirm.status == 'approved'"
    ref: builtin://agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Skills migration

          Convert reusable source-tool rules into Reliant skills where that is a better fit than global memory.

          Focus on rules that are:
          - scoped to certain file patterns
          - reusable across many requests
          - better as opt-in or context-sensitive behavior

          Your goals:
          1. inspect `.cursor/rules/`, `.windsurf/rules/`, `.codex/skills/`, and similar sources
          2. decide which items deserve `.reliant/skills/<name>/SKILL.md`
          3. avoid duplicating content already merged into `reliant.md`
          4. write clear, native Reliant skills with sensible names

          Mention exact files read and written. Use spawn if multiple source ecosystems can be evaluated independently.
    save_message:
      role: assistant
      content: |
        ## Skills migration
        {{output.response_text}}

  - id: analyze_workflows
    type: workflow
    condition: "inputs.generate_workflows && nodes.confirm.status == 'approved'"
    ref: builtin://structured-agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
      response_tool_name: submit_workflow_candidates
      response_tool_description: Submit the list of reusable workflow candidates worth building
      response_schema:
        type: object
        required:
          - workflow_candidates
          - summary
        properties:
          summary:
            type: string
            description: Short explanation of how many worthwhile workflow candidates were found and why
          workflow_candidates:
            type: array
            description: Reusable commands or automations worth converting into Reliant workflows
            items:
              type: object
              required:
                - name
                - source_path
                - source_tool
                - description
                - instructions
              properties:
                name:
                  type: string
                  description: Stable name for the workflow candidate
                source_path:
                  type: string
                  description: File path for the original command or definition
                source_tool:
                  type: string
                  description: Source ecosystem such as claude_code, cursor, codex, or windsurf
                description:
                  type: string
                  description: Brief description of what the workflow should do
                instructions:
                  type: string
                  description: Precise conversion guidance for the workflow builder
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Workflow candidate analysis

          Inspect source commands, automations, and reusable prompt files.

          Return only candidates that are genuinely worth preserving as first-class Reliant workflows.
          Filter aggressively:
          - include reusable automations or slash-command style helpers
          - exclude one-off prompts, trivial notes, and things better represented as memory or skills

          When in doubt, prefer fewer, higher-confidence workflow candidates.

          Use the response tool to submit:
          - a short summary
          - a `workflow_candidates` array for anything worth building
    save_message:
      role: assistant
      content: |
        ## Workflow candidate analysis
        {{has(output.response) && output.response != null ? output.response.summary : 'No workflow analysis summary available.'}}

  - id: workflow_candidates_context
    type: save_message
    condition: "inputs.generate_workflows && nodes.confirm.status == 'approved' && has(nodes.analyze_workflows.response) && nodes.analyze_workflows.response != null && has(nodes.analyze_workflows.response.workflow_candidates) && nodes.analyze_workflows.response.workflow_candidates != null && size(nodes.analyze_workflows.response.workflow_candidates) > 0"
    args:
      role: system
      content: |
        ## Workflow candidates for migration

        The structured workflow analysis found {{size(nodes.analyze_workflows.response.workflow_candidates)}} candidate(s).

        Summary:
        {{nodes.analyze_workflows.response.summary}}

        Candidate list:
        {{string(nodes.analyze_workflows.response.workflow_candidates)}}

        Subsequent workflow-builder steps should process candidates in order using 1-based indexing.

  - id: no_workflow_candidates
    type: save_message
    args:
      role: assistant
      content: |
        ## Workflow generation

        No reusable command or automation looked strong enough to justify generating a Reliant workflow.

  - id: workflow_builder_loop
    type: loop
    condition: "inputs.generate_workflows && nodes.confirm.status == 'approved' && has(nodes.analyze_workflows.response) && nodes.analyze_workflows.response != null && has(nodes.analyze_workflows.response.workflow_candidates) && nodes.analyze_workflows.response.workflow_candidates != null && size(nodes.analyze_workflows.response.workflow_candidates) > 0"
    while: "iter.iteration + 1 < size(nodes.analyze_workflows.response.workflow_candidates)"
    yield: "{{false}}"
    inline:
      entry: [create_workflow_draft]
      outputs:
        built_count: "{{iter.iteration + 1}}"
      nodes:
        - id: create_workflow_draft
          type: workflow
          ref: builtin://structured-agent
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
            tools:
              - create_workflow
            spawn_presets: []
            system_prompt: |
              Create one workflow draft for the provided migration candidate.

              You must:
              1. call `create_workflow` exactly once
              2. use the candidate's name as the workflow name unless a small normalization is obviously needed
              3. after creation, call the response tool with the returned draft id, name, and slug

              Do not attempt to fully build the workflow in this step. This step only creates the draft container.
            response_tool_name: submit_draft
            response_tool_description: Submit the workflow draft identifiers after creation
            response_schema:
              type: object
              required:
                - draft_id
                - name
                - slug
              properties:
                draft_id:
                  type: string
                  description: Draft UUID returned by create_workflow
                name:
                  type: string
                  description: Workflow draft name
                slug:
                  type: string
                  description: Workflow draft slug
          thread:
            mode: fork
            memo: false
            inject:
              role: user
              content: |
                ## Create workflow draft {{iter.iteration + 1}}

                Read the workflow candidate list in the conversation above.

                Create a workflow draft for candidate number {{iter.iteration + 1}} in that ordered list.

                Repeat the candidate details you selected before creating the draft so the thread clearly records which item is being processed.

        - id: build_workflow_candidate
          type: workflow
          ref: builtin://agent
          presets:
            default: general
          args:
            model: "{{inputs.model}}"
            mode: auto
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
          thread:
            mode: fork
            memo: false
            inject:
              role: system
              content: |
                Workflow draft ID: {{nodes.create_workflow_draft.response.draft_id}}

                Read the workflow candidate list in the conversation above and build a Reliant workflow for candidate number {{iter.iteration + 1}}.

                Use the provided draft id for all workflow operations.
                Preserve the candidate's intent, arguments, and success conditions.
                Finish with a concise summary of what you created.
          save_message:
            role: assistant
            content: |
              ## Generated workflow {{iter.iteration + 1}}

              {{output.response_text}}
      edges:
        - from: create_workflow_draft
          default: [build_workflow_candidate]

  - id: join_results
    type: join
    condition: all

  - id: final_summary
    type: workflow
    ref: builtin://agent
    presets:
      default: migrate
    args:
      model: "{{inputs.model}}"
      mode: auto
      temperature: "{{inputs.temperature}}"
      thinking_level: "{{inputs.thinking_level}}"
      tools: []
      spawn_presets: []
    thread:
      mode: fork
      memo: false
      inject:
        role: user
        content: |
          ## Final migration summary

          Summarize the completed migration for the user.

          Discovery summary:
          {{nodes.discover.response_text}}

          Memory migration:
          {{has(nodes.migrate_memory) ? nodes.migrate_memory.response_text : 'Skipped.'}}

          MCP migration:
          {{has(nodes.migrate_mcp) ? nodes.migrate_mcp.response_text : 'Skipped.'}}

          Skills migration:
          {{has(nodes.migrate_skills) ? nodes.migrate_skills.response_text : 'Skipped.'}}

          Workflow analysis:
          {{has(nodes.analyze_workflows.response) && nodes.analyze_workflows.response != null ? nodes.analyze_workflows.response.summary : 'Skipped.'}}

          Workflow candidates considered: {{has(nodes.analyze_workflows.response) && nodes.analyze_workflows.response != null && has(nodes.analyze_workflows.response.workflow_candidates) && nodes.analyze_workflows.response.workflow_candidates != null ? string(size(nodes.analyze_workflows.response.workflow_candidates)) : '0'}}

          Include:
          1. what changed
          2. what was skipped
          3. any follow-up suggestions
    save_message:
      role: assistant
      content: |
        ## Migration complete
        {{output.response_text}}

edges:
  - from: announce
    default: [discover]
  - from: discover
    default: [confirm_intent]
  - from: confirm_intent
    default: [confirm]
  - from: confirm
    cases:
      - to: denied_summary
        condition: nodes.confirm.status != 'approved'
    default: [migration_started]
  - from: migration_started
    default: [join_results]
  - from: migration_started
    default: [migrate_memory]
  - from: migration_started
    default: [migrate_mcp]
  - from: migration_started
    default: [migrate_skills]
  - from: migration_started
    default: [analyze_workflows]
  - from: migrate_memory
    default: [join_results]
  - from: migrate_mcp
    default: [join_results]
  - from: migrate_skills
    default: [join_results]
  - from: analyze_workflows
    cases:
      - to: workflow_candidates_context
        condition: has(nodes.analyze_workflows.response) && nodes.analyze_workflows.response != null && has(nodes.analyze_workflows.response.workflow_candidates) && nodes.analyze_workflows.response.workflow_candidates != null && size(nodes.analyze_workflows.response.workflow_candidates) > 0
    default: [no_workflow_candidates]
  - from: workflow_candidates_context
    default: [workflow_builder_loop]
  - from: no_workflow_candidates
    default: [join_results]
  - from: workflow_builder_loop
    default: [join_results]
  - from: join_results
    default: [final_summary]