name: raise-coverage
title: Raise test coverage
apiVersion: "0.0.5"
description: |
  Raises one Go package's test coverage to a target, with tests that assert behaviour. It makes a worktree
  from the default branch and measures the package first (its tests, recorded with `reliant forge test
  capture`, read back with `reliant forge test coverage <path> --json`). Then, each round, an agent with a
  credential-free shell writes tests; the package's tests must pass and reach the target; `reliant forge test
  flakes gate` runs every new or edited test three times; and a reviewer agent reads each new test and
  rejects any that only execute lines (no assertion, or nothing but an error check). A failure of any of
  those goes back to the author, for at most max_iterations rounds. Reaching the target opens a PR with the
  coverage before and after and what each test asserts. Missing the target with real gains still opens one,
  labelled `coverage:partial`. Started by you, never by itself. Needs a forge release with `forge test`.

inputs:
  package:
    type: string
    required: true
    description: >-
      The package's directory, relative to the forge project (for example internal/billing). Its
      subpackages are included.
  target:
    type: string
    required: true
    description: >-
      The coverage to reach: a percentage (80, or 72.5), or "+N" for N points above what the package has
      now (+10).
  repo:
    type: github.repository
    required: true
    description: The repository the package lives in. The PR is opened there.
  project_dir:
    type: string
    default: ""
    description: >-
      The forge project's directory inside the repository (where forge.yaml and go.mod are), relative to
      the repository root. Empty for the root.
  base_branch:
    type: string
    default: ""
    description: The branch to work from and open the PR against. Empty uses the repository's default branch.
  model:
    type: model
    description: The model the test-writing agent runs on
    default:
      tags: [flagship]
  review_model:
    type: model
    description: The model the assertion reviewer runs on. A different tag from the author's, so it can disagree.
    default:
      tags: [powerful]
  max_iterations:
    type: integer
    default: 3
    min: 1
    max: 6
    description: The most write-measure-gate-review rounds
  max_turns:
    type: integer
    default: 120
    min: 10
    max: 200
    description: The most agent turns in one round

outputs:
  outcome: "{{ string(nodes.?result.kind.orValue('invalid')) }}"
  pr_url: "{{ string(nodes.?pr.data.html_url.orValue('')) }}"
  baseline_pct: "{{ double(nodes.?baseline_facts.pct.orValue(0.0)) }}"
  final_pct: "{{ double(nodes.?result.pct.orValue(0.0)) }}"

entry: [check]

nodes:
  # Every input that reaches a shell is checked here first.
  - id: check
    type: compute
    outputs:
      valid: >-
        {{ inputs.package.trimPrefix('./').matches('^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$')
           && inputs.target.matches('^\\+?[0-9]{1,3}(\\.[0-9]+)?$')
           && double(inputs.target.trimPrefix('+')) > 0.0 && double(inputs.target.trimPrefix('+')) <= 100.0
           && inputs.repo.matches('^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$')
           && inputs.project_dir.matches('^([A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*)?$')
           && (inputs.base_branch == '' || inputs.base_branch.matches('^[A-Za-z0-9._/-]+$')) }}
      pkg: "{{ inputs.package.trimPrefix('./').trimSuffix('/') }}"
      # What `forge test coverage` is narrowed to: the package's repo-relative directory.
      coverage_path: >-
        {{ (inputs.project_dir != '' ? inputs.project_dir + '/' : '') + inputs.package.trimPrefix('./').trimSuffix('/') }}
      project_path: "{{ inputs.project_dir == '' ? '.' : inputs.project_dir }}"
      relative: "{{ inputs.target.startsWith('+') }}"
      run8: "{{ workflow.id.substring(0, 8) }}"

  - id: invalid
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        Refusing to run: the package must be a plain relative directory, the target a percentage up to 100 or
        +N points, the repository owner/name and the project directory a plain relative path. Got package
        `{{ untrustedText(inputs.package, 200) }}`, target `{{ untrustedText(inputs.target, 20) }}`.

  - id: repo_info
    type: action
    uses: github/repo.get@1
    with:
      owner: "{{ inputs.repo.split('/')[0] }}"
      repo: "{{ inputs.repo.split('/')[1] }}"

  - id: base
    type: compute
    outputs:
      branch: >-
        {{ inputs.base_branch != '' ? inputs.base_branch
           : (nodes.repo_info.is_error ? '' : nodes.repo_info.data.default_branch) }}
      publish_branch: "coverage/{{ nodes.check.pkg.lowerAscii().replace('/', '-').replace('.', '-') }}-{{ nodes.check.run8 }}"

  - id: no_repo
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "Could not read {{ inputs.repo }} on GitHub, so there is no default branch to work from: {{ nodes.repo_info.content }}"

  - id: wt
    type: create_worktree
    args:
      name: "raise-coverage-{{ nodes.check.run8 }}"
      base_branch: "{{ nodes.base.branch }}"
      force: true

  # The repository's checkout inside the worktree, and a check that the package is in its forge project.
  - id: dir
    type: run
    timeout: 2m
    args:
      command: |
        for d in "{{ nodes.wt.path }}/{{ inputs.repo.split('/')[1] }}" "{{ nodes.wt.path }}"; do
          if [ -e "$d/.git" ]; then
            u=$(git -C "$d" remote get-url origin 2>/dev/null | sed -e 's/\.git$//' | tr 'A-Z' 'a-z')
            case "$u" in *github.com[:/]{{ inputs.repo.lowerAscii() }})
              if [ ! -f "$d/{{ nodes.check.project_path }}/go.mod" ]; then
                echo "no go.mod in $d/{{ nodes.check.project_path }}" >&2; exit 2
              fi
              if [ ! -d "$d/{{ nodes.check.project_path }}/{{ nodes.check.pkg }}" ]; then
                echo "no directory {{ nodes.check.pkg }} in $d/{{ nodes.check.project_path }}" >&2; exit 2
              fi
              printf '%s' "$d"; exit 0 ;;
            esac
          fi
        done
        echo "no checkout of {{ inputs.repo }} in {{ nodes.wt.path }}" >&2
        exit 1
      credentials: none

  - id: paths
    type: compute
    outputs:
      checkout: "{{ nodes.dir.stdout }}"
      module: "{{ nodes.dir.stdout }}{{ inputs.project_dir != '' ? '/' + inputs.project_dir : '' }}"

  - id: no_checkout
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "The package was not found in a forge project of {{ inputs.repo }} in the worktree {{ nodes.wt.path }}: {{ nodes.dir.stderr }}"

  # The package's tests, recorded as a forge test run, and the coverage they carry. stdout is the
  # forge.test.coverage-view/v1 document; stderr the tail of the tests' output. Exit 3: no `forge test`.
  - id: baseline
    type: run
    timeout: 30m
    args:
      command: |
        cd '{{ nodes.paths.module }}' || exit 1
        run=$(reliant forge test begin) || { echo 'reliant forge test begin failed: this forge has no forge test commands' >&2; exit 3; }
        log=$(mktemp) || exit 1
        reliant forge test capture --run "$run" --lane unit -- go test -json -covermode=atomic -coverprofile="$run/unit/cover.out" './{{ nodes.check.pkg }}/...' >"$log" 2>&1
        rc=$?
        tail -c 6000 "$log" >&2
        rm -f "$log"
        reliant forge test coverage '{{ nodes.check.coverage_path }}' --run "$run" --by file --json
        exit $rc
      credentials: none

  - id: baseline_facts
    type: compute
    outputs:
      pct: "{{ double(json.decode(nodes.baseline.stdout).?summary.?combined.?pct.orValue(0)) }}"
      statements: "{{ int(json.decode(nodes.baseline.stdout).?summary.?combined.?statements.orValue(0)) }}"
      target_pct: >-
        {{ nodes.check.relative
           ? math.least(100.0, double(json.decode(nodes.baseline.stdout).?summary.?combined.?pct.orValue(0)) + double(inputs.target.trimPrefix('+')))
           : double(inputs.target) }}
      # The least covered files first: where the author should look.
      uncovered: >-
        {{ json.decode(nodes.baseline.stdout).?rollup.orValue([])
             .filter(r, int(r.combined.covered) < int(r.combined.statements))
             .sortBy(r, double(r.combined.pct))
             .map(r, string(r.path) + ': ' + string(r.combined.covered) + ' of ' + string(r.combined.statements) + ' statements covered') }}

  - id: no_forge_test
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        `reliant forge test begin` failed in {{ nodes.paths.module }}, so this project's forge has no `forge test`
        commands yet (they ship in a forge release after v1 adds the Tests product): {{ untrustedText(nodes.baseline.stderr, 600) }}

  - id: baseline_red
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: |
        The tests of `{{ nodes.check.pkg }}` already fail on `{{ nodes.base.branch }}`, so there is no green baseline to raise coverage on. Fix them first.
        ```
        {{ nodes.baseline.stderr }}
        ```

  - id: already_met
    type: save_message
    args:
      role: assistant
      content: >-
        `{{ nodes.check.pkg }}` is already at {{ '%.1f'.format([nodes.baseline_facts.pct]) }}% coverage, which meets
        the target of {{ '%.1f'.format([nodes.baseline_facts.target_pct]) }}%. Nothing to do.

  # One round: write tests, run the package's tests and measure, flake-gate the new tests, review them.
  - id: round
    type: loop
    # A loop body sees only its own nodes, so what it needs from the nodes above travels in iter.item:
    # one identical item per round allowed. The while ends it early once a round meets the target.
    items: >-
      {{ lists.range(inputs.max_iterations).map(i, {
           'module': nodes.paths.module, 'checkout': nodes.paths.checkout, 'project_path': nodes.check.project_path,
           'pkg': nodes.check.pkg, 'coverage_path': nodes.check.coverage_path, 'base_branch': nodes.base.branch,
           'baseline_pct': nodes.baseline_facts.pct, 'target_pct': nodes.baseline_facts.target_pct,
           'uncovered': nodes.baseline_facts.uncovered}) }}
    while: "outputs.verdict in ['tests_failed', 'gate_failed', 'rejected', 'short'] && iter.iteration < inputs.max_iterations"
    inline:
      entry: [author]
      outputs:
        response: >-
          {{ has(nodes.author.response) && nodes.author.response != null ? nodes.author.response
             : {'outcome': 'blocked', 'summary': 'The agent ended without submitting a result.'} }}
        pct: "{{ double(json.decode(nodes.?measure.stdout.orValue('')).?summary.?combined.?pct.orValue(-1)) }}"
        uncovered: >-
          {{ json.decode(nodes.?measure.stdout.orValue('')).?rollup.orValue([])
               .filter(r, int(r.combined.covered) < int(r.combined.statements))
               .sortBy(r, double(r.combined.pct))
               .map(r, string(r.path) + ': ' + string(r.combined.covered) + ' of ' + string(r.combined.statements) + ' statements covered') }}
        measure_exit: "{{ nodes.?measure.exit_code.orValue(-1) }}"
        measure_tail: "{{ nodes.?measure.stderr.orValue('') }}"
        gate_exit: "{{ nodes.?gate.exit_code.orValue(-1) }}"
        gate_tail: "{{ nodes.?gate.stdout.orValue('') }}"
        review: >-
          {{ cel.bind(r, nodes.?review.response.orValue(null), r != null ? r
             : {'verdict': 'reject', 'feedback': 'The review did not run or did not finish.', 'tests': []}) }}
        verdict: >-
          {{ !(has(nodes.author.response) && nodes.author.response != null) || nodes.author.response.outcome != 'done' ? 'blocked'
             : (nodes.?measure.exit_code.orValue(-1) != 0 ? 'tests_failed'
             : (nodes.?gate.exit_code.orValue(-1) != 0 ? 'gate_failed'
             : (cel.bind(r, nodes.?review.response.orValue(null), r == null || r.verdict != 'approve') ? 'rejected'
             : (double(json.decode(nodes.?measure.stdout.orValue('')).?summary.?combined.?pct.orValue(-1)) >= iter.item.target_pct ? 'met' : 'short')))) }}
      nodes:
        - id: author
          type: workflow
          ref: builtin://autopilot-agent
          project:
            path: "{{ iter.item.module }}"
          thread:
            mode: new
            memo: true
            inject:
              role: user
              content: |
                {{ iter.iteration == 0
                   ? 'Raise the test coverage of `' + iter.item.pkg + '` (and its subpackages) from ' + '%.1f'.format([iter.item.baseline_pct]) + '% to at least ' + '%.1f'.format([iter.item.target_pct]) + '% of statements.\n\nYour working directory is the forge project in a worktree of ' + inputs.repo + ' at the tip of `' + iter.item.base_branch + '`.\n\nFiles with uncovered statements, least covered first (from `reliant forge test coverage ' + iter.item.coverage_path + ' --by file --json`):\n' + (size(iter.item.uncovered) > 0 ? iter.item.uncovered.slice(0, math.least(25, size(iter.item.uncovered))).join('\n') : '(none listed)') + '\n\n`reliant forge test coverage ' + iter.item.coverage_path + ' --by file` after a `reliant forge test capture` run of the package shows where you are; the system prompt has the commands.'
                   : '## Round ' + string(iter.iteration + 1) + ' of ' + string(inputs.max_iterations) + ': ' + (outputs.verdict == 'tests_failed' ? 'the package\'s tests FAILED' : (outputs.verdict == 'gate_failed' ? 'the flake gate FAILED: a new or edited test did not pass 3 runs of 3' : (outputs.verdict == 'rejected' ? 'the reviewer REJECTED the tests' : 'coverage is short of the target'))) + '\n\nYour tests are still in the worktree. Fix what is below, then submit again.\n\n' + (outputs.verdict == 'tests_failed' ? '```\n' + outputs.measure_tail + '\n```' : (outputs.verdict == 'gate_failed' ? '```\n' + outputs.gate_tail + '\n```\nA test that fails one run in three is flaky: make it deterministic, never add a sleep or a retry.' : (outputs.verdict == 'rejected' ? 'The reviewer:\n' + string(outputs.review.feedback) + '\n\nTests it would not count: ' + (has(outputs.review.padding) && size(outputs.review.padding) > 0 ? outputs.review.padding.join(', ') : '(none named)') : 'Coverage is ' + '%.1f'.format([outputs.pct]) + '%, the target ' + '%.1f'.format([iter.item.target_pct]) + '%. Still uncovered, least covered first:\n' + (size(outputs.uncovered) > 0 ? outputs.uncovered.slice(0, math.least(25, size(outputs.uncovered))).join('\n') : '(none listed)')))) }}
          args:
            model: "{{ inputs.model }}"
            max_turns: "{{ inputs.max_turns }}"
            tools: [view, edit, write, find_replace, shell, shell_output, shell_wait, shell_list, shell_kill, code_context, skill]
            tool_params:
              shell:
                credentials: none
            response_tool_name: submit_result
            response_tool_description: Report the outcome. Call it once, when the worktree holds your final tests.
            response_schema:
              type: object
              required: [outcome, summary]
              properties:
                outcome:
                  type: string
                  enum: [done, blocked]
                  description: done = the tests are written and pass; blocked = the package cannot be tested further without a change you must not make.
                summary:
                  type: string
                  description: 2-4 sentences, for the PR.
                tests:
                  type: array
                  items: {type: string}
                  description: The names of the tests you added or extended.
                pr_body:
                  type: string
                  description: What the new tests cover and why those behaviours matter. Markdown, under 300 words.
                commit_message:
                  type: string
                  description: "Conventional-commit subject (test(<pkg>): ...), blank line, short body."
                missing:
                  type: string
                  description: For blocked, exactly what stands in the way (code that needs a seam, an external service).
            system_prompt: |
              You raise the test coverage of ONE Go package by writing tests that pin its behaviour, inside an isolated git worktree based on the default branch, and report with `submit_result`. Never ask a question; decide and finish.

              Coverage is a side effect, never the goal. Every test you write asserts something a user of the package relies on: a return value, an error and its kind, a state change, an output. A test that only calls code, asserts nothing, or checks nothing but `err == nil` on the happy path is padding, and the reviewer after you rejects it. Prefer table-driven tests over many near-copies; cover error paths and edge cases, not only the happy path.

              1. Read the package and its existing tests (code_context for callers, rg scoped to a relative path). Read the repo's agent guidance (reliant.md, AGENTS.md, CLAUDE.md) if present and load the skills it names; the `testing` skill covers forge's test conventions (testkit, tdd, generated mocks).
              2. Write tests in the package's own `_test.go` files, in the style of the ones there. Use the mocks and harnesses the project already has. Never change non-test code unless a test proves it is wrong; say so in summary if you did.
              3. Measure: from your working directory,
                 run=$(reliant forge test begin) && reliant forge test capture --run "$run" --lane unit -- go test -json -covermode=atomic -coverprofile="$run/unit/cover.out" ./<package>/... ; reliant forge test coverage <repo-relative package dir> --run "$run" --by file
                 (the first message names the package and its repo-relative directory).
              4. Every test must be deterministic: no sleeps, no wall clock, no shared ports or directories (use t.TempDir(), :0). The workflow runs each new test three times.

              Hard rules:
              - Do not commit, push, create branches or open PRs. Leave changes uncommitted.
              - Your shell has no GitHub credentials, on purpose. Do not look for tokens, and do not use gh or git remotes.
              - Never hand-edit generated files (gen/, *_gen.go), and never weaken or delete an existing test.
              - Never run the full lanes (`task ci`, `task test`): the machine is shared. Run the one package.

        - id: measure
          type: run
          timeout: 30m
          args:
            command: |
              cd '{{ iter.item.module }}' || exit 1
              run=$(reliant forge test begin) || { echo 'reliant forge test begin failed' >&2; exit 3; }
              log=$(mktemp) || exit 1
              reliant forge test capture --run "$run" --lane unit -- go test -json -covermode=atomic -coverprofile="$run/unit/cover.out" './{{ iter.item.pkg }}/...' >"$log" 2>&1
              rc=$?
              tail -c 6000 "$log" >&2
              rm -f "$log"
              reliant forge test coverage '{{ iter.item.coverage_path }}' --run "$run" --by file --json
              exit $rc
            credentials: none

        # The flake gate over the new and edited tests, three runs each, on a snapshot commit of the
        # uncommitted change in a scratch worktree, since the gate reads the diff between two commits.
        - id: gate
          type: run
          timeout: 30m
          args:
            command: |
              cd '{{ iter.item.checkout }}' || exit 1
              base=$(git rev-parse HEAD) || exit 1
              tmp=$(mktemp -d) || exit 1
              tree=$(GIT_INDEX_FILE="$tmp/index" sh -c 'git read-tree HEAD && git add -A && git write-tree') || exit 1
              snap=$(git -c user.name=reliant -c user.email=noreply@reliantlabs.io -c commit.gpgsign=false commit-tree "$tree" -p HEAD -m 'flake gate snapshot') || exit 1
              git worktree add --detach --quiet "$tmp/tree" "$snap" || exit 1
              ( cd "$tmp/tree/{{ iter.item.project_path }}" && reliant forge test flakes gate --base "$base" ) >"$tmp/gate.log" 2>&1
              rc=$?
              tail -c 6000 "$tmp/gate.log"
              git worktree remove --force "$tmp/tree" >/dev/null 2>&1
              exit $rc
            credentials: none

        # The guard against padding: an independent reader of every new test.
        - id: review
          type: workflow
          ref: builtin://autopilot-agent
          project:
            path: "{{ iter.item.module }}"
          thread:
            mode: new
            inject:
              role: user
              content: |
                Review the tests just written for `{{ iter.item.pkg }}`. They are uncommitted in this worktree: `git status` and `git diff HEAD` show them (new files are untracked). Coverage went from {{ '%.1f'.format([iter.item.baseline_pct]) }}% to {{ '%.1f'.format([double(json.decode(nodes.?measure.stdout.orValue('')).?summary.?combined.?pct.orValue(-1))]) }}% (target {{ '%.1f'.format([iter.item.target_pct]) }}%), and every new test passed the flake gate three times.

                The author says it added or extended: {{ has(nodes.author.response.tests) && size(nodes.author.response.tests) > 0 ? nodes.author.response.tests.join(', ') : '(none listed; read the diff)' }}
          args:
            model: "{{ inputs.review_model }}"
            max_turns: 60
            tools: [view, shell, shell_output, code_context]
            tool_params:
              shell:
                credentials: none
            response_tool_name: submit_review
            response_tool_description: Submit your verdict on the new tests. Call it once.
            response_schema:
              type: object
              required: [verdict, feedback, tests]
              properties:
                verdict:
                  type: string
                  enum: [approve, reject]
                  description: approve = every new test asserts behaviour; reject = at least one is padding or asserts the wrong thing.
                feedback:
                  type: string
                  description: For reject, what to change, test by test. For approve, one line.
                tests:
                  type: array
                  description: Every new or extended test, with what it asserts.
                  items:
                    type: object
                    required: [name, asserts]
                    properties:
                      name: {type: string}
                      file: {type: string}
                      asserts:
                        type: string
                        description: The behaviour it pins, in a few words (for the PR), or "nothing" for padding.
                padding:
                  type: array
                  items: {type: string}
                  description: The tests that do not count (no assertion, only call code, only check err == nil).
            system_prompt: |
              You review new Go tests for ONE thing: whether each asserts behaviour, or only executes lines to raise coverage. You never edit files: read and judge, then call `submit_review`. Never ask a question.

              Read the whole diff (`git diff HEAD`, plus untracked files from `git status --porcelain`), and the code each test calls. For every new or extended test (each table row counts as part of its test):
              - It counts when it asserts an observable result of the code under test: a return value compared with an expected one, an error's kind or message, a state change read back, an output, a call a mock records with its arguments.
              - It is padding when it has no assertion; when it calls code and discards the result (`_ = f()`); when its only check is `err == nil` / `require.NoError` on a path that cannot fail; when it asserts on the test's own fixture or a mock's canned return rather than on the code; or when it duplicates an existing test.
              - It is wrong when it asserts current behaviour that is plainly a bug, uses sleeps or the wall clock, or edits non-test code without saying why.
              Reject if any test is padding or wrong, and say exactly what to change. Approve only when every one counts. Be strict: a rejected round costs a retry, a padded PR costs every future reader.
              Your shell has no credentials; do not use gh or git remotes, and do not modify the worktree.

        # Says in the chat why a round ended before the review; the verdict above routes the next one.
        - id: stopped
          type: save_message
          args:
            role: assistant
            content: >-
              Round {{ iter.iteration + 1 }} of {{ inputs.max_iterations }} stopped:
              {{ !has(nodes.measure) ? 'the author submitted ' + string(nodes.?author.response.outcome.orValue('no result'))
                 : (nodes.measure.exit_code != 0 ? 'the package\'s tests failed (exit ' + string(nodes.measure.exit_code) + ')'
                 : 'the flake gate failed (exit ' + string(nodes.?gate.exit_code.orValue(-1)) + ')') }}.

      # A round stops at the first check that fails: its verdict says which, and the author hears it next.
      edges:
        - from: author
          cases:
            - to: [measure]
              condition: "has(nodes.author.response) && nodes.author.response != null && nodes.author.response.outcome == 'done'"
              label: done
          default: [stopped]
        - from: measure
          cases:
            - to: [gate]
              condition: "nodes.measure.exit_code == 0"
              label: tests_pass
          default: [stopped]
        - from: gate
          cases:
            - to: [review]
              condition: "nodes.gate.exit_code == 0"
              label: gate_pass
          default: [stopped]

  - id: result
    type: compute
    outputs:
      kind: >-
        {{ nodes.round.verdict == 'met' ? 'met'
           : (nodes.round.verdict == 'short' ? (nodes.round.pct > nodes.baseline_facts.pct ? 'partial' : 'no_gain')
           : (nodes.round.verdict == 'blocked' ? 'blocked' : 'unpublishable')) }}
      pct: "{{ nodes.round.pct }}"
      response: "{{ nodes.round.response }}"
      tests: >-
        {{ has(nodes.round.review.tests) ? nodes.round.review.tests.map(t, '- `' + string(t.name) + '`' + (has(t.file) && t.file != '' ? ' (' + string(t.file) + ')' : '') + ': ' + string(t.asserts)) : [] }}

  - id: publish
    type: git_publish
    args:
      worktree: "{{ nodes.paths.checkout }}"
      repo: "{{ inputs.repo }}"
      branch: "{{ nodes.base.publish_branch }}"
      allow: ["coverage/*"]
      message: >-
        {{ has(nodes.result.response.commit_message) && nodes.result.response.commit_message != ''
           ? nodes.result.response.commit_message
           : 'test(' + nodes.check.pkg + '): raise coverage to ' + '%.1f'.format([nodes.result.pct]) + '%' }}

  - id: pr
    type: action
    uses: github/pr.create@1
    with:
      owner: "{{ inputs.repo.split('/')[0] }}"
      repo: "{{ inputs.repo.split('/')[1] }}"
      head: "{{ nodes.base.publish_branch }}"
      base: "{{ nodes.base.branch }}"
      title: >-
        test({{ nodes.check.pkg }}): raise coverage from {{ '%.1f'.format([nodes.baseline_facts.pct]) }}% to {{ '%.1f'.format([nodes.result.pct]) }}%{{ nodes.result.kind == 'partial' ? ' (partial)' : '' }}
      body: |
        {{ has(nodes.result.response.pr_body) && nodes.result.response.pr_body != '' ? nodes.result.response.pr_body : nodes.result.response.summary }}

        | | Coverage of `{{ nodes.check.coverage_path }}` |
        |---|---|
        | Before | {{ '%.1f'.format([nodes.baseline_facts.pct]) }}% |
        | After | {{ '%.1f'.format([nodes.result.pct]) }}% |
        | Target | {{ '%.1f'.format([nodes.baseline_facts.target_pct]) }}%{{ nodes.result.kind == 'partial' ? ' (not reached after ' + string(inputs.max_iterations) + ' round(s); this PR is what was gained)' : '' }} |

        **New tests, and what each asserts** (checked by an independent reviewer, which rejects tests that only execute lines):
        {{ size(nodes.result.tests) > 0 ? nodes.result.tests.join('\n') : '(none listed)' }}

        **Verified:** the package's tests pass (`go test -covermode=atomic ./{{ nodes.check.pkg }}/...`, recorded with `reliant forge test capture` and measured with `reliant forge test coverage {{ nodes.check.coverage_path }}`), and `reliant forge test flakes gate` ran every new or edited test 3 times, all passing.

        ---
        Opened by the **raise-coverage** workflow. A person reviews and merges.

  - id: label_partial
    type: action
    condition: "nodes.result.kind == 'partial'"
    uses: github/issue.labels.add@1
    with:
      owner: "{{ inputs.repo.split('/')[0] }}"
      repo: "{{ inputs.repo.split('/')[1] }}"
      issue_number: "{{ nodes.pr.data.number }}"
      label: "coverage:partial"

  - id: done
    type: save_message
    args:
      role: assistant
      content: >-
        raise-coverage: `{{ nodes.check.pkg }}` {{ '%.1f'.format([nodes.baseline_facts.pct]) }}% → {{ '%.1f'.format([nodes.result.pct]) }}%
        (target {{ '%.1f'.format([nodes.baseline_facts.target_pct]) }}%{{ nodes.result.kind == 'partial' ? ', partial' : ', met' }}),
        {{ nodes.pr.data.html_url }}{{ nodes.result.kind != 'partial' ? '' : (nodes.?label_partial.is_error.orValue(true) ? ' (labelling it coverage:partial failed: ' + string(nodes.?label_partial.content.orValue('')) + ')' : ' (labelled coverage:partial)') }}.

  # ── reports: nothing was published ───────────────────────────────────────
  - id: not_raised
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: |
        ## Coverage of `{{ nodes.check.pkg }}` was not raised; nothing was published

        {{ nodes.result.kind == 'blocked' ? 'The agent stopped: ' + nodes.result.response.summary + (has(nodes.result.response.missing) ? ' Missing: ' + nodes.result.response.missing : '')
           : (nodes.result.kind == 'no_gain' ? 'The tests passed review, but coverage did not rise above ' + '%.1f'.format([nodes.baseline_facts.pct]) + '%.'
           : 'After ' + string(inputs.max_iterations) + ' round(s) the last round still ' + (nodes.round.verdict == 'tests_failed' ? 'had failing tests' : (nodes.round.verdict == 'gate_failed' ? 'failed the flake gate' : 'was rejected by the reviewer')) + ', so there is nothing safe to publish.') }}

        {{ nodes.round.verdict == 'tests_failed' ? '```\n' + nodes.round.measure_tail + '\n```' : '' }}{{ nodes.round.verdict == 'gate_failed' ? '```\n' + nodes.round.gate_tail + '\n```' : '' }}{{ nodes.round.verdict == 'rejected' ? '**Reviewer:** ' + string(nodes.round.review.feedback) : '' }}

        The worktree `{{ nodes.paths.checkout }}` holds the last round.

  - id: publish_failed
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        Nothing was pushed: {{ nodes.publish.?refused.orValue(false) ? 'git_publish refused: ' + nodes.publish.?refusal.orValue('') : 'the worktree had no change to commit' }}.

  - id: pr_failed
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "Pushed {{ nodes.base.publish_branch }}, but opening the PR failed: {{ nodes.pr.content }}"

edges:
  - from: check
    cases:
      - to: [invalid]
        condition: "nodes.check.valid != true"
        label: invalid
      - to: [repo_info]
        condition: "true"
        label: valid
  - from: repo_info
    default: [base]
  - from: base
    cases:
      - to: [no_repo]
        condition: "nodes.base.branch == ''"
        label: no_branch
      - to: [wt]
        condition: "true"
        label: branch
  - from: wt
    default: [dir]
  - from: dir
    cases:
      - to: [paths]
        condition: "nodes.dir.exit_code == 0 && nodes.dir.stdout != ''"
        label: found
      - to: [no_checkout]
        condition: "true"
        label: missing
  - from: paths
    default: [baseline]
  - from: baseline
    cases:
      - to: [no_forge_test]
        condition: "nodes.baseline.exit_code == 3"
        label: no_forge_test
      - to: [baseline_red]
        condition: "nodes.baseline.exit_code != 0"
        label: red
      - to: [baseline_facts]
        condition: "true"
        label: green
  - from: baseline_facts
    cases:
      - to: [already_met]
        condition: "nodes.baseline_facts.pct >= nodes.baseline_facts.target_pct"
        label: already_met
      - to: [round]
        condition: "true"
        label: below_target
  - from: round
    default: [result]
  - from: result
    cases:
      - to: [publish]
        condition: "nodes.result.kind in ['met', 'partial']"
        label: publishable
      - to: [not_raised]
        condition: "true"
        label: not_raised
  - from: publish
    cases:
      - to: [pr]
        condition: "nodes.publish.?pushed.orValue(false) == true"
        label: pushed
      - to: [publish_failed]
        condition: "true"
        label: not_pushed
  - from: pr
    cases:
      - to: [label_partial]
        condition: "!nodes.pr.is_error"
        label: opened
      - to: [pr_failed]
        condition: "true"
        label: failed
  - from: label_partial
    default: [done]
