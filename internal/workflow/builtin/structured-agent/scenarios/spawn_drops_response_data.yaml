# Spawn with regular tools: response_data absent from execute_tools output
# Tests the fix for the CEL "no such overload" crash that occurred when:
# 1. LLM calls a spawn tool alongside regular tools (not the response tool)
# 2. buildFinalToolResult drops response_data from the combined result
# 3. normalizeOutput backfills response_data as nil (proto pointer zero-value)
# 4. CEL "in" operator has no overload for "string in null" → crash
#
# The fix adds null guards in the agent_loop outputs so response_data == null
# is handled gracefully instead of crashing.
name: spawn_drops_response_data
description: |
  When spawn tools mix with regular tools, buildFinalToolResult only includes
  tool_results and message — response_data is absent. normalizeOutput backfills
  it as nil. The null guard in the CEL expression must prevent "in null" crash.
inputs:
  mode: auto
  max_turns: 100
  response_tool_name: submit_response
  spawn_presets:
    - researcher
    - code_reviewer
events:
  # Iteration 1: LLM calls regular tool
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Let me check the file."
      response_text: "Let me check the file."
      tool_calls:
        - id: call_0
          name: grep
          input: '{"pattern":"TODO","path":"src/"}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_0
          content: "src/main.go:42: // TODO: refactor"
      response_data:
        submit_response: null
      thread_token_count: 500

  # Iteration 2: LLM calls spawn + regular tool.
  # In the real runtime, buildFinalToolResult constructs a combined result
  # with ONLY tool_results and message — response_data is dropped entirely.
  # normalizeOutput then backfills response_data as nil.
  # Simulate this by omitting response_data from the output entirely.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Spawning a researcher and also checking the file."
      response_text: "Spawning a researcher and also checking the file."
      tool_calls:
        - id: call_spawn
          name: spawn
          input: '{"preset":"researcher","prompt":"Investigate TODO items"}'
        - id: call_view
          name: view
          input: '{"file_path":"src/main.go"}'
  # response_data is ABSENT — this is the bug trigger.
  # Without the null guard fix, CEL evaluates "submit_response" in null → crash.
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_spawn
          content: '{"agent_id": "spawned-123", "status": "started"}'
        - tool_call_id: call_view
          content: '{"result": "package main\\n\\nfunc main() {}\\n"}'
      thread_token_count: 600

  # Iteration 3: LLM calls response tool
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Analysis complete."
      response_text: "Analysis complete."
      tool_calls:
        - id: call_response
          name: submit_response
          input: '{"choice":"complete","value":"Found 1 TODO item. Spawned researcher for deeper analysis."}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_response
          content: '{"choice": "complete"}'
      response_data:
        submit_response:
          choice: complete
          value: "Found 1 TODO item. Spawned researcher for deeper analysis."
      thread_token_count: 700

  # Iteration 4: THE TURN THE DETACHED SPAWN EARNS.
  #
  # The spawn in iteration 2 dispatches detached, so when iteration 3's response
  # tool satisfies the exit condition the loop does NOT exit: it parks in
  # awaitLiveDetachedSpawns, the child completes there, and a completed detached
  # spawn is precisely the signal meaning "re-enter — its result may be in the
  # mailbox." Both lanes take this turn, which is why the count below is 4.
  #
  # It must carry a tool call: remind_response fires only on a turn with none,
  # and `not_reached` below asserts it never does.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "The researcher's findings are in; finalizing."
      response_text: "The researcher's findings are in; finalizing."
      tool_calls:
        - id: call_response_final
          name: submit_response
          input: '{"choice":"complete","value":"Found 1 TODO item. Spawned researcher for deeper analysis."}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_response_final
          content: '{"choice": "complete"}'
      response_data:
        submit_response:
          choice: complete
          value: "Found 1 TODO item. Spawned researcher for deeper analysis."
      thread_token_count: 800

expect:
  outcome: completed
  # `completed:` rather than `reached:` — reached deliberately includes SKIPPED
  # nodes, so it could not prove execute_tools ran, and execute_tools RUNNING is
  # what makes the null-guard this scenario exists for reachable at all.
  completed:
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    # remind_response only fires on a turn with NO tool calls. Every turn here
    # has one, so it must never fire — and it is also the tell for the failure
    # mode this scenario guards: a loop running past its supplied turns on empty
    # mocks reaches remind_response every iteration.
    - agent_loop.remind_response
    # mode is auto, so approval must never gate a tool.
    - agent_loop.approval
  node_outputs:
    agent_loop:
      # The honest terminating condition, and the assertion that keeps this
      # scenario from passing vacuously. The response tool is called on the
      # THIRD turn, but the loop does not end there: the spawn dispatched on
      # turn 2 is DETACHED, so the satisfied exit condition parks the loop in
      # awaitLiveDetachedSpawns instead of exiting, and the child's completion
      # earns exactly one more turn. Four is therefore the real count on both
      # lanes, and it is what makes the spawn observable in this assertion at
      # all — a run that ignored detached spawns would land on 3.
      #
      # It is still an anti-vacuity guard: a run that overruns its events on
      # empty mocks lands on max_turns (100), not 4.
      _iterations: 4
      completed: true
  outputs:
    completed: true
    # The null guard is what this scenario exists for, and these two lines are
    # what prove it still works. response_data was ABSENT from iteration 2's
    # execute_tools output (the bug trigger), so a regressed guard crashes CEL
    # on "submit_response in null" and the run never produces a response at all.
    # Reading the value back out end-to-end is therefore the guard's live proof.
    response.choice: complete
    response.value: "Found 1 TODO item. Spawned researcher for deeper analysis."
