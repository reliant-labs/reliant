# Custom response tool name with regular tools first
# Regression test for "CEL evaluation error: no such key: submit_review"
# When checklist invokes structured-agent with response_tool_name=submit_review,
# and the LLM calls regular tools before the response tool, the response_data
# map doesn't contain "submit_review" yet. The output expressions must handle this.
name: custom_response_tool_with_regular_tools
description: Custom response_tool_name (submit_review) with regular tools called first
inputs:
  mode: auto
  max_turns: 100
  response_tool_name: submit_review
  response_schema:
    type: object
    required: [grade, summary]
    properties:
      grade:
        type: string
        enum: [pass, fail]
      summary:
        type: string
events:
  # Iteration 1: LLM uses shell tool (not submit_review)
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Let me check the code changes."
      response_text: "Let me check the code changes."
      tool_calls:
        - id: call_0
          name: shell
          input: '{"command":"git diff HEAD~1"}'
  # execute_tools runs for shell — response_data does NOT contain submit_review
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_0
          content: "diff --git a/main.go b/main.go\n+func hello() { ... }"
      response_data:
        submit_review: null
      thread_token_count: 500
  # Iteration 2: LLM now calls submit_review
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Review complete."
      response_text: "Review complete."
      tool_calls:
        - id: call_1
          name: submit_review
          input: '{"grade":"pass","summary":"Implementation looks clean and follows best practices."}'
  - node: agent_loop.execute_tools
    output:
      message:
        role: tool
        text: ""
      tool_results:
        - tool_call_id: call_1
          content: '{"grade": "pass", "summary": "Implementation looks clean and follows best practices."}'
      response_data:
        submit_review:
          grade: "pass"
          summary: "Implementation looks clean and follows best practices."
      thread_token_count: 600
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    - agent_loop.remind_response
    - agent_loop.approval
