name: happy_path
description: The build passes. Full pipeline through the preview handoff to success.

events:
  # One loop: scoped with the user, scaffolded the substrate green, fanned out
  # per-seam units, synthesized them, and passed the teethed review that opened
  # the live app.
  # build_app EXECUTES its get-it-right body. forge-one-shot sets max_retries: 7,
  # so the "never reaches green" premise needs a verdict for EVERY attempt —
  # one mock would be consumed once and the loop would then default to green.
  - node: build_app.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Attempt 1 for build_app."
      response_text: "Attempt 1 for build_app."
      tool_calls: []
  - node: build_app.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "Scaffold landed but the fan-out left a build error I could not resolve."
