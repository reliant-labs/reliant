name: build_stuck
description: The loop escalates on a tooling/environment blocker, not a code defect.

events:
  # build_app EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: build_app.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for build_app."
      response_text: "Implementation attempt for build_app."
      tool_calls: []
  - node: build_app.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "stuck"
            feedback: "The app genuinely will not start — a forge command crashes. Not the protos or the code."
  - node: build_app.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "stuck"
          feedback: "The app genuinely will not start — a forge command crashes. Not the protos or the code."
      tool_results: []
      thread_token_count: 100
expect:
  outcome: completed
  reached:
    - build_app
    - stuck
  not_reached:
    - build_done
    - launch_preview
    - success
    - failed
