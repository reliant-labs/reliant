# Resume-into-current-node (Task 4) on the single-loop forge-one-shot chain.
#
# The user paused while build_app — the one get-it-right loop that carries the
# whole arc — was running, then sent a message. Resume must re-enter build_app
# (the currently-active node) and continue through build_done to the
# launch_preview handoff, rather than restarting the workflow from node zero.
#
# Mirrors the runtime resume-at-checkpoint path (resolveResumeTarget /
# resume_test.go TestDynamicWorkflow_Resume_EntersAtCheckpointNode): a new run
# begins at the checkpointed node, earlier node outputs are not reconstructed, so
# the workflow's cross-node edge refs are all has()-guarded. start_at models it.
#
# build_app is the entry node, so resuming into it is also the shortest possible
# chain: its own completion event drives every edge the rest of the run takes.

name: resume_into_current_node
description: Pausing during build_app resumes into that node and runs on to the preview

start_at: build_app

events:
  # build_app EXECUTES its get-it-right body — mocking the innermost agent_loop
  # nodes makes the nested ref transparent. That is what proves the resume
  # actually re-entered the loop, rather than the scenario handing back a
  # cached-looking output for a node that never ran.
  # get-it-right declares response_tool_name: submit_evaluation.
  - node: build_app.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "The build resumed from where it paused and completed."
      response_text: "The build resumed from where it paused and completed."
      tool_calls: []
  - node: build_app.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "The scaffolded app builds and matches the plan."
  - node: build_app.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "The scaffolded app builds and matches the plan."
      tool_results: []
      thread_token_count: 100

  - node: launch_preview.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Started the finished build and posted the preview URL."
      response_text: "Started the finished build and posted the preview URL."
      tool_calls: []

expect:
  outcome: completed
  reached:
    - build_app
    - build_done
    - launch_preview
    - success
  not_reached:
    - stuck
    - failed
