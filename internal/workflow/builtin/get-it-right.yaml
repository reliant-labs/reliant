name: get-it-right
apiVersion: "0.0.5"
description: |
  Get It Right — for complex brownfield codebases where LLMs paper-mache code on top.
  The insight: sometimes you need to try and fail to truly understand the codebase.

  Loop: implement → checks → review → [refactor?] → loop back
    1. implement — Build the requested changes (the only node that writes code).
    2. checks — Parallel lint/test/build. If any fail, skip review and loop back immediately.
    3. review — Evaluate the implementation. Decide: pass, continue, or refactor.
    4. refactor — (conditional) Undo the problematic work. Does NOT reimplement —
       the next implement iteration handles that.

  Context management:
    Review feedback AND implementation summaries are saved to the parent thread.
    The reviewer accumulates context across iterations (memo: true) so it can
    build on its own prior analysis. Implementation forks are still fresh each
    iteration, but the agent sees accumulated review feedback + implementation
    summaries from the parent thread.

  Thread architecture:
    attempt loop inherits main thread (parent thread = original user message + review/impl feedback).
    implement forks — fresh each iteration. Sees original request + accumulated review feedback + implementation summaries.
    review forks — memo'd across iterations. Builds on its own prior analysis + check results via inject.
    refactor forks — gets review feedback via inject (node references).

entry: [attempt]

inputs:
  model:
    type: model
    description: LLM model to use for all phases
    default:
      tags: [flagship]

  max_retries:
    type: integer
    default: 3
    min: 1
    max: 10
    description: Maximum implement→review→refactor iterations

  mode:
    type: enum
    ui: toolbar
    default: auto
    description: Execution mode for agent steps.
    enum: [manual, auto, plan]

  yield:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review after each iteration.

  temperature:
    type: number
    default: 1.0
    min: 0
    max: 1
    description: Response randomness

  thinking_level:
    type: enum
    enum: [low, medium, high, xhigh]
    default: medium
    description: Extended thinking level

  lint_command:
    type: string
    default: ""
    description: Command to run linting (skipped if empty).

  lint_log:
    type: string
    default: "./data/get-it-right/lint.log"
    description: File path for lint output.

  test_command:
    type: string
    default: ""
    description: Command to run tests (skipped if empty).

  test_log:
    type: string
    default: "./data/get-it-right/test.log"
    description: File path for test output.

  build_command:
    type: string
    default: ""
    description: Command to run builds (skipped if empty).

  build_log:
    type: string
    default: "./data/get-it-right/build.log"
    description: File path for build output.

  start_app_command:
    type: string
    default: ""
    description: Command to start the application for UX review (skipped if empty).

  app_port:
    type: integer
    default: 5173
    description: Port the application runs on (for UX reviewer).

nodes:
  - id: attempt
    type: loop
    while: >
      (has(outputs.eval_strategy) && outputs.eval_strategy != "pass"
       || (has(outputs.lint_exit) && outputs.lint_exit != 0)
       || (has(outputs.test_exit) && outputs.test_exit != 0)
       || (has(outputs.build_exit) && outputs.build_exit != 0))
      && iter.iteration < inputs.max_retries
    yield: "inputs.yield"
    inline:
      entry: [implement]

      outputs:
        lint_exit: "{{has(nodes.lint) && has(nodes.lint.exit_code) ? nodes.lint.exit_code : 0}}"
        test_exit: "{{has(nodes.test) && has(nodes.test.exit_code) ? nodes.test.exit_code : 0}}"
        build_exit: "{{has(nodes.build) && has(nodes.build.exit_code) ? nodes.build.exit_code : 0}}"
        eval_strategy: >
          {{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null
            ? nodes.review.response.strategy
            : (
                (has(nodes.lint) && has(nodes.lint.exit_code) && nodes.lint.exit_code != 0) ||
                (has(nodes.test) && has(nodes.test.exit_code) && nodes.test.exit_code != 0) ||
                (has(nodes.build) && has(nodes.build.exit_code) && nodes.build.exit_code != 0)
              ) ? 'continue' : 'pass'}}
        review_grade: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null && has(nodes.review.response.grade) ? nodes.review.response.grade : 'pass'}}"
        review_feedback: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.feedback : ''}}"

      nodes:
        - id: implement
          type: workflow
          ref: builtin://agent
          presets:
            default: general
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
          thread:
            mode: fork
            memo: false
            inject:
              role: user
              content: |
                ## Get It Right — Attempt {{iter.iteration + 1}} of {{inputs.max_retries}}

                Implement the requested changes. Start by investigating the relevant code, then make your changes and run tests to verify them.

                The review feedback and implementation summaries from previous attempts (if any) are in the conversation above. Use them to guide your implementation.

                After finishing, summarize:
                1. What you changed and why
                2. What tests you ran and their results
                3. What surprised you about the codebase
                4. What you're uncertain about
          save_message:
            role: assistant
            content: |
              ## Implementation Notes (Attempt {{iter.iteration + 1}})
              {{output.response_text}}

        - id: lint
          type: run
          condition: "inputs.lint_command != ''"
          command: "{{inputs.lint_command}} > {{inputs.lint_log}} 2>&1"

        - id: test
          type: run
          condition: "inputs.test_command != ''"
          command: "{{inputs.test_command}} > {{inputs.test_log}} 2>&1"

        - id: build
          type: run
          condition: "inputs.build_command != ''"
          command: "{{inputs.build_command}} > {{inputs.build_log}} 2>&1"

        - id: join_checks
          type: join

        - id: review
          type: workflow
          ref: builtin://structured-agent
          presets:
            default: general
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
            response_tool_name: submit_evaluation
            response_tool_description: "Submit your evaluation of the implementation attempt and recommended strategy"
            response_schema:
              type: object
              required:
                - grade
                - strategy
                - feedback
              properties:
                grade:
                  type: string
                  enum: [pass, pass_with_suggestions, fail]
                  description: |
                    pass — implementation is correct, no blocking issues.
                    pass_with_suggestions — implementation is correct but has minor improvements.
                    fail — implementation has blocking issues that must be fixed.
                strategy:
                  type: string
                  enum: ["pass", "continue", "refactor"]
                  description: |
                    "pass" — implementation is correct and complete. Break the loop.
                    "continue" — implementation is incomplete or has minor issues. Loop back to implement.
                    "refactor" — approach is fundamentally wrong. The refactor agent will undo the problematic work, then the next implement iteration starts fresh with your insights.
                feedback:
                  type: string
                  description: |
                    Detailed feedback for the next attempt. This is the ONLY context the next
                    attempt gets (besides the original request). Be thorough:
                    - What was wrong or incomplete
                    - What approach would work better
                    - What parts were correct and should be preserved
                    - Any codebase patterns or constraints discovered
                    - What specific improvements should the next attempt make
          thread:
            mode: fork
            memo: true
            inject:
              role: user
              content: |
                ## Get It Right — Review Attempt {{iter.iteration + 1}}

                **Check results:**
                - Lint: {{has(nodes.lint) && has(nodes.lint.exit_code) ? (nodes.lint.exit_code == 0 ? 'passed' : 'FAILED') : 'skipped'}}
                - Test: {{has(nodes.test) && has(nodes.test.exit_code) ? (nodes.test.exit_code == 0 ? 'passed' : 'FAILED') : 'skipped'}}
                - Build: {{has(nodes.build) && has(nodes.build.exit_code) ? (nodes.build.exit_code == 0 ? 'passed' : 'FAILED') : 'skipped'}}

                {{inputs.start_app_command != '' ? 'The application is running at: http://localhost:' + string(inputs.app_port) + ' — spawn the ux_reviewer to audit it via Chrome DevTools.' : ''}}

                Analyze the implementation attempt. Your prior reviews (if any) are in this thread — use them to track progress across attempts.

                Your job:
                1. Is the implementation correct and complete? Grade it.
                2. Decide the strategy: pass, continue, or refactor.
                3. Write detailed feedback for the next attempt.

                **Your feedback is the primary bridge to the next attempt.**
                The next implement agent starts with a fresh fork but sees your accumulated review
                feedback and implementation summaries on the parent thread.
                Be thorough: describe what worked, what didn't, what patterns in the codebase
                matter, and what approach should be taken. Reference your prior reviews when relevant.

                **Strategy guidance:**
                - **pass**: implementation is correct and complete. Break the loop.
                - **continue**: incomplete but approach is sound. Loop back, skip refactor.
                - **refactor**: fundamentally wrong. Refactor agent will UNDO the work, next attempt starts fresh with your feedback.

                **Bias toward refactoring** for complex changes that fight the codebase's patterns.
                For trivial changes (CSS, spacing, config): bias toward `pass`.
          save_message:
            role: assistant
            content: |
              ## Review (Attempt {{iter.iteration + 1}}): {{has(output.response) && output.response != null ? output.response.strategy : 'N/A'}}
              {{has(output.response) && output.response != null ? output.response.feedback : ''}}

        - id: refactor
          type: workflow
          ref: builtin://agent
          presets:
            default: general
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
          thread:
            mode: fork
            memo: false
            inject:
              role: user
              content: |
                ## Refactor (After Attempt {{iter.iteration + 1}})

                The reviewer identified fundamental issues with the implementation:

                **Feedback:** {{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.feedback : 'N/A'}}

                **Your job is to UNDO the problematic work, not to reimplement it.** The next iteration's implement agent will handle reimplementation armed with the reviewer's feedback.

                **Approach:**
                1. Spawn an agent to carefully revert/undo the problematic changes. It must use `git diff` and `git status` to understand the full workspace state before reverting anything — other agents or workflows may have made changes in this workspace that must be preserved.
                2. If the reviewer identified specific files or patterns that should be preserved, keep those.

                **Do NOT:**
                - Write new implementation code
                - Add new features or functionality
                - Try to fix the code — the reviewer said it needs a fresh approach

                After undoing, summarize what was reverted and what state the workspace is in.

      edges:
        - from: implement
          default: [lint]
        - from: implement
          default: [test]
        - from: implement
          default: [build]
        - from: implement
          default: [join_checks]
        - from: lint
          default: [join_checks]
        - from: test
          default: [join_checks]
        - from: build
          default: [join_checks]
        - from: join_checks
          cases:
            - condition: >
                (has(nodes.lint) && has(nodes.lint.exit_code) && nodes.lint.exit_code != 0) ||
                (has(nodes.test) && has(nodes.test.exit_code) && nodes.test.exit_code != 0) ||
                (has(nodes.build) && has(nodes.build.exit_code) && nodes.build.exit_code != 0)
              to: []
          default: [review]
        - from: review
          cases:
            - condition: "has(nodes.review.response) && nodes.review.response.strategy == 'refactor'"
              to: [refactor]
          default: []

outputs:
  strategy: "{{nodes.attempt.eval_strategy}}"
  eval_strategy: "{{nodes.attempt.eval_strategy}}"
  review_grade: "{{nodes.attempt.review_grade}}"
  review_feedback: "{{nodes.attempt.review_feedback}}"
  lint_exit: "{{nodes.attempt.lint_exit}}"
  test_exit: "{{nodes.attempt.test_exit}}"
  build_exit: "{{nodes.attempt.build_exit}}"
  iterations: "{{nodes.attempt._iterations}}"

edges: []