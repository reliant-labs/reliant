name: over_the_investigation_cap_files_without_investigating
description: >-
  With max_investigations 1, the second new alert is filed but not investigated, so a flood cannot start dozens of agents.
inputs: {"service_repos": {"reliant-api-server": "reliant-labs/reliant", "temporal-worker": "reliant-labs/reliant", "forge": "reliant-labs/forge"}, "default_repo": "reliant-labs/control-plane", "group_key": "g", "alerts": [{"status": "firing", "fingerprint": "1111111111111111", "labels": {"alertname": "A"}, "annotations": {"summary": "A is firing"}, "startsAt": "2026-10-14T20:00:00Z", "endsAt": "0001-01-01T00:00:00Z"}, {"status": "firing", "fingerprint": "2222222222222222", "labels": {"alertname": "B"}, "annotations": {"summary": "B is firing"}, "startsAt": "2026-10-14T20:00:00Z", "endsAt": "0001-01-01T00:00:00Z"}], "max_investigations": 1}
events:
  - node: classify.search
    output: {"is_error": false, "data": {"total_count": 0, "items": []}}
  - node: classify.search
    output: {"is_error": false, "data": {"total_count": 0, "items": []}}
  - node: file.labels
    black_box: true
    output: {}
  - node: file.created
    output: {"is_error": false, "data": {"number": 10}}
  - node: file.lease
    black_box: true
    output: {"status": "acquired", "lease_id": 77, "started_at": "t", "expires": "x", "takeover_from": "", "holder": "", "detail": "ACQUIRE"}
  - node: file.dir
    output: {"exit_code": 0, "stdout": "/r/x"}
  - node: file.agent
    black_box: true
    output: {"completed": true, "response": {"severity": "low", "summary": "s", "evidence": "e", "suspected_cause": "c", "proposed_fix": "f", "confidence": "low"}, "model": "m"}
  - node: file.publish
    output: {"is_error": false, "data": {"number": 10}}
  - node: file.release
    black_box: true
    output: {"recheck_found": 0, "other_live_lease": false}
  - node: file.labels
    black_box: true
    output: {}
  - node: file.created
    output: {"is_error": false, "data": {"number": 20}}
expect:
  outcome: completed
  completed: [file]
  node_outputs:
    capped: {to_investigate: ["1111111111111111"]}
