name: refactor
description: Code refactoring specialist who reorganizes and improves code structure
  while preserving behavior
tag: agent
params:
  skills:
    - refactor
  spawn_presets:
  - researcher
  tools:
  - view
  - edit
  - write
  - save_attachment  # copy an image or file the user attached into the workspace, byte for byte
  - find_replace
  - move_code
  - tag:shell
  - code_context  # find every caller before changing a signature
  model:
    tags: [moderate]