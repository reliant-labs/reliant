    # A tier, not an effort. The registry decides what [moderate] costs: today
    # claude-5.5-opus at high (see the tags section of models.yaml). Pinning
    # thinking_level here would silently override that.
    tags: [moderate]
  skills:
    - code-search
  tools:
    - tag:coding:default
  spawn_presets:
    - researcher