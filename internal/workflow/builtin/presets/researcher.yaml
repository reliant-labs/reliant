name: researcher
description: Research and analysis specialist conducting comprehensive investigations of the codebase. Has full access to search the web and explore the codebase. Intended for investigation rather than code changes.
tag: agent
params:
  skills:
    - research-methodology
    - code-search
  tools:
  - tag:shell    # search the codebase via the shell tool (rg, and a language server for callers/implementations)
  - tag:web      # fetch for documentation research
  - view         # Read files
  - code_context # definition + callers + callees + implementations in ONE call
  model:
    tags: [flagship]
    thinking_level: low