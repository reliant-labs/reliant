name: ralph-wiggum
apiVersion: "0.0.5"
description: |
  Ralph Wiggum — brute-force iteration for complex tasks.

  The insight: for sufficiently complex tasks, an LLM often needs multiple passes
  to get it right. Rather than accumulating context (which degrades with noise),
  each attempt starts completely fresh. There is NO bridge between iterations —
  the implement agent sees only the original request each time.

  This is a thin wrapper around get-it-right with context_bridge: none.
  All checks are skipped (no lint/test/build commands). Each iteration is
  a fresh implement → review cycle with no context carried between them.
  Diversity comes purely from LLM sampling randomness.

entry: [get_it_right]

inputs:
  model:
    type: model
    description: LLM model to use for all phases
    default:
      tags: [flagship]

  max_retries:
    type: integer
    default: 10
    min: 1
    max: 10
    description: Maximum implement→review iterations

  mode:
    type: enum
    ui: toolbar
    default: auto
    description: Execution mode for agent steps.
    enum: [manual, auto, plan]

  ask:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review after each iteration.

nodes:
  - id: get_it_right
    type: workflow
    ref: builtin://get-it-right
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      max_retries: "{{inputs.max_retries}}"
      ask: "{{inputs.ask}}"
      context_bridge: none

outputs:
  review_strategy: "{{nodes.get_it_right.eval_strategy}}"
  review_feedback: "{{nodes.get_it_right.review_feedback}}"
  iterations: "{{nodes.get_it_right.iterations}}"

edges: []
