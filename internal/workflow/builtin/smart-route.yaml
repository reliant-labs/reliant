name: smart-route
apiVersion: "0.0.5"
description: |
  Intelligent workflow router that classifies user requests and dispatches to the best
  strategy — from simple agent tasks to complex multi-phase pipelines.
  
  Uses LLM-based classification to select from:
  - Single-shot agent with various specialist presets
  - Get It Right: brownfield iteration with automated review
  - GSD: discussion + research + planning + implementation pipeline
  - One Ring: full planning + TDD + implementation + review pipeline
  - UX Review: visual UX improvement with automated screenshot review

inputs:
  mode:
    type: enum
    default: auto
    enum: [manual, auto]
    description: "Execution mode for the routed workflow"
    ui: hidden

  model:
    type: model
    default:
      tags: [flagship]
    description: "Model for the routed workflow (routing uses a fast model)"
    ui: toolbar

  yield:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review between phases.

  user_message:
    type: message
    description: "The user's request to route"

entry: [route]

nodes:
  - id: route
    type: router
    model:
      tags: [fast, smart]
    thread:
      mode: new
    workflows:
      - ref: builtin://agent
        presets:
          - general
          - researcher
          - planner
          - debug
          - tester
          - refactor
          - documentation
          - git
          - ux
        description: "Single-shot agent for straightforward tasks. Handles research, planning, debugging, testing, refactoring, documentation, git operations, and UX changes. Best for tasks that don't need iterative review."

      - ref: builtin://agent
        presets:
          - code_reviewer
        description: "Code review specialist — use when the user wants code reviewed, audited, or analyzed for quality. Read-only analysis with structured feedback."

      - ref: builtin://get-it-right
        description: "Brownfield iteration with automated review. Implements changes then runs lint/test/build checks and code review in a loop until everything passes. Best for bug fixes, refactoring, and changes to existing codebases where verification matters."

      - ref: builtin://gsd
        description: "Get Shit Done pipeline: discuss requirements → research → plan → implement → verify. Best for tasks that need upfront discussion to clarify requirements, followed by systematic execution."

      - ref: builtin://one-ring
        description: "Full multi-phase pipeline: research → plan → criticize → revise → TDD → implement → review loop. Best for complex features, architectural changes, or ambitious tasks that benefit from thorough planning and test-driven development."

      - ref: builtin://ux-review
        description: "UX improvement loop: implement visual changes → automated screenshot review → iterate until approved. Best for UI/UX tasks where visual verification is needed — the reviewer navigates the app, takes screenshots, and checks for visual/functional issues."

outputs:
  selected_workflow: "{{nodes.route.selected_workflow}}"
  selected_preset: "{{nodes.route.selected_preset}}"
  reasoning: "{{nodes.route.reasoning}}"
  response_text: "{{nodes.route.outputs.response_text}}"
