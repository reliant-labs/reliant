name: no_review_runs_the_failure_handler
description: >-
  The reviewer ends without submitting a review. no_review declares outcome: failure, so the run is FAILED and
  on_failure runs once: it posts the failure note (ONE comment, via autopilot-failure-note) and records it.
inputs:
  repos: [reliant-labs/forge]
  repo: reliant-labs/forge
  pr_number: 101
events:
  - node: me
    output: {is_error: false, data: {login: reliant-01, id: 225976313}}
  - node: pr
    output:
      is_error: false
      data:
        number: 101
        state: open
        draft: false
        user: nunoo
        title: Add a thing
        body: "x"
        changed_files: 1
        head: {ref: feat/x, sha: 0123456789abcdef0123456789abcdef01234567}
        base: {ref: main, sha: fedcba9876543210fedcba9876543210fedcba98}
  - node: issue
    output: {is_error: false, data: {labels: [], is_pull_request: true, state: open}}
  - node: review.agent_loop.call_llm
    output:
      message: {role: assistant, text: "I can't help with that."}
      response_text: "I can't help with that."
      stop_reason: refused
      model: test-model
      tool_calls: []
  - node: on_failure.note
    black_box: true
    output: {status: posted}
expect:
  outcome: completed
  completed: [review, no_review]
  not_reached: [decide, post]
  on_failure:
    ran: true
    node_id: no_review
    error_code: outcome
  messages:
    on_failure.recorded:
      count: 1
      content_contains: ["pr-review failed on reliant-labs/forge#101", "the reviewer finished without submitting a review"]
