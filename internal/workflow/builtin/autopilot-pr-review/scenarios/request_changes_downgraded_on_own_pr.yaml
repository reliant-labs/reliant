name: request_changes_downgraded_on_own_pr
description: >-
  A defect on a PR the connection's own account opened (every issue-worker PR) is posted as COMMENT, because
  GitHub refuses REQUEST_CHANGES on your own PR; the body states the changes-requested verdict instead.
inputs:
  repos: [reliant-labs/forge]
  repo: reliant-labs/forge
  pr_number: 102
events:
  - node: me
    output: {is_error: false, data: {login: reliant-01, id: 225976313}}
  - node: pr
    output:
      is_error: false
      data:
        number: 102
        state: open
        draft: false
        user: reliant-01
        title: Fix it
        body: ""
        changed_files: 2
        head: {ref: autopilot/issue-7, sha: 0123456789abcdef0123456789abcdef01234567}
        base: {ref: main, sha: fedcba9876543210fedcba9876543210fedcba98}
  - node: issue
    output: {is_error: false, data: {labels: ["agent:authored"], is_pull_request: true, state: open}}
  - node: review.agent_loop.call_llm
    output:
      message: {role: assistant, text: ""}
      response_text: ""
      stop_reason: tool_use
      model: test-model
      tool_calls:
        - id: call_0
          name: submit_review
          input: '{"verdict":"REQUEST_CHANGES","defects":2,"risks":1,"body":"### Defects\n- one\n- two"}'
  - node: review.agent_loop.execute_tools
    output:
      message: {role: tool, text: ""}
      tool_results:
        - {tool_call_id: call_0, content: "ok"}
      response_data:
        submit_review: {verdict: REQUEST_CHANGES, defects: 2, risks: 1, body: "### Defects\n- one\n- two"}
  - node: post
    output: {is_error: false, data: {id: 3, html_url: "https://github.com/reliant-labs/forge/pull/102#pullrequestreview-3"}}
expect:
  outcome: completed
  completed: [review, decide, post, posted]
  node_outputs:
    decide: {event: COMMENT, requested_changes: true, own_pr: true, findings: 3}
