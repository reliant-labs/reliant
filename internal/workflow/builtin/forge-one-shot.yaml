edges:
  - from: scope_conversation
    default: scaffold_and_verify
  - from: scaffold_and_verify
    cases:
      - to: scaffold_stuck
        condition: "has(nodes.scaffold_and_verify.stuck) && nodes.scaffold_and_verify.stuck == true"
        label: scaffold_stuck
      - to: scaffold_failed
        condition: "nodes.scaffold_and_verify.strategy != 'pass'"
        label: scaffold_failed
    default: frontend_polish
  - from: frontend_polish
    default: frontend_done
  - from: frontend_done
    default: mvp_backend
  - from: mvp_backend
    cases:
      - to: mvp_stuck
        condition: "has(nodes.mvp_backend.stuck) && nodes.mvp_backend.stuck == true"
        label: mvp_stuck
      - to: mvp_failed
        condition: "nodes.mvp_backend.strategy != 'pass'"
        label: mvp_failed
    default: mvp_done
  - from: mvp_done
    default: production_polish
  - from: production_polish
    cases:
      - to: production_stuck
        condition: "has(nodes.production_polish.stuck) && nodes.production_polish.stuck == true"
        label: production_stuck
      - to: production_failed
        condition: "nodes.production_polish.strategy != 'pass'"
        label: production_failed
    default: success