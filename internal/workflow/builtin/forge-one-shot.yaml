name: forge-one-shot
apiVersion: "0.0.5"
description: |
  Build a production Forge app from a conversation, in ONE get-it-right loop:
  SCOPE → SCAFFOLD → VERIFY GREEN → FAN OUT → SYNTHESIZE → VERIFY.

  One node, one thread, one arc. The agent scopes with the user, writes FORGE_PLAN.md,
  lays the substrate (protos + migrations + `forge scaffold`, the interactor/custom-RPC
  packages, the error/reason vocabulary, the frontend branding), brings the
  deterministic gate green, and only THEN fans out one sub-agent per seam before
  synthesizing and verifying.

  The substrate must be green before fan-out — units built on an unstable substrate
  drift into inconsistent error handling, styling, and duplicate components. That
  ordering is carried as an INSTRUCTION in the brief rather than as a node boundary.

  The review runs with REAL TEETH: it opens the LIVE app and runs commands itself, and
  its rubric covers hardening. The loop's EXIT bar stays "correct and complete" — a
  hardening finding rides into the next attempt instead of raising the bar to clear.

  The app is LAUNCHED and its preview URL posted last, so the run ends on a link that
  serves the build which actually shipped.

  ## VERY IMPORTANT
  Please it's very important you follow these instructinos, and relay them to any sub agents you spawn:

  IMPORTANT: in Go and TypeScript, navigate with the `code_context` TOOL — not rg,
  and not by hand-running gopls. One call returns the definition, its source, and a
  3-level call map, which is otherwise a turn per hop:

      code_context(symbol: "ResolveDaemon")            # definition + caller map
      code_context(symbol: "X", want: "callees")       # what it calls
      code_context(symbol: "X", want: "implementations")
      code_context(symbol: "X", file: "svc.go")        # disambiguate a common name

  IMPORTANT: never walk callers with rg. A call site does not name its receiver's
  type, so rg matches every same-named method and the error compounds at each level.
  rg stays correct for name lookup, full-text search, and other languages.

# When this one-shot pipeline completes, the chat permanently transitions to the
# interactive agent so the user can keep talking to their finished project.
transition_to: builtin://agent

entry: [build_app]

inputs:
  model:
    type: model
    description: Model for all phases
    default:
      tags: [flagship]

  mode:
    type: enum
    ui: toolbar
    default: auto
    description: Execution mode for agent steps
    enum: [manual, auto]

  ask:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review after each get-it-right iteration

  # `ask` and `unattended` are NOT the same switch and must not be merged.
  # `ask` decides whether an iteration PAUSES for review when a human is there.
  # `unattended` states that there is no human at all — so `ask_user` cannot be
  # answered and every checkpoint resolves with no answer instead of waiting.
  # A run with ask=false is still interactive; a run with unattended=true is not.
  #
  # No passthrough entry is needed: the runtime propagates `unattended` into every
  # sub-workflow, loop body and spawned agent, monotonically (see
  # internal/workflow/runtime/unattended.go). That is deliberate — this flag must
  # not be droppable by forgetting a YAML line, which is exactly how `ask` came to
  # be inert on the node that asks the opening question.
  unattended:
    type: boolean
    ui: toolbar
    default: false
    description: >
      No human is available. The agent never blocks: `ask_user` returns
      immediately unanswered and the agent must decide and record why.

  working_directory:
    type: string
    default: "."
    description: Working directory for forge commands

outputs:
  project_root: "{{inputs.working_directory}}"

nodes:
  - id: build_app
    type: workflow
    ref: builtin://get-it-right
    # Thinking is deliberately UNPINNED — the model's own default. This arc spans
    # mechanical generator work AND the fan-out partition, which is the judgment
    # call that sets the wall clock; pinning it for the mechanical half would
    # under-reason the partition. Spawned units resolve their own tier from their
    # preset, and the reviewer runs high (set in get-it-right).
    passthrough: [mode, ask, model]
    args:
      implementer_preset: forge
      # Carry the whole conversation across retries. The arc is cumulative — the
      # scoping conversation, the entities already born, which seams landed. A
      # fresh fork with only the failure log re-derives all of it every iteration
      # and risks re-asking the user what they already answered.
      context_bridge: full
      # db/service-layer carry NO forge/ prefix: forge ships them as emit:both, so
      # reliant surfaces them at their bare path and the synthetic forge/ namespace
      # covers only emit:forge skills. TestBuiltinWorkflowSkillsResolve keeps this
      # honest — an unresolvable name is silently skipped at preload, so the
      # guidance would just never arrive. The list stays SHORT because every entry
      # is delivered on every turn; frontend/design, forge-libraries and the
      # per-unit skills are loaded in prose at the step that needs them.
      skills: [forge, db, forge/proto, forge/architecture, service-layer, forge/frontend]
      # One number for the whole arc. 7, not 5: an iteration now spans scope
      # through synthesis, so convergence matters more than capping cost, and
      # context_bridge:full makes late attempts resume rather than re-derive.
      max_retries: 7
      # FORGE_PLAN.md is checked first: this loop owns the scoping conversation and
      # the plan is the only artifact carrying its decisions to the fan-out units.
      # Skipping it fails silently — the units read nothing and invent their scope.
      lint_command: "export PATH=\"$HOME/go/bin:$PATH\" && cd {{inputs.working_directory}} && { [ -s FORGE_PLAN.md ] || { echo 'FORGE_PLAN.md is missing or empty — write the plan before the gate can pass'; exit 1; }; } && reliant forge generate && reliant forge lint"
      build_command: "export PATH=\"$HOME/go/bin:$PATH\" && cd {{inputs.working_directory}} && reliant forge build"
      # The born CRUD tests are forge's own output, and the only check that a
      # generated Create works against the schema forge derived from the same
      # proto. Without this the loop goes green with its whole suite failing.
      test_command: "export PATH=\"$HOME/go/bin:$PATH\" && cd {{inputs.working_directory}} && task test"
      # The command the REVIEWER runs to bring the app up, handed over verbatim.
      # `env down` first because this loop iterates: forge allocates a NEW
      # ephemeral port every `run`, so a second start without a stop leaves two
      # stacks up and the browser can land on the older one. `;` rather than `&&`
      # because "nothing was running" is the expected answer on iteration 1.
      start_app_command: "cd {{inputs.working_directory}} && reliant forge env down dev; reliant forge run"
      # ── Review TEETH ──────────────────────────────────────────────────
      # Browser tools to snapshot the LIVE app + a shell. Without these the
      # reviewer can only trust the implementer's self-report. Deliberately no
      # write/edit — the reviewer diagnoses, it does not fix.
      review_tools:
        - view
        - tag:shell
        - component_library
        - mcp__chrome-devtools__take_snapshot
        - mcp__chrome-devtools__take_screenshot
        - mcp__chrome-devtools__new_page
        - mcp__chrome-devtools__navigate_page
        - mcp__chrome-devtools__select_page
        - mcp__chrome-devtools__list_pages
        - mcp__chrome-devtools__list_console_messages
        - mcp__chrome-devtools__click
        - mcp__chrome-devtools__fill
        - mcp__chrome-devtools__evaluate_script
      # A verdict cannot be submitted without inspection_evidence — the "no
      # snapshot in the thread = INVALID" rule, enforced by the schema.
      review_response_schema:
        type: object
        required: [grade, strategy, feedback, inspection_evidence]
        properties:
          grade:
            type: string
            enum: [pass, pass_with_suggestions, fail]
            description: "pass — correct, no blocking issues. pass_with_suggestions — correct, minor improvements. fail — blocking issues."
          strategy:
            type: string
            enum: ["pass", "continue", "refactor", "stuck"]
            description: |
              "pass" — correct and complete; break the loop.
              "continue" — incomplete/minor issues; loop back to implement.
              "refactor" — fundamentally wrong; the refactor agent undoes the work, next attempt starts fresh.
              "stuck" — LAST RESORT: refactor already failed on the same problem, OR the blocker is tooling/environment (e.g. the app genuinely will not start), not the code. Record what you observed in inspection_evidence even when stuck.
          feedback:
            type: string
            description: |
              Detailed feedback for the next attempt. For EVERY miss, classify it as
              forge-gap (the generated starting point made it hard) / unclear-direction
              (the prompt/skill never said it) / LLM-slip (guidance existed, the agent
              missed it) — that classification is the signal that drives fixes. On FAIL,
              diagnose WHY before recommending a redo; never ask for a blind re-run.
          inspection_evidence:
            type: object
            description: "Proof you verified with your OWN eyes. A verdict with empty/fabricated evidence is INVALID."
            required: [live_url, pages_inspected]
            properties:
              live_url:
                type: string
                description: "The LIVE ephemeral app URL you actually navigated to — obtained from `reliant preview-url <the port the dev server actually bound>` or `reliant forge env status` — NOT a hardcoded localhost guess, and not a guessed port."
              pages_inspected:
                type: array
                minItems: 1
                description: "Every key page you ran take_snapshot AND take_screenshot on. Empty means you did not inspect — INVALID. A page that failed to load is still a valid entry (record the failure)."
                items:
                  type: object
                  required: [path, observed]
                  properties:
                    path:
                      type: string
                      description: "Route you loaded on the live URL (include the edge/deviation-state record pages, not just index pages)."
                    observed:
                      type: string
                      description: "What the snapshot + screenshot actually showed: did real data render? console errors? broken layout?"
              checks_run:
                type: array
                minItems: 1
                description: "Build/test commands YOU ran yourself (not the implementer's report), with results."
                items:
                  type: object
                  required: [command, exit_code]
                  properties:
                    command:
                      type: string
                    exit_code:
                      type: integer
                    observed:
                      type: string
                      description: "Key output or failures."
      review_instructions: |
        You are reviewing ONE loop that runs the whole arc: scope → scaffold → green
        gate → parallel per-seam fan-out → synthesis. Verify BOTH surfaces WITH YOUR
        OWN EYES — never accept the implementer's self-report.

        **First, establish WHERE the arc stopped.** The implementer may hand back a
        project that is only scaffolded — theme branded, handlers still forge-stamped
        stubs, no page features. That is NOT a pass and NOT a forge-gap: it is the arc
        left unfinished, and the verdict is `continue` with the remaining seams named.
        `grep -rn 'forge:gen unwired-stub symbol=' internal/handlers/` answers it in one
        command — outstanding markers on RPCs the plan calls for mean the fan-out never
        landed. Say so plainly instead of grading a scaffold as the product.

        **A verdict with no inspection evidence is INVALID.** Populate
        `inspection_evidence` from your OWN tool calls before you submit — the schema
        will not accept a verdict without it. Do at least one full cycle:

        1. **Start the app YOURSELF, then get its LIVE URL — the port is EPHEMERAL, so
           never assume 3000.** The start command is above; run it with the shell tool,
           FOREGROUND. **`forge run` does NOT stay alive**: with no TTY (every agent
           shell) it starts every host service and frontend, detaches them onto their own
           log files, prints their ports, and RETURNS 0. Backgrounding it hands you an
           already-exited pid and buries the port line. So the ports are in the output
           you just got back — forge prints `[up] frontend <name>: ephemeral dev port
           <N>` — and each server's own log file carries its `- Local:
           http://localhost:<N>`. Use THAT port, then get the proxied URL:
           ```bash
           reliant preview-url <the port the dev server actually bound>
           # or, if that returns nothing:  reliant forge env status <env> --json
           ```
           Use it as `live_url` and navigate there. Call `preview-url` ONCE: the start
           command binds localhost-only, so "no proxied URL" is EXPECTED — take
           `http://localhost:<N>/` and move on. **A 200 is NOT proof.** Confirm the page
           is the app under review (title/nav/routes), not merely that something
           answered: a measured `curl localhost:3000` returned 200 from an entirely
           different app holding the port, and a FALSE GREEN is worse than a failure. If
           pages render but every request fails, it is CORS — a FORGE DEFECT to report,
           never to route around. **Never export an env var to fix it**: every config
           value is declared in KCL, and a shell variable that changes behaviour hides
           the generator gap. Do not edit pages to hide it either.
        2. **Snapshot every key page yourself.** Call BOTH `take_snapshot` (a11y tree)
           AND `take_screenshot` (pixels) on each key page, INCLUDING edge/deviation-state
           records (a terminal-state entity, an empty relation) — not just index pages.
           Record each in `pages_inspected`, and check `list_console_messages`. An
           implementer once fabricated snapshots, so a claim is not evidence — only your
           own tool call is.
        3. **Do NOT re-run the gate.** lint / test / build already ran as ENGINE steps
           and their exit codes are the check summary above — the loop trusts those same
           codes for its control flow, and an agent cannot fabricate them. Run a command
           yourself ONLY when the summary says a check is `not configured`, or when you
           need output the exit code does not carry. Record it in `checks_run`.

        Your snapshots are the evidence the gate CANNOT produce — that is what this
        review is for.

        **Pass if:**
        - The app looks like a real product, not raw scaffold; navigation works; pages
          load; layout is consistent; every frontend builds
        - CRUD pages display real data via the generated Connect RPC hooks, and forms
          submit through those hooks end-to-end
        - HIGH-priority features from FORGE_PLAN.md are implemented with real business
          logic (not stubs) and wired into the UI
        - Protected endpoints enforce the authorization the plan calls for, and
          owner-scoped queries filter by the authenticated user
        - Entities follow the two-halves rule from the forge db skill: CRUD RPCs in a
          service proto AND a matching table in the migrations

        **A dev browser carries NO identity.** The scaffolded auth provider holds no
        credential and says so in the BROWSER CONSOLE on the first call needing one — a
        runtime `console.warn`, so it never appears in build output and
        `list_console_messages` is the only place you will see it. Any endpoint whose
        handler requires a caller returns 401 in a dev browser, and any role-bound rule
        is unobservable there. Verify authorization with tests that build an explicit
        context per role — never by dev pixels, in either direction. A page that 401s is
        evidence about the missing credential, NOT about the rule.

        **Hardening rubric — a CHECKLIST, not an exit bar. Walk all of it every
        iteration and write findings into `feedback`,** naming the file and the fix:
        - **Error handling** — do handlers return typed `svcerr` errors carrying the
          app's reason codes, and does the UI render them? Or does a failure surface as
          a blank page, a swallowed promise, or a raw internal message?
        - **Input validation** — is every user input constrained where it belongs
          (protovalidate on the proto, zod on the form, the check in the handler)?
        - **Edge cases** — empty states, a terminal-state record, an empty relation,
          boundary values. You are already loading those pages for the evidence above.
        - **Security** — no unsanitized input reaching a query, no secret in a read
          response, owner-scoped queries filtering by the authenticated user. (An
          endpoint left wide open where the plan requires authorization is not a rubric
          item — it is in the fail list.)
        - **Tests** — do the critical business paths have tests?
        - **Integrations** — anything the plan calls for (email, webhooks, a
          third-party client) that is stubbed or faked rather than wired.

        **A rubric finding NEVER sets `strategy` on its own.** The exit bar is the "Only
        fail if" list and nothing else. Widening it to production-hardening would make
        every finding cost another full implement→review iteration, and a loop that ends
        less often ships less. When the loop iterates ANYWAY, your findings ride along as
        targeted fixes; when it ends, they stand on the record for the user and the agent
        that takes the chat over. Grade them `pass_with_suggestions`.

        **Do NOT fail because:**
        - A rubric finding above is open — record it, do not gate on it
        - LOW/MEDIUM-priority plan features aren't handled; HIGH priority is the MVP bar
        - `scaffold-not-customized` warnings remain on handlers the plan never asked for

        **Only fail if:**
        - UI looks like raw boilerplate, navigation is broken, or pages crash
        - A frontend doesn't build, or backend generate/lint/test/build fails
        - Generated hooks aren't being used (manual fetch calls instead)
        - HIGH-priority features are missing or faked (client-simulated effects)
        - Protected endpoints are wide open where the plan requires authorization
        - Required entities/services from FORGE_PLAN.md are missing, or FORGE_PLAN.md is
          absent

        For EVERY miss, classify it — forge-gap / unclear-direction / LLM-slip. That
        classification drives the source fix. On FAIL, diagnose WHY before recommending
        a redo — never ask for a blind re-run.
    thread:
      mode: inherit
      inject:
        role: user
        content: |
          **IMPORTANT: This is a brand new project — no users, no legacy code. Do NOT add fallbacks or backwards compatibility. Fix root causes, delete unused code, use clean implementations.**

          ## Build the Forge App — Scope, Scaffold, Fan Out, Synthesize

          You own the whole arc in ONE thread: work out what to build with the user, lay the
          substrate, bring it green, then fan out the feature work across independent seams
          and synthesize the result.

          **The substrate must be GREEN before you fan out.** Units built on an unstable
          substrate drift into ad-hoc error handling, mismatched styling and duplicate
          components, and every such drift is repaired serially at synthesis. Steps 1-7 lay
          it; the gate at the end of Step 7 is the line. Do not spawn a unit before it is green.

          {{inputs.unattended ? '**There is NO human in this run — do not call `ask_user`.** It is wired to return immediately with no answer, so calling it buys nothing and costs a turn. Settle every open question yourself from the opening message and from what the domain obviously requires. **Record every decision you had to make without the user in `FORGE_PLAN.md`, under a `## Decisions made without the user` heading — the decision AND the reason.** That section is the only thing that distinguishes a choice you invented from a choice the user made, so a plan that hides an invented decision inside a confident-sounding spec is a defect, not a tidy plan.' : '**Start by talking to the user — you have `ask_user`.** Do not guess your way into a schema. Ask what you genuinely need and cannot infer, in as few rounds as possible. **An explicit instruction in their opening message is the answer — do not ask about that topic at all.** This is not "ask anyway, but shorter": if they named the visual style, do not ask about branding; if they named the entities, do not ask what to model; if they said not to block on them, do not raise a gate. Re-asking what they already told you reads as not having listened. If the opening message settles everything, ask nothing and go straight to FORGE_PLAN.md.'}}

          Two surfaces have to be SETTLED before you write FORGE_PLAN.md — from what the
          user already said, by asking, or by your own judgement:

          - **Functionality & data** — what entities, fields, relationships? What operations
            beyond CRUD? Which pages matter most? Any integrations?
          - **Branding & visual style** — a site or brand guidelines to match? Apps whose
            look they like? Overall feel — minimal, bold, corporate, playful? Colors, fonts,
            a logo?

          **Write your understanding to `FORGE_PLAN.md`** in `{{inputs.working_directory}}`
          before building. It is the written spec: you read it at fan-out to derive the work
          list, and every unit reads it for scope. **It is yours to revise** — you are in ONE
          continuing thread, so when running forge teaches you something the conversation
          could not (two entities can't both name a status the same way, a field needs a
          different type, a list needs a filter nobody mentioned), change the plan and say
          what changed. A plan that quietly disagrees with the code is worse than no plan.

          **What forge gives you for free — never ask about these.** HTTP server with Connect
          RPC, JWT authN middleware, CORS, logging, tracing, PostgreSQL + ORM, OpenTelemetry,
          Docker, CI/CD, Next.js frontend with TypeScript client + Tailwind, workers, webhooks,
          K8s manifests, code generation, dependency injection, test harness, mocks.

          **Web research sharpens decisions; it is not browsing.** `websearch` and `fetch`
          earn their keep when the domain is unfamiliar — how real systems in it shape their
          data, a domain term, a regulatory constraint. A few targeted lookups that change a
          decision, never a substitute for asking the user.

          **Step 0: Work from the source of truth, not from memory.** Load the `forge`, `db`,
          `forge/proto`, `forge/architecture`, `service-layer` and `forge/frontend` skills.
          They ship inside the forge binary this project is generated with, so they always
          match its conventions. If anything here disagrees with a loaded skill, the skill wins.

          **They are NOT in your context on turn one, and that is not a mistake.** forge's
          skills are surfaced through the PROJECT — the directory has no `forge.yaml` until
          you create it, so there is no forge skill catalog to preload from yet. Run
          `reliant forge project new` FIRST (Step 1); the catalog picks the project up
          immediately after, so load them in ONE turn and work from them for everything else.
          Check you can actually see them rather than assuming they arrived.

          **Do NOT over-deliberate the annotation surface.** Reasoning about which
          combination of markers, protovalidate constraints and filter tags forge accepts is
          the slowest way to find out. DRAFT the proto, run `reliant forge generate`, read
          what it says. It is the empirical oracle — one run beats ten paragraphs.

          **`forge/pkg` already ships the infrastructure.** Load the `forge-libraries` skill:
          it indexes every `forge/pkg/*` subpackage — errors (`svcerr`), CRUD (`crud`),
          validation (`validate`), the test harness (`testkit` / `tdd` / `pgtest`),
          middleware, config, observability (`observe`). Import what exists; hand-author ONLY
          what does not. Re-implementing a `forge/pkg` helper is a defect. Brief every unit
          the same way.

          **Scaffolding is ONE verb, and arity picks the mode.** `reliant forge scaffold` with
          no noun sweeps every `// forge:entity` marker and births what is missing;
          `reliant forge scaffold <noun> ...` scaffolds exactly one thing (entity, service,
          worker, frontend, rpc, package, ...). Project-wide operations stay under
          `reliant forge project ...`. There is no `forge project add` and no
          `forge project scaffold` — both were removed, and an unknown subcommand exits
          non-zero rather than printing help.

          **If a command errors as unknown, STOP and report it — do NOT hunt for an older
          spelling.** `reliant` embeds forge, so `reliant forge` is a COPY compiled into this
          binary, not a call out to whatever `forge` is on PATH. Built at different times they
          are DIFFERENT FORGES. A run that quietly falls back to an older spelling scaffolds
          against that older forge and measures nothing — report it, never work around it.

          **Await idiom — the discipline is about TURNS, not seconds.** Commands are fast
          (`generate` ~10s, `lint` ~17-20s, `build` ~28-35s), so do not restructure around
          latency. Turn churn is what costs: if you background a command, launch it ONCE with
          a generous timeout and block on its completion signal — no separate wait-loop, no
          re-polling after the signal (re-polling burned ~1/3 of one run's tool calls).
          SUB-AGENTS must NOT background at all: a leaf that backgrounds and yields silently
          ENDS its turn and strands the phase. FOREGROUND is the default for you too, and
          there is nothing here to background — `reliant forge run` included. **`forge run`
          does NOT stay alive:** your shell has no TTY, so it starts every host service and
          frontend, hands each its own log file, prints the ephemeral ports, and EXITS 0 while
          the servers keep running. Background it and you get an already-exited pid and a port
          line buried in a buffer. Run it FOREGROUND, read the ports off its output, stop the
          servers with `reliant forge env down dev`.

          **Issue the calls you have ALREADY decided in ONE turn.** Three edits to the SAME
          file (an import, a `Deps` field, its `validateDeps` branch) are one turn of three
          `edit` calls, not three turns of one. This applies ONLY to calls whose inputs you
          hold: NEVER batch a call whose input depends on the previous call's result, and
          never batch a gate with the edit it is checking.

          **Read before you overwrite.** Almost nothing you edit here is a new file:
          `project new`, `db migration new` and `forge scaffold` pre-create the service
          protos, migration stubs, `db/seeds/vocab.yaml`, `forge.yaml`, the born handler and
          `contract.go` files, `globals.css`, `nav.tsx` and `layout.tsx`. Write does NOT
          reject an unread overwrite — it replaces the file and hands back the diff of what it
          destroyed, so you pay those tokens on every artifact clobbered unseen. Only the Read
          TOOL records awareness; `cat`, `head`, `grep` and `sed` do not. Batch the Reads UP
          FRONT for anything you intend to replace wholesale. For a partial change use the
          `edit` tool — no read gate, and the right tool for the theme / nav / `Deps` edits
          anyway.

          **Step 1: Create the project IN PLACE at the working directory.**
          ```bash
          cd {{inputs.working_directory}} && reliant forge project new --in-place --force --mod github.com/user/<project-name> --service <service-name> --frontend dashboard
          ```
          Pick names from what the user described. `--in-place` puts `forge.yaml` at the
          working directory so every later command runs there; `--force` makes re-runs
          idempotent if this loop retries.

          **Step 2: Author the protos, then scaffold the whole app in ONE command.**
          - Proto is the surface you author. The two truths are proto (wire) and migrations
            (schema); forge projects everything else from them.
          - Write each entity from FORGE_PLAN.md as a message with its fields, marked
            `// forge:entity`. Add any custom (non-CRUD) RPCs too.
          - **Model with markers + protovalidate — don't hand-fix after scaffold.** The db
            skill documents each: protovalidate `(buf.validate.field)` constraints (money
            `>= 0`, email, string lengths → DB CHECK + zod + wire); `// forge:secret` on
            credential fields (kept out of read responses, preserved on update);
            `// forge:server-set` on server-authoritative fields (status, computed prices,
            lifecycle timestamps) so they are excluded from Create/Update input — do NOT
            hand-strip fields from a Create request AFTER scaffold, it breaks the born
            new-page and test; `// forge:append-only` on ledger entities; opt-in
            `// forge:soft-delete` where the domain needs it. Check domain defaults match the
            plan: a gate flag like `rx_required` must default to the SAFE direction, not
            proto3's zero value.
          - **Never hardcode proto field tags when adding List filters.** forge auto-derives
            filters from scalar entity fields, which shifts tags. READ the generated
            `List<Entity>Request` and append at the next FREE tag.
          - **Author the List filters your UI will need AT BIRTH.** forge derives them only
            from scalar/bool fields, NOT from enums or foreign keys. If the UI will facet a
            list by an enum or show a per-owner view keyed on `<owner>_id`, add those fields
            to the request message now. Later frontend work reads protos and cannot edit them,
            so a filter missing here becomes a client-side truncation bug downstream.
          - An informational `Schema drift` notice where `generate did not fail` is NOT a gate
            failure — record it and move on.
          - Then scaffold everything the protos imply:
            ```bash
            cd {{inputs.working_directory}} && export PATH="$HOME/go/bin:$PATH"
            reliant forge scaffold
            ```
            This births every `// forge:entity` message (create-table migration + CRUD
            quintet, both halves owned at birth) and runs `forge generate`. Custom RPCs
            surface as correctly-signed pb-through stubs. Re-running is a safe no-op. This is
            the only entity-birth path — there is no `field:type` shorthand, because such a
            pair cannot spell an enum, a nullable, a validation rule or a reference.
          - Add relationships, indexes and constraints with hand-written migrations per the
            db skill.
          - **Authentication is owned code in `internal/app/auth.go`** (`SetupAuth`, default
            JWT), scaffolded once. Leave it as scaffolded unless the plan needs otherwise.
          - Prefer 1-2 services, 1 frontend. Be ambitious — Forge handles the heavy lifting.

          **Step 3: Fill `db/seeds/vocab.yaml` while the domain is fresh.** Fill in
          domain-noun pools for the columns whose values the seeder cannot invent — product
          names, compound names, brands — so seeded rows speak the project's domain. A few
          pools of 5-10 real terms each is enough; forge validates every value against the
          column's constraints and handles emails, people, addresses and referential
          integrity itself. This is vocabulary, not seed data. Seed ROWS are never your job:
          `reliant forge run` migrates AND, on first boot against an empty dev database,
          auto-seeds deterministic rows from this file.

          **Step 4: READ the schema forge drafted, and correct it HERE — the only cheap
          place.** `forge scaffold` derived those migrations from your proto. That derivation
          is a CONVENIENCE, not a source of truth: **the SQL is the schema.** forge projects
          the ORM, the CRUD conversions and the born pages from the APPLIED schema, so a
          column birth guessed wrong is wrong for the whole app and no proto edit corrects it.
          Birth hands you a plausible FIRST DRAFT. Nothing so far has read it.

          Read it now, because the price only goes up. Today a wrong column is ONE edit to a
          `.up.sql` nothing has been built on; after the fan-out it is a second migration plus
          a cascade through handlers, pages, hooks and tests. (The db skill's "migrations are
          append-only" rule governs a MERGED migration other clones depend on. This project
          has neither, so the window is open exactly now.)

          ```bash
          cd {{inputs.working_directory}} && ls db/migrations/*.up.sql
          ```
          READ every file that lists — with the Read tool, so you can edit it afterwards. Then
          answer these, per table, per column:

          - **Does the TYPE mean what the domain means?** `JSONB` is what birth emits for a
            repeated or nested message, because a proto field is all it has to go on; whether
            those rows deserve their own table is a decision only you can make. Know what the
            JSONB column does NOT cost first: the generated conversions round-trip a repeated
            message through `orm.MarshalJSONBList` / `orm.UnmarshalJSONBList`, so the field
            moves over the CRUD path intact either way. What a document cannot have is a
            reference on the ids inside it, a CHECK or index on one of its fields, or a query
            that filters or joins on one — that, and nothing else, is the trade. Money: proto
            has no fixed-point decimal, so the correct idiom is an integer minor-unit field
            (`int64 amount_cents`), which birth turns into an exact `BIGINT`. A `double` money
            field is not a looser version of that — it is the defect, a `DOUBLE PRECISION`
            inexact on every value it stores. `NUMERIC(12,2)` has no proto spelling either and
            must be written by hand.
          - **Is it NULLABLE where the domain requires a value** — or NOT NULL where the
            domain genuinely has none to give?
          - **Is a UNIQUE the domain implies missing?** A natural key nothing enforces — an
            email, a slug, a code, one row per pair — becomes duplicate rows no later step can
            clean up. Proto has no spelling for UNIQUE at all: single-column, composite
            (`UNIQUE (tenant_id, slug)`), partial (`UNIQUE (email) WHERE deleted_at IS NULL`),
            and the plain multi-column index a compound lookup needs all exist only if you
            write the SQL.
          - **Is a CHECK the domain implies missing?** A quantity that cannot go negative, a
            vocabulary with a legal set — protovalidate carries those field by field. What it
            cannot carry is a rule comparing two columns (`due_at > issued_at`): there is no
            cross-field spelling in proto, so that CHECK exists only if you add it.
          - **Do the relationships POINT WHERE THE DOMAIN MEANS?** Birth already WROTE the
            `FOREIGN KEY` and its index — live SQL in the `.up.sql`, applied on the first
            migration — for every `*_id` whose stem resolved to a table it knows. Where the
            referenced table is born by a LATER migration, the index is here and the
            constraint is in that table's birth migration. Where the stem resolved to nothing
            (a polymorphic id, an `owner_id` that is no `owners` row), birth wrote NOTHING on
            purpose, because a reference to a table that does not exist is a worse defect than
            an absent constraint. So this is two jobs, neither accepting a suggestion: confirm
            every constraint that IS there points where the domain means, and write the
            `ALTER TABLE … ADD CONSTRAINT … FOREIGN KEY` plus its index for every real
            relation birth left unconstrained. What birth never carries is a referential
            action — proto has no field for "and delete these too," so a parent the domain
            means to cascade stays `NO ACTION` until you say otherwise.
          - **Would a row built from this schema ALONE be a row your own RPCs accept?**
            Anything generating data reads only the column's type, constraints and DEFAULT. A
            DEFAULT the domain rejects, or a status whose zero value is not a legal starting
            state, yields rows that exist and then fail the first real operation.

          **Correct what is WRONG for this domain. Do NOT redesign.** Every edit must trace to
          something the plan says; if you cannot name the domain rule it serves, do not make
          it. Do not rename for taste, add columns for features nobody asked for, restructure
          a table that fits, or delete anything in order to have deleted something. Owning a
          file means you may CORRECT it — it does not make it a blank page. If a correction
          changes which columns need a noun pool, update `db/seeds/vocab.yaml` in the same pass.

          **A `forge generate` that REFUSES a field is this review talking — not a broken
          toolchain.** A proto field paired with a column nothing can carry a value between is
          DEAD over the API. forge fails the generate rather than ship that, and names the
          message, field, table, column, declared SQL type and reason — every such pair at
          once. The fix is a line in the `.up.sql`, or the proto field beside it. Never a
          flag, never a hand-written conversion, never a retry. If you cannot tell which side
          is wrong, write that down and stop.

          **Correcting the schema invalidates the born CRUD test — update its fixture literals
          in the same edit.** `internal/handlers/<svc>/handlers_crud_test.go` is scaffolded
          ONCE and yours from line one, and its fixtures were derived from the schema AS BORN:
          literals satisfying the CHECKs that existed then, and a seeded parent row for each
          reference that existed then. That derivation runs on first scaffold ONLY, so a
          corrected schema leaves fixtures nothing will refresh and the next `task test` fails
          in `TestCRUD_<Entity>_Lifecycle` on the constraints you just added, with nothing
          saying why. Deleting the file does NOT bring it back: `forge generate`,
          `forge scaffold` and `forge generate --force` all treat "scaffolded once, now
          absent" as your own deletion and leave it deleted — the scaffold-once contract, not
          a bug to route around. Open it, change the literals the new constraint rejects, and
          add an `INSERT` for any newly required parent row.

          **Done when the corrected schema is green:**
          ```bash
          export PATH="$HOME/go/bin:$PATH" && cd {{inputs.working_directory}} && reliant forge generate && reliant forge lint && task test && reliant forge build
          ```
          That is the gate, run HERE for the first time rather than only at the end, because a
          schema defect that survives into the steps below has already spread.

          **Then answer the last question with a row, not by reading.** A green gate says the
          schema is coherent and the code compiles against it. It does NOT say a row built
          from that schema alone is a row your RPCs accept — the born CRUD test builds its
          fixtures FROM the schema, so it agrees by construction. Seeding disagrees: it
          synthesizes rows from nothing but types, constraints and DEFAULTs, and inserts them
          in dependency order, so a combination the schema permits and the domain forbids
          becomes a row you can look at.

          The seeder needs a live, MIGRATED database and nothing above leaves one: the born
          tests boot a throwaway postgres inside the test process, and `forge generate`
          introspects a scratch shadow database it then drops. `forge run` creates the dev
          database, applies the migrations on boot and seeds it — and it detaches its servers
          and returns rather than staying alive, so it needs stopping.

          ```bash
          cd {{inputs.working_directory}} && reliant forge run && reliant forge db seed apply; reliant forge env down dev
          ```
          Two outcomes belong to THIS step, both schema edits in the window still open:
          - **A refusal naming a reference diamond.** A table reaching one parent by TWO
            routes — a direct `<parent>_id`, and a second reference whose own row carries a
            `<parent>_id` too — carries a rule the schema implies and never states: whether
            the two must agree, and if so which is the truth. Nothing in the DDL says, so
            seeding the routes independently produces rows that contradict each other.
            `db seed apply` refuses rather than write them, and prints the declaration to
            paste: `COMMENT ON CONSTRAINT … IS 'forge:ref derived-from=<column>'` (or
            `authoritative`, or `independent`). Put it in the `.up.sql` — it is a fact about
            the schema, not a preference about seeding. Only walking the reference graph
            surfaces this; reading migrations one at a time cannot.
          - **Rows that are legal and wrong.** A total with no line items. A status your flow
            cannot legally start in. A quantity of zero on a row that means something shipped.
            Each is one CHECK or one DEFAULT away from impossible, and each would otherwise be
            found by whichever fan-out unit first called the RPC that rejects it.
          Fix what it finds in the migration, re-run the affected lanes, seed again. **Then
          stop reviewing the schema.**

          **Step 5: Birth the remaining packages with forge COMMANDS — do not hand-author.**
          - Custom (non-CRUD) RPC a HIGH-priority feature needs that isn't in the protos:
            `reliant forge scaffold rpc <service> <Name>` writes the correctly-signed handler
            stub to its own `rpc_<snake_name>.go` and PRINTS a proto snippet — never
            hand-write Connect signatures. Leave the body a stub; a fan-out unit implements it.
            **It does NOT edit the .proto, and the snippet is a skeleton — budget for the
            messages.** That is deliberate (proto files have hand-curated section markers an
            injector would regress), so the snippet arrives as
            `rpc Foo(FooRequest) returns (FooResponse);` plus two message blocks whose bodies
            are `// TODO: request fields`. YOU paste the rpc line into the `service { … }`
            block and author every field, and only then does `forge generate` produce the pb
            types the stub already imports. A measured run hand-authored 8 such messages; plan
            that work here rather than discovering it mid-fan-out.
            **Order decides the file layout.** Scaffold the RPC BEFORE it is in the proto and
            you get the disjoint `rpc_<name>.go` above. Declare it in the proto first and the
            next `forge generate` APPENDS its stub to the shared
            `internal/handlers/<svc>/handlers.go` — the file the fan-out then has to
            pre-split. Prefer scaffold-first; it costs nothing. **Both paths stamp
            `// forge:gen unwired-stub symbol=…`,** so every unimplemented stub is visible to
            the fan-out query. Leave the marker on — stripping it, or hand-writing a
            placeholder body over it, silently drops that RPC off the work list.
          - Orchestration/composition (multi-adapter flows, state machines, use cases): author
            NOTHING by hand in a new `internal/` package. Run
            `reliant forge scaffold package <name>` FIRST — the DEFAULT shape is the one you
            want (an orchestrator is just a service whose deps are other services' interfaces,
            so there is no separate flag) and it scaffolds contract.go + service.go + test with
            the `// forge:constructor` marker and svcerr wiring correct — then EDIT the born
            files. Package names are one lowercase word, NO underscores. A fan-out unit fills
            the body later. (The one package you DO hand-author is the constants-only reason
            vocabulary in Step 6 — forge has no command for it because it declares nothing to
            wire.)
          - Then run ONE `reliant forge generate` so the fan-out units all work against a
            single stable generated surface.

          **Step 6: Edit the born backend files — shapes and values, not new substrate.**
          - **A service IS its handler package `internal/handlers/<svc>/` — and it has NO
            `contract.go`.** forge already wrote `service.go` (the `Deps` struct, the concrete
            `Service` STRUCT, `New(Deps) (*Service, error)` + `validateDeps`), delegated every
            CRUD RPC through the owned `handlers_crud.go`, and appended a correctly-signed,
            `Unimplemented`-returning stub to `handlers.go` per custom RPC. The `*Service`
            methods ARE the handlers. Do NOT create a `contract.go` here: forge's pre-codegen
            contract check HARD-FAILS generate with
            `forgeconv-internal-package-contract-names`.
          - **Leave every stub body EXACTLY as forge wrote it — the stub IS the handoff.**
            forge stamps each with `// FORGE_SCAFFOLD: …` and
            `// forge:gen unwired-stub symbol=<pkg>.<Method>`, and that marker is what you
            QUERY at fan-out. Do not replace the body with your own `return nil, fmt.Errorf("…
            not implemented")`, do not leave a prose TODO naming who should implement it, and
            do not delete the marker. A hand-written body is not neutral: `forge generate`
            treats ANY existing `*Service` method as implemented, so your placeholder
            permanently SUPPRESSES both the marked stub and the born
            `handlers_scaffold_<rpc>_test.go` for that RPC. A measured run did exactly this
            and produced a handler package containing zero markers.
          - **What you actually shape here is `Deps`.** For each Step-5 package a service will
            call, add its interface-typed field to that handler's `Deps` plus the nil-check in
            `validateDeps()`. `forge generate` resolves the field BY TYPE in the regenerated
            `internal/app/compose.go` — no wiring to hand-write. **Fixing the dep surface NOW
            is the rule that governs**: it lets per-service units fill bodies in parallel
            without colliding on the struct, so add every field the plan calls for in this
            serial step. The constraint that goes with it is **every field you add must
            RESOLVE, in this same pass.** forge recognises these providers, one per field:
            1. **Another registered component**, matched by its `Service` interface type — the
               packages Step 5 birthed.
            2. **A GENERATED STORE from `internal/db/store_gen.go`** — `db.<Entity>Store` for
               one entity, or `db.Store` (accessor per entity) for a service that genuinely
               spans tables. **This is how a package reaches the database, and it needs NO
               Infra field and NO construction** — forge resolves it from the ORM client it
               already owns. Just declare the field. **Do NOT hand-write a Store interface and
               a passthrough adapter over the ORM**: two measured runs did, for 723 and 464
               lines of one-line passthroughs (`return db.GetEstimateByID(ctx, s.db, id)`) and
               ~16 minutes almost entirely in working out the ORM surface. The store holds the
               handle, so calls take only your arguments
               (`s.deps.Estimates.GetEstimateByID(ctx, id)`), and `WithTx(tx)` rebinds for a
               transaction. A query the generated CRUD cannot express (a join, an aggregate,
               raw SQL) goes in that entity's scaffold-once
               `internal/db/<entity>_repo_ext.go` seam.
            3. **An assignable field on the owned `*Infra` struct in
               `internal/app/providers.go`** — for anything with no component behind it (a
               client, a pool, a third-party SDK).
            Anything else HARD-FAILS generate with `<Service>.Deps.<Field> has no provider`.
            That error is a complete runbook: it prints the exact Infra field to add, the
            OpenInfra line, and the compose assignment it then does for you. Follow it — never
            delete the Deps field to make it go away, or the seam returns under fan-out
            contention.
          - **Author the shared reason vocabulary in `internal/reasons/`** — a constants-only
            package of the stable snake_case reason codes the app returns, so two seams cannot
            drift into two spellings of the same reason. Hand-author this ONE package: it
            declares no interface and no `contract.go`, so component discovery never treats it
            as something to wire.

          **Step 7: Brand the scaffolded frontend IN PLACE — change values, don't re-author.**
          - **Load the `frontend/design` skill and follow it** — declared type/color system,
            scale floors, restrained color, no hand-drawn SVGs.
          - **forge ALREADY scaffolded the design system** — `globals.css` (a full ~27-token
            `@theme` light+dark palette), `nav.tsx` and `layout.tsx` exist. EDIT them IN
            PLACE: change palette VALUES to FORGE_PLAN.md's branding and relabel. Do NOT
            Write-overwrite or re-author the token structure, and KEEP `nav.tsx` driven by the
            generated `ALL_ROUTES` (hardcoding routes breaks auto-nav when new entities land).
            Add only NEW shared components the page-groups will reuse. Use the `edit` tool:
            rewriting a scaffolded file through a shell heredoc (`python3 - <<EOF`, `perl
            -0pi`, `sed -i`) is how a palette comes back with its indentation mangled —
            measured, and it cost two further turns to repair.
          - **The page tree already mirrors YOUR entities — delete only what the product never
            offers.** forge emits exactly `list` / `[id]` / `[id]/edit` / `new` per
            `// forge:entity` message, plus the dashboard home and Next's framework files.
            There is no scaffolded auth route — sign-in is owned app logic forge does not
            route for you, so do not go looking for one. You declared those entities, so there
            is usually NOTHING extraneous. The real case is an entity exposed for only SOME
            operations: an append-only ledger or a server-managed lifecycle entity has no
            honest `new`/`edit` page. `rm` those and nothing else — every other page you
            remove is one a fan-out unit has to re-author. You OWN every non-`_gen` file; the
            untouchables are forge-regenerated `_gen` files and `src/gen/`.

          ### The substrate gate — this must be GREEN before Step 8 (REQUIRED)
          ```bash
          export PATH="$HOME/go/bin:$PATH" && cd {{inputs.working_directory}} && reliant forge generate && reliant forge lint && task test && reliant forge build
          ```
          **That is the whole gate — all four lanes, and `task test` is one of them.** The
          engine re-runs exactly these after you return, and a red lane costs you a whole
          retry. `task test` runs the born CRUD tests, forge's own output and the only check
          that a generated Create works against the schema forge derived from the same proto.

          The test lane is `task test`, not `forge test`: the project's Taskfile.yml is where
          the suite is DEFINED, so the gate, the local loop and CI run the same commands.

          **Do NOT add a FIFTH command to cover the frontend — these four already do.**
          `forge lint` runs the frontend TypeScript typecheck as its own lane, `task test`
          runs the frontend test lane, and `forge build` runs `next build` for every frontend.
          A separate `npx tsc --noEmit` or `npm test` pass re-checks what the gate just
          checked, and `npx` resolves the compiler off the network instead of the frontend's
          own `node_modules`. `scaffold-not-customized` warnings on still-stub feature
          handlers are EXPECTED here — never fill in business logic to silence them. To
          re-inspect one failing lane use its targeted flag (`forge lint --contract`,
          `forge lint --scaffolds`) instead of re-running full lint.

          **Step 8: FAN OUT — one small, focused sub-agent per seam, as early as possible.**
          The substrate is green and the proto/hooks contract is STABLE. Do NOT rebuild it.
          Create a plan (via the plan tool) with a task per backend concern and per frontend
          page-group, and mark tasks completed as you go.

          **You are the ORCHESTRATOR. Fan out everything independent AS EARLY AS POSSIBLE.**
          Measured: 6 units running concurrently turned 82.7 minutes of serial work into 18
          minutes of wall clock — 4.6x, zero file collisions. How to get there:
          - **Every `spawn` returns a handle IMMEDIATELY — it never blocks.** The child runs
            in the background and its result reaches you in a later turn, so emitting several
            `spawn` calls in ONE turn starts that whole wave at once. This is the default way
            to run a wave.
          - **You stay free while they run.** Read files, write the next brief, and spawn more
            units mid-wave — work discovered later can join an in-flight fan-out. Use
            `spawn_status` to check progress (or `wait: true` when you genuinely cannot
            proceed without an answer), and `spawn_send` to steer a running unit.
          The failure mode is dribbling spawns out one per turn and waiting on each before
          starting the next — that is fully SERIAL execution, precisely what this step exists
          to avoid. Author every brief first, then fan out. Writing ten briefs before the
          first unit starts LOOKS like dead time and is not recoverable by trickling the
          spawns out afterward.

          **A wave costs what its SLOWEST unit costs, so the only thing that matters is that
          no unit is BIG.** Do NOT estimate seam cost and balance the wave — that is guessing
          about work you have not done, and a measured run guessed wrong: the dashboard unit
          (18m27s) and the single backend unit (18m01s) set the floor while four page-group
          units finished in 9-13.6 min and sat idle. Split MECHANICALLY:

          > **A unit owns ONE entity's page-group, ONE backend concern, or ONE page — and
          > nothing owns "everything else".** Eight to twelve units is normal for a 4-entity
          > app. If a brief you are about to write joins two entities with "and", or contains
          > "plus anything remaining", split it again.

          Disjoint FILES are the only hard limit — and the file layout is YOURS to choose. A
          shared file is a reason to pre-split or pre-author THAT FILE, never a reason to fold
          two seams into one slow unit.

          - **Backend: one unit per CONCERN, not per proto-service.** The plan calls for 1-2
            services, so "one unit per service" means ONE ~18-minute unit — the pole that blew
            the last run's budget. The collision it avoids is a file-layout choice, not a law:
            a custom RPC already in the proto when `forge generate` ran had its stub APPENDED
            to the shared `internal/handlers/<svc>/handlers.go`, and that file is the one to
            split. Go does not care how a package splits across files. Each unit owns its
            concern's vertical: handler bodies + service bodies + owner scoping + tests, with
            the heavy logic in the `internal/<name>/` packages Step 5 birthed. **Each unit also
            owns its own RPCs' born scaffold tests** — `handlers_scaffold_<rpc>_test.go`, one
            file per RPC, each holding a self-destructing `Test<Rpc>_Generated` row asserting
            `CodeUnimplemented` that goes RED by design the moment the RPC is implemented.
            Rewriting it into a real test (or deleting it) is part of finishing the RPC, not a
            blocker to report — the file is that unit's alone. A unit that leaves the row
            asserting `CodeUnimplemented` hands you a red gate.
          - **Frontend: one unit per entity page-group** — per-page when a group runs past ~4
            pages or one page IS the product. All fan out together: 16 per-page units is one
            wave, not three. The shared substrate ALREADY EXISTS; each unit builds ON TOP and
            never re-establishes it. If a group's pages share a mutable file (a group
            `_components.tsx`), author it YOURSELF rather than merging the group back.
          - **The dashboard is its OWN unit, and `nav.tsx` is NOBODY'S.** The dashboard was the
            slowest unit in the measured run; give it one page plus the `total_count` recipe
            below. `nav.tsx` is already driven by `ALL_ROUTES`, so a new page appears with NO
            edit — and it is the one file every frontend unit would otherwise touch. A unit
            that thinks nav needs changing reports it to you.
          - **Backend ∥ frontend.** The frontend consumes the GENERATED contract, not
            hand-written handler bodies, so the two run concurrently.
          - **Proto, migration and `forge generate` work is SERIAL and belongs to YOU.** If a
            unit finds a genuine gap (a missing List filter, a missing domain RPC) it REPORTS
            it; you batch the edits and run ONE generate pass BETWEEN waves, never during one
            — generate rewrites `gen/` and the hooks globally.

          Spawn implementation units with the **`forge_implementer`** agent: a cheaper tier
          that keeps fan-out cost down and the one that already carries the
          `component_library` tool every unit's brief requires (the plain `implementer` does
          not, and `load_tool` costs a whole turn because a loaded tool only exists on the
          NEXT turn). Orchestration and the review stay on the default agent.

          **Serial setup — do this BEFORE you fan out:**

          1. **Brief each unit to load its skills AND run the two lookup commands, in ONE
             opening turn.** Each spawned unit starts fresh.
             - BACKEND: load `service-layer`, `api` and `testing` (add `auth` only for a seam
               that enforces authorization, `db` only for a seam that writes migrations —
               they are ~17KB each and a unit that loads everything still greps).
             - FRONTEND: load `frontend-api-brief` (proto-to-client mapping — enum member
               names, what a List request actually filters, FK ids vs display names),
               `frontend-runtime` and `frontend/design`, and follow the last for every visual
               decision.
             - EVERY unit, in that same turn:
               `reliant forge project shapes --grep '<Entity1>|<Entity2>'` — its seam's RPCs,
               handlers, tables and stores, and
               `reliant forge project libraries <pkgs>` — the signatures of the forge/pkg
               libraries its seam uses (backend: `orm crud svcerr`; add `tdd testkit` when it
               writes tests).

             **Loading more skills is NOT the fix, and briefing without the commands is the
             failure.** Measured: backend units loaded ~84KB across seven skills and still
             spent 35.5 minutes grepping forge's own source, 92 times, while running
             `forge project libraries` ZERO times. `RunTransaction` was grepped SIXTEEN times
             by units that had already loaded the skill documenting it. Skills teach a
             pattern; these two commands answer "what is this symbol's exact signature", and
             nothing else does — bare `go doc <pkg>` prints a struct as `struct{ ... }` with
             no methods.
          2. **Confirm the dev database has rows — do not blind-seed.** `reliant forge run`
             migrates AND auto-seeds on FIRST boot against an empty dev database, printing
             `[up] auto-seeded <N> rows across <M> tables`. Read that line; only when it is
             absent do you run `reliant forge db seed apply` yourself (it needs `DATABASE_URL`
             or `--dsn`). Either way VERIFY before picking verification records or judging any
             page — `reliant forge db seed status`, or a real List RPC returning rows. An empty
             database makes every page look broken. If the generated dataset fails a constraint
             the whole apply rolls back in one transaction; the escape hatch is
             `db/seeds/custom/*.sql`, run in lexicographic order AFTER the generated pass.
             Report the failure verbatim — it is a forge gap worth fixing.
          3. **The unwired-RPC work list — ASK forge what is unimplemented.** The stamp is
             machine-readable, so the backend work list is a QUERY:
             ```bash
             cd {{inputs.working_directory}} && grep -rn 'forge:gen unwired-stub symbol=' internal/handlers/
             ```
             Each hit gives the owning method as `symbol=<pkg>.<Method>` AND the file it sits
             in — exactly what the pre-split in item 5 needs and what each backend brief must
             name. Do not ask a unit to find its own RPCs, and do not look for a TODO: there
             isn't one, by design. **Symbols map to units MANY-to-many, and that is correct** —
             you partition by CONCERN, so one unit can own three symbols and a pure
             domain-logic unit none. What must hold is COVERAGE: every symbol appears in
             exactly one brief. Do not split or merge units to make numbers line up. The query
             does not see CRUD RPCs, which are implemented by `handlers_crud.go`. **An EMPTY
             result is a FINDING, not a green light** — with custom RPCs in the proto it means
             Step 6 hand-wrote placeholder bodies over forge's stubs. Derive the list from the
             protos instead, and say plainly that the marker handoff was broken.
          4. **Verification-target record IDs.** From the seeded data pick a few records that
             exercise EDGE / deviation states — an entity in a failed or terminal state, one
             with an empty relation — not just happy-path rows. Pass those IDs to each frontend
             unit and reuse them in the Step 9 sweep.
          5. **Pre-split every file two units would both need.** Mechanical: move each backend
             concern's stubs out of `internal/handlers/<svc>/handlers.go` into
             `handlers_<concern>.go` (same package, no behaviour change, lint still green), and
             author any group-level `_components.tsx` a page-group's pages would share. The
             unwired-RPC query already told you which methods to move. Move each stub WITH its
             `FORGE_SCAFFOLD` / `forge:gen unwired-stub` lines intact: drop the marker and the
             method stops being attributable to its owner. **The born scaffold TESTS need no
             split** — forge births one file per RPC declaring nothing at package scope.

          **Units have NO browser, by design. Do not brief one to open a page.** A unit runs
          concurrently with up to eight siblings against one working tree, one dev server and
          one API, so what a browser shows it is NOT ATTRIBUTABLE: the bundle carries siblings'
          half-finished edits and the API predates their handlers. A green screenshot does not
          mean the page works; a red one does not mean this unit broke it. **A unit that needs
          to know how something BEHAVES writes a test** — attributable, milliseconds, survives
          into the repo. The failure this prevents is a unit turning the browser into a
          debugger: with nothing else able to observe runtime behaviour it re-submits the same
          form dozens of times, the slowest tool available and the one it cannot trust. Visual
          verification belongs to the review, which runs after the wave quiesces.

          **Brief each unit to verify IN-THREAD with LIGHT checks only** — the scoped typecheck
          below for a frontend seam, targeted `go build ./...` / `go test ./internal/<pkg>/...`
          for a backend seam, and a TEST for behaviour it cannot see from types. **A unit must
          NOT run `npm run build` / `next build` or a full `reliant forge build` /
          `reliant forge generate`, must NOT start or stop servers, and must NOT delete shared
          build output (`.next/`, `gen/`). This is a HARD boundary, and the reason is SHARED
          STATE, not minutes:** those commands write whole-tree artifacts every concurrent unit
          is reading. In a measured run one unit ignored this, ran its own dev servers and
          `rm -rf .next`, broke a server the others were using — and was itself the slowest
          unit in the wave. The ONE full gate runs at synthesis. A unit that believes it needs
          a full build or a running server REPORTS that to you.

          **Copy the UNIT RULES block below into every brief, verbatim.** Not a summary, not
          the parts you judge relevant — the literal text. A rule you paraphrase is a rule the
          unit does not get. Measured: units received the file-ownership rule and the no-build
          boundary and none of the discovery discipline, so five independently read the same
          generated protobuf client — 161,590 characters each.

          === UNIT RULES — PASTE VERBATIM INTO EVERY BRIEF ===
          - **Never read `gen/` or any `*_gen.*` file to learn signatures or patterns.** It is
            regenerated and enormous. Never edit one either.
          - **Anything your brief already gives you, do not re-derive.** Opening the source to
            confirm something you were handed is waste.
          - **To find WHERE something is, run `reliant forge project shapes` — never `grep`.**
            It lists every rpc, message, enum, table, handler, hook and store with `file:line`,
            from the live sources. `--grep <Name>` gives you one entity across ALL layers in one
            call, and `--grep 'A|B'` several entities at once (it is a regex — ask about every
            entity you own in ONE call); `--kind rpc,handler` answers "declared vs implemented".
            Measured: a fan-out burned 28.4 minutes across 123 `find`/`grep`/`ls` calls
            answering exactly this — the largest recoverable cost in the run — mostly paging
            one big proto by symbol, once per unit. Use the line numbers to read the region you
            need directly.
          - **To learn a `forge/pkg` LIBRARY's API, run `reliant forge project libraries <pkg>`
            — never grep forge's source tree, and never trust bare `go doc <pkg>`.** It prints
            full signatures, several packages at once: `reliant forge project libraries orm
            crud svcerr`. This is the twin of the rule above — `shapes` answers "what does MY
            generated code offer", `libraries` answers "what does the FRAMEWORK offer".
            Measured: units grepped `~/src/reliant-labs/forge/**` **92 times for 35.5 minutes**
            — including forge's own generator source, and a STALE copy in the module cache —
            while running `libraries` zero times. `RunTransaction` alone was grepped SIXTEEN
            times. Bare `go doc <pkg>` is the trap that starts it: it renders a struct as
            `struct{ ... }` with NO methods, so the answer genuinely is not on that page.
            (`go doc <pkg> <Type>` works if you already know the type name; `go doc
            ./internal/db <X>Store` works for your own generated stores.)
          - **Read the source of truth FIRST, before writing code.** The `.proto` service files
            give you the entities, enums, RPCs and declared List filters in ONE place. Do NOT
            re-derive the API surface by grepping generated client code or probing the running
            backend RPC-by-RPC — measured runs lost a third to half of their tool calls to
            piecemeal re-discovery.
          - **Issue every read you already know you need in ONE turn.** A turn costs a full
            model generation whether it carries one read or eight, so the TURN COUNT is the
            cost, not the file count. Read a whole directory in one turn rather than walking it.
          - **Recon ends when you can name the files you will change.** Not when you feel
            informed. If you read a file and cannot say what you needed from it, you did not.
          - **To learn what code DOES at runtime, run something against it.** Never read its
            source and simulate: it is the slowest path available and it is simply wrong when
            two copies of a package are loaded. One command against the running artifact, or a
            failing four-line test, settles in seconds what an hour of reading will not.
          - **Declare no package-level identifier you were not assigned.** Your brief assigns
            FILES; Go scopes PACKAGES. Constants, types and helpers you invent in a shared
            package collide with siblings you cannot see, and the fix collides too — one wave
            lost eleven minutes to three units declaring the same order-status constants and
            then breaking each other by removing them. If you need a shared name that does not
            exist, report it; do not create it.
          - **Never edit proto files or run `forge generate`** — contract changes route through
            the orchestrator's serial passes.
          - **Read before you overwrite.** Only the Read TOOL records awareness of a file;
            `cat`, `grep` and `sed` do not. Write does not reject an unread overwrite — it
            replaces the file and returns the diff of what it destroyed. **The hard failure
            during fan-out is the concurrent-modification guard:** once you have read a file, a
            Write is REJECTED if it changed on disk since, which is what a sibling editing your
            file looks like. That means two writers own one file — report it rather than
            re-issuing the Write.
          - **Batch your WRITES the same way you batch your reads, and never `rm` a file just
            to rewrite it.** The Write tool's own description carries the mechanics; what
            matters here is that fan-out is where the cost lands. Measured in one wave: 96
            write turns, every single one writing exactly ONE file — six independent dashboard
            panels went one per turn — plus 21 turns spent deleting a file the very next turn
            rewrote.
          - Run commands in the FOREGROUND with a generous timeout. Backgrounding ends your
            turn and strands the phase.
          === END UNIT RULES ===

          **Scoped frontend typecheck — give this recipe to every frontend unit.** A bare
          `npx tsc --noEmit` typechecks the WHOLE frontend, so under fan-out its exit code
          answers "is the tree green", never "is my slice green":
          ```bash
          cd frontends/<app>
          cat > tsconfig.<unit>.json <<'JSON'
          { "extends": "./tsconfig.json",
            "include": ["next-env.d.ts",
                        "src/app/<slice>/**/*.ts", "src/app/<slice>/**/*.tsx",
                        "src/components/<slice>/**/*.ts", "src/components/<slice>/**/*.tsx"] }
          JSON
          npx tsc --noEmit -p tsconfig.<unit>.json    # this exit code is YOURS
          rm tsconfig.<unit>.json                     # delete it before you return
          ```
          `extends` keeps every compilerOption — `paths`, `jsx`, `strict`,
          `noUncheckedIndexedAccess` — so this is the same typecheck, not a weaker one, and
          everything the slice IMPORTS is still checked. Measured: ~2s; a type error planted in
          a SIBLING page-group left the scoped run green while bare `tsc --noEmit` went red,
          and the same error inside the slice turned it red.

          **Frontend units — brief each on all of this:**
          - **Build ON TOP of the substrate — don't re-lay it.** Theme, shared components and
            nav already exist and unused scaffold routes are gone. A unit does NOT restyle the
            app, rewrite nav, or invent parallel components. If it genuinely needs a new SHARED
            component it reports that so the component lands in one place.
          - **The remaining scaffolded pages are yours to rewrite.** The generated CRUD pages
            are initial code generation, never shipped — rewrite them into the real product
            surface, or `rm` and replace.
          - UI primitives live in `frontends/*/src/components/ui/`. It is scaffolded once and
            then owned, so it differs per project — look before hand-rolling.
          - **The FK/enum quartet in `frontends/*/src/components/`: `StatusBadge`,
            `EnumSelect`, `EntityPicker`, `EntityName`.** These are the ones units reinvent — a
            searchable FK picker gets hand-rolled twice in a wave not briefed on them.
            `StatusBadge` takes the enum OBJECT, not a type-name string.
          - **A component's real API is its prop type, not its name.** Where the name is not
            enough, read that ONE file rather than replicating its markup around a guess. Sharp
            edges are normal (a `title` taking a string and not JSX); report the ones you hit.
          - **Known form sharp edge — a bare `.refine()` on an enum field silently narrows the
            zod schema's OUTPUT type.** TS 5.5+ reads `.refine((v) => v !== Enum.UNSPECIFIED)`
            as a type PREDICATE, so the inferred field type drops `UNSPECIFIED` and no longer
            matches the form type; `useForm`'s `values:` then fails to type-check with an error
            that looks like the data is wrong rather than the schema. Annotate the return type:
            `.refine((v): boolean => v !== Enum.UNSPECIFIED, { message: "..." })`. EVERY unit
            building a form hits this — brief them all up front.
          - **You have the `component_library` tool** — search it for production-ready
            React/Tailwind components (61 available: tables, charts, layouts, forms,
            dashboards) before building from scratch.
          - **Use the generated hooks for data.** They are React Query hooks over Connect RPC
            and the generated CRUD handlers already work end-to-end. The hook filename is
            generated from the service, so confirm real names and import path against
            `frontends/*/src/hooks/`. protobuf-es v2: `create(Schema, {...})`, not
            `new Message()`.
          - **Filter/scope a list SERVER-SIDE — but verify the filter EXISTS first.** READ the
            generated `List<Entity>Request` and use the fields it offers. Passing one page and
            filtering in the browser silently truncates everything past the page cap — a
            correctness bug, not a style choice. BUT the filter may NOT exist: enum facets and
            owner `<owner>_id` scoping are frequently absent. A frontend unit cannot add proto
            fields, so REPORT the gap verbatim ("List<Entity>Request needs a <field> filter")
            and fall back to client-side filtering ONLY when the whole set fits in one page.
            Never present an unscoped list as if it were owner-scoped.
          - **Counts and totals ALREADY EXIST — `List<Entity>Response.total_count`**
            (`totalCount` on the TS client), and it RESPECTS the request's filters. A dashboard
            tile or badge count is a List call with filters set and `page_size` 1, reading
            `totalCount` — never a count of one page's rows (that caps at the page size), and
            never a hedge. There is NO separate Count RPC and none is needed. Brief every unit
            rendering a metric BEFORE it starts, or it ships deliberately vague tiles.
          - **Domain RPC not landed yet? Wire the UI, stub the effect, never fake it.** Two
            cases mean "no real backend for this action yet": a custom RPC still returning
            `Unimplemented`, and a generated CRUD `Create` that EXISTS but is NOT the domain
            operation (it enforces raw referential integrity but runs no state machine or side
            effects). In BOTH: wire the handler in, show a DESIGNED optimistic-success /
            inline-error affordance, leave a `// TODO(synthesis): wire real <Operation>` at the
            call site, and report the missing RPC — the owning backend unit implements it in
            this same wave and the real call is wired at synthesis. Never present a raw CRUD
            `Create` as the domain flow, and never simulate backend effects in client code.
          - **Errors from the hooks are TYPED and carry a machine-readable reason — never
            branch on message text.** The transport normalizes every failure to
            `ConnectClientError` (from `@reliant-labs/web-runtime`), carrying `code`, `status`,
            `retryable` and `reason` — a stable snake_case code generated CRUD stamps on every
            error. Narrow to `ConnectClientError`, branch on `.reason` / `.code`, render with
            `userMessage(err)`. Message TEXT is display-only and changes without notice, so an
            `err.message.includes(...)` match is a defect that survives review precisely
            because it works on the one message it was written against.
          - **A real signed-in state is OWNED app logic.** The scaffolded auth provider is a
            STUB holding no credential, so every request needing identity fails. If the product
            needs real sessions, implement `AuthProvider` and pass it to
            `<AuthContextProvider>`; the Connect transport is already fed from
            `useAuth().getToken`. Do not stand up a second credential cache, and do not reach
            for a mock scenario to make protected pages look like they work.
          - **Seed media/URL fields may hold unreachable placeholder URLs.** Render a
            deterministic LOCAL placeholder rather than a broken `<img>`, and note the gap.

          **Backend units — brief each on all of this:**
          - **What already exists:** generated CRUD handlers with real DB operations, the ORM
            projected from the migrations, the test harness, the domain-service contracts and
            the shared reason vocabulary. Fill the bodies; reuse the substrate.
          - Implement custom RPC bodies in the owned handler/service files per the
            service-layer and api skills.
          - Protected endpoints enforce authorization appropriate to the app — the app owns
            what the rules are. `middleware.GetUser(ctx)` gives you the user and claims.
          - Add validation and business rules to existing CRUD flows, in owned files, never in
            `*_gen.go`.
          - Write tests for critical business logic per the testing skill, and wire up any
            integrations the MVP needs.
          - Return failures through `svcerr` with a stable reason code from `internal/reasons/`
            — `svcerr.WithReason(err, "no_active_subscription")`. It reaches the browser as
            `x-forge-error-reason` and is the ONLY thing the UI can safely route on; generated
            CRUD already stamps one on every error, so a custom RPC that sets none is the one
            case that leaves the frontend matching message text.
          - **A dev browser carries NO identity, so authorization is unobservable there.**
            Prove it with tests that build an explicit context per role, not with pixels. Do
            NOT reach for a mock scenario to get past a 401: a mock verifies the fixture, not
            the app.

          **Step 9: SYNTHESIZE, verify visually, and bring the gate green.** Integrate the
          results yourself: apply owned composition-seam and serve wiring changes (SHARED files
          — collect the units' needs and apply once), connect frontend actions to the custom
          RPCs the backend units implemented, and resolve anything units reported back with a
          serial proto edit plus one generate pass.

          Then verify with your own eyes, before the gate:
          - Start the app and **read the port off its output** — `forge run` prints
            `[up] frontend <name>: ephemeral dev port <N>`. Never assume 3000; every 3000-based
            check inspects the WRONG APP. Confirm the URL serves the app YOU built
            (title/nav/routes) — a 200 from a stranger's server is a FALSE GREEN, worse than a
            failure. If pages render but all data fails, it is CORS — a forge defect to REPORT,
            not to route around. Never export an env var to fix it, never edit pages to hide it.
          - Call BOTH `take_snapshot` (accessibility tree) AND `take_screenshot` (pixels) on
            every key page. They are complementary: screenshots cannot catch missing
            labels/roles/structure, and the a11y tree cannot catch visual/CSS issues.
            `take_snapshot` cannot be substituted with `evaluate_script` or ad-hoc DOM probes.
            Navigate to the verification-target record IDs — the edge and deviation-state
            records, not just index pages.
          - Check `list_console_messages` on each page, and confirm layout, data rendering and
            navigation are correct.
          Do NOT claim a page was snapshotted unless you actually called `take_snapshot` on it.

          **Command costs are SECONDS — measured, at THIS point too. Do not plan around them.**
          Taken on a FINISHED 4-entity app (60 hand-written Go files, 71 tsx, every custom RPC
          implemented), not an empty scaffold: `reliant forge generate` ~18s,
          `reliant forge lint` ~17s, `reliant forge build` ~14s, `task test` ≤17s — **one full
          cycle is ~66 seconds.** The same cycle at scaffold time is ~55s, so the gate costs
          1.2x more at the END of the build than at the start; it does NOT get expensive as the
          app fills in. Cold caches are the only real variable and they are small. Wall clock
          is set by how you PARTITION the wave, not by toolchain latency — never trade a better
          partition for fewer invocations, and never drop a lane to save time. (One measured run
          recorded ~19 minutes for a single gate cycle. It does not reproduce: same project,
          same commands, 18x faster, taken while the fan-out wave was still loading the machine.
          If YOUR gate cycle takes minutes, something else is running.)

          ### Final gate — do NOT return until it is green (REQUIRED)
          ```bash
          export PATH="$HOME/go/bin:$PATH" && cd {{inputs.working_directory}} && reliant forge generate && reliant forge lint && task test && reliant forge build
          ```
          The engine re-runs exactly these after you return. Fix root causes and re-run.

          ## Generated vs Owned
          Anything with `_gen` in the name or under `gen/` is regenerated on every
          `forge generate` — never edit it, and don't read it to learn signatures or patterns.
          Work from FORGE_PLAN.md, the migrations and the protos. Everything without `_gen` is
          yours. Custom wiring goes in the owned composition seam the architecture skill
          describes, never in generated composition files.

          ## SCOPE BOUNDARY — READ THIS
          Your job is ONLY:
          1. Run `forge project new` to create the project
          2. Author the entity messages (marked `// forge:entity`) and any custom RPCs, then
             run `forge scaffold`
          3. Fill in `db/seeds/vocab.yaml` with domain-noun pools (vocabulary, not seed rows)
          4. Read every born `db/migrations/*.up.sql`, correct what is wrong for this domain,
             bring the gate green on the corrected schema, and seed it once to prove a row
          5. Run the `forge scaffold rpc` / `scaffold package` commands the plan needs, then
             ONE `forge generate`
          6. Shape the handler `Deps` structs, edit the born `internal/<name>/contract.go`
             interfaces, and author the reason-code constants in `internal/reasons/`
          7. Edit the scaffolded frontend theme / nav in place, deleting a route only where the
             product never offers that operation
          8. Fan out one unit per seam once the substrate gate is green, and only then
          9. Synthesize the units, verify the live app visually, and bring the final gate green
          10. Return only when that gate is green

          **STOP once the gate is green.** Do not build past the plan's HIGH-priority scope,
          and do not **re-run a gate that is already green** — editing FORGE_PLAN.md, removing
          a scratch file or tidying up CANNOT change its answer. Re-run a lane when you changed
          something that lane checks, and then that lane, not all four.

          **NEVER modify or rebuild your own toolchain — report it instead.** forge is the
          thing being exercised here, not something to repair in flight. If a forge command is
          missing, crashes, emits something wrong, or reports a finding you believe is FALSE
          (none of which is your protos/code), WRITE IT DOWN and hand it back in your summary.
          Do not open the forge source tree, patch it, or run anything that rebuilds the
          `forge` or `reliant` binaries: the rest of the run would then execute on a different
          toolchain than it set out to measure. If forge is broken so badly the gate can never
          pass, say so and stop — that escalates to a human, which is the designed path.

          **`reliant forge project audit` is a diagnostic, not a gate lane.** It earns its keep
          root-causing a lane that has ALREADY failed. An audit finding is not a gate failure.
          If the gate is green and audit still reports something, record it and stop.

          Work in `{{inputs.working_directory}}`.

  - id: build_done
    type: save_message
    display_style: success
    args:
      role: assistant
      content: |
        ## Build Complete

        The substrate landed green, the feature seams were built in parallel and synthesized,
        and the app was verified against its own running UI: real pages over generated Connect
        RPC hooks, with business logic, tests and working end-to-end flows.

        **Next:** I'll start it up and send you a link so you can open it.

  # ─── Launch Preview — the run's last step ────────────────────────────
  #
  # Start the finished app and post its running preview URL as a markdown link, so the
  # link serves the build that actually shipped. `forge run` detaches its servers and
  # returns, so they outlive the turn on their own — this node runs it FOREGROUND and
  # reads the ephemeral port off its output. Forced to auto mode so the handoff stays
  # seamless regardless of pipeline mode.

  - id: launch_preview
    type: workflow
    ref: builtin://agent
    presets:
      default: forge
    passthrough: [model]
    args:
      mode: auto
    thread:
      mode: fork
      inject:
        role: user
        content: |
          ## Launch the App Preview

          The build is complete and this is the last step of the run. Start the app and give
          the user a link to open it. Keep this focused — do NOT change code, run builds, add
          features, or do anything else.

          **Step 1: Go to the project directory** (`forge.yaml` is right there):
          ```bash
          export PATH="$HOME/go/bin:$PATH" && cd {{inputs.working_directory}} && pwd
          ```

          **Step 2: Stop the build's servers FIRST.** The build started its own
          `reliant forge run` for the visual review and nothing stopped it. Those servers are
          bound localhost-only — invisible to the proxy — and they serve the pre-final tree, so
          leaving them up means the user gets either no preview URL or a stale one. `forge run`
          already exited; what is still running are the servers it DETACHED, whose pids forge
          tracks in a per-env ledger. Use the command that reads that ledger — idempotent, and
          it stops exactly those processes and nothing else, a promise no command-line pattern
          match can make on a shared machine:
          ```bash
          cd {{inputs.working_directory}} && reliant forge env down dev
          ```

          **Step 3: Start the dev server in the FOREGROUND, bound to 0.0.0.0.** Do NOT use
          `run_in_background`: `forge run` starts every host service and frontend, detaches
          them onto their own log files, prints their ports and RETURNS, so backgrounding it
          hands you an already-exited pid and puts the port line in a buffer you must poll. The
          bind MUST be `0.0.0.0`, not `127.0.0.1` — a localhost-only bind gets NO preview URL.
          **The host flag belongs to the dev server, so read which one it is** —
          `frontends/*/package.json`'s `dev` script says `next dev` or `vite`:
          ```bash
          # next dev  → -H 0.0.0.0      |      vite → --host 0.0.0.0
          cd {{inputs.working_directory}} && reliant forge run -- -H 0.0.0.0
          ```
          Everything after `--` is forwarded verbatim to that dev server, so passing Vite's
          `--host` to `next dev` (or the reverse) fails the flag parse and you get no server.

          **Step 4: Read the PORT off the output — it is ephemeral, not 3000.** forge assigns
          every frontend a kernel-allocated free port and prints
          `[up] frontend <name>: ephemeral dev port <N>`; each server's log file (named in the
          same output) carries its `- Local: http://localhost:<N>` line. Capture that `<N>`,
          confirm the server is listening on `0.0.0.0` with no "address already in use", and
          use `<N>` for the rest of this phase — a hardcoded 3000 points the user at whatever
          unrelated server holds 3000.

          **Step 5: Make sure the preview has data.** `reliant forge run` auto-seeds on first
          boot against an EMPTY dev database (watch for `[up] auto-seeded …`). If the database
          was already non-empty, or came up empty anyway, seed it and confirm rows landed:
          ```bash
          cd {{inputs.working_directory}} && reliant forge db seed apply
          ```
          (It needs `DATABASE_URL` or `--dsn`.) Verify with a row count or a real List RPC
          returning rows, so the preview comes up populated.

          **Step 6: Get the preview URL for the port from Step 4.** Run
          `reliant preview-url <N>` — it prints the authoritative proxied URL for that port
          (the same URL appears as a `Preview URL (port <N>): ...` line in the `bash_list` /
          `bash_output` result from Step 4). Use it verbatim; do NOT invent one or post a raw
          `http://localhost:<port>` link when a proxied URL is available. If `preview-url`
          reports none (a local run), fall back to `http://localhost:<N>/`.

          **Step 7: Your FINAL message is the handoff — keep it to a few lines.** It is the
          last thing the user reads from this run: one or two sentences on what shipped (read
          off FORGE_PLAN.md and what you see running), then the link on its own line:

          **[Open your app](<the URL from `reliant preview-url <N>`>)**

          No command transcript, no step-by-step narration, no next-steps pitch — the chat
          stays open and the user can just ask. If the app cannot be started because a forge
          command is missing, crashes, or misbehaves (not your protos/code), say so in one line
          and give the manual run command (`reliant forge run -- -H 0.0.0.0`) instead of a
          link. Never patch the forge source or rebuild the `forge` / `reliant` binaries.

          Work in `{{inputs.working_directory}}`.

  # ─── Terminal Nodes ─────────────────────────────────────────────────

  - id: stuck
    type: save_message
    display_style: warning
    # Reaching this node IS the run's verdict: the build escalated and the pipeline
    # stopped. Declared so the record says so — a graph that runs to its end is a
    # COMPLETED execution either way, and nothing else can tell them apart.
    outcome: failure
    args:
      role: assistant
      content: |
        ## Stopped — External Issue

        The build hit a problem outside the code (tooling, environment, or infrastructure)
        and was escalated, so the workflow stopped. Check the feedback above for details.
        The project is at `{{inputs.working_directory}}`.

  - id: success
    type: save_message
    display_style: success
    # Declared rather than assumed, so "this run passed" is something the workflow
    # SAID, not something inferred from the absence of a crash.
    outcome: success
    args:
      role: assistant
      content: |
        ## Forge One-Shot Complete

        **Project:** `{{inputs.working_directory}}`

        The finished build is running behind the preview link above. To run it yourself
        later:
        ```bash
        cd {{inputs.working_directory}} && reliant forge run
        ```
        It prints the frontend and API URLs on startup — the dev ports are assigned free at
        launch, so read them off that output rather than assuming 3000/8080.

  - id: failed
    type: save_message
    display_style: warning
    # Without this declaration the run ends here and still reports COMPLETED to
    # status/analyze/watch — the false green this field exists to close.
    outcome: failure
    args:
      role: assistant
      content: |
        ## Didn't Fully Pass

        The build didn't pass verification after its attempts, so the workflow stopped.
        Review the issues above. The project is at `{{inputs.working_directory}}`.

edges:
  - from: build_app
    cases:
      - to: stuck
        condition: "has(nodes.build_app.stuck) && nodes.build_app.stuck == true"
        label: build_stuck
      - to: failed
        condition: "nodes.build_app.strategy != 'pass'"
        label: build_failed
    default: build_done
  - from: build_done
    default: launch_preview
  - from: launch_preview
    default: success
