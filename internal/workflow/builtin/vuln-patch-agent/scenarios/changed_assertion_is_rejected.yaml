name: changed_assertion_is_rejected
description: >-
  The agent loosens an assertion in an existing test without adding a skip or exemption.
  Verify and rescan both pass, but the workflow rejects the changed test file and never reports passed.
inputs:
  dir: /w/ws
  env: prod
  verify_command: go test -short ./...
  max_iterations: 1
  targets: [{"id": "GO-2024-3333", "names": ["GO-2024-3333"], "package": "golang.org/x/net", "installed": "v0.30.0", "fixed_in": "v0.33.0", "status": "", "reason": ""}]
events:
  - node: attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Bumped x/net and changed assert.Equal(t, want, got) to assert.NotNil(t, got).", "pr_title": "fix(deps): bump x/net", "commit_message": "fix(deps): bump x/net"}}
  - node: attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:internal/feed/parse_test.go"}
  - node: attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: attempts.scan
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": []}"}
expect:
  outcome: completed
  outputs:
    passed: false
    blocked: false
    iterations: 1
    still_present: []
    reasons:
      - "a test file was changed or a skip/exemption added, which is not allowed; revert it: file:internal/feed/parse_test.go"
