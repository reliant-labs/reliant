name: skipped_test_and_failed_rescan_are_reported
description: >-
  One attempt allowed. The agent adds a t.Skip and the rescan cannot run (no vulnerability database). Both are
  reasons the attempt did not pass, though the verify command passed: a green build over a skipped test, or
  with no rescan, is never a pass.
inputs:
  dir: /w/ws
  env: prod
  verify_command: go test -short ./...
  max_iterations: 1
  targets: [{"id": "GO-2024-3333", "names": ["GO-2024-3333"], "package": "golang.org/x/net", "installed": "v0.30.0", "fixed_in": "v0.33.0", "status": "", "reason": ""}]
events:
  - node: attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Bumped x/net.", "pr_title": "fix(deps): bump x/net", "commit_message": "fix(deps): bump x/net"}}
  - node: attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:internal/feed/parse_test.go\nadded:+\tt.Skip(\"flaky after bump\")"}
  - node: attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: attempts.scan
    output: {"exit_code": 2, "stdout": "", "stderr": "vulnerability database missing: forge vuln db pull"}
expect:
  outcome: completed
  outputs:
    passed: false
    iterations: 1
    reasons:
      - "a test file was changed or a skip/exemption added, which is not allowed; revert it: file:internal/feed/parse_test.go; added:+\tt.Skip(\"flaky after bump\")"
      - "the rescan could not run (exit 2): vulnerability database missing: forge vuln db pull"
