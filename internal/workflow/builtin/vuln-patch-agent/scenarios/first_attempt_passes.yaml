name: first_attempt_passes
description: >-
  One attempt: the agent submits done, the guard sees only manifests and one source file, the verify command
  passes and the rescan no longer reports the target (only an unrelated finding). The loop stops after one
  attempt with passed true and the source file listed as a code change.
inputs:
  dir: /w/ws
  env: prod
  verify_command: task test:short
  targets: [{"id": "GO-2024-3333", "names": ["GO-2024-3333", "CVE-2024-45338"], "package": "golang.org/x/net", "installed": "v0.30.0", "fixed_in": "v0.33.0", "status": "still_present", "reason": "verification failed"}]
events:
  - node: attempts.fix
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Bumped x/net.", "pr_title": "fix(deps): bump x/net", "commit_message": "fix(deps): bump x/net"}}
  - node: attempts.guard
    output: {"exit_code": 0, "stdout": "file:go.mod\nfile:go.sum\nfile:web/package-lock.json\nfile:internal/feed/parse.go"}
  - node: attempts.verify
    output: {"exit_code": 0, "stdout": "ok"}
  - node: attempts.scan
    output: {"exit_code": 1, "stdout": "{\"schema\": \"forge.dev/vuln-list/v1\", \"findings\": [{\"id\": \"GHSA-other\", \"aliases\": [\"CVE-2023-1\"]}]}"}
expect:
  outcome: completed
  completed: [attempts, attempts.guard, attempts.verify, attempts.scan, attempts.judge]
  outputs:
    passed: true
    blocked: false
    iterations: 1
    code_files: ["internal/feed/parse.go"]
    still_present: []
    pr_title: "fix(deps): bump x/net"
