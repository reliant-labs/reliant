name: one_retry_black_box_refactor
description: >
  First attempt has issues (strategy="refactor"). Refactor agent undoes the problematic work.
  Second attempt starts fresh with review insights and succeeds (strategy="pass").

events:
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Attempted the feature but tests fail. The data model doesn't match expectations."
      response_text: "Attempted the feature but tests fail. The data model doesn't match expectations."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "refactor"
            feedback: "The implementation assumed a flat data model but the schema is actually nested with foreign key constraints. Use the repository layer instead of direct SQL — follow the existing pattern in UserRepository. Check the migration files for the actual schema shape before writing queries."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "refactor"
          feedback: "The implementation assumed a flat data model but the schema is actually nested with foreign key constraints. Use the repository layer instead of direct SQL — follow the existing pattern in UserRepository. Check the migration files for the actual schema shape before writing queries."
      tool_results: []
      thread_token_count: 100

  # DELIBERATE black box, and it must stay one. This is the fixture that
  # scenario/runner's TestTransparencyGateIsPerNodeNotPerName uses to prove the
  # transparency gate is keyed per NODE PATH and not per sub-workflow NAME:
  # get-it-right references builtin://agent at BOTH implement and refactor, so
  # the invariant needs a scenario that opens one and mocks the other as a unit.
  # The sibling copy in scenarios/get-it-right/one_retry_then_success.yaml runs
  # this same node's body, so the executed-path coverage is not lost here.
  - node: attempt.refactor
    black_box: true
    output:
      response_text: "Reverted the direct SQL queries and flat data model code. Workspace is clean for the next attempt to use the repository layer instead."

  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Built using the repository layer as suggested by the review. All tests pass, implementation is clean."
      response_text: "Built using the repository layer as suggested by the review. All tests pass, implementation is clean."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.join_checks
    - attempt.review
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
