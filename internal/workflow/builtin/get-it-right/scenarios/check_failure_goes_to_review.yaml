name: check_failure_goes_to_review
description: >
  Build fails on the first attempt. Under reviewer-only control the check failure
  no longer short-circuits the loop — it is injected into the review prompt and the
  reviewer decides. Here the reviewer returns "continue" to loop back. The second
  attempt passes the build and the reviewer says pass.

inputs:
  build_command: "make build"
  max_retries: 2

events:
  # Iteration 1: implement succeeds but build fails; reviewer sees it and says continue
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implemented the feature but introduced a compile error."
      response_text: "Implemented the feature but introduced a compile error."
      tool_calls: []

  - node: attempt.build
    output:
      exit_code: 1

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "The build is failing — fix the compile error on the next attempt."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "The build is failing — fix the compile error on the next attempt."
      tool_results: []
      thread_token_count: 100

  # Iteration 2: implement fixes the build; reviewer passes
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Fixed the compile error. Build passes now."
      response_text: "Fixed the compile error. Build passes now."
      tool_calls: []

  - node: attempt.build
    output:
      exit_code: 0

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Build passes. Implementation is correct."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Build passes. Implementation is correct."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.join_checks
    - attempt.build
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
      build_exit: 0
