name: custom_review_instructions
description: >
  Verifies that custom review_instructions are accepted and the workflow
  still functions correctly. Simulates the forge-one-shot scaffold use case
  where the reviewer should bias toward pass for scaffold-only reviews.

inputs:
  review_instructions: |
    You are reviewing a scaffold only. Bias strongly toward pass.
    Only fail if the API surface is fundamentally wrong.

events:
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Scaffolded the project. All services and packages created. Build passes."
      response_text: "Scaffolded the project. All services and packages created. Build passes."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Scaffold is correct. Services, packages, and frontends match the plan. Build is green."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Scaffold is correct. Services, packages, and frontends match the plan. Build is green."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.join_checks
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
