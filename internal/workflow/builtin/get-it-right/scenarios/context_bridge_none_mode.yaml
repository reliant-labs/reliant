name: context_bridge_none_mode
description: >
  Tests context_bridge=none (brute force). Both implement and review fork fresh
  each iteration. No save_messages to parent thread. First attempt fails,
  second attempt succeeds purely through sampling diversity.

inputs:
  context_bridge: none
  max_retries: 2

events:
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "First brute force attempt. Took wrong approach — used raw SQL."
      response_text: "First brute force attempt. Took wrong approach — used raw SQL."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "Wrong approach. Should use repository pattern."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "Wrong approach. Should use repository pattern."
      tool_results: []
      thread_token_count: 100

  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Second brute force attempt from scratch. Found the repository layer and used it. Tests pass."
      response_text: "Second brute force attempt from scratch. Found the repository layer and used it. Tests pass."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Implementation is correct. Repository pattern used properly."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Implementation is correct. Repository pattern used properly."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.join_checks
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
