name: context_bridge_full_mode
description: >
  Tests context_bridge=full. Both implement and review accumulate context (memo:true).
  First attempt has issues (strategy="continue"), second succeeds.
  This mode is similar to implement-review's context management.

inputs:
  context_bridge: full
  max_retries: 2

events:
  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "First attempt using the full context bridge. Made changes but missed a critical pattern."
      response_text: "First attempt using the full context bridge. Made changes but missed a critical pattern."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "Implementation missed the service layer pattern. The next attempt should use the existing service abstractions."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "Implementation missed the service layer pattern. The next attempt should use the existing service abstractions."
      tool_results: []
      thread_token_count: 100

  - node: attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Second attempt with accumulated context. Used the service layer as suggested. All tests pass."
      response_text: "Second attempt with accumulated context. Used the service layer as suggested. All tests pass."
      tool_calls: []

  - node: attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Implementation correctly uses the service layer. Clean and follows codebase conventions."
  - node: attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Implementation correctly uses the service layer. Clean and follows codebase conventions."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.join_checks
    - attempt.review
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      eval_strategy: "pass"
      review_grade: "pass"
