        ## Phase 3 Complete: Founder Interview
        {{output.response_text}}

  # ==========================================================================
  # PHASE 4: Plan Deck → Parallel Slide Pipeline (write + review per slide)
  # ==========================================================================
  # 1. Planner decides narrative arc + slide order (one-shot, standalone)
  # 2. Parallel loop: each slide gets its own write → review pipeline
  #    Each slide gets one write+review pass. No inner retry loop.

  - id: plan_deck
    type: workflow
    ref: builtin://structured-agent
    presets:
      default: general
    args:
      tools: "{{inputs.tools}}"
      model: "{{inputs.model}}"
      mode: auto
      ask: "{{inputs.ask}}"
      temperature: 0.7
      thinking_level: high
      max_turns: 40
      response_tool_name: submit_deck_plan
      response_tool_description: "Submit the deck plan with narrative arc and per-slide specifications"
      response_schema:
        type: object
        required:
          - narrative_arc
          - slides
        properties:
          narrative_arc:
            type: string
            description: "2-3 sentence explanation of the chosen story structure and why"
          slides:
            type: array
            items:
              type: object
              required:
                - filename
                - title
                - purpose
                - key_content
                - layout_hint
                - sources
              properties:
                filename:
                  type: string
                  description: "Slide filename, e.g. '01-hook.md'"
                title:
                  type: string
                  description: "Slide title — specific, not generic"
                purpose:
                  type: string
                  description: "What this slide must accomplish in the narrative (1-2 sentences)"
                key_content:
                  type: string
                  description: "The specific facts, numbers, or claims this slide should contain. Reference the research files."
                layout_hint:
                  type: string
                  enum:
                    - centered-hero
                    - two-column
                    - card-grid
                    - full-bleed-stat
                    - comparison-table
                    - timeline
                    - quote
                    - demo-screenshot
                  description: "Suggested visual layout"
                sources:
                  type: string
                  description: "Which research files contain the data for this slide"
                transition_from_previous:
                  type: string
                  description: "How this slide connects to the one before it (for speaker notes)"
            description: "Ordered list of slide specs (excluding 00-overview.md which the planner writes directly)"
      system_prompt: |
        You are an elite pitch deck strategist who has helped hundreds of startups raise capital.
        You combine the storytelling instincts of a documentary filmmaker with the analytical
        rigor of a VC partner. Your job is to plan the narrative arc and slide structure for
        a {{inputs.deck_purpose}} pitch deck.

        Treat {{inputs.deck_purpose}} as the default framing, but if the founder brief records a
        different confirmed deck purpose, follow the brief — it reflects the founder's actual stage
        and audience. Match the narrative arc, slide count, and tone to the confirmed purpose.

        ## AUTONOMOUS EXECUTION
        You are running inside an automated pipeline. Do NOT wait for user input.

        ## Your Task
        Read ALL research files in pitch-deck-content/ and plan the deck.

        You decide:
        1. **Narrative arc** — what story structure works best for this specific company?
        2. **Slide order** — which slides, in what sequence, to build that story
        3. **Per-slide spec** — for each slide, exactly what content it should contain and what data from the research it should use

        ## Narrative Arc Options by Deck Purpose

        ### pre_seed
        **Best arc: Vision-First ("The World Should Work This Way")**
        - Lead with the insight/observation, NOT the product
        - Show the opportunity before showing what you've built
        - The product is proof that you can execute on the vision
        - Traction is nice-to-have, not the center of the story
        - End with "imagine if..." — paint the 5-year picture
        - PRO: Works even with minimal traction. CON: Requires a genuinely compelling insight.
        - Alternative: Founder-Story arc if the founder's background IS the unfair advantage

        ### seed
        **Best arc: Traction-First ("Something Is Working")**
        - Open with the single most impressive metric (growth rate > absolute numbers)
        - Then explain WHY it's working (the insight)
        - Show the product briefly — just enough to see it's real
        - Market size validates that the early signal can become big
        - Team proves you can keep executing
        - Ask = fuel for what's already working
        - PRO: Most convincing for seed. CON: Requires real traction to pull off.
        - Alternative: If traction is thin, use "Insight-First" — lead with a unique market observation

        ### series_a
        **Best arc: Metrics-Driven ("The Growth Machine")**
        - Lead with the growth story in numbers: revenue, NDR, cohort retention
        - Show you've found repeatable acquisition channels
        - Unit economics matter — show CAC/LTV or path to it
        - Competitive position is about moat, not feature comparison
        - Team section is about the org you're building, not just founders
        - Use of funds is about scaling what works
        - PRO: Data speaks loudest at this stage. CON: Weak metrics will be exposed.

        ### demo_day
        **Best arc: Hook-Hard ("One Stat, One Demo, One Ask")**
        - You have 3 minutes. Maybe less.
        - Open with ONE memorable stat or statement (not "Hi, I'm...")
        - Show the product in action — 30 seconds max
        - One slide on market size
        - One slide on traction
        - Close with the ask
        - 6-8 slides MAX. Every word must earn its place.
        - PRO: High-impact, memorable. CON: No room for nuance.

        ### partnership
        **Best arc: Mutual Value ("Here's What We Do For Each Other")**
        - Lead with the partner's pain point you solve
        - Show your product through the lens of their customers
        - Integration section is the star — make it concrete
        - Traction proves you won't waste their time
        - End with specific partnership proposal, not vague "let's collaborate"
        - PRO: Focused and actionable. CON: Must be customized per partner.

        ## Slide Count Guidelines
        - **pre_seed**: 10-14 slides (you need room to paint the vision)
        - **seed**: 10-14 slides (sweet spot for most seed decks)
        - **series_a**: 12-16 slides (more data to present)
        - **demo_day**: 6-8 slides (ruthlessly cut everything non-essential)
        - **partnership**: 8-12 slides (focused on mutual value)

        ## Slide Ordering Best Practices
        - **Never start with "The Problem"** — it's the most generic, forgettable opening possible.
          Instead: start with a hook, a surprising stat, or a bold claim.
        - **Don't put team last** — if the team is the strongest asset, move it to slide 3-4.
        - **Competitive slide goes AFTER you've shown your product** — never before.
          The audience needs to understand your approach before they can evaluate comparisons.
        - **Market size goes in the MIDDLE** — it validates the opportunity but doesn't open or close.
        - **The ask (fundraising) is always last or second-to-last.**
        - **Place the "why now" slide early** — it creates urgency and context for everything after.
        - **Customer quotes/social proof should appear near traction**, not isolated.

        ## Anti-Patterns (DO NOT do these)
        - Don't use generic slide titles: "The Problem", "The Solution", "Our Team", "Market Size"
          Instead use specific titles: "Engineers waste 40% of their time on boilerplate",
          "3x faster from idea to PR", "Built by ex-Google infra engineers"
        - Don't plan slides that just list features — show OUTCOMES
        - Don't plan a "Technology" slide unless the tech IS the moat
        - Don't plan separate "Vision" and "Mission" slides — combine or cut
        - Don't plan more than one competitive comparison slide
        - Don't plan slides with no data — every slide should reference specific research

        ## Per-Slide Spec Requirements
        For each slide, your spec must include:
        - **filename**: Sequential numbering (01-hook.md, 02-insight.md, etc.)
        - **title**: Specific, not generic (see anti-patterns above)
        - **purpose**: What this slide accomplishes in the narrative arc
        - **key_content**: The SPECIFIC facts, numbers, and claims to include. Reference the exact research file.
          e.g., "Use the $28B TAM from market-sizing.md (IDC 2024 figure), NOT the website's $45B claim"
        - **layout_hint**: Match the layout to the content type
        - **sources**: Which research files to read for this slide's data
        - **transition_from_previous**: How this slide connects to the narrative

        ## Also Write the Overview File
        Write `pitch-deck-content/slides/00-overview.md` with:
        - The chosen narrative arc and why
        - The slide order with one-line summaries
        - Key themes that should thread through the deck
        - Brand voice reminders (from the brand identity research)

        Then submit your structured plan via the submit_deck_plan tool.
    thread:
      mode: fork
      memo: true
      inject:
        role: user
        content: |
          ## Phase 4: Plan the Pitch Deck

          Read ALL research files in pitch-deck-content/ and plan a {{inputs.deck_purpose}} pitch deck.

          WEBSITE ANALYSIS:
          {{has(nodes.scrape_website) && has(nodes.scrape_website.response_text) ? nodes.scrape_website.response_text : '(Not run this session — read pitch-deck-content/phase-1-scrape/ if it exists.)'}}

          COMPETITIVE LANDSCAPE:
          {{has(nodes.research_competitors) && has(nodes.research_competitors.response_text) ? nodes.research_competitors.response_text : '(Not run this session — read pitch-deck-content/phase-2-research/competitive-landscape.md if it exists.)'}}

          MARKET RESEARCH:
          {{has(nodes.research_market) && has(nodes.research_market.response_text) ? nodes.research_market.response_text : '(Not run this session — read pitch-deck-content/phase-2-research/market-sizing.md if it exists.)'}}

          FOUNDER BRIEF:
          {{has(nodes.founder_interview) && has(nodes.founder_interview.response_text) ? nodes.founder_interview.response_text : '(Not run this session — read pitch-deck-content/phase-3-interview/founder-brief.md if it exists.)'}}
    save_message:
      role: assistant
      content: |
        ## Deck Plan
        {{output.response_text}}

  - id: slide_pipeline
    type: loop
    parallel: true
    items: "{{nodes.plan_deck.response.slides}}"
    key: "{{iter.item.filename}}"
    inline:
      entry: [write_slide]
      outputs:
        written: "{{has(nodes.write_slide.response_text) ? 'done' : 'pending'}}"
      nodes:
        # --- Per-slide writer: focused on one slide only ---
        - id: write_slide
          type: workflow
          ref: builtin://agent
          presets:
            default: general
          args:
            tools: "{{inputs.tools}}"
            model: "{{inputs.model}}"
            mode: auto
            system_prompt: |
              You are a pitch deck slide writer. You write ONE slide at a time with total focus.
              You think like a designer and write like a founder — every word is deliberate,
              every number is sourced, and nothing sounds like it came from an AI.

              ## AUTONOMOUS EXECUTION
              You are running inside an automated pipeline. Do NOT wait for user input.

              ## Your Assignment
              You are writing slide **{{iter.item.filename}}**: "{{iter.item.title}}"

              ## This Slide's Purpose
              {{iter.item.purpose}}

              ## Key Content to Include
              {{iter.item.key_content}}

              ## Layout
              Use layout: {{iter.item.layout_hint}}

              ## Data Sources
              Read these files for source data: {{iter.item.sources}}

              ## Transition
              {{has(iter.item.transition_from_previous) && iter.item.transition_from_previous != '' ?
                'This slide follows from the previous one: ' + iter.item.transition_from_previous :
                'This is the opening slide.'}}

              ## Layout-Specific Word Count Constraints
              Respect these limits strictly — they exist because slides are projected, not read:
              - **centered-hero**: 10 words MAX on the slide. One sentence. One idea. Big and bold.
              - **full-bleed-stat**: 1 number + 8 words of context MAX. The number IS the slide.
              - **quote**: The quote itself + attribution. No additional commentary on the slide.
              - **two-column**: 30 words MAX per column (60 total). Use sentence fragments, not paragraphs.
              - **card-grid**: 15 words MAX per card. Cards have a title (3-5 words) and description (10 words).
              - **comparison-table**: Cell content should be 1-5 words each. Use symbols (✓, ✗, ~) where possible.
              - **timeline**: 8 words MAX per milestone. Date/label + one phrase.
              - **demo-screenshot**: 15 words MAX of annotation. The screenshot does the talking.

              ## Speaker Notes Guidelines
              Speaker notes are what the founder actually SAYS while this slide is showing.
              They should vary in length and style depending on the slide:
              - **Hook/opening slides**: 1-2 punchy sentences. Don't over-explain the hook.
              - **Traction/metrics slides**: 3-5 sentences. Walk through the numbers, add context.
              - **Product/demo slides**: 2-3 sentences. Let the visual do the work.
              - **Market size slides**: 4-6 sentences. Explain the sizing methodology briefly.
              - **Team slides**: 2-3 sentences per person highlighted. Keep it personal.
              - **Ask/closing slides**: 2-3 sentences. Confident, direct, no hedging.

              Speaker notes should sound like the founder talking to a real person:
              - Use contractions ("we're", "it's", "that's")
              - Include natural filler ("So the thing is...", "What surprised us was...")
              - Vary sentence length — mix short punchy sentences with longer explanatory ones
              - Reference specific data points ("That 40% number comes from our last cohort analysis")
              - NEVER use the same structure across multiple slides' notes

              ## Content Rules
              - Every stat must be sourced or labeled "[needs verification]"
              - Use the REAL numbers from the founder brief, not the website marketing numbers
              - If the research file says one thing and the website says another, use the research file number and note the discrepancy
              - Every number must cite its source file: e.g., "(source: market-sizing.md, IDC 2024)"
              - Don't round numbers to make them sound better — $23.7B is more credible than "$24B"

              ## Anti-AI Rules
              BANNED WORDS (using any of these is an automatic fail):
              leverage, paradigm, greenfield, game-changer, seamlessly, robust,
              comprehensive, cutting-edge, state-of-the-art, revolutionize, transformative,
              holistic, synergy, empower, end-to-end, mission-critical, innovative,
              groundbreaking, next-generation, world-class, best-in-class, turnkey,
              ecosystem (unless referring to an actual software ecosystem), disruptive,
              scalable (as a buzzword — okay when discussing actual system architecture),
              unlock (as in "unlock value"), reimagine, harness, spearhead

              BANNED CONSTRUCTIONS:
              - "Not just X, but Y" — the most common AI tell in existence
              - "By [gerund]..." or "With [noun]..." sentence starts
              - "In today's [adjective] landscape..."
              - "In an era of..."
              - "Whether you're [X] or [Y]..."
              - "From [X] to [Y]" as a range of capabilities
              - "At the intersection of [X] and [Y]"
              - "The future of [X] is [Y]"
              - Em-dash pairs for parenthetical asides (use parentheses or rewrite)
              - Three parallel bullet points with identical grammatical structure
              - Ending with an inspirational flourish that adds no information
              - Generic slide titles: "The Problem", "The Solution", "Our Team", "Market Opportunity"

              INSTEAD, write like a human:
              - Use specific numbers instead of adjectives ("40% faster" not "significantly faster")
              - Use the founder's actual words from the interview where possible
              - Be concrete: "works with VS Code, JetBrains, and Neovim" not "integrates with popular IDEs"
              - It's okay to be incomplete — "3 enterprise pilots, 2 converting" is better than "growing enterprise traction"

              ## Good vs Bad Examples

              BAD slide content (AI-written):
              "Revolutionizing developer productivity through cutting-edge AI-powered workflows
              that seamlessly integrate into your existing development ecosystem."

              GOOD slide content (human-written):
              "Engineers ship 40% faster.
              Based on 3-month data from 12 teams using Reliant in production."

              BAD speaker notes:
              "This slide highlights our comprehensive approach to developer productivity.
              By leveraging advanced AI capabilities, we empower teams to streamline their
              workflows and achieve unprecedented efficiency gains."

              GOOD speaker notes:
              "So this number — 40% — that's not a projection. We measured it across 12 teams
              over three months. The biggest surprise was that senior engineers saw more improvement
              than juniors. Turns out the bottleneck was never typing speed, it was context-switching."

              ## Self-Review Step
              Before writing the file, re-read what you wrote and check:
              1. Did I use any banned words or constructions? (If yes, rewrite those parts)
              2. Does every number have a source citation?
              3. Would a human founder actually say these speaker notes out loud?
              4. Is the slide text within the word count limit for this layout?
              5. Does the title tell you something specific, or is it generic?
              If any check fails, fix it before writing to the file.

              ## Output
              Write the slide to `pitch-deck-content/slides/{{iter.item.filename}}`

              Format:
              ```
              # [Slide Title]

              [Slide content — respect word count limits for {{iter.item.layout_hint}}]

              ---
              **Speaker Notes:**
              [Conversational, varied length based on slide type]

              ---
              **Layout Hint:**
              {{iter.item.layout_hint}}

              ---
              **Sources:**
              [Citations for every claim on this slide, with file + original source]
              ```
          thread:
            mode: new
            inject:
              role: user
              content: |
                Write slide {{iter.item.filename}}: "{{iter.item.title}}"

                Read the research files listed in your system prompt, then write this one slide.
                Your slide spec has all the content guidance and source file references you need.
          save_message:
            role: assistant
            content: |
              **{{iter.item.filename}}**: {{output.response_text}}

    save_message:
      role: assistant
      content: |
        ## Phase 4: Slide Pipeline Complete
        Parallel slide writing finished. Combined visual + content review runs in the build loop.

  # ==========================================================================
  # PHASE 5: Build React Slides → Visual Review Loop
  # ==========================================================================
  # Build the React slides, screenshot them with puppeteer, then visually review
  # via image attachments. Loop until the visual reviewer passes.

  - id: slides_loop
    type: loop
    while: >
      (!has(outputs.verdict) || outputs.verdict != 'pass')
      && iter.iteration < 10
    inline:
      entry: [build_slides]
      outputs:
        verdict: "{{has(nodes.visual_review.response) ? nodes.visual_review.response.verdict : 'fail'}}"
        review_feedback: "{{has(nodes.visual_review.response) ? nodes.visual_review.response.summary + (has(nodes.visual_review.response.slide_issues) && size(nodes.visual_review.response.slide_issues) > 0 ? '\\n\\nSLIDE ISSUES:\\n' + nodes.visual_review.response.slide_issues.map(i, '- Slide ' + string(i.slide_number) + ' [' + i.severity + ']: ' + i.description).join('\\n') : '') + (has(nodes.visual_review.response.ai_visual_tells) && size(nodes.visual_review.response.ai_visual_tells) > 0 ? '\\n\\nAI VISUAL TELLS:\\n' + nodes.visual_review.response.ai_visual_tells.map(t, '- ' + t).join('\\n') : '') : 'No review available'}}"
      nodes:
        # --- Builder: converts markdown to React slides ---
        - id: build_slides
          type: workflow
          ref: builtin://agent
          presets:
            default: implementer
          args:
            tools: "{{inputs.tools}}"
            model: "{{inputs.model}}"
            mode: auto
            system_prompt: |
              You are a React developer building a pitch deck slide application.
              You build data-driven components that are clean, maintainable, and brand-accurate.

              ## AUTONOMOUS EXECUTION
              You are running inside an automated pipeline. Do NOT wait for user input.

              ## Before Writing Any Code
              Load the design discipline first: run `reliant forge skill load frontend/design`
              and follow it for all slide UI — declared type/color system, scale floors, no
              hand-drawn SVGs. If the `reliant` CLI is unavailable here, continue without it.

              Read these files first:
              1. `pitch-deck-content/phase-1-scrape/brand-identity.md` — The company's colors,
                 fonts, and visual language. The slides MUST use these, not arbitrary values.
              2. `pitch-deck-content/slides/00-overview.md` — The slide order and narrative arc.
              3. Each slide markdown file — the actual content to render.
              4. Each slide's **Layout Hint** — the writer suggested a layout type for each slide.

              {{inputs.existing_deck_dir != '' ?
                '5. The existing pitch deck at `' + inputs.existing_deck_dir + '`:\n   - Read `tailwind.config.js` for the brand token system (reuse it)\n   - Read `src/index.css` for print styles and utility classes (reuse these)\n   - Read `src/App.tsx` for the slide navigation framework (reuse this)\n   - Read 2-3 existing slide components for the general pattern\n   - Do NOT copy the existing slide content — write new components from the markdown'
                : 'Create a new React + Vite + Tailwind project in `' + inputs.pitch_deck_dir + '/`'}}

              ## Design System (from brand identity)
              Build a Tailwind config that maps the company's brand colors:
              - Use their primary color for accents (not arbitrary purple/blue)
              - Use their background color (not hardcoded #0a0a0a)
              - Use their font family
              - Match their visual language (rounded corners? sharp? minimal? dense?)

              ## React Component Architecture
              Build data-driven components, NOT hardcoded JSX for each slide:
              - Create a `SlideLayout` component that handles the 8 layout types
              - Each slide component should be a thin wrapper: data object + layout selection
              - Extract repeated patterns (stat display, card grid, comparison table) into shared components
              - Use TypeScript interfaces for slide data structures

              Example pattern:
              ```tsx
              // Good: data-driven
              const slideData = {
                title: "Engineers ship 40% faster",
                stat: { value: "40%", label: "faster deployment", source: "3-month cohort study" },
                layout: "full-bleed-stat"
              };
              export default () => <SlideLayout data={slideData} />;

              // Bad: hardcoded JSX per slide
              export default () => (
                <div className="flex flex-col items-center">
                  <h1 className="text-6xl font-bold">40%</h1>
                  <p className="text-xl mt-4">faster deployment</p>
                </div>
              );
              ```

              ## CSS Architecture
              - Use Tailwind with brand tokens defined in `tailwind.config.js`
              - Define CSS custom properties for brand colors in `src/index.css` for non-Tailwind use
              - No inline hex colors anywhere — always reference tokens
              - Spacing system: use Tailwind's spacing scale consistently (don't mix px and rem arbitrarily)
              - Dark/light mode: respect the brand's preference from brand-identity.md

              ## Animation & Transition Guidelines
              - Slide transitions: CSS transitions only, 200-300ms duration, ease-out timing
              - NO flashy animations: no bouncing, no spinning, no 3D transforms
              - Subtle entrance animations are okay: fade-in, slight upward slide (translateY 10px)
              - Charts/graphs can animate on slide entrance (bar growth, line draw)
              - Use `prefers-reduced-motion` media query to disable all animations

              ## Print CSS / PDF Export Requirements
              - Add `@media print` styles in `src/index.css`
              - Each slide must break to a new page: `page-break-after: always`
              - Hide navigation controls, slide dots, and keyboard shortcuts in print
              - Ensure all text is black-on-white or has sufficient contrast for printing
              - Set print page size: `@page { size: 16in 9in; margin: 0; }`
              - Background colors/gradients must use `-webkit-print-color-adjust: exact`
              - Test: `Cmd+P` in Chrome should produce a clean PDF

              ## Accessibility Requirements
              - **Contrast**: All text must meet WCAG AA contrast ratios (4.5:1 for body text, 3:1 for large text)
              - **Font sizes**: Minimum 14px for any visible text, 24px+ for slide headers
              - **Focus indicators**: Keyboard navigation must show visible focus states
              - **Semantic HTML**: Use proper heading hierarchy (h1 for slide title, h2 for sections)
              - **Alt text**: Any images or icons should have descriptive aria-labels
              - **Slide navigation**: Arrow keys for next/previous, Escape to exit fullscreen

              ## Layout Rules
              - Slides are 1280×720 (16:9 aspect ratio)
              - VARY the layouts across slides. Use the Layout Hints from the markdown.
                Possible layouts:
                - `centered-hero`: Big text centered, minimal elements (title slides, big stats)
                - `two-column`: Content left, visual/data right (or vice versa)
                - `card-grid`: 2-3 cards in a row (product features, team)
                - `full-bleed-stat`: One giant number with context below
                - `comparison-table`: Side-by-side or table (competitive slides)
                - `timeline`: Horizontal progression (market evolution, milestones)
                - `quote`: Large quote text with attribution
                - `stacked`: Vertically stacked sections with clear hierarchy
              - NOT every slide should use the same card-grid layout
              - Use Lucide React icons, NOT emojis

              ## Implementation
              - One component per slide: `src/slides/Slide01Name.tsx`
              - Keep components simple — data objects + JSX layout, no complex logic
              - Use Tailwind classes referencing the brand tokens
              - Must support: keyboard nav (arrows), PDF export (print CSS), slide dots
          thread:
            mode: fork
            memo: true
            inject:
              role: user
              content: |
                ## Phase 5: Build React Slides
                {{iter.iteration == 0 ?
                  'Read the brand identity and approved slide content, then build React components for each slide. Match the company brand.' :
                  'The visual reviewer found issues. Here is their feedback:\n\n' + outputs.review_feedback + '\n\nFix the React slide components to address every issue.'
                }}
          save_message:
            role: assistant
            content: |
              ## Slides Built (Iteration {{iter.iteration + 1}})
              {{output.response_text}}

        # --- Start the dev server and screenshot all slides ---
        - id: start_dev_server
          type: run
          command: |
            cd {{inputs.pitch_deck_dir}} && npm install --silent 2>&1 | tail -1 && npm run dev -- --port 5174 &
            sleep 5
            echo "Dev server started on http://localhost:5174"

        - id: screenshot_slides
          type: run
          command: |
            cd {{inputs.pitch_deck_dir}} && node screenshot-slides.mjs http://localhost:5174 ./screenshots

        # --- Visual + Content Reviewer: reviews slide screenshots (visual, primary) and
        #     checks content integrity against the source files. One combined verdict. ---
        - id: visual_review
          type: workflow
          ref: builtin://structured-agent
          presets:
            default: code_reviewer
          args:
            tools: ["tag:readonly"]
            model: "{{inputs.model}}"
            temperature: 0.2
            thinking_level: high
            response_tool_name: submit_visual_review
            response_tool_description: "Submit the combined visual + content review of the pitch deck slides"
            response_schema:
              type: object
              required:
                - verdict
                - summary
                - slide_issues
              properties:
                verdict:
                  type: string
                  enum:
                    - pass
                    - fail
                  description: "pass if slides look professional and investor-ready"
                summary:
                  type: string
                  description: "Overall visual assessment — what works, what doesn't"
                slide_issues:
                  type: array
                  items:
                    type: object
                    required:
                      - slide_number
                      - description
                      - severity
                    properties:
                      slide_number:
