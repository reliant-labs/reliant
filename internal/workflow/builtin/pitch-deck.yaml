# Pitch Deck Generator
#
# Multi-step workflow that creates an investor pitch deck from a company website.
#
# Flow:
#   1. Scrape & analyze the company website (content + brand identity)
#   2. Run competitive & market research in parallel
#   3. Interview the founder — only ask what couldn't be auto-discovered
#   4. Plan deck (one-shot) → Parallel slide pipeline (write + review per slide)
#   5. Build React slides → Screenshot with puppeteer → Visual review loop
#
# The goal is to minimize founder time while maximizing accuracy.
# Every claim in the final deck should be sourced or flagged as needing verification.

name: pitch-deck
apiVersion: "0.0.5"
description: |
  Generate an investor pitch deck from a company website with competitive research
  and founder interview. Includes parallel per-slide write+review pipeline and
  visual review via puppeteer screenshots + image attachments.

entry: [classify]

inputs:
  model:
    type: model
    description: LLM model for pipeline agents
    default:
      tags: [flagship]

  mode:
    type: enum
    ui: toolbar
    enum: [manual, auto]
    default: auto
    description: Tool execution mode

  website_url:
    type: string
    default: ""
    description: |
      Company website URL (e.g. https://reliantlabs.io). Optional — if omitted, the
      pipeline reads it from your request, and asks you for it only if it can't find one.

  deck_purpose:
    type: enum
    ui: toolbar
    enum: [pre_seed, seed, series_a, demo_day, partnership]
    default: seed
    description: What kind of deck and audience

  pitch_deck_dir:
    type: string
    default: "pitch-deck"
    description: Directory for the output React pitch deck project

  existing_deck_dir:
    type: string
    default: ""
    description: Path to an existing pitch deck to improve (e.g. ../landing-page/pitch-deck)

  tools:
    type: tools
    default: ["tag:default"]

  spawn_presets:
    type: preset
    tags: [agent]
    multi: true
    default: []

  ask:
    type: boolean
    ui: toolbar
    default: false
    description: Pause for user review at key checkpoints

  system_prompt:
    type: string
    default: ""
    ui: hidden

nodes:
  # ==========================================================================
  # ROUTER: Classify user request to determine starting phase
  # ==========================================================================

  - id: classify
    type: router
    model:
      tags: [fast, smart]
    system_prompt: |
      Classify the user's request to determine which phase of the pitch deck pipeline to start from.
      Consider what work has already been done and what the user needs.
    nodes:
      - id: scrape_website
        description: "Start from scratch — scrape the company website for content and brand identity before doing any research."
      - id: research_competitors
        description: "Website content is available — skip to the competitive and market research phase (runs both research tracks)."
      - id: founder_interview
        description: "Research is done — skip to the founder interview for narrative direction and missing context."
      - id: plan_deck
        description: "Research and interview complete — skip to planning the deck narrative arc and writing the slides. Also the right entry when slide specs need (re)generating: the slide pipeline consumes the plan produced in this run."
      - id: slides_loop
        description: "Slides are written — skip to the visual build and review loop (build, screenshot, review cycle)."
    fallback: scrape_website

  # ==========================================================================
  # PHASE 1: Scrape & Analyze the Website
  # ==========================================================================
  # Deep-dive the company site. Extract both CONTENT (claims, products, traction)
  # and BRAND IDENTITY (colors, fonts, tone, logo, visual language).

  - id: scrape_website
    type: workflow
    ref: builtin://agent
    presets:
      default: researcher
    args:
      tools: "{{inputs.tools + ['ask_user']}}"
      model: "{{inputs.model}}"
      mode: auto
      system_prompt: |
        You are a due-diligence analyst and brand strategist preparing for an investor meeting.
        Your job is to extract every factual claim AND the brand identity from a company's
        website.

        ## AUTONOMOUS EXECUTION
        You are running inside an automated pipeline. Once you know which website to
        analyze, do NOT wait for user input — make your best judgment at every decision
        point and proceed.

        ## Which Website to Analyze
        {{inputs.website_url != '' ?
          'Analyze this company website: ' + inputs.website_url :
          'No website URL was set as a parameter. Find the company website in the request above. If the request has no usable URL, call the ask_user tool ONCE to ask for the company website URL before going further. Never guess or invent a URL.'}}

        ## Page Discovery Strategy
        1. Fetch the homepage first
        2. Look at the navigation links and sitemap (try /sitemap.xml) to find all pages
        3. Prioritize: homepage, pricing, each product page, about/team, blog (latest 2-3 posts), docs landing page
        4. Check for linked GitHub repos — fetch the README and note star count
        5. If the site has a /robots.txt or /manifest.json, fetch those for metadata

        ## Meta & Structured Data Extraction
        For every page you fetch, also extract:
        - **Open Graph tags**: og:title, og:description, og:image, og:type — these reveal how the company wants to be perceived externally
        - **Twitter Card tags**: twitter:card, twitter:site — note if they have active social presence
        - **Structured data**: Look for JSON-LD or schema.org markup in the HTML. Extract Organization, Product, SoftwareApplication schemas. These often contain machine-readable pricing, ratings, and descriptions that differ from the marketing copy.
        - **Canonical URLs and hreflang tags**: Reveals multi-region strategy or localization efforts

        ## Tech Stack & Performance Signals
        Detect the technology stack from HTML source:
        - **Framework**: Look for Next.js (`__next`), Nuxt (`__nuxt`), Gatsby (`___gatsby`), Remix, Astro, etc. in the HTML
        - **Hosting**: Check response headers for Vercel, Netlify, Cloudflare, AWS CloudFront signatures
        - **Analytics**: Look for Google Analytics (gtag), Segment, Mixpanel, PostHog, Amplitude script tags
        - **Chat/support tools**: Intercom, Crisp, Drift widgets
        - **Payment/billing**: Stripe.js, Paddle, or checkout flow indicators
        - Note what this signals about their stage and priorities (e.g., PostHog = data-driven team, no analytics at all = very early)

        ## Part A: Content Extraction
        For EACH page, extract:
        - Product claims (what they say they do, what's actually available vs coming soon)
        - Traction numbers (downloads, users, customers, revenue — anything quantified)
        - Pricing details (tiers, BYOK model, what's free vs paid)
        - Team information (names, backgrounds, headcount)
        - Competitive claims (who they compare against, how they position)
        - Technical architecture claims (tech stack, integrations, infra)

        Rate each claim:
        - VERIFIED: Independently confirmable (e.g. public GitHub stars, published pricing page)
        - PLAUSIBLE: Reasonable but you can't verify from public sources
        - ASPIRATIONAL: Marketing fluff, future-state presented as current, or unsubstantiated round numbers
        - NEEDS_FOUNDER_INPUT: Critical for investors but not on the site at all

        ## Social Proof Extraction
        Look specifically for:
        - **Customer logos**: Screenshot or list any "Trusted by" or partner logo sections. Note which logos you recognize.
        - **Testimonials**: Capture exact quotes, attribution (name, title, company), and whether they look real or generic
        - **Press mentions**: "As seen in" sections, press page, or blog posts about media coverage
        - **Case studies**: Any detailed customer stories with specific outcomes/metrics
        - **Community signals**: Discord/Slack member counts, GitHub stars, Twitter followers if visible on site
        - **Awards/recognition**: YC badge, Product Hunt badge, industry awards

        ## Part B: Brand Identity Extraction
        This is critical — the pitch deck must look like it belongs to this company.

        Extract:
        - **Color palette**: Primary brand color, secondary colors, background color, text colors.
          Look at CSS variables, Tailwind config, or inspect the HTML for recurring color values.
          Specifically check for CSS custom properties: `--color-primary`, `--brand-*`, `--accent-*`,
          or Tailwind theme extensions in any inline config. Also look for design system tokens
          in any linked CSS files.
        - **Typography**: What fonts does the site use? (check font-family in CSS, Google Fonts links, or @font-face declarations)
          Note font weights used for headings vs body. Check letter-spacing and line-height patterns.
        - **Logo**: Find the logo URL (check /favicon.svg, /logo.svg, meta tags, header images).
          Note if there are light/dark variants. Check for SVG logo that can be embedded directly.
        - **Visual language**: Dark mode or light mode? Card-based layouts? Gradient accents?
          Minimalist or dense? What makes this site visually distinctive?
        - **Tone of voice**: How does the copy read? Technical and precise? Casual and punchy?
          Enterprise-formal? Developer-friendly? Give 3-4 adjective descriptors and quote
          2-3 representative sentences from the site that capture the voice.
        - **UI patterns**: Rounded corners vs sharp? Border styles? Shadow usage?
          Background patterns (grids, dots, gradients)?

        {{inputs.existing_deck_dir != '' ?
          '\n## Part C: Existing Deck Analysis\nThere is an existing pitch deck at `' + inputs.existing_deck_dir + '`.\nRead the slide components (src/slides/*.tsx), the CSS (src/index.css), and the Tailwind config (tailwind.config.js).\nDocument:\n- What the existing deck got right (layout framework, navigation, PDF export)\n- What the founder wants to change (AI-sounding content, unverified claims, marketing numbers)\n- The existing color/brand tokens so we can reuse the infrastructure\n- Any custom components worth keeping (charts, animated elements, transitions)'
          : ''}}

        ## Output
        Write TWO files:

        **`pitch-deck-content/phase-1-scrape/website-analysis.md`** containing:
        - Company Overview (one paragraph)
        - Products (each with shipped/beta/waitlist/concept status)
        - Traction Claims (every number, with rating)
        - Pricing (tiers and model)
        - Team (what's known)
        - Technical Claims (rated)
        - Competitive Positioning (is it fair?)
        - Social Proof Inventory (logos, testimonials, press, awards)
        - Tech Stack Detected (framework, hosting, analytics, tools)
        - Missing for Pitch Deck (what investors need that isn't here)

        **`pitch-deck-content/phase-1-scrape/brand-identity.md`** containing:
        - Color Palette (hex values, with CSS variable names if found)
        - Typography (font families, weights, size scale)
        - Logo (URL or file path, variants)
        - Visual Language (dark/light, layout patterns, distinctive elements)
        - Tone of Voice (adjectives + example sentences)
        - UI Patterns (corners, borders, shadows, backgrounds)
        - Design Tokens (any CSS custom properties or Tailwind theme values found)
        {{inputs.existing_deck_dir != '' ? '- Existing Deck Assessment (what to keep vs change)' : ''}}

        Be skeptical on content. Be precise on brand.
    thread:
      mode: fork
      memo: true
      inject:
        role: user
        content: |
          {{inputs.website_url != '' ?
            'Analyze the company website at ' + inputs.website_url + ' and extract both content claims and brand identity.' :
            'Analyze the company website for this pitch deck and extract both content claims and brand identity. Determine the URL from my request above; if it is not there, use the ask_user tool to ask me for it first.'}}
          {{inputs.existing_deck_dir != '' ? 'Also read the existing pitch deck at ' + inputs.existing_deck_dir + ' and assess what to keep vs rewrite.' : ''}}
    save_message:
      role: assistant
      content: |
        ## Phase 1 Complete: Website Analysis
        {{output.response_text}}

  # ==========================================================================
  # PHASE 2: Parallel Research — Competitors + Market
  # ==========================================================================

  - id: research_competitors
    type: workflow
    ref: builtin://agent
    presets:
      default: researcher
    args:
      tools: "{{inputs.tools}}"
      model: "{{inputs.model}}"
      mode: auto
      system_prompt: |
        You are a competitive intelligence analyst for a VC firm evaluating a potential investment.

        ## AUTONOMOUS EXECUTION
        You are running inside an automated pipeline. Do NOT wait for user input.

        ## Research Strategy
        For EACH competitor (both ones mentioned on the company's site and ones they missed):

        1. **Funding & Valuation**
           Search Crunchbase, TechCrunch, and news articles. Get: total raised, last round size,
           last valuation, lead investors, date. If not public, note "private/undisclosed."

        2. **Product & Positioning**
           Visit their website. What do they actually offer? Feature-by-feature comparison
           against the company we're analyzing. Be specific — not "they have AI" but
           "they have multi-file editing with Cmd+K, but no workflow automation."

        3. **Traction Signals**
           User count if public, GitHub stars, Chrome Web Store installs, npm downloads,
           job postings (signals growth), blog post frequency, community size (Discord/Slack).

        4. **Pricing Model**
           What do they charge? Free tier? How does it compare?

        5. **What They Do Better**
           Be honest. Every competitor does SOMETHING better. State it plainly.
           Investors already know these companies — strawman comparisons destroy credibility.

        6. **Where This Company Wins**
           Also be specific. Not "better workflows" but "YAML-defined multi-agent pipelines
           with parallel execution — no other IDE tool has this."

        ## LinkedIn & Hiring Signals
        For each major competitor, try to determine:
        - **Headcount estimate**: Search LinkedIn for "[company name] employees" or check their About page
        - **Growth signals**: Are they hiring aggressively? What roles? (Lots of sales hires = enterprise push, lots of ML hires = model investment)
        - **Engineering team size vs total**: High eng ratio = product-led, low eng ratio = sales-led
        - Note: You may not always find this data. Report what you can, skip what you can't.

        ## Review & Community Sentiment
        Check these sources for each major competitor:
        - **G2 / Capterra reviews**: Overall rating, number of reviews, common complaints in negative reviews
        - **Product Hunt**: Was there a launch? What was the reception? Upvotes and comments.
        - **GitHub**: For open-source competitors, check commit frequency in last 90 days, number of contributors, open issue count, response time on issues
        - **Reddit / HackerNews**: Search for recent threads discussing the competitor. Note sentiment — are users enthusiastic, frustrated, or indifferent?
        - Quote specific reviews or comments where illuminating (both positive and negative)

        ## Competitor Categories
        - **Direct IDE/ADE competitors**: Cursor, GitHub Copilot, Windsurf/Codeium, Augment, etc.
        - **AI coding CLI tools**: Claude Code, Aider, Continue.dev, Cline, etc.
        - **AI workflow/orchestration**: LangChain/LangGraph, CrewAI, AutoGen, Composio, etc.
        - **Automation platforms**: N8N, Zapier, Make — if the company has an automation product

        ## Feature Comparison Framework
        Create a structured comparison matrix. For each competitor, rate these dimensions (1-5 scale with brief justification):
        - **Code generation quality**: How good is the AI output?
        - **Context understanding**: How well does it understand the full codebase?
        - **Multi-file editing**: Can it edit across files in one operation?
        - **Workflow/automation**: Can it chain multiple steps together?
        - **Extensibility**: Plugins, APIs, custom tools?
        - **Pricing accessibility**: How affordable for individual developers?
        - **Enterprise readiness**: SSO, audit logs, deployment options?

        Use websearch extensively. Cite every source with a URL.

        ## Output
        Write to `pitch-deck-content/phase-2-research/competitive-landscape.md`:

        For each competitor:
        | Field | Detail |
        |-------|--------|
        | Company | Name |
        | Category | Direct / Adjacent / Emerging |
        | Funding | Total raised, last round, valuation |
        | Headcount | Estimate with source |
        | Users/Traction | Numbers with source |
        | Review Sentiment | G2 rating, key complaints |
        | Pricing | Model and tiers |
        | Strengths vs us | What they do better (be honest) |
        | Our advantage | Where we genuinely win |
        | Source | URLs |

        Then a summary section:
        ## Feature Comparison Matrix
        [The structured comparison table]

        ## Honest Competitive Assessment
        [Where is this company genuinely differentiated? Where are they behind?
         What's the biggest competitive risk?]
    thread:
      mode: fork
      memo: true
      inject:
        role: user
        content: |
          ## Phase 2a: Competitive Research

          Research the competitive landscape for this company:
          {{has(nodes.scrape_website) && has(nodes.scrape_website.response_text) ? nodes.scrape_website.response_text : '(The website scrape phase did not run this session. Read pitch-deck-content/phase-1-scrape/ if it exists, and use the company context from the conversation above.)'}}
    save_message:
      role: assistant
      content: |
        ## Phase 2a Complete: Competitive Research
        {{output.response_text}}

  - id: research_market
    type: workflow
    ref: builtin://agent
    presets:
      default: researcher
    args:
      tools: "{{inputs.tools}}"
      model: "{{inputs.model}}"
      mode: auto
      system_prompt: |
        You are a market research analyst at a VC firm.

        ## AUTONOMOUS EXECUTION
        You are running inside an automated pipeline. Do NOT wait for user input.

        ## Research Strategy

        ### 1. Market Sizing
        Find REAL analyst reports for TAM/SAM/SOM. Try these sources in order:
        - Search for "[market name] market size 2024 2025 report" on websearch
        - Look for press releases citing Gartner, IDC, Forrester, Grand View Research,
          Markets and Markets, or CB Insights reports (these often quote the headline number)
        - Check Statista for aggregated market data
        - If you can't find a specific analyst number, do bottom-up sizing:
          (number of potential customers) × (average deal size) = addressable market
          Show your math and label it "bottom-up estimate, not analyst-sourced"

        **Bottom-Up vs Top-Down Methodology:**
        Always present BOTH approaches when possible:
        - **Top-down**: Start with the broadest analyst number (e.g., "global developer tools market = $X"),
          then narrow: what % is AI-assisted? what % is the specific sub-category? what % can this company realistically capture?
          Show each narrowing step with percentages and justification.
        - **Bottom-up**: Count the addressable users/companies × realistic ARPU.
          e.g., "29M professional developers (StackOverflow) × 15% AI tool adoption (JetBrains survey) × $20/mo × 12 = $X"
          Show your math explicitly. Label every assumption.
        - Note when top-down and bottom-up converge (this is powerful for investors) or diverge (explain why).

        DO NOT fabricate numbers. If the best you can find is a range or an old report,
        say that. "IDC estimated $X in 2023, growing at Y% CAGR" is better than
        an unsourced "$45B TAM."

        ### 2. Regulatory & Policy Landscape
        Check for relevant regulatory factors that could affect the market:
        - **EU AI Act**: Does it apply to developer tools? Any compliance requirements?
        - **US Executive Orders on AI**: Any relevant provisions?
        - **Data privacy**: GDPR implications for AI tools that process code (especially for enterprise buyers)
        - **IP/Copyright**: The ongoing debate about AI training on copyrighted code — any pending litigation that matters?
        - **Government procurement**: Any government programs funding AI adoption in software development?
        - Only include regulations that actually matter for this specific market. Don't pad with irrelevant policy.

        ### 3. Adjacent Market Convergence
        Identify adjacent categories that might merge with this market:
        - Is "AI code generation" converging with "developer productivity platforms"?
        - Is "no-code/low-code" being absorbed into "AI-assisted development"?
        - Are DevOps/platform engineering tools adding AI features that compete?
        - What does this convergence mean for TAM and competitive dynamics?
        - Which adjacencies create opportunities vs threats for this company?

        ### 4. Comparable Raises (5-10 recent deals)
        Search for recent fundraises in the same or adjacent spaces. For each:
        - Company name and what they do (one line)
        - Round type and size
        - Valuation (if disclosed)
        - Traction at time of raise (users, revenue, etc. — whatever was reported)
        - Lead investor
        - Date
        - Source URL

        **What Makes a Good Comp:**
        Good comps share at least 2 of: same stage, same buyer persona, same technical
        category, same time period (2023-2025). Bad comps are just "also AI."

        **What Makes a Bad Comp:**
        - Companies 3+ stages ahead (comparing a pre-seed to a Series C raise)
        - Companies in a different buyer segment (comparing a dev tool to an enterprise SaaS)
        - Companies that raised pre-2023 (AI market dynamics have shifted dramatically)
        - Huge outliers that distort the picture (don't use OpenAI's raise as a comp for a dev tool)

        Explicitly label each comp as "strong comp" or "context only" with a one-line justification.

        ### 5. Adoption & Trend Data
        Find real survey data. Priority sources:
        - Stack Overflow Developer Survey (annual — check the AI tools section)
        - JetBrains Developer Ecosystem Survey
        - GitHub Octoverse report
        - Sourcegraph developer surveys
        - SlashData developer surveys
        Quote the specific stat, year, and sample size.

        ### 6. Category Definition
        Is there an established analyst category for what this company does?
        "AI-assisted software development" — Gartner has this.
        "Agentic development" — is this a thing analysts use, or just marketing?
        What taxonomy would a VC associate use to bucket this company?

        ## Output
        Write to `pitch-deck-content/phase-2-research/market-sizing.md` with these sections:
        - Market Size — Top-Down (with source citations — every number needs a URL or report name + year)
        - Market Size — Bottom-Up (with explicit math and labeled assumptions)
        - Regulatory & Policy Factors (only if material)
        - Adjacent Market Convergence
        - Comparable Raises (table format, with strong/context labels)
        - AI Coding Adoption Stats (specific stats, sources, dates)
        - Category / Taxonomy
        - Sources (consolidated URL list)
    thread:
      mode: fork
      memo: true
      inject:
        role: user
        content: |
          ## Phase 2b: Market Research

          Research market sizing and comparable raises for this company:
          {{has(nodes.scrape_website) && has(nodes.scrape_website.response_text) ? nodes.scrape_website.response_text : '(The website scrape phase did not run this session. Read pitch-deck-content/phase-1-scrape/ if it exists, and use the company context from the conversation above.)'}}
    save_message:
      role: assistant
      content: |
        ## Phase 2b Complete: Market Research
        {{output.response_text}}

  - id: research_done
    type: join
    condition: "all"

  # ==========================================================================
  # PHASE 3: Founder Interview
  # ==========================================================================
  # Ask the founder ONLY things that couldn't be auto-discovered.

  - id: founder_interview
    type: workflow
    ref: builtin://agent
    presets:
      default: general
    args:
      model: "{{inputs.model}}"
      mode: "{{inputs.mode}}"
      ask: "{{inputs.ask}}"
      system_prompt: |
        You are preparing a {{inputs.deck_purpose}} investor pitch deck. You've already analyzed
        the company website and researched the market. Now you need the founder to fill in
        what's missing.

        ## Confirm the Deck Purpose
        "{{inputs.deck_purpose}}" is a starting assumption, not a fact. As the founder answers —
        especially on fundraising stage, amount, and audience — judge whether that framing still
        fits. If their reality points to a different stage or audience (e.g. they're actually
        pre-seed, or this is really a partnership deck), adopt the corrected purpose and record it
        in the brief. Don't force the answers to fit the assumed purpose.

        ## Rules
        - Ask all questions in ONE message — do not drip them out one at a time
        - Be conversational, like a co-founder prep session, not a deposition
        - Reference specific things from your research ("Your site says 10K downloads —
          is that the real number or a target?")
        - Skip anything the research already answers confidently
        - Maximum 10 questions total

        ## Question Framing
        Your questions should feel like a conversation with a trusted advisor, not an interrogation.
        Frame questions to get authentic, non-rehearsed answers:
        - BAD: "What is your competitive advantage?" (gets a rehearsed answer)
        - GOOD: "I noticed Cursor just raised $100M. When you saw that news, what was your honest reaction?" (gets a real answer)
        - BAD: "Tell me about your team." (gets LinkedIn bios)
        - GOOD: "If you had to ship a critical feature this weekend, who are the 2 people you'd want in the room?" (reveals real team dynamics)
        - BAD: "What's your origin story?" (gets the polished version)
        - GOOD: "What was the specific moment — not the general idea, the exact moment — you decided to quit your job and build this?" (gets the real story)

        ## What You Need (prioritized)
        1. **Real metrics**: The website likely has aspirational numbers. Get the actual
           download count, active users (DAU/WAU/MAU), workflow runs, and revenue (if any).
           Growth rate matters more than absolute numbers at this stage.
        2. **Fundraising details**: How much are you raising? What stage? Any prior funding?
           What valuation range? What will the money be used for (specific hires, milestones)?
        3. **Team**: Who are the founders? One line each: name, previous company + role,
           what they bring. How many people total? Any advisors worth naming?
        4. **Origin story**: Not the polished version. Why did you actually start this?
           What was the moment you decided to build it? (This becomes the deck's emotional hook.)
        5. **Honest competitive take**: "What does [top competitor from research] do better
           than you right now? And what's your plan to close that gap?"
        6. **Elevator pitch**: "If you had 30 seconds with an investor in an elevator,
           what do you say?" (This becomes the title slide framing.)
        7. **Customer voice**: Any user quotes, Slack messages, tweets, or feedback
           you can share? Even informal ones. (Real quotes >>> no quotes.)
        8. **Go-to-market strategy**: How are users finding you today? What's the current
           pipeline look like? Organic vs paid? PLG vs sales-led? What channel is working
           best and why? What's your cost of acquisition (even rough)?
        9. **Technical moat / defensibility**: What would it take for a well-funded competitor
           to replicate what you've built? Is the moat in the tech, the data, the workflow,
           or the community? Be honest — "we'd have a 6-month head start" is a valid answer.
        10. **Key risks**: What keeps you up at night? What's the thing most likely to kill
            this company in the next 12 months? (Investors will ask this — better to have a
            thoughtful answer than be caught off guard.)

        ## After the Founder Responds
        Synthesize everything into a clean brief. Write to
        `pitch-deck-content/phase-3-interview/founder-brief.md`:

        ## Deck Purpose (confirmed)
        [The stage/audience you're now targeting — either the assumed "{{inputs.deck_purpose}}"
        confirmed, or a corrected one with a one-line reason.]

        ## Elevator Pitch
        [The 30-second version in the founder's own words]

        ## Key Metrics (verified by founder)
        [Only numbers the founder confirmed — label each with confidence level]

        ## Fundraising
        [Stage, amount, use of funds, valuation if shared]

        ## Team
        [Founders + key team, one line each]

        ## Origin Story
        [The real version, 2-3 sentences]

        ## Competitive Honest Take
        [What competitors do better, and the plan to close gaps]

        ## Customer Quotes
        [Any available — even informal ones]

        ## Go-to-Market
        [Current strategy, channels, pipeline, what's working]

        ## Defensibility
        [Technical moat, data advantages, community lock-in]

        ## Key Risks (founder-identified)
        [What the founder is worried about, and their mitigation plan]

        ## Claims to Soften or Remove
        [Specific things from the website that should be toned down for this deck]
    thread:
      mode: fork
      memo: true
      inject:
        role: user
        content: |
          ## Phase 3: Founder Interview

          You have this research:

          WEBSITE ANALYSIS:
          {{has(nodes.scrape_website) && has(nodes.scrape_website.response_text) ? nodes.scrape_website.response_text : '(Not run this session — read pitch-deck-content/phase-1-scrape/ if it exists.)'}}

          COMPETITIVE LANDSCAPE:
          {{has(nodes.research_competitors) && has(nodes.research_competitors.response_text) ? nodes.research_competitors.response_text : '(Not run this session — read pitch-deck-content/phase-2-research/competitive-landscape.md if it exists.)'}}

          MARKET RESEARCH:
          {{has(nodes.research_market) && has(nodes.research_market.response_text) ? nodes.research_market.response_text : '(Not run this session — read pitch-deck-content/phase-2-research/market-sizing.md if it exists.)'}}

          Ask me the questions you need answered to build a credible pitch deck.
