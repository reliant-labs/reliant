                        type: string
                        description: "The content problem (wrong/unsourced number, AI-language copy, broken narrative) and the fix"
                  description: "Content-integrity problems: stats that contradict or omit their source, AI-sounding copy, or narrative gaps. A critical content_issue fails the deck just like a critical visual one."
          thread:
            mode: new
            inject:
              role: user
              content: |
                ## Visual Review: Pitch Deck Slides

                You are reviewing screenshot images of each slide in the pitch deck.
                Each attached image is a 1280×720 screenshot of one slide, in order.

                **Before reviewing**: Read the source-of-truth files so you can judge content, not
                just appearance:
                - `pitch-deck-content/phase-1-scrape/brand-identity.md` — the company's brand (slides should match it).
                - `pitch-deck-content/phase-3-interview/founder-brief.md` and the research files
                  (`phase-2-research/competitive-landscape.md`, `phase-2-research/market-sizing.md`) — the REAL numbers.

                **Content integrity (counts toward the verdict, alongside the visuals → `content_issues`):**
                - Every stat visible on a slide must match the research/founder-brief numbers and cite a source.
                  A number that contradicts the sources, or a bare claim with no citation, is a critical content issue.
                - Flag AI-language copy visible on the slides: buzzwords (leverage, seamless, robust, paradigm),
                  "not just X, but Y", "in today's landscape", generic titles like "The Problem"/"Market Opportunity".
                - Check the narrative arc across slides: does the story flow (problem → solution → proof → ask)?
                  Call out gaps or slides that break the throughline.
                Primary weight is still visual, but a critical content problem fails the deck.

                **Per-slide checks:**
                - Is text readable at presentation size? (min ~14px body, ~24px headers on 1280×720)
                - Is the layout balanced? Appropriate whitespace?
                - Does content overflow or get truncated?
                - Does the layout match what the content calls for? (a single big stat shouldn't be
                  in a card grid; a comparison shouldn't be a bulleted list)

                **Cross-slide checks:**
                - Do the slides use the company's actual brand colors (from brand-identity.md)?
                  Or are they using arbitrary dark-theme defaults?
                - Is there layout VARIETY? If 3+ slides use identical card grids, that's a fail.
                - Is typography consistent? Same font family, coherent size scale?
                - Do transitions between slides feel natural in the narrative?

                **Contrast & Accessibility Checks:**
                - Check text contrast ratios: light text on dark bg must be at least 4.5:1 (WCAG AA)
                - Check that headers are visually distinct from body text (size AND weight)
                - Verify that key numbers/stats are the largest text on their slides
                - Check for any text that would be invisible when projected (gray-on-gray, low opacity)

                **Padding & Spacing Consistency:**
                - Check that all slides use a consistent padding system (e.g., same outer margins)
                - Card components should have identical padding across all slides
                - Spacing between sections should be consistent within a layout type
                - No content should touch the edge of the slide — minimum 40px padding from edges

                **Chart & Graph Readability (if any):**
                - Axis labels must be legible at presentation size
                - Data labels on bars/points should be readable
                - Colors in charts should be distinguishable (not just slight shade variations)
                - Legends should be close to the data they describe

                **AI visual tells (auto-fail if found):**
                - Every slide using the same 3-card-in-a-row layout
                - Decorative purple/blue gradient blobs on every slide
                - Corner accent lines on every slide
                - Emoji characters used as icons
                - Perfectly symmetric layouts with no visual hierarchy

                **Projection readiness:**
                - This deck will be shown on a projector or screen share. Small text = unreadable.
                - Low-contrast text (gray on dark gray) = invisible when projected.
                - Check that key numbers and headlines are large enough to read from across a room.

                **Verdict guidance:**
                - `pass` = A founder could present this tomorrow without embarrassment — visuals AND content hold up
                - `fail` = Any critical issue: visual defect, brand mismatch, AI-generated appearance,
                  a wrong/unsourced number, or a broken narrative
