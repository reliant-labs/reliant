name: vuln-patch
title: Patch vulnerabilities
apiVersion: "0.0.5"
description: |
  Patches the vulnerabilities forge found in an env's release and opens ONE pull request with the fix. It makes
  a worktree from the default branch and runs `reliant forge vuln patch <env> --no-pr --verify --json`, which
  bumps each vulnerable dependency, base image or Go toolchain to its fix with the ecosystem's own tool and runs
  the project's gate. When that bump breaks the build or the tests, or a finding has no deterministic route,
  a restricted agent (a shell with no credentials, nothing loadable) takes over in the same run, for at most
  max_agent_iterations attempts; after each one the workflow itself checks that no test was deleted or skipped,
  the verify command passes and `reliant forge vuln scan . --json` no longer reports the targeted findings. The
  pull request opens only when that holds: a red patch ends the run failed, with the agent's summary, and opens
  nothing. git_publish pushes a vuln-patch/ branch (never the default branch, never a force). Never merges.

  env may instead name a directory (`.`, or a relative path such as `frontends/web`), as `reliant forge vuln
  patch` itself accepts: the findings are then a fresh scan of that tree (`reliant forge vuln scan <dir>
  --json`), for a project with no deployed env whose findings forge records.

inputs:
  project:
    type: string
    default: ""
    description: >-
      The forge project to patch, as a path inside the run's worktree: the repository's directory in a project
      of several repositories (for example `api`), or the subdirectory that holds forge.yaml. Empty: the
      worktree root.
  env:
    type: string
    default: prod
    description: >-
      The env whose current release's findings are patched (`reliant forge vuln list <env>` shows them). Or a
      directory, `.` or a relative path holding a `/` (no `..`), resolved from the forge project: its tree is
      scanned and the findings that scan reports are patched, as `reliant forge vuln patch <dir>` does.
  advisories:
    type: array
    default: []
    description: >-
      Advisory ids to patch (CVE-…, GHSA-…, GO-…; a CVE finds its GHSA). Empty: every finding with a fixed
      version that no exemption covers.
  patch_mode:
    type: enum
    enum: [deterministic, agent]
    default: deterministic
    description: >-
      deterministic: `reliant forge vuln patch` bumps first and the agent takes over only if the bump breaks
      the build or tests or leaves a finding it has no route for. agent: skip the bump and let the agent do the
      whole patch (a major-only fix, or one the patcher refused).
  max_agent_iterations:
    type: integer
    default: 3
    min: 1
    max: 10
    description: The most agent attempts. Each one is followed by the verify command and a rescan; this bounds the LLM spend.
  model:
    type: model
    description: The model the agent takes over with.
    default:
      tags: [flagship]
  max_turns:
    type: integer
    default: 80
    min: 10
    max: 200
    description: The most agent turns in one attempt.
  verify_command:
    type: string
    default: ""
    description: >-
      The project's gate, run in the forge project with no credentials after every agent attempt; it must exit
      0. Empty: the command `reliant forge vuln patch --verify` ran (vuln.patch.verify in forge.yaml, else the
      project's own gate), or in agent mode `task test:short` when the Taskfile has it, else go build and go
      test -short, else npm test.
  approve_code_changes:
    type: boolean
    default: false
    description: >-
      Ask a person to approve before the pull request opens when the agent changed files other than dependency
      manifests and lockfiles (go.mod, package.json, a Dockerfile, …). Off: the verify gate alone decides.

# What a workflow that starts this one by ref routes on. Every ending that opens no pull request,
# but nothing-to-patch, declares outcome: failure, which fails a run of this workflow but not the
# parent of a `workflow:` node that runs it: a parent reads result instead.
outputs:
  # opened: the pull request is open (pr_url). nothing: no finding to patch, no pull request.
  # failed: no pull request; the run's last message says why.
  result: >-
    {{ nodes.?pr.?is_error.orValue(true) == false ? 'opened'
       : (nodes.?route.?kind.orValue('') == 'nothing' ? 'nothing' : 'failed') }}
  pr_url: "{{ nodes.?pr.?is_error.orValue(true) == false ? string(nodes.?pr.?data.?html_url.orValue('')) : '' }}"

entry: [check]

nodes:
  # The env, the project path and every advisory id reach a shell command, so each must be a plain token.
  # env names a directory exactly when forge's own patch reads it as one (`.`, or it holds a `/`); a
  # directory is a relative path of plain segments, none starting with `-` and none `..`.
  - id: check
    type: compute
    outputs:
      valid: >-
        {{ (inputs.env == '.' || inputs.env.contains('/')
              ? inputs.env.matches('^([.]/)?[A-Za-z0-9_.][A-Za-z0-9._-]*(/[A-Za-z0-9_.][A-Za-z0-9._-]*)*$') && !inputs.env.contains('..')
              : inputs.env.matches('^[A-Za-z0-9][A-Za-z0-9._-]*$'))
           && inputs.project.matches('^([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$') && !inputs.project.contains('..')
           && inputs.advisories.all(a, type(a) == string && a.matches('^[A-Za-z0-9][A-Za-z0-9._:-]*$')) }}
      run8: "{{ workflow.id.substring(0, 8) }}"
      branch: "vuln-patch/{{ workflow.id.substring(0, 8) }}"
      # Every argument of the two forge commands, quoted (validated above). Never empty: a run node refuses a
      # command with an empty interpolation.
      patch_args: >-
        {{ ["'" + inputs.env + "'"] + inputs.advisories.map(a, "'" + string(a) + "'") + ['--no-pr', '--verify', '--json'] }}
      # Directory mode: env names a tree to scan, not an env whose recorded findings forge lists.
      dir_mode: "{{ inputs.env == '.' || inputs.env.contains('/') }}"
      subject: "{{ inputs.env == '.' || inputs.env.contains('/') ? 'directory `' + inputs.env + '`' : 'env `' + inputs.env + '`' }}"
      # The findings in agent mode: the env's list, or a scan of the directory (`vuln list` takes only an
      # env; a scan has no --fixable, so plan keeps the fixable findings itself).
      list_args: >-
        {{ inputs.env == '.' || inputs.env.contains('/')
           ? ['scan', "'" + inputs.env + "'", '--json']
           : ['list', "'" + inputs.env + "'", '--json'] + (size(inputs.advisories) == 0 ? ['--fixable'] : []) }}
      # The project's gate when nothing names one (agent mode, with no verify_command): the order
      # `forge vuln patch --verify` uses.
      fallback_verify: |
        if [ -f Taskfile.yml ] && task --list-all 2>/dev/null | grep -qE '^\* test:short:'; then task test:short
        elif [ -f go.mod ]; then go build ./... && go test -short ./...
        elif [ -f package.json ]; then npm test
        else echo "no verify command: set the workflow's verify_command input"; exit 1
        fi

  - id: invalid
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        Refusing to run: env, project and every advisory must be plain names (env '{{ untrustedText(inputs.env, 80) }}',
        project '{{ untrustedText(inputs.project, 120) }}', advisories {{ untrustedJson(inputs.advisories) }}).

  - id: wt
    type: create_worktree
    args:
      name: "vuln-patch-{{ nodes.check.run8 }}"
      base_branch: ""
      force: true

  - id: proj
    type: compute
    outputs:
      path: "{{ inputs.project == '' ? nodes.wt.path : nodes.wt.path + '/' + inputs.project }}"

  # The forge project inside the worktree, its git checkout, and the GitHub repository its origin names.
  - id: dir
    type: run
    timeout: 2m
    args:
      command: |
        d='{{ nodes.proj.path }}'
        [ -f "$d/forge.yaml" ] || { echo "$d has no forge.yaml: set the project input to the forge project's path in the worktree" >&2; exit 1; }
        root=$(git -C "$d" rev-parse --show-toplevel 2>/dev/null) || { echo "$d is not in a git checkout" >&2; exit 1; }
        url=$(git -C "$root" remote get-url origin 2>/dev/null) || { echo "$root has no origin remote" >&2; exit 1; }
        repo=$(printf '%s' "$url" | sed -E -e 's#\.git$##' -e 's#^.*github\.com[:/]##')
        printf '%s\n%s\n%s' "$d" "$root" "$repo"
      credentials: none

  - id: where
    type: compute
    outputs:
      dir: >-
        {{ nodes.dir.exit_code == 0 ? nodes.dir.stdout.split('\n')[0] : '' }}
      root: >-
        {{ nodes.dir.exit_code == 0 && size(nodes.dir.stdout.split('\n')) == 3 ? nodes.dir.stdout.split('\n')[1] : '' }}
      repo: >-
        {{ nodes.dir.exit_code == 0 && size(nodes.dir.stdout.split('\n')) == 3 ? nodes.dir.stdout.split('\n')[2] : '' }}
      ok: >-
        {{ nodes.dir.exit_code == 0 && size(nodes.dir.stdout.split('\n')) == 3
           && nodes.dir.stdout.split('\n')[2].matches('^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$') }}

  - id: no_checkout
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        No forge project of a GitHub repository was found in the worktree {{ nodes.wt.path }}:
        {{ nodes.dir.exit_code != 0 ? untrustedText(nodes.dir.stderr, 400) : 'its origin remote is not a github.com repository' }}.

  - id: repo_info
    type: action
    uses: github/repo.get@1
    with:
      owner: "{{ nodes.where.repo.split('/')[0] }}"
      repo: "{{ nodes.where.repo.split('/')[1] }}"

  - id: no_repo
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "Could not read {{ nodes.where.repo }} on GitHub, so no pull request could be opened: {{ untrustedText(string(nodes.repo_info.content), 400) }}"

  # The deterministic bump. It reads the env's findings, which may live on the control plane, so it keeps
  # the machine's credentials: the command is fixed, nothing a model wrote. Every command after the agent
  # touches the tree runs with none.
  - id: patch
    type: run
    condition: "inputs.patch_mode == 'deterministic'"
    timeout: 45m
    args:
      command: |
        cd '{{ nodes.where.dir }}' || exit 3
        reliant forge vuln patch {{ nodes.check.patch_args.join(' ') }}

  # In agent mode the patcher never ran: the findings to target come from the env's list instead, or from
  # a scan of the directory.
  - id: listing
    type: run
    condition: "inputs.patch_mode == 'agent'"
    timeout: 10m
    args:
      command: |
        cd '{{ nodes.where.dir }}' || exit 3
        reliant forge vuln {{ nodes.check.list_args.join(' ') }}

  - id: parsed
    type: compute
    outputs:
      ran: "{{ inputs.patch_mode == 'deterministic' }}"
      code: >-
        {{ inputs.patch_mode == 'deterministic' ? nodes.?patch.exit_code.orValue(-1) : nodes.?listing.exit_code.orValue(-1) }}
      doc: >-
        {{ json.decode(inputs.patch_mode == 'deterministic' ? nodes.?patch.stdout.orValue('') : nodes.?listing.stdout.orValue('')).orValue({}) }}
      stderr: >-
        {{ untrustedText(inputs.patch_mode == 'deterministic' ? nodes.?patch.stderr.orValue('') : nodes.?listing.stderr.orValue(''), 400) }}

  # The findings the pull request must fix, each with every name a scanner may report it under.
  - id: plan
    type: compute
    outputs:
      has_doc: "{{ nodes.parsed.doc.?schema.orValue('') != '' }}"
      targets: >-
        {{ nodes.parsed.ran == true
           ? nodes.parsed.doc.?findings.orValue([]).map(f, {
               'id': string(f.id),
               'names': [string(f.id)] + (has(f.aliases) && f.aliases != null ? f.aliases : []),
               'package': string(f.?package.?name.orValue('')),
               'installed': string(f.?installed.orValue('')),
               'fixed_in': string(f.?target.orValue('')),
               'status': string(f.?status.orValue('')),
               'reason': string(f.?reason.orValue(''))})
           : cel.bind(found, nodes.parsed.doc.?findings.orValue([])
                 .filter(f, size(inputs.advisories) == 0
                   ? (nodes.check.dir_mode != true || f.?fix_state.orValue('') == 'fixed'
                      || (has(f.fixed_in) && f.fixed_in != null && size(f.fixed_in) > 0))
                   : inputs.advisories.exists(a, a == f.id || (has(f.aliases) && f.aliases != null && a in f.aliases))),
               found.map(f, {
                 'id': string(f.id),
                 'names': [string(f.id)] + (has(f.aliases) && f.aliases != null ? f.aliases : []),
                 'package': string(f.?package.?name.orValue('')),
                 'installed': string(f.?package.?version.orValue('')),
                 'fixed_in': has(f.fixed_in) && f.fixed_in != null ? f.fixed_in.join(', ') : '',
                 'status': '',
                 'reason': ''})
               + inputs.advisories
                   .filter(a, !found.exists(f, a == f.id || (has(f.aliases) && f.aliases != null && a in f.aliases)))
                   .map(a, {'id': a, 'names': [a], 'package': '', 'installed': '', 'fixed_in': '', 'status': '',
                            'reason': 'not among the findings forge vuln ' + string(nodes.check.list_args[0]) + ' reported'})) }}
      verify_command: >-
        {{ inputs.verify_command != '' ? inputs.verify_command
           : (nodes.parsed.doc.?verify.?command.orValue('') != '' ? nodes.parsed.doc.verify.command : nodes.check.fallback_verify) }}
      brief: >-
        {{ nodes.parsed.ran != true
           ? 'patch_mode is agent, so the deterministic patcher did not run: apply every bump yourself.'
           : '`reliant forge vuln patch` ran first and exited ' + string(nodes.parsed.code)
             + (nodes.parsed.code == 1 ? ' (a bump or the verification failed)' : (nodes.parsed.code == 2 ? ' (nothing deterministic to do for at least one finding)' : ''))
             + '. Its changes are in the worktree, uncommitted.'
             + (size(nodes.parsed.doc.?bumps.orValue([])) > 0
                ? '\n\nBumps it applied:\n' + nodes.parsed.doc.bumps.map(b, '- ' + string(b.package) + ' ' + string(b.from) + ' -> ' + string(b.to)
                    + ' in ' + string(b.manifest) + (b.?error.orValue('') != '' && b.error != null ? ' FAILED: ' + untrustedText(string(b.error), 600) : '')).join('\n')
                : '')
             + (nodes.parsed.doc.?verify.?command.orValue('') != ''
                ? '\n\nIts verify (`' + nodes.parsed.doc.verify.command + '`) ' + (nodes.parsed.doc.verify.passed == true ? 'passed' : 'FAILED')
                  + (nodes.parsed.doc.verify.passed != true && nodes.parsed.doc.verify.?output.orValue('') != '' && nodes.parsed.doc.verify.output != null
                     ? ':\n```\n' + cel.bind(o, string(nodes.parsed.doc.verify.output), o.substring(math.greatest(0, size(o) - 3000))) + '\n```' : '.')
                : '')
             + (size(nodes.parsed.doc.?notes.orValue([])) > 0 && nodes.parsed.doc.notes != null ? '\n\nNotes: ' + nodes.parsed.doc.notes.join('; ') : '') }}

  - id: route
    type: compute
    outputs:
      kind: >-
        {{ nodes.plan.has_doc != true ? 'error'
           : (nodes.parsed.ran == true
              ? (nodes.parsed.code == 0 && nodes.parsed.doc.changed == true && nodes.parsed.doc.?verify.?passed.orValue(false) == true ? 'publish'
                 : (nodes.parsed.code == 0 && nodes.parsed.doc.changed != true ? 'nothing'
                 : (nodes.parsed.code == 4 ? 'refused'
                 : (nodes.parsed.code in [1, 2] && size(nodes.plan.targets) > 0 ? 'agent' : 'error'))))
              : (!(nodes.parsed.code in [0, 1, 2]) ? 'error' : (size(nodes.plan.targets) == 0 ? 'nothing' : 'agent'))) }}
      detail: >-
        {{ nodes.plan.has_doc != true
           ? (nodes.parsed.ran == true ? '`reliant forge vuln patch`' : '`reliant forge vuln ' + string(nodes.check.list_args[0]) + '`') + ' exited ' + string(nodes.parsed.code)
             + ' without a document, so the findings could not be read: ' + nodes.parsed.stderr
           : (nodes.parsed.code == 4 && nodes.parsed.ran == true
              ? 'forge vuln patch refused and changed nothing: ' + nodes.parsed.doc.?refusals.orValue([]).join('; ')
                + '. Re-run with patch_mode agent to have the agent take it (a fix only in a new major needs that).'
              : 'forge exited ' + string(nodes.parsed.code)) }}

  - id: nothing
    type: save_message
    args:
      role: assistant
      content: >-
        Nothing to patch in {{ nodes.check.subject }}{{ size(inputs.advisories) > 0 ? ' for ' + inputs.advisories.join(', ') : '' }}:
        {{ nodes.parsed.ran == true ? 'forge vuln patch found no finding to bump' : 'forge vuln ' + string(nodes.check.list_args[0]) + ' reports no fixable finding' }}{{ size(nodes.parsed.doc.?notes.orValue([])) > 0 && nodes.parsed.doc.notes != null ? ' (' + nodes.parsed.doc.notes.join('; ') + ')' : '' }}. No pull request was opened.

  - id: cannot_patch
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "No pull request: {{ nodes.route.detail }}"

  # The agent takeover: at most max_agent_iterations attempts, each checked by the workflow, not the agent.
  - id: fix
    type: workflow
    ref: builtin://vuln-patch-agent
    args:
      dir: "{{ nodes.where.dir }}"
      env: "{{ inputs.env }}"
      targets: "{{ nodes.plan.targets }}"
      brief: "{{ nodes.plan.brief }}"
      verify_command: "{{ nodes.plan.verify_command }}"
      model: "{{ inputs.model }}"
      max_turns: "{{ inputs.max_turns }}"
      max_iterations: "{{ inputs.max_agent_iterations }}"

  - id: agent_failed
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: |
        No pull request: the patch did not pass after {{ nodes.fix.iterations }} agent attempt(s){{ nodes.fix.blocked == true ? ' (the agent reported blocked)' : '' }}.

        {{ nodes.fix.summary }}

        Why it is not opened:
        {{ nodes.fix.reasons.map(r, '- ' + r).join('\n') }}{{ nodes.fix.verify_tail != '' ? '\n\nVerify output (tail):\n```\n' + nodes.fix.verify_tail + '\n```' : '' }}

  # Opt-in: a person approves an agent fix that reached beyond the dependency manifests.
  - id: approve
    type: approval
    condition: "inputs.approve_code_changes == true && nodes.?fix.passed.orValue(false) == true && size(nodes.fix.code_files) > 0"
    args:
      title: "Open the vulnerability patch PR? The agent also changed {{ nodes.fix.code_files.join(', ') }}"
      timeout: 72h

  - id: denied
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "No pull request: the agent's code changes were not approved ({{ nodes.?approve.status.orValue('') }}{{ cel.bind(r, string(nodes.?approve.denial_reason.orValue('')), r != '' ? ': ' + untrustedText(r, 400) : '') }})."

  - id: compose
    type: compute
    outputs:
      title: >-
        {{ cel.bind(t, string(nodes.?fix.pr_title.orValue('')),
             nodes.route.kind == 'agent' && t != '' ? t
             : 'fix(deps): patch ' + (size(nodes.plan.targets) <= 3 ? nodes.plan.targets.map(x, x.id).join(', ') : string(size(nodes.plan.targets)) + ' vulnerabilities')) }}
      commit_message: >-
        {{ cel.bind(m, string(nodes.?fix.commit_message.orValue('')),
             nodes.route.kind == 'agent' && m != '' ? m
             : 'fix(deps): patch ' + (size(nodes.plan.targets) <= 3 ? nodes.plan.targets.map(x, x.id).join(', ') : string(size(nodes.plan.targets)) + ' vulnerabilities')
               + '\n\nPatches ' + nodes.plan.targets.map(x, x.id).join(', ') + ' found in ' + string(nodes.check.subject) + '.') }}
      takeover: >-
        {{ nodes.route.kind != 'agent' ? ''
           : cel.bind(files, nodes.?fix.code_files.orValue([]),
               '\n**Agent takeover.** ' + string(nodes.?fix.summary.orValue(''))
               + (size(files) > 0
                  ? '\n\nFiles changed beyond the dependency manifests: ' + files.map(f, '`' + f + '`').join(', ')
                    + (inputs.approve_code_changes == true ? ' (approved before this PR opened).' : '.')
                  : '')) }}
      table: >-
        {{ '| Advisory | Package | Installed | Fixed in |\n|---|---|---|---|\n'
           + nodes.plan.targets.map(t, '| ' + t.id + ' | ' + (t.package != '' ? '`' + t.package + '`' : '') + ' | ' + t.installed + ' | ' + t.fixed_in + ' |').join('\n') }}
      verified: >-
        {{ nodes.route.kind == 'agent'
           ? (nodes.plan.verify_command.contains('\n') ? 'The project\'s gate' : '`' + nodes.plan.verify_command.trim() + '`') + ' passed, and `reliant forge vuln scan . --json` no longer reports the findings above (checked by the workflow after ' + string(nodes.?fix.iterations.orValue(1)) + ' agent attempt(s)).'
           : '`reliant forge vuln patch ' + inputs.env + ' --verify` bumped every finding, ran `' + string(nodes.parsed.doc.?verify.?command.orValue('')) + '` (passed) and rescanned the changed manifests: each finding is fixed.' }}

  - id: publish
    type: git_publish
    args:
      worktree: "{{ nodes.where.root }}"
      repo: "{{ nodes.where.repo }}"
      branch: "{{ nodes.check.branch }}"
      allow: ["vuln-patch/*"]
      message: "{{ nodes.compose.commit_message }}"

  - id: publish_failed
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: >-
        The patch verified, but no pull request was opened: {{ nodes.publish.refused == true ? 'git_publish refused: ' + nodes.publish.refusal : 'there was nothing to commit' }}.

  - id: pr
    type: action
    uses: github/pr.create@1
    with:
      owner: "{{ nodes.where.repo.split('/')[0] }}"
      repo: "{{ nodes.where.repo.split('/')[1] }}"
      head: "{{ nodes.check.branch }}"
      base: "{{ nodes.repo_info.data.default_branch }}"
      title: "{{ nodes.compose.title }}"
      body: |
        Patches vulnerabilities forge found in {{ nodes.check.subject }}{{ nodes.parsed.ran == true && nodes.parsed.doc.?release.orValue('') != '' ? ' (release ' + nodes.parsed.doc.release + ')' : '' }}.

        {{ nodes.compose.table }}

        **Verification.** {{ nodes.compose.verified }}
        {{ nodes.compose.takeover }}

        ---
        🤖 Opened by the **vuln-patch** workflow ({{ nodes.publish.files_changed }} files, +{{ nodes.publish.insertions }} -{{ nodes.publish.deletions }}). It never merges; a person reviews and merges.

  - id: pr_failed
    type: save_message
    outcome: failure
    args:
      role: assistant
      display_style: warning
      content: "Pushed {{ nodes.check.branch }} but opening the pull request failed: {{ untrustedText(string(nodes.pr.content), 400) }}"

  - id: opened
    type: save_message
    args:
      role: assistant
      content: "Opened {{ nodes.pr.data.html_url }}: {{ nodes.compose.title }}."

edges:
  - from: check
    cases:
      - to: [invalid]
        condition: "nodes.check.valid != true"
        label: invalid
      - to: [wt]
        condition: "true"
        label: valid
  - from: wt
    default: proj
  - from: proj
    default: dir
  - from: dir
    default: where
  - from: where
    cases:
      - to: [repo_info]
        condition: "nodes.where.ok == true"
        label: found
      - to: [no_checkout]
        condition: "true"
        label: missing
  - from: repo_info
    cases:
      - to: [patch]
        condition: "!nodes.repo_info.is_error && nodes.repo_info.data.default_branch != ''"
        label: readable
      - to: [no_repo]
        condition: "true"
        label: unreadable
  - from: patch
    default: listing
  - from: listing
    default: parsed
  - from: parsed
    default: plan
  - from: plan
    default: route
  - from: route
    cases:
      - to: [compose]
        condition: "nodes.route.kind == 'publish'"
        label: verified
      - to: [fix]
        condition: "nodes.route.kind == 'agent'"
        label: agent_takes_over
      - to: [nothing]
        condition: "nodes.route.kind == 'nothing'"
        label: nothing_to_patch
      - to: [cannot_patch]
        condition: "true"
        label: refused_or_error
  - from: fix
    cases:
      - to: [approve]
        condition: "nodes.fix.passed == true"
        label: passed
      - to: [agent_failed]
        condition: "true"
        label: failed
  - from: approve
    cases:
      - to: [compose]
        condition: "!(inputs.approve_code_changes == true && size(nodes.fix.code_files) > 0) || nodes.?approve.status.orValue('') == 'approved'"
        label: approved
      - to: [denied]
        condition: "true"
        label: denied
  - from: compose
    default: publish
  - from: publish
    cases:
      - to: [pr]
        condition: "nodes.publish.pushed == true && nodes.publish.refused != true"
        label: pushed
      - to: [publish_failed]
        condition: "true"
        label: not_pushed
  - from: pr
    cases:
      - to: [opened]
        condition: "!nodes.pr.is_error"
        label: opened
      - to: [pr_failed]
        condition: "true"
        label: failed
