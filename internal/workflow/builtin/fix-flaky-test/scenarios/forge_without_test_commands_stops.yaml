name: forge_without_test_commands_stops
description: >-
  The project's forge predates `forge test`, so `reliant forge test quarantine list` fails. The run stops
  before the agent with a message saying what is missing.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": ""}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: quarantine
    output: {"exit_code": 1, "stdout": "", "stderr": "Error: unknown command \"test\" for \"forge\""}
expect:
  outcome: failed
  completed: [quarantine, no_forge_test]
  not_reached: [flakes, attempt, publish, pr]
