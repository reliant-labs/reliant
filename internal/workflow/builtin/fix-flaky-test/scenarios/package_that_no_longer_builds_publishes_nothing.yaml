name: package_that_no_longer_builds_publishes_nothing
description: >-
  The deletion was approved, but the package no longer builds without the test (a helper only it used is
  still referenced). Nothing is pushed.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: issue
    output: {"is_error": false, "data": {"number": 12, "title": "flake:suspected: TestRefund", "body": "Signature: refund_test.go:88: got 3, want 4", "state": "open", "is_pull_request": false}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: pkgcheck
    output: {"exit_code": 0, "stdout": "github.com/acme/shop"}
  - node: quarantine
    output: {"exit_code": 0, "stdout": "{\"entries\": [{\"test\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"path\": \"ci/quarantine/go/internal/billing/TestRefund.yaml\", \"overdue\": false}]}"}
  - node: flakes
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.flakes/v1\", \"tests\": [{\"id\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"state\": \"suspected\", \"score\": 0.04, \"n\": 30, \"events\": [{\"kind\": \"retry_pass\", \"verdict\": \"confirmed\", \"commit\": \"9f3c\", \"run\": \"01JD\", \"signature\": \"refund_test.go:88: got 3, want 4\"}]}], \"host\": []}"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "worthless", "summary": "TestRefund duplicates TestRefundTable and only asserts on a mock.", "root_cause": "It races a real clock against a fake one.", "pr_title": "test(billing): delete flaky TestRefund", "pr_body": "TestRefundTable covers the same cases deterministically.", "commit_message": "test(billing): delete flaky TestRefund", "test_body": "func TestRefund(t *testing.T) {\n\t// ...\n}", "signature": "refund_test.go:88: got 3, want 4"}, "model": "test-model"}
  - node: approve_delete
    output: {"status": "approved", "approval_id": "a1", "action_taken": "approve"}
  - node: unquarantine
    output: {"exit_code": 0, "stdout": "removed ci/quarantine/go/internal/billing/TestRefund.yaml"}
  - node: compile
    output: {"exit_code": 1, "stdout": "./refund_test.go:12:2: undefined: newLedger"}
expect:
  outcome: failed
  completed: [approve_delete, unquarantine, compile, compile_failed]
  not_reached: [publish, removed_issue, pr]
  messages:
    compile_failed:
      count: 1
      content_contains: ["undefined: newLedger"]
