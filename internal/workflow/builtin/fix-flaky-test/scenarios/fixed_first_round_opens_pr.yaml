name: fixed_first_round_opens_pr
description: >-
  The agent fixes the test, it passes 50/50 under -race and the flake gate passes, so its quarantine entry is
  removed in the same change and a PR is opened that links the flake issue.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: issue
    output: {"is_error": false, "data": {"number": 12, "title": "flake:suspected: TestRefund", "body": "Signature: refund_test.go:88: got 3, want 4", "state": "open", "is_pull_request": false}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: quarantine
    output: {"exit_code": 0, "stdout": "{\"entries\": [{\"test\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"path\": \"ci/quarantine/go/internal/billing/TestRefund.yaml\", \"overdue\": false}]}"}
  - node: flakes
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.flakes/v1\", \"tests\": [{\"id\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"state\": \"suspected\", \"score\": 0.04, \"n\": 30, \"events\": [{\"kind\": \"retry_pass\", \"verdict\": \"confirmed\", \"commit\": \"9f3c\", \"run\": \"01JD\", \"signature\": \"refund_test.go:88: got 3, want 4\"}]}], \"host\": []}"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "The refund ledger was shared between parallel subtests.", "root_cause": "t.Parallel subtests mutated one map.", "pr_title": "fix(billing): make TestRefund deterministic", "pr_body": "Gives each subtest its own ledger.", "commit_message": "fix(billing): make TestRefund deterministic\n\nEach subtest gets its own ledger."}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 0, "stdout": "ok  \tgithub.com/acme/shop/internal/billing\t12.1s\n\nfailed runs: 0 of 50\n"}
  - node: attempt.gate
    output: {"exit_code": 0, "stdout": "flake gate: 1 changed test passed 3/3"}
  - node: unquarantine
    output: {"exit_code": 0, "stdout": "removed ci/quarantine/go/internal/billing/TestRefund.yaml"}
  - node: compile
    output: {"exit_code": 0, "stdout": "ok  \tgithub.com/acme/shop/internal/billing\t0.1s [no tests to run]"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "flaky/testrefund-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 12, "deletions": 9}
  - node: pr
    output: {"is_error": false, "data": {"number": 55, "html_url": "https://github.com/acme/shop/pull/55"}}
expect:
  outcome: completed
  completed: [check, repo_info, issue, base, wt, dir, paths, quarantine, flakes, facts, attempt, attempt.agent, attempt.race, attempt.gate, result, unquarantine, compile, publish, pr, done]
  skipped: [removed_issue]
  not_reached: [invalid, no_repo, no_checkout, no_forge_test, proposal, approve_delete, denied, not_fixed, unquarantine_failed, compile_failed, publish_failed, pr_failed]
  node_outputs:
    check: {valid: true, package: github.com/acme/shop/internal/billing, test: TestRefund, issue_number: 12}
    facts: {quarantined: true, record_read: true}
    attempt: {verdict: pass}
    result: {kind: fixed, signature: "refund_test.go:88: got 3, want 4"}
    base: {branch: main}
  outputs:
    outcome: fixed
    pr_url: https://github.com/acme/shop/pull/55
  messages:
    done:
      count: 1
      content_contains: ["fixed `TestRefund`, https://github.com/acme/shop/pull/55"]
