name: red_verify_goes_back_to_the_agent
description: >-
  Round 1: the agent says fixed but the test still fails 2 of 50 under -race. Round 2 gets the failures, and its
  fix passes the race verify but the flake gate finds a changed test failing 1 of 3. Round 3 passes both, and
  the PR is opened. Not quarantined, so there is no entry to remove.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": ""}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: quarantine
    output: {"exit_code": 0, "stdout": "{\"entries\": []}"}
  - node: flakes
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.flakes/v1\", \"tests\": [], \"host\": []}"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "The refund ledger was shared between parallel subtests.", "root_cause": "t.Parallel subtests mutated one map.", "pr_title": "fix(billing): make TestRefund deterministic", "pr_body": "Gives each subtest its own ledger.", "commit_message": "fix(billing): make TestRefund deterministic\n\nEach subtest gets its own ledger."}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 1, "stdout": "--- FAIL: TestRefund (0.01s)\n    refund_test.go:88: got 3, want 4\nFAIL\n\nfailed runs: 2 of 50\n"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "The refund ledger was shared between parallel subtests.", "root_cause": "t.Parallel subtests mutated one map.", "pr_title": "fix(billing): make TestRefund deterministic", "pr_body": "Gives each subtest its own ledger.", "commit_message": "fix(billing): make TestRefund deterministic\n\nEach subtest gets its own ledger."}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 0, "stdout": "ok  \tgithub.com/acme/shop/internal/billing\t12.1s\n\nfailed runs: 0 of 50\n"}
  - node: attempt.gate
    output: {"exit_code": 1, "stdout": "--- FAIL: TestRefundTable/partial (0.00s)\nflake gate: TestRefundTable failed 1 of 3"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "The refund ledger was shared between parallel subtests.", "root_cause": "t.Parallel subtests mutated one map.", "pr_title": "fix(billing): make TestRefund deterministic", "pr_body": "Gives each subtest its own ledger.", "commit_message": "fix(billing): make TestRefund deterministic\n\nEach subtest gets its own ledger."}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 0, "stdout": "ok  \tgithub.com/acme/shop/internal/billing\t12.1s\n\nfailed runs: 0 of 50\n"}
  - node: attempt.gate
    output: {"exit_code": 0, "stdout": "flake gate: 1 changed test passed 3/3"}
  - node: unquarantine
    output: {"exit_code": 0, "stdout": "not quarantined; nothing to remove"}
  - node: compile
    output: {"exit_code": 0, "stdout": "ok"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "flaky/testrefund-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 12, "deletions": 9}
  - node: pr
    output: {"is_error": false, "data": {"number": 55, "html_url": "https://github.com/acme/shop/pull/55"}}
expect:
  outcome: completed
  skipped: [issue, removed_issue]
  completed: [attempt.race, attempt.gate, unquarantine, compile, publish, pr, done]
  not_reached: [not_fixed, proposal, approve_delete]
  node_outputs:
    facts: {quarantined: false}
    attempt: {verdict: pass, _iterations: 3}
    result: {kind: fixed}
