name: setup_failure_in_verify_is_blocked_not_still_red
description: >-
  The agent says fixed, but its change leaves the package unloadable: the verify's `go test` reports
  "[setup failed]" (exit 4). That is not a test failure, so there is no retry and no "still red" report: the run
  ends blocked, saying the test never ran, and nothing is published.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: issue
    output: {"is_error": false, "data": {"number": 12, "title": "flake:suspected: TestRefund", "body": "Signature: refund_test.go:88: got 3, want 4", "state": "open", "is_pull_request": false}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: pkgcheck
    output: {"exit_code": 0, "stdout": "github.com/acme/shop"}
  - node: quarantine
    output: {"exit_code": 0, "stdout": "{\"entries\": [{\"test\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"path\": \"ci/quarantine/go/internal/billing/TestRefund.yaml\", \"overdue\": false}]}"}
  - node: flakes
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.flakes/v1\", \"tests\": [{\"id\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"state\": \"suspected\", \"score\": 0.04, \"n\": 30, \"events\": [{\"kind\": \"retry_pass\", \"verdict\": \"confirmed\", \"commit\": \"9f3c\", \"run\": \"01JD\", \"signature\": \"refund_test.go:88: got 3, want 4\"}]}], \"host\": []}"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "Moved the shared ledger into each subtest.", "pr_title": "fix(billing): make TestRefund deterministic"}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 4, "stdout": "# github.com/acme/shop/internal/billing\nno required module provides package github.com/acme/shop/internal/billing\nFAIL\tgithub.com/acme/shop/internal/billing [setup failed]\n\npassed runs: 0 of 50; failed runs: 0\ngo test could not load the package: [setup failed]"}
expect:
  outcome: failed
  completed: [attempt.agent, attempt.race, result, not_fixed]
  not_reached: [attempt.gate, unquarantine, publish, pr]
  node_outputs:
    attempt: {verdict: setup, race_exit: 4, _iterations: 1}
    result: {kind: setup_failed}
  messages:
    not_fixed:
      count: 1
      content_contains: ["Blocked, not still flaky", "[setup failed]"]
