name: package_outside_the_module_is_refused
description: >-
  The test id names a package the selected module does not provide (here one in a module nested below it, so
  project_dir should have named that module). `go test <import path>` would fail as "[setup failed]" and read
  as a flake that is still failing, so the run stops before the agent and says which module has it.
inputs: {"test_id": "go:github.com/acme/shop/services/billing/internal/refund:TestRefund", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: pkgcheck
    output: {"exit_code": 2, "stdout": "the test's package github.com/acme/shop/services/billing/internal/refund is in the module nested at ./services/billing, not in github.com/acme/shop; set project_dir to ./services/billing below ."}
expect:
  outcome: failed
  completed: [dir, paths, pkgcheck, package_mismatch]
  not_reached: [quarantine, flakes, attempt, publish, pr]
  messages:
    package_mismatch:
      count: 1
      content_contains: ["Refusing to run `go:github.com/acme/shop/services/billing/internal/refund:TestRefund`", "nested at ./services/billing"]
