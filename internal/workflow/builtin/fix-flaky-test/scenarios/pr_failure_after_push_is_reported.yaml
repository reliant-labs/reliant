name: pr_failure_after_push_is_reported
description: The fix verifies and is pushed, but GitHub refuses the PR. The run ends failed naming the pushed branch.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12", "project_dir": "services/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: issue
    output: {"is_error": false, "data": {"number": 12, "title": "flake:suspected: TestRefund", "body": "Signature: refund_test.go:88: got 3, want 4", "state": "open", "is_pull_request": false}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: quarantine
    output: {"exit_code": 0, "stdout": "{\"entries\": [{\"test\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"path\": \"ci/quarantine/go/internal/billing/TestRefund.yaml\", \"overdue\": false}]}"}
  - node: flakes
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.flakes/v1\", \"tests\": [{\"id\": \"go:github.com/acme/shop/internal/billing:TestRefund\", \"state\": \"suspected\", \"score\": 0.04, \"n\": 30, \"events\": [{\"kind\": \"retry_pass\", \"verdict\": \"confirmed\", \"commit\": \"9f3c\", \"run\": \"01JD\", \"signature\": \"refund_test.go:88: got 3, want 4\"}]}], \"host\": []}"}
  - node: attempt.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "fixed", "summary": "The refund ledger was shared between parallel subtests.", "root_cause": "t.Parallel subtests mutated one map.", "pr_title": "fix(billing): make TestRefund deterministic", "pr_body": "Gives each subtest its own ledger.", "commit_message": "fix(billing): make TestRefund deterministic\n\nEach subtest gets its own ledger."}, "model": "test-model"}
  - node: attempt.race
    output: {"exit_code": 0, "stdout": "ok  \tgithub.com/acme/shop/internal/billing\t12.1s\n\nfailed runs: 0 of 50\n"}
  - node: attempt.gate
    output: {"exit_code": 2, "stdout": "no changed tests could be identified"}
  - node: unquarantine
    output: {"exit_code": 0, "stdout": "removed"}
  - node: compile
    output: {"exit_code": 0, "stdout": "ok"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "flaky/testrefund-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 12, "deletions": 9}
  - node: pr
    output: {"is_error": true, "content": "422 A pull request already exists"}
expect:
  outcome: failed
  completed: [publish, pr, pr_failed]
  not_reached: [done]
  node_outputs:
    paths: {checkout: /w/ws, module: /w/ws/services/shop}
    attempt: {verdict: pass}
