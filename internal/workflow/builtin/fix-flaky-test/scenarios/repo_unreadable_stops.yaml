name: repo_unreadable_stops
description: >-
  GitHub cannot read the repository, so there is no default branch to base a worktree on. The run stops before any worktree.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12"}
events:
  - node: repo_info
    output: {"is_error": true, "content": "404 Not Found"}
  - node: issue
    output: {"is_error": true, "content": "404 Not Found"}
expect:
  outcome: failed
  completed: [repo_info, base, no_repo]
  not_reached: [wt, dir, attempt]
  node_outputs:
    base: {branch: ""}
