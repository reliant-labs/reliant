name: package_with_no_go_files_is_refused
description: >-
  The test id names a directory of the module that Go builds no package from (no Go files, docs only, or
  every file excluded by build constraints). `go list -e` reports the error, so the run stops as invalid input
  before the agent: `go test` there would fail as "[setup failed]" and read as a flake still failing.
inputs: {"test_id": "go:github.com/acme/shop/internal/billing:TestRefund", "repo": "acme/shop", "issue_url": "https://github.com/acme/shop/issues/12"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: issue
    output: {"is_error": false, "data": {"number": 12, "title": "flake:suspected: TestRefund", "body": "Signature: refund_test.go:88: got 3, want 4", "state": "open", "is_pull_request": false}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: pkgcheck
    output: {"exit_code": 2, "stdout": "Go cannot load the package github.com/acme/shop/internal/billing in the module github.com/acme/shop, so there is no test to run: no required module provides package github.com/acme/shop/internal/billing; to add it:\n\tgo get github.com/acme/shop/internal/billing"}
expect:
  outcome: failed
  completed: [pkgcheck, package_mismatch]
  not_reached: [quarantine, flakes, attempt, result, not_fixed, publish, pr]
  messages:
    package_mismatch:
      count: 1
      content_contains: ["Refusing to run `go:github.com/acme/shop/internal/billing:TestRefund`", "Go cannot load the package"]
