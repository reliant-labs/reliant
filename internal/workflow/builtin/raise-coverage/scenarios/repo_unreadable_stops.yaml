name: repo_unreadable_stops
description: >-
  GitHub cannot read the repository, so there is no default branch to work from. The run stops before any worktree.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": true, "content": "404 Not Found"}
expect:
  outcome: failed
  completed: [repo_info, base, no_repo]
  not_reached: [wt, dir, baseline]
