name: invalid_target_is_refused
description: A target over 100% (or a package path with shell syntax) is refused before any worktree or shell.
inputs: {"package": "internal/billing", "target": "150", "repo": "acme/shop"}
events: []
expect:
  outcome: failed
  completed: [check, invalid]
  not_reached: [repo_info, wt, dir, baseline, round]
  node_outputs:
    check: {valid: false}
