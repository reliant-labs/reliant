name: relative_target_short_then_met
description: >-
  A "+20" target from a 50% baseline is 70%. Round 1 reaches 60% (short), so the author goes again with what
  is still uncovered; round 2 reaches 72% and the PR is opened.
inputs: {"package": "internal/billing", "target": "+20", "repo": "acme/shop", "project_dir": "services/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 100, \"pct\": 50.0}}, \"combined\": {\"statements\": 200, \"covered\": 100, \"pct\": 50.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 100, \"pct\": 83.3}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok  \tgithub.com/acme/shop/internal/billing\t0.4s"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 120, \"pct\": 60.0}}, \"combined\": {\"statements\": 200, \"covered\": 120, \"pct\": 60.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "approve", "feedback": "Every test asserts amounts and errors.", "tests": [{"name": "TestRefundPartial", "file": "internal/billing/refund_test.go", "asserts": "the refunded amount and the remaining balance"}, {"name": "TestLedgerReverse", "file": "internal/billing/ledger_test.go", "asserts": "a reversal restores the balance and records an entry"}], "padding": []}, "model": "test-model"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 144, \"pct\": 72.0}}, \"combined\": {\"statements\": 200, \"covered\": 144, \"pct\": 72.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 24, \"pct\": 30.0}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "approve", "feedback": "Every test asserts amounts and errors.", "tests": [{"name": "TestRefundPartial", "file": "internal/billing/refund_test.go", "asserts": "the refunded amount and the remaining balance"}, {"name": "TestLedgerReverse", "file": "internal/billing/ledger_test.go", "asserts": "a reversal restores the balance and records an entry"}], "padding": []}, "model": "test-model"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "coverage/internal-billing-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 140, "deletions": 0}
  - node: pr
    output: {"is_error": false, "data": {"number": 56, "html_url": "https://github.com/acme/shop/pull/56"}}
expect:
  outcome: completed
  completed: [round, result, publish, pr, done]
  node_outputs:
    check: {relative: true, coverage_path: services/shop/internal/billing, project_path: services/shop}
    paths: {module: /w/ws/services/shop}
    baseline_facts: {pct: 50.0, target_pct: 70.0}
    round: {verdict: met, pct: 72.0, _iterations: 2}
    result: {kind: met}
