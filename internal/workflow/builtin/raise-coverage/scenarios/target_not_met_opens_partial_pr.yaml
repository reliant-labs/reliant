name: target_not_met_opens_partial_pr
description: >-
  From 40% toward 90%, two rounds reach 60% and then 65%, each passing the gate and the review. After the
  last round the target is still missed, so the PR is opened anyway with what was gained, and labelled
  coverage:partial.
inputs: {"package": "internal/billing", "target": "90", "repo": "acme/shop", "max_iterations": 2}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 80, \"pct\": 40.0}}, \"combined\": {\"statements\": 200, \"covered\": 80, \"pct\": 40.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 80, \"pct\": 66.7}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok  \tgithub.com/acme/shop/internal/billing\t0.4s"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 120, \"pct\": 60.0}}, \"combined\": {\"statements\": 200, \"covered\": 120, \"pct\": 60.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "approve", "feedback": "Every test asserts amounts and errors.", "tests": [{"name": "TestRefundPartial", "file": "internal/billing/refund_test.go", "asserts": "the refunded amount and the remaining balance"}, {"name": "TestLedgerReverse", "file": "internal/billing/ledger_test.go", "asserts": "a reversal restores the balance and records an entry"}], "padding": []}, "model": "test-model"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 130, \"pct\": 65.0}}, \"combined\": {\"statements\": 200, \"covered\": 130, \"pct\": 65.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 10, \"pct\": 12.5}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "approve", "feedback": "Every test asserts amounts and errors.", "tests": [{"name": "TestRefundPartial", "file": "internal/billing/refund_test.go", "asserts": "the refunded amount and the remaining balance"}, {"name": "TestLedgerReverse", "file": "internal/billing/ledger_test.go", "asserts": "a reversal restores the balance and records an entry"}], "padding": []}, "model": "test-model"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "coverage/internal-billing-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 140, "deletions": 0}
  - node: pr
    output: {"is_error": false, "data": {"number": 56, "html_url": "https://github.com/acme/shop/pull/56"}}
  - node: label_partial
    output: {"is_error": false, "data": {"number": 56, "labels": ["coverage:partial"], "added": "coverage:partial"}}
expect:
  outcome: completed
  completed: [round, result, publish, pr, label_partial, done]
  not_reached: [not_raised]
  node_outputs:
    round: {verdict: short, pct: 65.0, _iterations: 2}
    result: {kind: partial, pct: 65.0}
  outputs:
    outcome: partial
  messages:
    done:
      count: 1
      content_contains: ["40.0% → 65.0%", "partial", "(labelled coverage:partial)"]
