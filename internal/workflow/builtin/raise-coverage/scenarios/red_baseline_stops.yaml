name: red_baseline_stops
description: The package's tests already fail on the default branch. There is no green baseline, so no agent runs.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 1, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"combined\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 104, \"pct\": 86.7}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "--- FAIL: TestRefund (0.00s)\nFAIL"}
expect:
  outcome: failed
  completed: [baseline, baseline_red]
  not_reached: [baseline_facts, round, publish]
