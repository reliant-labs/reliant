name: already_at_target_does_nothing
description: The package is already at 85% and the target is 80%. No agent runs and nothing is published.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 170, \"pct\": 85.0}}, \"combined\": {\"statements\": 200, \"covered\": 170, \"pct\": 85.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 50, \"pct\": 62.5}, \"lanes\": {}}]}", "stderr": "ok  \tgithub.com/acme/shop/internal/billing\t0.4s"}
expect:
  outcome: completed
  completed: [baseline_facts, already_met]
  not_reached: [round, publish, pr]
  messages:
    already_met:
      count: 1
      content_contains: ["already at 85.0%"]
