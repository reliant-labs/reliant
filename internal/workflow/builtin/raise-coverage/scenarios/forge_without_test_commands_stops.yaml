name: forge_without_test_commands_stops
description: The project's forge predates `forge test`, so `reliant forge test begin` fails (exit 3) and the run stops saying so.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 3, "stdout": "", "stderr": "reliant forge test begin failed: this forge has no forge test commands"}
expect:
  outcome: failed
  completed: [baseline, no_forge_test]
  not_reached: [baseline_red, baseline_facts, round]
