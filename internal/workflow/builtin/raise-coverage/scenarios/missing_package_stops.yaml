name: missing_package_stops
description: >-
  The package directory is not in the forge project. The run stops before measuring.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 2, "stdout": "", "stderr": "no directory internal/billing in /w/ws/."}
expect:
  outcome: failed
  completed: [dir, no_checkout]
  not_reached: [paths, baseline, round]
