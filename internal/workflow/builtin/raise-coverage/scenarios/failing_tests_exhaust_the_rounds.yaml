name: failing_tests_exhaust_the_rounds
description: >-
  With two rounds, the author's tests fail both times. Neither the gate nor the review runs, nothing is
  published, and the report carries the failing output.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop", "max_iterations": 2}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"combined\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 104, \"pct\": 86.7}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok  \tgithub.com/acme/shop/internal/billing\t0.4s"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 1, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 140, \"pct\": 70.0}}, \"combined\": {\"statements\": 200, \"covered\": 140, \"pct\": 70.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 20, \"pct\": 25.0}, \"lanes\": {}}]}", "stderr": "--- FAIL: TestRefundPartial (0.00s)\\n    refund_test.go:30: got 5, want 7\\nFAIL"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 1, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 140, \"pct\": 70.0}}, \"combined\": {\"statements\": 200, \"covered\": 140, \"pct\": 70.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 20, \"pct\": 25.0}, \"lanes\": {}}]}", "stderr": "--- FAIL: TestRefundPartial (0.00s)\\n    refund_test.go:30: got 5, want 7\\nFAIL"}
expect:
  outcome: failed
  completed: [round.measure, result, not_raised]
  not_reached: [round.gate, round.review, publish, pr]
  node_outputs:
    round: {verdict: tests_failed, measure_exit: 1, _iterations: 2}
    result: {kind: unpublishable}
  messages:
    not_raised:
      count: 1
      content_contains: ["had failing tests", "got 5, want 7"]
    round.stopped:
      count: 2
      content_contains: ["of 2 stopped: the package's tests failed (exit 1)"]
