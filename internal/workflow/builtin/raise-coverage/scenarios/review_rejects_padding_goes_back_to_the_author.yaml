name: review_rejects_padding_goes_back_to_the_author
description: >-
  Round 1 reaches the target, but the reviewer finds a test that calls code and discards the result, and
  rejects the round. Round 2's tests all assert behaviour; the reviewer approves and the PR is opened.
inputs: {"package": "internal/billing", "target": "80", "repo": "acme/shop"}
events:
  - node: repo_info
    output: {"is_error": false, "data": {"default_branch": "main", "full_name": "acme/shop"}}
  - node: wt
    output: {"path": "/w/ws", "branch": "worktree/x", "id": "w1", "name": "n", "base_branch": "main", "status": "active"}
  - node: dir
    output: {"exit_code": 0, "stdout": "/w/ws"}
  - node: baseline
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"combined\": {\"statements\": 200, \"covered\": 104, \"pct\": 52.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 104, \"pct\": 86.7}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 0, \"pct\": 0.0}, \"lanes\": {}}]}", "stderr": "ok  \tgithub.com/acme/shop/internal/billing\t0.4s"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 168, \"pct\": 84.0}}, \"combined\": {\"statements\": 200, \"covered\": 168, \"pct\": 84.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 48, \"pct\": 60.0}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "reject", "feedback": "TestLedgerReverse calls Reverse and discards the result.", "tests": [{"name": "TestLedgerReverse", "asserts": "nothing"}], "padding": ["TestLedgerReverse"]}, "model": "test-model"}
  - node: round.author
    black_box: true
    output: {"completed": true, "response": {"outcome": "done", "summary": "Table tests for refunds and ledger reversal.", "tests": ["TestRefundPartial", "TestLedgerReverse"], "pr_body": "Covers partial refunds and ledger reversal.", "commit_message": "test(billing): cover refunds and ledger reversal"}, "model": "test-model"}
  - node: round.measure
    output: {"exit_code": 0, "stdout": "{\"schema\": \"forge.test.coverage-view/v1\", \"ok\": true, \"exit_code\": 0, \"path\": \"internal/billing\", \"by\": \"file\", \"summary\": {\"lanes\": {\"unit\": {\"statements\": 200, \"covered\": 164, \"pct\": 82.0}}, \"combined\": {\"statements\": 200, \"covered\": 164, \"pct\": 82.0}}, \"rollup\": [{\"lang\": \"go\", \"path\": \"internal/billing/refund.go\", \"combined\": {\"statements\": 120, \"covered\": 120, \"pct\": 100.0}, \"lanes\": {}}, {\"lang\": \"go\", \"path\": \"internal/billing/ledger.go\", \"combined\": {\"statements\": 80, \"covered\": 44, \"pct\": 55.0}, \"lanes\": {}}]}", "stderr": "ok"}
  - node: round.gate
    output: {"exit_code": 0, "stdout": "flake gate: 2 changed tests passed 3/3"}
  - node: round.review
    black_box: true
    output: {"completed": true, "response": {"verdict": "approve", "feedback": "Every test asserts amounts and errors.", "tests": [{"name": "TestRefundPartial", "file": "internal/billing/refund_test.go", "asserts": "the refunded amount and the remaining balance"}, {"name": "TestLedgerReverse", "file": "internal/billing/ledger_test.go", "asserts": "a reversal restores the balance and records an entry"}], "padding": []}, "model": "test-model"}
  - node: publish
    output: {"pushed": true, "refused": false, "branch": "coverage/internal-billing-x", "sha": "0123456789abcdef0123456789abcdef01234567", "files_changed": 2, "insertions": 140, "deletions": 0}
  - node: pr
    output: {"is_error": false, "data": {"number": 56, "html_url": "https://github.com/acme/shop/pull/56"}}
expect:
  outcome: completed
  completed: [round.review, publish, pr, done]
  node_outputs:
    round: {verdict: met, pct: 82.0, _iterations: 2}
    result: {kind: met}
