# Truncation past the continuation cap.
#
# call_llm continues a truncated turn with a hidden nudge at most 3 times in a
# row. The 4th truncated turn in a row comes back with stop_reason truncated and
# no continuation, and the loop must exit with that verdict rather than spin or
# report the turn as done.
name: truncated_past_cap_exits_truncated
description: A truncated turn past the continuation cap ends the run as truncated
inputs:
  mode: auto
events:
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "...and the fourth chunk of the migration plan is"
      response_text: "...and the fourth chunk of the migration plan is"
      tool_calls: []
      stop_reason: truncated
      continuation: ""
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
  not_reached:
    - agent_loop.execute_tools
  node_outputs:
    agent_loop:
      _iterations: 1
      stop_reason: truncated
