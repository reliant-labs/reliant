# A premature Codex stop gets exactly one nudged retry.
#
# A Codex/OpenAI Responses turn ended on a commentary-phase preamble ("I'll
# inspect the auth setup next.") with no tool call and no end_turn:false. The
# provider called it completed, so stop_reason is done, but call_llm asks for
# one nudged retry with continuation "commentary". The retry stops the same
# way; call_llm does not offer a second one, and the loop ends.
name: premature_stop_retried_once
description: A commentary-only stop is retried once with a nudge, then the turn ends
inputs:
  mode: auto
events:
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "I'll inspect the local dev auth setup next."
      response_text: "I'll inspect the local dev auth setup next."
      tool_calls: []
      stop_reason: done
      continuation: commentary
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Inspecting the local dev auth setup now."
      response_text: "Inspecting the local dev auth setup now."
      tool_calls: []
      stop_reason: done
      continuation: ""
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
  not_reached:
    - agent_loop.execute_tools
  node_outputs:
    agent_loop:
      _iterations: 2
      stop_reason: done
