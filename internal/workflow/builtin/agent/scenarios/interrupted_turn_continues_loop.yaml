# THE REGRESSION (chat 7da3935c-97ec-4843-af78-c3807fe336cb, thread 5e3fe370).
#
# A cancelled stream returns zero tool calls, which the while-condition cannot
# tell apart from "the model is done". The loop exited mid-task, the thread was
# marked completed, and the parent was handed "Agent completed but produced no
# text response" as the sub-agent's result — while two edits had just been
# applied and the work was unfinished.
#
# stop_reason=interrupted is what distinguishes them: the loop must take
# another turn.
name: interrupted_turn_continues_loop
description: A turn cut short mid-stream must re-enter the loop, not report the agent as finished
inputs:
  mode: auto
events:
  # Iteration 0: stream cancelled mid-flight — no tool calls, no text, interrupted.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls: []
      stop_reason: interrupted
  # Iteration 1: the retry streams to completion and finishes the work.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Picking up where that left off - the flag is removed and tests pass."
      response_text: "Picking up where that left off - the flag is removed and tests pass."
      tool_calls: []
      stop_reason: done
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
  not_reached:
    - agent_loop.approval
    - agent_loop.execute_tools
    - agent_loop.compact
  node_outputs:
    agent_loop:
      _iterations: 2
