# THE REGRESSION (chat b43b41fe-8963-489d-a28e-55b5336b97be).
#
# gpt-5.6-terra ended a turn with "I'll inspect the local dev auth setup before
# attempting the workflow again." and no tool call. The provider had signalled
# the turn was not over (OpenAI Responses end_turn:false), but nothing read
# that, so the turn looked finished and the loop exited — the agent announced
# its next step and then stopped.
#
# stop_reason=incomplete carries the provider's "keep going": the loop takes
# another turn, and that turn (continue_turn) calls the provider even though
# history ends with the assistant.
name: incomplete_turn_continues_loop
description: A turn the provider paused mid-work must re-enter the loop, not yield to the user
inputs:
  mode: auto
events:
  # Iteration 0: text announcing the next step, no tool call, provider paused.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "I'll inspect the local dev auth setup before attempting the workflow again."
      response_text: "I'll inspect the local dev auth setup before attempting the workflow again."
      tool_calls: []
      stop_reason: incomplete
  # Iteration 1: the continuation does the work it announced.
  - node: agent_loop.call_llm
    type: llm_response
    text: "Checking the dev auth config."
    tool_calls:
      - name: bash
        input:
          command: "cat deploy/kcl/dev/main.k"
  - node: agent_loop.execute_tools
    type: tool_result
    tool: bash
    output:
      result: "RELIANT_AUTH_URL = ..."
  # Iteration 2: finished.
  - node: agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "The dev stack issues reliant:api tokens from the local IdP; no production login needed."
      response_text: "The dev stack issues reliant:api tokens from the local IdP; no production login needed."
      tool_calls: []
      stop_reason: done
expect:
  outcome: completed
  reached:
    - agent_loop
    - agent_loop.call_llm
    - agent_loop.execute_tools
  not_reached:
    - agent_loop.ask_question
  node_outputs:
    agent_loop:
      _iterations: 3
