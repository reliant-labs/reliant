name: autopilot-agent
title: Autopilot · restricted agent loop
hidden: true
automation_only: true
apiVersion: "0.0.5"
description: |
  The one agent loop every Autopilot workflow runs. It is a building block, not something to start.
  Structural limits:
  - The agent is offered EXACTLY the tools its caller names in `tools`, and nothing is loadable
    (loadable_tools: []), so it can never reach pr_review_create, issue_update, git_publish or any tool
    the caller did not name.
  - `tool_params` binds tool parameters the model can neither see nor override. The machine workflows bind
    the shell to `credentials: none`.
  - Tier `mutating`; no ask or approval nodes, so an unattended run never waits on a human.
  It loops until the response tool is called, at most max_turns turns.

inputs:
  model:
    type: model
    description: LLM model to use
    default:
      tags: [flagship]
  tools:
    type: tools
    default: []
    description: The exact tool names the agent is offered. Nothing else is loadable.
  tool_params:
    type: object
    default: {}
    description: Per-tool bound parameters (tools_config.tools), hidden from the model.
  system_prompt:
    type: string
    default: ""
  response_tool_name:
    type: string
    default: submit_result
  response_tool_description:
    type: string
    default: Submit your structured result to finish.
  response_schema:
    type: object
    description: JSON Schema of the response tool.
    default:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
  max_turns:
    type: integer
    default: 60
    min: 1
    max: 200
  finish_warning_turns:
    type: integer
    default: 5
    min: 0
    max: 50
    description: >-
      When this many turns are left, the agent is told to submit with what it has. 0 never warns.
      An agent that spends its whole budget reading context ends with no response at all, which
      its caller can only treat as a failure; a late, partial answer is worth more.

outputs:
  response: "{{ nodes.agent_loop.response }}"
  completed: "{{ nodes.agent_loop.completed }}"
  model: "{{ nodes.agent_loop.model }}"
  # Why the loop ended without a response, for the caller's error report:
  # the last turn's stop_reason (truncated, refused, error: the provider's
  # answer) and how many turns ran (turns == max_turns with stop_reason
  # tool_use: the budget ran out while the agent was still working).
  stop_reason: "{{ nodes.agent_loop.stop_reason }}"
  turns: "{{ nodes.agent_loop._iterations }}"

entry: [agent_loop]

nodes:
  - id: agent_loop
    type: loop
    # Sentinel loop: runs until the response tool is called. A truncated, refused or
    # errored turn stops it (re-issuing the same request would repeat it), and
    # max_turns bounds the rest.
    while: "outputs.completed != true && !(outputs.stop_reason in ['truncated', 'refused', 'error']) && iter.iteration < inputs.max_turns"
    inline:
      entry: [call_llm]
      outputs:
        response: "{{ has(nodes.execute_tools) && has(nodes.execute_tools.response_data) && nodes.execute_tools.response_data != null && inputs.response_tool_name in nodes.execute_tools.response_data ? nodes.execute_tools.response_data[inputs.response_tool_name] : null }}"
        completed: "{{ has(nodes.execute_tools) && has(nodes.execute_tools.response_data) && nodes.execute_tools.response_data != null && inputs.response_tool_name in nodes.execute_tools.response_data && nodes.execute_tools.response_data[inputs.response_tool_name] != null }}"
        stop_reason: "{{ has(nodes.call_llm) && has(nodes.call_llm.stop_reason) ? nodes.call_llm.stop_reason : 'done' }}"
        model: "{{ has(nodes.call_llm) && has(nodes.call_llm.model) ? nodes.call_llm.model : '' }}"
      nodes:
        - id: call_llm
          type: call_llm
          save_message:
            role: "{{ output.message.role }}"
            content: "{{ has(output.tool_calls) && size(output.tool_calls) > 0 ? '' : output.message.text }}"
            tool_calls: "{{ output.tool_calls }}"
          args:
            model: "{{ inputs.model }}"
            system_prompt: "{{ inputs.system_prompt }}"
            tools_config:
              preloaded_tools: "{{ inputs.tools }}"
              loadable_tools: []
              permission: mutating
              tools: "{{ inputs.tool_params }}"
            response_tool:
              name: "{{ inputs.response_tool_name }}"
              description: "{{ inputs.response_tool_description }}"
              schema: "{{ inputs.response_schema }}"
        - id: remind
          type: save_message
          args:
            role: system
            content: "Finish by calling `{{ inputs.response_tool_name }}`. Do not answer in plain text; nobody is reading it."
        - id: execute_tools
          type: execute_tools
          save_message:
            role: tool
            content: ""
            tool_results: "{{ output.tool_results }}"
          args:
            tool_calls: "{{ nodes.call_llm.tool_calls }}"
            compaction_threshold: "{{ nodes.call_llm.compaction_threshold }}"
            expected_response_tools:
              - "{{ inputs.response_tool_name }}"
        - id: compact
          type: compact
          timeout: 10m
          args:
            model: "{{ inputs.model }}"
        - id: budget
          type: save_message
          args:
            role: system
            content: >-
              {{ string(inputs.max_turns - iter.iteration - 1) }} turns left. Stop reading and call
              `{{ inputs.response_tool_name }}` now with what you have; say in it what you could not
              check. Running out of turns submits nothing at all.
      edges:
        - from: call_llm
          cases:
            - to: execute_tools
              condition: size(nodes.call_llm.tool_calls) > 0
              label: tools
            - to: remind
              condition: size(nodes.call_llm.tool_calls) == 0
              label: no_tools
        - from: execute_tools
          cases:
            - to: compact
              condition: nodes.execute_tools.thread_token_count > nodes.call_llm.compaction_threshold
              label: compact
            - to: budget
              condition: inputs.finish_warning_turns > 0 && inputs.max_turns - iter.iteration - 1 == inputs.finish_warning_turns
              label: budget
        # A turn that compacts still warns: the warning comes after the summary.
        - from: compact
          cases:
            - to: budget
              condition: inputs.finish_warning_turns > 0 && inputs.max_turns - iter.iteration - 1 == inputs.finish_warning_turns
              label: budget
