name: gate_still_failing_blocks_and_pushes_nothing
description: >-
  The retry's gate fails too: nothing is published, the PR is labelled blocked and the summary carries the gate output.
inputs: {"repos": ["reliant-labs/forge"], "trusted_ids": [], "repo": "reliant-labs/forge", "pr_number": 55, "event": "review by x", "owner_id": "225976313"}
events:
  - node: rounds.me
    output: {"is_error": false, "data": {"login": "reliant-01", "id": 225976313}}
  - node: rounds.pr
    output: {"is_error": false, "data": {"number": 55, "state": "open", "title": "fix: x", "body": "Closes #7", "user": "reliant-01", "head": {"ref": "autopilot/issue-7", "sha": "0123456789abcdef0123456789abcdef01234567", "repo": "reliant-labs/forge"}, "base": {"ref": "main", "sha": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", "repo": "reliant-labs/forge"}}}
  - node: rounds.issue
    output: {"is_error": false, "data": {"labels": ["agent:authored"], "state": "open", "is_pull_request": true}}
  - node: rounds.repo_info
    output: {"is_error": false, "data": {"default_branch": "main"}}
  - node: rounds.head_branch
    output: {"is_error": false, "data": {"exists": true, "protected": false}}
  - node: rounds.reviews
    output: {"is_error": false, "data": {"items": [{"id": 900, "state": "CHANGES_REQUESTED", "body": "Please handle the nil case.", "html_url": "r900", "user": "reliant-01", "user_id": 225976313, "submitted_at": "2026-10-14T20:10:00Z"}]}}
  - node: rounds.inline
    output: {"is_error": false, "data": {"items": []}}
  - node: rounds.convo
    output: {"is_error": false, "data": {"items": []}}
  - node: rounds.labels
    black_box: true
    output: {}
  - node: rounds.lease
    black_box: true
    output: {"status": "acquired", "lease_id": 4242, "started_at": "2026-10-14T20:20:00Z", "expires": "x", "takeover_from": "", "holder": "", "detail": "ACQUIRE"}
  - node: rounds.wt
    output: {"path": "/w/ws", "branch": "b", "id": "w", "name": "n", "base_branch": "x", "status": "active"}
  - node: rounds.dir
    output: {"exit_code": 0, "stdout": "0123456789abcdef0123456789abcdef01234567 /w/ws/forge"}
  - node: rounds.agent
    black_box: true
    output: {"completed": true, "response": {"outcome": "changed", "summary": "Handled nil.", "commit_message": "fix: handle nil\n\nper review", "replies": [{"kind": "review", "id": 900, "reply": "Handled in a.go:12."}, {"kind": "inline", "id": 800, "reply": "Renamed."}]}, "model": "m"}
  - node: rounds.gate
    output: {"exit_code": 1, "stdout": "FAIL"}
  - node: rounds.agent_retry
    black_box: true
    output: {"completed": true, "response": {"outcome": "changed", "summary": "Handled nil.", "commit_message": "fix: handle nil\n\nper review", "replies": [{"kind": "review", "id": 900, "reply": "Handled in a.go:12."}, {"kind": "inline", "id": 800, "reply": "Renamed."}]}, "model": "m"}
  - node: rounds.gate_retry
    output: {"exit_code": 1, "stdout": "FAIL again"}
  - node: rounds.summary
    output: {"is_error": false, "data": {"id": 9}}
  - node: rounds.blocked_label
    black_box: true
    output: {}
  - node: rounds.release
    black_box: true
    output: {"recheck_found": 0, "other_live_lease": false}
expect:
  outcome: completed
  completed: [rounds.gate_retry, rounds.pick, rounds.blocked_label, rounds.release, ended_failed]
  not_reached: [rounds.publish]
  node_outputs:
    rounds.outcome: {kind: blocked}
  # A blocked round is a failed run: the PR was labelled and the round summary posted, so the handler records
  # the failure without a second comment.
  on_failure:
    ran: true
    node_id: ended_failed
    error_code: outcome
  messages:
    on_failure.recorded:
      count: 1
      content_contains: ["the agent could not address the feedback"]
