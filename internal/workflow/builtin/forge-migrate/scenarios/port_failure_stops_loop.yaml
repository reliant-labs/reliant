name: port_failure_stops_loop
description: Second of three components fails its gate; the loop exits early (no third iteration) and routes to failed, never reaching converge.

events:
  - node: inventory.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_migration_plan
          name: submit_migration_plan
          input:
            summary: "Three port units."
            project_name: "acme"
            kind: "service"
            module_path: "github.com/acme/acme-next"
            target_directory: "/tmp/acme-next"
            open_questions: []
            components:
              - name: "domain"
                kind: "package"
                source_paths: ["internal/domain"]
                depends_on: []
                notes: "Pure types."
              - name: "store"
                kind: "package"
                source_paths: ["internal/store"]
                depends_on: ["domain"]
                notes: "DB layer."
              - name: "api"
                kind: "service"
                source_paths: ["internal/api"]
                depends_on: ["store"]
                notes: "Connect handlers."
  - node: inventory.agent_loop.execute_tools
    output:
      response_data:
        submit_migration_plan:
          summary: "Three port units."
          project_name: "acme"
          kind: "service"
          module_path: "github.com/acme/acme-next"
          target_directory: "/tmp/acme-next"
          open_questions: []
          components:
            - name: "domain"
              kind: "package"
              source_paths: ["internal/domain"]
              depends_on: []
              notes: "Pure types."
            - name: "store"
              kind: "package"
              source_paths: ["internal/store"]
              depends_on: ["domain"]
              notes: "DB layer."
            - name: "api"
              kind: "service"
              source_paths: ["internal/api"]
              depends_on: ["store"]
              notes: "Connect handlers."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: approved

  # scaffold_baseline EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: scaffold_baseline.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for scaffold_baseline."
      response_text: "Implementation attempt for scaffold_baseline."
      tool_calls: []
  - node: scaffold_baseline.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Scaffold green."
  - node: scaffold_baseline.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Scaffold green."
      tool_results: []
      thread_token_count: 100
  # port_loop.port EXECUTES its get-it-right body: mocking the innermost
  # agent_loop nodes makes the nested ref transparent, so port's own args CEL
  # (the working_directory-interpolated lint/build/test commands and
  # implementer_preset: forge) is compiled and evaluated.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Ported the domain package."
      response_text: "Ported the domain package."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "domain ported."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "domain ported."
      tool_results: []
      thread_token_count: 100

  # Component 2 (store) EXECUTES its get-it-right body and EXHAUSTS it: port sets
  # max_retries: 4, so the failure premise needs a verdict for every attempt.
  # An incompletely-mocked body does not "fail" — the structured-agent review
  # loop spins on remind_response to max_turns, so all four are supplied here.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Store port attempt 1: tests still red."
      response_text: "Store port attempt 1: tests still red."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "store port left tests red after max retries."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "store port left tests red after max retries."
      tool_results: []
      thread_token_count: 100

  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Store port attempt 2: tests still red."
      response_text: "Store port attempt 2: tests still red."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "store port left tests red after max retries."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "store port left tests red after max retries."
      tool_results: []
      thread_token_count: 100

  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Store port attempt 3: tests still red."
      response_text: "Store port attempt 3: tests still red."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "store port left tests red after max retries."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "store port left tests red after max retries."
      tool_results: []
      thread_token_count: 100

  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Store port attempt 4: tests still red."
      response_text: "Store port attempt 4: tests still red."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "store port left tests red after max retries."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "store port left tests red after max retries."
      tool_results: []
      thread_token_count: 100

expect:
  outcome: completed
  reached:
    - inventory
    - confirm
    - scaffold_baseline
    - port_loop
    - failed
  not_reached:
    - converge
    - success
    - stuck
    - denied
  node_outputs:
    port_loop:
      _iterations: 2
      component_strategy: "continue"
