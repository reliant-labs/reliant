name: plan_denied
description: User rejects the migration plan; nothing downstream runs.

events:
  - node: inventory.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_migration_plan
          name: submit_migration_plan
          input:
            summary: "Plan ready."
            project_name: "acme"
            kind: "service"
            module_path: "github.com/acme/acme-next"
            target_directory: "/tmp/acme-next"
            open_questions: ["Is the admin binary in scope?"]
            components:
              - name: "domain"
                kind: "package"
                source_paths: ["internal/domain"]
                depends_on: []
                notes: "Pure types."
  - node: inventory.agent_loop.execute_tools
    output:
      response_data:
        submit_migration_plan:
          summary: "Plan ready."
          project_name: "acme"
          kind: "service"
          module_path: "github.com/acme/acme-next"
          target_directory: "/tmp/acme-next"
          open_questions: ["Is the admin binary in scope?"]
          components:
            - name: "domain"
              kind: "package"
              source_paths: ["internal/domain"]
              depends_on: []
              notes: "Pure types."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: denied

expect:
  outcome: completed
  reached:
    - inventory
    - plan_context
    - confirm
    - denied
  not_reached:
    - scaffold_baseline
    - port_loop
    - converge
    - success
    - failed
    - stuck
