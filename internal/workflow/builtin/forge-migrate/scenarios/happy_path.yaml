name: happy_path
description: Two components port cleanly; full pipeline to success.

events:
  - node: inventory.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_migration_plan
          name: submit_migration_plan
          input:
            summary: "Small service repo; two port units."
            project_name: "acme"
            kind: "service"
            module_path: "github.com/acme/acme-next"
            target_directory: "/tmp/acme-next"
            open_questions: []
            components:
              - name: "domain"
                kind: "package"
                source_paths: ["internal/domain"]
                depends_on: []
                notes: "Pure types, port first."
              - name: "api"
                kind: "service"
                source_paths: ["internal/api"]
                depends_on: ["domain"]
                notes: "Connect handlers."
  - node: inventory.agent_loop.execute_tools
    output:
      response_data:
        submit_migration_plan:
          summary: "Small service repo; two port units."
          project_name: "acme"
          kind: "service"
          module_path: "github.com/acme/acme-next"
          target_directory: "/tmp/acme-next"
          open_questions: []
          components:
            - name: "domain"
              kind: "package"
              source_paths: ["internal/domain"]
              depends_on: []
              notes: "Pure types, port first."
            - name: "api"
              kind: "service"
              source_paths: ["internal/api"]
              depends_on: ["domain"]
              notes: "Connect handlers."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: approved

  # scaffold_baseline EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: scaffold_baseline.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for scaffold_baseline."
      response_text: "Implementation attempt for scaffold_baseline."
      tool_calls: []
  - node: scaffold_baseline.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Scaffold green, contracts floor set."
  - node: scaffold_baseline.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Scaffold green, contracts floor set."
      tool_results: []
      thread_token_count: 100
  # port_loop.port EXECUTES its get-it-right body: mocking the innermost
  # agent_loop nodes makes the nested ref transparent, so port's own args CEL
  # (the working_directory-interpolated lint/build/test commands and
  # implementer_preset: forge) is compiled and evaluated.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Ported the domain package."
      response_text: "Ported the domain package."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "domain ported, tests green."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "domain ported, tests green."
      tool_results: []
      thread_token_count: 100

  # port_loop.port EXECUTES its get-it-right body: mocking the innermost
  # agent_loop nodes makes the nested ref transparent, so port's own args CEL
  # (the working_directory-interpolated lint/build/test commands and
  # implementer_preset: forge) is compiled and evaluated.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Ported the api service."
      response_text: "Ported the api service."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "api ported, tests green."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "api ported, tests green."
      tool_results: []
      thread_token_count: 100

  # converge EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: converge.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for converge."
      response_text: "Implementation attempt for converge."
      tool_calls: []
  - node: converge.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Wiring complete, parity checklist satisfied."
  - node: converge.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Wiring complete, parity checklist satisfied."
      tool_results: []
      thread_token_count: 100
expect:
  outcome: completed
  reached:
    - inventory
    - plan_context
    - confirm
    - scaffold_baseline
    - port_loop
    - converge
    - success
  not_reached:
    - denied
    - stuck
    - failed
  node_outputs:
    port_loop:
      _iterations: 2
      component_strategy: "pass"
      ported: 2
