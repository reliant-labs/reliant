name: scaffold_stuck_escalates
description: Scaffold hits a tooling problem (stuck); workflow stops at the stuck terminal without porting.

events:
  - node: inventory.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_migration_plan
          name: submit_migration_plan
          input:
            summary: "Plan ready."
            project_name: "acme"
            kind: "cli"
            module_path: "github.com/acme/acme-next"
            target_directory: "/tmp/acme-next"
            open_questions: []
            components:
              - name: "core"
                kind: "package"
                source_paths: ["internal/core"]
                depends_on: []
                notes: "CLI core."
  - node: inventory.agent_loop.execute_tools
    output:
      response_data:
        submit_migration_plan:
          summary: "Plan ready."
          project_name: "acme"
          kind: "cli"
          module_path: "github.com/acme/acme-next"
          target_directory: "/tmp/acme-next"
          open_questions: []
          components:
            - name: "core"
              kind: "package"
              source_paths: ["internal/core"]
              depends_on: []
              notes: "CLI core."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: approved

  # scaffold_baseline EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: scaffold_baseline.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for scaffold_baseline."
      response_text: "Implementation attempt for scaffold_baseline."
      tool_calls: []
  - node: scaffold_baseline.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "stuck"
            feedback: "forge binary crashes on startup — environment issue."
  - node: scaffold_baseline.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "stuck"
          feedback: "forge binary crashes on startup — environment issue."
      tool_results: []
      thread_token_count: 100
expect:
  outcome: completed
  reached:
    - inventory
    - confirm
    - scaffold_baseline
    - stuck
  not_reached:
    - port_loop
    - converge
    - success
    - failed
    - denied
