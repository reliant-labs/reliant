name: converge_failure
description: All components port but convergence review fails parity; workflow ends failed.

events:
  - node: inventory.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_migration_plan
          name: submit_migration_plan
          input:
            summary: "One port unit."
            project_name: "acme"
            kind: "service"
            module_path: "github.com/acme/acme-next"
            target_directory: "/tmp/acme-next"
            open_questions: []
            components:
              - name: "domain"
                kind: "package"
                source_paths: ["internal/domain"]
                depends_on: []
                notes: "Pure types."
  - node: inventory.agent_loop.execute_tools
    output:
      response_data:
        submit_migration_plan:
          summary: "One port unit."
          project_name: "acme"
          kind: "service"
          module_path: "github.com/acme/acme-next"
          target_directory: "/tmp/acme-next"
          open_questions: []
          components:
            - name: "domain"
              kind: "package"
              source_paths: ["internal/domain"]
              depends_on: []
              notes: "Pure types."
      tool_results: []
      thread_token_count: 100

  - node: confirm
    output:
      status: approved

  # scaffold_baseline EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: scaffold_baseline.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for scaffold_baseline."
      response_text: "Implementation attempt for scaffold_baseline."
      tool_calls: []
  - node: scaffold_baseline.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Scaffold green."
  - node: scaffold_baseline.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Scaffold green."
      tool_results: []
      thread_token_count: 100
  # port_loop.port EXECUTES its get-it-right body: mocking the innermost
  # agent_loop nodes makes the nested ref transparent, so port's own args CEL
  # (the working_directory-interpolated lint/build/test commands and
  # implementer_preset: forge) is compiled and evaluated.
  - node: port_loop.port.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Ported the domain package."
      response_text: "Ported the domain package."
      tool_calls: []
  - node: port_loop.port.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "domain ported."
  - node: port_loop.port.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "domain ported."
      tool_results: []
      thread_token_count: 100

  # converge EXECUTES its get-it-right body. forge-migrate sets max_retries: 5
  # for converge, so the failure premise needs a verdict for EVERY attempt: a
  # single mock is consumed once and the loop then defaults to a green exit.
  - node: converge.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Converge attempt 1."
      response_text: "Converge attempt 1."
      tool_calls: []
  - node: converge.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: fail
            strategy: "continue"
            feedback: "Two source entrypoints unaccounted for in the plan."
  - node: converge.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: fail
          strategy: "continue"
          feedback: "Two source entrypoints unaccounted for in the plan."
      tool_results: []
      thread_token_count: 100
