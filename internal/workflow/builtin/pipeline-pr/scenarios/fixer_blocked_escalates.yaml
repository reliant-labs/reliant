name: fixer_blocked_escalates
description: >-
  The fixer reports it cannot address the blocker: the check never runs, nothing is pushed, and the PR
  goes to a person with the fixer's own explanation.
inputs:
  repository: acme/app
  number: 7
events:
  - node: decide
    output:
      is_error: false
      data:
        next: fix
        head: 0123456789abcdef0123456789abcdef01234567
        reason: "review round 1 asked for changes"
        record_id: rec-7
        repository: acme/app
        number: 7
        head_ref: feat/x
        base_ref: main
        shadow: false
        repo_target: app
        repo_subdir: ""
        check_script: "echo check"
        findings: []
        blockers: [{id: f1, severity: blocker, body: "redesign the API"}]
        evidence: {}
  - node: wt
    output: {path: /work/pr-7, branch: feat/x, status: active}
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: blocked, summary: "this needs an owner decision on the API"}}
  - node: escalate
    output: {is_error: false, data: {state: needs_person}}
expect:
  outcome: completed
  completed: [decide, wt, fix, escalate]
  not_reached: [fix.rounds.check, fix.rounds.checked, push, pushed, enqueue]
  node_outputs:
    fix: {next: escalate, reason: "the fixer could not fix it: this needs an owner decision on the API"}
