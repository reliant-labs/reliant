name: nothing_to_do_or_refused_ends_quietly
description: >-
  pr.next refused (a repository that is not enrolled, the pipeline switched off): the run ends with
  nothing else run. The same holds for next none (a draft, a held PR, a head another run owns).
inputs:
  repository: acme/app
  number: 7
events:
  - node: decide
    output: {is_error: true, error_code: failed_precondition, content: "acme/app#7 is not in the pipeline: its repository is not enrolled"}
expect:
  outcome: completed
  completed: [decide]
  not_reached: [review, verdict, wt, fix, push, pushed, enqueue, close, escalate]
