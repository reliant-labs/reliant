name: re_review_of_the_pushed_head_enqueues
description: >-
  The run the fixer's push woke: pr.next sees the new head and asks for a review, the reviewer (a fresh
  session) passes it, pr.verdict records the pass and answers enqueue, and the PR goes to the merge queue.
  No fixer and no push.
inputs:
  repository: acme/app
  number: 7
events:
  - node: decide
    output:
      is_error: false
      data:
        next: review
        head: fedcba9876543210fedcba9876543210fedcba98
        reason: "new code since round 1"
        risk_tier: medium
        record_id: rec-7
        repository: acme/app
        number: 7
        head_ref: feat/x
        base_ref: main
        shadow: false
        findings: [{id: f1, severity: blocker, path: a.go, line: 3, body: "nil map write"}]
        blockers: []
        evidence: {}
  - node: review.agent_loop.call_llm
    output:
      message: {role: assistant, text: ""}
      response_text: ""
      tool_calls: [{id: call_1, name: submit_verdict, input: "{}"}]
  - node: review.agent_loop.execute_tools
    output:
      message: {role: tool, text: ""}
      tool_results: [{tool_call_id: call_1, content: ok}]
      response_data:
        submit_verdict: {verdict: pass, findings: [], risk_tier: medium, summary: "f1 is fixed."}
  - node: verdict
    output: {is_error: false, data: {next: enqueue, verdict: pass, round: 2, reason: "", blockers: []}}
  - node: enqueue
    output: {is_error: false, data: {queued: true, reason: admitted}}
expect:
  outcome: completed
  completed: [decide, review, verdict, enqueue]
  not_reached: [wt, fix, push, pushed, close, escalate]
  node_outputs:
    review: {verdict: pass, role: reviewer}
