name: changes_fix_check_fails_then_passes_and_pushes
description: >-
  The reviewer asks for changes; the fixer edits; the scoped check fails, so the fixer gets the failures
  and edits again; the check passes; the fix is pushed and pr.pushed records it. The push's new head is
  decided (and re-reviewed) by the next run: see re_review_of_the_pushed_head_enqueues.
inputs:
  repository: acme/app
  number: 7
events:
  - node: decide
    output:
      is_error: false
      data:
        next: review
        head: 0123456789abcdef0123456789abcdef01234567
        reason: "code change; risk medium"
        risk_tier: medium
        record_id: rec-7
        repository: acme/app
        number: 7
        head_ref: feat/x
        base_ref: main
        shadow: false
        repo_target: app
        repo_subdir: ""
        check_script: "echo check"
        findings: []
        blockers: []
        evidence: {}
  - node: review.agent_loop.call_llm
    output:
      message: {role: assistant, text: ""}
      response_text: ""
      tool_calls: [{id: call_1, name: submit_verdict, input: "{}"}]
  - node: review.agent_loop.execute_tools
    output:
      message: {role: tool, text: ""}
      tool_results: [{tool_call_id: call_1, content: ok}]
      response_data:
        submit_verdict:
          verdict: changes
          findings: [{id: f1, severity: blocker, path: a.go, line: 3, body: "nil map write"}]
          risk_tier: medium
          summary: "One blocker."
  - node: verdict
    output:
      is_error: false
      data:
        next: fix
        verdict: changes
        round: 1
        reason: "review round 1 asked for changes"
        blockers: [{id: f1, severity: blocker, path: a.go, line: 3, body: "nil map write"}]
  - node: wt
    output: {path: /work/pr-7, branch: feat/x, status: active}
  # Round 1: the fix fails the check.
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "guarded the map", commit_message: "fix: guard the map"}}
  - node: fix.rounds.check
    output: {exit_code: 1, stdout: "{\"stages\":[{\"name\":\"test\",\"verdict\":\"fail\"}]}", stderr: ""}
  - node: fix.rounds.checked
    output:
      is_error: false
      data: {next: fix, reason: "the check failed (round 1 of 3)", failures: [{check: test, detail: "TestMap: panic"}]}
  # Round 2: it passes.
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "initialised the map too", commit_message: "fix: initialise the map"}}
  - node: fix.rounds.check
    output: {exit_code: 0, stdout: "{\"stages\":[{\"name\":\"test\",\"verdict\":\"pass\"}]}", stderr: ""}
  - node: fix.rounds.checked
    output:
      is_error: false
      data: {next: push, reason: "the check passed", failures: []}
  - node: push
    output: {pushed: true, sha: fedcba9876543210fedcba9876543210fedcba98, branch: feat/x}
  - node: pushed
    output: {is_error: false, data: {next: decide, outcome: succeeded, pushed_head: fedcba9876543210fedcba9876543210fedcba98}}
expect:
  outcome: completed
  completed: [decide, review, verdict, wt, fix, push, pushed]
  not_reached: [enqueue, close, escalate]
  node_outputs:
    fix: {next: push, message: "fix: initialise the map"}
    push: {pushed: true}
