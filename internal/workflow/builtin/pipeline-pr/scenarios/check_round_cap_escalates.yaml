name: check_round_cap_escalates
description: >-
  A comment woke the run and pr.next sent its blocker straight to the fixer. The scoped check fails on
  every round; on the third, pr.checked answers escalate, the loop stops, nothing is pushed, and
  pr.needs_person hands the PR to a person with the check's reason.
inputs:
  repository: acme/app
  number: 7
  comment: {id: "11", body: "please rename this", author: alice}
events:
  - node: decide
    output:
      is_error: false
      data:
        next: fix
        head: 0123456789abcdef0123456789abcdef01234567
        reason: "a review comment asks for a change"
        record_id: rec-7
        repository: acme/app
        number: 7
        head_ref: feat/x
        base_ref: main
        shadow: false
        repo_target: app
        repo_subdir: ""
        check_script: "echo check"
        findings: []
        blockers: [{id: comment-11, severity: blocker, body: "alice commented: please rename this"}]
        evidence: {}
  - node: wt
    output: {path: /work/pr-7, branch: feat/x, status: active}
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "renamed it"}}
  - node: fix.rounds.check
    output: {exit_code: 1, stdout: "", stderr: "build failed"}
  - node: fix.rounds.checked
    output: {is_error: false, data: {next: fix, reason: "the check failed (round 1 of 3)", failures: [{check: check, detail: "build failed"}]}}
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "fixed the build"}}
  - node: fix.rounds.check
    output: {exit_code: 1, stdout: "", stderr: "build failed"}
  - node: fix.rounds.checked
    output: {is_error: false, data: {next: fix, reason: "the check failed (round 2 of 3)", failures: [{check: check, detail: "build failed"}]}}
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "tried again"}}
  - node: fix.rounds.check
    output: {exit_code: 1, stdout: "", stderr: "build failed"}
  - node: fix.rounds.checked
    output:
      is_error: false
      data: {next: escalate, reason: "the fixer's check failed 3 times on this fix (signature abc); a person needs to look", failures: [{check: check, detail: "build failed"}]}
  - node: escalate
    output: {is_error: false, data: {state: needs_person, shadow: false}}
expect:
  outcome: completed
  completed: [decide, wt, fix, escalate]
  not_reached: [review, verdict, push, pushed, enqueue, close]
  node_outputs:
    fix: {next: escalate, reason: "the fixer's check failed 3 times on this fix (signature abc); a person needs to look"}
