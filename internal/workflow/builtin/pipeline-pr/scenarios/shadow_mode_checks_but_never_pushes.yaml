name: shadow_mode_checks_but_never_pushes
description: >-
  In a repository in shadow mode the run computes everything and writes nothing to GitHub: the fixer
  edits and the check passes, but git_publish is skipped, and pr.pushed records the attempt with no
  pushed head. The actions themselves suppress their own writes (pr.close, pr.needs_person, the queue).
inputs:
  repository: acme/app
  number: 7
events:
  - node: decide
    output:
      is_error: false
      data:
        next: fix
        head: 0123456789abcdef0123456789abcdef01234567
        reason: "review round 1 asked for changes"
        record_id: rec-7
        repository: acme/app
        number: 7
        head_ref: feat/x
        base_ref: main
        shadow: true
        repo_target: app
        repo_subdir: ""
        check_script: "echo check"
        findings: []
        blockers: [{id: f1, severity: blocker, body: "nil map write"}]
        evidence: {}
  - node: wt
    output: {path: /work/pr-7, branch: feat/x, status: active}
  - node: fix.rounds.fix
    black_box: true
    output: {completed: true, response: {outcome: changed, summary: "guarded the map", commit_message: "fix: guard the map"}}
  - node: fix.rounds.check
    output: {exit_code: 0, stdout: "{\"stages\":[]}", stderr: ""}
  - node: fix.rounds.checked
    output: {is_error: false, data: {next: push, reason: "the check passed", failures: []}}
  - node: pushed
    output: {is_error: false, data: {next: decide, outcome: succeeded, pushed_head: ""}}
expect:
  outcome: completed
  completed: [decide, wt, fix, pushed]
  skipped: [push]
  not_reached: [review, verdict, enqueue, close, escalate]
  node_outputs:
    pushed:
      data: {next: decide, outcome: succeeded, pushed_head: ""}
