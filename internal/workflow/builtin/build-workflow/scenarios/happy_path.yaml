name: happy_path
description: >
  All three phases succeed on first attempt.
  Scoping writes a plan with one custom integration.
  Router sends to build_integrations.
  Integration is built and passes review.
  Workflow is built and passes review.

events:
  # scope_conversation EXECUTES: it is a builtin://scope-conversation ref whose
  # own `conversation` node is a builtin://agent ref, so the qualified id below
  # makes BOTH transparent and compiles scope-conversation's prompt CEL
  # (question_areas, plan_filename, max_questions, max_turns).
  - node: scope_conversation.conversation.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: |
            I've written WORKFLOW_PLAN.md. The workflow automates a deploy pipeline
            with a Slack notification integration (custom script) and a standard
            GitHub MCP server (off-the-shelf).
      response_text: |
            I've written WORKFLOW_PLAN.md. The workflow automates a deploy pipeline
            with a Slack notification integration (custom script) and a standard
            GitHub MCP server (off-the-shelf).
      tool_calls: []
  - node: integration_router
    output:
      selected_node: build_integrations
      reasoning: "Plan includes a custom Slack notification script that needs to be built."

  # build_integrations EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: build_integrations.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for build_integrations."
      response_text: "Implementation attempt for build_integrations."
      tool_calls: []
  - node: build_integrations.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Slack notification script works. Parameterized webhook URL via env var. Test passes."
  - node: build_integrations.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Slack notification script works. Parameterized webhook URL via env var. Test passes."
      tool_results: []
      thread_token_count: 100
  # build_workflow EXECUTES its get-it-right body rather than standing in for it, so the
  # loop's own iteration count and verdict are derived, not asserted literals.
  - node: build_workflow.attempt.implement.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation attempt for build_workflow."
      response_text: "Implementation attempt for build_workflow."
      tool_calls: []
  - node: build_workflow.attempt.review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_submit_evaluation
          name: submit_evaluation
          input:
            grade: pass
            strategy: "pass"
            feedback: "Workflow matches plan. Integration script correctly referenced. Scenarios cover happy and failure paths."
  - node: build_workflow.attempt.review.agent_loop.execute_tools
    output:
      response_data:
        submit_evaluation:
          grade: pass
          strategy: "pass"
          feedback: "Workflow matches plan. Integration script correctly referenced. Scenarios cover happy and failure paths."
      tool_results: []
      thread_token_count: 100
expect:
  outcome: completed
  reached:
    - scope_conversation
    - integration_router
    - build_integrations
    - build_workflow
