# Prompt improvement produces clear specification
name: parallel_compete_prompt_improvement
description: Verifies prompt improvement step runs correctly
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: |
          ## Improved Task Specification

          ### Objective
          Create a user management API endpoint

          ### Acceptance Criteria
          - GET /users returns paginated list
          - POST /users creates new user
          - Input validation required

          ### Edge Cases
          - Empty database returns empty array
          - Duplicate email returns 409
      response_text: |
        ## Improved Task Specification

        ### Objective
        Create a user management API endpoint
      tool_calls: []

  - node: implementations.create_wt
    output:
      path: "/wt/1"
      branch: "b1"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Done"
      response_text: "Done"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Done"
      response_text: "Done"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Done"
      response_text: "Done"
      tool_calls: []

  # Review with structured response
  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 1
          strategy: "use_winner"
          confidence: 7
          rationale: "Best implementation overall"
          synthesis_instructions: ""
  - node: apply_winner
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

expect:
  outcome: completed
  reached:
    - improve_prompt
    - save_improved_prompt
    - implementations
    - review
    - apply_winner
    - complete
