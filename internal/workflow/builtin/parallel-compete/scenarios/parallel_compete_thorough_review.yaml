# Reviewer provides thorough analysis before use_winner decision
name: parallel_compete_thorough_review
description: Reviewer provides detailed analysis before deciding
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Create REST API"
      response_text: "Create REST API"
      tool_calls: []

  - node: implementations.create_wt
    output:
      path: "/wt/1"
      branch: "b1"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation 1 done"
      response_text: "Implementation 1 done"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation 2 done"
      response_text: "Implementation 2 done"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Implementation 3 done"
      response_text: "Implementation 3 done"
      tool_calls: []

  # Thorough reviewer analysis with structured response
  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 2
          strategy: "use_winner"
          confidence: 10
          rationale: "Most complete implementation with proper structure and testing"
          synthesis_instructions: ""
  - node: apply_winner
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

expect:
  outcome: completed
  reached:
    - review
    - apply_winner
    - complete
