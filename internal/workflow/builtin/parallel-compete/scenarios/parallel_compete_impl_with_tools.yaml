# Implementations complete successfully with detailed review
name: parallel_compete_impl_with_tools
description: All implementation candidates complete their work with detailed review
events:
  - node: improve_prompt
    output:
      message:
        role: assistant
        text: "Build a cache layer"
      response_text: "Build a cache layer"
      tool_calls: []

  - node: implementations.create_wt
    output:
      path: "/wt/1"
      branch: "b1"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Created cache.go with basic implementation"
      response_text: "Created cache.go with basic implementation"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/2"
      branch: "b2"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Created cache.go and cache_test.go with full test coverage"
      response_text: "Created cache.go and cache_test.go with full test coverage"
      tool_calls: []
  - node: implementations.create_wt
    output:
      path: "/wt/3"
      branch: "b3"
  - node: implementations.impl.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: "Minimal cache implementation"
      response_text: "Minimal cache implementation"
      tool_calls: []

  # Reviewer picks winner with structured response
  # review EXECUTES its structured-agent body. The response tool is
  # `submit_review` (parallel-compete.yaml sets response_tool_name); any other
  # key leaves the loop's `completed` false and it spins to max_turns.
  - node: review.agent_loop.call_llm
    output:
      message:
        role: assistant
        text: ""
      response_text: ""
      tool_calls:
        - id: call_review
          name: submit_review
          input: {}
  - node: review.agent_loop.execute_tools
    output:
      tool_results: []
      thread_token_count: 100
      response_data:
        submit_review:
          winner: 2
          strategy: "use_winner"
          confidence: 9
          rationale: "Only candidate with test coverage"
          synthesis_instructions: ""
  - node: apply_winner
    output:
      exit_code: 0
      stdout: ""
      stderr: ""

expect:
  outcome: completed
  reached:
    - implementations
    - review
    - apply_winner
    - complete
