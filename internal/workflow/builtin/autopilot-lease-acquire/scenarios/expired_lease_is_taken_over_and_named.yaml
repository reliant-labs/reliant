name: expired_lease_is_taken_over_and_named
description: >-
  A lease whose expiry has passed is marked superseded and the new lease names the run it took over from (TAKEOVER).
inputs: {"repo": "reliant-labs/forge", "number": 743, "run_id": "run-A", "workflow_name": "autopilot-issue-worker", "settle_seconds": 0}
events:
  - node: me
    output: {"is_error": false, "data": {"login": "reliant-01", "id": 225976313}}
  - node: first_read
    output: {"is_error": false, "data": {"items": [{"id": 7, "user": "reliant-01", "user_id": 1, "created_at": "2026-10-14T20:00:00Z", "body": "<!-- autopilot-lease run=run-old expires=2000-01-01T00:00:00Z state=held workflow=issue-worker -->\ntext", "html_url": "c7"}]}}
  - node: supersede.mark
    output: {"is_error": false, "data": {"id": 1}}
  - node: mirror
    output: {"is_error": false, "data": {"id": 1}}
  - node: post
    output: {"is_error": false, "data": {"id": 100, "created_at": "2026-10-14T20:05:00Z"}}
  - node: settle
    output: {"exit_code": 0}
  - node: second_read
    output: {"is_error": false, "data": {"items": [{"id": 100, "user": "reliant-01", "user_id": 1, "created_at": "2026-10-14T20:05:00Z", "body": "<!-- autopilot-lease run=run-A expires=2099-01-01T00:00:00Z state=held workflow=issue-worker -->\ntext", "html_url": "c100"}]}}
expect:
  outcome: completed
  completed: [supersede, plan, won]
  not_reached: [held, lost]
  node_outputs:
    plan: {takeover_from: run-old}
    won: {takeover_from: run-old}
  outputs:
    status: acquired
    takeover_from: run-old
