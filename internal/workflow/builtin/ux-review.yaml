name: ux-review
apiVersion: "0.0.5"
description: |
  UX improvement loop: implements changes then reviews them visually until the reviewer approves.

  Loop: implement → review → done?
    1. implement — Make the requested UX changes (the only node that writes code).
    2. review — Visually audit the running application via Chrome DevTools.
       Takes screenshots, tests interactions, checks for errors.
       Returns structured verdict: pass or fail with issues list.

  Context management:
    The implementer forks from the parent thread each iteration with memo,
    accumulating context across attempts. Review feedback is injected so the
    implementer knows what to fix. The reviewer also uses memo to track its
    own prior analysis across iterations.

  Thread architecture:
    attempt loop inherits main thread.
    implement forks with memo — accumulates context, sees review feedback via inject.
    review forks with memo — builds on prior analysis, gets fresh review instructions via inject.

entry: [attempt]

inputs:
  prompt:
    type: string
    description: "Description of the UX improvement to make"

  app_url:
    type: string
    description: "URL of the application to review"
    default: ""

  tools:
    type: array
    default: ["tag:default"]

  max_iterations:
    type: integer
    default: 10
    min: 1
    max: 50
    description: "Maximum implement→review cycles"

  model:
    type: model
    description: LLM model to use for all phases
    default:
      tags: [flagship]

  mode:
    type: enum
    ui: toolbar
    default: auto
    description: Execution mode for agent steps.
    enum: [manual, auto]

  yield:
    type: boolean
    ui: toolbar
    default: true
    description: Pause for user review after each iteration.

  temperature:
    type: number
    default: 1.0
    min: 0
    max: 1
    description: Response randomness

  thinking_level:
    type: enum
    enum: [low, medium, high, xhigh]
    default: medium
    description: Extended thinking level

nodes:
  - id: attempt
    type: loop
    while: >
      (has(outputs.review_verdict) && outputs.review_verdict != "pass")
      && iter.iteration < inputs.max_iterations
    yield: "inputs.yield"
    inline:
      entry: [implement]

      outputs:
        review_verdict: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.verdict : 'pass'}}"
        review_issues: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.issues : []}}"
        review_summary: "{{has(nodes.review) && has(nodes.review.response) && nodes.review.response != null ? nodes.review.response.summary : ''}}"

      nodes:
        - id: implement
          type: workflow
          ref: builtin://agent
          presets:
            default: ux
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
          thread:
            mode: fork
            memo: true
            inject:
              role: user
              content: |
                ## UX Review — Implement Attempt {{iter.iteration + 1}} of {{inputs.max_iterations}}

                {{inputs.app_url != '' ? '**Application URL:** ' + inputs.app_url : ''}}

                Implement the requested UX changes. The original request and any prior review feedback are in the conversation above.

                {{has(outputs.review_verdict) && outputs.review_verdict == 'fail' ? '### Review Feedback from Previous Attempt\n\n**Verdict:** FAIL\n\n**Summary:** ' + outputs.review_summary + '\n\n**Issues to fix:**\n' + outputs.review_issues.map(i, '- ' + i).join('\n') : ''}}

                After finishing, summarize:
                1. What you changed and why
                2. How the changes address any prior review feedback
                3. What you're uncertain about
          save_message:
            role: assistant
            content: |
              ## Implementation Notes (Attempt {{iter.iteration + 1}})
              {{output.response_text}}

        - id: review
          type: workflow
          ref: builtin://structured-agent
          presets:
            default: ux_reviewer
          args:
            model: "{{inputs.model}}"
            mode: "{{inputs.mode}}"
            temperature: "{{inputs.temperature}}"
            thinking_level: "{{inputs.thinking_level}}"
            response_tool_name: submit_ux_review
            response_tool_description: "Submit your UX review verdict — pass if the implementation meets requirements, fail if issues remain"
            response_schema:
              type: object
              required:
                - verdict
                - issues
                - summary
              properties:
                verdict:
                  type: string
                  enum: ["pass", "fail"]
                  description: |
                    "pass" — the UX implementation is correct, visually sound, and functional. Break the loop.
                    "fail" — there are issues that need to be fixed. Loop back to implement.
                issues:
                  type: array
                  items:
                    type: string
                  description: |
                    List of specific issues found. Each issue should be actionable and describe:
                    - What's wrong
                    - Where it is (page, element, viewport)
                    - What the fix should look like
                    Empty array when verdict is "pass".
                summary:
                  type: string
                  description: |
                    Overall assessment of the implementation. When passing, summarize what works well.
                    When failing, summarize the most critical problems.
          thread:
            mode: fork
            memo: true
            inject:
              role: user
              content: |
                ## UX Review — Audit Attempt {{iter.iteration + 1}}

                {{inputs.app_url != '' ? '**Application URL:** ' + inputs.app_url + '\n\nNavigate to the application URL and perform your review.' : 'No application URL was provided — review the code changes and any available preview.'}}

                Review the UX implementation. Your prior reviews (if any) are in this thread — use them to track progress across attempts.

                **Your job:**
                1. Navigate to the application and take screenshots
                2. Check the console for JavaScript errors
                3. Test core interactions (clicks, navigation, forms)
                4. Verify visual quality (alignment, spacing, consistency)
                5. Test responsive behavior if relevant
                6. Compare against the original request

                **Verdict guidance:**
                - **pass**: Implementation meets the requirements, looks correct, no functional issues.
                  Minor polish suggestions can be noted in the summary but should not block passing.
                - **fail**: Functional problems, visual bugs, JS errors, or the implementation doesn't
                  match what was requested. List specific issues so the implementer can fix them.

                **Your issues list is the primary bridge to the next attempt.**
                Be specific and actionable — the implementer will see your issues and summary.
          save_message:
            role: assistant
            content: |
              ## UX Review (Attempt {{iter.iteration + 1}}): {{has(output.response) && output.response != null ? output.response.verdict : 'N/A'}}
              {{has(output.response) && output.response != null ? output.response.summary : ''}}

      edges:
        - from: implement
          default: [review]

  - id: complete
    type: save_message
    args:
      role: assistant
      content: |
        ## UX Review Complete

        **Iterations:** {{nodes.attempt._iterations}}
        **Final verdict:** {{nodes.attempt.review_verdict}}

        {{nodes.attempt.review_summary}}

outputs:
  verdict: "{{nodes.attempt.review_verdict}}"
  issues: "{{nodes.attempt.review_issues}}"
  summary: "{{nodes.attempt.review_summary}}"
  iterations: "{{nodes.attempt._iterations}}"

edges:
  - from: attempt
    default: [complete]
