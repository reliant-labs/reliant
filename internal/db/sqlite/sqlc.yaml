version: "2"
sql:
  - engine: "sqlite"
    queries: "queries"
    schema: "../schema-minimal.sql"
    gen:
      go:
        package: "sqlitedb"
        out: "generated"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: false
        overrides:
          # Map SQLite types to Go types
          - db_type: "datetime"
            go_type: "time.Time"
          - db_type: "boolean"
            go_type: "bool"
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "sql.NullString"
          - db_type: "integer"
            nullable: true
            go_type:
              import: "database/sql"
              type: "sql.NullInt64"
          - db_type: "bigint"
            nullable: true
            go_type:
              import: "database/sql"
              type: "sql.NullInt64"
