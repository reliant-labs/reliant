  - id: managed-postgres-backups
    category: data
    title: Backups and point-in-time restore
    claim: >-
      A hosted database is built for continuous WAL archiving and a daily base
      backup to object storage, and restoring is a declaration:
      a new `ManagedDatabase` with `restore = {sourceDatabase, pointInTime}`
      boots from the source's backups replayed to that moment.
    availability: hosted
    use: >-
      `forge.ManagedDatabase { spec.restore = forge.DatabaseRestore {
      sourceDatabase = "db", pointInTime = "2026-11-10T14:05:00Z" } }`, then
      `forge env deploy <env>`.
    why: >-
      A restore applies once, at creation, and never overwrites the source, so a
      mistaken one cannot destroy the original; there is no restore button or
      command. Each database's archive is written by its own workload identity
      with access to its own stream only. Claimable (unclaimed) databases are
      not backed up, and a database reports that its backups are not active
      until the environment's backup store is ready: read deploy status to see
      whether yours are.
    evidence:
      - external: control-plane:internal/operators/manageddatabase/backup.go
      - external: control-plane:internal/operators/manageddatabase/backup_streams.go
      - external: control-plane:internal/operators/manageddatabase/backup_identity.go
      - external: control-plane:internal/operators/manageddatabase/backupgcs
      - external: control-plane:deploy/kcl/lib/mdb_backups.k
      - external: control-plane:deploy/kcl/lib/hosted_deploy.k
      - path: pkg/deploy/v1alpha1/manageddatabase_types.go
      - path: kcl/tiers/tiers_gen.k

