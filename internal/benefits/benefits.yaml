  - id: record-deploys
    category: ship
    title: Record deploys from existing CI
    claim: >-
      One `forge release record` step after the deploy job your pipeline
      already runs gives monitoring a deploy marker per release, in any repo
      and any language, with no deploy/kcl and nothing built or applied by
      forge.
    availability: forge
    use: >-
      Works in any repo, with no forge.yaml: list the workloads your pipeline
      deploys as `runtime: {type: external}` in the env's document
      (`deploy/envs/prod.yaml`, which `forge obs init` writes; it names the
      project), store a token with deploy:write, minted in the web app
      (Settings → API tokens), as `FORGE_CONTROL_PLANE_TOKEN`, then after the
      deploy step run `forge release record --env prod --version "$TAG"
      [--workload api --image ghcr.io/acme/api@sha256:…]` and `forge obs check
      prod --release "$TAG" --wait`. Easy, about 15 minutes: the env document
      2 min, CI secret 5 min, the step 5 min, a first run 3 min. Recipes for
      GitHub Actions, GitLab CI and Buildkite are in `forge skill load
      deploy/record`.
    why: >-
      The release is record-only: it may name no artifacts (a version and a
      commit), it is labelled "recorded by CI" in `forge obs changes` and the
      console, and the control plane refuses to bind one to an env forge itself
      deploys, so a record never poses as forge's own deploy. A retried CI step
      records once, and the same version with other digests is a conflict, not
      an overwrite. Not signed in, it records on this machine's ledger.
    scope: any
    adopt: 'List your deployed workloads as `runtime: {type: external}` in deploy/envs/prod.yaml (from `forge obs init prod`), then after your deploy job run `forge release record --env prod --version "$TAG" --workload api --image <ref>@sha256:…` with `FORGE_CONTROL_PLANE_TOKEN` set.'
    estimate: "~15 min"
    evidence:
