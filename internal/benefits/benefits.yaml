      - id: forge-graph-unreachable
        lane: --graph
        bug_class: >-
          A component or provider no root reaches: no process constructs it
      - id: forge-graph-audience
        lane: --graph
        bug_class: >-
          A listener serving a service through a chain authenticated by another
