  - id: release-health-gate
    category: ship
    title: Prod gated on staging's verdict
    claim: >-
      A declared `HealthGate` makes the control plane refuse a prod promote
      until staging holds a PASS for that release, inside the promotion's
      transaction, with an audited override for incidents.
    availability: hosted
    use: >-
      `delivery_policy = forge.DeliveryPolicy { health_gate = forge.HealthGate {
      after = ["staging"] } }`
    why: >-
      Enforced by a control plane that advertises `shape-health-gate`; recorded
      only on a self-hosted env. The refusals are distinct:
      `health_gate_pending` (exit 4, the window is still open),
      `health_gate_unproven` (exit 4) and `health_gate_regressed` (exit 1). A
      release prod already ran with a PASS is admitted without staging, so a
      rollback needs no detour, and the incident override
      `--override-health-gate "<why>"` is recorded with who, why and what
      staging showed.
    evidence:
      - library: pkg/releasehealth
      - skill: deploy/delivery-policy

  - id: preview-environments
