  - id: lint-rules-data-integrity
    category: guardrails
    title: Data-integrity rules
    claim: >-
      A column nothing writes, a filter that no-ops or a CHECK drifting from Go
      fails lint instead of shipping silent wrong data.
    availability: forge
    evidence:
      - path: internal/cli/lint/lint_rules.go
    rules:
      - id: forgeconv-read-only-field-unwritten
        lane: --read-only-fields
        bug_class: >-
          A `forge:read-only` column nothing populates ships as the type's zero
          (a `$0.00` total) with no error anywhere; no constraint, test or log
          catches it
      - id: forgeconv-computed-field-unwritten
        lane: --computed-fields
        bug_class: >-
          Same silent zero for a `forge:computed` field no non-generated Go file
          assigns; the consequence text is derived from the field's type
      - id: forgeconv-guarded-field-written
        lane: --guarded-fields
        bug_class: >-
          A scaffolded edit page whose `update_mask` still names a
          `forge:guards` column writes it raw and bypasses the rpc that owns it
      - id: forgeconv-create-request-nullability
        lane: --create-nullability
        bug_class: >-
          An entity field and its `Create<Entity>Request` field disagree on
          `optional`, silently dropping write presence
      - id: forgeconv-list-filter-optional
        lane: --conventions
        bug_class: >-
          A List filter without `optional` has no presence, so "no filter"
          collapses into "filter by zero" and generated filters no-op
      - id: forgeconv-crud-owner-resolver
        lane: --conventions
        bug_class: >-
          An owner-scoping wrapper takes its owner from a different principal
          than its siblings (a `tenant_id` column scoped by a user id):
          compiles, runs, returns nothing or someone else's rows
      - id: forge-column-markers
        lane: --column-markers
        bug_class: >-
          A misspelled or misplaced `forge:` marker in a `COMMENT ON` statement
          does nothing and postgres stores it verbatim (`forge:immutible`)
      - id: forge-identity-subject-unreadable
        lane: --column-markers
        bug_class: >-
          A `forge:identity-subject` column the read-only role cannot read, so
          the console never draws the identity link
      - id: forge-closed-set
        lane: --closed-sets
        bug_class: >-
          A CHECK whose value list drifts from the Go set it mirrors: a value Go
          grants and the CHECK refuses fails every write of it; the finding
          carries the forward migration
      - id: forge-db-grants-undecided
        lane: --db-grants
        bug_class: >-
          A credential-shaped column (`token`, `password`, `key`, `hash`) that
          nobody decided is readable by the read-only `forge_ro` role
      - id: forge-db-grants-unverified
        lane: --db-grants
        bug_class: >-
          A credential-shaped column (`token`, `password`, `key`, `hash`) that
          nobody decided is readable by the read-only `forge_ro` role
      - id: forge-fixture-rejected
        lane: --fixture-drift
        bug_class: >-
          A scaffolded CRUD test fixture the current schema rejects (a GENERATED
          column, a UNIQUE clash, a dangling FK, a later CHECK), found by
          running each statement in a rolled-back transaction
      - id: forge-fixture-unverified
        lane: --fixture-drift
        bug_class: >-
          A scaffolded CRUD test fixture the current schema rejects (a GENERATED
          column, a UNIQUE clash, a dangling FK, a later CHECK), found by
          running each statement in a rolled-back transaction
      - id: forge-time-bucket-session-tz
        lane: --time-bucketing
        bug_class: >-
          A two-argument `date_trunc` over a `TIMESTAMPTZ` truncates in the
          session timezone, so every daily total moves with the deploy host
      - id: forgeconv-bun-dollar-placeholder
        lane: --conventions
        bug_class: >-
          `$1`-style placeholders ported into bun-formatted SQL, which bun does
          not bind, so the statement fails at runtime
      - id: forgeconv-bun-literal-question-mark
        lane: --conventions
        bug_class: >-
          A literal `?` in bun-formatted SQL, which bun consumes as a
          placeholder, so the statement runs against shifted arguments
      - id: forgeconv-product-event-pii
        lane: --conventions
        bug_class: >-
          A product event property named for personal data (`email`, `name`,
          `ip`, `url`, `path`, `token`), stored per event for months and
          joined to a user
      - id: forgeconv-tx-lock-under-serializable
        lane: --conventions
        bug_class: >-
          A `SELECT … FOR UPDATE` or advisory lock inside a SERIALIZABLE or
          REPEATABLE READ transaction: the snapshot predates the wait, so each
          contended wait costs a full rollback or drops the update
      - id: forgeconv-service-dir-consistency
        lane: --conventions
        bug_class: >-
          A proto service name that disagrees with its `proto/services/`
          directory, so scaffolds and handler directories land where nothing
          expects them

  - id: lint-rules-composition-deps
    category: guardrails
    title: Architecture stays testable
    claim: >-
      Lint keeps Deps interface-typed and narrow, every component reachable and
