  - id: svcerr-redaction
    category: security
    title: Errors never leak internals
    claim: >-
      A handler returns `svcerr.Wrap(err)` and the caller gets a classified
      Connect code while a driver's SQL, a DSN or an internal host stays in the
      server's log, and the fault class (server, user, canceled) sets the log
      level.
    availability: forge
    headline: true
    use: >-
      `return nil, svcerr.Wrap(err)` from every rpc (`svcerr.WithReason`,
      `svcerr.WithClass`); `forge fix connect-errors` rewrites hand-built
      Connect errors.
    why: >-
      `svcerr.Classify` sets each record's `error_class` (`server`, `user`,
      `canceled`), so ERROR means "we must act" and alerts, forwarders and
      post-deploy checks can trust it.
    scope: any
    adopt: "In a Go Connect service, `go get github.com/reliant-labs/forge`, add `svcerr.Interceptor()` and return `svcerr.Wrap(err)` from handlers."
    estimate: "~30 min"
    evidence:
      - library: pkg/svcerr
      - command: fix connect-errors
      - analyzer: --conventions
      - path: pkg/svcerr/interceptor.go
      - skill: observability

