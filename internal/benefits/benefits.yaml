      A lint rule new in a forge release warns, with a "new in vX; gates from
      vY" note, and gates only from the next release, so bumping the forge pin
      never turns your build red overnight.
    availability: forge
    why: >-
      Every gradable rule has an `IntroducedIn` and a `GatesFrom` row in the
      rollout table, and `TestEveryGradableRuleDeclaresItsRollout` fails a rule
