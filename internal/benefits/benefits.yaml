    why: >-
      The instance is an ordinary env, so every env verb works on it, and its
      name depends only on the PR or branch, so the job that creates it and the
      job that deletes it agree with no shared state. Its expiry is recorded in
      the release shape (a control plane that advertises `shape-preview`
      deletes an expired hosted instance) and stamped on its namespaces, so
      `forge env gc` finds an expired preview on a cluster you operate from the
      cluster alone. `create` refuses an instance that would deploy into the
      template env's own namespace.
    evidence:
      - command: env preview create
      - command: env gc
      - skill: deploy/preview
      - library: pkg/release

