  - id: edge-telemetry
    category: run
    title: Every request traced and measured
    claim: >-
      Each RPC is one span, one metric sample and one log record at the edge
      with a W3C trace and request id, and every component call and ORM query is
      a child span — no hand-written tracing.
    availability: forge
    use: >-
      Nothing to do; opt a package out with `// forge:no-observe`, read it with
      `forge obs trace`.
    why: >-
      The RPC interceptor chain (`serverkit.NewChain`) records the span, the
      metric sample and the log record for every call. A package whose
