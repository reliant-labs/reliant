# The registry of every benefit forge gives a project — the one source of
# docs/benefits.md and the README's "Everything included" table (and the
# landing page, which snapshots this file). Edit it, then run
# `task docs:benefits`.
#
# Schema (internal/benefits/benefits.go is authoritative; Validate enforces it):
#
#   categories[]  id, title, intro           ordered; rendering follows it
#   benefits[]    id                         kebab-case, unique; the docs anchor
#                 category                   a categories[].id
#                 title                      <= 6 words (a README table cell)
#                 claim                      one sentence, user benefit first, true today
#                 status                     enforced (default) | recorded | in-progress
#                 availability               forge | hosted | reliant
#                 headline                   in the README table; never when in-progress
#                 use, why, docs             optional; use/why are markdown, docs an https URL
#                 scope                      forge-project (default) | any: works in any repo,
#                                            any language, with no forge.yaml; never in-progress
#                 adopt                      scope: any only (required): the one-line entry
#                                            recipe for a repo that is not a forge project
#                 estimate                   scope: any only (required): agent time to first
#                                            value, "~<n> <min|hour|day>" ("~10 min", "~1-2 hours")
#                 Every scope: any claim is checked by hand in a scratch repo with no
#                 forge.yaml before it lands; `forge project benefits` and the MCP
#                 `benefits` tool offer exactly these entries outside a forge project.
#                 evidence[]                 >= 1, each item exactly ONE of:
#                   command:  <cobra path under `forge`> [--flag]
#                   analyzer: --<forge lint flag>
#                   marker:   forge:<name>          (a markerSpecs() name)
#                   skill:    <embedded skill path>
#                   library:  pkg/<name>
#                   path:     <file or dir in this repo>
#                   external: <control-plane|reliant|landing-page>:<path>
#                 rules[]                    lint families: {id, lane, bug_class}; lane is
#                                            the `forge lint` flag that runs the rule
#                                            alone, or "" when only a bare `forge lint` does
#
# internal/cli's TestBenefitsEvidenceExists resolves every evidence item
# against the binary and this repo; TestEveryGradableRuleIsABenefit holds the
# rules lists equal to the rules `lint.rules` can grade.

categories:
  - id: build
    title: Build
    intro: >-
      Services, workers, jobs, operators, CLIs and frontends, scaffolded from a
      proto and a migration. What forge writes on the first commit is what runs
      in production, configured differently, and everything it scaffolds is
      yours to edit.
  - id: data
    title: Data
    intro: >-
      SQL is the schema language: the applied migrations are the single source
      of truth, and the entities, ORM, stores and CRUD are projections of them,
      so there is one declaration of every table. Forge checks each migration
      against what a running release and a populated table can survive before it
      ships.
  - id: test
    title: Test
    intro: >-
      Three test tiers with the subject real at every tier: generated mocks for
      unit tests, a real Postgres for integration tests and a running stack for
      end-to-end tests. Slow tests say so, so the fast tier stays fast.
  - id: dev
    title: Dev
    intro: >-
      One command brings up the whole stack on your machine, under hot reload,
      with every log in one directory. Each git worktree gets a stack of its
      own, so parallel agents never share a port or a database.
  - id: guardrails
    title: Guardrails
    intro: >-
      `forge lint` is one report-only gate over forge's own analyzers and the
      standard linters, with one verdict: it writes nothing unless `--fix`, and
      every fixer's rewrite is type-checked and taken back if it breaks its
      package. Each forge rule names the bug class it prevents, and the
      lint-family entries below list every rule `lint.rules` can grade with the
      flag that runs it alone; every lane except the opt-in ones also runs in a
      bare `forge lint`. A rule new in a release warns before it gates. Related
      checks outside `forge lint`: `forge doctor`, `forge ci verify-generated`,
      `forge ci test-budget`, `forge ci vuln-scan` and `forge ci validate-kcl`.
  - id: security
    title: Security
    intro: >-
      Production-grade defaults on the first commit: auth that fails closed,
      errors that never leak internals, secrets that never sit in a `.env` file,
      and scanned dependencies. Authentication is a middleware: an interceptor
      validates the credential and puts the claims on the context. Forge
      authenticates; it does not authorize, and says so: what a caller may do is
      the handler's logic.
  - id: ship
    title: Ship
    intro: >-
      Any number of environments, each declared as a directory of KCL. A release
      is built once, recorded as an immutable, content-addressed set of
      artifacts and promoted between environments by that record, so what ran in
      staging is what runs in prod. This is the part of Forge that most reduces
      deploy-day toil.
  - id: host
    title: Host
    intro: >-
      Optional Reliant hosting runs what forge builds: services, workers and
      jobs, managed Postgres, static sites behind a CDN and custom domains, with
      no cluster of your own. Rebinding an environment to a cluster you run is a
      one-line change.
  - id: run
    title: Run
    intro: >-
      Logs, traces and metrics on every boundary from day 0, the same signals
      locally and in production, and a post-deploy check that proves a release
      good from its telemetry. The signals are OpenTelemetry and the app never
      learns the backend: it reads the standard `OTEL_*` variables.
  - id: agents
    title: Agents
    intro: >-
      Forge is built to make an LLM agent effective in a project, and several
      features exist only for that: its whole surface prints from the binary,
      its skills ship inside it and match the version in use, and a defect in
      forge is one command to report. When a skill and the binary disagree, the
      binary is right.

benefits:
  - id: entity-from-one-marker
    category: build
    title: One marker, a whole entity
    claim: >-
      Mark a proto message `// forge:entity` and one `forge scaffold` writes the
      create-table migration, the CRUD rpcs, the managed fields, the ORM
      projection, a lifecycle test, the list, detail, create and edit pages, nav
      and mock data.
    availability: forge
    headline: true
    use: "`// forge:entity` above `message X`, then `forge scaffold`."
    evidence:
      - marker: forge:entity
      - command: scaffold
      - skill: db/birth
      - command: scaffold entity
      - skill: db

  - id: proto-to-everything
    category: build
    title: Proto in, full stack out
    claim: >-
      One proto definition generates Connect handlers, CRUD wiring, typed
      frontend hooks and tests, so API, server and UI cannot disagree.
    availability: forge
    headline: true
    use: >-
      Declare the rpc in the proto, then `forge scaffold rpc <svc> <Name>` and
      `forge generate`.
    why: >-
      An rpc's logic is a `*Service` method in
      `internal/handlers/<svc>/rpc_<name>.go`; the scaffolded method is
      correctly signed and comes with a self-destructing test row, so nothing is
      hand-written to the stub.
    evidence:
      - command: generate
      - library: pkg/crud
      - library: pkg/mountkit

  - id: scaffold-verbs
    category: build
    title: Scaffold every shape
    claim: >-
      `forge scaffold` births services, rpcs, entities, workers, operators,
      CRDs, adapters, webhooks, packages, binaries and frontends in the
      project's conventions, and is a no-op when nothing is missing.
    availability: forge
    why: >-
      Service (Connect RPC on the server), worker (in the server's lifecycle),
      binary (its own `cmd/<bin>` and Deployment) and operator
      (controller-runtime with CRDs) each have a scaffold and a decision table
      in the `binaries` and `services` skills.
    evidence:
      - command: scaffold service
      - command: scaffold rpc
      - command: scaffold entity
      - command: scaffold worker
      - command: scaffold operator
      - command: scaffold webhook
      - command: scaffold adapter
      - command: scaffold frontend

  - id: owned-seams-disown
    category: build
    title: Every generated file has an exit
    claim: >-
      Generated code sits beside owned seams you edit freely, and `forge project
      disown` permanently hands any generated file to you.
    availability: forge
    evidence:
      - command: project disown
      - command: project rescaffold
      - command: project scaffolded

  - id: scaffold-exclude
    category: build
    title: Areas forge never writes
    claim: >-
      `scaffold.exclude` in forge.yaml names the parts of an existing repo forge
      must never write, and every generate, scaffold, upgrade and rescaffold
      leaves them exactly as they are and says which writes it skipped.
    availability: forge
    use: >-
      `scaffold: {exclude: [frontends/web/, .github/workflows/deploy.yml]}`.
    why: >-
      A team adopting forge keeps its own frontend, workflows or docs without
      disowning file by file. A locked run puts back anything written under an
      excluded glob, and a glob over generated code other generated code
      imports is refused with the dependent named.
    evidence:
      - skill: forge/migration/ownership
      - path: internal/checksums/exclude.go
      - path: internal/cli/generate_exclude.go

  - id: prune-orphans
    category: build
    title: Clean up after a feature
    claim: >-
      When a feature is pinned off, `forge generate` lists the files it left
      behind and `forge project prune --orphans` deletes the ones still exactly
      as forge wrote them, never an edited one.
    availability: forge
    evidence:
      - command: project prune
      - skill: forge/migration/ownership
      - path: internal/cli/generate_orphans.go

  - id: project-upgrade
    category: build
    title: Guided forge upgrades
    claim: >-
      `forge project upgrade` moves a project to a newer forge and applies every
      mechanical fix for the version range, and `forge project upgrade
      list|apply` tracks the one-time playbooks for the rest.
    availability: forge
    evidence:
      - command: project upgrade
      - command: project upgrade list
      - command: project upgrade apply

  - id: adopt-existing-project
    category: build
    title: Adopt an existing app
    claim: >-
      An app that already exists, in any language, keeps its code: one command,
      `forge project new --in-place --kind app`, reads its Dockerfile(s) and
      compose file (ports, Postgres, migration command, credentials) and writes
      only `forge.yaml` and `deploy/kcl/` (dev, staging and prod envs with a
      managed Postgres and a pre-rollout migration job), printing what it
      detected and what it assumed (`--dry-run` prints the files instead).
      `--claimable` sizes prod for a deploy with no account. Then work in tiers
      you can stop after (ship it, see it with OpenTelemetry, harden it with
      gated promotion and CI, and move pieces onto forge's Go stack only when
      that pays). `forge project new --in-place` and
      `forge project migrate import` bring an existing Go repository onto forge
      without a rewrite, with migration skills for service, CLI and library
      projects.
    availability: forge
    scope: any
    adopt: "In the app's directory, `forge project new --in-place --kind app --dry-run` prints what it would write from the Dockerfile and compose file; without `--dry-run` it writes forge.yaml and deploy/kcl and touches none of the app's files."
    estimate: "~1 hour"
    evidence:
      - command: project new
      - path: internal/cli/new_app.go
      - path: internal/cli/new_app_detect.go
      - path: internal/generator/app.go
      - path: internal/cli/new_app_test.go
      - command: project migrate import
      - skill: adopt
      - skill: migration
      - skill: migration-service
      - skill: migration-cli
      - skill: migration-upgrade

  - id: adopt-frontend
    category: build
    title: Adopt any Vite or Next app
    claim: >-
      An existing Vite or Next.js app moves under `frontends/` (or is named by a
      KCL path) and forge generates into it with one writer per `src/gen`, with
      an opt-in pnpm workspace for sharing code between web and mobile.
    availability: forge
    evidence:
      - skill: frontend-workspaces
      - command: project new
      - skill: frontend/adopt

  - id: rest-openapi
    category: build
    title: REST and OpenAPI, free
    claim: >-
      `api.openapi: true` emits OpenAPI 3 from the proto in the buf pipeline and
      `connectrpc.com/vanguard` transcodes REST URLs onto the same Connect
      handlers at runtime, with no parallel codegen.
    availability: forge
    evidence:
      - skill: api-openapi
      - skill: api-rest
      - command: api curl
      - skill: api/http

  - id: bring-openapi-spec
    category: build
    title: Bring your OpenAPI spec
    claim: >-
      An API whose contract is an OpenAPI 3 document is declared as a
      `forge.API`, checked as OpenAPI 3 whenever the env loads (a Swagger 2
      document is refused with how to convert it) and listed with the project's
      databases in `forge project audit --json`; nothing is generated from it
      yet.
    availability: forge
    headline: false
    use: >-
      `apis = [forge.API {name = "billing", kind = "openapi", spec =
      "api/openapi.yaml"}]` in `deploy/kcl/<env>/main.k`; read
      `.categories.resources.details.apis` of `forge project audit --json`.
    why: >-
      Declaring each API by its contract records which APIs a project serves
      and where their specs live, so a later feature reads one declaration
      instead of guessing; a Swagger 2 spec is caught the day it is declared.
    scope: any
    adopt: 'Add `apis = [forge.API {name = "api", kind = "openapi", spec = "openapi.yaml"}]` to a `forge.Bundle` in `deploy/kcl/<env>/main.k`, then read `.categories.resources` of `forge project audit --json`.'
    estimate: "~10 min"
    evidence:
      - path: internal/cli/api_declarations.go
      - command: project audit
      - skill: api-openapi

  - id: service-catalog
    category: build
    title: Browsable API inventory
    claim: >-
      `forge generate` writes `gen/forge_service_catalog.json`
      (`forge.dev/service-catalog/v1`): processes, the proto services each
      serves, methods with auth and idempotency, and components with source
      locations, with no server needed.
    availability: forge
    evidence:
      - library: pkg/servicecatalog
      - path: docs/service-catalog.md

  - id: lib-validate
    category: build
    title: Request validation at the edge
    claim: >-
      `buf.validate` rules in the proto are enforced on every rpc by an
      interceptor, so request validation is declared once, beside the field.
    availability: forge
    evidence:
      - library: pkg/validate

  - id: lib-config
    category: build
    title: Typed config from proto
    claim: >-
      Configuration is a proto message projected into KCL and into a typed Go
      struct, so no component parses its own environment.
    availability: forge
    evidence:
      - library: pkg/config

  - id: web-runtime
    category: build
    title: Frontend runtime twin of forge/pkg
    claim: >-
      `@reliantlabs/forge-web-runtime` gives a frontend typed errors with a
      total `.reason` vocabulary, auth and always-on `traceparent` interceptors,
      the app shell and a `<Resource>` table with loading, error, empty and data
      states and cursor pagination.
    availability: forge
    evidence:
      - path: web-runtime
      - skill: frontend-runtime
      - skill: frontend-runtime/transport
      - skill: frontend-runtime/resource

  - id: frontend-runtime-config
    category: build
    title: One bundle, every env
    claim: >-
      Frontend config is a typed `config_gen.ts` read at runtime from a per-env
      `config.js`, so one bundle promotes unchanged, a key not in the schema
      gets a did-you-mean, and build-time env inlining is a lint error.
    availability: forge
    use: >-
      Read config through the generated `config_gen.ts`; the platform writes
      `<basePath>/config.js` per env.
    evidence:
      - analyzer: --conventions
      - skill: frontend/runtime-config
      - skill: frontend-runtime/config

  - id: workers-lifecycle
    category: build
    title: Workers with graceful drain
    claim: >-
      `forge scaffold worker` writes a supervised component sharing the server's
      typed Deps and graceful shutdown, with a lifecycle test.
    availability: forge
    evidence:
      - command: scaffold worker
      - library: pkg/lifecyclekit

  - id: lib-cron-lease
    category: build
    title: Coordinated cron and singletons
    claim: >-
      `pkg/cronkit` runs each scheduled tick at most once across replicas that
      share its claim store (a missed tick is not retried), with the same
      scheduled time on every replica, and `pkg/lease` gives a named singleton
      over Postgres advisory locks with hot standby.
    availability: forge
    use: '`forge scaffold worker <name> --kind cron --schedule "*/5 * * * *"`'
    why: >-
      It removes the "the nightly job ran three times" bug: every replica sees
      the same scheduled time (`cronkit.TickTime`).
    evidence:
      - library: pkg/cronkit
      - library: pkg/lease
      - skill: workers

  - id: operators-crds
    category: build
    title: Operators and CRDs scaffolded
    claim: >-
      `forge scaffold operator` and `forge scaffold crd` give a reconciler with
      `pkg/controller` runtime helpers, and a StatefulSet whose declared volume
      grew is converged by a pre-rollout resize job.
    availability: forge
    evidence:
      - command: scaffold operator
      - library: pkg/controller
      - library: pkg/appkit
      - library: pkg/stsresize
      - library: pkg/cmdkit
      - command: scaffold crd
      - skill: binaries
      - skill: deploy/statefulset-volumes

  - id: cli-library-kinds
    category: build
    title: CLIs and libraries too
    claim: >-
      `forge project new --kind cli` gives a cobra binary on `pkg/cmdkit` with
      per-binary typed config loadable from a file, and `--kind library` gives a
      Go module with no server.
    availability: forge
    evidence:
      - command: project new
      - library: pkg/cmdkit
      - skill: binaries
      - skill: binaries/config-files
      - skill: binaries/subtrees

  - id: adapters
    category: build
    title: Vendor-neutral outbound adapters
    claim: >-
      `forge scaffold adapter` writes one narrow boundary per third-party
      system, and lint keeps it outbound-only.
    availability: forge
    evidence:
      - command: scaffold adapter
      - analyzer: --contract

  - id: mobile-expo
    category: build
    title: Mobile apps with Expo
    claim: >-
      `forge scaffold frontend --kind mobile` produces an Expo React Native app
      on the same generated Connect hooks, with an optional `ui-native`
      workspace package.
    availability: forge
    why: >-
      The app gets `app/` screens and `app:background` / `app:foreground`
      events.
    evidence:
      - command: scaffold frontend
      - skill: ui-native-package

  - id: lib-money
    category: build
    title: Correct money type
    claim: >-
      `forge/pkg/money` represents amounts as integer minor units plus currency,
      so no float rounding ever touches a price.
    availability: forge
    evidence:
      - library: pkg/money

  - id: lib-approval
    category: build
    title: Human approval queue
    claim: >-
      `pkg/approval` holds items an agent proposed until a person approves or
      rejects them, expires the undecided at their deadline and hands each
      decided item to the app's follow-up exactly once.
    availability: forge
    evidence:
      - library: pkg/approval

  - id: sql-first-schema
    category: data
    title: SQL migrations are the schema
    claim: >-
      You write plain SQL migrations; forge applies them to a real ephemeral
      Postgres and projects the entity structs, typed ORM, per-entity stores and
      CRUD wiring from the result, so the code cannot disagree with the
      database.
    availability: forge
    headline: true
    use: >-
      `forge generate`; `COMMENT ON TABLE t IS 'forge:no-entity'` opts a table
      out.
    why: >-
      Forge runs `db/migrations/*.up.sql` in order against a real ephemeral
      Postgres and generates from the result.
    evidence:
      - library: pkg/schemadef
      - library: pkg/orm
      - command: db introspect
      - skill: db/generated-orm
      - skill: db/store
      - skill: db

  - id: orm-opt-out
    category: data
    title: Keep your own data layer
    claim: >-
      A project with a hand-written repository layer keeps forge's migrations
      and codegen without the generated ORM, by pinning `features: {orm: false}`
      in forge.yaml or marking the package `//forge:no-orm`.
    availability: forge
    evidence:
      - marker: forge:no-orm
      - command: project features
      - skill: db/orm-and-safety

  - id: migration-safety
    category: data
    title: Migration safety checks
    claim: >-
      Every migration declares whether the previous release survives it, and
      `forge lint --migration-safety` refuses an unsafe column add, a statement
      that cannot run in a transaction, a colliding version or an undeclared
      rollback break before it ships.
    availability: forge
    headline: true
    use: >-
      Start each migration with `-- forge:backward-compatible — <why>` or `--
      forge:breaks-rollback <why>`; run `forge lint --migration-safety`, or
      `forge ci migration-safety` in CI. A pragma in the migration file
      suppresses one rule beside the SQL it is about.
    why: >-
      A migration that a populated table or the previous release cannot survive
      passes every test on a fresh database and fails on the first real one.
    scope: any
    adopt: "Run `forge lint --migration-safety` at the repo root; it reads `db/migrations/*.up.sql` only and flags each `.down.sql`, so scope it to new files with `--scope`."
    estimate: "~5 min"
    evidence:
      - command: lint --migration-safety
      - command: ci migration-safety
      - analyzer: --migration-safety
      - path: internal/linter/migrationlint
      - skill: db
      - path: internal/linter/migrationlint/compat_declaration.go
      - path: internal/linter/migrationlint/add_column.go
      - path: internal/linter/migrationlint/transaction_block.go
      - path: internal/cli/lint/lint_rules.go
    rules:
      - id: no-down-migration
        lane: --migration-safety
        bug_class: >-
          A down migration claims to undo a release and cannot: by the time
          anyone would run it, rows are in the new shape and other services have
          read them
      - id: duplicate-migration-version
        lane: --migration-safety
        bug_class: >-
          Two files claiming one version, so whichever reached a shared database
          first leaves the other permanently unapplied
      - id: non-timestamp-migration-version
        lane: --migration-safety
        bug_class: >-
          Sequential numbering makes parallel branches collide; a UTC timestamp
          cannot without two allocations in one second
      - id: migration-version-below-merged-head
        lane: --migration-safety
        bug_class: >-
          A new migration numbered at or below the default branch's head is
          invisible: every already-migrated database never runs it
      - id: destructive-change
        lane: --migration-safety
        bug_class: >-
          A `DROP`/`TRUNCATE`-class statement; split it into data-preserving
          steps or allow it by `forge:allow-destructive`
      - id: unsafe-add-not-null-column
        lane: --migration-safety
        bug_class: >-
          `ADD COLUMN … NOT NULL` without a default fails on a populated table
      - id: set-not-null-without-backfill
        lane: --migration-safety
        bug_class: >-
          `SET NOT NULL` with no earlier backfill fails on a populated table
      - id: volatile-default
        lane: --migration-safety
        bug_class: >-
          A volatile `DEFAULT` in `ADD COLUMN` can rewrite and lock a populated
          table
      - id: non-transactional-statement
        lane: --migration-safety
        bug_class: >-
          `CREATE INDEX CONCURRENTLY` and kin cannot run in a transaction block;
          the statement must be alone in its file
      - id: enum-value-used-before-commit
        lane: --migration-safety
        bug_class: >-
          Using an enum value the same file adds fails with SQLSTATE 55P04
      - id: invalid-adopts-directive
        lane: --migration-safety
        bug_class: >-
          A `-- forge:adopts` baseline declaration the migrator would refuse at
          boot on every database
      - id: migration-compat-conflict
        lane: --migration-safety
        bug_class: >-
          A migration that declares both `forge:backward-compatible` and
          `forge:breaks-rollback`
      - id: migration-compat-reason
        lane: --migration-safety
        bug_class: >-
          A compatibility declaration with no reason, so the rollback decision
          that reads it has nothing to go on
      - id: migration-compat-undeclared
        lane: --migration-safety
        bug_class: >-
          A migration that says neither `forge:backward-compatible` nor
          `forge:breaks-rollback`, which a rollback decision and the release
          guard read

  - id: migration-analysis
    category: data
    title: Measured migration locks and rewrites
    claim: >-
      `forge db analyze` runs each pending migration statement by statement,
      file by file as forge's migrator applies them, on a disposable copy of a
      real Postgres database (an embedded one, or a snapshot you name and mark,
      such as an anonymized production snapshot, which is only read and
      copied), and reports the locks it took, the tables it rewrote or
      scanned, and how long it ran.
    availability: forge
    headline: false
    use: >-
      Run `forge db analyze` (an embedded Postgres migrated to the merge-base),
      or point it at an anonymized snapshot with `database.analyze.target` and
      `--target dsn`; `--json` is the document a reviewer reads.
    why: >-
      Whether `ALTER COLUMN … TYPE` rewrites a table or a constraint scans one
      depends on the column types, the existing schema and the Postgres
      version, which no reading of the SQL text can know.
    scope: any
    adopt: "Run `forge db analyze` in a project whose migrations forge's migrator applies; it needs no database of yours."
    estimate: "~5 min"
    evidence:
      - command: db analyze
      - path: pkg/dbanalyze
      - path: internal/cli/db_analyze.go
      - skill: db/analyze
    rules:
      - id: db-analyze-table-rewrite
        lane: "forge db analyze"
        bug_class: >-
          A migration that copies every row of a populated table under ACCESS
          EXCLUSIVE, an outage as long as the copy
      - id: db-analyze-access-exclusive-lock
        lane: "forge db analyze"
        bug_class: >-
          ACCESS EXCLUSIVE held across a full scan or rewrite, blocking every
          read and write of the table for its duration
      - id: db-analyze-validation-scan
        lane: "forge db analyze"
        bug_class: >-
          A constraint validated by a full scan under a lock that blocks writes,
          where NOT VALID then VALIDATE would not block them
      - id: db-analyze-blocking-index-build
        lane: "forge db analyze"
        bug_class: >-
          An index built without CONCURRENTLY on a populated table, blocking
          writes until the build finishes
      - id: db-analyze-statement-timeout
        lane: "forge db analyze"
        bug_class: >-
          A statement that does not finish within statement_timeout on
          production-shaped data

