      - id: forgeconv-deps-no-downcast
        lane: --conventions
        bug_class: >-
          A type assertion turning a Deps field back into a concrete type
      - id: forgeconv-no-getenv
        lane: --conventions
        bug_class: >-
          A component reading the process environment itself instead of its
