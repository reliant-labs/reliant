    availability: forge
    evidence:
      - path: internal/cli/lint/lint_rules.go
    rules:
      - id: forgeconv-internal-package-contract-names
        lane: --contract
        bug_class: >-
          A non-canonical `contract.go` (`Service`, `Deps`, `New(Deps)
