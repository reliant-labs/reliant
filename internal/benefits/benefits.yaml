      the env's ledger lives so no client can skip it.
    availability: forge
    use: >-
      `delivery_policy = forge.DeliveryPolicy { required_gates =
      forge.RequiredGates { names = ["e2e"] }, approval_hook =
      forge.ApprovalHook { url = "https://approvals.example.com/forge" } }`,
      then `forge env deploy prod <v> --gate name=e2e,status=passed`
    why: >-
      A control plane that advertises `enforces-promotion-checks` judges both at
      promote; for an env without one, forge judges them before its own write
      and runs an `argv` hook with no shell. The refusals are distinct:
      `required_gate_missing` (exit 4), `required_gate_failed` (exit 1),
      `approval_denied` (exit 4; a hook that times out or fails denies) and
      `approval_pending` (exit 4, retry once approved). `--yes` never answers
      for the hook, and each verdict is recorded on the promotion. `audit`
      records what `enforce` would refuse.
    evidence:
      - skill: deploy/delivery-policy
      - path: internal/cli/promote_policy_checks.go
      - path: pkg/release/promotion_checks.go

