      dials the frontend typecheck.
    why: >-
      `lint.rules` in `forge.yaml` grades every forge rule `error`, `warn` or
      `off` identically in every output mode. Never pipe `forge lint` through
      `head`: the verdict is the last line.
    scope: any
    adopt: "Run `forge lint --quiet` at the repo root; lanes that need a Go module or a forge project skip and say why."
    estimate: "~10 min"
    evidence:
      - command: lint
      - command: lint --scope
      - path: internal/cli/lint

  - id: local-ci-gate
    category: guardrails
    title: The whole CI gate, locally
    claim: >-
      `forge ci gate` (`task ci`) runs verify-generated, lint, buf, migration
      safety, frontend checks, build, vulnerability and license scans, KCL
      validation, tests and integration tests in one table, and a skipped check
      fails the gate.
    availability: forge
    headline: true
    use: >-
      `task ci`; `CI_SKIP=<check>` accepts a named skip, `CI_FULL=1` unit-tests
      every package.
    why: >-
      The CI workflow is a thin wrapper around the same tasks, so "CI did not
      run" never has to mean "unverified". `forge ci gate --list` names the
      checks, a `CI_SKIP` name that matches no check is an error, tools are
      pinned so a copy on PATH at another version is never used, verdicts are
      cached on an unchanged committed tree (`PASS (cached <sha>)`), and a
      branch unit-tests only the packages its change reaches.
    evidence:
      - command: ci gate
      - path: internal/cigate
      - command: ci run
      - command: ci summarize
      - command: gate record
