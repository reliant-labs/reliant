      output_per_1m: 15.0
      cached_input_per_1m: 0.25
    providers:
      - driver: codex
        api_model: gpt-5.5
        # The ChatGPT/Codex subscription backend serves GPT-5.x with a ~272k
        # context window, far below the OpenAI platform window declared above.
        # Context management (compaction trigger + trim backstop) derives from
        # this per-provider window so an @codex session compacts before it
        # overflows and 400s with context_length_exceeded.
        max_context_window: 272000
      - driver: openai
        api_model: gpt-5.5
      - driver: openrouter
        api_model: openai/gpt-5.5
    driver_settings:
      preferred_endpoint: responses
      temperature_mode: omit
      use_max_completion_tokens: true
    default_thinking_level: xhigh

  # GPT-5.6 family. These are Codex-subscription-only and use a different request
  # envelope than GPT-5.5 and earlier (system prompt and tools ride inside `input`
  # rather than as top-level `instructions`/`tools`). See the codex driver's
  # buildParams and .dev/codex/SOL_PROTOCOL_NOTES.md for the wire details.
  #
  # They add two reasoning efforts above xhigh: `max` and `ultra`. They also
  # return no reasoning summaries — only encrypted reasoning content — so there
  # is no visible thinking to stream for these models.
  - id: gpt-5.6-sol
    name: GPT-5.6 Sol
    tags: [powerful, reasoning]
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 272000
      max_output_tokens: 128000
      thinking_levels: [low, medium, high, xhigh, max, ultra]
      supported_file_types: [image, text]
    cost:
      input_per_1m: 2.5
      output_per_1m: 15.0
      cached_input_per_1m: 0.25
    providers:
      - driver: codex
        api_model: gpt-5.6-sol
    driver_settings:
      preferred_endpoint: responses
      temperature_mode: omit
      use_max_completion_tokens: true
    # Powerful tier: sol gets its top practical effort. `max`/`ultra` are
    # supported but reserved for explicit opt-in rather than the default.
    default_thinking_level: xhigh

  # Terra is the faster/cheaper member of the 5.6 family, but it is deliberately
  # NOT tagged `fast`: that tag routes @fast for the whole codex driver — chat
  # titling and compaction resolve it too — and it stays pointed at
  # gpt-5.3-codex-spark. Terra carries `moderate` instead, so it is picked on
  # cost/quality balance rather than by repointing a latency-critical path.
  - id: gpt-5.6-terra
