#        Codex with a ChatGPT account."}
#
# so the entry was unreachable by construction — every request it served failed.
# It carried `fast`, which made it TagFast's winner, so chat titling and
# compaction resolved to it for any codex user and 400'd on every call. Titling
# then fell back to a truncated first message, which looks like a working title,
# so the failure was invisible in the product.
#
# Do not re-add it without first confirming the backend serves it: probe
# POST https://chatgpt.com/backend-api/codex/responses with a real ChatGPT
# account token and read the response BODY, not just the status.

  - id: gpt-5.2-codex
    name: GPT-5.2 Codex
    tags: [flagship, reasoning]
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 400000
      max_output_tokens: 128000
