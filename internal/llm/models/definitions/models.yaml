  # GPT-6 Astra is OpenAI's frontier model. It uses the SAME request envelope as
  # the GPT-5.6 family below (tools and system prompt ride inside `input`), plus
  # two additions the 5.6 capture does not have: a `service_tier: priority` body
  # field and an `x-codex-routing-hint` header. Ground truth for both is
  # .dev/codex/astra.txt + astra.curl (codex-tui 0.153.4).
  #
  # Unlike sol/terra, astra tops out at `max` — it has no `ultra`. The capture's
  # own spawn_agent tool description claims ultra for astra, but that string is
  # authored by the client, and OpenAI's API reference
  # (developers.openai.com/api/docs/models/gpt-6-astra) lists exactly
  # low/medium/high/xhigh/max. The docs win; sending ultra would be guessing.
  #
  # It is the GPT-6 `powerful` pick. Sol is the GPT-6 flagship and Terra is the
  # GPT-6 moderate model; astra remains above both for callers explicitly asking
  # for the frontier tier.
  - id: gpt-6-astra
    name: GPT-6 Astra
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1050000
      max_output_tokens: 128000
      thinking_levels: [low, medium, high, xhigh, max]
      supported_file_types: [image, text]
    providers:
      - driver: codex
        api_model: gpt-6-astra
        # UNVERIFIED for astra specifically. The ChatGPT/Codex subscription
        # backend caps every GPT-5.x model at ~272k (see the gpt-5.5 note), and
        # the astra capture never grew a context large enough to prove whether
        # that still applies to a 1M-window model. Inheriting the cap is the
        # safe direction: too small only makes us compact early, while too large
        # 400s the turn with context_length_exceeded. Raise this once someone
        # runs a long astra session through the codex backend.
        max_context_window: 272000
      - driver: openai
        api_model: gpt-6-astra
      - driver: openrouter
        api_model: openai/gpt-6-astra
    driver_settings:
      preferred_endpoint: responses
      temperature_mode: omit
      use_max_completion_tokens: true
