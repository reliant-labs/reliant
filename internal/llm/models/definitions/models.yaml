# Model definitions for Reliant LLM infrastructure

# ============================================================================
# TAGS — the single place a tier maps to a model and an effort
# ============================================================================
#
# A preset or workflow selects a TIER ("tags: [flagship]"), never a model or an
# effort. Each tag is an ordered list of {model, thinking_level}; the FIRST
# entry whose model has a provider the user has configured wins, and that
# entry's thinking_level is what the request carries unless the caller passes
# an explicit thinking_level.
#
# The same model may appear under several tags at different efforts — that is
# how one model serves several tiers. Each tier is tuned independently:
# [flagship] is claude-5.5-opus at xhigh, [moderate] is claude-5.5-sonnet at
# medium. Retuning a tier is an edit HERE, never in a preset.
#
# thinking_level is an aspiration: it is clamped down to the model's declared
# capabilities.thinking_levels. Omit it (or name the model by id instead of by
# tag) and the model's capability default applies — medium when supported.
#
# Models carry no tags of their own; the tags a model "has" are derived from
# these lists (that is what the model picker and ListModels report).
#
# A multi-tag selector ([fast, moderate]) prefers models listed under more of
# its tags, earlier tags weighted higher; ties go to position in the earliest
# matching tag's list. The effort comes from that same earliest matching tag.
# Note that this SUMS weights, so it means "prefer a model good at both", NOT
# "fast, or moderate if there is no fast model" — for a strict fallback, resolve
# the tags one at a time (see titleModelSelector).
#
# Every entry must name a model defined below and a known level, and a model
# may appear at most once per tag, or the registry fails to parse.
#
# EVERY PROVIDER MUST IMPLEMENT EVERY CORE TAG — powerful, flagship, moderate,
# fast, cheap, reasoning, meta. Resolution filters to the providers a user has
# configured, so a tier that looks well-populated here can be EMPTY for a
# single-provider user, who then gets a hard "no available provider for models
# with tags" failure from any feature asking for it. That is how an
# antigravity-only user ended up unable to title a chat at all. Several tags
# therefore end in trailing per-provider entries, marked as such: a model at the
# END of a list is reached only when nothing above it is servable, so adding one
# cannot change any existing user's resolution. TestEveryProviderImplements-
# EveryCoreTag (internal/llm/models/tag_coverage_test.go) enforces this, and
# derives the provider list from the catalog so a new provider is covered the
# moment its first text model lands.
tags:
  powerful:
    - {model: claude-5.1-fable, thinking_level: xhigh}
    - {model: gpt-6-astra, thinking_level: xhigh}
    - {model: gpt-5.6-sol, thinking_level: xhigh}
    - {model: gemini-3.8-flash, thinking_level: high}
    - {model: vertex-claude-5.1-fable, thinking_level: xhigh}
    # Trailing per-provider coverage. Every provider must answer every tier, or
    # a user whose only provider is that one gets a hard resolution failure
    # instead of a degraded model. These sit LAST, so they are reached only
    # when nothing above them is servable — a copilot-only or xai-only user.
    - {model: claude-5-sonnet, thinking_level: xhigh}   # copilot
    - {model: grok-4, thinking_level: high}             # xai (high is its top level)

  flagship:
    - {model: claude-5.5-opus, thinking_level: xhigh}
    - {model: claude-5-opus, thinking_level: high}
    - {model: claude-5.1-fable, thinking_level: xhigh}
    - {model: claude-4.8-opus, thinking_level: high}
    - {model: claude-5.5-sonnet, thinking_level: high}
    - {model: claude-5-sonnet, thinking_level: high}
    - {model: claude-5-fable, thinking_level: high}
    - {model: claude-4.6-opus, thinking_level: high}
    - {model: claude-4.5-opus, thinking_level: high}
    - {model: gpt-6-sol, thinking_level: xhigh}
    - {model: gpt-5.5, thinking_level: xhigh}
    - {model: gpt-5.6-luna, thinking_level: medium}
    - {model: gpt-5.4, thinking_level: xhigh}
    - {model: gpt-5.4-pro, thinking_level: xhigh}
    - {model: gpt-5.3-codex, thinking_level: xhigh}
    - {model: gpt-5.2-codex, thinking_level: xhigh}
    - {model: gemini-3.8-flash, thinking_level: high}
    - {model: gemini-3.7-flash, thinking_level: medium}
    - {model: gemini-3.1-pro-preview, thinking_level: high}
    - {model: gemini-3-pro-preview, thinking_level: high}
    - {model: grok-4, thinking_level: medium}
    - {model: vertex-claude-5.5-opus, thinking_level: xhigh}
    - {model: vertex-claude-5-opus, thinking_level: high}
    - {model: vertex-claude-4.8-opus, thinking_level: high}
    - {model: vertex-claude-5.5-sonnet, thinking_level: high}
    - {model: vertex-claude-5-sonnet, thinking_level: high}
    - {model: vertex-claude-5.1-fable, thinking_level: xhigh}
    - {model: vertex-claude-5-fable, thinking_level: high}
    - {model: vertex-claude-4.6-opus, thinking_level: high}
    - {model: gpt-image-2.5-sunburst}

  moderate:
    # Implementation tier (the implementer preset). Sonnet 5.5 is the primary
    # Anthropic moderate model; Opus remains above it in flagship for orchestration
    # and below it here as a fallback.
    - {model: claude-5.5-sonnet, thinking_level: medium}
    - {model: claude-5-opus, thinking_level: medium}
    - {model: claude-5-sonnet, thinking_level: high}
    - {model: gpt-6-terra, thinking_level: medium}
    - {model: gpt-5.5, thinking_level: xhigh}
    - {model: gpt-5.6-terra, thinking_level: medium}
    - {model: gpt-5.4, thinking_level: xhigh}
    - {model: gemini-3.7-flash, thinking_level: medium}
    - {model: claude-4.6-sonnet, thinking_level: medium}
    - {model: claude-4.5-sonnet, thinking_level: medium}
    - {model: gpt-5.2-pro, thinking_level: medium}
    - {model: gpt-5.2, thinking_level: medium}
    - {model: gemini-3.6-flash, thinking_level: medium}
    - {model: gemini-3.5-flash, thinking_level: low}
    - {model: gemini-2.5-pro, thinking_level: high}
    - {model: vertex-claude-5.5-sonnet, thinking_level: medium}
    - {model: vertex-claude-5-opus, thinking_level: medium}
    - {model: vertex-claude-5-sonnet, thinking_level: high}
    - {model: vertex-claude-4.5-sonnet, thinking_level: medium}
    - {model: vertex-gemini-2.5-pro, thinking_level: high}
    # Trailing per-provider coverage — reached only by a user whose only
    # provider is antigravity or xai. See the note under `powerful`.
    - {model: gemini-3.8-flash, thinking_level: medium} # antigravity
    - {model: grok-4, thinking_level: medium}           # xai

  fast:
    - {model: gemini-3.5-flash, thinking_level: low}
    - {model: claude-4.5-haiku}
    - {model: gpt-5.4-mini, thinking_level: high}
    - {model: gpt-5-mini, thinking_level: medium}
    - {model: gpt-6-luna, thinking_level: low}
    - {model: gemini-3-flash-preview}
    - {model: gemini-3.1-flash-lite-preview}
    - {model: gemini-2.5-flash}
    - {model: gemini-2.5-flash-lite}
    - {model: vertex-claude-4.5-haiku}
    - {model: vertex-gemini-2.5-flash}
    - {model: gpt-image-2.5-flare}
    - {model: gemini-3.1-flash-lite-image}
    # Trailing per-provider coverage. A provider that ships no genuinely cheap
    # model still has to answer [fast], because titling and other meta work ask
    # for that tier and a failure to resolve is not a slower title — it is no
    # title. Each entry runs at its model's LOWEST effort, which is the closest
    # these providers get to a fast tier.
    #
    # grok-3-mini-beta leads the three because it is the only one that is
    # genuinely a small model. It already carried `cheap`, so a [fast, cheap]
    # selector scores it level with terra and gemini-3.8-flash (both also carry
    # cheap) and the tie breaks on position here — leading keeps an xai user's
    # [fast, cheap] on grok rather than moving it to a frontier model at low
    # effort.
    - {model: grok-3-mini-beta}                         # xai
    - {model: gpt-5.6-terra, thinking_level: low}       # codex
    - {model: gemini-3.8-flash, thinking_level: low}    # antigravity

  cheap:
    - {model: claude-4.5-haiku}
    - {model: gpt-5.4-mini, thinking_level: high}
    - {model: gpt-5-mini, thinking_level: medium}
    - {model: gpt-6-luna, thinking_level: low}
    - {model: gemini-3.1-flash-lite-preview}
    - {model: gemini-2.5-flash}
    - {model: gemini-2.5-flash-lite}
    - {model: grok-3-mini-beta}
    - {model: vertex-claude-4.5-haiku}
    - {model: vertex-gemini-2.5-flash}
    - {model: gemini-3.1-flash-lite-image}
    # Trailing per-provider coverage — reached only by a codex-only or
    # antigravity-only user. Both are subscription-billed, so "cheap" means the
    # cheapest effort available rather than a cheaper per-token rate.
    - {model: gpt-5.6-terra, thinking_level: low}       # codex
    - {model: gemini-3.8-flash, thinking_level: low}    # antigravity

  image-gen:
    - {model: gpt-image-2.5-flare}
    - {model: gpt-image-2.5-sunburst}
    - {model: gpt-image-2}
    - {model: gemini-3.1-flash-lite-image}
    - {model: gemini-3.1-flash-image}
    - {model: gemini-3-pro-image}

  meta:
    - {model: claude-4.5-haiku}
    - {model: gpt-5.4-mini, thinking_level: high}
    - {model: gpt-6-luna, thinking_level: low}
    - {model: grok-3-mini-beta}
    - {model: vertex-claude-4.5-haiku}
    # Trailing per-provider coverage. Internal meta work (titling, routing,
    # summarizing) must be possible on every provider; these are reached only
    # when the user has none of the models above.
    - {model: gemini-3.1-flash-lite-preview}            # gemini
    - {model: gpt-5.6-terra, thinking_level: low}        # codex
    - {model: gemini-3.8-flash, thinking_level: low}     # antigravity

  reasoning:
    - {model: claude-5.5-opus, thinking_level: xhigh}
    - {model: claude-5-opus, thinking_level: high}
    - {model: claude-5.1-fable, thinking_level: xhigh}
    - {model: claude-4.8-opus, thinking_level: high}
    - {model: claude-5.5-sonnet, thinking_level: high}
    - {model: claude-5-sonnet, thinking_level: high}
    - {model: claude-5-fable, thinking_level: high}
    - {model: claude-4.6-opus, thinking_level: high}
    - {model: claude-4.5-opus, thinking_level: high}
    - {model: gpt-5.5, thinking_level: xhigh}
    - {model: gpt-6-astra, thinking_level: xhigh}
    - {model: gpt-6-sol, thinking_level: xhigh}
    - {model: gpt-5.6-sol, thinking_level: xhigh}
    - {model: gpt-6-terra, thinking_level: medium}
    - {model: gpt-5.6-terra, thinking_level: medium}
    - {model: gpt-5.6-luna, thinking_level: medium}
    - {model: gpt-5.4, thinking_level: xhigh}
    - {model: gpt-5.4-pro, thinking_level: xhigh}
    - {model: gpt-5.3-codex, thinking_level: xhigh}
    - {model: gpt-5.2-codex, thinking_level: xhigh}
    - {model: gemini-3.8-flash, thinking_level: high}
    - {model: gemini-3.7-flash, thinking_level: medium}
    - {model: gemini-3.1-pro-preview, thinking_level: high}
    - {model: gemini-3-pro-preview, thinking_level: high}
    - {model: gemini-3.1-pro-preview-customtools, thinking_level: high}
    - {model: grok-4, thinking_level: medium}
    - {model: claude-4.6-sonnet, thinking_level: medium}
    - {model: claude-4.5-sonnet, thinking_level: medium}
    - {model: gpt-5.2-pro, thinking_level: medium}
    - {model: gpt-5.2, thinking_level: medium}
    - {model: gemini-3.6-flash, thinking_level: medium}
    - {model: gemini-3.5-flash, thinking_level: low}
    - {model: gemini-2.5-pro, thinking_level: high}
    - {model: vertex-claude-5.5-opus, thinking_level: xhigh}
    - {model: vertex-claude-5-opus, thinking_level: high}
    - {model: vertex-claude-4.8-opus, thinking_level: high}
    - {model: vertex-claude-5.5-sonnet, thinking_level: high}
    - {model: vertex-claude-5-sonnet, thinking_level: high}
    - {model: vertex-claude-5.1-fable, thinking_level: xhigh}
    - {model: vertex-claude-5-fable, thinking_level: high}
    - {model: vertex-claude-4.6-opus, thinking_level: high}
    - {model: vertex-claude-4.5-sonnet, thinking_level: medium}
    - {model: vertex-gemini-2.5-pro, thinking_level: high}

models:
  # ============================================================================
  # FLAGSHIP MODELS - Best overall for complex tasks
  # ============================================================================

  # Claude 5.5 Opus leads [flagship] (at xhigh) in the tags section above: the
  # general agent and orchestrators ask for flagship. It is deliberately NOT
  # in [moderate] — implementation runs on Sonnet 5.5 at medium. Nor is it
  # listed under `powerful` — that would collapse the powerful tier onto the
  # flagship model; `powerful` stays on fable-5.1 until that is an explicit
  # decision.
  #
  # Its 2.1.280 capture sends max_tokens 128000, twice every other Claude entry.
  - id: claude-5.5-opus
    name: Claude 5.5 Opus
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 128000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-opus-5-5
      - driver: openrouter
        api_model: anthropic/claude-opus-5-5
      - driver: reliant
        api_model: claude-opus-5-5
      - driver: vertexai
        api_model: claude-opus-5-5
      # GitHub Copilot: opus-5.5 mirrors the opus-5/opus-4.8 policy — served
      # only on paid plans, so no `copilot` entry (it would 400 upstream).
    driver_settings:
      thinking_mode: adaptive

  - id: claude-5-opus
    name: Claude 5 Opus
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 64000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-opus-5
      - driver: openrouter
        api_model: anthropic/claude-opus-5
      - driver: reliant
        api_model: claude-opus-5
      # GitHub Copilot: opus-5 mirrors the opus-4.8 policy — served only on paid
      # plans (individual/free reports policy=disabled), so no `copilot` provider
      # entry to avoid offering a picker option that 400s upstream.
    driver_settings:
      thinking_mode: adaptive

  # Claude 5.1 Fable leads the `powerful` list, ahead of gpt-6-astra,
  # gpt-5.6-sol and gemini-3.8-flash, so a bare [powerful] selector resolves
  # here.
  - id: claude-5.1-fable
    name: Claude 5.1 Fable
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 64000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-fable-5-1
      - driver: openrouter
        api_model: anthropic/claude-fable-5-1
      - driver: reliant
        api_model: claude-fable-5-1
      - driver: vertexai
        api_model: claude-fable-5-1
    driver_settings:
      thinking_mode: adaptive

  - id: claude-4.8-opus
    name: Claude 4.8 Opus
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 64000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-opus-4-8
      - driver: openrouter
        api_model: anthropic/claude-opus-4.8
      - driver: reliant
        api_model: claude-opus-4-8
      # NOTE: no `copilot` provider here. GitHub Copilot serves opus-4.8 only on
      # paid plans (the individual/free tier's /models reports it as
      # policy=disabled, restricted_to=[pro_plus,business,enterprise,max]), and the
      # enterprise Copilot tier has been removed. Mapping it here would offer a
      # broken picker option that 400s (model_not_supported) upstream.
    driver_settings:
      thinking_mode: adaptive

  # Claude Sonnet 5.5 (2026-09-28). Figures are from Anthropic's model page
  # (platform.claude.com/docs/en/models/sonnet-5-5), not copied from
  # claude-5-sonnet below, which differs in one that is easy to miss:
  # max_tokens is 128000, double sonnet-5's 64000.
  #
  # It leads [moderate] at medium and remains directly above claude-5-sonnet in
  # the other tiers sonnet-5 is in.
  #
  # Two API differences from sonnet-5 that the drivers already satisfy:
  # adaptive thinking is the only accepted mode (thinking:{type:"disabled"} and
  # budget_tokens both 400), and forced tool_choice ("any" / "tool") 400s. The
  # only forced-tool caller is chat titling, whose [fast, moderate] ladder
  # always reaches a haiku first on every provider this model is mapped to.
  #
  # No vertexai mapping: Vertex users get vertex-claude-5.5-sonnet. No copilot
  # mapping either — no Copilot account we have probed lists it, and an unserved
  # mapping 400s.
  - id: claude-5.5-sonnet
    name: Claude 5.5 Sonnet
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 128000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-sonnet-5-5
      - driver: openrouter
        api_model: anthropic/claude-sonnet-5-5
      # A mapping records that the gateway COULD route it; it is not sold
      # until it is added to pkg/llmcatalog's gatewayRoster.
      - driver: reliant
        api_model: claude-sonnet-5-5
    driver_settings:
      thinking_mode: adaptive

  - id: claude-5-sonnet
    name: Claude 5 Sonnet
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 64000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-sonnet-5
      - driver: openrouter
        api_model: anthropic/claude-sonnet-5
      - driver: reliant
        api_model: claude-sonnet-5
      # GitHub Copilot serves sonnet-5 on the Anthropic Messages dialect
      # (/v1/messages). This account's /models reports it policy=enabled; verified
      # 200 with the gho_ Bearer alone (paid plan).
      - driver: copilot
        api_model: claude-sonnet-5
    driver_settings:
      thinking_mode: adaptive

  - id: claude-5-fable
    name: Claude 5 Fable
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1000000
      max_output_tokens: 64000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-fable-5
      - driver: openrouter
        api_model: anthropic/claude-fable-5
      - driver: reliant
        api_model: claude-fable-5
    driver_settings:
      thinking_mode: adaptive

  - id: claude-4.6-opus
    name: Claude 4.6 Opus
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 200000
      max_output_tokens: 20000
      thinking_levels: [low, medium, high]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-opus-4-6
      - driver: openrouter
        api_model: anthropic/claude-opus-4.6
      - driver: reliant
        api_model: claude-opus-4-6
    default_temperature: 1.0

  - id: claude-4.5-opus
    name: Claude 4.5 Opus
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 200000
      max_output_tokens: 20000
      thinking_levels: [low, medium, high]
      supported_file_types: [image, pdf, text]
    providers:
      - driver: anthropic
        api_model: claude-opus-4-5-20251101
      - driver: openrouter
        api_model: anthropic/claude-opus-4.5
      - driver: reliant
        api_model: claude-opus-4-5
    default_temperature: 1.0

  # Which models the `codex` driver may declare
  # -------------------------------------------
  # The codex driver authenticates as a ChatGPT ACCOUNT against
  # chatgpt.com/backend-api/codex, not as an OpenAI API key. That backend serves
  # only a subset of the GPT catalog and refuses the rest with a 400 whose body
  # is `{"detail":"The '<model>' model is not supported when using Codex with a
  # ChatGPT account."}`.
  #
  # Verified live against the backend with a current ChatGPT account token,
  # sending the same version/originator headers the driver sends (codex-tui
  # 0.153.4):
  #
  #   ACCEPTED  gpt-5.5, gpt-6-astra, gpt-5.6-sol, gpt-5.6-luna, gpt-5.6-terra
  #   REFUSED   gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.3-codex-spark,
  #             gpt-5.2-codex
  #
  # gpt-5.4-mini was listed ACCEPTED on the family pattern rather than its own
  # probe; it is refused exactly like its parent. A `-mini` does not inherit
  # the family's acceptance — probe each id.
  #
  # The refused models stay in this catalog served by `openai`/`openrouter`,
  # which reach them with an API key. Only their codex mapping was wrong.
  #
  # A codex mapping for a refused model is not cosmetic: tag resolution hands it
  # to real callers and every request fails. TestCodexProvidersAreServedByThe
  # ChatGPTAccountBackend enforces this list.
  - id: gpt-5.5
    name: GPT-5.5
    visibility: user
    capabilities:
      can_reason: true
      supports_tools: true
      supports_attachments: true
      supports_streaming: true
      supports_caching: true
      max_context_window: 1050000
      max_output_tokens: 128000
      thinking_levels: [low, medium, high, xhigh]
      supported_file_types: [image, text]
    providers:
      - driver: codex
        api_model: gpt-5.5
