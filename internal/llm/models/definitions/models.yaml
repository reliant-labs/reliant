# Copyright (c) 2025 Reliant Labs
# Model definitions for Reliant LLM infrastructure
#
# Model order determines tag resolution priority (first match wins).
# Models are grouped by primary provider for organization.

# Per-tag request defaults, applied when a selector picks a model BY that tag.
#
# Precedence, highest first: an explicit node/preset thinking_level, then the
# tag default below, then the model's own default_thinking_level, then the
# registry capability floor. Selecting the same model by explicit `id:` does
# NOT pick up a tag default — the default describes how the model was chosen.
#
# When a selector lists several tags, the winner is the EARLIEST tag in the
# selector's list that the resolved model actually carries and that declares a
# default. That matches tag-scoring weights, where earlier tags already rank
# higher.
#
# A thinking_level here is an aspiration: it is clamped down to the resolved
# model's declared thinking_levels, so `xhigh` on gemini-3.8-flash (which tops
# out at high) yields `high`. Every tag named here must be carried by at least
# one model and name a known level, or the registry fails to parse.
tag_defaults:
  # `powerful` is the frontier tier — selecting it means "spend capability on
  # this", so it also means "think hard" without every caller writing
  # thinking_level by hand.
  powerful:
    thinking_level: xhigh

