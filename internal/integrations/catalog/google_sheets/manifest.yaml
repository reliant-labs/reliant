# yaml-language-server: $schema=../../manifest/schema/manifest.schema.json
# Google Sheets. Authored from Google's Sheets API v4 discovery document
# (https://sheets.googleapis.com/$discovery/rest?version=v4), whose per-method
# `scopes` decide the scope list below, and from Google's OAuth 2.0 and OpenID
# Connect documentation (accounts.google.com/.well-known/openid-configuration).
#
# Auth: Google OAuth 2.0, authorization code + PKCE (S256), OFFLINE, exactly as
# gmail/manifest.yaml (read it for why access_type=offline, prompt=consent and
# the seven-day refresh-token expiry while the consent screen is External +
# "Testing").
#
# SHARED GOOGLE CLIENT. Every Google integration (gmail, google_calendar,
# google_sheets) uses the deployment's ONE Google OAuth client. Reliant reads a
# client per integration id (connections.OAuthClientEnv), so the deployment
# points RELIANT_OAUTH_GOOGLE_SHEETS_CLIENT_ID / _CLIENT_SECRET at the same
# secret as RELIANT_OAUTH_GMAIL_*; no code is shared or special-cased. What each
# integration needs from that one client:
#   redirect URI   <PUBLIC_URL>/integrations/oauth/google_sheets/callback
#                  (production: https://api.reliantapi.com/integrations/oauth/google_sheets/callback)
#                  Google matches redirect URIs exactly, so it must be added to
#                  the client beside gmail's.
#   scopes         every scope below must be on the OAuth consent screen,
#                  INCLUDING the two identity scopes (openid, email).
#   API enabled    "Google Sheets API" must be enabled in the Google Cloud
#                  project that owns the client, or every call is a 403
#                  accessNotConfigured.
#
# Scopes:
#   spreadsheets   SENSITIVE. Read and write the values and structure of every
#                  spreadsheet the account can open. Every action here is
#                  authorised by it (and by nothing narrower that still covers
#                  writes: drive.file only reaches files this app created or the
#                  user picked, which suits no workflow that is handed a sheet's
#                  id).
#   openid, email  NON-sensitive identity scopes, for the probe below ONLY.
#
# Identity probe: Sheets has no "who am I" endpoint, and nothing in the
# Sheets API names the account. The options were:
#   - Drive about.get: needs a drive scope (drive.file does not cover it), far
#     wider than this integration, and a RESTRICTED-class ask. Rejected.
#   - A Sheets call, e.g. creating a spreadsheet to read its owner: a write with
#     a side effect just to connect. Rejected.
#   - openid + email and the OpenID Connect userinfo endpoint
#     (https://openidconnect.googleapis.com/v1/userinfo): non-sensitive scopes
#     that need no Google verification, and the endpoint answers with the
#     stable account id (`sub`) and the address. Chosen: the least privilege
#     that works. The probe URL is on another Google host, so that host is
#     named in allowed_hosts; the credential is written only to Google hosts.
# `sub` is the external account id (it survives an email change, so reconnecting
# the same Google account replaces its connection instead of adding a second);
# the email is the label a user recognises.
#
# Not exposed: formatting, charts, ranges by data filter, developer metadata,
# copying sheets and spreadsheets.batchUpdate beyond adding a tab. spreadsheet.get
# always sends includeGridData=false: grid data is the whole sheet's cells with
# formatting and can be enormous; read cell values with values.get.
#
# Errors are Google's JSON error model,
# {"error": {"code", "message", "status", "errors": [{"reason", "domain"}]}},
# classified once (anchored) and repeated per action:
#   401                                   the token was refused: reconnect.
#   403 rateLimitExceeded,
#       userRateLimitExceeded             retryable (per-user quota).
#   403 insufficientPermissions /
#       ACCESS_TOKEN_SCOPE_INSUFFICIENT   the connection lacks the scope.
#   403 otherwise                         permission (the account cannot open or
#                                         edit that spreadsheet, API not enabled,
#                                         domain policy, ...).
#   429                                   retryable (RESOURCE_EXHAUSTED: Sheets'
#                                         per-minute read/write quota).
#   400                                   invalid request (a bad A1 range reads
#                                         "Unable to parse range: ...").
#   404                                   not found (or not this account's).
#   5xx                                   retryable (the runner's default).
id: google_sheets
version: 1
display_name: Google Sheets
description: Create spreadsheets, read, write, append to and clear cell ranges, and add tabs, as the connected Google account.
icon: google_sheets
category: productivity
keywords: [sheets, spreadsheet, google, excel, cells, rows, table, data, csv, tab]

connection:
  base_url: https://sheets.googleapis.com/v4
  allowed_hosts: [openidconnect.googleapis.com]
  default_headers:
    Accept: application/json
  auth:
    - oauth2:
        authorize_url: https://accounts.google.com/o/oauth2/v2/auth
        token_url: https://oauth2.googleapis.com/token
        pkce: S256
        scopes:
          - https://www.googleapis.com/auth/spreadsheets
          - openid
          - email
        authorize_params:
          access_type: offline
          prompt: consent
          include_granted_scopes: "true"
        revoke:
          method: POST
          url: https://oauth2.googleapis.com/revoke
          token_in: form
          token_param: token
  probe:
    url: https://openidconnect.googleapis.com/v1/userinfo
    external_id: response.sub
    label: response.?email.orValue(response.sub)

actions:
  - id: spreadsheet.create
    display_name: Create spreadsheet
    summary: Create a new spreadsheet in the account's Google Drive.
    description: >-
      Create a new spreadsheet with the given title, owned by the connected
      account, with one empty tab (named "Sheet1") or, when sheet_names is
      given, one tab per name in that order. Returns spreadsheet_id (what every
      other Sheets action takes), the URL to open it, and its tabs with their
      sheet_id.
    keywords: [spreadsheet, create, new, sheet, workbook, make, google sheets]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          title: Title
          description: The spreadsheet's name, as shown in Google Drive.
          examples: ["Q4 pipeline"]
        sheet_names:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
          title: Tab names
          description: Names of the tabs to create, in order. Each must be unique. Omit for one tab called "Sheet1".
          examples: [["Leads", "Customers"]]
        connection: &connection
          type: string
          description: Id of a saved Google Sheets connection to use. Omit to use your default Google Sheets connection.
    request:
      method: POST
      path: /spreadsheets
      body_expr: >-
        {"properties": {"title": params.title},
         ?"sheets": has(params.sheet_names) ? optional.of(params.sheet_names.map(n, {"properties": {"title": n}})) : optional.none()}
      errors: &google_sheets_errors
        - status: 401
          retryable: false
          message: "Google rejected the Google Sheets credential ({{ response.?error.?message.orValue('invalid credentials') }}): reconnect Google Sheets in Settings."
        - status: 403
          when: >-
            type(response) == map &&
            response.?error.?errors.orValue([]).exists(e, type(e) == map &&
              e.?reason.orValue('') in ['rateLimitExceeded', 'userRateLimitExceeded'])
          retryable: true
          message: &google_sheets_rate_limited "Google Sheets rate limit exceeded ({{ response.?error.?message.orValue('rate limited') }}). Retry after at least 60 seconds."
        - status: 403
          when: >-
            type(response) == map &&
            (response.?error.?errors.orValue([]).exists(e, type(e) == map &&
               e.?reason.orValue('') == 'insufficientPermissions') ||
             response.?error.?details.orValue([]).exists(d, type(d) == map &&
               d.?reason.orValue('') == 'ACCESS_TOKEN_SCOPE_INSUFFICIENT'))
          retryable: false
          message: >-
            The Google Sheets connection was not granted the access this needs
            ({{ response.?error.?message.orValue('insufficient permission') }}): reconnect Google Sheets
            and allow every permission it asks for.
        - status: 403
          retryable: false
          message: "Google Sheets refused the request: {{ response.?error.?message.orValue('forbidden') }}."
        - status: 429
          retryable: true
          message: *google_sheets_rate_limited
        - status: 400
          retryable: false
          message: "Google Sheets rejected the request as invalid: {{ response.?error.?message.orValue('bad request') }}."
        - status: 404
          retryable: false
          message: "Google Sheets returned not found: {{ response.?error.?message.orValue('the spreadsheet does not exist, or this account cannot open it') }}."
    output:
      select: &spreadsheet_select >-
        {"spreadsheet_id": response.spreadsheetId,
         "title": response.?properties.?title.orValue(''),
         "url": response.?spreadsheetUrl.orValue(null),
         "locale": response.?properties.?locale.orValue(null),
         "time_zone": response.?properties.?timeZone.orValue(null),
         "sheets": response.?sheets.orValue([]).map(s, {"sheet_id": s.properties.sheetId,
           "title": s.properties.?title.orValue(''),
           "index": s.properties.?index.orValue(0),
           "row_count": s.properties.?gridProperties.?rowCount.orValue(null),
           "column_count": s.properties.?gridProperties.?columnCount.orValue(null)})}
      schema: &spreadsheet_schema
        type: object
        properties:
          spreadsheet_id: { type: string, description: The id every other Sheets action takes. }
          title: { type: string }
          url: { type: [string, "null"], description: Where to open the spreadsheet in Google Sheets. }
          locale: { type: [string, "null"] }
          time_zone: { type: [string, "null"] }
          sheets:
            type: array
            description: The tabs, in order.
            items:
              type: object
              properties:
                sheet_id: { type: integer, description: The tab's numeric id (not its name). }
                title: { type: string, description: The tab's name, as used in A1 ranges. }
                index: { type: integer }
                row_count: { type: [integer, "null"] }
                column_count: { type: [integer, "null"] }

  - id: spreadsheet.get
    display_name: Get spreadsheet
    summary: A spreadsheet's title and tabs (names and ids), without its cell data.
    description: >-
      Read a spreadsheet's metadata: title, locale, time zone and its tabs with
      each tab's name, sheet_id and size in rows and columns. Cell data is never
      included (use Get values for that). Call it to learn the tab names to put
      in an A1 range, or a tab's sheet_id.
    keywords: [spreadsheet, get, metadata, tabs, sheets, titles, ids, info]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id]
      properties:
        spreadsheet_id: &spreadsheet_id
          type: string
          pattern: "^[A-Za-z0-9_-]{10,128}$"
          title: Spreadsheet ID
          description: The spreadsheet's id, the long token in its URL between /d/ and /edit, or the spreadsheet_id Create spreadsheet returned.
          examples: ["1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms"]
        connection: *connection
    request:
      method: GET
      path: /spreadsheets/{{ params.spreadsheet_id }}
      query: { includeGridData: "false" }
      errors: *google_sheets_errors
    output:
      select: *spreadsheet_select
      schema: *spreadsheet_schema

  - id: values.get
    display_name: Get values
    summary: Read the cell values in one A1 range.
    description: >-
      Read the values in a range written in A1 notation: "Sheet1!A1:D20", a
      whole column "Sheet1!A:A", or just a tab name "Sheet1" for everything in
      it. A tab name with spaces needs single quotes: "'Q4 pipeline'!A1:C5".
      Returns values as rows (or columns, with major_dimension COLUMNS), each
      row a list of cells; trailing empty cells and rows are left off, so rows
      can be of different lengths. value_render_option picks what a cell is:
      FORMATTED_VALUE (the text as shown, the default), UNFORMATTED_VALUE (the
      raw number or string) or FORMULA (the formula text).
    keywords: [sheets, read, values, cells, range, rows, get, data, a1]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, range]
      properties:
        spreadsheet_id: *spreadsheet_id
        range: &range
          type: string
          minLength: 1
          maxLength: 500
          title: Range
          description: >-
            The cells, in A1 notation, usually with the tab name: Sheet1!A1:D20.
            Quote a tab name containing spaces or punctuation: 'Q4 pipeline'!A1:C5.
          examples: ["Sheet1!A1:D20"]
        value_render_option:
          type: string
          enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
          default: FORMATTED_VALUE
          title: Value format
          description: FORMATTED_VALUE returns cells as displayed ("$1,234.50"), UNFORMATTED_VALUE as raw numbers and strings (1234.5), FORMULA as formulas ("=SUM(A1:A9)").
        major_dimension: &major_dimension
          type: string
          enum: [ROWS, COLUMNS]
          default: ROWS
          title: Orientation
          description: ROWS returns a list of rows, COLUMNS a list of columns.
        connection: *connection
    request:
      method: GET
      path: /spreadsheets/{{ params.spreadsheet_id }}/values/{{ params.range }}
      query_expr: >-
        {"valueRenderOption": params.value_render_option,
         "majorDimension": params.major_dimension}
      errors: *google_sheets_errors
    output:
      select: >-
        {"range": response.?range.orValue(params.range),
         "major_dimension": response.?majorDimension.orValue(params.major_dimension),
         "values": response.?values.orValue([])}
      schema:
        type: object
        properties:
          range: { type: string, description: The range actually read, with the tab name and the bounds Google resolved. }
          major_dimension: { type: string }
          values:
            type: array
            description: One list per row (or per column). Empty when the range has no data.
            items: { type: array, items: {} }

  - id: values.batch_get
    display_name: Get several ranges
    summary: Read the cell values in several A1 ranges at once.
    description: >-
      Read several ranges of one spreadsheet in a single call, each in A1
      notation ("Sheet1!A1:B10", "Totals!A1:A1"). Returns one entry per
      requested range, in the order asked, each with the range Google resolved
      and its values as rows (or columns). Same value_render_option and
      major_dimension as Get values. Cheaper against Sheets' per-minute quota
      than one call per range.
    keywords: [sheets, read, values, ranges, batch, multiple, cells, get, data]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, ranges]
      properties:
        spreadsheet_id: *spreadsheet_id
        ranges:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
          title: Ranges
          description: The ranges to read, each in A1 notation with the tab name, e.g. Sheet1!A1:B10.
          examples: [["Sheet1!A1:B10", "Totals!A1:A1"]]
        value_render_option:
          type: string
          enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
          default: FORMATTED_VALUE
          title: Value format
          description: FORMATTED_VALUE returns cells as displayed, UNFORMATTED_VALUE as raw numbers and strings, FORMULA as formulas.
        major_dimension: *major_dimension
        connection: *connection
    request:
      method: GET
      path: /spreadsheets/{{ params.spreadsheet_id }}/values:batchGet
      query_expr: >-
        {"ranges": params.ranges,
         "valueRenderOption": params.value_render_option,
         "majorDimension": params.major_dimension}
      errors: *google_sheets_errors
    output:
      select: >-
        {"spreadsheet_id": response.?spreadsheetId.orValue(params.spreadsheet_id),
         "value_ranges": response.?valueRanges.orValue([]).map(r, {"range": r.?range.orValue(''),
           "major_dimension": r.?majorDimension.orValue(params.major_dimension),
           "values": r.?values.orValue([])})}
      schema:
        type: object
        properties:
          spreadsheet_id: { type: string }
          value_ranges:
            type: array
            items:
              type: object
              properties:
                range: { type: string }
                major_dimension: { type: string }
                values: { type: array, items: { type: array, items: {} } }

  - id: values.update
    display_name: Update values
    summary: Write a block of cell values at a range, overwriting what is there.
    description: >-
      Write values (a list of rows, each a list of cells) into a range in A1
      notation, overwriting the existing cells. Give the top-left cell
      ("Sheet1!A1") or the whole block ("Sheet1!A1:C3"); the values may be
      smaller than the range but not larger. A cell is a string, number, boolean
      or null (null leaves a cell empty). value_input_option USER_ENTERED (the
      default) parses cells as if typed, so "=SUM(A1:A9)" is a formula,
      "12/25/2026" a date and "3" a number; RAW stores every value exactly as
      given. Returns how many rows, columns and cells were updated.
    keywords: [sheets, write, update, values, cells, set, overwrite, range, put]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, range, values]
      properties:
        spreadsheet_id: *spreadsheet_id
        range: *range
        values: &values
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: array
            maxItems: 1000
            items:
              anyOf:
                - { type: string }
                - { type: number }
                - { type: boolean }
                - { type: "null" }
          title: Values
          description: The cells as a list of rows, each row a list of strings, numbers, booleans or nulls.
          examples: [[["Name", "Qty"], ["Widget", 3]]]
        value_input_option: &value_input_option
          type: string
          enum: [USER_ENTERED, RAW]
          default: USER_ENTERED
          title: Input mode
          description: USER_ENTERED parses values as if typed in the UI (formulas, dates, numbers); RAW stores them exactly as given.
        major_dimension: *major_dimension
        connection: *connection
    request:
      method: PUT
      path: /spreadsheets/{{ params.spreadsheet_id }}/values/{{ params.range }}
      query_expr: '{"valueInputOption": params.value_input_option}'
      body_expr: >-
        {"range": params.range,
         "majorDimension": params.major_dimension,
         "values": params.values}
      errors: *google_sheets_errors
    output:
      select: >-
        {"spreadsheet_id": response.?spreadsheetId.orValue(params.spreadsheet_id),
         "updated_range": response.?updatedRange.orValue(null),
         "updated_rows": response.?updatedRows.orValue(0),
         "updated_columns": response.?updatedColumns.orValue(0),
         "updated_cells": response.?updatedCells.orValue(0)}
      schema: &updated_schema
        type: object
        properties:
          spreadsheet_id: { type: string }
          updated_range: { type: [string, "null"], description: The range that was written, in A1 notation. }
          updated_rows: { type: integer }
          updated_columns: { type: integer }
          updated_cells: { type: integer }

  - id: values.append
    display_name: Append rows
    summary: Add rows after the last row of a table in a range.
    description: >-
      Append values (a list of rows) after the last row of the table Google
      finds in range: pass a tab name ("Sheet1") or a range inside the table
      ("Sheet1!A1:C1") and the rows land below the existing data. With
      insert_data_option INSERT_ROWS (the default) new rows are inserted, so
      rows below the table shift down; OVERWRITE writes over whatever is below.
      A cell is a string, number, boolean or null; value_input_option
      USER_ENTERED (the default) parses cells as if typed (formulas, dates),
      RAW stores them exactly. Returns the range that was written and how many
      rows and cells were added. Not idempotent: calling it twice appends twice.
    keywords: [sheets, append, add, rows, insert, log, record, table, new row]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, range, values]
      properties:
        spreadsheet_id: *spreadsheet_id
        range:
          type: string
          minLength: 1
          maxLength: 500
          title: Range
          description: >-
            Where the table is, in A1 notation: a tab name (Sheet1) or a range in
            the table (Sheet1!A1:C1). Rows are added after the table's last row.
          examples: ["Sheet1"]
        values: *values
        value_input_option: *value_input_option
        insert_data_option:
          type: string
          enum: [INSERT_ROWS, OVERWRITE]
          default: INSERT_ROWS
          title: Insert mode
          description: INSERT_ROWS inserts new rows for the data (the default); OVERWRITE writes over the cells below the table.
        connection: *connection
    request:
      method: POST
      path: /spreadsheets/{{ params.spreadsheet_id }}/values/{{ params.range }}:append
      query_expr: >-
        {"valueInputOption": params.value_input_option,
         "insertDataOption": params.insert_data_option}
      body_expr: '{"majorDimension": "ROWS", "values": params.values}'
      errors: *google_sheets_errors
    output:
      select: >-
        {"spreadsheet_id": response.?spreadsheetId.orValue(params.spreadsheet_id),
         "table_range": response.?tableRange.orValue(null),
         "updated_range": response.?updates.?updatedRange.orValue(null),
         "updated_rows": response.?updates.?updatedRows.orValue(0),
         "updated_columns": response.?updates.?updatedColumns.orValue(0),
         "updated_cells": response.?updates.?updatedCells.orValue(0)}
      schema:
        type: object
        properties:
          spreadsheet_id: { type: string }
          table_range: { type: [string, "null"], description: The table the rows were added to, before the append; null when the range held no data. }
          updated_range: { type: [string, "null"], description: The cells the new rows occupy, in A1 notation. }
          updated_rows: { type: integer }
          updated_columns: { type: integer }
          updated_cells: { type: integer }

  - id: values.clear
    display_name: Clear values
    summary: Empty the cells in a range, keeping their formatting.
    description: >-
      Clear the values in a range in A1 notation ("Sheet1!A2:D", or a tab name
      for the whole tab). Only values are removed: formatting, data validation,
      the rows and columns themselves and the tab stay. This cannot be undone
      from here (Google Sheets' version history can). Returns the range cleared.
    keywords: [sheets, clear, empty, delete, values, cells, erase, range, wipe]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, range]
      properties:
        spreadsheet_id: *spreadsheet_id
        range:
          type: string
          minLength: 1
          maxLength: 500
          title: Range
          description: The cells to empty, in A1 notation, with the tab name. A bare tab name clears the whole tab.
          examples: ["Sheet1!A2:D"]
        connection: *connection
    request:
      method: POST
      path: /spreadsheets/{{ params.spreadsheet_id }}/values/{{ params.range }}:clear
      body_expr: '{}'
      errors: *google_sheets_errors
    output:
      select: >-
        {"spreadsheet_id": response.?spreadsheetId.orValue(params.spreadsheet_id),
         "cleared_range": response.?clearedRange.orValue(null)}
      schema:
        type: object
        properties:
          spreadsheet_id: { type: string }
          cleared_range: { type: [string, "null"], description: The range that was cleared, in A1 notation. }

  - id: sheet.add
    display_name: Add sheet tab
    summary: Add a new tab to a spreadsheet.
    description: >-
      Add a tab to an existing spreadsheet, with the given title (it must not
      match an existing tab's name, ignoring case). Optionally set its size in
      rows and columns (Google's default is 1000 by 26). Returns the new tab's
      sheet_id, title and position.
    keywords: [sheets, tab, sheet, add, new, create, worksheet, spreadsheet]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, title]
      properties:
        spreadsheet_id: *spreadsheet_id
        title:
          type: string
          minLength: 1
          maxLength: 100
          title: Tab name
          description: The new tab's name, unique within the spreadsheet.
          examples: ["Q4 pipeline"]
        row_count:
          type: integer
          minimum: 1
          maximum: 10000000
          title: Rows
          description: How many rows the tab starts with. Omit for Google's default (1000).
          examples: [200]
        column_count:
          type: integer
          minimum: 1
          maximum: 18278
          title: Columns
          description: How many columns the tab starts with. Omit for Google's default (26).
          examples: [12]
        connection: *connection
    request:
      method: POST
      path: /spreadsheets/{{ params.spreadsheet_id }}:batchUpdate
      body_expr: >-
        {"requests": [{"addSheet": {"properties": {"title": params.title,
           ?"gridProperties": (has(params.row_count) || has(params.column_count))
             ? optional.of({?"rowCount": params.?row_count, ?"columnCount": params.?column_count})
             : optional.none()}}}]}
      errors: *google_sheets_errors
    output:
      select: >-
        {"spreadsheet_id": response.?spreadsheetId.orValue(params.spreadsheet_id),
         "sheet_id": response.replies[0].addSheet.properties.sheetId,
         "title": response.replies[0].addSheet.properties.?title.orValue(params.title),
         "index": response.replies[0].addSheet.properties.?index.orValue(0)}
      schema:
        type: object
        properties:
          spreadsheet_id: { type: string }
