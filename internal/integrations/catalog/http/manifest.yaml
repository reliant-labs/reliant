# Generic HTTP request. No connection and no credentials: the caller supplies
# the URL and any headers. It is the escape hatch for APIs without a manifest,
# so it may name any host, and the runtime still refuses private, loopback,
# link-local and metadata addresses after DNS resolution.
id: http
version: 1
display_name: HTTP
description: Make an HTTP request to a public URL.
icon: globe
category: core

keywords: [api, rest, webhook, request, fetch, zapier]

connection:
  allow_any_public_host: true
  # A saved api_key or basic connection for integration `http` may be named per
  # call; without one the request is unauthenticated. The credential is only
  # ever sent to the host the call started at. This integration knows no
  # particular API, so an api_key connection picks its header from a fixed list.
  auth_optional: true
  auth:
    - api_key: { label: API key }
    - basic: {}

actions:
  - id: request
    display_name: HTTP request
    description: >-
      Send an HTTP request to a public http(s) URL and return the status,
      headers and body. Private, loopback and link-local addresses are refused.
    placement: server
    mutates: true
    tool:
      expose: true
    # Every option below the body is optional with a default that is the
    # behavior before it existed, so http/request@1 stays one version.
    params:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          title: URL
          description: The public http(s) address to call, query string included if you have one.
          examples: ["https://api.example.com/v1/orders?status=open"]
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          default: GET
          title: Method
          description: The HTTP method. Use GET to read; POST, PUT, PATCH or DELETE to change something.
        headers:
          type: object
          additionalProperties: { type: string }
          title: Headers
          description: Request headers as an object of name to value. A connection adds its auth header for you.
          examples: [{ "Accept": "application/json", "X-Api-Version": "2024-06-01" }]
        query:
          type: object
          additionalProperties: { type: string }
          title: Query parameters
          description: Parameters added to the URL's query string, as an object of name to value.
          examples: [{ "status": "open", "limit": "50" }]
        body:
          title: Body
          description: >-
            What to send: an object or list for a JSON or form body, a string
            for a text body. Omit it to send no body.
          examples: [{ "name": "Ada Lovelace", "email": "ada@example.com" }]
        body_type:
          type: string
          enum: [json, form, text]
          default: json
          title: Body type
          description: >-
            How the body is encoded: json; form (a flat object, sent as
            application/x-www-form-urlencoded); or text (a string, sent as-is).
            A Content-Type header overrides the type it implies.
        timeout:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
          title: Timeout (seconds)
          description: How long to wait for the whole response before the step fails, 1 to 120 seconds.
          examples: [10]
        response_format:
          type: string
          enum: [auto, json, text]
          default: auto
          title: Read response as
          description: >-
            auto fills json when the body is JSON; json fails the step if a
            successful response is not JSON; text never parses it (json is
            null). text always holds the raw body.
        follow_redirects:
          type: boolean
          default: true
          title: Follow redirects
          description: >-
            Follow 3xx redirects, up to 5. Turn it off to get the redirect
            itself as the result, with its status and Location header.
        connection:
          type: string
          description: >-
            Id of a saved api_key or basic connection for the http integration
            to authenticate with. Omit for an unauthenticated request. The
            credential is only sent to the URL's own host.
    request:
      method: "{{ params.method }}"
      url: "{{ params.url }}"
      headers_expr: "has(params.headers) ? params.headers : {}"
      query_expr: "has(params.query) ? params.query : {}"
      body_expr: "has(params.body) ? params.body : null"
      body_format: "{{ params.body_type }}"
      timeout_expr: "params.timeout"
      response_format: "{{ params.response_format }}"
      redirects: "{{ params.follow_redirects ? 'follow' : 'return' }}"
      max_response_bytes: 1048576
    output:
      select: '{"status": status, "headers": headers, "json": response, "text": raw}'
      schema:
        type: object
        properties:
          status: { type: integer, description: "The response status code: 2xx, or a 3xx when redirects are not followed." }
          headers: { type: object, description: "Response headers, names lower-cased (location, content-type)." }
          json: { description: "The parsed body when it is JSON, otherwise null." }
          text: { type: string, description: "The raw response body." }
