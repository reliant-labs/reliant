# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
#
# The commit statuses on a ref (the older Status API; check runs are
# check_run.list). Needs the GitHub App's "Commit statuses" (read) permission.
# The hosted Reliant App does not request it yet (control-plane's installation
# permission allowlist), so until it does GitHub answers this action 403
# "Resource not accessible by integration", which the permission rule reports.
# A personal access token with that permission works today.
#
# One page of up to 100 statuses, not paginated: the combined state already
# covers every status, and paginating would turn the output into a bare list.
id: commit.statuses
display_name: Get commit statuses
summary: The combined commit status of a ref, and each context's latest status.
description: >-
  Read the commit statuses of a branch, tag or commit: the combined state
  (failure if any context failed or errored, pending if any is pending or there
  are none, else success) and the latest status of each context, with its
  state, description, target_url and the login that set it. These are commit
  statuses, which external CI posts; check runs (GitHub Actions and Apps) are
  read with check_run.list, and a required check may be either. At most 100
  contexts are listed; truncated says when there were more. Needs the GitHub
  App's Commit statuses (read) permission; without it GitHub answers 403.
keywords: [status, commit status, ci, required check, combined status, context, commit]
placement: server
mutates: false
tool:
  expose: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, ref]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    ref:
      type: string
      pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
      maxLength: 255
      title: Branch, tag or commit
      description: The ref whose statuses to read; a pull request's head.sha from pr.get names its head exactly.
      examples: ["6dcb09b5b57875f334f61aebed695e2e4193db5e"]
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: GET
  path: /repos/{{ params.owner }}/{{ params.repo }}/commits/{{ params.ref }}/status
  query:
    per_page: "100"
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: >-
    {"state": response.state,
     "sha": response.?sha.orValue(null),
     "total_count": response.?total_count.orValue(0),
     "statuses": response.?statuses.orValue([]).map(s, {
        "context": s.?context.orValue(null),
        "state": s.state,
        "description": s.?description.orValue(null),
        "target_url": s.?target_url.orValue(null),
        "creator": s.?creator.?login.orValue(null),
        "created_at": s.?created_at.orValue(null),
        "updated_at": s.?updated_at.orValue(null)}),
     "truncated": double(response.?total_count.orValue(0)) > double(size(response.?statuses.orValue([])))}
  schema:
    type: object
    properties:
      state: { type: string, description: "The combined state: failure, pending or success." }
      sha: { type: [string, "null"], description: The commit the ref resolved to. }
      total_count: { type: integer, description: How many contexts have a status. }
      statuses:
        type: array
        description: The latest status of each context.
        items:
          type: object
          properties:
            context: { type: [string, "null"], description: "The status's name, e.g. ci/circleci: build." }
            state: { type: string, description: "error, failure, pending or success." }
            description: { type: [string, "null"] }
            target_url: { type: [string, "null"] }
            creator: { type: [string, "null"], description: The login that set the status. }
            created_at: { type: [string, "null"] }
            updated_at: { type: [string, "null"] }
      truncated: { type: boolean, description: Whether more than the 100 listed contexts have a status. }
