# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
id: pr.list_files
display_name: List pull request files
summary: The files a pull request changes, with per-file diffs, for review.
description: >-
  List the files a pull request changes: filename, status (added,
  modified, removed, renamed, ...), line counts and the unified diff hunk
  (patch). patch is null for binary files and very large diffs. Follows
  GitHub's pagination up to 1000 files; GitHub itself caps the list at
  3000. For a large pull request, list it with include_patch false (names
  and line counts only), then fetch diffs a directory at a time with
  path_prefix.
keywords: [pull request, pr, diff, files, changes, patch, review]
placement: server
mutates: false
tool:
  expose: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, pull_number]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    pull_number: { $ref: ../schemas/pull_number.yaml }
    path_prefix:
      type: string
      title: Path prefix
      description: Only files whose path starts with this (e.g. internal/auth/). A renamed file matches on its new or old path.
      examples: [internal/handlers/]
    include_patch:
      type: boolean
      default: true
      title: Include diffs
      description: False returns every file without its patch, so a pull request of hundreds of files fits in one response.
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: GET
  path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/files
  query: { per_page: "100" }
  pagination: { style: link_header, max_pages: 10 }
  max_response_bytes: 5242880
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: >-
    response.filter(f, !has(params.path_prefix) || f.filename.startsWith(params.path_prefix) ||
                       (has(f.previous_filename) && f.previous_filename != null &&
                        f.previous_filename.startsWith(params.path_prefix)))
            .map(f, {"filename": f.filename,
                     "status": f.status,
                     "additions": f.additions,
                     "deletions": f.deletions,
                     "changes": f.changes,
                     "patch": params.?include_patch.orValue(true) ? f.?patch.orValue(null) : null,
                     "previous_filename": f.?previous_filename.orValue(null),
                     "sha": f.?sha.orValue(null)})
  schema:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            filename: { type: string }
            status: { type: string, enum: [added, removed, modified, renamed, copied, changed, unchanged] }
            additions: { type: integer }
            deletions: { type: integer }
            changes: { type: integer }
            patch: { type: [string, "null"], description: The unified diff hunk; null for binary or oversized files. }
            previous_filename: { type: [string, "null"], description: Set when status is renamed. }
            sha: { type: [string, "null"] }
