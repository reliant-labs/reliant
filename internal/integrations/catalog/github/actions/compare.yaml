# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
#
# How far one ref is ahead of another, and which commits that is: what a ship
# step reads to decide whether there is anything to release and to write its
# notes. Needs Contents (read). base and head are joined into ONE path segment,
# base...head, each value percent-escaped (GitHub decodes %2F in a branch
# name); their pattern refuses empty, "." and ".." segments, as git_ref.yaml's
# does.
#
# The output is trimmed on purpose: GitHub's body also carries every changed
# file with its patch (up to 300), which an agent never needs from this action
# (pr.list_files is the diff reader). Commits are one page, at most 100, each
# reduced to its sha, author and the first line of its message.
id: compare
display_name: Compare two refs
summary: Whether head is ahead of or behind base, and the commits between them.
description: >-
  Compare two branches, tags or commits of one repository: status (ahead,
  behind, diverged or identical), ahead_by, behind_by, total_commits, the merge
  base, and the commits head has that base lacks, oldest first, each as its sha,
  its author's login and the first line of its message (capped at 300
  characters). One page of up to limit commits (at most 100) is returned;
  has_more says whether a later page holds more, read with page. Changed files
  are not returned: use pr.list_files for a diff.
keywords: [compare, diff, ahead, behind, commits, release notes, changelog, base, head]
placement: server
mutates: false
tool:
  expose: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, base, head]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    base:
      type: string
      pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
      maxLength: 255
      title: Base
      description: The branch, tag or commit sha to compare from, e.g. the last release's tag.
      examples: ["v1.4.0"]
    head:
      type: string
      pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
      maxLength: 255
      title: Head
      description: The branch, tag or commit sha to compare to, e.g. main.
      examples: ["main"]
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 100
      title: Commits per page
      description: How many commits to return, 1 to 100.
      examples: [50]
    page:
      type: integer
      minimum: 1
      maximum: 100
      default: 1
      title: Page
      description: Which page of commits, from 1 (the oldest).
      examples: [2]
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: GET
  path: /repos/{{ params.owner }}/{{ params.repo }}/compare/{{ params.base }}...{{ params.head }}
  query:
    per_page: "{{ params.limit }}"
    page: "{{ params.page }}"
  # The body carries up to 300 changed files with their patches.
  max_response_bytes: 10485760
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: >-
    {"status": response.status,
     "ahead_by": response.ahead_by,
     "behind_by": response.behind_by,
     "total_commits": response.total_commits,
     "merge_base_sha": response.?merge_base_commit.?sha.orValue(null),
     "html_url": response.?html_url.orValue(null),
     "commits": response.?commits.orValue([]).map(c, {
        "sha": c.sha,
        "author": c.?author.?login.orValue(null),
        "message": cel.bind(line, c.?commit.?message.orValue("").split("\n")[0].trim(),
                            line.size() > 300 ? line.substring(0, 300) : line)}),
     "has_more": double(params.page) * double(params.limit) < double(response.total_commits)}
  schema:
    type: object
    properties:
      status: { type: string, description: "ahead, behind, diverged or identical: head relative to base." }
      ahead_by: { type: integer, description: How many commits head has that base lacks. }
      behind_by: { type: integer, description: How many commits base has that head lacks. }
      total_commits: { type: integer, description: The commits head has that base lacks, across every page. }
      merge_base_sha: { type: [string, "null"], description: The newest commit both share. }
      html_url: { type: [string, "null"] }
      commits:
        type: array
        description: One page of the commits head has that base lacks, oldest first.
        items:
          type: object
          properties:
            sha: { type: string }
            author: { type: [string, "null"], description: "The author's login; null when the commit's email matches no GitHub account." }
            message: { type: string, description: "The message's first line, at most 300 characters." }
      has_more: { type: boolean, description: Whether a later page holds more commits. }
