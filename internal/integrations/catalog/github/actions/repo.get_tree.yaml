# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
id: repo.get_tree
display_name: List repository files
summary: Every file path in a repository, or under one directory, at a branch, tag or commit.
description: >-
  List the repository's files recursively from its git tree, with no
  checkout: each entry's full path, type (blob is a file, tree a
  directory, commit a submodule) and size. Pass path to list only one
  directory, which a large repository needs: results longer than about
  30,000 characters are cut short. truncated is true when the tree is
  larger than GitHub returns at once (100,000 entries). Omit ref for the
  default branch.
keywords: [tree, files, list, paths, structure, layout, find file, ls]
placement: server
mutates: false
tool:
  expose: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    ref: { $ref: ../schemas/git_ref.yaml }
    path:
      type: string
      pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
      maxLength: 4096
      title: Directory
      description: Only entries under this directory, from the repository root. Omit for the whole repository.
      examples: ["internal/llm"]
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: GET
  # A directory is the tree-ish <ref>:<path>, so GitHub walks only that
  # subtree; its entries' paths are relative to it, and the output puts
  # the directory back in front.
  path: >-
    /repos/{{ params.owner }}/{{ params.repo }}/git/trees/{{ params.?ref.orValue('HEAD') +
    (params.?path.hasValue() ? ':' + params.path : '') }}
  query: { recursive: "1" }
  # GitHub serves up to 7 MB of tree before it truncates.
  max_response_bytes: 10485760
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: >-
    {"sha": response.sha,
     "truncated": response.?truncated.orValue(false),
     "entries": response.tree.map(e, {
       "path": params.?path.hasValue() ? params.path + '/' + e.path : e.path,
       "type": e.type,
       "size": e.?size.orValue(null)})}
  schema:
    type: object
    properties:
      sha: { type: string, description: The tree's SHA. }
      truncated: { type: boolean, description: GitHub returned only part of a very large tree. }
      entries:
        type: array
        items:
          type: object
          properties:
            path: { type: string }
            type: { type: string, enum: [blob, tree, commit] }
            size: { type: [integer, "null"], description: A file's size in bytes; null for a directory. }
