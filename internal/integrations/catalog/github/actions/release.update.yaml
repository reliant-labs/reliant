# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
#
# Editing or publishing a release (a draft becomes public with draft: false).
# Needs Contents (write). Workflow-only, as release.create is: no `tool:` block.
id: release.update
display_name: Update release
summary: Edit a release's notes, title or tag, or publish a draft.
description: >-
  Edit a release by its id (release.create returns it). Only the fields you
  pass change; pass at least one. draft false publishes a draft, which creates
  its tag from target_commitish if the tag does not exist yet. Changing
  tag_name points the release at another tag. Returns the release's id, node
  id, URL and tag.
keywords: [release, publish, edit, update, draft, notes, tag]
placement: server
mutates: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, release_id]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    release_id:
      type: integer
      minimum: 1
      title: Release id
      description: The release's numeric id, from release.create.
      examples: [1234567]
    tag_name:
      type: string
      minLength: 1
      maxLength: 255
      title: Tag
      description: Move the release to this tag. Omit to keep it.
      examples: ["v1.5.0"]
    target_commitish:
      type: string
      minLength: 1
      maxLength: 255
      title: Target
      description: The branch or full commit sha a tag that does not exist yet is created from. Omit to keep it.
      examples: ["main"]
    name:
      type: string
      maxLength: 1024
      title: Title
      description: Replaces the title. Omit to keep it.
      examples: ["v1.5.0"]
    body:
      type: string
      maxLength: 125000
      title: Notes
      description: Replaces the release notes, in GitHub-flavored markdown. Omit to keep them.
      examples: ["## What's new\n\n- Retries on save (#42)"]
    draft:
      type: boolean
      title: Draft
      description: false publishes a draft; true unpublishes a release.
    prerelease:
      type: boolean
      title: Pre-release
      description: Mark or unmark it as a pre-release.
    make_latest:
      type: string
      enum: ["true", "false", legacy]
      title: Make latest
      description: Whether it becomes the latest release; legacy picks the newest by creation date and semantic version.
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: PATCH
  path: /repos/{{ params.owner }}/{{ params.repo }}/releases/{{ params.release_id }}
  # Absent params are left out, not sent as null.
  body_expr: >-
    {?"tag_name": params.?tag_name,
     ?"target_commitish": params.?target_commitish,
     ?"name": params.?name,
     ?"body": params.?body,
     ?"draft": params.?draft,
     ?"prerelease": params.?prerelease,
     ?"make_latest": params.?make_latest}
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: { $ref: ../schemas/release_select.yaml }
  schema: { $ref: ../schemas/release_schema.yaml }
