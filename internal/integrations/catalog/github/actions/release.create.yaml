# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
#
# Publishing a release is the ship step's record: it tags a commit and, unless
# it is a draft, notifies every watcher of the repository. Needs Contents
# (write). Workflow-only, like pr.merge and check_run.create: no `tool:` block,
# so no agent can call it as a tool. Exposing it later is additive; withdrawing
# an exposed tool would not be.
id: release.create
display_name: Create release
summary: Publish a release (or save a draft) for a tag, creating the tag if needed.
description: >-
  Create a GitHub release for tag_name. When the tag does not exist yet GitHub
  creates it from target_commitish (a branch or commit sha; the default branch
  when omitted). draft saves it unpublished, which creates no tag until it is
  published; prerelease marks it as not ready for production.
  generate_release_notes has GitHub write the notes from the pull requests
  merged since the previous release, after any body given. make_latest
  (true, false or legacy) says whether it becomes the repository's latest
  release. GitHub answers 422 when a release for the tag already exists.
  Returns the release's id, node id, URL and tag.
keywords: [release, publish, ship, tag, version, changelog, release notes]
placement: server
mutates: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, tag_name]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    tag_name:
      type: string
      minLength: 1
      maxLength: 255
      title: Tag
      description: The release's tag, created from target_commitish when it does not exist.
      examples: ["v1.5.0"]
    target_commitish:
      type: string
      minLength: 1
      maxLength: 255
      title: Target
      description: The branch or full commit sha a new tag is created from. Ignored when the tag exists. Defaults to the default branch.
      examples: ["main", "6dcb09b5b57875f334f61aebed695e2e4193db5e"]
    name:
      type: string
      maxLength: 1024
      title: Title
      description: The release's title. Defaults to the tag.
      examples: ["v1.5.0"]
    body:
      type: string
      maxLength: 125000
      title: Notes
      description: The release notes, in GitHub-flavored markdown.
      examples: ["## What's new\n\n- Retries on save (#42)"]
    draft:
      type: boolean
      title: Draft
      description: Save the release unpublished. Defaults to false.
    prerelease:
      type: boolean
      title: Pre-release
      description: Mark it as a pre-release. Defaults to false.
    generate_release_notes:
      type: boolean
      title: Generate notes
      description: Have GitHub write notes from the pull requests merged since the previous release, appended to body.
    make_latest:
      type: string
      enum: ["true", "false", legacy]
      title: Make latest
      description: >-
        Whether it becomes the latest release: true (GitHub's default for a
        published, non-pre-release), false, or legacy (the newest by creation
        date and semantic version).
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: POST
  path: /repos/{{ params.owner }}/{{ params.repo }}/releases
  # Absent params are left out, so GitHub's defaults apply.
  body_expr: >-
    {"tag_name": params.tag_name,
     ?"target_commitish": params.?target_commitish,
     ?"name": params.?name,
     ?"body": params.?body,
     ?"draft": params.?draft,
     ?"prerelease": params.?prerelease,
     ?"generate_release_notes": params.?generate_release_notes,
     ?"make_latest": params.?make_latest}
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: { $ref: ../schemas/release_select.yaml }
  schema: { $ref: ../schemas/release_schema.yaml }
