# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
#
# What a ship step must satisfy before it pushes or merges: the rules every
# active ruleset (repository and organization) applies to one branch. Needs
# only GitHub's Metadata (read) permission, which every App installation has.
# The branch name is one percent-escaped path segment (GitHub decodes %2F); its
# pattern refuses empty, "." and ".." segments, as git_ref.yaml's does.
id: branch.rules
display_name: Get branch rules
summary: The rules active rulesets apply to one branch.
description: >-
  List every rule that applies to a branch from the repository's and its
  organization's active rulesets: required status checks, required reviews,
  the merge queue, linear history, restricted pushes and so on. Each rule has
  its type, its parameters (the required check contexts, the approving review
  count, ...) and the ruleset it comes from. Rulesets in evaluate or disabled
  mode are not listed, and neither is classic branch protection: branch.get's
  protected says whether either applies. Follows GitHub's pagination up to
  1000 rules.
keywords: [branch, rules, ruleset, protection, required checks, required reviews, merge queue]
placement: server
mutates: false
tool:
  expose: true
params:
  type: object
  additionalProperties: false
  required: [owner, repo, branch]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    branch:
      type: string
      pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
      maxLength: 255
      title: Branch
      description: The branch's name, without refs/heads/ and without wildcards.
      examples: ["main"]
    connection: { $ref: ../schemas/connection.yaml }
request:
  method: GET
  path: /repos/{{ params.owner }}/{{ params.repo }}/rules/branches/{{ params.branch }}
  query:
    per_page: "100"
  pagination: { style: link_header, max_pages: 10 }
  max_response_bytes: 5242880
  errors: { $ref: ../schemas/github_errors.yaml }
output:
  select: >-
    response.map(r, {"type": r.type,
                     "parameters": r.?parameters.orValue(null),
                     "ruleset_id": r.?ruleset_id.orValue(null),
                     "ruleset_source_type": r.?ruleset_source_type.orValue(null),
                     "ruleset_source": r.?ruleset_source.orValue(null)})
  schema:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              description: >-
                The rule: required_status_checks, pull_request, merge_queue,
                required_linear_history, non_fast_forward, deletion, update,
                required_signatures, ...
            parameters:
              type: [object, "null"]
              description: >-
                The rule's settings as GitHub sends them, e.g.
                required_status_checks' required_status_checks list of
                {context, integration_id} or pull_request's
                required_approving_review_count.
            ruleset_id: { type: [integer, "null"] }
            ruleset_source_type: { type: [string, "null"], description: Repository or Organization. }
            ruleset_source: { type: [string, "null"], description: "The owner/repo or organization the ruleset belongs to." }
