# yaml-language-server: $schema=../../../manifest/schema/action.schema.json
id: pr.enqueue
display_name: Enqueue pull request
summary: Request GitHub's normal native merge queue for an exact pull request head.
description: >-
  Enqueue an open, non-draft, same-repository pull request targeting the default
  branch with its native merge queue enabled. repository_id and expectedHeadOid
  must match authenticated current GitHub facts. Forks are deliberately refused
  initially. Returns accepted queue entry identity and position, not a merge or
  auto-merge flag. GitHub permissions and required checks remain authoritative;
  this action does not verify reviewer App identity or attest a trusted review.
  A private coordinator must validate its server-owned review before calling.
  Private organization repositories require GitHub Enterprise Cloud for native
  queue availability. No direct merge, queue jumping or protection bypass.
  Unknown mutation outcomes are reconciled by reading membership, not replayed
  blindly. Retrying starts with another authenticated membership/head read.
keywords: [pull request, pr, enqueue, merge queue, github]
placement: server
mutates: true
tool:
  expose: true
executor: go:github.pr_enqueue
params:
  type: object
  additionalProperties: false
  required: [owner, repo, repository_id, pull_number, expectedHeadOid]
  properties:
    owner: { $ref: ../schemas/owner.yaml }
    repo: { $ref: ../schemas/repo.yaml }
    repository_id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      title: Repository ID
      description: GitHub numeric ID of the target repository, not a node ID.
      examples: [123456789]
    pull_number:
      type: integer
      minimum: 1
      maximum: 2147483647
      title: Pull request number
      description: The pull request number in that repository.
      examples: [42]
    expectedHeadOid:
      type: string
      pattern: '^[0-9a-f]{40}$'
      title: Expected head SHA
      description: Exact expected current source commit SHA; changed heads fail stale.
      examples: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
    connection: { $ref: ../schemas/connection.yaml }
output:
  schema:
    type: object
    properties:
      outcome: { type: string }
      accepted: { type: boolean }
      queue_entry_id: { type: string }
      position: { type: integer }
      already_queued: { type: boolean }
      retry_after_seconds:
        type: integer
        minimum: 1
        maximum: 3600
