type: object
properties:
  id: { type: integer, description: "The release's id: pass it to release.update." }
  node_id: { type: [string, "null"] }
  html_url: { type: string }
  tag_name: { type: string }
  name: { type: [string, "null"] }
  target_commitish: { type: [string, "null"], description: The branch or commit the tag is created from when it does not exist yet. }
  draft: { type: boolean }
  prerelease: { type: boolean }
  created_at: { type: [string, "null"] }
  published_at: { type: [string, "null"], description: Null while the release is a draft. }
