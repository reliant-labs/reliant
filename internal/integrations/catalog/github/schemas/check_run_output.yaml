type: object
additionalProperties: false
required: [title, summary]
title: Output
description: What the check's details page shows. title and summary are required together.
examples: [{ title: "Passed (MEDIUM): no blockers", summary: "One pass on GPT-6 Luna; nothing blocking." }]
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
    title: Title
    description: One line, shown beside the check's name.
    examples: ["Passed (HIGH): two passes, no blockers"]
  summary:
    type: string
    minLength: 1
    maxLength: 65535
    title: Summary
    description: The details in GitHub-flavored markdown.
  text:
    type: string
    maxLength: 65535
    title: Text
    description: More markdown below the summary.
  annotations:
    type: array
    maxItems: 50
    title: Annotations
    description: >-
      Up to 50 line comments, shown on the check and in the pull request's
      diff. GitHub appends each update's annotations to those already sent,
      so send more than 50 as several updates.
    items:
      type: object
      additionalProperties: false
      required: [path, start_line, end_line, annotation_level, message]
      properties:
        path: { type: string, minLength: 1, description: "The file, relative to the repository root." }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        start_column: { type: integer, minimum: 1, description: Only when start_line equals end_line. }
        end_column: { type: integer, minimum: 1, description: Only when start_line equals end_line. }
        annotation_level: { type: string, enum: [notice, warning, failure] }
        message: { type: string, minLength: 1, maxLength: 65536 }
        title: { type: string, maxLength: 255 }
        raw_details: { type: string, maxLength: 65536 }
