# yaml-language-server: $schema=../../manifest/schema/manifest.schema.json
# GitHub. Authored from GitHub's REST and OAuth documentation
# (docs.github.com/en/rest, API version 2022-11-28, and
# docs.github.com/en/apps/oauth-apps).
#
# Auth methods, most preferred first:
#   1. delegated: hosted deployments. control-plane owns the one GitHub App and
#      each user's App user token; the worker asks it for the run owner's
#      current token at call time (internal/integrations/ghdelegated). No
#      connection row is stored.
#   2. oauth2: self-hosted deployments with their own GitHub App, configured
#      with RELIANT_OAUTH_GITHUB_CLIENT_ID / _CLIENT_SECRET. A GitHub App's
#      permissions live on the App, so no scope is requested.
#   3. api_key: a fine-grained personal access token, sent as a bearer token.
#
# Access is the App's permissions intersected with what the user can see, and
# only on repositories the App is installed on: GitHub answers a repository the
# App cannot reach with 404, not 403, so the 404 message says so.
#
# Every action shares one error vocabulary (the `errors` list is repeated per
# action because a manifest has no shared rule set):
#   401          bad or revoked token: reconnect.
#   403/429 + rate-limit signal: retryable. GitHub signals a primary limit with
#                `x-ratelimit-remaining: 0` (retry after x-ratelimit-reset) and
#                a secondary limit with `retry-after` or a "rate limit" message.
#   403 otherwise: permission (the App lacks it, or the user's role does);
#                not retryable.
#   404          not found, or not visible to this connection.
#   410          the repository has the feature (issues) disabled.
#   422          validation; the message lists GitHub's `errors[]`.
#   5xx          retryable (the runner's default).
#
# Path params (owner, repo, workflow) carry a `pattern` so a value can never
# be a dot segment or contain a slash: interpolated path values are
# percent-escaped, but "." and ".." survive escaping.
id: github
version: 1
display_name: GitHub
description: Act on GitHub repositories, issues and pull requests as the connected user.
icon: github
category: engineering
keywords: [git, repository, issues, pull requests, code]

connection:
  base_url: https://api.github.com
  default_headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
  auth:
    - delegated: { broker: controlplane-github }
    - oauth2:
        authorize_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        revoke:
          method: DELETE
          url: "https://api.github.com/applications/{{ client_id }}/token"
          client_auth: basic
          token_in: json
          token_param: access_token
    - api_key:
        in: header
        name: Authorization
        prefix: "Bearer "
        label: Personal access token
  probe:
    path: /user
    external_id: string(response.id)
    label: response.login
    # The person, as trigger.sender.id names them: the numeric user id, which
    # GitHub never changes or reuses. Never the login (the label above): a
    # login can be renamed and then registered by someone else.
    sender_id: string(response.id)

# Actions are one file each under actions/, named by action id. Events (the
# `triggers:` list) are one file each under events/. Pieces shared between files
# are under schemas/ and reached with `$ref: <relative path>.yaml`; see
# internal/integrations/manifest/assemble.go.
#
# Triggers: what starts a run from GitHub. Delivered by the app-level webhook
# (internal/integrations/webhook/github) at <PUBLIC_URL>/integrations/github/events,
# verified with RELIANT_GITHUB_WEBHOOK_SECRET.
#
# Routing is access-gated. An event reaches a trigger only when its owner's own
# GitHub token recently reported the event's repository as visible
# (GET /user/installations/{id}/repositories), so a member of an org
# installation never sees events from that org's repositories they cannot
# see. `events` are the provider's event types; `attributes` are what an
# IntegrationSource `match:` can require, and every event of a trigger sets
# each of them. `data` is trigger.payload.data: a trimmed copy of GitHub's
# webhook body, untrusted, with long text capped at 16 KiB. Each `data` is
# closed (additionalProperties: false) at its top level, so a filter that reads
# a key the event never carries (`data.issue` on an inline diff comment) is a
# validation error, not a run that fails on every event.

actions:
  - $ref: actions/user.get.yaml
  - $ref: actions/issue.create.yaml
  - $ref: actions/issue.get.yaml
  - $ref: actions/issue.comment.yaml
  - $ref: actions/issue.update.yaml
  - $ref: actions/issue.comment.update.yaml
  - $ref: actions/issue.comment.list.yaml
  - $ref: actions/issue.labels.add.yaml
  - $ref: actions/issue.labels.remove.yaml
  - $ref: actions/labels.create.yaml
  - $ref: actions/labels.list.yaml
  - $ref: actions/issue.search.yaml
  - $ref: actions/pr.get.yaml
  - $ref: actions/pr.list_files.yaml
  - $ref: actions/pr.review.create.yaml
  - $ref: actions/pr.create.yaml
  - $ref: actions/pr.update.yaml
  - $ref: actions/pr.reviews.list.yaml
  - $ref: actions/pr.review_comments.list.yaml
  - $ref: actions/pr.review_comment.reply.yaml
  - $ref: actions/repo.list_for_user.yaml
  - $ref: actions/app.installations.list.yaml
  - $ref: actions/app.installation_repositories.list.yaml
  - $ref: actions/users.search.yaml
  - $ref: actions/user.get_by_id.yaml
  - $ref: actions/repo.get.yaml
  - $ref: actions/branch.get.yaml
  - $ref: actions/repo.get_content.yaml
  - $ref: actions/repo.get_tree.yaml
  - $ref: actions/code.search.yaml
  - $ref: actions/workflow.dispatch.yaml

triggers:
  - $ref: events/issue.opened.yaml
  - $ref: events/issue.closed.yaml
  - $ref: events/issue.edited.yaml
  - $ref: events/issue.labeled.yaml
  - $ref: events/issue.unlabeled.yaml
  - $ref: events/issue.reopened.yaml
  - $ref: events/issue.assigned.yaml
  - $ref: events/issue_comment.created.yaml
  - $ref: events/pull_request.opened.yaml
  - $ref: events/pull_request.synchronize.yaml
  - $ref: events/pull_request.closed.yaml
  - $ref: events/pull_request.ready_for_review.yaml
  - $ref: events/pull_request.reopened.yaml
  - $ref: events/pull_request.labeled.yaml
  - $ref: events/pull_request.unlabeled.yaml
  - $ref: events/pull_request.review_requested.yaml
  - $ref: events/pull_request_review.submitted.yaml
  - $ref: events/pull_request_review_comment.created.yaml
  - $ref: events/push.received.yaml
  - $ref: events/workflow_run.completed.yaml
  - $ref: events/check_run.completed.yaml
  - $ref: events/check_suite.completed.yaml
  - $ref: events/pull_request.auto_merge_disabled.yaml
  - $ref: events/pull_request.dequeued.yaml
