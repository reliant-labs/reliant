# GitHub. Authored from GitHub's REST and OAuth documentation
# (docs.github.com/en/rest, API version 2022-11-28, and
# docs.github.com/en/apps/oauth-apps).
#
# Auth methods, most preferred first:
#   1. delegated: hosted deployments. control-plane owns the one GitHub App and
#      each user's App user token; the worker asks it for the run owner's
#      current token at call time (internal/integrations/ghdelegated). No
#      connection row is stored.
#   2. oauth2: self-hosted deployments with their own GitHub App, configured
#      with RELIANT_OAUTH_GITHUB_CLIENT_ID / _CLIENT_SECRET. A GitHub App's
#      permissions live on the App, so no scope is requested.
#   3. api_key: a fine-grained personal access token, sent as a bearer token.
#
# Access is the App's permissions intersected with what the user can see, and
# only on repositories the App is installed on: GitHub answers a repository the
# App cannot reach with 404, not 403, so the 404 message says so.
#
# Every action shares one error vocabulary (the `errors` list is repeated per
# action because a manifest has no shared rule set):
#   401          bad or revoked token: reconnect.
#   403/429 + rate-limit signal: retryable. GitHub signals a primary limit with
#                `x-ratelimit-remaining: 0` (retry after x-ratelimit-reset) and
#                a secondary limit with `retry-after` or a "rate limit" message.
#   403 otherwise: permission (the App lacks it, or the user's role does);
#                not retryable.
#   404          not found, or not visible to this connection.
#   410          the repository has the feature (issues) disabled.
#   422          validation; the message lists GitHub's `errors[]`.
#   5xx          retryable (the runner's default).
#
# Path params (owner, repo, workflow) carry a `pattern` so a value can never
# be a dot segment or contain a slash: interpolated path values are
# percent-escaped, but "." and ".." survive escaping.
id: github
version: 1
display_name: GitHub
description: Act on GitHub repositories, issues and pull requests as the connected user.
icon: github
category: engineering
keywords: [git, repository, issues, pull requests, code]

connection:
  base_url: https://api.github.com
  default_headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
  auth:
    - delegated: { broker: controlplane-github }
    - oauth2:
        authorize_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        revoke:
          method: DELETE
          url: "https://api.github.com/applications/{{ client_id }}/token"
          client_auth: basic
          token_in: json
          token_param: access_token
    - api_key:
        in: header
        name: Authorization
        prefix: "Bearer "
        label: Personal access token
  probe:
    path: /user
    external_id: string(response.id)
    label: response.login
    # The person, as trigger.sender.id names them: the numeric user id, which
    # GitHub never changes or reuses. Never the login (the label above): a
    # login can be renamed and then registered by someone else.
    sender_id: string(response.id)

actions:
  - id: user.get
    display_name: Get authenticated user
    summary: The GitHub account the connection acts as.
    description: >-
      Return the GitHub user the connection authenticates as: login, id, name
      and profile URL.
    keywords: [whoami, account, profile]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      properties:
        connection:
          type: string
          description: >-
            Id of a saved GitHub connection to use. Omit to use your default
            GitHub connection.
    request:
      method: GET
      path: /user
      errors: &github_errors
        - status: 401
          retryable: false
          message: "GitHub rejected the credential ({{ response.?message.orValue('bad credentials') }}): reconnect GitHub in Settings."
        - status: 403
          when: >-
            headers[?'x-ratelimit-remaining'].orValue('') == '0' ||
            headers[?'retry-after'].hasValue() ||
            (type(response) == map && type(response.?message.orValue(null)) == string &&
             response.message.matches('(?i)rate limit'))
          retryable: true
          message: &github_rate_limited >-
            GitHub rate limit exceeded ({{ response.?message.orValue('rate limited') }}).
            {{ headers[?'retry-after'].hasValue() ? 'Retry after ' + headers['retry-after'] + ' seconds.' :
               headers[?'x-ratelimit-remaining'].orValue('') == '0' && headers[?'x-ratelimit-reset'].hasValue() ?
               'Retry after ' + string(timestamp(int(headers['x-ratelimit-reset']))) + '.' :
               'Retry after at least 60 seconds.' }}
        - status: 429
          retryable: true
          message: *github_rate_limited
        - status: 403
          retryable: false
          message: >-
            GitHub refused the request: {{ response.?message.orValue('forbidden') }}.
            The connection lacks permission for this action (the GitHub App's
            permissions, its installation, or your role on the repository).
        - status: 404
          retryable: false
          message: >-
            GitHub returned not found: the resource does not exist, or this
            connection cannot see it (is the Reliant GitHub App installed on the
            repository?).
        - status: 410
          retryable: false
          message: "GitHub returned gone: {{ response.?message.orValue('this feature is disabled for the repository') }}."
        - status: 422
          retryable: false
          message: >-
            GitHub validation failed: {{ response.?message.orValue('Validation Failed') }}.
            Errors: {{ type(response) == map && type(response.?errors.orValue(null)) == list ?
              response.errors.map(e, type(e) == string ? e :
                (type(e.?field.orValue(null)) == string ? e.field + ': ' : '') +
                (type(e.?message.orValue(null)) == string ? e.message :
                 type(e.?code.orValue(null)) == string ? e.code : 'invalid')) : [] }}
    output:
      select: >-
        {"login": response.login,
         "id": response.?id.orValue(null),
         "name": response.?name.orValue(null),
         "html_url": response.?html_url.orValue(null)}
      schema:
        type: object
        properties:
          login: { type: string }
          id: { type: integer }
          name: { type: [string, "null"] }
          html_url: { type: [string, "null"] }

  # ---------------------------------------------------------------- issues

  - id: issue.create
    display_name: Create issue
    summary: Open a new issue in a repository.
    description: >-
      Open an issue in owner/repo with a title and optional markdown body,
      labels and assignees. Labels that do not exist are created; an assignee
      without access to the repository fails validation. Returns the issue
      number, id, node id and URL.
    keywords: [issue, open, file, bug, ticket, report]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, title]
      properties:
        owner: &owner
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"
          title: Repository owner
          description: The user or organization that owns the repository, the first part of owner/repo.
          examples: ["octocat"]
        repo: &repo
          type: string
          # Letters, digits, ., -, _ with at least one that is not a dot.
          pattern: "^[A-Za-z0-9._-]*[A-Za-z0-9_-][A-Za-z0-9._-]*$"
          maxLength: 100
          title: Repository name
          description: The repository's name without the owner or .git, the second part of owner/repo.
          examples: ["hello-world"]
        title:
          type: string
          minLength: 1
          title: Title
          description: The issue's title.
          examples: ["Login page loops back to sign-in after SSO"]
        body:
          type: string
          title: Body
          description: The issue's description, in GitHub-flavored markdown.
          examples: ["Steps to reproduce:\n1. Sign in with SSO\n2. Land back on /login"]
        labels:
          type: array
          items: { type: string }
          title: Labels
          description: Label names to apply; labels that do not exist yet are created.
          examples: [["bug", "needs-triage"]]
        assignees:
          type: array
          items: { type: string }
          title: Assignees
          description: GitHub usernames to assign, without the @.
          examples: [["octocat"]]
        connection: &connection
          type: string
          description: >-
            Id of a saved GitHub connection to use. Omit to use your default
            GitHub connection.
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues
      body_expr: >-
        {"title": params.title,
         ?"body": params.?body,
         ?"labels": params.?labels,
         ?"assignees": params.?assignees}
      errors: *github_errors
    output:
      select: >-
        {"number": response.number,
         "id": response.id,
         "node_id": response.?node_id.orValue(null),
         "title": response.title,
         "state": response.state,
         "html_url": response.html_url}
      schema:
        type: object
        properties:
          number: { type: integer, description: The issue number within the repository. }
          id: { type: integer }
          node_id: { type: [string, "null"] }
          title: { type: string }
          state: { type: string }
          html_url: { type: string }

  - id: issue.get
    display_name: Get issue
    summary: Read an issue (or a pull request's conversation) by number.
    description: >-
      Return one issue: title, body, state, author, labels, assignees and
      timestamps. Pull requests are issues too; is_pull_request says which.
    keywords: [issue, read, fetch, details, ticket]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number]
      properties:
        owner: *owner
        repo: *repo
        issue_number: &issue_number
          type: integer
          minimum: 1
          title: Issue number
          description: The issue's number as shown after the # (a pull request's number works too).
          examples: [42]
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}
      errors: *github_errors
    output:
      select: >-
        {"number": response.number,
         "id": response.id,
         "title": response.title,
         "body": response.?body.orValue(null),
         "state": response.state,
         "state_reason": response.?state_reason.orValue(null),
         "locked": response.?locked.orValue(false),
         "comments": response.?comments.orValue(0),
         "html_url": response.html_url,
         "user": response.?user.?login.orValue(null),
         "labels": type(response.?labels.orValue(null)) == list ?
           response.labels.map(l, type(l) == string ? l : l.name) : [],
         "assignees": type(response.?assignees.orValue(null)) == list ?
           response.assignees.map(a, a.login) : [],
         "is_pull_request": response.?pull_request.orValue(null) != null,
         "created_at": response.?created_at.orValue(null),
         "updated_at": response.?updated_at.orValue(null),
         "closed_at": response.?closed_at.orValue(null)}
      schema:
        type: object
        properties:
          number: { type: integer }
          id: { type: integer }
          title: { type: string }
          body: { type: [string, "null"] }
          state: { type: string, enum: [open, closed] }
          state_reason: { type: [string, "null"] }
          locked: { type: boolean }
          comments: { type: integer }
          html_url: { type: string }
          user: { type: [string, "null"], description: The author's login (null for a deleted account). }
          labels: { type: array, items: { type: string } }
          assignees: { type: array, items: { type: string } }
          is_pull_request: { type: boolean }
          created_at: { type: [string, "null"] }
          updated_at: { type: [string, "null"] }
          closed_at: { type: [string, "null"] }

  - id: issue.comment
    display_name: Comment on issue or pull request
    summary: Add a comment to an issue or a pull request's conversation.
    description: >-
      Post a markdown comment on an issue, or on a pull request's conversation
      tab (pull requests share the issue comments API; pass the PR number as
      issue_number). For a review with a verdict, use pr.review.create.
    keywords: [comment, reply, issue, pull request, pr, discussion]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number, body]
      properties:
        owner: *owner
        repo: *repo
        issue_number: *issue_number
        body:
          type: string
          minLength: 1
          title: Comment
          description: The comment to post, in GitHub-flavored markdown.
          examples: ["Thanks! Reproduced on main; a fix is in #57."]
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}/comments
      body_expr: '{"body": params.body}'
      errors: *github_errors
    output:
      select: >-
        {"id": response.id,
         "node_id": response.?node_id.orValue(null),
         "html_url": response.html_url,
         "created_at": response.?created_at.orValue(null)}
      schema:
        type: object
        properties:
          id: { type: integer }
          node_id: { type: [string, "null"] }
          html_url: { type: string }
          created_at: { type: [string, "null"] }

  - id: issue.update
    display_name: Update issue
    summary: Change an issue's state, labels, assignees, title or body.
    description: >-
      Edit an issue (or a pull request's issue fields). Only the fields you
      pass change; pass at least one. labels and assignees REPLACE the current
      set; pass an empty list to clear them. Close with state closed and an
      optional state_reason.
    keywords: [issue, edit, close, reopen, label, assign, triage]
    placement: server
    mutates: true
    tool:
      expose: true
    # The params stay a plain object schema (no anyOf / if-then): it is also
    # the agent tool's input schema, and model providers reject or rewrite
    # top-level combinators. An update naming no field sends `{}`, which
    # GitHub answers with the unchanged issue.
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number]
      properties:
        owner: *owner
        repo: *repo
        issue_number: *issue_number
        title:
          type: string
          minLength: 1
          title: New title
          description: Replaces the issue's title. Omit to keep it.
          examples: ["Login page loops back to sign-in after SSO"]
        body:
          type: string
          title: New body
          description: Replaces the issue's description, in GitHub-flavored markdown. Omit to keep it.
          examples: ["Fixed in #57; closing."]
        state:
          type: string
          enum: [open, closed]
          title: State
          description: Open or close the issue.
        state_reason:
          type: string
          enum: [completed, not_planned, reopened]
          title: State reason
          description: Why the state changed; only sent along with State.
        labels:
          type: array
          items: { type: string }
          title: Labels
          description: The complete new set of label names. It replaces the current labels, so include any to keep.
          examples: [["bug", "fixed"]]
        assignees:
          type: array
          items: { type: string }
          title: Assignees
          description: The complete new set of GitHub usernames to assign. It replaces the current assignees.
          examples: [["octocat"]]
        connection: *connection
    request:
      method: PATCH
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}
      # Absent params are left out, not sent as null: a null body clears it.
      body_expr: >-
        {?"title": params.?title,
         ?"body": params.?body,
         ?"state": params.?state,
         ?"state_reason": params.?state.hasValue() ? params.?state_reason : optional.none(),
         ?"labels": params.?labels,
         ?"assignees": params.?assignees}
      errors: *github_errors
    output:
      select: >-
        {"number": response.number,
         "id": response.id,
         "node_id": response.?node_id.orValue(null),
         "title": response.title,
         "state": response.state,
         "state_reason": response.?state_reason.orValue(null),
         "html_url": response.html_url,
         "labels": type(response.?labels.orValue(null)) == list ?
           response.labels.map(l, type(l) == string ? l : l.name) : [],
         "assignees": type(response.?assignees.orValue(null)) == list ?
           response.assignees.map(a, a.login) : []}
      schema:
        type: object
        properties:
          number: { type: integer }
          id: { type: integer }
          node_id: { type: [string, "null"] }
          title: { type: string }
          state: { type: string, enum: [open, closed] }
          state_reason: { type: [string, "null"] }
          html_url: { type: string }
          labels: { type: array, items: { type: string } }
          assignees: { type: array, items: { type: string } }

  - id: issue.comment.update
    display_name: Edit issue or pull request comment
    summary: Replace the text of an existing comment on an issue or a pull request's conversation.
    description: >-
      Edit a comment by id. body REPLACES the whole text, so read the current
      one first (issue.comment.list) to change part of it. The id is what
      issue.comment, issue.comment.list or an issue_comment.created event
      gives; pull request conversation comments are issue comments too.
      Inline diff comments (on a line of the diff) are a different resource
      and cannot be edited here. The connection's account can edit only
      comments it may edit on GitHub. Returns the comment's id, node id and
      URL.
    keywords: [comment, edit, update, change, rewrite, status comment, issue, pull request]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, comment_id, body]
      properties:
        owner: *owner
        repo: *repo
        comment_id: &comment_id
          type: integer
          minimum: 1
          title: Comment id
          description: The comment's numeric id (the number after issuecomment- in its URL).
          examples: [555]
        body:
          type: string
          minLength: 1
          title: New text
          description: The comment's new text, in GitHub-flavored markdown. It replaces the current text.
          examples: ["Status: fix is up in #57."]
        connection: *connection
    request:
      method: PATCH
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/comments/{{ params.comment_id }}
      body_expr: '{"body": params.body}'
      errors: *github_errors
    output:
      select: >-
        {"id": response.id,
         "node_id": response.?node_id.orValue(null),
         "html_url": response.html_url,
         "updated_at": response.?updated_at.orValue(null)}
      schema:
        type: object
        properties:
          id: { type: integer }
          node_id: { type: [string, "null"] }
          html_url: { type: string }
          updated_at: { type: [string, "null"] }

  - id: issue.comment.list
    display_name: List issue or pull request comments
    summary: Read the conversation comments on an issue or pull request, optionally only those changed since a time.
    description: >-
      List the comments on an issue, or on a pull request's conversation tab
      (pass the PR number as issue_number), oldest first. Pass since, an ISO
      8601 time such as 2026-01-02T03:04:05Z, to get only comments created or
      edited after it, so a recurring run reads what is new. Follows GitHub's
      pagination up to 1000 comments; narrow with since for busier threads.
      Each comment carries its id, node id, author login and numeric user id.
      Inline diff comments are listed by pr.review_comments.list and review
      summaries by pr.reviews.list.
    keywords: [comment, comments, list, read, thread, conversation, since, new, issue, pull request]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number]
      properties:
        owner: *owner
        repo: *repo
        issue_number: *issue_number
        since: &since
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$"
          title: Since
          description: Only comments updated at or after this ISO 8601 time. Omit for every comment.
          examples: ["2026-01-02T03:04:05Z"]
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}/comments
      query: { per_page: "100" }
      query_expr: '{?"since": params.?since}'
      pagination: { style: link_header, max_pages: 10 }
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        response.map(c, {"id": c.id,
                         "node_id": c.?node_id.orValue(null),
                         "body": type(c.?body.orValue(null)) == string ? c.body : "",
                         "html_url": c.html_url,
                         "user": c.?user.?login.orValue(null),
                         "user_id": c.?user.?id.orValue(null),
                         "author_association": c.?author_association.orValue(null),
                         "created_at": c.?created_at.orValue(null),
                         "updated_at": c.?updated_at.orValue(null)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                node_id: { type: [string, "null"] }
                body: { type: string }
                html_url: { type: string }
                user: { type: [string, "null"], description: The author's login (null for a deleted account). }
                user_id: { type: [integer, "null"], description: The author's numeric user id, which is never reused. }
                author_association: { type: [string, "null"] }
                created_at: { type: [string, "null"] }
                updated_at: { type: [string, "null"] }

  - id: issue.labels.add
    display_name: Add a label to an issue or pull request
    summary: Add one label without touching the others (atomic, unlike issue.update).
    description: >-
      Add a single label to an issue or pull request. This is one request that
      GitHub applies on its own, so it cannot overwrite a label someone else
      added at the same moment; issue.update with labels replaces the whole
      list and can. A label that does not exist in the repository is created;
      adding one the issue already has changes nothing. Returns the issue's
      labels after the change.
    keywords: [label, add, tag, mark, triage, issue, pull request, atomic]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number, label]
      properties:
        owner: *owner
        repo: *repo
        issue_number: *issue_number
        label: &label_name
          type: string
          minLength: 1
          maxLength: 50
          # At least one character that is not a dot, so the name can never be
          # the "." or ".." path segment that survives percent-escaping.
          pattern: "^.*[^.].*$"
          title: Label
          description: One label name, exactly as it is spelled on GitHub.
          examples: ["agent:in-progress"]
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}/labels
      body_expr: '{"labels": [params.label]}'
      errors: *github_errors
    output:
      select: >-
        {"added": params.label,
         "labels": response.map(l, type(l) == string ? l : l.name),
         "number": params.issue_number,
         "html_url": "https://github.com/" + params.owner + "/" + params.repo + "/issues/" + string(int(params.issue_number))}
      schema:
        type: object
        properties:
          added: { type: string }
          labels: { type: array, items: { type: string }, description: The issue's labels after the change. }
          number: { type: integer }
          html_url: { type: string, description: The issue's page (GitHub redirects it to the pull request for one). }

  - id: issue.labels.remove
    display_name: Remove a label from an issue or pull request
    summary: Remove one label without touching the others (atomic, unlike issue.update).
    description: >-
      Remove a single label from an issue or pull request. This is one request
      that GitHub applies on its own, so it cannot drop a label someone else
      added at the same moment; issue.update with labels replaces the whole
      list and can. The label stays in the repository. If the issue does not
      carry the label GitHub answers 404, and so does this action: a not found
      here can mean the label was already removed. Returns the issue's labels
      after the change.
    keywords: [label, remove, delete, untag, unmark, clear, triage, issue, pull request, atomic]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, issue_number, label]
      properties:
        owner: *owner
        repo: *repo
        issue_number: *issue_number
        label: *label_name
        connection: *connection
    request:
      method: DELETE
      path: /repos/{{ params.owner }}/{{ params.repo }}/issues/{{ params.issue_number }}/labels/{{ params.label }}
      errors: *github_errors
    output:
      select: >-
        {"removed": params.label,
         "labels": response.map(l, type(l) == string ? l : l.name),
         "number": params.issue_number,
         "html_url": "https://github.com/" + params.owner + "/" + params.repo + "/issues/" + string(int(params.issue_number))}
      schema:
        type: object
        properties:
          removed: { type: string }
          labels: { type: array, items: { type: string }, description: The issue's labels after the change. }
          number: { type: integer }
          html_url: { type: string }

  - id: labels.create
    display_name: Create a repository label
    summary: Create a label in a repository, or leave it as it is when it already exists.
    description: >-
      Create a label in a repository with a name, a six-digit hex color and an
      optional description. It is safe to run again: when the repository
      already has a label of that name (matched without regard to case) nothing
      is changed, not even its color or description, and the result says
      created is false. A setup step can therefore ensure its labels exist
      every time it runs. Creating a label needs write access to the
      repository. Returns the label's name, color and description as they are
      on GitHub when it was just created.
    keywords: [label, labels, create, ensure, setup, color, repository, idempotent, triage]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, name]
      properties:
        owner: *owner
        repo: *repo
        name:
          type: string
          minLength: 1
          maxLength: 50
          title: Name
          description: The label's name, exactly as it should be spelled on GitHub.
          examples: ["agent:ready"]
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          title: Color
          description: Six hex digits without the leading #. Omit for GitHub's default grey.
          examples: ["0e8a16"]
        description:
          type: string
          maxLength: 100
          title: Description
          description: A short description shown on hover.
          examples: ["An agent may pick this up"]
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/labels
      body_expr: >-
        {"name": params.name,
         ?"color": params.?color,
         ?"description": params.?description}
      errors:
        # GitHub answers a name the repository already has with 422 and an
        # errors entry whose code is already_exists. That is the outcome
        # asked for, so it is a success; any other 422 still fails.
        - status: 422
          accept: true
          when: >-
            type(response) == map && type(response.?errors.orValue(null)) == list &&
            response.errors.exists(e, type(e) == map && e.?code.orValue(null) == 'already_exists')
        - status: 401
          retryable: false
          message: "GitHub rejected the credential ({{ response.?message.orValue('bad credentials') }}): reconnect GitHub in Settings."
        - status: 403
          when: >-
            headers[?'x-ratelimit-remaining'].orValue('') == '0' ||
            headers[?'retry-after'].hasValue() ||
            (type(response) == map && type(response.?message.orValue(null)) == string &&
             response.message.matches('(?i)rate limit'))
          retryable: true
          message: *github_rate_limited
        - status: 429
          retryable: true
          message: *github_rate_limited
        - status: 403
          retryable: false
          message: >-
            GitHub refused the request: {{ response.?message.orValue('forbidden') }}.
            The connection lacks permission for this action (the GitHub App's
            permissions, its installation, or your role on the repository).
        - status: 404
          retryable: false
          message: >-
            GitHub returned not found: the resource does not exist, or this
            connection cannot see it (is the Reliant GitHub App installed on the
            repository?).
        - status: 410
          retryable: false
          message: "GitHub returned gone: {{ response.?message.orValue('this feature is disabled for the repository') }}."
        - status: 422
          retryable: false
          message: >-
            GitHub validation failed: {{ response.?message.orValue('Validation Failed') }}.
            Errors: {{ type(response) == map && type(response.?errors.orValue(null)) == list ?
              response.errors.map(e, type(e) == string ? e :
                (type(e.?field.orValue(null)) == string ? e.field + ': ' : '') +
                (type(e.?message.orValue(null)) == string ? e.message :
                 type(e.?code.orValue(null)) == string ? e.code : 'invalid')) : [] }}
    output:
      select: >-
        status == 201 ?
          {"name": response.name,
           "color": response.?color.orValue(null),
           "description": response.?description.orValue(null),
           "id": response.?id.orValue(null),
           "node_id": response.?node_id.orValue(null),
           "created": true}
        : {"name": params.name,
           "color": null,
           "description": null,
           "id": null,
           "node_id": null,
           "created": false}
      schema:
        type: object
        properties:
          name: { type: string }
          color: { type: [string, "null"], description: "Null when the label already existed." }
          description: { type: [string, "null"], description: "Null when the label already existed." }
          id: { type: [integer, "null"] }
          node_id: { type: [string, "null"] }
          created: { type: boolean, description: "False when the label already existed and was left as it is." }

  - id: labels.list
    display_name: List repository labels
    summary: Every label in a repository, with its color and description.
    description: >-
      List the labels defined in a repository (not the labels on one issue),
      following GitHub's pagination up to 1000 labels. Use it to check which of
      a set of labels already exist.
    keywords: [label, labels, list, repository, existing, colors]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo]
      properties:
        owner: *owner
        repo: *repo
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/labels
      query: { per_page: "100" }
      pagination: { style: link_header, max_pages: 10 }
      errors: *github_errors
    output:
      select: >-
        response.map(l, {"id": l.?id.orValue(null),
                         "node_id": l.?node_id.orValue(null),
                         "name": l.name,
                         "color": l.?color.orValue(null),
                         "description": l.?description.orValue(null),
                         "default": l.?default.orValue(false)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: [integer, "null"] }
                node_id: { type: [string, "null"] }
                name: { type: string }
                color: { type: [string, "null"] }
                description: { type: [string, "null"] }
                default: { type: boolean, description: One of GitHub's default labels. }

  - id: issue.search
    display_name: Search issues and pull requests
    summary: Find issues and pull requests with GitHub search syntax, e.g. repo:acme/app is:open "marker".
    description: >-
      Search issues and pull requests with GitHub's search syntax. Scope the
      query with repo:owner/name (or org:, user:) and narrow it with is:issue,
      is:pr, is:open, is:closed, label:"name", author:, in:title,body, or a
      quoted phrase, for example repo:acme/app is:open "autopilot:marker".
      Each hit says whether it is a pull request. Returns one page; ask for the
      next with page. GitHub returns at most the first 1,000 matches, indexes
      new items with a short delay, and allows about thirty searches a minute.
    keywords: [search, find, query, issues, pull requests, marker, existing, duplicate, label, open]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 256
          title: Search
          description: Search terms plus GitHub qualifiers (repo:, is:, label:, author:, in:).
          examples: ["repo:acme/app is:open is:issue label:bug"]
        sort:
          type: string
          enum: [comments, created, updated]
          title: Sort by
          description: What to sort by. Omit for best match.
        order:
          type: string
          enum: [asc, desc]
          title: Order
          description: Sort direction; only used with Sort by. Defaults to desc.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          title: Results per page
          description: How many results to return, 1 to 100.
          examples: [30]
        page:
          type: integer
          minimum: 1
          default: 1
          title: Page
          description: Which page of results, from 1.
          examples: [2]
        connection: *connection
    request:
      method: GET
      path: /search/issues
      query:
        q: "{{ params.q }}"
        per_page: "{{ params.per_page }}"
        page: "{{ params.page }}"
      query_expr: '{?"sort": params.?sort, ?"order": params.?order}'
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        {"total_count": response.total_count,
         "incomplete_results": response.?incomplete_results.orValue(false),
         "items": response.items.map(i, {
           "number": i.number,
           "id": i.id,
           "node_id": i.?node_id.orValue(null),
           "title": i.title,
           "state": i.state,
           "html_url": i.html_url,
           "repository_url": i.?repository_url.orValue(null),
           "user": i.?user.?login.orValue(null),
           "user_id": i.?user.?id.orValue(null),
           "labels": type(i.?labels.orValue(null)) == list ?
             i.labels.map(l, type(l) == string ? l : l.name) : [],
           "is_pull_request": i.?pull_request.orValue(null) != null,
           "comments": i.?comments.orValue(0),
           "created_at": i.?created_at.orValue(null),
           "updated_at": i.?updated_at.orValue(null),
           "closed_at": i.?closed_at.orValue(null)})}
      schema:
        type: object
        properties:
          total_count: { type: integer }
          incomplete_results: { type: boolean, description: GitHub timed out before searching everything. }
          items:
            type: array
            items:
              type: object
              properties:
                number: { type: integer }
                id: { type: integer }
                node_id: { type: [string, "null"] }
                title: { type: string }
                state: { type: string, enum: [open, closed] }
                html_url: { type: string }
                repository_url: { type: [string, "null"], description: "The API URL of the repository, ending in /repos/owner/name." }
                user: { type: [string, "null"] }
                user_id: { type: [integer, "null"] }
                labels: { type: array, items: { type: string } }
                is_pull_request: { type: boolean }
                comments: { type: integer }
                created_at: { type: [string, "null"] }
                updated_at: { type: [string, "null"] }
                closed_at: { type: [string, "null"] }

  # ---------------------------------------------------------- pull requests

  - id: pr.get
    display_name: Get pull request
    summary: Read a pull request, including its head and base refs and mergeability.
    description: >-
      Return one pull request: title, body, state, draft and merged flags, the
      head and base refs (branch, sha, repository) and mergeability. mergeable
      is null while GitHub is still computing it; read again shortly.
      mergeable_state is GitHub's summary (clean, dirty, blocked, behind,
      unstable, unknown, ...).
    keywords: [pull request, pr, read, details, branch, mergeable, review]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: &pull_number
          type: integer
          minimum: 1
          title: Pull request number
          description: The pull request's number as shown after the #.
          examples: [57]
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}
      errors: *github_errors
    output:
      select: >-
        {"number": response.number,
         "id": response.id,
         "title": response.title,
         "body": response.?body.orValue(null),
         "state": response.state,
         "draft": response.?draft.orValue(null),
         "merged": response.?merged.orValue(false),
         "mergeable": response.?mergeable.orValue(null),
         "mergeable_state": response.?mergeable_state.orValue(null),
         "rebaseable": response.?rebaseable.orValue(null),
         "html_url": response.html_url,
         "user": response.?user.?login.orValue(null),
         "head": {"ref": response.head.ref, "sha": response.head.sha,
                  "label": response.head.?label.orValue(null),
                  "repo": response.head.?repo.?full_name.orValue(null)},
         "base": {"ref": response.base.ref, "sha": response.base.sha,
                  "label": response.base.?label.orValue(null),
                  "repo": response.base.?repo.?full_name.orValue(null)},
         "merge_commit_sha": response.?merge_commit_sha.orValue(null),
         "commits": response.?commits.orValue(null),
         "additions": response.?additions.orValue(null),
         "deletions": response.?deletions.orValue(null),
         "changed_files": response.?changed_files.orValue(null),
         "created_at": response.?created_at.orValue(null),
         "updated_at": response.?updated_at.orValue(null),
         "closed_at": response.?closed_at.orValue(null),
         "merged_at": response.?merged_at.orValue(null)}
      schema:
        type: object
        properties:
          number: { type: integer }
          id: { type: integer }
          title: { type: string }
          body: { type: [string, "null"] }
          state: { type: string, enum: [open, closed] }
          draft: { type: [boolean, "null"] }
          merged: { type: boolean }
          mergeable: { type: [boolean, "null"], description: Null while GitHub computes it. }
          mergeable_state: { type: [string, "null"] }
          rebaseable: { type: [boolean, "null"] }
          html_url: { type: string }
          user: { type: [string, "null"] }
          head: &pr_ref
            type: object
            properties:
              ref: { type: string, description: The branch name. }
              sha: { type: string }
              label: { type: [string, "null"], description: "owner:branch" }
              repo: { type: [string, "null"], description: The repository's full_name (null if a fork was deleted). }
          base: *pr_ref
          merge_commit_sha: { type: [string, "null"] }
          commits: { type: [integer, "null"] }
          additions: { type: [integer, "null"] }
          deletions: { type: [integer, "null"] }
          changed_files: { type: [integer, "null"] }
          created_at: { type: [string, "null"] }
          updated_at: { type: [string, "null"] }
          closed_at: { type: [string, "null"] }
          merged_at: { type: [string, "null"] }

  - id: pr.list_files
    display_name: List pull request files
    summary: The files a pull request changes, with per-file diffs, for review.
    description: >-
      List the files a pull request changes: filename, status (added,
      modified, removed, renamed, ...), line counts and the unified diff hunk
      (patch). patch is null for binary files and very large diffs. Follows
      GitHub's pagination up to 1000 files; GitHub itself caps the list at
      3000.
    keywords: [pull request, pr, diff, files, changes, patch, review]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/files
      query: { per_page: "100" }
      pagination: { style: link_header, max_pages: 10 }
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        response.map(f, {"filename": f.filename,
                         "status": f.status,
                         "additions": f.additions,
                         "deletions": f.deletions,
                         "changes": f.changes,
                         "patch": f.?patch.orValue(null),
                         "previous_filename": f.?previous_filename.orValue(null),
                         "sha": f.?sha.orValue(null)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                filename: { type: string }
                status: { type: string, enum: [added, removed, modified, renamed, copied, changed, unchanged] }
                additions: { type: integer }
                deletions: { type: integer }
                changes: { type: integer }
                patch: { type: [string, "null"], description: The unified diff hunk; null for binary or oversized files. }
                previous_filename: { type: [string, "null"], description: Set when status is renamed. }
                sha: { type: [string, "null"] }

  - id: pr.review.create
    display_name: Review pull request
    summary: Submit a pull request review that comments, approves or requests changes.
    description: >-
      Submit a review on a pull request with a verdict: COMMENT (the default),
      APPROVE, or REQUEST_CHANGES. body is required for COMMENT and
      REQUEST_CHANGES. The review is submitted immediately, never left
      pending. Pass commit_id to pin the review to the commit you read
      (pr.get head.sha); otherwise GitHub uses the latest commit.
    keywords: [pull request, pr, review, approve, request changes, code review]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      # event is not required: its default (COMMENT) fills it in.
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        event:
          type: string
          enum: [COMMENT, APPROVE, REQUEST_CHANGES]
          default: COMMENT
          title: Verdict
          description: COMMENT leaves feedback, APPROVE approves, REQUEST_CHANGES blocks merging until resolved.
        body:
          type: string
          minLength: 1
          title: Review summary
          description: The review's top-level comment, in GitHub-flavored markdown. Required unless the verdict is APPROVE.
          examples: ["Looks good overall; one question about the retry loop in client.go."]
        commit_id:
          type: string
          pattern: "^[0-9a-f]{7,64}$"
          title: Commit SHA
          description: The commit being reviewed. Defaults to the pull request's latest commit.
          examples: ["6dcb09b5b57875f334f61aebed695e2e4193db5e"]
        connection: *connection
    # "body is required for COMMENT and REQUEST_CHANGES" is GitHub's rule, and
    # its 422 names the field; an if/then here would not survive as a tool
    # input schema.
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/reviews
      body_expr: >-
        {"event": params.event,
         ?"body": params.?body,
         ?"commit_id": params.?commit_id}
      errors: *github_errors
    output:
      select: >-
        {"id": response.id,
         "node_id": response.?node_id.orValue(null),
         "state": response.state,
         "html_url": response.html_url,
         "submitted_at": response.?submitted_at.orValue(null),
         "commit_id": response.?commit_id.orValue(null)}
      schema:
        type: object
        properties:
          id: { type: integer }
          node_id: { type: [string, "null"] }
          state: { type: string, description: "APPROVED, CHANGES_REQUESTED or COMMENTED." }
          html_url: { type: string }
          submitted_at: { type: [string, "null"] }
          commit_id: { type: [string, "null"] }

  - id: pr.create
    display_name: Open pull request
    summary: Open a pull request from a pushed branch, as a draft or ready for review.
    description: >-
      Open a pull request merging head into base. The head branch must already
      be pushed (from a workspace, or created through GitHub). head is a
      branch name, or owner:branch for a branch in a fork. A pull request
      cannot be created with labels in the same request; add them afterwards
      with issue.labels.add using the returned number. GitHub answers 422 when
      the branches are identical, have no commits between them, or a pull
      request for them is already open; the message says which. Merging is not
      an action here: a person merges. Returns the pull request's number, id,
      node id and URL.
    keywords: [pull request, pr, open, create, draft, branch, propose]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, head, base, title]
      properties:
        owner: *owner
        repo: *repo
        head:
          type: string
          minLength: 1
          maxLength: 255
          title: Head branch
          description: The branch with the changes, or owner:branch when it lives in a fork.
          examples: ["agent/issue-42", "octocat:fix-save"]
        base:
          type: string
          minLength: 1
          maxLength: 255
          title: Base branch
          description: The branch to merge into, usually the repository's default branch.
          examples: ["main"]
        title:
          type: string
          minLength: 1
          title: Title
          description: The pull request's title.
          examples: ["Fix the save crash (#42)"]
        body:
          type: string
          title: Body
          description: The pull request's description, in GitHub-flavored markdown.
          examples: ["Fixes #42."]
        draft:
          type: boolean
          title: Draft
          description: Open as a draft that is not ready for review. Omit for a ready pull request.
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls
      body_expr: >-
        {"head": params.head,
         "base": params.base,
         "title": params.title,
         ?"body": params.?body,
         ?"draft": params.?draft}
      errors: *github_errors
    output:
      select: &pr_write_select >-
        {"number": response.number,
         "id": response.id,
         "node_id": response.?node_id.orValue(null),
         "html_url": response.html_url,
         "title": response.title,
         "state": response.state,
         "draft": response.?draft.orValue(false),
         "head_sha": response.?head.?sha.orValue(null),
         "base_ref": response.?base.?ref.orValue(null)}
      schema: &pr_write_schema
        type: object
        properties:
          number: { type: integer }
          id: { type: integer }
          node_id: { type: [string, "null"] }
          html_url: { type: string }
          title: { type: string }
          state: { type: string, enum: [open, closed] }
          draft: { type: boolean }
          head_sha: { type: [string, "null"] }
          base_ref: { type: [string, "null"], description: The branch it targets. }

  - id: pr.update
    display_name: Update pull request
    summary: Change a pull request's title, body, base branch, or close or reopen it.
    description: >-
      Edit a pull request. Only the fields you pass change; pass at least one.
      state closed closes it without merging and open reopens it. Changing
      base retargets the pull request to another branch. Labels and assignees
      are changed through issue.labels.add, issue.labels.remove and
      issue.update, since a pull request is an issue too. Merging is not an
      action here: a person merges. Returns the pull request's number, id,
      node id and URL.
    keywords: [pull request, pr, edit, update, retitle, close, reopen, retarget, base]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        title:
          type: string
          minLength: 1
          title: New title
          description: Replaces the title. Omit to keep it.
          examples: ["Fix the save crash (#42)"]
        body:
          type: string
          title: New body
          description: Replaces the description, in GitHub-flavored markdown. Omit to keep it.
          examples: ["Fixes #42.\n\nRe-tested on main."]
        state:
          type: string
          enum: [open, closed]
          title: State
          description: closed closes the pull request without merging; open reopens it.
        base:
          type: string
          minLength: 1
          maxLength: 255
          title: Base branch
          description: Retarget the pull request to this branch.
          examples: ["release-1.2"]
        connection: *connection
    request:
      method: PATCH
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}
      # Absent params are left out, not sent as null.
      body_expr: >-
        {?"title": params.?title,
         ?"body": params.?body,
         ?"state": params.?state,
         ?"base": params.?base}
      errors: *github_errors
    output:
      select: *pr_write_select
      schema: *pr_write_schema

  - id: pr.reviews.list
    display_name: List pull request reviews
    summary: The reviews submitted on a pull request, with verdicts and summaries.
    description: >-
      List the reviews on a pull request, oldest first: who reviewed, the
      verdict (APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED or PENDING),
      the summary text, and the commit reviewed. Pending reviews are visible
      only to their author. The comments inside a review are listed by
      pr.review_comments.list (match on review_id). Follows GitHub's
      pagination up to 1000 reviews.
    keywords: [pull request, pr, reviews, list, approved, changes requested, verdict, reviewer]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/reviews
      query: { per_page: "100" }
      pagination: { style: link_header, max_pages: 10 }
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        response.map(r, {"id": r.id,
                         "node_id": r.?node_id.orValue(null),
                         "state": r.state,
                         "body": type(r.?body.orValue(null)) == string ? r.body : "",
                         "html_url": r.?html_url.orValue(null),
                         "user": r.?user.?login.orValue(null),
                         "user_id": r.?user.?id.orValue(null),
                         "author_association": r.?author_association.orValue(null),
                         "commit_id": r.?commit_id.orValue(null),
                         "submitted_at": r.?submitted_at.orValue(null)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                node_id: { type: [string, "null"] }
                state: { type: string, description: "APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED or PENDING." }
                body: { type: string }
                html_url: { type: [string, "null"] }
                user: { type: [string, "null"], description: The reviewer's login (null for a deleted account). }
                user_id: { type: [integer, "null"], description: The reviewer's numeric user id, which is never reused. }
                author_association: { type: [string, "null"] }
                commit_id: { type: [string, "null"] }
                submitted_at: { type: [string, "null"] }

  - id: pr.review_comments.list
    display_name: List pull request inline comments
    summary: The comments left on lines of a pull request's diff, optionally only those since a time.
    description: >-
      List the inline review comments on a pull request: comments attached to a
      line of the diff, including replies, oldest first. Each carries the file
      path, line, the diff hunk it points at, the review it belongs to
      (review_id) and, for a reply, the comment it answers (in_reply_to_id;
      reply to a thread by passing its first comment's id to
      pr.review_comment.reply). Pass since, an ISO 8601 time, to get only
      comments created or edited after it. Follows GitHub's pagination up to
      1000 comments. line is null when the commented line is no longer in the
      diff (the comment is outdated); original_line is where it was.
    keywords: [pull request, pr, review comments, inline, diff, line, thread, list, since, responder]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        since: *since
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/comments
      query: { per_page: "100" }
      query_expr: '{?"since": params.?since}'
      pagination: { style: link_header, max_pages: 10 }
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        response.map(c, {"id": c.id,
                         "node_id": c.?node_id.orValue(null),
                         "review_id": c.?pull_request_review_id.orValue(null),
                         "in_reply_to_id": c.?in_reply_to_id.orValue(null),
                         "path": c.?path.orValue(null),
                         "line": c.?line.orValue(null),
                         "original_line": c.?original_line.orValue(null),
                         "side": c.?side.orValue(null),
                         "commit_id": c.?commit_id.orValue(null),
                         "diff_hunk": c.?diff_hunk.orValue(null),
                         "body": type(c.?body.orValue(null)) == string ? c.body : "",
                         "html_url": c.?html_url.orValue(null),
                         "user": c.?user.?login.orValue(null),
                         "user_id": c.?user.?id.orValue(null),
                         "author_association": c.?author_association.orValue(null),
                         "created_at": c.?created_at.orValue(null),
                         "updated_at": c.?updated_at.orValue(null)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                node_id: { type: [string, "null"] }
                review_id: { type: [integer, "null"], description: The review this comment belongs to. }
                in_reply_to_id: { type: [integer, "null"], description: The comment this one replies to; null for the first comment of a thread. }
                path: { type: [string, "null"] }
                line: { type: [integer, "null"], description: The line in the diff; null when the comment is outdated. }
                original_line: { type: [integer, "null"] }
                side: { type: [string, "null"], description: "LEFT (removed line) or RIGHT (added or unchanged)." }
                commit_id: { type: [string, "null"] }
                diff_hunk: { type: [string, "null"] }
                body: { type: string }
                html_url: { type: [string, "null"] }
                user: { type: [string, "null"] }
                user_id: { type: [integer, "null"] }
                author_association: { type: [string, "null"] }
                created_at: { type: [string, "null"] }
                updated_at: { type: [string, "null"] }

  - id: pr.review_comment.reply
    display_name: Reply to a pull request inline comment
    summary: Reply in a review thread on a line of a pull request's diff.
    description: >-
      Post a reply to an inline review comment, in the same thread. comment_id
      is the id of a comment in the thread (pr.review_comments.list, or a
      pull_request_review_comment.created event); GitHub does not nest replies,
      so replying to a reply lands in the same thread. To start a new thread, or
      for a conversation-tab comment, use pr.review.create or issue.comment.
      Returns the reply's id, node id and URL.
    keywords: [pull request, pr, review comment, reply, thread, inline, respond, address]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, pull_number, comment_id, body]
      properties:
        owner: *owner
        repo: *repo
        pull_number: *pull_number
        comment_id:
          type: integer
          minimum: 1
          title: Comment id
          description: The inline comment to reply to.
          examples: [1234]
        body:
          type: string
          minLength: 1
          title: Reply
          description: The reply, in GitHub-flavored markdown.
          examples: ["Good catch, fixed in abc1234."]
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/pulls/{{ params.pull_number }}/comments/{{ params.comment_id }}/replies
      body_expr: '{"body": params.body}'
      errors: *github_errors
    output:
      select: >-
        {"id": response.id,
         "node_id": response.?node_id.orValue(null),
         "html_url": response.html_url,
         "in_reply_to_id": response.?in_reply_to_id.orValue(null),
         "created_at": response.?created_at.orValue(null)}
      schema:
        type: object
        properties:
          id: { type: integer }
          node_id: { type: [string, "null"] }
          html_url: { type: string }
          in_reply_to_id: { type: [integer, "null"] }
          created_at: { type: [string, "null"] }

  # ------------------------------------------------------------ repositories

  - id: repo.list_for_user
    display_name: List repositories
    summary: Repositories the connection can see, for pickers and lookups.
    description: >-
      List the repositories the connected user can access (owned,
      collaborator, and through organization membership), following
      pagination up to 1000. With the hosted GitHub App, actions still only
      reach repositories the App is installed on. can_push says whether the
      user can write.
    keywords: [repository, repos, list, picker, projects]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      properties:
        visibility:
          type: string
          enum: [all, public, private]
          title: Visibility
          description: Only repositories with this visibility.
        affiliation:
          type: string
          pattern: "^(owner|collaborator|organization_member)(,(owner|collaborator|organization_member))*$"
          title: Your relationship
          description: >-
            Which of your repositories to list, comma-separated: owner,
            collaborator, organization_member. Defaults to all three.
          examples: ["owner,collaborator"]
        sort:
          type: string
          enum: [created, updated, pushed, full_name]
          title: Sort by
          description: What to sort by. Defaults to full_name.
        direction:
          type: string
          enum: [asc, desc]
          title: Direction
          description: Sort direction. Defaults to asc for full_name, otherwise desc.
        connection: *connection
    request:
      method: GET
      path: /user/repos
      query: { per_page: "100" }
      query_expr: >-
        {?"visibility": params.?visibility,
         ?"affiliation": params.?affiliation,
         ?"sort": params.?sort,
         ?"direction": params.?direction}
      pagination: { style: link_header, max_pages: 10 }
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        response.map(r, {"id": r.id,
                         "full_name": r.full_name,
                         "name": r.name,
                         "owner": r.owner.login,
                         "private": r.private,
                         "html_url": r.html_url,
                         "description": r.?description.orValue(null),
                         "default_branch": r.?default_branch.orValue(null),
                         "archived": r.?archived.orValue(false),
                         "fork": r.?fork.orValue(false),
                         "pushed_at": r.?pushed_at.orValue(null),
                         "can_push": r.?permissions.?push.orValue(false)})
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: integer }
                full_name: { type: string, description: "owner/name" }
                name: { type: string }
                owner: { type: string }
                private: { type: boolean }
                html_url: { type: string }
                description: { type: [string, "null"] }
                default_branch: { type: [string, "null"] }
                archived: { type: boolean }
                fork: { type: boolean }
                pushed_at: { type: [string, "null"] }
                can_push: { type: boolean }

  - id: repo.get
    display_name: Get repository
    summary: A repository's metadata, including its default branch.
    description: >-
      Return one repository: full name, description, visibility, default
      branch, primary language, topics, and whether the connection can push.
      Read default_branch before browsing code on a branch nobody named.
    keywords: [repository, repo, metadata, default branch, details, about]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo]
      properties:
        owner: *owner
        repo: *repo
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}
      errors: *github_errors
    output:
      select: >-
        {"id": response.id,
         "full_name": response.full_name,
         "name": response.name,
         "owner": response.owner.login,
         "description": response.?description.orValue(null),
         "private": response.private,
         "visibility": response.?visibility.orValue(null),
         "default_branch": response.default_branch,
         "language": response.?language.orValue(null),
         "topics": type(response.?topics.orValue(null)) == list ? response.topics : [],
         "archived": response.?archived.orValue(false),
         "fork": response.?fork.orValue(false),
         "html_url": response.html_url,
         "pushed_at": response.?pushed_at.orValue(null),
         "can_push": response.?permissions.?push.orValue(false)}
      schema:
        type: object
        properties:
          id: { type: integer }
          full_name: { type: string, description: "owner/name" }
          name: { type: string }
          owner: { type: string }
          description: { type: [string, "null"] }
          private: { type: boolean }
          visibility: { type: [string, "null"], description: "public, private or internal." }
          default_branch: { type: string }
          language: { type: [string, "null"] }
          topics: { type: array, items: { type: string } }
          archived: { type: boolean }
          fork: { type: boolean }
          html_url: { type: string }
          pushed_at: { type: [string, "null"] }
          can_push: { type: boolean }

  # ------------------------------------------------------------------- code
  #
  # Reading a repository without a checkout: what a run with no machine reads
  # a project's code with. `path` and a tree's `ref` are interpolated into the
  # URL path as ONE percent-escaped segment (GitHub decodes the %2F), so their
  # pattern refuses empty, "." and ".." segments, which would otherwise survive
  # into the decoded path.

  - id: repo.get_content
    display_name: Read repository file or directory
    summary: Read a file's text, or list a directory, at a branch, tag or commit.
    description: >-
      Read one path in a repository through GitHub, with no checkout. For a
      file, content is its text. A binary file has binary true and no
      content; a file over 1 MB has too_large true and no content. For a
      directory, entries lists what it holds, one level deep (repo.get_tree
      lists everything). Omit path for the repository root and ref for the
      default branch. Results longer than about 30,000 characters are cut
      short.
    keywords: [file, read, contents, source, code, directory, list, browse, open, cat]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo]
      properties:
        owner: *owner
        repo: *repo
        path:
          type: string
          pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
          maxLength: 4096
          title: Path
          description: >-
            A file or directory from the repository root, with no leading
            slash. Omit for the root.
          examples: ["src/main.go"]
        ref: &git_ref
          type: string
          pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
          maxLength: 255
          title: Branch, tag or commit
          description: Which version to read. Defaults to the repository's default branch.
          examples: ["main"]
        connection: *connection
    request:
      method: GET
      path: /repos/{{ params.owner }}/{{ params.repo }}/contents/{{ params.?path.orValue('') }}
      query_expr: '{?"ref": params.?ref}'
      # A 1 MB file arrives base64-encoded inside JSON.
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      # A directory answers with a list; anything else with one object whose
      # `encoding` is base64 (a file's bytes), none (a file over 1 MB) or
      # absent (a symlink or submodule).
      select: >-
        type(response) == list ?
          {"type": "dir",
           "path": params.?path.orValue(""),
           "entries": response.map(e, {"name": e.name,
                                       "path": e.path,
                                       "type": e.type,
                                       "size": e.?size.orValue(null)})} :
          {"type": response.type,
           "path": response.path,
           "name": response.name,
           "sha": response.?sha.orValue(null),
           "size": response.?size.orValue(null),
           "html_url": response.?html_url.orValue(null),
           "content": response.?encoding.orValue('') == 'base64' ?
             base64.decode(response.?content.orValue('')).text().orValue(null) : null,
           "binary": response.?encoding.orValue('') == 'base64' &&
             !base64.decode(response.?content.orValue('')).text().hasValue(),
           "too_large": response.?encoding.orValue('') == 'none',
           "target": response.?target.orValue(null),
           "submodule_git_url": response.?submodule_git_url.orValue(null)}
      schema:
        type: object
        properties:
          type: { type: string, enum: [file, dir, symlink, submodule] }
          path: { type: string }
          name: { type: string, description: Absent for a directory. }
          sha: { type: [string, "null"] }
          size: { type: [integer, "null"], description: In bytes. }
          html_url: { type: [string, "null"] }
          content: { type: [string, "null"], description: "The file's text; null for a directory, a binary file, or a file over 1 MB." }
          binary: { type: boolean, description: The file is not text, so content is null. }
          too_large: { type: boolean, description: "The file is over 1 MB, which the contents API does not serve, so content is null." }
          target: { type: [string, "null"], description: A symlink's target path. }
          submodule_git_url: { type: [string, "null"] }
          entries:
            type: array
            description: A directory's files and subdirectories.
            items:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
                type: { type: string, enum: [file, dir, symlink, submodule] }
                size: { type: [integer, "null"] }

  - id: repo.get_tree
    display_name: List repository files
    summary: Every file path in a repository, or under one directory, at a branch, tag or commit.
    description: >-
      List the repository's files recursively from its git tree, with no
      checkout: each entry's full path, type (blob is a file, tree a
      directory, commit a submodule) and size. Pass path to list only one
      directory, which a large repository needs: results longer than about
      30,000 characters are cut short. truncated is true when the tree is
      larger than GitHub returns at once (100,000 entries). Omit ref for the
      default branch.
    keywords: [tree, files, list, paths, structure, layout, find file, ls]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo]
      properties:
        owner: *owner
        repo: *repo
        ref: *git_ref
        path:
          type: string
          pattern: "^[^/]*[^/.][^/]*(/[^/]*[^/.][^/]*)*$"
          maxLength: 4096
          title: Directory
          description: Only entries under this directory, from the repository root. Omit for the whole repository.
          examples: ["internal/llm"]
        connection: *connection
    request:
      method: GET
      # A directory is the tree-ish <ref>:<path>, so GitHub walks only that
      # subtree; its entries' paths are relative to it, and the output puts
      # the directory back in front.
      path: >-
        /repos/{{ params.owner }}/{{ params.repo }}/git/trees/{{ params.?ref.orValue('HEAD') +
        (params.?path.hasValue() ? ':' + params.path : '') }}
      query: { recursive: "1" }
      # GitHub serves up to 7 MB of tree before it truncates.
      max_response_bytes: 10485760
      errors: *github_errors
    output:
      select: >-
        {"sha": response.sha,
         "truncated": response.?truncated.orValue(false),
         "entries": response.tree.map(e, {
           "path": params.?path.hasValue() ? params.path + '/' + e.path : e.path,
           "type": e.type,
           "size": e.?size.orValue(null)})}
      schema:
        type: object
        properties:
          sha: { type: string, description: The tree's SHA. }
          truncated: { type: boolean, description: GitHub returned only part of a very large tree. }
          entries:
            type: array
            items:
              type: object
              properties:
                path: { type: string }
                type: { type: string, enum: [blob, tree, commit] }
                size: { type: [integer, "null"], description: A file's size in bytes; null for a directory. }

  - id: code.search
    display_name: Search code
    summary: Find code with GitHub code search; returns matching files and the fragments that matched.
    description: >-
      Search file contents with GitHub's code search syntax. Scope the query
      with a qualifier, repo:owner/name, org:name or user:name; without one
      it searches every repository the connection can see. language:, path:
      and extension: narrow it further, for example
      "ParseDuration repo:golang/go language:go". Only default branches are
      indexed, files over 384 KB are not, and GitHub allows about ten code
      searches a minute, so prefer one precise query over many broad ones.
    keywords: [search, grep, find, code, symbol, definition, usage, references]
    placement: server
    mutates: false
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 256
          title: Search
          description: >-
            Search terms plus GitHub qualifiers (repo:, org:, language:, path:).
            At least one search term is required besides the qualifiers.
          examples: ["ParseDuration repo:golang/go"]
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          title: Results per page
          description: How many matches to return, 1 to 100.
          examples: [10]
        page:
          type: integer
          minimum: 1
          default: 1
          title: Page
          description: Which page of results, from 1. GitHub returns at most the first 1,000 matches.
          examples: [2]
        connection: *connection
    request:
      method: GET
      path: /search/code
      headers:
        # Adds text_matches: the fragment of each file that matched.
        Accept: application/vnd.github.text-match+json
      query:
        q: "{{ params.q }}"
        per_page: "{{ params.per_page }}"
        page: "{{ params.page }}"
      max_response_bytes: 5242880
      errors: *github_errors
    output:
      select: >-
        {"total_count": response.total_count,
         "incomplete_results": response.?incomplete_results.orValue(false),
         "items": response.items.map(i, {
           "repository": i.repository.full_name,
           "path": i.path,
           "name": i.name,
           "sha": i.?sha.orValue(null),
           "html_url": i.html_url,
           "fragments": type(i.?text_matches.orValue(null)) == list ?
             i.text_matches.map(m, m.fragment) : []})}
      schema:
        type: object
        properties:
          total_count: { type: integer }
          incomplete_results: { type: boolean, description: GitHub timed out before searching everything. }
          items:
            type: array
            items:
              type: object
              properties:
                repository: { type: string, description: "owner/name" }
                path: { type: string }
                name: { type: string }
                sha: { type: [string, "null"] }
                html_url: { type: string }
                fragments: { type: array, items: { type: string }, description: The text around each match. }

  # ----------------------------------------------------------------- actions

  - id: workflow.dispatch
    display_name: Run Actions workflow
    summary: Trigger a GitHub Actions workflow that has a workflow_dispatch trigger.
    description: >-
      Start a GitHub Actions workflow run on a branch or tag. The workflow
      file must declare `on: workflow_dispatch`, and inputs must match its
      declared inputs (at most 25, all passed as strings). workflow is the
      workflow file name (deploy.yml) or its numeric id. Returns the run id and
      URL when GitHub reports them.
    keywords: [actions, ci, workflow, dispatch, run, deploy, trigger]
    placement: server
    mutates: true
    tool:
      expose: true
    params:
      type: object
      additionalProperties: false
      required: [owner, repo, workflow, ref]
      properties:
        owner: *owner
        repo: *repo
        workflow:
          type: string
          pattern: "^[A-Za-z0-9._-]*[A-Za-z0-9_-][A-Za-z0-9._-]*$"
          maxLength: 255
          title: Workflow file
          description: The workflow's file name under .github/workflows, or its numeric id.
          examples: ["deploy.yml"]
        ref:
          type: string
          minLength: 1
          title: Branch or tag
          description: The branch or tag to run the workflow on.
          examples: ["main"]
        inputs:
          type: object
          maxProperties: 25
          additionalProperties: { type: string }
          title: Workflow inputs
          description: Values for the workflow's declared workflow_dispatch inputs, all as strings.
          examples: [{ "environment": "staging", "dry_run": "true" }]
        connection: *connection
    request:
      method: POST
      path: /repos/{{ params.owner }}/{{ params.repo }}/actions/workflows/{{ params.workflow }}/dispatches
      body_expr: >-
        {"ref": params.ref,
         ?"inputs": params.?inputs,
         "return_run_details": true}
      errors: *github_errors
    output:
      select: >-
        {"dispatched": true,
         "workflow_run_id": type(response) == map ? response.?workflow_run_id.orValue(null) : null,
         "run_url": type(response) == map ? response.?run_url.orValue(null) : null,
         "html_url": type(response) == map ? response.?html_url.orValue(null) : null}
      schema:
        type: object
        properties:
          dispatched: { type: boolean }
          workflow_run_id: { type: [integer, "null"] }
          run_url: { type: [string, "null"] }
          html_url: { type: [string, "null"] }

# Triggers: what starts a run from GitHub. Delivered by the app-level webhook
# (internal/integrations/webhook/github) at <PUBLIC_URL>/integrations/github/events,
# verified with RELIANT_GITHUB_WEBHOOK_SECRET.
#
# Routing is access-gated. An event reaches a trigger only when its owner's own
# GitHub token recently reported the event's repository as visible
# (GET /user/installations/{id}/repositories), so a member of an org
# installation never sees events from that org's repositories they cannot
# see. `events` are the provider's event types; `attributes` are what an
# IntegrationSource `match:` can require, and every event of a trigger sets
# each of them. `data` is trigger.payload.data: a trimmed copy of GitHub's
# webhook body, untrusted, with long text capped at 16 KiB. Each `data` is
# closed (additionalProperties: false) at its top level, so a filter that reads
# a key the event never carries (`data.issue` on an inline diff comment) is a
# validation error, not a run that fails on every event.
triggers:
  - id: issue.opened
    display_name: Issue opened
    summary: An issue was opened in a repository.
    description: >-
      Fires when an issue is opened in a repository the App is installed on and
      you can see.
    keywords: [new issue, ticket, bug report]
    events: [issues.opened]
    attributes: &issue_attrs
      - &attr_repository { name: repository, description: "The repository, owner/name.", example: acme/app }
      - &attr_installation { name: installation_id, description: The GitHub App installation the event came through., example: "98765" }
      - &attr_sender { name: sender, description: "Login of the user who acted. A login can be renamed and reclaimed by someone else, so never use it to decide who may start a run; trigger.sender.id (the user id) is for that.", example: octocat }
      - &attr_action { name: action, description: The webhook action., example: opened }
    data: &issue_data
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        issue: &issue_schema
          type: object
          properties:
            number: { type: integer }
            title: { type: string }
            body: { type: string }
            state: { type: string, enum: [open, closed] }
            state_reason: { type: string }
            html_url: { type: string }
            user: &user_schema
              type: object
              properties:
                login: { type: string }
                id: { type: integer }
                type: { type: string }
            labels: { type: array, items: { type: string }, description: Label names. }
            assignees: { type: array, items: { type: string }, description: Assignee logins. }
            comments: { type: integer }
            author_association: { type: string }
            is_pull_request: { type: boolean }
            created_at: { type: string }
            updated_at: { type: string }
            closed_at: { type: string }
        repository: &repository_schema
          type: object
          properties:
            id: { type: integer }
            full_name: { type: string }
            name: { type: string }
            owner: { type: string }
            private: { type: boolean }
            html_url: { type: string }
            default_branch: { type: string }
        sender: *user_schema

  - id: issue.closed
    display_name: Issue closed
    summary: An issue was closed.
    description: Fires when an issue is closed, as completed or as not planned (issue.state_reason).
    keywords: [resolved, done]
    events: [issues.closed]
    attributes: *issue_attrs
    data: *issue_data

  - id: issue.edited
    display_name: Issue edited
    summary: An issue's title or body was edited.
    description: >-
      Fires when an issue's title or body changes. data.changes carries the
      previous title and/or body under `from`.
    events: [issues.edited]
    attributes: *issue_attrs
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        issue: *issue_schema
        changes:
          type: object
          properties:
            title: { type: object, properties: { from: { type: string } } }
            body: { type: object, properties: { from: { type: string } } }
        repository: *repository_schema
        sender: *user_schema

  - id: issue.labeled
    display_name: Issue labeled
    summary: A label was added to an issue.
    description: >-
      Fires when a label is added to an issue. Match `label` to react to one
      label, e.g. label: needs-triage.
    keywords: [label, tag, triage]
    events: [issues.labeled]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: label, description: The label that was added., example: needs-triage }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        label: { type: string, description: The label that was added. }
        issue: *issue_schema
        repository: *repository_schema
        sender: *user_schema

  - id: issue.unlabeled
    display_name: Issue unlabeled
    summary: A label was removed from an issue.
    description: >-
      Fires when a label is removed from an issue, by a person or by a run.
      Match `label` to react to one label, e.g. label: agent:ready to notice
      an issue being withdrawn from automation.
    keywords: [label, untag, remove label, triage]
    events: [issues.unlabeled]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: label, description: The label that was removed., example: needs-triage }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        label: { type: string, description: The label that was removed. }
        issue: *issue_schema
        repository: *repository_schema
        sender: *user_schema

  - id: issue.reopened
    display_name: Issue reopened
    summary: A closed issue was reopened.
    description: Fires when a closed issue is reopened. issue.state_reason is reopened.
    keywords: [reopen, regression, came back]
    events: [issues.reopened]
    attributes: *issue_attrs
    data: *issue_data

  - id: issue.assigned
    display_name: Issue assigned
    summary: Someone was assigned to an issue.
    description: Fires when a user is assigned to an issue. Match `assignee` to react to one person.
    keywords: [assign, owner]
    events: [issues.assigned]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: assignee, description: Login of the user who was assigned., example: octocat }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        assignee: *user_schema
        issue: *issue_schema
        repository: *repository_schema
        sender: *user_schema

  - id: issue_comment.created
    display_name: Issue or pull request comment
    summary: A comment was posted on an issue or pull request.
    description: >-
      Fires when someone comments on an issue or a pull request's
      conversation. Match mentions_reliant: "true" to react only to comments
      that mention @reliant, and is_pull_request to pick issues or pull
      requests. Comments written by GitHub Apps (including this one) never
      fire, so a run that comments cannot trigger itself.
    keywords: [comment, reply, mention, reliant]
    events: [issue_comment.created]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: mentions_reliant, description: '"true" when the comment mentions @reliant.', example: "true" }
      - { name: is_pull_request, description: '"true" when the comment is on a pull request.', example: "false" }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        issue: *issue_schema
        comment:
          type: object
          properties:
            id: { type: integer }
            body: { type: string }
            html_url: { type: string }
            user: *user_schema
            author_association: { type: string }
            created_at: { type: string }
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request.opened
    display_name: Pull request opened
    summary: A pull request was opened.
    description: >-
      Fires when a pull request is opened. Match base_branch to watch one
      target branch, or branch for the head branch.
    keywords: [pr, pull request, review, code review]
    events: [pull_request.opened]
    attributes: &pr_attrs
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - &attr_branch { name: branch, description: The pull request's head branch., example: fix-save }
      - &attr_base_branch { name: base_branch, description: The branch the pull request targets., example: main }
    data: &pr_data
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        number: { type: integer }
        pull_request: &pr_schema
          type: object
          properties:
            number: { type: integer }
            title: { type: string }
            body: { type: string }
            state: { type: string, enum: [open, closed] }
            draft: { type: boolean }
            merged: { type: boolean }
            merged_at: { type: string }
            merge_commit_sha: { type: string }
            html_url: { type: string }
            user: *user_schema
            head: &ref_schema
              type: object
              properties:
                ref: { type: string }
                sha: { type: string }
                label: { type: string }
            base: *ref_schema
            labels: { type: array, items: { type: string } }
            requested_reviewers: { type: array, items: { type: string } }
            additions: { type: integer }
            deletions: { type: integer }
            changed_files: { type: integer }
            commits: { type: integer }
            created_at: { type: string }
            updated_at: { type: string }
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request.synchronize
    display_name: Pull request updated
    summary: New commits were pushed to a pull request.
    description: >-
      Fires when the head branch of a pull request gets new commits.
      data.before and data.after are the old and new head SHAs.
    keywords: [pr, push, new commits, synchronize]
    events: [pull_request.synchronize]
    attributes: *pr_attrs
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        number: { type: integer }
        before: { type: string }
        after: { type: string }
        pull_request: *pr_schema
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request.closed
    display_name: Pull request closed
    summary: A pull request was closed or merged.
    description: >-
      Fires when a pull request is closed. Match merged: "true" for merges
      only; pull_request.merged says the same in the payload.
    keywords: [pr, merged, merge]
    events: [pull_request.closed]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: merged, description: '"true" when the pull request was merged.', example: "true" }
    data: *pr_data

  - id: pull_request.ready_for_review
    display_name: Pull request ready for review
    summary: A draft pull request was marked ready for review.
    events: [pull_request.ready_for_review]
    keywords: [pr, draft, review]
    attributes: *pr_attrs
    data: *pr_data

  - id: pull_request.reopened
    display_name: Pull request reopened
    summary: A closed pull request was reopened.
    description: Fires when a closed pull request is reopened. Match base_branch or branch like pull_request.opened.
    keywords: [pr, reopen]
    events: [pull_request.reopened]
    attributes: *pr_attrs
    data: *pr_data

  - id: pull_request.labeled
    display_name: Pull request labeled
    summary: A label was added to a pull request.
    description: >-
      Fires when a label is added to a pull request. Match `label` to react
      to one label, e.g. label: agent:re-review, and base_branch or branch to
      narrow by branch. The label is also data.label; the full set is
      data.pull_request.labels.
    keywords: [pr, label, tag, triage, re-review]
    events: [pull_request.labeled]
    attributes: &pr_label_attrs
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: label, description: The label that was added., example: "agent:re-review" }
    data: &pr_label_data
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        number: { type: integer }
        label: { type: string, description: The label that was added or removed. }
        pull_request: *pr_schema
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request.unlabeled
    display_name: Pull request unlabeled
    summary: A label was removed from a pull request.
    description: >-
      Fires when a label is removed from a pull request. Match `label` to
      react to one label. data.label is the label removed;
      data.pull_request.labels is what remains.
    keywords: [pr, label, untag, remove label]
    events: [pull_request.unlabeled]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: label, description: The label that was removed., example: "agent:re-review" }
    data: *pr_label_data

  - id: pull_request.review_requested
    display_name: Review requested
    summary: Someone's review was requested on a pull request.
    description: >-
      Fires when a review is requested from a user or a team. Match
      requested_reviewer (a login, or a team's slug) to react to requests
      for one reviewer.
    keywords: [pr, review, reviewer, code review]
    events: [pull_request.review_requested]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: requested_reviewer, description: "The requested reviewer's login, or the team's slug.", example: octocat }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        number: { type: integer }
        pull_request: *pr_schema
        requested_reviewer: *user_schema
        requested_team: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request_review.submitted
    display_name: Pull request review submitted
    summary: A review was submitted on a pull request.
    description: >-
      Fires when a reviewer submits a review. Match state (approved,
      changes_requested or commented) to react to one outcome.
    keywords: [pr, review, approved, changes requested]
    events: [pull_request_review.submitted]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: state, description: "The review's state: approved, changes_requested or commented.", example: approved }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        pull_request: *pr_schema
        review:
          type: object
          properties:
            id: { type: integer }
            state: { type: string }
            body: { type: string }
            html_url: { type: string }
            user: *user_schema
            commit_id: { type: string }
            submitted_at: { type: string }
            author_association: { type: string }
        repository: *repository_schema
        sender: *user_schema

  - id: pull_request_review_comment.created
    display_name: Pull request inline comment
    summary: A comment was left on a line of a pull request's diff.
    description: >-
      Fires when someone comments on a line of a pull request's diff, or
      replies in such a thread, including the comments of a review as it is
      submitted (each comment fires on its own). Conversation-tab comments are
      issue_comment.created instead. Match mentions_reliant: "true" for
      comments that mention @reliant and is_reply: "false" for the first
      comment of a thread. data.comment has the file path, line, side, the diff
      hunk and review id; reply with github/pr.review_comment.reply using
      data.comment.id. Comments written by GitHub Apps (including this one)
      never fire, so a run that replies cannot trigger itself.
    keywords: [pr, review comment, inline, diff, line, thread, responder, address feedback]
    events: [pull_request_review_comment.created]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - *attr_branch
      - *attr_base_branch
      - { name: mentions_reliant, description: '"true" when the comment mentions @reliant.', example: "true" }
      - { name: is_reply, description: '"true" when the comment replies to another in its thread.', example: "false" }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        pull_request: *pr_schema
        comment:
          type: object
          properties:
            id: { type: integer }
            body: { type: string }
            html_url: { type: string }
            user: *user_schema
            author_association: { type: string }
            path: { type: string }
            line: { type: integer, description: The line in the diff; absent when the comment is outdated. }
            original_line: { type: integer }
            side: { type: string, description: "LEFT or RIGHT." }
            subject_type: { type: string, description: "line or file." }
            commit_id: { type: string }
            diff_hunk: { type: string }
            in_reply_to_id: { type: integer, description: The comment this replies to; absent for the first comment of a thread. }
            pull_request_review_id: { type: integer }
            created_at: { type: string }
        repository: *repository_schema
        sender: *user_schema

  - id: push.received
    display_name: Push
    summary: Commits or a tag were pushed to a repository.
    description: >-
      Fires on every push. A branch push sets `branch` (match branch: main to
      watch one branch); a tag push sets `tag` instead and has no `branch`.
      data.commits lists up to 20 commits.
    keywords: [push, commit, deploy, branch, tag]
    events: [push]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - { name: ref, description: The full ref pushed., example: refs/heads/main }
      - { name: branch, description: "The branch pushed, for a branch push only.", example: main }
      - { name: tag, description: "The tag pushed, for a tag push only.", example: v1.2.0 }
    data:
      type: object
      additionalProperties: false
      properties:
        ref: { type: string }
        before: { type: string }
        after: { type: string }
        created: { type: boolean }
        deleted: { type: boolean }
        forced: { type: boolean }
        compare: { type: string }
        truncated: { type: boolean, description: Set when commits were cut to fit the size cap. }
        commits:
          type: array
          items: &commit_schema
            type: object
            properties:
              id: { type: string }
              message: { type: string }
              timestamp: { type: string }
              url: { type: string }
              author: { type: object, properties: { name: { type: string }, username: { type: string } } }
              added: { type: array, items: { type: string } }
              removed: { type: array, items: { type: string } }
              modified: { type: array, items: { type: string } }
        head_commit: *commit_schema
        pusher: { type: object, properties: { name: { type: string } } }
        repository: *repository_schema
        sender: *user_schema

  - id: workflow_run.completed
    display_name: Workflow run completed
    summary: A GitHub Actions workflow run finished.
    description: >-
      Fires when a workflow run completes. Match conclusion (success, failure,
      cancelled, ...) and branch, e.g. conclusion: failure and branch: main to
      react to a broken main.
    keywords: [actions, ci, build, failed, workflow]
    events: [workflow_run.completed]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: conclusion, description: The run's conclusion., example: failure }
      - { name: branch, description: The branch the run was for., example: main }
      - { name: workflow, description: The workflow's name., example: CI }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        workflow: { type: object, properties: { id: { type: integer }, name: { type: string }, path: { type: string } } }
        workflow_run:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            run_number: { type: integer }
            run_attempt: { type: integer }
            event: { type: string }
            status: { type: string }
            conclusion: { type: string }
            head_branch: { type: string }
            head_sha: { type: string }
            html_url: { type: string }
            actor: *user_schema
            run_started_at: { type: string }
            updated_at: { type: string }
            head_commit: { type: object, properties: { id: { type: string }, message: { type: string } } }
            pull_requests: { type: array, items: { type: integer } }
        repository: *repository_schema
        sender: *user_schema

  - id: check_run.completed
    display_name: Check run completed
    summary: A check (a CI job or another App's check) finished.
    description: >-
      Fires when a check run completes. Match conclusion (success, failure,
      cancelled, timed_out, ...), branch, name (the check's name) and app (the
      slug of the App that ran it; github-actions for Actions). Fires once
      per job, so a busy repository sends many; check_suite.completed is one
      event for all of a commit's checks, and workflow_run.completed one for
      a whole Actions workflow.
    keywords: [check, job, status]
    events: [check_run.completed]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: conclusion, description: The check's conclusion., example: failure }
      - { name: branch, description: The branch the check ran on., example: main }
      - { name: name, description: The check's name., example: build }
      - { name: app, description: The slug of the GitHub App that ran the check., example: github-actions }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        check_run:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            status: { type: string }
            conclusion: { type: string }
            head_sha: { type: string }
            head_branch: { type: string }
            check_suite_id: { type: integer }
            html_url: { type: string }
            details_url: { type: string }
            started_at: { type: string }
            completed_at: { type: string }
            app: &app_schema { type: object, properties: { slug: { type: string }, name: { type: string } } }
            output: { type: object, properties: { title: { type: string }, summary: { type: string } } }
            pull_requests: { type: array, items: { type: integer }, description: Numbers of the pull requests the commit belongs to. }
        repository: *repository_schema
        sender: *user_schema

  - id: check_suite.completed
    display_name: Check suite completed
    summary: Every check on a commit finished.
    description: >-
      Fires when all the checks of one App on a commit complete. Match
      conclusion, branch and app (github-actions for Actions). One event per
      App per commit, so it suits "CI finished on this branch" better than
      check_run.completed.
    keywords: [check, suite, status, commit]
    events: [check_suite.completed]
    attributes:
      - *attr_repository
      - *attr_installation
      - *attr_sender
      - *attr_action
      - { name: conclusion, description: The suite's conclusion., example: success }
      - { name: branch, description: The branch the commit is on., example: main }
      - { name: app, description: The slug of the GitHub App that ran the checks., example: github-actions }
    data:
      type: object
      additionalProperties: false
      properties:
        action: { type: string }
        check_suite:
          type: object
          properties:
            id: { type: integer }
            status: { type: string }
            conclusion: { type: string }
            head_sha: { type: string }
            head_branch: { type: string }
            app: *app_schema
            created_at: { type: string }
            updated_at: { type: string }
            pull_requests: { type: array, items: { type: integer } }
        repository: *repository_schema
        sender: *user_schema
