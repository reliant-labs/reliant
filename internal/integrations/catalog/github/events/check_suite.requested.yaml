  - { $ref: ../schemas/attr_action.yaml }
  - name: branch
    description: The branch the commit was pushed to.
    example: >-
      gh-readonly-queue/main/pr-42-6dcb09b5b57875f334f61aebed695e2e4193db5e
  - { name: app, description: The slug of the GitHub App the suite is for., example: reliant-labs }
