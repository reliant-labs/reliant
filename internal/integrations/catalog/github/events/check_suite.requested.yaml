id: check_suite.requested
display_name: Check suite requested
summary: A commit was pushed and asks the App for its checks.
description: >-
  Fires when a push creates a check suite for the App on a commit, asking it
  to run its checks: every push to a branch, and every merge group GitHub's
  merge queue builds (branch gh-readonly-queue/<base>/pr-<number>-<base sha>).
  It is how an App reports a required check on a merge group, which the
  pull_request events never name. Match branch and app;
  data.check_suite.head_sha is the commit to report on. Fires for every push
  to every repository the App is installed on, so filter on the branch.
keywords: [check, suite, requested, merge queue, merge group, required check, commit]
events: [check_suite.requested]
