id: check_run.rerequested
display_name: Check run re-run requested
summary: "Someone clicked Re-run on one of the App's checks."
description: >-
  Fires when someone clicks "Re-run" on a check run the Reliant App created,
  on a pull request or a commit. GitHub sends it only to the App that created
  the check, and re-runs nothing itself: run the check again and report a new
  check run on data.check_run.head_sha (the old run keeps its result). Match
  name (the check's name) and branch. data.check_run.external_id is the id the
  run was created with, and conclusion is how the run being re-run ended.
keywords: [check, re-run, rerun, retry, rerequested, required check, commit]
events: [check_run.rerequested]
