# yaml-language-server: $schema=../../../manifest/schema/event.schema.json
id: pull_request.synchronize
display_name: Pull request updated
summary: New commits were pushed to a pull request.
description: >-
  Fires when the head branch of a pull request gets new commits.
  data.before and data.after are the old and new head SHAs.
keywords: [pr, push, new commits, synchronize]
events: [pull_request.synchronize]
attributes: { $ref: ../schemas/pr_attrs.yaml }
data:
  type: object
  additionalProperties: false
  properties:
    action: { type: string }
    number: { type: integer }
    before: { type: string }
    after: { type: string }
    pull_request: { $ref: ../schemas/pr_schema.yaml }
    repository: { $ref: ../schemas/repository_schema.yaml }
    sender: { $ref: ../schemas/user_schema.yaml }
