# Check run completed: the projection of the GitHub `check_run.completed` webhook.
id: check_run.completed
event: check_run.completed
display_name: Check run completed
summary: A check (a CI job or another App's check) finished.
description: >-
  Fires when a check run completes. Match conclusion (success, failure,
  cancelled, timed_out, ...), branch, name (the check's name) and app (the
  slug of the App that ran it; github-actions for Actions). Fires once per
  job, so a busy repository sends many; check_suite.completed is one event
  for all of a commit's checks, and workflow_run.completed one for a whole
  Actions workflow.
keywords: [check, job, status]
attributes:
  - { name: conclusion, description: "The check's conclusion.", example: failure, from: check_run.conclusion }
  - { name: branch, description: The branch the check ran on., example: main, from: check_run.check_suite.head_branch }
  - { name: name, description: "The check's name.", example: build, from: check_run.name }
  - { name: app, description: The slug of the GitHub App that ran the check., example: github-actions, from: check_run.app.slug }
data:
  check_run:
    kind: object
    fields:
      id: integer
      name: string
      status: string
      conclusion: string
      head_sha: string
      head_branch: { kind: string, from: check_suite.head_branch }
      check_suite_id: { kind: integer, from: check_suite.id }
      html_url: string
      details_url: string
      started_at: string
      completed_at: string
      app: { kind: object, object: app }
      output:
        kind: object
        fields:
          title: { kind: string, cap: true }
          summary: { kind: string, cap: true }
      pull_requests: { kind: integers, pluck: number, description: Numbers of the pull requests the commit belongs to. }
