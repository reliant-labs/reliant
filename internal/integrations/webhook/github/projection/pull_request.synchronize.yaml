# Pull request updated: the projection of the GitHub `pull_request.synchronize` webhook.
id: pull_request.synchronize
event: pull_request.synchronize
display_name: Pull request updated
summary: New commits were pushed to a pull request.
description: >-
  Fires when the head branch of a pull request gets new commits. data.before
  and data.after are the old and new head SHAs.
keywords: [pr, push, new commits, synchronize]
attributes:
  - { group: pr }
data:
  number: integer
  before: string
  after: string
  pull_request: { kind: object, object: pr }
