# Issue unlabeled: the projection of the GitHub `issues.unlabeled` webhook.
id: issue.unlabeled
event: issues.unlabeled
display_name: Issue unlabeled
summary: A label was removed from an issue.
description: >-
  Fires when a label is removed from an issue, by a person or by a run.
  Match `label` to react to one label, e.g. label: agent:ready to notice an
  issue being withdrawn from automation.
keywords: [label, untag, remove label, triage]
attributes:
  - { name: label, description: The label that was removed., example: needs-triage, from: label.name }
data:
  label: { kind: string, from: label.name, description: The label that was removed. }
  issue: { kind: object, object: issue }
