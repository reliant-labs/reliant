# Check suite re-run requested: the projection of the GitHub `check_suite.rerequested` webhook.
id: check_suite.rerequested
event: check_suite.rerequested
display_name: Check suite re-run requested
summary: Someone asked to re-run all of the App's checks on a commit.
description: >-
  Fires when someone clicks "Re-run all checks" for the Reliant App's checks
  on a pull request or a commit. GitHub sends it only to that App, and
  re-runs nothing itself: run the checks again and report new check runs on
  data.check_suite.head_sha. Match branch and app. data.check_suite.conclusion
  is how the suite being re-run ended. A single check's Re-run button sends
  check_run.rerequested instead.
keywords: [check, suite, re-run, rerun, retry, rerequested, required check, commit]
attributes:
  - { name: branch, description: The branch the commit is on., example: main, from: check_suite.head_branch }
  - { name: app, description: The slug of the GitHub App the suite is for., example: reliant-labs, from: check_suite.app.slug }
data:
  check_suite:
    kind: object
    fields:
      id: integer
      status: string
      conclusion: string
      head_sha: string
      head_branch: string
      before: string
      after: string
      app: { kind: object, object: app }
      created_at: string
      updated_at: string
      pull_requests: { kind: integers, pluck: number }
