# Check run re-run requested: the projection of the GitHub `check_run.rerequested` webhook.
id: check_run.rerequested
event: check_run.rerequested
display_name: Check run re-run requested
summary: Someone clicked Re-run on one of the App's checks.
description: >-
  Fires when someone clicks "Re-run" on a check run the Reliant App created,
  on a pull request or a commit. GitHub sends it only to the App that created
  the check, and re-runs nothing itself: run the check again and report a new
  check run on data.check_run.head_sha (the old run keeps its result). Match
  name (the check's name) and branch. data.check_run.external_id is the id
  the run was created with, and conclusion is how the run being re-run ended.
keywords: [check, re-run, rerun, retry, rerequested, required check, commit]
attributes:
  - { name: branch, description: The branch the check ran on., example: main, from: check_run.check_suite.head_branch }
  - { name: name, description: "The check's name.", example: reliant/ci, from: check_run.name }
  - { name: app, description: The slug of the GitHub App that created the check., example: reliant-labs, from: check_run.app.slug }
data:
  check_run:
    kind: object
    fields:
      id: integer
      name: string
      status: string
      conclusion: string
      head_sha: string
      head_branch: { kind: string, from: check_suite.head_branch }
      check_suite_id: { kind: integer, from: check_suite.id }
      external_id: string
      html_url: string
      details_url: string
      started_at: string
      completed_at: string
      app: { kind: object, object: app }
      pull_requests: { kind: integers, pluck: number, description: Numbers of the pull requests the commit belongs to. }
