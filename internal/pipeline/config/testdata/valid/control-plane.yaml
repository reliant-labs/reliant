# control-plane/.reliant/pipeline.yaml (design §10.2)
version: 1
check: "task ci"
gate: {run: "task ci:full", runner: machine, pool: gate, timeout: 60m, infra_patterns_file: .reliant/infra.txt}
                                             # pool members: cicd, ovh-build-1, cp-gate-1 (sysbox)
generated: ["gen/**", "**/*_gen.go", "frontends/**/gen/**"]
regen: "reliant forge generate"
owner_approval:
  - {kind: approve_breaks_rollback, paths: ["db/migrations/**"], when_cmd: "scripts/breaks-rollback.sh"}
  - {kind: approve_prod_fix, when: "incident.source in ['prod_alert','obs_issue']"}
pins:
  - {repo: reliant-labs/reliant, lockstep_with: [reliant-labs/forge],
     bump: "task pin:forge REF={reliant-labs/forge} RELIANT={reliant-labs/reliant}"}
queue: {batch_max: 6}
release: {envs: [{name: prod, soak: 15m, early_pass: 8m}], on_fail: rollback}   # default 2h cadence
recurring: [{name: pentest, schedule: "0 3 * * 1", prompt: .reliant/prompts/pentest.md, output: incident}]
sweep: {checks: [pin_drift, stale_needs_person, {name: licenses, run: "task licenses"}]}
