# Every key of version 1, each set to a non-default value.
version: 1
check: {run: "task ci", checks: ["lint"]}
gate:
  run: "task gate"
  stages: {lint: {run: "task lint"}, build: off, sbom_scan: {run: "task scan"}}
  runner: machine
  pool: gate-big
  timeout: 90m
  checks: ["Windows"]
  env: {GOFLAGS: "-mod=mod", PARALLEL: 8, VERBOSE: true}
  infra_patterns: ["no space left on device", "connection reset by peer"]
  infra_patterns_file: .reliant/infra.txt
generated: ["gen/**"]
regen: "task generate"
owner_approval:
  - {kind: approve_breaking_proto, paths: ["proto/**"], when_cmd: "scripts/buf-breaking.sh"}
  - {kind: approve_breaks_rollback, paths: ["db/migrations/**"]}
  - {kind: approve_prod_fix, when: "incident.source == 'prod_alert'"}
pins:
  - repo: reliant-labs/reliant
    file: go.mod
    bump: "task pin REF={forge} RELIANT={reliant-labs/reliant}"
    lockstep_with: [reliant-labs/forge]
consumers:
  - {repo: reliant-labs/control-plane, mode: required, command: "task ci:consumer PRODUCER_SHA={candidate}"}
queue: {batch_max: 8, speculate: 1, rerun_on_red: 2, preempt: true}
review: {max_rounds: 5}
fix: {attempts_per_signature: 4}
flake: {policy: delete, quarantine_days: 3}
release:
  schedule: "0 */4 * * 1-5 if main moved"
  on_land: true
  pool: release
  envs:
    - {name: staging, soak: 15m, approval: none, inconclusive: probes, probes: [health, {name: smoke, run: "task smoke ENV=staging"}], strategy: {kind: all_at_once}}
    - {name: prod, soak: 30m, approval: required, early_pass: 8m}
  on_fail: fix_forward
recurring:
  - {name: pentest, schedule: "0 3 * * 1", prompt: .reliant/prompts/pentest.md, output: incident, tools: [view, shell], timeout: 2h}
  - {name: simplicity, schedule: "0 4 * * *", prompt: .reliant/prompts/simplicity.md, output: pr, max_prs: 2}
  - {name: canary, schedule: "every 6h", run: "task canary", output: none}
sweep:
  schedule: "30 5 * * *"
  checks: [stale_pr, escapes, {name: licenses, run: "task licenses"}]
playbooks:
  main: .reliant/playbooks/main.md
  prod_alert: .reliant/playbooks/prod.md
