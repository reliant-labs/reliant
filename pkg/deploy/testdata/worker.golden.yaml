---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: reconciler
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: reconciler
  namespace: demo-prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciler
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: forge
        app.kubernetes.io/name: reconciler
        app.kubernetes.io/part-of: demo
        forge.dev/env: prod
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /app/demo
        - reconcile
        image: ghcr.io/acme/demo:v1.2.3
        imagePullPolicy: IfNotPresent
        name: reconciler
        resources:
          limits:
            cpu: 250m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: reconciler
      terminationGracePeriodSeconds: 40
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: reconciler
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: reconciler
  namespace: demo-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: reconciler
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: reconciler-role
  namespace: demo-prod
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - example.com
  resources:
  - widgets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: reconciler
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: reconciler-rolebinding
  namespace: demo-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reconciler-role
subjects:
- kind: ServiceAccount
  name: reconciler
  namespace: demo-prod
