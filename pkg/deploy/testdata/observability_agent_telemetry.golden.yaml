---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    forge.dev/env: staging
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: forge-observability
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: otel-agent
  namespace: forge-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: forge-observability-otel-agent
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/stats
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: forge-observability-otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-observability-otel-agent
subjects:
- kind: ServiceAccount
  name: otel-agent
  namespace: forge-observability
---
apiVersion: v1
data:
  config.yaml: |
    exporters:
      otlphttp/destination:
        endpoint: https://otlp.example.com
        headers: ${env:FORGE_OTLP_HEADERS}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 300s
          max_interval: 30s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2000
          storage: file_storage
      otlphttp/destination_telemetry_isolated:
        endpoint: https://otlp.example.com
        headers: ${env:FORGE_OTLP_HEADERS}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 2m
          max_interval: 30s
        sending_queue:
          block_on_overflow: false
          enabled: true
          num_consumers: 1
          queue_size: 200
    extensions:
      bearertokenauth/telemetry_openbao_0:
        filename: /etc/forge/telemetry/secrets/openbao-metrics/token
      file_storage:
        create_directory: true
        directory: /var/lib/otel-agent
      health_check:
        endpoint: 0.0.0.0:13133
      k8s_observer/telemetry:
        auth_type: serviceAccount
        node: ${env:K8S_NODE_NAME}
        observe_nodes: false
        observe_pods: true
        observe_services: false
    processors:
      batch:
        send_batch_size: 8192
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: service.name
          - from: pod
            key: app.kubernetes.io/part-of
            tag_name: service.namespace
          - from: pod
            key: forge.dev/env
            tag_name: deployment.environment.name
          - from: pod
            key: app.kubernetes.io/version
            tag_name: service.version
          - from: pod
            key: app
            tag_name: forge.telemetry.label.app
          - from: pod
            key: app.kubernetes.io/component
            tag_name: forge.telemetry.label.app.kubernetes.io/component
          - from: pod
            key: app.kubernetes.io/name
            tag_name: forge.telemetry.label.app.kubernetes.io/name
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.deployment.name
          - k8s.container.name
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 1s
        limit_mib: 204
        spike_limit_mib: 51
      transform/line_resource:
        error_mode: ignore
        log_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], attributes["forge.line.service.name"]) where
            attributes["service.name"] == nil and attributes["forge.line.service.name"]
            != nil
          - set(attributes["service.version"], attributes["forge.line.service.version"])
            where attributes["service.version"] == nil and attributes["forge.line.service.version"]
            != nil
          - set(attributes["service.namespace"], attributes["forge.line.service.namespace"])
            where attributes["service.namespace"] == nil and attributes["forge.line.service.namespace"]
            != nil
          - set(attributes["deployment.environment.name"], attributes["forge.line.deployment.environment.name"])
            where attributes["deployment.environment.name"] == nil and attributes["forge.line.deployment.environment.name"]
            != nil
          - set(attributes["service.instance.id"], attributes["forge.line.service.instance.id"])
            where attributes["service.instance.id"] == nil and attributes["forge.line.service.instance.id"]
            != nil
          - delete_matching_keys(attributes, "^forge[.]line[.]")
      transform/strip_client_identity:
        error_mode: ignore
        log_statements:
        - context: resource
          statements:
          - delete_matching_keys(resource.attributes, "^(k8s|reliant|forge\\.telemetry\\.label)\\..*")
        metric_statements:
        - context: resource
          statements:
          - delete_matching_keys(resource.attributes, "^(k8s|reliant|forge\\.telemetry\\.label)\\..*")
        profile_statements:
        - context: resource
          statements:
          - delete_matching_keys(resource.attributes, "^(k8s|reliant|forge\\.telemetry\\.label)\\..*")
        trace_statements:
        - context: resource
          statements:
          - delete_matching_keys(resource.attributes, "^(k8s|reliant|forge\\.telemetry\\.label)\\..*")
      transform/telemetry_identity:
        error_mode: ignore
        log_statements:
        - conditions:
          - (attributes["k8s.namespace.name"] == "demo-prod") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "zitadel"
          context: resource
          statements:
          - set(attributes["service.name"], "zitadel")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
            == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "temporal"
          context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "openbao"
          context: resource
          statements:
          - set(attributes["service.name"], "openbao")
        - conditions:
          - (attributes["k8s.namespace.name"] == "observability") and attributes["forge.telemetry.label.app"]
            == "clickhouse"
          context: resource
          statements:
          - set(attributes["service.name"], "clickhouse")
        - context: resource
          statements:
          - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
        metric_statements:
        - conditions:
          - (attributes["k8s.namespace.name"] == "demo-prod") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "zitadel"
          context: resource
          statements:
          - set(attributes["service.name"], "zitadel")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
            == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "temporal"
          context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "openbao"
          context: resource
          statements:
          - set(attributes["service.name"], "openbao")
        - conditions:
          - (attributes["k8s.namespace.name"] == "observability") and attributes["forge.telemetry.label.app"]
            == "clickhouse"
          context: resource
          statements:
          - set(attributes["service.name"], "clickhouse")
        - context: resource
          statements:
          - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
        profile_statements:
        - conditions:
          - (attributes["k8s.namespace.name"] == "demo-prod") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "zitadel"
          context: resource
          statements:
          - set(attributes["service.name"], "zitadel")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
            == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "temporal"
          context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "openbao"
          context: resource
          statements:
          - set(attributes["service.name"], "openbao")
        - conditions:
          - (attributes["k8s.namespace.name"] == "observability") and attributes["forge.telemetry.label.app"]
            == "clickhouse"
          context: resource
          statements:
          - set(attributes["service.name"], "clickhouse")
        - context: resource
          statements:
          - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
        trace_statements:
        - conditions:
          - (attributes["k8s.namespace.name"] == "demo-prod") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "zitadel"
          context: resource
          statements:
          - set(attributes["service.name"], "zitadel")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
            == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "temporal"
          context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - conditions:
          - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
            == "openbao"
          context: resource
          statements:
          - set(attributes["service.name"], "openbao")
        - conditions:
          - (attributes["k8s.namespace.name"] == "observability") and attributes["forge.telemetry.label.app"]
            == "clickhouse"
          context: resource
          statements:
          - set(attributes["service.name"], "clickhouse")
        - context: resource
          statements:
          - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
      transform/telemetry_logs:
        error_mode: silent
        log_statements:
        - conditions:
          - resource.attributes["service.name"] == "zitadel"
          statements:
          - set(log.attributes["forge.telemetry.original"], log.body) where log.attributes["forge.telemetry.original"]
            == nil
          - set(log.attributes["forge.telemetry.parsed"], ParseJSON(log.attributes["forge.telemetry.original"]))
            where IsMatch(log.attributes["forge.telemetry.original"], "^\\s*\\{")
          - set(log.severity_text, String(log.attributes["forge.telemetry.parsed"]["level"]))
            where log.attributes["forge.telemetry.parsed"]["level"] != nil
          - set(log.severity_number, SEVERITY_NUMBER_UNSPECIFIED) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil
          - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:trace)$$")
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:debug)$$")
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:info|information)$$")
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:warn|warning)$$")
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:error|err)$$")
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:fatal|critical|crit|panic)$$")
          - set(log.body, log.attributes["forge.telemetry.parsed"]["msg"]) where log.attributes["forge.telemetry.parsed"]["msg"]
            != nil
          - delete_key(log.attributes, "level")
          - delete_key(log.attributes, "msg")
        - conditions:
          - resource.attributes["service.name"] == "temporal" and resource.attributes["k8s.container.name"]
            == "temporal"
          statements:
          - set(log.attributes["forge.telemetry.original"], log.body) where log.attributes["forge.telemetry.original"]
            == nil
          - set(log.attributes["forge.telemetry.parsed"], ParseJSON(log.attributes["forge.telemetry.original"]))
            where IsMatch(log.attributes["forge.telemetry.original"], "^\\s*\\{")
          - set(log.time_unix_nano, Int(Double(log.attributes["forge.telemetry.parsed"]["ts"]))
            * 1000000000 + Int((Double(log.attributes["forge.telemetry.parsed"]["ts"])
            - Double(Int(Double(log.attributes["forge.telemetry.parsed"]["ts"])))) * 1000000000.0))
            where log.attributes["forge.telemetry.parsed"]["ts"] != nil
          - set(log.severity_text, String(log.attributes["forge.telemetry.parsed"]["level"]))
            where log.attributes["forge.telemetry.parsed"]["level"] != nil
          - set(log.severity_number, SEVERITY_NUMBER_UNSPECIFIED) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil
          - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:trace)$$")
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:debug)$$")
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:info|information)$$")
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:warn|warning)$$")
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:error|err)$$")
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.attributes["forge.telemetry.parsed"]["level"]
            != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
            "(?i)^(?:fatal|critical|crit|panic)$$")
          - set(log.body, log.attributes["forge.telemetry.parsed"]["msg"]) where log.attributes["forge.telemetry.parsed"]["msg"]
            != nil
          - set(log.attributes["forge.telemetry.rule"], 0) where log.attributes["forge.telemetry.rule"]
            == nil and IsMatch(log.body, "(?i)workflow not found") and log.severity_number
            >= SEVERITY_NUMBER_ERROR and log.severity_number <= SEVERITY_NUMBER_ERROR4
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.rule"]
            == 0
          - set(log.severity_text, "WARN") where log.attributes["forge.telemetry.rule"]
            == 0
          - delete_key(log.attributes, "ts")
          - delete_key(log.attributes, "level")
          - delete_key(log.attributes, "msg")
        - statements:
          - delete_key(log.attributes, "forge.telemetry.original")
          - delete_key(log.attributes, "forge.telemetry.parsed")
          - delete_key(log.attributes, "forge.telemetry.rule")
      transform/telemetry_target/clickhouse:
        error_mode: ignore
        metric_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "clickhouse")
        - context: datapoint
          statements:
          - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
            where datapoint.attributes["forge_k8s_namespace"] != nil
          - delete_key(datapoint.attributes, "forge_k8s_namespace")
      transform/telemetry_target/openbao:
        error_mode: ignore
        metric_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "openbao")
        - context: datapoint
          statements:
          - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
            where datapoint.attributes["forge_k8s_namespace"] != nil
          - delete_key(datapoint.attributes, "forge_k8s_namespace")
        profile_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "openbao")
      transform/telemetry_target/temporal:
        error_mode: ignore
        metric_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - context: metric
          statements:
          - convert_gauge_to_sum("cumulative", true) where metric.type == METRIC_DATA_TYPE_GAUGE
            and IsMatch(metric.name, "^(?:(?:num_goroutines))$$")
        - context: datapoint
          statements:
          - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
            where datapoint.attributes["forge_k8s_namespace"] != nil
          - delete_key(datapoint.attributes, "forge_k8s_namespace")
        profile_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "temporal")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
      transform/telemetry_target/zitadel:
        error_mode: ignore
        metric_statements:
        - context: resource
          statements:
          - set(attributes["service.name"], "zitadel")
          - set(attributes["deployment.environment.name"], "staging")
          - set(attributes["service.namespace"], "demo")
        - context: datapoint
          statements:
          - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
            where datapoint.attributes["forge_k8s_namespace"] != nil
          - delete_key(datapoint.attributes, "forge_k8s_namespace")
    receivers:
      filelog:
        exclude:
        - /var/log/pods/forge-observability_*/*/*.log
        include:
        - /var/log/pods/*/*/*.log
        include_file_path: true
        operators:
        - id: container-parser
          type: container
        - from: body
          id: forge_telemetry_original
          if: resource["k8s.namespace.name"] in ["demo-prod", "temporal"]
          to: attributes["forge.telemetry.original"]
          type: copy
        - if: body matches "^\\s*\\{"
          on_error: send_quiet
          parse_from: body
          severity:
            parse_from: attributes.level
          timestamp:
            layout: 2006-01-02T15:04:05.999999999Z07:00
            layout_type: gotime
            parse_from: attributes.time
          type: json_parser
        - if: attributes.trace_id != nil
          span_id:
            parse_from: attributes.span_id
          trace_id:
            parse_from: attributes.trace_id
          type: trace_parser
        - field: attributes.trace_id
          if: attributes.trace_id != nil
          type: remove
        - field: attributes.span_id
          if: attributes.span_id != nil
          type: remove
        - field: attributes.time
          if: attributes.time != nil
          type: remove
        - field: attributes.level
          if: attributes.level != nil
          type: remove
        - from: attributes.msg
          if: attributes.msg != nil
          to: body
          type: move
        - from: attributes.resource["service.name"]
          if: type(attributes.resource) == "map" && attributes.resource["service.name"]
            != nil && resource["forge.line.service.name"] == nil
          to: resource["forge.line.service.name"]
          type: move
        - from: attributes.resource["service.version"]
          if: type(attributes.resource) == "map" && attributes.resource["service.version"]
            != nil && resource["forge.line.service.version"] == nil
          to: resource["forge.line.service.version"]
          type: move
        - from: attributes.resource["service.namespace"]
          if: type(attributes.resource) == "map" && attributes.resource["service.namespace"]
            != nil && resource["forge.line.service.namespace"] == nil
          to: resource["forge.line.service.namespace"]
          type: move
        - from: attributes.resource["deployment.environment.name"]
          if: type(attributes.resource) == "map" && attributes.resource["deployment.environment.name"]
            != nil && resource["forge.line.deployment.environment.name"] == nil
          to: resource["forge.line.deployment.environment.name"]
          type: move
        - from: attributes.resource["service.instance.id"]
          if: type(attributes.resource) == "map" && attributes.resource["service.instance.id"]
            != nil && resource["forge.line.service.instance.id"] == nil
          to: resource["forge.line.service.instance.id"]
          type: move
        - field: attributes.resource
          if: type(attributes.resource) == "map"
          type: remove
        start_at: end
        storage: file_storage
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            idle_timeout: 5m
      prometheus/telemetry_clickhouse:
        config:
          scrape_configs:
          - fallback_scrape_protocol: PrometheusText0.0.4
            job_name: telemetry/clickhouse/0
            kubernetes_sd_configs:
            - namespaces:
                names:
                - observability
              role: pod
              selectors:
              - field: spec.nodeName=${env:K8S_NODE_NAME}
                label: app=clickhouse
                role: pod
            label_limit: 30
            label_value_length_limit: 256
            metric_relabel_configs:
            - action: keep
              regex: up|(?:ClickHouseProfileEvents_.*)
              source_labels:
              - __name__
            metrics_path: /metrics
            relabel_configs:
            - action: keep
              regex: Running
              source_labels:
              - __meta_kubernetes_pod_phase
            - action: drop
              regex: "true"
              source_labels:
              - __meta_kubernetes_pod_container_init
            - action: replace
              regex: ([^:]+)
              replacement: $${1}:9363
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (.+:.+)
              replacement: '[$${1}]:9363'
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - action: replace
              source_labels:
              - __meta_kubernetes_namespace
              target_label: forge_k8s_namespace
            sample_limit: 5000
            scheme: http
            scrape_interval: 30s
            scrape_timeout: 10s
      prometheus/telemetry_openbao:
        config:
          scrape_configs:
          - authorization:
              credentials_file: /etc/forge/telemetry/secrets/openbao-metrics/token
              type: Bearer
            fallback_scrape_protocol: PrometheusText0.0.4
            job_name: telemetry/openbao/0
            kubernetes_sd_configs:
            - namespaces:
                names:
                - openbao
              role: pod
              selectors:
              - field: spec.nodeName=${env:K8S_NODE_NAME}
                label: app.kubernetes.io/name=openbao
                role: pod
            label_limit: 30
            label_value_length_limit: 256
            metric_relabel_configs:
            - action: keep
              regex: up|(?:vault_core_(unsealed|active))
              source_labels:
              - __name__
            metrics_path: /v1/sys/metrics
            relabel_configs:
            - action: keep
              regex: Running
              source_labels:
              - __meta_kubernetes_pod_phase
            - action: drop
              regex: "true"
              source_labels:
              - __meta_kubernetes_pod_container_init
            - action: replace
              regex: ([^:]+)
              replacement: $${1}:8200
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (.+:.+)
              replacement: '[$${1}]:8200'
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - action: replace
              source_labels:
              - __meta_kubernetes_namespace
              target_label: forge_k8s_namespace
            sample_limit: 5000
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              ca_file: /etc/forge/telemetry/secrets/openbao-ca/ca.crt
      prometheus/telemetry_temporal:
        config:
          scrape_configs:
          - fallback_scrape_protocol: PrometheusText0.0.4
            job_name: telemetry/temporal/0
            kubernetes_sd_configs:
            - namespaces:
                names:
                - temporal
              role: pod
              selectors:
              - field: spec.nodeName=${env:K8S_NODE_NAME}
                label: app.kubernetes.io/component=frontend,app.kubernetes.io/name=temporal
                role: pod
            label_limit: 30
            label_value_length_limit: 256
            metric_relabel_configs:
            - action: keep
              regex: up|(?:service_requests|service_latency_(bucket|sum|count)|num_goroutines)
              source_labels:
              - __name__
            - action: labeldrop
              regex: workflowType
            metrics_path: /metrics
            relabel_configs:
            - action: keep
              regex: Running
              source_labels:
              - __meta_kubernetes_pod_phase
            - action: drop
              regex: "true"
              source_labels:
              - __meta_kubernetes_pod_container_init
            - action: replace
              regex: ([^:]+)
              replacement: $${1}:9090
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (.+:.+)
              replacement: '[$${1}]:9090'
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - action: replace
              source_labels:
              - __meta_kubernetes_namespace
              target_label: forge_k8s_namespace
            sample_limit: 20000
            scheme: http
            scrape_interval: 30s
            scrape_timeout: 10s
      prometheus/telemetry_zitadel:
        config:
          scrape_configs:
          - fallback_scrape_protocol: PrometheusText0.0.4
            job_name: telemetry/zitadel/0
            kubernetes_sd_configs:
            - namespaces:
                names:
                - demo-prod
              role: pod
              selectors:
              - field: spec.nodeName=${env:K8S_NODE_NAME}
                label: app.kubernetes.io/name=zitadel
                role: pod
            label_limit: 30
            label_value_length_limit: 256
            metric_relabel_configs:
            - action: keep
              regex: up|(?:projection_events_processed_total)
              source_labels:
              - __name__
            metrics_path: /debug/metrics
            relabel_configs:
            - action: keep
              regex: Running
              source_labels:
              - __meta_kubernetes_pod_phase
            - action: drop
              regex: "true"
              source_labels:
              - __meta_kubernetes_pod_container_init
            - action: replace
              regex: ([^:]+)
              replacement: $${1}:8080
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (.+:.+)
              replacement: '[$${1}]:8080'
              source_labels:
              - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - action: replace
              source_labels:
              - __meta_kubernetes_namespace
              target_label: forge_k8s_namespace
            sample_limit: 5000
            scheme: http
            scrape_interval: 30s
            scrape_timeout: 10s
      receiver_creator/telemetry_openbao_profiles:
        receivers:
          pprof/0_heap:
            config:
              remote:
                auth:
                  authenticator: bearertokenauth/telemetry_openbao_0
                collection_interval: 5m
                endpoint: 'https://`endpoint contains ":" ? "[" + endpoint + "]" : endpoint`:8200/v1/sys/pprof/heap'
                timeout: 30s
                tls:
                  insecure_skip_verify: true
            rule: type == "pod" && namespace in ["openbao"] && labels["app.kubernetes.io/name"]
              == "openbao"
        watch_observers:
        - k8s_observer/telemetry
      receiver_creator/telemetry_temporal_checks:
        receivers:
          tcpcheck/frontend:
            config:
              collection_interval: 30s
              targets:
              - endpoint: '`endpoint contains ":" ? "[" + endpoint + "]" : endpoint`:7233'
            rule: type == "pod" && namespace in ["temporal"] && labels["app.kubernetes.io/component"]
              == "frontend" && labels["app.kubernetes.io/name"] == "temporal"
        watch_observers:
        - k8s_observer/telemetry
      receiver_creator/telemetry_temporal_profiles:
        receivers:
          pprof/0_cpu:
            config:
              remote:
                collection_interval: 5m
                endpoint: 'http://`endpoint contains ":" ? "[" + endpoint + "]" : endpoint`:7936/debug/pprof/profile?seconds=5'
                timeout: 20s
            rule: type == "pod" && namespace in ["temporal"] && labels["app.kubernetes.io/component"]
              == "frontend" && labels["app.kubernetes.io/name"] == "temporal"
          pprof/0_heap:
            config:
              remote:
                collection_interval: 5m
                endpoint: 'http://`endpoint contains ":" ? "[" + endpoint + "]" : endpoint`:7936/debug/pprof/heap'
                timeout: 30s
            rule: type == "pod" && namespace in ["temporal"] && labels["app.kubernetes.io/component"]
              == "frontend" && labels["app.kubernetes.io/name"] == "temporal"
        watch_observers:
        - k8s_observer/telemetry
    service:
      extensions:
      - health_check
      - file_storage
      - k8s_observer/telemetry
      - bearertokenauth/telemetry_openbao_0
      pipelines:
        logs:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - k8sattributes
          - transform/telemetry_identity
          - transform/telemetry_logs
          - transform/line_resource
          - batch
          receivers:
          - filelog
        metrics:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/strip_client_identity
          - k8sattributes
          - transform/telemetry_identity
          - batch
          receivers:
          - otlp
        metrics/node:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - k8sattributes
          - transform/telemetry_identity
          - batch
          receivers:
          - kubeletstats
        metrics/telemetry_clickhouse:
          exporters:
          - otlphttp/destination_telemetry_isolated
          processors:
          - memory_limiter
          - transform/telemetry_target/clickhouse
          - batch
          receivers:
          - prometheus/telemetry_clickhouse
        metrics/telemetry_openbao:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/telemetry_target/openbao
          - batch
          receivers:
          - prometheus/telemetry_openbao
        metrics/telemetry_temporal:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/telemetry_target/temporal
          - batch
          receivers:
          - prometheus/telemetry_temporal
          - receiver_creator/telemetry_temporal_checks
        metrics/telemetry_zitadel:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/telemetry_target/zitadel
          - batch
          receivers:
          - prometheus/telemetry_zitadel
        profiles:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/strip_client_identity
          - k8sattributes
          - transform/telemetry_identity
          receivers:
          - otlp
        profiles/telemetry_openbao:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/telemetry_target/openbao
          receivers:
          - receiver_creator/telemetry_openbao_profiles
        profiles/telemetry_temporal:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/telemetry_target/temporal
          receivers:
          - receiver_creator/telemetry_temporal_profiles
        traces:
          exporters:
          - otlphttp/destination
          processors:
          - memory_limiter
          - transform/strip_client_identity
          - k8sattributes
          - transform/telemetry_identity
          - batch
          receivers:
          - otlp
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: otel-agent
  namespace: forge-observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: otel-agent
  namespace: forge-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: forge
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/part-of: demo
        forge.dev/env: staging
    spec:
      containers:
      - args:
        - --config=/etc/otel/config.yaml
        - --feature-gates=service.profilesSupport
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: GOMEMLIMIT
          value: 204MiB
        - name: FORGE_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              key: headers
              name: otlp-auth
        image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
        name: collector
        ports:
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        - containerPort: 13133
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 13133
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/otel
          name: config
          readOnly: true
        - mountPath: /var/log/pods
          name: pod-logs
          readOnly: true
        - mountPath: /var/lib/otel-agent
          name: storage
        - mountPath: /etc/forge/telemetry/secrets/openbao-ca
          name: telemetry-secret-0
          readOnly: true
        - mountPath: /etc/forge/telemetry/secrets/openbao-metrics
          name: telemetry-secret-1
          readOnly: true
      enableServiceLinks: false
      serviceAccountName: otel-agent
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: otel-agent
        name: config
      - hostPath:
          path: /var/log/pods
          type: Directory
        name: pod-logs
      - hostPath:
          path: /var/lib/forge-otel-agent
          type: DirectoryOrCreate
        name: storage
      - name: telemetry-secret-0
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: openbao-ca
      - name: telemetry-secret-1
        secret:
          items:
          - key: token
            path: token
          secretName: openbao-metrics
  updateStrategy:
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: otel-agent
  namespace: forge-observability
spec:
  internalTrafficPolicy: Local
  ports:
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: otlp-http
  selector:
    app.kubernetes.io/name: otel-agent
