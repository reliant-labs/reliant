---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: store
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: store
  namespace: demo-prod
