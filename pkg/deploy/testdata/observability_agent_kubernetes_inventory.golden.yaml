spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: otel-agent
  namespace: forge-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: demo
