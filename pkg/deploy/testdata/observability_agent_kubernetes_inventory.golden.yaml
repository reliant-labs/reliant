kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: cluster-collector
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: cluster-collector
  namespace: forge-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: cluster-collector
    app.kubernetes.io/part-of: demo
    forge.dev/env: staging
  name: cluster-collector
  namespace: forge-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-collector
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        forge.dev/config-sha256: 84037ea605914e52867fbe829d3606e87e7635f5c5dc9cc0a04be28587652022
      labels:
        app.kubernetes.io/managed-by: forge
        app.kubernetes.io/name: cluster-collector
        app.kubernetes.io/part-of: demo
        forge.dev/env: staging
    spec:
      containers:
      - args:
        - --config=/etc/otel/config.yaml
        env:
        - name: GOMEMLIMIT
          value: 204MiB
        image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
        name: collector
        ports:
        - containerPort: 13133
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 13133
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/otel
          name: config
          readOnly: true
        - mountPath: /etc/otel-auth
          name: otlp-token
          readOnly: true
      enableServiceLinks: false
      serviceAccountName: cluster-collector
      volumes:
      - configMap:
          name: cluster-collector
        name: config
      - name: otlp-token
        secret:
          items:
          - key: token
            path: token
          optional: true
          secretName: forge-telemetry-token
