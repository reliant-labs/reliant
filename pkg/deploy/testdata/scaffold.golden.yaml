kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: idp-provision
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: idp-provision-role
  namespace: demo-prod
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: idp-provision
    app.kubernetes.io/part-of: demo
    forge.dev/env: prod
  name: idp-provision-rolebinding
  namespace: demo-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idp-provision-role
subjects:
- kind: ServiceAccount
  name: idp-provision
  namespace: demo-prod
