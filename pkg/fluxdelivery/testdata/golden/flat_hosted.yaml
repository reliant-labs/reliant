spec:
  commonMetadata:
    labels:
      reliant.dev/environment: env-prod
      reliant.dev/org: acme
  deletionPolicy: Orphan
  interval: 5m0s
  patches:
  - patch: |
      metadata:
        labels:
          forge.dev/deployment-id: d-1
    target:
      group: forge.dev
      kind: Workload
      name: api
      version: v1alpha1
  path: manifests/hosted
  prune: true
  serviceAccountName: reliant-deploy-tenant
  sourceRef:
