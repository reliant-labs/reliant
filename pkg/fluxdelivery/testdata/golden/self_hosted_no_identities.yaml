    sharding.fluxcd.io/key: shard0
  name: acme.env.prod-gke-acme-prod-base-rollout
  namespace: forge-delivery-acme-prod
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: acme.env.prod-gke-acme-prod-base-pre
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: api
