  interval: 10m0s
  path: manifests/gke_acme_prod/base/rollout
  prune: true
  retryInterval: 15s
  serviceAccountName: ""
  sourceRef:
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    name: acme.env.prod
  timeout: 1m30s
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
