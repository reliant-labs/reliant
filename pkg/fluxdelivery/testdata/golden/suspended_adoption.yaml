---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  annotations:
    deploy.reliant.dev/generation: "42"
    fluxcd.controlplane.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: reliant-control-plane
    reliant.dev/environment: env-prod
    reliant.dev/org: acme
    resourceset.fluxcd.controlplane.io/name: delivery.env-prod
    resourceset.fluxcd.controlplane.io/namespace: flux-acme
    sharding.fluxcd.io/key: shard0
  name: acme.env.env-prod
  namespace: flux-acme
spec:
  insecure: true
  interval: 5m0s
  layerSelector:
    mediaType: application/vnd.forge.bundle.manifests.v1.tar+gzip
    operation: extract
  provider: generic
  ref:
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  secretRef:
    name: registry-pull
  url: oci://registry.example.com/orgs/acme/bundle.v1/prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    fluxcd.controlplane.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: reliant-control-plane
    reliant.dev/cluster: daemon
    reliant.dev/delivery-unit: daemon-substrate
    reliant.dev/environment: env-prod
    reliant.dev/org: acme
    reliant.dev/phase: pre
    resourceset.fluxcd.controlplane.io/name: delivery.env-prod
    resourceset.fluxcd.controlplane.io/namespace: flux-acme
    sharding.fluxcd.io/key: connected
  name: acme.env.env-prod-daemon-daemon-substrate-pre
  namespace: flux-acme
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: acme.env.foundation-hub-base-post
  healthCheckExprs:
  - apiVersion: external-secrets.io/v1
    current: |-
      has(metadata.generation) &&
      metadata.generation > 0 &&
      has(status.conditions) &&
      has(status.syncedResourceVersion) &&
      status.conditions.exists(c, has(c.type) && has(c.status) && c.type == 'Ready' && c.status == 'True') &&
      status.syncedResourceVersion.startsWith(string(metadata.generation) + '-')
    kind: ExternalSecret
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: db-credentials
    namespace: app
  interval: 5m0s
  kubeConfig:
    secretRef:
      key: value
      name: daemon-kubeconfig
  path: manifests/daemon/daemon-substrate/pre
  prune: true
  retryInterval: 15s
  serviceAccountName: ""
  sourceRef:
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    name: acme.env.env-prod
  suspend: true
  timeout: 1m30s
  wait: false
