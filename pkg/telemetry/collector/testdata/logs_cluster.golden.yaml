exporters: {}
extensions:
  k8s_observer/telemetry:
    auth_type: serviceAccount
    node: ${env:K8S_NODE_NAME}
    observe_nodes: false
    observe_pods: true
    observe_services: false
k8sattributes_labels:
- from: pod
  key: app.kubernetes.io/component
  tag_name: forge.telemetry.label.app.kubernetes.io/component
- from: pod
  key: app.kubernetes.io/name
  tag_name: forge.telemetry.label.app.kubernetes.io/name
logs_preserve:
  from: body
  id: forge_telemetry_original
  if: resource["k8s.namespace.name"] in ["openbao", "temporal"]
  to: attributes["forge.telemetry.original"]
  type: copy
logs_processors:
- transform/telemetry_identity
- transform/telemetry_logs
node_metrics_processors:
- transform/telemetry_identity
pipelines:
  metrics/telemetry_openbao:
    exporters:
    - otlphttp/destination
    processors:
    - memory_limiter
    - transform/telemetry_target/openbao
    - batch
    receivers:
    - prometheus/telemetry_openbao
  metrics/telemetry_temporal:
    exporters:
    - otlphttp/destination
    processors:
    - memory_limiter
    - transform/telemetry_target/temporal
    - batch
    receivers:
    - prometheus/telemetry_temporal
    - receiver_creator/telemetry_temporal_checks
processors:
  transform/telemetry_identity:
    error_mode: ignore
    log_statements:
    - conditions:
      - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
        == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "temporal"
      context: resource
      statements:
      - set(attributes["service.name"], "temporal")
      - set(attributes["deployment.environment.name"], "dev")
      - set(attributes["service.namespace"], "acme")
    - conditions:
      - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "openbao"
      context: resource
      statements:
      - set(attributes["service.name"], "openbao")
    - context: resource
      statements:
      - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
    metric_statements:
    - conditions:
      - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
        == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "temporal"
      context: resource
      statements:
      - set(attributes["service.name"], "temporal")
      - set(attributes["deployment.environment.name"], "dev")
      - set(attributes["service.namespace"], "acme")
    - conditions:
      - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "openbao"
      context: resource
      statements:
      - set(attributes["service.name"], "openbao")
    - context: resource
      statements:
      - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
    profile_statements:
    - conditions:
      - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
        == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "temporal"
      context: resource
      statements:
      - set(attributes["service.name"], "temporal")
      - set(attributes["deployment.environment.name"], "dev")
      - set(attributes["service.namespace"], "acme")
    - conditions:
      - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "openbao"
      context: resource
      statements:
      - set(attributes["service.name"], "openbao")
    - context: resource
      statements:
      - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
    trace_statements:
    - conditions:
      - (attributes["k8s.namespace.name"] == "temporal") and attributes["forge.telemetry.label.app.kubernetes.io/component"]
        == "frontend" and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "temporal"
      context: resource
      statements:
      - set(attributes["service.name"], "temporal")
      - set(attributes["deployment.environment.name"], "dev")
      - set(attributes["service.namespace"], "acme")
    - conditions:
      - (attributes["k8s.namespace.name"] == "openbao") and attributes["forge.telemetry.label.app.kubernetes.io/name"]
        == "openbao"
      context: resource
      statements:
      - set(attributes["service.name"], "openbao")
    - context: resource
      statements:
      - delete_matching_keys(attributes, "^forge\\.telemetry\\.label\\.")
  transform/telemetry_logs:
    error_mode: silent
    log_statements:
    - conditions:
      - resource.attributes["service.name"] == "temporal" and resource.attributes["k8s.container.name"]
        == "temporal"
      statements:
      - set(log.attributes["forge.telemetry.original"], log.body) where log.attributes["forge.telemetry.original"]
        == nil
      - set(log.attributes["forge.telemetry.parsed"], ParseJSON(log.attributes["forge.telemetry.original"]))
        where IsMatch(log.attributes["forge.telemetry.original"], "^\\s*\\{")
      - set(log.time_unix_nano, Int(Double(log.attributes["forge.telemetry.parsed"]["ts"]))
        * 1000000000 + Int((Double(log.attributes["forge.telemetry.parsed"]["ts"])
        - Double(Int(Double(log.attributes["forge.telemetry.parsed"]["ts"])))) * 1000000000.0))
        where log.attributes["forge.telemetry.parsed"]["ts"] != nil
      - set(log.severity_text, String(log.attributes["forge.telemetry.parsed"]["level"]))
        where log.attributes["forge.telemetry.parsed"]["level"] != nil
      - set(log.severity_number, SEVERITY_NUMBER_UNSPECIFIED) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil
      - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:trace)$$")
      - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:debug)$$")
      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:info|information)$$")
      - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:warn|warning)$$")
      - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:error|err)$$")
      - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.attributes["forge.telemetry.parsed"]["level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["level"]),
        "(?i)^(?:fatal|critical|crit|panic)$$")
      - set(log.body, log.attributes["forge.telemetry.parsed"]["msg"]) where log.attributes["forge.telemetry.parsed"]["msg"]
        != nil
      - set(log.attributes["forge.telemetry.rule"], 0) where log.attributes["forge.telemetry.rule"]
        == nil and IsMatch(log.body, "(?i)workflow (execution )?not found") and log.severity_number
        >= SEVERITY_NUMBER_ERROR and log.severity_number <= SEVERITY_NUMBER_ERROR4
      - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.rule"]
        == 0
      - set(log.severity_text, "WARN") where log.attributes["forge.telemetry.rule"]
        == 0
      - set(log.attributes["forge.telemetry.rule"], 1) where log.attributes["forge.telemetry.rule"]
        == nil and log.attributes["forge.telemetry.parsed"]["error"] != nil and IsMatch(log.attributes["forge.telemetry.parsed"]["error"],
        "^context canceled$$")
      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.attributes["forge.telemetry.rule"]
        == 1
      - set(log.severity_text, "INFO") where log.attributes["forge.telemetry.rule"]
        == 1
      - delete_key(log.attributes, "ts")
      - delete_key(log.attributes, "level")
      - delete_key(log.attributes, "msg")
      - delete_key(log.attributes, "logging-call-at")
    - conditions:
      - resource.attributes["service.name"] == "openbao"
      statements:
      - set(log.attributes["forge.telemetry.original"], log.body) where log.attributes["forge.telemetry.original"]
        == nil
      - set(log.attributes["forge.telemetry.parsed"], ParseJSON(log.attributes["forge.telemetry.original"]))
        where IsMatch(log.attributes["forge.telemetry.original"], "^\\s*\\{")
      - set(log.time, Time(log.attributes["forge.telemetry.parsed"]["@timestamp"],
        "%Y-%m-%dT%H:%M:%SZ", "UTC")) where log.attributes["forge.telemetry.parsed"]["@timestamp"]
        != nil and IsMatch(log.attributes["forge.telemetry.parsed"]["@timestamp"],
        "Z$$")
      - set(log.time, Time(log.attributes["forge.telemetry.parsed"]["@timestamp"],
        "%Y-%m-%dT%H:%M:%S%j")) where log.attributes["forge.telemetry.parsed"]["@timestamp"]
        != nil and not IsMatch(log.attributes["forge.telemetry.parsed"]["@timestamp"],
        "Z$$")
      - set(log.severity_text, String(log.attributes["forge.telemetry.parsed"]["@level"]))
        where log.attributes["forge.telemetry.parsed"]["@level"] != nil
      - set(log.severity_number, SEVERITY_NUMBER_UNSPECIFIED) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil
      - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:trace)$$")
      - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:debug)$$")
      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:info|information)$$")
      - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:warn|warning)$$")
      - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:error|err)$$")
      - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.attributes["forge.telemetry.parsed"]["@level"]
        != nil and IsMatch(String(log.attributes["forge.telemetry.parsed"]["@level"]),
        "(?i)^(?:fatal|critical|crit|panic)$$")
      - set(log.body, log.attributes["forge.telemetry.parsed"]["@message"]) where
        log.attributes["forge.telemetry.parsed"]["@message"] != nil
      - delete_key(log.attributes, "@timestamp")
      - delete_key(log.attributes, "@level")
      - delete_key(log.attributes, "@message")
    - statements:
      - delete_key(log.attributes, "forge.telemetry.original")
      - delete_key(log.attributes, "forge.telemetry.parsed")
      - delete_key(log.attributes, "forge.telemetry.rule")
  transform/telemetry_target/openbao:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["service.name"], "openbao")
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
        where datapoint.attributes["forge_k8s_namespace"] != nil
      - delete_key(datapoint.attributes, "forge_k8s_namespace")
  transform/telemetry_target/temporal:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["service.name"], "temporal")
      - set(attributes["deployment.environment.name"], "dev")
      - set(attributes["service.namespace"], "acme")
    - context: metric
      statements:
      - convert_gauge_to_sum("cumulative", true) where metric.type == METRIC_DATA_TYPE_GAUGE
        and IsMatch(metric.name, "^(?:(?:num_goroutines))$$")
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["forge_k8s_namespace"])
        where datapoint.attributes["forge_k8s_namespace"] != nil
      - delete_key(datapoint.attributes, "forge_k8s_namespace")
receivers:
  prometheus/telemetry_openbao:
    config:
      scrape_configs:
      - authorization:
          credentials_file: /etc/forge/telemetry/secrets/openbao-metrics/token
          type: Bearer
        fallback_scrape_protocol: PrometheusText0.0.4
        job_name: telemetry/openbao/sys
        kubernetes_sd_configs:
        - namespaces:
            names:
            - openbao
          role: pod
          selectors:
          - field: spec.nodeName=${env:K8S_NODE_NAME}
            label: app.kubernetes.io/name=openbao
            role: pod
        label_limit: 30
        label_value_length_limit: 256
        metric_relabel_configs:
        - action: keep
          regex: up|(?:vault_core_(unsealed|active)|vault_token_count)
          source_labels:
          - __name__
        metrics_path: /v1/sys/metrics
        params:
          format:
          - prometheus
        relabel_configs:
        - action: keep
          regex: Running
          source_labels:
          - __meta_kubernetes_pod_phase
        - action: drop
          regex: "true"
          source_labels:
          - __meta_kubernetes_pod_container_init
        - action: replace
          regex: ([^:]+)
          replacement: $${1}:8200
          source_labels:
          - __meta_kubernetes_pod_ip
          target_label: __address__
        - action: replace
          regex: (.+:.+)
          replacement: '[$${1}]:8200'
          source_labels:
          - __meta_kubernetes_pod_ip
          target_label: __address__
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
        - action: replace
          source_labels:
          - __meta_kubernetes_namespace
          target_label: forge_k8s_namespace
        sample_limit: 5000
        scheme: https
        scrape_interval: 30s
        scrape_timeout: 10s
        tls_config:
          ca_file: /etc/forge/telemetry/secrets/openbao-ca/ca.crt
          server_name: openbao.openbao.svc
  prometheus/telemetry_temporal:
    config:
      scrape_configs:
      - fallback_scrape_protocol: PrometheusText0.0.4
        job_name: telemetry/temporal/0
        kubernetes_sd_configs:
        - namespaces:
            names:
            - temporal
          role: pod
          selectors:
          - field: spec.nodeName=${env:K8S_NODE_NAME}
            label: app.kubernetes.io/component=frontend,app.kubernetes.io/name=temporal
            role: pod
        label_limit: 30
        label_value_length_limit: 256
        metric_relabel_configs:
        - action: keep
          regex: up|(?:service_requests|service_latency_(bucket|sum|count)|num_goroutines)
          source_labels:
          - __name__
        - action: drop
          regex: service_latency_bucket
          source_labels:
          - __name__
        - action: labeldrop
          regex: namespace_id|workflowType
        metrics_path: /metrics
        relabel_configs:
        - action: keep
          regex: Running
          source_labels:
          - __meta_kubernetes_pod_phase
        - action: drop
          regex: "true"
          source_labels:
          - __meta_kubernetes_pod_container_init
        - action: replace
          regex: ([^:]+)
          replacement: $${1}:9090
          source_labels:
          - __meta_kubernetes_pod_ip
          target_label: __address__
        - action: replace
          regex: (.+:.+)
          replacement: '[$${1}]:9090'
          source_labels:
          - __meta_kubernetes_pod_ip
          target_label: __address__
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
        - action: replace
          source_labels:
          - __meta_kubernetes_namespace
          target_label: forge_k8s_namespace
        sample_limit: 20000
        scheme: http
        scrape_interval: 30s
        scrape_timeout: 10s
  receiver_creator/telemetry_temporal_checks:
    receivers:
      tcpcheck/frontend:
        config:
          collection_interval: 30s
          targets:
          - endpoint: '`endpoint contains ":" ? "[" + endpoint + "]" : endpoint`:7233'
        rule: type == "pod" && namespace in ["temporal"] && labels["app.kubernetes.io/component"]
          == "frontend" && labels["app.kubernetes.io/name"] == "temporal"
    watch_observers:
    - k8s_observer/telemetry
service_extensions:
- k8s_observer/telemetry
warnings:
- 'telemetry manifests:temporal (service temporal): profiles skipped: Options.EnableProfiles
  is off'
- 'telemetry observability (service openbao): profiles skipped: Options.EnableProfiles
  is off'
