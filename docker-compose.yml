services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reliant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: reliant
    ports:
      - "7233:7233"

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats-data:/data
      - ./docker/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-server:
    build:
      context: .
    command: ["server", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      nats:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      GRPC_PORT: "9090"
      BIND_ADDRESS: "0.0.0.0"
      RELIANT_ENV: dev
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: "7233"
      DATABASE_DRIVER: postgres
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/reliant?sslmode=disable"
      DATA_DIR: /data
      STREAMING_DRIVER: nats
      NATS_URL: "nats://nats:4222"
      CORS_ALLOWED_ORIGINS: "*"
      HEALTH_PORT: "8081"
      AUTH_MODE: "${AUTH_MODE:-apikey}"
      AUTH_API_KEY: "${AUTH_API_KEY:-dev-api-key}"
      RELIANT_VAULT_KEY: "${RELIANT_VAULT_KEY:-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  temporal-worker:
    build:
      context: .
    command: ["server", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      nats:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: "7233"
      DATABASE_DRIVER: postgres
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/reliant?sslmode=disable"
      DATA_DIR: /data
      STREAMING_DRIVER: nats
      NATS_URL: "nats://nats:4222"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HEALTH_PORT: "8082"
      RELIANT_VAULT_KEY: "${RELIANT_VAULT_KEY:-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  daemon-gateway:
    build:
      context: .
    command: ["server", "gateway"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      TOOLS_DAEMON_PORT: "9190"
      FRONTEND_PORT: "9191"
      HEALTH_PORT: "8081"
      BIND_ADDRESS: "0.0.0.0"
      RELIANT_ENV: dev
      DATABASE_DRIVER: postgres
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/reliant?sslmode=disable"
      DATA_DIR: /data
      NATS_URL: "nats://nats:4222"
      AUTH_MODE: "${AUTH_MODE:-apikey}"
      AUTH_API_KEY: "${AUTH_API_KEY:-dev-api-key}"
      RELIANT_VAULT_KEY: "${RELIANT_VAULT_KEY:-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
    ports:
      - "9190:9190"    # Daemon gRPC (tools-daemon connects here)
      - "9191:9191"    # Frontend proxy (browser connects here: gRPC + terminal WS)
      - "8081:8081"    # Health/readiness checks
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  tools-daemon:
    build:
      context: .
    command: ["sh", "-c", "printf '%s\\n' \"$$DAEMON_TOKEN\" | reliant daemon start --token --name compose-daemon --non-interactive"]
    depends_on:
      daemon-gateway:
        condition: service_healthy
    environment:
      RELIANT_ENV: dev
      DAEMON_GRPC_URL: "https://daemon-gateway:9190"
      DAEMON_TLS_MODE: "insecure_tls_skip_verify"
      DAEMON_TOKEN: "${DAEMON_TOKEN:?Set DAEMON_TOKEN to an rlat_ daemon token (reliant auth token create)}"
      DAEMON_DATA_DIR: /data
      DAEMON_WORKING_DIR: /workspace
    volumes:
      - daemon-data:/data
      - workspace:/workspace

volumes:
  pgdata:
  api-data:
  nats-data:
  gateway-data:
  daemon-data:
  workspace: