# pnpm settings for the web frontend. It is its own pnpm workspace root, so
# these apply here and nowhere else (pnpm reads them from this file, never from
# package.json or .npmrc).

# The web app consumes @reliantlabs/sdk from the sibling package as a workspace
# member, so the SDK and the app share one copy of @connectrpc/connect and
# @bufbuild/protobuf.
packages:
  - "."
  - "../../sdk/ts"
# Refuse to install on a Node outside package.json's engines.node (or outside
# a dependency's own engines), before any install script runs. Without it pnpm
# only warns, and an unsupported Node fails later, in a build or a test, with
# an error that never names the Node version.
engineStrict: true
# Install scripts pnpm may run; an unlisted one fails the install
# (ERR_PNPM_IGNORED_BUILDS) rather than being skipped silently.
#   esbuild: verifies its platform binary.
#   protobufjs: its postinstall only prints a version warning.
allowBuilds:
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@reliantlabs/forge-web-runtime@0.13.19'
# Dependency versions forced past what a package pins.
#   monaco-editor pins dompurify exactly (3.4.15 in 0.57.0); keep its copy on
#   the same patched release as ours.
overrides:
  monaco-editor>dompurify: ^3.4.17
# Fixes applied to a dependency until upstream ships them (`pnpm patch`).
#   @monaco-editor/loader: makeCancelable left a .then(onFulfilled) uncaught,
#   so a Monaco CDN script that failed to load raised an unhandled rejection
#   (a DOM Event) on every desktop page load. And its default `paths.vs`, a
#   jsDelivr URL, is blanked: the app hands the loader its bundled Monaco
#   (lib/monacoManager.ts) and ships no CDN reference
#   (lib/__tests__/noCdnRuntime.guard.test.ts). Drop the patch only when an
#   upstream release fixes makeCancelable AND the guard passes without it.
patchedDependencies:
  '@monaco-editor/loader@1.7.0': patches/@monaco-editor__loader@1.7.0.patch
