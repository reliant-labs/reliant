# pnpm settings for the web frontend. It is its own pnpm workspace root, so
# these apply here and nowhere else (pnpm reads them from this file, never from
# package.json or .npmrc).

# The web app consumes @reliantlabs/sdk from the sibling package as a workspace
# member, so the SDK and the app share one copy of @connectrpc/connect and
# @bufbuild/protobuf.
packages:
  - "."
  - "../../sdk/ts"

# Install scripts pnpm may run; an unlisted one fails the install
# (ERR_PNPM_IGNORED_BUILDS) rather than being skipped silently.
#   better-sqlite3: fetches (or compiles) its native addon.
#   esbuild: verifies its platform binary.
#   protobufjs: its postinstall only prints a version warning.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@reliantlabs/forge-web-runtime@0.13.1 || 0.13.3"

# Dependency versions forced past what a package pins.
#   monaco-editor pins dompurify exactly (3.4.15 in 0.57.0); keep its copy on
#   the same patched release as ours.
overrides:
  monaco-editor>dompurify: ^3.4.17
