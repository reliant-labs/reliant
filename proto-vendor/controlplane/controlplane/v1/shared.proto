message WalletTopup {
  string id = 1;
  string wallet_id = 2;
  string org_id = 3;
  int64 amount_cents = 4;
  string currency = 5;
  string status = 6;
  optional string stripe_checkout_session_id = 7;
  optional string stripe_payment_intent_id = 8;
  optional string created_by_user_id = 9;
  string metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int64 amount_usd_micros = 13;
  int64 amount_usd_nanos = 14;
}

message WalletOverview {
  Organization organization = 1;
  Wallet wallet = 2;
  repeated WalletLedgerEntry ledger_entries = 3;
  repeated WalletTopup topups = 4;
  int32 ledger_page = 5;
  int32 ledger_page_size = 6;
  int32 total_ledger_entries = 7;
}

message LLMKey {
  string id = 1;
  string org_id = 2;
  string name = 3;
  repeated string models = 4;
  optional double max_budget = 5; // nil means no budget limit; 0 means $0 budget
  string budget_duration = 6;
  LLMKeyStatus status = 7;
  optional double spend = 8; // nil means no spend data available
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp revoked_at = 10;
}

message LLMSpendEntry {
  string key_id = 1;
  string key_name = 2;
  string model = 3;
  double spend = 4;
  int64 requests = 5;
  google.protobuf.Timestamp period_start = 6;
  google.protobuf.Timestamp period_end = 7;
}

message ManagedReliantAccess {
  string id = 1;
  string user_id = 2;
  string status = 3;
  string active_llm_key_id = 4;
  int32 credential_version = 5;
  optional int32 entitlement_snapshot_version = 6;
  google.protobuf.Timestamp last_rotated_at = 7;
  google.protobuf.Timestamp last_provisioned_at = 8;
  string last_error = 9;
  string internal_org_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ReliantOverview {
  ReliantEntitlement entitlement = 1;
  ManagedReliantAccess managed_access = 2;
  int64 current_period_spend_cents = 3;
  int64 remaining_spend_cents = 4;
  bool spend_cap_reached = 5;
  bool spend_cap_unlimited = 6;
  bool request_rate_unlimited = 7;
  int64 current_period_request_count = 8;
}

message GitRepo {
  string full_name = 1;
  string clone_url = 2;
  string default_branch = 3;
  string description = 4;
  bool private = 5;
  string language = 6;
  google.protobuf.Timestamp updated_at = 7;
}
