syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.

package controlplane.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/controlplane/v1;controlplanev1";

// Deploy-product entity messages, shared by the PUBLIC DeployService
// (proto/services/deploy/v1) and the staff DeployAdminService
// (proto/services/deploy_admin/v1).
//
// WHY THEY LIVE HERE AND NOT IN THE SERVICE FILE. Both services describe the
// same tenant estate, and a service-to-service proto import is rejected by
// this project's conventions — for the same reason it is rejected everywhere
// else: it makes one service's wire surface a dependency of another's, so a
// field added for the admin console silently becomes part of the public
// contract. proto/controlplane/v1 is the established home for entities two
// services share (shared.proto does exactly this for Daemon), and everything
// in the repo already resolves into the one `controlplane.v1` wire package.
//
// THE PUBLIC/INTERNAL SPLIT IS THE SAME ONE Daemon ALREADY MAKES. Placement
// internals — which host cluster a workload landed on, which namespace holds
// it — are NOT on the public messages. They are on the *Internal messages at
// the bottom of this file, reachable only through DeployAdminService, exactly
// as DaemonInternal carries the pod name and k8s phase that public Daemon
// deliberately omits. A tenant has no use for a CLUSTER_CONFIGS key, and
// publishing one hands out a map of our fleet.
//
// These messages mirror internal/deploy/types.go and the schema in
// db/migrations/00069-00071. When they disagree, the migration is right.

// === Enums ===
//
// Proto3 enum VALUE names are scoped to the PACKAGE, not to the enum, and this
// package already holds nine enums from shared.proto. Every value below is
// therefore prefixed DEPLOY_ to keep the namespace collision-free.

// DeployTier discriminates what a deployment IS. The four tiers share one
// lifecycle (declare → reconcile → meter → promote → delete) and differ in the
// controller that reconciles them and the config they carry.
enum DeployTier {
  DEPLOY_TIER_UNSPECIFIED = 0;
  // A build artifact on object storage behind a CDN. No compute, and
  // therefore no floor.
  DEPLOY_TIER_STATIC = 1;
  // ONE container, no pod-to-pod networking, optional public URL.
  DEPLOY_TIER_BACKEND = 2;
  // A managed Postgres database and role.
  DEPLOY_TIER_DATABASE = 3;
  // A workload inside the tenant's own cluster. No forge CR and no hosted
  // render path: this tier is declared and refused, not deployed.
  DEPLOY_TIER_CLUSTER = 4;
}

// DeployEnvironmentKind separates environments that live until deleted from
// per-PR previews that are reaped. A real discriminator rather than
// "expires_at is set", because the two differ in more than expiry: a preview
// is never a human promotion target and is excluded from the drift badge.
enum DeployEnvironmentKind {
  DEPLOY_ENVIRONMENT_KIND_UNSPECIFIED = 0;
  // dev / staging / prod: no TTL.
  DEPLOY_ENVIRONMENT_KIND_PERSISTENT = 1;
  // Ephemeral, and MUST carry a TTL — an unbounded preview is an unbounded
  // bill.
  DEPLOY_ENVIRONMENT_KIND_PREVIEW = 2;
  // Workloads run on a developer machine (`forge env up`); the platform is
  // this environment's SECRET STORE and nothing else. It is never a deploy
  // target — Publish / EnsureDeployment / Promote / Rollback into one is
  // FailedPrecondition — it holds no namespace on any cluster, and its
  // secrets are the only ones readable back (LocalSecretService.PullSecrets).
  //
  // Kind is IMMUTABLE, and for this member that is the security property: a
  // persistent environment can never become LOCAL and so can never become
  // readable. EnsureEnvironment with a kind differing from the stored row is
  // FailedPrecondition, never a silent change.
  DEPLOY_ENVIRONMENT_KIND_LOCAL = 3;

  // FORGE APPLIES IT; THE PLATFORM PLACES NOTHING. The tenant's own cluster
  // runs the workloads, so this environment holds no namespace on our fleet,
  // and there is nothing here for the converger to observe or patch — its
  // reconcile lease deliberately excludes this kind.
  //
  // It IS a promotion target, which is what separates it from LOCAL: the
  // ledger records releases, promotions and applies for it exactly as for a
  // hosted environment, and that record is the whole point — it is how a
  // self-hosted deploy gets a history, an approver and a plan. What it does
  // not get is convergence: a promotion here moves no bytes until forge
  // applies it and reports the outcome back through FinishApply.
  //
  // Its secrets are WRITE-ONLY. Unlike LOCAL, whose secrets are pulled back
  // by `forge env up`, nothing on a self-managed environment reads a secret
  // out of the platform — forge pushes them into the tenant's own store.
  DEPLOY_ENVIRONMENT_KIND_SELF_MANAGED = 4;
}

// DeployRunState is what the TENANT asked for. Distinct from scale-to-zero,
// which is automatic and reversible without a spec change.
enum DeployRunState {
  DEPLOY_RUN_STATE_UNSPECIFIED = 0;
  DEPLOY_RUN_STATE_RUNNING = 1;
  DEPLOY_RUN_STATE_SUSPENDED = 2;
}

// DeployObservedState is what the OPERATOR confirmed. There is deliberately no
// DELETING member: deletion is a timestamp, and "deleting" is exactly
// "deleted_at is set and observed state is not DELETED". A third state
// alongside the timestamp would be a second source of truth for one fact.
enum DeployObservedState {
  DEPLOY_OBSERVED_STATE_UNSPECIFIED = 0;
  DEPLOY_OBSERVED_STATE_PENDING = 1;
  DEPLOY_OBSERVED_STATE_PROGRESSING = 2;
  DEPLOY_OBSERVED_STATE_READY = 3;
  DEPLOY_OBSERVED_STATE_DEGRADED = 4;
  DEPLOY_OBSERVED_STATE_SUSPENDED = 5;
  DEPLOY_OBSERVED_STATE_DELETED = 6;
}

// DeploySuspendReason is WHY a suspended deployment is stopped, read off the
// tier CR's Suspended condition. UNSPECIFIED means not suspended OR a control
// plane / operator that reports no reason — clients fall back to inference.
enum DeploySuspendReason {
  DEPLOY_SUSPEND_REASON_UNSPECIFIED = 0;
  // The owner stopped it (condition reason UserSuspended). They can resume it.
  DEPLOY_SUSPEND_REASON_OWNER = 1;
  // The org has no compute plan (NoComputePlan). Fix: subscribe to a plan.
  DEPLOY_SUSPEND_REASON_NO_COMPUTE_PLAN = 2;
  // The compute subscription lapsed past grace (BillingLapsed). Fix: settle
  // the invoice.
  DEPLOY_SUSPEND_REASON_BILLING_LAPSED = 3;
}

// DeployVerdict is forge's deploystate verdict: whether what was OBSERVED is
// what was DECLARED, and for long enough to trust. It is computed on read from
// the observation, the stability clock (stable_since), the declared digest and
// run state, and the environment's reconcile_policy — never stored, because
// "converged" means "ready for at least the stability window" and a stored
// answer to that goes stale by the minute.
//
// OBSERVATION IS NOT VERDICT: DeployObservedState says what a look found;
// this says whether that is what was asked for.
enum DeployVerdict {
  DEPLOY_VERDICT_UNSPECIFIED = 0;
  // Nothing measured: never observed, or the observer could not look.
  DEPLOY_VERDICT_UNKNOWN = 1;
  // At the declared shape but not yet stable for the window, or a rollout
  // is in flight.
  DEPLOY_VERDICT_CONVERGING = 2;
  // At the declared shape and stable past the window.
  DEPLOY_VERDICT_CONVERGED = 3;
  // An owned field (the digest) does not match the declaration: drift.
  DEPLOY_VERDICT_DIVERGED = 4;
  // Not serving, whatever it matches.
  DEPLOY_VERDICT_DEGRADED = 5;
}

// DeployReconcilePolicy is what the platform may do about drift in an
// environment (forge's deploystate.Policy).
enum DeployReconcilePolicy {
  // On a request: leave the stored policy unchanged. Never returned.
  DEPLOY_RECONCILE_POLICY_UNSPECIFIED = 0;
  // Report drift, change nothing. The default.
  DEPLOY_RECONCILE_POLICY_OBSERVE = 1;
  // Re-publish the declared state when drift is found.
  DEPLOY_RECONCILE_POLICY_CONVERGE = 2;
  // Refuse every change, including a human's deploy.
  DEPLOY_RECONCILE_POLICY_PINNED = 3;
}

// DeployPromotionKind is what a ledger entry records. There is one kind: a
// promotion binds an environment to a release. Moving to an OLDER release is
// still a promotion — recovery is roll forward, there is no rollback.
//
// Ledger rows written by the retired Rollback RPC still exist (the ledger is
// append-only) and are reported as PROMOTE: they bound the env to their
// release exactly as a promote does. A client never states a kind.
enum DeployPromotionKind {
  DEPLOY_PROMOTION_KIND_UNSPECIFIED = 0;
  DEPLOY_PROMOTION_KIND_PROMOTE = 1;
}

// DeployClusterProvider and DeployClusterPhase described a Reliant-provisioned
// vCluster — its irreversible shared-vs-private node choice and its
// provisioning lifecycle. Both are deleted with the vCluster model. A
// customer-owned cluster has neither: we do not choose its nodes and we do not
// provision it, so its readiness is a CONNECTION question, answered by
// cluster.v1.ClusterConnection.
//
// Enum NAMES, not just values, are reserved: proto3 enum value names are
// scoped to the PACKAGE, so re-using one later in a different enum of this
// package would collide.

// DeployResourceKind NAMES A METER. The unit is a property of the kind and is
// never a per-row field: a free-form unit is a rounding bug waiting for the
// day two rows of one kind disagree about what their quantities mean, and by
// then the invoices are already wrong. Mirrors the ck_cp_rub_kind CHECK on
// controlplane.resource_usage_buckets.
enum DeployResourceKind {
  DEPLOY_RESOURCE_KIND_UNSPECIFIED = 0;
  // milli-vCPU held for the tick.
  DEPLOY_RESOURCE_KIND_CPU_MILLI = 1;
  // MiB held for the tick.
  DEPLOY_RESOURCE_KIND_MEM_MIB = 2;

  // 5 was VCLUSTER, the per-hour per-cluster floor. Deleted with the
  // vCluster model: nothing ever wrote a row of this kind, and a connected
  // cluster's compute is the customer's and carries no floor of ours.
  reserved 5;
  reserved "DEPLOY_RESOURCE_KIND_VCLUSTER";

  // Mebibytes, not GiB (see the migration's quantity comment).
  DEPLOY_RESOURCE_KIND_EGRESS_GIB = 6;
  DEPLOY_RESOURCE_KIND_CDN_EGRESS_GIB = 7;
  DEPLOY_RESOURCE_KIND_CDN_REQUESTS = 8;

  // GiB bound for the tick. ONE storage kind, not two.
  //
  // BALANCED (3) and SSD (4) were a pricing axis no customer could
  // select: nothing in CreateDeployment lets a tenant choose a storage
  // class. Two independently-counted kinds against the catalog's single
  // storage allowance also made the allowance unresolvable — funding
  // both from one figure funds it twice. If SSD becomes a premium
  // option later it is a PLAN attribute, not a second meter kind.
  DEPLOY_RESOURCE_KIND_STORAGE_GIB = 10;
}

// DeployLogStream selects which of a deployment's log streams to read. Build
// output and runtime output are different questions with different lifetimes
// — a build log is finite and finished, a runtime log tails forever — so the
// caller says which it wants rather than receiving an interleaved merge it
// then has to separate.
enum DeployLogStream {
  DEPLOY_LOG_STREAM_UNSPECIFIED = 0;
  DEPLOY_LOG_STREAM_BUILD = 1;
  DEPLOY_LOG_STREAM_RUNTIME = 2;
}

// === Entities ===

// DeployTenant is an organization's deploy-product extension. THE IDENTITY IS
// THE ORGANIZATION: org_id is the primary key, a 1:1 extension rather than a
// competing identity, so every billing join is the identity join and no
// translation step sits between a deployment and the wallet that pays for it.
message DeployTenant {
  // The organization this tenant IS. Not a foreign key to a separate tenant
  // identity — there is no such thing.
  string org_id = 1;

  // The immutable DNS label this tenant's hostnames are composed from
  // (<app>-<slug>.reliantapps.dev). Immutable because it is baked into every
  // URL the tenant has published, and because organizations.slug is mutable
  // while this must not be. Settable once, at CreateTenant; there is no RPC
  // that changes it.
  //
  // A TLS wildcard matches exactly ONE label, so the tenant cannot be a second
  // label — `app.tenant.reliantapps.dev` is NOT covered by
  // `*.reliantapps.dev`. That is why the slug is spliced into the first label
  // rather than nested.
  string slug = 2;

  // READ-ONLY. Namespace prefix for this tenant's environments, allocated by
  // the platform. Stored rather than derived so a later change to the
  // derivation rule cannot re-point namespaces that already hold running
  // workloads.
  string namespace_prefix = 3;

  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// DeployTenantCluster described a provisioned vCluster and is deleted with the
// vCluster model. The org-owned cluster message that replaces it is
// cluster.v1.Cluster, which carries a CONNECTION rather than a provisioning
// phase, and no floor: a connected cluster's control plane is the customer's.
//
// Nothing here was a BYO concept, so there was no message to split — the
// connect path (#569) already had its own.

// DeployEnvironment is a namespace-scoped deploy target: dev, staging, prod,
// or an ephemeral preview.
//
// THE NAMESPACE IS PER (TENANT, ENVIRONMENT). Not per-owner, which would put
// an unreviewed preview build in the same namespace, under the same
// intra-namespace allow rule, as the production database; and not
// per-workload, which would make an app reaching its own database
// cross-namespace traffic requiring exactly the tenant-authored NetworkPolicy
// the constrained-spec design exists to avoid.
message DeployEnvironment {
  string id = 1;
  // 'dev' | 'staging' | 'prod' | 'preview-pr-123'. Free-form: the platform
  // owns an environment's lifecycle, not a tenant's taxonomy.
  string name = 2;
  DeployEnvironmentKind kind = 3;

  // READ-ONLY. The Kubernetes namespace, allocated by the platform from the
  // tenant's namespace_prefix. A client that could name this could name
  // somebody else's.
  string namespace = 4;

  // The org-owned cluster this environment's workloads run inside, or empty
  // for an environment on shared platform infrastructure. Superseded as the
  // source of truth by DeployEnvironmentSpec.cluster_bindings, which can name
  // more than one.
  string tenant_cluster_id = 5;

  // READ-ONLY and DERIVED: the id of this environment's latest promotion in
  // the append-only ledger. It is not a stored pointer (migration 00087
  // dropped that column); the server computes it on read, so it cannot
  // disagree with the ledger. Empty before the environment's first deploy.
  // Moved only by Promote — never by UpdateEnvironment, which is
  // why it is not on DeployEnvironmentSpec.
  string current_promotion_id = 6;

  // Set exactly when kind is PREVIEW; the database refuses every other
  // combination. A TTL on prod is an outage with a timer on it.
  google.protobuf.Timestamp expires_at = 7;

  // What this preview was cut from (a PR number, a branch). Informational,
  // and the join key for posting a preview URL back onto a pull request.
  string source_ref = 8;

  // Idles CPU and memory after scale_to_zero_idle_seconds of inactivity. It
  // does NOT stop storage: a bound volume keeps billing at zero replicas, and
  // that asymmetry is what makes the feature trustworthy rather than a
  // billing trap.
  bool scale_to_zero_enabled = 9;
  // Meaningful only when scale_to_zero_enabled. Must be positive — a zero
  // timeout would idle a workload the instant it started.
  int32 scale_to_zero_idle_seconds = 10;

  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;

  // What the platform may do about drift here. Defaults to OBSERVE.
  DeployReconcilePolicy reconcile_policy = 13;

  // Tag 14 ("image_push_base") was removed when the push base became the
  // CLIENT's to compose rather than the server's to advertise (ADR-0003 F1).
  //
  // It carried `<registry_base>/<org_id>`, derived from
  // ociregistry.TenantSubtree so the advertised value and the enforced one
  // could not disagree. forge read it off every environment, cached it per
  // env under .forge/state, and resolved a bare hosted image against the
  // cached copy. Three costs, all structural: the base was unknowable before
  // the first successful AUTHENTICATED call, so a fresh checkout could not
  // render; a stale record silently weakened forge's own off-base check
  // rather than failing it; and "the server said" plus "the client wrote it
  // down" are two sources of one fact. forge now composes
  // `<registry_host>/<organization>/<project>` from its own declaration, with
  // the host a forge default.
  //
  // ENFORCEMENT DID NOT MOVE, and that is the distinction to keep: only the
  // DERIVATION did. ociregistry.Admit still gates publish, and the registry
  // realm still mints a token scoped to the authenticated row's org and
  // refuses any repository outside that subtree — so a client that composes
  // the wrong base is refused at its first push, by the party that actually
  // knows. Deps.RegistryBase remains, because that is what both enforce with.
  //
  // RESERVED RATHER THAN RECYCLED, for the reason tag 16 below records:
  // reusing 14 would not fail, it would decode as whatever the new field is
  // and be read as a registry subtree by any client still on a forge release
  // that consumed it — the quietest possible wire bug.
  reserved 14;
  reserved "image_push_base";

  // The forge project this environment belongs to (forge.yaml `name`).
  // Environment identity is (org, project, name): two projects in one org
  // may each have a `prod`. Empty is a valid project.
  string project = 15;

  // Tag 16 (capabilities / "custom_domains") was removed when custom domains
  // became an org-scoped RESOURCE with its own service
  // (domain.v1.DomainService) rather than a field on a Workload or
  // StaticSite spec. It existed so a client could refuse to declare a domain
  // against a target that would silently drop it; with no spec field to
  // declare, a hosted spec refuses `domains` outright and there is nothing
  // to negotiate.
  //
  // RESERVED RATHER THAN RECYCLED because a forge release briefly READ this
  // tag. Reusing 16 for something else would not fail — it would decode as
  // whatever the new field is and be interpreted as a capability list by any
  // client still on that release, which is the quietest possible wire bug.
  reserved 16;
  reserved "capabilities";

  // READ-ONLY and DERIVED: true when a promotion to this environment will
  // actually move bytes without a client-side deploy — this control plane runs
  // a converger AND this environment's reconcile_policy is not PINNED.
  //
  // It exists so a client can refuse FAST instead of waiting out a timeout. A
  // `forge env promote --wait` against an environment that converges nothing
  // would poll for fifteen minutes and then report a failure whose cause is
  // "nobody was ever going to apply this" — which looks exactly like a broken
  // release. Reading this field turns that into an immediate, accurate
  // "this env does not converge promotions; add --deploy".
  //
  // DERIVED, not stored, for the same reason the verdict is derived: it is a
  // fact about the server's own configuration and the env's policy, and a
  // stored copy could disagree with either.
  bool converges_promotions = 17;

  // Tags 18 and 19 are `protection` (DeployEnvironmentProtection) and
  // `main_ref`, the protected-environment half of the source-of-truth design.
  // They are deferred to #516 along with the source verifier that would give
  // them meaning — a protection flag nothing enforces is worse than no flag,
  // because it reads as a guarantee. Reserved now so the numbering below does
  // not shift when they land.
  reserved 18; // protection — #516
  reserved 19; // main_ref — #516

  // What the project's checked-in config SAYS this environment contains: the
  // release.Shape JSON (kind, workloads, secrets by name, domains, clusters,
  // and a hash per rendered object).
  //
  // This is the DECLARATION, and it is distinct from both halves a Deployment
  // carries. A Deployment's spec is one unit's declaration as the platform
  // stored it; this is the whole environment as the tenant's render produced
  // it, including the objects the platform never sees because a self-managed
  // cluster applies them. It is what makes a deploy plan computable
  // server-side: without it there is no "before" to diff a candidate bundle
  // against, and the plan would have to trust whatever the client said Live
  // was.
  //
  // Refreshed by EnsureEnvironment when the spec carries a shape, and by
  // RecordBundle from the bundle's verified document. An ensure that carries
  // no shape leaves it alone — a client that cannot render must not be able
  // to erase what a client that could rendered.
  //
  // NEVER CARRIES A SECRET VALUE. The shape's secrets are names and providers
  // only, and the server refuses a shape that holds anything value-like.
  google.protobuf.Struct declared_shape = 20;

  // The source the declaration above came from: repo, commit, dirty, and the
  // forge version that rendered it. "prod says X, declared from main@abc by
  // forge v0.1.43, clean" is the sentence an operator needs before trusting
  // the shape, and a shape with no provenance cannot support it.
  DeploySourceProvenance declared_by = 21;

  // When the declaration was last refreshed. The staleness signal: a shape
  // from six weeks ago is still a shape, but a plan computed against it is
  // worth less than one computed against this morning's.
  google.protobuf.Timestamp declared_at = 22;
}

// DeployEnvironmentSpec is THE WRITABLE HALF of an environment — the whole of
// what a client may set, and nothing else.
//
// This message exists so the read-only fields above are not merely documented
// as read-only but are ABSENT from every request type. A client cannot assign
// a namespace, cannot move current_promotion_id, and cannot forge a
// created_at, because there is no field in which to put one. Compare the
// alternative, where CreateEnvironment accepts a full DeployEnvironment and
// the server remembers to ignore six fields: that is a policy, and policies
// are one careless merge away from not holding.
message DeployEnvironmentSpec {
  string name = 1;
  DeployEnvironmentKind kind = 2;
  // Optional. Empty means the shared platform infrastructure.
  string tenant_cluster_id = 3;
  // Required for a PREVIEW, forbidden for a PERSISTENT environment.
  google.protobuf.Timestamp expires_at = 4;
  string source_ref = 5;
  bool scale_to_zero_enabled = 6;
  int32 scale_to_zero_idle_seconds = 7;
  // UNSPECIFIED on a request leaves the stored policy unchanged; a new
  // environment then gets OBSERVE.
  DeployReconcilePolicy reconcile_policy = 8;
  // The forge project (forge.yaml `name`) this environment belongs to.
  // Part of the environment's identity — EnsureEnvironment addresses by
  // (project, name) — and immutable after creation like name and kind.
  string project = 9;

  // The writable twins of DeployEnvironment's reserved 18/19. Deferred with
  // them to #516; reserved so this spec's numbering cannot shift either.
  reserved 10; // protection — #516
  reserved 11; // main_ref — #516

  // The rendered shape this declaration describes (DeployEnvironment.declared_shape).
  // Sent by `forge env build` / `forge env deploy` BEFORE anything else, so
  // the control plane knows what the project declares even for an environment
  // it will never place.
  //
  // Absent leaves the stored shape unchanged, which is why this is not a
  // "replace the spec wholesale" field like reconcile_policy: a caller that
  // could not render — an older forge, a `forge env status` on a machine with
  // no checkout — must not erase a shape by omitting it.
  //
  // `shape.kind` must agree with `kind` above; a mismatch is InvalidArgument
  // rather than a silent preference for one of them.
  google.protobuf.Struct shape = 12;

  // Where that render came from (DeployEnvironment.declared_by). The first
  // call carrying provenance also fixes the environment's source repo.
  DeploySourceProvenance declared_by = 13;

  // Which registered cluster each cluster the bundle renders for maps to.
  //
  // THE MULTI-CLUSTER SUCCESSOR OF tenant_cluster_id ABOVE, and the SOURCE OF
  // TRUTH from this release on. A forge bundle may render for several
  // clusters at once (release.BundleClusterPath / BundleDoc.ClusterPaths), so
  // one environment can have more than one target — which `tenant_cluster_id`
  // cannot express, because it is one column holding one id.
  //
  // EXPAND NOW, CONTRACT LATER. tenant_cluster_id is still accepted and still
  // written, because the previous release reads it; a K-task removes it once
  // no deployed client sends it. While both exist, a request carrying both
  // must agree — a disagreement is InvalidArgument rather than a silent
  // preference for one, because the two would then name different clusters
  // and only one of them would receive the deploy.
  //
  // EVERY BINDING IS VALIDATED: the cluster must be this org's, registered,
  // and live. Checked BEFORE any write, on the create branch and the existing
  // branch alike, so a cluster deregistered since the environment was
  // declared surfaces on the ensure the operator is already running rather
  // than at the next publish.
  repeated ClusterBinding cluster_bindings = 14;
}

// ClusterBinding maps ONE cluster the bundle renders for to ONE registered
// cluster in the control plane.
//
// TWO NAMESPACES MEET HERE, and keeping them apart is the whole purpose of
// the message. `cluster` is forge's key — the RENDERED kube context name,
// which is what the bundle's per-cluster paths are indexed by and what a KCL
// author wrote. `cluster_id` is ours — the uuid ConnectCluster
// minted. Neither can be derived from the other, and collapsing them into one
// string is how a deploy lands on a cluster whose name merely resembled the
// declared one.
message ClusterBinding {
  // The rendered cluster / kube-context name, as it appears in the bundle's
  // ClusterPaths. forge's key.
  string cluster = 1;
  // The registered cluster's id, from ConnectCluster. Must
  // name a live cluster of the caller's org.
  string cluster_id = 2;
}

// DeployObservedStateDetail is the operator's CONFIRMATION — the readable
// mirror of reality, so the UI's drift badge and a bill reconciliation need no
// cluster round-trip.
//
// EVERY FIELD HERE IS READ-ONLY TO CLIENTS, and structurally so: this message
// appears on Deployment and on no request type anywhere in either service. A
// client that could write observed state could claim to be running something
// it is not, which is the one lie that would make both the drift badge and the
// bill wrong at the same time.
message DeployObservedStateDetail {
  DeployObservedState state = 1;
  int32 replicas = 2;
  // The digest ACTUALLY running. Diverges from desired image_digest during a
  // roll, and that divergence is what the drift badge reads.
  string image_digest = 3;
  // Unset until the operator has successfully applied this spec at least
  // once. Unset IS the machine-readable form of "declared, never applied" —
  // and such a deployment must cost nothing.
  google.protobuf.Timestamp reconciled_at = 4;
  // Last reconcile error, surfaced to the tenant. Cleared on success.
  string last_error = 5;
  // The public URL, once one exists. Platform-allocated and generated —
  // a word pair like wild-mongoose.reliantapps.dev, one label deep because a
  // TLS wildcard matches one label. It encodes nothing about the tenant or
  // the app, so it must not be parsed for meaning; it is stable for the life
  // of the deployment and survives a rename.
  string url = 6;
  // When the deployment most recently ENTERED a settled state (ready, or
  // suspended). Unset whenever it is in any other state. The verdict's
  // stability clock.
  google.protobuf.Timestamp stable_since = 7;

  // Per-domain status for every custom domain this deployment declared.
  // Empty when it declared none, and ALSO empty in an environment whose
  // target does not advertise "custom_domains" — in which case nothing is
  // converging them and reporting a state would be a fiction.
  repeated DeployCustomDomainStatus domains = 8;

  // Backup state, for a managed-database deployment that has one. Unset for
  // every other tier, and ALSO unset for a database in an environment that
  // configured no object store — where reporting "no backups yet" and
  // "backups are not configured" as the same thing would be the dangerous
  // conflation.
  DeployBackupStatus backup = 9;

  // Why the deployment is suspended; UNSPECIFIED when it is not.
  DeploySuspendReason suspend_reason = 10;
}

// DeployBackupStatus is what a hosted user needs to answer one question:
// "if this database broke right now, what would I get back?"
//
// THREE FIELDS, BECAUSE THREE THINGS CAN BE TRUE INDEPENDENTLY. A database
// can have a recent base backup and broken WAL archiving (it would restore,
// but only to last night). It can have healthy archiving and no base backup
// (it would restore to nothing — WAL is replayed ON TOP OF a base backup, so
// an archive alone is useless). And it can have both while the oldest
// retained backup is newer than the incident being investigated. A single
// "backups: ok" boolean hides all three.
message DeployBackupStatus {
  // When the last base backup completed. Unset means none has ever
  // succeeded — which, whatever the WAL archive looks like, means there is
  // nothing to restore.
  google.protobuf.Timestamp last_successful_backup = 1;

  // Whether WAL is currently reaching the object store, read from the
  // CloudNativePG cluster's ContinuousArchiving condition. FALSE IS THE
  // SILENT FAILURE THIS FIELD EXISTS FOR: a database whose archiving has
  // stopped keeps serving traffic normally, and every minute it does is a
  // minute that cannot be recovered to.
  bool wal_archiving_healthy = 2;

  // The oldest point recovery can reach — the floor on point-in-time
  // restore, set by the retention policy. Unset until a first backup exists.
  google.protobuf.Timestamp earliest_restorable_time = 3;

  // The last archiving or backup error, surfaced verbatim. Cleared on
  // success. A tenant who can see "no bucket permission" fixes it; one who
  // sees only wal_archiving_healthy=false files a ticket.
  string last_error = 4;
}

// DeployCustomDomainStatus is one customer-brought domain's acquisition
// state, plus the DNS the tenant still has to set for it.
//
// required_records IS NOT DIAGNOSTIC DECORATION. A custom domain is the one
// part of a deploy that the platform cannot complete on its own: it converges
// only after a human edits a zone we do not control. So the records travel
// WITH the state, because a bare PENDING_DNS tells a tenant they are blocked
// without telling them on what, and the answer differs per domain (an apex
// cannot take a CNAME; a subdomain should not be pinned to an IP).
// It is the DEPLOY-SIDE VIEW of a Domain plus its binding, reported against
// the deployment the binding points at. The domain itself is an org-scoped
// resource owned by DomainService; this message exists so `forge env status`
// can show "this workload answers on example.com, which is waiting on DNS"
// without a second call to a second service.
message DeployCustomDomainStatus {
  // The hostname, lowercased. 'example.com', 'app.example.com'.
  string domain = 1;
  DeployCustomDomainState state = 2;
  // The A / CNAME / TXT records the tenant must publish. Computed per domain
  // and stable, so it is safe to show before, during and after verification —
  // it stays populated once live, since removing the records would break it.
  repeated DeployDnsRecord required_records = 3;
  // Why the last attempt failed, in terms a tenant can act on. Cleared on
  // success.
  string last_error = 4;
  // When the domain first reached LIVE. Unset in every other state.
  google.protobuf.Timestamp live_since = 5;
}

// DeployDnsRecord is one record a tenant publishes at their registrar.
message DeployDnsRecord {
  // 'A', 'CNAME' or 'TXT'.
  string type = 1;
  // The name to create, fully qualified: 'example.com',
  // 'www.example.com', '_reliant-challenge.example.com'.
  string name = 2;
  // The value: an IP for A, the platform ingress target for CNAME, the
  // ownership token for TXT.
  string value = 3;

  // What the last verification pass concluded about THIS record.
  //
  // WHY PER-RECORD AND NOT JUST THE DOMAIN'S STATE. Verification is two
  // independent checks — every resolved address is ours, and the ownership
  // token is published — and the domain's single state collapses them.
  // PENDING_DNS is the answer whether the tenant published nothing at all
  // or published a perfect A record and forgot the TXT, and those need
  // opposite next actions. The second is also the more common stall,
  // because the domain visibly resolves and the tenant reasonably
  // concludes they are finished. last_error reports only whichever check
  // failed FIRST, so it cannot describe both either.
  //
  // FALSE MEANS "NOT CONFIRMED", NOT "WRONG". A record the verifier has
  // not reached yet — every record on a domain added seconds ago — is
  // false with an empty detail. A client must render that as unchecked,
  // never as a failure: a red cross on a correct record is worse than no
  // mark at all. The pair to read is (resolved, detail): false with a
  // detail is a real failure, false without one is silence.
  bool resolved = 4;

  // Why this record is not confirmed, in words a tenant can act on:
  // "resolves to 203.0.113.7, expected 34.63.203.181", "no TXT record
  // found at _reliant-challenge.example.com". EMPTY when resolved, and
  // empty when the record has not been checked.
  //
  // TENANT-SAFE BY CONSTRUCTION. Written only by the verifier, from the
  // domain's own DNS answers and the platform's public ingress
  // configuration. Never a raw error from a lower layer — those can name
  // internal resolver addresses, and this string is rendered verbatim in
  // a browser.
  string detail = 5;
}

// DeployCustomDomainState is where a domain is in acquisition.
//
// THE ORDER IS A PIPELINE AND EACH STEP GATES THE NEXT, which is the whole
// reason this is a state machine rather than a bool. VERIFYING must complete
// before ISSUING begins: Let's Encrypt pauses an identifier after enough
// consecutive authorization failures, and a tenant who mis-points a record
// and walks away is exactly how that pause gets hit. Failing our own DNS
// check costs nothing; failing ACME repeatedly costs the identifier.
enum DeployCustomDomainState {
  DEPLOY_CUSTOM_DOMAIN_STATE_UNSPECIFIED = 0;
  // Recorded, and the tenant's DNS does not point at us yet. The normal
  // first state, and the one required_records exists for.
  DEPLOY_CUSTOM_DOMAIN_STATE_PENDING_DNS = 1;
  // DNS resolves to us; ownership is being confirmed.
  DEPLOY_CUSTOM_DOMAIN_STATE_VERIFYING = 2;
  // Verified. A certificate is being obtained.
  DEPLOY_CUSTOM_DOMAIN_STATE_ISSUING = 3;
  // Serving, with a valid certificate.
  DEPLOY_CUSTOM_DOMAIN_STATE_LIVE = 4;
  // Reachable from any state above and retryable; last_error says why.
  DEPLOY_CUSTOM_DOMAIN_STATE_FAILED = 5;
  // Another org already holds this domain. NOT retryable by waiting, which
  // is why it is distinct from FAILED: the fix is a human dispute, not a
  // backoff. First to verify wins.
  DEPLOY_CUSTOM_DOMAIN_STATE_CONFLICT = 6;
}

// === Custom domains as a resource ===
//
// A Domain is an org-scoped resource: a hostname the org has claimed, plus
// where it is in acquisition. A DomainBinding is what makes it SERVE
// something. They are separate because their lifetimes are: a domain outlives
// any particular deployment — that is the point of owning one — and deleting
// an environment frees the binding while leaving the domain, and its
// hard-won verification, intact.
//
// These live in controlplane.v1 rather than in the service file because two
// services describe them: DomainService manages them, and DeployService
// reports them on a deployment's observed status.

// Domain is one hostname an org has claimed.
message Domain {
  string id = 1;
  // The hostname, lowercased: 'example.com', 'app.example.com'.
  // IMMUTABLE — a domain is its name. Renaming would silently move a
  // verification and a certificate onto an identity nobody proved.
  string hostname = 2;
  DeployCustomDomainState state = 3;
  DomainSource source = 4;
  // The A / CNAME / TXT records the tenant must publish. Computed and
  // stable, so it is safe to show before, during and after verification —
  // it stays populated once live, since removing the records breaks it.
  repeated DeployDnsRecord required_records = 5;
  // Why the last attempt failed, in terms a tenant can act on. Cleared on
  // success.
  string last_error = 6;
  // When ownership was last PROVEN. Distinct from live_since: a domain can
  // be verified and not yet serving, with no binding or a certificate still
  // being issued.
  google.protobuf.Timestamp verified_at = 7;
  // When the domain FIRST served. Never cleared by a later failure.
  google.protobuf.Timestamp live_since = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // The domain's binding, if it has one. At most one, always — a hostname
  // resolves to exactly one place.
  DomainBinding binding = 11;
}

// DomainSource is where a domain came from, which decides how verification
// is SATISFIED and nothing else — the two are bound, routed, issued and
// served identically.
enum DomainSource {
  DOMAIN_SOURCE_UNSPECIFIED = 0;
  // The customer owns it and pointed it at us. Must prove ownership by
  // publishing the TXT token.
  DOMAIN_SOURCE_EXTERNAL = 1;
  // Reliant owns it — a vanity or registrar domain the platform provisions.
  // Created ALREADY VERIFIED: we are the registrant, so asking ourselves to
  // publish a token into our own zone would prove nothing that owning the
  // zone does not already prove.
  DOMAIN_SOURCE_PLATFORM = 2;
}

// DomainBinding is what a domain serves: an environment and a target inside
// it, or a redirect to another hostname.
message DomainBinding {
  string id = 1;
  string domain_id = 2;
  string environment_id = 3;
  // The workload or static-site NAME within the environment — the thing a
  // tenant names in their config, NOT a deployment id. A deployment id is
  // re-minted when a workload is replaced, which is exactly when a binding
  // must survive; a name also lets a domain be bound before its target has
  // ever been deployed, which is the natural order for a first launch.
  string target = 4;
  // Serve a 308 to this hostname instead of proxying. The apex/www pair is
  // the case: 'www.example.com' redirects to 'example.com'.
  string redirect_to = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Deployment is one deployable unit inside an environment.
//
// THE TWO HALVES ARE THE POINT. `spec` is what the tenant declared;
// `observed` is what the operator confirmed. Both are exposed because the UI's
// job is to show the difference — "you asked for 3 replicas, 2 are running" is
// a sentence only a client holding both halves can write. Anything that
// computes money from `desired` is a bug.
message Deployment {
  string id = 1;
  // Denormalized from the environment so every billing and quota query can
  // start "for this org" without a join on a hot path.
  string org_id = 2;
  string environment_id = 3;
  string name = 4;
  DeployTier tier = 5;

  DeployObservedStateDetail observed = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  // THE DECLARED HALF: forge's tier spec, verbatim.
  //
  // This is the JSON of forge's `v1alpha1.<Tier>Spec` for this deployment's
  // tier (github.com/reliant-labs/forge/pkg/deploy/v1alpha1): WorkloadSpec
  // for BACKEND, StaticSiteSpec for STATIC, ManagedDatabaseSpec for DATABASE,
  // in forge's own camelCase json tags. There is deliberately NO proto mirror
  // of those types. One Go type defines the tier, forge's, and a second
  // schema here could only ever disagree with it. The same document is what
  // PublishDeploymentConfig writes as the forge.dev/v1alpha1 CR's spec.
  //
  // Resources are millicores and BYTES (forge's units), never MiB.
  google.protobuf.Struct spec = 11;

  // What the TENANT asked for: running or suspended. Outside the spec on
  // purpose. A suspend is an imperative act driven by Scale, not part of the
  // declaration a forge project checks in, so a redeploy of an unchanged
  // project must not resume a workload somebody suspended.
  DeployRunState run_state = 10;

  // Tag 6 is unused and its history is unknown — it predates the records we
  // have, so nothing here can say what a client on an old release might
  // decode it as. RESERVED rather than recycled: an unknown tag is exactly
  // the case where reuse is unsafe, because the failure is silent.
  reserved 6;

  // The release ARTIFACT KEY whose digest this deployment runs, matching
  // forge's Artifacts map key (the same key forge computes for its plan, so
  // the client and the server cannot pair a workload with a digest
  // differently).
  //
  // EMPTY MEANS NOT RELEASE-BOUND: a ManagedDatabase, or a third-party image
  // pinned directly in the spec. The converger SKIPS an empty one rather than
  // guessing a pairing from the deployment's name. Names coinciding with
  // artifact keys is a convention, not a guarantee, and a converger that
  // guessed would silently repoint the wrong workload the first time they
  // differed.
  string artifact = 12;

  // The promotion whose pins this row's spec currently carries.
  //
  // This is the discriminator between "a promotion is waiting to be applied"
  // and "this row has drifted", and those two need opposite answers under the
  // OBSERVE policy: a promotion is a declared change and ships, while drift is
  // corrected only under CONVERGE. Comparing digests cannot tell them apart —
  // both read as "the row does not match the pin" — which is why this is a
  // promotion id and not a digest comparison.
  //
  // Empty on a row that has never been pinned from a promotion.
  string applied_promotion_id = 13;

  // The bundle whose rendered CONFIG this row's spec came from, as distinct
  // from applied_promotion_id above, which says where its IMAGES came from.
  //
  // The two move independently and must both be readable. A converger patches
  // a workload's digest to realize a promotion and leaves the config exactly
  // as the last apply rendered it, so "config from bundle B, images from
  // promotion P" is the accurate description of a converged row — and
  // collapsing them into one pointer would make one of the two a lie every
  // time the converger ran.
  //
  // Empty on a row written before bundles existed, or by a path that rendered
  // from no bundle.
  string applied_bundle_id = 14;
}

// DeployArtifact is one image's resolved identity within a release.
// DeployArtifact is one artifact inside a release.
//
// A release ships more than container images, and the KIND is what lets a
// reader know how to verify a given entry. That is not a theoretical
// distinction: forge v0.1.12 tagged web-runtime/v0.3.1, never published it to
// npm, and nothing noticed until a scaffolded project failed to install —
// because the release model had no way to SAY "this release also contains an
// npm package, at this version, with this integrity hash". A model that cannot
// NAME an artifact cannot verify it, and an unverifiable artifact drifts
// silently.
//
// Two addressing shapes live here, discriminated by `kind`, because the things
// a release ships are not all content-addressed the same way:
//
//   - OCI images are addressed by DIGEST alone — the digest IS the name, so
//     `digest` carries it and version/integrity stay empty.
//   - Everything else (npm, Go modules, published files) is addressed by a
//     COORDINATE plus a hash: the version is how a consumer asks for it, and
//     the hash is how they know they got the right bytes.
message DeployArtifact {
  // The bare artifact name, matching forge's Artifacts map key. An image name
  // ("control-plane"), an npm package ("@scope/pkg"), or a module path.
  string name = 1;
  // Canonical sha256 digest, matching ^sha256:[a-f0-9]{64}$. OCI only —
  // EMPTY for every other kind, which is why the database's digest CHECK is
  // conditional on kind rather than unconditional.
  string digest = 2;
  // OS/arch the captured manifest advertises. Informational.
  repeated string platforms = 3;

  // One of "oci", "npm", "gomod", "file".
  //
  // EMPTY MEANS "oci", and that default is not a guess: before this field
  // existed a release could only hold images, so every artifact in a pre-kind
  // release IS one. Release rows are immutable and are never rewritten, so the
  // empty case is permanent rather than a migration someone forgot to finish.
  //
  // Deliberately a string, not an enum. forge documents the kind set as OPEN
  // so an older server does not refuse a release a newer forge legitimately
  // cut; an unrecognised kind fails CLOSED (it is not an image, so nothing
  // will deploy it) rather than failing open.
  string kind = 4;

  // How a consumer ASKS for this artifact: an npm version ("0.3.1"), a Go
  // module version ("v0.1.15"). Empty for OCI, where the digest is the name.
  string version = 5;
  // How a consumer KNOWS they got the right bytes, in the hash format native
  // to that ecosystem — npm's "sha512-…", a go.sum "h1:…", or "sha256:…" for
  // a published file. Carried verbatim rather than normalised: a verifier
  // compares it against what the registry reports, and re-encoding it would
  // break that comparison.
  string integrity = 6;
  // Where the artifact lives when name+version does not imply it: a download
  // URL for a file, or a non-default registry. Empty means the ecosystem's
  // default registry.
  string uri = 7;

  // How this artifact is addressed across environments, mirroring forge's
  // pkg/release.Mode: "shared" (one set of bytes everywhere), "variant" (one
  // build per variant, keyed by `variant`), or "source" (pinned source rather
  // than built bytes; see `source`). REQUIRED.
  //
  // NOTE ON `kind` ABOVE: the kind set is CLOSED — oci | npm | gomod | file |
  // git — and a server refuses anything outside it. The "open set" wording on
  // `kind` predates pkg/release and is superseded by this note.
  string mode = 8;
  // The variant this entry is the build for. "*" for shared and source
  // artifacts. There is exactly one DeployArtifact per (name, variant).
  string variant = 9;
  // The pinned source. Set iff mode = "source", empty otherwise.
  DeploySource source = 10;
}

// DeploySource pins an artifact to source rather than to built bytes: a
// repository, the ref that was asked for, the subdirectory within it, and the
// commit that ref resolved to when the release was cut. The commit is the
// identity; repo/ref/subdir are how a human reads it.
message DeploySource {
  string repo = 1;
  string ref = 2;
  string subdir = 3;
  string commit = 4;
}

// DeployRelease is a cut set of content-addressed digests under a version
// label. IMMUTABLE once written — the database enforces it with an append-only
// trigger, so there is no UpdateRelease RPC to write and none will be added.
// A correction is a new release.
message DeployRelease {
  string id = 1;
  // The human-readable label ("v1.4.0"), matching forge's Release.Version.
  // Unique within an org: two tenants both cutting "v1.0.0" is expected.
  string version = 2;

  // Source provenance, mirroring forge's ReleaseGit. Best-effort and
  // informational — what lets a reviewer tie a running digest back to a
  // commit, which is the first question asked during an incident.
  string git_commit = 3;
  string git_tag = 4;
  bool git_dirty = 5;

  repeated DeployArtifact artifacts = 6;

  string created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // No updated_at, and that absence is the point: a release is immutable, so
  // there is no update to stamp. A field implying otherwise would invite one.

  // The CI run that cut this release, when one was supplied. The join key
  // that ties a release to the promotions and gates from the same run.
  DeployRun run = 9;

  // The full source provenance of the cut, superseding the three git_* fields
  // above rather than duplicating them: it adds the branch, the working-tree
  // state as a content hash (`tree`), which worktree and machine cut it, the
  // forge version, and a CI attestation when one was supplied.
  //
  // The git_* fields stay because old readers read them, and the server fills
  // them FROM this when they are unset, so one write satisfies both.
  //
  // WHY A TREE HASH AND NOT JUST `dirty`. A dirty release is not a mistake to
  // be flagged and forgotten — v1.0.0 of this very product was cut dirty from
  // a laptop — it is a thing that has to stay IDENTIFIABLE afterwards. A hash
  // over the working tree gives two dirty builds from the same commit
  // different identities, which a boolean cannot.
  DeploySourceProvenance provenance = 10;

  // Tag 11 is `source_status` (DeploySourceStatus): the verifier's verdict on
  // whether this release's commit is an ancestor of the project's main ref.
  // Deferred to #516 with the verifier itself. Until then the row carries
  // provenance and no verdict, which is honest — a verdict field defaulting
  // to "unchecked" would be read as "checked and fine".
  reserved 11; // source_status — #516

  // The forge project (forge.yaml `name`) this version belongs to.
  //
  // A release's identity is (org, project, version), because one org may hold
  // several forge projects and each cuts its own `v1.0.0`. Before this field
  // the ledger's uniqueness was (org, version), so a second project's first
  // release collided with the first project's.
  //
  // EMPTY IS LEGACY, not "no project": releases cut before this field existed
  // carry "" and are resolved by falling back to it, so a project's lookup
  // finds its own row first and the pre-project history second.
  string project = 12;
}

// DeployGate is one check's result, recorded against a promotion.
//
// EVIDENCE, NOT ENFORCEMENT, and the distinction is load-bearing rather than
// decorative. RecordGate is authorized at `deploy:write` — deliberately BELOW
// promote's admin, so a CI test job's token needs no promote authority — which
// means a `deploy:write` token can record a `passed` gate for a check it never
// ran. That is acceptable precisely because nothing enforces on this record.
// When gates-as-policy arrives, enforcement MUST re-run or re-verify the
// check; it must not trust a row here.
message DeployGate {
  // "lint", "test", "smoke", "rollout", "qa-signoff".
  string name = 1;

  // A CLOSED set, validated server-side: passed | failed | skipped | error.
  //
  // It was free text, and rows already in the ledger carry whatever the old
  // scaffold wrote. So the READ path maps an unrecognised value to `error`
  // for display and keeps the raw string, while the WRITE path refuses
  // anything outside the set as InvalidArgument. Mapping rather than
  // rejecting on read is what keeps a historical ledger readable: the ledger
  // is append-only, so there is no migration that could clean those rows up.
  string status = 2;

  // Where the full report lives — a CI run, a build artifact.
  string url = 3;

  // One line, for a human scanning a timeline: "412 passed, 0 failed, 3
  // skipped". Not a log, and not a place to put one.
  string summary = 4;

  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;

  // The CI run this check belongs to (DeployRun.id). OPTIONAL: a manual QA
  // sign-off has no run, and still attaches to the promotion and appears in
  // the environment's history. It simply belongs to no run.
  string run_id = 7;

  // Small, structured, optional: counts and verdicts. Capped server-side at
  // 8 KiB, because the full report is behind `url` and a details blob that
  // could hold a log would eventually hold one.
  google.protobuf.Struct details = 8;

  // SET BY THE SERVER on read; never accepted from a request. Who recorded
  // this gate — a user id, or "token:<token_id>" — and when. A client-supplied
  // attribution would be a client claiming who vouched for a check, which is
  // the one part of a piece of evidence that must not come from the party
  // being vouched for.
  string recorded_by = 9;
  google.protobuf.Timestamp recorded_at = 10;
}

// DeployRun identifies the CI run (or human session) that drove a sequence of
// deploy writes, so a release, its promotions and its gates can be read back
// as one story rather than as unrelated rows that happen to share a timestamp.
//
// It is CALLER-CHOSEN and opaque. The control plane never parses it, and it is
// not an identity: `provider` is for display, not for trust. Authorization is
// the caller's token, as everywhere else.
message DeployRun {
  // Opaque and stable across retries of one attempt, e.g.
  // "github:acme/app/12345/1". Stability across retries is what makes the
  // gate idempotency key (promotion_id, name, run_id) do its job.
  string id = 1;
  // Link to the CI run, for a human.
  string url = 2;
  // "github" | "gitlab" | "manual". DISPLAY ONLY — see above.
  string provider = 3;
}

// DeployRolloutPhase is how far one promotion has got toward actually running,
// judged against THAT promotion's frozen pins.
//
// It is DERIVED on read, never stored, for the reason DeployVerdict is:
// a stored phase is a cache of an observation, and a stale cache here reads as
// a healthy release.
enum DeployRolloutPhase {
  DEPLOY_ROLLOUT_PHASE_UNSPECIFIED = 0;
  // Promoted, but no workload has started moving: nothing has picked the
  // promotion up yet.
  DEPLOY_ROLLOUT_PHASE_PENDING = 1;
  // Some workload is not yet serving the pinned digest. A mid-rollout
  // DIVERGED verdict folds in HERE: divergence inside a rollout window is
  // normal, and becomes a failure only through the caller's timeout.
  DEPLOY_ROLLOUT_PHASE_PROGRESSING = 2;
  // Every workload serves the pinned digest, but is still inside the
  // stability window.
  DEPLOY_ROLLOUT_PHASE_STABILIZING = 3;
  // Every workload converged on the pinned digest and stayed there past the
  // window.
  DEPLOY_ROLLOUT_PHASE_SUCCEEDED = 4;
  // A workload is not serving — on the NEW digest or the old one. A crash on
  // the old digest during a rollout is still a failed rollout.
  DEPLOY_ROLLOUT_PHASE_DEGRADED = 5;
  // A newer promotion replaced this one before it finished.
  DEPLOY_ROLLOUT_PHASE_SUPERSEDED = 6;
  // A workload cannot be observed. Its own outcome, never folded into success
  // or failure: "we cannot see it" is not permission.
  DEPLOY_ROLLOUT_PHASE_UNKNOWN = 7;
}

// DeployWorkloadRollout is one workload's progress toward one promotion's pin.
message DeployWorkloadRollout {
  string deployment_id = 1;
  string name = 2;
  // The release artifact this workload runs (Deployment.artifact).
  string artifact = 3;
  // From THIS promotion's resolved_artifacts — the frozen pin, not whatever
  // the deployment row declares now. That is the whole point of scoping a
  // rollout to a promotion: a wait must not succeed on bytes it was never
  // asked about because somebody promoted again underneath it.
  string pinned_digest = 4;
  // What the row currently declares, which differs from pinned_digest while a
  // promotion is unapplied, or after a hand-made EnsureDeployment.
  string desired_digest = 5;
  string observed_digest = 6;
  DeployObservedState observed_state = 7;
  DeployVerdict verdict = 8;
  // This workload's phase toward pinned_digest.
  DeployRolloutPhase phase = 9;
  google.protobuf.Timestamp stable_since = 10;
  // stable_since + the stability window, once reached.
  google.protobuf.Timestamp converged_at = 11;
  string last_error = 12;

  // How many pods run the pinned digest AND are ready, and how many are
  // wanted.
  //
  // These are what stop a rollout being reported healthy before it is. Under
  // RollingUpdate, old ready pods keep readyReplicas up while the new
  // ReplicaSet crash-loops, so "ready replicas ≥ wanted" is true of a release
  // that has never served a request. Comparing UPDATED against DESIRED is the
  // completion test `kubectl rollout status` applies.
  int32 updated_replicas = 13;
  int32 desired_replicas = 14;
}

// DeployRollout is how far ONE promotion has rolled out — the single
// server-computed answer to "is v6 done".
//
// Computed in one place on purpose. `forge env wait`, the in-flight promote
// refusal, the UI and a run timeline all read this, so four consumers cannot
// hold four different opinions about whether a release landed.
message DeployRollout {
  DeployPromotion promotion = 1;
  // Worst-wins over the pinned workloads, in the order
  // DEGRADED > UNKNOWN > PROGRESSING > PENDING > STABILIZING > SUCCEEDED.
  DeployRolloutPhase phase = 2;
  repeated DeployWorkloadRollout workloads = 3;
  // Workloads in the environment that this promotion does not pin: databases,
  // third-party images. REPORTED, never gating — a healthy release over a
  // degraded database is reported as exactly that rather than hidden, and a
  // database that cannot be release-bound must not be able to fail a release.
  repeated DeployWorkloadRollout unpinned = 4;
  // = promotion.created_at.
  google.protobuf.Timestamp started_at = 5;
  // The SUCCEEDED / DEGRADED / SUPERSEDED moment, when known. For SUCCEEDED
  // it is the latest converged_at across the pinned workloads.
  google.protobuf.Timestamp finished_at = 6;
  // Milliseconds. An int64 rather than a Duration so this file gains no new
  // import — it is shared by two services and exported to a public repo.
  int64 stability_window_ms = 7;
  // Mirrors DeployEnvironment.converges_promotions: false means nothing will
  // move without a client-side deploy, so a caller should refuse rather than
  // wait.
  bool converges_promotions = 8;
  // One human line explaining the phase.
  string reason = 9;
}

// DeployRunStage is one step in a run's timeline, as assembled from the
// ledger.
//
// NOTHING HERE IS A STORED EVENT. A stage is a release cut, a promotion, a
// recorded gate carrying the run id, or a promotion's derived rollout. There
// is no event table, no event bus and no webhook, because an append-only
// ledger plus a derived rollout already contains the timeline — and a second,
// stored copy of it could only ever disagree.
message DeployRunStage {
  // build | cut | check | promote | rollout.
  string kind = 1;
  // "lint", "staging", "prod", an artifact name.
  string name = 2;
  string environment_id = 3;
  string promotion_id = 4;
  // passed | failed | running | skipped | error. A rollout phase maps in:
  // SUCCEEDED→passed, DEGRADED→failed, SUPERSEDED→skipped, anything else
  // →running.
  string status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string url = 8;
  string summary = 9;
}

// DeployPromoteRefusal is why a promote was refused, carried as an error
// detail on the FailedPrecondition.
//
// It names WHAT IS THERE, not just that something was. A refusal reading
// "someone else promoted" sends a human to a dashboard; one carrying the
// actual current promotion lets the pipeline print "prod is on v1.9.1,
// promoted by alice 4 minutes ago" and lets a script decide without a second
// round trip.
message DeployPromoteRefusal {
  // promotion_conflict | rollout_in_flight | environment_pinned |
  // plan_stale | plan_unacknowledged.
  //
  // `plan_stale`: the plan the caller approved no longer describes what would
  // happen. The server recomputed it under the environment's row lock and got
  // a different digest, because Live moved — someone promoted, an apply
  // landed, or drift was observed. It is the same situation as a
  // promotion_conflict from the operator's point of view ("the world moved
  // under me") and carries the same remedy, re-run the plan, which is why
  // forge maps both to one exit code.
  //
  // `plan_unacknowledged`: the recomputed plan holds a stop-class finding — a
  // stateful deletion, a load-balancer identity change — that the request did
  // not name in acknowledged_findings. Deliberately not satisfiable by a
  // blanket "yes": a flag that can be hard-coded in a workflow pre-approves
  // every future destructive change to that environment, while a finding code
  // cannot be known until the plan is computed.
  string reason = 1;
  // Echoed back from the request, so a log line is self-contained.
  string expected_current_promotion_id = 2;
  bool expected_unbound = 3;
  // What IS bound — the promotion that landed instead.
  DeployPromotion actual_current = 4;
  // Set for rollout_in_flight: the phase that made it in flight.
  DeployRolloutPhase actual_phase = 5;
  // One human sentence.
  string detail = 6;

  // Tag 7 is `findings` (repeated DeployPolicyFinding), the source-policy
  // refusal detail, deferred to #516 with the policy that produces it.
  reserved 7; // findings — #516

  // The plan as the server just RECOMPUTED it, for the two plan_* reasons.
  //
  // Carried so a refused caller can show the operator what changed without a
  // second round trip — the same reasoning actual_current follows. For
  // plan_stale this is the plan they should have approved; for
  // plan_unacknowledged its findings name exactly which codes are missing.
  DeployPlan current_plan = 8;
}

// DeployPromotion is one entry in the append-only ledger: this environment ran
// this release, promoted by this actor, at this time, with these gates passed.
//
// WHY A LEDGER AND NOT JUST A POINTER. An environment does have a current
// pointer, but the pointer alone cannot answer the questions that matter after
// an incident: what was running at 03:00, who promoted it, what gates had
// passed, and what did we roll back FROM. Overwriting a pointer destroys
// exactly the evidence an incident needs.
message DeployPromotion {
  string id = 1;
  string environment_id = 2;
  string release_id = 3;
  // Intent, not mechanism — both kinds re-point. Set by the SERVER from which
  // RPC was called, never by the client.
  DeployPromotionKind kind = 4;

  // The environment this release was promoted FROM, or empty on a first
  // deploy. What makes the promotion PATH auditable rather than just its
  // endpoint: it answers "did this actually pass staging, or did someone
  // promote straight to prod?".
  string from_environment_id = 5;

  // The digests frozen AT PROMOTE TIME. Duplicates the release's artifacts
  // deliberately, and forge does the same for the same reason: freezing at
  // promote rather than at deploy time means a deploy cannot ship something
  // the promoter never approved.
  map<string, string> resolved_artifacts = 6;

  string promoted_by_user_id = 7;
  // Records automation ("ci", "preview-bot") when no human pressed the button.
  // Kept separate from the user id so "a robot did it" is a distinct readable
  // fact rather than an indistinguishable empty string.
  string promoted_by_actor = 8;

  // Evidence, NOT enforcement. This ledger records what happened; it cannot
  // police what should have. A gate that must BLOCK a promotion is checked by
  // the promoting service before this row is written, because a record here
  // could only ever verify that a claim was made, not that a test ran.
  repeated DeployGate gates = 9;

  // Free-form reason. Most valuable on a promote that moves an env BEHIND,
  // where "why" is the whole story and is otherwise lost to chat history.
  string note = 10;

  google.protobuf.Timestamp created_at = 11;

  // The source pins frozen AT PROMOTE TIME, artifact name → pinned source —
  // resolved_artifacts' twin for mode = "source" artifacts, frozen for the
  // same reason: a deploy cannot ship a commit the promoter never approved.
  map<string, DeploySource> resolved_sources = 12;
  // The promoted release's version label ("v1.4.0"), so a ledger reader need
  // not resolve release_id to say what was promoted.
  string release_version = 13;

  // Evidence recorded AFTER this row was written, through RecordGate — the
  // post-promote half of the trail whose pre-promote half is `gates` above.
  //
  // Two fields rather than one because they answer different questions and
  // have different trust: `gates` is what the promoter claimed at the moment
  // they promoted, and these are results that arrived later (a smoke test, a
  // rollout outcome, a human sign-off). Merging them would lose "was this
  // known before the button was pressed?", which is the first question asked
  // about a bad release.
  repeated DeployGate recorded_gates = 14;

  // This promote overrode an in-flight rollout (`--supersede`).
  //
  // Recorded because an override that leaves no trace is indistinguishable
  // from the refusal never having fired. A reader looking at two promotions
  // ninety seconds apart needs to know the second one was deliberate.
  bool superseded_in_flight = 15;

  // The name of the environment in from_environment_id, so a ledger reader
  // renders "staging → prod" without a second lookup per row.
  string from_environment_name = 16;

  // The specific PROMOTION this release was taken from, when the promote named
  // a source environment's state rather than just a version
  // (`promote --from staging`). from_environment_id says where it came from;
  // this says exactly WHAT was there, which is what makes "promote whatever
  // staging is running" auditable after staging has moved on.
  string from_promotion_id = 17;

  // The CI run that performed this promotion.
  DeployRun run = 18;

  // The promoted release's provenance, joined on read.
  //
  // Here so a ledger timeline renders "v12, from main@abc" for every row
  // without a GetRelease per row. A timeline that shows versions alone is the
  // one that cannot answer the question an incident actually asks, which is
  // what CODE was running — and resolving that per row is what makes a
  // sixteen-row page sixteen extra round trips.
  DeploySourceProvenance release_provenance = 19;

  // Tags 20 and 21 are `regression_acknowledged` and `admitted_findings`
  // (repeated DeployPolicyFinding) — the record of what the source policy
  // admitted at promote time. Deferred to #516 with the policy.
  reserved 20; // regression_acknowledged — #516
  reserved 21; // admitted_findings — #516

  // Set when this row came from `forge ledger import` rather than from a
  // promote: the source it was read out of, e.g.
  // "git:.forge/promotions/prod.jsonl@<blob sha>".
  //
  // It is both the idempotency key for the import and the label that keeps
  // imported history honest. An imported row's `promoted_by_actor` is a
  // string copied out of a file, not an identity this system ever
  // authenticated, and a reader needs to be able to tell the difference.
  string imported_from = 22;

  // The deploy plan the approver approved, as a digest.
  //
  // The plan itself is not stored. It is derivable from the bundle and the
  // Live state at that instant, both already recorded, and a stored second
  // copy would be exactly the "derived timeline stored twice" mistake the
  // converger design rejects. The digest is enough to prove WHICH plan was
  // approved, which is the only thing the row needs to carry.
  //
  // REQUIRED on environments whose promotions the converger applies, because
  // for those the promotion row IS the deploy — there is no later apply at
  // which a plan could be checked. Optional elsewhere, and recorded when
  // present.
  string plan_digest = 23;

  // Who approved that plan, set by the SERVER from the caller's credential.
  // Never a name the client supplied: an approval attributed to a
  // client-chosen string is an audit trail that proves nothing.
  string approved_by = 24;

  // The stop-class finding codes the approver named explicitly, e.g.
  // "stateful_deletion". Recorded because an acknowledged destruction that
  // leaves no trace is indistinguishable afterwards from one nobody was ever
  // warned about.
  repeated string acknowledged_findings = 25;
}

// === Source of truth: provenance, bundles, applies, plans ===
//
// These messages exist so the control plane can answer "what is running, from
// what code, applied by whom" for an environment it does not place. For a
// hosted environment the platform is the observer and the answer is derived
// from what it sees; for a self-managed or local one there is no server-side
// observer at all, so the record has to be written at the moments that matter:
// the declaration, the bundle, the apply, and the apply's outcome.
//
// The protection half of the design (DeployEnvironmentProtection,
// DeploySourceStatus, DeployPolicyFinding and the fields carrying them) is
// deferred to #516. Their tags are reserved throughout this file so the
// numbering here is already final.

// DeploySourceProvenance is where a thing came from, in enough detail to find
// it again. It mirrors forge's release.Provenance field for field, because the
// CLI and the server must agree on the record's shape to agree on its digest.
message DeploySourceProvenance {
  // The repository, as forge resolved it from the remote.
  string repo = 1;
  string commit = 2;
  string branch = 3;
  string tag = 4;

  // The working tree had uncommitted changes. Reported, never refused: a
  // dirty build is a fact to record, and #516 is what gives it consequences.
  bool dirty = 5;

  // A content hash over the working tree — 40 or 64 hex, empty when the tree
  // was not hashed.
  //
  // THIS IS WHAT GIVES A DIRTY BUILD AN IDENTITY. `commit` plus `dirty` says
  // "something off main@abc", which is the same string for every dirty build
  // anyone ever makes from that commit. The tree hash distinguishes them, so
  // two developers debugging "the build that was running at 03:00" can tell
  // whether they are looking at the same bytes.
  string tree = 6;

  // Which checkout on which machine, for a local or self-managed deploy.
  DeployWorktree worktree = 7;

  // The forge version that produced this. Load-bearing for a shape: two forge
  // versions can render the same project into different objects, so a shape
  // with no renderer version is not reproducible.
  string forge_version = 8;

  // A CI attestation, when the caller had one.
  //
  // THE SAME FIELD CARRIES DIFFERENT THINGS IN EACH DIRECTION. On a WRITE it
  // holds the raw OIDC token, which is the only form the server can verify.
  // On a READ it holds the claims that verification established, never the
  // token — handing a token back out would make every reader of the ledger a
  // holder of a credential.
  DeploySourceAttestation attestation = 9;
}

// DeployWorktree identifies one checkout on one machine.
//
// A developer runs several worktrees of one project at once, and each may have
// its own `forge env up`. So a local environment's presence is per WORKTREE,
// not per user and not per machine: keyed on the user alone, two worktrees
// would overwrite each other's session and Live would show one of them at
// random.
message DeployWorktree {
  // Stable and opaque, chosen by forge. The upsert key for a local session.
  string key = 1;
  // What a human calls it — a branch name, a directory name. Display only.
  string label = 2;
  // The machine. Deliberately an id and not a hostname: a hostname is a
  // person's laptop name, shown to everyone in the org.
  string host_id = 3;
}

// DeploySourceAttestation is a CI system's claim about who built something.
//
// It is provenance, not authorization. Authorization is the caller's token,
// as everywhere else on this service; this says "GitHub Actions asserts this
// came from repo X, run Y", which is what makes a release traceable to a
// pipeline rather than to a token someone pasted into a terminal.
message DeploySourceAttestation {
  // "github" | "gitlab".
  string provider = 1;
  // The OIDC subject: the workflow identity the provider vouched for.
  string subject = 2;
  string run_id = 3;
  // WRITE-ONLY, and empty on every read. The raw OIDC JWT the server
  // verifies; see DeploySourceProvenance.attestation.
  string token = 4;
}

// DeployBundle is one rendered, content-addressed deploy artifact: the whole
// of what an environment should contain, as an OCI artifact plus the document
// describing it.
//
// WHY THIS EXISTS WHEN PROMOTIONS ALREADY DO. A promotion freezes IMAGES. It
// says nothing about the rest of a render — the replica counts, the flags, the
// objects a self-managed cluster applies that the platform never sees — so an
// environment bound to a promotion is still only half described. A bundle is
// the other half, which is what makes a deploy plan computable: without a
// recorded "what is there now", a plan can only diff against whatever the
// client claims Live is.
//
// Every field here is taken from the bundle's own VERIFIED bytes, never from
// a description the client supplied alongside them. RecordBundle re-derives
// the digest, checks the config blob against the manifest, and decodes the
// document strictly, so a client cannot record a shape that disagrees with the
// artifact it points at.
message DeployBundle {
  string id = 1;
  string environment_id = 2;
  // The release this render pinned its images from, by version label.
  string release_version = 3;
  // Canonical `sha256:<64 hex>` of the OCI manifest. THE IDENTITY: bundles
  // are idempotent on (environment, digest).
  string digest = 4;
  // The canonical digest reference, `repository@digest`.
  string reference = 5;
  // The hash of the config half of the render, isolated from the images.
  //
  // It is the SHORT-CIRCUIT: two bundles with the same config digest differ
  // only in which images they pin, so a deploy between them has no config to
  // apply. A plan reports that as "nothing to apply" rather than walking a
  // diff it already knows is empty.
  string config_digest = 6;
  // release.Shape, from the verified document (DeployEnvironment.declared_shape).
  google.protobuf.Struct shape = 7;
  DeploySourceProvenance provenance = 8;

  // Tag 9 is `source_status` (DeploySourceStatus) — deferred to #516 with the
  // verifier. See DeployRelease.reserved 11 for why an unchecked verdict is
  // worse than no field.
  reserved 9; // source_status — #516

  DeployRun run = 10;
  // Set by the SERVER from the caller's credential.
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
}

// DeployConvergence is the control plane's own OBSERVATION that an environment
// did, or did not, reach the bundle its intent names.
//
// IT REPLACES DeployApply AND DeployApplyOutcome, and the replacement is the
// whole model change rather than a rename. Those messages described a CLIENT
// claiming it was applying something and then reporting how it went, which is
// why DeployApplyOutcome had to carry `reported_by` and be labelled "reported
// by forge · alice" wherever it was shown. Under the spec-driven model forge
// does not apply at all: a promotion declares intent, the reconciler converges
// reality to it, and the control plane reads the reconciler's status itself. So
// nothing here is a report, and nothing needs labelling as one.
//
// THESE ROWS ARE SECONDARY AND REBUILDABLE. The primary record is the
// promotion. Every field below is derived from the reconciler's current status,
// so the whole timeline can be dropped and re-observed; no correctness depends
// on it. That is what makes it safe for this to be append-only and lossy at the
// edges where an apply record could not be.
//
// ONE ROW PER TRANSITION, NOT PER POLL. The observer looks every couple of
// minutes and appends only when the answer CHANGED, so a timeline is short and
// every entry means something.
message DeployConvergence {
  string id = 1;
  string environment_id = 2;
  // The bundle the observed revision resolves to. EMPTY IS A REAL ANSWER: the
  // observation is of a REVISION, and the reconciler can legitimately report
  // one that maps to no recorded bundle.
  string bundle_id = 3;
  // The intent this reading was judged against — the environment's current
  // promotion at the moment of the pass.
  string promotion_id = 4;

  // What the reconciler reported as APPLIED (a Kustomization's
  // lastAppliedRevision), verbatim, so it is comparable byte-for-byte to what
  // the reconciler says.
  string revision = 5;

  // converged | failed.
  //
  // ONLY THE TWO TERMINAL READINGS ARE RECORDED, and the two that are missing
  // are the point. `progressing` is a moment in flight rather than an outcome,
  // and is already derivable from (intent, newest record) with no history.
  // `unknown` is an ABSENCE of information, and an absence is not an event —
  // recording one would make "we could not look" indistinguishable from a
  // reading. A reader sees that case as "the newest record predates the
  // current promotion".
  string state = 6;

  // The reconciler's OWN reason and message, passed through untranslated (for
  // Flux: ReconciliationSucceeded, ReconciliationFailed, HealthCheckFailed,
  // ArtifactFailed). A human chasing a failure needs the reconciler's words,
  // not a paraphrase. A failed record always carries a reason.
  string reason = 7;
  string message = 8;

  // Which target cluster this reading is about. Convergence is per
  // (environment, cluster) because one bundle is applied by one Kustomization
  // PER target cluster — a single row could not describe an environment half
  // of whose clusters failed.
  string cluster = 9;

  // When the OBSERVATION was made, which is not when the row was written: a
  // pass reads several objects and then records what it found.
  google.protobuf.Timestamp observed_at = 10;
  google.protobuf.Timestamp created_at = 11;

  // When this reading was most recently RE-CONFIRMED. observed_at is when the
  // state BEGAN (the transition this row records); the observer re-reads every
  // couple of minutes and, when nothing changed, advances this instead of
  // appending a row. "Running X · confirmed 30s ago" is this field. Never
  // earlier than observed_at; equal to it for a row that was never re-confirmed.
  google.protobuf.Timestamp last_observed_at = 12;
}

// DeployLocalSession is one `forge env up` worktree, present in Live.
//
// WHY A LOCAL ENVIRONMENT APPEARS AT ALL. Its workloads run on a developer's
// machine and the platform places nothing, but the environment is real, has
// secrets in the platform's store, and is the one somebody is actually
// debugging. Showing it as "no promotion, nothing deployed" is accurate and
// useless; showing "alice's feature-x worktree, up since 09:14, on main@abc"
// is what a team needs.
//
// PRESENCE, NOT CONTROL. The platform cannot start, stop or observe these; a
// session is upserted by the client and goes stale on its own. Nothing about
// it blocks `forge env up` — a developer whose network is down keeps working.
message DeployLocalSession {
  string id = 1;
  string environment_id = 2;
  // One session per worktree, never per user — see DeployWorktree.
  DeployWorktree worktree = 3;
  DeploySourceProvenance provenance = 4;
  // The bundle the session is running, by digest rather than id: a local
  // render is never recorded as a bundle row, so there is no id to name.
  string bundle_digest = 5;
  google.protobuf.Timestamp started_at = 6;
  // The staleness clock. A session whose last_seen_at is hours old is shown
  // as stale rather than running — the client stopped reporting, which is not
  // the same as having stopped.
  google.protobuf.Timestamp last_seen_at = 7;
  // Set when the client reported `state = stopped`. A clean exit, as distinct
  // from a session that simply went quiet.
  google.protobuf.Timestamp stopped_at = 8;
}

// DeployPlan is what a deploy WOULD do, computed before anyone approves it.
//
// It is computed by PlanDeploy as a pure read, and RECOMPUTED by Promote and
// BeginApply under the environment's row lock. Recomputing rather than
// trusting the plan the client submitted is what makes the digest a guarantee
// instead of a claim — the server never has to believe a client's copy,
// because it can derive the same answer from the bundle and Live.
//
// NEVER STORED AS A BLOB. The digest is recorded on the promotion and the
// apply; the plan itself is derivable from the bundle and the Live state at
// that instant, both of which are already recorded.
message DeployPlan {
  // `sha256:<hex>` over this message's canonical JSON with `digest` AND
  // `computed_at` cleared, and findings sorted.
  //
  // BOTH EXCLUSIONS ARE NECESSARY. Excluding `digest` is the ordinary
  // self-reference problem. Excluding `computed_at` is what makes the digest
  // comparable at all: the server recomputes the plan at approval time, so a
  // digest covering its own timestamp could never match the one the client
  // computed a minute earlier, and the check would refuse every promote.
  //
  // What the digest DOES cover is the bundle, the Live state it was computed
  // against (live_basis) and every finding — so it changes exactly when the
  // approval stops describing reality.
  string digest = 1;

  string environment_id = 2;
  string bundle_id = 3;
  string release_version = 4;

  // What the plan was computed AGAINST. A change here invalidates the digest,
  // which is the whole mechanism: this is the CAS extended from the promotion
  // pointer to cover the state the plan was reasoned over.
  DeployPlanBasis live_basis = 5;

  repeated DeployPlanFinding findings = 6;

  // The config_digest short-circuit fired: this bundle's config is identical
  // to what is applied, so there is nothing to apply. Reported as a field
  // rather than as an empty findings list, because "no differences" and "not
  // computed" must not look the same.
  bool config_identical = 7;

  // Excluded from the digest — see `digest`.
  google.protobuf.Timestamp computed_at = 8;
}

// DeployPlanBasis is the Live state a plan was computed against.
message DeployPlanBasis {
  string current_promotion_id = 1;
  string applied_bundle_id = 2;
  string applied_config_digest = 3;
  // Live objects diverge from the applied bundle. Part of the basis because a
  // plan computed over a clean environment is wrong once someone has changed
  // an object by hand: the deploy will silently revert their change, and the
  // plan has to be able to say so.
  bool drift_observed = 4;
}

// DeployPlanFinding is one thing the deploy would do, with a severity.
message DeployPlanFinding {
  // object_added | object_changed | object_removed | image_changed |
  // config_changed | secret_needed | stateful_deletion | lb_identity_change |
  // drift.
  string code = 1;

  // info | warn | stop.
  //
  // `stop` is the class that cannot be approved in bulk: it must appear in
  // the request's acknowledged_findings BY CODE, and a blanket `--yes` does
  // not satisfy it. The two stop-class cases are a stateful deletion and a
  // load-balancer identity change, both of which destroy something that
  // cannot be recreated by re-running the deploy.
  string class = 2;

  // Which section of the rendered plan this belongs under.
  string section = 3;
  // "<cluster>/<kind>/<ns>/<name>", or a workload or secret name.
  string subject = 4;
  // Human-readable. NEVER a secret value — a plan is printed in CI logs.
  string detail = 5;
}

// DeployLiveEnvironment is one environment's whole Live answer, folded into
// one message.
//
// ONE ROUND TRIP, for GetTenant's reason. Live renders an environment from its
// declaration, its current promotion, the release behind it, the bundle its
// config came from, the latest apply and any local sessions. Fetching those
// separately is six calls per environment and a page that renders in stages,
// each stage from a slightly different instant.
message DeployLiveEnvironment {
  DeployEnvironment environment = 1;
  // Where the IMAGES come from.
  DeployPromotion current_promotion = 2;
  DeployRelease current_release = 3;
  // Where the CONFIG comes from: the newest bundle with a succeeded apply, or
  // on a hosted environment the row's applied_bundle_id. See
  // Deployment.applied_bundle_id for why these are two pointers.
  DeployBundle current_bundle = 4;
  // Tag 5 was `latest_apply` (DeployApply): the newest attempt a CLIENT
  // reported it was making. Nothing applies any more, so there is no such
  // attempt to show — the reconciler converges the intent above and the
  // control plane observes the result. `drift` below carries that
  // observation, and the timeline is ListConvergences.
  //
  // RESERVED rather than removed outright, because this message SURVIVES: a
  // deployed client that still sends or reads tag 5 as a DeployApply must
  // never find a different type there. The messages that were deleted whole
  // need no tombstone; a tag inside a living message does.
  reserved 5; // latest_apply — deleted with the imperative apply model

  DeployRolloutPhase phase = 6;
  repeated DeployLocalSession sessions = 7;

  // Tag 8 is `findings` (repeated DeployPolicyFinding), the per-environment
  // policy state. Deferred to #516.
  reserved 8; // findings — #516

  DeployDrift drift = 9;
}

// DeployDrift is whether what is RUNNING still matches what was applied.
//
// Distinct from DeployVerdict, which compares a deployment's observed image
// against its own declared one. This compares the environment's live objects
// against the bundle that was applied to it, so it catches the thing a digest
// comparison cannot: an object someone edited by hand. That matters before a
// deploy, not after — the next apply reverts the edit silently, and the plan
// is where it has to be named.
message DeployDrift {
  // in_sync | drifted | unknown.
  //
  // UNKNOWN IS NOT in_sync, and keeping them apart is the point. An
  // environment nobody has observed yet, one whose observations have gone
  // stale, and one promoted seconds ago all answer "we cannot say yet" — and
  // reporting any of them as agreement is the confidently-wrong badge people
  // stop reading.
  string state = 1;
  // The bundle the comparison was made against: the one this environment's
  // current promotion names.
  string bundle_id = 2;

  // Tag 3 was `apply_id`. There are no applies to compare against any more —
  // the comparison is intent (the promoted bundle above) versus the
  // reconciler's observed revision. Reserved because this message survives.
  reserved 3; // apply_id — deleted with the imperative apply model

  google.protobuf.Timestamp observed_at = 4;

  // Per-object drift is NOT COMPUTED in this cut (owner ruling D3), so this
  // list is always empty — which the proto's own rule reads as "not
  // recorded", never as "we looked and every object matches".
  //
  // The reason is that the baseline disappeared with the apply model. Drift
  // per object was measured against the hash of every object AS IT LANDED,
  // which only the applying client could report. Measuring against the
  // bundle's own hashes instead would flag every object an admission webhook
  // or a defaulting controller touched as drifted from the first second,
  // which is a badge that is wrong on day one.
  repeated DeployDriftObject objects = 5;
  // One human line.
  string detail = 6;
}

// DeployDriftObject is one object's drift state.
//
// UNPOPULATED IN THIS CUT — see DeployDrift.objects. Kept because the shape is
// right for when a reconciler-side baseline exists.
message DeployDriftObject {
  string cluster = 1;
  string kind = 2;
  string namespace = 3;
  string name = 4;
  // From the applied bundle's shape.
  string expected_hash = 5;
  // From the live object, empty when it could not be read.
  string observed_hash = 6;
  // in_sync | drifted | missing | unobservable.
  //
  // `missing` and `unobservable` are separate for DeployDrift.state's reason:
  // an object that is gone is a finding, and an object nobody could look at
  // is an absence of information.
  string state = 7;
}

// DeployObjectHash is DELETED.
//
// It was the baseline per-object drift was measured from: the hash of every
// object AS IT LANDED, which only the client performing the apply could report
// (FinishDeployApplyRequest.observed_objects). forge does not apply, so there
// is no sender, and a message no one can populate is worse than none — it
// reads as a capability the system has.
//
// What would replace it is a reconciler-side baseline, which Flux's
// Kustomization inventory could supply. That is not this cut (owner ruling
// D3), and DeployDrift.objects stays empty until it is.

// DeployUsageRow is one metered quantity for one resource over one window —
// the shape the usage table and any per-dimension chart read.
//
// Post-hoc, never a reservation. Infrastructure metering reads the LIVE
// CLUSTER and writes what it found; a deployment that was declared and never
// applied appears in no candidate set and therefore in no row here.
message DeployUsageRow {
  DeployResourceKind resource_kind = 1;
  // Attribution dimensions. Any may be empty: a row whose deployment has
  // since been purged still records what it cost.
  string environment_id = 2;
  string deployment_id = 3;
  string tenant_cluster_id = 4;

  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;

  // In the kind's canonical INTEGER unit. Integer throughout: a float rounded
  // at report time loses money silently at scale, and the direction of the
  // loss is never in our favour.
  int64 quantity = 7;
  // Human-readable unit for display only ("milli-vCPU-hour"). Never used for
  // arithmetic — the unit is a property of resource_kind, and treating this
  // string as authoritative is how two rows of one kind end up disagreeing.
  string unit_display = 8;

  // Cost in USD nanos, when pricing has been applied. Zero when the dimension
  // is priced at zero — egress deliberately is, until an enforcement test
  // exists that fails when a tenant namespace reconciles without its policy.
  int64 cost_usd_nanos = 9;
}

// DeployLogLine is one line of build or runtime output.
message DeployLogLine {
  // Monotonic within a stream. The RESUME CURSOR: a client that reconnects
  // passes the last sequence it saw and receives only what it missed, which
  // is what makes a dropped connection a gap of milliseconds rather than a
  // reload of the whole buffer.
  int64 sequence = 1;
  google.protobuf.Timestamp timestamp = 2;
  string message = 3;
  // "stdout" | "stderr".
  string channel = 4;
}

// === Internal (staff-only) entities ===
//
// The same split public Daemon / DaemonInternal already makes. Reachable only
// through DeployAdminService.

// DeployTenantClusterInternal carried a vCluster's fleet PLACEMENT — which of
// our host clusters ran its control plane, and in which namespace. Deleted
// with the vCluster model: a connected cluster runs on nothing of ours, so
// there is no placement to report (the backing columns are NULL for it by
// CHECK).

// DeployEnvironmentInternal carries an environment's fleet placement.
message DeployEnvironmentInternal {
  string environment_id = 1;
  // Which host cluster this environment's workloads land on. The operator's
  // isolated-workload guard refuses to write tenant workloads to the
  // control-plane cluster; this is what it resolves.
  string host_cluster_id = 2;
}

// DeployDeploymentInternal carries reconcile diagnostics that are useful to
// staff debugging a stuck rollout and noise to a tenant.
message DeployDeploymentInternal {
  string deployment_id = 1;
  string host_cluster_id = 2;
  string namespace = 3;
  // The in-cluster object name the reconciler writes, for correlating with
  // kubectl output.
  string resource_name = 4;
  google.protobuf.Timestamp last_reconcile_attempt_at = 5;
  int32 consecutive_failures = 6;
}
