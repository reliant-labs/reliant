syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.

package controlplane.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/controlplane/v1;controlplanev1";

// Deploy-product entity messages, shared by the PUBLIC DeployService
// (proto/services/deploy/v1) and the staff DeployAdminService
// (proto/services/deploy_admin/v1).
//
// WHY THEY LIVE HERE AND NOT IN THE SERVICE FILE. Both services describe the
// same tenant estate, and a service-to-service proto import is rejected by
// this project's conventions — for the same reason it is rejected everywhere
// else: it makes one service's wire surface a dependency of another's, so a
// field added for the admin console silently becomes part of the public
// contract. proto/controlplane/v1 is the established home for entities two
// services share (shared.proto does exactly this for Daemon), and everything
// in the repo already resolves into the one `controlplane.v1` wire package.
//
// THE PUBLIC/INTERNAL SPLIT IS THE SAME ONE Daemon ALREADY MAKES. Placement
// internals — which host cluster a workload landed on, which namespace holds
// it — are NOT on the public messages. They are on the *Internal messages at
// the bottom of this file, reachable only through DeployAdminService, exactly
// as DaemonInternal carries the pod name and k8s phase that public Daemon
// deliberately omits. A tenant has no use for a CLUSTER_CONFIGS key, and
// publishing one hands out a map of our fleet.
//
// These messages mirror internal/deploy/types.go and the schema in
// db/migrations/00069-00071. When they disagree, the migration is right.

// === Enums ===
//
// Proto3 enum VALUE names are scoped to the PACKAGE, not to the enum, and this
// package already holds nine enums from shared.proto. Every value below is
// therefore prefixed DEPLOY_ to keep the namespace collision-free.

// DeployTier discriminates what a deployment IS. The four tiers share one
// lifecycle (declare → reconcile → meter → promote → delete) and differ in the
// controller that reconciles them and the config they carry.
enum DeployTier {
  DEPLOY_TIER_UNSPECIFIED = 0;
  // A build artifact on object storage behind a CDN. No compute, and
  // therefore no floor.
  DEPLOY_TIER_STATIC = 1;
  // ONE container, no pod-to-pod networking, optional public URL.
  DEPLOY_TIER_BACKEND = 2;
  // A managed Postgres database and role.
  DEPLOY_TIER_DATABASE = 3;
  // A workload inside the tenant's own vCluster, carrying the billed
  // control-plane floor.
  DEPLOY_TIER_CLUSTER = 4;
}

// DeployEnvironmentKind separates environments that live until deleted from
// per-PR previews that are reaped. A real discriminator rather than
// "expires_at is set", because the two differ in more than expiry: a preview
// is never a human promotion target and is excluded from the drift badge.
enum DeployEnvironmentKind {
  DEPLOY_ENVIRONMENT_KIND_UNSPECIFIED = 0;
  // dev / staging / prod: no TTL.
  DEPLOY_ENVIRONMENT_KIND_PERSISTENT = 1;
  // Ephemeral, and MUST carry a TTL — an unbounded preview is an unbounded
  // bill.
  DEPLOY_ENVIRONMENT_KIND_PREVIEW = 2;
}

// DeployRunState is what the TENANT asked for. Distinct from scale-to-zero,
// which is automatic and reversible without a spec change.
enum DeployRunState {
  DEPLOY_RUN_STATE_UNSPECIFIED = 0;
  DEPLOY_RUN_STATE_RUNNING = 1;
  DEPLOY_RUN_STATE_SUSPENDED = 2;
}

// DeployObservedState is what the OPERATOR confirmed. There is deliberately no
// DELETING member: deletion is a timestamp, and "deleting" is exactly
// "deleted_at is set and observed state is not DELETED". A third state
// alongside the timestamp would be a second source of truth for one fact.
enum DeployObservedState {
  DEPLOY_OBSERVED_STATE_UNSPECIFIED = 0;
  DEPLOY_OBSERVED_STATE_PENDING = 1;
  DEPLOY_OBSERVED_STATE_PROGRESSING = 2;
  DEPLOY_OBSERVED_STATE_READY = 3;
  DEPLOY_OBSERVED_STATE_DEGRADED = 4;
  DEPLOY_OBSERVED_STATE_SUSPENDED = 5;
  DEPLOY_OBSERVED_STATE_DELETED = 6;
}

// DeployVerdict is forge's deploystate verdict: whether what was OBSERVED is
// what was DECLARED, and for long enough to trust. It is computed on read from
// the observation, the stability clock (stable_since), the declared digest and
// run state, and the environment's reconcile_policy — never stored, because
// "converged" means "ready for at least the stability window" and a stored
// answer to that goes stale by the minute.
//
// OBSERVATION IS NOT VERDICT: DeployObservedState says what a look found;
// this says whether that is what was asked for.
enum DeployVerdict {
  DEPLOY_VERDICT_UNSPECIFIED = 0;
  // Nothing measured: never observed, or the observer could not look.
  DEPLOY_VERDICT_UNKNOWN = 1;
  // At the declared shape but not yet stable for the window, or a rollout
  // is in flight.
  DEPLOY_VERDICT_CONVERGING = 2;
  // At the declared shape and stable past the window.
  DEPLOY_VERDICT_CONVERGED = 3;
  // An owned field (the digest) does not match the declaration: drift.
  DEPLOY_VERDICT_DIVERGED = 4;
  // Not serving, whatever it matches.
  DEPLOY_VERDICT_DEGRADED = 5;
}

// DeployReconcilePolicy is what the platform may do about drift in an
// environment (forge's deploystate.Policy).
enum DeployReconcilePolicy {
  // On a request: leave the stored policy unchanged. Never returned.
  DEPLOY_RECONCILE_POLICY_UNSPECIFIED = 0;
  // Report drift, change nothing. The default.
  DEPLOY_RECONCILE_POLICY_OBSERVE = 1;
  // Re-publish the declared state when drift is found.
  DEPLOY_RECONCILE_POLICY_CONVERGE = 2;
  // Refuse every change, including a human's deploy.
  DEPLOY_RECONCILE_POLICY_PINNED = 3;
}

// DeployPromotionKind records an operator's INTENT. Both kinds are
// mechanically identical — a pointer move onto an existing digest — but a
// rollback must read as a rollback in the audit trail.
//
// Note that this enum appears only on RESPONSES. A client does not choose a
// kind; it calls Promote or Rollback, and the server records which.
enum DeployPromotionKind {
  DEPLOY_PROMOTION_KIND_UNSPECIFIED = 0;
  DEPLOY_PROMOTION_KIND_PROMOTE = 1;
  DEPLOY_PROMOTION_KIND_ROLLBACK = 2;
}

// DeployClusterProvider is an IRREVERSIBLE day-0 choice per vCluster:
// shared-vs-private nodes cannot change after creation, nor can worker node
// type after deploy. On the wire from day one even though PRIVATE is rejected
// at render until implemented — a discriminator retrofitted later cannot
// describe clusters already provisioned under the old assumption.
enum DeployClusterProvider {
  DEPLOY_CLUSTER_PROVIDER_UNSPECIFIED = 0;
  DEPLOY_CLUSTER_PROVIDER_VCLUSTER_SHARED = 1;
  DEPLOY_CLUSTER_PROVIDER_VCLUSTER_PRIVATE = 2;
}

// DeployClusterPhase is the vCluster lifecycle, kept deliberately small.
// Teardown is a deleted timestamp, not a fourth phase.
enum DeployClusterPhase {
  DEPLOY_CLUSTER_PHASE_UNSPECIFIED = 0;
  DEPLOY_CLUSTER_PHASE_PROVISIONING = 1;
  DEPLOY_CLUSTER_PHASE_READY = 2;
  DEPLOY_CLUSTER_PHASE_FAILED = 3;
}

// DeployResourceKind NAMES A METER. The unit is a property of the kind and is
// never a per-row field: a free-form unit is a rounding bug waiting for the
// day two rows of one kind disagree about what their quantities mean, and by
// then the invoices are already wrong. Mirrors the ck_cp_rub_kind CHECK on
// controlplane.resource_usage_buckets.
enum DeployResourceKind {
  DEPLOY_RESOURCE_KIND_UNSPECIFIED = 0;
  // milli-vCPU held for the tick.
  DEPLOY_RESOURCE_KIND_CPU_MILLI = 1;
  // MiB held for the tick.
  DEPLOY_RESOURCE_KIND_MEM_MIB = 2;
  // Always 1 — the per-cluster floor.
  DEPLOY_RESOURCE_KIND_VCLUSTER = 5;
  // Mebibytes, not GiB (see the migration's quantity comment).
  DEPLOY_RESOURCE_KIND_EGRESS_GIB = 6;
  DEPLOY_RESOURCE_KIND_CDN_EGRESS_GIB = 7;
  DEPLOY_RESOURCE_KIND_CDN_REQUESTS = 8;

  // GiB bound for the tick. ONE storage kind, not two.
  //
  // BALANCED (3) and SSD (4) were a pricing axis no customer could
  // select: nothing in CreateDeployment lets a tenant choose a storage
  // class. Two independently-counted kinds against the catalog's single
  // storage allowance also made the allowance unresolvable — funding
  // both from one figure funds it twice. If SSD becomes a premium
  // option later it is a PLAN attribute, not a second meter kind.
  DEPLOY_RESOURCE_KIND_STORAGE_GIB = 10;

  // 3/4 are tombstoned, not reused: a deployed client sending the old
  // balanced kind must never be read as some future kind.
  reserved 3, 4, 9;
  reserved "DEPLOY_RESOURCE_KIND_STORAGE_GIB_BALANCED", "DEPLOY_RESOURCE_KIND_STORAGE_GIB_SSD", "DEPLOY_RESOURCE_KIND_BUILD_MINUTES";
}

// DeployLogStream selects which of a deployment's log streams to read. Build
// output and runtime output are different questions with different lifetimes
// — a build log is finite and finished, a runtime log tails forever — so the
// caller says which it wants rather than receiving an interleaved merge it
// then has to separate.
enum DeployLogStream {
  DEPLOY_LOG_STREAM_UNSPECIFIED = 0;
  DEPLOY_LOG_STREAM_BUILD = 1;
  DEPLOY_LOG_STREAM_RUNTIME = 2;
}

// === Entities ===

// DeployTenant is an organization's deploy-product extension. THE IDENTITY IS
// THE ORGANIZATION: org_id is the primary key, a 1:1 extension rather than a
// competing identity, so every billing join is the identity join and no
// translation step sits between a deployment and the wallet that pays for it.
message DeployTenant {
  // The organization this tenant IS. Not a foreign key to a separate tenant
  // identity — there is no such thing.
  string org_id = 1;

  // The immutable DNS label this tenant's hostnames are composed from
  // (<app>-<slug>.reliantapps.dev). Immutable because it is baked into every
  // URL the tenant has published, and because organizations.slug is mutable
  // while this must not be. Settable once, at CreateTenant; there is no RPC
  // that changes it.
  //
  // A TLS wildcard matches exactly ONE label, so the tenant cannot be a second
  // label — `app.tenant.reliantapps.dev` is NOT covered by
  // `*.reliantapps.dev`. That is why the slug is spliced into the first label
  // rather than nested.
  string slug = 2;

  // READ-ONLY. Namespace prefix for this tenant's environments, allocated by
  // the platform. Stored rather than derived so a later change to the
  // derivation rule cannot re-point namespaces that already hold running
  // workloads.
  string namespace_prefix = 3;

  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// DeployTenantCluster is a provisioned vCluster — a real API server, for
// advanced users, carrying the billed control-plane floor.
//
// ONE PER TENANT, HOSTING N ENVIRONMENT NAMESPACES, is the default rather than
// a mode: because an environment REFERENCES a cluster instead of owning one, a
// tenant who needs per-environment API isolation provisions N of these and
// points one environment at each.
//
// Placement (which host cluster, which host namespace) is NOT here — see
// DeployTenantClusterInternal.
message DeployTenantCluster {
  string id = 1;
  string name = 2;
  DeployClusterProvider provider = 3;
  // READ-ONLY. Reported by the operator.
  DeployClusterPhase phase = 4;
  // READ-ONLY. Unset until the control plane answers. Until then the cluster
  // is DECLARED but not REAL, and the vcluster floor must not tick — so this
  // being unset is the machine-readable form of "do not bill this yet".
  google.protobuf.Timestamp ready_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// DeployEnvironment is a namespace-scoped deploy target: dev, staging, prod,
// or an ephemeral preview.
//
// THE NAMESPACE IS PER (TENANT, ENVIRONMENT). Not per-owner, which would put
// an unreviewed preview build in the same namespace, under the same
// intra-namespace allow rule, as the production database; and not
// per-workload, which would make an app reaching its own database
// cross-namespace traffic requiring exactly the tenant-authored NetworkPolicy
// the constrained-spec design exists to avoid.
message DeployEnvironment {
  string id = 1;
  // 'dev' | 'staging' | 'prod' | 'preview-pr-123'. Free-form: the platform
  // owns an environment's lifecycle, not a tenant's taxonomy.
  string name = 2;
  DeployEnvironmentKind kind = 3;

  // READ-ONLY. The Kubernetes namespace, allocated by the platform from the
  // tenant's namespace_prefix. A client that could name this could name
  // somebody else's.
  string namespace = 4;

  // The vCluster this environment's workloads run inside, or empty for the
  // static/backend/database tiers, which run on shared platform
  // infrastructure.
  string tenant_cluster_id = 5;

  // READ-ONLY and DERIVED: the id of this environment's latest promotion in
  // the append-only ledger. It is not a stored pointer (migration 00087
  // dropped that column); the server computes it on read, so it cannot
  // disagree with the ledger. Empty before the environment's first deploy.
  // Moved only by Promote / Rollback — never by UpdateEnvironment, which is
  // why it is not on DeployEnvironmentSpec.
  string current_promotion_id = 6;

  // Set exactly when kind is PREVIEW; the database refuses every other
  // combination. A TTL on prod is an outage with a timer on it.
  google.protobuf.Timestamp expires_at = 7;

  // What this preview was cut from (a PR number, a branch). Informational,
  // and the join key for posting a preview URL back onto a pull request.
  string source_ref = 8;

  // Idles CPU and memory after scale_to_zero_idle_seconds of inactivity. It
  // does NOT stop storage: a bound volume keeps billing at zero replicas, and
  // that asymmetry is what makes the feature trustworthy rather than a
  // billing trap.
  bool scale_to_zero_enabled = 9;
  // Meaningful only when scale_to_zero_enabled. Must be positive — a zero
  // timeout would idle a workload the instant it started.
  int32 scale_to_zero_idle_seconds = 10;

  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;

  // What the platform may do about drift here. Defaults to OBSERVE.
  DeployReconcilePolicy reconcile_policy = 13;

  // READ-ONLY and DERIVED: the registry path this org's images must live
  // under to be admitted by the platform registry boundary —
  // `<registry_base>/<org_id>`. It is computed by the same function the
  // publish-time check uses (ociregistry.TenantSubtree, which
  // ociregistry.Contains is expressed in), so the two cannot disagree.
  //
  // A client uses it to refuse, BEFORE writing anything, an image the
  // platform will not publish: push to `<image_push_base>/<name>`, re-cut
  // the release, re-promote.
  //
  // EMPTY MEANS THE PLATFORM ADMITS NO REGISTRY: this deployment has no
  // registry base configured, and PublishDeploymentConfig refuses every
  // backend image rather than admitting an unchecked one.
  string image_push_base = 14;
}

// DeployEnvironmentSpec is THE WRITABLE HALF of an environment — the whole of
// what a client may set, and nothing else.
//
// This message exists so the read-only fields above are not merely documented
// as read-only but are ABSENT from every request type. A client cannot assign
// a namespace, cannot move current_promotion_id, and cannot forge a
// created_at, because there is no field in which to put one. Compare the
// alternative, where CreateEnvironment accepts a full DeployEnvironment and
// the server remembers to ignore six fields: that is a policy, and policies
// are one careless merge away from not holding.
message DeployEnvironmentSpec {
  string name = 1;
  DeployEnvironmentKind kind = 2;
  // Optional. Empty means the shared platform infrastructure.
  string tenant_cluster_id = 3;
  // Required for a PREVIEW, forbidden for a PERSISTENT environment.
  google.protobuf.Timestamp expires_at = 4;
  string source_ref = 5;
  bool scale_to_zero_enabled = 6;
  int32 scale_to_zero_idle_seconds = 7;
  // UNSPECIFIED on a request leaves the stored policy unchanged; a new
  // environment then gets OBSERVE.
  DeployReconcilePolicy reconcile_policy = 8;
}

// DeployObservedStateDetail is the operator's CONFIRMATION — the readable
// mirror of reality, so the UI's drift badge and a bill reconciliation need no
// cluster round-trip.
//
// EVERY FIELD HERE IS READ-ONLY TO CLIENTS, and structurally so: this message
// appears on Deployment and on no request type anywhere in either service. A
// client that could write observed state could claim to be running something
// it is not, which is the one lie that would make both the drift badge and the
// bill wrong at the same time.
message DeployObservedStateDetail {
  DeployObservedState state = 1;
  int32 replicas = 2;
  // The digest ACTUALLY running. Diverges from desired image_digest during a
  // roll, and that divergence is what the drift badge reads.
  string image_digest = 3;
  // Unset until the operator has successfully applied this spec at least
  // once. Unset IS the machine-readable form of "declared, never applied" —
  // and such a deployment must cost nothing.
  google.protobuf.Timestamp reconciled_at = 4;
  // Last reconcile error, surfaced to the tenant. Cleared on success.
  string last_error = 5;
  // The public URL, once one exists. Platform-allocated and generated —
  // a word pair like wild-mongoose.reliantapps.dev, one label deep because a
  // TLS wildcard matches one label. It encodes nothing about the tenant or
  // the app, so it must not be parsed for meaning; it is stable for the life
  // of the deployment and survives a rename.
  string url = 6;
  // When the deployment most recently ENTERED a settled state (ready, or
  // suspended). Unset whenever it is in any other state. The verdict's
  // stability clock.
  google.protobuf.Timestamp stable_since = 7;
}

// Deployment is one deployable unit inside an environment.
//
// THE TWO HALVES ARE THE POINT. `spec` is what the tenant declared;
// `observed` is what the operator confirmed. Both are exposed because the UI's
// job is to show the difference — "you asked for 3 replicas, 2 are running" is
// a sentence only a client holding both halves can write. Anything that
// computes money from `desired` is a bug.
message Deployment {
  string id = 1;
  // Denormalized from the environment so every billing and quota query can
  // start "for this org" without a join on a hot path.
  string org_id = 2;
  string environment_id = 3;
  string name = 4;
  DeployTier tier = 5;

  // The hand-rolled DeployDesiredState (image_digest, replicas, cpu_milli,
  // memory_mib, storage_gib, config) is gone. The declared half is now `spec`
  // plus `run_state`; see below.
  reserved 6;
  reserved "desired";

  DeployObservedStateDetail observed = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  // THE DECLARED HALF: forge's tier spec, verbatim.
  //
  // This is the JSON of forge's `v1alpha1.<Tier>Spec` for this deployment's
  // tier (github.com/reliant-labs/forge/pkg/deploy/v1alpha1): SimpleBackendSpec
  // for BACKEND, StaticSiteSpec for STATIC, ManagedDatabaseSpec for DATABASE,
  // in forge's own camelCase json tags. There is deliberately NO proto mirror
  // of those types. One Go type defines the tier, forge's, and a second
  // schema here could only ever disagree with it. The same document is what
  // PublishDeploymentConfig writes as the forge.dev/v1alpha1 CR's spec.
  //
  // Resources are millicores and BYTES (forge's units), never MiB.
  google.protobuf.Struct spec = 11;

  // What the TENANT asked for: running or suspended. Outside the spec on
  // purpose. A suspend is an imperative act driven by Scale, not part of the
  // declaration a forge project checks in, so a redeploy of an unchanged
  // project must not resume a workload somebody suspended.
  DeployRunState run_state = 10;
}

// DeployArtifact is one image's resolved identity within a release.
// DeployArtifact is one artifact inside a release.
//
// A release ships more than container images, and the KIND is what lets a
// reader know how to verify a given entry. That is not a theoretical
// distinction: forge v0.1.12 tagged web-runtime/v0.3.1, never published it to
// npm, and nothing noticed until a scaffolded project failed to install —
// because the release model had no way to SAY "this release also contains an
// npm package, at this version, with this integrity hash". A model that cannot
// NAME an artifact cannot verify it, and an unverifiable artifact drifts
// silently.
//
// Two addressing shapes live here, discriminated by `kind`, because the things
// a release ships are not all content-addressed the same way:
//
//   - OCI images are addressed by DIGEST alone — the digest IS the name, so
//     `digest` carries it and version/integrity stay empty.
//   - Everything else (npm, Go modules, published files) is addressed by a
//     COORDINATE plus a hash: the version is how a consumer asks for it, and
//     the hash is how they know they got the right bytes.
message DeployArtifact {
  // The bare artifact name, matching forge's Artifacts map key. An image name
  // ("control-plane"), an npm package ("@scope/pkg"), or a module path.
  string name = 1;
  // Canonical sha256 digest, matching ^sha256:[a-f0-9]{64}$. OCI only —
  // EMPTY for every other kind, which is why the database's digest CHECK is
  // conditional on kind rather than unconditional.
  string digest = 2;
  // OS/arch the captured manifest advertises. Informational.
  repeated string platforms = 3;

  // One of "oci", "npm", "gomod", "file".
  //
  // EMPTY MEANS "oci", and that default is not a guess: before this field
  // existed a release could only hold images, so every artifact in a pre-kind
  // release IS one. Release rows are immutable and are never rewritten, so the
  // empty case is permanent rather than a migration someone forgot to finish.
  //
  // Deliberately a string, not an enum. forge documents the kind set as OPEN
  // so an older server does not refuse a release a newer forge legitimately
  // cut; an unrecognised kind fails CLOSED (it is not an image, so nothing
  // will deploy it) rather than failing open.
  string kind = 4;

  // How a consumer ASKS for this artifact: an npm version ("0.3.1"), a Go
  // module version ("v0.1.15"). Empty for OCI, where the digest is the name.
  string version = 5;
  // How a consumer KNOWS they got the right bytes, in the hash format native
  // to that ecosystem — npm's "sha512-…", a go.sum "h1:…", or "sha256:…" for
  // a published file. Carried verbatim rather than normalised: a verifier
  // compares it against what the registry reports, and re-encoding it would
  // break that comparison.
  string integrity = 6;
  // Where the artifact lives when name+version does not imply it: a download
  // URL for a file, or a non-default registry. Empty means the ecosystem's
  // default registry.
  string uri = 7;

  // How this artifact is addressed across environments, mirroring forge's
  // pkg/release.Mode: "shared" (one set of bytes everywhere), "variant" (one
  // build per variant, keyed by `variant`), or "source" (pinned source rather
  // than built bytes; see `source`). REQUIRED.
  //
  // NOTE ON `kind` ABOVE: the kind set is CLOSED — oci | npm | gomod | file |
  // git — and a server refuses anything outside it. The "open set" wording on
  // `kind` predates pkg/release and is superseded by this note.
  string mode = 8;
  // The variant this entry is the build for. "*" for shared and source
  // artifacts. There is exactly one DeployArtifact per (name, variant).
  string variant = 9;
  // The pinned source. Set iff mode = "source", empty otherwise.
  DeploySource source = 10;
}

// DeploySource pins an artifact to source rather than to built bytes: a
// repository, the ref that was asked for, the subdirectory within it, and the
// commit that ref resolved to when the release was cut. The commit is the
// identity; repo/ref/subdir are how a human reads it.
message DeploySource {
  string repo = 1;
  string ref = 2;
  string subdir = 3;
  string commit = 4;
}

// DeployRelease is a cut set of content-addressed digests under a version
// label. IMMUTABLE once written — the database enforces it with an append-only
// trigger, so there is no UpdateRelease RPC to write and none will be added.
// A correction is a new release.
message DeployRelease {
  string id = 1;
  // The human-readable label ("v1.4.0"), matching forge's Release.Version.
  // Unique within an org: two tenants both cutting "v1.0.0" is expected.
  string version = 2;

  // Source provenance, mirroring forge's ReleaseGit. Best-effort and
  // informational — what lets a reviewer tie a running digest back to a
  // commit, which is the first question asked during an incident.
  string git_commit = 3;
  string git_tag = 4;
  bool git_dirty = 5;

  repeated DeployArtifact artifacts = 6;

  string created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // No updated_at, and that absence is the point: a release is immutable, so
  // there is no update to stamp. A field implying otherwise would invite one.
}

// DeployGate is one check that had passed when a promotion was recorded.
message DeployGate {
  string name = 1;
  string status = 2;
  string url = 3;
}

// DeployPromotion is one entry in the append-only ledger: this environment ran
// this release, promoted by this actor, at this time, with these gates passed.
//
// WHY A LEDGER AND NOT JUST A POINTER. An environment does have a current
// pointer, but the pointer alone cannot answer the questions that matter after
// an incident: what was running at 03:00, who promoted it, what gates had
// passed, and what did we roll back FROM. Overwriting a pointer destroys
// exactly the evidence an incident needs.
message DeployPromotion {
  string id = 1;
  string environment_id = 2;
  string release_id = 3;
  // Intent, not mechanism — both kinds re-point. Set by the SERVER from which
  // RPC was called, never by the client.
  DeployPromotionKind kind = 4;

  // The environment this release was promoted FROM, or empty on a first
  // deploy. What makes the promotion PATH auditable rather than just its
  // endpoint: it answers "did this actually pass staging, or did someone
  // promote straight to prod?".
  string from_environment_id = 5;

  // The digests frozen AT PROMOTE TIME. Duplicates the release's artifacts
  // deliberately, and forge does the same for the same reason: freezing at
  // promote rather than at deploy time means a deploy cannot ship something
  // the promoter never approved.
  map<string, string> resolved_artifacts = 6;

  string promoted_by_user_id = 7;
  // Records automation ("ci", "preview-bot") when no human pressed the button.
  // Kept separate from the user id so "a robot did it" is a distinct readable
  // fact rather than an indistinguishable empty string.
  string promoted_by_actor = 8;

  // Evidence, NOT enforcement. This ledger records what happened; it cannot
  // police what should have. A gate that must BLOCK a promotion is checked by
  // the promoting service before this row is written, because a record here
  // could only ever verify that a claim was made, not that a test ran.
  repeated DeployGate gates = 9;

  // Free-form reason. Most valuable on a rollback, where "why" is the whole
  // story and is otherwise lost to chat history.
  string note = 10;

  google.protobuf.Timestamp created_at = 11;

  // The source pins frozen AT PROMOTE TIME, artifact name → pinned source —
  // resolved_artifacts' twin for mode = "source" artifacts, frozen for the
  // same reason: a deploy cannot ship a commit the promoter never approved.
  map<string, DeploySource> resolved_sources = 12;
  // The promoted release's version label ("v1.4.0"), so a ledger reader need
  // not resolve release_id to say what was promoted.
  string release_version = 13;
}

// DeployUsageRow is one metered quantity for one resource over one window —
// the shape the usage table and any per-dimension chart read.
//
// Post-hoc, never a reservation. Infrastructure metering reads the LIVE
// CLUSTER and writes what it found; a deployment that was declared and never
// applied appears in no candidate set and therefore in no row here.
message DeployUsageRow {
  DeployResourceKind resource_kind = 1;
  // Attribution dimensions. Any may be empty: a vcluster-floor row names no
  // deployment, and a row whose deployment has since been purged still
  // records what it cost.
  string environment_id = 2;
  string deployment_id = 3;
  string tenant_cluster_id = 4;

  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;

  // In the kind's canonical INTEGER unit. Integer throughout: a float rounded
  // at report time loses money silently at scale, and the direction of the
  // loss is never in our favour.
  int64 quantity = 7;
  // Human-readable unit for display only ("milli-vCPU-hour"). Never used for
  // arithmetic — the unit is a property of resource_kind, and treating this
  // string as authoritative is how two rows of one kind end up disagreeing.
  string unit_display = 8;

  // Cost in USD nanos, when pricing has been applied. Zero when the dimension
  // is priced at zero — egress deliberately is, until an enforcement test
  // exists that fails when a tenant namespace reconciles without its policy.
  int64 cost_usd_nanos = 9;
}

// DeployLogLine is one line of build or runtime output.
message DeployLogLine {
  // Monotonic within a stream. The RESUME CURSOR: a client that reconnects
  // passes the last sequence it saw and receives only what it missed, which
  // is what makes a dropped connection a gap of milliseconds rather than a
  // reload of the whole buffer.
  int64 sequence = 1;
  google.protobuf.Timestamp timestamp = 2;
  string message = 3;
  // "stdout" | "stderr".
  string channel = 4;
}

// === Internal (staff-only) entities ===
//
// The same split public Daemon / DaemonInternal already makes. Reachable only
// through DeployAdminService.

// DeployTenantClusterInternal carries the fleet PLACEMENT of a vCluster —
// which host cluster runs its control plane, and in which namespace.
// Deliberately excluded from the public DeployTenantCluster: host_cluster_id
// is a CLUSTER_CONFIGS key, and publishing one hands a tenant a map of our
// infrastructure they have no use for.
message DeployTenantClusterInternal {
  string tenant_cluster_id = 1;
  // Matches a CLUSTER_CONFIGS key, so the placement recorded here is the same
  // string the reconciler resolves a client from.
  string host_cluster_id = 2;
  // The namespace ON THE HOST cluster holding this vCluster's control plane.
  // Distinct from the tenant-facing workload namespaces.
  string host_namespace = 3;
}

// DeployEnvironmentInternal carries an environment's fleet placement.
message DeployEnvironmentInternal {
  string environment_id = 1;
  // Which host cluster this environment's workloads land on. The operator's
  // isolated-workload guard refuses to write tenant workloads to the
  // control-plane cluster; this is what it resolves.
  string host_cluster_id = 2;
}

// DeployDeploymentInternal carries reconcile diagnostics that are useful to
// staff debugging a stuck rollout and noise to a tenant.
message DeployDeploymentInternal {
  string deployment_id = 1;
  string host_cluster_id = 2;
  string namespace = 3;
  // The in-cluster object name the reconciler writes, for correlating with
  // kubectl output.
  string resource_name = 4;
  google.protobuf.Timestamp last_reconcile_attempt_at = 5;
  int32 consecutive_failures = 6;
}
