syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. See proto/controlplane/v1/README.md.

package controlplane.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/controlplane/v1;controlplanev1";

// RelativeWindow is a time window named relative to the server's clock at the
// moment it answers: [now - ends_ago - last, now - ends_ago). Shared by the
// time ranges of ObservabilityService, IssuesService, RumService,
// DeliveryInsightsService and ActivityService (each range's `relative`
// field). Declared here, not in a service proto, because this repo forbids
// service-to-service proto imports.
//
// A client that polls "the last hour" sends the same request every time, so
// a request-keyed client cache (React Query keys on the request) keeps one
// entry instead of one per resolution, and the window is resolved where the
// data is read, not in the browser. A read that pages echoes the absolute
// range it resolved (effective_time_range) so the next page can name the
// same one.
//
// Each RPC's own range cap applies to `last` exactly as to an absolute range.
message RelativeWindow {
  // The window's length. Required and positive; at most 366 days.
  google.protobuf.Duration last = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gt: {}
      lte: {seconds: 31622400}
    }
  ];
  // How long before now the window ends. Unset or zero: now. At most 366
  // days, for a "same window, one period earlier" comparison.
  google.protobuf.Duration ends_ago = 2 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 31622400}
  }];
}
