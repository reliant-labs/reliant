syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. See proto/controlplane/v1/README.md.

package controlplane.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/controlplane/v1;controlplanev1";

// Enums and entity messages shared by IdentityService (the console-facing API on admin-server) and
// IdentityInternalService (the identity reconciler's in-cluster API). Request and
// response messages live in each service proto; these are the parts both reuse.
//
// EVERY request is addressed by (org_id, environment_id). A Zitadel instance
// id never appears on this surface, in either direction: the reconciler maps
// the pair to the instance itself, and admin-server never learns which one.
//
// NOTHING HERE IS A SECRET except IdentityPasswordCode, which a caller gets
// only by asking for it (return_code). Status and user listings carry
// identifiers and states only; the one URL (an export download) is signed and
// short-lived.

// IdentityState is where an environment's identity instance stands in the
// reconciler's state machine.
enum IdentityState {
  IDENTITY_STATE_UNSPECIFIED = 0;
  IDENTITY_STATE_PENDING = 1;
  IDENTITY_STATE_CREATING = 2;
  IDENTITY_STATE_PROVISIONING = 3;
  IDENTITY_STATE_READY = 4;
  IDENTITY_STATE_DEGRADED = 5;
  IDENTITY_STATE_FAILING = 6;
  // The env stopped declaring identity: the instance waits out the grace
  // period (exportable) before it is deleted.
  IDENTITY_STATE_WITHDRAWN = 7;
  IDENTITY_STATE_GRACE = 8;
  IDENTITY_STATE_DELETING = 9;
  IDENTITY_STATE_DELETED = 10;
}

// IdentityNotEnabledReason is why an environment has no identity instance
// (GetIdentityStatus with has_instance false).
enum IdentityNotEnabledReason {
  IDENTITY_NOT_ENABLED_REASON_UNSPECIFIED = 0;
  // The environment's deployed KCL declares no forge.ManagedIdentity.
  IDENTITY_NOT_ENABLED_REASON_NOT_DECLARED = 1;
  // The environment declares one and the control plane refused it; the
  // response's refused field says why.
  IDENTITY_NOT_ENABLED_REASON_REFUSED = 2;
  // The environment declares one and the identity reconciler has not created
  // its instance yet; it does on its next sweep.
  IDENTITY_NOT_ENABLED_REASON_PENDING = 3;
  // The control plane holds no readable deployed shape for the environment
  // (it was never deployed, or its shape cannot be read), so whether it
  // declares one is unknown.
  IDENTITY_NOT_ENABLED_REASON_NO_SHAPE = 4;
}

// IdentityEnvironment names an environment of the caller's org: the owner of
// an identity instance, or one that shares it.
message IdentityEnvironment {
  string id = 1;
  // Empty when the environment is no longer live.
  string name = 2;
  // The environment's project; empty for a project-less environment.
  string project = 3;
}

// IdentityDeliveryState uses telemetrydelivery's vocabulary.
enum IdentityDeliveryState {
  IDENTITY_DELIVERY_STATE_UNSPECIFIED = 0;
  IDENTITY_DELIVERY_STATE_DELIVERED = 1;
  IDENTITY_DELIVERY_STATE_PENDING = 2;
  IDENTITY_DELIVERY_STATE_FAILING = 3;
  IDENTITY_DELIVERY_STATE_UNBOUND = 4;
  IDENTITY_DELIVERY_STATE_WITHDRAWN = 5;
  IDENTITY_DELIVERY_STATE_DISABLED = 6;
}

// IdentityMailDelivery is whether an environment's identity instance can send
// mail: invitations and password-reset links.
enum IdentityMailDelivery {
  IDENTITY_MAIL_DELIVERY_UNSPECIFIED = 0;
  // No mail is sent: the environment declares no smtp in its
  // forge.ManagedIdentity, and the platform provides no relay. InviteUser and
  // SendPasswordReset then refuse unless the caller asks for the code back
  // (return_code) and delivers it another way.
  IDENTITY_MAIL_DELIVERY_NONE = 1;
  // The environment's own SMTP server (forge.ManagedIdentity smtp).
  IDENTITY_MAIL_DELIVERY_SMTP = 2;
}

// IdentityPasswordCode is a one-time code that sets a user's password, handed
// back to an admin who asked for it (return_code) so they can deliver it
// themselves. It is a credential: it is never logged or audited.
message IdentityPasswordCode {
  string code = 1;
  // An estimate: the instance's default password-code lifetime (1h) from the
  // moment it was issued. Redeeming it later is refused.
  google.protobuf.Timestamp expires_at = 2;
  // The environment's own reset page with the code filled in, the link an
  // email would have carried. Empty when the environment's identity declares
  // no application login URI or domain to build it from.
  string reset_url = 3;
}

enum IdentityUserState {
  IDENTITY_USER_STATE_UNSPECIFIED = 0;
  // Invited: the account exists and has not set a credential yet.
  IDENTITY_USER_STATE_INVITED = 1;
  IDENTITY_USER_STATE_ACTIVE = 2;
  IDENTITY_USER_STATE_LOCKED = 3;
  IDENTITY_USER_STATE_DISABLED = 4;
}

// IdentityApp is one registered application. A client id is not a secret.
message IdentityApp {
  string name = 1;
  string client_id = 2;
  // When the app's current broker token expires and renewal is due. Unset for
  // apps without a broker.
  google.protobuf.Timestamp broker_expires_at = 3;
}

// IdentityDelivery is one destination the instance's outputs are delivered to.
message IdentityDelivery {
  string kind = 1;
  string cluster = 2;
  string namespace = 3;
  string name = 4;
  IdentityDeliveryState state = 5;
  string last_error = 6;
  google.protobuf.Timestamp last_verified_at = 7;
  // When the outputs were last WRITTEN to the destination (first delivery or
  // a change such as a rotated token). last_verified_at moves on every pass
  // that finds them current; this moves only when the content does.
  google.protobuf.Timestamp last_written_at = 8;
}

// IdentityRole is a role the environment's identity declares. A declared role
// (declared = true) has its members converged from the environment's KCL and is
// read-only here.
message IdentityRole {
  string key = 1;
  string display_name = 2;
  string group = 3;
  bool declared = 4;
}

message IdentityUser {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  IdentityUserState state = 4;
  // Project roles the user holds, declared and console-managed alike.
  repeated string roles = 5;
  google.protobuf.Timestamp created_at = 6;
  // The user's most recent successful sign-in check (a password, passkey or
  // external identity provider) as the instance recorded it. Unset for a user
  // who has never signed in.
  google.protobuf.Timestamp last_sign_in_at = 7;
}
