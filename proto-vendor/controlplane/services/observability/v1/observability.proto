syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/observability/v1;observabilityv1";

// === ObservabilityService ===
//
// The TENANT OBSERVABILITY QUERY SERVICE: what the Reliant console calls so a
// customer can see their logs, traces, metrics, profiles and dashboards
// (hosted-design P6; HOSTED_BRIEF owner decision 2).
//
// TYPED REQUESTS ONLY. No RPC accepts SQL. Free-text query syntax (SearchLogs)
// is parsed server-side into parameterized SQL over allowlisted OTel columns.
//
// ORG-SCOPED, AND THE ORG IS A REQUEST FIELD THAT IS NEVER TRUSTED. Every RPC
// carries scope.org_id; the handler verifies the caller is a member of that org
// (controlplane.org_memberships) before touching ClickHouse — a non-member gets
// PermissionDenied. Every query then runs as THAT org's own ClickHouse user
// (EXECUTE AS r_<org>), so the database, not this code, is the tenant boundary.
//
// BOUNDED. scope.time_range is required on every RPC and capped per RPC (see
// each RPC). Row limits and ClickHouse execution caps apply on top; a result cut
// short by a cap says so (`truncated`).
//
// ERRORS: InvalidArgument (bad range, bad query syntax — the message names the
// position), PermissionDenied (not a member), FailedPrecondition (the org's
// observability tenant is not set up yet), ResourceExhausted (a ClickHouse
// quota/limit was hit), DeadlineExceeded (query timeout).
service ObservabilityService {
  option (forge.v1.service) = {
    name: "ObservabilityService"
    version: "1.0.0"
    description: "Tenant observability queries over the org's ClickHouse"
  };

  // SearchLogs returns log records matching a severity filter, a service filter
  // and a query string (grammar on SearchLogsRequest.query), newest first by
  // default, with cursor pagination. Max range 7 days.
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListTraces returns one summary row per trace in the range (root span, total
  // duration, span and error counts, services touched) plus a RED summary of
  // the matched traces. Max range 7 days.
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetTrace returns every span of one trace, for the waterfall. Max range 7
  // days (the traces TTL).
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListMetrics returns the metric names the org has, with their type and unit,
  // so a metric picker has something to offer. Max range 30 days.
  rpc ListMetrics(ListMetricsRequest) returns (ListMetricsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // QueryMetric returns time series for one metric: an aggregation, optional
  // group-by attribute keys, and a step. Max range 30 days.
  rpc QueryMetric(QueryMetricRequest) returns (QueryMetricResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetServiceOverview returns per-service request rate, errors and
  // p50/p95/p99 latency over server spans: the default landing view. Max range
  // 7 days.
  rpc GetServiceOverview(GetServiceOverviewRequest) returns (GetServiceOverviewResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetFlamegraph returns a service's aggregated profile as speedscope JSON,
  // optionally narrowed to the samples of one trace. Max range 30 days
  // (30 days of aggregates; the raw per-sample tier, used for trace_id, keeps
  // 72 hours).
  rpc GetFlamegraph(GetFlamegraphRequest) returns (GetFlamegraphResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // QueryPanel runs ONE dashboard panel (the Panel message GetDashboards
  // returns, forge's obsdash panel spec) and returns its data: a time series
  // per series x group for line panels, a value per series for number panels,
  // rows for table panels. The panel's semantic fields (service.name,
  // span.attr.<k>, log.severity, metric.attr.<k>, ...) are compiled
  // server-side to parameterized SQL over the known OTel columns; an unknown
  // field, operator or aggregation is InvalidArgument. Search panels are not
  // run here (use SearchLogs / ListTraces). Same guardrails as every other RPC.
  // Max range 7 days for traces/logs panels, 30 days for metrics and sql
  // panels.
  //
  // A sql panel's statement runs as the org's own read-only ClickHouse user,
  // confined to the org's database, under the alert-rule guard and limits
  // (one SELECT; no writes, DDL, SETTINGS, FORMAT, system tables or outside
  // table functions; the alert-rule timeout; at most 10,000 rows, more is
  // ResourceExhausted). With
  // `explain`, nothing is run: the response carries the compiled statements.
  rpc QueryPanel(QueryPanelRequest) returns (QueryPanelResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListAttributeValues returns the values a filterable attribute takes in the
  // scope, most frequent first, optionally narrowed to a prefix: the console's
  // filter autocomplete. The key must be on the allowlist (see QueryScope);
  // filters on the same key are ignored so the list is not narrowed to the
  // current selection. Bounded (max 100 values, max range 7 days) and cached
  // for a minute.
  rpc ListAttributeValues(ListAttributeValuesRequest) returns (ListAttributeValuesResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListWorkloads returns, per environment, workload and container: image,
  // service.version, replicas observed, restarts in the window, the last
  // terminated reason (OOMKilled, ...), CPU and memory against requests and
  // limits, and the latest Kubernetes warning event. Node-derived telemetry
  // (kubeletstats + Kubernetes events), stamped with the tenant from namespace
  // labels by the node agent, never from payloads. Max range 7 days.
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetWorkload returns one workload's time series (CPU and memory against
  // limits and requests, restarts), its Kubernetes events timeline and its
  // image / service.version changes over time, per environment in scope. Max
  // range 7 days.
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetDashboards returns the dashboards for an environment in forge's
  // dashboard-spec shape (forge.dashboards/v1). In phase 1 the spec is
  // synthesized from the services seen in the org's data in scope.time_range;
  // a deployed environment's real spec replaces it once it reaches
  // control-plane. Max range 30 days.
  rpc GetDashboards(GetDashboardsRequest) returns (GetDashboardsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetObservabilityUsage returns the org's month-to-date observability usage
  // against its included allowance: billed bytes, projected overage, a
  // per-signal and per-service breakdown, and the quota state the gateway is
  // enforcing. It is a plain Postgres read of what the hourly meter wrote
  // (nothing here queries ClickHouse), so it works when the tenant is
  // unreachable. Membership-checked on org_id.
  rpc GetObservabilityUsage(GetObservabilityUsageRequest) returns (GetObservabilityUsageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
}

// === Shared ===

// TimeRange is a half-open range [start, end). Both ends are required and
// end must be after start; each RPC caps the length.
message TimeRange {
  google.protobuf.Timestamp start = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end = 2 [(buf.validate.field).required = true];
}

// QueryScope is what every request is scoped by (console v2, contract K1).
//
// Environment is a FILTER, not a place: the console queries an organization (or
// one project of it) and narrows by environment, service and any attribute.
//
//	org_id      verified against org membership on every call
//	project_id  the forge project (deploy_environments.project) whose
//	            environments are in scope; "" selects the project-less ones
//	env_ids     environments in scope; every id is validated as a live
//	            environment of org_id (and of project_id when both are set),
//	            otherwise PermissionDenied. Empty = every environment of the org
//	            (of the project, when project_id is set)
//	services    service.name values (the workload name for infra telemetry)
//	filters     attribute predicates, ANDed; keys from the allowlist below
//
// ATTRIBUTE KEYS (filters[].key, every group_by[] and ListAttributeValues.key).
// Everything is parameterized, never SQL text, and a key outside this list is
// InvalidArgument:
//
//	resource   service.name, service.version, service.namespace,
//	           service.instance.id, reliant.env.id, reliant.deployment.id,
//	           deployment.environment.name (resolved to the Reliant environment
//	           name server-side, falling back to the emitted attribute),
//	           k8s.namespace.name, k8s.node.name, k8s.pod.name, k8s.pod.uid,
//	           k8s.workload.name, k8s.container.name, container.image.name,
//	           container.image.tag
//	traces     status (ok|error|unset), rpc.method, rpc.service, rpc.system,
//	           http.request.method, http.method, http.route,
//	           http.response.status_code, http.status_code, server.address,
//	           db.system, db.operation.name, db.operation, messaging.system,
//	           messaging.destination.name, error.type, peer.service
//	logs       k8s.event.reason, k8s.event.type, k8s.event.count,
//	           k8s.object.kind, k8s.object.name
//	metrics    k8s.container.last_terminated_reason, plus the DECLARED
//	           attributes of the metric being queried (the keys its own data
//	           points carry, e.g. "status" on orders_created)
//
// Resource keys read the resource only (so a client-supplied data-point
// attribute can never spoof identity); the rest read the signal's own
// attributes first, then the resource's.
message QueryScope {
  reserved 2;
  reserved "env_id";
  // The org whose data is read. The caller MUST be a member; this is verified
  // server-side, never assumed.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Narrow to these services (service.name). Empty = every service.
  repeated string services = 3 [(buf.validate.field).repeated.max_items = 50];
  TimeRange time_range = 4 [(buf.validate.field).required = true];
  // The forge project whose environments are in scope. Unset = not narrowed by
  // project; set to "" = the project-less environments.
  optional string project_id = 5 [(buf.validate.field).string.max_len = 128];
  // Control-plane environment ids (deploy_environments.id, the value stamped as
  // reliant.env.id). Empty = all of the caller's environments in the org.
  repeated string env_ids = 6 [(buf.validate.field).repeated.max_items = 50];
  // Generic attribute predicates, ANDed with each other and with everything else.
  repeated AttributeFilter filters = 7 [(buf.validate.field).repeated.max_items = 20];
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0; // newest first
  SORT_ORDER_NEWEST_FIRST = 1;
  SORT_ORDER_OLDEST_FIRST = 2;
}

// AttributeFilter is a structured attribute predicate over an allowlisted key
// (see QueryScope).
message AttributeFilter {
  // Allowlisted attribute key, e.g. "k8s.workload.name" or "http.route".
  string key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  AttributeOp op = 2;
  // eq, neq, contains (case-insensitive substring). Ignored by in and exists.
  string value = 3 [(buf.validate.field).string.max_len = 1024];
  // in: the candidate values (max 50).
  repeated string values = 4 [(buf.validate.field).repeated.max_items = 50];
}

enum AttributeOp {
  ATTRIBUTE_OP_UNSPECIFIED = 0; // eq
  ATTRIBUTE_OP_EQ = 1;
  ATTRIBUTE_OP_NEQ = 2;
  ATTRIBUTE_OP_EXISTS = 3; // value ignored
  ATTRIBUTE_OP_IN = 4; // uses values
  ATTRIBUTE_OP_CONTAINS = 5; // case-insensitive substring of value
}

message TimePoint {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}

// === Logs ===

message SearchLogsRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Query string. Whitespace-separated terms are ANDed; "OR" and "NOT"/"-",
  // parentheses and quoting are supported:
  //
  //   timeout                       body contains "timeout" (case-insensitive substring)
  //   "connection refused"          body contains the phrase
  //   severity:error                severity equals (case-insensitive); also
  //                                 severity:>=warn
  //   service:api                   service.name equals; service:api*  prefix
  //   trace_id:<hex>  span_id:<hex> exact
  //   attr.http.status:500          log attribute equals (attr.<key>:<value>)
  //   res.k8s.pod.name:web-1        resource attribute equals
  //   attr.user.id:*                attribute exists
  //   -severity:debug  NOT timeout  negation
  //   a OR b, (a OR b) c            alternation, grouping
  //
  // Bad syntax is InvalidArgument naming the position. Max 1024 characters.
  string query = 2 [(buf.validate.field).string.max_len = 1024];
  // Quick severity filter ANDed with `query` (e.g. ["ERROR","WARN"]).
  repeated string severities = 3 [(buf.validate.field).repeated.max_items = 10];
  SortOrder order = 4;
  // Rows per page. Default 100, max 1000.
  int32 page_size = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1000
  ];
  // Opaque cursor from a previous response's next_page_token. Valid only with
  // the same scope/query/order.
  string page_token = 6;
}

message SearchLogsResponse {
  repeated LogRecord logs = 1;
  // Empty when there are no more rows.
  string next_page_token = 2;
}

message LogRecord {
  google.protobuf.Timestamp timestamp = 1;
  string severity_text = 2;
  int32 severity_number = 3;
  string service = 4;
  string body = 5;
  string trace_id = 6;
  string span_id = 7;
  map<string, string> attributes = 8;
  map<string, string> resource_attributes = 9;
  string env_id = 10;
  // reliant.source: "daemon" / "platform" rows exist only in tenant zero
  // (Reliant's own org); empty for customer data.
  string source = 11;
  // True when source marks Reliant operator data (daemon/platform).
  bool operator_data = 12;
}

// === Traces ===

message ListTracesRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Only traces with at least one error span.
  optional bool errors_only = 2;
  // Only traces at least this long (ms).
  optional double min_duration_ms = 3;
  // Substring of the root span name.
  optional string root_span_name = 4 [(buf.validate.field).string.max_len = 256];
  reserved 5;
  reserved "span_attributes";
  // Rows per page. Default 50, max 500.
  int32 page_size = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
  string page_token = 7;
  // Also return the RED summary split by these allowlisted keys (max 3), valued
  // at each trace's root span, e.g. ["reliant.env.id"] for one summary per
  // environment. scope.filters on span-level keys keep a trace when ANY of its
  // spans matches; on resource keys they select the spans counted.
  repeated string group_by = 8 [(buf.validate.field).repeated.max_items = 3];
}

message ListTracesResponse {
  // Newest first.
  repeated TraceSummary traces = 1;
  string next_page_token = 2;
  // RED summary of the matched traces in the range (not just this page).
  TraceRedSummary red = 3;
  // One RED summary per distinct group (request.group_by), busiest first, at
  // most 50. Empty without group_by.
  repeated TraceRedGroup red_groups = 4;
}

message TraceRedGroup {
  // group_by key -> value.
  map<string, string> group = 1;
  TraceRedSummary red = 2;
}

message TraceSummary {
  string trace_id = 1;
  google.protobuf.Timestamp start_time = 2;
  double duration_ms = 3;
  string root_service = 4;
  string root_span_name = 5;
  int32 span_count = 6;
  int32 error_count = 7;
  repeated string services = 8;
  string source = 9;
  bool operator_data = 10;
  // Duration of the root span alone (duration_ms spans the whole trace).
  double root_duration_ms = 11;
}

// TraceRedSummary: Rate, Errors, Duration over the matched traces.
message TraceRedSummary {
  int64 trace_count = 1;
  int64 error_trace_count = 2;
  double rate_per_second = 3;
  double error_rate = 4; // fraction of traces, 0..1
  double p50_ms = 5;
  double p95_ms = 6;
  double p99_ms = 7;
}

message GetTraceRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // 32 lowercase hex characters.
  string trace_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
}

message GetTraceResponse {
  string trace_id = 1;
  // Ordered by start time.
  repeated Span spans = 2;
  // True when the trace has more spans than the per-trace cap (10000).
  bool truncated = 3;
}

message Span {
  string span_id = 1;
  string parent_span_id = 2;
  string name = 3;
  string kind = 4;
  string service = 5;
  google.protobuf.Timestamp start_time = 6;
  int64 duration_ns = 7;
  string status_code = 8;
  string status_message = 9;
  map<string, string> attributes = 10;
  map<string, string> resource_attributes = 11;
  repeated SpanEvent events = 12;
  repeated SpanLink links = 13;
  string source = 14;
  bool operator_data = 15;
}

message SpanEvent {
  google.protobuf.Timestamp time = 1;
  string name = 2;
  map<string, string> attributes = 3;
}

message SpanLink {
  string trace_id = 1;
  string span_id = 2;
}

// === Metrics ===

enum MetricType {
  METRIC_TYPE_UNSPECIFIED = 0;
  METRIC_TYPE_GAUGE = 1;
  METRIC_TYPE_SUM = 2; // counters and up-down counters
  METRIC_TYPE_HISTOGRAM = 3;
}

enum MetricAggregation {
  METRIC_AGGREGATION_UNSPECIFIED = 0; // default per type: AVG gauge, RATE sum, AVG histogram
  METRIC_AGGREGATION_AVG = 1;
  METRIC_AGGREGATION_SUM = 2;
  METRIC_AGGREGATION_MIN = 3;
  METRIC_AGGREGATION_MAX = 4;
  METRIC_AGGREGATION_COUNT = 5; // data points (gauge), observations (histogram)
  METRIC_AGGREGATION_INCREASE = 6; // sum/histogram: growth within each step
  METRIC_AGGREGATION_RATE = 7; // INCREASE per second
  METRIC_AGGREGATION_P50 = 8; // histogram only
  METRIC_AGGREGATION_P95 = 9; // histogram only
  METRIC_AGGREGATION_P99 = 10; // histogram only
}

message ListMetricsRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Substring of the metric name.
  optional string name_contains = 2 [(buf.validate.field).string.max_len = 128];
  // Max 500 (default 200).
  int32 limit = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
}

message ListMetricsResponse {
  repeated MetricInfo metrics = 1;
  bool truncated = 2;
}

message MetricInfo {
  string name = 1;
  MetricType type = 2;
  string unit = 3;
  string description = 4;
}

message QueryMetricRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  string metric_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Unset: looked up from the org's data.
  MetricType metric_type = 3;
  // Gauge and sum: each series is first reduced to its last value in the
  // bucket, then AVG/SUM/MIN/MAX are taken across series (so SUM of a memory
  // gauge over pods is the total); COUNT is the number of data points.
  // INCREASE/RATE (sum, histogram) use per-series deltas and handle both
  // cumulative and delta temporality, treating a decrease as a counter reset.
  MetricAggregation aggregation = 4;
  // Allowlisted keys to split series by (see QueryScope; for a metric, its
  // declared data-point attributes are allowed too). "reliant.env.id" or
  // "deployment.environment.name" compares environments, "k8s.container.name" a
  // container. Max 3.
  repeated string group_by = 5 [(buf.validate.field).repeated.max_items = 3];
  reserved 6;
  reserved "filters";
  // Bucket width. 0 = chosen from the range (about 120 points). The server
  // raises it so a series never exceeds 1500 points; step_seconds in the
  // response is the width used.
  int32 step_seconds = 7 [(buf.validate.field).int32.gte = 0];
}

message QueryMetricResponse {
  repeated MetricSeries series = 1;
  int32 step_seconds = 2;
  MetricType metric_type = 3;
  string unit = 4;
  // The aggregation used (the default per type when the request left it
  // unspecified).
  MetricAggregation aggregation = 6;
  // True when more than 50 series matched; the largest 50 are returned.
  bool series_truncated = 5;
}

message MetricSeries {
  // group_by key -> value for this series. Empty without group_by.
  map<string, string> labels = 1;
  repeated TimePoint points = 2;
}

// === Service overview ===

message GetServiceOverviewRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Split each service by these allowlisted keys (max 3): one ServiceOverview
  // per (service, group). error_log_count is only filled when every key also
  // applies to logs (resource keys do; span-level keys such as rpc.method do
  // not, and it is 0 then).
  repeated string group_by = 2 [(buf.validate.field).repeated.max_items = 3];
}

message GetServiceOverviewResponse {
  // Busiest first. A service appears if it emitted server spans or logs in
  // the range (request figures are zero when it has no server spans).
  repeated ServiceOverview services = 1;
  // Width of one trend bucket.
  int32 trend_step_seconds = 2;
}

message ServiceOverview {
  string service = 1;
  int64 request_count = 2;
  double rate_per_second = 3;
  int64 error_count = 4;
  double error_rate = 5; // fraction, 0..1
  double p50_ms = 6;
  double p95_ms = 7;
  double p99_ms = 8;
  // Error-level log records in the range.
  int64 error_log_count = 9;
  // Requests per trend bucket / errors per trend bucket (same timestamps).
  repeated TimePoint request_trend = 10;
  repeated TimePoint error_trend = 11;
  string source = 12;
  bool operator_data = 13;
  // group_by key -> value for this row. Empty without group_by.
  map<string, string> group = 14;
}

// === Profiles ===

message GetFlamegraphRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Exactly one service (scope.services is ignored here). The scope's
  // environment, project and filters are not applied either: profile aggregates
  // are keyed by the forge environment NAME, not the Reliant environment id.
  // (Membership of scope.org_id is still checked, and so are env_ids.)
  string service = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // cpu, alloc_space, inuse_space, goroutine, ...
  string profile_type = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Narrow to the samples whose goroutine served this trace (raw tier, 72h).
  string trace_id = 4 [(buf.validate.field).string.max_len = 64];
}

message GetFlamegraphResponse {
  // speedscope file-format JSON ("sampled" profile), loadable directly in
  // speedscope / an embedded speedscope view.
  string speedscope_json = 1;
  int64 total_value = 2;
  string unit = 3;
  int32 stack_count = 4;
  // Profile types the service has in the range, for the type picker.
  repeated string available_profile_types = 5;
  // True when the stack list was cut at the cap (the heaviest stacks are kept).
  bool truncated = 6;
}

// === Attribute values (filter autocomplete) ===

enum Signal {
  SIGNAL_UNSPECIFIED = 0; // resource keys: traces, logs and metrics together
  SIGNAL_TRACES = 1;
  SIGNAL_LOGS = 2;
  SIGNAL_METRICS = 3;
}

message ListAttributeValuesRequest {
  // Max range 7 days.
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // Allowlisted key (see QueryScope). Trace-only keys read traces, event keys
  // read logs; a metric's declared attribute needs metric_name.
  string key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Case-insensitive prefix of the value. Unset = the most frequent values.
  optional string prefix = 3 [(buf.validate.field).string.max_len = 128];
  // Where to read. Unset: the key's natural signal (traces for span keys,
  // logs for event keys, traces and metrics for resource keys).
  optional Signal signal = 4;
  // Required for a metric's declared attribute (signal METRICS).
  optional string metric_name = 5 [(buf.validate.field).string.max_len = 256];
  // Default 50, max 100.
  int32 limit = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
}

message ListAttributeValuesResponse {
  // Most frequent first.
  repeated AttributeValue values = 1;
  // True when more values matched than limit.
  bool truncated = 2;
}

message AttributeValue {
  string value = 1;
  int64 count = 2;
}

// === Workloads (infra for customers; console v2 owner decision 4, contract K2) ===
//
// Built from the node agent's telemetry: kubeletstats metrics
// (container.cpu.usage, container.memory.working_set,
// k8s.container.{cpu,memory}_{limit,request}_utilization), k8s.container.restarts
// and Kubernetes events (logs carrying k8s.event.*). Attribute names are K2's:
// reliant.env.id, k8s.namespace.name, k8s.pod.name, k8s.pod.uid,
// k8s.container.name, k8s.workload.name, container.image.name,
// container.image.tag, service.name = the workload name,
// k8s.container.last_terminated_reason. Replica-level figures report the WORST
// replica: "latest" is the highest per-pod latest value, p95 is over every
// sample of every replica in the window.

message ListWorkloadsRequest {
  // Max range 7 days. env_ids / project_id / services (= workload names) /
  // filters narrow the list.
  QueryScope scope = 1 [(buf.validate.field).required = true];
}

message ListWorkloadsResponse {
  // By environment, then workload name.
  repeated Workload workloads = 1;
  // True when more than 500 workloads matched.
  bool truncated = 2;
}

message Workload {
  // reliant.env.id, and the environment's name when it is known.
  string env_id = 1;
  string env_name = 2;
  // k8s.workload.name (also the service.name of its telemetry).
  string workload = 3;
  string namespace = 4;
  // The latest service.version the workload's own telemetry reported in the
  // window; empty when it reports none.
  string service_version = 5;
  // Distinct pods reporting in the last 5 minutes of the window.
  int32 replicas_observed = 6;
  // Restarts across the containers in the window.
  int64 restarts_in_window = 7;
  repeated WorkloadContainer containers = 8;
  // The most recent Kubernetes event of type Warning in the window.
  WorkloadEvent latest_warning = 9;
}

message WorkloadContainer {
  string container = 1;
  // container.image.name / container.image.tag, latest in the window.
  string image_name = 2;
  string image_tag = 3;
  int64 restarts_in_window = 4;
  // k8s.container.last_terminated_reason (OOMKilled, Error, Completed, ...).
  string last_terminated_reason = 5;
  // When the restart that produced the reason was first observed. Unset when
  // the reason is known but no restart happened inside the window.
  google.protobuf.Timestamp last_terminated_at = 6;
  ResourceUsage cpu = 7; // cores
  ResourceUsage memory = 8; // working set, bytes
}

// ResourceUsage is a container's usage against its requests and limits. The
// utilization fields are ratios (1.0 = exactly at the limit / request) and are
// unset when the container has no limit / request or the agent does not report
// the ratio.
message ResourceUsage {
  // Absolute usage: highest per-pod latest, and p95 over the window.
  double latest = 1;
  double p95 = 2;
  optional double limit_utilization_latest = 3;
  optional double limit_utilization_p95 = 4;
  optional double request_utilization_latest = 5;
  optional double request_utilization_p95 = 6;
  // Derived from usage / utilization at the latest sample: the configured limit
  // and request in the same unit as `latest`. Unset when not derivable.
  optional double limit = 7;
  optional double request = 8;
}

message WorkloadEvent {
  google.protobuf.Timestamp time = 1;
  string env_id = 2;
  // k8s.event.type: Normal | Warning.
  string type = 3;
  // k8s.event.reason: BackOff, FailedPull, Evicted, OOMKilling, ...
  string reason = 4;
  string message = 5;
  // k8s.event.count.
  int64 count = 6;
  // k8s.object.kind / k8s.object.name.
  string object_kind = 7;
  string object_name = 8;
  string container = 9;
}

message GetWorkloadRequest {
  // Max range 7 days. Every environment in scope is returned separately.
  QueryScope scope = 1 [(buf.validate.field).required = true];
  // k8s.workload.name.
  string workload = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Narrow to one container. Empty = every container.
  string container = 3 [(buf.validate.field).string.max_len = 256];
  // Bucket width. 0 = chosen from the range (see QueryMetricRequest).
  int32 step_seconds = 4 [(buf.validate.field).int32.gte = 0];
}

message GetWorkloadResponse {
  // One series per (environment, container, metric).
  repeated WorkloadSeries series = 1;
  // Newest first, at most 500.
  repeated WorkloadEvent events = 2;
  // Distinct images a container ran, in order of first sight.
  repeated ImageChange image_changes = 3;
  // Distinct service.version values the workload reported, in order of first sight.
  repeated VersionChange version_changes = 4;
  int32 step_seconds = 5;
  // True when a cap (200 series, 500 events, 200 changes) cut the result.
  bool truncated = 6;
}

enum WorkloadMetric {
  WORKLOAD_METRIC_UNSPECIFIED = 0;
  WORKLOAD_METRIC_CPU_USAGE = 1; // cores, container.cpu.usage
  WORKLOAD_METRIC_CPU_LIMIT_UTILIZATION = 2; // ratio, k8s.container.cpu_limit_utilization
  WORKLOAD_METRIC_CPU_REQUEST_UTILIZATION = 3; // ratio, k8s.container.cpu_request_utilization
  WORKLOAD_METRIC_MEMORY_WORKING_SET = 4; // bytes, container.memory.working_set
  WORKLOAD_METRIC_MEMORY_LIMIT_UTILIZATION = 5; // ratio, k8s.container.memory_limit_utilization
  WORKLOAD_METRIC_MEMORY_REQUEST_UTILIZATION = 6; // ratio, k8s.container.memory_request_utilization
  WORKLOAD_METRIC_RESTARTS = 7; // restarts per bucket, from k8s.container.restarts
}

message WorkloadSeries {
  string env_id = 1;
  string container = 2;
  WorkloadMetric metric = 3;
  string unit = 4;
  // Utilization and usage: the worst replica per bucket. Restarts: the sum over
  // replicas of the growth within the bucket.
  repeated TimePoint points = 5;
}

message ImageChange {
  string env_id = 1;
  string container = 2;
  string image_name = 3;
  string image_tag = 4;
  google.protobuf.Timestamp first_seen = 5;
  google.protobuf.Timestamp last_seen = 6;
}

message VersionChange {
  string env_id = 1;
  string service_version = 2;
  google.protobuf.Timestamp first_seen = 3;
  google.protobuf.Timestamp last_seen = 4;
}

// === Dashboards (mirror of forge internal/obsdash Spec, forge.dashboards/v1) ===
//
// Enum-like fields are plain strings with forge's values so the JSON of
// deploy/observability/spec/*_gen.json (one file per service) unmarshal into these messages
// as-is (protojson, camelCase names).

message QueryPanelRequest {
  // The scope's environments, services and filters apply as the dashboard's
  // filters.
  QueryScope scope = 1 [(buf.validate.field).required = true];
  Panel panel = 2 [(buf.validate.field).required = true];
  // Extra predicates ANDed to every series of the panel (the dashboard's other
  // filter dropdowns, e.g. deployment.environment.name). Same vocabulary as
  // Panel.where.
  repeated PanelPredicate filters = 3 [(buf.validate.field).repeated.max_items = 10];
  // Bucket width for line panels. 0 = chosen from the range; raised so a series
  // never exceeds 1500 points (step_seconds in the response is what was used).
  int32 step_seconds = 4 [(buf.validate.field).int32.gte = 0];
  // When non-empty, REPLACES panel.group_by (max 3): the in-place "group by"
  // control. Accepts the allowlisted keys of QueryScope as well as the panel
  // field vocabulary. PanelSeriesResult.group is keyed by what was asked for.
  repeated string group_by = 5 [(buf.validate.field).repeated.max_items = 3];
  // Compile the panel without running it: the response carries compiled_sql
  // and no data. The panel is still validated and the scope still checked.
  // A metrics panel looks up each series' metric to choose its statement.
  bool explain = 6;
}

// One statement a panel compiles to, as ClickHouse receives it: the SQL with
// {name:Type} parameter placeholders, and the parameter values.
message CompiledStatement {
  string sql = 1;
  // Parameter name -> value, as sent to ClickHouse.
  map<string, string> params = 2;
}

// One cell of a heatmap panel: the events whose value fell in [low, high)
// within the bucket that starts at `time` (step_seconds wide).
message HeatmapCell {
  google.protobuf.Timestamp time = 1;
  double low = 2;
  double high = 3;
  double count = 4;
}

// One result column of a sql panel, in result order.
message SqlColumn {
  string name = 1;
  // The ClickHouse type, e.g. "UInt64", "DateTime64(9)", "LowCardinality(String)".
  string type = 2;
  // A number: drawn as a value (a series point or a table cell).
  bool numeric = 3;
  // A date or time: as the first column, it makes the result a time series.
  bool time = 4;
}

message QueryPanelResponse {
  string panel_id = 1;
  // Echo of panel.kind: "line", "number", "table", "bar", "heatmap", "sql",
  // "funnel", "issues" or "sessions".
  string kind = 2;
  string unit = 3;
  // line panels: one entry per (series x group); a ratio panel yields one
  // entry per group labelled "ratio", a formula panel one labelled "formula".
  // number panels: one entry per series (or one "ratio" / "formula" entry)
  // with `value` set over the whole range (metrics panels: the most recent
  // bucket's value); an ungrouped number panel also fills `points`, a short
  // series over the range for a sparkline (step_seconds wide).
  // sql panels whose first column is a time: one entry per (numeric column x
  // group of the string columns), with points.
  repeated PanelSeriesResult series = 4;
  // table and bar panels: the columns after the group-by columns, in series
  // order, heaviest group first (bar: at most panel.limit, default 10).
  // sql panels that are not a time series: the numeric columns; each row's
  // group holds the other columns by name.
  repeated string columns = 5;
  repeated PanelTableRow rows = 6;
  int32 step_seconds = 7;
  // True when a cap cut the result (50 series, 200 table rows, 50 issues or
  // sessions, the heatmap cell cap). A sql panel is never cut: a result over
  // 10,000 rows is ResourceExhausted.
  bool truncated = 8;
  // funnel panels: one entry per step, in the funnel's order. Each count is the
  // number of sessions (or users) that reached that step and every step before
  // it, within the window.
  repeated FunnelStepResult funnel_steps = 9;
  // issues panels: errors grouped by distinct stack, most events first.
  repeated PanelIssue issues = 10;
  // sessions panels: browser sessions that started in the range, newest first.
  repeated PanelSession sessions = 11;
  // With QueryPanelRequest.explain: what the panel compiles to, one entry per
  // statement (a metrics panel runs one per series). Empty otherwise, and for
  // the console kinds (funnel, issues, sessions), whose statements are the
  // control plane's own.
  repeated CompiledStatement compiled_sql = 12;
  // heatmap panels: the non-empty cells, by time then value.
  repeated HeatmapCell heatmap = 13;
  // sql panels: the result's columns.
  repeated SqlColumn sql_columns = 14;
}

message FunnelStepResult {
  // The product event name this step matches.
  string event = 1;
  int64 count = 2;
  // count / the first step's count; 0 when the first step is 0.
  double rate_from_first = 3;
  // count / the previous step's count; 0 when the previous step is 0. The first
  // step reports 1 when it has any entrant.
  double rate_from_previous = 4;
}

// One error issue of an issues panel. Today an issue is one distinct stack of
// one service (error_hourly's RawStackHash); the same bug in two builds is two
// entries until the enrichment worker fingerprints stacks across builds.
message PanelIssue {
  string service_name = 1;
  // error_events.RawStackHash (a UInt64) in decimal; a string so a JavaScript
  // client cannot round it.
  string stack_hash = 2;
  // exception.type of the most recent event, e.g. "TypeError".
  string exception_type = 3;
  // The most recent event's message with volatile parts masked (urls, uuids,
  // quoted strings, hex runs, integers), which is what groups the events.
  string message = 4;
  // Route of the most recent event: location.href without origin, query or
  // fragment.
  string url_path = 5;
  // service.version (the build) of the most recent event.
  string service_version = 6;
  // Events and distinct sessions in the range, at hour granularity.
  int64 events = 7;
  int64 sessions = 8;
  // Earliest and latest event of this stack within the range.
  google.protobuf.Timestamp first_seen = 9;
  google.protobuf.Timestamp last_seen = 10;
  // The most recent event's trace and session, for "open trace" and "watch
  // replay" links.
  string sample_trace_id = 11;
  string sample_session_id = 12;
}

// One browser session of a sessions panel.
message PanelSession {
  string session_id = 1;
  string service_name = 2;
  string service_version = 3;
  string env_id = 4;
  // The signed-in user (the SDK's userId global attribute); empty when anonymous.
  string user_id = 5;
  // Route of the session's first page view, without origin, query or fragment.
  string entry_path = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  int64 page_views = 9;
  int64 interactions = 10;
  int64 errors = 11;
  // True when the session's replay was recorded (and has not expired).
  bool has_replay = 12;
}

message PanelSeriesResult {
  string label = 1;
  // panel.group_by field -> value for this entry. Empty without group_by.
  map<string, string> group = 2;
  repeated TimePoint points = 3;
  double value = 4;
}

message PanelTableRow {
  map<string, string> group = 1;
  // One per entry of QueryPanelResponse.columns.
  repeated double values = 2;
}

message GetDashboardsRequest {
  QueryScope scope = 1 [(buf.validate.field).required = true];
}

message GetDashboardsResponse {
  DashboardSpec spec = 1;
  // "release": the dashboards the environments in scope are running, carried by
  // their current release (forge's generated set plus any the project owns).
  // With several environments in scope, a dashboard present in more than one
  // release is served as defined by the most recently promoted of them.
  // "synthesized": built from the services seen in the data. Served when no
  // environment in scope has a recorded set: its current release's bundle was
  // never recorded (a failed registry push, a self-managed environment), or
  // predates dashboards in the bundle, or nothing has been promoted into it.
  string source = 2;
}

message DashboardSpec {
  string version = 1;
  string project = 2;
  repeated Dashboard dashboards = 3;
  repeated SavedSearch saved_searches = 4;
  // Always empty: forge stopped writing alerts into the dashboard spec (they are
  // forge.AlertRule defaults now). Kept because removing a field is a wire break.
  repeated DashboardAlert alerts = 5;
}

message Dashboard {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated DashboardFilter filters = 4;
  repeated Panel panels = 5;
  // Marker series drawn over every line panel. Empty when the dashboard declares
  // none.
  repeated DashboardAnnotation annotations = 6;
  // Who authored it, when it came from a release (GetDashboardsResponse.source
  // "release"): "gen" for a dashboard forge generated, "user" for one the project
  // owns (deploy/observability/dashboards/<name>.json, which replaces a generated
  // one of the same name). Empty for a synthesized dashboard. Set by the server
  // from the recorded row, never read from the dashboard's own JSON.
  string source = 7;
}

message DashboardFilter {
  string id = 1;
  string label = 2;
  string field = 3;
  // traces | metrics | logs: the telemetry the dropdown reads its values from.
  // Empty is traces.
  string signal = 4;
}

// DashboardAnnotation declares where a dashboard's time-series markers come from.
// The spec only names the source; the console draws it from data it owns.
message DashboardAnnotation {
  // "releases": a marker for every promotion of a release into the environment
  // (DeliveryInsightsService.ListReleases).
  string source = 1;
  string label = 2;
}

message Panel {
  string id = 1;
  string title = 2;
  string description = 3;
  // number | line | table | bar | heatmap | sql | search | funnel | issues |
  // sessions
  //
  // bar is a table drawn as top-N bars (needs group_by; limit). heatmap takes
  // one count series whose `field` is the numeric value bucketed over time.
  // sql carries its statement in `sql` and takes no series, where or group_by.
  //
  // funnel, issues and sessions are read by QueryPanel from the tenant's browser
  // tables (product_events, error_hourly, rum_sessions) instead of from series
  // over a signal. They take no series, ratio, group_by or columns, accept
  // `where` (a small field vocabulary: service.name, service.version,
  // reliant.env.id, deployment.environment.name, resource.attr.rum.sessionId,
  // and for funnels span.attr.<prop> and span.attr.userId), and
  // are read over at most 90 days (funnel) or 30 days (issues, sessions).
  string kind = 4;
  // traces | metrics | logs. funnel, issues and sessions read browser telemetry:
  // their signal is "traces" or empty. A sql panel's signal is optional.
  string signal = 5;
  repeated PanelSeries series = 6;
  bool ratio = 7;
  repeated PanelPredicate where = 8;
  repeated string group_by = 9;
  repeated string columns = 10;
  // "" | count | ms | bytes | percent
  string unit = 11;
  int32 width = 12;
  int32 height = 13;
  // funnel panels only: the ordered product events to count. Required for kind
  // funnel, refused otherwise.
  PanelFunnel funnel = 14;
  // sessions panels only: keep only sessions that hit an error.
  bool has_error = 15;
  // line and number panels: plot this expression over the series instead of
  // the series ("A / B * 100": A is series[0], B series[1], ...; numbers,
  // + - * / and parentheses; x / 0 is 0). Not with ratio.
  string formula = 16;
  // table and bar panels: keep the top `limit` groups by series[0], 1 to 200.
  // 0 is 10 for a bar and 200 for a table.
  int32 limit = 17;
  // sql panels only: one read-only SELECT over the org's telemetry tables
  // (unqualified names: otel_traces, otel_logs, ...). It may use the
  // dashboard's scope as ClickHouse parameters: {from:DateTime64(9)},
  // {to:DateTime64(9)}, {step:UInt32}, {env_ids:Array(String)},
  // {envs:Array(String)} and {services:Array(String)}.
  string sql = 18;
}

// The definition a funnel panel draws (forge.Funnel): product event names in
// order, compiled to ClickHouse windowFunnel over product_events.
message PanelFunnel {
  // 2 to 10 distinct event names, in the order a journey passes through them.
  repeated string steps = 1;
  // How long a journey may take from its first step to its last: a number and a
  // unit of s, m, h or d ("1h", "7d"), at most 90d. Empty is "1h".
  string window = 2;
  // What a journey is: "session" (events sharing a browser session id) or
  // "user" (events sharing the SDK's userId, across sessions; anonymous events
  // are skipped). Empty is "session".
  string by = 3;
}

message PanelSeries {
  string label = 1;
  // count | count_distinct | sum | avg | max | quantile | last
  string agg = 2;
  double quantile = 3;
  string field = 4;
  string metric_type = 5;
  repeated PanelPredicate where = 6;
}

message PanelPredicate {
  string field = 1;
  // eq | neq | in | not_in | prefix | match | exists | gte
  string op = 2;
  string value = 3;
  repeated string values = 4;
}

message SavedSearch {
  string id = 1;
  string title = 2;
  string signal = 3;
  repeated PanelPredicate where = 4;
  repeated string columns = 5;
  // SearchLogs query string equivalent of `where`, when signal is logs.
  string query = 6;
}

message DashboardAlert {
  string id = 1;
  string title = 2;
  // "<dashboard id>/<panel id>"
  string panel = 3;
  string interval = 4;
  string threshold_type = 5;
  double threshold = 6;
  string status = 7;
  string note = 8;
}

// === Usage and billing ===

message GetObservabilityUsageRequest {
  // The org whose usage to return. The caller must be a member.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

// QuotaState is what the gateway does with the org's telemetry right now.
enum ObservabilityQuotaState {
  OBSERVABILITY_QUOTA_STATE_UNSPECIFIED = 0;
  // Under the allowance, or billed (funded) / exempt: nothing is dropped.
  OBSERVABILITY_QUOTA_STATE_OK = 1;
  // At or over 100% with no way to bill the overage: debug logs and routine
  // traces are dropped; errors and metrics are kept.
  OBSERVABILITY_QUOTA_STATE_OVER_100 = 2;
  // At or over 150%: only error logs, error spans and metrics are kept.
  OBSERVABILITY_QUOTA_STATE_OVER_150 = 3;
}

message GetObservabilityUsageResponse {
  // The billing period: the UTC calendar month. period_end is exclusive.
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  // The end of the last fully metered hour. Usage lags real time by up to
  // about an hour and a quarter; the page must say so.
  google.protobuf.Timestamp measured_through = 3;

  // Billed bytes this period (uncompressed bytes stored, after the browser cap),
  // and the included allowance. 1 GB = 2^30 bytes in the product.
  int64 used_bytes = 4;
  int64 allowance_bytes = 5;

  // Overage accrued so far, and projected for the whole period at the current
  // rate of use, in cents. Zero for an exempt org.
  int64 overage_cents = 6;
  int64 projected_bytes = 7;
  int64 projected_overage_cents = 8;
  // Cents per GB above the allowance, as a decimal string ("25.0000").
  string rate_cents_per_gb = 9;

  // What the gateway enforces, and the state usage alone implies. They differ
  // for an org that pays (enforced ok, usage over_100) or is exempt.
  ObservabilityQuotaState state = 10;
  ObservabilityQuotaState usage_state = 11;
  bool funded = 12;
  bool exempt = 13;
  // A funded org's overage is billed up to this many cents a month; at it the
  // gateway degrades telemetry like an unfunded org.
  int64 spend_cap_cents = 14;
  bool spend_cap_reached = 15;

  // Anonymous browser telemetry is billed only up to a share of the allowance.
  int64 browser_bytes = 16;
  int64 browser_billed_bytes = 17;
  int64 browser_cap_bytes = 18;

  repeated SignalUsage by_signal = 19;
  repeated ServiceUsage by_service = 20;

  // Bytes stored that were never billed because they are Reliant's own telemetry
  // (workspace/daemon and platform logs). Zero for every customer in normal
  // operation: that data is routed to Reliant's own org.
  int64 operator_bytes = 21;
  // Billed bytes that are customer metadata: per-workload container data about the
  // org's own deployments (pod CPU and memory, restarts, k8s events, image and
  // version). Billed like any other data and included in used_bytes; reported on
  // its own line. Node- and cluster-level platform data ("infrastructure") is
  // Reliant's own and is never billed.
  int64 metadata_bytes = 22;
}

message SignalUsage {
  // "logs", "traces", "metrics" or "profiles".
  string signal = 1;
  int64 billed_bytes = 2;
  int64 stored_bytes = 3;
  int64 rows = 4;
}

message ServiceUsage {
  // The service.name; empty for data that carried none.
  string service = 1;
  string signal = 2;
  int64 billed_bytes = 3;
}
