syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/user/v1;userv1";

// === UserService ===

service UserService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (CompleteOnboardingResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // PreviewAccountDeletion reports whether the caller's control-plane account
  // can be deleted, and what they must resolve first if not. Changes nothing.
  rpc PreviewAccountDeletion(PreviewAccountDeletionRequest) returns (PreviewAccountDeletionResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // DeleteCurrentUserAccount tombstones the caller's control-plane account:
  // it settles the prepaid wallet (paid credit refunded to the card that paid
  // for it, promotional credit forfeited), cancels the free compute plan,
  // tears down active daemons, and scrubs + tombstones the user row so the
  // auth bridge refuses every subsequent request from that identity.
  //
  // The row is NOT removed. Billing records (usage, wallet ledger, invoices)
  // reference it and are retained as financial records; the tombstone is also
  // what makes the lockout work, since the auth bridge recreates a MISSING
  // user row on the deleted user's very next request.
  //
  // Refuses while the caller has a paid subscription — nothing is destroyed
  // in that case, and the response names the blocker so the client can link
  // to the remedy. A wallet balance never blocks deletion.
  //
  // UNAVAILABLE means a refund's outcome could not be confirmed with Stripe:
  // nothing else was deleted, and retrying is safe (it replays the same
  // refund rather than issuing another).
  rpc DeleteCurrentUserAccount(DeleteCurrentUserAccountRequest) returns (DeleteCurrentUserAccountResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
  reserved 2; // was: repeated Organization organizations (removed with OrgService)
  reserved "organizations";
}

message UpdateProfileRequest {
  string name = 1;
  string avatar_url = 2;
}

message UpdateProfileResponse {
  User user = 1;
}

message CompleteOnboardingRequest {
  google.protobuf.Struct onboarding_data = 1;
}

message CompleteOnboardingResponse {}

// AccountDeletionBlocker is one reason deletion cannot proceed yet. The reason
// is machine-readable so the client can render the specific remedy and link to
// it, rather than showing a generic error.
message AccountDeletionBlocker {
  // Machine-readable reason: "paid_subscription".
  string reason = 1;
  // Human-readable sentence the UI may render verbatim.
  string detail = 2;
}

// WalletRefundDestination is money going back to one card.
message WalletRefundDestination {
  // Empty when the card could not be determined; render "your original
  // payment method" rather than a blank.
  string card_brand = 1;
  string card_last4 = 2;
  int64 amount_cents = 3;
}

// AccountDeletionWalletQuote is what deleting the account would do to the
// caller's prepaid wallet. Every amount is computed by the server — the client
// renders these numbers and never derives one from another.
message AccountDeletionWalletQuote {
  // Refunded automatically, split across destinations (newest payment
  // first). Includes the top-up service fee only when includes_service_fee.
  int64 refund_cents = 1;
  repeated WalletRefundDestination destinations = 2;
  // Paid credit no card payment can take back automatically. NOT forfeited:
  // support refunds it by hand after deletion.
  int64 unrefundable_cents = 3;
  // Promotional (coupon) credit that deletion forfeits.
  int64 forfeited_promo_cents = 4;
  bool includes_service_fee = 6;
}

// AccountDeletionWalletSettlement is what deletion did to the wallet.
message AccountDeletionWalletSettlement {
  // Accepted by Stripe, to destinations.
  int64 refunded_cents = 1;
  repeated WalletRefundDestination destinations = 2;
  // Could not be refunded automatically; support will refund it.
  int64 refund_owed_cents = 3;
  int64 forfeited_promo_cents = 4;
}

message PreviewAccountDeletionRequest {}

message PreviewAccountDeletionResponse {
  // Empty when the account can be deleted.
  repeated AccountDeletionBlocker blockers = 1;
  // How many active daemons deletion would tear down. Not a blocker — a
  // running daemon is a resource, not a commitment.
  int32 daemon_count = 2;
  // What deletion would refund and forfeit. Unset only when the server
  // cannot settle wallets, in which case deletion itself will refuse.
  AccountDeletionWalletQuote wallet = 3;
}

message DeleteCurrentUserAccountRequest {}

message DeleteCurrentUserAccountResponse {
  // Populated when deletion was REFUSED; nothing was destroyed. Empty on
  // success.
  repeated AccountDeletionBlocker blockers = 1;
  // Set on success: what happened to the wallet.
  AccountDeletionWalletSettlement wallet = 2;
  // True when the account is deleted but a refund could not be issued
  // automatically. Support refunds it by hand and the deletion is finalized
  // then; the user needs to do nothing.
  bool refund_pending = 3;
}
