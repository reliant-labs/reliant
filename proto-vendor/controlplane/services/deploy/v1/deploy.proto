syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/deploy.proto";
import "forge/v1/forge.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/deploy/v1;deployv1";

// === DeployService (public) ===
//
// The customer-facing deploy API. `reliant/web` vendors this service's
// generated client (services/controlPlane/client.ts) and the top-level
// /deploy route is built on it, so THIS is the surface the product consumes —
// the admin twin in proto/services/deploy_admin/v1 exists for staff tooling
// and is not reachable from the product UI.
//
// THE SCOPE OF EVERY RPC HERE IS THE CALLER'S OWN ORGANIZATION. No request
// carries an org_id, and that omission is deliberate rather than an
// oversight: the tenant IS the organization, the caller's org is already in
// their claims, and a request field naming an org is a field somebody will
// eventually populate with a different one. Cross-tenant reads are exactly
// what DeployAdminService is for, and they are gated there.
//
// WHAT A CLIENT MAY WRITE, in one place. Requests carry only declared state:
// DeployEnvironmentSpec and a deployment's forge tier spec (a Struct holding
// the JSON of forge's v1alpha1.<Tier>Spec) are the whole writable surface. Observed state, namespaces, host clusters, promotion pointers and
// timestamps appear on RESPONSES only — there is no request message in this
// file with a field for any of them, so "read-only" is a property of the
// schema rather than a rule a handler has to remember.
//
// ONE MESSAGE IS AN EXCEPTION TO THAT RULE, AND ONLY ONE:
// ReportLocalSessionRequest. It carries OBSERVED state, deliberately.
//
// There used to be two. FinishDeployApplyRequest was the other, and its
// deletion is the point of the spec-driven model: a client reporting that it
// had applied something was a second source of truth about what is running,
// and the one most likely to be believed because it arrived first. Now a
// promotion declares intent, the reconciler converges the cluster to it, and
// the control plane OBSERVES the result itself — so for a self-managed
// environment there is a server-side observation to prefer, and no report to
// accept. See the ListConvergences RPC.
//
// A local session stays an exception because nothing converges a developer's
// laptop: the platform places nothing there and no reconciler watches it, so
// presence really is only knowable from the client. What keeps the rule
// meaningful is the boundary around that one message: what it carries is
// presence, it is rendered as a report, and it never feeds billing, which
// reads the live cluster or nothing.
//
// (LedgerImportApply also carries a historical outcome. That is an import of a
// ledger written by an older forge which really did apply — history rather
// than a current claim; see its own comment.)
//
// Identity is still never reported. `reported_by`, `created_by`, `applied_by`
// and `approved_by` are set by the server from the caller's credential on
// every one of these paths, including the two exceptions.
service DeployService {
  // Feature negotiation is mandatory before sending immutable snapshot documents.
  rpc GetCapabilities(GetDeployCapabilitiesRequest) returns (GetDeployCapabilitiesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // --- Tenant ---------------------------------------------------------

  // GetTenant returns the caller's organization as a deploy tenant. There is
  // no enrollment: the deploy product is open to every org, so every live org
  // is a tenant (slug and namespace prefix = the org id).
  rpc GetTenant(GetDeployTenantRequest) returns (GetDeployTenantResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // CreateTenant returns the caller's tenant, exactly as GetTenant does —
  // there is nothing to create (see GetTenant). Kept for clients that call it
  // before first use; requires org admin. Idempotent.
  rpc CreateTenant(CreateDeployTenantRequest) returns (CreateDeployTenantResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "create"
        target: {
          kind: "deploy_tenant"
          id: "response.tenant.org_id"
          label: "slug"
        }
      }
    };
  }

  // --- Environments ---------------------------------------------------

  rpc CreateEnvironment(CreateDeployEnvironmentRequest) returns (CreateDeployEnvironmentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create"
        target: {
          kind: "environment"
          id: "response.environment.id"
          label: "response.environment.name"
        }
        env: "response.environment.id"
      }
    };
  }
  rpc GetEnvironment(GetDeployEnvironmentRequest) returns (GetDeployEnvironmentResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListEnvironments(ListDeployEnvironmentsRequest) returns (ListDeployEnvironmentsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateEnvironment(UpdateDeployEnvironmentRequest) returns (UpdateDeployEnvironmentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "update"
        target: {
          kind: "environment"
          id: "environment_id"
          label: "response.environment.name"
        }
        env: "environment_id"
      }
    };
  }
  // DeleteEnvironment tears down the environment and its namespace. Refuses
  // with FailedPrecondition while the environment still has deployments,
  // unless force is set — deleting a namespace out from under running
  // workloads is the kind of thing a user should have to say twice.
  rpc DeleteEnvironment(DeleteDeployEnvironmentRequest) returns (DeleteDeployEnvironmentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "delete"
        target: {
          kind: "environment"
          id: "environment_id"
        }
        env: "environment_id"
        detail: ["delete_data"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }
  // ListRetainedDatabases lists the caller's org's databases that outlived a
  // deleted environment (DeleteEnvironment without delete_data). Their data
  // still exists and still bills as storage.
  rpc ListRetainedDatabases(ListRetainedDatabasesRequest) returns (ListRetainedDatabasesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // DeleteRetainedDatabase destroys one retained database's cluster, volumes
  // and (when it was the last in its namespace) the namespace. ADMIN.
  // IRREVERSIBLE; nothing else ever deletes retained data.
  rpc DeleteRetainedDatabase(DeleteRetainedDatabaseRequest) returns (DeleteRetainedDatabaseResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // EnsureEnvironment makes an environment with this NAME exist in the
  // caller's org and returns it: created when absent, returned unchanged when
  // present. It is what `forge env deploy` calls for an env that declares
  // forge.ControlPlane, so a hosted environment is DECLARED in the project's
  // KCL rather than provisioned by a manual CreateEnvironment step.
  //
  // WHY A SEPARATE RPC RATHER THAN AN IDEMPOTENT CreateEnvironment. The two
  // callers want different answers to "that name is taken". A human creating
  // an environment who collides with an existing name has made a mistake and
  // must be told (AlreadyExists); a declarative client re-running an
  // unchanged project has made no mistake and must converge. Folding both
  // into Create would make the human's collision silent or the re-run an
  // error, and a request flag choosing between them is two RPCs sharing one
  // name. `created` reports which happened so a caller can still tell.
  //
  // An existing environment whose IMMUTABLE fields (kind, tenant cluster)
  // differ from the spec is FailedPrecondition, never silently kept or
  // rewritten: a declaration that disagrees with a namespace that already
  // exists has no correct reading.
  rpc EnsureEnvironment(EnsureDeployEnvironmentRequest) returns (EnsureDeployEnvironmentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "create"
        target: {
          kind: "environment"
          id: "response.environment.id"
          label: "response.environment.name"
        }
        env: "response.environment.id"
      }
    };
  }

  // --- Deployments ----------------------------------------------------

  rpc CreateDeployment(CreateDeploymentRequest) returns (CreateDeploymentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create"
        target: {
          kind: "workload"
          id: "response.deployment.id"
          label: "response.deployment.name"
        }
        env: "response.deployment.environment_id"
      }
    };
  }
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // UpdateDeployment replaces the DECLARED state. Reserved capacity changes
  // here rather than through Scale, because changing what a replica reserves
  // changes the bill in a way that adding replicas at a known size does not.
  rpc UpdateDeployment(UpdateDeploymentRequest) returns (UpdateDeploymentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "update"
        target: {
          kind: "workload"
          id: "deployment_id"
          label: "response.deployment.name"
        }
        env: "response.deployment.environment_id"
      }
    };
  }
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "delete"
        target: {
          kind: "workload"
          id: "deployment_id"
        }
      }
    };
  }

  // --- Lifecycle operations -------------------------------------------
  //
  // These are UI-NATIVE and never touch the tenant's declared config. The
  // config↔UI split is deliberate: desired state lives in the tenant's forge
  // KCL and the UI's only write path into it is a reviewable diff, while
  // imperative ops — promote, roll back, scale, read logs — act on the
  // running system directly.

  // Promote re-points an environment at an ALREADY-BUILT release.
  //
  // It NEVER builds. See PromoteReleaseRequest: there is no image field, no
  // build input, and no way to express one, so "the bytes that passed staging
  // are the bytes that reach prod" holds by construction rather than by
  // policy. A version that was never cut fails with FailedPrecondition; there
  // is no path that responds by building it.
  rpc Promote(PromoteReleaseRequest) returns (PromoteReleaseResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotency_key: true
      activity: {
        verb: "promote"
        target: {
          kind: "release"
          id: "version"
          label: "version"
        }
        env: "environment_id"
        detail: [
          "response.promotion.kind",
          "response.promotion.from_environment_name",
          "note",
          "response.promotion.id"
        ]
      }
    };
  }

  // There is no Rollback RPC. A rollback claims to undo a release it cannot
  // undo — the release already ran its migrations and wrote data — so
  // recovery is ROLL FORWARD: cut a release with the fix and Promote it.
  // Promoting an OLDER release is still an ordinary Promote; the forge plan
  // labels it `direction BEHIND`. The RPC, RollbackReleaseRequest and
  // RollbackReleaseResponse were removed; proto has no `reserved` for a
  // method or message name, so this comment is the tombstone.

  // Scale changes the RUN STATE (running / suspended) and nothing else.
  // Narrow on purpose: this is the button on a detail page, and a request
  // shape that could also change reserved capacity would let a mis-wired
  // control change the bill. forge's tiers carry no replica count, so there
  // is no count to scale; suspending is the one thing left.
  //
  // A suspend is the tenant's own. It is NOT the same as the environment's
  // automatic scale-to-zero, and neither one stops storage.
  rpc Scale(ScaleDeploymentRequest) returns (ScaleDeploymentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "scale"
        target: {
          kind: "workload"
          id: "deployment_id"
          label: "response.deployment.name"
        }
        env: "response.deployment.environment_id"
        detail: ["run_state"]
      }
    };
  }

  // SetEnvironmentRunState suspends or resumes EVERY live deployment of an
  // environment in one call: the "stop my-app" / "re-up my-app" button.
  // Same semantics as Scale per deployment — it writes the declared run
  // state, the tier controllers act on it (replicas to zero, database
  // hibernated, site unpublished; data is kept) — and the same independence
  // from billing: resuming never overrides a billing suspension, it is
  // refused with the billing reason instead. ADMIN, like Scale and
  // DeleteEnvironment.
  rpc SetEnvironmentRunState(SetEnvironmentRunStateRequest) returns (SetEnvironmentRunStateResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "set_run_state"
        target: {
          kind: "environment"
          id: "environment_id"
        }
        env: "environment_id"
        detail: ["run_state"]
      }
    };
  }

  // RestartWorkload asks the platform to restart one workload's pods, one at a
  // time behind their readiness gates (a rolling restart). The release and the
  // declared spec do NOT change, and nothing here scales: replicas are declared
  // in code, so changing them is a pull request, never a console action.
  //
  // HOSTED ENVIRONMENTS ONLY (console decision D6, hosted first). A
  // self-managed or local environment is FailedPrecondition: the platform does
  // not run its pods, and there is no daemon path with an authorization story
  // yet.
  //
  // The request NAMES THE ENVIRONMENT, and the response echoes it, so a client
  // can show "Restart in prod" and a log line can never be read as having
  // restarted a different environment's workload. ADMIN, like Scale: restarting
  // a production workload is a write to it. Recorded in the audit trail as
  // action workload.restart with the environment and the workload.
  //
  // Idempotent within a second: a repeat returns the same request time rather
  // than rolling the pods twice.
  rpc RestartWorkload(RestartWorkloadRequest) returns (RestartWorkloadResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "restart"
        target: {
          kind: "workload"
          id: "response.deployment_id"
          label: "workload"
        }
        env: "environment_id"
      }
    };
  }

  // GetStatus returns the deployment with BOTH halves — declared and
  // observed — plus the derived drift the UI badges. The 15s poll on the
  // /deploy detail page calls this.
  rpc GetStatus(GetDeploymentStatusRequest) returns (GetDeploymentStatusResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // StreamLogs streams build or runtime output for one deployment.
  //
  // SNAPSHOT-THEN-TAIL, with a resume cursor. The first response carries the
  // buffered backlog and the sequence it ends at; subsequent responses carry
  // new lines. A client that drops the connection reconnects with
  // after_sequence and receives only what it missed — which is what makes a
  // transient disconnect a gap of milliseconds instead of a re-read of the
  // whole buffer.
  rpc StreamLogs(StreamDeploymentLogsRequest) returns (stream StreamDeploymentLogsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reads only: computes and returns, changes nothing"}
    };
  }

  // --- Releases and history -------------------------------------------

  // CutRelease records a version label over a set of artifacts that were
  // ALREADY BUILT AND PUSHED. It is the other half of Promote: Promote can
  // only re-point at a release, and until this RPC existed there was no way
  // to create one over the wire, so the push-to-deploy path stopped at the
  // registry.
  //
  // IT BUILDS NOTHING EITHER. A caller states digests it has in hand; this
  // server never produces bytes. The natural place for that caller is CI,
  // immediately after `docker/build-push-action` reports the digest it just
  // pushed — which is why the request carries digests and not a Dockerfile.
  //
  // IDEMPOTENT ON (caller's org, version), which is not a check this handler
  // performs but the unique index the ledger already carries. CI retries, and
  // a re-run on the same commit must not cut a second release. Re-cutting the
  // SAME version with the SAME artifacts returns the release that already
  // exists with created=false; re-cutting it with DIFFERENT artifacts is
  // AlreadyExists, because a version label that meant two different digest
  // sets would void every guarantee Promote rests on.
  rpc CutRelease(CutReleaseRequest) returns (CutReleaseResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotency_key: true
      activity: {
        verb: "cut"
        target: {
          kind: "release"
          id: "response.release.version"
          label: "response.release.version"
        }
        detail: [
          "project",
          "git_commit"
        ]
      }
    };
  }

  // RecordReleaseMigrations fills the migration manifest of a release cut
  // before forge recorded one — the backfill that lets forge's release-time
  // migration-order guard see what an environment already applied. It is NOT
  // an update: the manifest is evidence in its own append-only child row, the
  // release row is untouched, a release that already records an equal
  // manifest answers recorded=false, and a DIFFERENT one is AlreadyExists.
  rpc RecordReleaseMigrations(RecordReleaseMigrationsRequest) returns (RecordReleaseMigrationsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "record_migrations"
        target: {
          kind: "release"
          id: "version"
          label: "version"
        }
        detail: ["project"]
      }
    };
  }

  // ListReleases feeds the promote picker. Releases are immutable, so there
  // is deliberately no UpdateRelease anywhere in this service — a correction
  // is a new release.
  rpc ListReleases(ListDeployReleasesRequest) returns (ListDeployReleasesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetRelease(GetDeployReleaseRequest) returns (GetDeployReleaseResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // ListPromotions returns an environment's ledger, newest first — the
  // timeline the UI renders. Append-only, so this is the COMPLETE record,
  // including every release the env moved away from, which a current-pointer
  // read cannot show.
  rpc ListPromotions(ListDeployPromotionsRequest) returns (ListDeployPromotionsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // CompareReleases says what changed between two releases of one project,
  // from what the ledger recorded when each was cut: the commits between them,
  // the artifacts whose identity moved (digest -> digest), and, in one
  // environment, the Kubernetes objects their bundles add, modify and remove,
  // each with a one-line summary. It reads only records (forge's
  // release.CompareCommits / CompareArtifacts / CompareObjects), so it answers
  // with no repository and no registry at hand. Release detail's Changes tab.
  //
  // Either order works: comparing a newer release FROM an older one lists what
  // it adds; the other way round sets commits.reverts and lists what moving
  // to it takes away.
  rpc CompareReleases(CompareDeployReleasesRequest) returns (CompareDeployReleasesResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reads only: computes and returns, changes nothing"}
    };
  }

  // --- Rollout, evidence and runs -------------------------------------

  // GetRollout reports how far ONE promotion has rolled out, judged against
  // THAT promotion's frozen pins — never against whatever the deployment rows
  // declare now. An empty promotion_id means the environment's current
  // promotion.
  //
  // Why this is not "poll GetStatus until CONVERGED". GetStatus compares
  // observed against each ROW's desired digest, so a promote that lands while
  // a caller is waiting moves the rows and the wait "succeeds" on bytes it was
  // never asked about. It also reads DIVERGED for the whole of a normal
  // rollout, which makes DIVERGED useless as a failure signal: fail on it and
  // every deploy fails, ignore it and real drift is hidden. Scoping to a
  // promotion fixes the first; a server-computed phase (which folds
  // mid-rollout divergence into PROGRESSING) fixes the second.
  rpc GetRollout(GetDeployRolloutRequest) returns (GetDeployRolloutResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // RecordGate appends one check result to a promotion.
  //
  // APPEND-ONLY: a re-run appends a NEW row and every row is kept, because the
  // history of a flaky check is itself evidence. Idempotent on
  // (promotion_id, name, run_id), so a CI retry of the same step returns the
  // existing row rather than duplicating it.
  //
  // Authorized at deploy:write — below promote's admin, so a test job's token
  // needs no promote authority. See DeployGate: that is safe only because
  // these rows are evidence and nothing enforces on them.
  rpc RecordGate(RecordDeployGateRequest) returns (RecordDeployGateResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "record_check"
        target: {
          kind: "check"
          id: "gate.name"
          label: "gate.name"
        }
        detail: [
          "gate.status",
          "gate.summary",
          "promotion_id"
        ]
      }
    };
  }

  // ListGates returns a promotion's whole evidence trail: the gates claimed at
  // promote time first, then the recorded ones oldest-first.
  rpc ListGates(ListDeployGatesRequest) returns (ListDeployGatesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // GetRun assembles one CI run's timeline from the ledger: the release it
  // cut, the promotions it made, the gates carrying its run id, and each
  // promotion's derived rollout.
  //
  // NOTHING IS A STORED EVENT, and there is no stream. The ledger plus a
  // derived rollout already holds the timeline, so an event table would be a
  // second copy of it that could disagree. A client polls this exactly as the
  // deploy detail page already polls GetStatus.
  rpc GetRun(GetDeployRunRequest) returns (GetDeployRunResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // --- Usage ----------------------------------------------------------

  // ListUsage returns metered infrastructure usage for the caller's org, with
  // per-resource attribution. Post-hoc: these rows come from a sweeper that
  // read the live cluster, so a deployment declared and never applied appears
  // in none of them.
  rpc ListUsage(ListDeployUsageRequest) returns (ListDeployUsageResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // --- Bundles, applies and the Live view -----------------------------
  //
  // The source-of-truth half: what an environment should contain, what was
  // actually applied to it, and what is there now. These exist because the
  // platform does not observe a self-managed cluster or a developer's laptop,
  // so for those environments the only record is the one written at the
  // moments that matter.

  // RecordBundle records one rendered deploy artifact against an environment.
  //
  // THE REQUEST CARRIES THE BUNDLE'S OWN BYTES, NEVER A DESCRIPTION OF THEM.
  // The server re-derives the digest from the manifest, checks the manifest's
  // config digest against the config blob, and decodes that blob strictly as
  // forge's bundle document — then takes the shape, the provenance, the config
  // digest and the release FROM THE VERIFIED DOCUMENT. So a client cannot
  // record a shape that disagrees with the artifact it points at, which is the
  // same reasoning PublishDeploymentConfig's emptiness follows: a field a
  // caller could populate independently is a field that will eventually
  // disagree with the thing it describes.
  //
  // IT RECORDS. IT AUTHORIZES NOTHING. A bundle that policy would refuse is
  // still recorded here and refused at apply. Separating the two means the
  // ledger holds what was built even when it was never allowed to ship, which
  // is exactly the history an incident review wants.
  //
  // Idempotent on (environment, digest): the render is reproducible, so a
  // re-run of an unchanged project records the same bundle and reports
  // created=false.
  rpc RecordBundle(RecordDeployBundleRequest) returns (RecordDeployBundleResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotency_key: true
      activity: {none: "records the rendered bundle a promotion then applies; the promotion is the activity"}
    };
  }

  rpc GetBundle(GetDeployBundleRequest) returns (GetDeployBundleResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // BeginApply AND FinishApply ARE DELETED, and the deletion is the point of
  // the unified model rather than a cleanup.
  //
  // Their meaning was "I am applying now" — a client opening a record of an
  // attempt, then reporting how it went. Nothing can honestly say that any
  // more: `forge env deploy` writes a PROMOTION (declarative intent, approved
  // against a plan), the reconciler converges the cluster to it, and the
  // control plane observes the result itself. An RPC through which a client
  // could still claim to have applied something would be a second, competing
  // source of truth about what is running — and the one most likely to be
  // believed, because it arrives first.
  //
  // Everything they recorded that is still true has a better home: the plan
  // approval (plan_digest, approved_by, acknowledged findings) belongs to the
  // promotion, which is the authorized act, and is already stored there; and
  // "did it land" is now an observation, reported by ListConvergences below.
  //
  // Pre-1.0, so they are deleted outright rather than deprecated through a
  // window. Field tags inside SURVIVING messages are still reserved where one
  // was removed; a whole message or RPC needs no tombstone.

  // ListConvergences returns an environment's OBSERVATION TIMELINE, newest
  // first, keyset-paged for ListPromotions' reason: rows arrive while a reader
  // pages, so an offset would skip or repeat one.
  //
  // IT REPLACES ListApplies, AND THE REPLACEMENT IS THE MODEL CHANGE. An apply
  // was a client's claim that it was applying something — "I am applying now"
  // — and forge does not apply at all any more: a promotion declares intent,
  // the reconciler converges reality to it, and the control plane OBSERVES the
  // result. So the thing worth listing is not a sequence of attempts but a
  // sequence of readings: "converged to B at 14:02", "failed at 14:40:
  // HealthCheckFailed".
  //
  // ROWS ARE TRANSITIONS, NOT POLLS. The observer looks every couple of
  // minutes and appends only when the answer CHANGED, so this list is short
  // and every entry means something. Nothing here is required for
  // correctness — the records are derived from the reconciler's current status
  // and are safe to lose and rebuild — which is why they are reported through
  // their own RPC rather than folded into Live.
  //
  // MEMBER. This is the deploy history of a team's own environment.
  rpc ListConvergences(ListDeployConvergencesRequest) returns (ListDeployConvergencesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // --- Deploy attempts ----------------------------------------------------
  //
  // One `forge env deploy` invocation, from the first thing it does to its
  // exit: the record a human opens when "my deploy broke". The ledger cannot
  // hold it — a build that failed or a plan the guard refused writes no
  // release and no promotion — so this is the one place that does.
  //
  // FORGE IS THE ONLY WRITER, and that is what makes one record cover every
  // way a deploy starts: a terminal, CI, and the console's Deploy dialog
  // (which runs forge on the daemon). Every write is best-effort on forge's
  // side: a control plane that cannot record an attempt never fails a
  // deploy.
  //
  // NOT A CLAIM ABOUT WHAT IS RUNNING — the line between these and the
  // deleted BeginApply/FinishApply. An attempt says what forge was asked and
  // how the invocation ended; whether the release then runs is the
  // promotion's (intent) and ListConvergences' (observation) answer, and an
  // attempt carries the promotion id so a reader can follow it there.

  // OpenDeployAttempt starts an attempt. Idempotent on the forge-minted id: a
  // retried open returns the existing row unchanged.
  rpc OpenDeployAttempt(OpenDeployAttemptRequest) returns (OpenDeployAttemptResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "records a deploy invocation; the promotion it writes is the activity"}
    };
  }

  // ReportDeployAttempt is a heartbeat: the phase, what the attempt has
  // learned (release, promotion), and the next chunk of its log. Refused for
  // a closed attempt, so a late heartbeat cannot reopen one.
  rpc ReportDeployAttempt(ReportDeployAttemptRequest) returns (ReportDeployAttemptResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "deploy progress heartbeat"}
    };
  }

  // CloseDeployAttempt records how the invocation ended. Exactly once: a
  // second close is refused, so the first outcome reported is the outcome.
  rpc CloseDeployAttempt(CloseDeployAttemptRequest) returns (CloseDeployAttemptResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "records how a deploy invocation ended; the promotion it wrote is the activity"}
    };
  }

  // ListDeployAttempts pages a project's attempts newest first, optionally
  // one environment's. Without logs or reports — GetDeployAttempt has those.
  //
  // MEMBER, like the rest of the ledger reads.
  //
  // forge:custom — keyset-paged by (started_at, id) with a derived state, not
  // the generated CRUD list.
  rpc ListDeployAttempts(ListDeployAttemptsRequest) returns (ListDeployAttemptsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // GetDeployAttempt returns one attempt with its log tail and report.
  //
  // forge:custom — returns the log and report beside the attempt, and derives
  // its state.
  rpc GetDeployAttempt(GetDeployAttemptRequest) returns (GetDeployAttemptResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // GetLiveView returns every environment of one forge project with its
  // declaration, promotion, release, bundle, latest apply and sessions — the
  // whole Live screen in ONE round trip.
  //
  // Folded for GetTenant's reason: the page cannot render until it has all of
  // it, and N environments × six reads is both a slow page and a page assembled
  // from six different instants. An environment list that comes back empty is
  // an empty list, never an error: a project nobody has deployed yet is a
  // normal state, not a failure.
  rpc GetLiveView(GetDeployLiveViewRequest) returns (GetDeployLiveViewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // PlanDeploy computes what deploying a bundle WOULD do, and writes nothing.
  //
  // IT IS A SEPARATE READ-ONLY RPC RATHER THAN A dry_run FLAG ON Promote, and
  // that is the whole design decision. A boolean that makes a mutating call
  // not mutate is the shape where one wrong default deploys production; a read
  // RPC cannot have that failure mode, because there is no code path in it
  // that writes. It is safe to call repeatedly, from a UI, from a pre-commit
  // hook, from anywhere.
  //
  // The plan it returns carries a digest, and Promote and BeginApply RECOMPUTE
  // the plan rather than trusting the one the caller approved. That is what
  // makes the digest a guarantee instead of a claim.
  rpc PlanDeploy(PlanDeployRequest) returns (PlanDeployResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "dry run: computes a plan, changes nothing"}
    };
  }

  // CheckDeployCapacity answers "would this org be allowed to run this?" —
  // a compute plan, and room in it — BEFORE anything is built or pushed.
  //
  // A PURE READ, and the same decision (internal/computegate) RecordBundle,
  // Promote and Scale ENFORCE. The pre-flight exists so a deploy with no plan
  // fails in seconds with the remedy named, rather than after a build; the
  // enforcement exists because a pre-flight is advisory and a client may skip
  // it. Allowed=false is a normal response, not an error.
  //
  // environment_id MAY BE EMPTY: a first deploy to an environment that does
  // not exist yet is exactly what the pre-flight is for, and it runs before
  // anything creates one. Empty excludes no environment from the org-wide
  // static count, and a refusal carries no hold link (there is no environment
  // to link it to).
  rpc CheckDeployCapacity(CheckDeployCapacityRequest) returns (CheckDeployCapacityResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reads only: computes and returns, changes nothing"}
    };
  }

  // ReportLocalSession upserts one `forge env up` worktree's presence.
  //
  // THE SECOND REPORTED-STATE EXCEPTION — see the service header. LOCAL
  // environments only, enforced by the database rather than by this handler.
  //
  // It must NEVER block `forge env up`. A developer whose network is down, or
  // whose token has expired, keeps working — the session record is a courtesy
  // to their team's Live view, and a local dev loop that depends on a control
  // plane being reachable is a worse product than one with a gap in a
  // dashboard.
  rpc ReportLocalSession(ReportLocalSessionRequest) returns (ReportLocalSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "dev-loop telemetry about a local session"}
    };
  }

  // ImportLedger loads a project's existing file-based deploy history into the
  // hosted ledger, in one transaction.
  //
  // HISTORY IS IMPORTED AS-IS AND NEVER RE-JUDGED. Provenance comes across
  // verbatim, including the uncomfortable parts — a release cut dirty from a
  // laptop is imported saying so. Re-evaluating old records against today's
  // policy would produce a ledger that disagrees with what actually happened,
  // which is the one thing a ledger may not do.
  //
  // Identity still comes from the token: every imported promotion is
  // attributed to the importing caller, and the historical actor name from the
  // file is kept beside it as provenance only. There is deliberately no
  // user-mapping option — mapping a username onto a control-plane identity is
  // a guess, and it would put an unverifiable attribution into the audit trail
  // permanently.
  //
  // Idempotent on each item's imported_from, so a failed import is re-run
  // rather than repaired. It refuses a PERSISTENT or PREVIEW environment,
  // whose history was always hosted, and any environment that already holds a
  // non-imported promotion, because the two orderings cannot be reconciled —
  // the remedy there is to import first.
  rpc ImportLedger(ImportLedgerRequest) returns (ImportLedgerResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotency_key: true
      activity: {
        verb: "import"
        target: {
          kind: "ledger"
          id: "project"
        }
        detail: [
          "source",
          "project"
        ]
      }
    };
  }

  // GetDrift reports whether an environment's live objects still match the
  // bundle that was applied to it.
  //
  // Distinct from GetStatus's drift, which compares a deployment's observed
  // image against its declared one. This compares whole objects against the
  // applied render, so it catches the case that one cannot: an object a human
  // edited. The next apply reverts such an edit silently, which is why it has
  // to be visible BEFORE the deploy rather than discovered after.
  rpc GetDrift(GetDeployDriftRequest) returns (GetDeployDriftResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
}

// === Tenant ===

message GetDeployCapabilitiesRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message GetDeployCapabilitiesResponse {
  repeated string snapshot_schema_versions = 1;
  bool immutable_snapshot_seals = 2;
  bool frozen_promotion_bundles = 3;
  // The optional bundle-document features this server's strict bundle decoder
  // accepts (forge release.BundleDocFeatures: e.g. "provenance-commit-identity",
  // "object-summaries"). forge sends a hosted bundle only the parts named here;
  // a server that names none gets the document every older decoder knew.
  repeated string bundle_document_features = 4;
}

message GetDeployTenantRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message GetDeployTenantResponse {
  DeployTenant tenant = 1;
}

message CreateDeployTenantRequest {
  // Requested hostname label. IMMUTABLE once allocated — every URL the tenant
  // publishes contains it. Must be an RFC-1123 label of at most 40 chars;
  // empty asks the server to derive one from the organization.
  string slug = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message CreateDeployTenantResponse {
  DeployTenant tenant = 1;
}

// === Environments ===

message CreateDeployEnvironmentRequest {
  // The whole writable surface — see DeployEnvironmentSpec's comment for why
  // create takes a spec rather than a DeployEnvironment with fields the
  // server is trusted to ignore.
  DeployEnvironmentSpec spec = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message CreateDeployEnvironmentResponse {
  DeployEnvironment environment = 1;
}

message GetDeployEnvironmentRequest {
  string environment_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetDeployEnvironmentResponse {
  DeployEnvironment environment = 1;
  // The environment's current release binding, resolved. Empty before its
  // first deploy.
  DeployPromotion current_promotion = 2;
}

message ListDeployEnvironmentsRequest {
  // FILTERS MUST BE `optional`. Without presence, a generated filter cannot
  // tell "kind not specified" from "kind == UNSPECIFIED" and silently
  // no-ops — this project's convention lint enforces the rule.
  //
  // Previews are the reason `kind` is the ONLY lifecycle filter here. A busy
  // repo has one preview per open PR, and a list that drowns prod in preview
  // rows is a list nobody reads — but that is answered by asking for
  // PERSISTENT, not by a second boolean that could disagree with it.
  optional DeployEnvironmentKind kind = 1;
  // `search` is forge's generated free-text filter — it spans the entity's
  // text columns rather than naming one, which is why it is spelled `search`
  // and not `name_contains`: a filter named for a column must BE a column.
  optional string search = 2;
  // Exact match on the environment's forge project. Unset lists every
  // project's environments; set to "" lists only the project-less ones.
  optional string project = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message ListDeployEnvironmentsResponse {
  repeated DeployEnvironment environments = 1;
}

message UpdateDeployEnvironmentRequest {
  string environment_id = 1;
  // Replaces the declared spec. `name` and `kind` are immutable after
  // creation and are ignored here — a rename would strand the namespace that
  // was derived from the original, and a persistent environment mutating into
  // a preview would acquire a TTL on a production namespace.
  DeployEnvironmentSpec spec = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message UpdateDeployEnvironmentResponse {
  DeployEnvironment environment = 1;
}

message DeleteDeployEnvironmentRequest {
  string environment_id = 1;
  // Delete the environment's deployments along with it. Without this, an
  // environment that still has deployments is refused.
  bool force = 2;
  // Also destroy the environment's DATA: its managed databases' Postgres
  // clusters, volumes and credentials, and the workload-cluster namespace.
  // IRREVERSIBLE. Default false RETAINS the data: the databases keep running
  // in their namespace (and keep billing as storage) and are listed by
  // ListRetainedDatabases until purged with DeleteRetainedDatabase. A
  // re-deploy creates a NEW environment and does not reattach them.
  bool delete_data = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message DeleteDeployEnvironmentResponse {}

// RetainedDatabase is a managed database whose environment was deleted
// without delete_data. Its data still exists and still costs storage.
message RetainedDatabase {
  string id = 1;
  // The deleted environment it belonged to.
  string environment_id = 2;
  string environment_name = 3;
  string project = 4;
  // The database's name (its CloudNativePG cluster name).
  string database_name = 5;
  // Where the data lives: workload cluster id and namespace.
  string cluster_id = 6;
  string namespace = 7;
  // Provisioned storage across all instances, in GiB.
  int64 storage_gib = 8;
  google.protobuf.Timestamp retained_at = 9;
}

message ListRetainedDatabasesRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message ListRetainedDatabasesResponse {
  repeated RetainedDatabase retained_databases = 1;
}

message DeleteRetainedDatabaseRequest {
  string id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message DeleteRetainedDatabaseResponse {}

message EnsureDeployEnvironmentRequest {
  // The environment is addressed by (spec.project, spec.name) within the
  // caller's org.
  DeployEnvironmentSpec spec = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message EnsureDeployEnvironmentResponse {
  DeployEnvironment environment = 1;
  // True when this call created the environment, false when it already
  // existed. The call succeeds either way.
  bool created = 2;

  // Tag 3 is `protection_held`: the server kept the stored protection because
  // the declaration did not qualify to loosen it, so forge can print why.
  // Deferred to #516 with protection itself.
  reserved 3; // protection_held — #516

  // True when this call SEALED the environment: it was a LOCAL (secrets
  // readable) environment whose declaration now deploys something, so its
  // secrets are write-only from here on and never readable again. forge
  // prints a one-time notice: values set before may already be on developer
  // machines, so rotate any a deployed part will use.
  bool secrets_sealed = 4;
}

// === Deployments ===

// THE TIER SPEC IS FORGE'S, CARRIED AS A Struct.
//
// `spec` is the JSON of forge's v1alpha1.<Tier>Spec
// (github.com/reliant-labs/forge/pkg/deploy/v1alpha1) for `tier`, in forge's
// own camelCase json tags. The server decodes it STRICTLY (an unknown field is
// refused, never dropped), runs forge's Validate(), and, because this is the
// hosted platform, forge's deploy.CheckShapeBand. A refusal is InvalidArgument
// carrying forge's own reason string. There is no proto mirror of the spec:
// one Go type defines a tier, and a second schema here could only disagree.
//
// A BACKEND's `image` must be a digest reference (`<repo>@sha256:<64 hex>`),
// never a tag: the promotion guarantee holds only for an image that cannot be
// re-pointed.
//
// Declared state only. There is no observed-state field here, and that is the
// structural half of "clients cannot write observed state". run_state is
// absent too: a new deployment runs, and suspending one is Scale's job.
message CreateDeploymentRequest {
  string environment_id = 1;
  string name = 2;
  DeployTier tier = 3;
  google.protobuf.Struct spec = 5;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message CreateDeploymentResponse {
  Deployment deployment = 1;
}

message GetDeploymentRequest {
  string deployment_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetDeploymentResponse {
  Deployment deployment = 1;
}

message ListDeploymentsRequest {
  // All `optional` — see ListDeployEnvironmentsRequest.
  //
  // There is deliberately no include_deleted. A soft-deleted deployment is
  // retained so usage buckets that name it keep resolving — it is billing
  // history, not a row a tenant browses — and the public list therefore only
  // ever returns live deployments. Staff who need the deleted ones use
  // DeployAdminService.
  optional string environment_id = 1;
  optional DeployTier tier = 2;
  optional DeployObservedState observed_state = 3;
  // See ListDeployEnvironmentsRequest.search.
  optional string search = 4;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 5;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

message UpdateDeploymentRequest {
  string deployment_id = 1;
  // Replaces the tier spec wholesale, validated exactly as on create (see
  // CreateDeploymentRequest). `tier` is absent because a deployment cannot
  // change tier: the tiers differ in which controller reconciles them, so a
  // tier change is a delete and a create wearing one request's clothing.
  google.protobuf.Struct spec = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message UpdateDeploymentResponse {
  Deployment deployment = 1;
}

message DeleteDeploymentRequest {
  string deployment_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message DeleteDeploymentResponse {}

// === Promotion ===

// PromoteReleaseRequest asks that an environment be re-pointed at an existing
// release.
//
// THERE IS NO IMAGE FIELD AND NO BUILD INPUT HERE, AND THAT ABSENCE IS THE
// DESIGN. A promotion resolves digests from a release that was already cut,
// so the bytes that passed staging are — by construction — the bytes that
// reach prod. A request shape that could name an image would be a request
// shape that could rebuild, and the guarantee would degrade from an invariant
// into a promise that holds until someone adds a convenience flag.
//
// The version names a release; if it was never cut the call fails, and there
// is no code path that responds by building one.
message PromoteReleaseRequest {
  string environment_id = 1;
  // An already-built release version. FailedPrecondition if it was never cut.
  string version = 2;
  // The environment this is being promoted FROM ("staging" → "prod"), or
  // empty for a first deploy. Recorded so the promotion PATH is auditable and
  // "did this actually pass staging?" has an answer.
  string from_environment_id = 3;
  // Which gates had passed, as recorded by whoever ran them. EVIDENCE, not
  // enforcement: a gate that must BLOCK a promotion is checked server-side
  // before the ledger row is written, because a client-supplied claim can
  // only ever prove that a claim was made.
  repeated DeployGate gates = 4;
  // Automation identity ("ci", "preview-bot") when no human pressed the
  // button. A human caller leaves this empty and is identified from their
  // claims.
  string promoted_by_actor = 5;
  string note = 6;

  // The caller's view of the environment's CURRENT promotion — a
  // compare-and-set, so a promote acts on the state the caller actually read.
  //
  // Setting NEITHER means no CAS, which is what the UI and a curl do, and is
  // the back-compatible default: a request that omits both behaves exactly as
  // it did before this field existed.
  //
  // A PROMOTION ID rather than a version, because v1 → v2 → v1 makes "current
  // is v1" ambiguous and an id never is.
  //
  // Serialization is not sufficient on its own. Promote already takes FOR
  // UPDATE, which ORDERS two writers but does not stop one acting on a stale
  // read: CI plans "prod is on v5, moving to v6", a human hotfixes to v5.1,
  // and CI then writes v6 over the hotfix. Both promotes were correctly
  // serialized, and the hotfix is still gone.
  oneof expected_current {
    string expected_current_promotion_id = 7;
    // "I saw NO promotion" — the first-deploy expectation, which an empty id
    // cannot express distinctly from "no expectation".
    bool expect_unbound = 8;
  }

  // Promote even though the current promotion has not finished rolling out.
  // Recorded on the ledger row as DeployPromotion.superseded_in_flight.
  bool supersede_in_flight = 9;

  // Promote exactly the promotion another environment is running
  // (`promote --from staging`), resolved server-side. Recorded as
  // DeployPromotion.from_promotion_id.
  string from_promotion_id = 10;

  // The CI run driving this promote.
  DeployRun run = 11;

  // Tag 12 is `acknowledge_regression`, which belongs to the source policy
  // deferred to #516. Reserved so the two O-13 fields below keep their
  // numbers when it lands.
  reserved 12; // acknowledge_regression — #516

  // The plan digest the caller approved.
  //
  // THE CAS, EXTENDED FROM THE POINTER TO THE PLAN. expected_current already
  // catches "someone else promoted while I was deciding"; this catches "Live
  // changed in a way that makes my plan wrong" — a new bundle applied, or
  // drift observed. The server recomputes the plan under the row lock and
  // refuses a mismatch with reason `plan_stale`, carrying the fresh plan so
  // the caller can show what moved.
  //
  // REQUIRED on an environment whose promotions the converger applies,
  // because for those the promotion row IS the deploy and there is no later
  // apply at which to check. Optional elsewhere, and recorded when present.
  //
  // The version is resolved inside the TARGET environment's project, so there
  // is no project field here — a promote names an environment, and the
  // environment names its project.
  string plan_digest = 13;

  // The stop-class finding codes being accepted, by code.
  //
  // Deliberately not a boolean. A blanket "yes" is the flag that ends up
  // hard-coded in a CI workflow, and the moment it is, it pre-approves every
  // future destructive change to that environment. A finding code cannot be
  // pre-approved, because it is not known until the plan is computed.
  repeated string acknowledged_findings = 14;

  // The components a SCOPED deploy moves (`--target api`, `--frontends-only`),
  // recorded on the promotion as DeployPromotion.targets. Empty for a
  // whole-release deploy.
  //
  // It takes part in the idempotency rule (forge's release.Decide): promoting
  // the bound release again is a no-op only when the current promotion already
  // moved everything this one names, so a whole deploy after a scoped one is a
  // real move and is recorded.
  repeated string targets = 15;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 16;
}

message PromoteReleaseResponse {
  DeployPromotion promotion = 1;
  // Non-empty when the promotion was ACCEPTED and RECORDED but is QUEUED on a
  // human action (billing) — it is applied automatically once that clears,
  // and nothing needs to be re-run. Also set on an idempotent re-promote of a
  // release that is still queued.
  repeated controlplane.v1.DeployHold holds = 2;
}

// === Scale and status ===

message RestartWorkloadRequest {
  // The environment the workload runs in. Required, and echoed in the response:
  // a restart is always "in <env>".
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  // The workload's name (the deployment name; the same string the observability
  // workloads list calls `workload`).
  string workload = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message RestartWorkloadResponse {
  string environment_id = 1;
  string environment_name = 2;
  string workload = 3;
  string deployment_id = 4;
  // When the restart was requested. The rolling restart follows within the tier
  // controller's reconcile (seconds); watch the workload's pods and rollout for
  // progress.
  google.protobuf.Timestamp requested_at = 5;
}

message ScaleDeploymentRequest {
  string deployment_id = 1;
  // RUNNING or SUSPENDED.
  controlplane.v1.DeployRunState run_state = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message ScaleDeploymentResponse {
  // Carries the whole deployment rather than an ack so the caller sees the
  // new DESIRED count next to the still-old OBSERVED one, which is exactly
  // the transient the UI needs to render ("scaling to 3, 2 running") instead
  // of optimistically claiming success.
  Deployment deployment = 1;
}

message SetEnvironmentRunStateRequest {
  string environment_id = 1;
  // RUNNING or SUSPENDED. UNSPECIFIED is refused.
  controlplane.v1.DeployRunState run_state = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message SetEnvironmentRunStateResponse {
  // Every live deployment of the environment after the write, each with its
  // new DECLARED run state beside its still-old OBSERVED one.
  repeated Deployment deployments = 1;
}

// Exactly one of deployment_id / environment_id. environment_id INSTEAD of a
// deployment asks for the whole environment: every live deployment's status
// plus the environment-wide verdict.
message GetDeploymentStatusRequest {
  string deployment_id = 1;
  string environment_id = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

// DeploymentStatus is one deployment's status inside an environment-wide
// GetStatus answer.
message DeploymentStatus {
  controlplane.v1.Deployment deployment = 1;
  controlplane.v1.DeployVerdict verdict = 2;
  // One line explaining the verdict (forge's decision reason).
  string verdict_reason = 3;
  // The digest the platform wants running. Empty for tiers with no image.
  string desired_digest = 4;
  google.protobuf.Timestamp observed_at = 5;
  bool drifted = 6;
}

message GetDeploymentStatusResponse {
  Deployment deployment = 1;

  // DERIVED, not stored: true when the running image differs from the
  // declared one, or the observed run state differs from the declared one.
  // Computed server-side so every client badges drift the same way — two
  // clients each deriving it from the two halves is two chances to disagree
  // about what counts as drift.
  bool drifted = 2;

  // The release currently bound to this deployment's environment. Empty
  // before its first deploy.
  DeployPromotion current_promotion = 3;

  // When the observed half was last refreshed from the cluster. Lets the UI
  // say "as of 12s ago" instead of implying the numbers are live.
  google.protobuf.Timestamp observed_at = 4;

  // Fields 1-7 describe ONE deployment and are set only for a deployment_id
  // request.
  controlplane.v1.DeployVerdict verdict = 5;
  string verdict_reason = 6;
  string desired_digest = 7;

  // Every live deployment of the environment (the requested one alone for a
  // deployment_id request is NOT repeated here; this is set only for an
  // environment_id request).
  repeated DeploymentStatus deployments = 8;
  // Worst of the deployments' verdicts (degraded > diverged > unknown >
  // converging > converged). An empty environment is UNKNOWN. Set for both
  // request shapes: for a deployment_id request it is that deployment's
  // environment.
  controlplane.v1.DeployVerdict environment_verdict = 9;
  controlplane.v1.DeployReconcilePolicy reconcile_policy = 10;
}

// === Logs ===

message StreamDeploymentLogsRequest {
  string deployment_id = 1;
  DeployLogStream stream = 2;
  // Resume cursor: send only lines after this sequence. Zero (or absent)
  // means "start from the buffered snapshot".
  int64 after_sequence = 3;
  // Cap on the backlog delivered in the first response. Zero means the
  // server's default.
  int32 snapshot_limit = 4;
  // Stop after the backlog rather than tailing. What a "download logs" button
  // calls; a tailing stream that the client immediately closes looks like a
  // dropped connection to every metric that watches this RPC.
  bool no_follow = 5;
}

message StreamDeploymentLogsResponse {
  repeated DeployLogLine lines = 1;
  // Set on the first response only: these lines are the buffered backlog
  // rather than live tail. The UI scrolls to the bottom once, on this.
  bool is_snapshot = 2;
  // The highest sequence in this response — what to send as after_sequence on
  // reconnect.
  int64 latest_sequence = 3;
}

// === Releases and history ===

// CutReleaseRequest records a version label over artifacts that already
// exist in a registry.
//
// THE ARTIFACTS ARE DESCRIBED, NOT PRODUCED. Every field below names bytes
// the caller has already pushed: an OCI digest, an npm version plus its
// integrity hash. There is no build input here — no Dockerfile, no context,
// no build args — so this request cannot express "make me an image", and the
// server has no path that would.
//
// No org_id, like every other request on this service: the release belongs to
// the caller's own organization, resolved from their claims.
message CutReleaseRequest {
  // The human-readable label ("v1.4.0"). Unique within the caller's org —
  // re-cutting it identically is a successful retry, re-cutting it with
  // different artifacts is AlreadyExists.
  string version = 1;

  // The artifact set this version names. At least one is required: a release
  // that names nothing cannot be promoted, and recording one would put a
  // version in the picker that deploys an empty pin set.
  //
  // The digest/kind asymmetry is the DeployArtifact contract and is enforced
  // by the database: an OCI artifact requires a canonical sha256 digest and
  // nothing else may carry one; every other kind requires a version or a uri
  // by which a consumer could actually fetch it.
  repeated DeployArtifact artifacts = 2;

  // Source provenance, best-effort. What lets a reviewer tie a running digest
  // back to a commit — the first question asked during an incident. In CI
  // these come from the workflow's own commit context.
  string git_commit = 3;
  string git_tag = 4;
  bool git_dirty = 5;

  // The CI run that cut this release.
  DeployRun run = 6;

  // Full source provenance, superseding the three git_* fields above. The
  // server fills those from this when they are unset, so a caller sends one
  // and both old and new readers are satisfied.
  DeploySourceProvenance provenance = 7;

  // The forge project this version belongs to.
  //
  // Required for a release to be addressable alongside another project's
  // release of the same version in the same org — see DeployRelease.project.
  // EMPTY IS LEGACY: a caller that does not send it cuts into the
  // pre-project namespace, which is where every release cut before this field
  // existed lives.
  string project = 8;
  // Strict forge release.Release JSON. Exclusive with legacy artifact, git,
  // provenance and run fields; version/project must match this envelope.
  google.protobuf.Struct snapshot_release = 9;

  // The commits this release adds over the release it was cut after
  // (DeployRelease.commits). Recorded as the claim it is; not part of the
  // release's identity, so a retry with a different range is still a retry.
  DeployCommitRange commits = 10;

  // The migration directories the release embeds (DeployRelease.migrations).
  // Allowed beside snapshot_release, which forge sends WITHOUT it: the
  // snapshot document is decoded strictly into this server's pinned forge
  // Release, so the manifest rides here. A retry that carries one for a
  // release recorded without one fills it; it never replaces one.
  DeployMigrationManifest migrations = 11;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 12;
}

// RecordReleaseMigrationsRequest records the migration manifest of a release
// cut before forge recorded one (`forge env releases backfill-migrations`).
message RecordReleaseMigrationsRequest {
  string version = 1;
  // The forge project, as on CutReleaseRequest; empty is the legacy namespace.
  string project = 2;
  DeployMigrationManifest migrations = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message RecordReleaseMigrationsResponse {
  DeployRelease release = 1;
  // False when the release already recorded this same manifest: a retry.
  bool recorded = 2;
}

message CutReleaseResponse {
  DeployRelease release = 1;

  // False when this exact release had already been cut and this call changed
  // nothing. THE CALL STILL SUCCEEDS: a CI retry that re-states a release it
  // already recorded has achieved what it asked for, and answering it with an
  // error would make every retried workflow red for having been retried.
  //
  // Distinct from an error so a caller can still TELL the two apart — a
  // pipeline that cut a release it believed to be new, and learns it was not,
  // may legitimately want to say so in its summary.
  bool created = 2;
}

message CompareDeployReleasesRequest {
  // The release compared FROM (typically what the environment ran before) and
  // the one compared TO.
  string from_version = 1 [(buf.validate.field).string.min_len = 1];
  string to_version = 2 [(buf.validate.field).string.min_len = 1];
  // The forge project both belong to, resolved as GetRelease resolves it: a
  // version not found in the project falls back to the pre-project namespace.
  string project = 3;
  // The environment whose bundles the object comparison reads. A bundle is ONE
  // environment's render, and two environments render one release into
  // different objects, so there is no environment-free answer: unset leaves
  // objects.state NO_ENVIRONMENT and compares commits and artifacts only.
  string environment_id = 4;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 5;
}

message CompareDeployReleasesResponse {
  DeployRelease from = 1;
  DeployRelease to = 2;
  DeployCommitComparison commits = 3;
  // The artifacts whose identity differs, sorted by name: an image's digest
  // (one entry per variant of a variant image, "web[staging]"), a source
  // pin's commit, a package's version.
  repeated DeployArtifactChange artifacts = 4;
  // How many artifacts are the same in both.
  int32 unchanged_artifacts = 5;
  DeployObjectComparison objects = 6;
}

// DeployCommitComparison is the source history between two releases, composed
// from their recorded commit ranges.
message DeployCommitComparison {
  DeployCommitComparisonState state = 1;
  // True when `to` is the OLDER release: commits are then the ones `from` has
  // and `to` does not, which is what moving from -> to takes away.
  bool reverts = 2;
  // Newest first, at most 250.
  repeated DeployCommit commits = 3;
  // The number of commits between the two when every composed range could
  // count its own; 0 when one could not (a shallow-clone cut).
  int32 total = 4;
  // The list is not every commit between the two. Never render a truncated
  // comparison as complete.
  bool truncated = 5;
  // The versions whose recorded ranges were composed, newest first.
  repeated string releases = 6;
}

// How a DeployCommitComparison was assembled. Read it before the commits: an
// empty list means "nothing between them" only when COMPUTED.
enum DeployCommitComparisonState {
  DEPLOY_COMMIT_COMPARISON_STATE_UNSPECIFIED = 0;
  // The later release's range was walked back, base by base, to the earlier.
  DEPLOY_COMMIT_COMPARISON_STATE_COMPUTED = 1;
  // The two are one release.
  DEPLOY_COMMIT_COMPARISON_STATE_SAME = 2;
  // No base chain joins them (a shallow-clone cut, or one that predates
  // ranges): the commits recorded by the releases cut between them on the
  // later one's branch. Approximate; truncated when any of those ranges was.
  DEPLOY_COMMIT_COMPARISON_STATE_BY_CUT_TIME = 3;
  // Nothing between them recorded any commits.
  DEPLOY_COMMIT_COMPARISON_STATE_UNRECORDED = 4;
}

// How one artifact, object or object section differs between two releases.
enum DeployChangeKind {
  DEPLOY_CHANGE_KIND_UNSPECIFIED = 0;
  DEPLOY_CHANGE_KIND_ADDED = 1;
  DEPLOY_CHANGE_KIND_MODIFIED = 2;
  DEPLOY_CHANGE_KIND_REMOVED = 3;
}

message DeployArtifactChange {
  string name = 1;
  // The artifact kind: oci, npm, gomod, file, git.
  string kind = 2;
  DeployChangeKind change = 3;
  // The identity on each side: a digest, a commit, a version. Empty on the
  // side where the artifact does not exist.
  string from = 4;
  string to = 5;
}

// DeployObjectComparison is the Kubernetes-object half of a comparison: the
// two releases' bundles for one environment, object by object.
message DeployObjectComparison {
  DeployObjectComparisonState state = 1;
  // Why the objects were not compared, when they were not.
  string detail = 2;
  string environment_id = 3;
  // The bundles compared, when both were found.
  string from_bundle_digest = 4;
  string to_bundle_digest = 5;
  // Added, then modified, then removed; by object within each.
  repeated DeployObjectDelta deltas = 6;
  int32 unchanged = 7;
  // At least one bundle was recorded by a forge that wrote no per-object
  // summaries: objects are named without saying what they are or what in them
  // changed.
  bool summaries_missing = 8;
}

enum DeployObjectComparisonState {
  DEPLOY_OBJECT_COMPARISON_STATE_UNSPECIFIED = 0;
  DEPLOY_OBJECT_COMPARISON_STATE_COMPARED = 1;
  // The request named no environment.
  DEPLOY_OBJECT_COMPARISON_STATE_NO_ENVIRONMENT = 2;
  // The environment recorded no bundle for one of the releases (it never ran
  // there, or ran before bundles were recorded). detail names which.
  DEPLOY_OBJECT_COMPARISON_STATE_BUNDLE_MISSING = 3;
}

// DeployObjectDelta is one object the two bundles disagree on.
message DeployObjectDelta {
  DeployChangeKind change = 1;
  string cluster = 2;
  string kind = 3;
  string namespace = 4;
  string name = 5;
  // The forge workload the object belongs to, for grouping.
  string workload = 6;
  // One line: the object's own summary when it was added or removed
  // ("alerts DeployConvergeForcedReconcile"), and what changed when it was
  // modified ("image control-plane; env FORCE_RECONCILE removed").
  string summary = 7;
  // The release-bound images whose digest moved in this object.
  repeated DeployImageChange images = 8;
  // The sections that moved, when both bundles recorded them
  // ("api.env.FORCE_RECONCILE", "data.force_reconcile", "replicas").
  repeated DeployPartChange parts = 9;
}

message DeployImageChange {
  string artifact = 1;
  string from = 2;
  string to = 3;
}

message DeployPartChange {
  string part = 1;
  DeployChangeKind change = 2;
}

message ListDeployReleasesRequest {
  // All `optional` — see ListDeployEnvironmentsRequest.
  optional string version_contains = 1;
  optional string git_commit = 2;
  // Only releases that have been promoted to this environment at some point.
  optional string promoted_to_environment_id = 3;
  optional int32 limit = 4;
  // Exact match on the release's forge project. Unset lists every project's
  // releases; set to "" lists only the pre-project ones.
  optional string project = 5;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message ListDeployReleasesResponse {
  repeated DeployRelease releases = 1;
}

message GetDeployReleaseRequest {
  // Releases are addressed by version within the caller's org, because that
  // is what a human has in hand during an incident. The id is on the
  // response for anything that needs to round-trip it.
  string version = 1;

  // Which project's release, since a version is unique only within one — see
  // DeployRelease.project. A version not found in this project falls back to
  // the pre-project namespace ("") rather than 404ing, so a project that has
  // not re-cut anything since the field existed still resolves its history.
  string project = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetDeployReleaseResponse {
  DeployRelease release = 1;
  // Everywhere this release currently runs. The question "is this digest
  // still in prod?" is the one asked before anyone cleans up an image.
  repeated string current_environment_ids = 2;
}

message ListDeployPromotionsRequest {
  string environment_id = 1 [(buf.validate.field).required = true];
  // All `optional` — see ListDeployEnvironmentsRequest.
  optional DeployPromotionKind kind = 2;
  optional int32 limit = 3;

  // A KEYSET cursor: return the page of promotions strictly older than this
  // one. Take it from the previous response's next_before_promotion_id.
  //
  // Keyset rather than an offset because the ledger is append-only and read
  // newest-first, so a promote during paging shifts every offset by one and an
  // offset-paged reader would silently see a row twice or skip one. Scoped to
  // the caller's org, so a foreign cursor id yields an empty page rather than
  // an error that would confirm the row exists.
  optional string before_promotion_id = 4;

  // Only promotions of this release version.
  optional string release_version = 5;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message ListDeployPromotionsResponse {
  // Newest first.
  repeated DeployPromotion promotions = 1;

  // Pass as the next request's before_promotion_id. EMPTY MEANS THE LAST
  // PAGE — a reader stops on the empty string, not on a short page, because
  // a page can legitimately come back short.
  string next_before_promotion_id = 2;
}

// === Rollout, evidence and runs ===

message GetDeployRolloutRequest {
  string environment_id = 1;
  // Empty = the environment's current promotion.
  string promotion_id = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetDeployRolloutResponse {
  DeployRollout rollout = 1;
}

message RecordDeployGateRequest {
  string promotion_id = 1;
  // `recorded_by` and `recorded_at` on this gate are IGNORED: the server sets
  // them from the caller's identity. See DeployGate.
  DeployGate gate = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message RecordDeployGateResponse {
  DeployGate gate = 1;
  // False when the idempotency key (promotion_id, name, run_id) already held
  // this gate and the existing row is being returned. The call still succeeds:
  // a retried CI step has achieved what it asked for.
  bool created = 2;
}

message ListDeployGatesRequest {
  string promotion_id = 1 [(buf.validate.field).required = true];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message ListDeployGatesResponse {
  // Promote-time gates first, then the recorded ones oldest-first.
  repeated DeployGate gates = 1;
}

message GetDeployRunRequest {
  string run_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetDeployRunResponse {
  DeployRun run = 1;
  DeployRelease release = 2;
  // Ordered by started_at.
  repeated DeployRunStage stages = 3;
}

// === Usage ===

message ListDeployUsageRequest {
  // Window bounds. Both required — an unbounded usage query over a 90-day
  // rollup is a table scan a user did not ask for.
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;

  // All `optional` — see ListDeployEnvironmentsRequest.
  optional DeployResourceKind resource_kind = 3;
  optional string environment_id = 4;
  optional string deployment_id = 5;
  // Bucket size in seconds. Zero/absent means the server's rollup
  // granularity (hourly).
  optional int32 granularity_seconds = 6;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 7;
}

message ListDeployUsageResponse {
  repeated DeployUsageRow rows = 1;
  // Sum of cost_usd_nanos across the returned rows, so a client renders a
  // total without re-summing integers it may have narrowed to floats on the
  // way in.
  int64 total_cost_usd_nanos = 2;
}

// === Bundles ===

// RecordDeployBundleRequest carries the ARTIFACT, not a description of it.
//
// `manifest` and `config` are the bundle's actual bytes. The server derives
// the digest from the manifest, checks the manifest's config digest against
// the config blob, and reads the shape, provenance, config digest and release
// out of the decoded document — so there is no field here in which a caller
// could state a shape that differs from the bytes. See RecordBundle.
message RecordDeployBundleRequest {
  string environment_id = 1;

  // The OCI repository the artifact was pushed to.
  //
  // Checked, not trusted: it must be inside the tenant's own registry subtree
  // or the environment's declared BYO registry, and when it is the platform's
  // own registry the server HEADs the digest to confirm the bytes are really
  // there. A recorded bundle pointing at an absent or foreign artifact is a
  // ledger row that cannot be verified later, which is worse than a refusal
  // now.
  string repository = 2;

  // The OCI manifest bytes. Its sha256 IS the bundle's digest, derived here
  // rather than accepted from the caller.
  bytes manifest = 3;
  // The config blob the manifest points at — forge's bundle document, decoded
  // STRICTLY. Both blobs are capped at 1 MiB: a bundle is a render of a
  // project's config, and anything larger is a mistake or an attack rather
  // than a legitimate deploy.
  bytes config = 4;
  // The CI run that produced this render.
  DeployRun run = 5;
  // Compressed OCI manifests layer. Required for snapshot seals; capped at
  // 8 MiB, descriptor digest/size and exact snapshot inventory verified server-side.
  bytes manifests_layer = 6;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 7;
}

message RecordDeployBundleResponse {
  DeployBundle bundle = 1;
  // False when (environment, digest) already held this bundle. The call still
  // succeeds — the render is reproducible, so a re-run of an unchanged project
  // has achieved what it asked for.
  bool created = 2;
}

// Address a bundle by id, or by (environment_id, digest) — which is the pair a
// client holds after a render, before it has ever seen the row.
message GetDeployBundleRequest {
  string bundle_id = 1;
  string environment_id = 2;
  string digest = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message GetDeployBundleResponse {
  DeployBundle bundle = 1;
  // What the bundle declares for each of its workloads: kind, replicas,
  // resources, ports and environment variable names (never values). Sorted by
  // name. Empty for a bundle that declares no workloads.
  repeated DeclaredWorkload workloads = 2;
}

// === Convergences ===
//
// BeginDeployApply*, FinishDeployApply* and ListDeployApplies* are DELETED —
// see the ListConvergences RPC above for why "I am applying now" has no
// honest sender under the spec-driven model. What replaces them is one read
// over the observation timeline.

message ListDeployConvergencesRequest {
  string environment_id = 1 [(buf.validate.field).required = true];
  int32 limit = 2;
  // Keyset cursor: observations strictly older than this one. Keyset rather
  // than offset for ListDeployPromotionsRequest.before_promotion_id's reason.
  optional string before_id = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message ListDeployConvergencesResponse {
  // Newest first.
  repeated DeployConvergence convergences = 1;
}

// === Deploy attempts ===

message OpenDeployAttemptRequest {
  // Minted by forge (a UUID), stable across retries of this call.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The forge project (forge.yaml `name`); '' is a valid project.
  string project = 2 [(buf.validate.field).string.max_len = 200];
  string environment_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // apply | plan | rollback.
  string mode = 4 [(buf.validate.field).string = {
    in: [
      "apply",
      "plan",
      "rollback"
    ]
  }];
  // terminal | ci | console, or empty.
  string source = 5 [(buf.validate.field).string = {
    in: [
      "",
      "terminal",
      "ci",
      "console"
    ]
  }];
  // The release named on the command line, when one was.
  string release_version = 6 [(buf.validate.field).string.max_len = 200];
  // The CI run this invocation belongs to, when there is one.
  DeployRun run = 7;
  string forge_version = 8 [(buf.validate.field).string.max_len = 100];
  // Automation label (--actor). The human half is the credential.
  string started_by_actor = 9 [(buf.validate.field).string.max_len = 200];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 10;
}

message OpenDeployAttemptResponse {
  DeployAttempt attempt = 1;
}

message ReportDeployAttemptRequest {
  string id = 1 [(buf.validate.field).required = true];
  // The phase the attempt is in now. Empty keeps the current one; a name
  // different from the current one is appended to the attempt's phases.
  string phase = 2 [(buf.validate.field).string.max_len = 64];
  // Learned along the way; empty keeps what is recorded.
  string release_version = 3 [(buf.validate.field).string.max_len = 200];
  string promotion_id = 4 [(buf.validate.field).string.max_len = 128];
  // Output produced since the previous report. The server keeps a bounded
  // tail, so a client may send everything it has.
  string log_append = 5 [(buf.validate.field).string.max_len = 1048576];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message ReportDeployAttemptResponse {}

message CloseDeployAttemptRequest {
  string id = 1 [(buf.validate.field).required = true];
  // SUCCEEDED | FAILED | QUEUED | CANCELLED. RUNNING and ABANDONED are not
  // outcomes.
  DeployAttemptState outcome = 2 [(buf.validate.field).enum = {
    in: [
      2,
      3,
      4,
      5
    ]
  }];
  string failed_phase = 3 [(buf.validate.field).string.max_len = 64];
  string error_message = 4 [(buf.validate.field).string.max_len = 16384];
  int32 exit_code = 5;
  string release_version = 6 [(buf.validate.field).string.max_len = 200];
  string promotion_id = 7 [(buf.validate.field).string.max_len = 128];
  // forge's `--json` document, verbatim.
  string report_json = 8 [(buf.validate.field).string.max_len = 1048576];
  string log_append = 9 [(buf.validate.field).string.max_len = 1048576];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 10;
}

message CloseDeployAttemptResponse {
  DeployAttempt attempt = 1;
}

message ListDeployAttemptsRequest {
  string project = 1 [(buf.validate.field).string.max_len = 200];
  // One environment's attempts; unset lists the whole project.
  optional string environment_name = 2 [(buf.validate.field).string.max_len = 200];
  int32 limit = 3;
  // Keyset cursor: attempts strictly older than this one.
  optional string before_id = 4;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 5;
}

message ListDeployAttemptsResponse {
  // Newest first.
  repeated DeployAttempt attempts = 1;
}

message GetDeployAttemptRequest {
  string id = 1 [(buf.validate.field).required = true];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetDeployAttemptResponse {
  DeployAttempt attempt = 1;
  // The tail of the invocation's output (attempt.log_truncated says whether
  // the head was dropped).
  string log = 2;
  // forge's `--json` deploy document, when one was produced.
  string report_json = 3;
}

// === The Live view ===

message GetDeployLiveViewRequest {
  // The forge project (forge.yaml `name`). Live is per project, because that
  // is the unit a human thinks in: "my project's environments", not "every
  // environment my org has".
  string project = 1;
  // Include soft-deleted environments. Off by default — a retired environment
  // has history worth keeping and queryable, and no place on a Live screen.
  bool include_deleted = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetDeployLiveViewResponse {
  // Empty when the project has no environments. NOT an error: a project
  // nobody has deployed yet is a normal state.
  repeated DeployLiveEnvironment environments = 1;
}

// === Plans ===

message PlanDeployRequest {
  string environment_id = 1;
  // The candidate bundle — what would be applied.
  string bundle_id = 2;
  // The release whose pins this deploy would carry, when the plan covers a
  // promotion as well as a config change. Empty plans the config alone.
  string release_version = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message PlanDeployResponse {
  DeployPlan plan = 1;
  // Candidate bundle's exact composition identity; GetBundle supplies the
  // selected/build/carry decisions and independent consumer bindings for review.
  string snapshot_digest = 2;
}

// === Capacity pre-flight ===

// DeployCapacityDemand is what a deploy would run, summed across its objects.
// The client computes it from its render; the server re-derives it from the
// recorded bundle when it enforces, so this is never trusted for admission.
message DeployCapacityDemand {
  int64 cpu_millicores = 1;
  int64 memory_bytes = 2;
  int64 storage_gib = 3;
  // Services and jobs: anything that runs a pod.
  int32 workloads = 4;
  int32 databases = 5;
  int32 builds = 6;
  // Static sites this environment would hold. The server adds the org's
  // sites in OTHER environments, because the free tier is per org.
  int32 static_sites = 7;
  int64 static_storage_gib = 8;
}

message CheckDeployCapacityRequest {
  // The environment being deployed to. Its OTHER sites are excluded from the
  // org-wide static count so a redeploy does not count itself twice. Empty
  // means the environment does not exist yet (a first deploy): nothing is
  // excluded, and every static site the org already holds is counted.
  string environment_id = 1;
  DeployCapacityDemand demand = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

// DeployCapacityCode is why a verdict came out the way it did.
enum DeployCapacityCode {
  DEPLOY_CAPACITY_CODE_UNSPECIFIED = 0;
  DEPLOY_CAPACITY_CODE_OK = 1;
  // The deploy runs compute and the org has no active compute plan.
  DEPLOY_CAPACITY_CODE_NO_COMPUTE_PLAN = 2;
  // No plan, static sites only, beyond the free tier.
  DEPLOY_CAPACITY_CODE_STATIC_FREE_TIER_EXCEEDED = 3;
  // A plan exists and the demand does not fit its compute ceiling.
  DEPLOY_CAPACITY_CODE_EXCEEDS_CEILING = 4;
  // The org's spend cap has been reached.
  DEPLOY_CAPACITY_CODE_SPEND_CAP_REACHED = 5;
  // The plan could not be determined. Retry.
  DEPLOY_CAPACITY_CODE_PLAN_UNKNOWN = 6;
  // The org is an unclaimed (anonymous) deploy and the demand is outside the
  // claimable plan. Final: it is refused, never queued; the reason lists each
  // offence and the fix is to sign up. Same reason string forge raises itself.
  DEPLOY_CAPACITY_CODE_CLAIMABLE_INELIGIBLE = 7;
  // The demand fits the claimable plan but the platform will not take it right
  // now (compute is off, or the platform-wide ceiling is full). Retry later.
  DEPLOY_CAPACITY_CODE_CLAIMABLE_UNAVAILABLE = 8;
}

message CheckDeployCapacityResponse {
  bool allowed = 1;
  DeployCapacityCode code = 2;
  // One sentence: what was refused and why.
  string reason = 3;
  // The literal next step.
  string fix = 4;
  bool has_compute_plan = 5;
  // The compute ceiling that applied; zero without a plan.
  int64 ceiling_cpu_millicores = 6;
  int64 ceiling_memory_bytes = 7;
  int64 ceiling_storage_gib = 8;
  // Non-empty ⇔ allowed is false AND the deploy would be ACCEPTED and QUEUED
  // rather than refused (today: it needs billing the org has not set up). A
  // client proceeds — build, record, promote — and reports the queue; the
  // deploy then starts on its own when billing is set up. promotion_id and
  // held_since are empty here: nothing has been promoted yet. An older
  // control plane never sets this, so an older client keeps refusing.
  repeated controlplane.v1.DeployHold holds = 9;
}

// === Local sessions ===

// ReportLocalSessionRequest reports one `forge env up` worktree's presence.
//
// THE SECOND OBSERVED-STATE EXCEPTION — see the service header.
message ReportLocalSessionRequest {
  // Client-chosen and stable for the life of the session, so a re-report
  // updates rather than duplicating.
  string session_id = 1;
  // The environment is addressed by (project, environment) rather than by id,
  // because a developer running `forge env up` has their project's config in
  // hand and no reason to have resolved an id.
  string project = 2;
  string environment = 3;
  // Which checkout on which machine. The real upsert key — see
  // DeployWorktree for why presence is per worktree and not per user.
  DeployWorktree worktree = 4;
  DeploySourceProvenance provenance = 5;
  // The locally rendered bundle, by digest: a local render is never recorded
  // as a bundle row, so there is no id to name.
  string bundle_digest = 6;
  // running | stopped. `stopped` stamps stopped_at, which is what separates a
  // clean exit from a session that merely went quiet.
  string state = 7;
}

message ReportLocalSessionResponse {
  DeployLocalSession session = 1;
}

// === Ledger import ===

// ImportLedgerRequest carries a project's file-based deploy history.
//
// Every item is a TYPED message rather than a blob. A loose JSON import would
// make the file format the contract and the server a parser for whatever shape
// a given forge version happened to write; typed items mean a mismatch is an
// InvalidArgument at the boundary instead of a half-imported ledger.
message ImportLedgerRequest {
  string project = 1;
  repeated LedgerImportRelease releases = 2;
  repeated LedgerImportEnvironment environments = 3;
  repeated LedgerImportPromotion promotions = 4;
  repeated LedgerImportBundle bundles = 5;
  repeated LedgerImportApply applies = 6;

  // Where this history was read from, e.g. "git:origin/main". Recorded once
  // per import so the operation itself is auditable, not just its rows.
  string source = 7;

  // Return the plan and write nothing. The import is one transaction and is
  // idempotent, so a dry run is a convenience rather than a safety net — but
  // it is the convenience that lets an operator see "39 releases, 16
  // promotions, 3 environments" before committing to any of it.
  bool dry_run = 8;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 9;
}

// LedgerImportRelease is one historical release, preserved verbatim.
message LedgerImportRelease {
  string version = 1;
  repeated DeployArtifact artifacts = 2;
  // From the file's git block. The extended provenance fields are absent on
  // historical records and stay unset, which reads as "not recorded" rather
  // than as "clean".
  DeploySourceProvenance provenance = 3;
  // The release's original timestamp, set explicitly — an import must not
  // restamp history with the import's own clock.
  google.protobuf.Timestamp created_at = 4;
  // The idempotency key, e.g. "git:.forge/releases/v1.7.12.json@<blob sha>".
  // Keyed by CONTENTS rather than by filename, so a file whose name disagrees
  // with the version inside it imports as what it actually is.
  string imported_from = 5;

  // The commits the release recorded at its cut, when it did.
  DeployCommitRange commits = 6;
}

// LedgerImportEnvironment is one historical environment.
message LedgerImportEnvironment {
  string name = 1;
  // Historical environments import as SELF_MANAGED: their deploys were driven
  // by a client against a cluster the platform never observed, which is
  // exactly what that kind means. A PERSISTENT or PREVIEW environment is
  // refused — its history was always hosted, so there is nothing to import.
  DeployEnvironmentKind kind = 2;
  // Set for a retired environment, whose history is kept and queryable while
  // it is absent from Live and its name is not reserved.
  google.protobuf.Timestamp deleted_at = 3;
  string imported_from = 4;
}

// LedgerImportPromotion is one historical ledger entry.
message LedgerImportPromotion {
  // The environment NAME within the project, since an imported environment's
  // id is minted by this same transaction.
  string environment = 1;
  string release_version = 2;
  map<string, string> resolved_artifacts = 3;
  map<string, DeploySource> resolved_sources = 4;
  // The environment promoted FROM, by name. Empty for a first deploy.
  string from_environment = 5;
  repeated DeployGate gates = 6;
  string note = 7;

  // The actor string the FILE recorded, kept as provenance only.
  //
  // It is a label describing what the old record said, never an identity this
  // system treats as a principal — nothing authenticated it, and it may name
  // a person who was never a control-plane user. The promotion's actual
  // approver is the importing caller, set server-side. The UI renders both:
  // "imported: seanteeling, by <importing identity>".
  string promoted_by_actor = 8;

  // The original promotion time, set EXPLICITLY. Load-bearing rather than
  // cosmetic: promotions import in this order, and it is what makes the
  // reconstructed timeline match the one the files describe.
  google.protobuf.Timestamp promoted_at = 9;

  string imported_from = 10;

  // The FILE's promotion id, preserved verbatim.
  //
  // Required, and not minted server-side: forge's "N promotions never
  // imported" refusal compares the file's ids against the hosted ones, so a
  // re-minted id would make every imported promotion look un-imported forever
  // and `forge env deploy` would refuse a ledger that had in fact been
  // imported. It is also what makes a re-import recognise what it already
  // wrote.
  string id = 11;

  // The scope the promotion recorded (DeployPromotion.targets).
  repeated string targets = 12;
}

// LedgerImportBundle is one historical bundle. Empty for every project whose
// history predates bundles, which today is all of them — the field exists so
// an import from a newer forge is not lossy.
message LedgerImportBundle {
  string environment = 1;
  string release_version = 2;
  string digest = 3;
  string reference = 4;
  string config_digest = 5;
  google.protobuf.Struct shape = 6;
  DeploySourceProvenance provenance = 7;
  google.protobuf.Timestamp created_at = 8;
  string imported_from = 9;
}

// LedgerImportApply is one HISTORICAL apply, with its outcome already known —
// an imported apply is never in flight.
//
// IT SURVIVES THE DELETION OF THE APPLY MODEL, deliberately, because it means
// something different from everything else that was deleted. The live apply
// RPCs were a client claiming "I am applying now", which has no honest sender
// any more. This is an import of a ledger that ALREADY HAPPENED, under an older
// forge that really did apply — history, not a current claim. Refusing to
// import it would not make the past declarative; it would just lose it.
//
// Its outcome is therefore carried by a LOCAL message rather than the deleted
// DeployApplyOutcome. That keeps the import's shape stable while removing the
// live model's type, and it puts the "this is historical" statement on the
// type itself.
message LedgerImportApply {
  string environment = 1;
  string bundle_digest = 2;
  LedgerImportApplyOutcome outcome = 3;
  google.protobuf.Timestamp created_at = 4;
  string imported_from = 5;
}

// LedgerImportApplyOutcome is how a historical apply ended, as the ledger being
// imported recorded it.
//
// A REPORT, AND HISTORICAL ONE AT THAT — it describes what some older forge
// said about a deploy that has already finished. It never feeds billing or
// policy, and nothing derives current state from it; it exists so an import is
// not lossy.
message LedgerImportApplyOutcome {
  // succeeded | failed | timed_out.
  string status = 1;
  // One human line.
  string summary = 2;
  // Per-workload detail as the exporting forge recorded it. A Struct because
  // it is that forge's own shape, and a proto mirror could only disagree.
  google.protobuf.Struct workloads = 3;
  google.protobuf.Timestamp finished_at = 4;
  // Who the imported ledger says reported it. Carried as data rather than
  // being set from the caller's credential, because the caller is importing
  // somebody else's history and is not the reporter.
  string reported_by = 5;
}

message ImportLedgerResponse {
  // Per-kind counts of what was (or would be) written. A Struct because this
  // is a human-facing summary that grows with the import's own item kinds, and
  // a typed mirror of those kinds would need editing every time one is added.
  google.protobuf.Struct counts = 1;
  // What this import refuses to touch and why, one line each. A conflict is
  // reported rather than resolved: an environment that already holds a
  // non-imported promotion has two possible orderings and no way to choose
  // between them, so the operator decides.
  repeated string conflicts = 2;
}

// === Drift ===

message GetDeployDriftRequest {
  string environment_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetDeployDriftResponse {
  DeployDrift drift = 1;
}
