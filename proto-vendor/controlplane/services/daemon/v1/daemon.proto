syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/daemon/v1;daemonv1";

// === DaemonService ===

service DaemonService {
  rpc CreateDaemon(CreateDaemonRequest) returns (CreateDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc GetDaemon(GetDaemonRequest) returns (GetDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateDaemon(UpdateDaemonRequest) returns (UpdateDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc DeleteDaemon(DeleteDaemonRequest) returns (DeleteDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc SuspendDaemon(SuspendDaemonRequest) returns (SuspendDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc ResumeDaemon(ResumeDaemonRequest) returns (ResumeDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  // ResizeDaemon changes a MANAGED daemon's machine size — the one path that
  // does. The daemon must be SUSPENDED (FailedPrecondition otherwise): like
  // changing a cloud VM's instance type, the new size takes effect when the
  // machine next starts, because ResumeDaemon rebuilds the pod from the
  // re-stamped spec (size, CPU/memory, disk). Resizing a running machine is
  // therefore stop → resize → start, which the caller drives.
  //
  // The new size is gated exactly like CreateDaemon and ResumeDaemon
  // (svcdaemon.checkDaemonSizeAllowed), so a refusal here is the same refusal
  // the following resume would have produced. Resizing to the current size
  // is a successful no-op. Disks only grow: a downsize keeps the larger disk,
  // which is billed at its bound capacity.
  rpc ResizeDaemon(ResizeDaemonRequest) returns (ResizeDaemonResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  // GrowDaemonDisk grows a MANAGED daemon's one disk to storage_gib. Disk
  // above the org's pooled allowance is billed as storage. Disks only grow: a smaller target is InvalidArgument, the current
  // size is a successful no-op. Running or suspended: the cloud disk grows at
  // once, and a running machine uses the space after its next restart.
  //
  // Gated by the compute plan's max_daemon_storage_gib (PermissionDenied,
  // reason daemon_storage_denied, when the target exceeds it or the plan sets
  // none) and by the same funding ladder as create and resume. Design:
  // docs/design/workspace-disk-resize.md.
  rpc GrowDaemonDisk(GrowDaemonDiskRequest) returns (GrowDaemonDiskResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc SetPortAccess(SetPortAccessRequest) returns (SetPortAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc RemovePortAccess(RemovePortAccessRequest) returns (RemovePortAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
  rpc ListPortAccessRules(ListPortAccessRulesRequest) returns (ListPortAccessRulesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // SetDefaultPortAccess sets the workspace-level default port-access mode
  // (Daemon.default_port_access) — the policy the preview proxy applies to
  // ports that have no explicit PortAccessRule. Only the daemon owner may call
  // it. Only AUTHENTICATED and PUBLIC are valid; a PUBLIC default makes every
  // unruled listening port world-reachable by URL.
  rpc SetDefaultPortAccess(SetDefaultPortAccessRequest) returns (SetDefaultPortAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "reliant workspace surface (daemons, workspace projects, LLM keys), not a forge console change; audit_log records it"}
    };
  }
}

message CreateDaemonRequest {
  // Human-readable name for the new daemon. Unique per owner: a name the owner
  // already uses is ALREADY_EXISTS unless refresh_existing is set.
  string name = 1;
  DaemonType daemon_type = 2;
  // Managed daemon fields
  string image = 3;
  ResourceRequirements resources = 4;
  string git_repo = 5;
  string git_branch = 6;
  string storage_size = 7;
  // External daemon fields
  string hostname = 8;
  string platform = 9;
  // Daemon enhancements
  DaemonSize size = 10;
  string idle_timeout = 11; // duration string, e.g. "30m"
  // What to do when the owner already has a daemon with this name.
  //
  // Unset (a person pressing Create): the request fails with ALREADY_EXISTS,
  // so a second machine is never silently folded into the first. Set: the
  // existing managed daemon is refreshed (size, image, repo) and returned —
  // the retry-safe commit a flow that may run twice needs (onboarding names
  // its one machine and re-sends the create on every retry).
  bool refresh_existing = 12;
}

message CreateDaemonResponse {
  Daemon daemon = 1;
}

message GetDaemonRequest {
  string daemon_id = 1;
}

message GetDaemonResponse {
  Daemon daemon = 1;
  string workspace_base_domain = 2; // e.g. "workspaces.reliantapi.com"
}

message ListDaemonsRequest {
  optional DaemonType daemon_type = 1;
  optional DaemonStatus status = 2;
}

message ListDaemonsResponse {
  repeated Daemon daemons = 1;
}

message UpdateDaemonRequest {
  string daemon_id = 1;
  string new_name = 2;
  // image and resources were removed. Both wrote the row without a size gate
  // and were silently overwritten at the next create/resume re-stamp, so a
  // caller could neither rely on them nor be stopped by them. A machine's
  // resources are derived from its size; change the size with ResizeDaemon.
  reserved 3, 4;
  reserved "image", "resources";
  // env, when present, REPLACES the machine's environment variables (an
  // empty one clears them); absent leaves them as they are. Names Reliant
  // sets on every machine (DAEMON_*, RELIANT_*, WORKSPACE_*, PATH, HOME, the
  // proxy variables, ...) are refused. A running machine picks the new set
  // up the next time its pod is built: resume, resize or re-create.
  MachineEnv env = 5;
}

// MachineEnv is a managed machine's declared environment.
message MachineEnv {
  map<string, string> vars = 1;
}

message UpdateDaemonResponse {
  Daemon daemon = 1;
}

message DeleteDaemonRequest {
  string daemon_id = 1;
  bool snapshot_before_delete = 2;
}

message DeleteDaemonResponse {}

message SuspendDaemonRequest {
  string daemon_id = 1;
}

message SuspendDaemonResponse {
  Daemon daemon = 1;
}

message ResumeDaemonRequest {
  string daemon_id = 1;
}

message ResumeDaemonResponse {
  Daemon daemon = 1;
}

message ResizeDaemonRequest {
  string daemon_id = 1;
  // The new size. UNSPECIFIED is rejected (InvalidArgument).
  DaemonSize size = 2;
}

message ResizeDaemonResponse {
  Daemon daemon = 1;
}

message GrowDaemonDiskRequest {
  string daemon_id = 1;
  // The disk's new size in GiB: an absolute target, not a delta, so a retry
  // is safe. A multiple of 10, larger than the current size.
  int32 storage_gib = 2 [(buf.validate.field).int32.gt = 0];
}

message GrowDaemonDiskResponse {
  Daemon daemon = 1;
}

message SetPortAccessRequest {
  string daemon_id = 1;
  int32 port = 2;
  PortAccessMode access_mode = 3;
}

message SetPortAccessResponse {
  PortAccessRule rule = 1;
  string access_token = 2; // only populated when access_mode is TOKEN
}

message RemovePortAccessRequest {
  string daemon_id = 1;
  int32 port = 2;
}

message RemovePortAccessResponse {}

message ListPortAccessRulesRequest {
  string daemon_id = 1 [(buf.validate.field).required = true];
}

message ListPortAccessRulesResponse {
  repeated PortAccessRule rules = 1;
}

message SetDefaultPortAccessRequest {
  string daemon_id = 1;
  // default_access_mode must be PORT_ACCESS_MODE_AUTHENTICATED or
  // PORT_ACCESS_MODE_PUBLIC. TOKEN/UNSPECIFIED are rejected (a default has no
  // token to carry).
  PortAccessMode default_access_mode = 2;
}

message SetDefaultPortAccessResponse {
  // The updated daemon, with default_port_access reflecting the new value.
  Daemon daemon = 1;
}
