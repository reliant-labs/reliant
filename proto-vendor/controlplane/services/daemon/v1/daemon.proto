syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/daemon/v1;daemonv1";

// === DaemonService ===

service DaemonService {
  rpc CreateDaemon(CreateDaemonRequest) returns (CreateDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetDaemon(GetDaemonRequest) returns (GetDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateDaemon(UpdateDaemonRequest) returns (UpdateDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc DeleteDaemon(DeleteDaemonRequest) returns (DeleteDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SuspendDaemon(SuspendDaemonRequest) returns (SuspendDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ResumeDaemon(ResumeDaemonRequest) returns (ResumeDaemonResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SetPortAccess(SetPortAccessRequest) returns (SetPortAccessResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc RemovePortAccess(RemovePortAccessRequest) returns (RemovePortAccessResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListPortAccessRules(ListPortAccessRulesRequest) returns (ListPortAccessRulesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // SetDefaultPortAccess sets the workspace-level default port-access mode
  // (Daemon.default_port_access) — the policy the preview proxy applies to
  // ports that have no explicit PortAccessRule. Only the daemon owner may call
  // it. Only AUTHENTICATED and PUBLIC are valid; a PUBLIC default makes every
  // unruled listening port world-reachable by URL.
  rpc SetDefaultPortAccess(SetDefaultPortAccessRequest) returns (SetDefaultPortAccessResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
}

message CreateDaemonRequest {
  // Human-readable name for the new daemon. Used for display and for the
  // (owner, name) idempotency check inside CreateDaemon; not a lookup key.
  string name = 1;
  DaemonType daemon_type = 2;
  // Managed daemon fields
  string image = 3;
  ResourceRequirements resources = 4;
  string git_repo = 5;
  string git_branch = 6;
  string storage_size = 7;
  // External daemon fields
  string hostname = 8;
  string platform = 9;
  // Daemon enhancements
  DaemonSize size = 10;
  string idle_timeout = 11; // duration string, e.g. "30m"
}

message CreateDaemonResponse {
  Daemon daemon = 1;
}

message GetDaemonRequest {
  string daemon_id = 1;
}

message GetDaemonResponse {
  Daemon daemon = 1;
  string workspace_base_domain = 2; // e.g. "workspaces.reliantapi.com"
}

message ListDaemonsRequest {
  DaemonType daemon_type = 1;
  DaemonStatus status = 2;
}

message ListDaemonsResponse {
  repeated Daemon daemons = 1;
}

message UpdateDaemonRequest {
  string daemon_id = 1;
  string new_name = 2;
  string image = 3;
  ResourceRequirements resources = 4;
}

message UpdateDaemonResponse {
  Daemon daemon = 1;
}

message DeleteDaemonRequest {
  string daemon_id = 1;
  bool snapshot_before_delete = 2;
}

message DeleteDaemonResponse {}

message SuspendDaemonRequest {
  string daemon_id = 1;
}

message SuspendDaemonResponse {
  Daemon daemon = 1;
}

message ResumeDaemonRequest {
  string daemon_id = 1;
}

message ResumeDaemonResponse {
  Daemon daemon = 1;
}

message SetPortAccessRequest {
  string daemon_id = 1;
  int32 port = 2;
  PortAccessMode access_mode = 3;
}

message SetPortAccessResponse {
  PortAccessRule rule = 1;
  string access_token = 2; // only populated when access_mode is TOKEN
}

message RemovePortAccessRequest {
  string daemon_id = 1;
  int32 port = 2;
}

message RemovePortAccessResponse {}

message ListPortAccessRulesRequest {
  string daemon_id = 1;
}

message ListPortAccessRulesResponse {
  repeated PortAccessRule rules = 1;
}

message SetDefaultPortAccessRequest {
  string daemon_id = 1;
  // default_access_mode must be PORT_ACCESS_MODE_AUTHENTICATED or
  // PORT_ACCESS_MODE_PUBLIC. TOKEN/UNSPECIFIED are rejected (a default has no
  // token to carry).
  PortAccessMode default_access_mode = 2;
}

message SetDefaultPortAccessResponse {
  // The updated daemon, with default_port_access reflecting the new value.
  Daemon daemon = 1;
}
