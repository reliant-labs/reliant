syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/siteaudit/v1;siteauditv1";

// === SiteAuditService (controlplane.v1.SiteAuditService) ===
//
// Site insights: SEO and accessibility audits of a hosted static site. After
// each promotion of a hosted static frontend the control plane's site auditor
// crawls the environment's live site the way a search engine does (raw HTML,
// headers, robots.txt, the sitemap, link status), renders a capped number of
// pages in a headless browser for axe-core and the rendered-DOM SEO rules, and
// records the result: a score per category, each route's head facts, and
// every finding with its evidence and fix. Scoring is Lighthouse-compatible,
// not Lighthouse itself.
//
// A SITE IS (environment_id, frontend), NEVER A URL. The auditor crawls only
// the hostnames the platform serves for that frontend and its live custom
// domains, so this service cannot be turned into an open crawler. An
// unclaimed (claimable) deploy is never audited.
//
// The auditor launches dark: until it runs in an environment, audits stay
// QUEUED and the reads return no finished audit.
//
// ORG-SCOPED, FAILS CLOSED. Every request resolves the caller's org (the
// optional org_id names it, as on DeployService: a person must be a member, a
// machine credential may name only its own org). An environment, audit or
// frontend outside that org is NotFound.
//
// AUTHORIZATION, the deploy ledger's:
//   - ListSiteAudits and GetSiteAudit: deploy:read, as DeployService.GetStatus
//     (a person's grant, org-wide or bound to the environment; a machine
//     credential's scope, which an environment-bound credential holds only on
//     its environment).
//   - RunSiteAudit: deploy:write on the environment, as Promote.
//   Grants are re-read on every request.
service SiteAuditService {
  option (forge.v1.service) = {
    name: "SiteAuditService"
    version: "1.0.0"
    description: "SEO and accessibility audits of hosted static sites"
  };

  // ListSiteAudits lists one site's audits, newest first, without their
  // pages and findings.
  // forge:custom
  rpc ListSiteAudits(ListSiteAuditsRequest) returns (ListSiteAuditsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // GetSiteAudit returns one audit with its pages and findings, a summary of
  // the audit its deltas are taken against, and the org's remaining manual
  // audits today. Select it by id, or as the newest finished audit of a site
  // (optionally of one release).
  // forge:custom
  rpc GetSiteAudit(GetSiteAuditRequest) returns (GetSiteAuditResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // RunSiteAudit queues a manual audit of a site's served release.
  //
  // IDEMPOTENT WHILE ONE WAITS. A site has at most one queued audit: when one
  // is already queued or running, RunSiteAudit returns it (created = false)
  // and spends nothing.
  //
  // Each new manual audit spends one of the org's manual audits for the UTC
  // day (plan limit site_audit.manual_per_day). Past it the call fails
  // ResourceExhausted with reason SITE_AUDIT_QUOTA_EXHAUSTED, a Retry-After
  // header, and a SiteAuditQuotaExhausted detail carrying the reset time.
  rpc RunSiteAudit(RunSiteAuditRequest) returns (RunSiteAuditResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "run_site_audit"
        target: {
          kind: "environment"
          id: "environment_id"
        }
        detail: ["frontend"]
      }
    };
  }
}

// What enqueued an audit.
enum SiteAuditTrigger {
  SITE_AUDIT_TRIGGER_UNSPECIFIED = 0;
  // The frontend's served release changed (a promotion).
  SITE_AUDIT_TRIGGER_PROMOTION = 1;
  // A person asked (RunSiteAudit).
  SITE_AUDIT_TRIGGER_MANUAL = 2;
  // The weekly re-audit of a prod-serving environment.
  SITE_AUDIT_TRIGGER_SCHEDULED = 3;
}

// Where an audit is.
enum SiteAuditStatus {
  SITE_AUDIT_STATUS_UNSPECIFIED = 0;
  // Waiting for an auditor.
  SITE_AUDIT_STATUS_QUEUED = 1;
  // An auditor is crawling the site.
  SITE_AUDIT_STATUS_RUNNING = 2;
  // Finished; scores, pages and findings are recorded.
  SITE_AUDIT_STATUS_DONE = 3;
  // The audit could not finish; error says why.
  SITE_AUDIT_STATUS_FAILED = 4;
  // Not run: the org's daily audits were spent before it could be.
  SITE_AUDIT_STATUS_SKIPPED_QUOTA = 5;
}

// Which Site insights view a finding belongs to.
enum SiteAuditCategory {
  SITE_AUDIT_CATEGORY_UNSPECIFIED = 0;
  SITE_AUDIT_CATEGORY_SEO = 1;
  SITE_AUDIT_CATEGORY_ACCESSIBILITY = 2;
}

// One audit of one site.
message SiteAudit {
  string id = 1;
  string environment_id = 2;
  // The forge project the environment belongs to (forge.yaml name).
  string project = 3;
  // The static frontend audited (its forge.Frontend name).
  string frontend = 4;
  // The release version served when the audit was queued; empty when the
  // environment had none.
  string release = 5;
  SiteAuditTrigger trigger = 6;
  SiteAuditStatus status = 7;
  // The audit engine's rule set (forge pkg/siteaudit), so a score change
  // caused by new rules is told apart from one caused by the site.
  string rules_version = 8;
  // 0-100, Lighthouse-compatible. Unset until the pass that produces it has
  // run (accessibility needs the render pass).
  optional int32 seo_score = 9;
  optional int32 a11y_score = 10;
  int32 pages_fetched = 11;
  int32 pages_rendered = 12;
  // Why a FAILED audit failed; empty otherwise.
  string error = 13;
  google.protobuf.Timestamp queued_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
}

// One crawled route of an audit.
message SiteAuditPage {
  // The path crawled, from the site's root ("/", "/pricing").
  string route = 1;
  // The route's HTTP response status; 0 when it got no response.
  int32 http_status = 2;
  // Whether the headless render pass ran on it.
  bool rendered = 3;
  optional int32 seo_score = 4;
  optional int32 a11y_score = 5;
  // The route's extracted head facts (title, description, canonical, robots,
  // Open Graph and Twitter tags, JSON-LD types, hreflang), as the audit engine
  // reports them. Extracted facts only: the page itself is never stored.
  google.protobuf.Struct head = 6;
  // A short-lived signed URL of the auditor's stored og:image thumbnail (at
  // most 64 KB), so a client renders a social-card preview without loading a
  // tenant's URL. Empty when the route has none.
  string og_thumbnail_url = 7;
}

// One finding of an audit.
message SiteAuditFinding {
  SiteAuditCategory category = 1;
  // The audit engine's rule code ("meta_description_missing",
  // "color-contrast").
  string code = 2;
  // The engine's severity: for SEO error, warning or info; for accessibility
  // axe's impact, critical, serious, moderate or minor.
  string severity = 3;
  // The route it is on; empty for a site-level finding (robots.txt, the
  // sitemap).
  string route = 4;
  // The element or link it is about: a CSS selector, a URL.
  string ref = 5;
  // The engine's structured evidence (axe HTML snippets are truncated to 300
  // characters).
  google.protobuf.Struct evidence = 6;
  // The remedy, in words.
  string fix = 7;
}

// The audit a delta is taken against: the site's newest DONE audit of a
// different release queued before this one (or of any release, when this
// audit has none).
message SiteAuditSummary {
  string id = 1;
  string release = 2;
  optional int32 seo_score = 3;
  optional int32 a11y_score = 4;
  google.protobuf.Timestamp finished_at = 5;
}

// The org's site-audit allowance today (UTC). Every count resets at resets_at.
message SiteAuditQuota {
  // Manual audits (RunSiteAudit) per day, and how many are left.
  int32 manual_per_day = 1;
  int32 manual_remaining = 2;
  // Automatic audits (one per promotion) per day, and how many are left.
  int32 audits_per_day = 3;
  int32 audits_remaining = 4;
  google.protobuf.Timestamp resets_at = 5;
  // Whether the org has paid hosting (the larger allowance).
  bool paid = 6;
}

// The error detail of a RunSiteAudit refused for quota.
message SiteAuditQuotaExhausted {
  // The manual audits per day the org has spent.
  int32 manual_per_day = 1;
  // When the next manual audit is allowed.
  google.protobuf.Timestamp resets_at = 2;
}

message ListSiteAuditsRequest {
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  string frontend = 2 [(buf.validate.field).string.min_len = 1];
  // Audits per page. Default 20, max 100.
  int32 page_size = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  // next_page_token from the previous page; valid only with the same site.
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 5;
}

message ListSiteAuditsResponse {
  // Newest first.
  repeated SiteAudit audits = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// GetSiteAuditRequest selects an audit by id, or as a site's newest finished
// (DONE or FAILED) audit, of one release when release is set.
message GetSiteAuditRequest {
  oneof selector {
    option (buf.validate.oneof).required = true;
    string audit_id = 1 [(buf.validate.field).string.min_len = 1];
    SiteAuditLatest latest = 2;
  }
  // The org this request acts in. See ListSiteAuditsRequest.org_id.
  optional string org_id = 3;
}

// A site, and optionally one of its releases.
message SiteAuditLatest {
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  string frontend = 2 [(buf.validate.field).string.min_len = 1];
  optional string release = 3;
}

message GetSiteAuditResponse {
  // The audit. Unset for a `latest` selector when the site has no finished
  // audit yet (of that release); NotFound is only for an unknown audit_id or
  // site.
  SiteAudit audit = 1;
  repeated SiteAuditPage pages = 2;
  repeated SiteAuditFinding findings = 3;
  // The audit the deltas are taken against; unset when there is none.
  SiteAuditSummary previous = 4;
  // The site's queued or running audit, if any: one in progress beside the
  // finished one returned.
  SiteAudit in_progress = 5;
  SiteAuditQuota quota = 6;
}

message RunSiteAuditRequest {
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  string frontend = 2 [(buf.validate.field).string.min_len = 1];
  // The org this request acts in. See ListSiteAuditsRequest.org_id.
  optional string org_id = 3;
}

message RunSiteAuditResponse {
  string audit_id = 1;
  // False when an audit of the site was already queued or running: that one
  // is returned and no manual audit was spent.
  bool created = 2;
  SiteAudit audit = 3;
  // The allowance after this call.
  SiteAuditQuota quota = 4;
}
