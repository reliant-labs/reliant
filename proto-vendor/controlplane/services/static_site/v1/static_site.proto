syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/deploy.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/static_site/v1;static_sitev1";

// === StaticSiteService ===
//
// The hosting facts of ONE hosted static site (a frontend an environment
// serves from Reliant static hosting), for the console's site detail page:
// where it answers, what it serves, what it uses against the free allowance,
// and how the platform serves it.
//
// It is a READ MODEL over what already exists: the deployment row and its
// recorded spec, the promotion ledger, the hostname and custom-domain tables,
// the storage meter, the free hosting allowance (the same reader
// BillingService.GetFreeHostingStatus answers from), and the site's live
// build in the platform bucket. It owns no table.
//
// AUTHORITY: the same as DeployService.GetStatus. A member holding
// deploy:read for a person; deploy:read for a machine credential, which, if
// bound to an environment, reads only that one. The org a request acts in is
// its org_id (the console's selected org) or the caller's default org, and a
// person must be a member of it; an environment of another org is NotFound. A site of an unclaimed
// (claimable) org is never shown: it has no signed-in owner.
service StaticSiteService {
  option (forge.v1.service) = {
    name: "StaticSiteService"
    version: "1.0.0"
    description: "Hosting facts of a hosted static site: hostnames, release, usage against the free allowance, and serving configuration"
  };

  // GetStaticSite returns one hosted static site's hosting facts. A source
  // this server cannot read (no bucket configured, no storage measurement
  // yet) leaves its fields unset rather than failing the whole answer.
  rpc GetStaticSite(GetStaticSiteRequest) returns (GetStaticSiteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetStaticSiteTraffic returns one hosted static site's CDN traffic over a
  // range: a series and its totals (requests, cache hit ratio, bytes, 4xx and
  // 5xx rates), from the per-site traffic metrics the edge and the origin
  // write into the org's observability tenant. The history a range may reach
  // is capped by the org's plan: 7 days without paid hosting, 30 with it.
  // Same authority and refusals as GetStaticSite.
  rpc GetStaticSiteTraffic(GetStaticSiteTrafficRequest) returns (GetStaticSiteTrafficResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
}

message GetStaticSiteTrafficRequest {
  // The environment serving the site.
  string environment_id = 1;
  // The frontend's name, as for GetStaticSite.
  string frontend = 2;
  // How far back to read, ending now. UNSPECIFIED reads the last 24 hours.
  StaticSiteTrafficRange range = 3;
  // The org this request acts in. See GetStaticSiteRequest.org_id.
  optional string org_id = 4;
}

// The console's traffic ranges.
enum StaticSiteTrafficRange {
  STATIC_SITE_TRAFFIC_RANGE_UNSPECIFIED = 0;
  STATIC_SITE_TRAFFIC_RANGE_LAST_24_HOURS = 1;
  STATIC_SITE_TRAFFIC_RANGE_LAST_7_DAYS = 2;
  STATIC_SITE_TRAFFIC_RANGE_LAST_30_DAYS = 3;
}

message GetStaticSiteTrafficResponse {
  string environment_id = 1;
  string frontend = 2;
  // The range read: [start, end). start is later than the range asked for
  // when the org's plan keeps less history (history_clamped).
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  // The width of each point of the series.
  int64 step_seconds = 5;
  // One point per step from the step holding start up to end; a step with
  // no traffic is a point of zeros.
  repeated StaticSiteTrafficPoint points = 6;
  // The whole range.
  StaticSiteTrafficCounts totals = 7;
  // The days of history the org's plan keeps (7 without paid hosting, 30
  // with it).
  int32 history_days = 8;
  // True when the range asked for reaches past history_days and start was
  // moved up to it.
  bool history_clamped = 9;
}

message StaticSiteTrafficPoint {
  // The step's start.
  google.protobuf.Timestamp start = 1;
  StaticSiteTrafficCounts counts = 2;
}

// Traffic over a span, split by who answered: the CDN edge from its cache
// (a hit), or the origin (a miss).
message StaticSiteTrafficCounts {
  // Every request answered: cache_hits + cache_misses.
  int64 requests = 1;
  int64 cache_hits = 2;
  // Requests the origin answered. The edge's request log keeps only cache
  // hits, so the origin's own count stands for the misses; a request to a
  // host no CDN fronts is one too.
  int64 cache_misses = 3;
  // cache_hits / requests, i.e. edge hits over edge hits plus origin
  // requests. Unset when there were no requests.
  optional double cache_hit_ratio = 4;
  // Bytes sent: hit_bytes + miss_bytes. Traffic telemetry, not the bill:
  // the edge counts the response size it logged (body and headers), the
  // origin the body bytes it wrote.
  int64 bytes = 5;
  int64 hit_bytes = 6;
  int64 miss_bytes = 7;
  // Requests answered with a 4xx / 5xx status, from either side.
  int64 requests_4xx = 8;
  int64 requests_5xx = 9;
  // requests_4xx / requests and requests_5xx / requests; unset when there
  // were no requests.
  optional double rate_4xx = 10;
  optional double rate_5xx = 11;
}

message GetStaticSiteRequest {
  // The environment serving the site.
  string environment_id = 1;
  // The frontend's name, as the environment declares it (the StaticSite's
  // name; forge.Frontend `name`).
  string frontend = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetStaticSiteResponse {
  string environment_id = 1;
  string frontend = 2;
  // The deployment row serving the site (DeployService.GetStatus keys by it).
  string deployment_id = 3;
  // Every hostname the site answers on: its platform hostname first, then
  // each custom domain bound to it, by hostname.
  repeated StaticSiteHostname hostnames = 4;
  // The release the environment currently runs and the site's digest in it.
  StaticSiteRelease release = 5;
  // Storage and transfer, against the free allowance when it applies.
  StaticSiteUsage usage = 6;
  // How the platform serves the site.
  StaticSiteConfiguration configuration = 7;
}

message StaticSiteHostname {
  string hostname = 1;
  StaticSiteHostnameSource source = 2;
  // A custom domain's acquisition state; UNSPECIFIED for the platform
  // hostname, which is live once allocated.
  DeployCustomDomainState domain_state = 3;
}

enum StaticSiteHostnameSource {
  STATIC_SITE_HOSTNAME_SOURCE_UNSPECIFIED = 0;
  // The name the platform minted under its static base domain.
  STATIC_SITE_HOSTNAME_SOURCE_PLATFORM = 1;
  // A custom domain of the org, bound to this site.
  STATIC_SITE_HOSTNAME_SOURCE_CUSTOM = 2;
}

message StaticSiteRelease {
  // The release version the environment's newest promotion bound; empty
  // before the first promotion.
  string version = 1;
  // The site artifact's digest the deployment declares (sha256:…).
  string digest = 2;
  // The digest the static-site operator last confirmed serving. Differs from
  // digest while a sync is in flight; empty before the first sync.
  string served_digest = 3;
  // When that promotion was recorded.
  google.protobuf.Timestamp promoted_at = 4;
}

// How the site's org pays for static hosting, which decides what the usage
// limits mean.
enum StaticSiteHosting {
  // The org's plan could not be determined; limits are unset.
  STATIC_SITE_HOSTING_UNSPECIFIED = 0;
  // The org holds its founder's free static hosting allowance: the limits
  // are the free caps (internal/freehosting).
  STATIC_SITE_HOSTING_FREE = 1;
  // The org has paid hosting: usage is billed, and there are no free caps.
  // A transfer limit is set only when the org's plan declares one.
  STATIC_SITE_HOSTING_PAID = 2;
  // The org has no paid hosting and does not hold the free allowance (its
  // founder designated another org): new deploys here queue for billing.
  STATIC_SITE_HOSTING_NOT_COVERED = 3;
}

message StaticSiteUsage {
  StaticSiteHosting hosting = 1;
  // This site's stored bytes: its live release plus every retained release
  // archive, as the storage meter last measured them. Unset until measured.
  optional int64 storage_bytes = 2;
  // Per-site storage cap; 0 when none applies (paid hosting).
  int64 site_storage_limit_bytes = 3;
  // The org's static storage (every live site, retained releases included)
  // and its cap (0: none applies).
  int64 org_storage_bytes = 4;
  int64 org_storage_limit_bytes = 5;
  // False when some site of the org has no storage measurement yet; the org
  // storage figure is then a lower bound.
  bool org_storage_measured = 6;
  // The org's static transfer this UTC month and its cap (0: none applies).
  int64 org_transfer_bytes = 7;
  int64 org_transfer_limit_bytes = 8;
  // End of the current transfer period (the next UTC month's start).
  google.protobuf.Timestamp period_end = 9;
  // This site's transfer this UTC month, from its CDN traffic metrics (edge
  // hits plus origin answers; GetStaticSiteTraffic's bytes over the period).
  // Traffic telemetry, not the bill, which is metered per org and
  // environment. Unset when no traffic of the site has been recorded this
  // period, or the traffic metrics are not readable here.
  optional int64 site_transfer_bytes = 10;
}

// What the platform answers for a path the build has no file for.
enum StaticSiteNotFoundMode {
  // The live build could not be read; the mode is unknown.
  STATIC_SITE_NOT_FOUND_MODE_UNSPECIFIED = 0;
  // The build ships 404.html: an unknown path gets that page with a 404.
  STATIC_SITE_NOT_FOUND_MODE_NOT_FOUND_PAGE = 1;
  // No 404.html: an unknown route-shaped path gets index.html with a 200, so
  // a client-side router can draw it. A missing asset is still a 404.
  STATIC_SITE_NOT_FOUND_MODE_SPA_FALLBACK = 2;
}

message StaticSiteConfiguration {
  // The site's runtime config (config.js, window.__FORGE_CONFIG__) as the
  // deployment declares it: literal values. Public by nature: config.js is
  // served to every visitor.
  map<string, string> runtime_config = 1;
  // Runtime config entries the platform resolves to another workload's URL
  // when it renders config.js: key → that workload's name.
  map<string, string> runtime_config_workload_urls = 2;
  // The site's mount point ("" is the root, else e.g. "/docs").
  string base_path = 3;
  // The build's content-hashed asset directory ("assets", "_next/static");
  // empty when the build declares none.
  string asset_dir = 4;
  StaticSiteNotFoundMode not_found_mode = 5;
  // Rules the live build's _headers file declares, as the platform parses
  // it (lines it refuses are not counted). Unset when the build could not be
  // read; 0 when it ships no _headers.
  optional int32 headers_rules = 6;
  // Rules the live build's _redirects file declares, the same way.
  optional int32 redirect_rules = 7;
}
