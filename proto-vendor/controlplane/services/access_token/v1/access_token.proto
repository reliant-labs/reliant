syntax = "proto3";

// AccessTokenService is the PUBLIC half of the ONE machine-credential system:
// every credential Reliant issues is an `rlat_` access token
// (controlplane.access_tokens), distinguished by scopes and an optional
// resource binding. It replaces DeployTokenService and every per-family
// minting RPC the retired credential families had (reliant daemon/API PATs,
// connector credentials, LLM keys, port tokens).
//
// Callers are HUMANS (a Supabase/Zitadel session). They mint, list and revoke
// tokens for their org (CreateToken / ListTokens / RevokeToken) and for
// themselves (the *MyToken RPCs). A machine credential calling any of these is
// refused structurally, and every mint runs forge/pkg/accesstoken's grant rule.
//
// The internal-service half (token validation and minting on a user's behalf
// for trusted services) lives in a separate, non-exported service directory,
// so the public contract carries no stub for it.
package controlplane.v1;

import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/access_token/v1;access_tokenv1";

service AccessTokenService {
  // CreateToken mints an ORG automation token (no acting user) — CI deploy,
  // secret management. Caller: an org admin's human session.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create"
        target: {
          kind: "access_token"
          id: "response.token.id"
          label: "response.token.name"
        }
      }
    };
  }
  // ListTokens lists the caller org's tokens. Never a plaintext.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // RevokeToken revokes one of the caller org's tokens, immediately.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "revoke"
        target: {
          kind: "access_token"
          id: "id"
          label: "response.token.name"
        }
      }
    };
  }

  // CreateMyToken mints a token that ACTS AS THE CALLER — a CLI token
  // (reliant:api), a daemon credential (daemon:connect), an LLM key
  // (llm:invoke). Caller: a human session. The org is the caller's primary org.
  rpc CreateMyToken(CreateMyTokenRequest) returns (CreateMyTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create"
        target: {
          kind: "access_token"
          id: "response.token.id"
          label: "response.token.name"
        }
        detail: ["ephemeral"]
      }
    };
  }
  // ListMyTokens lists tokens acting as the caller.
  rpc ListMyTokens(ListMyTokensRequest) returns (ListMyTokensResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // RevokeMyToken revokes one of the caller's own tokens.
  rpc RevokeMyToken(RevokeMyTokenRequest) returns (RevokeMyTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "revoke"
        target: {
          kind: "access_token"
          id: "id"
        }
      }
    };
  }
  // UpdateMyToken changes one of the caller's own tokens' name and scopes.
  //
  // The SECRET IS NEVER REISSUED: editing a live daemon's permissions must
  // not require re-registering it, which is the whole point. New scopes are
  // checked against the caller's org permissions exactly as a mint is, so
  // editing is never a way to widen past what the user holds. Rotation is
  // deliberately not an operation here — it is mint-new plus revoke-old.
  // For a daemon-bound token a scope edit ONLY NARROWS, atomically persisting
  // a per-daemon ceiling that also clips existing helpers and future renewals.
  // Label-only edits and revocation leave that ceiling alone. To restore full
  // authority explicitly ResetDaemonScopePolicy, then reissue via user login.
  rpc UpdateMyToken(UpdateMyTokenRequest) returns (UpdateMyTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "update"
        target: {
          kind: "access_token"
          id: "id"
          label: "response.token.name"
        }
      }
    };
  }

  // ResetDaemonScopePolicy explicitly restores full user-granted defaults for
  // FUTURE credentials of one owned daemon. User session only. Existing token
  // scope sets are never widened: reissue through authenticated login afterwards.
  // Renewal, label edits and token revocation never reset this durable policy.
  rpc ResetDaemonScopePolicy(ResetDaemonScopePolicyRequest) returns (ResetDaemonScopePolicyResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "reset"
        target: {
          kind: "daemon_scope_policy"
          id: "daemon_id"
        }
      }
    };
  }

  // ExchangeToken attenuates a machine credential acting as a person to a
  // short-lived helper. It NEVER widens: requested scopes must be explicitly
  // held by the caller (not merely implied by write), exchangeable, and still
  // held by the acting user in the credential's own org. A narrowed credential
  // must be reissued through authenticated user login to regain permissions.
  // Caller must hold deploy:write. The result lives at most an hour, never
  // outlives the caller, and inherits its user, org and resource binding.
  // All org capabilities may ride a daemon binding, including cluster:manage.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "mints a short-lived session token for the CLI; audit_log records it"}
    };
  }

  // ── MEMBER PERMISSIONS ──────────────────────────────────────────────
  //
  // What a PERSON may do in the org, and therefore the most a token acting
  // as them may carry. These replaced the single admin check: "admin" is now
  // a PRESET (the full set), not a level that implies authority.
  //
  // Both are gated on holding token:write — the permission to administer
  // permissions. That is deliberately the same grant that lets you mint org
  // credentials, because the two are equivalent in power: anyone who can
  // grant themselves deploy:write can already mint a token carrying it.

  // ListOrgMemberGrants lists every member of the caller's org with the
  // permissions they hold. Caller: a human session holding token:read.
  rpc ListOrgMemberGrants(ListOrgMemberGrantsRequest) returns (ListOrgMemberGrantsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // UpdateOrgMemberGrants replaces one member's permission set.
  //
  // CLIPPED TO THE CALLER: you cannot grant a permission you do not hold
  // yourself, which is what stops permission administration from being a
  // path to every other permission.
  rpc UpdateOrgMemberGrants(UpdateOrgMemberGrantsRequest) returns (UpdateOrgMemberGrantsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "set_grants"
        target: {
          kind: "member"
          id: "user_id"
        }
      }
    };
  }
}

// OrgMemberGrants is one member and the org permissions they hold.
message OrgMemberGrants {
  string user_id = 1;
  string email = 2;
  // role is the membership role, for display only. Authority comes from
  // scopes; a role is no longer consulted by any permission check.
  string role = 3;
  // scopes are the permissions held, from the same vocabulary as a token's
  // (forge/pkg/accesstoken).
  repeated string scopes = 4;
}

message ListOrgMemberGrantsRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message ListOrgMemberGrantsResponse {
  repeated OrgMemberGrants members = 1;
  // grantable is what the CALLER may hand out — their own permission set. The
  // UI renders anything outside it as disabled rather than letting a member
  // attempt an edit the server will refuse.
  repeated string grantable = 2;
}

message UpdateOrgMemberGrantsRequest {
  string user_id = 1;
  // scopes is the member's COMPLETE new set, not a delta: a permission absent
  // here is revoked. Replacing the whole set makes the request idempotent and
  // means a concurrent edit cannot merge into a combination nobody chose.
  repeated string scopes = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message UpdateOrgMemberGrantsResponse {
  OrgMemberGrants member = 1;
}

// ResourceBinding confines a token to one resource. kind is one of
// "daemon" | "port" | "connector" (forge/pkg/accesstoken.AllResourceKinds).
message ResourceBinding {
  string kind = 1;
  string id = 2;
}

message AccessToken {
  string id = 1;
  string name = 2;
  // display_prefix ("rlat_A3f9Kd2p") identifies the token without the secret.
  string display_prefix = 3;
  // scopes is the authority the token holds as of this response. For a
  // wildcard credential (all_scopes) that is the wildcard resolved now —
  // every scope its acting user holds on its binding, under any ceiling set
  // on its daemon — never the floor stored on the row. A revoked token holds
  // nothing; it lists the scopes it was minted with, for the audit trail.
  repeated string scopes = 4;
  string created_by_user_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp last_used_at = 8;
  google.protobuf.Timestamp revoked_at = 9;
  string org_id = 10;
  // acting_user_id is empty for an org automation token.
  string acting_user_id = 11;
  ResourceBinding resource = 12;
  bool ephemeral = 13;
  // all_scopes marks a daemon credential, which holds every scope its acting
  // user holds INCLUDING scopes added after this response: scopes is a
  // snapshot of a set that follows the person's grants. A UI shows it as "all
  // permissions". Saving scopes back unchanged (UpdateMyToken) keeps the
  // wildcard; removing any scope turns it into exactly the list submitted.
  bool all_scopes = 14;
}

message CreateTokenRequest {
  string name = 1;
  repeated string scopes = 2;
  google.protobuf.Timestamp expires_at = 3;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message CreateTokenResponse {
  AccessToken token = 1;
  // secret is the plaintext, returned exactly once.
  string secret = 2;
}

message ListTokensRequest {
  optional bool include_revoked = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message ListTokensResponse {
  repeated AccessToken tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message RevokeTokenResponse {
  AccessToken token = 1;
}

message CreateMyTokenRequest {
  // name is the token's label. For per-device kinds (llm:invoke) it is the
  // device name, and minting REPLACES that device's previous token of the same
  // scope set atomically.
  string name = 1;
  repeated string scopes = 2;
  google.protobuf.Timestamp expires_at = 3;
  ResourceBinding resource = 4;
  bool ephemeral = 5;
  // rotate replaces the caller's live token(s) with this name and scope set.
  bool rotate = 6;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 7;
}

message CreateMyTokenResponse {
  AccessToken token = 1;
  string secret = 2;
  // rotated is true when rotate was set and a previous live token with this
  // name and scope set was replaced (revoked) by this mint.
  bool rotated = 3;
}

message ListMyTokensRequest {
  optional bool include_revoked = 1;
  // scope, when set, restricts to tokens holding it: matched against the
  // scopes each token LISTS, so a wildcard credential matches every scope it
  // resolves to, not only the floor stored on its row.
  optional string scope = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message ListMyTokensResponse {
  repeated AccessToken tokens = 1;
}

message RevokeMyTokenRequest {
  string id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message RevokeMyTokenResponse {}

message ResetDaemonScopePolicyRequest {
  string daemon_id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}
message ResetDaemonScopePolicyResponse {}

message UpdateMyTokenRequest {
  string id = 1;
  // name replaces the token's label when set. Absent leaves it unchanged —
  // distinct from present-and-empty, which an operator never wants and the
  // handler rejects.
  optional string name = 2;
  // scopes REPLACES the token's authority when set. The whole set is
  // submitted, not a delta: the UI edits a checkbox list, and expressing
  // that as a diff makes two concurrent edits resolve to a union neither
  // operator chose.
  repeated string scopes = 3;
  // update_scopes distinguishes "leave the scopes alone" from "set them to
  // the empty list". Without it a request omitting scopes is indistinguishable
  // from one clearing them, and a token with no scopes cannot be minted at
  // all (accesstoken.NewSet refuses it).
  //
  // On a wildcard credential (AccessToken.all_scopes) a set covering
  // everything it holds now keeps the wildcard, so a save of the list as
  // shown changes nothing; a set that removes any scope replaces the wildcard
  // with exactly that list.
  bool update_scopes = 4;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 5;
}

message UpdateMyTokenResponse {
  AccessToken token = 1;
}

message ExchangeTokenRequest {
  // scopes requested; must be non-empty. Anything not exchangeable is dropped,
  // anything the acting user does not hold is dropped, and the response says
  // what was granted.
  repeated string scopes = 1;
}

message ExchangeTokenResponse {
  AccessToken token = 1;
  // secret is the plaintext, returned exactly once.
  string secret = 2;
}
