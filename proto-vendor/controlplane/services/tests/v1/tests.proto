syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/tests/v1;testsv1";

// === TestsService (controlplane.v1.TestsService) ===
//
// The test record of a forge project: test results, coverage and flaky tests,
// per commit, branch, release and environment. forge records each lane of a
// project's own test suite (`forge test capture`) and uploads it with
// RecordTestRun; the console's Tests pages and `forge test
// coverage|runs|flakes` read it back. Design: forge
// docs/proposals/tests-coverage-flakes.md, section 2.
//
// THE CONTROL PLANE MERGES, THE CLIENT ONLY UPLOADS. RecordTestRun stores the
// bytes it is sent and returns at once. A sandboxed ingest worker parses them
// with forge's pkg/testreport (an upload is untrusted input), writes the case
// rows, recomputes the commit's report (the merge of every run uploaded for
// that commit's clean tree, across lanes and shards), and scores flakes. So a
// run is readable as soon as it is recorded, and its counts and coverage fill
// in when ingest finishes (TestRunIngestState).
//
// NO SOURCE CODE IS STORED OR SERVED. Coverage holds repo-relative paths,
// positions, hit counts and each covered file's git blob id, never source
// text. A viewer that shows source fetches the blob by its id from the
// project's linked GitHub repository at view time (reliant's
// GetCoverageSource); without one it shows line numbers and hit counts.
//
// ORG-SCOPED, FAILS CLOSED. Every request resolves the caller's org (the
// optional org_id names it, as on DeployService: a person must be a member, a
// machine credential may name only its own org) and every read is scoped to
// it. A project, run, release or test outside that org is NotFound, so
// existence is not revealed.
//
// AUTHORIZATION.
//   - RecordTestRun needs tests:write (forge accesstoken.ScopeTestsWrite, a
//     narrow upload scope a pull request's CI job holds) or deploy:write (so a
//     deploying CI needs no second token) for a machine credential, and the
//     role CutRelease needs for a person.
//   - Every read needs tests:read (forge accesstoken.ScopeTestsRead), which no
//     deploy scope implies: a test's failure output can quote config, request
//     bodies and log lines. The control plane grants it to every deploy:read
//     holder. A token bound to an environment reads only the runs recorded
//     against that environment.
//   - An rpc with no scope mapping is refused for a machine credential.
//   Grants are re-read on every request.
//
// QUARANTINE AND ISSUE SETTINGS ARE NEVER WRITTEN HERE. They are the
// project's forge.yaml (`tests.flakes`), changed in a pull request; this
// service reads the quarantine entries the default branch reports.
service TestsService {
  // --- Writes (forge CLI; tests:write or deploy:write) ----------------

  // RecordTestRun records one lane's run on one tree: its results, and
  // optionally its coverage and the changed line ranges diff coverage needs.
  //
  // THE REQUEST CARRIES THE DOCUMENTS' OWN BYTES. The server decompresses
  // each part when its encoding says so, re-derives its digest and binds it
  // to the run. It does not parse them in the request: the ingest worker
  // does, in a sandbox.
  //
  // Idempotent on the results digest within the project: re-recording the
  // same results answers created=false with the run already recorded.
  //
  // Limits: 32 MiB as sent across every part (gzip is required for a part
  // over 1 MiB), 200,000 cases. A larger upload is refused with the reason
  // (InvalidArgument), never truncated.
  //
  // The first run of a project that never cut a release registers the
  // project's identity, under the rule CutRelease uses.
  //
  // A control plane without this rpc answers Unimplemented; forge then
  // keeps its local record and says this control plane does not store test
  // runs yet.
  rpc RecordTestRun(RecordTestRunRequest) returns (RecordTestRunResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {none: "records evidence about a commit's tests; telemetry-like, one per CI lane run"}
    };
  }

  // --- Reads (tests:read) ---------------------------------------------

  // GetTestSummary returns one branch's test health (the default branch
  // unless one is named): the newest commit report, its coverage trend over
  // recent commits with release markers, the pass rate over the last runs,
  // the flaky and quarantined counts and the last run. The console's Tests
  // Overview and the project Overview's Tests card read it.
  rpc GetTestSummary(GetTestSummaryRequest) returns (GetTestSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListTestRuns lists recorded runs of one project, newest first. Every
  // filter is optional. Paged.
  //
  // forge:custom — a run is not an entity of the generic CRUD kit: it is
  // recorded by RecordTestRun and read through the org-scoped, grant-checked
  // reads of this service.
  rpc ListTestRuns(ListTestRunsRequest) returns (ListTestRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetTestRun returns one run: its totals, its failures with their output,
  // its retry passes, its slowest tests and the packages it ran that
  // recorded no test (zero evidence, the verify-test-run rule).
  //
  // forge:custom — see ListTestRuns.
  rpc GetTestRun(GetTestRunRequest) returns (GetTestRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetCoverage returns the coverage of one commit, release or environment
  // under one path: the totals of that path and each of its children
  // (packages or directories, then files), with statements, combined and
  // per-lane coverage and, when a base is named, diff coverage.
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetFileCoverage returns one file's coverage line by line: hits per lane,
  // whether a line is partly covered, and whether it changed against the
  // base. Never source text: it returns the file's git blob id, which a
  // viewer fetches from the linked repository.
  rpc GetFileCoverage(GetFileCoverageRequest) returns (GetFileCoverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetReleaseTests returns the test report of a release's commit, and what
  // changed against the previous release of the same project: the coverage
  // delta, new failures and new flaky tests. Release detail's Tests tab and
  // the releases list's Tests column read it.
  rpc GetReleaseTests(GetReleaseTestsRequest) returns (GetReleaseTestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListFlakyTests lists the project's tests that are, or were, flaky, by
  // flake state. Every filter is optional. Paged.
  rpc ListFlakyTests(ListFlakyTestsRequest) returns (ListFlakyTestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetTest returns one test: its outcomes over its last runs, its flake
  // state and events, its failure signatures grouped, and its quarantine
  // entry and issue.
  rpc GetTest(GetTestRequest) returns (GetTestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // HasCoverageBlob reports whether a git blob id appears in any retained
  // report of the project in the caller's org. It is how a source viewer
  // (reliant's GetCoverageSource) refuses to fetch an arbitrary blob from the
  // linked repository: only a blob some retained report names may be read, so
  // tests:read never becomes a way to read any repository file. Another org's
  // project is NotFound.
  rpc HasCoverageBlob(HasCoverageBlobRequest) returns (HasCoverageBlobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      // Its name has no read verb, so the activity lint reads it from the
      // NO_SIDE_EFFECTS marker alone; say so where a stale descriptor
      // cannot lose it.
      activity: {none: "reads only: answers whether a retained report names a blob, changes nothing"}
    };
  }
}

// === Enums ===

// TestPayloadEncoding is how an uploaded part (TestUploadPart.data) is
// encoded on the wire. The digest is always that of the decoded document.
enum TestPayloadEncoding {
  // Treated as IDENTITY.
  TEST_PAYLOAD_ENCODING_UNSPECIFIED = 0;
  // The document's bytes as they are. Refused for a part over 1 MiB.
  TEST_PAYLOAD_ENCODING_IDENTITY = 1;
  // The document gzip-compressed (RFC 1952).
  TEST_PAYLOAD_ENCODING_GZIP = 2;
}

// TestRunSource is where a run was produced.
enum TestRunSource {
  TEST_RUN_SOURCE_UNSPECIFIED = 0;
  // A CI job (TestRunCI names it).
  TEST_RUN_SOURCE_CI = 1;
  // A developer's machine, on a clean tree (`forge test report --upload`).
  TEST_RUN_SOURCE_LOCAL = 2;
  // Against a running environment, a preview's e2e lane say
  // (RecordTestRunRequest.environment_id names it).
  TEST_RUN_SOURCE_ENV = 3;
  // A rerun of a red run's failed tests, to classify them (`forge test
  // flakes confirm`, lane "confirm").
  TEST_RUN_SOURCE_CONFIRM = 4;
}

// TestRunCIProvenance says who vouches for a run's CI fields (TestRunCI, and
// TestRunSummary's ci_repository, ci_ref, ci_sha and ci_event).
enum TestRunCIProvenance {
  TEST_RUN_CI_PROVENANCE_UNSPECIFIED = 0;
  // The uploader said so, and nothing checked it: every run a hand-minted
  // token or a person records.
  TEST_RUN_CI_PROVENANCE_ASSERTED = 1;
  // The claims of a verified GitHub Actions ID token, which the uploading
  // credential was exchanged for (AccessTokenService.ExchangeFederatedToken).
  // The run's ci (provider "github", run_id, run_url, attempt) is derived from
  // the claims too, whatever the upload said.
  TEST_RUN_CI_PROVENANCE_GITHUB_OIDC = 2;
}

// TestRunOutcome is a run's verdict, as forge's `test report` exit codes
// define it. Coverage never decides it.
enum TestRunOutcome {
  TEST_RUN_OUTCOME_UNSPECIFIED = 0;
  // Every test the run recorded passed.
  TEST_RUN_OUTCOME_PASSED = 1;
  // At least one test failed.
  TEST_RUN_OUTCOME_FAILED = 2;
  // The run cannot be judged: no results, zero evidence, or results that
  // could not be parsed.
  TEST_RUN_OUTCOME_UNDETERMINED = 3;
}

// TestRunIngestState is how far the ingest worker has processed a run.
enum TestRunIngestState {
  TEST_RUN_INGEST_STATE_UNSPECIFIED = 0;
  // Recorded, not yet parsed: the run's counts and coverage are not in yet.
  TEST_RUN_INGEST_STATE_PENDING = 1;
  // Parsed; its cases, coverage and flake events are in the record.
  TEST_RUN_INGEST_STATE_INGESTED = 2;
  // Parsing failed or was refused (a limit, a malformed document). The
  // bytes are kept for a later parser fix; TestRunSummary.ingest_error
  // says why.
  TEST_RUN_INGEST_STATE_FAILED = 3;
}

// TestCaseStatus is one test case's result in one run.
enum TestCaseStatus {
  TEST_CASE_STATUS_UNSPECIFIED = 0;
  TEST_CASE_STATUS_PASS = 1;
  TEST_CASE_STATUS_FAIL = 2;
  TEST_CASE_STATUS_SKIP = 3;
}

// TestQuarantineMode is forge.yaml `tests.flakes.quarantine`.
enum TestQuarantineMode {
  // Treated as SUGGEST.
  TEST_QUARANTINE_MODE_UNSPECIFIED = 0;
  // Show the quarantine command; never make one (the default).
  TEST_QUARANTINE_MODE_SUGGEST = 1;
  // Open the quarantine pull request (a `ci/quarantine/...` file) through
  // the project's GitHub connection.
  TEST_QUARANTINE_MODE_PR = 2;
}

// TestFlakeState is a test's flake state (forge pkg/testreport).
enum TestFlakeState {
  TEST_FLAKE_STATE_UNSPECIFIED = 0;
  // No confirmed event in the window: the state a test returns to.
  TEST_FLAKE_STATE_HEALTHY = 1;
  // One confirmed event. The actionable state where the delete-on-first-flake
  // policy applies; 14 days with no event returns it to HEALTHY.
  TEST_FLAKE_STATE_SUSPECTED = 2;
  // Two or more confirmed events on distinct commits in 30 days (same-commit
  // bursts count once).
  TEST_FLAKE_STATE_FLAKY = 3;
  // A quarantine entry for it exists on the default branch.
  TEST_FLAKE_STATE_QUARANTINED = 4;
  // Was FLAKY; its file changed and 14 days passed with no event.
  TEST_FLAKE_STATE_FIXED = 5;
  // Was FLAKY or QUARANTINED, and no longer appears in runs.
  TEST_FLAKE_STATE_REMOVED = 6;
}

// TestFlakeSignal is what detected a flake event.
enum TestFlakeSignal {
  TEST_FLAKE_SIGNAL_UNSPECIFIED = 0;
  // Passed in one run and failed in another on the same tree hash.
  TEST_FLAKE_SIGNAL_SAME_TREE = 1;
  // Failed, then passed on a retry within one run.
  TEST_FLAKE_SIGNAL_RETRY_PASS = 2;
  // A confirm rerun of a red run's failure (TEST_RUN_SOURCE_CONFIRM).
  TEST_FLAKE_SIGNAL_CONFIRM = 3;
  // Flips on the default branch over its history.
  TEST_FLAKE_SIGNAL_HISTORY = 4;
}

// TestFlakeVerdict classifies one failure (forge pkg/testreport.Verdict).
// Only CONFIRMED scores toward a flake state.
enum TestFlakeVerdict {
  TEST_FLAKE_VERDICT_UNSPECIFIED = 0;
  // Failed, then passed on the same tree: a flake.
  TEST_FLAKE_VERDICT_CONFIRMED = 1;
  // Failed again on rerun: a real failure.
  TEST_FLAKE_VERDICT_REAL = 2;
  // The output reports a data race: a bug, never counted as a flake.
  TEST_FLAKE_VERDICT_RACED = 3;
  // The rerun could not run (a build failure, a timeout).
  TEST_FLAKE_VERDICT_INCONCLUSIVE = 4;
  // The failure could not be tied to a test.
  TEST_FLAKE_VERDICT_UNATTRIBUTED = 5;
  // The failure matches a host signature (a network or download error,
  // toomanyrequests, ENOSPC or quota, address already in use, a docker CLI
  // timeout, `panic: test timed out` under load), matched before scoring.
  // Never scored; reported as host health.
  TEST_FLAKE_VERDICT_HOST = 6;
  // One of three or more failures in one run sharing a package, a harness
  // or a signature: together they are one infra event
  // (TestFlakeEvent.infra_group), and the same co-failing set on a later
  // commit is the same event. Never scored per test.
  TEST_FLAKE_VERDICT_CORRELATED = 7;
}

// TestEvidenceStatus is how complete a release's test evidence is.
enum TestEvidenceStatus {
  TEST_EVIDENCE_STATUS_UNSPECIFIED = 0;
  // The release commit has a report with results.
  TEST_EVIDENCE_STATUS_OK = 1;
  // It has a report, but some lanes are missing or a run failed ingest;
  // reason says which.
  TEST_EVIDENCE_STATUS_PARTIAL = 2;
  // No run was recorded for the release's commit; reason says why.
  TEST_EVIDENCE_STATUS_UNAVAILABLE = 3;
}

// TestCoverageNodeKind is what a GetCoverage child is.
enum TestCoverageNodeKind {
  TEST_COVERAGE_NODE_KIND_UNSPECIFIED = 0;
  // A Go package.
  TEST_COVERAGE_NODE_KIND_PACKAGE = 1;
  // A directory (TypeScript, or a directory above Go packages).
  TEST_COVERAGE_NODE_KIND_DIRECTORY = 2;
  // A file; GetFileCoverage reads it.
  TEST_COVERAGE_NODE_KIND_FILE = 3;
}

// === Shared messages ===

// TestKey identifies one test: (language, package, name). Subtests are
// recorded; flake scoring and quarantine address the top-level test.
message TestKey {
  // "<lang>:<package>:<name>", for example
  // "go:github.com/acme/shop/internal/billing:TestRefund/partial". The
  // GetTest address.
  string id = 1;
  // "go" | "ts" | another runner's language.
  string lang = 2;
  // The Go import path, or the TypeScript file's directory.
  string package = 3;
  // The test name, subtest path included.
  string name = 4;
  // Where it is declared, repo-relative, when known.
  string file = 5;
  int32 line = 6;
}

// TestTotals counts a run's or a report's test cases.
message TestTotals {
  int64 passed = 1;
  int64 failed = 2;
  int64 skipped = 3;
  // Failed at least once, then passed on a retry within the run.
  int64 retry_passed = 4;
}

// TestRunCI names the CI job that produced a run.
message TestRunCI {
  // "github-actions" | "gitlab" | "buildkite" | ...
  string provider = 1 [(buf.validate.field).string.max_len = 64];
  // The provider's id of the run.
  string run_id = 2 [(buf.validate.field).string.max_len = 256];
  string run_url = 3 [(buf.validate.field).string.max_len = 2048];
  // The provider's attempt number of a re-run, from 1.
  int32 attempt = 4 [(buf.validate.field).int32.gte = 0];
}

// TestFlakePolicy is forge.yaml `tests.flakes`: what the product does about
// a flaky test on the project's behalf. Both are off by default; forge,
// control-plane and reliant turn both on, and then act at SUSPECTED.
message TestFlakePolicy {
  // `tests.flakes.issues: true`: file or update one `flake:suspected` issue
  // per suspected or flaky test, and close it when the test leaves those
  // states.
  bool issues = 1;
  // `tests.flakes.quarantine`.
  TestQuarantineMode quarantine = 2 [(buf.validate.field).enum.defined_only = true];
}

// TestStatementCoverage is covered over instrumented statements. With
// granularity "line" (LCOV, Cobertura) a line counts as one statement.
message TestStatementCoverage {
  int64 statements = 1;
  int64 covered = 2;
  // covered / statements × 100; 0 when there are no statements.
  double percent = 3;
}

// TestDiffCoverage is coverage of the executable lines changed between the
// base and the commit.
message TestDiffCoverage {
  // The base commit the diff was taken against.
  string base_sha = 1;
  // Executable lines changed.
  int64 lines = 2;
  int64 covered = 3;
  double percent = 4;
}

// TestLanguageCoverage is one language's share. Languages are kept apart: a Go
// statement and a TypeScript statement are not the same unit.
message TestLanguageCoverage {
  string lang = 1;
  TestStatementCoverage combined = 2;
  // Per lane ("unit", "integration", "e2e", ...).
  map<string, TestStatementCoverage> lanes = 3;
}

// TestCoverage is the coverage of a commit report, or of a path in one.
message TestCoverage {
  // "statement" (Go, istanbul) or "line" (only LCOV or Cobertura input).
  string granularity = 1;
  // A statement counts as covered if any lane covered it. Across languages
  // this is weighted by statements and labelled so (languages below).
  TestStatementCoverage combined = 2;
  // Per lane.
  map<string, TestStatementCoverage> lanes = 3;
  // Statements no unit or integration test reaches, only e2e.
  TestStatementCoverage only_e2e = 4;
  // Per language.
  repeated TestLanguageCoverage languages = 5;
  // Combined percent minus the base commit report's. Unset when the base has
  // no report (base_has_report false): never computed against an older one.
  optional double delta_percent = 6;
  bool base_has_report = 7;
  // Unset when no base was given or no changed ranges were uploaded.
  TestDiffCoverage diff = 8;
  // Generated code (gen/, *_gen.go, mock_gen.go, *.pb.go, *-hooks.ts,
  // forge's ownership record) is left out of every figure above by default;
  // its statement count is reported here.
  int64 excluded_generated_statements = 9;
}

// TestCommitReport is the accumulated report of one commit's clean tree: the
// merge of every run recorded for it, which grows as runs arrive.
message TestCommitReport {
  string git_commit = 1;
  string tree_hash = 2;
  // The lanes merged so far, so "62%, unit only" is never mistaken for a full
  // figure.
  repeated string lanes = 3;
  int32 run_count = 4;
  TestTotals totals = 5;
  TestCoverage coverage = 6;
  // "sha256:<hex>" of the merged coverage document.
  string report_digest = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// TestRunSummary is one recorded run, as lists show it.
message TestRunSummary {
  string run_id = 1;
  string project = 2;
  string git_commit = 3;
  string tree_hash = 4;
  bool dirty = 5;
  string branch = 6;
  string base_sha = 7;
  string lane = 8;
  TestRunSource source = 9;
  // Set for a run recorded against an environment.
  string environment_id = 10;
  TestRunCI ci = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
  // The lane command's own exit code.
  int32 exit_code = 14;
  // UNDETERMINED until ingest finishes.
  TestRunOutcome outcome = 15;
  TestRunIngestState ingest_state = 16;
  // When ingest_state is FAILED: why, one line.
  string ingest_error = 17;
  TestTotals totals = 18;
  // Combined coverage of this run alone. Unset when it carried none.
  optional double coverage_percent = 19;
  string forge_version = 20;
  // Who recorded it: the token's name, or the person.
  string uploaded_by = 21;
  google.protobuf.Timestamp created_at = 22;
  // Who vouches for the run's CI fields. Output only: the server sets it
  // from the uploading credential, never from the request.
  // forge:read-only
  TestRunCIProvenance ci_provenance = 23;
  // The verified repository (owner/name), ref ("refs/heads/main"), commit
  // and triggering event ("push", "pull_request", ...): set only when
  // ci_provenance is GITHUB_OIDC, empty otherwise. Output only. ci_sha is
  // the commit the workflow ran on, which for a pull_request event is
  // GitHub's merge commit, not necessarily git_commit.
  // forge:read-only
  string ci_repository = 24;
  // forge:read-only
  string ci_ref = 25;
  // forge:read-only
  string ci_sha = 26;
  // forge:read-only
  string ci_event = 27;
}

// TestReleaseMarker places a release on a coverage trend.
message TestReleaseMarker {
  string release_version = 1;
  string git_commit = 2;
  google.protobuf.Timestamp cut_at = 3;
}

// TestCoveragePoint is one commit on a coverage trend.
message TestCoveragePoint {
  string git_commit = 1;
  google.protobuf.Timestamp at = 2;
  double combined_percent = 3;
  // Per lane.
  map<string, double> lanes_percent = 4;
}

// TestPackageCoverage is one package's coverage in a commit report.
message TestPackageCoverage {
  // The Go import path's repo-relative directory, or a TypeScript directory.
  string path = 1;
  string lang = 2;
  TestStatementCoverage combined = 3;
  map<string, TestStatementCoverage> lanes = 4;
  // Combined percent minus the base report's, when it has one.
  optional double delta_percent = 5;
}

// TestQuarantine is a test's quarantine entry on the default branch
// (`ci/quarantine/<lang>/<package dir>/<Test>.yaml`).
message TestQuarantine {
  // The entry's repo-relative path.
  string path = 1;
  string issue_url = 2;
  string reason = 3;
  string signature = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Past expires_at: still applied, reported as overdue.
  bool overdue = 6;
}

// TestFlake is one test's flake record.
message TestFlake {
  TestKey test = 1;
  TestFlakeState state = 2;
  // The flake rate: the Wilson lower bound (95%) of commits with a confirmed
  // event over commits with runs, in the last 30 days of the default branch.
  // A ranking shown with its n, not a trigger.
  double score = 3;
  // The rate's n: completed default-branch runs of the test's lane in which
  // the test ran, cancelled runs excluded.
  int64 score_runs = 4;
  // Confirmed events on distinct commits in the last 30 days.
  int32 confirmed_events_30d = 5;
  // The signals that detected its events.
  repeated TestFlakeSignal signals = 6;
  google.protobuf.Timestamp first_seen_at = 7;
  google.protobuf.Timestamp last_event_at = 8;
  google.protobuf.Timestamp quarantined_at = 9;
  // Set when a quarantine entry exists.
  TestQuarantine quarantine = 10;
  // The flake issue, when the project files them.
  string issue_url = 11;
}

// TestFlakeEvent is one event that drove a flake state.
message TestFlakeEvent {
  TestFlakeSignal signal = 1;
  TestFlakeVerdict verdict = 2;
  string git_commit = 3;
  // The runs the event was detected across.
  repeated string run_ids = 4;
  // The sha256 of the normalised failure output.
  string failure_signature = 5;
  google.protobuf.Timestamp at = 6;
  // When verdict is CORRELATED: the infra event this failure belongs to,
  // shared by the co-failing tests and by the same set on a later commit.
  string infra_group = 7;
}

// TestUploadPart is one document of an upload.
message TestUploadPart {
  // The document's bytes, encoded as `encoding` says.
  bytes data = 1 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 33554432
  ];
  TestPayloadEncoding encoding = 2 [(buf.validate.field).enum.defined_only = true];
  // The document's format: "forge.test.results/v1", "forge.test.coverage/v1"
  // or "forge.test.diff/v1" (forge's normalised documents), or a raw input
  // forge ingests ("go-json", "junit", "vitest", "go-coverprofile", "lcov",
  // "cobertura", "istanbul"). Checked against the decoded document by ingest.
  string format = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
}

// === Writes ===

message RecordTestRunRequest {
  // The forge project, as on CutReleaseRequest. Required: test runs are
  // recorded per project.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The full commit sha the run tested.
  string git_commit = 2 [
    (buf.validate.field).string.min_len = 40,
    (buf.validate.field).string.max_len = 64
  ];
  // The git tree hash of the tested tree. Lanes merge only when their tree
  // hashes are equal.
  string tree_hash = 3 [
    (buf.validate.field).string.min_len = 40,
    (buf.validate.field).string.max_len = 64
  ];
  // The tree had uncommitted changes: the run is recorded, and merges only
  // with runs on the same dirty state, never into the commit's report.
  bool dirty = 4;
  string branch = 5 [(buf.validate.field).string.max_len = 256];
  // The pull request's base sha, or the merge base with the default branch.
  string base_sha = 6 [(buf.validate.field).string.max_len = 64];
  // The lane: "unit", "integration", "e2e", "frontend", "confirm", ...
  string lane = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  TestRunSource source = 8 [(buf.validate.field).enum.defined_only = true];
  // The environment the run tested against (a preview's e2e lane). It must
  // be an environment of the project in the caller's org.
  optional string environment_id = 9 [(buf.validate.field).string.max_len = 128];
  TestRunCI ci = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  // The lane command's own exit code.
  int32 exit_code = 13;
  // The forge that captured the run.
  string forge_version = 14 [(buf.validate.field).string.max_len = 128];

  // The results document. Required.
  TestUploadPart results = 15 [(buf.validate.field).required = true];
  // The coverage document, with a repo-relative path and git blob id per
  // covered file. Unset when the lane recorded no coverage.
  TestUploadPart coverage = 16;
  // The changed line ranges between base_sha and git_commit, which diff
  // coverage needs (the server has no checkout).
  TestUploadPart diff = 17;

  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 18;

  // The project's forge.yaml `tests.flakes`, as the forge that captured the
  // run read it. It travels with every upload because these settings are
  // forge.yaml, never written through this API. The daily flake sweep acts
  // on the newest ingested default-branch run's policy: unset (an older
  // forge) is the default, which files no issue and opens no pull request.
  TestFlakePolicy flake_policy = 19;
  // The Go module path of the project's root go.mod, when it has one. A
  // flake issue's title and a quarantine entry's path name a package
  // relative to it (forge internal/testflakes IssueTitle and EntryPath), so
  // without it the sweep files nothing for the project's Go tests.
  string go_module = 20 [(buf.validate.field).string.max_len = 512];
}

message RecordTestRunResponse {
  string run_id = 1;
  // False when this project already had a run with these results: a retry.
  // The call still succeeds and names that run.
  bool created = 2;
  // "sha256:<hex>" of each decoded part, derived by the server. Empty for a
  // part not sent.
  string results_digest = 3;
  string coverage_digest = 4;
  string diff_digest = 5;
  // PENDING for a new run.
  TestRunIngestState ingest_state = 6;
  // The run's page in the console.
  string url = 7;
}

// === Reads ===

message GetTestSummaryRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The branch. Unset: the project's default branch.
  optional string branch = 2 [(buf.validate.field).string.max_len = 256];
  // Only runs recorded against this environment. Unset: every run the
  // caller may read.
  optional string environment_id = 3 [(buf.validate.field).string.max_len = 128];
  // Commits on the coverage trend. Default 50, max 400.
  int32 trend_points = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 400
  ];
  // Runs the pass rate is taken over. Default 50, max 500.
  int32 pass_rate_runs = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message GetTestSummaryResponse {
  // The branch summarised (the default branch when the request named none).
  string branch = 1;
  // The newest commit report on the branch. Unset when none exists.
  TestCommitReport latest = 2;
  // Oldest first.
  repeated TestCoveragePoint coverage_trend = 3;
  // Releases cut from commits on the trend.
  repeated TestReleaseMarker release_markers = 4;
  // Runs passed over runs judged, among the newest pass_rate_runs runs.
  double pass_rate = 5;
  // The n of pass_rate.
  int32 pass_rate_runs = 6;
  int32 suspected_count = 7;
  int32 flaky_count = 8;
  int32 quarantined_count = 9;
  // Unset when no run was recorded.
  TestRunSummary last_run = 10;
  // The lowest-covered packages among those changed in recent commits,
  // lowest first.
  repeated TestPackageCoverage low_coverage_packages = 11;
  // Failures classified HOST in the last 30 days: host health, never scored.
  int32 host_failures_30d = 12;
  // Those failures rolled up per host signature, by signature (forge
  // pkg/testreport.HostHealth).
  repeated TestHostHealth host_health = 13;
}

// TestHostHealth is the failures one host signature caused: never scored as
// flakes, reported so a flaky host is fixed rather than its tests deleted.
message TestHostHealth {
  // The host rule's name: "network", "disk", "port", "registry", ...
  string signature = 1;
  // Host events with this signature.
  int32 events = 2;
  // The runs they happened in, in first-seen order.
  repeated string runs = 3;
  // The top-level tests that failed this way (TestKey.id), sorted.
  repeated string tests = 4;
}

message ListTestRunsRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Every filter below is `optional`: unset means no filter.
  optional string branch = 2 [(buf.validate.field).string.max_len = 256];
  optional string git_commit = 3 [(buf.validate.field).string.max_len = 64];
  // The runs of this release's commit.
  optional string release_version = 4 [(buf.validate.field).string.max_len = 256];
  optional string environment_id = 5 [(buf.validate.field).string.max_len = 128];
  optional string lane = 6 [(buf.validate.field).string.max_len = 64];
  optional TestRunSource source = 7 [(buf.validate.field).enum.defined_only = true];
  optional TestRunOutcome outcome = 8 [(buf.validate.field).enum.defined_only = true];
  // Rows per page. Default 50, max 500.
  int32 page_size = 9 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
  // next_page_token from the previous page; valid only with the same request.
  string page_token = 10 [(buf.validate.field).string.max_len = 512];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 11;
}

message ListTestRunsResponse {
  // Newest first.
  repeated TestRunSummary runs = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // Runs matching the request's filters across every page. Unset when the
  // server did not count them.
  optional int64 total_count = 3;
}

message GetTestRunRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string run_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

// TestFailure is one failed test case of a run.
message TestFailure {
  TestKey test = 1;
  // The failure output, scrubbed of known secret shapes and truncated to
  // 8 KiB.
  string output = 2;
  // Where it failed, repo-relative, when the output says.
  string file = 3;
  int32 line = 4;
  // The sha256 of the normalised output; failures sharing it group.
  string failure_signature = 5;
  int32 attempts = 6;
  // How ingest classified it, when a classification exists.
  TestFlakeVerdict verdict = 7;
  // When verdict is CORRELATED: the infra event this failure belongs to
  // (TestFlakeEvent.infra_group), so a run's correlated failures group.
  string infra_group = 8;
}

// TestTiming is one test's duration in a run.
message TestTiming {
  TestKey test = 1;
  int64 duration_ms = 2;
}

message GetTestRunResponse {
  TestRunSummary run = 1;
  repeated TestFailure failures = 2;
  // Tests that failed and then passed on a retry within the run.
  repeated TestKey retry_passes = 3;
  // The slowest tests, slowest first.
  repeated TestTiming slowest = 4;
  // Packages the run ran that recorded no test.
  repeated string zero_evidence_packages = 5;
  // Packages the run ran. A test in one of them with no failure, skip or
  // retry recorded passed.
  int32 package_count = 6;
}

message GetCoverageRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Whose coverage. Required.
  oneof target {
    option (buf.validate.oneof).required = true;
    // A commit's report.
    string git_commit = 2 [(buf.validate.field).string.max_len = 64];
    // The report of a release's commit.
    string release_version = 3 [(buf.validate.field).string.max_len = 256];
    // The report of the commit of the environment's current release.
    string environment_id = 4 [(buf.validate.field).string.max_len = 128];
  }
  // Only this lane's coverage. Unset: combined, with every lane beside it.
  optional string lane = 5 [(buf.validate.field).string.max_len = 64];
  // The path whose children to return, repo-relative ("" is the root).
  string path = 6 [(buf.validate.field).string.max_len = 4096];
  // Compute diff coverage and the delta against this base commit.
  optional string base_sha = 7 [(buf.validate.field).string.max_len = 64];
  // Only statements no unit or integration test reaches, only e2e.
  bool only_e2e = 8;
  // Only children holding a line changed against base_sha.
  bool changed_only = 9;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 10;
}

// TestCoverageNode is one child of a GetCoverage path.
message TestCoverageNode {
  // Repo-relative.
  string path = 1;
  TestCoverageNodeKind kind = 2;
  string lang = 3;
  TestStatementCoverage combined = 4;
  map<string, TestStatementCoverage> lanes = 5;
  // Unset without a base.
  TestDiffCoverage diff = 6;
  // It holds a line changed against the base.
  bool changed = 7;
  // A FILE whose blob_id came from an uncommitted working tree: the blob is
  // in no commit, so there is no source to fetch ("uncommitted", not "gone").
  // Only a dirty run's coverage has such files; commit reports merge clean
  // trees only. Always false for packages and directories.
  bool dirty = 8;
}

message GetCoverageResponse {
  // The commit whose report answered (resolved from a release or an
  // environment).
  string git_commit = 1;
  string tree_hash = 2;
  // The lanes in the report so far.
  repeated string lanes = 3;
  string path = 4;
  // The path's own totals.
  TestCoverage coverage = 5;
  // Packages or directories first, then files, by path.
  repeated TestCoverageNode children = 6;
}

message GetFileCoverageRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Whose coverage. Required.
  oneof target {
    option (buf.validate.oneof).required = true;
    string git_commit = 2 [(buf.validate.field).string.max_len = 64];
    string release_version = 3 [(buf.validate.field).string.max_len = 256];
    string environment_id = 4 [(buf.validate.field).string.max_len = 128];
  }
  // The file, repo-relative. Required.
  string path = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
  // Mark the lines changed against this base commit.
  optional string base_sha = 6 [(buf.validate.field).string.max_len = 64];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 7;
}

// TestLineCoverage is one line of a file that holds at least one statement.
message TestLineCoverage {
  // From 1.
  int32 line = 1;
  // Statement blocks that start on this line.
  int32 statements = 2;
  // Hits per lane. A lane absent here did not reach the line.
  map<string, int64> hits = 3;
  // Some, not all, of the statements on the line were covered.
  bool partial = 4;
  // Changed against the base.
  bool changed = 5;
}

message GetFileCoverageResponse {
  string git_commit = 1;
  // Repo-relative.
  string path = 2;
  // The Go import path form of the file, as Go's profile names it. Empty for
  // other languages.
  string import_path = 3;
  // The git blob id of the file the tests ran on (sha1 of "blob <len>\0" +
  // content). A viewer fetches source by it; a blob in no commit (the run had
  // uncommitted changes) has none to fetch. Never source text.
  string blob_id = 4;
  string lang = 5;
  // "statement" or "line".
  string granularity = 6;
  repeated string lanes = 7;
  TestCoverage coverage = 8;
  // By line number.
  repeated TestLineCoverage lines = 9;
  // blob_id came from an uncommitted working tree (git hash-object), so it is
  // in no commit and there is no source to fetch: the viewer says
  // "uncommitted", not "gone". Only a dirty run's coverage has such files;
  // commit reports merge clean trees only.
  bool dirty = 10;
}

message GetReleaseTestsRequest {
  // The forge project; empty is the legacy pre-project namespace, as on
  // GetDeployReleaseRequest.
  string project = 1 [(buf.validate.field).string.max_len = 256];
  // The release version.
  string version = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetReleaseTestsResponse {
  string release_id = 1;
  string release_version = 2;
  string git_commit = 3;
  TestEvidenceStatus status = 4;
  // Why the evidence is PARTIAL or UNAVAILABLE, one line.
  string reason = 5;
  // Unset when UNAVAILABLE.
  TestCommitReport report = 6;
  // The previous release of the same project. Empty for the first.
  string previous_release_version = 7;
  // Combined percent minus the previous release's. Unset when either has no
  // report.
  optional double coverage_delta_percent = 8;
  // Tests failing in this release's report that passed in the previous one.
  repeated TestKey new_failures = 9;
  // Tests that became suspected or flaky since the previous release.
  repeated TestFlake new_flakes = 10;
}

message ListFlakyTestsRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Every filter below is `optional`: unset means no filter.
  //
  // Unset: every state but HEALTHY.
  optional TestFlakeState state = 2 [(buf.validate.field).enum.defined_only = true];
  // Only tests whose flake rate is at least this.
  optional double min_score = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 1
  ];
  // Only tests in this package (TestKey.package).
  optional string package = 4 [(buf.validate.field).string.max_len = 1024];
  // Rows per page. Default 50, max 500.
  int32 page_size = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
  // next_page_token from the previous page; valid only with the same request.
  string page_token = 6 [(buf.validate.field).string.max_len = 512];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 7;
}

message ListFlakyTestsResponse {
  // Highest flake rate first, then most recent event.
  repeated TestFlake tests = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetTestRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // TestKey.id.
  string test_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

// TestOutcome is a test's result in one run.
message TestOutcome {
  string run_id = 1;
  string git_commit = 2;
  string branch = 3;
  string lane = 4;
  TestCaseStatus status = 5;
  int32 attempts = 6;
  bool retry_passed = 7;
  int64 duration_ms = 8;
  google.protobuf.Timestamp at = 9;
}

// TestFailureSignature groups a test's failures that share normalised output.
message TestFailureSignature {
  // The sha256 of the normalised output.
  string signature = 1;
  // One failure's output, scrubbed and truncated to 8 KiB.
  string sample_output = 2;
  int32 count = 3;
  TestFlakeVerdict verdict = 4;
  google.protobuf.Timestamp first_seen_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
}

message GetTestResponse {
  // The test's flake record; state HEALTHY when it never flaked.
  TestFlake flake = 1;
  // Its last 50 runs, newest first.
  repeated TestOutcome outcomes = 2;
  // Newest first.
  repeated TestFlakeEvent events = 3;
  // Most frequent first.
  repeated TestFailureSignature signatures = 4;
}

message HasCoverageBlobRequest {
  // The forge project. Required.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The git blob id (GetFileCoverageResponse.blob_id): 40 hex characters,
  // or 64 in a SHA-256 repository.
  string blob_id = 2 [
    (buf.validate.field).string.min_len = 40,
    (buf.validate.field).string.max_len = 64
  ];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message HasCoverageBlobResponse {
  // Some retained report of the project names this blob.
  bool present = 1;
  // Every retained report naming it recorded the file as dirty (from an
  // uncommitted working tree), so the blob is in no commit. False when
  // present is false.
  bool uncommitted = 2;
}
