syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/browser_ingest/v1;browser_ingestv1";

// === BrowserIngestService ===
//
// Publishable keys for browser telemetry sent to the workspace proxy's keyed
// ingest route:
//
//   POST https://<ingest host>/k/<key>/v1/{traces,logs,metrics}
//
// A frontend served OFF the platform's own hosting (Firebase, a bucket) has no
// same-origin /_otel route, so its browser SDK posts cross-origin to the ingest
// host. The key in the path tells the proxy which org and environment the data
// belongs to, and the key's origin allowlist is the CORS policy. The identity is
// therefore resolved server-side from the key and never read from anything the
// browser sends.
//
// THE KEY IS PUBLISHABLE, like a Sentry DSN: it ships in the frontend bundle.
// Holding it lets a browser on an allowed origin send telemetry INTO the
// environment and nothing more; no RPC here or anywhere returns telemetry for a
// key. What bounds abuse is the origin allowlist, per-key and per-IP rate limits,
// the environment's own browser opt-out, and RevokeKey.
//
// CALLERS. forge's deploy calls EnsureKey for every frontend bound to Firebase or
// a bucket in an environment with hosted observability, and renders the returned
// `endpoint` into the frontend's OTEL_ENDPOINT. It is declarative: every deploy
// states the full declaration, EnsureKey makes the world match, and a re-run of an
// unchanged project changes nothing. Operators use the same RPC for the platform's
// own frontend (tenant zero), whose control-plane deploy does not call
// control-plane.
//
// THE ORG IS NEVER A REQUEST FIELD. It is resolved from the caller's identity (the
// rule of DeployService), and the environment must belong to it; an environment
// of another org answers NotFound exactly like one that does not exist. A machine
// credential is accepted with the deploy scopes (deploy:write to mint or revoke,
// deploy:read to list), which is what lets a CI pipeline run `forge env deploy`.
//
// ERRORS: InvalidArgument (a malformed frontend, origin or id), PermissionDenied
// (not an admin / a credential without the scope), NotFound (no such environment
// or key in the caller's org), FailedPrecondition (no ingest host is configured on
// this control plane), Unavailable (not configured on this server).
service BrowserIngestService {
  option (forge.v1.service) = {
    name: "BrowserIngestService"
    version: "1.0.0"
    description: "Publishable keys for browser telemetry ingest on the workspace proxy"
  };

  // EnsureKey makes a live key exist for (environment, frontend) and holds its
  // origin allowlist at exactly `origins`. Idempotent: a repeat with the same
  // declaration returns the same key, `created` false, and changes nothing; a
  // repeat with different origins replaces the allowlist and keeps the key (the
  // endpoint baked into a shipped bundle keeps working). A revoked key is never
  // revived: Ensure after RevokeKey mints a new one.
  //
  // origins are web origins (scheme://host[:port]); forge derives them from the
  // frontend's declared domains plus the target's default domains (Firebase
  // <site>.web.app and <site>.firebaseapp.com). Anything but an origin (a path, a
  // wildcard, "null") is InvalidArgument.
  //
  // Requires the admin role (deploy:write for a machine credential).
  rpc EnsureKey(EnsureKeyRequest) returns (EnsureKeyResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "provision"
        target: {
          kind: "browser_ingest_key"
          id: "response.key.id"
          label: "frontend"
        }
        env: "environment_id"
      }
    };
  }

  // ListKeys returns the caller's org's keys, newest first, optionally for one
  // environment. Revoked keys are omitted unless asked for.
  //
  // Requires membership (deploy:read for a machine credential).
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // RevokeKey ends a key: its endpoint answers 404 within the proxy's cache
  // window (about a minute). Idempotent. A frontend that still ships the key
  // sends telemetry nowhere until its next deploy mints a replacement with
  // EnsureKey.
  //
  // Requires the admin role (deploy:write for a machine credential).
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
      activity: {
        verb: "revoke"
        target: {
          kind: "browser_ingest_key"
          id: "key_id"
        }
      }
    };
  }
}

message BrowserIngestKey {
  string id = 1;
  string environment_id = 2;
  // The forge frontend the key belongs to (forge.yaml frontends[].name).
  string frontend = 3;
  // The publishable key, rbk_ followed by 26 characters.
  string key = 4;
  // The base URL a browser SDK posts to: https://<ingest host>/k/<key>. The SDK
  // appends /v1/traces, /v1/logs and /v1/metrics, so this is the value for the
  // frontend's OTEL_ENDPOINT.
  string endpoint = 5;
  // The origins allowed to send, normalized (lowercase, default port elided) and
  // sorted.
  repeated string allowed_origins = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Set once revoked.
  google.protobuf.Timestamp revoked_at = 9;
}

message EnsureKeyRequest {
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  string frontend = 2 [(buf.validate.field).string.min_len = 1];
  repeated string origins = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 4;
}

message EnsureKeyResponse {
  BrowserIngestKey key = 1;
  // True when this call minted the key.
  bool created = 2;
}

message ListKeysRequest {
  // Restrict to one environment. Empty lists every environment of the org.
  optional string environment_id = 1;
  optional bool include_revoked = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message ListKeysResponse {
  repeated BrowserIngestKey keys = 1;
}

message RevokeKeyRequest {
  string key_id = 1 [(buf.validate.field).string.min_len = 1];
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message RevokeKeyResponse {
  BrowserIngestKey key = 1;
}
