message GetCurrentUserComputeUsageRequest {
  optional string period = 1; // "current" (default) | "previous"
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

// Every metered figure is read from the one Balance every gate reads
// (daemonmeter.Balance), so the page and the start gate cannot disagree.
// Only the CURRENT period is measured: Balance answers "now", so a request for
// the previous period returns the period bounds with usage_measured = false.
//
// Public contract: exported verbatim to reliant (see proto/public-api.txt).
// Never renumber — reserve removed tags.
message GetCurrentUserComputeUsageResponse {
  // 1-3, 7-9 were the minute model's included_minutes, used_minutes,
  // overage_minutes, by_workspace, by_day and granted_minutes_remaining;
  // the small-daemon-second fields below replace them.
  reserved 1, 2, 3, 7, 8, 9;
  reserved "included_minutes", "used_minutes", "overage_minutes", "by_workspace", "by_day", "granted_minutes_remaining";

  // Compute overage so far this period, in cents. Display-only (a double);
  // by_size carries the exact per-size figures.
  double estimated_overage_cost_cents = 4;
  google.protobuf.Timestamp period_start = 5;
  google.protobuf.Timestamp period_end = 6;

  // Whether the metered fields carry a measurement. usage_measured
  // distinguishes "this org genuinely ran nothing" from "the server did not
  // measure"; both would otherwise arrive as zeros on a 200 response, and the
  // client would render the unmeasured case as a confident "0.0 h used".
  //
  // Defaults to FALSE, deliberately: proto3 gives an older or partial server
  // the safe reading. A server that cannot measure says nothing and the
  // client withholds, rather than a missing field defaulting to "measured".
  //
  // False means every metered field below carries NO information and must
  // not be rendered as a value.
  bool usage_measured = 10;

  // The plan allowance for this period, in small-daemon-seconds.
  int64 included_small_daemon_seconds = 11 [deprecated = true];
  // Consumed this period: drained counter + undrained segments.
  int64 used_small_daemon_seconds = 12 [deprecated = true];
  // max(0, included − used). Never negative.
  int64 remaining_small_daemon_seconds = 13 [deprecated = true];
  // One-time coupon grant still unspent, in small-daemon-seconds. Reported
  // alongside the allowance rather than folded into it: the allowance
  // refills every period, a grant depletes once. Spent after the allowance
  // and before overage.
  int64 granted_small_daemon_seconds_remaining = 14 [deprecated = true];
  // Sum of the multipliers of the daemons running right now (the burn rate
  // in SDS per second). Zero when nothing runs.
  int64 running_multiplier = 15 [deprecated = true];
  // Exact rational weighted-second accounting; no legacy integer truncation.
  string pricing_version = 23;
  string allowance_weighted_seconds = 24;
  string consumed_weighted_seconds = 25;
  string remaining_weighted_seconds = 26;
  string grant_remaining_weighted_seconds = 27;
  string running_cost_weight_sum = 28;
  // Nonempty means usage/charge estimate is held for explicit reconciliation.
  string billing_hold_reason = 29;
  // Runtime/cost history covers only this proven window after an audited bridge.
  google.protobuf.Timestamp measured_from = 30;
  string opening_consumed_weighted_seconds = 31;
  string bridge_evidence_ref = 32;
  // When the allowance runs out at the current burn rate. UNSET when nothing
  // is running or nothing remains — never a fabricated far-future instant.
  google.protobuf.Timestamp exhausts_at = 16;
  // Running usage per size this period, cheapest first.
  repeated SizeUsage by_size = 17;
  // 18 was suspended_disk: there is no suspended-disk fee any more; see
  // storage.
  reserved 18;
  reserved "suspended_disk";
  // The last meter tick this answer includes ("as of HH:MM").
  google.protobuf.Timestamp measured_through = 19;
  // Machine disk this period: provisioned vs the plan's pooled allowance, and
  // what the excess costs. Billed running or suspended, outside the compute
  // overage cap. Unset when usage_measured is false.
  StorageUsage storage = 20;
  // What this period's invoice is projected to total, in cents, as an exact
  // decimal string: the plan's monthly price + compute overage so far +
  // storage so far + the current excess disk carried to period end. Hosted
  // infrastructure overage is not included. Empty when usage_measured is false.
  string projected_period_total_cents = 21;
  // The subscribed plan's monthly price, in cents (0 with no plan).
  int64 plan_price_cents = 22;
}

// SizeUsage is one size's running usage within a period (design §6.1).
message SizeUsage {
  string size = 1;
  int64 multiplier = 2 [deprecated = true];
  // Deprecated whole seconds; exact rational field is canonical.
  int64 running_seconds = 3 [deprecated = true];
  int64 included_small_daemon_seconds = 4 [deprecated = true];
  int64 overage_seconds = 5 [deprecated = true];
  // overage_seconds × this size's hourly price / 3600, in cents, as an exact
  // decimal string rounded half-up to 4 places.
  string overage_cost_cents = 6;
  string pricing_version = 7;
  string cost_weight = 8;
  string exact_running_seconds = 9;
  string included_weighted_seconds = 10;
  string exact_overage_seconds = 11;
}

// StorageUsage is machine disk against the plan's pooled allowance
// (docs/design/pricing-v2.md §5). Every GiB of disk the org's machines hold,
// running or suspended, counts; the plan includes its own size's disk; the
// rest bills at the storage price continuously.
message StorageUsage {
  // Total provisioned disk of the org's machines right now, in GiB.
  int64 provisioned_gib = 1;
  // The plan's pooled allowance, in GiB (0 with no plan).
  int64 included_gib = 2;
  // max(0, provisioned − included): what bills right now.
  int64 extra_gib = 3;
  // Billed excess GiB × seconds so far this period.
  int64 extra_gib_seconds = 4 [deprecated = true];
  string exact_extra_gib_seconds = 8;
  // extra_gib_seconds priced, in cents, exact decimal rounded half-up to 4 dp.
  string cost_cents = 5;
  // cost_cents plus extra_gib carried to the end of the period.
  string projected_cost_cents = 6;
  // The price per GiB-month (730 hours), in cents, exact decimal.
  string cents_per_gib_month = 7;
}

// === Compute eligibility ===

// ComputeIneligibleReason is why a caller cannot start a managed daemon.
// Distinct values because each one has a different remedy: a user with no
// organization yet is still being provisioned, and a user with no subscription
// and no coupon grant wants a plan or a code.
//
// Public contract: exported verbatim to reliant (see proto/public-api.txt).
// Never renumber — reserve removed tags.
enum ComputeIneligibleReason {
  COMPUTE_INELIGIBLE_REASON_UNSPECIFIED = 0;
  // The caller is eligible; no reason applies.
  COMPUTE_INELIGIBLE_REASON_NONE = 1;
  // Never had a compute plan, and holds no coupon grant.
  COMPUTE_INELIGIBLE_REASON_NO_SUBSCRIPTION = 3;
  // Signed in, but no organization resolved yet (mid-provisioning).
  COMPUTE_INELIGIBLE_REASON_NO_ORGANIZATION = 4;
}

message GetCurrentUserComputeEligibilityRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message GetCurrentUserComputeEligibilityResponse {
  // eligible is the single fact a caller needs to enable or disable a
  // "start a machine" control. True when the org has an active compute
  // subscription OR an unspent grant from a redeemed compute coupon.
  bool eligible = 1;

  // reason explains an ineligible answer so the UI can offer the right remedy.
  ComputeIneligibleReason reason = 2;

  // has_active_subscription is true when an active/trialing compute
  // subscription is what makes the caller eligible.
  bool has_active_subscription = 3;

  // 4 was granted_minutes_remaining; the grant balance is now reported in
  // small-daemon-seconds (granted_small_daemon_seconds_remaining).
  reserved 4;
  reserved "granted_minutes_remaining";

  // plan_name of the active compute subscription, for display. Empty when
  // there is none.
  string plan_name = 5;

  // allowed_daemon_sizes are the daemon sizes this caller may actually start,
  // resolved the same way internal/svcdaemon.computeDaemonSizeLimits resolves
  // them: from the active compute subscription's plan, falling back to
  // planlimits.UnsubscribedComputeLimits (["small"]) when there is none.
  //
  // Sent because eligibility alone is not enough to render a size picker. A
  // coupon-funded caller is eligible with NO subscription, so a client that
  // had only `eligible` would have to re-derive the unsubscribed size list
  // locally — and a client that re-derives a server rule is exactly how the
  // machines page came to lock out coupon holders entirely.
  //
  // A coupon buys machine TIME, not a bigger machine, so this stays ["small"]
  // for a grant-only caller. Empty means no size may be started.
  repeated string allowed_daemon_sizes = 6;

  // max_daemon_storage_gib is the largest disk, in GiB of data, this caller's
  // machines may grow to (DaemonService.GrowDaemonDisk), resolved from the
  // same plan as allowed_daemon_sizes and already capped at the platform
  // ceiling. Zero means growth is off for this caller.
  int32 max_daemon_storage_gib = 7;

  // granted_small_daemon_seconds_remaining is the unspent balance of redeemed
  // compute coupons, in small-daemon-seconds. Non-zero alone is enough to
  // make a caller eligible, which is what lets a coupon unblock someone with
  // no subscription at all.
  int64 granted_small_daemon_seconds_remaining = 8;
}

// === Invoice preview ===

message GetInvoicePreviewRequest {
  string size = 1;
  int32 quantity_delta = 2; // +1 to add, -1 to remove
}

message GetInvoicePreviewResponse {
  int32 proration_cents = 1; // charge or credit today
  int32 new_monthly_cents = 2; // new total monthly after change
}

// === Per-user billing email ===

message GetCurrentUserBillingEmailRequest {}

message GetCurrentUserBillingEmailResponse {
  // billing_email is the user-supplied billing address once CONFIRMED; empty
  // when unset or unconfirmed (billing flows ignore an unconfirmed one).
  string billing_email = 1;
  // fallback_email is the address billing flows use when billing_email is
  // empty (users.email, else the JWT email). May also be empty.
  string fallback_email = 2;
}

message UpdateBillingEmailRequest {
  // email is the billing address to persist. Empty clears any stored value.
  // Must currently equal the caller's verified account email
  // (case-insensitive), or the call fails FAILED_PRECONDITION.
  string email = 1;
}

message UpdateBillingEmailResponse {}
