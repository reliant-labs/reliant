syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/billing/v1;billingv1";

message GetOrganizationCostSummaryRequest {
  string org_id = 1;
}

// These independent facts MUST NOT be added into a grand total across periods.
message GetOrganizationCostSummaryResponse {
  string org_id = 1;
  string currency = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated OrganizationCostPeriod periods = 4;
  repeated OrganizationCostSource sources = 5;
}

message OrganizationCostPeriod {
  string id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message OrganizationCostAllowance {
  string id = 1;
  string unit = 2;
  double included = 3;
  optional double consumed = 4;
}

message OrganizationCostSource {
  string category = 1;
  string period_id = 2;
  // USD nanos. Missing means not measured, never zero.
  optional int64 list_equivalent_usd_nanos = 3;
  // Recognized billed consumption; NOT wallet funding or card payments.
  optional int64 actual_charges_usd_nanos = 4;
  // Promotional grants, not remaining credit or allocation against calls.
  optional int64 credits_usd_nanos = 5;
  optional int64 pending_estimate_usd_nanos = 6;
  optional int64 pending_count = 7;
  repeated OrganizationCostAllowance allowances = 8;
  google.protobuf.Timestamp coverage_start = 9;
  google.protobuf.Timestamp coverage_end = 10;
  google.protobuf.Timestamp measured_through = 11;
  // complete, partial, unavailable, not_measured.
  string completeness = 12;
  repeated string limitations = 13;
}

enum OrganizationUsageGranularity {
  // Unspecified reads as DAY.
  ORGANIZATION_USAGE_GRANULARITY_UNSPECIFIED = 0;
  ORGANIZATION_USAGE_GRANULARITY_DAY = 1;
  ORGANIZATION_USAGE_GRANULARITY_MONTH = 2;
}

enum OrganizationUsageGroupBy {
  // Unspecified reads as CATEGORY.
  ORGANIZATION_USAGE_GROUP_BY_UNSPECIFIED = 0;
  // One row per (bucket, category); group_key is empty.
  ORGANIZATION_USAGE_GROUP_BY_CATEGORY = 1;
  // Hosted categories split by environment id. Categories with no environment
  // attribution (managed_llm, machines, observability) keep an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_ENV = 2;
  // managed_llm splits by model. Every other category keeps an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_MODEL = 3;
}

message ListOrganizationUsageRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // Inclusive, UTC. Truncated down to the start of its granularity bucket.
  google.protobuf.Timestamp start = 2;
  // Exclusive, UTC. Rounded up to a bucket boundary. end - start <= 400 days.
  google.protobuf.Timestamp end = 3;
  optional OrganizationUsageGranularity granularity = 4 [(buf.validate.field).enum.defined_only = true];
  optional OrganizationUsageGroupBy group_by = 5 [(buf.validate.field).enum.defined_only = true];
}

// History of one organization's usage and spend, one point per
// (bucket, category, group_key, detail). Within a category, points of one
// bucket partition the category's total: summing over group_key and detail
// reproduces it. Dollar amounts of different categories rest on different
// bases (settled debits vs plan-rate list equivalents) and MUST NOT be added
// into one grand total.
message ListOrganizationUsageResponse {
  string org_id = 1;
  string currency = 2;
  google.protobuf.Timestamp generated_at = 3;
  // The effective, bucket-aligned range that was read.
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
  OrganizationUsageGranularity granularity = 6;
  OrganizationUsageGroupBy group_by = 7;
  // Buckets with no usage are omitted, not zero-filled.
  repeated OrganizationUsagePoint points = 8;
  // One entry per source the server tried to read, including those that
  // returned no points.
  repeated OrganizationUsageCoverage coverage = 9;
  // Trailing spend rate for categories that have a dollar figure.
  repeated OrganizationUsageRate spend_rates = 10;
  // What exists right now (dev boxes, hosted apps, databases, static sites),
  // independent of the requested range.
  repeated OrganizationUsageInventoryItem inventory = 11;
  // complete when every source is complete; unavailable when none could be
  // read; partial otherwise.
  string completeness = 12;
}

message OrganizationUsagePoint {
  google.protobuf.Timestamp bucket_start = 1;
  // managed_llm, machines, hosted_apps, databases, static_hosting,
  // hosted_other, observability.
  string category = 2;
  // Environment id (group_by ENV) or model (group_by MODEL); empty when the
  // category has no such dimension or the usage is unattributed.
  string group_key = 3;
  // Display name for group_key: the environment's name. Empty when unknown.
  string group_label = 4;
  // A further split of the category: machine size for machines, signal for
  // observability; empty otherwise.
  string detail = 5;
  // USD nanos. Settled wallet debits (managed_llm). Absent means not measured.
  optional int64 actual_charges_usd_nanos = 6;
  // USD nanos at the plan's overage rates, before any allowance (hosted
  // categories, observability). Absent means not measured.
  optional int64 list_equivalent_usd_nanos = 7;
  repeated OrganizationUsageQuantity quantities = 8;
  // Hosted categories: metered dimensions this point has usage in that the
  // current plan declares no rate for (infra_cpu, infra_memory, infra_storage).
  // Their usage is not in list_equivalent_usd_nanos, so when this is non-empty
  // that amount is a LOWER BOUND, not the full list equivalent.
  repeated string unpriced_dimensions = 9;
}

message OrganizationUsageQuantity {
  // managed_llm: llm_requests, llm_input_tokens, llm_output_tokens,
  //   llm_cached_input_tokens.
  // machines: running_seconds, suspended_seconds, running_machines and
  //   suspended_machines (distinct dev boxes that spent part of the bucket in
  //   that state; one box can be in both).
  // hosted_apps, databases, hosted_other: infra_cpu, infra_memory,
  //   infra_storage.
  // static_hosting: egress_kib.
  // observability: stored_bytes, billed_bytes, uncharged_bytes.
  string id = 1;
  // count, seconds, vcpu_hours, gib_hours, kib, bytes.
  string unit = 2;
  double value = 3;
}

message OrganizationUsageCoverage {
  // A source: managed_llm, machines, hosted_infrastructure (covers hosted_apps,
  // databases, static_hosting and hosted_other), observability, or inventory.
  string category = 1;
  // complete: the source covers the whole range with no known gap. partial:
  // a known gap (settlements are pending, the measurement watermark is behind
  // the range end, or a price needed for the dollar figures could not be
  // resolved).
  // unavailable: the source could not be read. A figure that is absent is
  // never zero.
  string completeness = 2;
  google.protobuf.Timestamp coverage_start = 3;
  google.protobuf.Timestamp coverage_end = 4;
  // Newest measurement behind this category within the range; absent when
  // there is none.
  google.protobuf.Timestamp measured_through = 5;
  repeated string limitations = 6;
}

message OrganizationUsageRate {
  string category = 1;
  // actual or list_equivalent.
  string basis = 2;
  // Dollars over the exact 24 hours before generated_at.
  optional int64 last_24h_usd_nanos = 3;
  // Dollars over the exact 7 days before generated_at, divided by 7.
  optional int64 average_daily_7d_usd_nanos = 4;
  // Distinct hours of the trailing 7 days in which this category has a
  // measurement (0..168). Gaps are not counted and a category does not inherit
  // another category's age. A projection is only honest from 24 hours up.
  int32 measured_hours = 5;
  // Hosted categories only: metered dimensions the current plan declares no
  // rate for (infra_cpu, build_cpu, ...). Their usage is excluded from the
  // dollar figures above, so a non-empty list means the rate is a lower bound.
  // A hosted category none of whose usage is priced has no rate at all.
  repeated string unpriced_dimensions = 6;
  // True when the figures leave out something that exists: unpriced
  // dimensions, settlements still pending, or hours the meter has not measured
  // yet. The dollar amounts are then lower bounds.
  bool lower_bound = 7;
}

// The organization's live footprint at generated_at.
message OrganizationUsageInventoryItem {
  // machines, hosted_apps, databases, static_hosting, hosted_other.
  string category = 1;
  // Machine size; empty for deployments.
  string size = 2;
  // Machines: running or suspended. Deployments: the observed state.
  string state = 3;
  string environment_id = 4;
  string environment_name = 5;
  int64 count = 6;
  // Provisioned disk of dev boxes; 0 for deployments, which carry no
  // provisioned-storage figure.
  int64 storage_gib = 7;
}

// === BillingService (public) ===
//
// User-facing billing RPCs. Admin-only (org-scoped or arbitrary-user) and
// gateway-internal usage-reservation RPCs live in
// BillingAdminService / BillingGatewayService.

service BillingService {
  // Canonical current-period organization accounting. Requires billing:read,
  // not billing management. Unknown amounts stay absent; no historical range.
  rpc GetOrganizationCostSummary(GetOrganizationCostSummaryRequest) returns (GetOrganizationCostSummaryResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // History of the organization's usage and spend, built from durable
  // ledgers (never live telemetry). Requires billing:read, re-checked at use,
  // and is scoped to the caller's organization. Range is at most 400 days.
  rpc ListOrganizationUsage(ListOrganizationUsageRequest) returns (ListOrganizationUsageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // Read-only catalog.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // Current user subscription / billing portal / invoices.
  rpc GetCurrentUserSubscription(GetCurrentUserSubscriptionRequest) returns (GetCurrentUserSubscriptionResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc CreateCurrentUserCheckoutSession(CreateCurrentUserCheckoutSessionRequest) returns (CreateCurrentUserCheckoutSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc CreateCurrentUserBillingPortalSession(CreateCurrentUserBillingPortalSessionRequest) returns (CreateCurrentUserBillingPortalSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc ListCurrentUserInvoices(ListCurrentUserInvoicesRequest) returns (ListCurrentUserInvoicesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // ListOrgLimitChanges is the org's limit-change history, newest first: who
  // changed which limit, from what, to what, and when. One list across every
  // org limit (observability spend cap today; LLM cap, infra overage and wallet
  // auto-recharge as they adopt it). Any member of org_id may read it.
  //
  // forge:custom — hand-written over the shared org_limit_changes table; it is
  // not an entity list, so it gets no CRUD wiring or admin page.
  rpc ListOrgLimitChanges(ListOrgLimitChangesRequest) returns (ListOrgLimitChangesResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // Wallet (per-user).
  rpc GetCurrentUserWalletOverview(GetCurrentUserWalletOverviewRequest) returns (GetCurrentUserWalletOverviewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // (GrantCurrentUserWelcomeCredit removed. There is no signup wallet credit:
  // LLM credit is redeemed from a coupon, RedeemCoupon.)
  rpc CreateCurrentUserWalletTopupSession(CreateCurrentUserWalletTopupSessionRequest) returns (CreateCurrentUserWalletTopupSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // CreateCurrentUserWalletTopupPaymentIntent mints a PaymentIntent for a
  // top-up the user confirms in OUR page with Stripe Elements, rather than in
  // Stripe's hosted or embedded Checkout.
  //
  // The counterpart of CreateCurrentUserWalletPaymentMethodSetup: same "return
  // a client secret and let Stripe.js collect the card" division of labour, so
  // no card data reaches us. That one saves a card; this one moves money.
  //
  // Confirmation is the browser's, entitlement is still the webhook's. A
  // succeeded confirmation reported by the client grants nothing on its own.
  rpc CreateCurrentUserWalletTopupPaymentIntent(CreateCurrentUserWalletTopupPaymentIntentRequest) returns (CreateCurrentUserWalletTopupPaymentIntentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // GetCurrentUserWalletTopupQuote prices a top-up WITHOUT minting anything at
  // Stripe, so the checkout page can disclose the top-up service fee, and the
  // total it makes, before asking for a card.
  //
  // THE REASON THIS IS AN RPC AND NOT CLIENT ARITHMETIC: a fee the browser
  // computes is a number the browser can change, and — more mundanely but more
  // likely — a second implementation of the same rule, free to disagree with
  // the one that builds the charge. This returns the breakdown from the same
  // function the PaymentIntent's amount is derived from, so what the user is
  // shown and what their card is charged cannot drift apart.
  //
  // Creates no Stripe object and no database row: the picker can call it on
  // every amount the user clicks.
  rpc GetCurrentUserWalletTopupQuote(GetCurrentUserWalletTopupQuoteRequest) returns (GetCurrentUserWalletTopupQuoteResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // RedeemCoupon credits the caller's org wallet from a coupon code.
  //
  // END-USER facing (any authenticated caller), unlike the coupon MANAGEMENT
  // RPCs — those
  // live on the internal-only service and are served by a different
  // deployment. Redeeming is something a customer does; issuing is not.
  //
  // Idempotent per (coupon, org): a second redemption of the same code by the
  // same org is refused rather than credited twice.
  rpc RedeemCoupon(RedeemCouponRequest) returns (RedeemCouponResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Reliant managed-LLM access (per-user).
  rpc GetCurrentUserReliantState(GetCurrentUserReliantStateRequest) returns (GetCurrentUserReliantStateResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc RepairCurrentUserReliantAccess(RepairCurrentUserReliantAccessRequest) returns (RepairCurrentUserReliantAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc RotateCurrentUserReliantAccess(RotateCurrentUserReliantAccessRequest) returns (RotateCurrentUserReliantAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc GetCurrentUserReliantOverview(GetCurrentUserReliantOverviewRequest) returns (GetCurrentUserReliantOverviewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // SetCurrentUserReliantEnabled turns managed Reliant LLM access on or off
  // for the caller. This is the ONLY writer of reliant_enabled: the flag is a
  // user preference, never inferred from wallet balance, org membership, or
  // provisioning state. A funded user may still prefer their own API key.
  rpc SetCurrentUserReliantEnabled(SetCurrentUserReliantEnabledRequest) returns (SetCurrentUserReliantEnabledResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Workspace compute plan (per-user).
  rpc GetCurrentUserComputeSubscription(GetCurrentUserComputeSubscriptionRequest) returns (GetCurrentUserComputeSubscriptionResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SetCurrentUserComputeOverage(SetCurrentUserComputeOverageRequest) returns (SetCurrentUserComputeOverageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Deploy (infrastructure) overage ceiling — the cpu/memory/storage twin of
  // the compute pair above. Separate from it because the two cap different
  // products through different gates; see SetCurrentUserInfraOverageRequest.
  rpc SetCurrentUserInfraOverage(SetCurrentUserInfraOverageRequest) returns (SetCurrentUserInfraOverageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Everything the deploy overage surface renders from, in one call:
  // consumption, allowance, the customer's cap, and the current ladder rung
  // per dimension.
  rpc GetCurrentUserInfraOverage(GetCurrentUserInfraOverageRequest) returns (GetCurrentUserInfraOverageResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // CreateCurrentUserComputeSubscriptionIntent starts a compute subscription
  // the user pays for in OUR page with Stripe Elements, rather than in
  // Stripe's hosted Checkout page inside an iframe.
  //
  // The subscription counterpart of
  // CreateCurrentUserWalletTopupPaymentIntent, and the recurring twin of it:
  // same "we mint, the browser confirms, the card never reaches us" division
  // of labour. The subscription is created in `incomplete` status and moves no
  // money until the browser confirms.
  //
  // It grants NO entitlement and cancels NO existing subscription. An
  // abandoned payment leaves the caller exactly as they were, and Stripe
  // expires the unpaid subscription on its own. Entitlement — and cancelling
  // the plan this one supersedes — remains the webhook's, on the signal that
  // confirms the money actually moved.
  rpc CreateCurrentUserComputeSubscriptionIntent(CreateCurrentUserComputeSubscriptionIntentRequest) returns (CreateCurrentUserComputeSubscriptionIntentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Machine pricing is accepted explicitly for the next billing period only.
  rpc GetMachinePricingReadiness(GetMachinePricingReadinessRequest) returns (GetMachinePricingReadinessResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc AcceptNextMachinePricing(AcceptNextMachinePricingRequest) returns (AcceptNextMachinePricingResponse) {
    option (forge.v1.method) = {auth_required: true activity: {none: "explicit future-period pricing consent is persisted in the acceptance ledger"}};
  }

  // Independent organization-wide hosted usage funding; never requires a machine plan.
  rpc GetCurrentUserUsageBilling(GetCurrentUserUsageBillingRequest) returns (GetCurrentUserUsageBillingResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // Explicit PAYG consent. Does not grant funding until verified Stripe reconciliation.
  rpc CreateCurrentUserUsageBillingCheckout(CreateCurrentUserUsageBillingCheckoutRequest) returns (CreateCurrentUserUsageBillingCheckoutResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "billing consent is recorded in the usage agreement and audit log"}
    };
  }

  // AI credit auto-recharge: refill the wallet from a saved card when the
  // balance falls below a threshold, bounded by a MANDATORY monthly ceiling.
  //
  // Three RPCs, because saving a card and arming the rule are separate
  // decisions: a user may save a card and never arm auto-recharge, and a
  // compute subscriber already HAS a saved card and only needs the rule.
  rpc GetCurrentUserWalletAutoRecharge(GetCurrentUserWalletAutoRechargeRequest) returns (GetCurrentUserWalletAutoRechargeResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SetCurrentUserWalletAutoRecharge(SetCurrentUserWalletAutoRechargeRequest) returns (SetCurrentUserWalletAutoRechargeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Begins saving a card for off-session use. Moves no money.
  //
  // Returns EITHER an already-saved payment method (the compute-subscriber
  // path, where this is a read rather than a collection) OR a SetupIntent
  // client secret to mount with Stripe.js — never both.
  rpc CreateCurrentUserWalletPaymentMethodSetup(CreateCurrentUserWalletPaymentMethodSetupRequest) returns (CreateCurrentUserWalletPaymentMethodSetupResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Records a card the user just saved. The server reads the card's details
  // back from Stripe; the client sends only the payment method ID.
  rpc ConfirmCurrentUserWalletPaymentMethod(ConfirmCurrentUserWalletPaymentMethodRequest) returns (ConfirmCurrentUserWalletPaymentMethodResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc GetCurrentUserComputeUsage(GetCurrentUserComputeUsageRequest) returns (GetCurrentUserComputeUsageResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // GetCurrentUserComputeEligibility answers "can this caller start a managed
  // daemon right now, and if not, why".
  //
  // Exists because the client had no way to see COMPUTE entitlement at all: it
  // was gating the cloud-daemon button on the LLM entitlement
  // (ReliantEntitlement.status + reliant_enabled), which describes the wallet
  // that funds token spend and a managed-LLM preference — neither of which has
  // anything to do with whether a machine may run. The authoritative gate is
  // internal/svcdaemon.checkDaemonSizeAllowed; this RPC reports the same
  // funding facts so the UI can predict it instead of guessing.
  rpc GetCurrentUserComputeEligibility(GetCurrentUserComputeEligibilityRequest) returns (GetCurrentUserComputeEligibilityResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // Misc per-org reads that callers expect on the public surface.
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetInvoicePreview(GetInvoicePreviewRequest) returns (GetInvoicePreviewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // Per-user billing email. UpdateBillingEmail persists a CONFIRMED billing
  // address (empty clears it) and, until an emailed confirmation exists,
  // accepts only the caller's own verified account email — any other address
  // is FAILED_PRECONDITION and nothing is stored. GetCurrentUserBillingEmail
  // returns the confirmed value plus the fallback (users.email / JWT) the
  // billing flows use when there is none. Backs reliant/web's
  // BillingEmailRequiredModal.
  rpc GetCurrentUserBillingEmail(GetCurrentUserBillingEmailRequest) returns (GetCurrentUserBillingEmailResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateBillingEmail(UpdateBillingEmailRequest) returns (UpdateBillingEmailResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
}

message ListPlansRequest {
  optional string product_id = 1;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  // The per-daemon price list (design §6.1), so the plan tiles and the machine
  // picker read multipliers, prices and disk sizes from the server.
  controlplane.v1.DaemonPricing daemon_pricing = 2;
}

message GetPlanRequest {
  string plan_id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
}

message GetCurrentUserSubscriptionRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message GetCurrentUserSubscriptionResponse {
  Subscription subscription = 1;
}

// CheckoutUiMode selects where Stripe renders the payment form.
//
// HOSTED mints a checkout.stripe.com page the client navigates to. EMBEDDED
// mints a client secret the client mounts in-page via @stripe/react-stripe-js's
// EmbeddedCheckout, so the user never leaves the app — on web, in Electron, and
// on mobile web.
//
// The two modes take DISJOINT redirect parameters and Stripe rejects the wrong
// pairing: success_url and cancel_url are "not allowed if ui_mode is embedded".
// So a request must set the pair that matches its mode; the other is ignored.
enum CheckoutUiMode {
  // Unspecified means HOSTED, so a client that predates embedded checkout
  // keeps working unchanged.
  CHECKOUT_UI_MODE_UNSPECIFIED = 0;
  CHECKOUT_UI_MODE_HOSTED = 1;
  CHECKOUT_UI_MODE_EMBEDDED = 2;
}

message CreateCurrentUserCheckoutSessionRequest {
  string plan_id = 1;
  // Hosted mode only. Validated against ALLOWED_REDIRECT_HOSTS. Ignored — and
  // not validated — when ui_mode is EMBEDDED, because Stripe forbids them there.
  string success_url = 2;
  string cancel_url = 3;

  // Where Stripe renders the form. Unset = HOSTED.
  CheckoutUiMode ui_mode = 4;

  // Embedded mode only, and optional. Stripe requires a return_url only when
  // redirect-based payment methods (some bank redirects) are enabled on the
  // session; cards and wallets never leave the iframe. Validated against the
  // redirect allowlist when present.
  string return_url = 5;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
}

message CreateCurrentUserCheckoutSessionResponse {
