  // new_balance_cents is the wallet balance AFTER the credit, letting the
  // caller update its balance display without a second round-trip.
  // WALLET_CREDIT only.
  int64 new_balance_cents = 3;

  // kind selects which fields above/below are meaningful.
  RedeemedCouponKind kind = 4;
  // compute_minutes granted. COMPUTE_MINUTES only.
  int64 compute_minutes = 5;
  // 6 was new_compute_minutes_remaining: the balance is now reported in the
  // unit the drain spends it in.
  reserved 6;
  reserved "new_compute_minutes_remaining";
  // new_granted_small_daemon_seconds_remaining is the org's total unspent
  // coupon grant balance AFTER this redemption (grants stack), in
  // small-daemon-seconds, so the caller can update its display without a
  // second round-trip. COMPUTE_MINUTES only.
  int64 new_granted_small_daemon_seconds_remaining = 7;
}

