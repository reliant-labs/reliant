syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/billing/v1;billingv1";

message GetOrganizationCostSummaryRequest {
  string org_id = 1;
}

// These independent facts MUST NOT be added into a grand total across periods.
message GetOrganizationCostSummaryResponse {
  string org_id = 1;
  string currency = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated OrganizationCostPeriod periods = 4;
  repeated OrganizationCostSource sources = 5;
}

message OrganizationCostPeriod {
  string id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message OrganizationCostAllowance {
  string id = 1;
  string unit = 2;
  double included = 3;
  optional double consumed = 4;
}

message OrganizationCostSource {
  string category = 1;
  string period_id = 2;
  // USD nanos. Missing means not measured, never zero.
  optional int64 list_equivalent_usd_nanos = 3;
  // Recognized billed consumption; NOT wallet funding or card payments.
  optional int64 actual_charges_usd_nanos = 4;
  // Promotional grants, not remaining credit or allocation against calls.
  optional int64 credits_usd_nanos = 5;
  optional int64 pending_estimate_usd_nanos = 6;
  optional int64 pending_count = 7;
  repeated OrganizationCostAllowance allowances = 8;
  google.protobuf.Timestamp coverage_start = 9;
  google.protobuf.Timestamp coverage_end = 10;
  google.protobuf.Timestamp measured_through = 11;
  // complete, partial, unavailable, not_measured.
  string completeness = 12;
  repeated string limitations = 13;
}

enum OrganizationUsageGranularity {
  // Unspecified reads as DAY.
  ORGANIZATION_USAGE_GRANULARITY_UNSPECIFIED = 0;
  ORGANIZATION_USAGE_GRANULARITY_DAY = 1;
  ORGANIZATION_USAGE_GRANULARITY_MONTH = 2;
}

enum OrganizationUsageGroupBy {
  // Unspecified reads as CATEGORY.
  ORGANIZATION_USAGE_GROUP_BY_UNSPECIFIED = 0;
  // One row per (bucket, category); group_key is empty.
  ORGANIZATION_USAGE_GROUP_BY_CATEGORY = 1;
  // Hosted categories split by environment id. Categories with no environment
  // attribution (managed_llm, machines, observability) keep an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_ENV = 2;
  // managed_llm splits by model. Every other category keeps an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_MODEL = 3;
  // Hosted categories split by deployment: group_key is the deployment id,
  // group_label "<environment>/<deployment name>", and the point carries
  // deployment_name, tier and environment_id. Usage with no deployment has an
  // empty group_key and one point per environment. Categories with no
  // deployment attribution keep an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_DEPLOYMENT = 4;
  // Hosted categories split by the environment's project (hosted_projects
  // name): group_key and group_label are the project name, empty for usage of
  // no project. Categories with no environment keep an empty group_key.
  ORGANIZATION_USAGE_GROUP_BY_PROJECT = 5;
}

message ListOrganizationUsageRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // Inclusive, UTC. Truncated down to the start of its granularity bucket.
  google.protobuf.Timestamp start = 2;
  // Exclusive, UTC. Rounded up to a bucket boundary. end - start <= 400 days.
  google.protobuf.Timestamp end = 3;
  optional OrganizationUsageGranularity granularity = 4 [(buf.validate.field).enum.defined_only = true];
  optional OrganizationUsageGroupBy group_by = 5 [(buf.validate.field).enum.defined_only = true];
  // Narrows the history to one project (its hosted_projects name): only the
  // hosted usage of that project's environments, and only its deployments in
  // the inventory. Managed LLM, dev boxes and observability are metered per
  // organization and are left out, which the hosted_infrastructure coverage
  // entry says. Unset or empty reads the whole organization. An unknown
  // project is NOT_FOUND.
  optional string project_id = 6;
}

// History of one organization's usage and spend, one point per
// (bucket, category, group_key, detail). Within a category, points of one
// bucket partition the category's total: summing over group_key and detail
// reproduces it. Dollar amounts of different categories rest on different
// bases (settled debits vs plan-rate list equivalents) and MUST NOT be added
// into one grand total.
message ListOrganizationUsageResponse {
  string org_id = 1;
  string currency = 2;
  google.protobuf.Timestamp generated_at = 3;
  // The effective, bucket-aligned range that was read.
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
  OrganizationUsageGranularity granularity = 6;
  OrganizationUsageGroupBy group_by = 7;
  // Buckets with no usage are omitted, not zero-filled.
  repeated OrganizationUsagePoint points = 8;
  // One entry per source the server tried to read, including those that
  // returned no points.
  repeated OrganizationUsageCoverage coverage = 9;
  // Trailing spend rate for categories that have a dollar figure.
  repeated OrganizationUsageRate spend_rates = 10;
  // What exists right now (dev boxes, hosted apps, databases, static sites),
  // independent of the requested range.
  repeated OrganizationUsageInventoryItem inventory = 11;
  // complete when every source is complete; unavailable when none could be
  // read; partial otherwise.
  string completeness = 12;
}

message OrganizationUsagePoint {
  google.protobuf.Timestamp bucket_start = 1;
  // managed_llm, machines, hosted_apps, databases, static_hosting,
  // hosted_other, observability.
  string category = 2;
  // Environment id (group_by ENV) or model (group_by MODEL); empty when the
  // category has no such dimension or the usage is unattributed.
  string group_key = 3;
  // Display name for group_key: the environment's name. Empty when unknown.
  string group_label = 4;
  // A further split of the category: machine size for machines, signal for
  // observability; empty otherwise.
  string detail = 5;
  // USD nanos. Settled wallet debits (managed_llm). Absent means not measured.
  optional int64 actual_charges_usd_nanos = 6;
  // USD nanos at the plan's overage rates, before any allowance (hosted
  // categories, observability). Absent means not measured.
  optional int64 list_equivalent_usd_nanos = 7;
  repeated OrganizationUsageQuantity quantities = 8;
  // Hosted categories: metered dimensions this point has usage in that the
  // current plan declares no rate for (infra_cpu, infra_memory, infra_storage).
  // Their usage is not in list_equivalent_usd_nanos, so when this is non-empty
  // that amount is a LOWER BOUND, not the full list equivalent.
  repeated string unpriced_dimensions = 9;
  // group_by DEPLOYMENT only: the deployment's name and tier (backend,
  // database, static), absent for usage with no deployment, and the
  // environment the point's usage ran in.
  optional string deployment_name = 10;
  optional string tier = 11;
  optional string environment_id = 12;
}

message OrganizationUsageQuantity {
  // managed_llm: llm_requests, llm_input_tokens, llm_output_tokens,
  //   llm_cached_input_tokens.
  // machines: running_seconds, suspended_seconds, running_machines and
  //   suspended_machines (distinct dev boxes that spent part of the bucket in
  //   that state; one box can be in both).
  // hosted_apps, databases, hosted_other: infra_cpu, infra_memory,
  //   infra_storage.
  // static_hosting: egress_kib.
  // observability: stored_bytes, billed_bytes, uncharged_bytes.
  string id = 1;
  // count, seconds, vcpu_hours, gib_hours, kib, bytes.
  string unit = 2;
  double value = 3;
}

message OrganizationUsageCoverage {
  // A source: managed_llm, machines, hosted_infrastructure (covers hosted_apps,
  // databases, static_hosting and hosted_other), observability, or inventory.
  string category = 1;
  // complete: the source covers the whole range with no known gap. partial:
  // a known gap (settlements are pending, the measurement watermark is behind
  // the range end, or a price needed for the dollar figures could not be
  // resolved).
  // unavailable: the source could not be read. A figure that is absent is
  // never zero.
  string completeness = 2;
  google.protobuf.Timestamp coverage_start = 3;
  google.protobuf.Timestamp coverage_end = 4;
  // Newest measurement behind this category within the range; absent when
  // there is none.
  google.protobuf.Timestamp measured_through = 5;
  repeated string limitations = 6;
}

message OrganizationUsageRate {
  string category = 1;
  // actual or list_equivalent.
  string basis = 2;
  // Dollars over the exact 24 hours before generated_at.
  optional int64 last_24h_usd_nanos = 3;
  // Dollars over the exact 7 days before generated_at, divided by 7.
  optional int64 average_daily_7d_usd_nanos = 4;
  // Distinct hours of the trailing 7 days in which this category has a
  // measurement (0..168). Gaps are not counted and a category does not inherit
  // another category's age. A projection is only honest from 24 hours up.
  int32 measured_hours = 5;
  // Hosted categories only: metered dimensions the current plan declares no
  // rate for (infra_cpu, build_cpu, ...). Their usage is excluded from the
  // dollar figures above, so a non-empty list means the rate is a lower bound.
  // A hosted category none of whose usage is priced has no rate at all.
  repeated string unpriced_dimensions = 6;
  // True when the figures leave out something that exists: unpriced
  // dimensions, settlements still pending, or hours the meter has not measured
  // yet. The dollar amounts are then lower bounds.
  bool lower_bound = 7;
}

// The organization's live footprint at generated_at.
message OrganizationUsageInventoryItem {
  // machines, hosted_apps, databases, static_hosting, hosted_other.
  string category = 1;
  // Machine size; empty for deployments.
  string size = 2;
  // Machines: running or suspended. Deployments: the observed state.
  string state = 3;
  string environment_id = 4;
  string environment_name = 5;
  int64 count = 6;
  // Provisioned disk of dev boxes; 0 for deployments, which carry no
  // provisioned-storage figure.
  int64 storage_gib = 7;
}

message GetProjectCostRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // The project's hosted_projects name.
  string project_id = 2 [(buf.validate.field).required = true];
  // Environment ids of the project to narrow to; empty means every
  // environment of the project, including deleted ones.
  repeated string environment_ids = 3;
  // Any instant in the UTC calendar month to report; unset means the current
  // month. A month that has not started is INVALID_ARGUMENT.
  optional google.protobuf.Timestamp period = 4;
}

// One dollar figure and how far to trust it. Every figure carries its basis,
// so no client re-derives it.
message ProjectCostAmount {
  // USD nanos. ABSENT means not measured (render "n/a"), never zero.
  optional int64 usd_nanos = 1;
  // invoiced        a finalized Stripe invoice covers it
  // estimated       the estimated bill: list price minus this project's
  //                 share of the organization's allowances, before the
  //                 invoice replaces it ("Estimated · final on the invoice")
  // list            usage at the plan's list rate, before any allowance
  // not_billed      usage that is recorded but not billed yet (shadow-only
  //                 kinds such as backend egress): usd_nanos is 0
  // not_measured    no source could measure it: usd_nanos is absent
  string basis = 2;
  // The amount leaves out something that exists: usage with no list rate
  // (named in unpriced_dimensions), or history that is not recorded for the
  // whole span. Render "≥ $x".
  bool lower_bound = 3;
  // Resource kinds with usage in the span but no list rate (builds, the
  // registry, CDN). Their usage is not in usd_nanos.
  repeated string unpriced_dimensions = 4;
  // The figure is this project's share of an organization-level amount,
  // pro-rata by list price within each resource kind: the allowance share,
  // and an invoiced month's per-project figure.
  bool allocated = 5;
}

message ProjectCostForecast {
  // The estimated bill at the end of the period, with allowances applied at
  // period end as the invoice applies them. Absent (basis not_measured)
  // before 24 measured hours, or when the period has ended.
  ProjectCostAmount amount = 1;
  // The band: the period to date plus the lowest and highest complete day of
  // the trailing seven, over the remaining days. Absent with amount.
  optional int64 low_usd_nanos = 2;
  optional int64 high_usd_nanos = 3;
  // run_rate_and_trailing_7d: requested-capacity kinds (CPU, memory,
  // storage) at the last complete hour's rate, flow kinds (egress, builds)
  // at the trailing seven days' hourly average.
  string method = 4;
  // Distinct hours of the trailing seven days in which the scope has
  // measured hosted usage (0..168).
  int32 measured_hours = 5;
  // Why there is no forecast, when there is none.
  string unavailable_reason = 6;
  // The list price at period end, before allowances.
  ProjectCostAmount list = 7;
}

// One UTC day of one category in one environment, at list price.
message ProjectCostDay {
  google.protobuf.Timestamp day = 1;
  // compute, databases, storage, bandwidth, static_sites, builds.
  string category = 2;
  string environment_id = 3;
  ProjectCostAmount list = 4;
  // Per resource kind: vcpu_hours, gib_hours, gib, site_hours.
  repeated OrganizationUsageQuantity quantities = 5;
  // The day is not over: measured through generated_at's measured_through.
  bool partial = 6;
}

// One workload's list price over the period to date.
message ProjectCostDriver {
  // Empty for usage metered to no deployment (static-site egress).
  string deployment_id = 1;
  string deployment_name = 2;
  string environment_id = 3;
  string environment_name = 4;
  // backend, database, static.
  string tier = 5;
  // The category that carries most of its list price.
  string category = 6;
  ProjectCostAmount list = 7;
  // List price over the same elapsed span of the previous period; absent
  // when that span is not recorded.
  optional int64 previous_usd_nanos = 8;
  // Share of the project's list price over the period to date (0..1).
  double share = 9;
  repeated OrganizationUsageQuantity quantities = 10;
  // The deployment's requested size now; absent for usage with no
  // deployment. Hosting bills requested, not used, capacity.
  optional ProjectCostRequestedSize requested = 11;
  // The deployment no longer exists; its past usage is still here.
  bool deleted = 12;
}

message ProjectCostRequestedSize {
  int32 replicas = 1;
  int32 cpu_milli = 2;
  int32 memory_mib = 3;
  int32 storage_gib = 4;
}

// One organization allowance and how much of it this project used.
message ProjectCostAllowance {
  // static_egress, egress, observability.
  string id = 1;
  // gib.
  string unit = 2;
  double included = 3;
  // The organization's use this period; absent when not measured.
  optional double org_used = 4;
  // This project's part of org_used; absent when the allowance's usage is
  // not attributed to projects (observability until per-environment
  // metering exists).
  optional double project_used = 5;
  // The organization's projected use at period end; absent when it cannot
  // be projected.
  optional double projected = 6;
  // The allowance's usage is recorded but not billed yet.
  bool not_billed = 7;
  // This project's share of the allowance credit, in dollars (zero or
  // negative; basis estimated, allocated).
  ProjectCostAmount project_credit = 8;
}

// One organization-level cap and how close it is.
message ProjectCostCap {
  // hosting_budget          the hosting agreement's monthly budget (USD)
  // observability_spend_cap the observability overage spend cap (USD)
  // static_egress_free_tier the free tier's static-site bandwidth cut-off (GiB)
  string id = 1;
  // usd_nanos or gib.
  string unit = 2;
  optional double limit = 3;
  optional double used = 4;
  // At the current rate, period end.
  optional double projected = 5;
  // ok, reached, over_100, over_150 (the observability ladder),
  // not_capped (the org's plan sets no such cap), or not_measured (the cap is
  // set but usage against it could not be read).
  string state = 6;
  // When used reaches limit at the current rate, if before period end.
  optional google.protobuf.Timestamp projected_reach_at = 7;
}

message GetProjectCostResponse {
  string currency = 1;
  google.protobuf.Timestamp generated_at = 2;
  google.protobuf.Timestamp period_start = 3;
  google.protobuf.Timestamp period_end = 4;
  // The hosted usage the figures include ends here: the cost rollup's
  // watermark, never later than generated_at. Absent when nothing is rolled.
  google.protobuf.Timestamp measured_through = 5;
  // The estimated bill for the period to date (basis estimated; invoiced
  // once a finalized invoice covers a past period).
  ProjectCostAmount month_to_date = 6;
  // The same span at list price, before allowances.
  ProjectCostAmount month_to_date_list = 7;
  // The previous period's estimated bill over the same elapsed span.
  ProjectCostAmount same_point_last_period = 8;
  ProjectCostForecast forecast = 9;
  // The previous period in full: invoiced (allocated) when a finalized
  // hosting invoice covers it, estimated otherwise.
  ProjectCostAmount last_period = 10;
  // The period's days, by category and environment, at list price.
  repeated ProjectCostDay daily = 11;
  // Every workload of the scope with usage this period, most expensive
  // first. Their list prices plus allowance_share equal month_to_date.
  repeated ProjectCostDriver drivers = 12;
  repeated ProjectCostAllowance allowances = 13;
  repeated ProjectCostCap caps = 14;
  // 15 anomalies, 16 releases and 17 budgets are kept for the design's
  // later phases (C4, C7).
  repeated OrganizationUsageCoverage coverage = 18;
  // The reconciliation line: this project's share of the organization's
  // allowance credit over the period to date (zero or negative, basis
  // estimated, allocated). Σ drivers' list + allowance_share = month_to_date.
  ProjectCostAmount allowance_share = 19;
  // List price over the last 24 complete hours.
  ProjectCostAmount last_24h = 20;
  // The previous period's days, for the comparison line.
  repeated ProjectCostDay last_period_daily = 21;
  google.protobuf.Timestamp last_period_start = 22;
}

// === BillingService (public) ===
//
// User-facing billing RPCs. Admin-only (org-scoped or arbitrary-user) and
// gateway-internal usage-reservation RPCs live in
// BillingAdminService / BillingGatewayService.

service BillingService {
  // Canonical current-period organization accounting. Requires billing:read,
  // not billing management. Unknown amounts stay absent; no historical range.
  rpc GetOrganizationCostSummary(GetOrganizationCostSummaryRequest) returns (GetOrganizationCostSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // The organization's storage pool: everything it keeps at rest, by product,
  // against the pool's included amount. Requires billing:read, re-checked at use,
  // scoped to the caller's organization. Read-only; reports today's billing basis
  // per product (most products are tracked, not charged, until the pool's billing
  // cutover).
  // forge:custom
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // History of the organization's usage and spend, built from durable
  // ledgers (never live telemetry). Requires billing:read, re-checked at use,
  // and is scoped to the caller's organization. Range is at most 400 days.
  rpc ListOrganizationUsage(ListOrganizationUsageRequest) returns (ListOrganizationUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // One project's cost for one UTC calendar month, dashboard-shaped: the
  // estimated bill to date, the forecast, last month, daily list price,
  // drivers per workload, allowances and caps. The server owns every figure's
  // arithmetic and its basis. Requires billing:read, re-checked at use;
  // environment-bound credentials are refused. The project must belong to
  // org_id (NOT_FOUND otherwise), and environment_ids must be its
  // environments.
  rpc GetProjectCost(GetProjectCostRequest) returns (GetProjectCostResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // Read-only catalog.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // Current user subscription / billing portal / invoices.
  rpc GetCurrentUserSubscription(GetCurrentUserSubscriptionRequest) returns (GetCurrentUserSubscriptionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc CreateCurrentUserCheckoutSession(CreateCurrentUserCheckoutSessionRequest) returns (CreateCurrentUserCheckoutSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc CreateCurrentUserBillingPortalSession(CreateCurrentUserBillingPortalSessionRequest) returns (CreateCurrentUserBillingPortalSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Remains POST-only: each invoice carries Stripe's hosted-invoice and PDF
  // URLs, bearer links that must not be cached as a safe read.
  rpc ListCurrentUserInvoices(ListCurrentUserInvoicesRequest) returns (ListCurrentUserInvoicesResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // ListOrgLimitChanges is the org's limit-change history, newest first: who
  // changed which limit, from what, to what, and when. One list across every
  // org limit (observability spend cap today; LLM cap, infra overage and wallet
  // auto-recharge as they adopt it). Any member of org_id may read it.
  //
  // forge:custom — hand-written over the shared org_limit_changes table; it is
  // not an entity list, so it gets no CRUD wiring or admin page.
  rpc ListOrgLimitChanges(ListOrgLimitChangesRequest) returns (ListOrgLimitChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // Wallet (per-user).
  rpc GetCurrentUserWalletOverview(GetCurrentUserWalletOverviewRequest) returns (GetCurrentUserWalletOverviewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // (GrantCurrentUserWelcomeCredit removed. There is no signup wallet credit:
  // LLM credit is redeemed from a coupon, RedeemCoupon.)
  rpc CreateCurrentUserWalletTopupSession(CreateCurrentUserWalletTopupSessionRequest) returns (CreateCurrentUserWalletTopupSessionResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // CreateCurrentUserWalletTopupPaymentIntent mints a PaymentIntent for a
  // top-up the user confirms in OUR page with Stripe Elements, rather than in
  // Stripe's hosted or embedded Checkout.
  //
  // The counterpart of CreateCurrentUserWalletPaymentMethodSetup: same "return
  // a client secret and let Stripe.js collect the card" division of labour, so
  // no card data reaches us. That one saves a card; this one moves money.
  //
  // Confirmation is the browser's, entitlement is still the webhook's. A
  // succeeded confirmation reported by the client grants nothing on its own.
  rpc CreateCurrentUserWalletTopupPaymentIntent(CreateCurrentUserWalletTopupPaymentIntentRequest) returns (CreateCurrentUserWalletTopupPaymentIntentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // GetCurrentUserWalletTopupQuote prices a top-up WITHOUT minting anything at
  // Stripe, so the checkout page can disclose the top-up service fee, and the
  // total it makes, before asking for a card.
  //
  // THE REASON THIS IS AN RPC AND NOT CLIENT ARITHMETIC: a fee the browser
  // computes is a number the browser can change, and — more mundanely but more
  // likely — a second implementation of the same rule, free to disagree with
  // the one that builds the charge. This returns the breakdown from the same
  // function the PaymentIntent's amount is derived from, so what the user is
  // shown and what their card is charged cannot drift apart.
  //
  // Creates no Stripe object and no database row: the picker can call it on
  // every amount the user clicks.
  rpc GetCurrentUserWalletTopupQuote(GetCurrentUserWalletTopupQuoteRequest) returns (GetCurrentUserWalletTopupQuoteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // RedeemCoupon credits the caller's org wallet from a coupon code.
  //
  // END-USER facing (any authenticated caller), unlike the coupon MANAGEMENT
  // RPCs — those
  // live on the internal-only service and are served by a different
  // deployment. Redeeming is something a customer does; issuing is not.
  //
  // Idempotent per (coupon, org): a second redemption of the same code by the
  // same org is refused rather than credited twice.
  rpc RedeemCoupon(RedeemCouponRequest) returns (RedeemCouponResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Reliant managed-LLM access (per-user).
  rpc GetCurrentUserReliantState(GetCurrentUserReliantStateRequest) returns (GetCurrentUserReliantStateResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc RepairCurrentUserReliantAccess(RepairCurrentUserReliantAccessRequest) returns (RepairCurrentUserReliantAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc RotateCurrentUserReliantAccess(RotateCurrentUserReliantAccessRequest) returns (RotateCurrentUserReliantAccessResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc GetCurrentUserReliantOverview(GetCurrentUserReliantOverviewRequest) returns (GetCurrentUserReliantOverviewResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // SetCurrentUserReliantEnabled turns managed Reliant LLM access on or off
  // for the caller. This is the ONLY writer of reliant_enabled: the flag is a
  // user preference, never inferred from wallet balance, org membership, or
  // provisioning state. A funded user may still prefer their own API key.
  rpc SetCurrentUserReliantEnabled(SetCurrentUserReliantEnabledRequest) returns (SetCurrentUserReliantEnabledResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Workspace compute plan (per-user). Remains POST-only: the response may
  // contain a bearer management URL and must not be cached as a safe read.
  rpc GetCurrentUserComputeSubscription(GetCurrentUserComputeSubscriptionRequest) returns (GetCurrentUserComputeSubscriptionResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SetCurrentUserComputeOverage(SetCurrentUserComputeOverageRequest) returns (SetCurrentUserComputeOverageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Deploy (infrastructure) overage ceiling — the cpu/memory/storage twin of
  // the compute pair above. Separate from it because the two cap different
  // products through different gates; see SetCurrentUserInfraOverageRequest.
  //
  // Deprecated for hosting: Reliant hosting (PAYG) is bounded by the
  // organization's hosting budget instead (SetUsageBillingBudget, read back by
  // GetCurrentUserUsageBilling). This per-user cap never gates hosted
  // admission. The RPC keeps working for v1 clients and is not removed.
  rpc SetCurrentUserInfraOverage(SetCurrentUserInfraOverageRequest) returns (SetCurrentUserInfraOverageResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Everything the deploy overage surface renders from, in one call:
  // consumption, allowance, the customer's cap, and the current ladder rung
  // per dimension.
  rpc GetCurrentUserInfraOverage(GetCurrentUserInfraOverageRequest) returns (GetCurrentUserInfraOverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // CreateCurrentUserComputeSubscriptionIntent starts a compute subscription
  // the user pays for in OUR page with Stripe Elements, rather than in
  // Stripe's hosted Checkout page inside an iframe.
  //
  // The subscription counterpart of
  // CreateCurrentUserWalletTopupPaymentIntent, and the recurring twin of it:
  // same "we mint, the browser confirms, the card never reaches us" division
  // of labour. The subscription is created in `incomplete` status and moves no
  // money until the browser confirms.
  //
  // It grants NO entitlement and cancels NO existing subscription. An
  // abandoned payment leaves the caller exactly as they were, and Stripe
  // expires the unpaid subscription on its own. Entitlement — and cancelling
  // the plan this one supersedes — remains the webhook's, on the signal that
  // confirms the money actually moved.
  rpc CreateCurrentUserComputeSubscriptionIntent(CreateCurrentUserComputeSubscriptionIntentRequest) returns (CreateCurrentUserComputeSubscriptionIntentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }

  // Machine pricing is accepted explicitly for the next billing period only.
  rpc GetMachinePricingReadiness(GetMachinePricingReadinessRequest) returns (GetMachinePricingReadinessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc AcceptNextMachinePricing(AcceptNextMachinePricingRequest) returns (AcceptNextMachinePricingResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "explicit future-period pricing consent is persisted in the acceptance ledger"}
    };
  }

  // Quotes a change of the org's machine plan: an upgrade applies now and is
  // charged the prorated difference today; a downgrade applies at the next
  // billing period and charges or credits nothing; choosing the current plan
  // while a downgrade is scheduled withdraws it. Changes nothing. The quote is
  // binding for ten minutes through terms_sha256. A pure read: it reads the
  // subscription, period, snapshot and pending/scheduled changes, and prices
  // an upgrade with Stripe's invoice preview, which persists nothing.
  rpc PreviewMachinePlanChange(PreviewMachinePlanChangeRequest) returns (PreviewMachinePlanChangeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  // Makes the change the caller confirmed, at exactly its quote: an upgrade
  // is paid before it applies (a declined payment changes nothing), a
  // downgrade is scheduled for the next period. Retrying the same confirmed
  // quote never charges twice.
  rpc ChangeMachinePlan(ChangeMachinePlanRequest) returns (ChangeMachinePlanResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "each attempt and its outcome are persisted in the machine_plan_changes ledger"}
    };
  }

  // Independent organization-wide hosted usage funding; never requires a machine plan.
  rpc GetCurrentUserUsageBilling(GetCurrentUserUsageBillingRequest) returns (GetCurrentUserUsageBillingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  // Explicit PAYG consent. Does not grant funding until verified Stripe reconciliation.
  rpc CreateCurrentUserUsageBillingCheckout(CreateCurrentUserUsageBillingCheckoutRequest) returns (CreateCurrentUserUsageBillingCheckoutResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "billing consent is recorded in the usage agreement and audit log"}
    };
  }
  // SetUsageBillingBudget changes the organization's monthly hosting
  // admission budget without a new Stripe checkout. Each change appends a new
  // budget version (never edits one) recording the actor, the time and the
  // hosting usage policy version the actor accepted; the newest version is the
  // budget admission reads, from the next deploy on. Requires owner or admin of
  // org_id and an enrolled (non-pending, non-canceled) usage billing agreement.
  // Lowering the budget below this month's spend refuses new deploys at once;
  // running work is never stopped by it.
  rpc SetUsageBillingBudget(SetUsageBillingBudgetRequest) returns (SetUsageBillingBudgetResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "each change is an append-only budget version, plus org_limit_changes and audit_log rows"}
    };
  }
  // ListUsageBillingBudgetVersions is the current agreement's budget history,
  // newest first, ending with version 0: the budget consented at checkout. Any
  // member of org_id may read it.
  //
  // forge:custom — hand-written: version 0 is synthesized from the agreement
  // and only the current agreement's versions are listed, so it is not an
  // entity list and gets no CRUD wiring.
  rpc ListUsageBillingBudgetVersions(ListUsageBillingBudgetVersionsRequest) returns (ListUsageBillingBudgetVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
  // GetOrgHostingUsageSummary is this UTC month's hosting spend for one
  // organization, per app (deployment) and environment, with a projected
  // month-end figure (spend so far plus the current running rate for the rest
  // of the month: an estimate) and when new deploys would be refused by the
  // hosting budget at that rate. Hosting only: no machine, AI or observability
  // spend. Requires billing:read, re-checked at use.
  rpc GetOrgHostingUsageSummary(GetOrgHostingUsageSummaryRequest) returns (GetOrgHostingUsageSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
  // GetFreeHostingStatus reports the free static hosting allowance as it
  // applies to org_id: whether this org holds its founder's free allowance,
  // the sites using it, and storage and transfer used against the limits. Any
  // member of org_id may read it; only the founder learns which of their other
  // organizations holds the allowance.
  rpc GetFreeHostingStatus(GetFreeHostingStatusRequest) returns (GetFreeHostingStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // AI credit auto-recharge: refill the wallet from a saved card when the
  // balance falls below a threshold, bounded by a MANDATORY monthly ceiling.
  //
  // Three RPCs, because saving a card and arming the rule are separate
  // decisions: a user may save a card and never arm auto-recharge, and a
  // compute subscriber already HAS a saved card and only needs the rule.
  rpc GetCurrentUserWalletAutoRecharge(GetCurrentUserWalletAutoRechargeRequest) returns (GetCurrentUserWalletAutoRechargeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc SetCurrentUserWalletAutoRecharge(SetCurrentUserWalletAutoRechargeRequest) returns (SetCurrentUserWalletAutoRechargeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Begins saving a card for off-session use. Moves no money.
  //
  // Returns EITHER an already-saved payment method (the compute-subscriber
  // path, where this is a read rather than a collection) OR a SetupIntent
  // client secret to mount with Stripe.js — never both.
  rpc CreateCurrentUserWalletPaymentMethodSetup(CreateCurrentUserWalletPaymentMethodSetupRequest) returns (CreateCurrentUserWalletPaymentMethodSetupResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  // Records a card the user just saved. The server reads the card's details
  // back from Stripe; the client sends only the payment method ID.
  rpc ConfirmCurrentUserWalletPaymentMethod(ConfirmCurrentUserWalletPaymentMethodRequest) returns (ConfirmCurrentUserWalletPaymentMethodResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
  rpc GetCurrentUserComputeUsage(GetCurrentUserComputeUsageRequest) returns (GetCurrentUserComputeUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // GetCurrentUserComputeEligibility answers "can this caller start a managed
  // daemon right now, and if not, why".
  //
  // Exists because the client had no way to see COMPUTE entitlement at all: it
  // was gating the cloud-daemon button on the LLM entitlement
  // (ReliantEntitlement.status + reliant_enabled), which describes the wallet
  // that funds token spend and a managed-LLM preference — neither of which has
  // anything to do with whether a machine may run. The authoritative gate is
  // internal/svcdaemon.checkDaemonSizeAllowed; this RPC reports the same
  // funding facts so the UI can predict it instead of guessing.
  rpc GetCurrentUserComputeEligibility(GetCurrentUserComputeEligibilityRequest) returns (GetCurrentUserComputeEligibilityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // Misc per-org reads that callers expect on the public surface.
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetInvoicePreview(GetInvoicePreviewRequest) returns (GetInvoicePreviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }

  // Per-user billing email. UpdateBillingEmail persists a CONFIRMED billing
  // address (empty clears it) and, until an emailed confirmation exists,
  // accepts only the caller's own verified account email — any other address
  // is FAILED_PRECONDITION and nothing is stored. GetCurrentUserBillingEmail
  // returns the confirmed value plus the fallback (users.email / JWT) the
  // billing flows use when there is none. Backs reliant/web's
  // BillingEmailRequiredModal.
  rpc GetCurrentUserBillingEmail(GetCurrentUserBillingEmailRequest) returns (GetCurrentUserBillingEmailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {auth_required: true};
  }
  rpc UpdateBillingEmail(UpdateBillingEmailRequest) returns (UpdateBillingEmailResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "personal account and billing self-service, not org activity; audit_log records it"}
    };
  }
}

message ListPlansRequest {
  optional string product_id = 1;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  // The per-daemon price list (design §6.1), so the plan tiles and the machine
  // picker read multipliers, prices and disk sizes from the server.
  controlplane.v1.DaemonPricing daemon_pricing = 2;
}

message GetPlanRequest {
  string plan_id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
}

message GetCurrentUserSubscriptionRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message GetCurrentUserSubscriptionResponse {
  Subscription subscription = 1;
}

// CheckoutUiMode selects where Stripe renders the payment form.
//
// HOSTED mints a checkout.stripe.com page the client navigates to. EMBEDDED
// mints a client secret the client mounts in-page via @stripe/react-stripe-js's
// EmbeddedCheckout, so the user never leaves the app — on web, in Electron, and
// on mobile web.
//
// The two modes take DISJOINT redirect parameters and Stripe rejects the wrong
// pairing: success_url and cancel_url are "not allowed if ui_mode is embedded".
// So a request must set the pair that matches its mode; the other is ignored.
enum CheckoutUiMode {
  // Unspecified means HOSTED, so a client that predates embedded checkout
  // keeps working unchanged.
  CHECKOUT_UI_MODE_UNSPECIFIED = 0;
  CHECKOUT_UI_MODE_HOSTED = 1;
  CHECKOUT_UI_MODE_EMBEDDED = 2;
}

message CreateCurrentUserCheckoutSessionRequest {
  string plan_id = 1;
  // Hosted mode only. Validated against ALLOWED_REDIRECT_HOSTS. Ignored — and
  // not validated — when ui_mode is EMBEDDED, because Stripe forbids them there.
  string success_url = 2;
  string cancel_url = 3;

  // Where Stripe renders the form. Unset = HOSTED.
  CheckoutUiMode ui_mode = 4;

  // Embedded mode only, and optional. Stripe requires a return_url only when
  // redirect-based payment methods (some bank redirects) are enabled on the
  // session; cards and wallets never leave the iframe. Validated against the
  // redirect allowlist when present.
  string return_url = 5;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 6;
  // Explicit authoritative machine terms; candidate admission never infers them.
  string pricing_version = 7;
  string terms_sha256 = 8;
}

message CreateCurrentUserCheckoutSessionResponse {
  // Populated in HOSTED mode; empty in EMBEDDED.
  string checkout_url = 1;
  // Populated in EMBEDDED mode; empty in HOSTED. Pass to
  // EmbeddedCheckoutProvider as options.clientSecret.
  string client_secret = 2;
  // Echoed so the client never has to infer the response's shape from which
  // field happens to be non-empty.
  CheckoutUiMode ui_mode = 3;
  // The Stripe Checkout Session id, so the client can ask the SERVER what
  // happened rather than trusting its own onComplete callback.
  string session_id = 4;
}

message GetCurrentUserWalletOverviewRequest {
  int32 ledger_page = 1;
  int32 ledger_page_size = 2;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 3;
}

message GetCurrentUserWalletOverviewResponse {
  WalletOverview overview = 1;
}

message GetMachinePricingReadinessRequest {
  optional string org_id = 1;
  string pricing_version = 2;
  string plan_id = 3;
}
message GetMachinePricingReadinessResponse {
  string pricing_version = 1;
  bool activation_ready = 2;
  repeated string hold_reasons = 3;
  string terms_sha256 = 4;
  google.protobuf.Timestamp effective_period_start = 5;
  // Authoritative disclosure; the digest binds these exact proposed terms.
  int64 monthly_price_cents = 6;
  int64 included_own_size_hours = 7;
  int64 included_disk_gib = 8;
  string size = 9;
  string exact_hourly_rate_cents = 10;
  string exact_cost_weight = 11;
  string route_id = 12;
  // Consent alone schedules no Stripe change; activation remains pending verification.
  string activation_state = 13;
}
message AcceptNextMachinePricingRequest {
  optional string org_id = 1;
  string pricing_version = 2;
  string plan_id = 3;
  string terms_sha256 = 4;
}
message AcceptNextMachinePricingResponse {
  string acceptance_id = 1;
  google.protobuf.Timestamp effective_period_start = 2;
  string pricing_version = 3;
  string activation_state = 4;
}

message PreviewMachinePlanChangeRequest {
  // Active organization; resolved and authorized server-side. Empty selects primary org.
  optional string org_id = 1;
  // The compute plan to move to (plan_compute_*).
  string plan_id = 2;
}

// A machine the target plan does not include; a downgrade waits for it to be
// resized or deleted.
message MachinePlanChangeBlocker {
  string daemon_id = 1;
  string name = 2;
  string size = 3;
}

message PreviewMachinePlanChangeResponse {
  string from_plan_id = 1;
  string to_plan_id = 2;
  string pricing_version = 3;
  // "upgrade" (now), "downgrade" (at period_end) or "cancel_downgrade".
  string direction = 4;
  // The instant the change is priced at; ChangeMachinePlan must send it back.
  google.protobuf.Timestamp proration_date = 5;
  google.protobuf.Timestamp period_end = 6;
  // Charged to the card today. Zero unless an upgrade.
  int64 amount_due_today_cents = 7;
  // Net proration for the rest of the period, charged today. Zero unless an
  // upgrade.
  int64 proration_cents = 8;
  int64 current_monthly_price_cents = 9;
  int64 new_monthly_price_cents = 10;
  // Included hours an upgrade adds for the rest of this period, in hours of
  // the new plan's own size, rounded to 0.1. "0" otherwise.
  string included_hours_delta = 11;
  // The new plan's own size and its monthly included hours from the next period.
  string new_size = 12;
  int64 new_included_hours = 13;
  // Whether ChangeMachinePlan would accept this quote, and why not.
  bool allowed = 14;
  repeated string blocked_reasons = 15;
  repeated MachinePlanChangeBlocker blocking_machines = 16;
  // Binds every figure above; ChangeMachinePlan refuses any other digest.
  string terms_sha256 = 17;
  google.protobuf.Timestamp quote_expires_at = 18;
  // When the new plan takes effect: proration_date for an upgrade,
  // period_end for a downgrade.
  google.protobuf.Timestamp effective_at = 19;
  // The plan a scheduled downgrade will move to at period_end, if any.
  string scheduled_plan_id = 20;
}

message ChangeMachinePlanRequest {
  optional string org_id = 1;
  string plan_id = 2;
  string pricing_version = 3;
  // proration_date and terms_sha256 exactly as PreviewMachinePlanChange returned them.
  google.protobuf.Timestamp proration_date = 4;
  string terms_sha256 = 5;
}

message ChangeMachinePlanResponse {
  string change_id = 1;
  // "applied": the upgrade is in effect, or the scheduled downgrade is
  // withdrawn. "scheduled": the downgrade takes effect at effective_at.
  // "confirming": Stripe's answer was lost in transit; the change settles
  // automatically, and retrying the same request is safe.
  string state = 2;
  string plan_id = 3;
  string direction = 4;
  int64 amount_due_today_cents = 5;
  int64 proration_cents = 6;
  string stripe_invoice_id = 7;
  google.protobuf.Timestamp effective_at = 8;
}

message GetCurrentUserUsageBillingRequest {
  // Active organization; resolved and authorized server-side. Empty selects primary org.
  optional string org_id = 1;
}

// Funding for hosted apps, not a machine entitlement or observability package.
message UsageBillingAgreement {
  string id = 1;
  string status = 2;
  // UTC calendar-month hosting admission budget, not a synchronous cost
  // ceiling. The CURRENT budget: the newest budget version
  // (SetUsageBillingBudget), else the budget consented at checkout.
  int64 infra_budget_cents = 3;
  string policy_version = 4;
  google.protobuf.Timestamp billing_start_at = 5;
  // The budget consented at checkout (budget version 0).
  int64 consented_infra_budget_cents = 6;
  // The budget version infra_budget_cents comes from; 0 is the checkout's.
  int64 budget_version = 7;
}

message SetUsageBillingBudgetRequest {
  // Active organization; resolved and authorized server-side (owner/admin).
  // Empty selects the caller's primary org.
  optional string org_id = 1;
  // The new monthly hosting admission budget, in cents. Must be positive.
  int64 infra_budget_cents = 2;
  // The hosting usage policy version the caller was shown
  // (GetCurrentUserUsageBillingResponse.policy_version). It must be the
  // current one; it is recorded on the new version.
  string policy_version = 3;
  // The caller's explicit acceptance of that policy for this budget. Must be
  // true.
  bool consent = 4;
  // Optimistic concurrency: when set, the change applies only if the current
  // budget version is this one (FAILED_PRECONDITION otherwise). Unset: the
  // change applies on top of whatever is current.
  optional int64 expected_current_version = 5;
}

message SetUsageBillingBudgetResponse {
  // The agreement as admission now reads it.
  UsageBillingAgreement agreement = 1;
  // The version this call appended.
  UsageBillingBudgetVersion version = 2;
}

// One version of an organization's hosting budget. Versions are append-only.
message UsageBillingBudgetVersion {
  int64 infra_budget_cents = 1;
  // Who set it. Empty for version 0, which the checkout consent recorded.
  string actor_user_id = 2;
  string actor_email = 3;
  google.protobuf.Timestamp created_at = 4;
  // The hosting usage policy version accepted with this budget.
  string policy_version = 5;
  // 0 is the budget consented at checkout; each change adds one.
  int64 version = 6;
  // "checkout_consent" (version 0) or "budget_change".
  string source = 7;
  string agreement_id = 8;
  // True for the version admission reads now.
  bool current = 9;
}

message ListUsageBillingBudgetVersionsRequest {
  // Active organization; empty selects the caller's primary org.
  optional string org_id = 1;
}

message ListUsageBillingBudgetVersionsResponse {
  // Newest first. Empty when the org has no usage billing agreement.
  repeated UsageBillingBudgetVersion versions = 1;
}

message GetOrgHostingUsageSummaryRequest {
  // Active organization; empty selects the caller's primary org.
  optional string org_id = 1;
}

message GetOrgHostingUsageSummaryResponse {
  // Hosting spend this UTC month so far (since billing started, when that is
  // later): the same figure the budget is compared against.
  int64 spent_cents = 1;
  // spent_cents plus the current running rate for the rest of the month.
  int64 projected_month_end_cents = 2;
  // Always true today: the projection assumes today's running rate holds.
  bool projection_is_estimate = 3;
  // The current hosting budget; 0 when the org has no usage billing agreement.
  int64 budget_cents = 4;
  google.protobuf.Timestamp period_start = 5;
  google.protobuf.Timestamp period_end = 6;
  // When new deploys would be refused by the budget at the current running
  // rate, if before period_end. Equal to generated time when already reached.
  optional google.protobuf.Timestamp blocked_at = 7;
  // Per app (deployment) and environment, most expensive first.
  repeated HostingAppUsage apps = 8;
  // The usage the figures include ends here (metering trails real time).
  google.protobuf.Timestamp measured_through = 9;
  // The current running rate, in cents per hour, across the org's hosting.
  double running_rate_cents_per_hour = 10;
  // spent_cents has reached budget_cents: new deploys are refused now.
  bool budget_reached = 11;
  // The org's usage billing agreement is active.
  bool billing_active = 12;
}

message HostingAppUsage {
  string deployment_id = 1;
  string deployment_name = 2;
  string environment_id = 3;
  string environment_name = 4;
  // This month so far, at list price (an estimate).
  int64 spent_cents = 5;
  // spent_cents plus this app's running rate for the rest of the month.
  int64 projected_cents = 6;
  // Static sites only: bytes held in the platform bucket (live + retained
  // releases). 0 with static_storage_measured false when not measured.
  int64 static_storage_bytes = 7;
  // Static sites only: bytes served this month.
  int64 static_transfer_bytes = 8;
  bool static_storage_measured = 9;
}

message GetFreeHostingStatusRequest {
  // Active organization; empty selects the caller's primary org.
  optional string org_id = 1;
}

message GetFreeHostingStatusResponse {
  // This org holds its founder's free static hosting allowance.
  bool is_designated = 1;
  // When another org of the founder holds the allowance: its name, set only
  // when the caller is that founder. Empty otherwise.
  string held_by_org_name = 2;
  // The caller is this org's accountable founder (organizations.owner_id).
  bool caller_is_founder = 3;
  // The org's live static sites counted against the allowance (only when
  // is_designated).
  repeated FreeHostingSite sites = 4;
  // Site-count limit of the allowance. 0 means no limit (signed-in free
  // hosting has none); a positive value is a cap.
