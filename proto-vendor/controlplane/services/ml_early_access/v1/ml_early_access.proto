syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/ml_early_access/v1;ml_early_accessv1";

// === MlEarlyAccessService ===
//
// EARLY ACCESS, BY REQUEST. The read side of the console's ML tab (forge
// docs/proposals/ml-workloads.md §8): machines, the ML stack found in a
// connected cluster, recommendations, training runs, model versions and
// inference services.
//
// This service exists so the console's ML pages, and the demo shell's
// fixtures, are typed against one contract before the data behind it exists.
// It is deliberately NOT the proposal's MlService: when the real service
// ships (rollout slices 1-5), it replaces this one, which is then deprecated
// and kept answering as it does now. Fields here may be added; none will be
// repurposed.
//
// ACCESS. Every rpc is gated per org on the "ml" entitlement
// (OrganizationService.GetMyOrgEntitlements; Reliant grants it). In order:
//
//   - InvalidArgument: no org_id.
//   - PermissionDenied, reason "not_org_member": the caller is not a member
//     of org_id. Machine credentials are refused (reason "human_only").
//   - PermissionDenied, reason "FEATURE_NOT_ENTITLED", metadata feature=ml:
//     the org has no "ml" entitlement. The message says how to request it.
//   - Unimplemented: the org is entitled, and the data this rpc reads does
//     not exist yet on this control plane. Nothing here ever answers with
//     invented data; only the demo shell's fixtures do.
service MlEarlyAccessService {
  option (forge.v1.service) = {
    name: "MlEarlyAccessService"
    version: "0.1.0"
    description: "Early access: the console ML tab's reads (machines, stack, recommendations, runs, models, inference)"
  };

  // GetMlMachines reports the accelerator nodes of the org's connected
  // clusters, by pool: allocation against utilisation, and health flags with
  // their evidence.
  rpc GetMlMachines(GetMlMachinesRequest) returns (GetMlMachinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetMlStack reports the ML components discovered in each connected
  // cluster: adopted (found, theirs), installed by forge, or missing.
  rpc GetMlStack(GetMlStackRequest) returns (GetMlStackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListMlFindings lists the recommendations engine's open findings, worst
  // first, each with its evidence and the adopt-first fix.
  //
  // forge:custom — an early-access read with no table behind it yet.
  rpc ListMlFindings(ListMlFindingsRequest) returns (ListMlFindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListMlRuns lists training runs, newest first.
  //
  // forge:custom — an early-access read with no table behind it yet.
  rpc ListMlRuns(ListMlRunsRequest) returns (ListMlRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListMlModels lists models and their versions, by OCI digest.
  //
  // forge:custom — an early-access read with no table behind it yet.
  rpc ListMlModels(ListMlModelsRequest) returns (ListMlModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListMlInferenceServices lists inference services with their serving SLIs
  // and the release health verdict of their latest promotion.
  //
  // forge:custom — an early-access read with no table behind it yet.
  rpc ListMlInferenceServices(ListMlInferenceServicesRequest) returns (ListMlInferenceServicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
}

// --- Machines ---------------------------------------------------------------

message GetMlMachinesRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // One connected cluster; unset for every cluster of the org.
  optional string cluster_id = 2;
}

message GetMlMachinesResponse {
  repeated MlCluster clusters = 1;
  repeated MlNodePool pools = 2;
  // When the inventory these come from was observed.
  google.protobuf.Timestamp observed_at = 3;
}

// MlCluster is a connected cluster that reports ML inventory.
message MlCluster {
  string cluster_id = 1;
  string name = 2;
  // "gke", "eks", "aks" or "other".
  string provider = 3;
  // The region or zone, as the cluster reports it.
  string location = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

// MlNodePool is the accelerator nodes of one pool of one cluster.
message MlNodePool {
  string cluster_id = 1;
  string name = 2;
  // "nvidia", "amd", "google" or "aws".
  string accelerator_vendor = 3;
  // The product, e.g. "NVIDIA H100 80GB HBM3".
  string accelerator_product = 4;
  int32 accelerators_total = 5;
  int32 accelerators_allocated = 6;
  // Allocated, but under 5% utilisation for at least an hour.
  int32 accelerators_idle = 7;
  repeated MlNode nodes = 8;
  // Pool-wide utilisation against allocation over the last 24h, oldest first.
  repeated MlUtilizationPoint utilization = 9;
}

// MlNodeHealth summarizes a node's health flags.
enum MlNodeHealth {
  ML_NODE_HEALTH_UNSPECIFIED = 0;
  ML_NODE_HEALTH_HEALTHY = 1;
  // Something to watch (a correctable error rate, a driver skew), not a fault.
  ML_NODE_HEALTH_DEGRADED = 2;
  // A device is faulty (a fatal Xid, an uncorrectable ECC error,
  // allocatable below capacity): the node should not get new work.
  ML_NODE_HEALTH_BAD = 3;
}

message MlNode {
  string name = 1;
  int32 accelerator_count = 2;
  int32 accelerators_allocatable = 3;
  int32 accelerators_allocated = 4;
  // Mean accelerator utilisation over the last 5 minutes, 0-100.
  double utilization_percent = 5;
  // Mean accelerator memory in use over the last 5 minutes, 0-100.
  double memory_used_percent = 6;
  string driver_version = 7;
  // "none", "mig" or "time-slicing".
  string sharing = 8;
  MlNodeHealth health = 9;
  repeated MlHealthFlag flags = 10;
  bool cordoned = 11;
}

// MlHealthFlag is one piece of health evidence on a node.
message MlHealthFlag {
  // "xid", "ecc_dbe", "row_remap_failure", "condition" or
  // "allocatable_below_capacity".
  string kind = 1;
  // The code, e.g. "79" for an Xid.
  string code = 2;
  // The device it concerns, e.g. "GPU-3"; empty for the node as a whole.
  string device = 3;
  string message = 4;
  google.protobuf.Timestamp first_seen_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
}

message MlUtilizationPoint {
  google.protobuf.Timestamp time = 1;
  // Mean utilisation of the pool's accelerators, 0-100.
  double utilization_percent = 2;
  // Share of the pool's accelerators allocated to pods, 0-100.
  double allocated_percent = 3;
}

// --- Stack ------------------------------------------------------------------

message GetMlStackRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  optional string cluster_id = 2;
}

message GetMlStackResponse {
  repeated MlStackComponent components = 1;
}

// MlComponentState is how forge relates to a component in a cluster.
enum MlComponentState {
  ML_COMPONENT_STATE_UNSPECIFIED = 0;
  // Found in the cluster and theirs: forge reads it and never touches it.
  ML_COMPONENT_STATE_ADOPTED = 1;
  // Not found, so forge installed it from a pinned upstream chart.
  ML_COMPONENT_STATE_INSTALLED = 2;
  // Not found and not installed.
  ML_COMPONENT_STATE_MISSING = 3;
}

message MlStackComponent {
  string cluster_id = 1;
  // e.g. "dcgm-exporter", "kueue", "node-problem-detector".
  string name = 2;
  // "telemetry", "health", "scheduling", "training", "serving" or "drivers".
  string category = 3;
  MlComponentState state = 4;
  string version = 5;
  // How it got there, e.g. "GPU Operator v24.9.0".
  string via = 6;
  string namespace = 7;
  // The KCL that declares it (Adopt or Install), as forge ml discover
  // proposes it.
  string declaration = 8;
  string note = 9;
}

// --- Recommendations ----------------------------------------------------------

message ListMlFindingsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  optional string cluster_id = 2;
}

message ListMlFindingsResponse {
  // Worst first, then most recently seen.
  repeated MlFinding findings = 1;
}

enum MlFindingSeverity {
  ML_FINDING_SEVERITY_UNSPECIFIED = 0;
  ML_FINDING_SEVERITY_CRITICAL = 1;
  ML_FINDING_SEVERITY_WARNING = 2;
  ML_FINDING_SEVERITY_INFO = 3;
}

message MlFinding {
  // This finding's id.
  string id = 1;
  // The rule, e.g. "bad-accelerator" (forge docs/proposals/ml-workloads.md
  // §5): what a RecommendationDecision names.
  string rule_id = 2;
  MlFindingSeverity severity = 3;
  string title = 4;
  string summary = 5;
  string cluster_id = 6;
  // What it is about: a node, a pool or a workload.
  string subject = 7;
  repeated MlEvidence evidence = 8;
  // The fix, adopt first: a KCL diff, or the exact command for a setting
  // outside forge's declarations. Either may be empty.
  string fix_kcl = 9;
  string fix_command = 10;
  google.protobuf.Timestamp first_seen_at = 11;
  google.protobuf.Timestamp last_seen_at = 12;
  // Set on startup findings: where a pod's start time goes.
  MlPodStartBreakdown pod_start = 13;
}

message MlEvidence {
  string label = 1;
  string value = 2;
}

// MlPodStartBreakdown is where the time from a pod's creation to Ready goes,
// stage by stage, over recent starts of one workload.
message MlPodStartBreakdown {
  string workload = 1;
  int32 sample_count = 2;
  // In order: e.g. "scheduling", "image pull", "container start",
  // "model load", "ready".
  repeated MlStartStage stages = 3;
}

message MlStartStage {
  string name = 1;
  double p50_seconds = 2;
  double p95_seconds = 3;
}

// --- Runs ---------------------------------------------------------------------

message ListMlRunsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // One project (app); unset for every project of the org.
  optional string project = 2;
}

message ListMlRunsResponse {
  // Newest first.
  repeated MlRun runs = 1;
}

enum MlRunState {
  ML_RUN_STATE_UNSPECIFIED = 0;
  // Waiting for admission (Kueue) or capacity.
  ML_RUN_STATE_QUEUED = 1;
  ML_RUN_STATE_RUNNING = 2;
  ML_RUN_STATE_SUCCEEDED = 3;
  ML_RUN_STATE_FAILED = 4;
  ML_RUN_STATE_CANCELLED = 5;
}

message MlRun {
  string id = 1;
  string name = 2;
  string project = 3;
  // The declared training template it was launched from.
  string template = 4;
  // The orchestrator's kind, e.g. "TrainJob" or "JobSet".
  string orchestrator = 5;
  string cluster_id = 6;
  MlRunState state = 7;
  map<string, string> params = 8;
  // Who launched it: a person's email, or a token's name.
  string launched_by = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  int32 accelerator_count = 12;
  string accelerator_product = 13;
  int32 restarts = 14;
  int32 preemptions = 15;
  repeated MlMetricSeries metrics = 16;
  // The model version it produced, by OCI digest; empty when none.
  string output_model_digest = 17;
}

message MlMetricSeries {
  // e.g. "loss", "eval/accuracy", "accelerator_utilization".
  string name = 1;
  string unit = 2;
  repeated MlMetricPoint points = 3;
}

message MlMetricPoint {
  int64 step = 1;
  google.protobuf.Timestamp time = 2;
  double value = 3;
}

// --- Models -------------------------------------------------------------------

message ListMlModelsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  optional string project = 2;
}

message ListMlModelsResponse {
  repeated MlModel models = 1;
}

message MlModel {
  string name = 1;
  string project = 2;
  // The OCI repository, without tag or digest.
  string repository = 3;
  // Newest first.
  repeated MlModelVersion versions = 4;
}

message MlModelVersion {
  // "sha256:<hex>": the version's identity.
  string digest = 1;
  // A tag pointing at it, if any.
  string tag = 2;
  google.protobuf.Timestamp created_at = 3;
  // The run that produced it; empty when pushed by hand.
  string run_id = 4;
  int64 size_bytes = 5;
  map<string, double> eval_metrics = 6;
  // The inference services serving it now, as "<project>/<env>/<service>".
  repeated string serving_in = 7;
}

// --- Inference ----------------------------------------------------------------

message ListMlInferenceServicesRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  optional string project = 2;
}

message ListMlInferenceServicesResponse {
  repeated MlInferenceService services = 1;
}

enum MlReleaseVerdict {
  ML_RELEASE_VERDICT_UNSPECIFIED = 0;
  ML_RELEASE_VERDICT_PASS = 1;
  ML_RELEASE_VERDICT_FAIL = 2;
  // The check could not prove the release good (too little traffic).
  ML_RELEASE_VERDICT_INCONCLUSIVE = 3;
}

message MlInferenceService {
  string name = 1;
  string project = 2;
  string environment = 3;
  string cluster_id = 4;
  // The serving runtime and version, e.g. "vLLM 0.6.3".
  string runtime = 5;
  // The forge release it runs.
  string release = 6;
  // The model version it serves, by OCI digest.
  string model_digest = 7;
  int32 replicas = 8;
  double ttft_p95_ms = 9;
  double queue_wait_p95_ms = 10;
  double tokens_per_second = 11;
  double accelerator_utilization_percent = 12;
  double kv_cache_usage_percent = 13;
  // Where a new replica's start time goes.
  MlPodStartBreakdown cold_start = 14;
  MlReleaseVerdict release_verdict = 15;
  // What the verdict says, e.g. "TTFT p95 within 5% of baseline".
  string release_verdict_summary = 16;
  google.protobuf.Timestamp release_checked_at = 17;
}
