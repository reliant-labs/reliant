syntax = "proto3";

// OrganizationService is the caller's view of the organizations they belong
// to. Users and orgs are many-to-many: a person can be a member of several
// orgs, and an org can have several members (controlplane.org_memberships).
//
// Every org-scoped operation acts in ONE org that the caller is a member of.
// When a request names none, it acts in the caller's DEFAULT org: the one
// SetDefaultOrganization stored, or their oldest membership until they choose.
// There is no "first org of the user" anywhere else. docs/orgs.md is the full
// contract, including how a request names its org.
//
// Callers are HUMANS (a Supabase/Zitadel session). A machine credential
// (an `rlat_` token) is bound to exactly one org when it is minted, so it has
// no orgs to list or choose between, and every rpc here refuses it.
package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/organization/v1;organizationv1";

service OrganizationService {
  // ListMyOrganizations lists every org the caller belongs to, with their role
  // in each, oldest org first, and which one is their default. An org switcher
  // and `forge login`'s org choice are built on it.
  rpc ListMyOrganizations(ListMyOrganizationsRequest) returns (ListMyOrganizationsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // SetDefaultOrganization makes org_id the org the caller acts in when a
  // request names none. It is a per-person preference stored server-side, so
  // it follows them to every device and client. It is not a session: a client
  // that wants to act in another org for a while names that org on its
  // requests instead.
  //
  // PermissionDenied when the caller is not a member of org_id. That includes
  // an org that does not exist, so the answer does not reveal which orgs exist.
  rpc SetDefaultOrganization(SetDefaultOrganizationRequest) returns (SetDefaultOrganizationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {none: "a personal preference about which org requests default to; it changes nothing in any org"}
    };
  }

  // --- Members (docs/design/orgs-and-members.md, phase 1) -------------------
  //
  // Every rpc below is for HUMAN callers: a machine credential is
  // PermissionDenied, reason "human_only". Every rpc that acts on an existing
  // org carries a REQUIRED org_id, so a destructive call can never fall back
  // to the default org by omission. Membership administration is gated on the
  // caller's ROLE in the org (admin or owner), never on a token scope: it is
  // never token-callable. Errors carry a stable x-forge-error-reason; the
  // table is in the design doc, §2.14.

  // CreateOrganization creates an org owned by the caller, with them as its
  // owner member. It becomes their default only when they have none. Anyone
  // with a verified email may create one (reason "email_unverified"
  // otherwise), up to a per-person cap (ResourceExhausted, "owned_org_limit").
  // A taken slug is AlreadyExists, "slug_taken".
  //
  // forge:custom — not the generic CRUD of the shared Organization message:
  // it creates the owner membership and grant preset in the same transaction.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create_org"
        target: {
          kind: "member"
          id: "response.organization.id"
          label: "response.organization.name"
        }
        scope: "response.organization.id"
        detail: ["response.organization.slug"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // ListMembers lists the org's members (roster fields only) and its seat
  // usage. Any member may call it. Which permissions each member holds stays
  // on AccessTokenService.ListOrgMemberGrants.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // InviteMember invites an email address into the org with a role. Admin or
  // owner; only an owner may invite an owner. Idempotent per (org, email): a
  // second invite of an address with a pending invitation rotates its token,
  // extends its expiry, re-sends it and answers resent=true (that is the
  // "resend" action). accept_url is returned to the inviter as a copy-link
  // fallback; it is useless to anyone whose verified email does not match.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "invite"
        target: {
          kind: "member"
          id: "response.invitation.id"
          label: "response.invitation.email"
        }
        scope: "org_id"
        detail: ["role", "response.resent"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // ListInvitations lists the org's invitations, pending ones by default.
  // Admin or owner: they are other people's email addresses.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // RevokeInvitation revokes a pending invitation. Admin or owner; only an
  // owner may revoke an owner invitation.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "revoke_invite"
        target: {
          kind: "member"
          id: "invitation_id"
        }
        scope: "org_id"
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // GetInvitation previews an invitation from its token, for the accept page.
  // It discloses little: the org's name, the role, the inviter, a masked
  // address and whether it matches the caller's verified email. An unknown
  // token is NotFound.
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // AcceptInvitation joins the caller to the invitation's org with its role.
  // The caller's VERIFIED email must equal the invitation's
  // (PermissionDenied, "invite_email_mismatch", and the invitation stays
  // pending). The seat limit is enforced here, under the org's membership
  // lock (ResourceExhausted, "seat_limit_reached").
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "join"
        target: {
          kind: "member"
          id: "response.user_id"
        }
        scope: "response.organization.id"
        detail: ["response.organization.role", "response.invitation_id"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // RemoveMember removes another member. Admin or owner; only an owner may
  // remove an owner; not yourself (FailedPrecondition, "cannot_remove_self":
  // use LeaveOrganization). The last owner cannot be removed ("last_owner").
  // Removal deletes their grants, revokes their tokens in this org and the
  // org-automation tokens they minted (daemon-bound tokens excepted), and
  // retires their LLM gateway keys in this org.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "remove"
        target: {
          kind: "member"
          id: "user_id"
        }
        scope: "org_id"
        detail: ["response.revoked_token_count"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // LeaveOrganization removes the caller from the org, with the same cleanup
  // as RemoveMember. The last owner cannot leave ("last_owner"). Returns the
  // caller's default org afterwards ("" when they belong to none).
  rpc LeaveOrganization(LeaveOrganizationRequest) returns (LeaveOrganizationResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "leave"
        target: {
          kind: "member"
          id: "response.user_id"
        }
        scope: "org_id"
        detail: ["response.revoked_token_count"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // UpdateMemberRole changes a member's role. Admin or owner; only an owner
  // may promote to or demote from owner. The current role is a no-op that
  // leaves grants alone; a real change resets the member's grants to the new
  // role's preset, and scopes says what they hold now. Demoting the last
  // owner is refused ("last_owner").
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "set_role"
        target: {
          kind: "member"
          id: "user_id"
        }
        scope: "org_id"
        detail: ["role"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }
}

// OrgMember is one member of an org, as its roster shows them.
message OrgMember {
  string user_id = 1;
  string email = 2;
  // "" when the person set none.
  string name = 3;
  string avatar_url = 4;
  // "owner", "admin" or "member".
  string role = 5;
  google.protobuf.Timestamp joined_at = 6;
  // True for the org's founding, accountable owner (organizations.owner_id).
  // It confers no authority; role does.
  bool is_founder = 7;
}

// SeatUsage is how many of the org's seats are taken.
message SeatUsage {
  // Live members (deleted accounts excluded).
  int32 members = 1;
  // Pending, unexpired invitations.
  int32 pending_invitations = 2;
  // The seat limit; -1 = unlimited.
  int32 limit = 3;
}

// OrgInvitation is one invitation, as an org admin sees it.
message OrgInvitation {
  string id = 1;
  string email = 2;
  string role = 3;
  string invited_by_user_id = 4;
  string invited_by_email = 5;
  // "pending", "accepted", "revoked" or "expired" (pending past expires_at).
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp last_sent_at = 9;
}

message CreateOrganizationRequest {
  // 1-80 characters after trimming.
  string name = 1;
  // ^[a-z][a-z0-9-]{1,48}[a-z0-9]$. Unset: derived from the name plus a short
  // random suffix.
  optional string slug = 2;
}

message CreateOrganizationResponse {
  MyOrganization organization = 1;
}

message ListMembersRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // Unset or 0 = 50; max 200.
  int32 page_size = 2;
  // next_page_token from the previous page.
  string page_token = 3;
}

message ListMembersResponse {
  // Oldest member first.
  repeated OrgMember members = 1;
  // Empty on the last page.
  string next_page_token = 2;
  SeatUsage seats = 3;
}

message InviteMemberRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string email = 2;
  // Required: "member", "admin" or "owner".
  string role = 3;
}

message InviteMemberResponse {
  OrgInvitation invitation = 1;
  // False when mail is not configured on this deployment or the send failed;
  // accept_url is then the delivery.
  bool email_sent = 2;
  // The link the invitee opens. Returned only here, never listed again.
  string accept_url = 3;
  // True when this re-sent an existing pending invitation.
  bool resent = 4;
}

message ListInvitationsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // Also list accepted, revoked and expired invitations.
  optional bool include_resolved = 2;
  // Unset or 0 = 50; max 200.
  int32 page_size = 3;
  string page_token = 4;
}

message ListInvitationsResponse {
  // Newest first.
  repeated OrgInvitation invitations = 1;
  string next_page_token = 2;
}

message RevokeInvitationRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string invitation_id = 2;
}

message RevokeInvitationResponse {}

message GetInvitationRequest {
  // The rinv_ token from the accept link.
  string token = 1;
}

message GetInvitationResponse {
  string org_name = 1;
  string role = 2;
  // The inviter's name, else their email.
  string invited_by_name = 3;
  // The invited address, masked: "a***@example.com".
  string invitee_email_hint = 4;
  // "pending", "accepted", "revoked" or "expired".
  string status = 5;
  google.protobuf.Timestamp expires_at = 6;
  // True when the caller's verified email is the invited one.
  bool email_matches = 7;
  // True when the caller is already a member of the org.
  bool already_member = 8;
}

message AcceptInvitationRequest {
  string token = 1;
}

message AcceptInvitationResponse {
  // The org the caller joined.
  MyOrganization organization = 1;
  // The caller, who is the member that joined.
  string user_id = 2;
  // The invitation that was accepted.
  string invitation_id = 3;
}

message RemoveMemberRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string user_id = 2;
}

message RemoveMemberResponse {
  // Access tokens revoked: the member's own in this org and the
  // org-automation tokens they minted (daemon-bound tokens excepted).
  int32 revoked_token_count = 1;
}

message LeaveOrganizationRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message LeaveOrganizationResponse {
  // The caller's default org now; "" when they belong to no org.
  string default_org_id = 1;
  // The caller, who is the member that left.
  string user_id = 2;
  // Access tokens revoked, as RemoveMemberResponse.revoked_token_count.
  int32 revoked_token_count = 3;
}

message UpdateMemberRoleRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string user_id = 2;
  // "member", "admin" or "owner".
  string role = 3;
}

message UpdateMemberRoleResponse {
  OrgMember member = 1;
  // The org permissions the member holds after the change.
  repeated string scopes = 2;
}

// MyOrganization is one org the caller belongs to, as they see it. It
// deliberately carries no billing identifiers or settings: any member can
// list it, while those belong to the billing surfaces.
message MyOrganization {
  string id = 1;
  string name = 2;
  string slug = 3;
  // The caller's role in this org: "owner", "admin" or "member".
  string role = 4;
  // True for the org requests that name none act in.
  bool is_default = 5;
  // True when the caller's role in this org is "owner". An org may have
  // several owners; this is the same fact as role == "owner", kept for old
  // clients. (Before several owners existed it meant
  // organizations.owner_id == caller, which was the same for every org.)
  bool is_owner = 6;
  google.protobuf.Timestamp created_at = 7;
  // When the caller joined the org.
  google.protobuf.Timestamp joined_at = 8;
}

message ListMyOrganizationsRequest {}

message ListMyOrganizationsResponse {
  // Oldest org first. Empty only for a signup still being provisioned.
  repeated MyOrganization organizations = 1;
  // The org requests that name none act in. "" when organizations is empty.
  string default_org_id = 2;
}

message SetDefaultOrganizationRequest {
  string org_id = 1;
}

message SetDefaultOrganizationResponse {
  string default_org_id = 1;
}
