syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/cluster/v1;clusterv1";

// === ClusterService ===
//
// A CLUSTER is an org-level resource: a row, not a kubectl context. This is
// the customer-facing surface for connecting one BY ADDRESS (ConnectCluster)
// and for listing, reading and removing what is connected.
//
// ONE WAY IN. A cluster is connected by address and authenticated ONLY with the
// scoped ServiceAccount token that `forge cluster connect <context>` minted
// from the owner's own kube context and uploaded. The hub holds no cloud
// identity in the owner's cluster and nothing is granted to it. There is no
// in-cluster agent: nothing is installed in the target cluster, so there is no
// second registration path to keep in step with this one.
//
// ORG-SCOPED, AND THE ORG IS NEVER A REQUEST FIELD. Every RPC acts on the
// caller's org, resolved server-side from the authenticated principal. A
// cluster id belonging to another org is NotFound — never an existence
// oracle over another tenant's infrastructure.
//
// AUTHORITY:
//   - List / Get: any member of the org, or an org token carrying deploy:read.
//   - Connect / Remove: an org ADMIN, or an org token carrying cluster:manage.
//
// Every cluster here is the customer's own. "Clusters" is every cluster the
// org's workloads can land on.
service ClusterService {
  // ListClusters returns every live cluster of the caller's org, by name.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // GetCluster returns one cluster of the caller's org.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // RemoveCluster disconnects a BYO cluster, dropping its stored connection
  // material, and frees its name. REFUSED (FailedPrecondition)
  // while any live environment references the cluster.
  rpc RemoveCluster(RemoveClusterRequest) returns (RemoveClusterResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "remove"
        target: {
          kind: "cluster"
          id: "id"
        }
      }
    };
  }
  // ConnectCluster registers a cluster BY ADDRESS, with no agent in it.
  //
  // The platform is told the address, the CA and the scoped ServiceAccount
  // token up front, all required. The token is the ONLY credential the
  // platform ever uses against the cluster; a request without one is
  // InvalidArgument and names `forge cluster connect`. Nothing is installed in
  // the target cluster.
  //
  // DECLARATIVE AND IDEMPOTENT BY NAME. `forge cluster connect <name>` is
  // re-run from a checkout, so a second call with different values UPDATES
  // them rather than failing on a name collision. That is what makes the
  // connect command safe to put in a script, and it is why there is no
  // separate UpdateCluster: a second spelling of the same write could
  // disagree with this one about what a partial request means.
  rpc ConnectCluster(ConnectClusterRequest) returns (ConnectClusterResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "connect"
        target: {
          kind: "cluster"
          id: "response.cluster.id"
          label: "name"
        }
      }
    };
  }
}

// ClusterProvider is who runs the cluster. BYO — the customer's own, whether
// declared by ConnectCluster — is the only one, and
// the enum survives the deletion of the others because it is the stored
// `provider` column's wire form and new providers are plausible.
enum ClusterProvider {
  CLUSTER_PROVIDER_UNSPECIFIED = 0;
  CLUSTER_PROVIDER_BYO = 1;
}

// ClusterConnection is whether the platform can currently reach the cluster.
//
//   WAITING   — declared incompletely; the platform holds nothing to try with.
//   CONNECTED — the platform holds usable, unexpired connection material.
//   STALE     — a ServiceAccount token's expiry has passed.
// A removed cluster is not listed at all, so there is no REVOKED here.
enum ClusterConnection {
  CLUSTER_CONNECTION_UNSPECIFIED = 0;
  CLUSTER_CONNECTION_WAITING = 1;
  CLUSTER_CONNECTION_CONNECTED = 2;
  CLUSTER_CONNECTION_STALE = 3;
}

message Cluster {
  string id = 1;
  // Org-scoped name, a DNS label. The name environments will address the
  // cluster by (slice 2: forge.RegisteredCluster { name = "..." }).
  string name = 2;
  ClusterProvider provider = 3;
  ClusterConnection connection = 4;
  // Live environments that target this cluster. Non-empty blocks removal.
  repeated string environment_ids = 9;
  google.protobuf.Timestamp created_at = 10;

  // The API server address, as the hub dials it. https only. Set by
  // ConnectCluster.
  string address = 13;

  // The secret-store issuer registered for this cluster, or unset when none
  // is. See ClusterIssuer.
  ClusterIssuer issuer = 15;

  // The SHA-256 fingerprint of the registered CA certificate (the first
  // CERTIFICATE block of the uploaded bundle), over its DER encoding, as
  // colon-separated uppercase hex — the form `openssl x509 -fingerprint
  // -sha256` and `kubectl` print, so it can be compared against a cluster's own
  // CA by eye. Computed on the server from the stored CA; the CA itself is never
  // returned. Empty until ConnectCluster has stored a CA.
  string ca_fingerprint = 16;

  // When the registration row last changed: a connect or re-connect (new
  // address, CA or token) moves it.
  google.protobuf.Timestamp updated_at = 17;

  // Tags and names that once carried hub workload identity. The platform
  // authenticates to a connected cluster only with the scoped credential the
  // owner uploaded, so there is no auth mode and no cloud resource name.
  reserved 12, 14;
  reserved "auth", "cloud_cluster";

  // THERE IS NO ca_pem AND NO token HERE, AND THAT IS DELIBERATE. The CA is
  // not secret but it is bulky and nothing in a UI needs it (ca_fingerprint is
  // what identifies it), and a token must never be returned at all — a field
  // that exists is a field some future handler populates. See
  // ConnectClusterRequest.token.
}

message ListClustersRequest {
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 1;
}

message ListClustersResponse {
  // Sorted by name.
  repeated Cluster clusters = 1;
}

message GetClusterRequest {
  string id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message GetClusterResponse {
  Cluster cluster = 1;
}

message RemoveClusterRequest {
  string id = 1;
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 2;
}

message RemoveClusterResponse {}

// ConnectClusterRequest declares a cluster by address.
//
// ADDRESSED BY NAME, NOT BY ID, and that is what makes it idempotent in the
// way `forge cluster connect <name>` needs. A caller running from a checkout
// knows the name it declared; it does not know the uuid we minted, and
// requiring one would mean every connect is preceded by a list.
message ConnectClusterRequest {
  // A DNS label, unique among the org's live clusters. An EXISTING cluster
  // with this name is UPDATED.
  string name = 1;

  // The API server address the HUB will dial, e.g.
  // `https://10.0.0.1` or `https://my-cluster.example.com:6443`.
  //
  // REQUIRED, https ONLY, and a loopback or wildcard host is refused. The
  // hub's kustomize-controller reads this from a pod, where `127.0.0.1` and
  // `0.0.0.0` mean THAT POD — so such an address fails as "connection
  // refused" against a target cluster that is perfectly healthy, which is the
  // one place the fault is not.
  string address = 3;

  // The PEM CA bundle that signed the API server's certificate.
  //
  // REQUIRED, and there is deliberately no insecure-skip-tls-verify anywhere
  // in this path. A target we cannot verify is one we decline to deploy to;
  // the alternative is sending a standing credential to whatever answers that
  // address.
  string ca_pem = 4;

  // The scoped ServiceAccount token `forge cluster connect` minted in the
  // target cluster. REQUIRED: a request without one is InvalidArgument.
  //
  // WRITE-ONLY. It is NEVER RETURNED by any RPC on this service — there is no
  // field on Cluster to return it in. A request carrying one is never logged,
  // in whole or in part. Removing the cluster deletes the stored token.
  string token = 6;

  // When token stops working, if the owner bound it. Optional: a token with
  // no expiry is accepted, because an owner may legitimately have minted a
  // non-expiring one and refusing it would push them toward a worse
  // credential. When set, an expired cluster reads as not live, so the
  // refusal is diagnosable ("the token expired at T") rather than an
  // authentication failure against the target.
  google.protobuf.Timestamp token_expires_at = 7;

  // The service-account issuer the platform's secret store trusts for this
  // cluster. Optional, and only needed by a cluster that delivers
  // store-backed Secrets (forge.StoreSource): it is how the store verifies the
  // projected token an External Secrets Operator in the cluster logs in with.
  // See ClusterIssuerRegistration.
  //
  // PRESENCE IS THE SWITCH, because an older `forge cluster connect` sends no
  // issuer and re-running it must not silently withdraw one:
  //   absent          the registration is left as it is;
  //   present         it is replaced by this one;
  //   present, empty  the registration is removed, and the store stops
  //                   trusting the cluster.
  ClusterIssuerRegistration issuer = 8;

  // Tags and names that once selected hub workload identity: `auth` and
  // `cloud_cluster`. Connecting takes the uploaded token only.
  reserved 2, 5;
  reserved "auth", "cloud_cluster";
  // The org this request acts in (docs/orgs.md). Unset: the caller's default
  // org. A person must be a member of it; a machine credential may name only
  // its own org.
  optional string org_id = 9;
}

// ClusterIssuerRegistration declares the service-account issuer of a cluster.
//
// The cluster's own API server signs the tokens its pods are projected, so the
// store verifies them against THAT cluster's keys: no stored credential, and no
// call from the store back into the cluster. Exactly one way of learning the
// keys is declared.
message ClusterIssuerRegistration {
  // The `iss` claim the cluster's tokens carry, e.g.
  // `https://container.googleapis.com/v1/projects/p/locations/l/clusters/c`
  // (GKE) or the `--service-account-issuer` of the API server. https only. The
  // store requires a token to carry exactly this issuer.
  string issuer = 1;

  oneof keys {
    // The store fetches the signing keys itself, from
    // `<issuer>/.well-known/openid-configuration`. For an issuer that is
    // reachable from the internet, as GKE's is. The issuer's host must resolve
    // to public addresses only: the store dials it.
    bool discover = 2;
    // The JWKS the cluster serves at `/openid/v1/jwks`, uploaded by the
    // connecting side. For a cluster whose issuer the store cannot reach
    // (private, k3d). Public keys only: a JWKS carrying private or symmetric
    // key material is refused. Re-send it to follow a key rotation.
    string jwks = 3;
  }
}

// ClusterIssuer is what is registered for a cluster. The keys themselves are
// public but bulky, and nothing reading a cluster needs them, so only their
// count is returned.
message ClusterIssuer {
  // The id the cluster is known by in the secret store. The store's auth mount
  // is `jwt-<store_cluster_id>`, the audience its roles require ends
  // `/c/<store_cluster_id>`, and a rendered SecretStore names it. Today it is
  // the cluster's name, and it is unique across ALL orgs: the first org to
  // register an id owns it, and registering it from another org is refused.
  // Read it from here rather than assuming it is the name.
  string store_cluster_id = 1;
  string issuer = 2;
  // True when the store fetches the keys from the issuer itself.
  bool discover = 3;
  // The number of uploaded signing keys; zero when discover is true.
  int32 key_count = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ConnectClusterResponse {
  Cluster cluster = 1;

  // `hub_identity` carried the principal a workload-identity grant named. No
  // connected cluster trusts a hub identity any more.
  reserved 2;
  reserved "hub_identity";
}
