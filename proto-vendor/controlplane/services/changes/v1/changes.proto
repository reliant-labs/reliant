syntax = "proto3";

// ChangesService is the audited API people and agents both use to run
// Changes: one record per change per environment that says WHO gets a
// behavior the release declares. Everyone (remote config), a stable
// percentage (gradual rollout) or a measured split (A/B test). Design: forge
// docs/proposals/changes.md.
//
// THE RELEASE DECLARES WHAT A CHANGE CAN BE; THIS SERVICE DECIDES WHO GETS
// IT. A change's variants and default are declared in the project's
// changes.yaml and ship in the environment's release shape (`changes` key).
// Launching, ramping or rolling out a variant the environment's CURRENT
// release does not declare is refused (FailedPrecondition, reason
// "change_not_declared" / "variant_not_declared"). Drafts, previews and Stop
// are allowed against an undeclared change, so a team can prepare a change
// before the release that declares it ships.
//
// WHO MAY DO WHAT. Every rpc names its environment or change; a caller who is
// not a member of the environment's org, or a credential of another org,
// gets NotFound, so ids are no existence oracle.
//   - reads (List/Get/ListChangeEvents/GetChangesDeliveryStatus): any org
//     member; a token carrying changes:write, changes:launch or obs:read.
//   - GetChangesSnapshot: a read, and also a token carrying changes:read
//     (org-wide, or bound to that environment): the credential of an app
//     not on Reliant hosting, which fetches the snapshot it evaluates. That
//     scope reads the snapshot and NOTHING ELSE: every other rpc, the reads
//     included, refuses a token whose only Changes authority is changes:read
//     (PermissionDenied, reason "scope_missing").
//   - GetChangeReadout: a read, and obs:read (every member holds it; a token
//     must carry it).
//   - CreateChange, UpdateChangeDraft, SetChangePreview, StopChange,
//     RequestChangeApproval: changes:write (org-wide or bound to the env).
//   - LaunchChange, RampChange, RollOutChange, EndChangeRun: changes:launch
//     (which implies changes:write).
//
// A PERSON APPROVES PRODUCTION. In a protected environment (protected, or
// named prod / production) a launch, a ramp UP, a roll-out, and therefore any
// change to a running experiment, needs a person: the request comes from a
// browser session of the console, or carries step_up_code, a one-time code
// RequestChangeApproval emailed to the person the credential acts for. A CLI
// login or a token acting as a person (what an agent holds) is not, by
// itself, a person's approval. Ramping DOWN, EndChangeRun and StopChange never
// need approval: reducing exposure never waits for anyone. A refusal is
// PermissionDenied, reason "approval_required".
//
// OPTIMISTIC CONCURRENCY. Every mutation names expected_revision, the change's
// revision the caller read, and bumps it by one; a stale one is
// FailedPrecondition, reason "change_revision_conflict", and changes nothing.
// StopChange alone may omit it: the kill switch never loses a race.
//
// AUDIT. Every mutation writes the change and one ChangeEvent (who, what,
// how it was approved) in one transaction; ListChangeEvents reads the trail.
package controlplane.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/changes/v1;changesv1";

// ChangesService drafts, previews, launches, ramps, rolls out and stops
// changes, and serves each environment's delivery snapshot.
service ChangesService {
  option (forge.v1.service) = {
    name: "ChangesService"
    version: "1.0.0"
    description: "Changes: remote config, gradual rollouts and A/B tests, one audited record per change per environment"
  };

  // ListChanges lists an org's changes, optionally narrowed to one
  // environment or one project, ordered by environment then key.
  //
  // forge:custom — membership- and scope-checked, with each change's release
  // declaration joined in, not the CRUD of a table.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetChange returns one change, its current run and its declaration.
  //
  // forge:custom — membership- and scope-checked read with the release
  // declaration joined in.
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // CreateChange drafts a change in an environment: mode off, revision 1. The
  // key need not be declared by the current release yet. A key that already
  // has a change in the environment is AlreadyExists, reason "change_exists".
  //
  // forge:custom — writes the audit event beside the row and checks the scope.
  rpc CreateChange(CreateChangeRequest) returns (CreateChangeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "create"
        target: {
          kind: "change"
          id: "response.change.id"
          label: "response.change.key"
        }
        env: "environment_id"
        scope: "response.change.org_id"
        detail: ["response.change.revision"]
      }
    };
  }

  // UpdateChangeDraft edits what the next launch freezes: description, unit,
  // audience, split and success metric. A running experiment keeps the run's
  // frozen copy; the edit takes effect at the next LaunchChange, which starts
  // a new run.
  rpc UpdateChangeDraft(UpdateChangeDraftRequest) returns (UpdateChangeDraftResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "update_draft"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // SetChangePreview replaces the preview list: the units (teammates) who get
  // a named variant under every mode but off, and are never measured. Unit
  // ids are hashed (pkg/changes.PreviewHash) and never stored. With activate,
  // a change that is off moves to preview (only the listed units see it).
  rpc SetChangePreview(SetChangePreviewRequest) returns (SetChangePreviewResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "set_preview"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // RequestChangeApproval emails a one-time code to the person the caller
  // acts for (a browser session's user, a CLI login's, or a personal token's
  // acting user). The code approves ONE gated mutation of this change in a
  // protected environment, sent as step_up_code; it works for 10 minutes and
  // is consumed by the action it approves. An org automation token has no
  // person to ask: FailedPrecondition, reason "approval_unavailable".
  rpc RequestChangeApproval(RequestChangeApprovalRequest) returns (RequestChangeApprovalResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "request_approval"
        target: {
          kind: "change"
          id: "change_id"
        }
      }
    };
  }

  // LaunchChange starts an experiment: a new run (a fresh salt) freezes the
  // draft's unit, audience, split and metric and the declared variants, and
  // the change delivers mode experiment to percent_bp of the audience. A
  // launch while a run is open ends that run ("relaunched") first: changing
  // a running experiment is a launch.
  rpc LaunchChange(LaunchChangeRequest) returns (LaunchChangeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "launch"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // RampChange moves the percentage of a running experiment or rollout
  // within its run: raising it only adds units, lowering then raising
  // returns the same units. Only a ramp UP in a protected environment needs
  // approval.
  rpc RampChange(RampChangeRequest) returns (RampChangeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "ramp"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // RollOutChange gives a variant to everyone (mode everyone; the open run
  // ends "rolled_out") or to percent_bp of the audience (mode rollout). A
  // rollout inside an open run keeps its salt, so the units already enrolled
  // stay enrolled and now all get the variant; with no open run it starts a
  // rollout run from the draft.
  rpc RollOutChange(RollOutChangeRequest) returns (RollOutChangeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "roll_out"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // StopChange is the kill switch: mode off for everyone, previews included,
  // and the open run ends ("stopped"). changes:write, never an approval, and
  // expected_revision may be omitted.
  rpc StopChange(StopChangeRequest) returns (StopChangeResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "stop"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // EndChangeRun concludes an experiment or rollout without shipping a
  // variant: the open run ends ("ended") and the change returns to preview
  // (listed units keep their preview; everyone else gets the default). It
  // reduces exposure, so it never needs approval. To ship the winner instead,
  // RollOutChange.
  rpc EndChangeRun(EndChangeRunRequest) returns (EndChangeRunResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "end_run"
        target: {
          kind: "change"
          id: "change_id"
          label: "response.change.key"
        }
        env: "response.change.environment_id"
        scope: "response.change.org_id"
        detail: [
          "response.change.revision",
          "response.change.mode"
        ]
      }
    };
  }

  // ListChangeEvents reads a change's audit trail, newest first.
  //
  // forge:custom — one change's trail, membership- and scope-checked, not the
  // CRUD of the events table (which is append-only).
  rpc ListChangeEvents(ListChangeEventsRequest) returns (ListChangeEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetChangesSnapshot renders the environment's delivery snapshot, the
  // "forge.changes/v1" JSON the platform delivers to the environment's apps
  // (forge pkg/changes reads it), validated with pkg/changes.ParseSnapshot.
  // A change its current release does not declare is left out (its key
  // evaluates "unknown", the code's default); a change whose delivery names a
  // variant the release no longer declares is delivered off and listed in
  // problems. The one rpc a changes:read token may call (WHO MAY DO WHAT).
  rpc GetChangesSnapshot(GetChangesSnapshotRequest) returns (GetChangesSnapshotResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetChangeReadout reads one experiment run's results: per-arm conversion
  // of the run's frozen success metric, each treatment against the control,
  // the sample-ratio check and a verdict. Counted from the environment's
  // product events (flag_evaluated assignments, intent-to-treat) by forge's
  // obsquery.ExperimentReadoutQuery, run as the org's read-only ClickHouse
  // user, and decided by forge's experimentstats.Analyze, so a local reader
  // of the same events reaches the same verdict.
  //
  // The readout covers the time the run was in experiment mode: from its
  // start to the first of the run ending, the change leaving experiment
  // mode within the run (a partial RollOutChange keeps the run but gives
  // every enrolled unit the rolled-out variant, which would contaminate the
  // control), and now. Units assigned less than the metric's window before
  // that end are pending, never non-converters.
  //
  // Who may call: what GetChange needs, and obs:read (every org member holds
  // it; a token must carry it). A stranger gets NotFound. A run that was
  // never an experiment is FailedPrecondition, reason "run_not_experiment";
  // a change that never ran one, reason "no_experiment_run"; a run frozen
  // with no success metric, reason "metric_missing"; a frozen split with no
  // control and treatment to compare, reason "readout_plan_invalid". A run_id
  // that is not a run of the change is NotFound. Not cached: every call
  // reads ClickHouse, so a UI should not poll it.
  //
  // Defaults the readout applies to the run's frozen metric (echoed in the
  // response): window_hours 168, min_sample_per_arm 100, control_variant the
  // run's default variant when the split has it, else the split's first arm.
  // The significance level is 0.05.
  //
  // forge:custom — an analytics read joined to the change's run, not CRUD.
  rpc GetChangeReadout(GetChangeReadoutRequest) returns (GetChangeReadoutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetChangesDeliveryStatus says whether the environment's apps have been
  // handed its current snapshot: the revision and etag GetChangesSnapshot
  // renders now, and for each delivery target (a hosted static site's
  // /_forge/changes.json, the hosted workloads' ConfigMap) the revision last
  // WRITTEN there and when. "Delivered" means written to the CDN origin or
  // the ConfigMap, not seen by every page or pod: a page applies it on its
  // next load; a pod after the kubelet's ConfigMap sync (about a minute) plus
  // the SDK's 10s re-read. An environment with no hosted apps lists no
  // targets. Same access as the other reads (List/Get): a changes:read
  // token, which reads the snapshot alone, is refused.
  rpc GetChangesDeliveryStatus(GetChangesDeliveryStatusRequest) returns (GetChangesDeliveryStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
}

// ChangeMode is who gets a change right now.
enum ChangeMode {
  CHANGE_MODE_UNSPECIFIED = 0;
  // Everyone gets the default; previews are silenced. The kill switch.
  CHANGE_MODE_OFF = 1;
  // Only the preview list gets a variant; everyone else the default.
  CHANGE_MODE_PREVIEW = 2;
  // Everyone gets everyone_variant (remote config).
  CHANGE_MODE_EVERYONE = 3;
  // percent_bp of the audience gets rollout_variant (gradual rollout).
  CHANGE_MODE_ROLLOUT = 4;
  // percent_bp of the audience is split across the run's variants (A/B test).
  CHANGE_MODE_EXPERIMENT = 5;
}

// ChangeUnit is what stays together: the id a change hashes.
enum ChangeUnit {
  CHANGE_UNIT_UNSPECIFIED = 0;
  // The evaluation context's targetingKey: the signed-in user.
  CHANGE_UNIT_USER = 1;
  // The context attribute "account", which MUST be the org id the app's
  // product events carry (product_events.OrgId, "org.id"): the readout
  // groups an account-unit experiment by that column (falling back to the
  // event's "account" property), so any other id cannot be measured.
  CHANGE_UNIT_ACCOUNT = 2;
  // The context attribute "visitor": an anonymous site's stable visitor id.
  CHANGE_UNIT_VISITOR = 3;
}

// Change is one change in one environment.
message Change {
  string id = 1;
  string org_id = 2;
  string environment_id = 3;
  string key = 4;
  string description = 5;
  ChangeMode mode = 6;
  // Draft: what the next launch freezes. While a run is open, delivery uses
  // current_run's copy.
  ChangeUnit unit = 7;
  // Draft; unset is everyone.
  ChangeAudience audience = 8;
  // The live percentage of a rollout or experiment, in basis points.
  int32 percent_bp = 9;
  // Draft split, in order; weights sum to 10000.
  repeated ChangeSplitArm split = 10;
  // The variant mode everyone delivers.
  string everyone_variant = 11;
  // The variant mode rollout delivers.
  string rollout_variant = 12;
  repeated ChangePreviewEntry preview = 13;
  // Draft success metric.
  ChangeMetric metric = 14;
  // The open run, if any.
  ChangeRun current_run = 15;
  int64 revision = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  string created_by = 19;
  string updated_by = 20;
  // What the environment's current release declares for this key; unset when
  // it declares nothing for it.
  ChangeDeclaration declaration = 21;
  // Whether the environment needs a person's approval to launch or ramp up.
  bool approval_required = 22;
}

// ChangeAudience: who is eligible. The context attribute must be one of in.
message ChangeAudience {
  // A context attribute name, or "targetingKey".
  string attribute = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated string in = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
}

// ChangeSplitArm is one variant's share of an experiment.
message ChangeSplitArm {
  string variant = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 weight_bp = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 10000
  ];
}

// ChangeSplit wraps a split so an update can tell "unset" from "empty".
message ChangeSplit {
  repeated ChangeSplitArm arms = 1 [(buf.validate.field).repeated.max_items = 20];
}

// ChangePreviewEntry is one previewing unit, as stored.
message ChangePreviewEntry {
  // pkg/changes.PreviewHash(key, unit id): 8 lowercase hex digits.
  string unit_hash = 1;
  string variant = 2;
  // A display label ("alice@example.com"), never evaluated.
  string label = 3;
}

// ChangePreviewInput is one previewing unit as a caller names it: a raw unit
// id (hashed here, never stored) or an already-hashed one.
message ChangePreviewInput {
  oneof unit {
    string unit_id = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }];
    string unit_hash = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}$"];
  }
  string variant = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string label = 4 [(buf.validate.field).string.max_len = 128];
}

// ChangeMetric is an experiment's one success metric: the share of enrolled
// units that emit a product event within window_hours of assignment.
message ChangeMetric {
  // The product event name (without the "product." prefix).
  string event = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Optional property filter: count only events whose prop equals prop_value.
  string prop = 2 [(buf.validate.field).string.max_len = 64];
  string prop_value = 3 [(buf.validate.field).string.max_len = 256];
  // Unset or 0 = 168 (a week); at most 2160 (90 days).
  int32 window_hours = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 2160
  ];
  // Units per arm before a readout may decide; 0 = the readout's default.
  int64 min_sample_per_arm = 5 [(buf.validate.field).int64.gte = 0];
  // The arm the others are compared against; must be in the split.
  string control_variant = 6 [(buf.validate.field).string.max_len = 128];
}

// ChangeVariant is one declared variant and its JSON value.
message ChangeVariant {
  string name = 1;
  // The variant's value as JSON (true, 3, "blue", {...}).
  string value_json = 2;
}

// ChangeDeclaration is what a release declares for a key (changes.yaml).
message ChangeDeclaration {
  // bool, string, number or json.
  string type = 1;
  string default_variant = 2;
  repeated ChangeVariant variants = 3;
  string description = 4;
}

// ChangeRun is one randomization epoch: its id is the salt.
message ChangeRun {
  string id = 1;
  string change_id = 2;
  // "experiment" or "rollout": what the run was launched as.
  string kind = 3;
  ChangeUnit unit = 4;
  ChangeAudience audience = 5;
  repeated ChangeSplitArm split = 6;
  repeated ChangeVariant variants = 7;
  string default_variant = 8;
  ChangeMetric metric = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
  // "stopped", "ended", "relaunched" or "rolled_out"; empty while open.
  string ended_reason = 12;
  string started_by = 13;
  string approved_by = 14;
  // "not_required", "console_session" or "step_up".
  string approval_method = 15;
}

// ChangeEvent is one entry of a change's audit trail.
message ChangeEvent {
  string id = 1;
  string change_id = 2;
  int64 revision = 3;
  // "person", "agent" (a token acting as a person) or "token" (org automation).
  string actor_kind = 4;
  string actor_id = 5;
  // create, update_draft, set_preview, launch, ramp, roll_out, stop, end_run.
  string action = 6;
  // {"<field>": {"from": ..., "to": ...}} as JSON.
  string diff_json = 7;
  string run_id = 8;
  string approval_method = 9;
  string approved_by = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListChangesRequest {
  string org_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Filters, AND-combined; unset does not filter.
  optional string environment_id = 2 [(buf.validate.field).string.max_len = 128];
  // A project (forge.yaml name) of the org.
  optional string project = 3 [(buf.validate.field).string.max_len = 128];
  // Unset or 0 = 100; max 500.
  int32 page_size = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 500
  ];
  // next_page_token from the previous page.
  string page_token = 5 [(buf.validate.field).string.max_len = 512];
}

message ListChangesResponse {
  repeated Change changes = 1;
  string next_page_token = 2;
}

message GetChangeRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetChangeResponse {
  Change change = 1;
}

message CreateChangeRequest {
  string environment_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string key = 2 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_.-]{0,63}$"];
  string description = 3 [(buf.validate.field).string.max_len = 2000];
  // Unset = user.
  ChangeUnit unit = 4;
}

message CreateChangeResponse {
  Change change = 1;
}

message UpdateChangeDraftRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  // Each field below changes only when set.
  optional string description = 3 [(buf.validate.field).string.max_len = 2000];
  optional ChangeUnit unit = 4;
  ChangeAudience audience = 5;
  // Makes the audience everyone; wins over audience.
  bool clear_audience = 6;
  ChangeSplit split = 7;
  ChangeMetric metric = 8;
  bool clear_metric = 9;
}

message UpdateChangeDraftResponse {
  Change change = 1;
}

message SetChangePreviewRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  // The whole new list; empty clears it.
  repeated ChangePreviewInput entries = 3 [(buf.validate.field).repeated.max_items = 200];
  // Move a change that is off to preview.
  bool activate = 4;
}

message SetChangePreviewResponse {
  Change change = 1;
}

message RequestChangeApprovalRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message RequestChangeApprovalResponse {
  // The address the code went to, masked (j***@example.com).
  string sent_to = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message LaunchChangeRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  // The share of the audience enrolled, in basis points (100 = 1%).
  int32 percent_bp = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 10000
  ];
  // A person's approval in a protected environment (RequestChangeApproval).
  string step_up_code = 4 [(buf.validate.field).string.max_len = 32];
}

message LaunchChangeResponse {
  Change change = 1;
}

message RampChangeRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  int32 percent_bp = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 10000
  ];
  string step_up_code = 4 [(buf.validate.field).string.max_len = 32];
}

