message GetChangesSnapshotRequest {
  string environment_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ChangeSnapshotProblem is a change delivered off, or left out, and why.
message ChangeSnapshotProblem {
  string key = 1;
  string message = 2;
}

message GetChangesSnapshotResponse {
  // The "forge.changes/v1" document, exactly as delivered.
  string snapshot_json = 1;
  // The snapshot's revision: grows with every change mutation and every
  // promotion of the environment.
  int64 revision = 2;
  // A strong validator of snapshot_json (hex SHA-256).
  string etag = 3;
  repeated ChangeSnapshotProblem problems = 4;
}

// ChangeReadoutVerdict is what an experiment run's data supports
// (forge pkg/experimentstats.Verdict).
enum ChangeReadoutVerdict {
  CHANGE_READOUT_VERDICT_UNSPECIFIED = 0;
  // No unit has been assigned yet.
  CHANGE_READOUT_VERDICT_NO_DATA = 1;
  // The arms' sizes do not match the planned split (chi-square p < 0.001,
  // or units in an arm the split does not have): assignment or its
  // recording is broken, so no effect can be trusted. Overrides every other
  // verdict.
  CHANGE_READOUT_VERDICT_SRM_FAILED = 2;
  // The data cannot support a decision; reason says why.
  CHANGE_READOUT_VERDICT_INCONCLUSIVE = 3;
  // A treatment converts at a higher rate (best_variant names it).
  CHANGE_READOUT_VERDICT_TREATMENT_BETTER = 4;
  // Every treatment converts at a lower rate.
  CHANGE_READOUT_VERDICT_TREATMENT_WORSE = 5;
}

message GetChangeReadoutRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // A run of the change. Unset: its open run when that is an experiment,
  // else its most recently started experiment run.
  optional string run_id = 2 [(buf.validate.field).string.max_len = 128];
}

// ChangeReadoutArm is one variant's counts and conversion rate. A unit
// counts in the arm it was assigned, whether or not it saw the variant
// (intent-to-treat).
message ChangeReadoutArm {
  string variant = 1;
  // The variant's planned share in the run's frozen split; 0 for a variant
  // the split does not have.
  int32 weight_bp = 2;
  // Every unit assigned to the arm, window complete or not (what the
  // sample-ratio check reads).
  int64 assigned = 3;
  // The assigned units whose whole attribution window has elapsed by the
  // readout's end: the only units the rate and the verdict read.
  int64 window_complete = 4;
  // The window-complete units that converted.
  int64 conversions = 5;
  // conversions / window_complete (0 with none), and its Wilson interval at
  // 1 - alpha ([0, 1] with none).
  double rate = 6;
  double ci_low = 7;
  double ci_high = 8;
  // assigned - window_complete: still inside their window, never counted as
  // non-converters.
  int64 pending = 9;
  // The arm size the planned split expects for the units assigned; 0 for a
  // variant the split does not have.
  double expected_assigned = 10;
}

// ChangeReadoutComparison is one treatment against the control.
message ChangeReadoutComparison {
  string treatment = 1;
  string control = 2;
  // The treatment's rate minus the control's.
  double abs_lift = 3;
  // abs_lift over the control's rate; unset when the control's rate is 0.
  optional double rel_lift = 4;
  // Newcombe's interval for abs_lift at 1 - alpha (alpha being this
  // comparison's, Bonferroni-corrected).
  double diff_ci_low = 5;
  double diff_ci_high = 6;
  // The pooled two-proportion z-test's two-sided p-value.
  double p_value = 7;
  // This comparison's level: the readout's alpha over the number of
  // treatments (Bonferroni).
  double alpha = 8;
  // verdict is better or worse: p_value < alpha AND the difference interval
  // excludes 0, with enough window-complete units, and the sample-ratio check
  // did not fail (a failed check makes every comparison SRM_FAILED).
  bool significant = 9;
  ChangeReadoutVerdict verdict = 10;
  // Why the comparison is inconclusive: "below_min_sample",
  // "window_not_complete" or "interval_spans_zero"; empty otherwise.
  string reason = 11;
}

// ChangeReadoutSrm is the sample-ratio mismatch check: a chi-square
// goodness-of-fit test of every arm's assigned units against the split.
message ChangeReadoutSrm {
  // 0 when skipped.
  double p_value = 1;
  double chi_square = 2;
  // p_value < 0.001, or units assigned to an unplanned variant.
  bool failed = 3;
  // The test did not run: fewer than two planned arms, no units, or an
  // expected arm size below 5 (the chi-square approximation does not hold).
  bool skipped = 4;
  // Variants with assigned units the split does not plan; any fails it.
  repeated string unplanned_variants = 5;
}

message GetChangeReadoutResponse {
  string change_id = 1;
  string key = 2;
  // The run read: its frozen unit, split, variants and metric, and when it
  // started and ended.
  ChangeRun run = 3;
  ChangeReadoutVerdict verdict = 4;
  // Why the verdict is inconclusive: "below_min_sample" (an arm has fewer
  // assigned units than min_sample_per_arm; keep the run going),
  // "window_not_complete" (enough assigned, too few whose window has
  // closed) or "interval_spans_zero" (no detectable difference). Empty
  // otherwise.
  string reason = 5;
  // The better treatment with the highest difference-interval lower bound;
  // set only when verdict is TREATMENT_BETTER.
  string best_variant = 6;
  // The split's variants in order, then any other variant found (sorted).
  repeated ChangeReadoutArm arms = 7;
  // Each treatment against the control, in arm order.
  repeated ChangeReadoutComparison comparisons = 8;
  ChangeReadoutSrm srm = 9;
  // Units whose assignments named more than one variant: in no arm. Non-zero
  // is a bug to find (an id hashed by two SDK versions, a tampered client).
  int64 conflicted = 10;
  // Totals over the arms.
  int64 assigned = 11;
  // Assigned units still inside their window.
  int64 pending = 12;
  // Variants units were assigned that the run's split does not have.
  repeated string undeclared_variants = 13;
  // The window the readout counts: assignments in [readout_start,
  // readout_end), outcomes up to readout_end.
  google.protobuf.Timestamp readout_start = 14;
  google.protobuf.Timestamp readout_end = 15;
  // Why the readout ends where it does: "now" (the experiment is still
  // running), "left_experiment" (the change left experiment mode within the
  // run, e.g. a partial roll-out), or "run_ended".
  string readout_end_reason = 16;
  // The readout window is closed (readout_end_reason is not "now"): the
  // numbers no longer move, except for late-arriving events. Never final when
  // truncated_by_retention or retention_changed_during_run.
  bool final = 17;
  // The run's frozen metric as the readout applied it: window_hours,
  // min_sample_per_arm and control_variant with their defaults filled in.
  ChangeMetric metric = 18;
  // The run's significance level (0.05).
  double alpha = 19;
  // Explains how to read a fixed-horizon result: decide once, at the
  // pre-registered sample size, not at the first significant look.
  string horizon_note = 20;
  // The readout may be missing expired events: its window started later than
  // the run, because product events older than their retention are gone
  // (early assignments are not counted), or it reaches back further than the
  // readout can prove the environment kept them (more than 90 days, the free
  // plan's cap: a plan upgrade's longer cap is not recorded, so older events
  // may have been deleted under the shorter one).
  bool truncated_by_retention = 21;
  // The environment's product-event retention changed since the run started
  // (a release declared another product_events_days). The readout cuts its
  // window with the retention in force now, but every event keeps the
  // retention it was stored with, so some of the run's events may be missing
  // or cut off: the numbers may be incomplete, and final is false.
  bool retention_changed_during_run = 22;
  // The other retentions, in days, the environment's releases have had since
  // the run started (set when retention_changed_during_run).
  repeated int32 earlier_retention_days = 23;
}

message GetChangesDeliveryStatusRequest {
  string environment_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ChangeDeliveryTargetKind is where the platform writes a snapshot.
enum ChangeDeliveryTargetKind {
  CHANGE_DELIVERY_TARGET_KIND_UNSPECIFIED = 0;
  // A hosted static site: /_forge/changes.json on the site's origin,
  // served no-cache with an ETag.
  CHANGE_DELIVERY_TARGET_KIND_STATIC_SITE = 1;
  // The environment's hosted workloads: ConfigMap reliant-forge-changes,
  // mounted read-only at /etc/forge/changes/ (FORGE_CHANGES_FILE).
  CHANGE_DELIVERY_TARGET_KIND_CONFIG_MAP = 2;
}

// ChangeDeliveryTarget is the snapshot last written to one target.
message ChangeDeliveryTarget {
  ChangeDeliveryTargetKind kind = 1;
  // The StaticSite's name, or the ConfigMap as <namespace>/<name>.
  string name = 2;
  // Where the app reads it: the site path, or the file path in the pod.
  string location = 3;
  // The revision and etag last written there.
  int64 revision = 4;
  string etag = 5;
  // When that content was first written there.
  google.protobuf.Timestamp delivered_at = 6;
  // True when etag is the environment's current snapshot's.
  bool current = 7;
}

message GetChangesDeliveryStatusResponse {
  // The snapshot the environment renders now (GetChangesSnapshot's).
  int64 revision = 1;
  string etag = 2;
  // Every target the platform has written the environment's snapshot to,
  // by kind then name.
  repeated ChangeDeliveryTarget targets = 3;
}
