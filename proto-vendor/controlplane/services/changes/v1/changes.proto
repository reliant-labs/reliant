  Change change = 1;
}

message RollOutChangeRequest {
  string change_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  // A declared variant.
  string variant = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Everyone gets it (remote config); percent_bp is then ignored.
  bool everyone = 4;
  // Otherwise the share of the audience that gets it.
  int32 percent_bp = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 10000
  ];
  string step_up_code = 6 [(buf.validate.field).string.max_len = 32];
}

message RollOutChangeResponse {
