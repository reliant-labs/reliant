syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/secret_store/v1;secret_storev1";

// === SecretStoreService ===
//
// The managed secret store's API surface, in front of a headless OpenBao
// KV-v2 mount. See docs/openbao-secret-store.md (design) and
// docs/openbao-dev-runbook.md (what is actually running in dev).
//
// THIS SERVICE IS THE SECURITY BOUNDARY, NOT A PROXY. The call path is
//
//     reliant/web  ->  control-plane SecretStoreService  ->  OpenBao HTTP API
//
// and the browser never holds an OpenBao token. That indirection is what makes
// the ACL split enforceable rather than aspirational: the server-side token
// this service holds gets `list` + `read` on `secret/metadata/**` and NO
// capability on `secret/data/` at all, so a bug in our UI cannot leak a value
// — Bao refuses the request. Two further things can only be enforced here,
// because OpenBao cannot express them for a KV-v2 mount at all:
//
//   - TENANT SCOPING. A request names ONE deploy environment
//     (`environment_id`, a control-plane deploy_environments id). The Bao
//     path is tenants/<org_id>/<environment_id>/<name>, and the org segment
//     is resolved SERVER-SIDE from that environment's row after checking the
//     caller belongs to its org — never taken from a request field. Naming
//     another tenant's environment answers NotFound. See internal/secretstore
//     for the construction and TestForgedEnvironmentIDCannotReachAnotherTenant.
//   - PER-KEY RULES. `allowed_parameters` / `denied_parameters` are not
//     supported for KV-v2 policies, so any restriction on which keys a caller
//     may write is this service's job.
//
// NO RPC HERE RETURNS A SECRET VALUE, and none of the response messages below
// declares a field that could carry one. That is pinned structurally by
// TestSecretStoreResponsesCarryNoSecretValueFields, a reflection test over an
// allow-list, mirroring reliant's TestForgeResponseStructsCarryNoSecretValueFields.
// A type that cannot represent a value cannot leak one by accident later.
//
// A future "reveal" path is a SEPARATE, separately-granted capability against
// `secret/data/` with its own policy and its own audit story — never a
// loosening of the metadata token, and never a new field on a message here.
service SecretStoreService {
  // ListSecrets returns METADATA ONLY for every secret in one deploy
  // environment: name, presence, current version, timestamps, and the
  // deleted/destroyed state of the current version. Never a value.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // GetSecretVersions returns one secret's full version history —
  // per-version created_time / deletion_time / destroyed. Never a value.
  rpc GetSecretVersions(GetSecretVersionsRequest) returns (GetSecretVersionsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // SetSecret writes a new version. WRITE-ONLY: the response carries the
  // version number that was created, never the value that was written.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // DeleteSecret soft-deletes versions. Reversible via UndeleteSecret —
  // KV-v2 keeps soft delete, undelete and destroy on distinct paths with
  // distinct capabilities, and so does this API.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // UndeleteSecret restores soft-deleted versions. Cannot restore a
  // destroyed version — that data is gone.
  rpc UndeleteSecret(UndeleteSecretRequest) returns (UndeleteSecretResponse) {
    option (forge.v1.method) = {auth_required: true};
  }

  // DestroySecret permanently destroys versions. IRREVERSIBLE, which is why
  // it is a distinct RPC on a distinct Bao path rather than a flag on
  // DeleteSecret.
  rpc DestroySecret(DestroySecretRequest) returns (DestroySecretResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
}

// === Metadata messages ===
//
// Deliberately value-free. Adding a field here that could carry a secret
// value fails TestSecretStoreResponsesCarryNoSecretValueFields.

// SecretSummary is one secret's list-view metadata. It answers "does this
// secret exist, how many times has it been set, and when" — the whole
// Secret-Manager-style list surface — with nothing on the wire that could be
// the secret itself.
message SecretSummary {
  // name is the secret's logical name, and matches the env-var name forge
  // resolves through a secret_ref. One name, one path, no mapping table.
  string name = 1;
  // current_version is the newest version number. Zero means the secret has
  // metadata but no live version (every version destroyed).
  uint32 current_version = 2;
  // oldest_version is the oldest version still retained; versions below it
  // have aged out under max_versions.
  uint32 oldest_version = 3;
  // max_versions is the retention count Bao enforces for this secret. Zero
  // means the mount default applies.
  uint32 max_versions = 4;
  google.protobuf.Timestamp created_time = 5;
  google.protobuf.Timestamp updated_time = 6;
  // current_version_deleted reports the SOFT-deleted state of the current
  // version — recoverable via UndeleteSecret.
  bool current_version_deleted = 7;
  // current_version_destroyed reports permanent destruction of the current
  // version. Not recoverable.
  bool current_version_destroyed = 8;
}

// SecretVersion is one immutable version's metadata.
message SecretVersion {
  uint32 version = 1;
  google.protobuf.Timestamp created_time = 2;
  // deletion_time is set when the version is soft-deleted; unset otherwise.
  google.protobuf.Timestamp deletion_time = 3;
  // destroyed reports permanent destruction. A destroyed version keeps its
  // metadata row (so history stays honest) but its contents are gone.
  bool destroyed = 4;
}

// === RPC messages ===
//
// environment_id is a control-plane deploy_environments id — the same id a
// deployed SimpleBackend carries, which is what makes a value set here the
// value materialized into that environment's pods. It is NOT a reliant
// project id: hosted secrets work for forge users with no reliant. The tenant
// (org) is derived from the environment server-side; see the service comment.
//
// Field 2 (`env`) is reserved: the environment id already names exactly one
// environment, so a second free-form env string could only disagree with it.

message ListSecretsRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

message GetSecretVersionsRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
  string name = 3;
}

message GetSecretVersionsResponse {
  // summary repeats the list-view metadata so a detail page needs one call.
  SecretSummary summary = 1;
  repeated SecretVersion versions = 2;
}

message SetSecretRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
  string name = 3;

  // secret_value is the ONLY value-carrying field in this file, and it is on
  // a REQUEST, travelling inbound. It is a string and must stay one:
  // OpenBao HMACs strings in its audit log but passes integers and booleans
  // through IN PLAINTEXT, so a numeric API key typed as a JSON number would
  // land in the audit log in the clear. This service coerces to string before
  // the value reaches Bao; see forceStringValues and its test.
  string secret_value = 4;

  // cas is KV-v2 check-and-set. When set, the write succeeds only if the
  // secret's current version equals this value — 0 means "must not exist
  // yet", which is how create is distinguished from update. Unset skips the
  // check and performs an unconditional write.
  optional uint32 cas = 5;
}

message SetSecretResponse {
  // version is the version number this write created.
  uint32 version = 1;
  google.protobuf.Timestamp created_time = 2;
}

message DeleteSecretRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
  string name = 3;
  // versions selects which versions to soft-delete. Empty means the current
  // version only.
  repeated uint32 versions = 4;
}

message DeleteSecretResponse {}

message UndeleteSecretRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
  string name = 3;
  // versions selects which soft-deleted versions to restore. Required —
  // undelete has no "current version" default, because the current version
  // of a soft-deleted secret is precisely what the caller is naming.
  repeated uint32 versions = 4;
}

message UndeleteSecretResponse {}

message DestroySecretRequest {
  string environment_id = 1;
  reserved 2;
  reserved "project_id", "env";
  string name = 3;
  // versions selects which versions to permanently destroy. Required: there
  // is no default for an irreversible operation.
  repeated uint32 versions = 4;
}

message DestroySecretResponse {}
