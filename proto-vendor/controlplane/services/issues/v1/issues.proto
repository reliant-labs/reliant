syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/issues.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/issues/v1;issuesv1";

// === IssuesService (controlplane.v1.IssuesService) ===
//
// The error inbox: the errors of an environment grouped into issues, with the
// triage lifecycle on top (resolve, ignore, regress). It serves browser and
// server issues alike (Issue.platform), for the console's Errors view, for
// `forge obs issues|issue|resolve`, and for the release-health check.
//
// ORG-SCOPED. A list carries scope.org_id, which the handler verifies the caller
// is a member of before reading anything. A call that names one issue does not
// carry an org: the handler loads the issue and checks the caller against the
// org that owns it, so an issue id says nothing about whether it exists to a
// caller outside that org.
//
// AUTHORIZATION. A person: org membership. A machine credential: it must act for
// that org and carry obs:read for the reads and obs:triage for
// UpdateIssueStatus, and its env binding, if any, must cover the issue's
// environment. Triage is its own scope on purpose: a read-only token must not
// be able to silence an issue.
//
// DISCUSSION. An issue carries comments, one assignee and the chats started
// from it. ListIssueTimeline merges them with the status changes into ONE
// chronological timeline. The writes (AddIssueComment, UpdateIssueComment,
// DeleteIssueComment, AssignIssue, LinkIssueChat) are triage: a person needs
// org membership, a machine credential obs:triage. A comment belongs to a
// person: it is edited by its author only, and deleted by its author or an org
// admin; a credential that acts for no person cannot comment.
//
// MERGED ISSUES. Writes on an issue that was merged into another are refused
// (FailedPrecondition, naming the target). ListIssueTimeline on a merged issue
// FOLLOWS the merge to its target and returns the target's timeline, which
// includes the entries of every issue merged into it, so a comment made before
// a re-fingerprint is not lost; each entry says which issue it was made on.
//
// ERRORS: InvalidArgument (bad range, unknown status, an assignee outside the
// org), PermissionDenied (not a member / a credential without the scope or for
// another org / not the comment's author), NotFound (no such issue or comment),
// Aborted (expected_version is stale), FailedPrecondition (observability is not
// set up for the org, the issue was merged), Unavailable (issues are not
// configured on this server).
service IssuesService {
  option (forge.v1.service) = {
    name: "IssuesService"
    version: "1.0.0"
    description: "Error issues: grouping, triage lifecycle and release attribution"
  };

  // ListIssues returns the scope's issues, filtered, a page at a time. The
  // counts and the trend are over scope.time_range (default: the last 24 hours).
  //
  // forge:custom — an issue is not an entity of the generic CRUD kit: its rows
  // are written by the issues worker and read through the grouping queries.
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // GetIssue returns one issue with its latest event, its symbolicated frames,
  // the per-version breakdown, the issues that tend to occur with it, and the
  // release it first appeared in.
  //
  // forge:custom — see ListIssues.
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListIssueEvents returns the individual events of one issue, newest first.
  rpc ListIssueEvents(ListIssueEventsRequest) returns (ListIssueEventsResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // UpdateIssueStatus resolves, ignores or reopens an issue. A person or a
  // machine credential with obs:triage.
  //
  // The event the call records is the specific transition (resolve, ignore or
  // unresolve); the declared verb is the fallback the activity interceptor
  // writes when the handler records none.
  rpc UpdateIssueStatus(UpdateIssueStatusRequest) returns (UpdateIssueStatusResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "triage"
        target: {
          kind: "issue"
          id: "issue_id"
          label: "response.issue.title"
        }
        env: "env_id"
        detail: ["status"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // AddIssueComment adds a comment to an issue. The body is plain text or
  // markdown, stored verbatim (at most 10000 characters); clients render it
  // safely.
  rpc AddIssueComment(AddIssueCommentRequest) returns (AddIssueCommentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "comment"
        target: {
          kind: "issue"
          id: "issue_id"
        }
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // UpdateIssueComment replaces the body of a comment. Its author only.
  rpc UpdateIssueComment(UpdateIssueCommentRequest) returns (UpdateIssueCommentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "comment_edit"
        target: {
          kind: "issue"
          id: "issue_id"
        }
        detail: ["comment_id"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // DeleteIssueComment removes a comment from the timeline (it is kept, hidden).
  // Its author, or an owner or admin of the org.
  rpc DeleteIssueComment(DeleteIssueCommentRequest) returns (DeleteIssueCommentResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "comment_delete"
        target: {
          kind: "issue"
          id: "issue_id"
        }
        detail: ["comment_id"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // AssignIssue sets or clears the issue's assignee. The assignee must be a
  // member of the issue's org. It bumps Issue.version, and a stale
  // expected_version is Aborted, exactly as UpdateIssueStatus.
  rpc AssignIssue(AssignIssueRequest) returns (AssignIssueResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "assign"
        target: {
          kind: "issue"
          id: "issue_id"
          label: "response.issue.title"
        }
        detail: ["assignee_user_id"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // LinkIssueChat records that a chat was started from the issue ("Ask
  // Reliant"). Idempotent per (issue, chat): linking a chat again changes
  // nothing but a non-empty title, and writes no new timeline entry.
  rpc LinkIssueChat(LinkIssueChatRequest) returns (LinkIssueChatResponse) {
    option (forge.v1.method) = {
      auth_required: true
      activity: {
        verb: "link_chat"
        target: {
          kind: "issue"
          id: "issue_id"
        }
        detail: ["chat_id"]
        writer: ACTIVITY_WRITER_HANDLER
      }
    };
  }

  // ListAssignableUsers returns the people an issue of the org can be assigned
  // to: its members, as {id, name} and nothing else, ordered by name. A person
  // needs membership of the org (any role); a machine credential needs obs:read
  // and to act for that org. Served from Postgres alone. This is the read an
  // assignee picker uses; the member list with grants and emails
  // (ListOrgMemberGrants) needs token:read.
  rpc ListAssignableUsers(ListAssignableUsersRequest) returns (ListAssignableUsersResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }

  // ListIssueTimeline returns the issue's timeline, oldest first: status changes
  // (opened, resolved, ignored, reopened, regressed), comments, assignment
  // changes and linked chats. Deleted comments are not in it. Served from
  // Postgres alone. A person needs org membership, a machine credential
  // obs:read.
  rpc ListIssueTimeline(ListIssueTimelineRequest) returns (ListIssueTimelineResponse) {
    option (forge.v1.method) = {
      auth_required: true
      idempotent: true
    };
  }
}

// IssueTimeRange is a half-open range [start, end). Both ends are required when
// the range is present, and end must be after start.
message IssueTimeRange {
  google.protobuf.Timestamp start = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end = 2 [(buf.validate.field).required = true];
}

// IssueScope is console contract K1 as this service reads it. Field numbers
// match ObservabilityService's QueryScope, so the console sends the one scope it
// builds; the telemetry-only fields (env_id, filters) are reserved.
message IssueScope {
  reserved 2, 7;
  reserved "env_id", "filters";
  // The org whose issues are read. The caller MUST be a member; verified
  // server-side, never assumed.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Narrow to these services. Empty = every service.
  repeated string services = 3 [(buf.validate.field).repeated.max_items = 50];
  // The window the counts and the trend are over. Unset = the last 24 hours.
  // Max 30 days.
  IssueTimeRange time_range = 4;
  // The forge project whose environments are in scope. Unset = not narrowed by
  // project; set to "" = the project-less environments.
  optional string project_id = 5 [(buf.validate.field).string.max_len = 128];
  // Control-plane environment ids (deploy_environments.id). Empty = every
  // environment of the org (of the project, when project_id is set).
  repeated string env_ids = 6 [(buf.validate.field).repeated.max_items = 50];
}

enum IssueSort {
  // Most recently seen first.
  ISSUE_SORT_UNSPECIFIED = 0;
  ISSUE_SORT_LAST_SEEN_DESC = 1;
  ISSUE_SORT_FIRST_SEEN_DESC = 2;
  ISSUE_SORT_EVENTS_DESC = 3;
  ISSUE_SORT_AFFECTED_DESC = 4;
}

message ListIssuesRequest {
  option (buf.validate.message).oneof = {
    fields: [
      "assignee",
      "unassigned"
    ]
  };

  IssueScope scope = 1 [(buf.validate.field).required = true];
  // Only issues in one of these states. Empty = new, unresolved and regressed
  // (the open ones).
  repeated IssueStatus statuses = 2 [
    (buf.validate.field).repeated.max_items = 5,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  optional IssuePlatform platform = 3 [(buf.validate.field).enum.defined_only = true];
  // Only issues first seen in this release version.
  optional string first_seen_release = 4 [(buf.validate.field).string.max_len = 256];
  // Only issues first seen at or after this promotion: "what did this release
  // open".
  optional string since_promotion_id = 5 [(buf.validate.field).string.max_len = 128];
  // Substring of the title or the culprit.
  optional string text = 6 [(buf.validate.field).string.max_len = 256];
  // Only the issues of this issue source (Issue.source). Unset or empty: errors
  // only — a source's issues are never mixed into the error inbox.
  optional string source = 10 [(buf.validate.field).string.pattern = "^([a-z0-9][a-z0-9_.-]{0,63})?$"];
  // Only the issues assigned to this user: a user id, or "me" for the person
  // the caller acts as (the signed-in user, or the user a CLI login or
  // credential-helper token acts for). "me" on a credential that acts for no
  // one (an organization automation token) is refused FAILED_PRECONDITION.
  // Unset: every issue. Exclusive with unassigned.
  optional string assignee = 12 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Only the issues assigned to no one. Set it to true or leave it unset;
  // false is refused, since "not unassigned" would be a second spelling of
  // "every issue". Exclusive with assignee.
  optional bool unassigned = 13 [(buf.validate.field).bool.const = true];
  // Only the issues of one incident: those whose Issue.incident_key is this.
  // The key is derived at read time from the cause and the first-seen times of
  // the environment's server error issues, so send the same
  // incident_window_seconds that produced it. An unknown or stale key lists
  // nothing. statuses still applies (the default hides resolved issues, which
  // Issue.related_count counts), so pass every status to list the whole
  // incident. Incidents are server errors: with a key, source is the error
  // inbox and platform=BROWSER lists nothing.
  optional string incident_key = 14 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  IssueSort sort = 7 [(buf.validate.field).enum.defined_only = true];
  // Rows per page. Default 50, max 100.
  int32 page_size = 8 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  // next_page_token from the previous page; valid only with the same request.
  string page_token = 9 [(buf.validate.field).string.max_len = 512];
  // How close in first-seen time issues of one cause must be to share an
  // incident (Issue.incident_key). Default 600 (ten minutes); max 3600.
  int32 incident_window_seconds = 11 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600
  ];
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetIssueRequest {
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  // The window the counts and the trend are over. Unset = the last 24 hours.
  // Max 30 days.
  IssueTimeRange time_range = 2;
  // ListIssuesRequest.incident_window_seconds, for the incident this issue lists.
  int32 incident_window_seconds = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600
  ];
}

message GetIssueResponse {
  Issue issue = 1;
  // The newest event, or unset when it has aged out of retention.
  IssueEvent latest_event = 2;
  // The latest event's stack, innermost frame first.
  repeated IssueFrame frames = 3;
  // Events and affected count per version, newest version first.
  repeated IssueVersionBreakdown by_version = 4;
  // Issues that fired in the same traces or sessions, most frequent first (max
  // 10).
  repeated string co_occurring_issue_ids = 5;
  // The release the issue first appeared in. Unset when the version is not a
  // release the ledger knows.
  IssueReleaseRef first_release = 6;
  // The other issues of this issue's incident (issue.incident_key): the same
  // cause, first seen close in time, in any service. Empty when it is part of
  // none.
  repeated string incident_issue_ids = 7;
}

// IssueEvent is one occurrence of an issue.
message IssueEvent {
  google.protobuf.Timestamp timestamp = 1;
  string trace_id = 2;
  string span_id = 3;
  string service_version = 4;
  string message = 5;
  // An allowlisted, bounded subset of the event's attributes. Never a secret.
  map<string, string> attributes = 6;
  // Browser issues only.
  string session_id = 7;
  string url_path = 8;
}

// IssueFrame is one stack frame. For a browser issue, symbolicated frames are
// source locations; unsymbolicated ones keep the bundle's.
message IssueFrame {
  string function = 1;
  string file = 2;
  int32 line = 3;
  int32 column = 4;
  // False for a library or runtime frame.
  bool in_app = 5;
}

message IssueVersionBreakdown {
  string version = 1;
  int64 events = 2;
  int64 affected = 3;
  google.protobuf.Timestamp first_seen_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  // What affected counted, as controlplane.v1.Issue.affected_unit.
  string affected_unit = 6;
}

// IssueReleaseRef names the release an issue first appeared in and what changed
// in it.
message IssueReleaseRef {
  string version = 1;
  string git_commit = 2;
  // The commit range the release deployed, "<from>..<to>", when recorded.
  string commit_range = 3;
  google.protobuf.Timestamp promoted_at = 4;
}

message ListIssueEventsRequest {
  // The issue whose events are listed. Required: this is the parent, not a filter.
  string issue_id = 1 [(buf.validate.field).required = true];
  // Default: from the issue's first to its last event. Max 7 days.
  IssueTimeRange time_range = 2;
  // Rows per page. Default 50, max 100.
  int32 page_size = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

message ListIssueEventsResponse {
  // Newest first.
  repeated IssueEvent events = 1;
  string next_page_token = 2;
}

// IssueStatusChange is what a caller may set. The other IssueStatus values are
// reached by the worker (new, regressed), never by a request.
enum IssueStatusChange {
  ISSUE_STATUS_CHANGE_UNSPECIFIED = 0;
  ISSUE_STATUS_CHANGE_RESOLVED = 1;
  ISSUE_STATUS_CHANGE_IGNORED = 2;
  ISSUE_STATUS_CHANGE_UNRESOLVED = 3;
}

enum IssueResolveKind {
  ISSUE_RESOLVE_KIND_UNSPECIFIED = 0;
  // Resolved as of now.
  ISSUE_RESOLVE_KIND_NOW = 1;
  // Resolved against the next release promoted into the environment.
  ISSUE_RESOLVE_KIND_NEXT_RELEASE = 2;
  // Resolved in a named version.
  ISSUE_RESOLVE_KIND_VERSION = 3;
}

// IssueResolveIn says when a resolve takes effect, and so which events reopen
// the issue.
message IssueResolveIn {
  IssueResolveKind kind = 1 [(buf.validate.field).enum.defined_only = true];
  // Required when kind is VERSION.
  string version = 2 [(buf.validate.field).string.max_len = 256];
}

message UpdateIssueStatusRequest {
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  // The environment the issue is in. Checked against the issue's own.
  string env_id = 2 [(buf.validate.field).string.min_len = 1];
  IssueStatusChange status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // With RESOLVED: when the resolve takes effect. Unset = now.
  optional IssueResolveIn resolve_in = 4;
  // With IGNORED: when the issue is un-ignored. Unset = until unignored.
  optional google.protobuf.Timestamp ignored_until = 5;
  // The Issue.version the caller read. Non-zero and stale = Aborted. Zero = do
  // not check.
  int32 expected_version = 6 [(buf.validate.field).int32.gte = 0];
}

message UpdateIssueStatusResponse {
  Issue issue = 1;
}

// ─── Discussion: comments, assignee, linked chats, the timeline ──────────────

// IssueComment is one comment on an issue.
message IssueComment {
  string id = 1;
  string issue_id = 2;
  // The author. Unset when the account no longer exists.
  controlplane.v1.IssueUser author = 3;
  // Plain text or markdown, verbatim. Render it safely.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  // Later than created_at once the comment was edited.
  google.protobuf.Timestamp updated_at = 6;
}

message AddIssueCommentRequest {
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  string body = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 10000
  ];
}

message AddIssueCommentResponse {
  IssueComment comment = 1;
}

message UpdateIssueCommentRequest {
  // The issue the comment is on.
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  string comment_id = 2 [(buf.validate.field).string.min_len = 1];
  string body = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 10000
  ];
}

message UpdateIssueCommentResponse {
  IssueComment comment = 1;
}

message DeleteIssueCommentRequest {
  // The issue the comment is on.
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  string comment_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteIssueCommentResponse {}

message AssignIssueRequest {
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  // The user to assign; empty clears the assignee. Must be a member of the
  // issue's org.
  string assignee_user_id = 2 [(buf.validate.field).string.max_len = 128];
  // The Issue.version the caller read. Non-zero and stale = Aborted. Zero = do
  // not check.
  int32 expected_version = 3 [(buf.validate.field).int32.gte = 0];
}

message AssignIssueResponse {
  Issue issue = 1;
}

message LinkIssueChatRequest {
  string issue_id = 1 [(buf.validate.field).string.min_len = 1];
  // The chat started from the issue (an id in the reliant product).
  string chat_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The chat's title when it was linked. Optional.
  string chat_title = 3 [(buf.validate.field).string.max_len = 256];
}

// IssueChatLink is a chat started from an issue.
message IssueChatLink {
  string issue_id = 1;
  string chat_id = 2;
  string chat_title = 3;
  // Who linked it. Unset for a credential that acts for no person.
  controlplane.v1.IssueUser linked_by = 4;
  google.protobuf.Timestamp linked_at = 5;
}

message LinkIssueChatResponse {
  IssueChatLink link = 1;
  // False when the chat was already linked.
  bool created = 2;
}

message ListIssueTimelineRequest {
  // The issue whose timeline is listed. A merged issue's request is answered
  // with the timeline of the issue it was merged into.
  string issue_id = 1 [(buf.validate.field).required = true];
  // Rows per page. Default 50, max 100.
  int32 page_size = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  // next_page_token from the previous page; valid only with the same issue.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

message ListAssignableUsersRequest {
  // The organization whose members are listed.
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
  // Only the users whose name contains this (case-insensitive).
  optional string text = 2 [(buf.validate.field).string.max_len = 256];
  // Rows per page. Default 50, max 100.
  int32 page_size = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  // next_page_token from the previous page; valid only with the same request.
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

message ListAssignableUsersResponse {
  // name is the user's display name, or their email when they have none (as
  // IssueUser everywhere else); no other field of the user is returned.
  repeated controlplane.v1.IssueUser users = 1;
  string next_page_token = 2;
}

// IssueActor is who did something: a person, a machine credential or the
// system (the issues worker).
message IssueActor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER = 1;
    KIND_MACHINE = 2;
    KIND_SYSTEM = 3;
  }
  Kind kind = 1;
  string id = 2;
  // A person's display name (their email when they have none); empty for a
  // machine or the system.
  string name = 3;
}

// IssueStatusEntry is a status change.
message IssueStatusEntry {
  // Unspecified for the issue's opening.
  controlplane.v1.IssueStatus from = 1;
  controlplane.v1.IssueStatus to = 2;
  // With a resolve: the version it resolves in, when one was named.
  string version = 3;
  // With an ignore: when it is un-ignored, when bounded.
  google.protobuf.Timestamp ignored_until = 4;
}

// IssueCommentEntry is a comment.
message IssueCommentEntry {
  IssueComment comment = 1;
}

// IssueAssignmentEntry is an assignment change.
message IssueAssignmentEntry {
  // Unset: it was unassigned.
  controlplane.v1.IssueUser from = 1;
  // Unset: it was unassigned.
  controlplane.v1.IssueUser to = 2;
}

// IssueChatEntry is a chat started from the issue.
message IssueChatEntry {
  IssueChatLink link = 1;
}

// IssueTimelineEntry is one thing that happened to an issue.
message IssueTimelineEntry {
  // Unique and stable; a client keys on it.
  string id = 1;
  google.protobuf.Timestamp time = 2;
  // The issue it happened on: the requested one, or an issue merged into it.
  string issue_id = 3;
  IssueActor actor = 4;
  oneof entry {
    IssueStatusEntry status = 10;
    IssueCommentEntry comment = 11;
    IssueAssignmentEntry assignment = 12;
    IssueChatEntry chat = 13;
  }
}

message ListIssueTimelineResponse {
  // Oldest first.
  repeated IssueTimelineEntry entries = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // The issue the timeline is of: issue_id, or the issue it was merged into.
  string issue_id = 3;
}
