syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/git_credential/v1;git_credentialv1";

// === GitCredentialService ===

service GitCredentialService {
  rpc SaveGitCredential(SaveGitCredentialRequest) returns (SaveGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetGitCredential(GetGitCredentialRequest) returns (GetGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc DeleteGitCredential(DeleteGitCredentialRequest) returns (DeleteGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc CloneRepo(CloneRepoRequest) returns (CloneRepoResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListGitRepos(ListGitReposRequest) returns (ListGitReposResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // ExchangeGithubOAuthCode finishes the GitHub OAuth connect flow that the
  // browser/electron client started via GET /auth/github/authorize. The client
  // owns its own callback route (so it works behind Firebase SPA-rewrites, which
  // can't proxy to the GKE backend) and calls this RPC with the `code` + signed
  // `state` GitHub redirected back with. Identity travels in the HMAC-signed
  // state (not a JWT), so this method is auth_required:false — the handler
  // verifies the state signature, exchanges the code for a token, and saves the
  // credential for the user the state names.
  rpc ExchangeGithubOAuthCode(ExchangeGithubOAuthCodeRequest) returns (ExchangeGithubOAuthCodeResponse) {
    // auth_required:false → no bearer token (identity rides in the signed state).
    option (forge.v1.method) = {auth_required: false};
  }
}

message SaveGitCredentialRequest {
  string provider = 1; // e.g. "github"
  string access_token = 2;
  string scopes = 3;
}

message SaveGitCredentialResponse {}

message GetGitCredentialRequest {
  string provider = 1;
}

message GetGitCredentialResponse {
  string provider = 1;
  string scopes = 2;
  bool has_token = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message DeleteGitCredentialRequest {
  string provider = 1;
}

message DeleteGitCredentialResponse {}

message CloneRepoRequest {
  string daemon_id = 1;
  string git_repo = 2;
  string git_branch = 3;
  string path = 4; // optional, defaults to /home/workspace/projects/<repo-name>
}

message CloneRepoResponse {
  string cloned_path = 1;
}

message ListGitReposRequest {
  string provider = 1;
  int32 page = 2;
  int32 per_page = 3;
  string sort = 4;
}

message ListGitReposResponse {
  repeated GitRepo repos = 1;
  bool has_more = 2;
}

message ExchangeGithubOAuthCodeRequest {
  string code = 1; // GitHub authorization code from the callback query
  string state = 2; // signed state the authorize step issued, echoed by GitHub
}

message ExchangeGithubOAuthCodeResponse {
  bool ok = 1; // true when the code was exchanged and the credential saved
  string return_to = 2; // relative app path to navigate to (decoded from state)
  string error = 3; // machine-readable error code when ok=false (empty on success)
}
