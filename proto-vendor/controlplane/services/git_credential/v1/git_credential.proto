syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/git_credential/v1;git_credentialv1";

// === GitCredentialService ===

service GitCredentialService {
  rpc SaveGitCredential(SaveGitCredentialRequest) returns (SaveGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetGitCredential(GetGitCredentialRequest) returns (GetGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc DeleteGitCredential(DeleteGitCredentialRequest) returns (DeleteGitCredentialResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc CloneRepo(CloneRepoRequest) returns (CloneRepoResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListGitRepos(ListGitReposRequest) returns (ListGitReposResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  // ExchangeGithubOAuthCode finishes the GitHub OAuth connect flow that the
  // browser/electron client started via GET /auth/github/authorize. The client
  // owns its own callback route (so it works behind Firebase SPA-rewrites, which
  // can't proxy to the GKE backend) and calls this RPC with the `code` + signed
  // `state` GitHub redirected back with. Identity travels in the HMAC-signed
  // state (not a JWT), so this method is auth_required:false — the handler
  // verifies the state signature, exchanges the code for a token, and saves the
  // credential for the user the state names.
  rpc ExchangeGithubOAuthCode(ExchangeGithubOAuthCodeRequest) returns (ExchangeGithubOAuthCodeResponse) {
    // auth_required:false → no bearer token (identity rides in the signed state).
    option (forge.v1.method) = {auth_required: false};
  }
}

message SaveGitCredentialRequest {
  string provider = 1; // e.g. "github"
  string access_token = 2;
  string scopes = 3;
}

message SaveGitCredentialResponse {}

message GetGitCredentialRequest {
  string provider = 1;
}

// Health of a stored credential, as the settings UI needs to present it.
enum GitCredentialHealth {
  GIT_CREDENTIAL_HEALTH_UNSPECIFIED = 0;
  // Usable now, or renewable without user action.
  GIT_CREDENTIAL_HEALTH_VALID = 1;
  // Past its expiry with no way to renew. The user must reconnect.
  GIT_CREDENTIAL_HEALTH_EXPIRED = 2;
  // The provider rejected the refresh token (revoked, or past its own
  // life). Terminal until the user re-authorizes.
  GIT_CREDENTIAL_HEALTH_NEEDS_RECONNECT = 3;
}

// How the credential was obtained, which determines whether it expires and
// what "scopes" actually means.
enum GitCredentialKind {
  GIT_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // GitHub App user token (ghu_). Expires after eight hours and is renewed
  // with a refresh token; access is governed by the App's installations,
  // NOT by the OAuth scope string.
  GIT_CREDENTIAL_KIND_GITHUB_APP = 1;
  // Classic OAuth App token (gho_). Does not expire; scopes are meaningful.
  GIT_CREDENTIAL_KIND_OAUTH_APP = 2;
  // A personal access token the user pasted in by hand.
  GIT_CREDENTIAL_KIND_PERSONAL_ACCESS_TOKEN = 3;
}

// A GitHub App installation the connected account can reach. Read-only.
message GitAppInstallation {
  // The org or user the App is installed on, e.g. "reliant-labs".
  string account_login = 1;
  string account_type = 2; // "Organization" or "User"
  string avatar_url = 3;
  // Where the user manages which repositories this installation can see.
  string configure_url = 4;
  // "all" when the installation covers every repository, otherwise
  // "selected".
  string repository_selection = 5;
}

message GetGitCredentialResponse {
  string provider = 1;
  string scopes = 2;
  bool has_token = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;

  // Which GitHub account the credential belongs to. Empty when the provider
  // could not be reached or the token is dead — the settings page then shows
  // the health state rather than a name it cannot verify.
  string account_login = 6;
  string account_avatar_url = 7;

  GitCredentialKind kind = 8;
  GitCredentialHealth health = 9;
  // When the access token expires. Unset for credential kinds that never do.
  google.protobuf.Timestamp expires_at = 10;

  // GitHub App installations reachable by this credential. Always empty for
  // kinds where the concept does not apply.
  repeated GitAppInstallation installations = 11;

  // Where to send the user to ADD an account or change which repositories the
  // App can see — GitHub's installation flow. This is a different action from
  // re-running OAuth: OAuth re-authorizes the user, and changes nothing about
  // which accounts or repos the App is installed on.
  //
  // Empty when the App slug is not configured and no installation reported
  // one; clients must treat it as optional rather than rendering a dead link.
  string install_url = 12;

  // The App's URL slug (the <slug> in github.com/apps/<slug>), for clients
  // that want to build their own links. Empty under the same conditions as
  // install_url.
  string app_slug = 13;
}

message DeleteGitCredentialRequest {
  string provider = 1;
}

message DeleteGitCredentialResponse {}

message CloneRepoRequest {
  string daemon_id = 1;
  string git_repo = 2;
  string git_branch = 3;
  string path = 4; // optional, defaults to /home/workspace/projects/<repo-name>

  // The id the queued git.clone command carries, echoed by the daemon on its
  // DaemonCommandFailed announcement. A caller that records the clone (reliant's
  // CreateProjectFromRepo writes a row keyed by it) passes its own id, so the
  // failure can be matched back to that record. Empty means the control plane
  // generates one; a caller that leaves it empty cannot correlate the outcome.
  string request_id = 5;
}

message CloneRepoResponse {
  // Where the repo WILL live once the clone runs. Echoed from the request
  // (or defaulted); it is not confirmation that the directory exists.
  string cloned_path = 1;

  // True always, today: CloneRepo durably enqueues the command onto
  // DAEMON_PENDING_COMMANDS and returns without waiting, whether or not the
  // target daemon is online. The field exists because the old response was
  // indistinguishable from "cloned", so the UI announced success for a clone
  // that had not started — and, with an expired token, would never succeed.
  //
  // Clients must render this as "queued", and take the real outcome from the
  // asynchronous signal the daemon emits when it runs the command
  // (FileSystemChanged on success, DaemonCommandFailed on failure), which
  // reaches the client as a user_updates row that replays on reconnect.
  bool queued = 2;

  // The daemon the clone was queued for, so the UI can say which machine it
  // is waiting on without a second lookup.
  string daemon_id = 3;
  string daemon_name = 4;
}

message ListGitReposRequest {
  optional string provider = 1;
  int32 page = 2;
  int32 per_page = 3;
  optional string sort = 4;
}

message ListGitReposResponse {
  repeated GitRepo repos = 1;
  bool has_more = 2;
}

message ExchangeGithubOAuthCodeRequest {
  string code = 1; // GitHub authorization code from the callback query
  string state = 2; // signed state the authorize step issued, echoed by GitHub
}

message ExchangeGithubOAuthCodeResponse {
  bool ok = 1; // true when the code was exchanged and the credential saved
  string return_to = 2; // relative app path to navigate to (decoded from state)
  string error = 3; // machine-readable error code when ok=false (empty on success)
}
