syntax = "proto3";

// EXPERIMENTAL: controlplane.v1 is unstable. Field numbers, RPC names, and
// service shapes may change without notice until the package is declared
// stable. Consumers should pin to a specific control-plane commit.
//
// See proto/controlplane/v1/README.md for stability/versioning policy.

package controlplane.v1;

import "controlplane/v1/shared.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/control-plane/gen/services/llm_gateway/v1;llm_gatewayv1";

// === LLMGatewayService ===

service LLMGatewayService {
  rpc CreateLLMKey(CreateLLMKeyRequest) returns (CreateLLMKeyResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListLLMKeys(ListLLMKeysRequest) returns (ListLLMKeysResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetLLMKey(GetLLMKeyRequest) returns (GetLLMKeyResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc RevokeLLMKey(RevokeLLMKeyRequest) returns (RevokeLLMKeyResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc RotateLLMKey(RotateLLMKeyRequest) returns (RotateLLMKeyResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc GetLLMSpend(GetLLMSpendRequest) returns (GetLLMSpendResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) {
    option (forge.v1.method) = {auth_required: true};
  }
}

message CreateLLMKeyRequest {
  string org_id = 1;
  string name = 2;
  repeated string models = 3;
  optional double max_budget = 4; // nil means no budget limit
  string budget_duration = 5;
}

message CreateLLMKeyResponse {
  LLMKey key = 1;
  string plaintext_key = 2;
}

message ListLLMKeysRequest {
  string org_id = 1;
}

message ListLLMKeysResponse {
  repeated LLMKey keys = 1;
}

message GetLLMKeyRequest {
  string key_id = 1;
}

message GetLLMKeyResponse {
  LLMKey key = 1;
}

message RevokeLLMKeyRequest {
  string key_id = 1;
}

message RevokeLLMKeyResponse {}

message RotateLLMKeyRequest {
  string key_id = 1;
  string grace_period = 2;
}

message RotateLLMKeyResponse {
  LLMKey key = 1;
  string plaintext_key = 2;
}

message GetLLMSpendRequest {
  string org_id = 1;
  optional string key_id = 2;
  string start_date = 3;
  string end_date = 4;
}

message GetLLMSpendResponse {
  repeated LLMSpendEntry entries = 1;
  double total_spend = 2;

  // How many DISTINCT CALENDAR DAYS the returned spend was actually observed
  // over, in UTC. total_spend divided by this is the observed burn rate, and
  // it is the only denominator that produces an honest one.
  //
  // It has to be reported separately because `entries` cannot carry it:
  // entries are aggregated per (key, model) across the WHOLE requested range,
  // so a client counting entries counts one day billed across three models as
  // three days and understates the burn rate threefold. There is no per-day
  // row for a client to count even in principle — LLMSpendEntry.period_start
  // is not populated by this RPC and a client must not infer days from it.
  //
  // ZERO MEANS "NO OBSERVED DAYS", which includes the case where the upstream
  // spend logs carried no usable timestamps. A client must withhold any
  // rate-derived estimate at zero rather than dividing by the range length —
  // substituting a plausible denominator for a missing one is how a runway
  // estimate becomes a confident number nobody measured.
  int32 sample_days = 3;
}

message ListAvailableModelsRequest {
  string org_id = 1;
}

message ListAvailableModelsResponse {
  repeated string models = 1;
}

