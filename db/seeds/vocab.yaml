# db/seeds/vocab.yaml — what reliant's columns MEAN, for `forge db seed apply`
# (a dev database only) and forge's mock fixtures. The schema gives types and
# constraints, never meaning: an undescribed text column seeds as
# `sample_<column>_<row>`, an undescribed number as the row index. Values are
# validated against the applied schema (db/migrations); PK and FK columns are
# the seeder's and never listed here. After editing, run `task generate`.
# Depth: `reliant forge skill load db/seeding` (and db/seeding/vocab).
#
# Every column is drawn independently, so seeded rows are FK-coherent volume,
# not a story: a chat's title and its messages' text are unrelated draws. Rows
# that must make sense together belong in db/seeds/custom/.
#
# Integer status/kind/role columns are proto enums stored as their number
# (proto/reliant/v1); UNSPECIFIED (0) is never seeded.

pools:
  project_names: [reliant, forge, control-plane, landing-page, acme-api, billing-service, docs-site, mobile-app]
  branches: [main, feat/streaming-tool-output, fix/worktree-cleanup, chore/bump-forge, feat/org-switcher, fix/daemon-reconnect]
  chat_titles:
    - Fix the flaky worktree cleanup test
    - Add an org switcher to the sidebar
    - Why does the daemon reconnect loop?
    - Bump forge and regenerate
    - Review PR 2988
    - Draft the Q4 release notes
    - Port the billing worker to Temporal
    - Explain the chat update ledger
  model_ids: [claude-sonnet-5, claude-opus-5-5, claude-haiku-4-5-20251001, gpt-5.1, gemini-3-pro]
  tool_names: [shell, view, edit, write, code_context, spawn, fetch, websearch, ask_user, load_tool]
  hostnames: [mbp-dev, cloud-ws-1, cloud-ws-2, ci-runner-7, studio-linux]
  workflow_names: [default, get-it-right, best-of-three, pr-review, release-notes]
  json_objects: ['{}']

columns:
  # ── Projects, repos, worktrees ─────────────────────────────────────────────
  projects.name: {pool: project_names}
  projects.description: [null, A Go service with a Vite frontend, The marketing site, Internal tooling]
  projects.default_branch: [main]
  projects.remote_url: [null, https://github.com/reliant-labs/reliant.git, https://github.com/reliant-labs/forge.git, https://github.com/acme/acme-api.git]
  # Live projects: a project with delete_after set is being deleted, and the
  # project_delete_admission trigger refuses new chats, worktrees and
  # triggers under it.
  projects.delete_after: [null]
  projects.purge_started_at: [null]
  projects.deleted_by: [null]
  projects.visibility: [null]                        # personal; 'org' needs an org
  repos.name: [reliant, forge, control-plane, web, api]
  repos.remote_url: [null, https://github.com/reliant-labs/reliant.git, https://github.com/reliant-labs/forge.git]
  worktrees.name: [streaming-tool-output, worktree-cleanup, org-switcher, daemon-reconnect, bump-forge]
  worktrees.branch: {pool: branches}
  worktrees.base_branch: [main]
  worktrees.status: [1, 1, 1, 2, 3]                  # WorktreeStatus: mostly ACTIVE
  worktrees.failure_reason: [""]
  # A worktree mid-recovery refuses new threads (recovery_*_admission).
  worktrees.recovery_finalizing_id: [null]

  # ── Chats, threads, messages ───────────────────────────────────────────────
  chats.title: {pool: chat_titles}
  chats.state: [2, 2, 2, 3]                          # ChatState: IDLE, some ARCHIVED
  chats.unread: {min: 0, max: 3}
  chats.workflow_name: {pool: workflow_names}
  chats.app_name: [null]
  chats.visibility: [null]                           # personal; 'org' needs an org
  chats.no_machine: [false]
  threads.title: [null, Main, Research the call graph, Write the tests, Review the diff]
  threads.status: [1, 2]
  messages.role: [1, 2, 2, 4]                        # MessageRole: USER, ASSISTANT, TOOL
  messages.model: {pool: model_ids}
  messages.token_count: {min: 40, max: 12000, step: 40}
  messages.cost: {min: 0.0, max: 0.75, step: 0.01, decimals: 2}
  message_content_blocks.block_type: [1, 1, 2, 3, 5] # ContentBlockType: TEXT, TOOL_CALL, TOOL_RESULT, THINKING
  message_content_blocks.content:
    - Let me look at how the worktree cleanup runs first.
    - The test fails because the daemon holds the lock while it reconnects.
    - "I've updated the handler and added a regression test."
    - Here is the plan, in three steps.
  message_content_blocks.tool_name: {pool: tool_names}
  message_content_blocks.tool_input: ['{}']
  tool_calls.tool_name: {pool: tool_names}
  tool_calls.status: [3, 3, 3, 4, 1]                 # ToolCallStatus: mostly COMPLETED
  tool_calls.error_message: [null]
  # chat_updates.data is text, but an index reads it as jsonb.
  chat_updates.data: {pool: json_objects}

  # ── Workflows ──────────────────────────────────────────────────────────────
  workflows.workflow_name: {pool: workflow_names}
  workflow_drafts.name: [Nightly triage, PR review, Release notes, Flake hunter]
  workflow_drafts.visibility: [null]

  # ── Daemons and processes ──────────────────────────────────────────────────
  daemons.hostname: {pool: hostnames}
  daemons.name: {pool: hostnames}
  daemons.platform: [darwin/arm64, linux/amd64, linux/arm64]
  daemons.last_status_message: [""]
  daemons.oom_kill_count: [0]
  background_processes.command: [npm run dev, go test ./internal/..., task test:short, air -c .air.api.toml]
  background_processes.working_dir: [/home/workspace/projects/reliant, /home/workspace/projects/forge]
  background_processes.status: [1, 2, 2, 3]          # BackgroundProcessStatus

  # ── Triggers and model endpoints ───────────────────────────────────────────
  triggers.name: [Every weekday at 9, On PR opened, On Slack mention, Nightly flake report]
  triggers.message: [Triage the new issues, Review this pull request, Summarize yesterday's failures]
  # Run on whichever machine the trigger's pool or project picks, not a pinned
  # daemon (triggers_*_no_daemon_check).
  triggers.daemon_id: [null]
  triggers.no_machine: [false]
  model_endpoints.name: [Local Ollama, LM Studio, Team vLLM]
  model_endpoints.base_url: [http://localhost:11434/v1, http://localhost:1234/v1, https://vllm.internal.example.com/v1]
  # route = 'via_daemon' exactly when daemon_id is set: seed the direct ones.
  model_endpoints.route: [direct]
  model_endpoints.daemon_id: [null]

  # ── Connectors, machine pools, LLM usage ───────────────────────────────────
  connector_grants.exec_mode: [deny, unrestricted]
  connector_grants.allowed_tools: ['["shell", "view", "edit"]', '["view"]']
  connector_grants.exec_allowlist: ['["git", "go", "task"]']
  connector_grants.project_names: ['[]', '["reliant"]']
  connector_grants.path_root: [/home/workspace/projects]
  machine_pools.name: [gpu, large, default]
  machine_pools.selector: ['{"size": "large"}', '{"gpu": "true"}']
  # error_class is '' exactly when the call did not fail: seed successes.
  llm_call_usage.outcome: [success]
  llm_call_usage.error_class: [""]
  llm_call_usage.input_tokens: {min: 200, max: 60000, step: 200}
  llm_call_usage.output_tokens: {min: 20, max: 4000, step: 20}
  llm_call_usage.latency_ms: {min: 300, max: 45000, step: 100}

  # ── Provider accounts ──────────────────────────────────────────────────────
  # A user's own API keys: org ownership, org access and attribution are each
  # all-or-nothing column groups (provider_accounts_*_check).
  provider_accounts.provider: [anthropic, openai, google]
  provider_accounts.auth_kind: [api_key]
  provider_accounts.owner_kind: [user]
  provider_accounts.org_id: [null]
  provider_accounts.org_access: [null]
  provider_accounts.attributed_org_id: [null]
  provider_accounts.attribution_source: [null]
  provider_accounts.label: [Personal key, Work key, Backup key]
  provider_accounts.priority: {min: 0, max: 3}

  # A hosted HTTP action ticket lives for at most one minute.
  hosted_http_action_tickets.created_at: [-2880m]
  hosted_http_action_tickets.expires_at: [-2879m]
