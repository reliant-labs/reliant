# buf.gen-go-only.yaml - Code generation for Go only (excludes TypeScript)
#
# Run it through `make proto-generate-go`. The Go plugins are the same
# `go tool` directives buf.gen.yaml uses, so the two templates cannot disagree
# about a version: both write gen/, and both resolve it from go.mod.
version: v2
managed:
  enabled: false
plugins:
  # Generate Go protobuf code
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt:
      - paths=source_relative

  # Generate Connect-Go service code
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative
