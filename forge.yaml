# Forge project manifest — see https://github.com/reliant-labs/forge.
# This file is minimal on purpose. Features, the database, the frontends and
# the project kind are derived from what exists in the repo (db/migrations,
# frontends/, deploy/kcl, internal/operators, ...), not configured here.
# Add a section (ci, lint, contracts, ...) only to override a default
# (`forge agent skill load architecture` documents the schema;
# `forge agent skill list` indexes the per-topic skills, e.g. `auth`).
#
# reliant adopts forge in place, one concern per PR
# (research/forge-migration/PLAN.md). Every proto service is a forge handler
# package under internal/handlers/<svc> (P3b, research/forge-migration/
# 06-p3b-recipe.md), for which forge scaffolds and keeps a generated mock,
# test harness and dashboard. Every server role is a root of the composition
# graph (research/forge-migration/09-roots-plan.md): `reliant server api`,
# `worker` and `gateway` are the //forge:roots in internal/app, built from
# compose.go and run under cmd/reliant/cmd/serve.go's process policy, and
# `forge lint --graph` gates that every node is reached by one. A contract
# package an internal/app provider builds by hand is `//forge:provided`; one
# another package, the CLI or the daemon builds is `//forge:not-a-component`,
# naming who. Beyond that, `forge generate` projects the
# contract mocks/decorators, the descriptor, the open-procedure set and the
# ORM in internal/store (database.orm below), and runs generate.hooks below:
# the compiled-code generators forge does not own. Taskfile.yml is the
# entrypoint (`task --list`). After
# changing a proto, a contract.go interface, a migration or a hook's input,
# run `task generate:check` (forge generate at forge_version below, which
# must equal go.mod's) and commit what it writes: the generated mocks assert
# their interface at compile time, and gen/forge_descriptor.json mirrors the
# protos. `forge ci verify-generated` (in `task ci`) and CI fail a change that
# skipped it.

name: reliant
module_path: github.com/reliant-labs/reliant
forge_version: v1.11.1-0.20261125173122-732aa53947a1
harness: reliant
config:
    # Every process setting is typed config (proto/reliant/config/v1, read through
    # pkg/config). A direct environment read outside pkg/config fails lint;
    # one that is not configuration takes a scoped //nolint:forbidigo.
    enforce_typed_access: error
lint:
    rules:
        # P7b Z: activity declarations are complete. Enforce them now rather
        # than waiting for forge's v0.1.48 rollout default.
        forgeconv-activity-declared: error
        # forge #993's tracing rules ship hard-ERROR, and reliant has 106
        # findings at the pin that introduced them (61 log-without-ctx, 18
        # raw-http-client, 18 contract-uninstrumented, 9 raw-sql-open). Warn
        # while that adoption is tracked separately; each goes back to error
        # (delete the entry) once its findings are fixed. log-without-ctx is
        # done: `forge lint --tracing` rewrote every call, including the
        # internal/logging helpers listed under tracing.log_wrappers below.
        # raw-http-client is done: plain outbound HTTP goes through
        # observe.NewHTTPClient, Connect clients through observe.NewClientStack.
        # raw-sql-open is done: every pool opens through dbtrace (or
        # serverkit.OpenDB); the test-only provisioning pools carry reasons.
        # contract-uninstrumented is done: every construction outside
        # compose.go calls the package's generated NewInstrumented.
        # P7a (research/forge-migration/11-svcerr-plan.md §4 "Z"): every
        # handler error goes through svcerr, so a per-service Connect-code
        # mapping helper or a hand-built connect.NewError in internal/handlers
        # fails the build. Both ship at warn; reliant has no findings left.
        forgeconv-no-handler-error-mapping: error
        forgeconv-handler-connect-error: error
        # P7b A4 (research/forge-migration/14-p7b-lint-adoption-plan.md §2.2):
        # every handler file is under lint.handler_file_max_loc (1000), so a
        # handler file that grows past it fails the build. Split it into
        # rpc_<family>.go siblings rather than raising the limit.
        forgeconv-handler-file-size: error
        # access_tokens' scopes and resource-kind CHECKs are declared
        # `forge:closed-set accesstoken.*`. The rule warns until v0.1.48, so a
        # forge bump that grew AllScopes (billing:read, forge #1566) passed the
        # merge gate and failed the release gate's DB test instead. At error,
        # the bump's own PR fails `forge lint --closed-sets` and is fixed with
        # `task db:migration` + `forge db migration new --closed-set <constraint>`.
        forge-closed-set: error
        # P7b A5 (research/forge-migration/14-p7b-lint-adoption-plan.md §2.3,
        # §2.4): no component reads the process environment, no component's
        # Deps carries a naked scalar (each takes its config block), and every
        # optional dep is nil-checked where it is dereferenced. reliant has no
        # findings left; at error a regression fails `forge lint`.
        forgeconv-no-getenv: error
        forge-config-deps: error
        forge-optional-deps-guard: error
        # The owner's policy for this repo (flaky = delete immediately): a
        # test the change adds or edits that fails one of its three runs
        # blocks (`forge test flakes gate`, which scripts/test-flake.sh runs;
        # forge ci gate's flake-check step). For customers the step warns.
        flake-check: error
    tracing:
        # internal/logging's ctx-less helpers write through slog without the
        # request's context, so their lines carry no trace_id. Listing them
        # makes forge-tracing-log-without-ctx flag and rewrite their calls to
        # the logging.*Context twins, exactly as it does slog's own.
        log_wrappers:
            - call: github.com/reliant-labs/reliant/internal/logging.Info
            - call: github.com/reliant-labs/reliant/internal/logging.Debug
            - call: github.com/reliant-labs/reliant/internal/logging.Warn
            - call: github.com/reliant-labs/reliant/internal/logging.Error
            - call: github.com/reliant-labs/reliant/internal/logging.Trace
            - call: github.com/reliant-labs/reliant/internal/logging.Log
# reliant records its own test runs (the merge gate's affected lanes, the
# release gate's `task test` / `test:web` / `test:integration` / `test:e2e`,
# and the flake gate, through `forge test capture`; scripts/test-capture.sh)
# and acts on its flakes as the owner's policy says (flaky = delete
# immediately): a suspected flake files a flake:suspected issue (today
# scripts/flake-report.sh's `forge test flakes --issues`) and gets a
# quarantine PR rather than a suggestion, once the hosted Tests flow acts on
# these settings (Tests D3b). coverage: true also builds the dev stack's air
# servers and `go run` migrate instrumented (`forge env up dev`, a local env;
# scripts/air-build.sh takes $FORGE_GO_BUILD_FLAGS), never a persistent env
# (demo, desktop, release render byte-identically). Upload stays at its
# default (in CI): ci.yml's test-upload job, on main, best effort.
tests:
    coverage: true
    flakes:
        issues: true
        quarantine: pr
# `forge vuln patch --verify` (and the vuln-patch workflow, unless its
# verify_command says otherwise) proves a bumped tree with the merge gate,
# the gate the merge queue would run on the bump: affected Go/web/electron
# tests (a go.mod or lockfile change runs the whole lane), go build, scoped
# forge lint and the generate check, over the dirty tree. Unset, forge would
# run `task test:short`, which builds and lints nothing.
vuln:
    patch:
        verify: task ci:merge
database:
    # Prod's Postgres major (Cloud SQL reliant-pg is POSTGRES_16). forge's
    # pgtest boots its embedded test server at this major, so a test run
    # proves the SQL on the server it ships to, and checks a
    # FORGE_TEST_POSTGRES_URL server's major against it.
    postgres_version: "16"
    migration_safety:
        # Every migration after the baseline says whether the previous
        # release keeps working on the schema it leaves:
        # `-- forge:backward-compatible — <why>` or
        # `-- forge:breaks-rollback <why>`. `forge lint --migration-safety`
        # fails one that says neither, or gives no reason
        # (internal/db/SCHEMA.md).
        require_compat_declaration: true
    orm:
        # The generated data layer (entities, <Entity>Store, the _repo_ext.go
        # seams) lands in internal/store, beside the hand-owned internal/db
        # Repository, whose names (Chat, Message, Repo, …) it would otherwise
        # collide with. Every statement runs here: the hand Repository's SQL
        # lives in its _repo_ext.go files (P5b,
        # research/forge-migration/08-p5b-spike.md; rules in
        # internal/db/SCHEMA.md).
        package: internal/store
generate:
    # The compiled-code generators forge does not own (P8 D-P8-4). `forge
    # generate` runs them after its own buf step (their inputs need gen/) and
    # before the go mod tidy + build that validate the tree, with go.mod's
    # pinned buf and protoc plugins on PATH; so `forge ci verify-generated`
    # is their drift gate too. The docs generators are not here: they are
    # docs, too slow for every generate, and need python3 (`task generate:docs`).
    hooks:
        # The control-plane clients (Go + TS) from proto-vendor/controlplane/,
        # control-plane's exported public contract. Both dirs are replaced
        # wholesale, only after buf succeeds.
        - name: controlplane-client
          # Vendored descriptors are inputs to frontend hooks/mock projections.
          phase: input
          command: [scripts/proto-generate-atomic.sh, buf.gen.controlplane.yaml, gen/controlplane, frontends/web/src/gen/controlplane]
          writes: [gen/controlplane, frontends/web/src/gen/controlplane]
        # The TypeScript SDK's generated protobuf subset (@reliantlabs/sdk),
        # from buf.gen.sdk-ts.yaml. Replaced wholesale, only after buf succeeds.
        - name: sdk-ts-gen
          command: [scripts/proto-generate-atomic.sh, buf.gen.sdk-ts.yaml, sdk/ts/src/gen]
          writes: [sdk/ts/src/gen]
        # The Go SDK's copy of the public protos (sdk/go/gen, its own module),
        # from buf.gen.sdk-go.yaml. Replaced wholesale, only after buf succeeds;
        # the script then strips the forgepb import so the SDK needs no forge.
        - name: sdk-go-gen
          command: [scripts/sdk-go-gen.sh]
          writes: [sdk/go/gen]
        # The app's gen/reliant/v1 does not generate the public protos (buf.gen.yaml
        # routes them into the SDK); this re-exports the pinned SDK's package from
        # gen/reliant/v1 so the app's imports are unchanged.
        - name: sdk-aliases
          command: [go, run, ./tools/sdkalias]
          writes: [gen/reliant/v1/sdk_alias.pb.go]
        - name: yaml-bindings
          command: [go, generate, ./internal/workflow/yaml]
          writes: [internal/workflow/yaml/bindings_generated.go]
        - name: tool-catalog
          command: [go, generate, ./internal/llm/tools]
          writes: [internal/llm/tools/toolcatalog/catalog_generated.go]
        - name: manifest-schema
          command: [go, generate, ./internal/integrations/manifest/schema]
          writes:
            - internal/integrations/manifest/schema/action.schema.json
            - internal/integrations/manifest/schema/event.schema.json
            - internal/integrations/manifest/schema/manifest.schema.json
        # Webhook event typing: parser projections + catalog event fragments,
        # from the projection specs and the pinned upstream schema.
        - name: integrations
          command: [go, run, ./tools/integrationgen]
          writes:
            - internal/integrations/webhook/github/zz_projection_generated.go
            - internal/integrations/catalog/github/events
            - internal/integrations/catalog/github/schemas
            - internal/integrations/catalog/github/manifest.yaml
upgrade:
    # What `forge project upgrade` does beyond forge's own codemods. The proto
    # vendored from control-plane (proto-vendor/controlplane/) is what a forge
    # bump most often leaves stale. control-plane's check-vendored-proto.sh
    # writes the lag report; it is control-plane's script and a control-plane
    # checkout, so reliant has none until one is run:
    #   CONTROL_PLANE_DIR=../control-plane ../control-plane/scripts/check-vendored-proto.sh \
    #     --reliant . --report tmp/ci/reliant-vendored-proto.json
    # (the pin bot does exactly that). The report names its own CONTROL_PLANE_DIR
    # (revendor.env), which upgrade exports to the command; with no report there
    # is nothing to re-vendor and upgrade says so.
    vendored_contracts:
        - name: controlplane
          report: tmp/ci/reliant-vendored-proto.json
          schema: reliant-vendored-proto/v1
          env_path: revendor.env
          commands:
              - [task, "contract:controlplane:sync"]
ci:
    workflows:
        # Declined (forge v1.10.0 playbook pgo-default-on): reliant's binary
        # gets PGO from control-plane's ShellBuild `pgo` (forge #2577 +
        # control-plane #3282), and control-plane's weekly refresh writes
        # cmd/reliant/default.pgo, so a reliant pgo-refresh.yml would duplicate it.
        pgo-refresh: false
        # Declined: reliant never deploys from Actions. control-plane deploys
        # the reliant server images, and rc-train tags releases that
        # release.yml builds (Electron, CLI).
        deploy: false
        # Declined: e2e runs in the release gate (`task test:e2e`, from
        # scripts/release-gate.sh), not in a separate workflow.
        e2e: false
        # Declined: buf breaking runs in the merge gate
        # (scripts/check-compat.sh proto, from scripts/merge-gate.sh).
        proto-breaking: false
        # Declined: reliant has no dependency-bump bot (no Dependabot, no
        # Renovate). Bumps are hand-made PRs (the forge pin by
        # dev-docs/forge-upgrade.md); ci.yml's vuln scan reports known CVEs.
        dependabot: false
    vuln_scan:
        # Exemptions only: no scanner is named, so the derived default scanners
        # still run (forge's CIVulnConfig.UsesDefaultScanners).
        #
        # Two Moby advisories with NO fixed version for github.com/docker/docker
        # (upstream fixed them only in github.com/moby/moby/v2, a different
        # module path). Both are unreviewed, so they list no vulnerable symbols
        # and govulncheck flags ANY package of the module that is linked.
        #
        # Reachability (govulncheck -show verbose,traces ./..., go1.27.4,
        # 2026-11-11): reliant imports no github.com/docker/docker package
        # itself. `go list -deps ./...` links exactly one,
        # github.com/docker/docker/api/types/versions (compare.go: string
        # version comparison, nothing else), and the only trace is its init,
        # reached through forge's embedded KCL renderer:
        #   internal/toolexec/daemonruntime/forge_memory.go -> forge/cli
        #     -> forge/internal/kcloptions -> kcl-lang.io/kpm/pkg/{client,oci}
        #     -> containers/image/v5/{docker,manifest} -> docker/api/types/versions
        # Neither the AuthZ plugin middleware nor the plugin-privilege check is
        # in that package, so the vulnerable code is not in the binary.
        #
        # Scoped to these two IDs, so a new docker/docker advisory still fails the
        # gate. Expiry matches forge's own exemptions for the same two IDs
        # (forge's forge.yaml): re-check then, when forge's kpm may have moved to
        # moby/moby/v2 and both entries can go.
        exemptions:
            - id: GO-2026-4887
              reason: >-
                Moby AuthZ plugin bypass. No fixed version exists for
                github.com/docker/docker. reliant links only
                api/types/versions (string version comparison), init-only, via
                forge's kpm/containers-image chain; it runs no Docker daemon
                and no AuthZ plugin, so the vulnerable code is not in the binary.
              expires: "2026-12-31"
            - id: GO-2026-4883
              reason: >-
                Moby plugin-privilege off-by-one. No fixed version exists for
                github.com/docker/docker. Same init-only linkage of
                api/types/versions through forge's KCL renderer; reliant never
                performs plugin privilege validation.
              expires: "2026-12-31"
    gate:
        # `task ci` = forge's checks + these. forge's affected mode chooses
        # the Go tests (unit-tests), the sdk/go module's (test-mod-sdk-go) and
        # which path-gated rows run; `task ci:merge` (scripts/merge-gate.sh)
        # reads the same decision through `forge ci gate --plan --json`
        # (tools/test-affected plan). dev-docs/testing-affected.md is the
        # design: what forge selects, what reliant keeps.
        #
        # Claimed here without running the Go suite: no Go package owns these
        # and none needs to run whole for them. A Go test whose sources name
        # one still runs (affected_readers below reads claimed and ignored
        # files too). The web, electron and codegen rows judge them instead.
        affected_ignore:
            # docs, lint config and CI plumbing
            - "*.md"
            - "*.mdx"
            - "docs/**"
            - "research/**"
            - "dev-docs/**"
            - "contributing/**"
            - LICENSE
            - LICENSES.txt
            - .license-allowlist
            - .license-allowlist-npm
            - ".githooks/**"
            - ".github/**"
            - ".reliant/**"
            - .golangci.yml
            - .goreleaser.yml
            - .gitignore
            - .dockerignore
            - ".air*.toml"
            - "Dockerfile*"
            - "docker-compose*.yml"
            - "tools/protoc-gen-es/**"
            - "tmp/**"
            # data a Go test reads only if its sources name it
            - "deploy/**"
            - "config/**"
            - "scripts/**"
            - "e2e/**"
            - "docker/**"
            - "assets/**"
            - "generated/**"
            - "examples/**"
            - gen/forge_descriptor.json
            - gen/forge_service_catalog.json
            - ".forge/**"
            - bindings_generated.go
            - proto/public-api.txt
            # the codegen rows' inputs: forge generate, the docs generators
            - Taskfile.yml
            - buf.yaml
            - buf.gen.yaml
            - buf.gen.controlplane.yaml
            - buf.gen.sdk-ts.yaml
            - buf.gen.sdk-go.yaml
            # the web, electron and Node rows' inputs
            - package.json
            - package-lock.json
            - pnpm-lock.yaml
            - .nvmrc
            - .npmrc
            - "frontends/web/**"
            - "electron/**"
            - "sdk/ts/**"
        # A non-Go file selects the Go packages whose sources name it.
        affected_readers: true
        # The merge tier's reach (owner, 2026-10-24): the changed packages and
        # their direct importers, plus every transitive importer when they
        # number at most 20; past that they are listed as deferred and run in
        # the release gate (scripts/release-gate.sh, the whole suite).
        affected_reach:
            mode: direct
            transitive_cap: 20
        # sdk/go is its own module, which go.mod replaces with ./sdk/go: a
        # change there tests the root packages that link it and the module's
        # own affected tests (test-mod-sdk-go).
        affected_modules: auto
        affected_rules:
            # go.mod first: every root-locating test spells "go.mod", so the
            # reader scan would otherwise take it for a data file.
            - paths: [go.mod, go.sum, go.work, go.work.sum, tools/tools.go]
              full: true
              reason: a Go dependency or toolchain pin changed (a subset cannot judge a new version)
            - paths: [forge.yaml]
              full: true
              reason: the forge pin or forge's configuration changed
            # (A bare glob matches a base name at any depth; `**` only ends one.)
            - paths: ["proto/**", "proto-vendor/**"]
              except: ["*.proto", "*.md", public-api.txt]
              full: true
              reason: proto tooling configuration changed (it regenerates every client)
            # A .proto regenerates its Go package (and its connect package).
            - paths: ["proto/**"]
              except: ["*.md", public-api.txt]
              packages: ["./gen/{dir}", "./gen/{dir}/..."]
              reason: regenerates its Go client
            - paths: ["proto-vendor/**"]
              except: ["*.md"]
              packages: ["./gen/{dir}", "./gen/{dir}/..."]
              reason: regenerates its Go client
            # A migration reaches every DB-backed test: their test files take a
            # migrated database from internal/db's or storetest's helpers.
            - paths: ["db/migrations/**"]
              packages_importing: [./internal/db, ./internal/store/storetest]
              reason: a migration reaches the DB-backed tests
            # Tree-wide guard tests read every Go file of the module.
            # TestWalkerPackagesAreListed (tools/test-affected) holds this list
            # to the tests that walk the tree.
            - on: go-source
              packages:
                - ./internal/architecture
                - ./internal/authz
                - ./internal/buildmode
                - ./internal/db
                - ./internal/handlers/chat
                - ./internal/handlers/trigger
                - ./internal/llm/drivers
                - ./internal/temporal/temporaltest
                - ./internal/toolexec
                - ./internal/workflow
                - ./internal/workflow/runtime/activities/handlers
                - ./internal/workflow/workflowref
                - ./tools/test-affected
              reason: walks every Go file of the module
        extra_checks:
            # forge's unit-tests row, as the merge tier runs Go tests: -short,
            # cached, no -race (task test:short). In affected mode forge
            # appends `-- <packages>`; the release gate runs `task test`.
            - name: unit-tests
              replaces: unit-tests
              command: [task, test:short]
              heavy: true
            # The web lane stays reliant's (tools/test-affected): the vitest
            # files within two imports of a changed module, the tests that
            # read a changed file, and the merge tier's FULL policy
            # (dev-docs/testing-affected.md, "The web lane").
            - name: web
              lane: test
              command: [go, run, ./tools/test-affected, run, -lanes, web]
              requires: [npm]
              heavy: true
            # electron/ and the root Node manifests, and the files outside
            # electron/ its tests read (tools/test-affected also selects the
            # lane for any file an electron test names).
            - name: electron
              lane: test
              command: [task, test:electron]
              requires: [task, pnpm]
              paths:
                - "electron/**"
                - package.json
                - package-lock.json
                - pnpm-lock.yaml
                - .nvmrc
                - .npmrc
                - .github/workflows/release.yml
                - ".github/scripts/**"
                - deploy/kcl/desktop_release.k
                - deploy/kcl/lib/env.k
                - scripts/build-electron.sh
                - scripts/build-electron-prod-local.sh
                - scripts/pack-desktop.js
                - scripts/wait-and-start
                - internal/auth/daemon_file.go
                - internal/auth/oauthcallback/oauthcallback.go
                - "internal/toolexec/daemonstate/**"
                - frontends/web/src/lib/pkce.ts
            # The docs generators are a no-op (task generate:docs:check), when
            # the diff reaches one. It rewrites what it regenerates.
            - name: docs-generate
              command: [task, generate:docs:check]
              requires: [task, python3]
              heavy: true
              mutates_tree: true
              paths:
                - "tools/docgen/**"
                - scripts/generate-mintlify-reference.py
                - go.mod
                - go.sum
                - Taskfile.yml
                - config/shortcuts.yaml
                - internal/workflow/scenario/types.go
                - "internal/workflow/builtin/presets/*.yaml"
                - "docs/data/releases/**"
                - "generated/docs-source/**"
                - "docs/reference/*.mdx"
                - docs/changelog.mdx
                - frontends/web/src/store/shortcutsData.generated.ts
                - internal/workflow/runtime/schema/field_descriptions.go
                - internal/skills/catalog/builtin/workflow-builder/SKILL.md
                # a .proto regenerates the gen/ packages the generators compile
                - "proto/**"
              paths_go_closure: ["./tools/docgen/..."]
            # The forge demo bundle's build: its guard plugin fails on a
            # Reliant-only module in the bundle. Which change reaches the
            # bundle is the demo import graph's to say (tools/test-affected).
            - name: web-demo
              lane: test
              command: [go, run, ./tools/test-affected, run, -lanes, web-demo]
              requires: [npm]
              heavy: true
            # The renderer's release bundle: what vitest and tsc -b cannot
            # judge, a dependency the bundler refuses (reliant#2850). Its build
            # config, its HTML entry, and every reason the web lane runs whole
            # (tools/test-affected decides).
            - name: web-build
              lane: test
              command: [go, run, ./tools/test-affected, run, -lanes, web-build]
              requires: [pnpm]
              heavy: true
            # A migration added on a branch is versioned above origin/main's
            # newest, or reliant's migrator refuses to start on it (reliant#1399).
            - name: migration-order
              command: [go, run, ./tools/test-affected, migration-order]
              paths: ["db/migrations/**"]
            # forge's own lint row for frontends/web, taken over unchanged.
            # Since forge#2802 a directory several frontends share (desktop,
            # forge-demo, web) gets one row, named for the first frontend
            # forge lists: lint-forge-demo.
            - name: lint-web
              replaces: lint-forge-demo
              dir: frontends/web
              command: [npm, run, lint]
              requires: [npm]
            # forge.yaml's forge_version and go.mod's forge require are one pin.
            - name: pin-coherence
              command: [scripts/check-forge-generate.sh, --pins-only]
            - name: pin-ancestry
              command: [scripts/check-pin-ancestry.sh]
              cache: false
            - name: npm-licenses
              command: [scripts/check-npm-licenses.sh, frontends/web]
              requires: [npm]
            - name: release-config
              command: [node, .github/scripts/sync-release-config.mjs, --check]
              requires: [node]
            - name: gh-scripts
              command: [sh, -c, "node --test .github/scripts/*.test.mjs"]
              requires: [node]
            - name: no-binaries
              command: [.githooks/check-binary-files.sh, --range, origin/main, HEAD]
