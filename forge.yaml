# Forge project manifest — see https://github.com/reliant-labs/forge.
# This file is minimal on purpose. Features, the database, the frontends and
# the project kind are derived from what exists in the repo (db/migrations,
# frontends/, deploy/kcl, internal/operators, ...), not configured here.
# Add a section (ci, lint, contracts, ...) only to override a default
# (`forge skill load architecture` documents the schema;
# `forge skill list` indexes the per-topic skills, e.g. `auth`).
#
# reliant adopts forge in place, one concern per PR
# (research/forge-migration/PLAN.md). Every proto service is a forge handler
# package under internal/handlers/<svc> (P3b, research/forge-migration/
# 06-p3b-recipe.md), for which forge scaffolds and keeps a generated mock,
# test harness and dashboard. Every server role is a root of the composition
# graph (research/forge-migration/09-roots-plan.md): `reliant server api`,
# `worker` and `gateway` are the //forge:roots in internal/app, built from
# compose.go and run under cmd/reliant/cmd/serve.go's process policy, and
# `forge lint --graph` gates that every node is reached by one. A contract
# package an internal/app provider builds by hand is `//forge:provided`; one
# another package, the CLI or the daemon builds is `//forge:not-a-component`,
# naming who. Beyond that, `forge generate` projects the
# contract mocks/decorators, the descriptor, the open-procedure set and the
# ORM in internal/store (database.orm below), and runs generate.hooks below:
# the compiled-code generators forge does not own. Taskfile.yml is the
# entrypoint (`task --list`). After
# changing a proto, a contract.go interface, a migration or a hook's input,
# run `task generate:check` (forge generate at forge_version below, which
# must equal go.mod's) and commit what it writes: the generated mocks assert
# their interface at compile time, and gen/forge_descriptor.json mirrors the
# protos. `forge ci verify-generated` (in `task ci`) and CI fail a change that
# skipped it.

name: reliant
module_path: github.com/reliant-labs/reliant
forge_version: v1.0.3
harness: reliant
config:
    # Every process setting is typed config (proto/reliant/config/v1, read through
    # pkg/config). A direct environment read outside pkg/config fails lint;
    # one that is not configuration takes a scoped //nolint:forbidigo.
    enforce_typed_access: error
lint:
    rules:
        # P7b Z: activity declarations are complete. Enforce them now rather
        # than waiting for forge's v0.1.48 rollout default.
        forgeconv-activity-declared: error
        # forge #993's tracing rules ship hard-ERROR, and reliant has 106
        # findings at the pin that introduced them (61 log-without-ctx, 18
        # raw-http-client, 18 contract-uninstrumented, 9 raw-sql-open). Warn
        # while that adoption is tracked separately; each goes back to error
        # (delete the entry) once its findings are fixed. log-without-ctx is
        # done: `forge lint --tracing` rewrote every call, including the
        # internal/logging helpers listed under tracing.log_wrappers below.
        # raw-http-client is done: plain outbound HTTP goes through
        # observe.NewHTTPClient, Connect clients through observe.NewClientStack.
        # raw-sql-open is done: every pool opens through dbtrace (or
        # serverkit.OpenDB); the test-only provisioning pools carry reasons.
        # contract-uninstrumented is done: every construction outside
        # compose.go calls the package's generated NewInstrumented.
        # P7a (research/forge-migration/11-svcerr-plan.md §4 "Z"): every
        # handler error goes through svcerr, so a per-service Connect-code
        # mapping helper or a hand-built connect.NewError in internal/handlers
        # fails the build. Both ship at warn; reliant has no findings left.
        forgeconv-no-handler-error-mapping: error
        forgeconv-handler-connect-error: error
        # P7b A4 (research/forge-migration/14-p7b-lint-adoption-plan.md §2.2):
        # every handler file is under lint.handler_file_max_loc (1000), so a
        # handler file that grows past it fails the build. Split it into
        # rpc_<family>.go siblings rather than raising the limit.
        forgeconv-handler-file-size: error
        # access_tokens' scopes and resource-kind CHECKs are declared
        # `forge:closed-set accesstoken.*`. The rule warns until v0.1.48, so a
        # forge bump that grew AllScopes (billing:read, forge #1566) passed the
        # merge gate and failed the release gate's DB test instead. At error,
        # the bump's own PR fails `forge lint --closed-sets` and is fixed with
        # `task db:migration` + `forge db migration new --closed-set <constraint>`.
        forge-closed-set: error
        # P7b A5 (research/forge-migration/14-p7b-lint-adoption-plan.md §2.3,
        # §2.4): no component reads the process environment, no component's
        # Deps carries a naked scalar (each takes its config block), and every
        # optional dep is nil-checked where it is dereferenced. reliant has no
        # findings left; at error a regression fails `forge lint`.
        forgeconv-no-getenv: error
        forge-config-deps: error
        forge-optional-deps-guard: error
    tracing:
        # internal/logging's ctx-less helpers write through slog without the
        # request's context, so their lines carry no trace_id. Listing them
        # makes forge-tracing-log-without-ctx flag and rewrite their calls to
        # the logging.*Context twins, exactly as it does slog's own.
        log_wrappers:
            - call: github.com/reliant-labs/reliant/internal/logging.Info
            - call: github.com/reliant-labs/reliant/internal/logging.Debug
            - call: github.com/reliant-labs/reliant/internal/logging.Warn
            - call: github.com/reliant-labs/reliant/internal/logging.Error
            - call: github.com/reliant-labs/reliant/internal/logging.Trace
            - call: github.com/reliant-labs/reliant/internal/logging.Log
database:
    # Prod's Postgres major (Cloud SQL reliant-pg is POSTGRES_16). forge's
    # pgtest boots its embedded test server at this major, so a test run
    # proves the SQL on the server it ships to, and checks a
    # FORGE_TEST_POSTGRES_URL server's major against it.
    postgres_version: "16"
    migration_safety:
        # Every migration after the baseline says whether the previous
        # release keeps working on the schema it leaves:
        # `-- forge:backward-compatible — <why>` or
        # `-- forge:breaks-rollback <why>`. `forge lint --migration-safety`
        # fails one that says neither, or gives no reason
        # (internal/db/SCHEMA.md).
        require_compat_declaration: true
    orm:
        # The generated data layer (entities, <Entity>Store, the _repo_ext.go
        # seams) lands in internal/store, beside the hand-owned internal/db
        # Repository, whose names (Chat, Message, Repo, …) it would otherwise
        # collide with. Every statement runs here: the hand Repository's SQL
        # lives in its _repo_ext.go files (P5b,
        # research/forge-migration/08-p5b-spike.md; rules in
        # internal/db/SCHEMA.md).
        package: internal/store
generate:
    # The compiled-code generators forge does not own (P8 D-P8-4). `forge
    # generate` runs them after its own buf step (their inputs need gen/) and
    # before the go mod tidy + build that validate the tree, with go.mod's
    # pinned buf and protoc plugins on PATH; so `forge ci verify-generated`
    # is their drift gate too. The docs generators are not here: they are
    # docs, too slow for every generate, and need python3 (`task generate:docs`).
    hooks:
        # The control-plane clients (Go + TS) from proto-vendor/controlplane/,
        # control-plane's exported public contract. Both dirs are replaced
        # wholesale, only after buf succeeds.
        - name: controlplane-client
          command: [scripts/proto-generate-atomic.sh, buf.gen.controlplane.yaml, gen/controlplane, frontends/web/src/gen/controlplane]
          writes: [gen/controlplane, frontends/web/src/gen/controlplane]
        - name: yaml-bindings
          command: [go, generate, ./internal/workflow/yaml]
          writes: [internal/workflow/yaml/bindings_generated.go]
        - name: tool-catalog
          command: [go, generate, ./internal/llm/tools]
          writes: [internal/llm/tools/toolcatalog/catalog_generated.go]
        - name: manifest-schema
          command: [go, generate, ./internal/integrations/manifest/schema]
          writes:
            - internal/integrations/manifest/schema/action.schema.json
            - internal/integrations/manifest/schema/event.schema.json
            - internal/integrations/manifest/schema/manifest.schema.json
        # Webhook event typing: parser projections + catalog event fragments,
        # from the projection specs and the pinned upstream schema.
        - name: integrations
          command: [go, run, ./tools/integrationgen]
          writes:
            - internal/integrations/webhook/github/zz_projection_generated.go
            - internal/integrations/catalog/github/events
            - internal/integrations/catalog/github/schemas
            - internal/integrations/catalog/github/manifest.yaml
upgrade:
    # What `forge project upgrade` does beyond forge's own codemods. The proto
    # vendored from control-plane (proto-vendor/controlplane/) is what a forge
    # bump most often leaves stale. control-plane's check-vendored-proto.sh
    # writes the lag report; it is control-plane's script and a control-plane
    # checkout, so reliant has none until one is run:
    #   CONTROL_PLANE_DIR=../control-plane ../control-plane/scripts/check-vendored-proto.sh \
    #     --reliant . --report tmp/ci/reliant-vendored-proto.json
    # (the pin bot does exactly that). The report names its own CONTROL_PLANE_DIR
    # (revendor.env), which upgrade exports to the command; with no report there
    # is nothing to re-vendor and upgrade says so.
    vendored_contracts:
        - name: controlplane
          report: tmp/ci/reliant-vendored-proto.json
          schema: reliant-vendored-proto/v1
          env_path: revendor.env
          commands:
              - [task, "contract:controlplane:sync"]
ci:
    gate:
        # `task ci` = forge's checks + these. Files no Go test reads.
        affected_ignore: ["*.md", "docs/**", "research/**", "dev-docs/**"]
        extra_checks:
            # tools/test-affected in place of forge's unit-tests: it selects
            # web, electron and codegen lanes too, and maps a migration to the
            # DB-backed packages (forge's affected mode is Go-only and runs the
            # whole suite on any non-Go change). Each lane is its own row.
            - name: test-affected
              replaces: unit-tests
              command: [go, run, ./tools/test-affected, run, -lanes, go]
              heavy: true
            - name: web
              lane: test
              command: [go, run, ./tools/test-affected, run, -lanes, web]
              requires: [npm]
              heavy: true
            - name: electron
              lane: test
              command: [go, run, ./tools/test-affected, run, -lanes, electron]
              requires: [npm]
            # The docs generators are a no-op (task generate:docs:check), when
            # the diff reaches one. It rewrites what it regenerates.
            - name: docs-generate
              command: [go, run, ./tools/test-affected, run, -lanes, docs-generate]
              requires: [task, python3]
              heavy: true
              mutates_tree: true
            - name: lint-web
              dir: frontends/web
              command: [npm, run, lint]
              requires: [npm]
            # forge.yaml's forge_version and go.mod's forge require are one pin.
            - name: pin-coherence
              command: [scripts/check-forge-generate.sh, --pins-only]
            - name: pin-ancestry
              command: [scripts/check-pin-ancestry.sh]
              cache: false
            - name: npm-licenses
              command: [scripts/check-npm-licenses.sh, frontends/web]
              requires: [npm]
            - name: release-config
              command: [node, .github/scripts/sync-release-config.mjs, --check]
              requires: [node]
            - name: gh-scripts
              command: [sh, -c, "node --test .github/scripts/*.test.mjs"]
              requires: [node]
            - name: no-binaries
              command: [.githooks/check-binary-files-ci.sh, origin/main, HEAD]
