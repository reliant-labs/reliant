# Air config for the daemon gateway (`reliant server gateway`) under
# `forge env up dev` in THIS repo (deploy/kcl/dev/main.k binds
# daemon-gateway to it). Same shape as .air.api.toml: its own tmp dir, and an
# atomic build (go build -o .tmp && mv) with stop_on_error=false, so a broken
# mid-edit tree never takes the running gateway down. Env comes from forge's
# host phase, not from here.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/air-gateway"

[build]
  bin = "./tmp/air-gateway/reliant"
  args_bin = ["server", "gateway"]
  cmd = "CGO_ENABLED=0 go build -buildvcs=false -o ./tmp/air-gateway/reliant.tmp ./cmd/reliant && mv ./tmp/air-gateway/reliant.tmp ./tmp/air-gateway/reliant"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontends", "mobile", "dist", ".claude_plan", "test", "electron", "node_modules", "e2e", ".reliant", "examples", "data", ".git", "scripts", "docs"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  include_ext = ["go", "yaml"]
  include_file = []
  kill_delay = "5s"
  log = "tmp/air-gateway/build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
