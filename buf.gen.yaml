# buf.gen.yaml - Code generation configuration
#
# `forge generate` runs it (`task generate:forge`, or `task generate`), not a
# bare `buf generate`. forge and the Taskfile supply what this file cannot
# declare: go.mod's pinned buf, GOWORK=off and go.mod's own Go toolchain.
# CONTRIBUTING.md ("Code generation") has the why.
#
# EVERY plugin is LOCAL and version-pinned by a lockfile in this repo:
#
#   protoc-gen-go, protoc-gen-connect-go
#       `go tool` directives in go.mod, so the version is the
#       google.golang.org/protobuf / connectrpc.com/connect the code links
#       against, and the binary is built by the module's toolchain.
#   protoc-gen-es
#       tools/protoc-gen-es/package.json (+ package-lock.json). The alias
#       directory names the version, so this path is the pin.
#
# They used to be `remote:` plugins on the Buf Schema Registry, which
# rate-limits (`resource_exhausted: too many requests`) and, unpinned, rewrote
# committed code whenever upstream released. internal/buildmode/
# buf_plugin_pins_test.go fails on a remote plugin, on a bare PATH lookup, and
# on two templates writing the same directory at different versions.
#
# To bump a plugin: bump it in go.mod or tools/protoc-gen-es (and every
# template path naming it), run `task generate`, and commit the regenerated
# code in the same change. `task generate:check` (run by the merge gate when a
# change reaches a forge input, and by the release gate) fails on any leftover
# diff.
version: v2
managed:
  enabled: false
# proto/forge/v1/forge.proto and proto/buf/validate/validate.proto are
# annotation vocabularies forge vendors: the (forge.v1.method) options and
# protovalidate's (buf.validate.field) rules, copies of the files forge embeds;
# `forge lint --vendored-protos` reports drift. They are imports here, never
# targets: their Go homes are github.com/reliant-labs/forge/pkg/forgepb and
# buf.build/gen/go/bufbuild/protovalidate (which the generated code imports),
# and a second Go copy would register the same file twice and panic at init.
# frontends/web/src/gen still gets both, through include_imports.
inputs:
  - directory: proto
    exclude_paths:
      - proto/forge/v1
      - proto/buf/validate
# `strategy: all` on every plugin: buf runs each plugin ONCE over every file,
# instead of once per proto directory (buf's default, `directory`), all of
# them at once up to NumCPU. Each `go tool` invocation is a go process plus
# the plugin, each a Go runtime with ~GOMAXPROCS threads, and node has ~10+;
# fanned out per directory on a 31-CPU machine that crossed the daemon's
# per-command cgroup pids.max (2000, which counts threads) and failed with
# `pthread_create: Resource temporarily unavailable`. The output is
# byte-identical: these plugins write one file per proto file either way.
# internal/buildmode/buf_plugin_pins_test.go fails on a plugin without it.
plugins:
  # Generate Go protobuf code. Two Go homes, one registration each:
  #
  #   - gen/                the app's own protos, exactly as before.
  #   - sdk/go/gen/         the PUBLIC protos (proto/public-api.txt and the
  #                         files they import). They are generated once, into
  #                         the SDK module, and the app imports them from there:
  #                         the same file registered by two Go packages panics
  #                         at init, so the app must not carry a second copy.
  #
  # paths=import + module= place a file by the import path it is generated
  # under, so the M lines below are what move a file into the SDK; the protos
  # keep their go_package, which forge reads to name the app's own packages.
  # The public files land in sdk/go/gen, byte-identical to what
  # buf.gen.sdk-go.yaml writes there (same plugin, same M lines); that template
  # also writes the SDK's filtered Connect clients.
  #
  # The app links the SDK at the version go.mod pins, NOT this tree's
  # sdk/go: a change to a public proto reaches the app only when the pin moves
  # (sdk/go/README.md, "Changing the SDK"). gen/reliant/v1/sdk_alias.pb.go
  # (hook sdk-aliases in forge.yaml) re-exports the pinned SDK package under the
  # old import path. internal/buildmode's sdk_public_api_test.go keeps this
  # list, public-api.txt and the generated tree in step.
  - local: [go, tool, protoc-gen-go]
    strategy: all
    out: .
    opt:
      - paths=import
      - module=github.com/reliant-labs/reliant
      - Mreliant/v1/common.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/worktree.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/chat.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/run.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/trigger.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/approval.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/question.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1

  # Generate Connect-Go service code. Matches the connectrpc.com/connect
  # runtime in go.mod by construction: it is the same module. The app gets
  # every service, whole (handlers need every rpc); the types it names for the
  # public files come from the SDK package through the same M mapping.
  - local: [go, tool, protoc-gen-connect-go]
    strategy: all
    out: gen
    opt:
      - paths=source_relative
      - Mreliant/v1/common.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/worktree.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/chat.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/run.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/trigger.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/approval.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1
      - Mreliant/v1/question.proto=github.com/reliant-labs/reliant/sdk/go/gen/reliant/v1;reliantv1

  # Generate TypeScript protobuf code for web
  - local: [node, tools/protoc-gen-es/node_modules/protoc-gen-es-v2.15.0/bin/protoc-gen-es]
    strategy: all
    out: frontends/web/src/gen
    include_imports: true
    opt:
      - target=ts
      - ts_nocheck=true
