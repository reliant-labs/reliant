# buf.gen.yaml - Code generation configuration
#
# Run it through `make proto-generate`, not a bare `buf generate`. The Makefile
# supplies what this file cannot declare: the pinned buf binary, GOWORK=off and
# go.mod's own Go toolchain. CONTRIBUTING.md ("Code generation") has the why.
#
# EVERY plugin is LOCAL and version-pinned by a lockfile in this repo:
#
#   protoc-gen-go, protoc-gen-connect-go
#       `go tool` directives in go.mod, so the version is the
#       google.golang.org/protobuf / connectrpc.com/connect the code links
#       against, and the binary is built by the module's toolchain.
#   protoc-gen-es
#       tools/protoc-gen-es/package.json (+ package-lock.json). The alias
#       directory names the version, so this path is the pin.
#
# They used to be `remote:` plugins on the Buf Schema Registry, which
# rate-limits (`resource_exhausted: too many requests`) and, unpinned, rewrote
# committed code whenever upstream released. internal/buildmode/
# buf_plugin_pins_test.go fails on a remote plugin, on a bare PATH lookup, and
# on two templates writing the same directory at different versions.
#
# To bump a plugin: bump it in go.mod or tools/protoc-gen-es (and every
# template path naming it), run `make generate-all`, and commit the regenerated
# code in the same change. CI's "Generated code is up to date" job fails on any
# leftover diff.
version: v2
managed:
  enabled: false
plugins:
  # Generate Go protobuf code
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt:
      - paths=source_relative

  # Generate Connect-Go service code. Matches the connectrpc.com/connect
  # runtime in go.mod by construction: it is the same module.
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative

  # Generate TypeScript protobuf code for web
  - local: [node, tools/protoc-gen-es/node_modules/protoc-gen-es-v2.15.0/bin/protoc-gen-es]
    out: web/src/gen
    include_imports: true
    opt:
      - target=ts
      - ts_nocheck=true
