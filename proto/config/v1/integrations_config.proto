syntax = "proto3";

package config.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/config/v1;configv1";

// IntegrationsConfig is how a server role reaches the outside world on a
// user's behalf: the credential vault's key, the deployment's public URL, and
// the deployment-level secrets of the integrations that push events to it,
// and each integration's OAuth client. The API server and the worker read it
// from ServerProcessConfig, so they agree on which integrations deliver
// events and on how a webhook's URL reads. The rules every config here
// follows are in config.proto's header.
message IntegrationsConfig {
  // This server's externally reachable base URL: where a user points a
  // third-party MCP client, the base of the OAuth discovery document, and the
  // URL webhook senders are told to call (Twilio signs it). Unset: webhook
  // URLs are reported as bare paths and Twilio is not offered.
  string public_url = 1 [(forge.v1.config) = {
    env_var: "PUBLIC_URL"
    description: "Externally reachable base URL of this deployment"
  }];

  // The key-encryption key of the credential vault, as v1:<base64>. Hosted
  // deployments must set it; a self-hosted one without it generates and
  // keeps <data dir>/vault.key.
  string vault_key = 2 [(forge.v1.config) = {
    env_var: "RELIANT_VAULT_KEY"
    sensitive: true
    optional: true
    description: "Credential vault key (v1:<base64>); required when hosted"
  }];

  // Slack's signing secret; unset, Slack events are not received.
  string slack_signing_secret = 3 [(forge.v1.config) = {
    env_var: "RELIANT_SLACK_SIGNING_SECRET"
    sensitive: true
    optional: true
    description: "Slack signing secret (unset: Slack events are not received)"
  }];

  // The GitHub App's webhook secret; unset, GitHub events are not received
  // and GitHub triggers are refused.
  string github_webhook_secret = 4 [(forge.v1.config) = {
    env_var: "RELIANT_GITHUB_WEBHOOK_SECRET"
    sensitive: true
    optional: true
    description: "GitHub App webhook secret (unset: GitHub events are not received)"
  }];

  // The GitHub App's slug, which an event's origin is matched against.
  string github_app_slug = 5 [(forge.v1.config) = {
    env_var: "RELIANT_GITHUB_APP_SLUG"
    description: "GitHub App slug"
  }];

  // Who the App's bot is, as GitHub names it in a webhook's sender: its
  // numeric user id, else its login. Unset: the production App's bot.
  int64 github_bot_user_id = 6 [
    (forge.v1.config) = {
      env_var: "RELIANT_GITHUB_BOT_USER_ID"
      description: "GitHub App bot's numeric user id (default: the production App's)"
    },
    (buf.validate.field).int64.gte = 0
  ];
  string github_bot_login = 7 [(forge.v1.config) = {
    env_var: "RELIANT_GITHUB_BOT_LOGIN"
    description: "GitHub App bot's login, used when no user id is set"
  }];

  // The secret of the test integration, which only an e2e stack registers.
  string test_integration_secret = 8 [(forge.v1.config) = {
    env_var: "RELIANT_TEST_INTEGRATION_SECRET"
    sensitive: true
    optional: true
    description: "Test integration secret (e2e stacks only)"
  }];

  // Each integration's OAuth client: RELIANT_OAUTH_<ID>_CLIENT_ID and
  // RELIANT_OAUTH_<ID>_CLIENT_SECRET, keyed by the integration's id in upper
  // case (connections.OAuthClientEnv). The keys are the integration catalog's,
  // an open set, so they are env families rather than fields. The prefix is
  // owned: any other RELIANT_OAUTH_* variable (a misspelt suffix) fails the
  // load. An integration with neither is not offered.
  map<string, string> oauth_client_ids = 9 [(forge.v1.config) = {
    env_prefix: "RELIANT_OAUTH_"
    env_suffix: "_CLIENT_ID"
    description: "Integration OAuth client ids, RELIANT_OAUTH_<ID>_CLIENT_ID"
  }];
  map<string, string> oauth_client_secrets = 10 [(forge.v1.config) = {
    env_prefix: "RELIANT_OAUTH_"
    env_suffix: "_CLIENT_SECRET"
    sensitive: true
    description: "Integration OAuth client secrets, RELIANT_OAUTH_<ID>_CLIENT_SECRET"
  }];
}
