syntax = "proto3";

package config.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/reliant/gen/config/v1;configv1";

// LLMConfig is how the API server and the worker call models: where the
// Reliant LLM gateway and Vertex AI are, the stream guards' deadlines, and
// two debug switches. The rules every config here follows are in
// config.proto's header.
message LLMConfig {
  // The Reliant LLM gateway (control-plane's LLM proxy). Unset is a
  // misconfigured server: it falls back to loopback, never to production.
  string reliant_api_base_url = 1 [(forge.v1.config) = {
    env_var: "RELIANT_API_BASE_URL"
    description: "Reliant LLM gateway base URL"
  }];

  string vertexai_project = 2 [(forge.v1.config) = {
    env_var: "VERTEXAI_PROJECT"
    description: "Vertex AI project (required to call Vertex AI models)"
  }];
  string vertexai_location = 3 [(forge.v1.config) = {
    env_var: "VERTEXAI_LOCATION"
    default_value: "us-central1"
    description: "Vertex AI region"
  }];

  // The stream guards (internal/llm transport.go, stream_stall.go). Each is
  // positive; the defaults are argued from measured streams there.
  google.protobuf.Duration stream_idle_timeout = 4 [
    (forge.v1.config) = {
      env_var: "RELIANT_LLM_STREAM_IDLE_TIMEOUT"
      default_value: "90s"
      description: "Cut a stream that sends no bytes for this long"
    },
    (buf.validate.field).duration.gt = {}
  ];
  google.protobuf.Duration stream_content_stall_timeout = 5 [
    (forge.v1.config) = {
      env_var: "RELIANT_LLM_STREAM_CONTENT_STALL_TIMEOUT"
      default_value: "5m"
      description: "Cut a stream that sends only keepalives before any content for this long"
    },
    (buf.validate.field).duration.gt = {}
  ];
  google.protobuf.Duration stream_progress_timeout = 6 [
    (forge.v1.config) = {
      env_var: "RELIANT_LLM_STREAM_PROGRESS_TIMEOUT"
      default_value: "10m"
      description: "Cut a stream that produces no driver event for this long"
    },
    (buf.validate.field).duration.gt = {}
  ];
  // Unset: derived per request from its output budget.
  google.protobuf.Duration stream_mid_block_stall_timeout = 7 [
    (forge.v1.config) = {
      env_var: "RELIANT_LLM_STREAM_MID_BLOCK_STALL_TIMEOUT"
      description: "Pin how long a content block may stay open on keepalives (default: derived from the output budget)"
    },
    (buf.validate.field).duration.gt = {}
  ];

  bool debug_openai_responses_input = 8 [(forge.v1.config) = {
    env_var: "RELIANT_DEBUG_OPENAI_RESPONSES_INPUT"
    description: "Log each OpenAI Responses input item"
  }];
  bool debug_openai_tool_schemas = 9 [(forge.v1.config) = {
    env_var: "RELIANT_DEBUG_OPENAI_TOOL_SCHEMAS"
    description: "Log each OpenAI function tool schema as sent"
  }];
}
