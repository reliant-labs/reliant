syntax = "proto3";

package config.v1;

import "forge/v1/forge.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/reliant/gen/config/v1;configv1";

// Blocks the server roles (`reliant server api|worker|gateway`) compose: each
// is one concern every role that composes it reads the same way. A role's own
// knobs — and the ones whose default differs per role, like HEALTH_PORT — are
// leaves on its own message (api_server_config.proto, worker_config.proto,
// gateway_config.proto). The rules every config here follows are in
// config.proto's header.

// DatabaseConfig is the Postgres a process connects to (each server role, and
// the `reliant db migrate` commands), and how it sizes its pool and waits on
// it.
message DatabaseConfig {
  // The connection URL. A secret: it carries the password, so it has no flag
  // (a flag's value is in the shell history and in `ps`).
  string url = 1 [(forge.v1.config) = {
    env_var: "DATABASE_URL"
    sensitive: true
    required: true
    description: "Postgres connection URL"
  }];

  // A session-capable URL for the same database, for session-scoped work
  // (advisory locks, migrations): set it when url is a transaction-pooling
  // PgBouncer. Unset: url already has session semantics.
  string direct_url = 2 [(forge.v1.config) = {
    env_var: "DATABASE_DIRECT_URL"
    sensitive: true
    optional: true
    description: "Session-capable Postgres URL for session-scoped work, when DATABASE_URL is a transaction pooler"
  }];

  // The only driver is postgres; the knob remains because deployments set it.
  string driver = 3 [(forge.v1.config) = {
    env_var: "DATABASE_DRIVER"
    flag: "db-driver"
    default_value: "postgres"
    allowed_values: ["postgres"]
    description: "Database driver (postgres)"
  }];

  // The connection pool's size. Dev caps both low: its Postgres is shared by
  // every parallel stack on the machine.
  int32 max_open_conns = 4 [(forge.v1.config) = {
    env_var: "RELIANT_DB_MAX_OPEN_CONNS"
    default_value: "25"
    description: "Most open database connections"
  }];
  int32 max_idle_conns = 5 [(forge.v1.config) = {
    env_var: "RELIANT_DB_MAX_IDLE_CONNS"
    default_value: "10"
    description: "Most idle database connections kept open"
  }];

  // How long the startup ping keeps retrying a database that is not up yet.
  // It must stay inside the deployment's startup probe window. Unset:
  // forge serverkit's default.
  google.protobuf.Duration connect_timeout = 6 [(forge.v1.config) = {
    env_var: "DB_CONNECT_TIMEOUT"
    description: "How long the startup ping retries a database that is not up yet"
  }];

  // How long a process that waits for the schema (the worker, the gateway)
  // waits for the API server or `reliant db migrate up` to apply it.
  int32 schema_wait_seconds = 7 [(forge.v1.config) = {
    env_var: "RELIANT_DB_SCHEMA_WAIT_SECONDS"
    default_value: "300"
    description: "Seconds to wait for the schema to be migrated"
  }];
}

// NatsConfig is the NATS server a server role connects to: daemon routing,
// and the streaming hub's transport.
message NatsConfig {
  // A secret: deployments embed credentials in it (nats://user:pass@host).
  string url = 1 [(forge.v1.config) = {
    env_var: "NATS_URL"
    sensitive: true
    required: true
    description: "NATS server URL"
  }];

  // Credentials for a NATS server that takes them out of band. Used only
  // when both are set.
  string user = 2 [(forge.v1.config) = {
    env_var: "NATS_USER"
    description: "NATS user name (used with NATS_PASSWORD)"
  }];
  string password = 3 [(forge.v1.config) = {
    env_var: "NATS_PASSWORD"
    sensitive: true
    optional: true
    description: "NATS password (used with NATS_USER)"
  }];
}

// TemporalConfig is the Temporal frontend the API server and worker use.
message TemporalConfig {
  string host = 1 [(forge.v1.config) = {
    env_var: "TEMPORAL_HOST"
    flag: "temporal-host"
    default_value: "localhost"
    description: "Temporal server host"
  }];
  int32 port = 2 [(forge.v1.config) = {
    env_var: "TEMPORAL_PORT"
    flag: "temporal-port"
    default_value: "7233"
    description: "Temporal server port"
  }];
  string namespace = 3 [(forge.v1.config) = {
    env_var: "TEMPORAL_NAMESPACE"
    flag: "temporal-namespace"
    default_value: "reliant"
    description: "Temporal namespace"
  }];
}

// ServerTLSConfig is how a server role that terminates TLS itself (the API
// server, the daemon gateway) serves it.
message ServerTLSConfig {
  string cert_file = 1 [(forge.v1.config) = {
    env_var: "TLS_CERT_FILE"
    flag: "tls-cert"
    description: "TLS certificate file path"
  }];
  string key_file = 2 [(forge.v1.config) = {
    env_var: "TLS_KEY_FILE"
    flag: "tls-key"
    description: "TLS key file path"
  }];
  bool disable = 3 [(forge.v1.config) = {
    env_var: "DISABLE_TLS"
    flag: "disable-tls"
    description: "Disable TLS (use plaintext HTTP)"
  }];
}

// DrainConfig is a server's rollout drain budget. control-plane sets both on
// every server workload, and forge derives the pod's
// terminationGracePeriodSeconds from them, so a process that ignores them
// cannot stay inside the grace period it was given. Both follow the rule
// forge's grace-period arithmetic applies to them (pkg/deploy drainSeconds):
// zero is the default and negative is none. Forge's arithmetic also reads a
// bare count of seconds ("30"); this loader takes a Go duration only, so a
// bare number stops the server at load instead of disagreeing with forge.
message DrainConfig {
  // How long the process keeps serving after readiness flips, so load
  // balancers see the failing probe first. Negative is no pause.
  google.protobuf.Duration pre_stop_delay = 1 [(forge.v1.config) = {
    env_var: "PRE_STOP_DELAY"
    default_value: "5s"
    description: "How long to keep serving after readiness flips at shutdown (negative: no pause)"
  }];

  // Bounds everything after the pre-stop pause.
  google.protobuf.Duration shutdown_timeout = 2 [(forge.v1.config) = {
    env_var: "SHUTDOWN_TIMEOUT"
    default_value: "30s"
    description: "Budget for graceful shutdown after the pre-stop pause"
  }];
}
