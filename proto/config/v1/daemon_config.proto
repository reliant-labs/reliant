syntax = "proto3";

package config.v1;

import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/config/v1;configv1";

// The `reliant daemon ...` commands' configs. Each loads alongside the root
// ReliantConfig (config.proto, whose header has the rules every config here
// follows).
//
// The daemon runs on a user's machine (spawned by Electron or a person at a
// terminal) or in a workspace pod (the control-plane workspace operator sets
// its env, in Go: control-plane internal/operators/workspace). Either way its
// env names are a contract with a setter outside this repo, so they keep their
// exact spelling.
//
// Every daemon command that touches a daemon's data directory — start, status,
// stop, logs — composes DaemonInstanceConfig, so they cannot disagree about
// which instance they mean. Command configs do not nest (a config bound to
// ["daemon"] would not reach `daemon start`), which is why each command binds
// its own message.

// DaemonInstanceConfig names a daemon instance: the (account, workspace) half
// of its key, and the data-directory override that bypasses deriving one.
// The origin half is the server URL the command resolves.
message DaemonInstanceConfig {
  // Unset: the instance's own directory under ~/.reliant/instances, derived
  // from the instance key. Containers set it to the mounted volume
  // (docker-compose.yml, the workspace operator), where derivation would put
  // the daemon's state on the ephemeral filesystem.
  string data_dir = 1 [(forge.v1.config) = {
    env_var: "DAEMON_DATA_DIR"
    flag: "data-dir"
    description: "Data directory (default: this instance's directory under ~/.reliant/instances)"
  }];

  // Unset: the account of the stored credential, else the default instance.
  string account = 2 [(forge.v1.config) = {
    env_var: "RELIANT_INSTANCE_ACCOUNT"
    flag: "account"
    description: "Account (Supabase subject) this daemon runs as; selects among several accounts on one server"
  }];

  // Unset: the git worktree root of the current directory, else the current
  // directory. Containers and CI, where the working directory means nothing,
  // name it.
  string workspace = 3 [(forge.v1.config) = {
    env_var: "RELIANT_INSTANCE_WORKSPACE"
    flag: "workspace"
    description: "Workspace this daemon serves (defaults to the git worktree root of the current directory)"
  }];
}

// DaemonConfig is the `reliant daemon start` process's own config: the tools
// daemon itself.
message DaemonConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["daemon", "start"]
  };

  DaemonInstanceConfig instance = 1;

  // Where the daemon dials. Unset: the gateway its credential names, else a
  // gateway on localhost:gateway_port.
  string gateway_url = 2 [(forge.v1.config) = {
    env_var: "DAEMON_GRPC_URL"
    flag: "grpc-url"
    description: "Daemon gateway URL to dial (default: the credential's gateway, else localhost on --port)"
  }];

  // The local daemon gateway's daemon port: the port `reliant server gateway`
  // listens for daemons on, under the same TOOLS_DAEMON_PORT the gateway
  // reads (GatewayConfig). Electron and scripts/dev.sh export it to both. It
  // is dialled only when no gateway URL is known. Not the port THIS daemon
  // listens on: that is listen_port.
  int32 gateway_port = 3 [(forge.v1.config) = {
    env_var: "TOOLS_DAEMON_PORT"
    flag: "port"
    default_value: "9190"
    description: "Port of the local daemon gateway, dialled when no gateway URL is known"
  }];

  // Unset: TLS when a cert and key are given or the URL is https, else h2c.
  string tls_mode = 4 [(forge.v1.config) = {
    env_var: "DAEMON_TLS_MODE"
    flag: "tls-mode"
    allowed_values: ["tls", "insecure_tls_skip_verify", "h2c", "disabled"]
    description: "TLS mode for the gateway connection: tls, insecure_tls_skip_verify, h2c or disabled"
  }];
  string tls_cert_file = 5 [(forge.v1.config) = {
    env_var: "TLS_CERT_FILE"
    flag: "tls-cert"
    description: "TLS certificate file path"
  }];
  string tls_key_file = 6 [(forge.v1.config) = {
    env_var: "TLS_KEY_FILE"
    flag: "tls-key"
    description: "TLS key file path"
  }];

  // Server mode: the gateway dials in, instead of the daemon dialling out.
  // The workspace operator sets it on pods it does not run in dial-out mode.
  bool server_mode = 7 [(forge.v1.config) = {
    env_var: "DAEMON_SERVER_MODE"
    flag: "server-mode"
    description: "Listen for incoming gateway connections instead of dialing out"
  }];

  // The port this daemon listens on in server mode.
  int32 listen_port = 8 [(forge.v1.config) = {
    env_var: "DAEMON_LISTEN_PORT"
    flag: "listen-port"
    default_value: "9190"
    description: "Port to listen on in server mode"
  }];

  // Never open a browser or run an interactive login; idle until a
  // credential appears on disk. Electron spawns its daemon this way: its own
  // login page owns sign-in. A managed daemon is non-interactive whatever
  // this says (there is nobody to be interactive with).
  bool non_interactive = 9 [(forge.v1.config) = {
    env_var: "RELIANT_DAEMON_NON_INTERACTIVE"
    flag: "non-interactive"
    description: "Never open a browser or run interactive login; idle and wait for credentials to appear on disk instead"
  }];

  // What the platform says this daemon is. The workspace operator sets
  // "managed" on the pods it creates; nothing sets it on a user's machine.
  // Unset: the transport decides what the daemon reports (see
  // daemonruntime.resolveDaemonType).
  string daemon_type = 10 [(forge.v1.config) = {
    env_var: "RELIANT_DAEMON_TYPE"
    allowed_values: ["managed", "self_hosted"]
    description: "Daemon type the platform declares: managed (an operator-created workspace pod) or self_hosted"
  }];

  // Pod-only settings the workspace operator stamps; a daemon on a user's
  // machine leaves them unset.

  // Unset: the process's working directory.
  string working_dir = 11 [(forge.v1.config) = {
    env_var: "DAEMON_WORKING_DIR"
    description: "Working directory the daemon serves (default: the process's working directory)"
  }];

  // The pod's container runtime class ("kata", "gvisor"), reported at
  // registration.
  string runtime_type = 12 [(forge.v1.config) = {
    env_var: "DAEMON_RUNTIME_TYPE"
    description: "Container runtime the daemon runs under (reported to the server)"
  }];

  // The pod-facing port of the preview forwarder. Setting it (or server
  // mode) is what starts the forwarder: a pod has a surface the workspace
  // proxy reaches, a laptop does not.
  int32 frontend_port = 13 [(forge.v1.config) = {
    env_var: "DAEMON_FRONTEND_PORT"
    description: "Preview forwarder port; setting it starts the forwarder (default 9191 in server mode)"
  }];

  // The project the daemon announces at connect. Unset: the working
  // directory.
  string project_path = 14 [(forge.v1.config) = {
    env_var: "PROJECT_PATH"
    description: "Project directory announced to the server at connect (default: the working directory)"
  }];

  // How the daemon runs the commands agents start. low (the default) runs
  // them below normal CPU and I/O priority, so a burst of builds yields to
  // the UI, Docker and the daemon itself; normal opts out.
  string child_priority = 15 [(forge.v1.config) = {
    env_var: "RELIANT_CHILD_PRIORITY"
    default_value: "low"
    allowed_values: ["low", "normal"]
    description: "Priority of agent-started commands: low or normal"
  }];

  // Where new worktrees go. Unset: ~/.reliant/worktrees.
  string worktree_dir = 16 [(forge.v1.config) = {
    env_var: "RELIANT_WORKTREE_DIR"
    description: "Directory new worktrees are created in (default: ~/.reliant/worktrees)"
  }];

  // Drive an already-running browser over the DevTools Protocol (e.g.
  // http://host.k3d.internal:9222) instead of a local Chrome: the escape
  // hatch for a daemon whose image has no browser.
  string chrome_browser_url = 17 [(forge.v1.config) = {
    env_var: "RELIANT_CHROME_BROWSER_URL"
    description: "DevTools URL of an already-running browser for the chrome-devtools MCP"
  }];

  // The disk guard's thresholds (internal/diskguard), each a percentage of
  // a volume used ("90", "95%") or "off". Past reclaim_at the daemon runs its
  // reclaimers; past refuse_at it refuses new heavy commands. Strings because
  // "off" is a value. A value the guard cannot read is logged and that
  // threshold keeps its default: a misconfigured guard never stops the
  // daemon. Unset: 90 and 95.
  string disk_reclaim_at = 20 [(forge.v1.config) = {
    env_var: "RELIANT_DISK_RECLAIM_AT"
    description: "Disk use (percent, or off) past which the daemon reclaims space (default 90)"
  }];
  string disk_refuse_at = 21 [(forge.v1.config) = {
    env_var: "RELIANT_DISK_REFUSE_AT"
    description: "Disk use (percent, or off) past which the daemon refuses heavy commands (default 95)"
  }];

  // The commands the daemon queues behind the machine's heavy slots: each a
  // space-separated word list matched against the start of every simple
  // command, a trailing * matching any word with that prefix
  // (internal/heavyjob). The list REPLACES the default, which is
  // heavyjob.DefaultCommands (a test pins the two equal); an empty list
  // ("," in the env, or --config) declares nothing heavy by pattern.
  repeated string heavy_commands = 22 [(forge.v1.config) = {
    env_var: "RELIANT_HEAVY_COMMANDS"
    default_value: "go build,go test,go vet,go install,golangci-lint run,vitest,npx vitest,npm test,npm run test*,npm run build*,npm ci,forge generate,forge lint,reliant forge generate,reliant forge lint,make test*,task test*,docker build"
    description: "Comma-separated commands queued behind the machine's heavy slots"
  }];
}

// DaemonStatusConfig is `reliant daemon status`'s config.
message DaemonStatusConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["daemon", "status"]
  };

  DaemonInstanceConfig instance = 1;
}

// DaemonStopConfig is `reliant daemon stop`'s config.
message DaemonStopConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["daemon", "stop"]
  };

  DaemonInstanceConfig instance = 1;
}

// DaemonLogsConfig is `reliant daemon logs`'s config.
message DaemonLogsConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["daemon", "logs"]
  };

  DaemonInstanceConfig instance = 1;
}

// DaemonRegisterConfig is `reliant daemon register`'s config.
message DaemonRegisterConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["daemon", "register"]
  };

  // Unset: the default instance.
  string account = 1 [(forge.v1.config) = {
    env_var: "RELIANT_INSTANCE_ACCOUNT"
    flag: "account"
    description: "Account (Supabase subject) to register; separate accounts on one server keep separate credentials"
  }];
}
