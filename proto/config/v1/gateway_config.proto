syntax = "proto3";

package config.v1;

import "config/v1/control_plane_config.proto";
import "config/v1/observability_config.proto";
import "config/v1/server_config.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/config/v1;configv1";

// GatewayConfig is the `reliant server gateway` process's own config. It loads
// alongside the root ReliantConfig (config.proto, whose header has the rules
// every config here follows).
message GatewayConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["server", "gateway"]
  };

  ControlPlaneConfig control_plane = 1;

  DatabaseConfig database = 10;
  NatsConfig nats = 11;
  ServerTLSConfig tls = 12;
  DrainConfig drain = 13;

  // The port daemons dial: the gateway's bidi-streaming gRPC listener. A
  // local daemon reads the same variable to find it (DaemonConfig).
  int32 daemon_port = 14 [(forge.v1.config) = {
    env_var: "TOOLS_DAEMON_PORT"
    flag: "daemon-port"
    default_value: "9190"
    description: "Daemon bidi-streaming gRPC listen port"
  }];
  int32 health_port = 15 [(forge.v1.config) = {
    env_var: "HEALTH_PORT"
    flag: "health-port"
    default_value: "8080"
    description: "Health/readiness HTTP endpoint port"
  }];
  string bind_address = 16 [(forge.v1.config) = {
    env_var: "BIND_ADDRESS"
    flag: "bind-address"
    default_value: "0.0.0.0"
    description: "Network address to bind to"
  }];
  string data_dir = 17 [(forge.v1.config) = {
    env_var: "DATA_DIR"
    flag: "data-dir"
    default_value: "./data"
    description: "Data directory for logs and certs"
  }];

  // The pprof debug listener, host:port. Unset: no pprof server. (The API
  // server and worker take a PPROF_PORT on loopback instead.)
  string pprof_addr = 18 [(forge.v1.config) = {
    env_var: "PPROF_ADDR"
    flag: "pprof-addr"
    description: "pprof debug server address host:port (unset: no pprof server)"
  }];
  ObservabilityConfig observability = 50;
}
