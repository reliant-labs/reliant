syntax = "proto3";

package forge.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/forge/pkg/forgepb;forgepb";

// =============================================================================
// Extensions — attach Forge annotations to standard protobuf descriptor types.
// Extension numbers are preserved from the original split proto files.
// =============================================================================

// Entity-level annotations on protobuf messages that represent database tables.
//
// Retired: ignored by forge. SQL is the schema — db/migrations drive entity
// projections. The extension is kept only so legacy projects' protos keep
// compiling; `forge generate` prints a notice when it sees the annotation.
extend google.protobuf.MessageOptions {
  EntityOptions entity = 50200;

  // Binds a config message to the binary that loads it. See BinaryConfigOptions.
  BinaryConfigOptions binary_config = 50201;

  // Binds a config message to the frontend that loads it. See
  // FrontendConfigOptions.
  FrontendConfigOptions frontend_config = 50202;
}

// Field-level annotations for database column mapping and configuration binding.
extend google.protobuf.FieldOptions {
  // Database column mapping and constraints.
  //
  // Retired: ignored by forge. SQL is the schema — db/migrations drive entity
  // projections. Kept only so legacy protos keep compiling.
  FieldOptions field = 50300;
  // Configuration binding to environment variables and CLI flags.
  ConfigFieldOptions config = 50400;
}

// Service-level annotations for Connect RPC service definitions.
extend google.protobuf.ServiceOptions {
  ServiceOptions service = 50000;
}

// Method-level annotations for Connect RPC method definitions.
extend google.protobuf.MethodOptions {
  MethodOptions method = 50100;
}

// =============================================================================
// Entity & ORM Messages
// =============================================================================

// EntityOptions defines how a protobuf message maps to a database table.
//
// DEPRECATED — Retired: ignored by forge. SQL is the schema — db/migrations
// drive entity projections. Kept for one release so legacy projects' protos
// keep compiling; remove the annotations from your protos.
message EntityOptions {
  // Database table name. Inferred from the message name (snake_case, pluralized)
  // when left empty.
  string table = 1;

  // Enable soft-delete semantics (adds a deleted_at column).
  bool soft_delete = 2;

  // Automatically manage created_at and updated_at timestamp columns.
  bool timestamps = 3;

  // Composite or single-column indexes to create on this table.
  repeated IndexDef indexes = 4;

  // Contract middleware to wire around generated repository methods.
  // Supported values: "tracing", "metrics", "logging".
  repeated string middleware = 5;
}

// IndexDef defines a database index on one or more columns.
//
// DEPRECATED — Retired: ignored by forge. SQL is the schema — db/migrations
// drive entity projections. Declare indexes in migration SQL instead.
message IndexDef {
  // Index name. Auto-generated from field names when left empty.
  string name = 1;

  // Column names included in this index, in order.
  repeated string fields = 2;

  // Whether this index enforces a uniqueness constraint.
  bool unique = 3;
}

// =============================================================================
// Field Options
// =============================================================================

// FieldOptions defines how a protobuf field maps to a database column.
//
// DEPRECATED — Retired: ignored by forge. SQL is the schema — db/migrations
// drive entity projections. Kept for one release so legacy projects' protos
// keep compiling; remove the annotations from your protos.
message FieldOptions {
  // Mark this field as the primary key.
  bool pk = 1;

  // How to store complex or non-scalar types in the database.
  StoreAs store = 3;

  // Foreign key reference in "table.column" format (e.g., "users.id").
  string ref = 4;

  // Column has a UNIQUE constraint.
  bool unique = 5;

  // Create a single-column index on this field.
  bool index = 6;

  // SQL default expression (e.g., "0", "'active'", "NOW()").
  string default_value = 7;

  // Skip this field in code generation entirely.
  bool skip = 8;

  // Application-layer validation rules for this field.
  ValidationRules validate = 9;

  // Field cannot be updated after initial creation.
  bool immutable = 10;
}

// StoreAs controls how complex or non-scalar protobuf types are persisted
// in the database.
//
// DEPRECATED — Retired: ignored by forge. SQL is the schema — db/migrations
// drive entity projections. Column storage types live in migration SQL.
enum StoreAs {
  // Inferred from the protobuf type (default behavior).
  STORE_AS_UNSPECIFIED = 0;

  // Store as a JSONB column (PostgreSQL) or JSON text (SQLite).
  STORE_AS_JSONB = 1;

  // Store as a TEXT column.
  STORE_AS_TEXT = 2;

  // Store as a BLOB / BYTEA column.
  STORE_AS_BLOB = 3;

  // Store in a separate table with a foreign key relationship.
  STORE_AS_TABLE = 4;
}

// ValidationRules defines application-layer constraints enforced during
// code generation. These do not affect the database schema directly.
message ValidationRules {
  // Field value is required (must be non-zero-value).
  bool required = 1;

  // Minimum length for string fields.
  int32 min_length = 2;

  // Maximum length for string fields.
  int32 max_length = 3;

  // Regex pattern the value must match.
  string pattern = 4;

  // Semantic format constraint (e.g., "email", "url", "uuid", "ip").
  string format = 5;

  // Minimum value for numeric fields.
  double min = 6;

  // Maximum value for numeric fields.
  double max = 7;

  // Allowed values (for enum-like string fields).
  repeated string allowed_values = 8;

  // Custom validation function name to call during validation.
  string custom = 9;
}

// =============================================================================
// Service Options
// =============================================================================

// ServiceOptions defines metadata and behavior for a Connect RPC service.
// Apply via [(forge.v1.service) = { ... }] on any service definition.
message ServiceOptions {
  // Human-readable service name used in code generation and logging.
  string name = 1;

  // API version string (e.g., "v1", "v2beta1").
  string version = 2;

  // Brief description of the service's purpose.
  string description = 3;

  // Controls how the service is exposed.
  ServiceVisibility visibility = 4;

  // Other services this service depends on (for dependency injection).
  repeated string dependencies = 5;

  // Authentication configuration for the service.
  AuthConfig auth = 6;

  // The trust domain whose callers this service serves: "user" (the
  // default, when empty) for the product's own signed-in users, or a name
  // the project chooses for another kind of caller ("daemon", "operator").
  // A serverkit.Listener refuses to start when it mounts a service whose
  // audience differs from its chain's Authenticator.Audience(), so a
  // listener authenticating one kind of caller can never serve another
  // kind's RPCs.
  string audience = 7;
}

// ServiceVisibility determines how a service is exposed.
enum ServiceVisibility {
  // Unspecified; defaults to API visibility.
  SERVICE_VISIBILITY_UNSPECIFIED = 0;

  // Exposed via HTTP/Connect gateway.
  SERVICE_VISIBILITY_API = 1;

  // Only accessible for inter-service communication.
  SERVICE_VISIBILITY_INTERNAL = 2;
}

// AuthConfig defines service-wide authentication defaults.
// Individual methods can override via MethodOptions.auth_required.
message AuthConfig {
  // Whether authentication is required for this service by default.
  bool auth_required = 1;

  // Authentication provider identifier (e.g., "jwt", "api_key", "oauth2").
  string auth_provider = 2;
}

// =============================================================================
// Method Options
// =============================================================================

// MethodOptions defines per-method behavior annotations for Connect RPC methods.
// Apply via [(forge.v1.method) = { ... }] on any rpc definition.
message MethodOptions {
  // Whether this method requires authentication. Optional so the default
  // (fail-closed: auth required) is distinguishable from an explicit
  // `auth_required = false` opt-out at the proto level.
  // Overrides the service-level AuthConfig.auth_required default.
  optional bool auth_required = 1;

  // Whether this method is idempotent (safe to retry without side effects).
  bool idempotent = 3;

  // Server-side deadline for this method. forge projects it into
  // pkg/middleware/procedures_gen.go (ProcedureDeadlines), which the
  // scaffolded chain hands its Deadline slot; that slot runs ahead of
  // authentication, so the deadline bounds the credential lookup too. Unset
  // or zero is the slot's default (serverkit.DefaultUnaryDeadline for a unary
  // rpc, none for a stream); negative is no server deadline.
  google.protobuf.Duration timeout = 4;

  // Whether callers should supply an idempotency key for this method.
  // This is a convention marker — Forge does not enforce or inspect the key.
  // When set, tooling, docs, and generated clients advise callers to pass a
  // unique key (e.g., an Idempotency-Key header) so the server can safely
  // deduplicate retried mutations.
  bool idempotency_key = 5;

  // Declared Connect/gRPC error codes this method can return. Codegen
  // surfaces these so handler authors (and LLMs implementing handlers)
  // can see the typed error contract at a glance. Values match
  // connect.Code names — e.g. "NotFound", "PermissionDenied",
  // "InvalidArgument". Empty (or unset) means "no declared errors" — the
  // method either succeeds or returns an undeclared Connect.Code.
  //
  // The list is informational at runtime today; future work may enforce
  // that handlers can only return declared codes.
  repeated string errors = 6;

  // Activity declares the typed activity event a successful call records:
  // who (the caller) did what (verb) to which object (target), where (env)
  // and through what (via). forge/pkg/activity's interceptor reads this
  // option from the method descriptor and writes the event, so no handler
  // writes one by hand; `forge lint` fails a mutating rpc that declares
  // nothing (forgeconv-activity-declared). See ActivityOptions.
  ActivityOptions activity = 7;
}

// ActivityOptions declares the activity event an rpc records, or that it
// records none.
//
//   rpc PromoteRelease(PromoteReleaseRequest) returns (PromoteReleaseResponse) {
//     option (forge.v1.method) = {
//       activity: {
//         verb: "promote"
//         target: { kind: "release", id: "release_id", label: "response.release.version" }
//         env: "to_env"
//       }
//     };
//   }
//
// FIELD PATHS (target.id, target.label, env, scope, detail) are dotted proto
// field names resolved against the REQUEST, or against the RESPONSE when
// they start with "response." — a created object's id exists only in the
// response. Every path must end on a scalar or an enum field.
//
// A Create<E>, Update<E> or Delete<E> rpc whose messages have forge's CRUD
// shape needs no option: verb create/update/delete and target kind snake(E)
// are implied (forge/pkg/activity.Resolve). An explicit option wins.
message ActivityOptions {
  // Verb is the action, a lower_snake token: "promote", "rotate",
  // "restart". It is stored as written; the UI phrases it ("promoted").
  string verb = 1;

  // Target names the object the action was done to.
  ActivityTarget target = 2;

  // Env is the field path whose value is the environment the action
  // happened in. Empty records a project-level event.
  string env = 3;

  // Scope is the field path whose value is the scope (an org, a project)
  // reads are filtered by. Empty takes the interceptor's
  // ScopeFrom default (the caller's org).
  string scope = 4;

  // Detail lists field paths copied into the event's detail map, keyed by
  // each path's last segment.
  repeated string detail = 5;

  // Writer says who writes the event. The default, the interceptor, writes
  // it after the handler succeeds. HANDLER means the handler calls
  // activity.Record inside its own transaction, so the event commits or
  // rolls back with the mutation.
  ActivityWriter writer = 6;

  // None records that this rpc changes nothing worth an activity event,
  // and says why: `activity: { none: "dry run: computes a plan only" }`.
  // It excludes every other field, and the reason must not be empty.
  string none = 7;
}

// ActivityTarget names the object an activity event is about.
message ActivityTarget {
  // Kind is the target's type, a lower_snake literal: "release", "secret".
  string kind = 1;

  // Id is the field path of the target's id. Required.
  string id = 2;

  // Label is the field path of a human-readable label for the target.
  // Empty falls back to the id.
  string label = 3;
}

// ActivityWriter selects who writes a declared activity event.
enum ActivityWriter {
  // ACTIVITY_WRITER_UNSPECIFIED is the interceptor (the default).
  ACTIVITY_WRITER_UNSPECIFIED = 0;

  // ACTIVITY_WRITER_INTERCEPTOR: the activity interceptor writes the event
  // after the handler returns successfully, best-effort.
  ACTIVITY_WRITER_INTERCEPTOR = 1;

  // ACTIVITY_WRITER_HANDLER: the handler calls activity.Record, normally
  // inside its RunTx so the event is transactional with the mutation. If
  // the handler succeeds without recording, the interceptor writes the
  // event itself. Streaming rpcs must use this or `none`.
  ACTIVITY_WRITER_HANDLER = 2;
}

// =============================================================================
// Config Field Options
// =============================================================================

// ConfigFieldOptions defines how a config protobuf field maps to runtime
// configuration sources (environment variables and CLI flags).
//
// Example usage:
//
//   message MyServiceConfig {
//     string database_url = 1 [(forge.v1.config) = {
//       env_var: "DATABASE_URL",
//       flag: "database-url",
//       required: true,
//       description: "PostgreSQL connection string"
//     }];
//   }
message ConfigFieldOptions {
  // Environment variable name to read this field from (e.g., "DATABASE_URL").
  // A variable set to "" counts as unset, whatever the field's type: the file
  // or default value stands. An explicitly empty value is a flag's to set.
  string env_var = 1;

  // CLI flag name, without leading dashes (e.g., "database-url").
  string flag = 2;

  // Default value as a string. Applied when neither env var nor flag is set.
  string default_value = 3;

  // Whether this field must be provided. Loading fails if no layer (default,
  // config file, env var, flag) gives it a value. It is the ONE runtime
  // presence check, for every field kind: `sensitive` does not imply it (see
  // `optional` for why). A credential the process cannot run without says
  // `required: true` alongside `sensitive: true`.
  bool required = 4;

  // Human-readable description shown in --help output and documentation.
  string description = 5;

  // Sensitive marks this field as secret — its value MUST come from a
  // Kubernetes Secret (or equivalent) rather than a literal env-var, and
  // it is never written to forge.yaml inline. The deploy generator emits
  // a `secretKeyRef`-shaped EnvVar referencing a project-level Secret
  // (default name: <project>-secrets, key: <env_var>), projected into a
  // workload's env only when that workload names it in `config_secrets`.
  // Sensitive says where a value comes from (a Secret, never a flag or an
  // inline manifest value), not whether there must be one: that is
  // `required`, at runtime, and the secret pre-flight for a ref a workload
  // declares (see `optional`).
  bool sensitive = 6;

  // Category groups related fields for KCL emission. Fields with the same
  // category are rendered together as a single env-var group (e.g.
  // category: "stripe" → STRIPE_ENV bundle). Empty category lands the
  // field in the default APP_ENV bundle.
  string category = 7;

  // Role tags a field with a SEMANTIC meaning that drives behavior, so
  // forge/pkg/config can offer annotation-driven helpers without matching
  // on the field's NAME. Renaming a field never changes behavior — the
  // behavior follows the annotation. Naming a field "environment" without
  // the annotation does NOT make it the mode field.
  ConfigFieldRole role = 8;

  // AllowedValues constrains a STRING field to a closed set of valid
  // values, enforced when the config loads (Load runs config.Validate, so
  // an out-of-set value fails the load, naming the field). It is the
  // type/annotation-driven replacement for the old name-matched log-format
  // check ("json"/"text"): a string field carrying allowed_values is a
  // string ENUM, rejected when its resolved value is outside the set. The
  // empty value is always permitted (an unset, non-required field). True
  // proto enum fields don't need this — protoreflect already enforces their
  // domain. Renaming the field changes nothing; the set follows the
  // annotation.
  repeated string allowed_values = 9;

  // Optional marks a field the application TOLERATES being unset. It acts
  // at DEPLOY time; at runtime presence is `required`'s alone.
  //
  //   - sensitive: a secret_ref a workload declares (by naming the field in
  //     its `config_secrets`) is validated against the env's store before
  //     anything starts (secrets.ValidateDeclaredRefs), and a declared ref
  //     with no value is an error by default: discovering a missing
  //     production credential at runtime is the failure the pre-flight
  //     exists to prevent. `optional: true` exempts the field from that
  //     check and marks the rendered ref optional (secretKeyRef.optional /
  //     managedSecret.optional), so the pod starts without it.
  //   - not sensitive: the env projection omits the field while its value is
  //     the schema default, so a knob only some environments set does not
  //     churn every other environment's manifests.
  //
  // WHY sensitive DOES NOT IMPLY REQUIRED AT RUNTIME. Whether a credential
  // must exist is a property of the WORKLOAD that reads it, not of the
  // field: one config is loaded by several workloads, and each projects only
  // the secrets its `config_secrets` names. A runtime check implied by
  // `sensitive` would refuse to start every workload that deliberately does
  // not read one (a worker sharing the API server's config, a key source the
  // process uses only when another is unset), forcing a fake value into the
  // store. So the deploy pre-flight checks what a workload declares, and a
  // field the PROCESS cannot run without says so with `required: true`, the
  // same way any other field does.
  //
  // But an OPTIONAL-BY-DESIGN credential is a real thing, and forge had no
  // way to say so. The case that forced this: a config block whose
  // admin_user + admin_password are documented as the tier's ON SWITCH —
  // with either unset the reconciler is deliberately not registered. Every
  // non-sensitive field in that block projects as `str = ""` and unset is
  // fine; only the sensitive one became a hard startup requirement, so an
  // environment that had deliberately not enabled the tier could not start
  // at all. The operator's only recourse was to invent a fake value, which
  // puts a real-looking credential in the store and defeats the check for
  // everyone.
  //
  // So: `optional: true` says the absence is intended, and the secret-store
  // validation skips the field. It is deliberately an OPT-IN — the safe
  // default stays "a declared secret must have a value", and an author has
  // to state the exception.
  //
  // It is an ERROR to set both `required: true` and `optional: true`; they
  // are direct contradictions and forge rejects the pair rather than
  // silently picking one.
  bool optional = 10;

  // EnvVarAliases are further environment variables the field is read from,
  // in order, when env_var is unset: the first one set wins, and a variable
  // set to "" counts as unset, exactly as for env_var. A flag still beats
  // all of them.
  //
  //   string environment = 1 [(forge.v1.config) = {
  //     env_var: "RELIANT_ENV"
  //     env_var_aliases: [{name: "NODE_ENV"}]
  //   }];
  //   int32 port = 2 [(forge.v1.config) = {
  //     env_var: "DAEMON_LISTEN_PORT"
  //     env_var_aliases: [{name: "TOOLS_DAEMON_PORT", deprecated: true}]
  //   }];
  //
  // An alias is for a SETTER forge does not control: a convention another
  // tool owns (NODE_ENV), or an older name a deployment elsewhere still
  // exports. forge's own setters use env_var alone — the KCL env map and the
  // secret store key name only the primary — so every manifest forge renders
  // converges on one name. A flag's --help lists env_var and the permanent
  // aliases; a deprecated alias is never advertised.
  //
  // Aliases need env_var, are read only from the environment, and must not
  // repeat any env var or alias another field of the same process reads;
  // `forge generate` refuses each of those. A frontend config field takes
  // no aliases: its values come from the rendered config document, not
  // from an environment.
  repeated EnvVarAlias env_var_aliases = 11;
}

// EnvVarAlias is one fallback environment variable of a config field. See
// ConfigFieldOptions.env_var_aliases.
message EnvVarAlias {
  // Name is the environment variable, e.g. "NODE_ENV".
  string name = 1;

  // Deprecated marks a name kept only so existing setters keep working
  // while they move to env_var. A process that finds it set prints one
  // line to stderr at load naming env_var, whether the alias supplied the
  // value or was shadowed by an earlier name. A permanent alias (the
  // default) is read silently: NODE_ENV is somebody else's convention, not
  // a migration in flight, and a notice at every start would be noise.
  bool deprecated = 2;
}

// BinaryConfigOptions binds a config message to the BINARY that loads it,
// giving each binary its own config surface instead of one project-global
// AppConfig every process ships.
//
// The problem it solves is ownership, not size: with one shared message,
// every binary links every field — including credentials it has no business
// reading — and removing a field for one binary removes it for all of them.
// Annotating a message with a binary makes that message THAT binary's
// config: forge generates a loader, a KCL schema and an env projection per
// binary, so a workload's Deployment carries only ITS binary's env vars and
// deleting a field from one binary's config cannot affect another's.
//
// Ownership is disjoint; DEFINITIONS may still be shared. Every binary
// wanting a log level is not duplication — they are separate values on
// separate processes. Compose a shared message (conventionally BaseConfig)
// as a field on each binary's config and its leaves are registered once per
// binary, resolved independently at runtime.
//
// This is an ANNOTATION rather than a naming convention for the same reason
// ConfigFieldRole is: behavior follows the annotation, never the identifier.
// Renaming AdminConfig does not re-point it at another binary, and naming a
// message GatewayConfig does not silently make it the gateway's config.
//
// A project that annotates NOTHING is unchanged: its single AppConfig stays
// the one config every binary loads. Per-binary config is opt-in.
//
// ONE BINARY, SEVERAL PROCESSES. A binary whose subcommands are different
// processes (`reliant server api`, `reliant server worker`, `reliant
// daemon`) scopes a config to a subcommand with `command`, so each process
// carries only what it reads — the api's credentials never reach the
// worker's Deployment. The binding is keyed on (binary, command):
//
//   - The ROOT config (no `command`) is the binary-wide surface: every
//     process of the binary loads it, and its flags register as PERSISTENT
//     flags on the binary's root command, so every subcommand inherits them.
//   - A COMMAND config is loaded by exactly the process running that
//     subcommand. Its leaves — composed blocks included — register as LOCAL
//     flags on that subcommand, and its loader refuses to load from any
//     other command.
//
// A process therefore reads the root config plus the ONE config declared for
// its exact command path; command configs do not nest (a config for
// ["server"] is not inherited by `server api`). The root config and a command
// config of the same binary may not declare the same env var or flag: one
// process would read the value twice, from two declarations that can drift.
message BinaryConfigOptions {
  // Binary is the cmd/<name> leaf whose process loads this config — the same
  // name `forge scaffold binary` creates and the deploy layer names its
  // workload after. A message annotated with a binary that has no cmd/<name>
  // directory is a generate-time error, not a silently unused config.
  string binary = 1;

  // Command is the cobra command path BELOW the binary whose process loads
  // this config, one command name per element: ["server", "api"] for
  // `reliant server api`. Empty binds the binary's root config. Two
  // messages may not bind the same (binary, command).
  //
  // forge validates the SHAPE at generate time (each element one command
  // name: non-empty, no whitespace, not a flag) but cannot prove the path
  // exists there: a cobra tree is assembled at runtime by AddCommand calls in
  // any package, from `Use` strings that may be computed, so a static scan
  // would be a guess that is wrong in both directions — and a wrong refusal
  // blocks generate. The exact check runs where the tree is real: the
  // generated Load<Msg>(cmd) refuses a command whose path is not this one.
  repeated string command = 2;
}

// FrontendConfigOptions binds a config message to the FRONTEND that loads
// it, making a frontend a first-class consumer of the same declared,
// typed, defaulted config surface a binary gets.
//
// It is the browser twin of BinaryConfigOptions and shares its reasoning:
// ownership is disjoint (a frontend's generated TypeScript module, KCL
// schema and per-env projection are built from the message carrying its
// name, so deleting a field from one frontend cannot reach another's),
// while DEFINITIONS may still be shared. The OIDC issuer both halves of an
// authenticated app need is ONE fact: compose a shared message onto both
// the binary's config and the frontend's, and the two cannot drift.
//
// It differs from BinaryConfigOptions in exactly one way, and the
// difference is the point:
//
//   A BINARY's config may hold secrets. A FRONTEND's may not.
//
// Everything a browser reads is public. A frontend's config is delivered
// to the client and is readable by anyone who opens devtools — there is no
// browser analogue of a Kubernetes Secret, and no amount of care at the
// deploy layer changes that. So `sensitive: true` — which on a binary
// means "this value comes from a Secret, never a literal env var" — has no
// safe meaning here at all.
//
// forge therefore treats a sensitive field reaching a frontend config as a
// GENERATE-TIME ERROR rather than a warning or a runtime check. A warning
// would be discovered after the value had already shipped in a bundle, and
// a leaked credential cannot be un-shipped: the only useful moment to
// refuse is before the value is ever written down. Split the secret out
// into a binary-bound message and let the backend hold it; if the browser
// genuinely needs the capability, it needs a token minted by the backend,
// not the credential itself.
//
// A project that annotates NOTHING is unchanged. Frontend config is opt-in.
message FrontendConfigOptions {
  // Frontend is the forge.yaml `frontends[].name` whose bundle loads this
  // config — the same name `forge scaffold frontend` creates. A message
  // annotated with a frontend that no forge.yaml declares is a
  // generate-time error, not a silently unused config.
  string frontend = 1;
}

// ConfigFieldRole enumerates the semantic roles a config field can carry.
// Today the only role is MODE (the runtime production/development switch
// that gates dev ergonomics and the explicit auth bypass). Additional
// roles can be added here as new annotation-driven semantics appear.
enum ConfigFieldRole {
  // CONFIG_FIELD_ROLE_UNSPECIFIED is the default: an ordinary config
  // field with no special semantics.
  CONFIG_FIELD_ROLE_UNSPECIFIED = 0;

  // CONFIG_FIELD_ROLE_MODE marks the field whose string value selects the
  // runtime mode: "development"/"dev" → development, anything else →
  // production. config.Mode(msg) keys off THIS field, regardless of its
  // name.
  CONFIG_FIELD_ROLE_MODE = 1;

  // CONFIG_FIELD_ROLE_TLS_CERT and CONFIG_FIELD_ROLE_TLS_KEY mark the two
  // halves of a TLS keypair. config.Validate enforces both-or-neither:
  // setting exactly one is a configuration error (the server would silently
  // fall back to plaintext). Selected by annotation, not by the names
  // "tls_cert_path"/"tls_key_path".
  CONFIG_FIELD_ROLE_TLS_CERT = 2;
  CONFIG_FIELD_ROLE_TLS_KEY = 3;

  // CONFIG_FIELD_ROLE_CORS_ORIGINS marks the comma-separated CORS allow-list
  // and CONFIG_FIELD_ROLE_CORS_ALLOW_CREDENTIALS marks the credentials bool.
  // config.Validate rejects the spec-invalid combination of a wildcard
  // origin ("*") with credentials=true. Selected by annotation, not by the
  // field names.
  CONFIG_FIELD_ROLE_CORS_ORIGINS = 4;
  CONFIG_FIELD_ROLE_CORS_ALLOW_CREDENTIALS = 5;
}
