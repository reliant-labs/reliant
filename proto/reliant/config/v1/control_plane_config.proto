syntax = "proto3";

package reliant.config.v1;

import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/config/v1;configv1";

// ControlPlaneConfig is how a server process reaches the control plane that
// hosts this deployment. Every server role reads it, through
// ServerProcessConfig; the daemon and the CLI do not.
//
// Its presence is what makes a deployment HOSTED: with no url, reliant is
// self-hosted, and every consumer takes its self-hosted path (the local token
// store, saved GitHub connections, private model endpoints allowed). A url
// without the secret is a boot error at each consumer, never a silent fall
// back to self-hosted.
message ControlPlaneConfig {
  // The control plane's base URL. control-plane sets RELIANT_CONTROL_PLANE_URL;
  // the two older names are still read, after it, until nothing sets them.
  string url = 1 [(forge.v1.config) = {
    env_var: "RELIANT_CONTROL_PLANE_URL"
    env_var_aliases: [
      {name: "CONTROL_PLANE_API_URL", deprecated: true},
      {name: "CONTROL_PLANE_BASE_URL", deprecated: true}
    ]
    description: "Control-plane base URL; unset means self-hosted"
  }];

  // The HMAC secret reliant signs internal-service tokens to the control plane
  // with. Optional: a self-hosted deployment has none.
  string internal_service_secret = 2 [(forge.v1.config) = {
    env_var: "INTERNAL_SERVICE_SECRET"
    sensitive: true
    optional: true
    description: "Secret for internal-service calls to the control plane (required when url is set)"
  }];

  // Mints the managed Reliant key once per (person, org): a person's chats in
  // an org they belong to spend a key minted in that org (identity
  // managed:<org_id>, attributed to it), so the gateway bills that org's
  // wallet rather than their default org's (control-plane
  // docs/design/org-provider-accounts.md §3.2, P10; org-policies §2, G0). The
  // key is minted the first time it is needed, and in a chat of an org that
  // has one the org-less managed key is not used. Off by default. A release
  // before org-provider-accounts P5 ignores a managed key's org and would
  // balance one person's calls across every org's key, so turn it on only once
  // P5 is in every server AND in the release a rollback would return to, and a
  // query in prod shows no live person holds more than one managed row. Off,
  // nothing new is minted; keys already minted keep serving their orgs.
  bool managed_keys_per_org = 3 [(forge.v1.config) = {
    env_var: "RELIANT_CONTROL_PLANE_MANAGED_KEYS_PER_ORG"
    description: "Mint the managed Reliant key per (person, org), so each org's chats bill that org"
  }];
}
