syntax = "proto3";

package reliant.config.v1;

import "reliant/config/v1/analytics_config.proto";
import "reliant/config/v1/control_plane_config.proto";
import "reliant/config/v1/integrations_config.proto";
import "reliant/config/v1/llm_config.proto";
import "reliant/config/v1/observability_config.proto";
import "reliant/config/v1/preview_config.proto";
import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/config/v1;configv1";

// ServerProcessConfig is what every server role (`reliant server
// api|worker|gateway`) reads the same way: the infrastructure it connects to
// and the outside world it reports to. It is a SUBTREE config over `server`,
// so all three roles load ONE declaration of it, and a component they share
// (the repo, the NATS connection, the control-plane endpoint) has one
// constructor reading one config in every role, rather than each role's copy
// of the same block. Its flags are persistent on `server`.
//
// A role's own knobs stay on its command config (api_server_config.proto,
// worker_config.proto, gateway_config.proto): its ports, including
// HEALTH_PORT, whose default differs per role; its bind address and pprof
// listener; and its drain budget, which may differ per role. The database a
// role connects to is DatabaseConfig (db_config.proto), a subtree config of
// its own because `reliant db migrate` loads it too. The rules every config
// here follows are in config.proto's header.
message ServerProcessConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    subtrees: [{path: ["server"]}]
  };

  ControlPlaneConfig control_plane = 1;
  NatsConfig nats = 2;
  TemporalConfig temporal = 3;
  ServerTLSConfig tls = 4;

  string data_dir = 5 [(forge.v1.config) = {
    env_var: "DATA_DIR"
    flag: "data-dir"
    default_value: "./data"
    description: "Data directory for logs and certs"
  }];

  // How live deltas fan out across replicas. nats is the only driver; the
  // knob remains because deployments set it.
  string streaming_driver = 6 [(forge.v1.config) = {
    env_var: "STREAMING_DRIVER"
    flag: "streaming-driver"
    default_value: "nats"
    allowed_values: ["nats"]
    description: "Streaming driver (nats)"
  }];

  IntegrationsConfig integrations = 7;
  ObservabilityConfig observability = 8;
  // Sentry was removed: errors reach forge's ClickStack through OTLP.
  reserved 9;
  reserved "sentry";
  AnalyticsConfig analytics = 10;
  LLMConfig llm = 11;
  PreviewConfig preview = 12;
  NetworkConfig network = 13;
  // The org-policy enforcement switches every server role applies (the API
  // server's own org rollout gates are ApiServerConfig's OrgsConfig).
  OrgPolicyEnforcementConfig org_policy_enforcement = 14;
}

// OrgPolicyEnforcementConfig is the platform's switch per org-policy
// enforcement point (control-plane docs/design/org-policies.md §7, D12):
//
//   off      the point never consults a policy: today's behaviour exactly;
//   audit    it counts and logs what the org's policy would refuse, and
//            refuses nothing, whatever the policy's own mode says;
//   enforce  each policy section's own mode decides: ENFORCE refuses, AUDIT
//            counts.
//
// A new point ships in audit and is flipped to enforce with the evidence its
// audit counts give. Only these three values: a kill switch must not fail
// open on a typo.
message OrgPolicyEnforcementConfig {
  // Allowed integrations (§4.3): a run's use of a connection, an
  // integration trigger's routing and polling.
  string integrations = 1 [(forge.v1.config) = {
    env_var: "RELIANT_ORGS_POLICY_ENFORCEMENT_INTEGRATIONS"
    default_value: "audit"
    allowed_values: ["off", "audit", "enforce"]
    description: "How the org integrations policy applies: off, audit (count, never refuse) or enforce"
  }];
  // Approval floors (§4.4): the automation-approval floor of an org's
  // triggers and the chat mode floor (auto runs as manual).
  string approvals = 2 [(forge.v1.config) = {
    env_var: "RELIANT_ORGS_POLICY_ENFORCEMENT_APPROVALS"
    default_value: "audit"
    allowed_values: ["off", "audit", "enforce"]
    description: "How the org approval floors apply: off, audit (count, change nothing) or enforce"
  }];
  // Machines (§4.6): `credentials: none` forced on the commands of an org's
  // runs.
  string machines = 3 [(forge.v1.config) = {
    env_var: "RELIANT_ORGS_POLICY_ENFORCEMENT_MACHINES"
    default_value: "audit"
    allowed_values: ["off", "audit", "enforce"]
    description: "How the org's forced credentials:none on agent commands applies: off, audit (count, change nothing) or enforce"
  }];
  // MCP servers (§4.5): which servers' tools an org's agents are offered
  // (call_llm) and may call (the tool executor).
  string mcp = 4 [(forge.v1.config) = {
    env_var: "RELIANT_ORGS_POLICY_ENFORCEMENT_MCP"
    default_value: "audit"
    allowed_values: ["off", "audit", "enforce"]
    description: "How the org MCP server policy applies: off, audit (count, never refuse) or enforce"
  }];
}

// NetworkConfig is the network reach of the dials a user steers from a server
// role: fetch, websearch, sourcegraph, model-endpoint probes and local-model
// routes. The rules every config here follows are in config.proto's header.
message NetworkConfig {
  // Off by default, and nothing else turns it on: not a missing control-plane
  // URL, not a hosted or self-hosted guess. A server role is a shared process
  // next to databases, brokers and a cloud metadata service, so a URL a user
  // types must not reach loopback, RFC 1918, link-local, metadata or CGNAT
  // addresses. Set it only for a self-hosted deployment whose users mean those
  // addresses (an Ollama on the server's own LAN); the process logs a warning
  // at startup when it is on.
  bool allow_private_egress = 1 [(forge.v1.config) = {
    env_var: "RELIANT_ALLOW_PRIVATE_EGRESS"
    description: "Let user-steered server-side requests (fetch, websearch, model endpoints) reach private, loopback and link-local addresses; self-hosted deployments only"
  }];
}

// NatsConfig is the NATS server a server role connects to: daemon routing,
// and the streaming hub's transport.
message NatsConfig {
  // A secret: deployments embed credentials in it (nats://user:pass@host).
  string url = 1 [(forge.v1.config) = {
    env_var: "NATS_URL"
    sensitive: true
    required: true
    description: "NATS server URL"
  }];

  // Credentials for a NATS server that takes them out of band. Used only
  // when both are set.
  string user = 2 [(forge.v1.config) = {
    env_var: "NATS_USER"
    description: "NATS user name (used with NATS_PASSWORD)"
  }];
  string password = 3 [(forge.v1.config) = {
    env_var: "NATS_PASSWORD"
    sensitive: true
    optional: true
    description: "NATS password (used with NATS_USER)"
  }];
}

// TemporalConfig is the Temporal frontend the API server and worker use.
message TemporalConfig {
  string host = 1 [(forge.v1.config) = {
    env_var: "TEMPORAL_HOST"
    flag: "temporal-host"
    default_value: "localhost"
    description: "Temporal server host"
  }];
  int32 port = 2 [
    (forge.v1.config) = {
      env_var: "TEMPORAL_PORT"
      flag: "temporal-port"
      default_value: "7233"
      description: "Temporal server port"
    },
    (buf.validate.field).int32 = {gte: 1, lte: 65535}
  ];
  string namespace = 3 [(forge.v1.config) = {
    env_var: "TEMPORAL_NAMESPACE"
    flag: "temporal-namespace"
    default_value: "reliant"
    description: "Temporal namespace"
  }];
}

// ServerTLSConfig is how a server role that terminates TLS itself (the API
// server, the daemon gateway) serves it: on its own listeners, never on the
// plaintext health port. It keeps its own names rather than forge's
// tls_cert_path / tls_key_path, which forge's serve policy applies to the
// probe address — reliant's HEALTH_PORT, which must stay plaintext for the
// kubelet and the load balancer's HTTP health checks.
message ServerTLSConfig {
  string cert_file = 1 [(forge.v1.config) = {
    env_var: "TLS_CERT_FILE"
    flag: "tls-cert"
    description: "TLS certificate file path"
  }];
  string key_file = 2 [(forge.v1.config) = {
    env_var: "TLS_KEY_FILE"
    flag: "tls-key"
    description: "TLS key file path"
  }];
  bool disable = 3 [(forge.v1.config) = {
    env_var: "DISABLE_TLS"
    flag: "disable-tls"
    description: "Disable TLS (use plaintext HTTP)"
  }];
}
