// DaemonClientVersionFloor is the floor of the tools daemon
// (Reliant-Client: daemon/<v>, and DaemonRegister's build identity).
message DaemonClientVersionFloor {
  string min_version = 1 [
    (forge.v1.config) = {
      env_var: "RELIANT_MIN_DAEMON_VERSION"
      description: "Oldest daemon version served, semver without a leading v (empty: no floor)"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
  ];
  string upgrade_url = 2 [
    (forge.v1.config) = {
      env_var: "RELIANT_DAEMON_UPGRADE_URL"
      description: "Where a below-floor daemon's owner is sent to upgrade"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uri = true
  ];
  string upgrade_command = 3 [(forge.v1.config) = {
    env_var: "RELIANT_DAEMON_UPGRADE_COMMAND"
    description: "What a below-floor daemon's owner is told to run to upgrade"
  }];
  // The ordering key for daemon builds semver cannot order (dev and
  // unstamped builds): a daemon whose DaemonRegister.commit_time_unix is
  // before it is below the floor. control-plane's daemon floor
  // (DAEMON_FLOOR_MIN_COMMIT_TIME) maps onto it. Zero: no commit-time floor.
  int64 min_commit_time_unix = 4 [
    (forge.v1.config) = {
      env_var: "RELIANT_MIN_DAEMON_COMMIT_TIME_UNIX"
      description: "Oldest daemon build served, by its commit time in Unix seconds (0: no commit-time floor)"
    },
    (buf.validate.field).int64 = {gte: 0}
  ];
}

