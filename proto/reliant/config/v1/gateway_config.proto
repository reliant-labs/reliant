syntax = "proto3";

package reliant.config.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/config/v1;configv1";

// GatewayConfig is the `reliant server gateway` process's own config. It loads
// alongside the root ReliantConfig and the `server` subtree configs,
// ServerProcessConfig and DatabaseConfig (config.proto, whose header has the
// rules every config here follows).
message GatewayConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["server", "gateway"]
  };

  // The blocks every server role shares moved to ServerProcessConfig and
  // DatabaseConfig.
  reserved 1, 10, 11, 12, 13, 17, 50;
  reserved "control_plane", "database", "nats", "tls", "drain", "data_dir", "observability";

  // The port daemons dial: the gateway's bidi-streaming gRPC listener. A
  // local daemon reads the same variable to find it (DaemonConfig).
  int32 daemon_port = 14 [
    (forge.v1.config) = {
      env_var: "TOOLS_DAEMON_PORT"
      flag: "daemon-port"
      default_value: "9190"
      description: "Daemon bidi-streaming gRPC listen port"
    },
    (buf.validate.field).int32 = {gte: 1, lte: 65535}
  ];
  int32 health_port = 15 [
    (forge.v1.config) = {
      env_var: "HEALTH_PORT"
      flag: "health-port"
      default_value: "8080"
      description: "Health/readiness HTTP endpoint port"
    },
    (buf.validate.field).int32 = {gte: 1, lte: 65535}
  ];
  string bind_address = 16 [(forge.v1.config) = {
    env_var: "BIND_ADDRESS"
    flag: "bind-address"
    default_value: "0.0.0.0"
    description: "Network address to bind to"
  }];

  // The pprof debug listener, host:port. Unset: no pprof server. (The API
  // server and worker take a PPROF_PORT on loopback instead.)
  string pprof_addr = 18 [(forge.v1.config) = {
    env_var: "PPROF_ADDR"
    flag: "pprof-addr"
    description: "pprof debug server address host:port (unset: no pprof server)"
  }];

  // The rollout drain budget, read as ApiServerConfig's is (its comment has
  // the rules). Each role declares its own, so one role's may differ.
  google.protobuf.Duration pre_stop_delay = 19 [(forge.v1.config) = {
    env_var: "PRE_STOP_DELAY"
    default_value: "5s"
    description: "How long to keep serving after readiness flips at shutdown (negative: no pause)"
  }];
  google.protobuf.Duration shutdown_timeout = 20 [(forge.v1.config) = {
    env_var: "SHUTDOWN_TIMEOUT"
    default_value: "30s"
    description: "Budget for graceful shutdown after the pre-stop pause"
  }];

  // The probe paths on HEALTH_PORT, comma-separated; each list's first path
  // is the canonical one and the rest are aliases served alike. /health and
  // /ready are what control-plane probes (RELIANT_PROBES, the GKE health
  // check, docker-compose); /healthz and /readyz are forge's, which `forge
  // doctor` and the boot probes' defaults use. No flag: these are a
  // deployment's contract with its probes, not an operator knob.
  string liveness_paths = 21 [(forge.v1.config) = {
    env_var: "LIVENESS_PATHS"
    default_value: "/health,/healthz"
    description: "Liveness probe paths on the health port (comma-separated)"
  }];
  string readiness_paths = 22 [(forge.v1.config) = {
    env_var: "READINESS_PATHS"
    default_value: "/ready,/readyz"
    description: "Readiness probe paths on the health port (comma-separated)"
  }];
}
