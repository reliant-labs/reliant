syntax = "proto3";

package reliant.config.v1;

import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/config/v1;configv1";

// AuthConfig is what `reliant auth` commands read about the machine they sign
// in on, beside CLIConfig, and what `reliant update` reads to refuse replacing
// a binary the platform installed. The rules every config here follows are in
// config.proto's header.
//
// It is its own subtree config, rather than a CLIConfig field, because
// DaemonConfig (`daemon start`) already declares RELIANT_DAEMON_TYPE and
// CLIConfig is loaded by `daemon start` too: forge refuses one variable
// declared by two configs one process loads. No process loads both AuthConfig
// and DaemonConfig, so each projects RELIANT_DAEMON_TYPE from its one
// declaration, and DaemonConfig's daemon_type keeps working unchanged.
message AuthConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    subtrees: [
      {
        path: ["auth"]
      },
      {
        path: ["update"]
      }
    ]
  };

  // What the platform says this machine is: the same variable as
  // DaemonConfig's daemon_type. The workspace operator sets "managed" on the
  // pods it creates; nothing sets it on a user's machine. `auth login`,
  // `auth logout` and `auth token` treat a managed machine's daemon sign-in
  // as the platform's, and sign in with the device flow there.
  string daemon_type = 1 [(forge.v1.config) = {
    env_var: "RELIANT_DAEMON_TYPE"
    allowed_values: [
      "managed",
      "self_hosted"
    ]
    description: "Daemon type the platform declares: managed (an operator-created workspace pod) or self_hosted"
  }];
}
