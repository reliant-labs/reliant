syntax = "proto3";

package reliant.config.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/config/v1;configv1";

// WorkerConfig is the `reliant server worker` process's own config. It loads
// alongside the root ReliantConfig and the `server` subtree configs,
// ServerProcessConfig and DatabaseConfig (config.proto, whose header has the
// rules every config here follows).
message WorkerConfig {
  option (forge.v1.binary_config) = {
    binary: "reliant"
    command: ["server", "worker"]
  };

  // The blocks every server role shares moved to ServerProcessConfig and
  // DatabaseConfig.
  reserved 1, 10, 11, 12, 13, 16, 17, 40, 50, 51, 60, 70, 90;
  reserved "control_plane", "database", "nats", "temporal", "drain", "data_dir", "streaming_driver",
    "integrations", "observability", "sentry", "analytics", "llm", "preview";

  int32 health_port = 14 [
    (forge.v1.config) = {
      env_var: "HEALTH_PORT"
      flag: "health-port"
      default_value: "8081"
      description: "Health check endpoint port"
    },
    (buf.validate.field).int32 = {gte: 1, lte: 65535}
  ];
  int32 pprof_port = 15 [
    (forge.v1.config) = {
      env_var: "PPROF_PORT"
      flag: "pprof-port"
      default_value: "6060"
      description: "pprof debug server port (binds 127.0.0.1 only)"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {gte: 1, lte: 65535}
  ];

  // The rollout drain budget, read as ApiServerConfig's is (its comment has
  // the rules). Each role declares its own, so one role's may differ.
  google.protobuf.Duration pre_stop_delay = 18 [(forge.v1.config) = {
    env_var: "PRE_STOP_DELAY"
    default_value: "5s"
    description: "How long to keep serving after readiness flips at shutdown (negative: no pause)"
  }];
  google.protobuf.Duration shutdown_timeout = 19 [(forge.v1.config) = {
    env_var: "SHUTDOWN_TIMEOUT"
    default_value: "30s"
    description: "Budget for graceful shutdown after the pre-stop pause"
  }];

  // The probe paths on HEALTH_PORT, read as GatewayConfig's are (its comment
  // has the rules): /health and /ready are what control-plane probes
  // (RELIANT_PROBES), /healthz and /readyz forge's.
  string liveness_paths = 20 [(forge.v1.config) = {
    env_var: "LIVENESS_PATHS"
    default_value: "/health,/healthz"
    description: "Liveness probe paths on the health port (comma-separated)"
  }];
  string readiness_paths = 21 [(forge.v1.config) = {
    env_var: "READINESS_PATHS"
    default_value: "/ready,/readyz"
    description: "Readiness probe paths on the health port (comma-separated)"
  }];

  // How many workflow tasks this worker runs at once: fresh ones, the full
  // history replays a sticky-cache miss forces, and the replays a query on a
  // closed run forces. A replay is CPU-bound on one goroutine, so this is
  // roughly how many cores workflow code may take. Activities have their own
  // slots and are not counted here, which is the point of the cap: replays
  // queue instead of starving activities' DB calls past their deadlines. 0
  // derives it from the CPU budget (workersetup.WorkflowTaskSlots); 1 is
  // refused, because the Temporal SDK refuses it.
  int32 max_concurrent_workflow_tasks = 22 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS"
      description: "Workflow tasks (replays included) run at once; 0 derives max(2, GOMAXPROCS-1)"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {gte: 2}
  ];
  // How many goroutines long-poll Temporal for workflow tasks. The SDK runs
  // no more pollers than there are free workflow-task slots, so a value above
  // max_concurrent_workflow_tasks buys nothing. 1 is refused: the SDK splits
  // pollers between the sticky and the shared queue and needs two.
  int32 workflow_task_pollers = 23 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_WORKFLOW_TASK_POLLERS"
      default_value: "5"
      description: "Workflow-task pollers"
    },
    (buf.validate.field).int32 = {gte: 2}
  ];

  // Egress limits (internal/egresslimit): what one user, one destination host
  // and one conversation turn may push through the worker's server-side
  // egress tools (fetch, websearch, sourcegraph, integration actions such as
  // http__request). Prod egress shares one NAT address, so an unbounded
  // caller can get it banned or exhaust its ports for every tenant. A refused
  // call is a non-fatal tool result ("rate limited, retry after Ns"), never a
  // failed run.
  //
  // The per-minute and burst budgets are FLEET-wide quantities; state is in
  // process, so each replica enforces 1/egress_replicas of them. Set
  // egress_replicas to the worker's replica count; unset or 0 means 1 (the
  // whole budget per replica), so a fleet that forgets it admits up to
  // replicas times the budget. The worker logs the effective per-replica
  // budget at startup. The max_concurrent / parallel values bound one process
  // (and one node's NAT), so they are per replica and not divided.
  int32 egress_replicas = 24 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_REPLICAS"
      default_value: "1"
      description: "Worker replicas sharing the egress rate budgets (0: 1)"
    },
    (buf.validate.field).int32 = {gte: 0}
  ];
  int32 egress_user_per_minute = 25 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_USER_PER_MINUTE"
      default_value: "60"
      description: "Egress tool calls per minute per user, fleet-wide"
    },
    (buf.validate.field).int32 = {gte: 1}
  ];
  int32 egress_user_burst = 26 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_USER_BURST"
      default_value: "20"
      description: "Egress burst per user, fleet-wide"
    },
    (buf.validate.field).int32 = {gte: 1}
  ];
  int32 egress_user_max_concurrent = 27 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_USER_MAX_CONCURRENT"
      default_value: "6"
      description: "Egress calls in flight per user, per replica"
    },
    (buf.validate.field).int32 = {gte: 1}
  ];
  int32 egress_host_max_concurrent = 28 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_HOST_MAX_CONCURRENT"
      default_value: "16"
      description: "Egress calls in flight to one destination host, per replica"
    },
    (buf.validate.field).int32 = {gte: 1}
  ];
  int32 egress_turn_max_parallel = 29 [
    (forge.v1.config) = {
      env_var: "RELIANT_WORKER_EGRESS_TURN_MAX_PARALLEL"
      default_value: "4"
      description: "Egress calls of one conversation turn run at once, per replica (the rest wait)"
    },
    (buf.validate.field).int32 = {gte: 1}
  ];
}
