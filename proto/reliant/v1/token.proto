syntax = "proto3";

package reliant.v1;

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// TokenService is reliant's ONE surface for machine credentials. Every token
// it mints is an `rlat_` access token (forge/pkg/accesstoken) — the same
// credential control-plane issues; there is no reliant-specific family.
//
// It is a thin facade over the deployment's token authority
// (internal/tokenauthority): control-plane's access_tokens in a hosted
// deployment, reliant's own access_tokens table when self-hosted. Clients call
// ONE endpoint either way.
//
// Tokens act AS THE CALLER. The KIND picks the authority:
//   - TOKEN_KIND_DAEMON: daemon:connect — connects a daemon to the gateway.
//   - TOKEN_KIND_API:    reliant:api    — authenticates CLI/automation calls
//                        exactly as the caller's session would.
//
// Auth: minting requires an interactive session. A machine credential can
// never mint a credential — the general no-mint-beyond-your-scopes rule with
// token:write never granted. List and revoke accept the caller's API token too
// (strictly scoped to the caller), so headless automation can rotate itself.
service TokenService {
  // CreateToken mints a token acting as the caller. The raw secret is
  // returned exactly once. Session (JWT) only.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {}
  // ListTokens returns the caller's live tokens of one kind (or all kinds).
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {}
  // RevokeToken revokes one of the caller's tokens, immediately.
  //
  // For a token bound to a daemon this also disconnects that daemon: its
  // credential is permanent, so revocation is the only thing that ends its
  // authority, and leaving it connected would show a revoked token beside a
  // daemon that still looks healthy.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {}

  // UpdateToken changes one of the caller's tokens' name and/or permissions.
  //
  // THE SECRET IS NEVER REISSUED. A live daemon's permissions can be widened
  // or narrowed without re-registering it — which for a remote daemon would
  // mean a browser login it cannot perform — and the change is live on the
  // token's very next request, because authentication reads the row every
  // time. Rotation is deliberately NOT this operation: it is mint-new plus
  // revoke-old.
  //
  // New permissions are clipped to what the caller holds, exactly as a mint
  // is, so editing can never widen past the person's own authority.
  rpc UpdateToken(UpdateTokenRequest) returns (UpdateTokenResponse) {}

  // ExchangeToken trades the CALLING access token for a short-lived one that
  // carries only control-plane authority — what forge presents to the control
  // plane for `forge env deploy`, `forge secret`, `forge domain` and friends,
  // so a user signed in to Reliant never runs `forge login` as well.
  //
  // ATTENUATION ONLY. The minted token's scopes are the requested ones that are
  // exchangeable (deploy:*, secret:*, domain:*) AND held by the calling token:
  // a token may never grant authority it does not hold, so a credential issued
  // without deploy permission cannot become one that has it. Same acting user,
  // same org, same daemon binding, and it expires within an hour (sooner if the
  // caller does). The caller's own credential is never presented to the
  // control plane's deploy API, and never copied anywhere.
  //
  // audience must be this deployment's control plane: the endpoint comes from
  // a project's KCL, and a repository is not a trusted party. A mismatch mints
  // nothing.
  //
  // Machine credential only — the exchange needs a credential to attenuate. A
  // human session signs in with `forge login` or uses the web app.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse) {}
}

enum TokenKind {
  TOKEN_KIND_UNSPECIFIED = 0;
  TOKEN_KIND_DAEMON = 1;
  TOKEN_KIND_API = 2;
}

message CreateTokenRequest {
  string name = 1;        // Human-readable label (required)
  int64 ttl_seconds = 2;  // Lifetime in seconds; 0 means the token never expires
  TokenKind kind = 3;     // Required
}

// TokenInfo is a token's metadata. It never carries the secret or its hash.
// Timestamps are RFC 3339; empty means unset.
message TokenInfo {
  string id = 1;
  string name = 2;
  string token_prefix = 3;  // Display identifier, e.g. "rlat_A3f9Kd2p"
  string created_at = 4;
  string last_used_at = 5;
  string expires_at = 6;
  bool ephemeral = 8;
  string daemon_id = 9;     // Set when the token is bound to one daemon
  TokenKind kind = 10;
  // scopes are the permissions this credential carries
  // (forge/pkg/accesstoken), e.g. "daemon:connect", "deploy:write". A daemon
  // credential carries deploy, secret and domain authority so forge running
  // inside that daemon can act as the user (control-plane migration 00112).
  //
  // Surfaced because a permanent credential's PERMISSIONS are the thing a
  // user needs to audit: with no expiry to bound it, "what can this token
  // do" is the only remaining question, and a list that hides it cannot
  // answer it.
  repeated string scopes = 11;
}

message CreateTokenResponse {
  TokenInfo info = 1;
  string token = 2;  // Raw rlat_ token — shown once, never retrievable again
}

message ListTokensRequest {
  TokenKind kind = 1;  // UNSPECIFIED lists every kind
}

message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {}

message UpdateTokenRequest {
  string id = 1;
  // name renames the token; absent leaves it alone.
  optional string name = 2;
  // scopes replaces the token's permissions with this COMPLETE set. Absent
  // leaves them alone — which is why it is a wrapper and not a bare repeated
  // field: an empty repeated field is indistinguishable from an omitted one,
  // so a rename would silently strip every permission.
  optional ScopeList scopes = 3;
}

// ScopeList wraps a permission list so "not set" and "set to empty" differ.
message ScopeList {
  repeated string scopes = 1;
}

message UpdateTokenResponse {
  TokenInfo info = 1;
}

message ExchangeTokenRequest {
  // audience is the control-plane origin the minted token will be presented
  // to, e.g. "https://admin.reliantapi.com". It must be this deployment's
  // authorization server.
  string audience = 1;
  // scopes requested. Empty asks for every exchangeable scope the calling
  // token holds.
  repeated string scopes = 2;
}

message ExchangeTokenResponse {
  string token = 1;         // Raw rlat_ token — returned once
  string token_prefix = 2;  // Display identifier, e.g. "rlat_A3f9Kd2p"
  string expires_at = 3;    // RFC 3339
  repeated string scopes = 4;  // What was actually granted
}
