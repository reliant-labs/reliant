syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// PullRequestRecordService reads PR records: the pull requests of the
// repositories Reliant keeps records for, mirrored from the provider's
// verified webhook deliveries (dev-docs/pr-records.md). A record holds facts
// (state, head, labels, the pipeline markers of its reviews, the check runs
// on its heads); a head's verdict is computed when it is read, under the
// caller's own policy (trusted_authors), so the records encode no pipeline's
// rules.
//
// Who may read: a caller whose own GitHub credential recently reported the
// repository as visible to them (the access grant that routes the
// repository's events to their triggers). Anyone else gets NotFound.
//
// Phase 1 is a shadow beside the review labels: nothing decides from it yet.
service PullRequestRecordService {
  // GetPullRequestRecord returns one pull request's record, its heads, and its
  // current head's review markers, checks and verdict.
  rpc GetPullRequestRecord(GetPullRequestRecordRequest) returns (GetPullRequestRecordResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListPullRequestRecords lists one repository's records in number order,
  // each with its current head's checks and verdict.
  rpc ListPullRequestRecords(ListPullRequestRecordsRequest) returns (ListPullRequestRecordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// VerdictPolicy is whose review markers count, the caller's choice. An entry
// matches a review author's login (case-insensitive) or numeric id.
message VerdictPolicy {
  // trusted_authors may post a head's verdict. Empty: no verdict is computed.
  repeated string trusted_authors = 1;
  // rereview_authors may re-decide a head by an evidence re-review.
  repeated string rereview_authors = 2;
}

message GetPullRequestRecordRequest {
  // repository is owner/name.
  string repository = 1 [(buf.validate.field).required = true];
  int32 number = 2;
  VerdictPolicy policy = 3;
}

message GetPullRequestRecordResponse {
  PullRequestRecord record = 1;
  // heads are every head the pull request has had, oldest first.
  repeated PullRequestHead heads = 2;
  // reviews are the pipeline markers of reviews on the current head.
  repeated PullRequestReviewMarker reviews = 3;
}

message ListPullRequestRecordsRequest {
  // repository is owner/name.
  string repository = 1 [(buf.validate.field).required = true];
  // state narrows to open, closed or merged.
  optional string state = 2;
  // page_size is at most 200; 0 is 100.
  int32 page_size = 3;
  // page_token is a previous response's next_page_token.
  string page_token = 4;
  VerdictPolicy policy = 5;
}

message ListPullRequestRecordsResponse {
  repeated PullRequestRecord records = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

// PullRequestRecord is one pull request as last observed.
message PullRequestRecord {
  string provider = 1;
  string repository = 2;
  string repository_id = 3;
  int32 number = 4;
  // state is open, closed or merged.
  string state = 5;
  bool draft = 6;
  string title = 7;
  string author_login = 8;
  string head_sha = 9;
  string head_ref = 10;
  string base_ref = 11;
  string base_sha = 12;
  // labels are the labels as last observed: a display, never state.
  repeated string labels = 13;
  google.protobuf.Timestamp merged_at = 14;
  string merge_commit_sha = 15;
  // snapshot_at is the pull request's own updated_at in the newest snapshot
  // applied.
  google.protobuf.Timestamp snapshot_at = 16;
  // observed_at is when Reliant last applied anything to the record.
  google.protobuf.Timestamp observed_at = 17;
  // verdict is the current head's verdict under the request's policy.
  PullRequestVerdict verdict = 18;
  // checks are the check runs on the current head (the newest run of each).
  repeated PullRequestCheck checks = 19;
}

// PullRequestVerdict is a head's one verdict: the first passed-or-changes
// marker on a review of exactly that head by a trusted author, unless an
// evidence re-review by a re-review author re-decided it.
message PullRequestVerdict {
  // kind is passed, changes, or empty for no verdict yet.
  string kind = 1;
  string review_id = 2;
  string author_login = 3;
  google.protobuf.Timestamp submitted_at = 4;
  bool rereview = 5;
}

message PullRequestHead {
  string sha = 1;
  // previous_sha is the head a push replaced, when known.
  string previous_sha = 2;
  google.protobuf.Timestamp first_seen_at = 3;
  google.protobuf.Timestamp superseded_at = 4;
}

message PullRequestReviewMarker {
  string review_id = 1;
  string commit_sha = 2;
  string marker_sha = 3;
  // kind is passed, changes, close or rereview.
  string kind = 4;
  string of_review_id = 5;
  string author_login = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message PullRequestCheck {
  string name = 1;
  string app_slug = 2;
  int64 check_run_id = 3;
  string status = 4;
  string conclusion = 5;
  google.protobuf.Timestamp completed_at = 6;
}
