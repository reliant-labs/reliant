syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "reliant/v1/common.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// Recovery metadata contains no credentials or file bytes. Remote branches
// inherit repository visibility and remain until explicit deletion.
message WorktreeRecovery {
  string id = 1;
  string source_worktree_id = 2;
  string project_id = 3;
  string daemon_id = 4;
  string capture_id = 5;
  string phase = 6;
  string last_error = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated WorktreeRecoveryCheckout checkouts = 10;
  // Durable retry identity; contains no credentials or file content.
  string operation = 11;
  string operation_key = 12;
  string target_daemon_id = 13;
}

message WorktreeRecoveryCheckout {
  string repo_id = 1;
  string rel = 2;
  string remote_url = 3;
  string recovery_ref = 4;
  string commit_oid = 5;
  string manifest_digest = 6;
  string phase = 7;
  string last_error = 8;
}

message ListWorktreeRecoveriesRequest {
  optional string project_id = 1;
  optional string source_worktree_id = 2;
}
message ListWorktreeRecoveriesResponse {
  repeated WorktreeRecovery recoveries = 1;
}
message RestoreWorktreeRecoveryRequest {
  string recovery_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_daemon_id = 2 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 3 [(buf.validate.field).string.min_len = 1];
}
message RestoreWorktreeRecoveryResponse {
  WorktreeRecovery recovery = 1;
  string worktree_id = 2;
}
message DeleteWorktreeRecoveryRequest {
  string recovery_id = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 2 [(buf.validate.field).string.min_len = 1];
}
message DeleteWorktreeRecoveryResponse {
  WorktreeRecovery recovery = 1;
}

// WorktreeStatus tracks the lifecycle of a worktree
enum WorktreeStatus {
  WORKTREE_STATUS_UNSPECIFIED = 0;
  WORKTREE_STATUS_ACTIVE = 1;
  WORKTREE_STATUS_COMPLETED = 2;
  WORKTREE_STATUS_ABANDONED = 3;
  WORKTREE_STATUS_MERGING = 4;
  // CREATING is written before any daemon work starts, so CreateWorktree can
  // return immediately and the caller has a row to render. Creation spans
  // 30-120s across repos; holding the response open for that long meant a
  // client that disconnected (a phone backgrounding, a flaky network) killed
  // the request context and aborted the work mid-flight.
  WORKTREE_STATUS_CREATING = 5;
  // FAILED records a creation that did not complete. The row is deliberately
  // kept rather than deleted: a visible failure the user can retry or dismiss
  // is more honest than a workspace that silently never appears.
  WORKTREE_STATUS_FAILED = 6;
}

// WorktreeService handles worktree-related operations
service WorktreeService {
  // Owner-scoped durable recovery catalog, independent of source row lifetime.
  // forge:custom — owner authorization and retained catalog semantics.
  rpc ListWorktreeRecoveries(ListWorktreeRecoveriesRequest) returns (ListWorktreeRecoveriesResponse) {}
  // Restores into a separate worktree; never resets an existing branch.
  rpc RestoreWorktreeRecovery(RestoreWorktreeRecoveryRequest) returns (RestoreWorktreeRecoveryResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "restore"
        target: {
          kind: "worktree_recovery"
          id: "recovery_id"
        }
        detail: ["response.worktree_id", "target_daemon_id"]
      }
    };
  }
  // Explicit exact-ref deletion only; not called on source removal or restore.
  // forge:custom — journals exact remote ref deletion; never CRUD row deletion.
  rpc DeleteWorktreeRecovery(DeleteWorktreeRecoveryRequest) returns (DeleteWorktreeRecoveryResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "delete"
        target: {
          kind: "worktree_recovery"
          id: "recovery_id"
        }
        detail: ["response.recovery.phase"]
      }
    };
  }
  // CRUD Operations
  // CreateWorktree creates ONE workspace-level worktree for the project.
  // The daemon enumerates the project's nested repos and fans out N
  // git-worktree creations into <workspace_dir>/<repo.relative_path>/. The
  // returned Worktree row spans the whole workspace; tools scope to a nested
  // repo via the per-call `repo` param, not via per-repo worktree rows.
  // forge:custom — places the workspace on a machine and creates its checkouts there after it returns
  rpc CreateWorktree(CreateWorktreeRequest) returns (CreateWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "create"
        target: {
          kind: "worktree"
          id: "response.worktree.id"
          label: "response.worktree.name"
        }
        detail: ["project_id", "response.worktree.branch"]
      }
    };
  }
  // forge:custom — authorizes through the project, and creates its main worktree when none exists
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse) {}
  // ListArchivedWorktrees pages through the project's archived workspaces,
  // most recently archived first. Archived workspaces are never part of
  // ListWorktrees: only the archived view asks for them.
  // forge:custom — authorizes through the project and reads only archived rows
  rpc ListArchivedWorktrees(ListArchivedWorktreesRequest) returns (ListArchivedWorktreesResponse) {}
  // forge:custom — authorizes through the worktree's project before it reads
  rpc GetWorktree(GetWorktreeRequest) returns (GetWorktreeResponse) {}
  // forge:custom — a partial update authorized through the worktree's project
  rpc UpdateWorktree(UpdateWorktreeRequest) returns (UpdateWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "update"
        target: {
          kind: "worktree"
          id: "worktree_id"
          label: "response.worktree.name"
        }
      }
    };
  }
  // forge:custom — archives a live worktree, and deletes an archived one only once its machine removed the directory
  rpc DeleteWorktree(DeleteWorktreeRequest) returns (DeleteWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "delete"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["response.is_permanent_delete", "response.deleted_branch"]
      }
    };
  }
  rpc ArchiveWorktree(ArchiveWorktreeRequest) returns (ArchiveWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "archive"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["response.deleted_branch"]
      }
    };
  }
  rpc UnarchiveWorktree(UnarchiveWorktreeRequest) returns (UnarchiveWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "unarchive"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
      }
    };
  }
  
  // Import/Discovery Operations
  rpc ImportWorktree(ImportWorktreeRequest) returns (ImportWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "import"
        target: {
          kind: "worktree"
          id: "response.worktree.id"
          label: "response.worktree.name"
        }
        detail: ["project_id", "repo_id"]
      }
    };
  }
  // DiscoverWorktrees only reads (git worktree list in each repo), and says so
  // with NO_SIDE_EFFECTS: forge then generates a useQuery for it, so the
  // discovered list lives in the query cache under worktreeServiceKeys.
  rpc DiscoverWorktrees(DiscoverWorktreesRequest) returns (DiscoverWorktreesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PruneWorktrees runs `git worktree prune` in each repo of the project. It
  // only drops records whose directories are already gone; it never touches a
  // directory that exists. Explicit user action only, never automatic.
  rpc PruneWorktrees(PruneWorktreesRequest) returns (PruneWorktreesResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "prune_worktrees"
        target: {
          kind: "project"
          id: "project_id"
        }
      }
    };
  }
  rpc RecreateWorktree(RecreateWorktreeRequest) returns (RecreateWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "recreate"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["response.branch"]
      }
    };
  }
  
  // Git Read Operations
  rpc GetWorktreeChanges(GetWorktreeChangesRequest) returns (GetWorktreeChangesResponse) {}
  rpc GetWorktreeGitStatus(GetWorktreeGitStatusRequest) returns (GetWorktreeGitStatusResponse) {}
  rpc GetWorktreeCommits(GetWorktreeCommitsRequest) returns (GetWorktreeCommitsResponse) {}
  // ListWorktreeRepoStatuses returns per-repo git status for every nested
  // repo in the worktree's project. Drives the right-sidebar grouped view.
  // Single-repo and zero-repo projects collapse to a single-element (or empty)
  // response so callers don't need a special case.
  rpc ListWorktreeRepoStatuses(ListWorktreeRepoStatusesRequest) returns (ListWorktreeRepoStatusesResponse) {}

  // Git Write Operations
  rpc StageFiles(StageFilesRequest) returns (StageFilesResponse) {
    option (forge.v1.method) = {
      activity: {none: "git index edit through the daemon: the commit that follows is the event, and git records it"}
    };
  }
  rpc UnstageFiles(UnstageFilesRequest) returns (UnstageFilesResponse) {
    option (forge.v1.method) = {
      activity: {none: "git index edit through the daemon: undoes a stage, and the repository's history never sees it"}
    };
  }
  rpc RevertFiles(RevertFilesRequest) returns (RevertFilesResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "revert_files"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["repo_id"]
      }
    };
  }
  rpc CommitWorktree(CommitWorktreeRequest) returns (CommitWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "commit"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["repo_id"]
      }
    };
  }
  rpc PushWorktree(PushWorktreeRequest) returns (PushWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "push"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["repo_id"]
      }
    };
  }
  rpc PullWorktree(PullWorktreeRequest) returns (PullWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "pull"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["repo_id"]
      }
    };
  }
  rpc GetWorktreePR(GetWorktreePRRequest) returns (GetWorktreePRResponse) {}
  rpc CreateWorktreePR(CreateWorktreePRRequest) returns (CreateWorktreePRResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "create_pr"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
        detail: ["repo_id", "response.pr_url"]
      }
    };
  }
}

// =============================================================================
// Core Message Types
// =============================================================================

// Worktree represents a workspace-level git worktree in the system. Path
// points at a workspace dir containing N nested checkouts (one per Repo) at
// <Path>/<repo.relative_path>/.
message Worktree {
  string id = 1;
  string name = 2;
  string path = 3;
  string branch = 4;
  string base_branch = 5;
  string project_id = 6;
  optional string chat_id = 7;
  WorktreeStatus status = 8;
  bool is_main = 9;
  string created_at = 10;
  string updated_at = 11;
  string last_active = 12;
  optional string deleted_at = 13;  // Archive timestamp
  optional CleanupMetadata cleanup_metadata = 14;
  // Why creation failed, in words the user can act on ("base branch 'x'
  // doesn't exist in reliant — check the name ..."). Set only when status is
  // FAILED and the reason is the user's to fix; empty otherwise, including for
  // a failure on our side.
  string failure_reason = 15;
}

// WorktreeSummary is the part of a worktree a chat list renders and groups by.
// ListChats carries one per chat so the sidebar never needs the project's full
// worktree list: the cost of showing chats scales with the chats, not with the
// workspaces agents have created.
message WorktreeSummary {
  string id = 1;
  string name = 2;
  string branch = 3;
  // Empty while the workspace is still being created.
  string path = 4;
  bool is_main = 5;
  WorktreeStatus status = 6;
  // Archive timestamp; unset for a live workspace.
  optional string deleted_at = 7;
  // The project the workspace belongs to, so a list spanning projects can
  // group by it.
  string project_id = 8;
}

// CleanupMetadata tracks what was cleaned up during archive
message CleanupMetadata {
  bool directory_deleted = 1;
  bool branch_deleted = 2;
  // Set while the machine is holding the directory: "dirty", "unpushed",
  // "in_use", "unverified", "data" (ignored files that are not rebuildable),
  // "nested-repository", "files-outside-checkout", "shared-with-live-workspace"
  // (an open workspace's directory or checkout is inside it) or "quarantined"
  // (a checkout parked under the worktree root's .reclaim directory, still
  // locked; the detail names the path). Cleared once the
  // directory is removed.
  string held_reason = 3;
  string held_detail = 4;
  int64 size_bytes = 5;
  // Local refs holding work saved before the directory was removed. Kept until
  // a restore has applied them.
  repeated string snapshot_refs = 6;
  // Regenerable files (node_modules, build output, tool caches, tmp/) the
  // machine deleted from a directory it kept for its work, relative to the
  // workspace root, and at least how many bytes that freed. Restoring the
  // workspace needs its install/generate step run again.
  repeated string stripped_paths = 7;
  int64 stripped_bytes = 8;
}

// DiscoveredWorktree is a linked git worktree of one of the project's repos
// that Reliant did not make and does not track — typically a checkout made by
// hand with `git worktree add`. Registered worktrees (archived ones included),
// Reliant's own workspaces and the repos' main checkouts are never reported.
message DiscoveredWorktree {
  reserved 4, 5, 6;
  reserved "is_imported", "is_prunable", "imported_id";

  // Absolute path of the checkout.
  string path = 1;
  // Suggested worktree name (the directory's base name).
  string name = 2;
  // Checked-out branch; empty when HEAD is detached.
  string branch = 3;
  // The project repo this checkout belongs to.
  string repo_id = 7;
  string repo_name = 8;
  // HEAD commit.
  string head = 9;
  // git refuses to move a locked worktree; import surfaces that refusal.
  bool locked = 10;
  // True when importing it moves the directory into a new workspace under
  // workspaces_root (a multi-repo project), false when it is registered in
  // place (a single-repo project). The client must confirm a move.
  bool moves_on_import = 11;
}

// StaleWorktree is git's record of a linked worktree whose directory no longer
// exists (`git worktree list` reports it prunable).
message StaleWorktree {
  string path = 1;
  string repo_id = 2;
  string repo_name = 3;
  // git's prunable reason, e.g. "gitdir file points to non-existent location".
  string reason = 4;
}

// GitCommit represents a git commit
message GitCommit {
  string hash = 1;
  string short_hash = 2;
  string author = 3;
  string email = 4;
  string date = 5;
  string message = 6;
}

// WorktreeFileChange represents a changed file in a worktree
message WorktreeFileChange {
  string path = 1;
  FileChangeStatus status = 2;
  bool is_new = 3;
  string diff = 4;
  bool is_binary = 5;  // true if file is binary (diff will be empty or placeholder)
}

// =============================================================================
// CRUD Request/Response Messages
// =============================================================================

// CreateWorktreeRequest creates a workspace-level worktree spanning all of
// the project's nested repos. Each repo gets its own git-worktree checkout at
// <workspace_dir>/<repo.relative_path>/, sharing name + branch. All-or-nothing:
// any per-repo failure rolls back the whole workspace.
message CreateWorktreeRequest {
  string name = 1;
  string branch = 2;
  string project_id = 3;
  // base_branch is the global fallback when a repo has no entry in
  // base_branches. Empty falls through to per-repo default-branch detection
  // (gh -> git remote show -> main/master probe).
  optional string base_branch = 4;
  optional string chat_id = 5;
  // copy_files are EXACT paths relative to the workspace root (the project
  // root, or source_worktree_id's root), each copied to the same place in the
  // new workspace — typically gitignored pieces a checkout lacks. Nothing is
  // searched for: ".env" is the root .env, "api/.env" the api repo's.
  // Directories are copied whole; a missing path is skipped. Absolute paths
  // and paths that leave the root are rejected with INVALID_ARGUMENT.
  repeated string copy_files = 6;
  bool force = 7;
  // source_worktree_id, when set, is used as the file-copy source instead of
  // the live project repo dirs. The corresponding nested checkout inside that
  // workspace is used per repo.
  optional string source_worktree_id = 8;
  // base_branches overrides base_branch on a per-repo basis. Key is repo_id.
  // Missing/empty entry -> fall back to base_branch -> fall back to repo default.
  map<string, string> base_branches = 9;
  // idempotency_key makes a retried create safe. Creation is asynchronous, so
  // a client that loses the response has no way to tell "it failed" from "it
  // succeeded and the reply was dropped" — without this, the natural retry
  // produces a second workspace. Repeat the same key to get the existing row
  // back instead.
  optional string idempotency_key = 10;
}

// CreateWorktreeResponse returns the created workspace-level worktree.
message CreateWorktreeResponse {
  Worktree worktree = 1;
}

// ListWorktreesRequest lists worktrees with filters
message ListWorktreesRequest {
  string project_id = 1 [(buf.validate.field).required = true]; // Required
  optional string chat_id = 2;
  // Page size; 0 means the server default (100).
  int32 limit = 3;
  // Archived workspaces are listed by ListArchivedWorktrees.
  reserved 4;
  reserved "include_archived";
  // Continues a previous response's next_page_token. Opaque. Pages are ordered
  // main workspace first, then by last_active descending.
  optional string page_token = 5;
  // When true, return only the project's main workspace (creating it if the
  // project has none). The cheap way to find main without paging the list.
  bool main_only = 6;
}

// ListWorktreesResponse returns a page of worktrees
message ListWorktreesResponse {
  repeated Worktree worktrees = 1;
  // Number of worktrees in this page.
  int32 total = 2;
  // Set when more worktrees follow; pass it as page_token. Empty on the last page.
  string next_page_token = 3;
}

// ListArchivedWorktreesRequest pages through a project's archived workspaces.
message ListArchivedWorktreesRequest {
  string project_id = 1 [(buf.validate.field).required = true]; // Required
  // Page size; 0 means the server default (100).
  int32 limit = 2;
  // Continues a previous response's next_page_token. Opaque. Pages are ordered
  // most recently archived first.
  optional string page_token = 3;
}

// ListArchivedWorktreesResponse returns a page of archived worktrees
message ListArchivedWorktreesResponse {
  repeated Worktree worktrees = 1;
  // Number of worktrees in this page.
  int32 total = 2;
  // Set when more follow; pass it as page_token. Empty on the last page.
  string next_page_token = 3;
}

// GetWorktreeRequest retrieves a worktree by ID
message GetWorktreeRequest {
  string worktree_id = 1;
}

// GetWorktreeResponse returns the requested worktree
message GetWorktreeResponse {
  Worktree worktree = 1;
}

// UpdateWorktreeRequest updates a worktree
message UpdateWorktreeRequest {
  string worktree_id = 1;
  optional string name = 2;
  optional WorktreeStatus status = 3;
  optional string base_branch = 4;
}

// UpdateWorktreeResponse returns the updated worktree
message UpdateWorktreeResponse {
  Worktree worktree = 1;
}

// DeleteWorktreeRequest deletes or archives a worktree
message DeleteWorktreeRequest {
  string worktree_id = 1;
  bool delete_git_branch = 3;
}

// DeleteWorktreeResponse confirms deletion/archive
message DeleteWorktreeResponse {
  string message = 1;
  bool deleted_branch = 2;
  bool is_permanent_delete = 3;
}

// ArchiveWorktreeRequest archives a worktree (sets deleted_at)
message ArchiveWorktreeRequest {
  string worktree_id = 1;
  bool delete_git_branch = 3;
}

// ArchiveWorktreeResponse confirms archive
message ArchiveWorktreeResponse {
  string message = 1;
  bool deleted_branch = 2;
}

// UnarchiveWorktreeRequest restores an archived worktree
message UnarchiveWorktreeRequest {
  string worktree_id = 1;
}

// UnarchiveWorktreeResponse confirms unarchive
message UnarchiveWorktreeResponse {
  string message = 1;
}

// =============================================================================
// Import/Discovery Request/Response Messages
// =============================================================================

// ImportWorktreeRequest adopts a discovered worktree as a Reliant workspace.
// In a single-repo project the checkout is registered where it is. In a
// multi-repo project it is moved (`git worktree move`) into a new workspace
// directory and the project's other repos get checkouts beside it, so the
// result is the same workspace the UI creates.
message ImportWorktreeRequest {
  // Absolute path of the checkout, as reported by DiscoverWorktrees.
  string path = 1;
  string project_id = 2;
  optional string name = 3;
  optional string chat_id = 4;
  // The project repo the checkout belongs to (DiscoveredWorktree.repo_id).
  string repo_id = 5;
  // Must be true when the import moves the directory
  // (DiscoveredWorktree.moves_on_import): the user has been told that
  // anything running inside it loses its working directory.
  bool confirm_move = 6;
}

// ImportWorktreeResponse returns the imported worktree
message ImportWorktreeResponse {
  Worktree worktree = 1;
}

// DiscoverWorktreesRequest lists the project's untracked git worktrees.
message DiscoverWorktreesRequest {
  string project_id = 1;
  // A background caller (the sidebar hint) must not wake a sleeping machine:
  // when true and the machine is asleep, the call fails with Unavailable and
  // nothing is woken. A user opening the discover dialog leaves it false.
  bool background = 2;
}

// DiscoverWorktreesResponse returns the untracked worktrees of every repo of
// the project, and git's stale records separately.
message DiscoverWorktreesResponse {
  reserved 2;
  reserved "total";

  repeated DiscoveredWorktree discovered = 1;
  repeated StaleWorktree stale = 3;
  // Directory new workspaces are created in, for display in a move
  // confirmation (e.g. ~/.reliant/worktrees/<project>).
  string workspaces_root = 4;
}

// PruneWorktreesRequest removes git's records of the project's worktrees
// whose directories no longer exist.
message PruneWorktreesRequest {
  string project_id = 1;
}

// PruneWorktreesResponse lists the records that were removed.
message PruneWorktreesResponse {
  repeated StaleWorktree pruned = 1;
}

// RecreateWorktreeRequest recreates an archived worktree from its branch
message RecreateWorktreeRequest {
  string worktree_id = 1;
}

// RecreateWorktreeResponse confirms recreation
message RecreateWorktreeResponse {
  string message = 1;
  string path = 2;
  string branch = 3;
  // snapshot_warning is set when saved work could not be put back (for example
  // because the branch moved). The work is still on snapshot_refs.
  string snapshot_warning = 4;
  // snapshot_refs are the refs still holding saved work that was not applied.
  repeated string snapshot_refs = 5;
}

// =============================================================================
// Git Read Operations Request/Response Messages
// =============================================================================

// GetWorktreeChangesRequest gets file changes for a worktree.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior).
message GetWorktreeChangesRequest {
  string worktree_id = 1;
  string repo_id = 2;
}

// GetWorktreeChangesResponse returns file changes
message GetWorktreeChangesResponse {
  string branch = 1;
  repeated WorktreeFileChange files = 2;
  int32 total_files = 3;
  int32 ahead = 4;
  int32 behind = 5;
  string default_branch = 6;  // Repository's default branch (for PR targeting)
}

// GetWorktreeGitStatusRequest gets git status for a worktree.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior).
message GetWorktreeGitStatusRequest {
  string worktree_id = 1;
  string repo_id = 2;
}

// GetWorktreeGitStatusResponse returns git status
message GetWorktreeGitStatusResponse {
  string worktree_id = 1;
  string path = 2;
  string branch = 3;
  bool clean = 4;
  bool has_changes = 5;
  repeated string staged_files = 6;
  repeated string modified_files = 7;
  repeated string untracked_files = 8;
  int32 ahead = 9;
  int32 behind = 10;
}

// GetWorktreeCommitsRequest gets commit history for a worktree.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior).
message GetWorktreeCommitsRequest {
  string worktree_id = 1;
  int32 limit = 2;  // Default 20, max 100
  string repo_id = 3;
}

// ListWorktreeRepoStatusesRequest fans the per-repo git status across every
// nested repo in the worktree's project.
message ListWorktreeRepoStatusesRequest {
  string worktree_id = 1 [(buf.validate.field).required = true];
}

// WorktreeRepoStatus is the per-repo status row inside the aggregator
// response. Mirrors the bits the right-sidebar needs to render a grouped
// "this repo has N changes, ahead X behind Y" header.
message WorktreeRepoStatus {
  string repo_id = 1;
  string repo_name = 2;
  string repo_relative_path = 3;
  string current_branch = 4;
  bool has_changes = 5;
  int32 ahead = 6;
  int32 behind = 7;
  int32 changed_files = 8;
  // error is set when this repo's status read failed; the row is still
  // returned so the UI can show "couldn't read this one" without blowing up
  // the whole list.
  string error = 9;
}

// ListWorktreeRepoStatusesResponse fans status across nested repos.
message ListWorktreeRepoStatusesResponse {
  repeated WorktreeRepoStatus statuses = 1;
}

// GetWorktreeCommitsResponse returns commit history
message GetWorktreeCommitsResponse {
  repeated GitCommit commits = 1;
  int32 total = 2;
  string branch = 3;
  string base_branch = 4;
  bool comparison_mode = 5;
  string comparison_ref = 6;
  string current_branch = 7;
}

// =============================================================================
// Git Write Operations Request/Response Messages
// =============================================================================

// StageFilesRequest stages files in a worktree.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. Files are paths relative to the targeted repo.
message StageFilesRequest {
  string worktree_id = 1;
  repeated string files = 2;  // Empty or ["."] means stage all
  string repo_id = 3;
}

// StageFilesResponse confirms staging
message StageFilesResponse {
  string message = 1;
  repeated string files = 2;
}

// UnstageFilesRequest unstages files in a worktree.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. Files are paths relative to the targeted repo.
message UnstageFilesRequest {
  string worktree_id = 1;
  repeated string files = 2;  // Empty or ["."] means unstage all
  string repo_id = 3;
}

// UnstageFilesResponse confirms unstaging
message UnstageFilesResponse {
  string message = 1;
  repeated string files = 2;
}

// RevertFilesRequest reverts/discards file changes
// For staged files: unstages and discards changes
// For modified files: discards working tree changes  
// For untracked files: deletes the file
message RevertFilesRequest {
  string worktree_id = 1;
  repeated string files = 2;  // File paths to revert
  string repo_id = 3;
}

// RevertFilesResponse confirms revert
message RevertFilesResponse {
  string message = 1;
  repeated string files = 2;
}

// CommitWorktreeRequest commits staged changes.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. Commits are intrinsically per-repo.
message CommitWorktreeRequest {
  string worktree_id = 1;
  string message = 2;
  string repo_id = 3;
}

// CommitWorktreeResponse confirms commit
message CommitWorktreeResponse {
  string message = 1;
  string output = 2;
}

// PushWorktreeRequest pushes commits to remote.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. Push is per-repo (each repo has its own remote).
message PushWorktreeRequest {
  string worktree_id = 1;
  string repo_id = 2;
}

// PushWorktreeResponse confirms push
message PushWorktreeResponse {
  string message = 1;
  string output = 2;
}

// PullWorktreeRequest pulls changes from remote.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. Pull is per-repo (each repo has its own remote).
message PullWorktreeRequest {
  string worktree_id = 1;
  string repo_id = 2;
}

// PullWorktreeResponse confirms pull
message PullWorktreeResponse {
  string message = 1;
  string output = 2;
}

// GetWorktreePRRequest checks for existing PR.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. PRs are intrinsically per-repo.
message GetWorktreePRRequest {
  string worktree_id = 1;
  string repo_id = 2;
}

// GetWorktreePRResponse returns PR info if exists
message GetWorktreePRResponse {
  bool exists = 1;
  optional string url = 2;
  optional int32 number = 3;
  optional string title = 4;
  optional string state = 5;  // "OPEN", "CLOSED", "MERGED"
}

// CreateWorktreePRRequest creates a pull request.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo. PR creation is intrinsically per-repo.
message CreateWorktreePRRequest {
  string worktree_id = 1;
  string title = 2;
  optional string body = 3;
  string repo_id = 4;
}

// CreateWorktreePRResponse confirms PR creation
message CreateWorktreePRResponse {
  string message = 1;
  string pr_url = 2;
  string output = 3;
  bool auto_committed = 4;
  bool auto_pushed = 5;
}