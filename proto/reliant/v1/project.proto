syntax = "proto3";

package reliant.v1;

import "reliant/v1/common.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ProjectService handles project-related operations
service ProjectService {
  // CreateProject creates a new project
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {}
  
  // ListProjects lists all projects for the current user
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {}
  
  // GetProject retrieves a project by ID
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {}
  
  // UpdateProject updates an existing project
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {}
  
  // DeleteProject deletes a project
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {}
  
  // TouchProject updates the project's last_active timestamp
  rpc TouchProject(TouchProjectRequest) returns (TouchProjectResponse) {}
  
  // GetProjectMetadata returns detailed project metadata
  rpc GetProjectMetadata(GetProjectMetadataRequest) returns (GetProjectMetadataResponse) {}
  
  // UpdateProjectMetadata updates project metadata
  rpc UpdateProjectMetadata(UpdateProjectMetadataRequest) returns (UpdateProjectMetadataResponse) {}
  
  // GetProjectGitInfo returns git repository information for a project
  rpc GetProjectGitInfo(GetProjectGitInfoRequest) returns (GetProjectGitInfoResponse) {}
  
  // GetProjectGitBranches lists all git branches for a project
  rpc GetProjectGitBranches(GetProjectGitBranchesRequest) returns (GetProjectGitBranchesResponse) {}
  
  // GetProjectInitStatus returns the initialization status of a project
  rpc GetProjectInitStatus(GetProjectInitStatusRequest) returns (GetProjectInitStatusResponse) {}
  
  // InitializeProject initializes a project (no-op in V2, projects are initialized on creation)
  rpc InitializeProject(InitializeProjectRequest) returns (InitializeProjectResponse) {}
  
  // GetProjectChanges returns recent git changes for a project
  rpc GetProjectChanges(GetProjectChangesRequest) returns (GetProjectChangesResponse) {}
  
  // GetProjectPrompts retrieves project-scoped prompts
  rpc GetProjectPrompts(GetProjectPromptsRequest) returns (GetProjectPromptsResponse) {}
  
  // SaveProjectPrompts saves project-scoped prompts
  rpc SaveProjectPrompts(SaveProjectPromptsRequest) returns (SaveProjectPromptsResponse) {}
  
  // InitializeGitRepo initializes a git repository for a project
  rpc InitializeGitRepo(InitializeGitRepoRequest) returns (InitializeGitRepoResponse) {}

  // ListProjectDaemonsForDaemon returns the project_daemons rows installed on
  // the given daemon. The ProjectPicker uses this to mark projects that are
  // (or aren't) cloned on the user's currently-active daemon.
  rpc ListProjectDaemonsForDaemon(ListProjectDaemonsForDaemonRequest) returns (ListProjectDaemonsForDaemonResponse) {}

  // ListProjectDaemons returns every project_daemons row across all the
  // caller's daemons. The ProjectPicker uses this to render badges that name
  // *which* daemon(s) a project lives on (vs the leaner per-daemon view that
  // can only answer "installed here or not"). User-scoped: filtered to
  // projects owned by the calling user.
  rpc ListProjectDaemons(ListProjectDaemonsRequest) returns (ListProjectDaemonsResponse) {}

  // MarkProjectInstalled records that a project has a clone on a daemon.
  // Idempotent — re-running with the same (project, daemon) updates the
  // path/branch.
  //
  // Prefer CreateProjectFromRepo for the add-a-project-from-GitHub flow; this
  // remains for callers that cloned by some other route and only need to
  // record the result.
  rpc MarkProjectInstalled(MarkProjectInstalledRequest) returns (MarkProjectInstalledResponse) {}

  // CreateProjectFromRepo adds a GitHub repository as a project on a daemon:
  // it starts the clone, creates the project row, and records where the
  // checkout will live — in one call, in one place.
  //
  // It replaces a four-call client chain (ListGitRepos -> CloneRepo ->
  // CreateProject -> MarkProjectInstalled) whose steps could each fail
  // independently, leaving a project with no clone or a clone with no
  // project, with no server-side record that the sequence was ever started.
  //
  // It is honest about what has happened. The clone is dispatched to the
  // daemon through the control plane, which QUEUES it durably rather than
  // waiting — so a machine that is asleep or still booting is a perfectly
  // good target, and the response says `queued` with the project in its
  // `installing` state. The real outcome arrives later, when the daemon runs
  // the command, and moves the project to `installed` or `failed`.
  rpc CreateProjectFromRepo(CreateProjectFromRepoRequest) returns (CreateProjectFromRepoResponse) {}

  // ListRepositoriesForDaemon returns the projects cloned on the given daemon,
  // denormalized with project metadata (name, remote_url) so admin callers
  // can render a "Repositories" table without a follow-up GetProject for each
  // row. Filtered to projects owned by the calling user.
  rpc ListRepositoriesForDaemon(ListRepositoriesForDaemonRequest) returns (ListRepositoriesForDaemonResponse) {}

  // PullProjectOnDaemon runs `git pull` for the project's clone on a daemon.
  // The daemon must currently host the project (project_daemons row must
  // exist). Fails if the daemon is offline.
  rpc PullProjectOnDaemon(PullProjectOnDaemonRequest) returns (PullProjectOnDaemonResponse) {}

  // RemoveProjectFromDaemon deletes the on-disk clone AND the
  // project_daemons row for (project_id, daemon_id). Project itself is NOT
  // deleted — other daemons may still host clones. Idempotent: succeeds even
  // if the row was already absent (the on-disk delete is best-effort).
  rpc RemoveProjectFromDaemon(RemoveProjectFromDaemonRequest) returns (RemoveProjectFromDaemonResponse) {}

  // RecloneProjectOnDaemon removes the existing on-disk clone and re-clones
  // it from the project's remote_url at the recorded default branch. Any
  // local-only changes are lost; UI must confirm before calling. The
  // project_daemons row is updated with the new cloned_at.
  rpc RecloneProjectOnDaemon(RecloneProjectOnDaemonRequest) returns (RecloneProjectOnDaemonResponse) {}
}

// Project represents a project in the system
message Project {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string path = 4;
  optional string description = 5;
  bool is_git_repo = 6;
  optional string default_branch = 7;
  string created_at = 8;
  string updated_at = 9;
  string last_active = 10;
  // remote_url is the canonical git remote URL for the project (e.g.
  // "https://github.com/foo/bar.git"). Identifies a project across daemons:
  // two clones of the same remote on different daemons are the same Project,
  // distinguished by their project_daemons rows. NULL for non-git projects
  // or projects whose remote hasn't been resolved yet.
  optional string remote_url = 11;
  // is_forge is true when the project's repo root contains a forge.yaml.
  // Populated at clone / project-create time; not lazily recomputed on read.
  bool is_forge = 12;
  // forge_project_name is forge's name for the project — the `name` key in
  // its forge.yaml — and the key the control plane files the project's
  // deploy environments under. The web joins a project to its control-plane
  // environments on it, so it is persisted here and readable with no daemon.
  // Unset when never read: not a forge project, a forge.yaml without a name,
  // or no daemon has reported it since the project was created.
  optional string forge_project_name = 13;
}

// ProjectDaemon records that a daemon has a local clone of a project.
// A single project may have rows here for multiple daemons (e.g. user
// desktop + cloud daemon), each with its own checkout path. Used by the
// project/daemon picker to know where a project is installed.
message ProjectDaemon {
  string project_id = 1;
  string daemon_id = 2;
  // Absolute path on that daemon where the clone lives — or WILL live, when
  // install_state is INSTALLING. A path here is not proof of a checkout.
  string path = 3;
  optional string default_branch = 4;
  string cloned_at = 5;

  // How far the checkout has got. Rows written before this field existed
  // read as INSTALLED, which is accurate: the old flow only ever wrote a row
  // after a clone had completed.
  ProjectInstallState install_state = 6;
  // Why the clone failed. Empty unless install_state is FAILED.
  string install_error = 7;
}

// CreateProjectRequest creates a new project
message CreateProjectRequest {
  string name = 1;
  string path = 2;
  optional string description = 3;
  optional string default_branch = 4;
}

// CreateProjectResponse returns the created project
message CreateProjectResponse {
  Project project = 1;
}

// ListProjectsRequest lists projects with optional filters
message ListProjectsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

// ListProjectsResponse returns a list of projects
message ListProjectsResponse {
  repeated Project projects = 1;
  int32 total = 2;
}

// GetProjectRequest retrieves a project by ID
message GetProjectRequest {
  string project_id = 1;
}

// GetProjectResponse returns the requested project
message GetProjectResponse {
  Project project = 1;
}

// UpdateProjectRequest updates a project
message UpdateProjectRequest {
  string project_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string default_branch = 4;
}

// UpdateProjectResponse returns the updated project
message UpdateProjectResponse {
  Project project = 1;
}

// DeleteProjectRequest deletes a project
message DeleteProjectRequest {
  string project_id = 1;
}

// DeleteProjectResponse confirms deletion
message DeleteProjectResponse {
  bool success = 1;
  string message = 2;
}

// TouchProjectRequest updates the project's last_active timestamp
message TouchProjectRequest {
  string project_id = 1;
}

// TouchProjectResponse confirms the touch operation
message TouchProjectResponse {
  bool success = 1;
  string message = 2;
}

// GetProjectMetadataRequest retrieves project metadata
message GetProjectMetadataRequest {
  string project_id = 1;
}

// GetProjectMetadataResponse returns project metadata
message GetProjectMetadataResponse {
  string project_id = 1;
  string name = 2;
  string path = 3;
  optional string description = 4;
  bool is_git_repo = 5;
  optional string default_branch = 6;
  string created_at = 7;
  string updated_at = 8;
  string last_active = 9;
}

// UpdateProjectMetadataRequest updates project metadata
message UpdateProjectMetadataRequest {
  string project_id = 1;
  optional string description = 2;
}

// UpdateProjectMetadataResponse returns the updated project
message UpdateProjectMetadataResponse {
  Project project = 1;
}

// GetProjectGitInfoRequest retrieves git info for a project.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior). For multi-repo
// projects, prefer RepoService.GetRepoGitInfo or the worktree-level
// aggregator (ListWorktreeRepoStatuses).
message GetProjectGitInfoRequest {
  string project_id = 1;
  string repo_id = 2;
}

// GetProjectGitInfoResponse returns git repository information
message GetProjectGitInfoResponse {
  string project_id = 1;
  bool is_git_repo = 2;
  string current_branch = 3;
  bool has_changes = 4;
  string status = 5;  // "clean" or "dirty"
  repeated string staged_files = 6;
  repeated string unstaged_files = 7;
  repeated string untracked_files = 8;
  int32 ahead = 9;
  int32 behind = 10;
  string remote_url = 11;
  string message = 12;  // Used when not a git repo
}

// GitBranch represents a git branch
message GitBranch {
  string name = 1;
  bool is_current = 2;
  bool is_remote = 3;
  string upstream = 4;
  int64 last_commit_age = 5;
  // is_detached is true when HEAD is in detached state (checked out to a commit, not a branch)
  bool is_detached = 6;
  // commit_sha is the full commit SHA of the current HEAD (only set when is_detached is true)
  string commit_sha = 7;
}

// GetProjectGitBranchesRequest retrieves git branches for a project.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior).
message GetProjectGitBranchesRequest {
  string project_id = 1;
  string repo_id = 2;
}

// GetProjectGitBranchesResponse returns git branches
message GetProjectGitBranchesResponse {
  repeated GitBranch branches = 1;
}

// GetProjectInitStatusRequest retrieves project initialization status
message GetProjectInitStatusRequest {
  string project_id = 1;
}

// GetProjectInitStatusResponse returns initialization status
message GetProjectInitStatusResponse {
  bool initialized = 1;
  string project_id = 2;
  string message = 3;
}

// InitializeProjectRequest initializes a project
message InitializeProjectRequest {
  string project_id = 1;
}

// InitializeProjectResponse confirms initialization
message InitializeProjectResponse {
  string project_id = 1;
  string status = 2;
  string message = 3;
  bool initialized = 4;
}

// FileChange represents a changed file with its diff
message FileChange {
  string path = 1;
  FileChangeStatus status = 2;
  string diff = 3;
  string content = 4;
  string original_content = 5;
  bool is_new = 6;
}

// GetProjectChangesRequest retrieves recent changes for a project.
// repo_id targets one nested repo. Empty is allowed only when the project
// has at most one repo (legacy single-repo behavior).
message GetProjectChangesRequest {
  string project_id = 1;
  string repo_id = 2;
}

// GetProjectChangesResponse returns recent changes
message GetProjectChangesResponse {
  string branch = 1;
  repeated FileChange files = 2;
  int32 total_files = 3;
}

// Prompt represents a saved prompt
message Prompt {
  string id = 1;
  string name = 2;
  string content = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
}

// GetProjectPromptsRequest retrieves project prompts
message GetProjectPromptsRequest {
  string project_id = 1;
}

// GetProjectPromptsResponse returns project prompts
message GetProjectPromptsResponse {
  repeated Prompt prompts = 1;
}

// SaveProjectPromptsRequest saves project prompts
message SaveProjectPromptsRequest {
  string project_id = 1;
  repeated Prompt prompts = 2;
}

// SaveProjectPromptsResponse confirms prompts saved
message SaveProjectPromptsResponse {
  string message = 1;
  repeated Prompt prompts = 2;
}

// InitializeGitRepoRequest initializes a git repository
message InitializeGitRepoRequest {
  string project_id = 1;
  string initial_branch = 2;
  repeated string gitignore_patterns = 3;
  bool initial_commit = 4;
}

// InitializeGitRepoResponse confirms git repository initialization
message InitializeGitRepoResponse {
  string message = 1;
  string project_id = 2;
  bool is_git_repo = 3;
  string default_branch = 4;
}

// ListProjectDaemonsForDaemonRequest filters project_daemons rows by daemon.
message ListProjectDaemonsForDaemonRequest {
  string daemon_id = 1;
}

// ListProjectDaemonsForDaemonResponse returns the matching rows.
message ListProjectDaemonsForDaemonResponse {
  repeated ProjectDaemon project_daemons = 1;
}

// ListProjectDaemonsRequest takes no parameters — the response is scoped to
// the authenticated user via the request context.
message ListProjectDaemonsRequest {}

// ListProjectDaemonsResponse returns every project_daemons row for projects
// owned by the calling user, across all of their daemons.
message ListProjectDaemonsResponse {
  repeated ProjectDaemon project_daemons = 1;
}

// MarkProjectInstalledRequest records (project, daemon, path) after a clone.
message MarkProjectInstalledRequest {
  string project_id = 1;
  string daemon_id = 2;
  string path = 3;
  optional string default_branch = 4;
}

// MarkProjectInstalledResponse returns the upserted row.
message MarkProjectInstalledResponse {
  ProjectDaemon project_daemon = 1;
}

// Where a project's checkout has got to on one daemon.
enum ProjectInstallState {
  PROJECT_INSTALL_STATE_UNSPECIFIED = 0;
  // The clone is queued or running. The path is where the checkout WILL be.
  PROJECT_INSTALL_STATE_INSTALLING = 1;
  // The checkout exists on that daemon.
  PROJECT_INSTALL_STATE_INSTALLED = 2;
  // The clone ran and failed. `install_error` says why.
  PROJECT_INSTALL_STATE_FAILED = 3;
}

// CreateProjectFromRepoRequest adds a GitHub repo as a project on a daemon.
message CreateProjectFromRepoRequest {
  // The repo to clone, as its https clone URL.
  string clone_url = 1;
  // Which machine to clone onto. Required: with several machines the choice
  // is the user's, and guessing it silently puts the checkout somewhere they
  // did not ask for.
  string daemon_id = 2;
  // Defaults to the repo name when empty.
  optional string name = 3;
  // Defaults to the repo's default branch when empty.
  optional string branch = 4;
  // Absolute path on the daemon. Defaults to the conventional projects
  // directory for the repo name.
  optional string path = 5;
}

message CreateProjectFromRepoResponse {
  // The project row, created immediately so the user has something to look
  // at while the clone runs.
  Project project = 1;
  // Where the checkout lives or will live, carrying the install state.
  ProjectDaemon project_daemon = 2;
  // FALSE only if the clone had already completed by the time we replied.
  // True means the command is queued and the checkout does not exist yet —
  // clients must not tell the user the repo is ready.
  bool queued = 3;
  // The machine the clone is waiting on, named so the UI can say which.
  string daemon_name = 4;
}

// DaemonRepository is one cloned project on a daemon, denormalized with
// project metadata. Used by admin "Repositories" tabs in the dashboard /
// admin-web; the ProjectPicker keeps using the leaner ProjectDaemon shape.
message DaemonRepository {
  string project_id = 1;
  string name = 2;
  // remote_url is project.remote_url (e.g. "https://github.com/foo/bar.git").
  // Empty for non-git projects.
  string remote_url = 3;
  // branch is project_daemons.default_branch (falls back to
  // project.default_branch).
  string branch = 4;
  // path is the absolute on-disk clone path on the daemon.
  string path = 5;
  // cloned_at is project_daemons.cloned_at, refreshed on pull/reclone.
  string cloned_at = 6;
}

// ListRepositoriesForDaemonRequest filters by daemon.
message ListRepositoriesForDaemonRequest {
  string daemon_id = 1;
}

// ListRepositoriesForDaemonResponse returns matching rows joined with project
// metadata.
message ListRepositoriesForDaemonResponse {
  repeated DaemonRepository repositories = 1;
}

// PullProjectOnDaemonRequest runs `git pull` on a specific clone.
message PullProjectOnDaemonRequest {
  string project_id = 1;
  string daemon_id = 2;
}

// PullProjectOnDaemonResponse returns the trimmed git pull output.
message PullProjectOnDaemonResponse {
  string output = 1;
}

// RemoveProjectFromDaemonRequest removes an on-disk clone + its
// project_daemons row.
message RemoveProjectFromDaemonRequest {
  string project_id = 1;
  string daemon_id = 2;
}

// RemoveProjectFromDaemonResponse is empty on success.
message RemoveProjectFromDaemonResponse {}

// RecloneProjectOnDaemonRequest blows away the on-disk clone and re-clones
// from the project's remote_url.
message RecloneProjectOnDaemonRequest {
  string project_id = 1;
  string daemon_id = 2;
}

// RecloneProjectOnDaemonResponse returns the (potentially-changed) clone path.
message RecloneProjectOnDaemonResponse {
  string path = 1;
}
