    in: [
      "pre_launch",
      "launch",
      "early_traction",
      "growth",
      "scale"
    ]
  }];
  optional string objective = 6 [(buf.validate.field).string = {
    in: [
      "awareness",
      "acquisition",
      "activation",
      "conversion",
      "retention",
      "expansion",
      "referral",
      "research"
    ]
  }];
  optional string effort = 7 [(buf.validate.field).string = {
