}

message ResolveItemSendRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string id = 2 [(buf.validate.field).required = true];
  // The held send's approval hash (GtmItem.approval_hash), as the person saw it.
  string approval_hash = 3 [(buf.validate.field).required = true];
  // Set: the email went out, with this Gmail message id; the item becomes
  // SENT. Unset: it did not go out; the hold is released.
  optional string gmail_message_id = 4 [(buf.validate.field).string.min_len = 1];
}

message ResolveItemSendResponse {
  GtmItem item = 1;
}

// ---------------------------------------------------------------------------
// Positioning.
// ---------------------------------------------------------------------------

message GetPositioningRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message GetPositioningResponse {
  GtmPositioning positioning = 1;
}

message UpdatePositioningRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // The revision the caller read; 0 when the org has none yet.
  int32 expected_revision = 2 [(buf.validate.field).int32.gte = 0];
  string positioning_md = 3;
  repeated string audiences = 4;
  // UNSPECIFIED: not said.
  GtmBusinessType business_type = 5 [(buf.validate.field).enum.defined_only = true];
  // Each at most once; empty: not said.
  repeated GtmBusinessModel business_models = 6 [(buf.validate.field).repeated = {
    max_items: 8
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

message UpdatePositioningResponse {
  GtmPositioning positioning = 1;
}

// ---------------------------------------------------------------------------
// Claims.
// ---------------------------------------------------------------------------

message ListClaimsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  optional GtmClaimStatus status = 2;
  optional GtmClaimCategory category = 3;
  // Matches claims whose text contains it (case-insensitive).
  optional string search = 4;
  // page_size is at most 500; 0 is 200.
  int32 page_size = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  string page_token = 6;
}

message ListClaimsResponse {
  repeated GtmClaim claims = 1;
  string next_page_token = 2;
}

message UpsertClaimRequest {
  option (buf.validate.message).cel = {
    id: "upsert_claim_shape"
    message: "a create (id empty) needs text and category; a change (id set) needs expected_revision > 0"
    expression: "this.id == '' ? (has(this.text) && has(this.category)) : this.expected_revision > 0"
  };
  string org_id = 1 [(buf.validate.field).required = true];
  // Empty: create a claim (text and category required). Set: change that
  // claim (expected_revision > 0 required; text and category must be unset or
  // equal to the stored ones).
  string id = 2;
  int32 expected_revision = 3 [(buf.validate.field).int32.gte = 0];
  optional string text = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  optional GtmClaimCategory category = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // VERIFIED (a person only, with the evidence below), UNVERIFIED or RETIRED.
  // Unset on create: UNVERIFIED.
  optional GtmClaimStatus status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string source_url = 7;
  optional GtmClaimSourceKind source_kind = 8 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp expires_or_recheck_at = 9;
  // Clears expires_or_recheck_at (wins over a value in the same request).
  bool clear_expires_or_recheck_at = 10;
  optional string notes = 11;
}

message UpsertClaimResponse {
  GtmClaim claim = 1;
  // True when this call created the claim.
  bool created = 2;
}

message CheckClaimsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // The text to check, markdown (an item's title and body).
  string text = 2 [(buf.validate.field).string.max_len = 200000];
}

message CheckClaimsResponse {
  repeated GtmClaimFinding findings = 1;
  // True when any finding blocks approval.
  bool blocking = 2;
}
