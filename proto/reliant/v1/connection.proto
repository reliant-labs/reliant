syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ConnectionService manages a user's saved logins to external services
// (research/CONNECTIONS_VAULT.md §4.2).
//
// NO RPC RETURNS A SECRET VALUE. Secrets are write-only: they enter through
// CreateApiKeyConnection or the OAuth callback, are sealed in the vault, and
// are read back only by the worker at call time. A reflection test pins that
// no response message can carry one.
//
// Every RPC is scoped to the caller. A connection that is missing, deleted or
// owned by someone else is NOT_FOUND in every case, so ids are not an oracle.
service ConnectionService {
  // ListIntegrations lists what a connection can be made to. An OAuth
  // integration whose deployment has no client credentials is listed with
  // available = false rather than hidden, so the UI can say why.
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse) {}

  // ListConnections returns the caller's connections. Metadata only.
  // forge:custom — the caller's connections from connections.Service, metadata only
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {}

  // GetConnection returns one connection's metadata.
  // forge:custom — one of the caller's connections from connections.Service, metadata only, NotFound otherwise
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {}

  // CreateApiKeyConnection saves a pasted API key or basic credential.
  rpc CreateApiKeyConnection(CreateApiKeyConnectionRequest) returns (CreateApiKeyConnectionResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "create"
        target: {
          kind: "connection"
          id: "response.connection.id"
          label: "response.connection.name"
        }
        detail: ["integration_id"]
      }
    };
  }

  // StartOAuth begins an authorization-code flow bound to the caller and
  // returns the provider URL to send the user to. The provider redirects to
  // this server's /integrations/oauth/{provider}/callback, which relays the
  // code back to the client: a web app's /connections/oauth/callback route on
  // the request's Origin (which must be one this deployment serves), or a
  // desktop app's loopback_redirect.
  rpc StartOAuth(StartOAuthRequest) returns (StartOAuthResponse) {
    option (forge.v1.method) = {
      activity: {none: "OAuth handshake in flight: nothing is stored until CompleteOAuth records the connection"}
    };
  }

  // CompleteOAuth finishes a flow with the code and state the callback
  // relayed. Only the user who started the flow can finish it.
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "connect"
        target: {
          kind: "connection"
          id: "response.connection.id"
          label: "response.connection.name"
        }
        detail: ["response.connection.integration_id"]
      }
    };
  }

  // TestConnection runs the integration's probe against the live credential
  // and records the account label it identifies.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse) {
    option (forge.v1.method) = {
      activity: {none: "probes the live credential; refreshing the account label it detects is bookkeeping, not a change a person made"}
    };
  }

  rpc RenameConnection(RenameConnectionRequest) returns (RenameConnectionResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "rename"
        target: {
          kind: "connection"
          id: "id"
          label: "name"
        }
      }
    };
  }

  // SetDefaultConnection makes this the connection used when a workflow names
  // only the integration.
  rpc SetDefaultConnection(SetDefaultConnectionRequest) returns (SetDefaultConnectionResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_default"
        target: {
          kind: "connection"
          id: "id"
          label: "response.connection.name"
        }
        detail: ["response.connection.integration_id"]
      }
    };
  }

  // DeleteConnection revokes at the provider where an API exists (best
  // effort), then soft-deletes the row and destroys its ciphertext.
  // forge:custom — revokes at the provider, then soft-deletes the row and destroys its ciphertext
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse) {}

  // ListConnectionEvents is the audit view, newest first.
  // forge:custom — the caller's audit trail of one connection, served by connections.Service
  rpc ListConnectionEvents(ListConnectionEventsRequest) returns (ListConnectionEventsResponse) {}
}

enum ConnectionAuthKind {
  CONNECTION_AUTH_KIND_UNSPECIFIED = 0;
  // Authorization code + PKCE, with refresh. A GitHub App user-to-server
  // token is one of these.
  CONNECTION_AUTH_KIND_OAUTH2 = 1;
  CONNECTION_AUTH_KIND_API_KEY = 3;
  CONNECTION_AUTH_KIND_BASIC = 4;
  CONNECTION_AUTH_KIND_NONE = 5;
  // The token comes from an external authority at call time (GitHub through
  // the control plane). It is an Integration method only: no connection row
  // is ever of this kind.
  CONNECTION_AUTH_KIND_DELEGATED = 6;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_ACTIVE = 1;
  // The provider refused the refresh grant; the user must reconnect.
  CONNECTION_STATUS_NEEDS_REAUTH = 2;
  CONNECTION_STATUS_REVOKED = 3;
}

// ConnectionOwnerKind is who a connection belongs to.
enum ConnectionOwnerKind {
  // A server that predates org connections sends this; read it as USER.
  CONNECTION_OWNER_KIND_UNSPECIFIED = 0;
  // The caller's own: only they use it, and only they manage it.
  CONNECTION_OWNER_KIND_USER = 1;
  // An organization's (org_id): any live member may use it in that org's
  // runs, naming it explicitly; only the org's admins and owners manage it.
  // A reference that names only an integration never falls back to it.
  CONNECTION_OWNER_KIND_ORG = 2;
}

// Connection is metadata only. There is deliberately no field that could hold
// a credential.
message Connection {
  string id = 1;
  string integration_id = 2;
  ConnectionAuthKind auth_kind = 3;
  string name = 4;
  // The provider-side identity this connection acts as ("octocat").
  string account_label = 5;
  string external_account_id = 6;
  repeated string scopes = 7;
  ConnectionStatus status = 8;
  // A short class ("invalid_grant"), never a provider response body.
  string status_reason = 9;
  bool is_default = 10;
  // RFC3339 UTC timestamps, matching the other services; empty when unset.
  string access_expires_at = 11;
  string last_used_at = 12;
  string created_at = 13;
  string updated_at = 14;
  // The connection's non-secret settings (a Shopify shop), as declared by the
  // integration's connection_params.
  map<string, string> params = 15;
  // The provider's id for the person who made this connection, as that
  // provider's events name them in trigger.sender.id: a Slack user id, a
  // GitHub user id (the number, never the renameable login), a Gmail
  // address. Empty when the integration does not say.
  // It is what a trigger's "Only from: Me" allowlists.
  string sender_id = 16;
  // Who the connection belongs to. An org connection's other fields describe
  // the org's account (its Slack bot, its API key), not the caller's.
  ConnectionOwnerKind owner_kind = 17;
  // The organization of an org connection; empty for a personal one.
  string org_id = 18;
}

// Integration is one catalog integration a connection can be made to.
message Integration {
  string id = 1;
  string display_name = 2;
  // Methods are the ways to connect, most preferred first.
  repeated IntegrationAuthMethod methods = 6;
  // ConnectionParams are the non-secret settings a new connection asks for.
  repeated IntegrationConnectionParam connection_params = 7;
  // OrgPolicy is how the organization the request names treats this
  // integration in its runs (control-plane docs/design/org-policies.md §4.3).
  // Unset when the request names no org, or the org's policy does not govern
  // integrations: every integration may be used, as before this field.
  IntegrationOrgPolicy org_policy = 8;
}

// IntegrationOrgPolicy is an org's policy on one integration. It governs USE
// in the org's runs, never connecting: a person's own connection stays usable
// in their other orgs, so a picker marks a disallowed integration "not
// allowed in <org>" rather than hiding it.
message IntegrationOrgPolicy {
  // Allowed is false when the org's policy does not admit the integration.
  bool allowed = 1;
  // Enforced is true when a use the policy does not admit is refused. False
  // while the rule only counts what it would refuse (audit): the use still
  // works.
  bool enforced = 2;
  // PolicyVersion is the version of the org's policy this answer comes from.
  int64 policy_version = 3;
}

message IntegrationAuthMethod {
  ConnectionAuthKind kind = 1;
  // False when the deployment has not configured this method.
  bool available = 2;
  // Why it is unavailable, in words for an operator
  // ("RELIANT_OAUTH_SLACK_CLIENT_ID and RELIANT_OAUTH_SLACK_CLIENT_SECRET are not set").
  string unavailable_reason = 3;
  // FieldLabels names the form fields a pasted credential needs, keyed by the
  // CreateApiKeyConnectionRequest.fields key. Empty for oauth2 and delegated.
  map<string, string> field_labels = 4;
}

message IntegrationConnectionParam {
  string name = 1;
  string display_name = 2;
  string description = 3;
  // Pattern is the RE2 expression a value must match in full.
  string pattern = 4;
  string default_value = 5;
  bool required = 6;
}

message ListIntegrationsRequest {
  // OrgId fills each integration's org_policy with that organization's
  // policy, for a caller who is a live member of it (PERMISSION_DENIED
  // otherwise). Unset lists the integrations exactly as before this field.
  optional string org_id = 1;
}
message ListIntegrationsResponse {
  repeated Integration integrations = 1;
}

message ListConnectionsRequest {
  // IntegrationId keeps only that integration's connections. Unset (or empty)
  // lists every integration's.
  optional string integration_id = 1;
  // OrgId adds that organization's connections (owner_kind ORG) to the
  // caller's own, for a caller who is a live member of it
  // (PERMISSION_DENIED otherwise). Unset lists only the caller's own, as
  // before this field existed.
  optional string org_id = 2;
}
message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message GetConnectionRequest {
  string id = 1;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Any live member of it may read one.
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 2;
}
message GetConnectionResponse {
  Connection connection = 1;
}

enum ApiKeyConnectionKind {
  API_KEY_CONNECTION_KIND_UNSPECIFIED = 0;
  // fields: "api_key" (required). Where the key goes is the integration's
  // declaration; only an integration that leaves it open (the generic HTTP
  // one) takes "header" (one of "bearer", "x-api-key", "api-key",
  // "x-auth-token"; default "bearer").
  API_KEY_CONNECTION_KIND_API_KEY = 1;
  // fields: "username" and "password". An integration whose username is a
  // connection param (an account id) takes only "password".
  API_KEY_CONNECTION_KIND_BASIC = 2;
}

message CreateApiKeyConnectionRequest {
  // A catalog integration that declares this kind of credential.
  string integration_id = 1;
  string name = 2;
  ApiKeyConnectionKind kind = 3;
  // WRITE-ONLY. The only message in this API that carries a secret.
  map<string, string> fields = 4 [debug_redact = true];
  // Values for the integration's connection_params. Not secret.
  map<string, string> params = 5;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may.
  // The deployment must enable org connections (orgs.connections_enabled).
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 6;
}
message CreateApiKeyConnectionResponse {
  Connection connection = 1;
}

message StartOAuthRequest {
  string integration_id = 1;
  // Optional display name for a new connection.
  string name = 2;
  // Reconnect an existing connection in place instead of creating one.
  string reconnect_id = 3;
  // Where the client wants to land afterwards: a relative path only.
  string redirect_after = 4;
  // Values for the integration's connection_params (a new connection only;
  // a reconnect keeps the connection's own). Not secret.
  map<string, string> params = 5;
  // A desktop app's loopback receiver (http://127.0.0.1:<port>/<path>), where
  // the callback relays the code because consent runs in the system browser.
  // Empty for a web app, whose request Origin decides instead.
  string loopback_redirect = 6;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. A new connection, or with reconnect_id a
  // reconnect of one of the org's. Only an owner or admin of it, signed in to the app as a person, may. The same person must
  // finish the flow, and must still be an owner or admin then. The
  // deployment must enable org connections (orgs.connections_enabled).
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 7;
}
message StartOAuthResponse {
  string authorize_url = 1;
}

message CompleteOAuthRequest {
  string state = 1 [debug_redact = true];
  string code = 2 [debug_redact = true];
}
message CompleteOAuthResponse {
  Connection connection = 1;
  string redirect_after = 2;
}

message TestConnectionRequest {
  string id = 1;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may.
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 2;
}
message TestConnectionResponse {
  bool ok = 1;
  // True when the integration has a probe that ran; false means only that the
  // stored secret opened.
  bool probed = 2;
  string account_label = 3;
  // "unauthorized", "unreachable", "needs_reauth", or empty when ok.
  string error_class = 4;
}

message RenameConnectionRequest {
  string id = 1;
  string name = 2;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may.
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 3;
}
message RenameConnectionResponse {
  Connection connection = 1;
}

message SetDefaultConnectionRequest {
  string id = 1;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may. The org's default is what a
  // picker offers first; an unnamed reference never falls back to it.
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 2;
}
message SetDefaultConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string id = 1;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may.
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 2;
}
message DeleteConnectionResponse {}

message ConnectionEvent {
  int64 id = 1;
  string connection_id = 2;
  // created, used, refreshed, refresh_failed, needs_reauth, reconnected,
  // renamed, revoked, deleted, default_changed.
  string kind = 3;
  string run_id = 4;
  string node_id = 5;
  string tool_call_id = 6;
  // "user:<id>", "worker", or "trigger:<id>".
  string actor = 7;
  string at = 8;
  // The person the event is attributed to: who acted, also on an org's
  // connection (the member whose run used it), so an org admin can tell who
  // used the org's account.
  string user_id = 9;
}

message ListConnectionEventsRequest {
  string id = 1 [(buf.validate.field).required = true];
  int32 limit = 2;
  // Return events older than this id; unset (or 0) for the newest page.
  optional int64 before_id = 3;
  // OwnerOrgId, when set, makes this about a connection of that
  // organization (owner_kind ORG) instead of the caller's own. Only an owner or admin of it, signed in to the app as a person, may. They see every member's use
  // of it (ConnectionEvent.user_id).
  // It is never filled in for the caller (it is not org_id, which the web
  // app fills with the active org): acting on an org's account is explicit.
  optional string owner_org_id = 4;
}
message ListConnectionEventsResponse {
  repeated ConnectionEvent events = 1;
}
