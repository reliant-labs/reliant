syntax = "proto3";

package reliant.v1;

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ToolsDaemonService provides bidirectional streaming for tool execution.
// The daemon connects and maintains a persistent stream for receiving tool requests
// and sending back tool responses.
service ToolsDaemonService {
  // ConnectDaemon establishes a bidirectional stream for tool execution.
  // - Server sends ToolRequest messages when tools need to be executed
  // - Client sends ToolResponse messages with execution results
  // - On connect, server streams any pending requests from the database
  rpc ConnectDaemon(stream DaemonMessage) returns (stream ServerMessage) {}

  // ConnectGateway is the reverse of ConnectDaemon: the daemon listens as a
  // gRPC server and the gateway dials in. The gateway sends ServerMessages and
  // receives DaemonMessages — same message types, but the connection direction
  // is flipped.
  rpc ConnectGateway(stream ServerMessage) returns (stream DaemonMessage) {}

  // ReportToolResult is a unary fallback for reporting tool execution results
  // when the bidirectional stream is unavailable. The daemon calls this when
  // a tool completes but the bidi stream send fails (e.g. temporary disconnect).
  rpc ReportToolResult(ReportToolResultRequest) returns (ReportToolResultResponse) {}
}

// FileChangeType categorizes file system change events
enum FileChangeType {
  FILE_CHANGE_TYPE_UNSPECIFIED = 0;
  FILE_CHANGE_TYPE_CREATED = 1;
  FILE_CHANGE_TYPE_UPDATED = 2;
  FILE_CHANGE_TYPE_DELETED = 3;
}

// ============================================
// Client -> Server Messages
// ============================================

// DaemonMessage is the message sent from daemon to server
message DaemonMessage {
  oneof message {
    DaemonRegister register = 1; // Initial registration
    ToolResponse tool_response = 2; // Tool execution result
    DaemonHeartbeat heartbeat = 3; // Keepalive
    ProjectDiscovery project_discovery = 4;

    LoadProjectConfigsResponse load_project_configs_response = 5;
    ProjectConfigDelta project_config_delta = 6;

    DaemonKillProcessResponse kill_process_response = 7;
    DaemonCommandResponse daemon_command_response = 8;

    // Terminal I/O streaming
    TerminalOutputMessage terminal_output = 9;
    TerminalSessionEvent terminal_session_event = 10;

    // Process output streaming
    ProcessOutputChunkMessage process_output_chunk = 11;

    // Filesystem change detection
    FileSystemChanged file_system_changed = 12;

    // Async failure of a command that had no live RPC waiter to report to
    // (e.g. one dispatched from the DAEMON_PENDING_COMMANDS queue after the
    // original caller already returned). See DaemonCommandFailed.
    DaemonCommandFailed daemon_command_failed = 13;

    // Local-model relay: response head and body chunks for an
    // LocalModelHTTPRequest, in order, ending with a chunk whose done=true.
    LocalModelHTTPChunk local_model_http_chunk = 14;

    // The local model servers this daemon can reach and the models they
    // serve. Sent after registration, whenever detection changes, and on
    // request (LocalModelRefresh). Replaces the daemon's previous inventory.
    LocalModelInventory local_model_inventory = 15;
  }
}

// ============================================
// Local models
// ============================================
//
// A local model server (Ollama, LM Studio, llama.cpp, vLLM, ...) runs on the
// DAEMON's machine, which in distributed mode is not the machine the worker
// runs on. So the endpoint is a property of a daemon: the daemon detects and
// probes it, publishes what it serves (LocalModelInventory), and relays the
// worker's OpenAI-compatible HTTP requests to it (LocalModelHTTPRequest /
// LocalModelHTTPChunk). The worker never dials the endpoint itself.

// LocalModelInventory is a daemon's complete, current view of the local model
// servers it can reach.
message LocalModelInventory {
  repeated LocalModelEndpoint endpoints = 1;
  // When the daemon last probed, RFC3339.
  string probed_at = 2;
}

// LocalModelEndpoint is one OpenAI-compatible server on the daemon's machine.
message LocalModelEndpoint {
  // Stable id for this endpoint on this daemon, e.g. "ollama" or
  // "lmstudio", or a hash of base_url for a user-configured one. Requests
  // name the endpoint by this id, never by URL.
  string id = 1;
  // "ollama", "lmstudio", "llamacpp", "vllm", or "openai_compatible".
  string kind = 2;
  // The base URL as seen FROM THE DAEMON (e.g. http://localhost:11434/v1).
  // Informational for the UI; the server never dials it.
  string base_url = 3;
  // "detected" (well-known port probe) or "configured" (user config).
  string source = 4;
  // Empty when the endpoint answered; otherwise why it did not (connection
  // refused, timeout, non-2xx), suitable for showing to the user.
  string error = 5;
  repeated LocalModelInfo models = 6;
}

// LocalModelInfo describes one model as reported by the server itself.
message LocalModelInfo {
  // The model name the server expects in requests (e.g. "qwen3:latest").
  string name = 1;
  // Context window the server will actually honor for this model, in
  // tokens. For Ollama this is the num_ctx the daemon will request, not the
  // server's 4096 default. 0 = unknown.
  int64 context_window = 2;
  bool supports_tools = 3;
  bool supports_vision = 4;
  bool supports_thinking = 5;
  // False for embedding-only models; such models are never offered for chat.
  bool supports_chat = 6;
  // Size on disk in bytes, when the server reports it. 0 = unknown.
  int64 size_bytes = 7;
  // Server-reported parameter count label, e.g. "8.2B". Informational.
  string parameter_size = 8;
}

// LocalModelRefresh asks the daemon to re-probe now and send a fresh
// LocalModelInventory. Used by the UI's "Test connection" / "Refresh".
message LocalModelRefresh {}

// LocalModelHTTPRequest relays one HTTP request to a local model endpoint on
// the daemon's machine. The daemon only forwards requests whose endpoint_id is
// in its current inventory and whose path is on its allow-list (/v1/*,
// /api/show, /api/tags, /api/v0/*, /props); it is not a general proxy.
message LocalModelHTTPRequest {
  // Correlates chunks and cancellation. Unique per request.
  string request_id = 1;
  string endpoint_id = 2;
  string method = 3;
  // Path relative to the endpoint's base URL, including any query string,
  // e.g. "/chat/completions".
  string path = 4;
  map<string, string> headers = 5;
  bytes body = 6;
  // Milliseconds of silence (no bytes from the local server) after which the
  // daemon aborts the request. 0 = daemon default.
  int32 idle_timeout_ms = 7;
}

// LocalModelHTTPCancel aborts an in-flight LocalModelHTTPRequest.
message LocalModelHTTPCancel {
  string request_id = 1;
}

// LocalModelHTTPChunk carries a relayed response back in order. The first
// chunk carries status and headers; later chunks carry body bytes; the last
// has done=true. A transport failure before any response is reported as a
// single done chunk with error set and status 0.
message LocalModelHTTPChunk {
  string request_id = 1;
  uint64 sequence = 2;
  int32 status = 3;
  map<string, string> headers = 4;
  bytes data = 5;
  bool done = 6;
  string error = 7;
}

// DaemonRegister is sent when daemon first connects.
// The server derives user_id from the PAT used to authenticate the stream;
// the daemon should not need to assert it.
message DaemonRegister {
  string hostname = 3; // Machine hostname
  string platform = 4; // OS platform (darwin, linux, windows)
  string working_dir = 5; // Current working directory
  repeated string capabilities = 6; // Supported tools/features
  string name = 8; // Human-friendly daemon name (default: hostname)
  map<string, string> labels = 9; // User-defined labels for daemon selection
  string daemon_type = 10; // Daemon type: "local" or "cloud"
  // daemon_id is a client-asserted stable identity persisted per server
  // origin in ~/.reliant/daemon.json. The server assigns it on first
  // registration (via RegistrationAck) and the daemon echoes it back on
  // every reconnect so identity survives restarts and hostname changes
  // (macOS flipping between *.lan and *.local). The server trusts it only
  // when the PAT is not already bound to a specific daemon; empty for
  // first-ever registration and pre-update daemons (which fall back to
  // hostname-based resolution server-side).
  string daemon_id = 11;
}

// ToolResponse contains the result of tool execution
message ToolResponse {
  string request_id = 1; // Request ID from ToolRequest
  bool success = 2; // Whether execution succeeded
  bool is_error = 3; // Whether content is an error message
  string content = 4; // Tool output/result
  string metadata = 5; // JSON-encoded metadata
  string error_message = 6; // Error message if success=false
  string error_code = 7; // Error code for categorization
  bool backgrounded = 8; // Whether tool was converted to background execution
}

// DaemonHeartbeat is sent periodically to keep connection alive.
// Cloud daemons additionally piggyback workspace memory telemetry read from
// the pod cgroup (memory.current / memory.max) so the gateway can surface
// memory pressure before the kernel OOM killer fires. All memory fields are
// zero for daemons without cgroup v2 accounting (macOS, local daemons) —
// consumers must treat memory_limit_bytes == 0 as "not reported".
message DaemonHeartbeat {
  int64 timestamp = 1;
  uint64 memory_used_bytes = 2; // cgroup memory.current
  uint64 memory_limit_bytes = 3; // cgroup memory.max (0 = unlimited/unknown)
  bool memory_pressure = 4; // hysteresis-smoothed: asserts >= 85% of limit, clears < 75%
  // TCP ports with a LISTEN socket on loopback/wildcard inside the workspace
  // netns (deduped v4/v6, sorted, daemon's own ports excluded) — the set the
  // in-pod preview forwarder can reach. Piggybacked here the same way the
  // memory fields are; empty for daemons without /proc/net/tcp (macOS,
  // local daemons) and for local daemons that don't run the port watcher.
  repeated uint32 detected_ports = 5;
}

// ============================================
// Server -> Client Messages
// ============================================

// ServerMessage is the message sent from server to daemon
message ServerMessage {
  oneof message {
    ToolRequest tool_request = 1; // Request to execute a tool
    ServerHeartbeat heartbeat = 2; // Keepalive
    RegistrationAck registration_ack = 3;
    ToolExecutionCancel tool_cancel = 4;

    LoadProjectConfigsRequest load_project_configs = 5;
    WatchProjectConfigsRequest watch_project_configs = 6;
    UnwatchProjectConfigsRequest unwatch_project_configs = 7;

    DaemonKillProcessRequest kill_process = 8;
    DaemonCommandRequest daemon_command = 9;

    // Terminal I/O streaming
    TerminalInputMessage terminal_input = 10;
    TerminalResizeMessage terminal_resize = 11;

    // Process output streaming
    ProcessOutputSubscribeMessage process_output_subscribe = 12;
    ProcessOutputUnsubscribeMessage process_output_unsubscribe = 13;

    // Terminal output streaming (subscribe-driven, mirrors process output).
    // Starting the PTY output pump is deferred until this arrives so the
    // initial shell prompt is buffered until a subscriber is attached.
    TerminalOutputSubscribeMessage terminal_output_subscribe = 15;

    // Stream initiation. Sent as the first message on a new ConnectGateway
    // stream so the underlying HTTP request is actually dispatched (connect-go
    // defers makeRequest until the first client Send). Carries no payload —
    // the gateway intentionally transmits no identity over this channel; the
    // (daemonID, conn) mapping lives only in gateway memory so the daemon
    // can never assert its own identity.
    GatewayHello hello = 14;

    // Asks the daemon to detach an in-flight tool execution into a background
    // process. Mirrors tool_cancel: both reach a RUNNING execution by
    // request_id, which is the only handle the daemon keeps for one.
    ToolExecutionBackground tool_background = 16;

    // Local-model relay. See LocalModelHTTPRequest.
    LocalModelHTTPRequest local_model_http_request = 17;
    LocalModelHTTPCancel local_model_http_cancel = 18;
    LocalModelRefresh local_model_refresh = 19;
  }
}

// GatewayHello is an intentionally-empty marker. See ServerMessage.hello.
message GatewayHello {}

// ToolRequest is sent when a tool needs to be executed
message ToolRequest {
  string request_id = 1; // Unique request ID (for correlation)
  string tool_name = 2; // Name of tool to execute
  string tool_input = 3; // JSON-encoded tool parameters
  string tool_call_id = 4; // ID from LLM tool call
  string content_block_id = 5; // Database content block ID
  string context_json = 6; // JSON-encoded execution context
  int32 timeout_ms = 8; // Timeout in milliseconds
}

// ServerHeartbeat is sent periodically to keep connection alive
message ServerHeartbeat {
  int64 timestamp = 1;
}

// RegistrationAck contains daemon registration status and requested config pushes.
message RegistrationAck {
  bool accepted = 1;
  repeated string requested_project_paths = 2; // "send me config for these"
  string daemon_id = 3; // Gateway-assigned daemon identity (from PAT binding or newly generated)
  string user_id = 4;   // Gateway-derived user identity (from PAT). Daemon uses for tool execution context.
}

message LoadProjectConfigsRequest {
  string project_path = 1; // normalized absolute path
  string request_id = 2; // idempotency/correlation
}

message LoadProjectConfigsResponse {
  string request_id = 1;
  ProjectConfigSnapshot snapshot = 2;
  string error = 3; // optional
}

message WatchProjectConfigsRequest {
  string project_path = 1; // normalized absolute path
  bool include_initial = 2; // send current snapshot immediately
}

message UnwatchProjectConfigsRequest {
  string project_path = 1;
}

message ProjectConfigSnapshot {
  string project_path = 1;
  string config_version = 2; // content hash or monotonic version
  int64 daemon_timestamp_unix_ms = 3;

  bytes user_config_yaml = 4;
  bytes project_config_yaml = 5;
  bytes local_config_yaml = 6;

  map<string, bytes> mcp_configs = 7; // user/project/local -> mcp.json content

  repeated IndexedWorkflow workflows = 8;
  repeated IndexedPreset presets = 9;
  repeated IndexedScenario scenarios = 10;

  // Memory files that must be available to cloud workers.
  bytes global_memory_md = 11;  // ~/.reliant/reliant.md
  bytes project_memory_md = 12; // {project_path}/reliant.md

  repeated IndexedSkill skills = 13;

  // Per-repo memory: maps repo relative path (e.g. "api", "forge") to the
  // concatenated content of {repo}/reliant.md + {repo}/reliant.local.md.
  // Populated eagerly by the daemon so cloud workers don't need filesystem access.
  map<string, bytes> repo_memories_md = 14;
}

message ProjectConfigDelta {
  string project_path = 1;
  string config_version = 2; // post-change version
  int64 daemon_timestamp_unix_ms = 3;

  repeated ChangedFile changed_files = 4;
  ProjectConfigSnapshot snapshot_if_compacted = 5; // optional fallback full snapshot
}

message ChangedFile {
  string relative_path = 1; // e.g. ".reliant/config.yaml"
  FileChangeType change_type = 2;
  string content_hash = 3; // empty on delete
}

// Sent by the daemon when it detects filesystem changes via polling.
// This is a nudge signal — the frontend re-fetches the full file tree.
message FileSystemChanged {
  string project_path = 1;        // Which project directory had changes
  int64 timestamp_unix_ms = 2;    // When the change was detected
}

// Sent by the daemon when a command dispatched WITHOUT a live RPC waiter
// (i.e. one drained from DAEMON_PENDING_COMMANDS after the caller that
// enqueued it already returned — see control-plane's fire-and-forget
// CloneRepo) fails. There is no synchronous response channel to carry the
// failure back to that caller, so the API server turns this into a
// user_updates row instead, which replays to the client on reconnect —
// the same path FileSystemChanged uses for the success case.
message DaemonCommandFailed {
  string request_id = 1;
  string command_type = 2;        // e.g. "git.clone"
  string error_message = 3;
  int64 timestamp_unix_ms = 4;
}

message IndexedWorkflow {
  string slug = 1;
  string name = 2;
  string relative_path = 3;
  string content_hash = 4;
  int64 mtime_unix_ms = 5;
  bytes yaml_content = 6;
}

message IndexedPreset {
  string name = 1;
  string relative_path = 2;
  string content_hash = 3;
  int64 mtime_unix_ms = 4;
  bytes yaml_content = 5;
}

message IndexedScenario {
  string workflow_slug = 1;
  string name = 2;
  string relative_path = 3;
  string content_hash = 4;
  int64 mtime_unix_ms = 5;
  bytes yaml_content = 6;
}

// IndexedSkill describes a SKILL.md discovered by the daemon during project
// config sync. The frontmatter is parsed into structured fields; the full body
// is shipped so the skill tool can render it without another round trip.
message IndexedSkill {
  string skill_path = 1;       // hierarchical path, e.g. "go/error-handling"
  string name = 2;             // normalized skill name
  string description = 3;      // from frontmatter
  string relative_path = 4;    // SKILL.md path relative to project (or empty for global/builtin)
  string content_hash = 5;
  int64 mtime_unix_ms = 6;
  string scope = 7;            // project-local | project | claude | codex | agents | global | claude-global | codex-global | builtin
  string body = 8;             // full markdown body after frontmatter
  repeated string allowed_tools = 9;
  map<string, string> metadata = 10;
  bool has_children = 11;
  bool disable_model_invocation = 12;
  // user_invocable is represented as a string so we can distinguish unset
  // (empty), true, and false. nil in frontmatter means "default true".
  string user_invocable = 13; // "", "true", "false"
  string argument_hint = 14;
  string paths = 15;
  // source identifies which nested repo the skill was discovered in. "" means
  // the project root scope; otherwise it's the repo's relative path
  // (e.g. "api", "web"). Used to disambiguate same-named skills across repos.
  string source = 16;
}

// ProjectDiscovery reports projects discovered by the daemon.
message ProjectDiscovery {
  repeated DiscoveredProject projects = 1;
}

// DiscoveredProject describes a local project path known by the daemon.
message DiscoveredProject {
  string path = 1;
  string name = 2;
  bool is_git_repo = 3;
}

// ToolExecutionCancel asks daemon to cancel an in-flight tool execution.
message ToolExecutionCancel {
  string request_id = 1;
  string reason = 2;
}

// ToolExecutionBackground asks the daemon to detach an in-flight tool execution
// into a background process, so the workflow can proceed while the command
// keeps running.
//
// This exists because the execution lives in the DAEMON, which is a separate
// process and may be on a different machine. The API server's in-memory
// "backgrounded" signal (shell.BackgroundSignal) cannot be observed there, so a
// message has to cross the wire — exactly as cancellation does.
message ToolExecutionBackground {
  // RequestID correlates to the in-flight execution, the same handle
  // ToolExecutionCancel uses.
  string request_id = 1;
  // ToolCallID is the LLM tool-call id, carried so the daemon can report the
  // resulting background process back against the right tool call.
  string tool_call_id = 2;
}

// ReportToolResultRequest is used by the daemon to report a tool execution
// result via a unary RPC when the bidirectional stream is unavailable.
message ReportToolResultRequest {
  string request_id = 1;
  bool success = 2;
  bool is_error = 3;
  string content = 4;
  string metadata = 5;
  string error_message = 6;
  string error_code = 7;
  string daemon_id = 8;
  string user_id = 9;
  bool backgrounded = 10;
}

message ReportToolResultResponse {
  bool accepted = 1;
}

// DaemonKillProcessRequest asks the daemon to kill a background process.
message DaemonKillProcessRequest {
  string process_id = 1;
}

// DaemonKillProcessResponse is sent back from the daemon after attempting to kill a process.
message DaemonKillProcessResponse {
  string process_id = 1;
  bool success = 2;
  string error_message = 3;
}

// DaemonCommandRequest is a generic command envelope sent from server to daemon.
// New daemon commands only need a handler registered in the daemon's CommandRegistry
// instead of new proto messages, oneof variants, and routing in every layer.
message DaemonCommandRequest {
  string request_id = 1;
  string command_type = 2; // e.g. "worktree.create", "project.check_git"
  bytes payload = 3; // JSON-encoded command-specific payload
  int32 timeout_ms = 4;

  // policy confines what this command may touch. It is set only for connector
  // callers (third-party MCP clients driving the daemon on a user's behalf);
  // first-party callers leave it unset, which means unrestricted and preserves
  // the daemon's existing behavior exactly.
  //
  // The daemon enforces this at command dispatch rather than trusting the
  // sender to have filtered, so any caller that speaks this protocol is
  // covered.
  optional ConnectorPolicy policy = 5;
}

// ConnectorPolicy is the wire form of a connector grant, resolved by the
// server and enforced by the daemon.
//
// Every field is restrictive: an absent or empty field grants nothing rather
// than everything, so a partially-populated policy fails closed.
message ConnectorPolicy {
  // grant_id identifies the originating grant, for audit records.
  string grant_id = 1;

  // allowed_tools lists permitted command types. Empty denies all commands.
  // Matching is exact — a command added to the daemon later stays denied until
  // a grant names it.
  repeated string allowed_tools = 2;

  // path_root confines filesystem access to a directory subtree. Empty grants
  // no filesystem access at all.
  string path_root = 3;

  // exec_mode is one of "" (deny), "allowlist", or "unrestricted".
  string exec_mode = 4;

  // exec_allowlist holds permitted command basenames when exec_mode is
  // "allowlist" (e.g. "git", "go").
  repeated string exec_allowlist = 5;

  // expires_at is an RFC3339 timestamp bounding the grant. Empty means no
  // expiry.
  string expires_at = 6;
}

// DaemonCommandResponse is the generic response from daemon back to server.
message DaemonCommandResponse {
  string request_id = 1;
  string command_type = 2;
  bool success = 3;
  bytes payload = 4; // JSON-encoded response
  string error_message = 5;
}

// ============================================
// Daemon registry, token, and auth services have moved to:
//   - daemon_registry.proto  (JWT auth, list/get/resolve/resume)
//   - daemon_token.proto     (JWT auth, PAT CRUD)
//   - daemon_auth.proto      (PAT auth, Ping for token introspection)
// ============================================

// ============================================
// Terminal I/O Streaming Messages
// ============================================

// TerminalInputMessage sends raw PTY input bytes (server -> daemon)
message TerminalInputMessage {
  string session_id = 1;
  bytes data = 2;           // Raw PTY input bytes
}

// TerminalResizeMessage requests a terminal resize (server -> daemon)
message TerminalResizeMessage {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// TerminalOutputMessage sends raw PTY output bytes (daemon -> server)
message TerminalOutputMessage {
  string session_id = 1;
  bytes data = 2;            // Raw PTY output bytes
}

// TerminalSessionEvent reports terminal session lifecycle events (daemon -> server)
message TerminalSessionEvent {
  string session_id = 1;
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_CREATED = 1;
    EVENT_TYPE_CLOSED = 2;
    EVENT_TYPE_ERROR = 3;
  }
  EventType event_type = 2;
  string message = 3;        // Error message or additional info
  int32 pid = 4;              // PID of the shell process (on created)
}

// TerminalOutputSubscribeMessage subscribes to a terminal session's output
// (server -> daemon). Mirrors ProcessOutputSubscribeMessage: the daemon defers
// starting the PTY output pump until this arrives, so the initial shell prompt
// is buffered until the full subscriber chain is established.
message TerminalOutputSubscribeMessage {
  string session_id = 1;
}

// ============================================
// Process Output Streaming Messages
// ============================================

// ProcessOutputSubscribeMessage subscribes to a process's output (server -> daemon)
message ProcessOutputSubscribeMessage {
  string process_id = 1;
  bool new_only = 2;          // If true, skip existing output
}

// ProcessOutputUnsubscribeMessage unsubscribes from a process's output (server -> daemon)
message ProcessOutputUnsubscribeMessage {
  string process_id = 1;
}

// ProcessOutputChunkMessage sends a chunk of process output (daemon -> server)
message ProcessOutputChunkMessage {
  string process_id = 1;
  string data = 2;            // Output text
  string stream = 3;          // "stdout" or "stderr"
  uint64 sequence = 4;        // Sequence number for ordering
  bool is_complete = 5;       // True when process has exited
  int32 exit_code = 6;        // Only meaningful when is_complete=true
}