syntax = "proto3";

package reliant.v1;

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ============================================
// Workflow Scenarios - Test workflows with mocked events
// ============================================

// forge:unmanaged — reliant's own handlers serve this service, not forge's;
// it is adopted in its own PR (research/forge-migration/PLAN.md, P3b).

// ScenarioService handles workflow scenario testing
service ScenarioService {
  // ListScenarios returns all scenarios for a workflow
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse) {}

  // CreateScenario creates a new scenario and optionally runs it
  rpc CreateScenario(CreateScenarioRequest) returns (CreateScenarioResponse) {}

  // RunScenario runs a scenario against a workflow
  rpc RunScenario(RunScenarioRequest) returns (RunScenarioResponse) {}

  // DeleteScenario deletes a scenario
  rpc DeleteScenario(DeleteScenarioRequest) returns (DeleteScenarioResponse) {}

  // UploadScenario saves a scenario YAML file to the project directory
  rpc UploadScenario(UploadScenarioRequest) returns (UploadScenarioResponse) {}

  // ExportScenario exports a scenario to YAML format
  rpc ExportScenario(ExportScenarioRequest) returns (ExportScenarioResponse) {}
}

// SimulatedEvent represents a single event in the simulation.
// The output_json contains the mock output that will be returned by the node,
// matching the activity's output structure directly (no translation needed).
message SimulatedEvent {
  // Node targets a specific node (supports qualified IDs for inner loops and workflows).
  // Use dot-notation: "loop_id.inner_node_id" or "outer.inner.node_id".
  // If omitted, events are applied sequentially.
  string node = 1;

  // Output is the mock output returned by the node as JSON.
  // This should match the activity's output structure directly:
  //   - call_llm: message, response_text, tool_calls, input_tokens, etc.
  //   - execute_tools: message, tool_results, thread_token_count, etc.
  //   - approval: approval_id, status, action_taken, data
  //   - run: exit_code, stdout, stderr
  string output_json = 2;
}

// ScenarioExpectation defines what we expect from the simulation
message ScenarioExpectation {
  string outcome = 1;                // Expected outcome: completed, error
  repeated string reached = 2;       // Nodes that should be executed
  repeated string not_reached = 3;   // Nodes that should NOT be executed
  string error_contains = 4;         // Substring in error message
  string error_node = 5;             // Node where error should occur
}

// ScenarioDefinition defines a complete test scenario
message ScenarioDefinition {
  string name = 1;                   // Scenario name
  string description = 2;            // What this scenario tests
  repeated SimulatedEvent events = 3; // Sequence of simulated events
  ScenarioExpectation expect = 4;    // Expected outcome
  string inputs_json = 5;            // Override workflow inputs (JSON)
}

// ErrorDetails contains information about an error that occurred
message ErrorDetails {
  string node = 1;       // Node where error occurred
  string step = 2;       // Step within the node
  string message = 3;    // Error message
  string expression = 4; // CEL expression that failed
}

// ExecutionDetails contains details about the simulation execution
message ExecutionDetails {
  repeated string nodes_reached = 1;  // Nodes that were executed
  string outcome = 2;                 // "completed" or "error"
  ErrorDetails error = 3;             // Error details if outcome is "error"
  int64 duration_ms = 4;              // Execution duration in milliseconds
}

// ScenarioResult contains the result of running a scenario
message ScenarioResult {
  string status = 1;                  // passed, failed, error
  string scenario_name = 2;           // Name of the scenario
  ExecutionDetails execution = 3;     // Execution details
  ScenarioExpectation expected = 4;   // Expected outcome (if set)
  repeated string mismatches = 5;     // Expectation mismatches
}

// Scenario is a saved scenario with metadata
message Scenario {
  string id = 1;
  string workflow_draft_id = 2;       // FK to workflow draft (optional)
  string user_id = 3;
  string name = 4;
  string description = 5;
  repeated SimulatedEvent events = 6;
  ScenarioExpectation expect = 7;
  string last_run_status = 8;         // passed, failed, error
  ScenarioResult last_run_result = 9;
  string created_at = 10;
  string updated_at = 11;
  string source = 12;                 // "user" (DB) or "project" (file)
  string path = 13;                   // File path for project scenarios
}

// ListScenarios
message ListScenariosRequest {
  string project_id = 1;
  string workflow_slug = 2;  // Workflow to list scenarios for
}

message ListScenariosResponse {
  repeated Scenario scenarios = 1;
  string scenarios_dir = 2;           // Directory path for file-based scenarios
}

// CreateScenario
message CreateScenarioRequest {
  string project_id = 1;
  string workflow_slug = 2;           // Workflow to test (optional if workflow_yaml provided)
  string workflow_yaml = 3;           // Raw YAML to test (optional)
  ScenarioDefinition scenario = 4;    // Scenario to create
  bool run = 5;                       // Run immediately after creating
  bool save = 6;                      // Save the scenario for future runs
}

message CreateScenarioResponse {
  bool success = 1;
  string message = 2;
  Scenario scenario = 3;              // Created scenario (if save=true)
  ScenarioResult result = 4;          // Run result (if run=true)
}

// RunScenario
message RunScenarioRequest {
  string project_id = 1;
  string scenario_id = 2;             // ID of saved scenario to run
  // OR run ad-hoc:
  string workflow_slug = 3;           // Workflow to test
  ScenarioDefinition scenario = 4;    // Ad-hoc scenario to run
}

message RunScenarioResponse {
  ScenarioResult result = 1;
}

// DeleteScenario
message DeleteScenarioRequest {
  string project_id = 1;
  string scenario_id = 2;
}

message DeleteScenarioResponse {
  bool success = 1;
  string message = 2;
}

// UploadScenario - saves a scenario YAML file to the project directory
message UploadScenarioRequest {
  string project_id = 1;
  string workflow_slug = 2;           // Workflow to associate with
  string filename = 3;                // Filename without extension (e.g., "happy-path")
  string yaml_content = 4;            // YAML content of the scenario
}

message UploadScenarioResponse {
  bool success = 1;
  string message = 2;
  string path = 3;                    // Full path to the created file
  Scenario scenario = 4;              // The created scenario
}

// ExportScenario - exports a scenario to YAML format
message ExportScenarioRequest {
  string project_id = 1;
  string scenario_id = 2;             // ID of the scenario to export
}

message ExportScenarioResponse {
  string yaml_content = 1;            // YAML content of the scenario
  string filename = 2;                // Suggested filename
}
