syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// CoverageSourceService shows the source of a file a coverage report covers,
// read from the project's GitHub repository at view time (forge
// docs/proposals/tests-coverage-flakes.md, Amendment 1 part A).
//
// NO SOURCE IS STORED. A coverage report (control-plane's TestsService)
// carries repo-relative paths, positions, hit counts and each covered file's
// git blob id, never text. This service reads one blob by its id
// (`GET /repos/{owner}/{repo}/git/blobs/{sha}`) with the VIEWER's own GitHub
// token (control-plane's delegated token when hosted, their saved GitHub
// connection when self-hosted), so it shows a person only what GitHub would
// show them. A blob is immutable, so an answer is cached briefly in memory,
// per viewer; nothing reaches disk.
//
// WHO MAY READ. The viewer needs tests:read on the forge project in the org,
// which control-plane checks: before anything is fetched, this service asks
// control-plane (TestsService.HasCoverageBlob, with the viewer's own bearer)
// whether the blob is in a retained report of that project. A blob that is
// not is NotFound, so tests:read never reads an arbitrary file of the
// repository; a viewer without tests:read is PermissionDenied. A control
// plane that cannot answer the question is NOT_YET_AVAILABLE, and nothing is
// fetched.
service CoverageSourceService {
  // GetCoverageSource returns one covered file's bytes, or why there are none
  // to show. Every unavailable reason is a normal answer: the coverage page
  // then shows line numbers and hit counts with one line saying why.
  rpc GetCoverageSource(GetCoverageSourceRequest) returns (GetCoverageSourceResponse) {
    option (forge.v1.method) = {
      activity: {none: "read-only: one covered file's source from GitHub; changes nothing"}
    };
  }
}

message GetCoverageSourceRequest {
  // The forge project (forge.yaml `name`), as control-plane's TestsService
  // names it.
  string project = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The file's git blob id, as the coverage report names it: 40 hex digits
  // (SHA-1), or 64 (SHA-256).
  string blob_id = 2 [(buf.validate.field).string.pattern = "^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$"];
  // The org the read acts in (docs/orgs.md). Unset: the caller's default org.
  optional string org_id = 3;
}

message GetCoverageSourceResponse {
  oneof result {
    // The blob's exact bytes. The caller checks them against blob_id before
    // drawing coverage over them.
    bytes content = 1;
    // Why there is no source to show.
    CoverageSourceUnavailable unavailable = 2;
  }
}

// CoverageSourceUnavailable is why a covered file has no source to show.
enum CoverageSourceUnavailable {
  COVERAGE_SOURCE_UNAVAILABLE_UNSPECIFIED = 0;
  // No project of the org that holds this forge project has a github.com
  // remote the viewer can read (a local folder, GitLab, Bitbucket, GitHub
  // Enterprise Server).
  COVERAGE_SOURCE_UNAVAILABLE_NO_REPO = 1;
  // The run that reported the file had uncommitted changes: the blob is in
  // no commit.
  COVERAGE_SOURCE_UNAVAILABLE_UNCOMMITTED = 2;
  // GitHub does not have the blob, or does not show it to the viewer
  // (history rewritten, the repository deleted, moved or private to them).
  COVERAGE_SOURCE_UNAVAILABLE_GONE = 3;
  // The viewer's GitHub is not connected, needs reconnecting, or GitHub
  // refused their token.
  COVERAGE_SOURCE_UNAVAILABLE_REVOKED = 4;
  // This deployment cannot check that the blob is in a report yet (its
  // control plane has no TestsService.HasCoverageBlob, or there is no
  // control plane), so nothing is fetched.
  COVERAGE_SOURCE_UNAVAILABLE_NOT_YET_AVAILABLE = 5;
  // The file is larger than the viewer shows (2 MiB).
  COVERAGE_SOURCE_UNAVAILABLE_TOO_LARGE = 6;
}
