syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/struct.proto";
import "reliant/v1/chat.proto";
import "reliant/v1/run.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// TriggerService manages standing instructions that start runs without a human
// typing: "every weekday at 9am, run workflow W in project P with prompt M".
//
// A Trigger is the stored definition. A TriggerEvent is one firing of it —
// kind, dedupe key, when, payload, and what the firing did. Both are described
// in research/TRIGGERS.md.
//
// Sources are arms of Trigger.source rather than new services: they differ in
// what makes them fire, not in what they do once fired. A trigger fires on a
// schedule, an inbound webhook, an integration event (a provider's app-level
// webhook or a poll), or another workflow's run reaching an outcome.
//
// The source messages (ScheduleSource, WebhookSource, IntegrationSource,
// WorkflowEventSource) are standalone so a workflow definition can declare
// the same "when" in its own `triggers:` block (WorkflowTrigger). A Trigger
// row is the activation: who the run executes as, where, and on which
// connection and daemon.
service TriggerService {
  // CreateTrigger stores a new trigger and converges its schedule.
  // forge:custom — validates the definition against its source and workflow, then converges its schedule
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse) {}

  // GetTrigger returns one trigger, including its read-only next fire time
  // and most recent firing.
  // forge:custom — owner-scoped, rendered with its next fire time and most recent firing
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse) {}

  // ListTriggers returns the caller's triggers, optionally narrowed to one
  // project.
  // forge:custom — the caller's triggers, rendered with their schedules and recent firings
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse) {}

  // UpdateTrigger replaces a trigger's definition and reconverges its
  // schedule. The owner and kind are not updatable.
  // forge:custom — replaces an owned trigger's definition and reconverges its schedule
  rpc UpdateTrigger(UpdateTriggerRequest) returns (UpdateTriggerResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "update"
        target: {
          kind: "trigger"
          id: "id"
          label: "response.trigger.name"
        }
      }
    };
  }

  // DeleteTrigger removes a trigger and its schedule. Its firing history
  // survives, with trigger_id cleared — the runs it started still exist.
  // forge:custom — also removes the schedule and releases the trigger's automation credential
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse) {}

  // SetTriggerEnabled pauses or resumes a trigger. Disabling pauses the
  // schedule rather than deleting it, so re-enabling needs no re-derivation.
  rpc SetTriggerEnabled(SetTriggerEnabledRequest) returns (SetTriggerEnabledResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_enabled"
        target: {
          kind: "trigger"
          id: "id"
          label: "response.trigger.name"
        }
        detail: ["enabled"]
      }
    };
  }

  // FireTrigger runs a trigger now, out of band with its schedule. A manual
  // fire skips the enabled and overlap checks: the human asking for it has
  // already made that decision.
  rpc FireTrigger(FireTriggerRequest) returns (FireTriggerResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "fire"
        target: {
          kind: "trigger"
          id: "id"
        }
        detail: ["response.fire_workflow_id"]
      }
    };
  }

  // ListTriggerEvents returns a trigger's firings, newest first, paged by a
  // keyset cursor. Each launched firing carries the state of the run it started.
  // forge:custom — pages one owned trigger's firings by a keyset cursor, with each run's state
  rpc ListTriggerEvents(ListTriggerEventsRequest) returns (ListTriggerEventsResponse) {}

  // GetLaunchEvent returns the event that launched a chat: its kind, the
  // scheduled slot and manual flag for a schedule, the parent chat for an
  // agent start, and the start (workflow, presets, params) for all of them.
  // Owner only; a chat that is not the caller's is NotFound.
  //
  // A separate RPC rather than a Chat field because trigger.proto imports
  // chat.proto, so Chat cannot reference TriggerEvent without a cycle.
  rpc GetLaunchEvent(GetLaunchEventRequest) returns (GetLaunchEventResponse) {}

  // RotateWebhookToken replaces a webhook trigger's token. The old token
  // stops working immediately; the new one is returned once and never again.
  rpc RotateWebhookToken(RotateWebhookTokenRequest) returns (RotateWebhookTokenResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "rotate_webhook_token"
        target: {
          kind: "trigger"
          id: "id"
          label: "response.trigger.name"
        }
      }
    };
  }

  // EnableWorkflow turns on every trigger a workflow declares, as one act:
  // the user's choice of project, machine and connected accounts, applied to
  // all of them. It is the one way a workflow's triggers start running; no
  // agent tool can do it.
  //
  // All or nothing. Every declared trigger is validated before anything is
  // written, so a missing connection on one of them refuses the lot and
  // names it; the response says per trigger what happened, and when it is
  // not `enabled` nothing new is running.
  //
  // It is also how an automation's settings change. A trigger the user
  // already has an activation of (in this project) is brought to the
  // request's choices, re-validated exactly like a new one, and turned on:
  // the request describes the whole setup, so a per-trigger difference the
  // request does not restate in `overrides` is replaced. Only the
  // activation's name, an unnamed connection and an unspecified acting
  // identity are kept from what it had. A failed write puts every changed
  // activation back as it was.
  rpc EnableWorkflow(EnableWorkflowRequest) returns (EnableWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "enable"
        target: {
          kind: "workflow"
          id: "workflow"
        }
        detail: ["project_id"]
      }
    };
  }

  // DisableWorkflow pauses every activation of a workflow. Unlike enabling it
  // is not all-or-nothing: a pause that fails must not stop the others from
  // pausing, so it reports each failure and pauses the rest.
  rpc DisableWorkflow(DisableWorkflowRequest) returns (DisableWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "disable"
        target: {
          kind: "workflow"
          id: "workflow"
        }
        detail: ["project_id"]
      }
    };
  }

  // ResolveTriggerSenders looks people up for a trigger's "Only from": a
  // handle (a GitHub login) to the id trigger.sender.id carries, and an id
  // back to the person's current name. It asks the provider with the
  // CALLER's own credential for the integration. GitHub only; a caller with
  // no usable GitHub credential is FailedPrecondition.
  //
  // It only reads, and says so with NO_SIDE_EFFECTS: its name is not a read
  // verb, so without it forge generates a mutation hook for it.
  rpc ResolveTriggerSenders(ResolveTriggerSendersRequest) returns (ResolveTriggerSendersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListReplayEvents lists the recent events the caller's activations of a
  // workflow's declared triggers received, newest first, so one can be run
  // again with ChatService.RunNow.
  rpc ListReplayEvents(ListReplayEventsRequest) returns (ListReplayEventsResponse) {}

  // PreviewReplay maps a past event through a declared trigger's inputs and
  // prompt, as a fire of that event would. Only the mapping applies: the
  // trigger's filter and origin_filter are not evaluated, because the person
  // replaying has decided the event is wanted.
  //
  // With trigger_id, previews an owned inline or declared automation against
  // a sample payload using the actual event-fire mapping, including the full
  // seeded user message. Works while paused and never enables it. Neither
  // preview mode tests delivery, authentication, filters or workflow execution.
  //
  // It only reads (nothing is fired or recorded), and says so with
  // NO_SIDE_EFFECTS, for the same reason as ResolveTriggerSenders.
  rpc PreviewReplay(PreviewReplayRequest) returns (PreviewReplayResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DraftAutomation turns a person's description ("every weekday at 9,
  // summarise yesterday's failed CI runs") into a proposed automation for
  // them to review in the automation dialog. It stores nothing and creates
  // nothing: only the person's Create in the dialog makes a trigger. The
  // draft is written by the caller's own fast model, with the draft_automation
  // tool's schema as the structured output, and normalized by the same code
  // that tool runs.
  rpc DraftAutomation(DraftAutomationRequest) returns (DraftAutomationResponse) {
    option (forge.v1.method) = {
      activity: {none: "Proposes an automation for review; only CreateTrigger persists it"}
    };
  }
}

// TriggerKind is the source a stored trigger listens to.
enum TriggerKind {
  TRIGGER_KIND_UNSPECIFIED = 0;
  // SCHEDULE fires on a cron or interval schedule.
  TRIGGER_KIND_SCHEDULE = 1;
  // WEBHOOK fires on a POST to the trigger's own URL.
  TRIGGER_KIND_WEBHOOK = 2;
  // INTEGRATION fires on a provider event received through one of the
  // owner's connections (an app-level webhook or a poll).
  TRIGGER_KIND_INTEGRATION = 3;
  // WORKFLOW_EVENT fires when a run of one of the owner's workflows
  // finishes, fails or blocks.
  TRIGGER_KIND_WORKFLOW_EVENT = 4;
}

// TriggerEventKind is the kind of a single firing. It is wider than
// TriggerKind: ad hoc sources produce events with no stored trigger behind
// them.
enum TriggerEventKind {
  TRIGGER_EVENT_KIND_UNSPECIFIED = 0;
  // CHAT_START is the first send of a chat — an interactive start, which is a
  // trigger event with no stored definition. Its dedupe key is the chat id.
  TRIGGER_EVENT_KIND_CHAT_START = 1;
  // SCHEDULE is a scheduled fire. Its dedupe key is the Temporal
  // fire-workflow id, which is unique per scheduled time.
  TRIGGER_EVENT_KIND_SCHEDULE = 2;
  // AGENT_START_RUN is a top-level run an agent started with its start_run
  // tool. Its dedupe key is "<calling chat id>:<tool call id>" and its payload
  // carries parent_chat_id.
  TRIGGER_EVENT_KIND_AGENT_START_RUN = 3;
  // BUILDER_TEST is a test run started from the workflow builder's Run tab.
  // Attended, with the chat id as its dedupe key. It is hidden from the
  // sidebar and from the default Runs list.
  TRIGGER_EVENT_KIND_BUILDER_TEST = 4;
  // WEBHOOK is a POST to a webhook trigger's URL. Its dedupe key is
  // "<trigger id>:<sender's idempotency key>", or a body hash within a
  // one-minute bucket when the sender gives none.
  TRIGGER_EVENT_KIND_WEBHOOK = 5;
  // INTEGRATION is a provider event. Its dedupe key is
  // "<trigger id>:<provider delivery id>", so one delivery fans out to every
  // matching trigger exactly once each.
  TRIGGER_EVENT_KIND_INTEGRATION = 6;
  // WORKFLOW_EVENT is another run reaching an outcome.
  TRIGGER_EVENT_KIND_WORKFLOW_EVENT = 7;
  // MANUAL_RUN is a run a person started with "Run now" on a workflow
  // (RunService.RunNow). Attended, with the chat id as its dedupe key. When it
  // replays a past event, its payload names that event.
  TRIGGER_EVENT_KIND_MANUAL_RUN = 8;
  // CLI_RUN is a run started from the command line (`reliant workflow run`):
  // by a script, or by an agent shelling out. Attended, with the chat id as
  // its dedupe key. Like AGENT_START_RUN it lists under Runs and stays out of
  // the sidebar until adopted.
  TRIGGER_EVENT_KIND_CLI_RUN = 9;
}

// TriggerEventOutcome records what a firing did.
enum TriggerEventOutcome {
  TRIGGER_EVENT_OUTCOME_UNSPECIFIED = 0;
  // LAUNCHED: a session was materialized and its run started. chat_id is set.
  TRIGGER_EVENT_OUTCOME_LAUNCHED = 1;
  // SKIPPED: the firing was deliberately not launched — the trigger was
  // disabled, or its previous run was still going under overlap SKIP.
  TRIGGER_EVENT_OUTCOME_SKIPPED = 2;
  // FAILED: the firing tried to launch and could not. outcome_detail says why.
  TRIGGER_EVENT_OUTCOME_FAILED = 3;
  // PENDING: an inbound event was received and passed its filter; the worker
  // has not launched it yet. Settles to LAUNCHED, SKIPPED or FAILED.
  TRIGGER_EVENT_OUTCOME_PENDING = 4;
}

// ActingIdentity is who the integration writes of a trigger's runs speak as.
//
// It is chosen per activation, because the same declared trigger can be
// activated by an owner who wants their own name on the comments and by an
// owner who wants a bot's. It applies to every GitHub write the run makes (a
// node's `action`, an agent's integration tools and git_publish alike), and only
// to a run the trigger fired: a person replying in that chat acts as themselves.
// Integrations with no bot (Slack, Gmail, Twilio, HTTP) always write through the
// owner's connection.
enum ActingIdentity {
  ACTING_IDENTITY_UNSPECIFIED = 0;
  // OWNER: the activation's owner, through their own GitHub App user token. An
  // explicit opt-in; the default only on a deployment with no control plane,
  // for a source other than a GitHub integration trigger.
  ACTING_IDENTITY_OWNER = 1;
  // APP: the GitHub App's bot (`reliant-labs[bot]`), through a per-repository
  // installation token. control-plane mints it only when the owner's own token
  // has push access to that repository, scopes it to that one repository and to
  // issues, pull requests and contents, and bot-authored comments, reviews and
  // pull requests end with a footer naming the automation and its owner. The
  // default for every new activation. Needs a hosted deployment: a self-hosted
  // one has no App key to mint from and refuses this value.
  ACTING_IDENTITY_APP = 2;
}

// TriggerOverlapPolicy decides what a scheduled fire does when this trigger's
// previous run has not finished.
enum TriggerOverlapPolicy {
  TRIGGER_OVERLAP_POLICY_UNSPECIFIED = 0;
  // SKIP (the default): do not fire while the previous run is active or
  // paused. Record a skipped event instead.
  TRIGGER_OVERLAP_POLICY_SKIP = 1;
  // ALLOW: fire regardless, launching a concurrent run.
  TRIGGER_OVERLAP_POLICY_ALLOW = 2;
}

// TriggerHealthStatus summarises how a trigger's recent firings went.
//
// It is computed on read from the trigger's last 10 firings (newest first),
// plus the run each launched firing started. Each firing resolves to one result:
//   - SKIPPED outcome: skipped.
//   - FAILED outcome (the launch failed): failure.
//   - LAUNCHED whose run ended FAILED: failure. A run that launched and then
//     died is a failed automation, which is the point of this status.
//   - LAUNCHED whose run COMPLETED: success.
//   - LAUNCHED whose run is still going (queued, running, needs input, paused),
//     was cancelled, or whose chat was deleted: unresolved. Unresolved firings
//     are neither a success nor a failure and never end a failure streak.
//
// The status is then, first match wins:
//   - BROKEN: the trigger activates a workflow-declared trigger
//     (Trigger.workflow_trigger) that cannot be used — the workflow is gone
//     or not runnable, it no longer declares that name, or the declaration
//     changed in a way this activation cannot follow (another kind, another
//     integration). Its firings fail until the declaration is restored, or it
//     is re-activated or deleted; last_failure_detail says why. Computed from
//     the workflow on read; firings are not consulted.
//   - FAILING: two or more consecutive failures, newest first. Skipped and
//     unresolved firings are passed over; a success ends the streak.
//   - DEGRADED: any failure in the window that did not make it FAILING, or
//     three or more consecutive skipped SCHEDULE firings from the newest back.
//     An event-driven trigger's skips are its filter working (most events of
//     a busy source are not for it), so they never degrade it.
//   - HEALTHY: no failure in the window and at least one completed run.
//   - UNKNOWN: anything else, including a trigger that has never fired.
enum TriggerHealthStatus {
  TRIGGER_HEALTH_STATUS_UNSPECIFIED = 0;
  TRIGGER_HEALTH_STATUS_HEALTHY = 1;
  TRIGGER_HEALTH_STATUS_DEGRADED = 2;
  TRIGGER_HEALTH_STATUS_FAILING = 3;
  TRIGGER_HEALTH_STATUS_UNKNOWN = 4;
  TRIGGER_HEALTH_STATUS_BROKEN = 5;
  // NEEDS_SETUP: the activation's stored params do not satisfy the workflow's
  // current inputs (a required input has no value). Computed on read; the
  // fix is to finish setup, not to repair the workflow. BROKEN takes
  // precedence; NEEDS_SETUP takes precedence over every firing-derived
  // status, because nothing the activation fires can launch until it is
  // fixed. health.setup_issues says which inputs.
  TRIGGER_HEALTH_STATUS_NEEDS_SETUP = 6;
}

// TriggerHealth is the read-only health summary of a trigger. See
// TriggerHealthStatus for the rules.
message TriggerHealth {
  TriggerHealthStatus status = 1;

  // Failures in a row from the newest firing back, passing over skipped and
  // unresolved firings; a success ends the streak. Within the last 10 firings.
  int32 consecutive_failures = 2;

  // Skipped firings in a row from the newest firing back, within the last 10
  // firings. Anything other than a skip ends the streak.
  int32 consecutive_skips = 3;

  // What went wrong in the most recent failure in the window: the launch
  // error for a FAILED firing, or a short description of the failed run.
  // Empty when the window holds no failure. For NEEDS_SETUP it reads
  // "needs setup: repos is required".
  string last_failure_detail = 4;

  // NEEDS_SETUP only: what is missing or invalid, one entry per workflow
  // input, in input-name order, so a client can focus the field.
  repeated TriggerSetupIssue setup_issues = 5;
}

// TriggerSetupIssue is one input an activation's params do not satisfy.
message TriggerSetupIssue {
  // The workflow input the issue is about.
  string input = 1;

  // What is wrong, as a sentence that names the input: "repos is required",
  // "input 'repos' requires at least 1 item(s)".
  string message = 2;
}

// TriggerEventRun is the run a launched firing started, as of now.
message TriggerEventRun {
  // The single state a user reads for the run. Derived by the same rule as
  // Run.display_state, so a firing and the Runs list cannot disagree.
  RunDisplayState display_state = 1;

  // The run's title.
  string title = 2;

  // The root workflow's lifecycle state and, when STOPPED, why. Unspecified
  // when the run has no root workflow row yet.
  WorkflowState state = 3;
  WorkflowStopReason stop_reason = 4;
}

// ScheduleSource is the trigger.source arm for schedule triggers.
message ScheduleSource {
  // 5-field cron expressions. Multiple entries are a UNION: the trigger fires
  // at every time any of them matches.
  repeated string cron = 1;

  // Fire every interval, as a Go duration ("15m", "1h"). Combined with cron
  // as a union rather than overriding it.
  optional string interval = 2;

  // IANA zone name the cron expressions are interpreted in. Empty means UTC.
  string timezone = 3;

  // What a fire does when the previous run is still going. Unspecified is
  // treated as SKIP.
  TriggerOverlapPolicy overlap = 4;

  // How late a missed fire may still run after an outage, as a Go duration.
  // Empty means 10m — deliberately not Temporal's one-year default, which
  // would replay a year of missed unattended runs on recovery.
  optional string catchup_window = 5;
}

// WebhookSource is the trigger.source arm for a trigger that fires on a POST
// to its own URL. A delivery is accepted when ANY ONE of these holds:
//
//   - the URL is <PUBLIC_URL>/hooks/{trigger_id}/{token} with the trigger's
//     token in the path (what a sender that cannot set headers uses — Zapier);
//   - the URL is <PUBLIC_URL>/hooks/{trigger_id} with
//     `Authorization: Bearer <token>`;
//   - hmac is configured and the body carries a valid signature.
//
// The token is generated by the server, stored hashed, shown once at create
// (and on rotation), and never part of a definition. The event's
// trigger.payload is {body, headers, query, content_type}: body is the parsed
// JSON (or the raw text), and headers and query have secret-bearing entries
// removed.
message WebhookSource {
  // Optional HMAC verification for senders that sign their deliveries.
  // Configuring it adds a way in; it does not disable the token.
  WebhookHmac hmac = 1;

  // Who delivers to this webhook, when Reliant wires the sender itself.
  //
  //   ""          whatever the user points at it: Enable shows the URL and the
  //               token once, and the user configures the sender.
  //   "alerting"  the control plane's alerting (Alertmanager). On a hosted
  //               deployment, enabling the activation provisions an Autopilot
  //               receiver in the owner's organization that delivers every
  //               alert of the project's environments that passes its filter,
  //               and disabling or deleting it removes the receiver. The token
  //               goes to the control plane and is never shown. A deployment
  //               with no control plane treats it as "": a plain webhook.
  //
  // Only a workflow's declared trigger may set it; an ad hoc trigger is
  // refused, because Reliant reconciles provisioned receivers against
  // activations.
  string source = 2;
}

// WebhookHmac describes how a sender signs a webhook body. The signature is
// an HMAC of the raw request body under a shared secret. The secret is set on
// the trigger (TriggerDefinition.webhook_hmac_secret), never here, so a
// definition can be shared without it.
message WebhookHmac {
  // Request header carrying the signature. Empty means "X-Signature-256".
  string header = 1;
  // Digest algorithm: "sha256" (the default when empty), "sha1" or "sha512".
  string algorithm = 2;
  // Text the sender puts before the digest, removed before comparing, e.g.
  // "sha256=". Empty means none.
  string prefix = 3;
  // How the digest is written: "hex" (the default when empty) or "base64".
  string encoding = 4;
}

// IntegrationSource is the trigger.source arm for a trigger that fires on a
// provider event — a provider's app-level webhook (GitHub, Slack, Twilio) or
// a poll (Gmail). Which mechanism is the integration's, not the trigger's.
//
// An event reaches the trigger only when ALL of these hold: its type is in
// events; the trigger's connection belongs to the trigger's owner, is
// active, and covers the event's account; every match entry equals the
// event's attribute; and the trigger's filter, if any, is true. The event's
// trigger.payload is {integration, event, account, delivery_id, attributes,
// data}, where data is the provider's own payload.
message IntegrationSource {
  // Integration id, e.g. "github". It must provide an inbound trigger source.
  string integration = 1;

  // Event types to fire on, as the integration names them, e.g.
  // "issues.opened". A trailing ".*" matches every action of a type
  // ("issues.*"). At least one is required.
  repeated string events = 2;

  // Event attributes that must all equal these values, e.g.
  // repository: acme/app or channel: C0123. The attribute names are the
  // integration's. Empty matches any event of the listed types.
  map<string, string> match = 3;

  // Polled integrations only: how often to poll, as a Go duration. Empty
  // means the integration's default.
  string poll_interval = 4;

  // Event attributes that must equal one of the values of a workflow input,
  // written `match: {repository: {input: repos}}`: attribute name -> input
  // name. The input's type must be the attribute's declared type (single or
  // multi). An unset input matches nothing. Applied together with `match`.
  map<string, string> match_input = 5;
}

// WorkflowEventSource is the trigger.source arm for a trigger that fires when
// a run of one of the owner's workflows reaches an outcome. A trigger never
// fires on a run it launched itself (or one of that run's descendants).
message WorkflowEventSource {
  // Workflow refs whose runs this matches, written as a trigger names its
  // workflow: a slug, or builtin://<name>. Empty matches a run of any of the
  // owner's workflows.
  repeated string workflows = 1;

  // Outcomes to fire on: "finished", "failed", or "blocked" (waiting on an
  // approval or a question). Empty matches all three.
  repeated string outcomes = 2;
}

// WorkflowTrigger is a trigger declared by a workflow definition (the
// workflow's `triggers:` block): WHEN the workflow should run. It carries no
// identity — whose run, which project, which connection and daemon — because
// a definition is shared and those belong to whoever activates it. A Trigger
// row activates one by name (TriggerDefinition.workflow_trigger).
message WorkflowTrigger {
  // Name of this trigger within its workflow; unique there. What an
  // activation refers to.
  string name = 1;

  // What this trigger is for, for a human choosing which to activate.
  string description = 2;

  // CEL bool over the `trigger` root (trigger.kind, trigger.payload.*).
  // Empty matches every event the source delivers.
  string filter = 3;

  // Workflow inputs set from the event: input name to a template over
  // `trigger`, e.g. issue: "{{ trigger.payload.data.issue.number }}".
  map<string, string> inputs = 4;

  // The prompt each run it starts begins from: a template over `trigger`,
  // e.g. "Triage issue #{{ trigger.payload.data.issue.number }}". An
  // activation's own message overrides it; an activation with no message
  // uses it. Empty means every activation writes its own.
  string prompt = 5;

  // Webhook triggers only: a template over `trigger` that names the real-world
  // event a delivery is about, e.g.
  // "{{ trigger.payload.body.groupKey }}:{{ trigger.payload.body.status }}".
  // Deliveries that render the same key within dedupe_window are ONE event:
  // the first launches a run, the rest are recorded as duplicates. It replaces
  // the default (the sender's Idempotency-Key header, else the body's hash
  // within one minute) for a sender that has no idempotency header, such as
  // Alertmanager. A key that fails to render or renders empty falls back to
  // the default for that delivery.
  string dedupe_key = 6;

  // How long a dedupe_key holds, as a duration ("30m", "4h"); default 1h, at
  // most 24h. The window is a fixed clock bucket, not a sliding one: two
  // deliveries that straddle a bucket boundary are two events, so the window
  // is the longest a repeat can be suppressed, and may be shorter.
  string dedupe_window = 7;

  // CEL bool over `trigger`, evaluated BEFORE `filter`, that decides whether an
  // event is wanted given WHO CAUSED IT: it reads trigger.origin, which says
  // whether Reliant wrote the thing the event reports and which run did. A
  // false records the event as skipped with the reason, so the firing history
  // explains it.
  //
  // Empty means the default, which ignores a workflow's own echoes:
  //   !(trigger.origin.same_workflow && trigger.origin.confidence in ['exact', 'intent'])
  // Write "true" to receive everything. Event-driven triggers only.
  //
  // The lineage depth cap (5 hops) is a loop guard no expression overrides: a
  // run whose chain is already that deep launches nothing, whatever this says.
  string origin_filter = 8;

  // What makes it fire.
  oneof source {
    ScheduleSource schedule = 20;
    WebhookSource webhook = 21;
    IntegrationSource integration = 22;
    WorkflowEventSource workflow_event = 23;
  }
}

// Trigger is a stored trigger definition.
message Trigger {
  // Server-assigned id.
  string id = 1;

  // Human-readable name, unique per user per project. How a human and the CLI
  // refer to this trigger.
  string name = 2;

  // Project the launched runs execute in.
  string project_id = 3;

  // Worktree the launched runs execute in. Unset means the project's main
  // worktree.
  optional string worktree_id = 4;

  // Disabled triggers keep their definition and history; their schedule is
  // paused.
  bool enabled = 5;

  // Workflow slug each launched run executes. Empty means the owner's default
  // workflow, resolved at fire time.
  string workflow = 6;

  // Preset assignments applied to the launched run's inputs, keyed by group
  // name ("" for top level) — the same shape an interactive start sends.
  map<string, string> presets = 7;

  // Workflow input values applied to each launched run.
  map<string, google.protobuf.Value> params = 8;

  // The seed prompt each launched run starts from.
  string message = 9;

  // RFC3339 UTC timestamp of creation, matching chat.proto's string
  // timestamps.
  string created_at = 10;

  // RFC3339 UTC timestamp of the last definition change.
  string updated_at = 11;

  // Read-only: RFC3339 UTC time this trigger will next fire, as computed by
  // the schedule backend. Unset when disabled or when no future fire exists.
  optional string next_fire_at = 12;

  // Read-only: this trigger's most recent firing, of any outcome. Unset when
  // it has never fired.
  optional TriggerEvent last_event = 13;

  // Configuration history (newest 100), distinct from firing health.
  repeated TriggerChange changes = 31;

  // The daemon every tool call in each launched run executes on. Empty exactly
  // when no_machine is set.
  string daemon_id = 14;

  // Launched runs have no machine; see TriggerDefinition.no_machine.
  bool no_machine = 27;

  // Read-only: how this trigger's recent firings went.
  TriggerHealth health = 15;

  // Read-only: name of the project the runs execute in. Empty if it was
  // deleted.
  string project_name = 16;

  // Read-only: display name (hostname) of the daemon the runs execute on.
  // Empty when the daemon has not reported one.
  string daemon_name = 17;

  // Read-only registry state: connected, disconnected, starting, suspended,
  // failed, removed, or none for a no-machine activation.
  string machine_state = 30;

  // When true, a completed run of this trigger marks its chat unread
  // (raising the OS notification) and appears in the Inbox as "Run finished".
  // Off by default: unattended completions are silent, failures always notify
  // (research/WORKFLOW_UI.md §6.4).
  bool notify_on_complete = 18;

  // CEL bool over the `trigger` root (trigger.payload.*) that an event must
  // satisfy to launch a run. Empty matches every event. A miss is recorded as
  // a SKIPPED firing whose detail names the filter. Webhook, integration and
  // workflow-event triggers only.
  string filter = 19;

  // What makes this trigger fire. One arm per kind; the arm set determines
  // the kind, so the two cannot disagree.
  oneof source {
    ScheduleSource schedule = 20;
    WebhookSource webhook = 21;
    IntegrationSource integration = 22;
    WorkflowEventSource workflow_event = 23;
  }

  // The connection an integration trigger listens through: one of the
  // owner's connections for IntegrationSource.integration. Unset for other
  // kinds, and cleared if the connection is deleted (the trigger then
  // receives nothing until it is edited).
  optional string connection_id = 24;

  // Read-only, the URL a sender must be pointed at, when the user has to
  // configure it themselves.
  //
  // Webhook triggers: <PUBLIC_URL>/hooks/{id}, the URL to POST to with
  // `Authorization: Bearer <token>` or an HMAC signature. Append "/<token>"
  // for a sender that cannot set headers. The token itself is returned only
  // by CreateTrigger and RotateWebhookToken. A bare path when the server has
  // no PUBLIC_URL.
  //
  // Integration triggers whose provider is configured per resource by the
  // user (Twilio: each phone number's "A message comes in" webhook):
  // <PUBLIC_URL>/integrations/{integration}/events. Unset for providers whose
  // app-level webhook the operator registers once (GitHub, Slack).
  optional string webhook_url = 25;

  // The workflow-declared trigger (WorkflowTrigger.name) this row activates,
  // when it activates one. The source, filter and inputs are then that
  // declaration's, read from the workflow when the trigger fires: editing the
  // workflow's `triggers:` changes every activation of it. The source above is
  // the declaration as of the last save, for display.
  optional string workflow_trigger = 26;

  // Who the integration writes of this trigger's runs speak as. Never
  // UNSPECIFIED on a stored trigger: an activation made before identities
  // existed reads as OWNER.
  ActingIdentity acting_identity = 28;

  // Read-only: Reliant delivers to this webhook itself (WebhookSource.source
  // on a deployment that can provision it), so there is no URL or token for
  // the user to configure, and RotateWebhookToken re-provisions rather than
  // returning a token.
  bool webhook_managed = 29;

  // Read-only, activations only: where the definition this activation runs
  // comes from, as resolved now. Unset when it does not resolve (Health says
  // why) or for an ad hoc trigger.
  TriggerDefinitionSource definition_source = 32;
}

// TriggerDefinitionSource is where an activation's workflow definition is
// read from when it fires: which kind of workflow, which file on which
// machine, and anything about that choice the owner should know.
message TriggerDefinitionSource {
  // "project" (a synced .reliant/workflows file), "user" (the owner's own
  // account workflow) or "builtin".
  string kind = 1;

  // project only: the file, relative to the project root
  // ("control-plane/.reliant/workflows/release.yaml").
  string path = 2;

  // project only: the machine whose synced catalog the file was read from;
  // empty when the catalog was every machine's union (the activation has no
  // machine, or its machine has never synced the project).
  string daemon_id = 3;

  // daemon_id's name, for display.
  string daemon_name = 4;

  // One line for display: "project workflow at
  // control-plane/.reliant/workflows/release.yaml on machine cicd".
  string summary = 5;

  // Things about this source the owner should act on, one sentence each:
  // a same-named account workflow that an automation does not run, a
  // machine that has never synced the project.
  repeated string warnings = 6;
}

// TriggerChange is a configuration audit entry, not a firing.
message TriggerChange {
  string id = 1;
  string user_id = 2;
  string chat_id = 3;
  string run_id = 4;
  string tool_call_id = 5;
  string operation = 6;
  string before_state = 7;
  string after_state = 8;
  string created_at = 9;
}

// TriggerEvent is one firing — the durable record of intent to launch, written
// before the run is started so the start is safe to retry.
message TriggerEvent {
  // Server-assigned id.
  string id = 1;

  // The stored trigger that fired. Unset for ad hoc kinds (chat.start), and
  // cleared when the trigger is later deleted.
  optional string trigger_id = 2;

  // Which kind of firing this was.
  TriggerEventKind kind = 3;

  // RFC3339 UTC time the firing was FOR, which is not necessarily when the
  // row was written: a scheduled fire replayed after an outage occurred at its
  // scheduled time.
  string occurred_at = 4;

  // What the firing did.
  TriggerEventOutcome outcome = 5;

  // Human-readable detail, set for SKIPPED and FAILED. Empty otherwise.
  string outcome_detail = 6;

  // The chat this firing launched. Set when outcome is LAUNCHED; cleared if
  // that chat is later deleted.
  optional string chat_id = 7;

  // Source-specific detail recorded verbatim at fire time — for a schedule,
  // the scheduled time and the trigger's name.
  google.protobuf.Struct payload = 8;

  // Read-only: the run this firing started, as of now. Set when the firing
  // launched a chat that still exists; unset otherwise.
  optional TriggerEventRun run = 9;

  // Who the source says sent the event: trigger.sender. Unset for a firing
  // recorded without one (a start a person made themselves, or one recorded
  // before senders were).
  optional TriggerSender sender = 10;

  // Read-only: the asynchronous firing workflow identifier for this event.
  // Match FireTriggerResponse.fire_workflow_id to find its outcome and chat_id.
  // Empty for ad hoc launches. An identifier is not proof a workflow started:
  // an inbound event may be rejected before its fire is launched.
  string fire_workflow_id = 11;

  // Read-only: which workflow definition this firing resolved — the file,
  // its version (content hash), the machine and git commit it was synced
  // from, and why it could not run when it could not. Unset for a firing
  // recorded without one (an ad hoc start, or one recorded before firings
  // carried it).
  optional TriggerEventDefinition definition = 12;
}

// TriggerEventDefinition is the workflow definition one firing resolved, so
// "which version of which file did this run, from which machine and commit?"
// has an answer after the file has changed again. A firing whose definition
// has an error and a path was refused: the newest version of that file does
// not parse or validate, and no older version runs in its place.
message TriggerEventDefinition {
  // The workflow ref the trigger names.
  string workflow = 1;

  // Where it resolved: "builtin", "user" (the owner's account workflow) or
  // "project" (a synced .reliant/workflows file). Empty when it did not
  // resolve.
  string source = 2;

  // The project file, relative to the project root, for a project workflow.
  string path = 3;

  // The machine whose synced copy of path was read; daemon_name is its
  // display name. Empty when no one machine's copy can be named.
  string daemon_id = 4;
  string daemon_name = 5;

  // The git state of the checkout the file was synced from: the repo's path
  // relative to the project root ("" for the root), the branch ("" for a
  // detached HEAD), the HEAD commit, and whether .reliant had uncommitted
  // changes. Empty when the machine reported none.
  string repo = 6;
  string branch = 7;
  string commit = 8;
  bool dirty = 9;

  // Hex SHA-256 of the definition's bytes: its version, the value
  // `sha256sum` prints for the file.
  string content_hash = 10;

  // Why this definition cannot run (it does not parse, validate or
  // resolve). Empty when it can.
  string error = 11;

  // The definition for display: "machine cicd at .reliant/workflows/x.yaml
  // @ main 1a2b3c4, clean (sha256 9f86d081884c)".
  string summary = 12;
}

// TriggerSender is trigger.sender: who sent the event that fired a trigger,
// as the source authenticated it.
message TriggerSender {
  // "slack", "github", "email", "sms", "webhook", "workflow", "schedule" or
  // "user".
  string kind = 1;

  // The provider's stable id for the sender: a Slack user id, a GitHub user
  // id (the number, as a string), an email address, an E.164 number, a
  // trigger id. What an allowlist compares.
  string id = 2;

  // For people (a GitHub login, a Slack name). Never authorize on it.
  string display_name = 3;

  // Whether the source vouches for id.
  bool verified = 4;
}

// TriggerDefinition is the writable half of a Trigger: the fields a caller
// supplies, without the server-assigned id, timestamps and read-only
// projections. Shared by create and update so the two cannot drift.
message TriggerDefinition {
  // Human-readable name, unique per user per project.
  string name = 1;

  // Project the launched runs execute in.
  string project_id = 2;

  // Worktree the launched runs execute in. Unset means the project's main
  // worktree.
  optional string worktree_id = 3;

  // Whether the trigger fires. Unset means true on create and "unchanged" on
  // update. Optional because a plain proto3 bool cannot tell an omitted field
  // from an explicit false — every create that left it out would have stored
  // a disabled trigger.
  optional bool enabled = 4;

  // Workflow slug each launched run executes. Empty means the owner's default
  // workflow.
  string workflow = 5;

  // Preset assignments applied to the launched run's inputs.
  map<string, string> presets = 6;

  // Workflow input values applied to each launched run.
  map<string, google.protobuf.Value> params = 7;

  // The seed prompt each launched run starts from.
  string message = 8;

  // The daemon every tool call in each launched run executes on. Required
  // unless no_machine is set, and replaceable on update. Must be one of the
  // caller's daemons and, when the project is installed on any daemon, one
  // that has it installed.
  string daemon_id = 9;

  // Launched runs have no machine: they run on Reliant's servers only and are
  // offered only tools that run there (web, integrations, planning). An
  // explicit choice, so that leaving daemon_id empty is still a mistake rather
  // than a silent mode switch. Mutually exclusive with daemon_id. Refused with
  // FailedPrecondition, naming what needs a machine, when the workflow has a
  // node that cannot run without one or its agent is given machine tools (for
  // the builtin agent: its `tools` param, which defaults to tag:coding:default;
  // set it to e.g. ["tag:web"]). See research/DAEMONLESS_RUNS.md.
  bool no_machine = 14;

  // Notify the owner when a run completes. Replaced on update, like every
  // other field here, so a client editing a trigger must send the current
  // value back.
  bool notify_on_complete = 10;

  // CEL bool over the `trigger` root that an event must satisfy; see
  // Trigger.filter. Validated on write: an expression that does not compile
  // is InvalidArgument. Not allowed on a schedule trigger.
  string filter = 11;

  // The connection an integration trigger listens through. Unset on create
  // means the owner's default connection for the integration. Must be one of
  // the caller's connections for that integration. Ignored for other kinds.
  optional string connection_id = 12;

  // Write-only, webhook triggers with hmac: the shared signing secret. Set to
  // configure or replace it; unset on update keeps the stored secret. Stored
  // sealed and never returned.
  optional string webhook_hmac_secret = 13;

  // What makes this trigger fire. Required on create: a trigger with no source
  // can never fire.
  oneof source {
    ScheduleSource schedule = 20;
    WebhookSource webhook = 21;
    IntegrationSource integration = 22;
    WorkflowEventSource workflow_event = 23;
    // Activate the named trigger the workflow declares (WorkflowTrigger.name)
    // instead of writing a source inline. The declaration supplies the
    // source, filter and inputs, and is re-read every time the trigger fires,
    // so an edit to the workflow applies to every activation. `workflow` is
    // required and `filter` must be empty: both come from the declaration.
    // `params` may not set an input the declaration's inputs map.
    string workflow_trigger = 24;
  }

  // Who the integration writes of this trigger's runs speak as. UNSPECIFIED
  // means APP on create, whatever the source (OWNER for a non-GitHub source on
  // a deployment with no control plane), and "unchanged" on update. APP is refused on a
  // deployment with no control plane to mint installation tokens from, and
  // for a trigger whose owner cannot push to a repository it writes to the
  // write fails when it happens (never silently as the owner).
  ActingIdentity acting_identity = 25;
}

// WebhookCredential is a webhook trigger's token, returned exactly once.
message WebhookCredential {
  // The bearer token. Shown only in this response; the server keeps a hash.
  string token = 1;

  // <PUBLIC_URL>/hooks/{trigger_id}/{token}: the whole URL, for a sender
  // that cannot set headers.
  string url = 2;
}

// CreateTriggerRequest is the request for CreateTrigger.
message CreateTriggerRequest {
  // The trigger to create. Its source arm determines the kind.
  TriggerDefinition trigger = 1;
}

// CreateTriggerResponse is the response for CreateTrigger.
message CreateTriggerResponse {
  // The stored trigger, with its assigned id and computed next fire time.
  Trigger trigger = 1;

  // Webhook triggers only: the token, which is never shown again.
  WebhookCredential webhook = 2;
}

// RotateWebhookTokenRequest is the request for RotateWebhookToken.
message RotateWebhookTokenRequest {
  // Id of the webhook trigger whose token to replace.
  string id = 1;
}

// RotateWebhookTokenResponse is the response for RotateWebhookToken.
message RotateWebhookTokenResponse {
  // The trigger after the rotation.
  Trigger trigger = 1;

  // The new token, which is never shown again. Unset for a managed webhook
  // (Trigger.webhook_managed): the new token went to the sender directly.
  WebhookCredential webhook = 2;
}

// GetTriggerRequest is the request for GetTrigger.
message GetTriggerRequest {
  // Id of the trigger to fetch.
  string id = 1;
}

// GetTriggerResponse is the response for GetTrigger.
message GetTriggerResponse {
  // The requested trigger.
  Trigger trigger = 1;
}

// ListTriggersRequest is the request for ListTriggers.
message ListTriggersRequest {
  // Narrow to one project. Unset lists the caller's triggers across every
  // project.
  optional string project_id = 1;
}

// ListTriggersResponse is the response for ListTriggers.
message ListTriggersResponse {
  // The caller's triggers, newest first.
  repeated Trigger triggers = 1;
}

// UpdateTriggerRequest is the request for UpdateTrigger.
message UpdateTriggerRequest {
  // Id of the trigger to update.
  string id = 1;

  // The replacement definition. This is a full replacement, not a patch: a
  // field left at its zero value is written as the zero value.
  TriggerDefinition trigger = 2;
}

// UpdateTriggerResponse is the response for UpdateTrigger.
message UpdateTriggerResponse {
  // The stored trigger after the update.
  Trigger trigger = 1;
}

// DeleteTriggerRequest is the request for DeleteTrigger.
message DeleteTriggerRequest {
  // Id of the trigger to delete.
  string id = 1;
}

// DeleteTriggerResponse is the response for DeleteTrigger.
message DeleteTriggerResponse {}

// SetTriggerEnabledRequest is the request for SetTriggerEnabled.
message SetTriggerEnabledRequest {
  // Id of the trigger to pause or resume.
  string id = 1;

  // True resumes the schedule, false pauses it.
  bool enabled = 2;
}

// SetTriggerEnabledResponse is the response for SetTriggerEnabled.
message SetTriggerEnabledResponse {
  // The trigger after the change, including its recomputed next fire time.
  Trigger trigger = 1;
}

// EnableWorkflowRequest is the request for EnableWorkflow. The choices here
// are shared by every trigger the workflow declares; overrides carry the
// exceptions.
message EnableWorkflowRequest {
  // The workflow, written as a trigger names it (TriggerDefinition.workflow):
  // a slug, or builtin://<name>. It must declare at least one trigger.
  string workflow = 1;

  // Project the runs execute in.
  string project_id = 2;

  // Worktree the runs execute in. Unset means the project's main worktree.
  optional string worktree_id = 3;

  // The machine the runs execute on: daemon_id, or no_machine, exactly as in
  // TriggerDefinition. One of the two is required.
  string daemon_id = 4;
  bool no_machine = 5;

  // The connection each integration trigger listens through, keyed by
  // integration id (e.g. "github"). One entry serves every trigger of that
  // integration. An integration with no entry keeps the connection an
  // existing activation listens through, and otherwise uses the user's
  // default connection for it; with none, that trigger is refused.
  map<string, string> connection_ids = 6;

  // Workflow inputs the activations set on every run, as
  // TriggerDefinition.params. A trigger's own `inputs` mapping wins over
  // these, so an input it maps is dropped for that trigger rather than
  // refused.
  map<string, google.protobuf.Value> params = 7;

  // Preset assignments, as TriggerDefinition.presets.
  map<string, string> presets = 8;

  // Notify the owner when a run completes, as TriggerDefinition.notify_on_complete.
  bool notify_on_complete = 9;

  // The prompt for a trigger whose declaration has none (TriggerDefinition.message).
  // A declaration's own prompt is used when this is empty.
  string message = 10;

  // Names new activations "<name_prefix> · <trigger>". Empty uses the
  // workflow ref. An existing activation keeps its name.
  string name_prefix = 11;

  // Per-trigger exceptions to the shared choices above.
  repeated WorkflowTriggerOverride overrides = 12;

  // Who the integration writes of every run speak as, as
  // TriggerDefinition.acting_identity. Unspecified means APP for each new
  // activation and preserves an existing activation's stored identity.
  ActingIdentity acting_identity = 13;
}

// WorkflowTriggerOverride changes one declared trigger's activation away from
// the shared choices of an EnableWorkflowRequest.
message WorkflowTriggerOverride {
  // The declared trigger's name (WorkflowTrigger.name).
  string trigger = 1;

  // Replaces the activation's name.
  optional string name = 2;

  // Replaces the shared machine for this trigger: a daemon, or no machine.
  optional string daemon_id = 3;
  optional bool no_machine = 4;

  // Replaces the shared connection for this integration trigger.
  optional string connection_id = 5;

  // Replaces the shared prompt for this trigger.
  optional string message = 6;

  // Merged over the shared params for this trigger.
  map<string, google.protobuf.Value> params = 7;
}

// WorkflowTriggerOutcome is what EnableWorkflow did for one declared trigger.
enum WorkflowTriggerOutcome {
  WORKFLOW_TRIGGER_OUTCOME_UNSPECIFIED = 0;
  // ENABLED: a new activation was created and is running.
  WORKFLOW_TRIGGER_OUTCOME_ENABLED = 1;
  // RESUMED: the user's paused activation of it was turned back on, with the
  // request's settings.
  WORKFLOW_TRIGGER_OUTCOME_RESUMED = 2;
  // ALREADY_ENABLED: an enabled activation already had exactly the request's
  // settings; nothing changed.
  WORKFLOW_TRIGGER_OUTCOME_ALREADY_ENABLED = 3;
  // FAILED: this trigger could not be enabled; message says why. Because
  // enabling is all-or-nothing, it is also why no other trigger was.
  WORKFLOW_TRIGGER_OUTCOME_FAILED = 4;
  // NOT_ENABLED: nothing was written for this trigger because another
  // trigger failed, or what was written for it was undone.
  WORKFLOW_TRIGGER_OUTCOME_NOT_ENABLED = 5;
  // LEFT_ENABLED: the call failed but this trigger's activation could not be
  // undone and is still running; disable it. message says why.
  WORKFLOW_TRIGGER_OUTCOME_LEFT_ENABLED = 6;
  // UPDATED: an enabled activation already existed and now has the request's
  // settings; it kept running throughout.
  WORKFLOW_TRIGGER_OUTCOME_UPDATED = 7;
}

// WorkflowTriggerResult is one declared trigger's part of an EnableWorkflow.
message WorkflowTriggerResult {
  // The declared trigger's name.
  string trigger = 1;

  WorkflowTriggerOutcome outcome = 2;

  // For FAILED, NOT_ENABLED and LEFT_ENABLED: why, in words a person can act
  // on ("connect GitHub first: ...").
  string message = 3;

  // The activation, for ENABLED, RESUMED, UPDATED and ALREADY_ENABLED.
  Trigger activation = 4;

  // A webhook trigger's token, for ENABLED only. Shown once, never again.
  // Unset for a managed webhook (Trigger.webhook_managed): Reliant gave the
  // token to the sender itself.
  WebhookCredential webhook = 5;

  // Facts worth knowing about an enable that went through: a value that could
  // not be checked for reachability because the integration errored, or one
  // the acting identity cannot write to. Never set on a refusal.
  repeated string warnings = 6;
}

// EnableWorkflowResponse is the response for EnableWorkflow.
message EnableWorkflowResponse {
  // True only when every declared trigger is now running.
  bool enabled = 1;

  // One entry per declared trigger, in declaration order.
  repeated WorkflowTriggerResult results = 2;
}

// DisableWorkflowRequest is the request for DisableWorkflow.
message DisableWorkflowRequest {
  // The workflow, written as in EnableWorkflowRequest.
  string workflow = 1;

  // Narrows to the activations in one project. Unset pauses them in every
  // project.
  optional string project_id = 2;
}

// DisableWorkflowResponse is the response for DisableWorkflow.
message DisableWorkflowResponse {
  // The activations that are paused now, including ones that already were.
  repeated Trigger paused = 1;

  // The activations that could not be paused, which are still running.
  repeated TriggerFailure failed = 2;
}

// TriggerFailure is one trigger an operation could not change.
message TriggerFailure {
  string trigger_id = 1;
  string name = 2;
  string message = 3;
}

// FireTriggerRequest is the request for FireTrigger.
message FireTriggerRequest {
  // Id of the trigger to run now.
  string id = 1;
}

// FireTriggerResponse is the response for FireTrigger.
message FireTriggerResponse {
  // Id of the fire workflow this request started. The firing itself is
  // asynchronous: poll ListTriggerEvents for its outcome.
  string fire_workflow_id = 1;
}

// ListTriggerEventsRequest is the request for ListTriggerEvents.
message ListTriggerEventsRequest {
  // Trigger whose firings to list.
  string trigger_id = 1 [(buf.validate.field).required = true];

  // Maximum firings to return. Unset or zero applies the server default.
  int32 limit = 2;

  // Continues a previous response's next_page_token. Keyset on (occurred_at,
  // id), so a firing recorded mid-pagination can neither repeat nor be
  // skipped. Opaque.
  optional string page_token = 3;

  // Only firings with one of these outcomes. Empty returns every outcome.
  repeated TriggerEventOutcome outcomes = 4;
}

// ListTriggerEventsResponse is the response for ListTriggerEvents.
message ListTriggerEventsResponse {
  // The trigger's firings, newest first.
  repeated TriggerEvent events = 1;

  // Set when more firings follow. Empty on the last page.
  string next_page_token = 2;
}

message GetLaunchEventRequest {
  string chat_id = 1;
}

message GetLaunchEventResponse {
  // Unset when the chat has no launch event (it predates trigger events).
  optional TriggerEvent event = 1;
}

// ResolveTriggerSendersRequest is the request for ResolveTriggerSenders.
message ResolveTriggerSendersRequest {
  // The integration whose people to look up. Only "github".
  string integration = 1;

  // Handles to resolve to ids: GitHub logins, with or without a leading "@".
  repeated string handles = 2;

  // Ids (trigger.sender.id values) to resolve to the person's current name.
  repeated string sender_ids = 3;
}

// ResolvedTriggerSender is one person ResolveTriggerSenders found.
message ResolvedTriggerSender {
  // The handle or id this answers, exactly as it was asked.
  string query = 1;

  // The id trigger.sender.id carries for this person: on GitHub, the numeric
  // user id as a string. What an "Only from" list stores.
  string sender_id = 2;

  // The person's current name (a GitHub login): for display only.
  string display_name = 3;
}

// ResolveTriggerSendersResponse is the response for ResolveTriggerSenders.
message ResolveTriggerSendersResponse {
  // One per handle or id the provider knows. One it does not know (no such
  // user, or an organization, which never sends an event) is absent.
  repeated ResolvedTriggerSender senders = 1;
}

message ListReplayEventsRequest {
  // Narrows the workflow's triggers to one project. Unset: every project.
  optional string project_id = 1;
  // The workflow whose triggers' events to list. Required.
  string workflow = 2 [(buf.validate.field).required = true];

  // Limit caps the events returned across all of the workflow's triggers.
  // Default 20, maximum 50.
  int32 limit = 3;
}

message ReplayCandidate {
  // Event is the recorded firing: id, kind, time, outcome, payload and sender.
  TriggerEvent event = 1;

  // TriggerName is the declared trigger the event arrived through.
  string trigger_name = 2;
}

message ListReplayEventsResponse {
  repeated ReplayCandidate events = 1;
}

message PreviewReplayRequest {
  string project_id = 1;
  string workflow = 2;
  ReplayEvent replay = 3;

  // Sender is who sent the original event, for templates that read
  // trigger.sender. Carried here rather than on ReplayEvent because
  // trigger.proto imports chat.proto, not the reverse.
  optional TriggerSender sender = 4;

  // Preview this owned automation, inline or declared, instead of a workflow's
  // declaration. Uses its stored prompt/settings and the supplied sample payload.
  // Returns the full seeded user message. Never enables, records or fires it.
  optional string trigger_id = 5;
}

message PreviewReplayResponse {
  // Inputs are the workflow inputs the declared trigger maps from the event.
  map<string, google.protobuf.Value> inputs = 1;

  // Prompt is the trigger's prompt rendered against the event. Empty when the
  // declaration has none.
  string prompt = 2;
}

message DraftAutomationRequest {
  // What the person wants, in their own words.
  string description = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];

  // The project it will run in. The drafter sees this project's workflows.
  string project_id = 2 [(buf.validate.field).string.min_len = 1];

  // A workflow the automation must run (the dialog was opened for one).
  // Empty lets the drafter choose; it proposes the person's default agent
  // unless a workflow clearly fits.
  string workflow = 3;

  // The person's IANA time zone, for times like "at 9". Empty means UTC.
  string timezone = 4;
}

message DraftAutomationResponse {
  AutomationDraft draft = 1;
}

// AutomationDraft is a proposed automation, never stored. Only the person's
// Create in the automation dialog makes a trigger from it.
message AutomationDraft {
  // The proposal. Only name, workflow, message, params, filter and the
  // source (schedule, webhook, integration or workflow_event) are ever set.
  // Never project_id, daemon_id, no_machine, connection_id, acting_identity,
  // enabled, webhook_hmac_secret or workflow_trigger: where it runs and as
  // whom are the person's choices, made in the dialog.
  TriggerDefinition definition = 1;

  // One line, in words: what it will do and when ("Every weekday at 9:00,
  // summarise failed CI runs").
  string summary = 2;

  // What the drafter assumed that the description did not say, for the
  // person to check ("Assumed 9:00 in your time zone").
  repeated string assumptions = 3;
}
