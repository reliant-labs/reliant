syntax = "proto3";

package reliant.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// Empty represents an empty message (no fields)
message Empty {}

// ErrorDetail provides structured error information
message ErrorDetail {
  // Error code (e.g., "not_found", "validation_error")
  string code = 1;
  // Human-readable error message
  string message = 2;
  // Additional error context
  map<string, string> metadata = 3;
}

// =============================================================================
// Shared enums used across multiple proto files
// =============================================================================

// PlanStatus tracks the lifecycle of a plan
enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_PENDING = 1;
  PLAN_STATUS_IN_PROGRESS = 2;
  PLAN_STATUS_COMPLETED = 3;
  PLAN_STATUS_CANCELLED = 4;
}

// BackgroundProcessStatus tracks the lifecycle of a background process
enum BackgroundProcessStatus {
  BACKGROUND_PROCESS_STATUS_UNSPECIFIED = 0;
  BACKGROUND_PROCESS_STATUS_RUNNING = 1;
  BACKGROUND_PROCESS_STATUS_COMPLETED = 2;
  BACKGROUND_PROCESS_STATUS_FAILED = 3;
  BACKGROUND_PROCESS_STATUS_KILLED = 4;
  BACKGROUND_PROCESS_STATUS_KILLED_EXTERNALLY = 5;
  // STALE is used for package processes that are no longer tracked
  BACKGROUND_PROCESS_STATUS_STALE = 6;
}

// ToolExecutionStatus tracks the lifecycle of a tool execution request
enum ToolExecutionStatus {
  TOOL_EXECUTION_STATUS_UNSPECIFIED = 0;
  TOOL_EXECUTION_STATUS_PENDING = 1;
  TOOL_EXECUTION_STATUS_EXECUTING = 2;
  TOOL_EXECUTION_STATUS_COMPLETED = 3;
  TOOL_EXECUTION_STATUS_FAILED = 4;
  TOOL_EXECUTION_STATUS_CANCELLED = 5;
  TOOL_EXECUTION_STATUS_TIMEOUT = 6;
}

// OutputStreamType distinguishes stdout from stderr in process output
enum OutputStreamType {
  OUTPUT_STREAM_TYPE_UNSPECIFIED = 0;
  OUTPUT_STREAM_TYPE_STDOUT = 1;
  OUTPUT_STREAM_TYPE_STDERR = 2;
}

// FileChangeStatus indicates the git status of a changed file
enum FileChangeStatus {
  FILE_CHANGE_STATUS_UNSPECIFIED = 0;
  FILE_CHANGE_STATUS_MODIFIED = 1;
  FILE_CHANGE_STATUS_STAGED = 2;
  FILE_CHANGE_STATUS_UNTRACKED = 3;
  FILE_CHANGE_STATUS_DELETED = 4;
}

// =============================================================================
// Configuration
// =============================================================================

// ConfigScope defines where configuration should be saved
// Scopes are loaded with merge priority: global < project < project_local
enum ConfigScope {
  // CONFIG_SCOPE_UNSPECIFIED uses the default behavior (project scope)
  CONFIG_SCOPE_UNSPECIFIED = 0;
  // CONFIG_SCOPE_GLOBAL saves to ~/.reliant/.reliant/ - available in all projects
  CONFIG_SCOPE_GLOBAL = 1;
  // CONFIG_SCOPE_PROJECT saves to $project/.reliant/ - shared with team (committed to git)
  CONFIG_SCOPE_PROJECT = 2;
  // CONFIG_SCOPE_PROJECT_LOCAL saves to $project/.reliant.local/ - personal config (gitignored)
  CONFIG_SCOPE_PROJECT_LOCAL = 3;
}

// ResourceVisibility is who besides its owner may read a chat or project
// (read-only sharing; control-plane docs/design/org-sharing.md). Only the
// owner shares; an org admin may make a shared one private again. The share
// rpcs are the app's (SharingService), not the SDK's.
enum ResourceVisibility {
  // A server that predates sharing; read it as PRIVATE.
  RESOURCE_VISIBILITY_UNSPECIFIED = 0;
  // The owner alone.
  RESOURCE_VISIBILITY_PRIVATE = 1;
  // Every live member of the resource's organization, read-only.
  RESOURCE_VISIBILITY_ORG = 2;
}

// =============================================================================
// Workflow node observations
// =============================================================================

// NodeObservation is what one node attempt's observe: block recorded when the
// node finished (dev-docs/design/workflow-observe.md): the attributes and
// events its expressions produced, already redacted and bounded, and the
// expressions that failed. It is a list beside a run's node attempts rather
// than a field of one, because a node the workflow completes itself (compute,
// join, router, loop, workflow) has no attempt row: a client renders an
// observation under the attempt with the same workflow_id, node_path, loop
// scope and attempt, and one with no such attempt as its own entry.
message NodeObservation {
  // NodeId is the node's id; NodePath its position in the run ("" at the top
  // level of a run that predates node paths).
  string node_id = 1;
  string node_path = 2;
  // LoopNodeId and LoopIteration are the loop scope, unset outside a loop.
  string loop_node_id = 3;
  optional int32 loop_iteration = 4;
  int32 attempt = 5;
  // Source is who recorded it: "workflow" (the node's observe: block) or
  // "model" (an event the model recorded itself).
  string source = 6;
  // Attributes are the observe.attributes values, typed (bool, number,
  // string).
  google.protobuf.Struct attributes = 7;
  repeated ObservedEvent events = 8;
  // Errors are the expressions that failed, each a short message for the
  // author. A failed expression never fails the node.
  repeated string errors = 9;
  // Truncated reports that a size cap cut what was recorded.
  bool truncated = 10;
  // CreatedAt is when it was recorded, RFC 3339.
  string created_at = 11;
  // WorkflowId is the workflow row the node ran in (a run's sub-workflows
  // have their own).
  string workflow_id = 12;
}

// ObservedEvent is one event an observe: block recorded. An event named
// "decision" with name, value and reason attributes is the convention for a
// node that chooses something.
message ObservedEvent {
  string name = 1;
  google.protobuf.Struct attributes = 2;
}
