syntax = "proto3";

package reliant.v1;

import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ChatTraceService is the per-chat Trace/Cost tab (dev-docs/design/agent-analytics.md
// §2): for one chat, what its runs did and how long each step took (the spans
// Reliant's servers exported), and what each model call cost (llm_call_usage).
//
// Authorization is the chat's own: a caller who may read the chat reads its
// trace, decided once (authz.ReadChatAccess). Its owner gets the whole answer.
// A viewer of a chat its owner shared gets the viewer's shape (`viewer` set):
// spans reduced to their structure, timing, status, model, token counts and
// tool names, with no cost, no `reliant.*` attribute, no trace id or link and
// no event attribute; model calls without cost, funding or ids. Anyone else,
// including a removed member, a machine credential acting as a viewer and a
// credential bound to another org, is NotFound, as for every chat rpc.
//
// Reading a trace changes nothing: not the chat's unread flag, not its
// last_active.
service ChatTraceService {
  // GetChatTrace answers one chat's spans and model calls.
  //
  // It is never silently empty: when a half could not be read whole (the span
  // store keeps seven days, per-call rows ninety; the span store is
  // unavailable or is an older control plane; more rows than one answer
  // carries), completeness is PARTIAL and partial_reasons says why.
  //
  // Errors:
  //   - INVALID_ARGUMENT: no chat_id, or end_time not after start_time.
  //   - NOT_FOUND: no such chat, or the caller may not read it.
  rpc GetChatTrace(GetChatTraceRequest) returns (GetChatTraceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      activity: {none: "read-only: one chat's spans and model-call usage; changes nothing"}
    };
  }
}

message GetChatTraceRequest {
  // The chat. Required.
  string chat_id = 1;
  // Only this run (forge.ai.run.id, the run step_executions name): spans of
  // that run or of a run it spawned, and model calls made in them.
  optional string run_id = 2;
  // The window, start inclusive and end exclusive, matched against a span's
  // start time and a model call's time. Unset start: as far back as each
  // store keeps; unset end: now. Spans are read for at most the last seven
  // days of it.
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

// ChatTraceCompleteness says whether a trace is the whole story of its window.
enum ChatTraceCompleteness {
  CHAT_TRACE_COMPLETENESS_UNSPECIFIED = 0;
  // Every span and every model call of the window is here.
  CHAT_TRACE_COMPLETENESS_COMPLETE = 1;
  // Something is missing; partial_reasons says what.
  CHAT_TRACE_COMPLETENESS_PARTIAL = 2;
}

// ChatTracePartialReason is why a trace is PARTIAL.
enum ChatTracePartialReason {
  CHAT_TRACE_PARTIAL_REASON_UNSPECIFIED = 0;
  // Part or all of the window is older than the span store keeps (seven
  // days): those spans are gone. Model calls are still listed.
  CHAT_TRACE_PARTIAL_REASON_TRACE_EXPIRED = 1;
  // The span store could not be read: this deployment has none, the control
  // plane is older than the trace read, it is not configured there, the org
  // asked too often, or the read failed. Shown as unavailable, never empty.
  CHAT_TRACE_PARTIAL_REASON_SPANS_UNAVAILABLE = 2;
  // More spans matched than one answer carries; the oldest are here.
  CHAT_TRACE_PARTIAL_REASON_SPANS_TRUNCATED = 3;
  // Model calls were recorded in the span store's window but no span of the
  // chat was found: the spans were not exported or not kept.
  CHAT_TRACE_PARTIAL_REASON_SPANS_MISSING = 4;
  // Part of the window is older than per-call usage is kept (ninety days):
  // those model calls are gone.
  CHAT_TRACE_PARTIAL_REASON_CALLS_EXPIRED = 5;
  // More model calls matched than one answer carries; the oldest are here.
  CHAT_TRACE_PARTIAL_REASON_CALLS_TRUNCATED = 6;
}

message GetChatTraceResponse {
  string chat_id = 1;
  ChatTraceCompleteness completeness = 2;
  // Why completeness is PARTIAL; empty when COMPLETE.
  repeated ChatTracePartialReason partial_reasons = 3;
  // The answer is in a viewer's shape (see ChatTraceService).
  bool viewer = 4;
  // Oldest first (start time, then span id).
  repeated ChatTraceSpan spans = 5;
  // The window spans were read over; unset when none was read.
  google.protobuf.Timestamp spans_start_time = 6;
  google.protobuf.Timestamp spans_end_time = 7;
  // One per provider request (a retried attempt is its own), oldest first.
  repeated ChatModelCall model_calls = 8;
  ChatTraceTotals totals = 9;
  // When the answer was read.
  google.protobuf.Timestamp as_of = 10;
}

// ChatTraceSpan is one span. For a viewer only the fields and attributes the
// transcript already shows them remain (see ChatTraceService).
message ChatTraceSpan {
  // Empty for a viewer.
  string trace_id = 1;
  string span_id = 2;
  // Empty for a root span.
  string parent_span_id = 3;
  // `chat <model>`, `execute_tool <tool>`, `workflow.node <id>`, ...
  string name = 4;
  // OTel span kind as stored (`Internal`, `Client`, ...).
  string kind = 5;
  string service_name = 6;
  google.protobuf.Timestamp start_time = 7;
  int64 duration_ns = 8;
  // `Unset`, `Ok` or `Error`.
  string status_code = 9;
  // Allowlisted span attributes (control-plane's GetConversationTrace
  // allowlist), every value as stored. Tokens are `gen_ai.usage.*`, the model
  // `gen_ai.request.model`, the tool `gen_ai.tool.name`, the cost
  // `forge.ai.cost.usd` (never a viewer's).
  map<string, string> attributes = 10;
  // `gen_ai.first_token`, `gen_ai.retry_wait`. A viewer's carry no attributes.
  repeated ChatTraceSpanEvent events = 11;
  // Empty for a viewer.
  repeated ChatTraceSpanLink links = 12;
}

message ChatTraceSpanEvent {
  string name = 1;
  google.protobuf.Timestamp time = 2;
  map<string, string> attributes = 3;
}

message ChatTraceSpanLink {
  string trace_id = 1;
  string span_id = 2;
}

// ChatModelCall is one model call's counts (llm_call_usage). It has no prompt,
// reply or error text.
message ChatModelCall {
  // The call's id; with attempt, one provider request. Empty for a viewer.
  string id = 1;
  int32 attempt = 2;
  google.protobuf.Timestamp time = 3;
  // chat, compaction, title or draft_automation.
  string purpose = 4;
  string provider = 5;
  string model = 6;
  // success, error or cancelled.
  string outcome = 7;
  // A closed class (rate_limit, timeout, ...); empty unless outcome is error.
  string error_class = 8;
  int64 input_tokens = 9;
  int64 output_tokens = 10;
  int64 cache_read_tokens = 11;
  int64 cache_write_tokens = 12;
  int64 latency_ms = 13;
  // Time to the first output token; unset when none arrived or not recorded.
  optional int64 ttft_ms = 14;
  // The run (forge.ai.run.id) and node the call ran in; empty when not
  // recorded.
  string run_id = 15;
  string node_id = 16;
  string workflow_name = 17;
  // managed, byok, subscription or local. Empty for a viewer.
  string auth_mode = 18;
  // The call's cost in billionths of a US dollar on cost_basis. Unset is
  // unknown, never zero. Never a viewer's, and never set for a call another
  // person paid for.
  optional int64 cost_usd_nanos = 19;
  // reported (the gateway priced it), estimated (a list price at the call's
  // date) or unpriced (a subscription or local model); empty when not
  // recorded. Empty for a viewer.
  string cost_basis = 20;
}

// ChatTraceTotals sums model_calls. Reported and estimated cost are never
// added together; the counts say how much of the total each covers.
message ChatTraceTotals {
  int64 calls = 1;
  int64 error_calls = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_read_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 latency_ms_total = 7;
  // Cost, owner only (zero and with zero calls for a viewer).
  int64 reported_cost_usd_nanos = 8;
  int64 reported_calls = 9;
  int64 estimated_cost_usd_nanos = 10;
  int64 estimated_calls = 11;
  // Calls priced per seat or run locally: tokens only.
  int64 unpriced_calls = 12;
  // Calls with no recorded cost (before cost was recorded, or another
  // person's): unknown, never zero.
  int64 unknown_cost_calls = 13;
}
