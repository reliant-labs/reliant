syntax = "proto3";

package reliant.v1;

import "google/protobuf/struct.proto";
import "reliant/v1/chat.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// RunService is the engine's execution API: start a workflow, control it while
// it runs, observe it.
//
// It exists because WorkflowService cannot run a workflow — its RPCs are
// authoring and CRUD, and every run today starts through ChatService, whose
// vocabulary assumes a conversation. That leaves the engine's central verb with
// no API, which is why the CLI calls a /api/v1/workflows/run implemented
// nowhere.
//
// A run needs no conversation. StartRun takes a workflow and its inputs; a
// session is optional, and supplying one is what makes a run conversational
// rather than headless. Talking to a workflow (SessionService) and running one
// on a schedule are two interfaces onto the same execution model, not two
// products.
//
// This service is additive. Every RPC here delegates to the implementation
// ChatService already uses, so the engine surface becomes real without changing
// what the coding product does. ChatService remains the conversational entry
// point and is unaffected.
service RunService {
  // StartRun starts a workflow execution and returns immediately with its id.
  //
  // Deliberately does NOT require a message. Today both start-capable RPCs
  // reject an empty one, but that is a handler-layer rejection rather than an
  // engine invariant: WorkflowInput carries no message field, and the start
  // event is emitted with no content. A message reaches the agent as thread
  // history, which is a property of running WITH a session.
  rpc StartRun(StartRunRequest) returns (StartRunResponse) {}

  // SignalRun delivers an event to a run that is already going. It never
  // starts one.
  //
  // This is the half of ChatService.SendMessage that is not "start": that RPC
  // means both, disambiguated by the run's status rather than by anything in
  // the request, which is why callers cannot express which they intended.
  rpc SignalRun(SignalRunRequest) returns (SignalRunResponse) {}

  // GetRun returns one run's current state.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {}

  // ListRuns lists runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {}

  // PauseRun parks a run. It stays live and resumable — see
  // WORKFLOW_STOP_REASON_PAUSED.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse) {}

  // ResumeRun continues a paused run from its recorded position.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse) {}

  // CancelRun hard-stops a run. Terminal by intent: the position checkpoint is
  // dropped, so there is nothing to resume.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse) {}

  // InterruptRun stops what the run is doing now without ending it — the
  // in-flight LLM call and any executing tools are cancelled, and the run
  // parks. Distinct from Cancel, which ends it.
  rpc InterruptRun(InterruptRunRequest) returns (InterruptRunResponse) {}
}

// Run is one workflow execution.
//
// It mirrors the `workflows` row, which is already the run record: a run has an
// id, a workflow name, a thread, a lifecycle state, and a parent when it was
// spawned by another run's node.
message Run {
  // Id is the run id. It is also the Temporal workflow id.
  string id = 1;

  // WorkflowName is the workflow this run is executing, e.g. "builtin://agent".
  string workflow_name = 2;

  // Thread is the conversation thread this run writes to. Always set today:
  // every run has a thread even when nobody is reading it, because activities
  // record their work there.
  string thread = 3;

  // SessionId is the session this run belongs to, when it has one. Empty for a
  // headless run.
  //
  // Carried as a string rather than a required foreign key because the engine
  // does not need a session to execute — see ENGINE_SPLIT_PLAN.md for the
  // schema work that makes the column nullable.
  string session_id = 4;

  // ParentId is the run that spawned this one, for sub-workflows and spawned
  // agents. Empty for a root run.
  string parent_id = 5;

  // SpawnedByNodeId is the node in the parent that spawned this run.
  string spawned_by_node_id = 6;

  // LoopIteration is the parent loop's iteration when this run was spawned
  // from inside one.
  int64 loop_iteration = 7;

  // State is where the run is: pending, active, or stopped.
  WorkflowState state = 8;

  // StopReason is why a STOPPED run stopped. Meaningless for other states, and
  // it is what distinguishes a paused run (live, resumable) from a completed
  // one.
  WorkflowStopReason stop_reason = 9;

  // Outcome is the verdict a workflow declared for itself — "success" or
  // "failure" — which is a different question from whether it reached an end
  // state. Empty when the workflow declared none.
  string outcome = 10;

  int64 created_at_ms = 11;
  int64 completed_at_ms = 12;
}

message StartRunRequest {
  // Workflow is the workflow to run, e.g. "builtin://agent" or a saved name.
  string workflow = 1;

  // Inputs are the workflow's declared input parameters. Resolved against the
  // workflow's defaults and any matching presets before the run starts.
  map<string, google.protobuf.Value> inputs = 2;

  // SessionId runs this workflow inside an existing session, so the run reads
  // and writes that conversation. Omit for a headless run.
  string session_id = 3;

  // Messages seeds the run's thread before it starts. Optional — a headless
  // run needs none. When a session is supplied these are appended to it.
  //
  // This is how a caller supplies the "first message" that ChatService.CreateChat
  // requires today, without the requirement.
  repeated InputMessage messages = 4;

  // Presets selects preset bundles by tag, matching ChatService's
  // selected_presets. Applied before defaults.
  map<string, string> presets = 5;

  // Mode is the execution mode ("auto", "manual", "plan"). Convenience for what
  // is otherwise an entry in inputs.
  string mode = 6;
}

message StartRunResponse {
  // Run is the created run. Its state is PENDING or ACTIVE — StartRun returns
  // as soon as the execution is dispatched, it does not wait for completion.
  Run run = 1;
}

// SignalRunRequest delivers an event into a live run.
//
// The mechanism it fronts is deliberately content-free at the transport layer:
// the payload is persisted first and a bodiless wake signal follows, so the
// database stays the single source of truth and a dropped signal is harmless
// rather than lost input.
message SignalRunRequest {
  string run_id = 1;

  // Thread targets a specific thread of the run. Defaults to its root thread.
  string thread = 2;

  // Messages are appended to the thread before the run is woken.
  repeated InputMessage messages = 3;
}

message SignalRunResponse {
  // Delivered is false when the run was not live to receive the signal — a
  // completed or cancelled run is not an error, it simply had nowhere to put
  // the event.
  bool delivered = 1;

  // MessageIds are the ids of any messages persisted by this call. They are
  // saved even when delivery fails, so the next run reads them.
  repeated string message_ids = 2;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  // SessionId scopes the list to one session's runs.
  string session_id = 1;

  // ParentId scopes the list to one run's children.
  string parent_id = 2;

  // State filters by lifecycle state. Unspecified returns all.
  WorkflowState state = 3;

  int32 limit = 4;
  int32 offset = 5;
}

message ListRunsResponse {
  repeated Run runs = 1;
  int32 total = 2;
}

message PauseRunRequest {
  string run_id = 1;
}

message PauseRunResponse {
  // A run that had already stopped is not an error: the caller's intent is
  // met, and the stale record is reconciled.
  bool success = 1;
  string message = 2;
}

message ResumeRunRequest {
  string run_id = 1;
}

message ResumeRunResponse {
  bool success = 1;
  string message = 2;

  // Run carries the post-resume state. Resuming an interrupted run may start a
  // NEW execution that continues from the recorded position, so the id here
  // can differ from the requested one.
  Run run = 3;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  bool success = 1;
  string message = 2;
}

message InterruptRunRequest {
  string run_id = 1;

  // Thread interrupts one thread of the run. Empty interrupts every thread.
  string thread = 2;
}

message InterruptRunResponse {
  // CancelledToolCalls counts in-flight tool calls cancelled on the runtime.
  // Zero is a normal, successful outcome: the thread was between tool calls or
  // already winding down.
  int32 cancelled_tool_calls = 1;

  // UndeliverableToolCalls names tools whose cancellation could not be
  // delivered — an offline runtime, an unreachable spawn. They MAY STILL BE
  // RUNNING. Reported rather than counted as cancelled, because a caller that
  // is about to start something else needs to know the previous work was not
  // provably stopped.
  repeated string undeliverable_tool_calls = 2;
}
