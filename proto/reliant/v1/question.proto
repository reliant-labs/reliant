syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// QuestionStatus tracks the lifecycle of a question
enum QuestionStatus {
  QUESTION_STATUS_UNSPECIFIED = 0;
  QUESTION_STATUS_PENDING = 1;
  QUESTION_STATUS_RESOLVED = 2;
}

service QuestionService {
  // ResolveQuestion resolves a pending question with the user's answer
  rpc ResolveQuestion(ResolveQuestionRequest) returns (ResolveQuestionResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "resolve"
        target: {
          kind: "question"
          id: "question_id"
        }
        detail: ["action"]
      }
    };
  }
  // ListPendingQuestions lists every pending question in a chat, oldest
  // first, each naming the thread that asked it. A chat with several spawned
  // agents can have one question pending per thread, so a client must pick
  // the one for the thread it is showing rather than "the chat's question".
  rpc ListPendingQuestions(ListPendingQuestionsRequest) returns (ListPendingQuestionsResponse) {}
  // ListAsyncQuestions lists every async question in a chat (ask_user without
  // blocking: true), answered or not, oldest first. An async question never
  // blocks its thread, so ListPendingQuestions leaves it out; this is what the
  // chat timeline renders it from. Answer one with ResolveQuestion, like any
  // other question: the answer is delivered to the asking thread as a message.
  rpc ListAsyncQuestions(ListAsyncQuestionsRequest) returns (ListAsyncQuestionsResponse) {}
}

message ResolveQuestionRequest {
  string question_id = 1;
  string action = 2; // "reply"
  optional string response_data = 3; // JSON-encoded answer data
}

message ResolveQuestionResponse {
  bool success = 1;
}

message ListPendingQuestionsRequest {
  // Filter: unset lists the caller's pending questions in every chat they own;
  // set limits it to that chat (which must exist and be theirs).
  optional string chat_id = 1;
}

message ListPendingQuestionsResponse {
  // Oldest first. Empty when nothing in the chat is waiting on the user.
  repeated QuestionInfo questions = 1;
}

message ListAsyncQuestionsRequest {
  string chat_id = 1 [(buf.validate.field).required = true];
}

message ListAsyncQuestionsResponse {
  // Oldest first, pending and resolved alike.
  repeated QuestionInfo questions = 1;
}

message QuestionInfo {
  string question_id = 1;
  string chat_id = 2;
  string workflow_id = 3;
  string step_id = 4;
  string status = 5;
  string created_at = 6;
  optional string metadata = 7;
  // Thread that raised the question. The questions row has always carried it;
  // omitting it here made every RPC consumer chat-scoped, so a supervision view
  // over several spawned threads could not say WHICH one is waiting.
  string thread_id = 8;
  // The question was asked without waiting (ask_user without blocking: true): its thread
  // carried on, and an answer reaches it later as a message from the user. It
  // is never a gate on the chat.
  bool async = 9;
  // The ask_user tool call that raised the question, when one did.
  string tool_call_id = 10;
  // The answer, once resolved.
  optional string response_data = 11;
  // Set when the agent withdrew the question (withdraw_question) instead of
  // the user answering it: why it no longer needs an answer.
  optional string withdrawn_reason = 12;
}
