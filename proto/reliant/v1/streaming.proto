syntax = "proto3";

package reliant.v1;

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

import "reliant/v1/chat.proto";

// ChatUpdateType categorizes real-time chat update events
enum ChatUpdateType {
  CHAT_UPDATE_TYPE_UNSPECIFIED = 0;
  CHAT_UPDATE_TYPE_MESSAGE = 1;
  CHAT_UPDATE_TYPE_APPROVAL = 2;
  CHAT_UPDATE_TYPE_THREAD = 3;
  CHAT_UPDATE_TYPE_TOOL_CALL = 4;
  CHAT_UPDATE_TYPE_WORKFLOW_STATUS = 5;
  CHAT_UPDATE_TYPE_ERROR = 6;
  CHAT_UPDATE_TYPE_CHAT = 7;
  CHAT_UPDATE_TYPE_RUN_OUTPUT = 8;
  CHAT_UPDATE_TYPE_NODE_EXECUTION = 9;
  CHAT_UPDATE_TYPE_EXECUTION_LOG = 10;
  CHAT_UPDATE_TYPE_WORKFLOW_EXECUTION = 11;
  CHAT_UPDATE_TYPE_INFO = 13;
  CHAT_UPDATE_TYPE_WARNING = 14;
  CHAT_UPDATE_TYPE_REFETCH = 15;
  CHAT_UPDATE_TYPE_STREAMING_DELTA = 16;
  CHAT_UPDATE_TYPE_SKILL_INVOCATION = 17;
  CHAT_UPDATE_TYPE_QUESTION = 18;
  // Emitted exactly once per pre-allocated assistant message id when its
  // stream reaches a terminal state (completed / aborted / cancelled), so
  // consumers can retire streaming placeholders (delta identity protocol).
  CHAT_UPDATE_TYPE_STREAM_FINALIZED = 19;
  // Announces the agent_messages ids that just left a thread's mailbox and
  // became transcript messages. Written in the SAME transaction as those
  // messages, so the pending-queue strip and the transcript can never both
  // be showing the same message.
  CHAT_UPDATE_TYPE_AGENT_MESSAGES_DRAINED = 20;
}

// UserUpdateType categorizes user-level update events
enum UserUpdateType {
  USER_UPDATE_TYPE_UNSPECIFIED = 0;
  USER_UPDATE_TYPE_CHAT_STATE_CHANGE = 1;
  USER_UPDATE_TYPE_CHAT_CONFIG_CHANGED = 2;
  USER_UPDATE_TYPE_CHAT_CREATED = 3;
  USER_UPDATE_TYPE_CHAT_TITLE_CHANGED = 4;
  USER_UPDATE_TYPE_CHAT_DELETED = 5;
  USER_UPDATE_TYPE_CHAT_ACTIVITY_CHANGED = 6;
  USER_UPDATE_TYPE_PROJECT_CREATED = 7;
  USER_UPDATE_TYPE_PROJECT_DELETED = 8;
  USER_UPDATE_TYPE_PROJECT_SETTINGS_CHANGED = 9;
  USER_UPDATE_TYPE_WORKTREE_CREATED = 10;
  USER_UPDATE_TYPE_WORKTREE_DELETED = 11;
  USER_UPDATE_TYPE_WORKTREE_STATUS_CHANGED = 12;
  USER_UPDATE_TYPE_PROCESS_STARTED = 13;
  USER_UPDATE_TYPE_PROCESS_OUTPUT = 14;
  USER_UPDATE_TYPE_PROCESS_COMPLETED = 15;
  USER_UPDATE_TYPE_PROCESS_FAILED = 16;
  USER_UPDATE_TYPE_PROCESS_PORT_CHANGED = 17;
  USER_UPDATE_TYPE_NOTIFICATION = 18;
  USER_UPDATE_TYPE_REFETCH = 19;
  USER_UPDATE_TYPE_DAEMON_HEARTBEAT = 20;
  // A stored workflow (draft row) changed: its definition, status, name or
  // visibility. entity_id is the draft id; data_json is
  // {"draft_id","slug","version"}, plus "deleted": true when the draft was
  // deleted (version is then the last one, which was not bumped). Lets an open workflow editor follow edits
  // made from anywhere — an agent in any chat, another tab — without being
  // bound to the chat that made them.
  USER_UPDATE_TYPE_WORKFLOW_DRAFT_UPDATED = 21;
}

// EntityType categorizes the type of entity an update relates to
enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_CHAT = 1;
  ENTITY_TYPE_PROJECT = 2;
  ENTITY_TYPE_WORKTREE = 3;
  ENTITY_TYPE_BACKGROUND_PROCESS = 4;
  ENTITY_TYPE_SYSTEM = 5;
  ENTITY_TYPE_WORKFLOW_DRAFT = 6;
}

// NodeExecutionEventType categorizes node lifecycle events
enum NodeExecutionEventType {
  NODE_EXECUTION_EVENT_TYPE_UNSPECIFIED = 0;
  NODE_EXECUTION_EVENT_TYPE_STARTED = 1;
  NODE_EXECUTION_EVENT_TYPE_PROGRESS = 2;
  NODE_EXECUTION_EVENT_TYPE_COMPLETED = 3;
  NODE_EXECUTION_EVENT_TYPE_FAILED = 4;
}

// WorkflowExecutionEventType categorizes workflow lifecycle events
enum WorkflowExecutionEventType {
  WORKFLOW_EXECUTION_EVENT_TYPE_UNSPECIFIED = 0;
  WORKFLOW_EXECUTION_EVENT_TYPE_STARTED = 1;
  WORKFLOW_EXECUTION_EVENT_TYPE_COMPLETED = 2;
  WORKFLOW_EXECUTION_EVENT_TYPE_FAILED = 3;
  WORKFLOW_EXECUTION_EVENT_TYPE_CANCELLED = 4;
}

// StreamingService provides real-time streaming of updates over two
// independent server streams: one per client for user-level events, and one
// per open chat for that chat's detail events. Switching chats cancels and
// reopens only the chat stream; the user stream stays connected.
service StreamingService {
  // StreamUserUpdates opens the user-wide stream: chat state, projects,
  // processes, daemon signals and every other user-level event. It carries no
  // per-chat detail; that is StreamChatUpdates.
  rpc StreamUserUpdates(StreamUserUpdatesRequest) returns (stream UserStreamEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StreamChatUpdates opens one chat's detail stream: a snapshot (since_seq 0,
  // or a cursor the server will not replay from) or a replay of
  // (since_seq, latest], then exactly one caught_up, then live chat updates
  // (messages, approvals, tool calls, streaming deltas, ...). Answers NotFound
  // for a chat that does not exist or is not the caller's.
  rpc StreamChatUpdates(StreamChatUpdatesRequest) returns (stream ChatStreamEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ============================================
// Chat Stream Messages (StreamChatUpdates)
// ============================================

// StreamChatUpdatesRequest opens one chat's detail stream.
message StreamChatUpdatesRequest {
  string chat_id = 1;
  // Chat-level sequence the client's cached state is current as of: the
  // server replays (since_seq, latest]. 0 asks for a snapshot, and so does a
  // cursor too far behind or ahead of the chat to replay from.
  int64 since_seq = 2;
  // The project the client's user stream (StreamUserUpdates) is scoped to,
  // or unset when it streams every project. See ChatUserUpdates.
  optional string project_id = 3;
}

// ChatStreamEvent is one frame of a chat's detail stream.
message ChatStreamEvent {
  oneof event {
    ChatSyncSnapshot snapshot = 1;     // Initial sync with assembled messages
    ChatUpdateBatch updates = 2;       // Replayed or live chat updates
    ChatCaughtUp caught_up = 3;        // Initial sync complete (once per stream)
    Heartbeat heartbeat = 4;           // Keepalive heartbeat
    ChatUserUpdates user_updates = 5;  // This chat's user-level updates the user stream filters out
  }
}

// ChatUserUpdates carries user-level updates about the streamed chat, or about
// a chat it started (agent.start_run), that the client's project-scoped user
// stream does not deliver because they belong to another project. A chat
// opened outside the current project (a deep link, a notification) still gets
// its status, activity and spawned runs this way. The two streams partition
// the updates: one in the request's project goes to the user stream, never
// here. Sent only when the request names a project_id. Live only: these carry
// no cursor and do not advance the user stream's.
message ChatUserUpdates {
  repeated UserUpdateData updates = 1;
}

// ChatSyncSnapshot provides the initial sync with pre-assembled messages.
message ChatSyncSnapshot {
  repeated Message messages = 1;                // Assembled messages with content blocks
  repeated ChatUpdateData other_updates = 2;   // Non-message updates (approvals, threads, etc.)
  int64 latest_sequence = 3;                   // Latest sequence number for tracking
  int32 total = 4;                             // Total message count
  bool has_more = 5;                           // Whether there are more messages to load
  int64 oldest_seq = 6;                        // Seq of oldest message (for pagination)
  // Context usage for compaction indicator
  int64 thread_token_count = 7;                // Sum of output_tokens in current context
  int64 compaction_threshold = 8;              // Threshold at which compaction triggers (default 20000)
  // Workflow execution state - included in initial sync if workflow is active
  repeated WorkflowExecutionState active_workflows = 9;  // Currently running workflows with full state
}

// ChatUpdateBatch contains a batch of incremental chat updates
message ChatUpdateBatch {
  repeated ChatUpdateData updates = 1;
  int64 latest_sequence = 2;
}

// ChatUpdateData represents a single chat update event (generic JSON-like structure)
message ChatUpdateData {
  ChatUpdateType update_type = 1;
  int64 sequence_number = 2;
  string entity_id = 3;
  string chat_id = 4;
  string data_json = 5;                        // JSON-encoded update data
  string created_at = 6;
}

// ============================================
// User Updates Streaming Messages
// ============================================

// StreamUserUpdatesRequest initiates the user-wide update stream
message StreamUserUpdatesRequest {
  int64 since_seq = 1;                         // User-level sequence number to start from
  // The chat subscription moved to StreamChatUpdates.
  reserved 2, 3;
  reserved "subscribe_chat_id", "chat_since_seq";
  optional string project_id = 4;              // Scope updates to this project (omit for all projects)
}

// UserStreamEvent represents a single event in the user-wide update stream.
message UserStreamEvent {
  oneof event {
    UserSyncInfo sync = 1;                     // Initial sync info
    UserUpdateBatch updates = 2;               // Batch of user updates
    Heartbeat heartbeat = 3;                   // Keepalive heartbeat
  }
  // Per-chat frames moved to ChatStreamEvent (StreamChatUpdates).
  reserved 4 to 9;
  reserved "chat_sync_snapshot", "chat_updates", "workflow_event", "node_event", "execution_log", "chat_caught_up";
}

// ChatCaughtUp marks the end of a chat stream's initial sync. It is sent
// exactly once per stream, after the snapshot or the replay from
// since_seq — including a replay of nothing — and before any live chat
// event. Until it arrives, the client's cached transcript may still be behind
// the server; no other frame can stand in for it, because a replay of nothing
// sends no chat frame at all.
message ChatCaughtUp {
  // The chat sequence the initial sync delivered up to. Live chat updates
  // follow strictly after it.
  int64 latest_sequence = 1;
}

// UserSyncInfo provides initial sync information
message UserSyncInfo {
  int64 last_sequence = 1;
}

// UserUpdateBatch contains a batch of user-level updates
message UserUpdateBatch {
  repeated UserUpdateData updates = 1;
  // The server has delivered every update relevant to this subscription up to
  // and including this user sequence. It is the client's resume cursor: user
  // sequences are per-user, but the server filters by project_id, so the
  // sequences in `updates` legitimately skip. The server owns gap detection
  // (it sees every sequence) and backfills anything its hub dropped before
  // sending later updates, so the client never infers loss from a skip. A
  // batch may carry no updates at all when its only purpose is to advance the
  // cursor past updates filtered out of this subscription.
  int64 latest_sequence = 2;
}

// UserUpdateData represents a user-level update
message UserUpdateData {
  string id = 1;
  string user_id = 2;
  int64 sequence_number = 3;
  optional string project_id = 4;
  optional string worktree_id = 5;
  optional string chat_id = 6;
  UserUpdateType update_type = 7;
  EntityType entity_type = 8;
  string entity_id = 9;
  string data_json = 10;                       // JSON-encoded update data
  string created_at = 11;
}

// ============================================
// Common Messages
// ============================================

// Heartbeat is sent periodically to keep the connection alive
message Heartbeat {
  int64 timestamp = 1;
}

// ============================================
// Workflow Execution State Messages
// ============================================
// These messages enable real-time visualization of workflow execution,
// including active nodes, execution hierarchy, and streaming logs.

// NodeExecutionStatus represents the lifecycle state of a workflow node
enum NodeExecutionStatus {
  NODE_EXECUTION_STATUS_UNSPECIFIED = 0;
  NODE_EXECUTION_STATUS_PENDING = 1;     // Queued but not started
  NODE_EXECUTION_STATUS_RUNNING = 2;     // Currently executing
  NODE_EXECUTION_STATUS_COMPLETED = 3;   // Finished successfully
  NODE_EXECUTION_STATUS_FAILED = 4;      // Finished with error
  NODE_EXECUTION_STATUS_CANCELLED = 5;   // Cancelled by user or system
  NODE_EXECUTION_STATUS_SKIPPED = 6;     // Skipped due to condition
}

// WorkflowExecutionStatus represents the overall workflow state
enum WorkflowExecutionStatus {
  WORKFLOW_EXECUTION_STATUS_UNSPECIFIED = 0;
  WORKFLOW_EXECUTION_STATUS_RUNNING = 1;
  WORKFLOW_EXECUTION_STATUS_COMPLETED = 2;
  WORKFLOW_EXECUTION_STATUS_FAILED = 3;
  WORKFLOW_EXECUTION_STATUS_CANCELLED = 4;
}

// NodeExecutionState represents the current state of a single workflow node
message NodeExecutionState {
  string node_id = 1;                        // Step/node identifier from workflow definition
  string node_type = 2;                      // "agent", "run", "action", "approval", "loop", "join", "workflow"
  NodeExecutionStatus status = 3;            // Current execution status
  string workflow_id = 4;                    // Parent workflow UUID
  optional string parent_node_id = 5;        // Parent node for nested workflows/loops
  optional string activity_id = 6;           // Temporal activity ID for correlation
  optional int64 started_at = 7;             // Unix timestamp when execution started
  optional int64 completed_at = 8;           // Unix timestamp when execution completed
  optional int64 duration_ms = 9;            // Execution duration in milliseconds
  optional int32 exit_code = 10;             // Exit code for run steps
  optional string error_message = 11;        // Error message if failed
  optional int32 iteration = 12;             // Current iteration for loop nodes
  optional int32 max_iterations = 13;        // Max iterations for loop nodes
  map<string, string> metadata = 14;         // Additional node-specific metadata
}

// WorkflowExecutionState represents the complete execution state of a workflow
message WorkflowExecutionState {
  string workflow_id = 1;                    // Workflow UUID
  string workflow_name = 2;                  // Workflow definition name (e.g., "builtin://agent")
  string chat_id = 3;                        // Associated chat ID
  WorkflowExecutionStatus status = 4;        // Overall workflow status
  optional string parent_workflow_id = 5;    // Parent workflow for child workflows
  string thread = 6;                    // Thread path for message isolation
  repeated string active_nodes = 7;          // Currently executing node IDs
  repeated NodeExecutionState nodes = 8;     // All node states in this workflow
  repeated WorkflowExecutionState children = 9; // Child workflow states
  optional int64 started_at = 10;            // Unix timestamp when workflow started
  optional int64 completed_at = 11;          // Unix timestamp when workflow completed
  map<string, string> params = 12;           // Workflow input parameters
  map<string, string> outputs = 13;          // Workflow outputs (populated on completion)
}

// ExecutionLogLevel represents the severity of a log entry
enum ExecutionLogLevel {
  EXECUTION_LOG_LEVEL_UNSPECIFIED = 0;
  EXECUTION_LOG_LEVEL_DEBUG = 1;
  EXECUTION_LOG_LEVEL_INFO = 2;
  EXECUTION_LOG_LEVEL_WARN = 3;
  EXECUTION_LOG_LEVEL_ERROR = 4;
}
