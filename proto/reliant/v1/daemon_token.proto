syntax = "proto3";

package reliant.v1;

option go_package = "github.com/reliant-labs/reliant/internal/gen/reliant/v1;reliantv1";

// DaemonTokenService manages Personal Access Tokens (PATs) used by daemons
// to authenticate against the control plane.
//
// The user-facing RPCs (CreateDaemonToken / ListDaemonTokens /
// RevokeDaemonToken) require a Supabase JWT — you bootstrap a PAT from a
// session, you do not authenticate those with a PAT.
//
// The managed-daemon RPCs (MintManagedDaemonToken / RevokeManagedDaemonToken)
// are NOT user-JWT-authed. They are called by the control-plane operator with
// no end-user request in scope, and are gated on an internal-service HS256
// token signed with the shared INTERNAL_SERVICE_SECRET (sub=internal-service,
// role=admin). See internal/auth/internal_service.go.
service DaemonTokenService {
  // CreateDaemonToken mints a new PAT for the authenticated user.
  // Returns the raw token exactly once.
  rpc CreateDaemonToken(CreateDaemonTokenRequest) returns (CreateDaemonTokenResponse) {}

  // ListDaemonTokens returns all PATs owned by the authenticated user
  // (token hashes are never returned).
  rpc ListDaemonTokens(ListDaemonTokensRequest) returns (ListDaemonTokensResponse) {}

  // RevokeDaemonToken marks a PAT revoked. Subsequent uses fail auth.
  rpc RevokeDaemonToken(RevokeDaemonTokenRequest) returns (RevokeDaemonTokenResponse) {}

  // MintManagedDaemonToken provisions a PAT bound to an authoritative
  // daemon_id on behalf of a managed daemon. Internal-service-authed (the
  // control-plane operator). Returns the raw token exactly once. The resulting
  // PAT carries the daemon_id so the gateway resolves the managed daemon from
  // the bound token instead of guessing via hostname/UUID.
  rpc MintManagedDaemonToken(MintManagedDaemonTokenRequest) returns (MintManagedDaemonTokenResponse) {}

  // RevokeManagedDaemonToken revokes every live PAT bound to a given
  // daemon_id. Internal-service-authed. Used when a managed daemon pod is torn
  // down or re-provisioned. Returns how many tokens were revoked.
  rpc RevokeManagedDaemonToken(RevokeManagedDaemonTokenRequest) returns (RevokeManagedDaemonTokenResponse) {}
}

message CreateDaemonTokenRequest {
  string name = 1; // Human-readable name for the token (e.g. hostname)
}

message CreateDaemonTokenResponse {
  string token = 1;    // Raw PAT — display once, cannot be retrieved again
  string token_id = 2; // Unique ID for future revocation
}

message ListDaemonTokensRequest {}

message ListDaemonTokensResponse {
  repeated DaemonTokenInfo tokens = 1;
}

message DaemonTokenInfo {
  string id = 1;
  string name = 2;
  string token_prefix = 3;  // First chars for display (e.g. "rlnt_pat_AbCd...")
  bool ephemeral = 4;
  string created_at = 5;    // ISO 8601
  string last_used_at = 6;  // ISO 8601, empty if never used
  string expires_at = 7;    // ISO 8601, empty if no expiry
  bool revoked = 8;
}

message RevokeDaemonTokenRequest {
  string token_id = 1;
}

message RevokeDaemonTokenResponse {}

message MintManagedDaemonTokenRequest {
  string user_id = 1;   // Owner the PAT is attributed to (control-plane workspace owner)
  string daemon_id = 2; // Authoritative daemon ID the PAT is bound to
  string name = 3;      // Human-readable label (e.g. "managed:<workspace>")
}

message MintManagedDaemonTokenResponse {
  string token = 1;    // Raw PAT — returned once, cannot be retrieved again
  string token_id = 2; // Unique ID for the minted PAT
}

message RevokeManagedDaemonTokenRequest {
  string daemon_id = 1; // Revoke all live PATs bound to this daemon ID
}

message RevokeManagedDaemonTokenResponse {
  int32 revoked_count = 1; // Number of PATs transitioned to revoked
}
