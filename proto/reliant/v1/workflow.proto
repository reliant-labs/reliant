syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "reliant/v1/common.proto";
import "reliant/v1/trigger.proto";
import "reliant/v1/workflow_v2.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// NOTE: This proto is the external WorkflowService API contract.
// Keep this stable while any clients still use the WorkflowService RPC surface.
// Internal workflow execution/schema evolution happens in workflow_v2.proto.

// WorkflowService handles workflow CRUD operations and validation
service WorkflowService {
  // ListWorkflows returns all available workflows from DB + builtins
  // forge:custom — merges builtin, project and the caller's own workflow definitions for one project
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {}

  // SaveWorkflow creates or updates a workflow in the database.
  // A draft is stored as-is (validation findings are returned, not enforced);
  // a complete workflow must pass validation or nothing is stored.
  rpc SaveWorkflow(SaveWorkflowRequest) returns (SaveWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "save"
        target: {
          kind: "workflow"
          id: "response.slug"
          label: "response.workflow.name"
        }
        detail: [
          "response.status",
          "response.version"
        ]
      }
    };
  }

  // GetWorkflow returns a specific workflow by slug
  // forge:custom — resolves a workflow definition by slug across builtin, project and user sources
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {}

  // DeleteWorkflow deletes a workflow from the database
  // forge:custom — deletes the caller's workflow draft by the slug of its name
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "delete"
        target: {
          kind: "workflow"
          id: "response.slug"
          label: "name"
        }
      }
    };
  }

  // ValidateWorkflow validates a workflow without saving it. It only reads,
  // and says so with NO_SIDE_EFFECTS: forge then generates a query hook for
  // it rather than a mutation that invalidates every workflow read.
  rpc ValidateWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ImportWorkflow imports a workflow from YAML into the database
  rpc ImportWorkflow(ImportWorkflowRequest) returns (ImportWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "import"
        target: {
          kind: "workflow"
          id: "response.slug"
          label: "response.workflow.name"
        }
        detail: ["response.status"]
      }
    };
  }

  // ExportWorkflow exports a workflow from the database as YAML. A read
  // (NO_SIDE_EFFECTS), like ValidateWorkflow.
  rpc ExportWorkflow(ExportWorkflowRequest) returns (ExportWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetWorkflowVisibility toggles the hidden status of a workflow
  rpc SetWorkflowVisibility(SetWorkflowVisibilityRequest) returns (SetWorkflowVisibilityResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "workflow"
          id: "slug"
          label: "response.workflow.name"
        }
        detail: ["is_hidden"]
      }
    };
  }

  // CopyWorkflow creates a copy of an existing workflow with a new unique name
  // The copy is saved to the user's DB with forked_from set to track origin
  rpc CopyWorkflow(CopyWorkflowRequest) returns (CopyWorkflowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "copy"
        target: {
          kind: "workflow"
          id: "response.slug"
          label: "new_name"
        }
        detail: ["source_slug"]
      }
    };
  }

  // CreateWorkflowDraft creates an empty draft for the workflow builder
  // Called when user clicks "New Workflow" so the canvas has a draft to edit
  rpc CreateWorkflowDraft(CreateWorkflowDraftRequest) returns (CreateWorkflowDraftResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "create"
        target: {
          kind: "workflow"
          id: "response.slug"
          label: "response.name"
        }
        detail: ["template"]
      }
    };
  }

  // SetWorkflowStatus moves a stored workflow between draft and complete.
  // Marking complete validates the current definition and is rejected (with
  // the errors) when it is invalid; moving to draft always succeeds.
  rpc SetWorkflowStatus(SetWorkflowStatusRequest) returns (SetWorkflowStatusResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_status"
        target: {
          kind: "workflow"
          id: "response.slug"
        }
        detail: ["status"]
      }
    };
  }

}

// ============================================
// Core Types
// ============================================
// Legacy flattened workflow messages were removed after WorkflowService
// request/response contracts fully migrated to V2 types in workflow_v2.proto.

// WorkflowDraftStatus is a stored workflow's lifecycle.
//
// Validity is never stored: it is computed on read and at the two gates
// (marking complete, and loading for execution).
enum WorkflowDraftStatus {
  // In a request: keep the workflow's current status (a new workflow starts
  // as a draft). Never returned for a stored workflow.
  WORKFLOW_DRAFT_STATUS_UNSPECIFIED = 0;
  // Work in progress: saved as-is, may be invalid, never runnable, and never
  // offered where a runnable workflow is required.
  WORKFLOW_DRAFT_STATUS_DRAFT = 1;
  // Passed validation when it was marked complete; runnable. Saving it again
  // re-validates, and a save that would make it invalid is rejected.
  WORKFLOW_DRAFT_STATUS_COMPLETE = 2;
}

// WorkflowListItem represents a workflow in list responses with additional metadata
message WorkflowListItem {
  string name = 1;
  string filename = 2;       // Filename without extension (used for API calls)
  string description = 3;
  int32 step_count = 4;
  string source = 5;         // "builtin", "project", or "user"
  // Field 6 removed (was status)
  repeated Node nodes = 7;
  repeated Edge edges = 8;
  map<string, Input> inputs = 9; // Workflow inputs
  map<string, string> outputs = 10; // Workflow outputs - CEL expressions
  optional string updated_at = 11;  // Last update timestamp
  bool is_hidden = 12; // Whether the workflow is hidden from the hub
  bool has_preset_groups = 14; // True if workflow has any tags (top-level or group) that can have presets
  optional string draft_id = 16; // Draft ID for user workflows (stable ID for lookups, not present for builtin/project)
  // Lifecycle. Builtin and project workflows are always COMPLETE.
  WorkflowDraftStatus status = 17;
  // Current validation findings, computed on read (errors, then warnings typed
  // "warning:<category>"). Empty for builtin and project workflows.
  repeated ValidationError validation_errors = 18;
  // Human-facing display name from the workflow definition's `title`. Empty
  // when the definition declares none; UIs then derive one from `name`.
  string title = 19;
  // Why this workflow cannot run without the user's machine, at its declared
  // input defaults: nodes that need one (a shell `run`, `create_worktree`, …)
  // and agent tool lists that reach machine tools. Empty means it can run
  // with no machine. A run's own inputs can change the tool reasons (the
  // builtin agent's `tools`), so a trigger write re-checks with them.
  repeated string needs_machine = 20;
  // The definition's `automation_only`: a chat cannot start this workflow, so
  // chat pickers must not offer it (Workflow.automation_only).
  bool automation_only = 21;
  // The definition's declared `triggers:` (its WHEN), so a list can show the
  // ones the caller has not activated yet.
  repeated WorkflowTrigger triggers = 22;
}

// ============================================
// Validation Types
// ============================================

// HighlightSpan represents a character range to highlight in the condition
message HighlightSpan {
  int32 start = 1;   // Starting character position (0-based)
  int32 end = 2;     // Ending character position (exclusive)
  string reason = 3; // Why this span is highlighted
}

// ValidationError represents a structured validation error
message ValidationError {
  string type = 1;       // "syntax_error", "anti_pattern", "schema_violation"
  string message = 2;    // Human-readable error message
  string suggestion = 3; // Suggested fix
  int32 edge_index = 4;  // Which edge has the error
  string edge_from = 5;  // Edge source
  string case_to = 6;    // Case target (identifies which case in the edge)
  string condition = 7;  // The problematic condition
  repeated HighlightSpan highlights = 8; // Character positions to highlight
  // Where the finding is, structured, so an editor can put it on the step and
  // field it is about instead of parsing `message`.
  //
  // node_id is the TOP-LEVEL node the finding is in: the node itself, the
  // node an inline body or loop body belongs to, or an edge's source. Empty
  // for workflow-level findings (entry, inputs, triggers).
  string node_id = 9;
  // field is the location within that node, dot-separated ("model",
  // "with.channel", "system_prompt", "thread.inject.content"; for a finding
  // inside an inline body it starts "inline.nodes.[i](id)"). Empty when the
  // finding is about the node as a whole.
  string field = 10;
  // detail is the finding alone: `message` without its location prefix and
  // without the "(suggestion)" suffix, which `suggestion` carries.
  string detail = 11;
  // path is the full dot-joined location, as `message` prints it.
  string path = 12;
}

// ============================================
// ListWorkflows
// ============================================

message ListWorkflowsRequest {
  string project_id = 1 [(buf.validate.field).required = true]; // Required: project ID to list workflows for
  optional string worktree_id = 2; // Optional: worktree ID for layered config (worktree > project > global)
  optional bool include_hidden = 3; // If true, include items hidden by default (for management UIs)
}

message ListWorkflowsResponse {
  repeated WorkflowListItem workflows = 1;
  int32 total = 2;
  // Workflows that failed to load (for management UIs to display errors)
  repeated InvalidWorkflow invalid_workflows = 3;
}

// InvalidWorkflow represents a workflow that failed to load or validate.
message InvalidWorkflow {
  // Name/slug of the workflow
  string name = 1;
  // Source of the workflow: "builtin", "project", or "user"
  string source = 2;
  // Path to the workflow file (empty for user workflows)
  string path = 3;
  // Validation/loading errors
  repeated string errors = 4;
}

// ============================================
// GetWorkflow
// ============================================

message GetWorkflowRequest {
  string project_id = 1; // Required: project ID
  string name = 2; // Workflow filename (without extension)
  optional string worktree_id = 3; // Optional: worktree ID for layered lookup (worktree > project > global)
  optional string draft_id = 4; // Optional: lookup by draft ID directly (takes priority over name)
}

message GetWorkflowResponse {
  Workflow workflow = 1;
  string source = 2;             // Source of the workflow: "builtin", "project", or "user"
  optional string draft_id = 3; // Draft ID for this workflow (if user-owned)
  optional string parse_error = 6; // If the stored YAML couldn't be parsed, contains the error message
  optional string raw_definition = 7; // Raw YAML definition (only set when parse_error is present)
  int64 version = 8;             // Current version number for OCC (0 for builtins)
  optional string source_path = 9;  // File path for project workflows (enables save-back-to-file)
  string yaml_definition = 10;     // Canonical YAML definition of the workflow (always populated)
  // Lifecycle of a user workflow; COMPLETE for builtin and project workflows.
  WorkflowDraftStatus status = 11;
  // Current validation findings for a user workflow, computed on read (errors,
  // then warnings typed "warning:<category>").
  repeated ValidationError validation_errors = 12;
}

// ============================================
// DeleteWorkflow
// ============================================

message DeleteWorkflowRequest {
  string project_id = 1; // Required: project ID
  string name = 2; // Workflow filename to delete (without extension)
  optional string worktree_id = 3; // Optional: worktree ID - if provided, deletes from worktree
}

message DeleteWorkflowResponse {
  bool success = 1;
  string message = 2;
  string slug = 3; // Slug of the deleted workflow (name is slugified to find it)
}

// ============================================
// ValidateWorkflow
// ============================================

message ValidateWorkflowRequest {
  string project_id = 1; // Required: project ID (for loading sub-workflows during validation)
  Workflow workflow = 2;
}

message ValidateWorkflowResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
}

// ============================================
// SaveWorkflow - Unified create/update
// ============================================

message SaveWorkflowRequest {
  string project_id = 1;             // Required: project ID
  Workflow workflow = 2;             // Workflow definition to save
  // Field 3 removed (was publish)
  ConfigScope scope = 4;             // Where to save: global, project, or worktree
  optional string worktree_id = 5;   // Required if scope is worktree
  optional int64 expected_version = 8; // OCC: expected version number - fails if workflow was modified since
  optional string source_path = 9;   // If set, write YAML back to this file (for project workflow edits)
  optional string draft_id = 10;     // If provided, update this draft by ID (allows renames)
  // Intent. DRAFT stores as-is; COMPLETE validates and rejects on errors;
  // UNSPECIFIED keeps the current status (new workflows start as drafts), so
  // re-saving a complete workflow is gated like COMPLETE.
  WorkflowDraftStatus status = 11;
}

message SaveWorkflowResponse {
  bool success = 1;                  // True if operation succeeded
  string message = 2;                // Status message
  Workflow workflow = 3;             // Saved workflow
  // Field 4 removed (was published)
  bool is_valid = 5;                 // True if this request's definition passed validation
  repeated ValidationError validation_errors = 6; // This request's validation findings (errors, then warnings)
  string id = 7;                     // Database ID of the saved workflow
  string slug = 8;                   // Runtime reference slug
  int64 version = 11;                // Current version number for OCC
  string yaml_definition = 12;       // Canonical YAML definition of the saved workflow
  WorkflowDraftStatus status = 13;   // Resulting status (unset when nothing was stored)
}

// ============================================
// ImportWorkflow - Import YAML file to database
// ============================================

message ImportWorkflowRequest {
  string project_id = 1;             // Required: project ID
  bytes yaml_content = 2;            // YAML file content
  ConfigScope scope = 3;             // Where to import: global, project, or worktree
  optional string worktree_id = 4;   // Required if scope is worktree
  bool overwrite = 5;                // If true, overwrite existing workflow with same slug
  WorkflowDraftStatus status = 6;    // Intent; same semantics as SaveWorkflowRequest.status
}

message ImportWorkflowResponse {
  bool success = 1;
  string message = 2;
  Workflow workflow = 3;             // Imported workflow
  string id = 4;                     // Database ID
  string slug = 5;                   // Runtime reference slug
  bool is_valid = 6;                 // Whether this request's definition passed validation
  repeated ValidationError validation_errors = 7;
  bool conflict = 8;                 // True if slug already exists (when overwrite=false)
  string existing_id = 9;            // ID of existing workflow (if conflict)
  WorkflowDraftStatus status = 10;   // Resulting status (unset when nothing was stored)
}

// ============================================
// ExportWorkflow - Export database workflow as YAML
// ============================================

message ExportWorkflowRequest {
  string project_id = 1;             // Required: project ID
  string slug = 2;                   // Workflow slug to export
  optional string worktree_id = 3;   // Optional: worktree context for resolution
}

message ExportWorkflowResponse {
  bool success = 1;
  bytes yaml_content = 2;            // YAML file content
  string filename = 3;               // Suggested filename (e.g., "my-workflow.yaml")
  Workflow workflow = 4;             // The exported workflow definition
}

// ============================================
// SetWorkflowVisibility
// ============================================

message SetWorkflowVisibilityRequest {
  string project_id = 1; // Required: project ID
  string slug = 2;       // Workflow slug
  bool is_hidden = 3;    // True to hide, false to show
}

message SetWorkflowVisibilityResponse {
  bool success = 1;
  string message = 2;
  WorkflowListItem workflow = 3; // Updated workflow list item
}

message CopyWorkflowRequest {
  string project_id = 1;             // Required: project ID
  string source_slug = 2;            // Slug of the workflow to copy
  optional string new_name = 3;      // Optional: custom name for the copy (auto-generated if not provided)
  optional string worktree_id = 4;   // Optional: worktree context for source resolution
}

message CopyWorkflowResponse {
  bool success = 1;
  string message = 2;
  Workflow workflow = 3;              // The copied workflow
  string slug = 4;                    // Slug of the new workflow
  string id = 5;                      // ID of the new workflow draft
}

// ============================================
// CreateWorkflowDraft - Create empty draft for builder
// ============================================

// CreateWorkflowDraftRequest creates an empty draft for the workflow builder.
// Called when user clicks "New Workflow" to get a draft ID before any chat starts.
message CreateWorkflowDraftRequest {
  string project_id = 1;              // Required: project context
  // Intent; UNSPECIFIED and DRAFT create a draft. COMPLETE validates the
  // starting template first.
  WorkflowDraftStatus status = 2;
  // Display title. The slug (and `name:`) is derived from it and made unique
  // among the caller's workflows. Empty: "Untitled workflow", numbered so it
  // is unique too.
  string title = 3;
  // What to start from. Empty: a blank workflow (no steps). A builtin ref
  // ("builtin://agent") copies that built-in's graph, with this draft's own
  // name and title and an empty description.
  string template = 4;
}

message CreateWorkflowDraftResponse {
  string draft_id = 1;                // UUID of the created draft
  string slug = 2;                    // Generated slug for the draft
  string name = 3;                    // The workflow's `name:` (equal to the slug)
  WorkflowDraftStatus status = 4;     // Status the workflow was created with
  string title = 5;                   // The title it was created with
}

message SetWorkflowStatusRequest {
  string project_id = 1;              // Required: project context
  string draft_id = 2;                // Required: the stored workflow
  WorkflowDraftStatus status = 3;     // Required: DRAFT or COMPLETE
  optional int64 expected_version = 4; // OCC: fails if the workflow changed since it was loaded
}

message SetWorkflowStatusResponse {
  bool success = 1;                   // False when COMPLETE was rejected by validation
  string message = 2;
  WorkflowDraftStatus status = 3;     // Status after the call
  repeated ValidationError validation_errors = 4; // Current findings (errors, then warnings)
  int64 version = 5;                  // Version after the call (for OCC)
  string slug = 6;                    // The workflow's slug
}

