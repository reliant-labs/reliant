syntax = "proto3";

package reliant.v1;

import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// FileNodeType distinguishes files from directories
enum FileNodeType {
  FILE_NODE_TYPE_UNSPECIFIED = 0;
  FILE_NODE_TYPE_FILE = 1;
  FILE_NODE_TYPE_DIRECTORY = 2;
}

// FileNodeSymlinkStatus says whether a symbolic link in the file tree can be
// followed. UNSPECIFIED means the entry is not a symbolic link (or the daemon
// predates this field).
enum FileNodeSymlinkStatus {
  FILE_NODE_SYMLINK_STATUS_UNSPECIFIED = 0;
  // The link resolves to an existing file or directory.
  FILE_NODE_SYMLINK_STATUS_RESOLVED = 1;
  // The link's target does not exist, or the link is part of a cycle of links.
  FILE_NODE_SYMLINK_STATUS_BROKEN = 2;
  // The link points at a directory that contains it (itself or an ancestor).
  FILE_NODE_SYMLINK_STATUS_LOOP = 3;
  // The link points at a directory the tree does not list: a credential store
  // (~/.ssh, ~/.aws, ...), or a place outside a confined caller's root.
  FILE_NODE_SYMLINK_STATUS_DENIED = 4;
}

// FileViewerKind describes how Reliant should render a file.
enum FileViewerKind {
  FILE_VIEWER_KIND_UNSPECIFIED = 0;
  FILE_VIEWER_KIND_TEXT = 1;
  FILE_VIEWER_KIND_IMAGE = 2;
  FILE_VIEWER_KIND_PDF = 3;
  FILE_VIEWER_KIND_AUDIO = 4;
  FILE_VIEWER_KIND_VIDEO = 5;
  FILE_VIEWER_KIND_BINARY = 6;
}

// FileSystemService handles file system operations within projects
service FileSystemService {
  // GetFileTree returns the file tree structure for a project
  rpc GetFileTree(GetFileTreeRequest) returns (GetFileTreeResponse) {}

  // GetFileContent returns the content of a specific file
  rpc GetFileContent(GetFileContentRequest) returns (GetFileContentResponse) {}

  // SaveFileContent saves content to a specific file
  rpc SaveFileContent(SaveFileContentRequest) returns (SaveFileContentResponse) {
    option (forge.v1.method) = {
      activity: {none: "file edit through the daemon: git records file changes, and editor saves are high-volume"}
    };
  }

  // GetFileMetadata returns metadata for a file or directory
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse) {}

  // GetFilePreviewInfo returns preview metadata for a file
  rpc GetFilePreviewInfo(GetFilePreviewInfoRequest) returns (GetFilePreviewInfoResponse) {}

  // GetFilePreview returns the raw binary content of a previewable file (image, PDF, audio, video).
  rpc GetFilePreview(GetFilePreviewRequest) returns (GetFilePreviewResponse) {}

  // CreateFileOrFolder creates a new file or folder
  rpc CreateFileOrFolder(CreateFileOrFolderRequest) returns (CreateFileOrFolderResponse) {
    option (forge.v1.method) = {
      activity: {none: "filesystem edit through the daemon: git records the file once it is committed"}
    };
  }

  // DeleteFileOrFolder deletes a file or folder
  rpc DeleteFileOrFolder(DeleteFileOrFolderRequest) returns (DeleteFileOrFolderResponse) {
    option (forge.v1.method) = {
      activity: {none: "filesystem edit through the daemon: git records the removal once it is committed"}
    };
  }

  // CopyFile copies a file to a new location
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse) {
    option (forge.v1.method) = {
      activity: {none: "filesystem edit through the daemon: git records the copy once it is committed"}
    };
  }

  // SearchFiles searches for text within files in the workspace
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) {}

  // ReplaceInFiles replaces text in files across the workspace
  rpc ReplaceInFiles(ReplaceInFilesRequest) returns (ReplaceInFilesResponse) {
    option (forge.v1.method) = {
      activity: {none: "bulk file edit through the daemon: git records each changed file once it is committed"}
    };
  }

  // ListDirectory lists entries in an arbitrary filesystem directory.
  // Used by the project picker in browser mode (no Electron). daemon_id
  // names the machine to browse; unset browses the default machine.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse) {}

  // CreateDirectory creates a new directory at an arbitrary absolute path.
  // Used by the project picker in browser mode to make a "New folder" while
  // choosing where to open/create a project on the remote daemon.
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse) {
    option (forge.v1.method) = {
      activity: {none: "filesystem edit through the daemon: an empty directory is not even something git records"}
    };
  }

  // DownloadFile returns the whole content of a file of any kind (text,
  // image, spreadsheet, archive, ...), for saving it on the user's device.
  // It is scoped and guarded exactly like the viewer reads (GetFilePreview),
  // and refuses a file over 25 MB with FailedPrecondition and the error
  // reason "file_too_large_to_download".
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListMachineDirectory lists a directory ANYWHERE on the machine that holds
  // the workspace a request names, for the Files tab's machine view: the home
  // directory, the chat's scratch directory, /tmp, "/". The machine is the
  // one every other rpc of the request reaches (the project, worktree or
  // chat's), and the caller must own it: a viewer of a shared chat, or any
  // user who is not the machine's owner, is refused like an outsider.
  //
  // It is read-only. Files it lists open through the viewer rpcs
  // (GetFileContent, GetFilePreview, DownloadFile, ...) by their absolute
  // path; nothing outside the workspace is written. Listing a credential
  // store (~/.ssh, ~/.aws, browser profiles, ...) is PermissionDenied, as the
  // viewer refuses to open one. A machine whose daemon predates this rpc is
  // FailedPrecondition with the error reason "machine_browse_unsupported";
  // a path that is a file is FailedPrecondition with "not_a_directory".
  rpc ListMachineDirectory(ListMachineDirectoryRequest) returns (ListMachineDirectoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ============================================
// Core Types
// ============================================

// FileNode represents a file or directory in the tree
message FileNode {
  string name = 1;
  string path = 2;
  FileNodeType type = 3;
  repeated FileNode children = 4;
  optional int64 size = 5;
  optional string modified = 6;
  // has_children is a hint for DIRECTORY nodes: true when the directory has at
  // least one entry (respecting show_hidden). Lets the UI render an expand
  // chevron for lazily-loaded directories without fetching their children.
  // Only meaningful when children are not eagerly included (depth-limited walks).
  bool has_children = 7;
  // symlink_target is set when the entry is a symbolic link: the link's own
  // text, as readlink reports it. type, size and modified then describe what
  // the link resolves to, so a link to a directory is a DIRECTORY the UI
  // expands like any other folder.
  optional string symlink_target = 8;
  // symlink_status is set for a symbolic link. A link that is not RESOLVED is
  // listed but cannot be opened or expanded (has_children is false); the UI
  // says why.
  FileNodeSymlinkStatus symlink_status = 9;
}

// FileMetadata contains detailed information about a file or directory
message FileMetadata {
  string name = 1;
  string path = 2;
  int64 size = 3;
  string modified = 4;
  FileNodeType type = 5;
  string permissions = 6;
}

message FilePreviewInfo {
  string name = 1;
  string path = 2;
  int64 size = 3;
  string modified = 4;
  FileViewerKind viewer_kind = 5;
  string mime_type = 6;
  bool is_binary = 7;
  bool is_editable = 8;
}

// ============================================
// GetFileTree
// ============================================

message GetFileTreeRequest {
  string project_id = 1;
  string path = 2; // Optional path to start from (default: root "/")
  bool show_hidden = 3; // Whether to show hidden files
  optional string worktree_id = 4; // Optional worktree to scope the tree
  optional string chat_id = 5; // Optional chat to resolve worktree from
  // depth bounds how many levels of children are returned below `path`:
  //   0  = the server default (2 levels) — NOT unlimited
  //   N  = N levels of descendants (e.g. 1 = immediate children only)
  //   -1 = as deep as the server's node budget allows
  // No value asks for a truly unbounded walk. Every tree is additionally
  // capped by a hard node budget, and by the server's skip set and the
  // repository's .gitignore rules; a tree cut short by the budget comes back
  // with truncated = true.
  // Directory nodes at the depth boundary carry has_children instead of
  // eagerly-included children, enabling VS Code-style lazy loading.
  int32 depth = 6;
}

message GetFileTreeResponse {
  repeated FileNode files = 1;
  // truncated is true when the node budget stopped the walk early, so `files`
  // is a prefix of the tree rather than the whole of it.
  bool truncated = 2;
  // node_count is how many nodes the walk produced, at every level.
  int32 node_count = 3;
}

// ProjectCheckoutMissing is attached, as a Connect error detail with code
// NOT_FOUND, when a request for a project's root finds that the project's
// directory does not exist on the machine the request reached.
//
// Before it, that case came back as a bare INTERNAL ("read dir …: no such file
// or directory") and the UI rendered the raw text — repeatedly, for every
// surface that reads the tree. Two very different situations hid behind it,
// and only one of them is a problem:
//
//   - the project is being CLONED onto this machine and the clone has not
//     landed yet (the queued-clone window right after "Clone from GitHub");
//   - the project simply is not on this machine — it was cloned onto another
//     one, or its checkout is gone — and the user can clone it here.
//
// The state says which, so the UI can show "Cloning…" for the first and offer
// "Clone it here" for the second.
message ProjectCheckoutMissing {
  string project_id = 1;
  // The machine the request reached. Empty only when the server could not
  // tell which machine default resolution picked.
  string daemon_id = 2;
  // The project directory that does not exist on that machine.
  string path = 3;
  ProjectCheckoutState state = 4;
  // Why the clone onto this machine failed, for CLONE_FAILED.
  string install_error = 5;
  // The repository the project comes from. Empty for a plain folder, which
  // cannot be cloned anywhere.
  string remote_url = 6;
  // The requesting user's other machines that DO have an installed checkout
  // of the project, oldest install first: where to switch to. Empty when no
  // other machine of theirs has it, and from a server that predates the
  // field.
  repeated string available_daemon_ids = 7;
}

// ProjectCheckoutState is what is happening to a project's checkout on one
// machine, from this server's record of clones (project_daemons).
enum ProjectCheckoutState {
  PROJECT_CHECKOUT_STATE_UNSPECIFIED = 0;
  // A clone onto this machine is queued or running; the directory will
  // appear when it lands.
  PROJECT_CHECKOUT_STATE_CLONING = 1;
  // A clone onto this machine ran and failed.
  PROJECT_CHECKOUT_STATE_CLONE_FAILED = 2;
  // Nothing is putting the project on this machine.
  PROJECT_CHECKOUT_STATE_ABSENT = 3;
}

// ============================================
// GetFileContent
// ============================================

message GetFileContentRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message GetFileContentResponse {
  string content = 1;
}

// ============================================
// SaveFileContent
// ============================================

message SaveFileContentRequest {
  string project_id = 1;
  string path = 2;
  string content = 3;
  optional string worktree_id = 4;
  optional string chat_id = 5;
}

message SaveFileContentResponse {
  string message = 1;
}

// ============================================
// GetFileMetadata
// ============================================

message GetFileMetadataRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message GetFileMetadataResponse {
  FileMetadata metadata = 1;
}

// ============================================
// GetFilePreviewInfo
// ============================================

message GetFilePreviewInfoRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message GetFilePreviewInfoResponse {
  FilePreviewInfo info = 1;
}

// ============================================
// CreateFileOrFolder
// ============================================

message CreateFileOrFolderRequest {
  string project_id = 1;
  string path = 2;
  FileNodeType type = 3;
  string content = 4; // Optional content for files
  optional string worktree_id = 5;
  optional string chat_id = 6;
}

message CreateFileOrFolderResponse {
  string message = 1;
  string path = 2;
}

// ============================================
// DeleteFileOrFolder
// ============================================

message DeleteFileOrFolderRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message DeleteFileOrFolderResponse {
  string message = 1;
}

// ============================================
// CopyFile
// ============================================

message CopyFileRequest {
  string project_id = 1;
  string source_path = 2;
  string destination_path = 3;
  optional string worktree_id = 4;
  optional string chat_id = 5;
}

message CopyFileResponse {
  string message = 1;
  string destination = 2;
}

// ============================================
// SearchFiles
// ============================================

message SearchFilesRequest {
  string project_id = 1;
  string query = 2; // The search query (regex supported)
  optional string path = 3; // Optional path to search within (default: root)
  optional string worktree_id = 4;
  optional string chat_id = 5;
  optional string file_pattern = 6; // Optional glob pattern to filter files (e.g., "*.ts", "*.go")
  optional bool case_sensitive = 7; // Whether search is case-sensitive (default: false)
  optional int32 max_results = 8; // Maximum number of results (default: 100)
  optional int32 context_lines = 9; // Number of context lines before/after match (default: 2)
}

message SearchFilesResponse {
  repeated SearchResult results = 1;
  int32 total_matches = 2; // Total number of matches found
  bool truncated = 3; // Whether results were truncated due to max_results
}

message SearchResult {
  string path = 1; // Relative file path
  repeated SearchMatch matches = 2;
}

message SearchMatch {
  int32 line_number = 1;
  string line_content = 2; // The matched line
  int32 match_start = 3; // Start position of match within line
  int32 match_end = 4; // End position of match within line
  repeated string context_before = 5; // Lines before the match
  repeated string context_after = 6; // Lines after the match
}

// ============================================
// ReplaceInFiles
// ============================================

message ReplaceInFilesRequest {
  string project_id = 1;
  string search_text = 2; // Text to search for
  string replace_text = 3; // Text to replace with
  optional string path = 4; // Optional path to search within (default: root)
  optional string worktree_id = 5;
  optional string chat_id = 6;
  optional string file_pattern = 7; // Optional glob pattern to filter files
  optional bool case_sensitive = 8; // Whether search is case-sensitive (default: false)
  repeated string file_paths = 9; // Optional specific files to replace in (if empty, replaces in all matching files)
}

message ReplaceInFilesResponse {
  repeated ReplaceResult results = 1;
  int32 total_replacements = 2;
  int32 files_modified = 3;
}

message ReplaceResult {
  string path = 1;
  int32 replacements = 2; // Number of replacements in this file
  bool success = 3;
  string error = 4; // Error message if failed
}

// ============================================
// ListDirectory
// ============================================

message ListDirectoryRequest {
  optional string path = 1; // Absolute path to list. Unset (or empty) means the home directory.
  // The machine to browse, one of the caller's daemons. Unset (or empty)
  // browses the user's default machine, as before this field existed. A
  // machine that is not the caller's is NotFound; one that is offline is
  // Unavailable, saying so.
  optional string daemon_id = 2;
}

message ListDirectoryResponse {
  string path = 1; // The resolved absolute path that was listed
  repeated DirectoryEntry entries = 2;
  // The machine that was listed: the request's daemon_id, echoed. Unset when
  // the request named none (the default machine). A server older than
  // ListDirectoryRequest.daemon_id ignores that field, lists the default
  // machine and leaves this unset, so a client that named a machine and gets
  // no echo knows the listing is not that machine's and must not show it.
  optional string daemon_id = 3;
}

message DirectoryEntry {
  string name = 1;
  string path = 2; // Full absolute path
  bool is_directory = 3;
  bool is_hidden = 4;
  bool is_symlink = 5;
}

// ============================================
// CreateDirectory
// ============================================

message CreateDirectoryRequest {
  string path = 1; // Absolute path of the directory to create (mkdir -p).
  // The machine to create it on, one of the caller's daemons. Unset (or
  // empty) uses the user's default machine, as before this field existed.
  optional string daemon_id = 2;
}

message CreateDirectoryResponse {
  string path = 1; // The absolute path that was created.
  // The machine it was created on: the request's daemon_id, echoed, as in
  // ListDirectoryResponse.daemon_id. Unset when the request named none.
  optional string daemon_id = 2;
}

// ============================================
// GetFilePreview
// ============================================

message GetFilePreviewRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message GetFilePreviewResponse {
  bytes content = 1; // Raw binary file content
  string content_type = 2; // MIME type (e.g. "image/png", "application/pdf")
  string filename = 3; // Base filename for Content-Disposition
  int64 size = 4; // File size in bytes
}

// ============================================
// DownloadFile
// ============================================

message DownloadFileRequest {
  string project_id = 1;
  // The file to download: relative to the workspace, or absolute on the
  // machine that holds it (as the viewer reads accept).
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message DownloadFileResponse {
  bytes content = 1; // The file's raw bytes
  string content_type = 2; // MIME type; "application/octet-stream" when unknown
  string filename = 3; // Base filename to save as
  int64 size = 4; // File size in bytes
}

// ============================================
// ListMachineDirectory
// ============================================

message ListMachineDirectoryRequest {
  // The workspace whose machine to browse, as on every other rpc of this
  // service: the project, and the worktree or chat that places it.
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  // The directory to list: absolute; "~" or "~/..." for the machine's home
  // directory; relative to the workspace root (".." is the folder the
  // workspace is in); unset or empty for the home directory.
  optional string path = 4;
}

message ListMachineDirectoryResponse {
  // The directory listed: absolute and cleaned, symlinks not resolved.
  string path = 1;
  // Its entries in name order. Hidden entries are included; the client
  // filters them.
  repeated MachineDirectoryEntry entries = 2;
  // The machine's home directory, absolute.
  string home_dir = 3;
  // The request's workspace root on that machine, absolute: where the
  // project or worktree tree is, for a client mapping an absolute path back
  // into it.
  string workspace_root = 4;
  // True when the directory has more entries than one listing returns
  // (5000); entries is then the first of them.
  bool truncated = 5;
}

message MachineDirectoryEntry {
  string name = 1;
  // Absolute path on the machine.
  string path = 2;
  // A directory, or a symlink to one.
  bool is_directory = 3;
  bool is_symlink = 4;
  int64 size = 5;
  // RFC 3339; empty when the entry could not be stat'ed (a dangling symlink).
  string modified = 6;
}
