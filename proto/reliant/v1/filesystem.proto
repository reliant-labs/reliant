// ============================================
// CopyFile
// ============================================

message CopyFileRequest {
  string project_id = 1;
  string source_path = 2;
  string destination_path = 3;
  optional string worktree_id = 4;
  optional string chat_id = 5;
}

message CopyFileResponse {
  string message = 1;
  string destination = 2;
}

// ============================================
// SearchFiles
// ============================================

message SearchFilesRequest {
  string project_id = 1;
  string query = 2; // The search query (regex supported)
  optional string path = 3; // Optional path to search within (default: root)
  optional string worktree_id = 4;
  optional string chat_id = 5;
  optional string file_pattern = 6; // Optional glob pattern to filter files (e.g., "*.ts", "*.go")
  optional bool case_sensitive = 7; // Whether search is case-sensitive (default: false)
  optional int32 max_results = 8; // Maximum number of results (default: 100)
  optional int32 context_lines = 9; // Number of context lines before/after match (default: 2)
}

message SearchFilesResponse {
  repeated SearchResult results = 1;
  int32 total_matches = 2; // Total number of matches found
  bool truncated = 3; // Whether results were truncated due to max_results
}

message SearchResult {
  string path = 1; // Relative file path
  repeated SearchMatch matches = 2;
}

message SearchMatch {
  int32 line_number = 1;
  string line_content = 2; // The matched line
  int32 match_start = 3; // Start position of match within line
  int32 match_end = 4; // End position of match within line
  repeated string context_before = 5; // Lines before the match
  repeated string context_after = 6; // Lines after the match
}

// ============================================
// ReplaceInFiles
// ============================================

message ReplaceInFilesRequest {
  string project_id = 1;
  string search_text = 2; // Text to search for
  string replace_text = 3; // Text to replace with
  optional string path = 4; // Optional path to search within (default: root)
  optional string worktree_id = 5;
  optional string chat_id = 6;
  optional string file_pattern = 7; // Optional glob pattern to filter files
  optional bool case_sensitive = 8; // Whether search is case-sensitive (default: false)
  repeated string file_paths = 9; // Optional specific files to replace in (if empty, replaces in all matching files)
}

message ReplaceInFilesResponse {
  repeated ReplaceResult results = 1;
  int32 total_replacements = 2;
  int32 files_modified = 3;
}

message ReplaceResult {
  string path = 1;
  int32 replacements = 2; // Number of replacements in this file
  bool success = 3;
  string error = 4; // Error message if failed
}

// ============================================
// ListDirectory
// ============================================

message ListDirectoryRequest {
  optional string path = 1; // Absolute path to list. Unset (or empty) means the home directory.
  // The machine to browse, one of the caller's daemons. Unset (or empty)
  // browses the user's default machine, as before this field existed. A
  // machine that is not the caller's is NotFound; one that is offline is
  // Unavailable, saying so.
  optional string daemon_id = 2;
}

message ListDirectoryResponse {
  string path = 1; // The resolved absolute path that was listed
  repeated DirectoryEntry entries = 2;
  // The machine that was listed: the request's daemon_id, echoed. Unset when
  // the request named none (the default machine). A server older than
  // ListDirectoryRequest.daemon_id ignores that field, lists the default
  // machine and leaves this unset, so a client that named a machine and gets
  // no echo knows the listing is not that machine's and must not show it.
  optional string daemon_id = 3;
}

message DirectoryEntry {
  string name = 1;
  string path = 2; // Full absolute path
  bool is_directory = 3;
  bool is_hidden = 4;
  bool is_symlink = 5;
}

// ============================================
// CreateDirectory
// ============================================

message CreateDirectoryRequest {
  string path = 1; // Absolute path of the directory to create (mkdir -p).
  // The machine to create it on, one of the caller's daemons. Unset (or
  // empty) uses the user's default machine, as before this field existed.
  optional string daemon_id = 2;
}

message CreateDirectoryResponse {
  string path = 1; // The absolute path that was created.
  // The machine it was created on: the request's daemon_id, echoed, as in
  // ListDirectoryResponse.daemon_id. Unset when the request named none.
  optional string daemon_id = 2;
}

// ============================================
// GetFilePreview
// ============================================

message GetFilePreviewRequest {
  string project_id = 1;
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message GetFilePreviewResponse {
  bytes content = 1; // Raw binary file content
  string content_type = 2; // MIME type (e.g. "image/png", "application/pdf")
  string filename = 3; // Base filename for Content-Disposition
  int64 size = 4; // File size in bytes
}

// ============================================
// DownloadFile
// ============================================

message DownloadFileRequest {
  string project_id = 1;
  // The file to download: relative to the workspace, or absolute on the
  // machine that holds it (as the viewer reads accept).
  string path = 2;
  optional string worktree_id = 3;
  optional string chat_id = 4;
}

message DownloadFileResponse {
  bytes content = 1; // The file's raw bytes
  string content_type = 2; // MIME type; "application/octet-stream" when unknown
  string filename = 3; // Base filename to save as
  int64 size = 4; // File size in bytes
}

// ============================================
// File upload (BeginFileUpload, UploadFileChunk, CommitFileUpload,
// AbortFileUpload, GetFileUploadStatus)
// ============================================

// UploadConflictPolicy says what a committed upload does when a file already
// exists at its destination.
enum UploadConflictPolicy {
  // The same as FAIL.
  UPLOAD_CONFLICT_POLICY_UNSPECIFIED = 0;
  // Refuse with code ALREADY_EXISTS and leave the existing file untouched.
  UPLOAD_CONFLICT_POLICY_FAIL = 1;
  // Replace the existing file.
  UPLOAD_CONFLICT_POLICY_OVERWRITE = 2;
  // Keep both: the upload takes the first free name of the form
  // "report (1).xlsx", "report (2).xlsx", ...
  UPLOAD_CONFLICT_POLICY_RENAME = 3;
}

message BeginFileUploadRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  // The workspace-relative folder to upload into; "" or "/" is the workspace
  // root. It must stay inside the workspace and outside .git.
  string directory = 4;
  // The file's base name: no path separators, no "." or "..".
  string filename = 5;
  // The file's total size in bytes. It must not exceed the server's limit
  // (BeginFileUploadResponse.max_size; 2 GiB by default).
  int64 size = 6;
  UploadConflictPolicy on_conflict = 7;
}

message BeginFileUploadResponse {
  // The session, opaque to the client; every later call names it.
  string upload_id = 1;
  // How many bytes each UploadFileChunk should carry (the last one may carry
  // fewer). A machine that predates staged uploads takes a small file in a
  // single chunk, and then chunk_size is the whole file.
  int32 chunk_size = 2;
  // The workspace-relative path the file is headed for. With the RENAME
  // policy the final path is decided at commit (CommitFileUploadResponse.path).
  string path = 3;
  // The largest file this server accepts, in bytes.
  int64 max_size = 4;
}

message UploadFileChunkRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string upload_id = 4;
  // Where data starts in the file. It must not be beyond the bytes received
  // so far (a gap is refused with FAILED_PRECONDITION); re-sending a piece
  // that already arrived is harmless.
  int64 offset = 5;
  bytes data = 6;
}

message UploadFileChunkResponse {
  // How many bytes of the file have arrived, contiguously from the start.
  int64 bytes_received = 1;
  // Set when this chunk itself placed the file: a machine that predates
  // staged uploads takes a small file in one chunk and writes it at once.
  // The upload is then complete and needs no CommitFileUpload.
  optional string committed_path = 2;
}

message CommitFileUploadRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string upload_id = 4;
  // Overrides the policy BeginFileUpload named: after a commit refused with
  // ALREADY_EXISTS, the client commits again with OVERWRITE or RENAME
  // without re-sending the bytes.
  optional UploadConflictPolicy on_conflict = 5;
}

message CommitFileUploadResponse {
  // The workspace-relative path the file now has.
  string path = 1;
  int64 size = 2;
  // False when the upload replaced an existing file (OVERWRITE).
  bool created = 3;
}

message AbortFileUploadRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string upload_id = 4;
}

message AbortFileUploadResponse {}

message GetFileUploadStatusRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string upload_id = 4;
}

message GetFileUploadStatusResponse {
  // False when the machine has no such session (it was committed, aborted,
  // or swept as stale): the client starts over with BeginFileUpload.
  bool exists = 1;
  // How many bytes have arrived, contiguously from the start.
  int64 bytes_received = 2;
  // The total size the session was opened with.
  int64 size = 3;
}

// ============================================
// Large downloads and folders as .zip (ReadFileRange, PrepareFolderArchive,
// GetFolderArchiveStatus, ReleaseFolderArchive)
// ============================================

message ReadFileRangeRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  // The file to read: relative to the workspace, or absolute on the machine
  // that holds it (as DownloadFile accepts). Exactly one of path and
  // archive_id is set.
  string path = 4;
  // A folder archive PrepareFolderArchive made, once it is ready.
  optional string archive_id = 5;
  // Where the piece starts in the file.
  int64 offset = 6;
  // How many bytes to read; the server serves at most 1 MiB a piece, and 0
  // asks for that much.
  int32 length = 7;
  // The version an earlier piece reported. When set and the file is no
  // longer that version, the read is refused (FailedPrecondition, reason
  // "file_changed_during_download").
  optional string if_version = 8;
}

message ReadFileRangeResponse {
  // The bytes from offset; fewer than asked only at the end of the file.
  bytes data = 1;
  // The file's whole size in bytes.
  int64 total_size = 2;
  // The file's identity and version (its size and modification time): the
  // same for every piece of an unchanged file. Pass it as if_version.
  string version = 3;
  // The base name to save as (for an archive, the folder's name + ".zip").
  string filename = 4;
  // MIME type; "application/octet-stream" when unknown.
  string content_type = 5;
  // Set on the piece that reaches the end of the file.
  bool eof = 6;
}

message PrepareFolderArchiveRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  // The workspace-relative folder to zip; "" or "/" is the workspace root.
  string path = 4;
}

message PrepareFolderArchiveResponse {
  // The archive, opaque to the client: GetFolderArchiveStatus,
  // ReadFileRange and ReleaseFolderArchive name it.
  string archive_id = 1;
  // The name to save the archive as: the folder's name + ".zip".
  string filename = 2;
  // How many files, and bytes of file content, the archive will hold.
  int64 total_files = 3;
  int64 total_bytes = 4;
  // The most file content a folder archive may hold on this server, in bytes.
  int64 max_size = 5;
}

// FolderArchiveState is how far a folder archive has got.
enum FolderArchiveState {
  FOLDER_ARCHIVE_STATE_UNSPECIFIED = 0;
  // The machine is still zipping the folder.
  FOLDER_ARCHIVE_STATE_RUNNING = 1;
  // The archive is complete and can be read (ReadFileRange).
  FOLDER_ARCHIVE_STATE_READY = 2;
  // Zipping failed; error says why. The archive is gone.
  FOLDER_ARCHIVE_STATE_FAILED = 3;
}

message GetFolderArchiveStatusRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string archive_id = 4;
}

message GetFolderArchiveStatusResponse {
  FolderArchiveState state = 1;
  // Progress: files and bytes of file content zipped so far, of the totals.
  int64 files_done = 2;
  int64 files_total = 3;
  int64 bytes_done = 4;
  int64 bytes_total = 5;
  // The archive's size in bytes, once it is READY.
  int64 archive_size = 6;
  // Why zipping failed, when FAILED.
  string error = 7;
  // Entries left out: symlinks that lead outside the workspace or to a
  // folder, credential stores, and anything that could not be read.
  int64 skipped = 8;
}

message ReleaseFolderArchiveRequest {
  string project_id = 1;
  optional string worktree_id = 2;
  optional string chat_id = 3;
  string archive_id = 4;
}

message ReleaseFolderArchiveResponse {}
