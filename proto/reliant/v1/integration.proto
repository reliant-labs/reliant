syntax = "proto3";

package reliant.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// IntegrationManifest is the declarative description of one integration: how a
// user authenticates (connection), what it can do (actions), and what can start
// a run from it (triggers). It is authored as YAML, embedded in the binary, and
// decoded through protojson, so an unknown field is a load error.
//
// Enum-like fields (connection type, placement, pagination style) are strings
// validated by the loader rather than proto enums, so manifests stay readable
// (`placement: server`) and new values do not need a wire change.
message IntegrationManifest {
  // Id is the stable integration id, e.g. "http". Lower-case, [a-z][a-z0-9_]*.
  string id = 1;
  // Version is the manifest MAJOR version. `uses: http/request@1` pins it;
  // breaking param changes ship as version 2 alongside version 1.
  int32 version = 2;
  string display_name = 3;
  string description = 4;
  string icon = 5;
  string category = 6;
  ConnectionSpec connection = 7;
  repeated ActionSpec actions = 8;
  // Triggers are the trigger types the integration delivers. Declaring one is
  // a catalog statement; delivery is the provider's (a webhook Provider or a
  // Poller registered for this id).
  repeated TriggerSpec triggers = 9;
  // Keywords are extra search terms for the catalog index: product names and
  // synonyms ("email" for gmail). Lower-case words, [a-z0-9][a-z0-9_.-]*.
  repeated string keywords = 10;
}

// ConnectionSpec says how requests are authenticated and where they may go.
// Adding a provider is data: the auth methods, the identity probe and the
// per-connection params below are everything the connections layer needs.
message ConnectionSpec {
  reserved 1, 6;
  reserved "type", "optional_auth_kinds";

  // BaseUrl is the https origin (and optional path prefix) request `path`s
  // resolve against. Every request host must be this host or in allowed_hosts.
  //
  // It may interpolate connection params, and nothing else. The leftmost host
  // label may be exactly {{ connection.params.<name> }} followed by a literal
  // domain of at least two labels
  // (https://{{ connection.params.shop }}.myshopify.com), so a user-supplied
  // value can pick a tenant but never the domain. Path segments may also
  // interpolate params; they are percent-escaped.
  string base_url = 2;
  repeated string allowed_hosts = 3;
  map<string, string> default_headers = 4;
  // AllowAnyPublicHost lets request.url name any host. It exists for the
  // generic HTTP integration only: it requires auth_optional, and the runtime
  // still refuses private addresses after DNS and pins a credential to the
  // host a call started at.
  bool allow_any_public_host = 5;
  // Auth lists the ways a user can connect, most preferred first. Empty means
  // the integration takes no credential. Each kind appears at most once; a
  // connection records which kind it was made with.
  repeated AuthMethod auth = 7;
  // AuthOptional lets an action run with no connection and attach one only
  // when the caller names it (the generic HTTP integration). Without it every
  // action needs a connection: the one named, else the owner's default, else
  // a delegated authority.
  bool auth_optional = 8;
  // ConnectionParams are per-connection, non-secret settings the user supplies
  // when connecting (a Shopify shop, a Zendesk subdomain). Templates reach
  // them as connection.params.<name>.
  repeated ConnectionParam connection_params = 9;
  // Probe asks the provider who a credential acts as. It labels a new OAuth
  // connection (and is required for oauth2, whose dedupe key is the external
  // id) and backs TestConnection for every kind.
  IdentityProbe probe = 10;
}

// AuthMethod is one way to connect. Exactly one arm is set.
message AuthMethod {
  oneof method {
    OAuth2Auth oauth2 = 1;
    ApiKeyAuth api_key = 2;
    BasicAuth basic = 3;
    DelegatedAuth delegated = 4;
  }
}

// OAuth2Auth is the authorization-code grant with PKCE.
//
// The client id and secret are deployment config, read from
// RELIANT_OAUTH_<ID>_CLIENT_ID and RELIANT_OAUTH_<ID>_CLIENT_SECRET, where <ID>
// is the integration id upper-cased. They are never in a manifest or the
// database. A deployment without them lists the method as unavailable.
message OAuth2Auth {
  // AuthorizeUrl and TokenUrl are https, fixed by the catalog. They may
  // interpolate connection params under the same rule as base_url.
  string authorize_url = 1;
  string token_url = 2;
  repeated string scopes = 3;
  // ScopeSeparator joins scopes: " " (the default, RFC 6749) or ",".
  string scope_separator = 4;
  // Pkce is the code challenge method: "S256" (the default) or "plain". PKCE
  // is always sent: RFC 6749 §3.1 has a server ignore parameters it does not
  // recognise, so sending it never breaks a provider that lacks it.
  string pkce = 5;
  // AuthorizeParams are extra authorization request parameters
  // (access_type: offline). The parameters the flow itself sets are refused.
  map<string, string> authorize_params = 6;
  // Revoke, when set, is called best-effort when a connection is deleted.
  RevokeSpec revoke = 7;
}

// RevokeSpec describes the provider's token revocation call.
message RevokeSpec {
  // Method is POST (the default), DELETE or GET.
  string method = 1;
  // Url is https and catalog-fixed. Besides connection params it may
  // interpolate {{ client_id }}.
  string url = 2;
  // ClientAuth is "none" (the default) or "basic" (client id and secret as
  // HTTP Basic credentials).
  string client_auth = 3;
  // TokenIn is where the access token goes: "form" (the default, RFC 7009),
  // "json", "query" or "bearer".
  string token_in = 4;
  // TokenParam names the token field for form, json and query (default
  // "token").
  string token_param = 5;
}

// ApiKeyAuth is a pasted key, placed in a header or a query parameter.
message ApiKeyAuth {
  // In is "header" or "query". Leaving in and name both empty lets the user
  // choose the header per connection from a fixed list; only an
  // allow_any_public_host integration may do that, since it knows no API.
  string in = 1;
  // Name is the header or query parameter that carries the key.
  string name = 2;
  // Prefix is written before the key ("Bearer ", "Token ").
  string prefix = 3;
  // Label names the key field in the connect form ("API token").
  string label = 4;
}

// BasicAuth is HTTP Basic: a username (often an account id) and a secret.
message BasicAuth {
  string username_label = 1;
  string password_label = 2;
  // UsernameParam, when set, names a connection param whose value is the
  // username (an account id the base_url also uses), so the user pastes only
  // the secret.
  string username_param = 3;
}

// DelegatedAuth takes the token from an external authority at call time, such
// as GitHub through the control plane. Broker names a broker that Go code
// registers with the connections layer; no connection row is stored. A
// deployment that registered none lists the method as unavailable.
message DelegatedAuth {
  string broker = 1;
}

// ConnectionParam is one non-secret per-connection setting.
message ConnectionParam {
  // Name is [a-z][a-z0-9_]*; templates reach it as connection.params.<name>.
  string name = 1;
  string display_name = 2;
  string description = 3;
  // Pattern is an RE2 expression every value must match in full.
  string pattern = 4;
  // DefaultValue is used when the user supplies none. A param without one is
  // required.
  string default_value = 5;
}

// IdentityProbe is one request that names the account a credential acts as.
// The connection's default_headers and its credential are applied.
message IdentityProbe {
  // Method is GET (the default) or POST.
  string method = 1;
  // Url is absolute (same template rule as base_url); path is relative to
  // base_url. Exactly one is set.
  string url = 2;
  string path = 3;
  map<string, string> headers = 4;
  // Ok is CEL over `response` (the parsed body). False means the credential
  // was refused even though the status was 2xx, as Slack reports it.
  string ok = 5;
  // ExternalId is CEL over `response` yielding the account's stable id.
  string external_id = 6;
  // Label is CEL over `response` yielding a human label (a login, an email).
  string label = 7;
  // RoutesEvents says the external id is what the integration's inbound
  // events route on (Event.AccountKey == the connection's external account,
  // as Twilio's AccountSid). Such an id must be the provider's answer for
  // the credential, never one the user typed, so a pasted credential is
  // probed before it is saved and one the provider refuses is not saved.
  // Leave it unset when events route some other way (GitHub's access
  // grants) or not at all.
  bool routes_events = 8;
}

// ActionSpec is one operation: usable as a workflow node and, optionally, as
// an agent tool, with one parameter schema and one output schema.
message ActionSpec {
  // Id is unique within the manifest, e.g. "request" or "issue.create".
  string id = 1;
  string display_name = 2;
  string description = 3;
  // Kind is "call" (default). "await_external" is reserved.
  string kind = 4;
  // Placement is "server", "any" or "daemon". Only curated (embedded)
  // manifests may claim server or any.
  string placement = 5;
  // Mutates is the capability-class flag: the action changes external state.
  // Recorded now; enforcement for triggered runs is a later phase.
  bool mutates = 6;
  ToolSpec tool = 7;
  // Params is a JSON Schema for the action's parameters.
  google.protobuf.Struct params = 8;
  // Request is the declarative HTTP call. Required unless executor is set.
  HttpRequestSpec request = 9;
  OutputSpec output = 10;
  // Executor is empty for the declarative `request`, or "go:<name>": a Go
  // function registered under <name> with the same params and output
  // contract. It is the escape hatch for what a declaration cannot express
  // (MIME assembly, request signing). The params and output schemas stay in
  // the manifest, so forms and tool definitions never depend on code. It is
  // manifest-only and never appears in workflow YAML.
  string executor = 11;
  // Summary is one line for search results and pickers; description is the
  // long form an agent reads.
  string summary = 12;
  // Keywords are extra search terms for the catalog index.
  repeated string keywords = 13;
}

// ToolSpec controls exposing an action to agents as a tool.
message ToolSpec {
  bool expose = 1;
  // Name overrides the derived tool name (`<integration>__<action>` with dots
  // in the action id turned into underscores).
  string name = 2;
  repeated string tags = 3;
}

// HttpRequestSpec is the declarative request template. String values may embed
// {{ expr }} (CEL over `params`). A string that is exactly one {{ expr }}
// keeps the expression's native type; otherwise the result is stringified.
// Values interpolated into `path` are percent-escaped.
message HttpRequestSpec {
  // Method is GET, POST, PUT, PATCH or DELETE. A template may be used.
  string method = 1;
  // Url is a full URL template, for integrations that allow it.
  string url = 2;
  // Path is appended to the connection base_url. Mutually exclusive with url.
  string path = 3;
  map<string, string> query = 4;
  map<string, string> headers = 5;
  // Body is a JSON template (any JSON shape); strings inside are templated.
  google.protobuf.Value body = 6;
  PaginationSpec pagination = 7;
  // Errors maps response statuses to retryable/permanent plus a message.
  // The first matching rule wins; unmatched non-2xx use the defaults
  // (429 and 5xx retryable, other statuses permanent).
  repeated ErrorRule errors = 8;
  // TimeoutSeconds defaults to 30, max 120.
  int32 timeout_seconds = 9;
  // MaxResponseBytes defaults to 1 MiB, max 10 MiB. Larger bodies are an error.
  int64 max_response_bytes = 10;
  // HeadersExpr, QueryExpr and BodyExpr are CEL over `params`, for requests
  // whose shape the caller supplies (the generic HTTP action). HeadersExpr and
  // QueryExpr must yield a map of scalars; BodyExpr any JSON value, or null for
  // no body. They are merged over the static maps / replace `body`.
  string headers_expr = 11;
  string query_expr = 12;
  string body_expr = 13;
  // BodyFormat is how the rendered body is encoded: "json" (the default) or
  // "form" (application/x-www-form-urlencoded, as Twilio and Stripe take). A
  // form body must render to an object whose values are scalars or lists of
  // scalars; a list repeats its key (MediaUrl=a&MediaUrl=b) and a null value
  // leaves the key out.
  string body_format = 14;
}

// PaginationSpec follows pages and concatenates each page's selected list.
message PaginationSpec {
  // Style is "link_header", "cursor", "page" or "next_url".
  string style = 1;
  // MaxPages bounds the walk (default 10, max 100).
  int32 max_pages = 2;
  // CursorParam is the query parameter that carries the cursor (cursor style).
  string cursor_param = 3;
  // NextCursor is CEL over `response` yielding the next cursor, or empty/null
  // to stop (cursor style).
  string next_cursor = 4;
  // PageParam is the query parameter carrying the page number (page style).
  string page_param = 5;
  // StartPage is the first page number (default 1).
  int32 start_page = 6;
  // NextUrl is CEL over `response` yielding the next page's URL, or
  // empty/null to stop (next_url style): Twilio's next_page_uri, Microsoft
  // Graph's @odata.nextLink. A relative reference resolves against the URL
  // of the page it came from. The next page must stay on the call's host,
  // like a Link header's, and is fetched with the first page's method and
  // headers.
  string next_url = 7;
}

// ErrorRule maps one status (or an inclusive range) to an error outcome.
//
// A rule may cover a 2xx status, for providers that report failure in a
// successful response's body (Slack answers HTTP 200 with
// {"ok": false, "error": "..."}). Such a rule must carry a `when`, and a 2xx
// response that no rule matches is a success.
message ErrorRule {
  int32 status = 1;
  int32 status_min = 2;
  int32 status_max = 3;
  bool retryable = 4;
  // Message is a template over `status`, `headers` and `response`.
  string message = 5;
  // When is an optional CEL bool over `status`, `headers` (lower-cased names)
  // and `response` that must also hold for the rule to match. It splits one
  // status that means two things: GitHub answers both an exhausted rate limit
  // (retryable) and a missing permission (permanent) with 403. A `when` that
  // fails to evaluate does not match.
  string when = 6;
}

// OutputSpec selects what part of the response becomes the node's data.
message OutputSpec {
  // Select is "$" (whole parsed body; the default), "$raw" (raw body text as
  // {"body": "..."}) or CEL over `response`, `status` and `headers`. With
  // pagination, select is evaluated per page, must yield a list, and the
  // lists are concatenated into {"items": [...]}.
  string select = 1;
  // Schema is a JSON Schema for `data`.
  google.protobuf.Struct schema = 2;
}

// TriggerSpec declares one trigger type the integration delivers: what can
// start a run from it (`github/issue.opened@1`). It is a CATALOG entry —
// what search lists, what the editor's trigger picker offers, and the schema a
// trigger filter is checked against. Delivering the events is the provider's
// (internal/integrations/webhook): its Event.Type values are what `events`
// names, and its Event.Attributes keys are what `attributes` names.
//
// A trigger row listens through an IntegrationSource, whose `events` and
// `match` are exactly this spec's events and attribute names, so the editor
// can build one from a picked spec without knowing the provider.
message TriggerSpec {
  // Id is unique within the manifest, e.g. "issue.opened". Same grammar as an
  // action id, and the same namespace: `<integration>/<id>@<major>` names
  // exactly one action or trigger, so an id may not be both.
  string id = 1;
  string display_name = 2;
  // Summary is one line for search results and pickers; description is the
  // long form an agent reads.
  string summary = 3;
  string description = 4;
  // Keywords are extra search terms for the catalog index.
  repeated string keywords = 5;
  // Events are the provider event types this trigger fires on, as the
  // provider emits them (Event.Type): "issues.opened". An IntegrationSource
  // built from this spec lists them in `events`. At least one.
  repeated string events = 6;
  // Attributes are the routing facts every event of this trigger carries,
  // which an IntegrationSource's `match` can require by equality
  // (repository, branch). An event of this trigger always sets them.
  repeated TriggerAttribute attributes = 7;
  // Data is the JSON Schema of the provider's event payload, as recorded on
  // the event (trigger.payload.data). The full trigger.payload schema wraps
  // it in the envelope every integration event shares; see
  // manifest.TriggerPayloadSchema.
  google.protobuf.Struct data = 8;
}

// TriggerAttribute is one routing fact a trigger's events carry.
message TriggerAttribute {
  // Name is the key in Event.Attributes and IntegrationSource.match:
  // lower-case, [a-z][a-z0-9_]*.
  string name = 1;
  string description = 2;
  // Example is a representative value for an editor's placeholder.
  string example = 3;
}
