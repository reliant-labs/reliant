syntax = "proto3";

package reliant.v1;

import "forge/v1/forge.proto";
import "reliant/v1/approval.proto";
import "reliant/v1/tools_daemon.proto"; // for DiskVolume, ProcessReport
import "reliant/v1/trigger.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// InboxService lists everything waiting on the calling user, across every
// project and launch kind (research/WORKFLOW_UI.md §8), or within one project.
// Scope is always the caller; no request carries a user id.
//
// An item is only listed if it can be opened: its chat's project must still
// exist and be the caller's, and a blocking item's run must not have completed
// or been cancelled.
service InboxService {
  // ListInbox returns the caller's inbox items in priority order. One round
  // trip. With limit = 0 it returns no items, only the counts, which is the
  // cheap call the nav badge makes.
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse) {}

  // CleanupStorage starts the "Clean up" action of a storage item and returns
  // at once. For each accepted worktree the machine saves the work to a local
  // ref, proves the save matches the files, and only then removes the
  // directory, in the background. Progress and outcome appear on the storage
  // item (HeldWorktree.cleaning, then the worktree leaves the list). Nothing is
  // pushed and no branch is deleted. Worktrees holding data, another
  // repository, or files outside their checkouts are never removed: they come
  // back SKIPPED and are listed for manual removal.
  rpc CleanupStorage(CleanupStorageRequest) returns (CleanupStorageResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "cleanup_storage"
        target: {
          kind: "daemon"
          id: "daemon_id"
        }
      }
    };
  }

  // ForgetStorageWorktree drops Reliant's record of the folder of an archived
  // workspace that no machine is on record for, and deletes nothing on any
  // disk. It is the way out for a workspace held "no-machine-on-record"
  // (its machine was removed) that no connected machine has: such a hold
  // otherwise never clears. Allowed only while HeldWorktree.forgettable: every
  // connected machine was asked and none has the folder. Refused with
  // FAILED_PRECONDITION otherwise, NOT_FOUND for a workspace that is not the
  // caller's. The archived workspace stays in the archive; restoring it later
  // makes a new folder.
  rpc ForgetStorageWorktree(ForgetStorageWorktreeRequest) returns (ForgetStorageWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "forget_storage"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
      }
    };
  }

  // KeepMarkedWorktree answers a marked worktree's item with "Keep": the
  // reclaim mark the person saw (mark_id) is cancelled and its tombstone
  // removed, and the worktree's quiet period starts again. NOT_FOUND for a
  // worktree of the caller's that is not marked; FAILED_PRECONDITION when it
  // carries a different mark than the one shown (refresh and decide again).
  rpc KeepMarkedWorktree(KeepMarkedWorktreeRequest) returns (KeepMarkedWorktreeResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "keep_marked_worktree"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
      }
    };
  }

  // ReclaimMarkedWorktreeNow answers a marked worktree's item with "Reclaim
  // now": the mark's waiting period is skipped and the worktree is checked
  // at once. Every other check still applies: if it was used since the mark,
  // its tombstone is gone, or it has new work, the mark is cancelled instead
  // and nothing is removed. Errors as KeepMarkedWorktree.
  rpc ReclaimMarkedWorktreeNow(ReclaimMarkedWorktreeNowRequest) returns (ReclaimMarkedWorktreeNowResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "reclaim_marked_worktree"
        target: {
          kind: "worktree"
          id: "worktree_id"
        }
      }
    };
  }

  // DismissInboxItem hides items from the caller's inbox. Every kind can be
  // dismissed. Hiding an approval or a question does not resolve it: the run
  // still waits, and the chat still shows it. A newer failure of the same
  // automation, or a new block on the same machine, has a new item_id and so
  // appears again. Unknown ids are rejected with INVALID_ARGUMENT.
  rpc DismissInboxItem(DismissInboxItemRequest) returns (DismissInboxItemResponse) {
    option (forge.v1.method) = {
      activity: {none: "per-user inbox read state: hides items without resolving them"}
    };
  }

  // RestoreInboxItem undoes DismissInboxItem. Restoring an item that was not
  // dismissed is a no-op.
  rpc RestoreInboxItem(RestoreInboxItemRequest) returns (RestoreInboxItemResponse) {
    option (forge.v1.method) = {
      activity: {none: "per-user inbox read state: undoes a dismiss"}
    };
  }
}

// InboxItemKind is declared in priority order: lower values sort first. The
// kinds that block a live run (approval, question, waiting for machine) come
// before the informational failures, so the badge count is a prefix of the list.
enum InboxItemKind {
  INBOX_ITEM_KIND_UNSPECIFIED = 0;
  // A tool or workflow-step approval is pending. Blocks a live run.
  INBOX_ITEM_KIND_APPROVAL = 1;
  // An ask_user question is pending. Blocks a live run.
  INBOX_ITEM_KIND_QUESTION = 2;
  // A live run is blocked on a suspended or starting machine. Blocks a run.
  INBOX_ITEM_KIND_WAITING_FOR_MACHINE = 3;
  // A run an automation launched failed (or its health is FAILING, or it is
  // BROKEN), and no later run of it has succeeded. One item per failure
  // streak; a later successful run resolves it. Informational.
  INBOX_ITEM_KIND_AUTOMATION_FAILING = 4;
  // An automation's newest firing failed to launch and no later firing has.
  // Informational.
  INBOX_ITEM_KIND_AUTOMATION_LAUNCH_FAILED = 5;
  // 6 was RUN_FINISHED: a successful run of an automation with
  // notify_on_complete. A run that completed successfully never puts anything
  // in the Inbox, whatever its automation's notify setting: the Inbox lists
  // what needs the person (waiting for input or approval, failed, broken).
  reserved 6;
  reserved "INBOX_ITEM_KIND_RUN_FINISHED";
  // A machine is low on disk, or holds archived worktrees it will not remove
  // on its own. One item per machine. Informational.
  INBOX_ITEM_KIND_STORAGE = 7;
  // An enabled automation cannot run until the person finishes setting it up
  // (TRIGGER_HEALTH_STATUS_NEEDS_SETUP): a required input has no value. One
  // item per automation; it links to the workflow page's automation, where
  // "Finish setup" renders, and leaves the list when setup is finished.
  // Informational.
  INBOX_ITEM_KIND_AUTOMATION_NEEDS_SETUP = 8;
  // Retained Git-host recovery, even if its source row/machine is gone.
  INBOX_ITEM_KIND_RECOVERY = 9;
  // A run an automation launched is paused: a step failed and the run is
  // waiting to retry it. While it is paused it holds its automation's
  // capacity slot, so later firings queue behind it. An unattended run retries
  // on its own and ends, failed, if the cause does not clear; this item says
  // what paused it in the meantime. One item per pause. Informational.
  INBOX_ITEM_KIND_AUTOMATION_RUN_PAUSED = 10;
  // The newest version of a workflow file that enabled automations run does
  // not parse or validate, so every firing of them is refused until a valid
  // version is synced. ONE item per broken version (machine, file, content
  // hash), however many automations and firings it refuses; it names the
  // file, the error and the branch and commit, and leaves the list when a
  // valid version lands. It replaces those automations' own failing items.
  // Informational.
  INBOX_ITEM_KIND_AUTOMATION_DEFINITION_BROKEN = 11;
  // A machine's worktree reclaim proposes removing idle worktrees that hold
  // uncommitted, unpushed or reflog-only work, and will not remove any
  // without the person's approval. One item per machine per set of
  // proposals: it lists each worktree with what it holds and a reviewing
  // agent's note, and WorktreeReclaimService.DecideWorktreeReclaim answers
  // it, worktree by worktree.
  // Informational: no run waits on it.
  INBOX_ITEM_KIND_WORKTREE_RECLAIM = 12;
  // A live worktree is marked to be reclaimed: it has been quiet for a day,
  // its work has landed (or it is clean and idle), and its machine placed a
  // tombstone in it (.reliant/RECLAIM_PENDING). It is reclaimed at
  // reclaim_at unless something happens in it first. One item per mark:
  // KeepMarkedWorktree cancels it, ReclaimMarkedWorktreeNow skips the wait.
  // Informational: nothing has to be done to keep a worktree that is used.
  INBOX_ITEM_KIND_WORKTREE_MARKED = 13;
  // A chat in an org asks before it moves from the org's AI accounts to the
  // person's own (control-plane docs/design/org-provider-accounts.md §10):
  // the org's accounts are rate-limited, unusable, or serve none of the
  // chat's model, and the person's own account could. The chat waits until
  // the person answers (ProviderAccountService.ResolvePersonalFundingChoice).
  // One item per chat per question. Blocks a live run.
  INBOX_ITEM_KIND_PERSONAL_FUNDING = 14;
  // The provider rejected one of an org's own AI provider keys (control-plane
  // docs/design/org-provider-accounts.md §4.7): it is out of every member's
  // routing until an owner or admin rotates or replaces it. Listed to the
  // org's owners and admins only, one item per key per incident (a key
  // rejected again after it was fixed is a new item). Informational: the
  // org's chats route around the key, and nothing waits on the item. A
  // member who hit the rejection is not shown it: they cannot fix an org key.
  INBOX_ITEM_KIND_ORG_PROVIDER_KEY_REJECTED = 15;
  // An automation that runs only on its org's own AI accounts (unattended
  // funding ORG_ONLY) was paused because none of them could run its model
  // twice in a row (Trigger.paused_reason "no_org_account"; control-plane
  // docs/design/org-provider-accounts.md §11.4). Listed to the automation's
  // owner and to the org's owners and admins, who alone can add an org
  // account. One item per pause; it leaves the list when the automation is
  // resumed or deleted. Informational: nothing runs until it is resumed.
  INBOX_ITEM_KIND_AUTOMATION_NO_ORG_ACCOUNT = 16;
  // Some of the person's automations in a team org (two or more live
  // members) still run on their own AI accounts (unattended funding ANY, or
  // set before the stamp existed), while new automations there run only on
  // the org's (§11.3). It is the one-time notice at the release that brought
  // the rule, and again when a solo org gains a member. Listed to that
  // automation owner only, one item per org; dismissing it holds until
  // another of their automations there joins the set. Informational.
  INBOX_ITEM_KIND_AUTOMATIONS_ON_PERSONAL_ACCOUNTS = 17;
}

message ListInboxRequest {
  // Maximum items returned. 0 returns counts only. Default (unset) is 100.
  optional int32 limit = 1;
  // Only items of this project. Unset lists every project. The counts follow
  // the same scope.
  optional string project_id = 2;
  // Only items of this organization: those about its chats, projects and
  // automations. It must be one the caller is a live member of
  // (PERMISSION_DENIED otherwise). Items about something created before orgs
  // list under the caller's default org; a machine's storage and worktree
  // items belong to no org and list in every one. Unset lists every item,
  // in any org, as before this field existed. The counts follow the same
  // scope.
  optional string org_id = 3;
}

message ListInboxResponse {
  // Sorted by kind (priority), then waiting_since ascending (longest-waiting
  // first), then item_id. Group by run_id client-side.
  repeated InboxItem items = 1;

  // Approvals + questions + waiting-for-machine: the items that block a live
  // run (an async question does not). The nav badge shows this as a number.
  // Counted over the full inbox, independent of limit.
  int32 blocking_count = 2;

  // True when any item that blocks nothing exists — a failure, an async
  // question, ... (the badge shows a dot, not a count).
  bool has_informational = 3;

  // True when limit cut the list short.
  bool truncated = 4;

  // With project_id set: how many items are waiting in the caller's OTHER
  // projects, so a scoped view can say what it is not showing. 0 when unscoped.
  int32 other_projects_count = 5;
}

message InboxItem {
  InboxItemKind kind = 1;

  // Stable key for dismissal and de-duplication, prefixed by kind
  // ("approval:", "question:", "waiting_for_machine:", "automation_failing:",
  // "automation_launch_failed:", "storage:",
  // "automation_needs_setup:", "automation_run_paused:", "worktree_reclaim:").
  // An automation run
  // paused embeds the chat id and when the failure that paused it happened,
  // so a later pause is a new item. Approvals and questions
  // embed their row id; waiting-for-machine embeds the chat id and when the
  // block began, so a later block is a new item. Automation failure items embed the id of the FIRST failing event of the
  // current failure episode, so repeated failures stay one item and a new
  // episode is a new item. A needs-setup item embeds the automation and the
  // set of inputs it is missing, so dismissing it holds until a workflow edit
  // makes it miss something new. A personal-funding item ("personal_funding:")
  // embeds the chat id and when the chat asked, so a later question is a new
  // item. A rejected org key ("org_provider_key_rejected:") embeds the account
  // id and when it was rejected, so a later rejection is a new item. An
  // automation paused for want of an org account ("automation_no_org_account:")
  // embeds the automation and when it was paused, so a later pause is a new
  // item. Automations on personal accounts ("automations_on_personal_accounts:")
  // embeds the org and the set of automations, so dismissing it holds until
  // the set gains one.
  string item_id = 2;

  // The chat the item belongs to. Empty for automation failure kinds that have
  // no run.
  string chat_id = 3;
  // The run (root workflow) id. Equal to chat_id for a root run. Items sharing
  // a run_id group together.
  string run_id = 4;
  // Set when the run was launched by an automation, and for both automation
  // failure kinds.
  string trigger_id = 5;
  string trigger_name = 6;

  string project_id = 7;
  string project_name = 8;
  string workflow_name = 9;
  string chat_title = 10;

  // RFC 3339. When the item started waiting.
  string waiting_since = 11;

  oneof payload {
    InboxApproval approval = 20;
    InboxQuestion question = 21;
    InboxWaitingForMachine waiting_for_machine = 22;
    InboxAutomationFailing automation_failing = 23;
    InboxAutomationLaunchFailed automation_launch_failed = 24;
    InboxStorage storage = 26;
    InboxAutomationNeedsSetup automation_needs_setup = 27;
    RecoveryInboxItem recovery = 28;
    InboxAutomationRunPaused automation_run_paused = 29;
    InboxAutomationDefinitionBroken automation_definition_broken = 30;
    InboxWorktreeReclaim worktree_reclaim = 31;
    InboxWorktreeMarked worktree_marked = 32;
    InboxOrgProviderKeyRejected org_provider_key_rejected = 33;
    InboxAutomationNoOrgAccount automation_no_org_account = 34;
    InboxAutomationsOnPersonalAccounts automations_on_personal_accounts = 35;
  }
  // 25 was run_finished (InboxRunFinished); see INBOX_ITEM_KIND 6.
  reserved 25;
  reserved "run_finished";
}

// InboxOrgProviderKeyRejected is one of an org's own AI provider keys that the
// provider rejected (INBOX_ITEM_KIND_ORG_PROVIDER_KEY_REJECTED). The item names
// no chat, run or project; waiting_since is when the key was rejected. Rotate
// it with OrgProviderAccountService.RotateOrgProviderAPIKey, or delete it.
message InboxOrgProviderKeyRejected {
  // The org that owns the key.
  string org_id = 1;
  // The org account (provider_accounts.id).
  string account_id = 2;
  // The provider the key is for ("anthropic", "openai", ...).
  string provider = 3;
  // The account's label, as the org's admins named it.
  string label = 4;
  // The key's last four characters, as the org's admins see it.
  string key_hint = 5;
  // Why the provider refused it, as recorded.
  string reason = 6;
}

// InboxAutomationNoOrgAccount is an automation paused because none of its
// org's own AI accounts could run its model
// (INBOX_ITEM_KIND_AUTOMATION_NO_ORG_ACCOUNT). The item's trigger_id,
// trigger_name and project are the automation; waiting_since is when it was
// paused. An admin fixes it by adding an org API key or enabling Reliant
// credits; the owner by changing its model; either way the owner resumes it.
message InboxAutomationNoOrgAccount {
  // The org whose accounts it may spend.
  string org_id = 1;
  // The automation's owner (users.id): set for an admin's item, so it can
  // say whose automation it is.
  string owner_user_id = 2;
  // What the firing that paused it recorded: which model no org account
  // could run, and who can fix it.
  string detail = 3;
}

// InboxAutomationsOnPersonalAccounts is the person's automations in a team org
// that still run on their own AI accounts
// (INBOX_ITEM_KIND_AUTOMATIONS_ON_PERSONAL_ACCOUNTS). The item names no chat,
// run or automation of its own; waiting_since is when the newest of them was
// created. Each automation can be switched to the org's accounts only
// (Trigger.unattended_funding ORG_ONLY).
message InboxAutomationsOnPersonalAccounts {
  // The team org.
  string org_id = 1;
  // How many of the person's automations in it run on their own accounts.
  int32 count = 2;
  // Their ids (triggers.id), at most 50, oldest first.
  repeated string trigger_ids = 3;
}

// InboxAutomationRunPaused is a paused run of an automation. The item's
// chat_id is the run to open; waiting_since is when the step that paused it
// failed.
message InboxAutomationRunPaused {
  // The failure that paused the run (the failing step's error), or empty
  // when none was recorded.
  string reason = 1;
}

// Catalog-backed information; RestoreInboxItem still only undismisses.
message RecoveryInboxItem {
  string recovery_id = 1;
  string source_worktree_id = 2;
  string source_worktree_name = 3;
  string project_id = 4;
  string project_name = 5;
  string phase = 6;
  int32 checkout_count = 7;
  string last_error = 8;
  // Persisted operation identity allows safe retry after a client restart.
  string operation = 9;
  string operation_key = 10;
  string target_daemon_id = 11;
}

message InboxApproval {
  string approval_id = 1;
  ApprovalType approval_type = 2;
  // The approval's title.
  string title = 3;
  // Approval.batch_id: the approvals the run raised together. The Inbox
  // offers a batch of more than one as a single decision.
  string batch_id = 7;
  // Described the call a tool approval (the removed APPROVAL_TYPE_TOOL) asked
  // about.
  reserved 4, 5, 6;
  reserved "tool_name", "tool_call_id", "argument_summary";
}

message InboxQuestion {
  string question_id = 1;
  string thread_id = 2;
  // The first question's text, when the metadata carries one.
  string prompt = 3;
  // The raw question metadata (JSON), so the client can render the full form.
  optional string metadata = 4;
  // Asked without waiting (ask_user without blocking: true): the agent kept working, so
  // the item waits on the user without blocking a run. Not counted in
  // blocking_count.
  bool async = 5;
}

message InboxWaitingForMachine {
  string daemon_id = 1;
  // Hostname the daemon reported. Empty if it has not reported one.
  string daemon_name = 2;
}

message InboxAutomationFailing {
  TriggerHealth health = 1;
  // The run to open: the newest launched firing's chat, when it still exists.
  optional string last_run_chat_id = 2;
  // Set for attention-managed incidents; absent/empty retains legacy behavior.
  string incident_key = 3;
  string attention_state = 4;
  // unsuccessful, execution_error, or recovery_expired when known.
  string failure_class = 5;
  string detail = 6;
}

// InboxAutomationNeedsSetup is an automation waiting for its owner to finish
// setting it up. The item's workflow_name and project_id locate the workflow
// page's automation.
// InboxAutomationDefinitionBroken is one broken version of one workflow file
// and the enabled automations it refuses.
message InboxAutomationDefinitionBroken {
  // The broken version: path, machine, branch, commit, content hash and the
  // error.
  TriggerEventDefinition definition = 1;

  // The enabled automations whose firings it refuses, by name.
  repeated InboxRefusedAutomation automations = 2;
}

// InboxRefusedAutomation is one automation a broken definition refuses.
message InboxRefusedAutomation {
  string trigger_id = 1;
  string trigger_name = 2;
}

message InboxAutomationNeedsSetup {
  // What is missing, one entry per workflow input, in input-name order.
  repeated TriggerSetupIssue issues = 1;
}

message InboxAutomationLaunchFailed {
  // Why the launch failed (the event's outcome detail).
  string reason = 1;
  // The id of the FIRST failed trigger event of this episode; the item id
  // derives from it.
  string event_id = 2;
  // How many consecutive firings have failed to launch in this episode.
  int32 consecutive_failures = 3;
}

message DismissInboxItemRequest {
  // One row, or a whole section ("Dismiss all").
  repeated string item_ids = 2;
}

message DismissInboxItemResponse {}

message RestoreInboxItemRequest {
  repeated string item_ids = 1;
}

message RestoreInboxItemResponse {}

// InboxStorage describes one machine's disk and the archived worktrees it is
// holding. The item exists while any of its volumes is under pressure or any
// worktree is held. An item with an empty daemon_id holds the archived
// worktrees no machine is on record for (their machine was removed): it has
// no disk and no Clean up, only ForgetStorageWorktree for the forgettable
// ones.
message InboxStorage {
  // disk_free_bytes / disk_total_bytes described only the volume holding the
  // worktree root — on a cloud machine the one volume that never fills. The
  // volumes field replaced them.
  reserved 3, 4;
  reserved "disk_free_bytes", "disk_total_bytes";

  string daemon_id = 1;
  string daemon_name = 2;
  // True when any of the machine's volumes is under pressure (the daemon's
  // hysteresis bit, DiskVolume.pressure).
  bool disk_low = 5;
  // RFC 3339 of the machine's last disk report; empty when it has not
  // reported.
  string reported_at = 6;
  // Archived worktrees the machine would not remove by itself. Clean up acts
  // on the removable ones; the rest are listed for manual removal.
  repeated HeldWorktree held = 7;
  // False when the machine is offline: the item still shows what it last
  // reported, but Clean up cannot run until it reconnects.
  bool online = 8;
  // Every volume the machine last reported, fullest first: the one under
  // pressure names itself ("build caches & docker") and, while it is, what is
  // using it.
  repeated DiskVolume volumes = 9;
  // Set while the machine is refusing new background heavy commands because
  // it is near its process limit: the count, the limit, and the largest
  // process trees by the agent that started them.
  ProcessReport processes = 10;
}

// HeldWorktree is one archived workspace kept on a machine, and why.
message HeldWorktree {
  string worktree_id = 1;
  string name = 2;
  string project_name = 3;
  string path = 4;
  // Why it was not removed automatically: "dirty" (uncommitted, untracked or
  // hidden edits), "unpushed" (commits on no remote branch), "in_use" (a
  // running process is inside it), "unverified" (git could not answer),
  // "too_large" (too big to save), "data" (ignored files that are not
  // rebuildable: ./data, .env*, *.db, ...), "nested-repository" (another git
  // repository inside it), "files-outside-checkout" (files in a multi-repo
  // workspace outside every checkout), "shared-with-live-workspace" (an open
  // workspace's directory or checkout is inside it) or "unmanaged" (not
  // reliant's to remove).
  string reason = 5;
  string detail = 6;
  // Directory size; a lower bound for very large trees. 0 when unmeasured.
  int64 size_bytes = 7;
  // True when Clean up may remove it. False for data, nested repositories and
  // files outside the checkouts: remove those by hand.
  bool removable = 8;
  // A clean-up of this worktree is running now.
  bool cleaning = 9;
  // True when ForgetStorageWorktree may drop it: no machine is on record for
  // it ("no-machine-on-record"), at least one machine is connected, and every
  // connected machine answered that it does not have the folder.
  bool forgettable = 10;
}

// InboxWorktreeReclaim is one machine's pending worktree-reclaim proposals,
// as it last reported them (DiskReport.worktree_reclaim). The item's id names
// the machine and the set of proposals (worktree_reclaim:<daemon>:<digest>):
// a new or changed proposal makes a new item, and a dismissal holds for the
// set it was made about.
message InboxWorktreeReclaim {
  string daemon_id = 1;
  string daemon_name = 2;
  // False when the machine is offline: the item still lists what it last
  // reported, but a decision cannot reach it until it reconnects.
  bool online = 3;
  // RFC 3339 of the machine's last report.
  string reported_at = 4;
  // "dry-run" or "on". In dry-run an approved worktree is reclaimed once the
  // machine's reclaim is switched on.
  string mode = 5;
  // Oldest proposal first, at most 50; total counts them all.
  repeated WorktreeReclaimProposal proposals = 6;
  int32 total = 7;
}

// InboxWorktreeMarked is a live worktree marked to be reclaimed. The item's
// project_id and project_name are the worktree's project; waiting_since is
// when it was marked.
message InboxWorktreeMarked {
  string worktree_id = 1;
  string name = 2;
  string path = 3;
  string branch = 4;
  string daemon_id = 5;
  string daemon_name = 6;
  // The mark this item is about; KeepMarkedWorktree and
  // ReclaimMarkedWorktreeNow act only while the worktree still carries it.
  string mark_id = 7;
  // RFC 3339: when it was marked, and when it will be reclaimed if nothing
  // happens in it before then.
  string marked_at = 8;
  string reclaim_at = 9;
  // Why it qualified: "landed" (its work is merged) or "recoverable-idle"
  // (clean, pushed and unused).
  string reason = 10;
  // True once the person chose "Reclaim now": it is reclaimed at the next
  // check that finds nothing has happened in it.
  bool approved = 11;
}

message KeepMarkedWorktreeRequest {
  string worktree_id = 1;
  string mark_id = 2;
}

message KeepMarkedWorktreeResponse {}

message ReclaimMarkedWorktreeNowRequest {
  string worktree_id = 1;
  string mark_id = 2;
}

message ReclaimMarkedWorktreeNowResponse {}

message ForgetStorageWorktreeRequest {
  string worktree_id = 1;
}

message ForgetStorageWorktreeResponse {}

message CleanupStorageRequest {
  // The machine whose item was shown.
  string daemon_id = 1;
  // The worktree ids listed in the confirmation dialog. The server acts on the
  // INTERSECTION of these with what that machine still holds, so a worktree
  // archived after the dialog opened is never removed unseen, and an id the
  // machine does not hold is ignored.
  repeated string worktree_ids = 2;
}

message CleanupStorageResponse {
  // One entry per requested id: ACCEPTED (running in the background) or
  // SKIPPED with the reason.
  repeated CleanupStorageResult results = 1;
}

message CleanupStorageResult {
  string worktree_id = 1;
  CleanupStorageOutcome outcome = 2;
  // Why it was left alone, for display.
  string message = 3;
}

enum CleanupStorageOutcome {
  CLEANUP_STORAGE_OUTCOME_UNSPECIFIED = 0;
  // Started; progress shows on the storage item.
  CLEANUP_STORAGE_OUTCOME_ACCEPTED = 1;
  // Not started and left exactly as it was: no longer held, already being
  // cleaned up, or not removable by Clean up.
  CLEANUP_STORAGE_OUTCOME_SKIPPED = 2;
}
