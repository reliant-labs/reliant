syntax = "proto3";

package reliant.v1;

import "forge/v1/forge.proto";
import "reliant/v1/chat.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// AttachmentService handles file attachment operations
// Wire change (owner-approved, breaking:approved, 2026-11-25; reliant#3253):
// the attachment rpcs took forge's native CRUD shapes (timestamps and the
// Get/Upload response layouts changed). Clients built before it must upgrade.
service AttachmentService {
  // UploadAttachment uploads a new binary file attachment (for images)
  rpc UploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse) {
    option (forge.v1.method) = {
      activity: {none: "stages an image for the composer: the message that sends it is the record"}
    };
  }

  // CreateFileReference creates a reference to a local file (for text files)
  rpc CreateFileReference(CreateFileReferenceRequest) returns (CreateFileReferenceResponse) {
    option (forge.v1.method) = {
      activity: {none: "stages a file's content for the composer: the message that sends it is the record"}
    };
  }

  // GetAttachment retrieves an attachment by ID (includes file content)
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteAttachment removes an attachment by ID
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse) {
    option (forge.v1.method) = {
      activity: {none: "removes an attachment staged for the composer: draft state of a message not yet sent"}
    };
  }
}

// ============================================
// UploadAttachment
// ============================================

message UploadAttachmentRequest {
  // Original filename
  string filename = 1;
  // File content as bytes (base64 encoded in JSON transport)
  bytes content = 2;
  // MIME type of the file
  string mime_type = 3;
  // The organization to stamp on the attachment: the web app sends its
  // chat's org, or the org it is scoped to before a chat exists. The caller
  // must be a live member of it (NotFound otherwise); the stamp records that
  // membership at upload time, not which chat the file is for. An org-scoped
  // read (GTM's attach-from-chat) takes only an attachment stamped with its
  // org. Unset, or an org the server cannot verify right now, stamps none.
  optional string org_id = 4;
}

message UploadAttachmentResponse {
  // The created attachment with metadata
  Attachment attachment = 1;
}

// ============================================
// GetAttachment
// ============================================

message GetAttachmentRequest {
  string id = 1;
}

message GetAttachmentResponse {
  // Attachment metadata
  Attachment attachment = 1;
  // File content as bytes (base64 encoded in JSON transport)
  bytes content = 2;
}

// ============================================
// DeleteAttachment
// ============================================

message DeleteAttachmentRequest {
  string id = 1;
}

message DeleteAttachmentResponse {
  string message = 1;
}

// ============================================
// CreateFileReference (for text files - store path only)
// ============================================

message CreateFileReferenceRequest {
  // Absolute path to the file on disk (kept as metadata for display)
  string file_path = 1;
  // Original filename (basename of the path)
  string filename = 2;
  // File content as bytes — captured at attach time so the server doesn't need filesystem access
  bytes content = 3;
  // The organization to stamp on the reference, as
  // UploadAttachmentRequest.org_id.
  optional string org_id = 4;
}

message CreateFileReferenceResponse {
  // The created file reference with metadata
  Attachment attachment = 1;
}
