syntax = "proto3";

package reliant.v1;

import "google/protobuf/struct.proto";
import "reliant/v1/connection.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// CatalogService provides discovery endpoints for models, tools, and activities
service CatalogService {
  // ListModels returns all available models filtered by user's configured API keys
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {}
  
  // ListModelsByProvider returns all models for a specific provider
  rpc ListModelsByProvider(ListModelsByProviderRequest) returns (ListModelsByProviderResponse) {}

  // ListAvailableModels returns the models available to the caller across every
  // configured provider, carrying per-account availability (enabled) so a picker
  // can render which models the user's account may actually use.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) {}

  // ListTools returns all available tools
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {}
  
  // ListNodes returns all workflow nodes available for the workflow builder
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {}

  // GetCELCompletions returns CEL expression completion data for the workflow builder
  rpc GetCELCompletions(GetCELCompletionsRequest) returns (GetCELCompletionsResponse) {}

  // SearchCatalog searches the integration catalog: every action and trigger
  // type of every embedded integration manifest, ranked for the query and
  // marked with whether the caller can use it now. It returns lightweight
  // entries one page at a time and never the whole catalog; GetCatalogEntry
  // returns one entry's schemas.
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse) {}

  // GetCatalogEntry returns one action or trigger type in full: its
  // description, its params and output (or trigger payload) JSON Schemas, and
  // what a connection to its integration requires. An unknown ref is
  // NOT_FOUND.
  rpc GetCatalogEntry(GetCatalogEntryRequest) returns (GetCatalogEntryResponse) {}

  // ListCatalogIntegrations browses the catalog by integration: one row per
  // integration that has an entry of the requested kinds, the ones the caller
  // can use now first. It is paged like SearchCatalog, so a picker browsing
  // hundreds of integrations holds only what it has scrolled to;
  // SearchCatalog with `integration` set lists one integration's entries.
  rpc ListCatalogIntegrations(ListCatalogIntegrationsRequest) returns (ListCatalogIntegrationsResponse) {}
}

// ModelInfo represents information about an LLM model
message ModelInfo {
  // Model identifier (e.g., "claude-4-sonnet")
  string id = 1;
  // Human-readable name
  string name = 2;
  // Provider/driver (e.g., "anthropic", "openai") - used for display grouping
  string provider = 3;
  // Model capabilities (e.g., "vision", "function_calling")
  repeated string capabilities = 4;
  // Context window size in tokens
  int64 context_window = 5;
  // Default max output tokens
  int64 default_max_tokens = 6;
  // Per-token prices are gone: cost is whatever the provider reports for a
  // request, so the catalog carries no price table to publish.
  reserved 7, 8;
  reserved "cost_per_1m_in", "cost_per_1m_out";
  // Whether the model supports reasoning/thinking
  bool can_reason = 9;
  // Whether the model supports file attachments
  bool supports_attachments = 10;
  // Driver ID for routing (e.g., "openrouter", "anthropic") - the actual API to use
  // This allows the same model to appear under multiple providers
  string driver_id = 11;
  // Model tags for categorization (e.g., "flagship", "fast", "cheap")
  repeated string tags = 12;
  // Whether the model supports tool/function calling
  bool supports_tools = 13;
  // Whether the model supports caching
  bool supports_caching = 14;
  // Supported non-empty thinking levels for this model+driver (e.g., ["low", "medium", "high", "xhigh"])
  repeated string supported_thinking_levels = 15;
  // Whether a temperature set for this model+driver actually reaches the provider.
  // False for omit-mode models and drivers that ignore temperature; the UI hides the control.
  bool supports_temperature = 16;

  // Set only for driver_id "local": the machine whose local model server
  // serves this model. A local model is reachable only through that daemon,
  // so the id (e.g. "qwen3:latest@local") is ambiguous without it.
  LocalModelSource local = 17;
}

// LocalModelSource locates a local model on a specific daemon's machine.
message LocalModelSource {
  string daemon_id = 1;
  // Display name of the machine (daemon hostname).
  string machine_name = 2;
  // LocalModelEndpoint.id on that daemon.
  string endpoint_id = 3;
  // LocalModelEndpoint.kind ("ollama", "lmstudio", ...).
  string endpoint_kind = 4;
  // False while the daemon is offline: the model is listed so the user can
  // see it, but it cannot run until the machine comes back.
  bool online = 5;
}

// ListModelsRequest is the request for ListModels
message ListModelsRequest {}

// ListModelsResponse is the response for ListModels
message ListModelsResponse {
  // List of available models
  repeated ModelInfo models = 1;
  // Total number of models
  int32 total = 2;
  // What each declared tag selector resolves to for the calling user's
  // configured providers, in ListAllTags order. Tags that resolve to nothing
  // (or only to non-text models, e.g. image-gen) are omitted.
  repeated TierResolution tiers = 3;
}

// TierResolution is what a tag selector resolves to for this user right now.
message TierResolution {
  string tag = 1;
  // "modelId@driverId", same format as ModelInfo.id
  string model_id = 2;
  // Effort the tier runs at ("" = model cannot reason)
  string thinking_level = 3;
}

// ListModelsByProviderRequest is the request for ListModelsByProvider
message ListModelsByProviderRequest {
  // Provider name to filter by (e.g., "anthropic", "openai")
  string provider = 1;
}

// ListModelsByProviderResponse is the response for ListModelsByProvider
message ListModelsByProviderResponse {
  // List of models for the specified provider
  repeated ModelInfo models = 1;
}

// AvailableModelInfo is a picker-oriented, provider-scoped view of a model,
// including whether the caller's account may actually use it (enabled).
message AvailableModelInfo {
  // Reliant model id (e.g. "claude-5-sonnet").
  string id = 1;
  // Human-readable display name.
  string display_name = 2;
  // Provider/driver serving this model (e.g. "anthropic", "copilot").
  string provider = 3;
  // Model vendor/family (claude, openai, gemini, grok, other).
  string family = 4;
  // Provider-facing model identifier (the api_model on the provider mapping).
  string api_model = 5;
  // Context window size in tokens.
  int64 context_window = 6;
  // Default max output tokens.
  int64 default_max_tokens = 7;
  // Per-token prices are gone: cost is whatever the provider reports for a
  // request, so the catalog carries no price table to publish.
  reserved 8, 9;
  reserved "cost_per_1m_in", "cost_per_1m_out";
  // Whether the model supports reasoning/thinking.
  bool can_reason = 10;
  // Whether the model supports file attachments.
  bool supports_attachments = 11;
  // Whether the model supports tool/function calling.
  bool supports_tools = 12;
  // Whether the model supports caching.
  bool supports_caching = 13;
  // Model tags for categorization (e.g., "flagship", "fast", "cheap").
  repeated string tags = 14;
  // Whether the caller's account may actually use this model. Static providers
  // report true for every model; a dynamic provider (Copilot) reports the
  // account's per-model policy.
  bool enabled = 15;
}

// ListAvailableModelsRequest is the request for ListAvailableModels
message ListAvailableModelsRequest {}

// ListAvailableModelsResponse is the response for ListAvailableModels
message ListAvailableModelsResponse {
  // Available models across all configured providers, one entry per
  // {model, provider} pair.
  repeated AvailableModelInfo models = 1;
}

// ToolInfo represents information about a tool
message ToolInfo {
  // Tool name (e.g., "view", "edit", "shell")
  string name = 1;
  // Human-readable description
  string description = 2;
  // Tool category (e.g., "File Operations", "Search & Discovery")
  string category = 3;
}

// ListToolsRequest is the request for ListTools
message ListToolsRequest {}

// ListToolsResponse is the response for ListTools
message ListToolsResponse {
  // List of available tools
  repeated ToolInfo tools = 1;
  // Total number of tools
  int32 total = 2;
}

// NodeInputField describes an input field for a node
message NodeInputField {
  // Field name
  string name = 1;
  // Field type (string, integer, boolean, array, object)
  string type = 2;
  // Human-readable description
  string description = 3;
  // Whether the field is required
  bool required = 4;
  // Default value as JSON string (optional)
  string default_value = 5;
  // Valid enum values for dropdown fields (pipe-separated in struct tag)
  repeated string enum_values = 6;
  // UI rendering hint (dropdown, textarea, input)
  string ui_hint = 7;
  // Minimum value for numeric fields (optional)
  optional double min_value = 8;
  // Maximum value for numeric fields (optional)
  optional double max_value = 9;
  // Human-readable short label for form controls.
  string label = 10;
  // Field 11 was placeholder, replaced by example (16).
  reserved 11;
  reserved "placeholder";
  // Optional UI visibility contexts (e.g., "basic", "advanced", "debug").
  repeated string visibility_contexts = 12;
  // Optional cleanup behavior hint for UI/client preprocessing.
  optional string cleanup_semantics = 13;
  // Whether this field supports CEL expressions (wrapped in CelX type).
  bool is_cel = 14;
  // Per-field grouping category (e.g., "Model Settings", "Tools").
  string category = 15;
  // What a value looks like, as an author writes it: a literal or a
  // {{ expression }}. Shown as the empty input's placeholder. FieldMeta.example.
  string example = 16;
  // The kind of value in a few words ("list of tool calls"), when the type
  // undersells it. FieldMeta.type_hint.
  string type_hint = 17;
  // Sub-fields of a message-typed OUTPUT field (or of its items, when the
  // field is repeated), e.g. call_llm's tool_calls[].name. Empty on inputs
  // and on dynamic objects (google.protobuf.Struct), whose keys are unknown.
  repeated NodeInputField children = 18;
}

// NodeInfo represents a workflow node available for the builder
message NodeInfo {
  // Node ID (e.g., "call_llm", "create_worktree")
  string id = 1;
  // Human-readable display name
  string display_name = 2;
  // Description of what the node does
  string description = 3;
  // Category for grouping (e.g., "git", "worktree")
  string category = 4;
  // Input fields for the node
  repeated NodeInputField input_fields = 5;
  // Icon hint for the UI (optional)
  string icon_hint = 6;
  // Output fields available via nodes.<id>.* in CEL expressions
  repeated NodeInputField output_fields = 7;
}

// NodeCategory describes a category of nodes
message NodeCategory {
  // Category ID
  string id = 1;
  // Human-readable display name
  string display_name = 2;
  // Number of nodes in this category
  int32 count = 3;
}

// ListNodesRequest is the request for ListNodes
message ListNodesRequest {
  // Optional category filter
  string category = 1;
  // Whether to include internal nodes (default: false)
  bool include_internal = 2;
}

// ListNodesResponse is the response for ListNodes
message ListNodesResponse {
  // List of available nodes
  repeated NodeInfo nodes = 1;
  // List of categories with counts
  repeated NodeCategory categories = 2;
}

// GetCELCompletionsRequest is the request for GetCELCompletions
message GetCELCompletionsRequest {}

// CELFieldInfo describes a field within a CEL namespace or output schema
message CELFieldInfo {
  string name = 1;
  string type = 2;
  string description = 3;
}

// CELNamespaceInfo describes a namespace accessible in CEL expressions
message CELNamespaceInfo {
  string name = 1;
  string description = 2;
  bool is_dynamic = 3;
  repeated CELFieldInfo fields = 4;
}

// CELFunctionInfo describes a custom CEL function
message CELFunctionInfo {
  string name = 1;
  string signature = 2;
  string description = 3;
  string example = 4;
  // Whether this is a member function (called as value.func()) vs global (func(value))
  bool is_member = 5;
}

// CELNodeOutputSchema describes the output fields for a workflow node type
message CELNodeOutputSchema {
  string node_type = 1;
  string display_name = 2;
  repeated CELFieldInfo fields = 3;
}

// CELHelperTypeInfo describes a nested/helper type used in node outputs
message CELHelperTypeInfo {
  string name = 1;
  string description = 2;
  string access_path = 3;
  repeated CELFieldInfo fields = 4;
}

// GetCELCompletionsResponse is the response for GetCELCompletions
message GetCELCompletionsResponse {
  repeated CELNamespaceInfo namespaces = 1;
  repeated CELFunctionInfo functions = 2;
  repeated CELNodeOutputSchema node_output_schemas = 3;
  repeated CELHelperTypeInfo helper_types = 4;
}

// CatalogEntryKind is what an integration catalog entry describes.
enum CatalogEntryKind {
  CATALOG_ENTRY_KIND_UNSPECIFIED = 0;
  // ACTION is an operation a workflow `action` node runs (`uses: <ref>`).
  CATALOG_ENTRY_KIND_ACTION = 1;
  // TRIGGER is an event type that can start a run.
  CATALOG_ENTRY_KIND_TRIGGER = 2;
}

// CatalogIntegration is the integration an entry belongs to.
message CatalogIntegration {
  // Id is the integration id, e.g. "github".
  string id = 1;
  // Version is the manifest major version every ref of this integration pins.
  int32 version = 2;
  string display_name = 3;
  // Icon is an icon hint, e.g. "github" or "globe".
  string icon = 4;
  // Category groups integrations, e.g. "engineering" or "core".
  string category = 5;
}

// CatalogEntrySummary is one search result: enough to render a picker row.
message CatalogEntrySummary {
  // Ref names the entry: "<integration>/<id>@<major>", e.g.
  // "github/issue.create@1". An action node's `uses` is this ref.
  string ref = 1;
  CatalogEntryKind kind = 2;
  // Id is the action or trigger id within its integration, e.g. "issue.create".
  string id = 3;
  string display_name = 4;
  // Summary is one line for a picker or a search result.
  string summary = 5;
  CatalogIntegration integration = 6;
  // AuthKinds are the ways to connect the integration, most preferred first.
  // Empty when it takes no credential.
  repeated ConnectionAuthKind auth_kinds = 7;
  // ConnectionRequired is false when the integration takes no credential or
  // makes one optional (the generic HTTP action).
  bool connection_required = 8;
  // Connected reports whether the caller can use the entry now without
  // connecting anything first: no connection is required, the caller has an
  // active connection to the integration, or a delegated authority serves it
  // on this deployment (GitHub through the control plane).
  bool connected = 9;
  // Mutates is set on an action that changes external state.
  bool mutates = 10;
}

// CatalogFacet counts the matches that carry one value of a facet.
message CatalogFacet {
  string value = 1;
  int32 count = 2;
}

message SearchCatalogRequest {
  // Query is free text: words, a ref, or the start of either. Every word
  // must match an entry (as a word or the start of one) for it to be
  // returned. Empty matches every entry, so the filters alone browse.
  // At most 256 bytes.
  string query = 1;
  // Kinds keeps only entries of these kinds. Empty means every kind.
  repeated CatalogEntryKind kinds = 2;
  // Category keeps only entries of integrations in this category. Empty
  // means every category.
  string category = 3;
  // Integration keeps only entries of this integration id. Empty means every
  // integration.
  string integration = 4;
  // ConnectedOnly keeps only entries the caller can use now (see
  // CatalogEntrySummary.connected).
  bool connected_only = 5;
  // PageSize defaults to 20; larger values are capped at 100.
  int32 page_size = 6;
  // PageToken is a previous response's next_page_token. It is only valid for
  // the same query and filters.
  string page_token = 7;
}

message SearchCatalogResponse {
  // Entries are the page, best match first.
  repeated CatalogEntrySummary entries = 1;
  // NextPageToken fetches the next page; empty on the last.
  string next_page_token = 2;
  // TotalSize is how many entries match the query and every filter.
  int32 total_size = 3;
  // CategoryFacets count the matches per integration category, applying
  // every filter except category, so a picker can show what each category
  // would hold. Largest first, then by category.
  repeated CatalogFacet category_facets = 4;
}

message ListCatalogIntegrationsRequest {
  // Kinds keeps only integrations with at least one entry of these kinds,
  // and counts only those entries. Empty means every kind.
  repeated CatalogEntryKind kinds = 1;
  // Category keeps only integrations in this category. Empty means every
  // category.
  string category = 2;
  // PageSize defaults to 20; larger values are capped at 100.
  int32 page_size = 3;
  // PageToken is a previous response's next_page_token. It is only valid for
  // the same filters.
  string page_token = 4;
}

// CatalogIntegrationListing is one integration in a browse listing.
message CatalogIntegrationListing {
  CatalogIntegration integration = 1;
  // EntryCount is how many of the integration's entries are of the requested
  // kinds.
  int32 entry_count = 2;
  // Connected reports whether the caller can use the integration now, as
  // CatalogEntrySummary.connected does for one entry.
  bool connected = 3;
}

message ListCatalogIntegrationsResponse {
  // Integrations are the page: connected first, then by display name.
  repeated CatalogIntegrationListing integrations = 1;
  // NextPageToken fetches the next page; empty on the last.
  string next_page_token = 2;
  // TotalSize is how many integrations match every filter.
  int32 total_size = 3;
  // CategoryFacets count the matching integrations per category, applying
  // every filter except category. Largest first, then by category.
  repeated CatalogFacet category_facets = 4;
}

message GetCatalogEntryRequest {
  // Ref is a CatalogEntrySummary.ref, e.g. "github/user.get@1".
  string ref = 1;
}

message GetCatalogEntryResponse {
  CatalogEntry entry = 1;
}

// CatalogEntry is one action or trigger type in full.
message CatalogEntry {
  CatalogEntrySummary summary = 1;
  // Description is the long form an agent or a help panel reads.
  string description = 2;
  // ParamsSchema is the JSON Schema of an action's parameters, which an
  // action node's `with:` supplies. Unset for a trigger.
  google.protobuf.Struct params_schema = 3;
  // OutputSchema is the JSON Schema of an action's output data, reachable as
  // nodes.<id>.data. Unset for a trigger.
  google.protobuf.Struct output_schema = 4;
  // PayloadSchema is the JSON Schema of a trigger's event, reachable as
  // trigger.payload. Unset for an action.
  google.protobuf.Struct payload_schema = 5;
  CatalogConnectionRequirement connection = 6;
  // ToolName is the agent tool this action is also exposed as (for example
  // "github__user_get"); empty when it is not exposed to agents.
  string tool_name = 7;
  // ParamOrder is the action's params in the order its manifest declares
  // them. ParamsSchema is a Struct, so its keys arrive in no meaningful order;
  // a form lists required params first, then the rest, each in this order.
  repeated string param_order = 8;
}

// CatalogConnectionRequirement is what using an entry asks of a connection.
message CatalogConnectionRequirement {
  // Required is false when the integration takes no credential or makes one
  // optional.
  bool required = 1;
  // Methods are the ways to connect, most preferred first, each with whether
  // this deployment offers it (the shape ListIntegrations returns).
  repeated IntegrationAuthMethod methods = 2;
  // ConnectionParams are the non-secret settings a new connection asks for.
  repeated IntegrationConnectionParam connection_params = 3;
}
