syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "google/protobuf/timestamp.proto";
import "reliant/v1/chat.proto";
import "reliant/v1/common.proto";
import "reliant/v1/project.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// SharingService is read-only sharing (control-plane
// docs/design/org-sharing.md): an owner shares a chat or project with the
// live members of its organization, who can then read it, never change it.
//
// Sharing is reachable only through this service and the Chat/Project
// visibility and viewer_access fields: no existing list (ListChats,
// ListProjects, SearchChats, ...) ever includes another person's shared chat,
// so a client that predates sharing never shows one as the caller's own.
// Every read of a shared item, and every change of who may read it, is a
// person's (a session in the app): an agent's CLI login is refused, so no
// agent reads a teammate's transcript into its context. It is not part of the
// public SDK (proto/public-api.txt).
//
// A chat can also be shared with one person at a time (SetChatMember;
// control-plane docs/design/chat-collaboration.md): a grant of VIEW, REPLY or
// MANAGE that admits its holder while they are a live member of the chat's
// organization. A grant at any level reads the chat as a viewer does, even a
// private one; what REPLY and MANAGE add arrives rpc by rpc, each documented
// where it does.
service SharingService {
  // SetChatVisibility shares a chat with its organization (ORG) or makes it
  // private again (PRIVATE).
  //
  // Only the owner may share, as a person, and only a chat that belongs to an
  // org (FAILED_PRECONDITION otherwise). The owner may make it private with any
  // credential that can change the chat. An admin or owner of the chat's org
  // (asked of control-plane fresh, as a person) may make a member's shared
  // chat private, never share it (PERMISSION_DENIED). Anyone who cannot read
  // it is NOT_FOUND. Each change records one share event; setting what is
  // already set changes nothing (changed = false).
  rpc SetChatVisibility(SetChatVisibilityRequest) returns (SetChatVisibilityResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "chat"
          id: "chat_id"
          label: "response.chat.title"
        }
        detail: ["visibility"]
      }
    };
  }

  // SetProjectVisibility is SetChatVisibility for a project. Sharing a
  // project shares its card and lets viewers list its shared chats; it never
  // shares a chat that is not shared itself.
  rpc SetProjectVisibility(SetProjectVisibilityRequest) returns (SetProjectVisibilityResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "project"
          id: "project_id"
          label: "response.project.name"
        }
        detail: ["visibility"]
      }
    };
  }

  // ListSharedChats lists the chats other members shared with an
  // organization the caller is a live member of, most recently active first:
  // the "Shared with the org" list. Never the caller's own. Each carries
  // viewer_access, and leaves out what is the owner's alone (see
  // Chat.viewer_access).
  rpc ListSharedChats(ListSharedChatsRequest) returns (ListSharedChatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      activity: {none: "reads only: lists what others shared"}
    };
  }

  // ListSharedProjects lists the projects other members shared with an
  // organization the caller is a live member of, most recently active first,
  // each with viewer_access set and without path.
  rpc ListSharedProjects(ListSharedProjectsRequest) returns (ListSharedProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      activity: {none: "reads only: lists what others shared"}
    };
  }

  // SetChatMember grants a person a level on a chat (VIEW, REPLY or MANAGE),
  // or changes the level they hold (control-plane
  // docs/design/chat-collaboration.md §3). A grant admits its holder only
  // while they are a live member of the chat's organization; a VIEW grant
  // reads the chat even when it is private.
  //
  // The chat's owner and its members at MANAGE may grant, as a person
  // (PERMISSION_DENIED for any other credential, or for a member below
  // MANAGE); anyone who cannot read the chat is NOT_FOUND. The grantee must be
  // a live member of the chat's organization and not its owner, and a chat
  // with no organization has no members (FAILED_PRECONDITION). A chat holds at
  // most 25 members (FAILED_PRECONDITION). The deployment must enable chat
  // collaboration (chat_collaboration.enabled; FAILED_PRECONDITION
  // otherwise). Each change records one share event; granting the level
  // already held changes nothing (changed = false).
  rpc SetChatMember(SetChatMemberRequest) returns (SetChatMemberResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_member"
        target: {
          kind: "chat"
          id: "chat_id"
        }
        detail: [
          "user_id",
          "role"
        ]
      }
    };
  }

  // RemoveChatMember takes a person's grant on a chat away: the owner or a
  // member at MANAGE may remove anyone but the owner, and any member may
  // remove their own grant. It is never gated by chat_collaboration.enabled,
  // so a grant can always be taken back. It records one share event;
  // removing a person who holds no grant changes nothing (changed = false).
  rpc RemoveChatMember(RemoveChatMemberRequest) returns (RemoveChatMemberResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "remove_member"
        target: {
          kind: "chat"
          id: "chat_id"
        }
        detail: ["user_id"]
      }
    };
  }

  // forge:custom — decides the caller's level on the chat once and shapes the list for it
  //
  // ListChatMembers lists who holds access to a chat, as the caller may see
  // it (chat-collaboration.md §2.2): the owner and members at MANAGE see every
  // member and level; members at REPLY see the owner and the REPLY and MANAGE
  // members; VIEW grantees and org-wide viewers see the owner and a count.
  // Anyone who cannot read the chat is NOT_FOUND. Ids only: names come from
  // the organization's roster.
  rpc ListChatMembers(ListChatMembersRequest) returns (ListChatMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (forge.v1.method) = {
      activity: {none: "reads only: who may access a chat"}
    };
  }
}

// ChatMemberRole is the level a person holds on a chat. Levels nest: each
// includes everything below it. The owner is never a member.
enum ChatMemberRole {
  // A server that predates chat collaboration, or no grant.
  CHAT_MEMBER_ROLE_UNSPECIFIED = 0;
  // Read the chat, as an org-wide viewer of a shared chat does.
  CHAT_MEMBER_ROLE_VIEW = 1;
  // View, plus send messages and answer what the chat asks.
  CHAT_MEMBER_ROLE_REPLY = 2;
  // Reply, plus steer the run, change its settings and its members.
  CHAT_MEMBER_ROLE_MANAGE = 3;
}

// ChatMember is one person's grant on a chat.
message ChatMember {
  string user_id = 1;
  ChatMemberRole role = 2;
  // Who set the level they hold now.
  string granted_by = 3;
  // When they first became a member.
  google.protobuf.Timestamp created_at = 4;
}

message SetChatMemberRequest {
  string chat_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.min_len = 1];
  // VIEW, REPLY or MANAGE.
  ChatMemberRole role = 3 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3
    ]
  }];
}

message SetChatMemberResponse {
  // The grant as it now stands.
  ChatMember member = 1;
  // False when the person already held the level asked for.
  bool changed = 2;
}

message RemoveChatMemberRequest {
  string chat_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveChatMemberResponse {
  // False when the person held no grant.
  bool changed = 1;
}

message ListChatMembersRequest {
  string chat_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListChatMembersResponse {
  string owner_user_id = 1;
  // The members the caller may see (see ListChatMembers), oldest first.
  repeated ChatMember members = 2;
  // How many members the chat has, including those not listed.
  int32 member_count = 3;
  // The level the caller reads the chat at: VIEW for a viewer (a VIEW grant,
  // or any member of the organization a chat is shared with), REPLY or
  // MANAGE for a member holding that grant, UNSPECIFIED for the owner.
  ChatMemberRole caller_role = 4;
  // Whether this deployment lets anyone grant access to a chat
  // (ApiServerConfig chat_collaboration.enabled), so a client offers
  // SetChatMember only when it would be accepted. False from a server that
  // predates it, which is the same answer: granting is off.
  bool grants_enabled = 5;
}

message SetChatVisibilityRequest {
  string chat_id = 1 [(buf.validate.field).string.min_len = 1];
  // ORG or PRIVATE.
  ResourceVisibility visibility = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message SetChatVisibilityResponse {
  // The chat as the caller now reads it.
  Chat chat = 1;
  // False when the chat already had the visibility asked for.
  bool changed = 2;
}

message SetProjectVisibilityRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  // ORG or PRIVATE.
  ResourceVisibility visibility = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message SetProjectVisibilityResponse {
  // The project as the caller now reads it.
  Project project = 1;
  // False when the project already had the visibility asked for.
  bool changed = 2;
}

message ListSharedChatsRequest {
  // The organization whose shared chats to list: one the caller is a live
  // member of (PERMISSION_DENIED otherwise). Unset: the caller's default
  // organization.
  optional string org_id = 1;
  // Narrow the list to one project's shared chats.
  optional string project_id = 2;
  // At most this many (default and cap 100).
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  // Narrow the list to chats tagged with this app (Chat.app_name): the
  // shared half of an app's chat list. A malformed name lists nothing; an
  // empty one is the same as unset.
  optional string app_name = 5;
  // Narrow the list to several projects' shared chats: the union of
  // project_id and project_ids, so a client may set either or both. With
  // project_ids empty, project_id behaves exactly as before this field
  // existed: unset lists every project, and set to "" lists nothing. With
  // project_ids set, a project_id of "" adds nothing: the list is just
  // project_ids. A project with nothing shared with the org contributes
  // nothing. At most 200 ids, none of them empty (INVALID_ARGUMENT
  // otherwise).
  repeated string project_ids = 6 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {min_len: 1}
    }
  }];
}

message ListSharedChatsResponse {
  repeated Chat chats = 1;
}

message ListSharedProjectsRequest {
  // The organization whose shared projects to list: one the caller is a live
  // member of (PERMISSION_DENIED otherwise). Unset: the caller's default
  // organization.
  optional string org_id = 1;
  // At most this many (default and cap 100).
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListSharedProjectsResponse {
  repeated Project projects = 1;
}
