syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";
import "reliant/v1/chat.proto";
import "reliant/v1/common.proto";
import "reliant/v1/project.proto";
import "reliant/v1/workflow.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// SharingService is read-only sharing (control-plane
// docs/design/org-sharing.md): an owner shares a chat, project or saved
// workflow with the live members of its organization, who can then read it,
// never change it.
//
// Sharing is reachable only through this service and the Chat/Project
// visibility and viewer_access fields: no existing list (ListChats,
// ListProjects, SearchChats, ...) ever includes another person's shared chat,
// so a client that predates sharing never shows one as the caller's own.
// Every read of a shared item, and every change of who may read it, is a
// person's (a session in the app): an agent's CLI login is refused, so no
// agent reads a teammate's transcript into its context. It is not part of the
// public SDK (proto/public-api.txt).
service SharingService {
  // SetChatVisibility shares a chat with its organization (ORG) or makes it
  // private again (PRIVATE).
  //
  // Only the owner may share, as a person, and only a chat that belongs to an
  // org (FAILED_PRECONDITION otherwise). The owner may make it private with any
  // credential that can change the chat. An admin or owner of the chat's org
  // (asked of control-plane fresh, as a person) may make a member's shared
  // chat private, never share it (PERMISSION_DENIED). Anyone who cannot read
  // it is NOT_FOUND. Each change records one share event; setting what is
  // already set changes nothing (changed = false).
  rpc SetChatVisibility(SetChatVisibilityRequest) returns (SetChatVisibilityResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "chat"
          id: "chat_id"
          label: "response.chat.title"
        }
        detail: ["visibility"]
      }
    };
  }

  // SetProjectVisibility is SetChatVisibility for a project. Sharing a
  // project shares its card and lets viewers list its shared chats; it never
  // shares a chat that is not shared itself.
  rpc SetProjectVisibility(SetProjectVisibilityRequest) returns (SetProjectVisibilityResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "project"
          id: "project_id"
          label: "response.project.name"
        }
        detail: ["visibility"]
      }
    };
  }

  // ListSharedChats lists the chats other members shared with an
  // organization the caller is a live member of, most recently active first:
  // the "Shared with the org" list. Never the caller's own. Each carries
  // viewer_access, and leaves out what is the owner's alone (see
  // Chat.viewer_access).
  rpc ListSharedChats(ListSharedChatsRequest) returns (ListSharedChatsResponse) {
    option (forge.v1.method) = {
      activity: {none: "reads only: lists what others shared"}
    };
  }

  // ListSharedProjects lists the projects other members shared with an
  // organization the caller is a live member of, most recently active first,
  // each with viewer_access set and without path.
  rpc ListSharedProjects(ListSharedProjectsRequest) returns (ListSharedProjectsResponse) {
    option (forge.v1.method) = {
      activity: {none: "reads only: lists what others shared"}
    };
  }

  // SetWorkflowDraftSharing shares a saved workflow (a workflow draft, in
  // the caller's workflow library) with its organization (ORG) or makes it
  // private again (PRIVATE), so a live member can publish one for the team to
  // read and fork (control-plane docs/design/org-sharing.md §8.5). The rules
  // are SetChatVisibility's: only the owner shares, as a person, and only a
  // saved workflow that belongs to an org; an admin or owner of its org may
  // make a member's shared one private, never share it; anyone who cannot
  // read it is NOT_FOUND.
  //
  // Sharing a saved workflow shares its definition, read-only. It never lets
  // a viewer run it as its owner, change it, or see the owner's runs of it.
  // Not WorkflowService.SetWorkflowVisibility, which hides a workflow from
  // its owner's own pickers and shares nothing.
  rpc SetWorkflowDraftSharing(SetWorkflowDraftSharingRequest) returns (SetWorkflowDraftSharingResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "set_visibility"
        target: {
          kind: "workflow"
          id: "response.workflow.slug"
          label: "response.workflow.name"
        }
        detail: [
          "workflow_id",
          "visibility"
        ]
      }
    };
  }

  // ListSharedWorkflowDrafts lists the saved workflows other members shared
  // with an organization the caller is a live member of, most recently
  // shared first: the team's shared workflow library. Never the caller's own
  // (those are in WorkflowService.ListWorkflows), and never one its owner
  // hid. Each carries its definition, to read and fork.
  // forge:custom — SharedWorkflowDraft is a read of workflow_drafts shaped for viewers, not a table
  rpc ListSharedWorkflowDrafts(ListSharedWorkflowDraftsRequest) returns (ListSharedWorkflowDraftsResponse) {
    option (forge.v1.method) = {
      activity: {none: "reads only: lists what others shared"}
    };
  }
}

message SetChatVisibilityRequest {
  string chat_id = 1 [(buf.validate.field).string.min_len = 1];
  // ORG or PRIVATE.
  ResourceVisibility visibility = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message SetChatVisibilityResponse {
  // The chat as the caller now reads it.
  Chat chat = 1;
  // False when the chat already had the visibility asked for.
  bool changed = 2;
}

message SetProjectVisibilityRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  // ORG or PRIVATE.
  ResourceVisibility visibility = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message SetProjectVisibilityResponse {
  // The project as the caller now reads it.
  Project project = 1;
  // False when the project already had the visibility asked for.
  bool changed = 2;
}

message ListSharedChatsRequest {
  // The organization whose shared chats to list: one the caller is a live
  // member of (PERMISSION_DENIED otherwise). Unset: the caller's default
  // organization.
  optional string org_id = 1;
  // Narrow the list to one project's shared chats.
  optional string project_id = 2;
  // At most this many (default and cap 100).
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  // Narrow the list to chats tagged with this app (Chat.app_name): the
  // shared half of an app's chat list. A malformed name lists nothing; an
  // empty one is the same as unset.
  optional string app_name = 5;
  // Narrow the list to several projects' shared chats: the union of
  // project_id and project_ids, so a client may set either or both. With
  // project_ids empty, project_id behaves exactly as before this field
  // existed: unset lists every project, and set to "" lists nothing. With
  // project_ids set, a project_id of "" adds nothing: the list is just
  // project_ids. A project with nothing shared with the org contributes
  // nothing. At most 200 ids, none of them empty (INVALID_ARGUMENT
  // otherwise).
  repeated string project_ids = 6 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {min_len: 1}
    }
  }];
}

message ListSharedChatsResponse {
  repeated Chat chats = 1;
}

message ListSharedProjectsRequest {
  // The organization whose shared projects to list: one the caller is a live
  // member of (PERMISSION_DENIED otherwise). Unset: the caller's default
  // organization.
  optional string org_id = 1;
  // At most this many (default and cap 100).
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListSharedProjectsResponse {
  repeated Project projects = 1;
}

// SharedWorkflowDraft is a saved workflow as sharing answers it: what a
// teammate needs to read and fork it, and nothing of the owner's beyond it
// (no source path on the owner's machine, no origin, no OCC version).
message SharedWorkflowDraft {
  // The saved workflow's id (WorkflowListItem.draft_id for its owner).
  string id = 1;
  // The runtime reference name, unique per owner, not per org.
  string slug = 2;
  // Display name.
  string name = 3;
  optional string description = 4;
  // The owner: the member who saved and shared it.
  string user_id = 5;
  // The organization it belongs to and is shared with.
  string org_id = 6;
  // DRAFT (work in progress, may be invalid) or COMPLETE (runnable).
  WorkflowDraftStatus status = 7;
  // ORG while shared; PRIVATE after it was made private (in a
  // SetWorkflowDraftSharing answer to its owner).
  ResourceVisibility visibility = 8;
  // True when the caller reads it as a VIEWER (a member of its org, not its
  // owner): read-only, to read and fork.
  bool viewer_access = 9;
  // When it was shared (RFC 3339); unset while private.
  optional string shared_at = 10;
  // When its definition last changed (RFC 3339).
  string updated_at = 11;
  // The stored YAML definition, as its owner saved it. A teammate forks it by
  // saving a copy of their own (WorkflowService.ImportWorkflow).
  string definition = 12;
}

message SetWorkflowDraftSharingRequest {
  // The saved workflow's id (WorkflowListItem.draft_id).
  string workflow_id = 1 [(buf.validate.field).string.min_len = 1];
  // ORG or PRIVATE.
  ResourceVisibility visibility = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message SetWorkflowDraftSharingResponse {
  // The saved workflow as the caller now reads it: unset when they read it no
  // longer (an admin who made it private).
  SharedWorkflowDraft workflow = 1;
  // False when it already had the visibility asked for.
  bool changed = 2;
}

message ListSharedWorkflowDraftsRequest {
  // The organization whose shared workflows to list: one the caller is a
  // live member of (PERMISSION_DENIED otherwise). Unset: the caller's default
  // organization.
  optional string org_id = 1;
  // At most this many (default and cap 100).
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListSharedWorkflowDraftsResponse {
  repeated SharedWorkflowDraft workflows = 1;
}
