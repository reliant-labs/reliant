syntax = "proto3";

package reliant.v1;

import "buf/validate/validate.proto";
import "forge/v1/forge.proto";

option go_package = "github.com/reliant-labs/reliant/gen/reliant/v1;reliantv1";

// ApprovalType is the kind of approval request.
enum ApprovalType {
  // 1 was APPROVAL_TYPE_TOOL: the integration action approval prompt, removed.
  // Rows recorded with it can still exist and still carry 1.
  reserved 1;
  reserved "APPROVAL_TYPE_TOOL";
  APPROVAL_TYPE_UNSPECIFIED = 0;
  // A workflow approval node is waiting on it.
  APPROVAL_TYPE_WORKFLOW_STEP = 2;
  // One of the run's own tool calls is waiting on it: an activation change
  // (create/update/enable_trigger) or a machine start. The run answers that
  // call itself, approved or not, so a denial writes no denial message.
  APPROVAL_TYPE_TOOL_CALL = 3;
}

// ApprovalStatus tracks the lifecycle of an approval request
enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_DENIED = 3;
}

// ApprovalService handles workflow approval operations.
service ApprovalService {
  // ListApprovalsByChat lists all pending approvals for a chat
  rpc ListApprovalsByChat(ListApprovalsByChatRequest) returns (ListApprovalsByChatResponse) {}
  
  // Approve approves a pending approval request (signals workflow to continue).
  rpc Approve(ApproveRequest) returns (ApproveResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "approve"
        target: {
          kind: "approval"
          id: "request_id"
        }
        detail: ["action_taken"]
      }
    };
  }
  
  // Deny denies a pending approval request (cancels workflow)
  rpc Deny(DenyRequest) returns (DenyResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "deny"
        target: {
          kind: "approval"
          id: "request_id"
        }
        detail: ["action_taken"]
      }
    };
  }
  
  // BatchApprove approves several approvals of one chat at once: every
  // listed approval that is still pending. One already decided (on another
  // surface) is skipped and not counted; FAILED_PRECONDITION only when none
  // of them was pending.
  rpc BatchApprove(BatchApproveRequest) returns (BatchApproveResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "batch_approve"
        target: {
          kind: "chat"
          id: "response.chat_id"
        }
        detail: [
          "response.approved",
          "action_taken"
        ]
      }
    };
  }
  
  // BatchDeny denies several approvals of one chat at once, with
  // BatchApprove's rules for approvals already decided.
  rpc BatchDeny(BatchDenyRequest) returns (BatchDenyResponse) {
    option (forge.v1.method) = {
      activity: {
        verb: "batch_deny"
        target: {
          kind: "chat"
          id: "response.chat_id"
        }
        detail: [
          "response.denied",
          "action_taken"
        ]
      }
    };
  }
}

// Approval represents a workflow approval request.
message Approval {
  string id = 1;
  string chat_id = 2;
  ApprovalType approval_type = 3;
  string entity_id = 4;      // content_block_id for tools, event_id for workflows
  ApprovalStatus status = 5;
  string title = 6;
  optional string description = 7;
  optional string denial_reason = 8;
  string created_at = 11;
  optional string resolved_at = 12;

  // Structured fields (replacing JSON in metadata).
  optional string message_id = 15;
  optional string workflow_id = 16;
  optional string run_id = 17;
  optional string action_taken = 19;  // Which action button was clicked (e.g., "Deploy Now")

  // Set when the run raised this approval together with others in one step
  // (one turn's tool calls): every approval of the batch carries the same id,
  // so they can be offered, and decided, together. Each stays its own row and
  // can still be decided on its own.
  optional string batch_id = 23;

  // Tool approvals (the removed APPROVAL_TYPE_TOOL) asked about one call to an
  // integration action, and described it with these.
  reserved 13, 14, 20, 21, 22;
  reserved "tool_name", "tool_call_id", "tool_input", "integration_name", "integration_icon";
}

// ListApprovalsByChatRequest lists pending approvals for a chat
message ListApprovalsByChatRequest {
  string chat_id = 1 [(buf.validate.field).required = true];
}

// ListApprovalsByChatResponse returns the list of approvals
message ListApprovalsByChatResponse {
  repeated Approval approvals = 1;
  int32 total = 2;
}

// ApproveRequest approves a single approval
message ApproveRequest {
  string request_id = 1;
  optional string action_taken = 2;  // Which action button was clicked (e.g., "Deploy Now")
}

// ApproveResponse confirms the approval
message ApproveResponse {
  bool success = 1;
  string message = 2;
}

// DenyRequest denies a single approval
message DenyRequest {
  string request_id = 1;
  optional string denial_reason = 2;
  optional string action_taken = 3;  // Which action button was clicked (e.g., "Cancel")
}

// DenyResponse confirms the denial
message DenyResponse {
  bool success = 1;
  string message = 2;
}

// BatchApproveRequest approves multiple approvals at once
message BatchApproveRequest {
  repeated string request_ids = 1;
  optional string action_taken = 2;  // Which action button was clicked
}

// BatchApproveResponse confirms the batch approval
message BatchApproveResponse {
  bool success = 1;
  int32 approved = 2;
  string message = 3;
  // The chat every approval in the batch belongs to (the handler refuses a
  // batch that spans chats). It is the target of the batch's activity event.
  string chat_id = 4;
}

// BatchDenyRequest denies multiple approvals at once
message BatchDenyRequest {
  repeated string request_ids = 1;
  optional string denial_reason = 2;
  optional string action_taken = 3;  // Which action button was clicked
}

// BatchDenyResponse confirms the batch denial
message BatchDenyResponse {
  bool success = 1;
  int32 denied = 2;
  string message = 3;
  // The chat every approval in the batch belongs to, as in
  // BatchApproveResponse.chat_id.
  string chat_id = 4;
}