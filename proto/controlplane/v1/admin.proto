syntax = "proto3";

package controlplane.v1;

option go_package = "github.com/reliant-labs/reliant/gen/controlplane/v1;controlplanev1";

import "google/protobuf/timestamp.proto";

// Minimal control-plane admin subset used by Reliant app-side authenticated key sync.

enum LLMKeyStatus {
  LLM_KEY_STATUS_UNSPECIFIED = 0;
  LLM_KEY_STATUS_ACTIVE = 1;
  LLM_KEY_STATUS_REVOKED = 2;
  LLM_KEY_STATUS_EXPIRED = 3;
}

message User {
  string id = 1;
  string external_id = 2;
  string email = 3;
  string name = 4;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message LLMKey {
  string id = 1;
  string org_id = 2;
  string name = 3;
  repeated string models = 4;
  LLMKeyStatus status = 7;
}

message ReliantEntitlement {
  string user_id = 1;
  string status = 2;
  string plan_id = 3;
  string plan_name = 4;
  bool reliant_enabled = 5;
  repeated string allowed_models = 6;
  int64 monthly_spend_cap_cents = 7;
  int32 requests_per_minute = 8;
  int32 max_concurrent_requests = 9;
  bool hard_cap = 10;
  bool overage_allowed = 11;
  google.protobuf.Timestamp current_period_start = 12;
  google.protobuf.Timestamp current_period_end = 13;
  string source_type = 14;
  string source_ref_id = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message ManagedReliantAccess {
  string id = 1;
  string user_id = 2;
  string status = 3;
  string active_llm_key_id = 4;
  int32 credential_version = 5;
  optional int32 entitlement_snapshot_version = 6;
  google.protobuf.Timestamp last_rotated_at = 7;
  google.protobuf.Timestamp last_provisioned_at = 8;
  string last_error = 9;
  string internal_org_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

service UserService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {}
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
  repeated Organization organizations = 2;
}

service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse) {}
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {}
}

message CreateOrgRequest {
  string name = 1;
  string slug = 2;
}

message CreateOrgResponse {
  Organization org = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  repeated Organization orgs = 1;
}

service BillingService {
  rpc GetCurrentUserReliantState(GetCurrentUserReliantStateRequest) returns (GetCurrentUserReliantStateResponse) {}
  rpc RepairCurrentUserReliantAccess(RepairCurrentUserReliantAccessRequest) returns (RepairCurrentUserReliantAccessResponse) {}
  rpc RotateCurrentUserReliantAccess(RotateCurrentUserReliantAccessRequest) returns (RotateCurrentUserReliantAccessResponse) {}
  rpc CheckManagedReliantAffordability(CheckManagedReliantAffordabilityRequest) returns (CheckManagedReliantAffordabilityResponse) {}
  rpc ReserveManagedReliantUsage(ReserveManagedReliantUsageRequest) returns (ReserveManagedReliantUsageResponse) {}
  rpc FinalizeManagedReliantUsage(FinalizeManagedReliantUsageRequest) returns (FinalizeManagedReliantUsageResponse) {}
  rpc ReleaseManagedReliantUsageReservation(ReleaseManagedReliantUsageReservationRequest) returns (ReleaseManagedReliantUsageReservationResponse) {}
  rpc IssueMyReliantAPIKey(IssueMyReliantAPIKeyRequest) returns (IssueMyReliantAPIKeyResponse) {}
}

message IssueMyReliantAPIKeyRequest {}

message IssueMyReliantAPIKeyResponse {
  // plaintext_key is the rlnt_-prefixed API key the caller should use against
  // the Reliant proxy. Idempotent: returns the existing active key if present.
  string plaintext_key = 1;
}

message GetCurrentUserReliantStateRequest {}

message GetCurrentUserReliantStateResponse {
  ReliantEntitlement entitlement = 1;
  ManagedReliantAccess managed_access = 2;
}

message RepairCurrentUserReliantAccessRequest {}

message RepairCurrentUserReliantAccessResponse {
  ReliantEntitlement entitlement = 1;
  ManagedReliantAccess managed_access = 2;
  bool repaired = 3;
}

message RotateCurrentUserReliantAccessRequest {
  optional string grace_period = 1;
}

message RotateCurrentUserReliantAccessResponse {
  ReliantEntitlement entitlement = 1;
  ManagedReliantAccess managed_access = 2;
  bool rotated = 3;
  bool replaced = 4;
  string plaintext_key = 5;
}

message CheckManagedReliantAffordabilityRequest {
  string managed_key = 1;
  double estimated_spend_usd = 2;
  string model = 3;
  string canonical_model_id = 4;
  int64 estimated_input_tokens = 5;
  int64 estimated_output_tokens = 6;
}

message CheckManagedReliantAffordabilityResponse {
  int64 wallet_balance_usd_nanos = 1;
  int64 required_spend_usd_nanos = 2;
}

message ReserveManagedReliantUsageRequest {
  string managed_key = 1;
  string reservation_id = 2;
  double estimated_spend_usd = 3;
  string model = 4;
  string canonical_model_id = 5;
  int64 estimated_input_tokens = 6;
  int64 estimated_output_tokens = 7;
}

message ReserveManagedReliantUsageResponse {
  int64 reserved_spend_usd_nanos = 1;
  int64 wallet_balance_after_reservation_usd_nanos = 2;
}

message FinalizeManagedReliantUsageRequest {
  string managed_key = 1;
  string reservation_id = 2;
  double spend_usd = 3;
  string model = 4;
  string canonical_model_id = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  int64 cached_input_tokens = 8;
  optional double observed_cost_usd = 9;
}

message FinalizeManagedReliantUsageResponse {
  double total_spend_usd = 1;
}

message ReleaseManagedReliantUsageReservationRequest {
  string managed_key = 1;
  string reservation_id = 2;
}

message ReleaseManagedReliantUsageReservationResponse {}

service LLMGatewayService {
  rpc CreateLLMKey(CreateLLMKeyRequest) returns (CreateLLMKeyResponse) {}
  rpc ListLLMKeys(ListLLMKeysRequest) returns (ListLLMKeysResponse) {}
  rpc RotateLLMKey(RotateLLMKeyRequest) returns (RotateLLMKeyResponse) {}
}

message CreateLLMKeyRequest {
  string org_id = 1;
  string name = 2;
  repeated string models = 3;
  optional double max_budget = 4;
  string budget_duration = 5;
}

message CreateLLMKeyResponse {
  LLMKey key = 1;
  string plaintext_key = 2;
}

message ListLLMKeysRequest {
  string org_id = 1;
}

message ListLLMKeysResponse {
  repeated LLMKey keys = 1;
}

message RotateLLMKeyRequest {
  string key_id = 1;
  string grace_period = 2;
}

message RotateLLMKeyResponse {
  LLMKey key = 1;
  string plaintext_key = 2;
}