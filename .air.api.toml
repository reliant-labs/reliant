# Air config for the reliant api server under `forge up --env=dev` (the
# control-plane repo's dev KCL declares reliant-api-server as a host service
# with runner="air" pointing here). Modeled on control-plane's
# .air.admin-server.toml rather than the legacy .air.toml:
#   - per-service tmp dir so api / worker / electron's dist build never
#     trample each other's binary
#   - stop_on_error=false + atomic build (go build -o .tmp && mv): a FAILED
#     build never touches the running process — Air only swaps on success,
#     so mid-edit broken trees don't take the api server down
#   - no buf-generate pre_cmd: codegen on every save is slow and surprising;
#     run `buf generate` explicitly when protos change
# Env (PORT, DATABASE_URL, …) comes from forge's host phase, not from here.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/air-api"

[build]
  bin = "./tmp/air-api/reliant"
  args_bin = ["server", "api"]
  cmd = "CGO_ENABLED=0 go build -buildvcs=false -o ./tmp/air-api/reliant.tmp ./cmd/reliant && mv ./tmp/air-api/reliant.tmp ./tmp/air-api/reliant"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "mobile", "dist", ".claude_plan", "test", "electron", "node_modules", "e2e", ".reliant", "examples", "data", ".git", "scripts", "docs"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  include_ext = ["go", "yaml"]
  include_file = []
  kill_delay = "5s"
  log = "tmp/air-api/build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
