name: placeholder_guard_blocks_success
description: |
  Placeholder guard finds unfinished implementation markers and blocks the workflow
  before final integration verification can report success.

events:
  - node: scope_loop.call_scope
    output:
      message: {role: assistant, text: "Plan ready."}
      response_text: "Plan ready."
      tool_calls:
        - id: "tc-plan"
          name: "project_plan"
          input: '{"project_name":"guard-app"}'

  - node: scope_loop.execute_scope
    output:
      tool_results: []
      response_data:
        project_plan:
          project_name: "guard-app"
          go_module: "github.com/test/guard-app"
          services: [{name: "api", description: "API", rpcs: ["Get"]}]
          packages: [{name: "store", description: "Storage", interface_methods: ["Get"]}]
          frontends: [{name: "web", pages: ["home"]}]
          features: [{name: "f1", description: "Feature", touches_services: ["api"], touches_packages: ["store"]}]
          entities: []

  - node: scaffold_project
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_services
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_packages
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_frontends
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: architect
    output: {response_text: "Contracts done."}
  - node: generate_code
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: validate_contracts
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: baseline_build
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: implement_features
    output:
      _iterations: 1
      _completed: 1
      _failed: 0
  - node: placeholder_guard
    output: {exit_code: 1, stdout: "", stderr: "handlers/api/handlers.go:12: TODO: Implement business logic"}

expect:
  outcome: failed
  reached:
    - scope_loop
    - plan_summary
    - add_packages
    - baseline_build
    - implement_features
    - impl_report
    - placeholder_guard
  not_reached:
    - integration_verify_initial
    - integration_fix_loop
    - success