name: planner_reminded_then_submits
description: |
  Planner responds without tool calls on first turn, gets reminded,
  then submits the plan on second turn. Tests the remind_scope path on the updated workflow.

events:
  - node: scope_loop.call_scope
    output:
      message: {role: assistant, text: "Let me think about this..."}
      response_text: "Let me think about this..."
      tool_calls: []

  - node: scope_loop.call_scope
    output:
      message: {role: assistant, text: "Here's the plan."}
      response_text: "Here's the plan."
      tool_calls:
        - id: "tc-plan"
          name: "project_plan"
          input: '{"project_name":"reminded-app"}'

  - node: scope_loop.execute_scope
    output:
      tool_results: []
      response_data:
        project_plan:
          project_name: "reminded-app"
          go_module: "github.com/test/reminded-app"
          services: [{name: "api", description: "API", rpcs: ["Get"]}]
          packages: [{name: "store", description: "Storage", interface_methods: ["Get"]}]
          frontends: [{name: "web", pages: ["home"]}]
          features: [{name: "f1", description: "Feature", touches_services: ["api"], touches_packages: ["store"]}]
          entities: []

  - node: scaffold_project
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_services
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_packages
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_frontends
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: architect
    output: {response_text: "Done."}
  - node: generate_code
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: validate_contracts
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: baseline_build
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: implement_features
    output:
      _iterations: 1
      _completed: 1
      _failed: 0
  - node: placeholder_guard
    output: {exit_code: 0, stdout: "", stderr: ""}
  - node: integration_verify_initial
    output: {exit_code: 0, stdout: "ok", stderr: ""}

expect:
  outcome: completed
  reached:
    - scope_loop
    - scope_loop.call_scope
    - scope_loop.remind_scope
    - scope_loop.execute_scope
    - plan_summary
    - add_packages
    - baseline_build
    - integration_verify_initial
    - success
  not_reached:
    - integration_fix_loop
    - integration_failed