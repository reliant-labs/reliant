name: multiple_features_parallel
description: |
  Plan has 3 features that are attempted in parallel. Tests that the workflow
  still records the parallel work while validating the core slice through later checks.

events:
  - node: scope_loop.call_scope
    output:
      message: {role: assistant, text: "Plan with 3 features."}
      response_text: "Plan with 3 features."
      tool_calls:
        - id: "tc-plan"
          name: "project_plan"
          input: '{"project_name":"multi-app"}'

  - node: scope_loop.execute_scope
    output:
      tool_results: []
      response_data:
        project_plan:
          project_name: "multi-app"
          go_module: "github.com/test/multi-app"
          services:
            - name: "users"
              description: "User management"
              rpcs: ["CreateUser", "GetUser"]
            - name: "billing"
              description: "Billing"
              rpcs: ["CreateCharge"]
          packages:
            - name: "user_store"
              description: "User persistence"
              interface_methods: ["CreateUser", "GetUser"]
          frontends:
            - name: "web"
              pages: ["dashboard", "users", "billing"]
          features:
            - name: "user-crud"
              description: "Core user CRUD slice"
              touches_services: ["users"]
              touches_packages: ["user_store"]
            - name: "billing-flow"
              description: "Billing flow"
              touches_services: ["billing"]
              touches_packages: []
            - name: "dashboard"
              description: "Dashboard page"
              touches_services: ["users", "billing"]
              touches_packages: []
          entities:
            - name: "User"
              fields: ["id", "email"]
              relationships: []

  - node: scaffold_project
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_services
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_packages
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: add_frontends
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: architect
    output: {response_text: "Contracts done."}
  - node: generate_code
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: validate_contracts
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: baseline_build
    output: {exit_code: 0, stdout: "ok", stderr: ""}
  - node: implement_features
    output:
      _iterations: 3
      _completed: 3
      _failed: 0

  - node: placeholder_guard
    output: {exit_code: 0, stdout: "", stderr: ""}
  - node: integration_verify_initial
    output: {exit_code: 0, stdout: "ok", stderr: ""}

expect:
  outcome: completed
  reached:
    - scope_loop
    - plan_summary
    - add_packages
    - baseline_build
    - implement_features
    - impl_report
    - placeholder_guard
    - integration_verify_initial
    - success
  not_reached:
    - integration_failed
    - integration_fix_loop

  node_outputs:
    implement_features:
      _iterations: 3