# Test scenarios for spec-driven.yaml workflow
#
# Spec-driven workflow structure:
#   Linear chain: specify → plan → implement → complete
#
#   specify   (type: workflow, ref: builtin://agent) — Define WHAT and WHY (requirements)
#   plan      (type: workflow, ref: builtin://agent) — Define HOW (technical approach)
#   implement (type: workflow, ref: builtin://agent) — Execute the plan
#   complete  (type: save_message)                   — Final summary
#
# All workflow nodes are BLACK BOXES (ref-based). The simulator calls the mocker
# with the node ID and uses the returned output directly.
#
# Each workflow node has a save_message that references {{output.response_text}},
# so mock outputs must include response_text.
#
# Inputs:
#   model (model): default tags: [flagship]
#   mode  (enum):  manual | auto | plan, default auto
#   yield (boolean): default true — pause for user review after each phase

---
name: happy_path
description: >
  All 4 phases complete successfully with default inputs.
  specify → plan → implement → complete in linear order.

events:
  # Phase 1: Specify Requirements
  - node: specify
    output:
      response_text: |
        ## Goal
        Build a user authentication system.

        ## Requirements
        1. Users can register with email and password
        2. Users can log in and receive a JWT token
        3. Passwords are hashed with bcrypt

        ## Constraints
        - Must support PostgreSQL and SQLite
        - Token expiry: 24 hours

        ## Out of Scope
        - OAuth/social login
        - Multi-factor authentication

  # Phase 2: Plan Technical Approach
  - node: plan
    output:
      response_text: |
        ## Approach
        Implement auth as a middleware layer with repository pattern.

        ## Architecture
        - JWT-based stateless authentication
        - bcrypt password hashing
        - Repository interface for DB abstraction

        ## Task Breakdown
        1. Create user model and migration
        2. Implement auth repository (SQLite + Postgres)
        3. Build auth middleware
        4. Add login/register HTTP handlers

        ## Dependencies
        - Task 1 blocks tasks 2-4
        - Task 2 blocks tasks 3-4

        ## Risks
        - Token refresh strategy needs future consideration

  # Phase 3: Implement
  - node: implement
    output:
      response_text: |
        Implementation complete:
        - Created user model with migration for both SQLite and Postgres
        - Implemented auth repository with password hashing
        - Built JWT middleware with 24h token expiry
        - Added /register and /login endpoints
        - All tests passing

expect:
  outcome: completed
  reached:
    - specify
    - plan
    - implement
    - complete

---
name: yield_between_phases
description: >
  With yield=true (default), each workflow phase passes the yield input through.
  Tests that all nodes are reached in the correct linear order with yield enabled.
  The simulator treats workflow nodes as black boxes regardless of yield —
  yield behavior is handled by the sub-workflow runtime, not the parent graph.

inputs:
  yield: true

events:
  # Phase 1: Specify Requirements (yields after completion in real execution)
  - node: specify
    output:
      response_text: |
        ## Goal
        Add CSV export to the reporting dashboard.

        ## Requirements
        1. Export any report as CSV
        2. Support filtered and full data exports
        3. Handle reports up to 100k rows

        ## Constraints
        - Must stream for large exports (no full buffering)

        ## Out of Scope
        - PDF or Excel export formats

  # Phase 2: Plan (yields after completion in real execution)
  - node: plan
    output:
      response_text: |
        ## Approach
        Streaming CSV writer with chunked DB queries.

        ## Architecture
        - Use Go's encoding/csv with io.Pipe for streaming
        - Paginated DB queries (1000 rows per batch)
        - Content-Disposition header for browser download

        ## Task Breakdown
        1. Add CSV streaming utility
        2. Create export HTTP handler
        3. Wire up report query pagination
        4. Add integration tests

        ## Dependencies
        - Task 1 blocks tasks 2-3

        ## Risks
        - Memory pressure on very wide reports

  # Phase 3: Implement (yields after completion in real execution)
  - node: implement
    output:
      response_text: |
        Implementation complete:
        - Built streaming CSV writer with io.Pipe
        - Export handler with Content-Disposition headers
        - Paginated queries with 1000-row batches
        - Integration tests cover up to 50k rows
        - Memory profiling shows constant ~2MB usage

expect:
  outcome: completed
  reached:
    - specify
    - plan
    - implement
    - complete
