# Test scenarios for gsd.yaml workflow
#
# GSD (Get Shit Done) workflow structure:
#   Linear chain: discuss → research → plan → implement
#   Fan-out:      implement → [verify_lint, verify_test, verify_build]  (parallel)
#   Fan-in:       [verify_lint, verify_test, verify_build] → verify_join
#   Tail:         verify_join → verify_report → complete
#
# Node types:
#   discuss, research, plan, implement — type: workflow (ref: builtin://agent, BLACK BOX)
#   verify_lint, verify_test, verify_build — type: run (command execution)
#   verify_join — type: join (automatic fan-in)
#   verify_report, complete — type: save_message (template-rendered messages)
#
# Key behaviors:
#   - discuss has yield: true (always yields for user input)
#   - plan yield is controlled by inputs.yield (default: false)
#   - All workflow nodes use thread.mode: fork (fresh context per phase)
#
# NOTE: Workflow nodes (discuss, research, plan, implement) are BLACK BOXES.
# Mock events provide the workflow's final outputs (message, response_text),
# not internal call_llm events. Run nodes need exit_code/stdout/stderr.
# Join and save_message nodes require no mock events.

---
# Happy path: All phases complete successfully, all verification passes
name: happy_path_all_pass
description: >
  Full GSD flow — discuss, research, plan, implement all complete successfully.
  Lint, test, and build all pass (exit_code 0). Workflow reaches completion.

events:
  # Phase 1: Discuss (workflow — black box)
  - node: discuss
    output:
      message:
        role: assistant
        text: "The request is clear. I'll use the existing service pattern and add the new endpoint."
      response_text: "The request is clear. I'll use the existing service pattern and add the new endpoint."

  # Phase 2: Research (workflow — black box)
  - node: research
    output:
      message:
        role: assistant
        text: |
          Found relevant files:
          - src/services/user.go (existing service pattern)
          - src/routes/api.go (route registration)
          - src/models/user.go (data model)
      response_text: |
        Found relevant files:
        - src/services/user.go (existing service pattern)
        - src/routes/api.go (route registration)
        - src/models/user.go (data model)

  # Phase 3: Plan (workflow — black box)
  - node: plan
    output:
      message:
        role: assistant
        text: |
          Wave 1: Create data model and service interface
          Wave 2: Implement service and register routes
      response_text: |
        Wave 1: Create data model and service interface
        Wave 2: Implement service and register routes

  # Phase 4: Implement (workflow — black box)
  - node: implement
    output:
      message:
        role: assistant
        text: "Implementation complete. Created 3 files, modified 2."
      response_text: "Implementation complete. Created 3 files, modified 2."

  # Phase 5: Verification (run nodes — parallel)
  - node: verify_lint
    output:
      exit_code: 0
      stdout: "No linting errors found."
      stderr: ""

  - node: verify_test
    output:
      exit_code: 0
      stdout: "PASS\nok  	./... 2.341s"
      stderr: ""

  - node: verify_build
    output:
      exit_code: 0
      stdout: "Build succeeded."
      stderr: ""

  # verify_join, verify_report, complete — no mock needed (join + save_message)

expect:
  outcome: completed
  reached:
    - discuss
    - research
    - plan
    - implement
    - verify_lint
    - verify_test
    - verify_build
    - verify_join
    - verify_report
    - complete

---
# Verification failure: lint fails, test and build pass
name: verification_failure
description: >
  All phases (discuss through implement) succeed. During verification,
  lint fails (exit_code 1) while test and build pass. The workflow still
  completes — verify_report renders the failure status.

events:
  # Phases 1-4: All succeed (abbreviated)
  - node: discuss
    output:
      message:
        role: assistant
        text: "Understood, proceeding with default conventions."
      response_text: "Understood, proceeding with default conventions."

  - node: research
    output:
      message:
        role: assistant
        text: "Codebase uses standard Go project layout."
      response_text: "Codebase uses standard Go project layout."

  - node: plan
    output:
      message:
        role: assistant
        text: "Single wave: add handler and test."
      response_text: "Single wave: add handler and test."

  - node: implement
    output:
      message:
        role: assistant
        text: "Done. Added handler and test file."
      response_text: "Done. Added handler and test file."

  # Phase 5: Lint fails, test and build pass
  - node: verify_lint
    output:
      exit_code: 1
      stdout: ""
      stderr: "src/handlers/user.go:15:2: unused variable 'ctx'"

  - node: verify_test
    output:
      exit_code: 0
      stdout: "PASS\nok  	./... 1.823s"
      stderr: ""

  - node: verify_build
    output:
      exit_code: 0
      stdout: "Build succeeded."
      stderr: ""

expect:
  outcome: completed
  reached:
    - discuss
    - research
    - plan
    - implement
    - verify_lint
    - verify_test
    - verify_build
    - verify_join
    - verify_report
    - complete

---
# Yield on discuss: discuss phase yields for user input then completes
name: yield_discuss
description: >
  The discuss node has yield: true, meaning the agent sub-workflow will pause
  for user input. From the simulator's perspective, the discuss node is a black
  box — it eventually completes with a response that captures user preferences.
  This scenario verifies the full flow still completes after discuss yields and
  resumes.

events:
  # Discuss yields internally, then completes with captured preferences
  - node: discuss
    output:
      message:
        role: assistant
        text: |
          After discussion with user:
          - Prefer speed over comprehensive error handling
          - Use existing auth middleware, don't create new one
          - Skip integration tests for now
      response_text: |
        After discussion with user:
        - Prefer speed over comprehensive error handling
        - Use existing auth middleware, don't create new one
        - Skip integration tests for now

  - node: research
    output:
      message:
        role: assistant
        text: "Auth middleware at src/middleware/auth.go. Service layer at src/services/."
      response_text: "Auth middleware at src/middleware/auth.go. Service layer at src/services/."

  - node: plan
    output:
      message:
        role: assistant
        text: |
          Wave 1: Add endpoint handler with auth middleware
          Wave 2: Add unit tests only (skip integration per user preference)
      response_text: |
        Wave 1: Add endpoint handler with auth middleware
        Wave 2: Add unit tests only (skip integration per user preference)

  - node: implement
    output:
      message:
        role: assistant
        text: "Implemented endpoint with auth middleware. Unit tests added."
      response_text: "Implemented endpoint with auth middleware. Unit tests added."

  - node: verify_lint
    output:
      exit_code: 0
      stdout: "No linting errors."
      stderr: ""

  - node: verify_test
    output:
      exit_code: 0
      stdout: "PASS\nok  	./... 0.912s"
      stderr: ""

  - node: verify_build
    output:
      exit_code: 0
      stdout: "Build succeeded."
      stderr: ""

expect:
  outcome: completed
  reached:
    - discuss
    - research
    - plan
    - implement
    - verify_lint
    - verify_test
    - verify_build
    - verify_join
    - verify_report
    - complete
