# Test scenarios for superpowers.yaml workflow
#
# Superpowers (obra methodology) workflow structure:
#   Linear chain: brainstorm → plan → tdd → implement → review → complete
#
#   All agent nodes are BLACK BOX sub-workflows:
#   - brainstorm (type: workflow, ref: builtin://agent) — Socratic questioning
#   - plan      (type: workflow, ref: builtin://agent) — Bite-sized tasks
#   - tdd       (type: workflow, ref: builtin://agent) — Write tests first (RED phase)
#   - implement (type: workflow, ref: builtin://agent) — Make tests pass (GREEN phase)
#   - review    (type: workflow, ref: builtin://structured-agent) — Structured code review
#   - complete  (type: save_message) — Final summary, no mock needed
#
#   Review outputs structured response:
#     { verdict: pass|fail, summary, issues: [{severity, description, file, line}],
#       test_coverage, follows_patterns }
#
# Inputs:
#   model: model tag (default: flagship)
#   mode:  manual | auto | plan (default: auto)
#   yield: boolean (default: true) — pause for user review after each phase
#
# Edges:
#   brainstorm → plan → tdd → implement → review → complete

---
# Happy path: all phases complete, review passes
name: happy_path_review_pass
description: >
  All six phases complete successfully. Review returns verdict: pass.
  The simplest successful path through the entire obra methodology.

inputs:
  mode: auto
  yield: false

events:
  # Phase 1: Brainstorm — Socratic questioning
  - node: brainstorm
    output:
      message:
        role: assistant
        text: |
          ## Problem Statement
          We need to add a retry mechanism with exponential backoff to the HTTP client.

          ## Key Questions & Answers
          1. What errors should trigger retries? → 5xx and network timeouts only
          2. What's the max retry count? → 3 retries with exponential backoff
          3. Should retries be configurable? → Yes, per-request override

          ## Constraints
          - Must not retry on 4xx errors
          - Max total wait time: 30 seconds

          ## Edge Cases
          - Connection reset mid-response
          - Server returns 503 with Retry-After header

          ## Success Criteria
          - All transient errors retried up to 3 times
          - Exponential backoff with jitter
          - Configurable per-request
      response_text: |
        ## Problem Statement
        We need to add a retry mechanism with exponential backoff to the HTTP client.

        ## Key Questions & Answers
        1. What errors should trigger retries? → 5xx and network timeouts only
        2. What's the max retry count? → 3 retries with exponential backoff
        3. Should retries be configurable? → Yes, per-request override

        ## Constraints
        - Must not retry on 4xx errors
        - Max total wait time: 30 seconds

        ## Edge Cases
        - Connection reset mid-response
        - Server returns 503 with Retry-After header

        ## Success Criteria
        - All transient errors retried up to 3 times
        - Exponential backoff with jitter
        - Configurable per-request

  # Phase 2: Plan — Bite-sized tasks with file paths
  - node: plan
    output:
      message:
        role: assistant
        text: |
          ## Approach
          Add a RetryTransport that wraps http.RoundTripper with configurable retry logic.

          ## Tasks
          1. Create retry config struct — pkg/httpclient/retry.go
             Tests: pkg/httpclient/retry_test.go
          2. Implement RetryTransport — pkg/httpclient/transport.go
             Tests: pkg/httpclient/transport_test.go
          3. Add per-request override via context — pkg/httpclient/context.go
             Tests: pkg/httpclient/context_test.go

          ## Test Strategy
          Unit tests for retry logic, integration tests with httptest server.
      response_text: |
        ## Approach
        Add a RetryTransport that wraps http.RoundTripper with configurable retry logic.

        ## Tasks
        1. Create retry config struct — pkg/httpclient/retry.go
        2. Implement RetryTransport — pkg/httpclient/transport.go
        3. Add per-request override via context — pkg/httpclient/context.go

        ## Test Strategy
        Unit tests for retry logic, integration tests with httptest server.

  # Phase 3: TDD — Write tests first (RED phase)
  - node: tdd
    output:
      message:
        role: assistant
        text: |
          Created test files:
          1. pkg/httpclient/retry_test.go — Tests for RetryConfig defaults and validation
          2. pkg/httpclient/transport_test.go — Tests for retry behavior on 5xx, no retry on 4xx
          3. pkg/httpclient/context_test.go — Tests for per-request config override

          All tests are runnable and currently FAIL (RED phase complete).
      response_text: |
        Created test files:
        1. pkg/httpclient/retry_test.go — Tests for RetryConfig defaults and validation
        2. pkg/httpclient/transport_test.go — Tests for retry behavior on 5xx, no retry on 4xx
        3. pkg/httpclient/context_test.go — Tests for per-request config override

        All tests are runnable and currently FAIL (RED phase complete).

  # Phase 4: Implement — Make tests pass (GREEN phase)
  - node: implement
    output:
      message:
        role: assistant
        text: |
          Implementation complete. All tests pass:
          - pkg/httpclient/retry.go — RetryConfig with defaults
          - pkg/httpclient/transport.go — RetryTransport with exponential backoff + jitter
          - pkg/httpclient/context.go — Context-based per-request override
          - go test ./pkg/httpclient/... → PASS (12 tests)
      response_text: |
        Implementation complete. All tests pass:
        - pkg/httpclient/retry.go — RetryConfig with defaults
        - pkg/httpclient/transport.go — RetryTransport with exponential backoff + jitter
        - pkg/httpclient/context.go — Context-based per-request override
        - go test ./pkg/httpclient/... → PASS (12 tests)

  # Phase 5: Review — Structured code review (pass)
  - node: review
    output:
      message:
        role: assistant
        text: |
          Code review complete. The implementation is clean and follows existing patterns.
      response_text: |
        Code review complete. The implementation is clean and follows existing patterns.
      response:
        verdict: pass
        summary: "Clean implementation with good separation of concerns. Retry logic is well-tested and follows existing HTTP client patterns."
        issues: []
        test_coverage: "Good coverage of happy paths and edge cases. 12 tests covering retry behavior, config validation, and context overrides."
        follows_patterns: true
      completed: true

  # Phase 6: complete is a save_message node — no event needed

expect:
  outcome: completed
  reached:
    - brainstorm
    - plan
    - tdd
    - implement
    - review
    - complete

---
# Review fails: all phases complete but review returns verdict: fail
name: review_fail
description: >
  All phases complete but the review gate returns verdict: fail with critical issues.
  The workflow still completes (linear chain, no loop-back) but the review
  documents issues that need to be addressed.

inputs:
  mode: auto
  yield: false

events:
  # Phase 1: Brainstorm
  - node: brainstorm
    output:
      message:
        role: assistant
        text: |
          ## Problem Statement
          Add rate limiting middleware to the API server.

          ## Success Criteria
          - Per-IP rate limiting with configurable thresholds
          - Returns 429 with Retry-After header when exceeded
      response_text: |
        ## Problem Statement
        Add rate limiting middleware to the API server.

        ## Success Criteria
        - Per-IP rate limiting with configurable thresholds
        - Returns 429 with Retry-After header when exceeded

  # Phase 2: Plan
  - node: plan
    output:
      message:
        role: assistant
        text: |
          ## Tasks
          1. Create rate limiter — pkg/middleware/ratelimit.go
          2. Add middleware to router — internal/server/router.go
      response_text: |
        ## Tasks
        1. Create rate limiter — pkg/middleware/ratelimit.go
        2. Add middleware to router — internal/server/router.go

  # Phase 3: TDD
  - node: tdd
    output:
      message:
        role: assistant
        text: "Created tests in pkg/middleware/ratelimit_test.go. Tests fail as expected."
      response_text: "Created tests in pkg/middleware/ratelimit_test.go. Tests fail as expected."

  # Phase 4: Implement
  - node: implement
    output:
      message:
        role: assistant
        text: "Implementation complete. Tests pass."
      response_text: "Implementation complete. Tests pass."

  # Phase 5: Review — verdict: fail with critical issues
  - node: review
    output:
      message:
        role: assistant
        text: |
          Code review complete. Found critical issues that must be addressed.
      response_text: |
        Code review complete. Found critical issues that must be addressed.
      response:
        verdict: fail
        summary: "Rate limiter has a race condition in concurrent access and missing input validation on configuration."
        issues:
          - severity: critical
            description: "Race condition: concurrent map read/write in token bucket without mutex. Will panic under load."
            file: "pkg/middleware/ratelimit.go"
            line: 42
          - severity: critical
            description: "No validation on rate limit config — zero or negative values cause infinite loop."
            file: "pkg/middleware/ratelimit.go"
            line: 15
          - severity: warning
            description: "Retry-After header uses integer seconds but should use HTTP-date format for large values."
            file: "pkg/middleware/ratelimit.go"
            line: 67
          - severity: suggestion
            description: "Consider using sync.Map or a sharded map for better concurrent performance."
            file: "pkg/middleware/ratelimit.go"
            line: 42
        test_coverage: "Missing tests for concurrent access patterns. Only sequential test cases present."
        follows_patterns: false
      completed: true

expect:
  outcome: completed
  reached:
    - brainstorm
    - plan
    - tdd
    - implement
    - review
    - complete

---
# Yield between phases: with yield=true (default), phases pause for user review
name: yield_between_phases
description: >
  With yield=true, each agent phase yields to the user after completion.
  This tests that the yield input is properly passed through to sub-workflow
  args. All phases still complete in sequence but with user checkpoints.

inputs:
  mode: auto
  yield: true

events:
  # Phase 1: Brainstorm (yields after completion for user to review questions)
  - node: brainstorm
    output:
      message:
        role: assistant
        text: |
          ## Problem Statement
          Implement webhook delivery with retry and dead-letter queue.

          ## Key Questions
          1. What payload format? → JSON with HMAC signature
          2. Retry policy? → 3 attempts, exponential backoff
          3. Dead-letter storage? → Database table for failed deliveries
      response_text: |
        ## Problem Statement
        Implement webhook delivery with retry and dead-letter queue.

  # Phase 2: Plan (yields for user to review plan)
  - node: plan
    output:
      message:
        role: assistant
        text: |
          ## Tasks
          1. Webhook delivery service — internal/webhooks/deliver.go
          2. Retry queue — internal/webhooks/retry.go
          3. Dead-letter table migration — internal/db/migrations/
      response_text: |
        ## Tasks
        1. Webhook delivery service — internal/webhooks/deliver.go
        2. Retry queue — internal/webhooks/retry.go
        3. Dead-letter table migration — internal/db/migrations/

  # Phase 3: TDD (yields for user to review test plan)
  - node: tdd
    output:
      message:
        role: assistant
        text: "Tests written for delivery, retry, and dead-letter flows. All RED."
      response_text: "Tests written for delivery, retry, and dead-letter flows. All RED."

  # Phase 4: Implement (yields for user to review implementation)
  - node: implement
    output:
      message:
        role: assistant
        text: "Implementation complete. All 18 tests pass (GREEN)."
      response_text: "Implementation complete. All 18 tests pass (GREEN)."

  # Phase 5: Review (structured review)
  - node: review
    output:
      message:
        role: assistant
        text: "Code review complete. Implementation passes all checks."
      response_text: "Code review complete. Implementation passes all checks."
      response:
        verdict: pass
        summary: "Solid webhook delivery implementation with proper retry semantics and dead-letter handling."
        issues:
          - severity: suggestion
            description: "Consider adding a circuit breaker for endpoints that consistently fail."
            file: "internal/webhooks/deliver.go"
            line: 89
        test_coverage: "Comprehensive coverage including retry exhaustion, concurrent delivery, and dead-letter insertion."
        follows_patterns: true
      completed: true

expect:
  outcome: completed
  reached:
    - brainstorm
    - plan
    - tdd
    - implement
    - review
    - complete
