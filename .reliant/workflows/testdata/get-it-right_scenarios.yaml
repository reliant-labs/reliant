# Test scenarios for get-it-right.yaml workflow
#
# Get-It-Right workflow structure:
#   Top-level nodes (linear): attempt → diagnose → implement
#
#   attempt (type: loop, passthrough thread):
#     While: has(outputs.strategy) && outputs.strategy != "proceed"
#            && iter.iteration < inputs.max_retries
#     Inner nodes: implement → evaluate → refactor (conditional)
#     - implement   type: workflow ref: builtin://agent (BLACK BOX)
#     - evaluate    type: workflow ref: builtin://structured-agent
#       response_schema: { strategy, diagnosis, difficulty_areas, wrong_abstractions, improvements }
#       strategy enum: ["improve", "restart", "proceed"]
#     - refactor    type: workflow ref: builtin://agent (BLACK BOX)
#       Conditional: skipped when evaluate.response.strategy == "proceed"
#     - Loop outputs:
#         strategy:  from evaluate.response.strategy (default "restart")
#         diagnosis: from evaluate.response.diagnosis (default '')
#
#   diagnose (type: workflow ref: builtin://agent, BLACK BOX) — final synthesis
#   implement (type: workflow ref: builtin://agent, BLACK BOX) — final implementation
#
# Inputs:
#   model (type: model): default tags: [flagship]
#   max_retries (integer): default 2, min 1, max 5
#
# NOTE: For loop scenarios, provide events for EACH iteration in order.
#       The simulator consumes events sequentially per node name.

---
name: happy_path_no_retry
description: >
  First attempt succeeds. evaluate says strategy="proceed" on iteration 0.
  Refactor is skipped (conditional edge). Loop exits after 1 iteration.

events:
  - node: attempt.implement
    output:
      response_text: "Implemented the feature. Tests pass, code looks correct."

  - node: attempt.evaluate
    output:
      response:
        strategy: "proceed"
        diagnosis: "Implementation is correct. The codebase patterns were straightforward."
        difficulty_areas: "None — the existing abstractions mapped cleanly to the task."
        wrong_abstractions: "None — initial assumptions were accurate."
        improvements: []

  - node: diagnose
    output:
      response_text: "The implementation succeeded on the first attempt. Key insight: the codebase follows clean separation of concerns, making the change straightforward."

  - node: implement
    output:
      response_text: "Final implementation complete. Applied the same approach from the successful first attempt."

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.evaluate
    - diagnose
    - implement
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      strategy: "proceed"
      diagnosis: "Implementation is correct. The codebase patterns were straightforward."

---
name: one_retry_then_success
description: >
  First attempt has issues (strategy="improve"). Refactor agent applies improvements.
  Second attempt builds on refactored code and succeeds (strategy="proceed").

events:
  - node: attempt.implement
    output:
      response_text: "Attempted the feature but tests fail. The data model doesn't match expectations."

  - node: attempt.evaluate
    output:
      response:
        strategy: "improve"
        diagnosis: "The implementation assumed a flat data model but the schema is actually nested with foreign key constraints."
        difficulty_areas: "Database schema is more complex than it appears from the API layer."
        wrong_abstractions: "Assumed direct table access but there's a repository pattern wrapping queries."
        improvements:
          - area: "Data access layer"
            suggestion: "Use the repository layer instead of direct SQL. Follow the existing pattern in UserRepository."
            severity: critical
          - area: "Schema assumptions"
            suggestion: "Check the migration files for the actual schema shape before writing queries."
            severity: important

  - node: attempt.refactor
    output:
      response_text: "Refactored data access to use the repository layer. Replaced direct SQL queries with UserRepository methods. Updated schema assumptions based on migration files. Tests now pass for the data layer."

  - node: attempt.implement
    output:
      response_text: "Built on the refactored repository layer. All tests pass, implementation is clean."

  - node: attempt.evaluate
    output:
      response:
        strategy: "proceed"
        diagnosis: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."
        difficulty_areas: "The repository pattern was non-obvious from the surface API."
        wrong_abstractions: "First attempt bypassed the repository layer — now corrected by the refactor."
        improvements: []

  - node: diagnose
    output:
      response_text: "Key learning: always use the repository layer for data access. The schema has hidden complexity behind FK constraints that the repository handles correctly."

  - node: implement
    output:
      response_text: "Final implementation uses the repository pattern throughout. All tests pass. Migration script included."

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.evaluate
    - attempt.refactor
    - diagnose
    - implement
  node_outputs:
    attempt:
      strategy: "proceed"
      diagnosis: "Implementation is now correct. The repository layer integration is solid and follows codebase conventions."

---
name: restart_from_scratch
description: >
  First attempt is fundamentally wrong (strategy="restart"). Refactor agent deletes
  400 lines of duplicate code and restructures using existing infrastructure. Second
  attempt builds on the clean foundation and succeeds.

events:
  - node: attempt.implement
    output:
      response_text: "Built a custom event system to handle notifications. Tests pass but the implementation is 400 lines and duplicates existing functionality."

  - node: attempt.evaluate
    output:
      response:
        strategy: "restart"
        diagnosis: "The implementation works but fights the codebase. There's already a pub/sub system in the message broker module that handles exactly this. We built a parallel system instead of using what exists."
        difficulty_areas: "The existing pub/sub system isn't documented and lives in an unexpected location (internal/broker rather than internal/events)."
        wrong_abstractions: "Built from scratch instead of discovering the existing infrastructure. The codebase already solves this problem."
        improvements:
          - area: "Architecture"
            suggestion: "Delete the custom event system entirely. Use internal/broker's pub/sub for all notification routing."
            severity: critical
          - area: "Discovery"
            suggestion: "Search for existing infrastructure before building new systems. Check internal/broker, internal/bus, internal/pubsub."
            severity: important

  - node: attempt.refactor
    output:
      response_text: "Deleted the entire custom event system (400 lines removed). Replaced with a thin integration layer using internal/broker's pub/sub. The notification routing now uses 3 function calls to the existing broker API instead of a custom implementation."

  - node: attempt.implement
    output:
      response_text: "Built on the refactored broker integration. Implementation is 50 lines, all tests pass, and it integrates cleanly with the existing notification flow."

  - node: attempt.evaluate
    output:
      response:
        strategy: "proceed"
        diagnosis: "Clean implementation using existing infrastructure. The pub/sub integration is correct and the code follows the established patterns in the broker module."
        difficulty_areas: "The broker API has some quirks around subscription lifecycle but the existing tests provided good examples."
        wrong_abstractions: "None this time — we correctly identified and used the existing pub/sub system."
        improvements: []

  - node: diagnose
    output:
      response_text: "Key lesson: always search for existing infrastructure before building new systems. The codebase had a pub/sub system that was the right tool — we just didn't find it on the first pass. The restart was the right call; patching 400 lines of duplicate code would have been worse than starting fresh."

  - node: implement
    output:
      response_text: "Final implementation uses internal/broker pub/sub. 50 lines, fully tested, follows established patterns. No custom event system needed."

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.evaluate
    - attempt.refactor
    - diagnose
    - implement
  node_outputs:
    attempt:
      strategy: "proceed"
      diagnosis: "Clean implementation using existing infrastructure. The pub/sub integration is correct and the code follows the established patterns in the broker module."

---
name: max_retries_exhausted
description: >
  All retries fail. max_retries=2. Iteration 0: restart strategy, refactor restructures.
  Iteration 1: improve strategy, refactor applies fixes. Loop exits at max_retries.
  Workflow still completes through diagnose → implement.

inputs:
  max_retries: 2

events:
  - node: attempt.implement
    output:
      response_text: "First attempt. Tried to refactor the auth module but broke session handling."

  - node: attempt.evaluate
    output:
      response:
        strategy: "restart"
        diagnosis: "Auth module is tightly coupled to session management. Can't change one without the other. This approach is swimming upstream."
        difficulty_areas: "Session state is shared across auth middleware, route handlers, and websocket connections."
        wrong_abstractions: "Assumed auth and sessions were independent modules — they're deeply intertwined."
        improvements:
          - area: "Architecture"
            suggestion: "Introduce an event bus to decouple auth, sessions, and websockets before attempting any refactoring."
            severity: critical
          - area: "Approach"
            suggestion: "Start from the middleware layer rather than the module boundaries."
            severity: critical

  - node: attempt.refactor
    output:
      response_text: "Reverted auth module changes. Introduced a basic event bus for state changes between auth and sessions. Restructured the approach to start from the middleware layer."

  - node: attempt.implement
    output:
      response_text: "Second attempt. Event bus approach works for auth/sessions but the websocket layer also has coupling issues."

  - node: attempt.evaluate
    output:
      response:
        strategy: "improve"
        diagnosis: "The event bus approach is right but incomplete. Websockets maintain their own auth state that also needs to go through the bus."
        difficulty_areas: "Three-way coupling between auth, sessions, and websockets. Each depends on the others' internal state."
        wrong_abstractions: "Even the combined auth+session refactor isn't enough — websockets maintain their own auth state."
        improvements:
          - area: "Websocket auth"
            suggestion: "Websocket connections need to subscribe to auth state changes via the event bus rather than caching auth state internally."
            severity: critical
          - area: "Event bus scope"
            suggestion: "Extend the event bus to cover all three systems: auth, sessions, and websocket connection state."
            severity: important

  - node: attempt.refactor
    output:
      response_text: "Extended event bus to cover websocket auth state. Websocket connections now subscribe to auth changes instead of caching. Still need to verify all edge cases around reconnection."

  - node: diagnose
    output:
      response_text: "After 2 attempts, the core problem is clear: auth, sessions, and websockets form a tightly coupled triad. The event bus approach is correct but needs to cover all three systems. Start the final implementation from scratch with the full event bus architecture."

  - node: implement
    output:
      response_text: "Implemented complete event bus pattern from scratch covering auth, sessions, and websockets. Each module subscribes to state change events instead of directly referencing others."

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.evaluate
    - attempt.refactor
    - diagnose
    - implement
  node_outputs:
    attempt:
      strategy: "improve"
      diagnosis: "The event bus approach is right but incomplete. Websockets maintain their own auth state that also needs to go through the bus."

---
name: immediate_understanding
description: >
  Codebase is simple enough that first attempt fully succeeds. strategy="proceed"
  on the very first try. Refactor is skipped via conditional edge.

events:
  - node: attempt.implement
    output:
      response_text: "Added the new endpoint. Followed the existing pattern from the adjacent routes. All tests pass."

  - node: attempt.evaluate
    output:
      response:
        strategy: "proceed"
        diagnosis: "The implementation is complete and correct. The codebase has consistent patterns that made this straightforward."
        difficulty_areas: "No unexpected difficulty. The route patterns are well-established."
        wrong_abstractions: "No wrong assumptions — the codebase structure matches its documentation."
        improvements: []

  - node: diagnose
    output:
      response_text: "No issues found. The codebase is well-structured with consistent patterns. The implementation follows established conventions."

  - node: implement
    output:
      response_text: "Implementation confirmed. New endpoint follows existing route patterns with proper validation and error handling."

expect:
  outcome: completed
  reached:
    - attempt
    - attempt.implement
    - attempt.evaluate
    - diagnose
    - implement
  not_reached:
    - attempt.refactor
  node_outputs:
    attempt:
      strategy: "proceed"
      diagnosis: "The implementation is complete and correct. The codebase has consistent patterns that made this straightforward."
