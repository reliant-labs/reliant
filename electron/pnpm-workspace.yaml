# pnpm settings for the Electron app. It is its own pnpm workspace root (one
# package, no members), so these apply here and nowhere else: pnpm reads them
# from this file, never from package.json or .npmrc, and a pnpm-workspace.yaml
# higher up (the web app's lives in frontends/web) never swallows it.

# electron-builder copies the app's production dependencies into app.asar
# from node_modules. The hoisted linker lays node_modules out flat, the tree
# npm installed, which the release jobs package on macOS, Linux and Windows.
# A Linux `electron-builder --dir` made an app.asar whose node_modules was
# byte-identical to the npm build's with this linker AND with pnpm's default
# isolated one (symlinks into node_modules/.pnpm), but only Linux was tried:
# hoisted keeps the other two packaging the layout they already proved.
# electron/src declares every package it requires, so nothing here leans on
# hoisting to reach an undeclared one.
nodeLinker: hoisted
# Refuse to install on a Node outside a dependency's engines, before any
# install script runs, as frontends/web does.
engineStrict: true
# Install scripts pnpm may run; an unlisted one fails the install
# (ERR_PNPM_IGNORED_BUILDS) rather than being skipped silently.
#   electron: its postinstall downloads the Electron binary the tests and the
#   package build load (node_modules/electron/path.txt).
#   electron-winstaller: its install script copies the host's 7-Zip into
#   vendor/ for Squirrel.Windows installers. It comes in through
#   electron-builder-squirrel-windows; no config here builds a squirrel
#   target (Windows is nsis and portable), so nothing reads that copy.
allowBuilds:
  electron: true
  electron-winstaller: false
minimumReleaseAgeExclude:
  - '@reliantlabs/forge-web-runtime@0.14.1'
