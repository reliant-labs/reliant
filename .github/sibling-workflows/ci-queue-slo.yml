name: CI queue SLO

# This workflow runs from the default branch. Never check out, source, or
# execute anything from the CI run that caused it to fire.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ci-queue-slo-issue
  cancel-in-progress: false

jobs:
  report:
    name: Report merge-queue timing
    if: ${{ github.repository == 'reliant-labs/forge' && github.event.workflow_run.event == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Verify CI provenance and report authoritative job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=reliant-labs/forge
          run=$(jq -er '.workflow_run.id | select(type == "number" and . > 0 and floor == .)' "$GITHUB_EVENT_PATH")
          attempt=$(jq -er '.workflow_run.run_attempt | select(type == "number" and . > 0 and floor == .)' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.workflow_run.head_sha | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")
          workflow=$(gh api "repos/$repo/actions/workflows/ci.yml" --jq '.id')
          [[ $workflow =~ ^[1-9][0-9]*$ ]]
          meta=$(gh api "repos/$repo/actions/runs/$run/attempts/$attempt")
          jq -e --arg repo "$repo" --arg head "$head" --argjson run "$run" --argjson attempt "$attempt" --argjson wf "$workflow" '
            .id == $run and .run_attempt == $attempt and .workflow_id == $wf
            and .event == "merge_group" and .status == "completed"
            and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_sha == $head and (.head_branch | test("^gh-readonly-queue/main/pr-[1-9][0-9]*-[0-9a-f]{7,40}$"))
            and (.path | split("@")[0]) == ".github/workflows/ci.yml"
          ' <<<"$meta" >/dev/null
          # The candidate supplies only a bounded identity receipt, not any
          # clock, job result, issue text, or API endpoint used for the report.
          artifact=$(gh api "repos/$repo/actions/runs/$run/artifacts?per_page=100" \
            | jq -r --arg name "forge-ci-queue-slo-$attempt" --arg head "$head" --argjson run "$run" '
              [.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0 and .size_in_bytes <= 4096
                and .workflow_run.id == $run and .workflow_run.head_sha == $head)]
              | if length == 0 then empty elif length == 1 then .[0].id else error("ambiguous timing artifact") end')
          [[ -n $artifact ]] || exit 0
          [[ $artifact =~ ^[1-9][0-9]*$ ]]
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          gh api "repos/$repo/actions/artifacts/$artifact/zip" | head -c 4097 >"$archive"
          python3 -I - "$archive" "$repo" "$head" "$run" "$attempt" <<'PY'
          import json, pathlib, stat, sys, zipfile
          path, repo, head, run, attempt = sys.argv[1:]
          if pathlib.Path(path).stat().st_size > 4096:
              raise SystemExit('timing archive exceeds byte budget')
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              if len(entries) != 1:
                  raise SystemExit('timing archive must have one member')
              entry = entries[0]
              mode = stat.S_IFMT(entry.external_attr >> 16)
              if entry.filename != 'forge-ci-queue-slo.json' or mode not in (0, stat.S_IFREG) or entry.file_size > 1024:
                  raise SystemExit('invalid timing archive member')
              with archive.open(entry) as data:
                  raw = data.read(1025)
          if len(raw) > 1024:
              raise SystemExit('timing record exceeds byte budget')
          def unique(items):
              result = dict(items)
              if len(result) != len(items):
                  raise ValueError('duplicate timing field')
              return result
          fact = json.loads(raw, object_pairs_hook=unique)
          expected = dict(schema='forge-ci-queue-slo/v1', repo=repo, head=head, run_id=int(run), attempt=int(attempt))
          if not isinstance(fact, dict) or fact.keys() != expected.keys() or any(type(fact[k]) != type(v) or fact[k] != v for k, v in expected.items()):
              raise SystemExit('timing receipt does not match its run')
          PY
          # The Actions API owns these timestamps. A late writer or rerun
          # cannot turn its own delay into a breach of the original attempt.
          jobs=$(gh api --paginate "repos/$repo/actions/runs/$run/attempts/$attempt/jobs?per_page=100" --jq '.jobs[]' | jq -s .)
          facts=$(jq -er --argjson run "$meta" --argjson id "$run" '
            def secs(a; b): ((b | fromdateiso8601) - (a | fromdateiso8601));
            [.[] | select(.conclusion != "skipped" and .completed_at != null and .started_at != null and .created_at != null)] as $done
            | if ($done | length) == 0 or any($done[]; .run_id != $id)
              then error("no authoritative job timings for this run") else . end
            | ($done | map(.completed_at) | max) as $last
            | [secs($run.created_at; $last), ($done | map(secs(.created_at; .started_at)) | max), secs($run.run_started_at; $last)]
            | if any(.[]; . < 0) or .[0] > 86400 then error("invalid run timing bounds") else @tsv end
          ' <<<"$jobs")
          read -r wall wait critical <<<"$facts"
          url="https://github.com/$repo/actions/runs/$run/attempts/$attempt"
          printf '### CI queue job wall times\n\n[Producer run](%s). Critical path: **%ss**.\n\n| Job | Result | Wall (s) | Queued (s) |\n| --- | --- | ---: | ---: |\n' "$url" "$critical" >>"$GITHUB_STEP_SUMMARY"
          jq -r '
            def secs(a; b): ((b | fromdateiso8601) - (a | fromdateiso8601));
            def cell: gsub("[^a-zA-Z0-9 ()_./-]"; " ") | .[0:180];
            [.[] | select(.conclusion != "skipped" and .completed_at != null and .started_at != null and .created_at != null)]
            | sort_by(-secs(.started_at; .completed_at))[]
            | "| \(.name | cell) | \(.conclusion | cell) | \(secs(.started_at; .completed_at)) | \([secs(.created_at; .started_at),0] | max) |"
          ' <<<"$jobs" >>"$GITHUB_STEP_SUMMARY"
          line="Merge-queue wall ${wall}s (longest runner wait ${wait}s; budget 300s). [Run]($url)"
          printf '\n%s\n' "$line" >>"$GITHUB_STEP_SUMMARY"
          [[ $wall -gt 300 ]] || exit 0
          title='Merge queue CI over its 5-minute budget'
          issues=$(gh issue list --repo "$repo" --state open --label pipeline:slo --search "in:title \"$title\"" --json number,title,updatedAt)
          issue=$(jq -r --arg title "$title" '[.[] | select(.title == $title)][0] // empty | "\(.number) \(.updatedAt)"' <<<"$issues")
          if [[ -z $issue ]]; then
            gh label create pipeline:slo --repo "$repo" --color B60205 --description 'A pipeline SLO is breached' >/dev/null 2>&1 || true
            gh issue create --repo "$repo" --label pipeline:slo --title "$title" --body "$line"
          else
            read -r number last <<<"$issue"
            [[ $number =~ ^[1-9][0-9]*$ ]]
            last=$(date -d "$last" +%s)
            if (( $(date +%s) - last >= 3600 )); then gh issue comment "$number" --repo "$repo" --body "$line"; fi
          fi
