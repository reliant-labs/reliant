name: PR CI

# Runs on PRs AND on pushes to main.
#
# WHY THE PUSH TRIGGER EXISTS. This workflow was pull_request-only, so nothing
# verified main after a merge. TestReplayFixtures sat broken on main for WEEKS
# and only surfaced when an unrelated release PR went red against it — by which
# point the change that broke it was long buried, and the engineer who paid for
# it had nothing to do with it. A PR is tested against its merge BASE, not
# against the merge RESULT, so two independently-green PRs can still merge into
# a red main. Post-merge verification is the only thing that catches that, and
# it is also what gives `main` an authoritative last-known-good signal.
#
# TWO TIERS, AND THE EVENT PICKS THE TIER:
#
#   pull_request                      FAST: only the lanes and tests the diff can
#                                     reach (`changes` decides), Go `-short`
#   push to main, schedule, dispatch  FULL: every lane, every Go package, no
#                                     `-short`, nothing path-filtered
#
# The PR tier is built to finish in about five minutes. It gets there by NOT
# running what the diff cannot affect — a web-only PR runs no Go, a Go change
# to one package runs that package and its importers — never by deleting a
# check: everything a PR skips runs on the very next push to main, and nightly.
# gate-health.yml watches main's runs and opens a `ci:main-red` issue when one
# goes red, so a break the PR tier missed is loud within one merge.
#
# WHY THE PR TIER HAS TO BE SMALL, NOT JUST PARALLEL. Measured over October
# 2026 the jobs themselves fit in ~5 minutes, yet the workflow averaged 27
# minutes and peaked at 65: jobs sat QUEUED for up to 40 minutes. The org's
# concurrent-job limit is shared by every PR (and by control-plane), and each
# PR used to launch 17 jobs whatever it changed. Every job a PR does not need is
# a runner slot another PR is waiting for, so selection is the speed-up.
#
# The nightly `schedule` exists so the full tier also runs on days nobody
# merges, and so a test that fails only some nights (a flake, a clock edge)
# leaves a record. `workflow_dispatch` runs the full tier on any branch on
# demand: use it on a PR that touches code only the full tier exercises.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 06:17 UTC daily: off the top of the hour, where GitHub's scheduler queues
    # are longest, and before the Americas workday so a red night is waiting.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Cancellation is right for a PR and WRONG for main.
#
# On a PR, a new push obsoletes the previous run: cancel it and save the runner.
# github.ref is the PR ref, so every PR gets its own group and they never
# interfere.
#
# On main, grouping by ref with cancel-in-progress would let each merge kill the
# run before it, so a burst of merges leaves main with no verdict at all. That
# is why main used to get one group per COMMIT SHA, never cancelled. The cost
# was the opposite failure: a burst of N merges parked N full runs on runners,
# 285 jobs ended up cancelled and some sat ~2.7 hours, and because this repo
# shares the org's concurrent-job limit with control-plane it starved
# control-plane's CI too.
#
# So all pushes to main share ONE group and nothing in it is cancelled once it
# starts: the run in progress always finishes and so always ends in a verdict.
# GitHub keeps at most ONE pending run per group and a newer push supersedes
# it, so a burst costs at most one extra run, not one per merge. The surviving
# run tests the newest main, which contains every superseded commit, so a break
# introduced by a skipped SHA is still caught; only the attribution is coarser
# (bisect the range between two verdicts). This mirrors control-plane's ci.yml.
#
# The nightly `schedule` run joins main's group: it tests main's HEAD too. A
# `workflow_dispatch` run groups by its ref and is never cancelled: somebody
# asked for that verdict.
concurrency:
  group: pr-ci-${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # `|`, not `,`: fall back to the module's origin on ANY proxy error, not
  # only a 404. A Go job fetches whatever the module cache lacks (a go.sum
  # change, a cold cache) with many fetches in flight, and one transient
  # proxy.golang.org stream reset failed five test binaries at once with
  # "[setup failed]" (run 39676414820).
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # ── What does this change reach? ──────────────────────────────────────────
  #
  # Every other job reads its lane from here. Two sources, each for what it is
  # good at:
  #
  #   - `tools/test-affected` (the same selector `make test-affected` runs
  #     locally, with its own tests) decides WHICH Go packages and vitest files
  #     the diff reaches: a package runs when its test binary imports a changed
  #     package, embeds a changed file or names one in a path literal; a vitest
  #     file runs when it imports a changed module. Anything it cannot place
  #     makes its lane FULL (dev-docs/testing-affected.md has the rule table).
  #   - Path patterns below decide the lanes that are not test selection: lint,
  #     codegen drift, the web build, Playwright, the electron package.
  #
  # Both fail in the safe direction. A path no pattern recognises turns the
  # backend and codegen lanes ON. A change to this workflow, an event other
  # than pull_request, or a diff that cannot be computed turns EVERYTHING on —
  # a CI change is proven against the whole PR path it changes.
  #
  # WHY JOB-LEVEL `if:` AND NOT `paths-ignore`. `paths-ignore` stops the
  # workflow from being created at all, so its checks never report; a job
  # skipped by `if:` still reports (as skipped), and `ci-result` below turns
  # the whole run into one verdict that is green only when every job that ran
  # passed.
  #
  # The Go shard matrix is computed here too, by `tools/test-affected shard`:
  # as FEW shards as keep each under its weight target, at most six, balanced
  # by measured duration. A PR that reaches a handful of packages runs one
  # shard; the whole module (main, nightly, a CI change) runs six. Every shard
  # restores the same package cache (the go-cache job), so nothing ties a
  # package to a fixed shard number.
  #
  # It also runs the three cheap guards that used to be a "Quick checks" job
  # of their own (a runner slot and a queue wait for ~10s of work):
  #
  #   - No committed binaries: what the pre-commit hook would have caught, for
  #     when it did not run (hooks are opt-in; --no-verify skips them).
  #   - electron/release.config.json is GENERATED from control-plane's KCL. This
  #     validates the committed values are shippable (every required VITE_* and
  #     RELIANT_* key present, non-empty, not localhost), the failure mode that
  #     shipped v1.7.5 with no control-plane URL. It cannot compare against the
  #     KCL (control-plane is private): that drift check runs in control-plane's
  #     ci.yml with --check --require.
  #   - The unit tests of the scripts the release and health workflows run
  #     (.github/scripts/*.test.mjs), node's standard library only.
  #
  # They run AFTER the classification and never fail this job: a committed
  # binary must not cancel every test lane. Each reports its outcome as the
  # `quick_checks` output and `CI result` fails on anything but success.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      backend: ${{ steps.lanes.outputs.backend }}
      generated: ${{ steps.lanes.outputs.generated }}
      # The selector's forge-generate lane: the diff touches something
      # `forge generate` reads or writes (rules.go, forgeInputs).
      forge_generate: ${{ steps.lanes.outputs.forge_generate }}
      web: ${{ steps.lanes.outputs.web }}
      playwright: ${{ steps.lanes.outputs.playwright }}
      electron: ${{ steps.lanes.outputs.electron }}
      cp_contract: ${{ steps.lanes.outputs.cp_contract }}
      # {"include":[{shard,shard_total,packages}]}, or empty when no Go
      # package is selected.
      go_matrix: ${{ steps.lanes.outputs.go_matrix }}
      # {"include":[{shard,shard_total}]} for vitest, or empty; vitest_files is
      # the file list (relative to frontends/web/) when the selection is partial.
      vitest_matrix: ${{ steps.lanes.outputs.vitest_matrix }}
      vitest_files: ${{ steps.lanes.outputs.vitest_files }}
      # "<./pkg>\t<-run regexp>" lines for the new-flake gate.
      flake_targets: ${{ steps.lanes.outputs.flake_targets }}
      # "success" when every quick check passed, else which did not.
      quick_checks: ${{ steps.quick.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The selector loads the Go package graph (`go list -test -deps`), which
      # needs the module cache. Restore only: the go-cache job saves it on main.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      - name: Classify the change
        id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          GOFLAGS: -buildvcs=false
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          outlines() {
            if [ -z "$2" ]; then out "$1" ""; return; fi
            { echo "$1<<__LANE_EOF__"; printf '%s\n' "$2"; echo "__LANE_EOF__"; } >> "$GITHUB_OUTPUT"
          }
          go build -o "${RUNNER_TEMP}/test-affected" ./tools/test-affected
          ta="${RUNNER_TEMP}/test-affected"

          full=false
          base=""
          changed=""
          cp_contract=false
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # actions/checkout puts a PR on GitHub's merge commit; its first
            # parent is the base it was merged onto, so base..HEAD is exactly
            # what merging would bring in. Anything else: the merge base.
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 3 ]; then
              base="$(git rev-parse HEAD^1)"
            else
              base="$(git merge-base "origin/${BASE_REF}" HEAD)"
            fi
            changed="$(git diff --name-only "${base}" HEAD)"
            echo "base ${base}; changed files:"; echo "${changed}"
            if [ -z "${changed}" ]; then
              full=true; echo "::notice::empty diff — running everything"
            elif grep -qE '^\.github/workflows/pr-ci\.yml$' <<< "${changed}"; then
              full=true; echo "::notice::this PR changes pr-ci.yml — running the whole PR tier"
            fi
          else
            full=true
            echo "${EVENT_NAME} run — every lane runs, in full"
            # The control-plane contract gate judges a change made HERE, so a
            # push checks the range it introduced; a nightly or a dispatch has
            # no change of its own and would only report that control-plane
            # moved, which is control-plane's gate to catch.
            if [ "${EVENT_NAME}" = "push" ]; then
              if [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                changed="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_SHA}")"
              else
                cp_contract=true
              fi
            fi
          fi
          if grep -qE '^(proto-vendor/controlplane/|\.github/scripts/sync-controlplane-proto\.mjs$|\.github/workflows/pr-ci\.yml$)' <<< "${changed}"; then
            cp_contract=true
          fi
          out cp_contract "${cp_contract}"

          # ── path lanes ──
          backend=true generated=true web=true playwright=true electron=true
          if [ "${full}" = false ]; then
            # Backend (lint, e2e stories): anything but the frontends, docs and
            # CI plumbing. Top-level *.md only: nested ones may be embedded. A
            # .go file counts wherever it lives: research/ holds module
            # packages too, and golangci-lint lints every one of them.
            backend=false generated=false web=false playwright=false electron=false
            if grep -qE '\.go$' <<< "${changed}" \
              || grep -qvE '^(frontends/web/|electron/|docs/|research/|dev-docs/|contributing/|\.github/|\.reliant/|LICENSE|\.license-allowlist|[^/]+\.md$)' <<< "${changed}"; then backend=true; fi
            # Codegen drift: generators read Go, proto, SQL, config and docs
            # and write into gen/, docs/, generated/ and two frontends/web/src paths.
            if grep -qE '\.go$' <<< "${changed}" \
              || grep -vE '^(frontends/web/|electron/|research/|dev-docs/|\.github/)' <<< "${changed}" | grep -q . \
              || grep -qE '^frontends/web/src/(gen/|store/shortcutsData\.generated\.ts$)' <<< "${changed}"; then generated=true; fi
            # The web build (lint, typecheck, vite build, verify-bundle).
            if grep -qE '^(frontends/web/|package(-lock)?\.json$|electron/release\.config\.json$|\.github/scripts/verify-bundle\.mjs$)' <<< "${changed}"; then web=true; fi
            # Playwright drives the built renderer: any web change but unit
            # tests and their fixtures.
            if grep -E '^(frontends/web/|package(-lock)?\.json$|electron/release\.config\.json$)' <<< "${changed}" \
              | grep -qvE '(/__tests__/|\.test\.tsx?$|^frontends/web/README\.md$)'; then playwright=true; fi
            # The electron package: electron itself, or what it bundles the
            # renderer with. Renderer source is the web job's to build.
            if grep -qE '^(electron/|package(-lock)?\.json$|frontends/web/package(-lock)?\.json$|frontends/web/vite\.config\.ts$)' <<< "${changed}"; then electron=true; fi
          fi
          out backend "${backend}"; out generated "${generated}"; out web "${web}"
          out playwright "${playwright}"; out electron "${electron}"

          # ── test selection (tools/test-affected) ──
          plan="${RUNNER_TEMP}/plan.json"
          if [ "${full}" = true ]; then
            "${ta}" plan -full -json > "${plan}"
          else
            "${ta}" plan -base "${base}" -json > "${plan}"
            echo "why each Go package runs:"
            jq -r '.go.reasons[]?, (.go.why // {} | to_entries[] | "  \(.key): \(.value)")' "${plan}" | head -200
          fi
          out forge_generate "$(jq -r .forge_generate.full "${plan}")"
          module="$(go list -m)"
          all="$(go list ./... | grep -vxF "${module}/e2e")"
          if [ "$(jq -r .go.full "${plan}")" = true ]; then
            selected="${all}"
          else
            selected="$(jq -r '.go.packages[]?' "${plan}" | sed -e "s#^\./#${module}/#" -e "s#^\.\$#${module}#" | grep -xF -f <(printf '%s\n' "${all}") || true)"
          fi
          # Empty output (nothing selected) means no shard launches.
          matrix="$(printf '%s\n' "${selected}" | "${ta}" shard)"
          out go_matrix "${matrix}"
          shards=0
          if [ -n "${matrix}" ]; then shards="$(jq '.include | length' <<< "${matrix}")"; fi
          echo "Go: $(grep -c . <<< "${selected}" || true) of $(grep -c . <<< "${all}") packages selected, ${shards} shard(s)"

          # vitest: everything, a file list, or nothing. A runner takes ~0.5s
          # of jsdom setup and import per FILE (all ~800: 211s on each of two
          # runners), so files are dealt out at most 150 per runner, up to
          # four runners; everything gets four (~2 minutes each).
          vitest_files=""
          n=800
          if [ "$(jq -r .web.full "${plan}")" != true ]; then
            vitest_files="$(jq -r '.web.tests[]?' "${plan}")"
            n="$(grep -c . <<< "${vitest_files}" || true)"
          fi
          if [ "${n}" -eq 0 ]; then
            out vitest_matrix ""
          else
            k=$(( (n + 149) / 150 )); k=$(( k > 4 ? 4 : k ))
            out vitest_matrix "$(jq -cn --argjson k "${k}" '{include: [range(1; $k + 1) | {shard: ., shard_total: $k}]}')"
          fi
          outlines vitest_files "${vitest_files}"
          echo "vitest: full=$(jq -r .web.full "${plan}"), $(grep -c . <<< "${vitest_files}" || true) selected file(s)"

          # The new-flake gate: Test functions this PR adds or edits.
          flake_targets=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            flake_targets="$("${ta}" changed-tests -base "${base}")"
          fi
          outlines flake_targets "${flake_targets}"
          echo "new/changed Go tests to repeat:"; echo "${flake_targets:-<none>}"

          {
            echo "### What this run tests"
            echo "| lane | runs |"; echo "|---|---|"
            echo "| Go packages | $(grep -c . <<< "${selected}" || true) of $(grep -c . <<< "${all}"), on ${shards} shard(s) |"
            echo "| vitest | $( [ "$(jq -r .web.full "${plan}")" = true ] && echo all || echo "$(grep -c . <<< "${vitest_files}" || true) file(s)") |"
            echo "| lint (forge lanes; golangci-lint on main), e2e stories | ${backend} |"
            echo "| codegen drift | ${generated} |"
            echo "| forge generate check | $( [ "${EVENT_NAME}" = pull_request ] && echo "main only" || echo true) |"
            echo "| web build | ${web} |"
            echo "| Playwright | ${playwright} |"
            echo "| electron package | ${electron} |"
            echo "| repeated new/changed tests | $(grep -c . <<< "${flake_targets}" || true) package(s) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── The quick checks (see the job header). Each step continues on
      # error; the last one turns their outcomes into the `quick_checks`
      # output that CI result judges.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The script takes <base> <head> and inspects only files ADDED in that
      # range. On push the base is `github.event.before`, falling back to the
      # parent commit when it is unusable (a branch's first push, a vanished
      # commit after a force-push).
      - name: Reject compiled binaries added by this change
        id: binaries
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${SHA}^"
              echo "push 'before' unusable — comparing against ${base}"
            fi
          fi
          .githooks/check-binary-files-ci.sh "${base}" "${SHA}"

      # Deliberately NOT --require: there is no control-plane checkout here and
      # a fork could not supply one. The skip is the expected path.
      - name: Validate committed electron/release.config.json values
        id: release-config
        continue-on-error: true
        run: node .github/scripts/sync-release-config.mjs --check

      - name: Unit-test .github/scripts
        id: script-tests
        continue-on-error: true
        run: node --test '.github/scripts/*.test.mjs'

      - name: Quick checks verdict
        id: quick
        if: ${{ !cancelled() }}
        env:
          BINARIES: ${{ steps.binaries.outcome }}
          RELEASE_CONFIG: ${{ steps.release-config.outcome }}
          SCRIPT_TESTS: ${{ steps.script-tests.outcome }}
        run: |
          failed=""
          for check in "binaries:${BINARIES}" "release-config:${RELEASE_CONFIG}" "script-tests:${SCRIPT_TESTS}"; do
            case "${check#*:}" in success|skipped) ;; *) failed="${failed} ${check}" ;; esac
          done
          if [ -n "${failed}" ]; then
            echo "::error::quick checks that did not pass:${failed} (see their steps above)"
            echo "result=failed:${failed}" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

  # proto-vendor/controlplane/ is a GENERATED `buf export` of control-plane's
  # public protos (.github/scripts/sync-controlplane-proto.mjs), and every
  # control-plane client here is generated from it.
  #
  # control-plane's CI runs this comparison on control-plane's commits; this job
  # is the other half: a PR that changes the vendored tree has to prove, on the
  # PR, that the tree is exactly what control-plane's main exports. Path-filtered
  # by `changes` to what can break that pairing from this side (the vendored
  # tree and the sync script). A control-plane proto change is control-plane's
  # gate to catch.
  #
  # Reading control-plane, which is private, uses CONTROL_PLANE_DEPLOY_KEY: the
  # private half of a READ-ONLY deploy key on reliant-labs/control-plane. Without
  # it the job FAILS rather than skipping: a drift gate that skips cannot be
  # told apart from one that passes. Fork PRs are the one exception (GitHub
  # never gives them secrets); control-plane's gate judges the tree on main.
  #
  # Ordering: with a strict gate on each side, one side's PR is red until the
  # other merges (control-plane's release skill, "The public proto contract is
  # gated from BOTH sides"). Re-run this job after the control-plane side lands.
  cp-contract:
    name: Vendored control-plane contract matches control-plane main
    needs: changes
    if: needs.changes.outputs.cp_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether this run can read control-plane
        id: access
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_KEY: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice title=control-plane contract not checked::Fork PRs get no secrets, so control-plane (private) cannot be read. control-plane's CI gates proto-vendor/controlplane/ once it reaches main."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_KEY}" != "true" ]; then
            echo "::error title=CONTROL_PLANE_DEPLOY_KEY is not configured::This PR changes proto-vendor/controlplane/, which must match control-plane main, and control-plane is private. Add a read-only deploy key to reliant-labs/control-plane and its private half as the CONTROL_PLANE_DEPLOY_KEY Actions secret here. This gate fails rather than skipping, because a skip would report success without checking anything."
            exit 1
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.access.outputs.check == 'true'

      - name: Check out control-plane main (private, read-only)
        if: steps.access.outputs.check == 'true'
        uses: actions/checkout@v6
        with:
          repository: reliant-labs/control-plane
          ref: main
          path: control-plane-sibling
          ssh-key: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false

      # The vendored tree is a byte-for-byte `buf export`, so both sides must run
      # the same buf: this matches control-plane's .github/actions/setup-buf pin.
      - name: Install buf
        if: steps.access.outputs.check == 'true'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: '1.57.0'
          github_token: ${{ github.token }}

      - name: Verify proto-vendor/controlplane/ matches control-plane main
        if: steps.access.outputs.check == 'true'
        env:
          CONTROL_PLANE_DIR: ${{ github.workspace }}/control-plane-sibling
        run: |
          set -euo pipefail
          control_plane_sha="$(git -C "${CONTROL_PLANE_DIR}" rev-parse --short HEAD)"
          echo "comparing against reliant-labs/control-plane main @ ${control_plane_sha}"
          node .github/scripts/sync-controlplane-proto.mjs --check --require || {
            echo "::error title=proto-vendor/controlplane/ differs from control-plane main (${control_plane_sha})::Re-vendor from a control-plane tree at origin/main: CONTROL_PLANE_DIR=<cp-tree> node .github/scripts/sync-controlplane-proto.mjs && make proto-generate-controlplane. If this PR deliberately vendors an unmerged control-plane branch, this fails until that branch merges. Re-run the job then."
            exit 1
          }

  # ── Generated code: both halves of the contract, in one job ───────────────
  #
  # .gitignore's "Generated code is committed" note makes the contract
  # explicit: a checkout must build as-cloned, and regenerating must be a
  # no-op. Every other job relies on the committed output instead of re-deriving
  # it, so this job proves the two agree. It is a hard gate: if regenerating
  # produces a diff, commit that diff in the change that caused it.
  #
  # Three checks, ONE job:
  #
  #   1. `make docs-generate-check` — every docs generator (the Makefile's
  #      DOCGEN_TARGETS: the CLI/tools/models/... references, the
  #      workflow-builder SKILL.md, the changelog and Mintlify pages), failing
  #      and naming every file it changes. `make test-affected` runs the same
  #      target locally, so the list exists once.
  #   2. `make generate-all` — every generator a contributor runs (protobuf with
  #      the pinned local plugins, then the docs again) — then `git status`
  #      must be clean.
  #   3. `make forge-generate-check` — forge.yaml's pinned `forge generate`
  #      (mocks, gen/forge_descriptor.json, harnesses, observability files),
  #      failing and naming every file it changes. It judges only what forge
  #      changes, so it still reports on a tree check 2 left dirty.
  #
  # They were two jobs. Merged, the second reuses the first's compile: both
  # build essentially the whole module (the CLI reference compiles every
  # command; forge validates with a full build), and that compile was most of
  # each job's 4-6 minutes. One runner, one queue wait, one warm build cache.
  #
  # Path-filtered by `changes`: a change confined to the frontends, electron,
  # research/dev-docs or CI plumbing cannot move a generator's input (the two
  # frontends/web/src paths generators WRITE still count). A forge bump "only" touches
  # go.mod but changes codegen output (cli.md at minimum), and go.mod is not in
  # the skip list, so it runs.
  #
  # THE FORGE CHECK RUNS ON MAIN ONLY. It cost 110-160s on top of everything
  # else here, which alone put this job past the five-minute PR budget. A PR
  # that leaves forge output stale goes red on main's very next run, and
  # gate-health.yml opens a `ci:main-red` issue for it; run
  # `make forge-generate-check` locally before pushing a proto, migration or
  # handler change.
  #
  # ITS OWN BUILD CACHE. The Makefile builds every generator with -trimpath,
  # which is part of every compile's cache key, so nothing here can reuse the
  # test jobs' package cache (go-cache job). This job keeps the entries it
  # used itself, saved on main (go-build-gen-*): compiled packages AND the
  # generators `go run` links, which Go caches. Trimmed exactly, the same way
  # (see the go-cache job).
  generated:
    name: Generated code is up to date
    needs: changes
    if: needs.changes.outputs.generated == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # The Makefile pins GOTOOLCHAIN to go.mod's version for generation, so
      # this must install that same version or `go` would download it again.
      # `cache: false`: see "CACHES ARE SAVED ON MAIN ONLY" on the backend job.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      # This job's own cache (the job header).
      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-gen-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-gen-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-gen-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # Main only: back-date every restored entry, so the trim after the
      # checks keeps exactly what they used (the go-cache job explains).
      - name: Back-date the restored Go build cache (main only)
        id: gen-cache-mark
        if: github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cache="$(go env GOCACHE)"; mkdir -p "${cache}"
          find "${cache}" -type f -exec touch -m -d '2 hours ago' {} +
          touch "${RUNNER_TEMP}/gocache-mark"

      # protoc-gen-es is a node script, pinned by tools/protoc-gen-es's
      # lockfile; `make` runs `npm ci` there itself.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/protoc-gen-es/package-lock.json

      # The Makefile builds buf from source at the version it pins, into a
      # versioned path it skips when present; forge runs `buf` from PATH
      # and the Makefile hands it that pinned build. The forge pin is read from
      # forge.yaml, which the check itself compares with go.mod.
      - name: Read pinned generator versions
        id: pins
        run: |
          set -euo pipefail
          echo "buf=$(sed -n 's/^BUF_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "forge=$(sed -n 's/^forge_version:[[:space:]]*//p' forge.yaml)" >> "$GITHUB_OUTPUT"
          echo "embedded_pg=$(sed -n 's|^[[:space:]]*github.com/fergusstrange/embedded-postgres \(v[^[:space:]]*\).*|\1|p' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned buf
        id: gen-bins
        uses: actions/cache/restore@v4
        with:
          path: ~/go/bin/buf-${{ steps.pins.outputs.buf }}
          key: gen-bins-${{ runner.os }}-${{ runner.arch }}-buf-${{ steps.pins.outputs.buf }}

      # Shared with the lint job: the same key. forge and its embedded
      # Postgres serve only the forge check, which is main-only.
      - name: Restore forge binary
        id: forge-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/go/bin/forge
          key: forge-${{ runner.os }}-${{ steps.pins.outputs.forge }}

      - name: Install forge
        if: github.event_name != 'pull_request' && steps.forge-cache.outputs.cache-hit != 'true'
        # GOPRIVATE: see the lint job's Install forge step.
        env:
          GOPRIVATE: github.com/reliant-labs/*
          GONOSUMDB: github.com/reliant-labs/*
          GONOSUMCHECK: "1"
        run: go install "github.com/reliant-labs/forge/cmd/forge@${{ steps.pins.outputs.forge }}"

      # forge generate starts an ephemeral Postgres to read the applied schema;
      # its binaries come from Maven Central unless this cache holds them, and
      # Maven answers a burst of runs with HTTP 429 (#1133 failed on it).
      # The archive is fixed by the embedded-postgres module version in
      # go.mod, NOT by the forge pin: keying on forge made every forge bump a
      # cold key, and a PR never saves, so the bump's own PR always fetched.
      # The archive's file name carries the postgres version, so the prefix
      # fallback is safe: a stale archive is simply not the one asked for.
      - name: Restore embedded Postgres binaries
        id: pg-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forge/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.embedded_pg }}
          restore-keys: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-

      # Check 1, first, so it judges the docs exactly as committed: every docs
      # generator (the Makefile's DOCGEN_TARGETS, the one list; make
      # test-affected runs the same check), failing and naming every file it
      # changes. A hand edit to a generated doc fails here.
      - name: Docs generators are a no-op (make docs-generate-check)
        run: make docs-generate-check DOCS_CHECK_FLAGS=--github

      - name: Regenerate everything (make generate-all)
        id: generate-all
        if: ${{ !cancelled() }}
        run: make generate-all

      # `git status`, not `git diff`: a generator that emits a NEW file (a new
      # proto, a new control-plane service) leaves it untracked, and `git diff`
      # cannot see untracked files.
      - name: Fail if generated code differs from what is committed
        if: ${{ !cancelled() && steps.generate-all.outcome == 'success' }}
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          if [ -n "${drift}" ]; then
            echo "::error::Generated code is out of date. Run 'make generate-all' and commit the result."
            echo "${drift}"
            echo "--- full diff (tracked files) ---"
            git diff
            exit 1
          fi
          echo "Generated code matches the committed output."

      # Runs whatever checks 1 and 2 concluded, so every verdict reports on one run.
      # FORGE: the cached binary; the check refuses it unless it reports the
      # pinned version.
      # Main only: the job header says why.
      - name: forge generate is a no-op (main only)
        if: ${{ !cancelled() && steps.generate-all.outcome == 'success' && github.event_name != 'pull_request' }}
        run: FORGE="$HOME/go/bin/forge" make forge-generate-check FORGE_CHECK_FLAGS=--github

      # Saves: main only, and after the checks — whatever they found, the tools
      # and the compile are good.
      - name: Save pinned buf (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gen-bins.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/go/bin/buf-${{ steps.pins.outputs.buf }}
          key: ${{ steps.gen-bins.outputs.cache-primary-key }}

      - name: Save forge binary (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.forge-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/go/bin/forge
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}

      - name: Save embedded Postgres binaries (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forge/embedded-postgres
          key: ${{ steps.pg-cache.outputs.cache-primary-key }}

      - name: Trim the Go build cache to what this job used (main only)
        if: ${{ !cancelled() && steps.gen-cache-mark.outcome == 'success' }}
        run: |
          set -euo pipefail
          cache="$(go env GOCACHE)"
          find "${cache}" -type f ! -newer "${RUNNER_TEMP}/gocache-mark" -delete
          du -sh "${cache}"; echo "$(find "${cache}" -type f | wc -l) files"

      - name: Save Go build cache (main only)
        if: ${{ !cancelled() && steps.gen-cache-mark.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # ── THE GO PACKAGE CACHE (main only) ──────────────────────────────────────
  #
  # Produces the build cache every test job restores: the backend shards, the
  # flake gate, lint and the e2e stories. Saved on main per commit; a PR
  # restores the newest. Off the PR path entirely: no PR waits for it.
  #
  # It holds COMPILED PACKAGES ONLY: every non-test package any test binary or
  # e2e story imports (standard library, modules, this module), and nothing
  # else. Not test variants (`p [q.test]`), not vet results, not linked tools.
  # On a PR those are dead weight: a selected package is selected BECAUSE it
  # depends on the change, so its test variants and its own test compile are
  # invalidated by construction, and an unselected package does not run. What
  # a PR can reuse is the plain compile of everything the change does not
  # reach. The previous cache kept everything every job touched, in two
  # flavours (the generators build with -trimpath), and grew to 17 GB on disk
  # (3.2 GB compressed): extracting it cost 57-224s in EVERY Go job, more than
  # the compile it saved. Packages alone: 2.9 GB on disk, 540 MB compressed,
  # restored in ~10-15s.
  #
  # Trimmed exactly: every restored entry is back-dated two hours before the
  # compile, so Go stamps each one it reads with the current time (it skips
  # that write for entries touched within the hour), and whatever is still
  # older than the compile afterwards is deleted.
  go-cache:
    name: Go package cache (main only)
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # THE MODULE CACHE TOO, WITHOUT ZIPS. The module cache holds every
      # module twice: the downloaded .zip and the tree extracted from it. A
      # build reads only the tree (plus the .ziphash that verifies it), so
      # the zips are dropped before saving: about half the archive, restored
      # by every Go job.
      - name: Restore Go module cache
        id: mod-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # `go list -export` compiles a package (and its dependencies) without
      # linking anything or compiling a test variant, with the flags the test
      # jobs compile with (-buildvcs=false; -short, -v, -timeout and -ldflags
      # do not change what is compiled). Build tags are not part of a
      # package's compile key, only of which files it has, so the e2e list
      # adds just what the stories reach that untagged tests do not. A
      # package that does not compile fails the job that tests it, which is
      # where that verdict belongs; the cache keeps everything that did.
      - name: Compile every package the tests import
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          GOFLAGS: -buildvcs=false
        run: |
          set -euo pipefail
          cache="$(go env GOCACHE)"; mkdir -p "${cache}"
          du -sh "${cache}"
          find "${cache}" -type f -exec touch -m -d '2 hours ago' {} +
          touch "${RUNNER_TEMP}/gocache-mark"
          # Every package a test binary imports, minus the test variants and
          # the generated test mains: the -test listing names them, -export
          # would compile them.
          regular() {
            go list -e -deps -test -f '{{if not .ForTest}}{{.ImportPath}}{{end}}' "$@" | grep -v '\.test$' | sort -u
          }
          regular ./... > "${RUNNER_TEMP}/pkgs.txt"
          regular -tags=e2e ./e2e/... > "${RUNNER_TEMP}/pkgs-e2e.txt"
          echo "$(wc -l < "${RUNNER_TEMP}/pkgs.txt") packages, $(wc -l < "${RUNNER_TEMP}/pkgs-e2e.txt") for the e2e stories"
          xargs go list -e -export -f '{{if .Error}}{{.ImportPath}}: {{.Error}}{{end}}' < "${RUNNER_TEMP}/pkgs.txt" || true
          xargs go list -e -export -tags=e2e -f '{{if .Error}}{{.ImportPath}}: {{.Error}}{{end}}' < "${RUNNER_TEMP}/pkgs-e2e.txt" || true
          find "${cache}" -type f ! -newer "${RUNNER_TEMP}/gocache-mark" -delete
          du -sh "${cache}"; echo "$(find "${cache}" -type f | wc -l) files"

      - name: Save Go build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # After the compile above has fetched every module a test imports
      # (not `go mod download`: over a zip-less cache it re-fetches every zip).
      - name: Drop the module zips
        if: steps.mod-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          du -sh ~/go/pkg/mod
          find ~/go/pkg/mod/cache/download -name '*.zip' -delete
          du -sh ~/go/pkg/mod

      - name: Save Go module cache
        if: steps.mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.mod-cache.outputs.cache-primary-key }}

  # ── Go unit tests, in two tiers ───────────────────────────────────────────
  #
  #   PR    go test -short over the packages `changes` selected
  #   main  go test over every package (push, nightly, dispatch)
  #
  # `-short` skips only tests that gate themselves on testing.Short(): ones that
  # wait out real production timeouts, start a NATS cluster or similar. DB-backed
  # tests still run on a PR, because REQUIRE_TEST_DB=1 overrides their
  # short-mode skip (internal/db/testutil.go, shortModeDBSkipReason). Nothing is
  # deleted: every short-gated test, and every package a PR did not reach, runs
  # on every push to main and every night.
  #
  # THE TIERS CANNOT SILENTLY MERGE. Three things hold them apart:
  #
  #   1. The job NAME carries the tier, so "Backend (Go, short) N/M" and
  #      "Backend (Go, full) N/M" are separate checks with separate histories.
  #   2. RELIANT_TEST_TIER is checked against the flag that actually reached
  #      `go test` by TestCITestTierReachedGoTest (tools/test-affected), which
  #      fails if the two disagree. A PR that edits this workflow runs every
  #      package, that test included.
  #   3. gate-health.yml's main audit fails, and opens an issue, unless main's
  #      newest run has every "Backend (Go, full) N/M" shard, 1 to M, green.
  #
  # SHARDED ACROSS UP TO SIX RUNNERS. The suite is CPU-bound on a 4-vCPU
  # runner, and most of a shard's time is linking and compiling one test
  # binary per package (shard.go, maxShards), so `changes` splits the selected
  # packages with `tools/test-affected shard`: as few shards as keep each under
  # its weight target (one for a small selection, six for the whole module), balanced by measured duration
  # (tools/test-affected/go-test-weights.tsv), slowest packages first. Every
  # package runs in exactly one shard (TestShardPartitionsEveryPackage).
  #
  # There is no separate per-tier aggregate job: it was one more runner and
  # one more queue wait at the tail of every run. `CI result` fails when a
  # shard did not pass, and on main also when no shard ran at all.
  backend:
    name: Backend (Go, ${{ github.event_name == 'pull_request' && 'short' || 'full' }}) ${{ matrix.shard }}/${{ matrix.shard_total }}
    needs: changes
    if: needs.changes.outputs.go_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports: one shard's failure must not hide another's.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.go_matrix || '{"include":[]}') }}
    # A REAL Postgres. Without it DATABASE_URL was unset here, every DB-backed
    # unit test skipped (1426 of them per run), and this job went green
    # regardless. That is how a test fixture that violated a foreign key added
    # in #464 reached main with CI green. REQUIRE_TEST_DB makes a skip a
    # failure, so it cannot go dark again.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant?sslmode=disable
      REQUIRE_TEST_DB: "1"
      RELIANT_TEST_TIER: ${{ github.event_name == 'pull_request' && 'short' || 'full' }}
    steps:
      - uses: actions/checkout@v6

      # CACHES ARE SAVED ON MAIN ONLY, and every job follows this pattern.
      #
      # A cache saved by a pull_request run is scoped to that PR's ref: no
      # other PR and not main can ever restore it. Saving one was pure cost
      # (~30-75s of "Post" steps on the PR's critical path) and it doubled the
      # repo's cache storage past GitHub's 10 GB cap, so caches main needed
      # were being evicted. Caches saved on main ARE visible to every PR. So:
      # restore everywhere, save only on main (push, the nightly), and only
      # when the exact key missed.
      #
      # setup-go's own `cache: true` cannot be split that way (it always saves
      # in its post step), so it is off, and the module cache and this job's
      # build cache are restored explicitly below.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # One module cache, shared by every Go job; the go-cache job saves it
      # on main. On a miss (a go.sum change) `go test` fetches just the
      # modules it lacks.
      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      # The package cache, restore only: the go-cache job saves it on main.
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # Generated code is COMMITTED: a checkout compiles and tests as-cloned,
      # so this job never runs the generators (the `generated` job proves the
      # committed output current, in parallel).

      # -ldflags=-w: no DWARF in the linked test binaries. Every package
      # links its own, and DWARF is most of a link's work; nothing here runs a
      # debugger, and stack traces come from the symbol table, not DWARF. A
      # link flag, so the build cache keys are unchanged.
      - name: Disable VCS stamping and test-binary DWARF
        run: echo "GOFLAGS=-buildvcs=false -ldflags=-w" >> "$GITHUB_ENV"

      # THE TEST POSTGRES SKIPS DURABILITY. The service container is thrown
      # away with the runner, so fsync buys nothing, and the DB-backed tests
      # are fsync-bound: every test copies a template database (CREATE
      # DATABASE ... TEMPLATE, WAL-logged), commits its writes and drops it,
      # hundreds of times per package (internal/db, the activity handlers and
      # the chat handlers took 80-166s each under -short, almost all of it
      # per-test database setup). All three settings reload without a
      # restart. Nothing a test asserts depends on crash durability.
      - name: Turn off fsync in the test Postgres
        run: >
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"

      # ripgrep is a genuine RUNTIME dependency of this job: internal/llm/tools
      # shells out to `rg`, and requireRipgrep() SKIPS those tests when it is
      # missing — so without it the job goes green having silently not run
      # them. ubuntu-latest does not ship it. A pinned, checksum-verified static
      # release build: `apt-get update && apt-get install` cost ~15s a job.
      - name: Install ripgrep
        run: |
          set -euo pipefail
          v=14.1.1; f="ripgrep-${v}-x86_64-unknown-linux-musl"
          curl -fsSL -o "${RUNNER_TEMP}/rg.tgz" "https://github.com/BurntSushi/ripgrep/releases/download/${v}/${f}.tar.gz"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${RUNNER_TEMP}/rg.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/rg.tgz" -C "${RUNNER_TEMP}" "${f}/rg"
          sudo install -m 0755 "${RUNNER_TEMP}/${f}/rg" /usr/local/bin/rg
          rg --version

      # The tier flags are the ONLY difference between the tiers, and they are
      # decided here, from RELIANT_TEST_TIER, nowhere else. An unknown tier is
      # an error rather than a default, so a typo cannot quietly pick one.
      #
      # The short tier also skips `go test`'s vet pass (-vet=off), like
      # golangci-lint: vet runs on main, in the full tier's `go test` and in
      # golangci-lint's govet over the whole module.
      - name: Go tests (exclude e2e, ${{ env.RELIANT_TEST_TIER }} tier, shard ${{ matrix.shard }}/${{ matrix.shard_total }})
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          case "${RELIANT_TEST_TIER}" in
            short) tier_flags=(-short -vet=off) ;;
            full)  tier_flags=() ;;
            *) echo "::error::RELIANT_TEST_TIER must be short or full, got '${RELIANT_TEST_TIER}'"; exit 1 ;;
          esac
          read -r -a pkgs <<< "${PACKAGES}"
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::this shard was launched with no packages"; exit 1
          fi
          echo "tier: ${RELIANT_TEST_TIER} (go test ${tier_flags[*]:-<no tier flag>}); shard ${{ matrix.shard }}/${{ matrix.shard_total }}: ${#pkgs[@]} package(s), slowest first:"
          printf '  %s\n' "${pkgs[@]}"
          go test -timeout=10m -v "${tier_flags[@]}" "${pkgs[@]}"

  # ── The new-flake gate ────────────────────────────────────────────────────
  #
  # A test that passes once and fails on a repeat is a flake. This repo's rule
  # is that "passed on re-run" is never acceptable, and the cheapest moment to
  # catch a flake is the PR that wrote it. So every Test function the PR adds
  # or edits (`tools/test-affected changed-tests`, by function, not by file)
  # runs three more times, in parallel with the shards. A test that relies on
  # leftover state, a fixed port, wall-clock timing or test order fails here
  # instead of on somebody else's main run a week later.
  flake-gate:
    name: New and changed Go tests (x3)
    needs: changes
    if: needs.changes.outputs.flake_targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant?sslmode=disable
      REQUIRE_TEST_DB: "1"
      RELIANT_TEST_TIER: short
      GOFLAGS: -buildvcs=false -ldflags=-w
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      # The package cache, restore only (the go-cache job saves it).
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # See the backend job.
      - name: Turn off fsync in the test Postgres
        run: >
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"

      # Same pinned build as the backend shards (see there).
      - name: Install ripgrep
        run: |
          set -euo pipefail
          v=14.1.1; f="ripgrep-${v}-x86_64-unknown-linux-musl"
          curl -fsSL -o "${RUNNER_TEMP}/rg.tgz" "https://github.com/BurntSushi/ripgrep/releases/download/${v}/${f}.tar.gz"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${RUNNER_TEMP}/rg.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/rg.tgz" -C "${RUNNER_TEMP}" "${f}/rg"
          sudo install -m 0755 "${RUNNER_TEMP}/${f}/rg" /usr/local/bin/rg

      - name: Run each new or changed test three times
        env:
          TARGETS: ${{ needs.changes.outputs.flake_targets }}
        run: |
          set -uo pipefail
          status=0
          while IFS=$'\t' read -r pkg pattern; do
            [ -n "${pkg}" ] || continue
            echo "::group::${pkg} -run '${pattern}' -count=3"
            if ! go test -short -count=3 -timeout=10m -run "${pattern}" "${pkg}"; then
              echo "::error title=Flaky or failing new test::${pkg} ${pattern} did not pass three runs in a row. A test that fails on a repeat is a flake; fix it at the root (shared state, a fixed port, wall-clock timing, test order)."
              status=1
            fi
            echo "::endgroup::"
          done <<< "${TARGETS}"
          exit "${status}"

  # Lint via FORGE rather than a raw golangci-lint pin, in its own job so it
  # runs beside the tests instead of in front of them.
  #
  # `forge lint` wraps golangci-lint (plus buf lint, the contract linter,
  # migration safety and forge's convention and drift lanes) and ships a
  # golangci-lint built against the Go it targets, so the toolchain-skew class
  # of failure goes away.
  #
  # It is a HARD GATE: every gating lane must pass. A finding is one the PR
  # introduced, so the PR fixes it, or states why it is a false positive with a
  # scoped //nolint (or a buf.yaml / .golangci.yml exclusion) and its reason.
  #
  # GOLANGCI-LINT AND BUF LINT RUN ON MAIN ONLY. golangci-lint loads and
  # type-checks every package it lints together with their dependencies:
  # ~240-420s unscoped, and still 251s scoped to 7 changed files under
  # internal/workflow (run 39672441706), whatever its analysis cache held. That
  # alone put a PR past five minutes. So a PR runs everything forge lint gates
  # on that is fast — the forge lanes below, ~12-40s together, over the whole
  # project — plus `go build ./...` (every package compiles, links nothing),
  # and main runs the full `forge lint` on every push. A golangci-lint or buf
  # finding a PR introduces turns main red one merge later (gate-health.yml
  # opens a `ci:main-red` issue); run `forge lint` locally before pushing Go
  # or proto changes.
  lint:
    name: Lint (forge)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOLANGCI_LINT_CACHE: /home/runner/.cache/golangci-lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      # `go build ./...` and golangci-lint read compiled packages, which the
      # package cache holds. Restore only (the go-cache job saves it).
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # buf is here because `forge lint` wraps buf lint alongside
      # golangci-lint; without it the lint step would quietly check less.
      - name: Install buf (main only)
        if: github.event_name != 'pull_request'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.57.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable VCS stamping
        run: echo "GOFLAGS=-buildvcs=false" >> $GITHUB_ENV

      # go.mod stays the single source of truth for the forge version: @latest
      # silently switched forge mid-release once, and a hardcoded version is a
      # second place to remember to bump.
      - name: Resolve forge version
        id: forge-version
        run: |
          set -euo pipefail
          FORGE_VERSION="$(go list -m -f '{{.Version}}' github.com/reliant-labs/forge)"
          echo "version=$FORGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "forge $FORGE_VERSION"

      # The BUILT binary keyed on the exact version, so the ~52s `go install`
      # happens once per forge bump. No restore-keys: a stale binary from a
      # different version is not a partial hit, it is the wrong linter.
      - name: Restore forge binary
        id: forge-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/bin/forge
          key: forge-${{ runner.os }}-${{ steps.forge-version.outputs.version }}

      - name: Install forge
        if: steps.forge-cache.outputs.cache-hit != 'true'
        # GOPRIVATE routes OUR OWN modules straight at GitHub instead of
        # proxy.golang.org: a freshly pushed tag takes the proxy ~20 MINUTES to
        # ingest, and until it does `go install ...@vX.Y.Z` fails with
        # "unknown revision". It also means the tag in git is the tag you
        # build (the proxy serves a deleted-and-re-cut tag forever). Scoped to
        # reliant-labs/*; third-party modules keep the proxy and checksum db.
        env:
          GOPRIVATE: github.com/reliant-labs/*
          GONOSUMDB: github.com/reliant-labs/*
          GONOSUMCHECK: "1"
        run: go install "github.com/reliant-labs/forge/cmd/forge@${{ steps.forge-version.outputs.version }}"

      - name: Save forge binary (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.forge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/go/bin/forge
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}

      # golangci-lint is forge's own pin, and forge lint builds it itself when
      # it is not installed. Cache that build under forge's tools cache, keyed
      # on the pin and the Go that builds it.
      - name: Resolve golangci-lint pin (main only)
        id: golangci
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          GOLANGCI_VERSION="$(forge tools pins golangci-lint)"
          echo "version=$GOLANGCI_VERSION" >> "$GITHUB_OUTPUT"
          echo "golangci-lint $GOLANGCI_VERSION"

      - name: Restore forge's golangci-lint build (main only)
        id: golangci-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forge/tools
          key: forge-tools-${{ runner.os }}-golangci-lint-${{ steps.golangci.outputs.version }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Restore golangci-lint analysis cache (main only)
        id: golangci-analysis
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/golangci-lint
          key: golangci-lint-analysis-${{ runner.os }}-${{ steps.golangci.outputs.version }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-analysis-${{ runner.os }}-${{ steps.golangci.outputs.version }}-go${{ steps.setup-go.outputs.go-version }}-

      # A PR: every package compiles (`go build` links nothing when given many
      # packages), so a change that breaks a package no test imports still
      # fails here.
      - name: Every package compiles (PR)
        if: github.event_name == 'pull_request'
        run: go build ./...

      # A PR: every gating forge lane except golangci-lint and buf lint (the
      # job header), over the whole project. migration-safety enforces
      # forge.yaml's database.migration_safety.require_compat_declaration
      # (internal/db/SCHEMA.md); graph is the composition graph, a
      # whole-project fact. --no-fix: gate only, rewrite nothing.
      - name: Forge lint lanes (PR; golangci-lint and buf on main)
        if: github.event_name == 'pull_request'
        run: >
          forge lint --no-fix --conventions --contract --migration-safety --generated-drift
          --create-nullability --computed-fields --read-only-fields --tracing --graph

      # Main: everything, golangci-lint and buf lint included.
      - name: Lint (forge)
        if: github.event_name != 'pull_request'
        run: forge lint --no-fix

      - name: Report the analysis cache size
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: du -sh "${GOLANGCI_LINT_CACHE}" 2>/dev/null || echo "no golangci-lint cache at ${GOLANGCI_LINT_CACHE}"

      # After the lint, and whatever it found: the builds and analyses are good.
      - name: Save forge's golangci-lint build (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.golangci-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forge/tools
          key: ${{ steps.golangci-cache.outputs.cache-primary-key }}

      - name: Save golangci-lint analysis cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.golangci-analysis.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/golangci-lint
          key: ${{ steps.golangci-analysis.outputs.cache-primary-key }}

  e2e-backend:
    name: E2E Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The stories need a REAL Postgres (and the Temporal dev server they start
    # themselves). Without this service DATABASE_URL was unset, TestMain
    # skipped every DB-backed story, and this job went green running exactly
    # one story out of eleven. REQUIRE_TEST_DB makes a skip a failure.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant?sslmode=disable
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-nozip-${{ runner.os }}-

      # The package cache, restore only: the go-cache job compiles what the
      # stories import (with -tags=e2e) into it on main.
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-pkgs-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # See the backend job for both.
      - name: Disable VCS stamping and test-binary DWARF
        run: echo "GOFLAGS=-buildvcs=false -ldflags=-w" >> "$GITHUB_ENV"

      - name: Turn off fsync in the test Postgres
        run: >
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"

      - name: Go E2E tests
        # -tags=e2e is REQUIRED: every file under ./e2e/stories carries
        # `//go:build e2e`, so without the tag the pattern matches NO packages.
        run: go test -tags=e2e -buildvcs=false -timeout=5m -v ./e2e/...

  web:
    name: Web (lint, typecheck, build)
    # Pure Node: npm lint, then the release's renderer build and artifact gate.
    # The generated TypeScript (frontends/web/src/gen/**) is COMMITTED, so nothing here is
    # derived from Go at build time. Runs on any change under frontends/web/, the root
    # Node manifests, electron/release.config.json (its build config) or
    # verify-bundle.mjs (`changes`).
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json

      - name: Install deps
        working-directory: frontends/web
        run: npm ci || npm install

      - name: Lint
        working-directory: frontends/web
        # Block PRs on lint errors, but allow warnings.
        run: npm run lint

      # ── The release's renderer build and artifact gate, on every PR. ──────
      #
      # v1.8.1's release failed at release.yml's "Verify the built bundle":
      # a `typeof window !== "undefined" ? window.location.origin : ""` minified
      # to verify-bundle's [2/4] dev-leak marker. This job had built a bare
      # `vite build` with no release config and never ran verify-bundle, so the
      # marker merged green and the check only ever ran once a tag was pushed.
      # So this job builds the bundle the way release.yml's prepare job does and
      # runs the same gate. `npm run build` is `tsc -b && vite build`, and that
      # `tsc -b` IS `npm run typecheck`, so type errors fail this step.
      #
      # NO SECRETS. Every hostname verify-bundle's [3/4] check expects comes
      # from release.config.json's `.vite` block, the file this step exports.
      #
      # .github/scripts/verify-bundle.test.mjs pins these steps to
      # release.yml's, so the two builds cannot drift apart silently.
      - name: Export renderer build config
        run: jq -er '.vite | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      # NODE_ENV=production is scoped to this command, exactly as in
      # release.yml. Never set it on `npm ci`, which would skip devDependencies,
      # vite and typescript among them.
      - name: Type check and build (as release.yml builds it)
        id: build
        working-directory: frontends/web
        run: NODE_ENV=production npm run build

      - name: Verify the built bundle (release.yml's artifact gate)
        run: node .github/scripts/verify-bundle.mjs --dist frontends/web/dist

      # Also uploaded when verification fails, so the offending asset can be
      # downloaded and grepped.
      - name: Upload build artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontends/web/dist
          retention-days: 1

  # vitest, over the files `changes` selected (or all of them), split across
  # runners. Most of a runner's time here is per-FILE jsdom setup and module
  # import, not test bodies, so it divides cleanly: `--shard=i/n` gives each
  # runner a disjoint, deterministic 1/n of the files: one runner per 150
  # selected files, at most four (`changes`).
  web-test:
    name: Web (vitest ${{ matrix.shard }}/${{ matrix.shard_total }})
    needs: changes
    if: needs.changes.outputs.vitest_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports: one shard's failure must not hide another's.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.vitest_matrix || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json

      - name: Install deps
        working-directory: frontends/web
        run: npm ci || npm install

      - name: Unit tests (shard ${{ matrix.shard }}/${{ matrix.shard_total }})
        working-directory: frontends/web
        env:
          CI: true
          FILES: ${{ needs.changes.outputs.vitest_files }}
        run: |
          set -euo pipefail
          mapfile -t files < <(grep . <<< "${FILES}" || true)
          echo "vitest: ${#files[@]} selected file(s) (0 = all)"
          npm test -- --run --shard=${{ matrix.shard }}/${{ matrix.shard_total }} "${files[@]}"

      - name: Upload vitest report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-artifacts-${{ matrix.shard }}
          path: |
            frontends/web/coverage
            frontends/web/test-results
          if-no-files-found: ignore

  # Playwright against the built renderer, no Go backend, single-worker (tests
  # share one preview server). ONE runner: it was two shards while seven
  # dev-only tests each waited out a 20s timeout to skip (#1204); since then the
  # whole suite runs in ~2 minutes, under the ~85s every extra runner spends on
  # npm ci, the build and the browsers. Path-filtered to web changes that are
  # not unit tests.
  e2e-frontend:
    name: E2E Frontend (Playwright)
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    # Not ubuntu-latest: it now resolves to ubuntu 26.04, which Playwright
    # 1.58 refuses (`Playwright does not support chromium on ubuntu26.04-x64`)
    # at `playwright install --with-deps`. Move to ubuntu-latest with the
    # Playwright release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json

      - name: Install deps
        working-directory: frontends/web
        run: npm ci || npm install

      # Restored everywhere, saved on main only (see the backend job).
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontends/web/package-lock.json') }}

      # The public KCL-sourced values only (VITE_SUPABASE_ANON_KEY is a
      # publishable client-side key committed in electron/release.config.json);
      # without it the auth-dependent tests cannot exercise auth.
      - name: Export renderer build config
        run: jq -er '.vite | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Build (alpha)
        working-directory: frontends/web
        run: npm run build:alpha

      - name: Install Playwright browsers
        working-directory: frontends/web
        run: npx playwright install chromium --with-deps

      - name: Save Playwright browsers (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run E2E tests
        working-directory: frontends/web
        env:
          CI: true
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontends/web/playwright-report
            frontends/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  electron:
    name: Electron (build smoke)
    # `dist:pr` runs with-release-config -> build:config -> build:web:alpha ->
    # electron-builder --dir; none of it compiles Go (electron/resources/server
    # is untracked and CI has never populated it). Path-filtered to electron/
    # and to what it bundles the renderer with; renderer source is the web
    # job's to build.
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontends/web/package-lock.json
            electron/package-lock.json

      - name: Install web deps
        working-directory: frontends/web
        run: npm ci || npm install

      - name: Install electron deps
        working-directory: electron
        run: npm ci || npm install

      # dist:pr routes through electron/scripts/with-release-config.mjs like
      # every other build target, so the PR build exercises the same config
      # path a release does (the class of defect that shipped v1.7.5).
      - name: Build electron app (no publish)
        working-directory: electron
        env:
          # Ensure CI doesn't require signing/notarization credentials
          CI: true
        run: npm run dist:pr

  # ── One verdict for the run, and where its time went ──────────────────────
  #
  # Green only when every job that ran passed; a skipped job (a lane the change
  # does not reach) is fine, a failed or cancelled one is not. This is the one
  # check worth requiring in branch protection: its name never changes when
  # jobs are added, split or path-filtered.
  #
  # The summary is the instrumentation: each job's queue wait and run time and
  # the run's wall time so far, so "CI is slow" can be answered from the run
  # page instead of re-derived from the API.
  ci-result:
    name: CI result
    needs: [changes, cp-contract, generated, go-cache, backend, flake-gate, lint, e2e-backend, web, web-test, e2e-frontend, electron]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Where the time went
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          run="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")" || exit 0
          jobs="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" --jq '.jobs[]' | jq -s .)" || exit 0
          created="$(jq -r .run_started_at <<< "${run}")"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "### Where the time went"
            echo
            echo "Wall time so far: **$(jq -rn --arg a "${created}" --arg b "${now}" '(($b|fromdate)-($a|fromdate)) as $s | "\($s/60|floor)m\($s%60)s"')**"
            echo
            echo "| job | queued | ran | finished at | result |"
            echo "|---|---:|---:|---:|---|"
            jq -r --arg c "${created}" '
              def secs(a; b): if a == null or b == null then null else ((b|fromdate) - (a|fromdate)) end;
              def fmt(s): if s == null then "–" else "\(s/60|floor)m\(s%60)s" end;
              sort_by(.completed_at // "9999") | .[]
              | select(.name != "CI result")
              | "| \(.name) | \(fmt(secs(.created_at; .started_at))) | \(fmt(secs(.started_at; .completed_at))) | \(fmt(secs($c; .completed_at))) | \(.conclusion // .status) |"
            ' <<< "${jobs}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          QUICK_CHECKS: ${{ needs.changes.outputs.quick_checks }}
        run: |
          set -euo pipefail
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "${RESULTS}")"
          # No selection was made at all: every lane's skip below is meaningless.
          if [ "$(jq -r .changes.result <<< "${RESULTS}")" != "success" ]; then
            bad="${bad}"$'\n'"changes: 'Detect what changed' did not succeed, so no lane was selected"
          fi
          # The quick checks run inside `changes` and never fail it (see there).
          if [ "${QUICK_CHECKS}" != "success" ]; then
            bad="${bad}"$'\n'"quick checks: ${QUICK_CHECKS:-no verdict} (see Detect what changed)"
          fi
          # Main runs every package: a skipped Go lane there is the full tier
          # not running, never a pass.
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "$(jq -r .backend.result <<< "${RESULTS}")" != "success" ]; then
            bad="${bad}"$'\n'"backend: the full Go tier must run and pass on ${EVENT_NAME}, got '$(jq -r .backend.result <<< "${RESULTS}")'"
          fi
          bad="$(grep . <<< "${bad}" || true)"
          if [ -n "${bad}" ]; then
            echo "::error::jobs that did not pass:"; echo "${bad}"
            exit 1
          fi
          echo "every job that ran passed"
