name: PR CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Catches what the pre-commit hook would have, for the cases where it did not
  # run: hooks are opt-in (make setup-hooks) and --no-verify skips them.
  no-binaries:
    name: No committed binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject compiled binaries added by this PR
        run: .githooks/check-binary-files-ci.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"

  # electron/release.config.json is GENERATED from control-plane's KCL
  # (deploy/kcl/lib/env.k). This validates the committed file so a hand-edit
  # that empties an endpoint, or points one at localhost, cannot reach a
  # release — the failure mode that shipped v1.7.5 with no control-plane URL.
  #
  # control-plane is private, so a fork cannot render the KCL to diff against.
  # The script detects that and validates the committed values instead of
  # failing on something an outside contributor cannot fix; the authoritative
  # drift comparison runs in control-plane's own CI, where the KCL lives.
  release-config:
    name: Release config (generated from KCL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate electron/release.config.json
        run: node .github/scripts/sync-release-config.mjs --check

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Generate Go code
        run: make generate-go

      - name: Disable VCS stamping
        run: echo "GOFLAGS=-buildvcs=false" >> $GITHUB_ENV

      - name: Install ripgrep
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      # Lint via FORGE rather than a raw golangci-lint pin.
      #
      # `forge lint` wraps golangci-lint (plus buf lint and the frontend
      # lint/typecheck) and ships a version built against the Go it targets, so
      # the toolchain-skew class of failure goes away. The previous pin —
      # golangci-lint v2.5.0, a go1.25 build — refused to start the moment
      # go.mod moved to 1.26.2:
      #   can't load config: the Go language version (go1.25) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.2)
      # That is exactly the maintenance forge exists to absorb.
      #
      # reliant is NOT a forge project (no forge.yaml) — forge is used here as
      # a toolchain, not a framework, which its lint command supports.
      #
      # NON-BLOCKING FOR NOW (`continue-on-error`). `forge lint` has no
      # only-new-issues mode, and this repo carries ~12 PRE-EXISTING findings
      # (gosec taint analysis, staticcheck SA4006, errcheck, goimports) that
      # predate this change. Gating on them would fail every PR from day one,
      # which is how a lint gate gets disabled wholesale instead of fixed.
      #
      # The findings are REPORTED on every PR so they stay visible and the
      # backlog shrinks. Flip this to a hard gate (drop continue-on-error) once
      # it reaches zero — that is a small, separate cleanup.
      - name: Install forge
        run: go install github.com/reliant-labs/forge/cmd/forge@latest

      - name: Lint (forge)
        continue-on-error: true
        run: forge lint --no-fix

      - name: Go tests (exclude e2e)
        run: |
          set -euo pipefail
          go test -buildvcs=false -timeout=10m -v $(go list -buildvcs=false ./... | grep -v '^github.com/reliant-labs/reliant/e2e$' | tr '\n' ' ')

  e2e-backend:
    name: E2E Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Generate Go code
        run: make generate-go

      - name: Disable VCS stamping
        run: echo "GOFLAGS=-buildvcs=false" >> $GITHUB_ENV

      - name: Install ripgrep
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Go E2E tests
        # -tags=e2e is REQUIRED: every file under ./e2e/stories carries
        # `//go:build e2e`, so without the tag the pattern matches NO packages
        # and `go test` exits 1 with "matched no packages" — a job that has
        # never actually run a single e2e test while reporting failure.
        run: go test -tags=e2e -buildvcs=false -timeout=5m -v ./e2e/...

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      - name: Install deps
        working-directory: web
        run: npm ci || npm install

      - name: Generate protobufs (TypeScript)
        run: buf generate --template buf.gen.yaml

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Generate docs and shortcuts
        run: make generate

      - name: Lint
        working-directory: web
        # Block PRs on lint errors, but allow warnings.
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        env:
          CI: true
        run: npm test -- --run

      - name: Upload vitest report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-artifacts
          path: |
            web/coverage
            web/test-results
          if-no-files-found: ignore

      - name: Build (alpha)
        working-directory: web
        run: npm run build:alpha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e-frontend:
    name: E2E Frontend (Playwright)
    runs-on: ubuntu-latest
    # Measured, not guessed: this job was cancelled at 15m in every one of
    # the last 50 runs that reached the test step (the other 8/50 died in
    # <3s on an unrelated `goose install` flake, now pinned — see below).
    # It was never a slow-but-passing job; the Playwright suite itself was
    # genuinely failing and playwright.config.ts's `retries: 2` (single
    # worker in CI) was tripling the cost of every failure.
    #
    # After this change (make generate scoped to generate-shortcuts, goose
    # pinned, browser cache added, one stale assertion fixed, two
    # non-test manual-QA scripts excluded from the run):
    #   - setup (checkout -> build -> browser install) measures ~2-3 min
    #   - the suite itself, run locally with CI's exact config (single
    #     worker, 2 retries, `CI=true`), takes 15.3 minutes wall clock —
    #     because 26 onboarding.spec.ts tests are genuinely failing against
    #     a refactored onboarding step model (see commit message) and each
    #     failure still costs 3 attempts.
    # 15+3 leaves no margin for CI-runner variance, so this is set to 20,
    # not bumped arbitrarily. It should come back down once onboarding.spec.ts
    # is rewritten against the current step model (tracked separately, not
    # in scope for this CI-infra fix) — at that point the real number is
    # close to 3-4 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      - name: Install deps
        working-directory: web
        run: npm ci || npm install

      - name: Generate protobufs (TypeScript)
        run: buf generate --template buf.gen.yaml

      - name: Install goose
        # Pinned to match the version in go.mod. This step was an unpinned
        # `@latest` install; every one of this job's non-timeout failures in
        # the last 50 runs (8/50) died here in <3s on a transient resolution
        # flake, not because the version drifted. Pinning removes the flake
        # source; it doesn't change behavior otherwise.
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.25.0

      - name: Generate shortcuts
        # Only `make generate-shortcuts` output is a build input for web/ —
        # web/src/store/shortcutsData.generated.ts, imported by
        # shortcutsStore.ts (confirmed: deleting it breaks `vite build` with
        # "Could not resolve ./shortcutsData.generated"). The full `make
        # generate` also builds 14 unrelated Go-side doc/reference targets
        # (CLI reference, tools reference, Mintlify pages, etc.) that this
        # job doesn't consume; that cost ~2.5-3 minutes of this job's budget
        # for no effect on the build or the tests.
        run: make generate-shortcuts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Without this the renderer builds with no VITE_SUPABASE_ANON_KEY, and
      # supabase-js throws `supabaseKey is required.` — previously at module
      # load, which left #root empty and timed out every test in the suite on a
      # blank page. web/src/lib/supabase.ts now defers that failure to first
      # use, so the app mounts either way; supplying the key here is what lets
      # the auth-dependent tests actually exercise auth.
      #
      # Same mechanism as release.yml's "Export renderer build config". These
      # are the public KCL-sourced values only — no secrets are layered on
      # here, because Playwright needs none of them. VITE_SUPABASE_ANON_KEY is
      # a publishable client-side key that already ships inside every desktop
      # build and is committed in electron/release.config.json.
      - name: Export renderer build config
        run: jq -er '.vite | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Build (alpha)
        working-directory: web
        run: npm run build:alpha

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: web
        env:
          CI: true
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  electron:
    name: Electron (build smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      - name: Install web deps
        working-directory: web
        run: npm ci || npm install

      - name: Generate protobufs (TypeScript)
        run: buf generate --template buf.gen.yaml

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Generate docs and shortcuts
        run: make generate

      - name: Install electron deps
        working-directory: electron
        run: npm ci || npm install

      - name: Build web (alpha)
        working-directory: electron
        run: npm run build:web:alpha

      - name: Build electron app (no publish)
        working-directory: electron
        env:
          # Ensure CI doesn't require signing/notarization credentials
          CI: true
        run: npx electron-builder --config electron-builder.pr.js --dir --publish=never