name: PR CI

# Runs on PRs AND on pushes to main.
#
# WHY THE PUSH TRIGGER EXISTS. This workflow was pull_request-only, so nothing
# verified main after a merge. TestReplayFixtures sat broken on main for WEEKS
# and only surfaced when an unrelated release PR went red against it — by which
# point the change that broke it was long buried, and the engineer who paid for
# it had nothing to do with it. A PR is tested against its merge BASE, not
# against the merge RESULT, so two independently-green PRs can still merge into
# a red main. Post-merge verification is the only thing that catches that, and
# it is also what gives `main` an authoritative last-known-good signal.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancellation is right for a PR and WRONG for main.
#
# On a PR, a new push obsoletes the previous run: cancel it and save the runner.
# github.ref is the PR ref, so every PR gets its own group and they never
# interfere.
#
# On main, grouping by ref with cancel-in-progress would let each merge kill the
# run before it, so a burst of merges leaves main with no verdict at all. That
# is why main used to get one group per COMMIT SHA, never cancelled. The cost
# was the opposite failure: a burst of N merges parked N full runs (10 jobs
# each) on runners, 285 jobs ended up cancelled and some sat ~2.7 hours, and
# because this repo shares the org's 20-concurrent-job limit with control-plane
# it starved control-plane's CI too.
#
# So all pushes to main share ONE group and nothing in it is cancelled once it
# starts: the run in progress always finishes and so always ends in a verdict.
# GitHub keeps at most ONE pending run per group and a newer push supersedes
# it, so a burst costs at most one extra run, not one per merge. The surviving
# run tests the newest main, which contains every superseded commit, so a break
# introduced by a skipped SHA is still caught; only the attribution is coarser
# (bisect the range between two verdicts). This mirrors control-plane's ci.yml.
concurrency:
  group: pr-ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ── What changed in this PR? ──────────────────────────────────────────────
  #
  # Exists to let the three PURE-NODE jobs (web, e2e-frontend, electron) skip
  # a PR that cannot possibly affect them — the release-chain version bump,
  # which touches go.mod + go.sum and nothing else (PR #237, "require forge +
  # forge/pkg v0.1.14", changed exactly those two files).
  #
  # WHY A JOB AND NOT `paths-ignore` — this is the load-bearing detail.
  #
  # `paths-ignore` prevents the workflow from being CREATED, so its checks
  # never report at all. A required status check that never reports is not a
  # pass, it is a PR that can never merge — and the usual fix under deadline
  # is to un-require the check, which quietly removes the gate for every
  # future PR too. A job that is skipped via `if:` still REPORTS (as skipped,
  # which branch protection accepts as satisfied), so the gate keeps working
  # and nothing has to be weakened.
  #
  # It is also per-JOB rather than per-workflow, which `paths-ignore` cannot
  # express: the Go jobs below deliberately keep running on a go.mod change,
  # because compiling against the new dependency is the entire point of the
  # bump.
  #
  # ON A PUSH TO MAIN the inputs are different and both PR-only: `github.base_ref`
  # is EMPTY (there is no base branch) and `github.event.pull_request.head.sha`
  # does not exist. Left as-is, `git merge-base "origin/" ""` would fail the step
  # under `set -euo pipefail` and take every dependent job down with it. The push
  # branch below uses `github.event.before`..`github.sha` instead — the range the
  # push actually introduced — and falls back to running everything whenever that
  # range is not usable (first push, force-push, or a `before` that is not an
  # ancestor after history rewriting). Every uncertain case resolves to "run more",
  # which is the safe direction.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # true when the PR touches ANYTHING that is not go.mod / go.sum.
      # Deliberately phrased as "is there any non-Go-module file", not "is
      # there a frontend file": the default on an unrecognised path is to RUN
      # the jobs. A new top-level directory nobody thought about makes this
      # true and everything runs, which is the safe direction to be wrong in.
      non_gomod: ${{ steps.filter.outputs.non_gomod }}
      # true when the change touches the vendored control-plane contract or the
      # script that produces it — the only changes in THIS repo that can move
      # proto-vendor/controlplane/ relative to control-plane. Unusable or empty
      # ranges set it true, like non_gomod.
      cp_contract: ${{ steps.filter.outputs.cp_contract }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "push" ]; then
            # A push has no base branch and no merge base. The right comparison
            # is the range the push introduced: event.before..sha.
            head="${PUSH_SHA}"
            base="${PUSH_BEFORE}"

            # event.before is all-zeroes on a branch's first push, and after a
            # force-push it can name a commit that no longer exists. Either way
            # the range is unusable, so run everything rather than guess.
            if [ -z "${base}" ] \
              || [ "${base}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "non_gomod=true" >> "$GITHUB_OUTPUT"
              echo "cp_contract=true" >> "$GITHUB_OUTPUT"
              echo "push with no usable 'before' (${base:-unset}) — running everything"
              exit 0
            fi
            echo "push range: ${base}..${head}"
          else
            head="${HEAD_SHA}"
            # Compare against the MERGE BASE, not the branch tip: a PR branched
            # from an older main must be judged on its own commits, otherwise
            # every unrelated commit that landed on main meanwhile counts as
            # "changed" and the skip never fires.
            base="$(git merge-base "origin/${BASE_REF}" "${head}")"
            echo "merge base: ${base}"
          fi

          changed="$(git diff --name-only "${base}" "${head}")"
          echo "--- changed files ---"
          echo "${changed}"
          echo "---------------------"

          # An EMPTY diff yields non_gomod=false, which would skip the Node
          # jobs. That is only reachable for an empty PR, but treat it as
          # "run everything" anyway rather than reasoning about whether an
          # empty PR is possible.
          if [ -z "${changed}" ]; then
            echo "non_gomod=true" >> "$GITHUB_OUTPUT"
            echo "cp_contract=true" >> "$GITHUB_OUTPUT"
            echo "empty diff — running everything"
            exit 0
          fi

          if echo "${changed}" | grep -qE '^(proto-vendor/controlplane/|\.github/scripts/sync-controlplane-proto\.mjs$|\.github/workflows/pr-ci\.yml$)'; then
            echo "cp_contract=true" >> "$GITHUB_OUTPUT"
            echo "touches the vendored control-plane contract — its drift gate runs."
          else
            echo "cp_contract=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "${changed}" | grep -qvE '^(go\.mod|go\.sum)$'; then
            echo "non_gomod=true" >> "$GITHUB_OUTPUT"
            echo "PR touches files beyond go.mod/go.sum — every job runs."
          else
            echo "non_gomod=false" >> "$GITHUB_OUTPUT"
            echo "go.mod/go.sum ONLY — the pure-Node jobs will skip."
            echo "Every Go job still runs: compiling and testing against the"
            echo "new dependency is the point of a version bump."
          fi

  # Catches what the pre-commit hook would have, for the cases where it did not
  # run: hooks are opt-in (make setup-hooks) and --no-verify skips them.
  no-binaries:
    name: No committed binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The script takes <base> <head> and inspects only files ADDED in that
      # range. `github.base_ref` is PR-only and EMPTY on a push, which would
      # pass the literal ref "origin/" — so the base is chosen per event.
      #
      # On push that base is `github.event.before`, falling back to the parent
      # commit (HEAD^) when `before` is unusable: all-zeroes on a branch's first
      # push, or a vanished commit after a force-push. A merge commit's HEAD^ is
      # the previous main, which is the range wanted anyway.
      - name: Reject compiled binaries added by this push
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          base="${PUSH_BEFORE}"
          if [ -z "${base}" ] \
            || [ "${base}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${PUSH_SHA}^"
            echo "push 'before' unusable — comparing against ${base}"
          fi
          .githooks/check-binary-files-ci.sh "${base}" "${PUSH_SHA}"

      - name: Reject compiled binaries added by this PR
        if: github.event_name == 'pull_request'
        run: .githooks/check-binary-files-ci.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"

  # electron/release.config.json is GENERATED from control-plane's KCL
  # (deploy/kcl/lib/env.k). This validates the committed file so a hand-edit
  # that empties an endpoint, or points one at localhost, cannot reach a
  # release — the failure mode that shipped v1.7.5 with no control-plane URL.
  #
  # WHAT THIS JOB DOES AND DOES NOT DO — the name used to overstate it.
  #
  # control-plane is private and this repo's CI has no checkout of it, so this
  # job can NEVER render the KCL and therefore NEVER compares against it. It
  # takes the skip branch on every single run. What it does verify is real but
  # narrower: that the committed values are shippable — every required VITE_*
  # and RELIANT_* key present, non-empty, and not pointed at localhost.
  #
  # The drift comparison — "does this file still match the KCL it was generated
  # from" — happens in control-plane's `ci.yml`, which checks this repo out as a
  # sibling and runs the same script with `--check --require`. `--require`
  # makes the skip branch a hard failure there, so that invocation cannot pass
  # by doing nothing the way this one structurally must.
  release-config:
    name: Release config values are shippable (drift checked in control-plane CI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Deliberately NOT --require: there is no control-plane checkout here and
      # a fork could not supply one. The skip is the expected path.
      - name: Validate committed electron/release.config.json values
        run: node .github/scripts/sync-release-config.mjs --check

  # proto-vendor/controlplane/ is a GENERATED `buf export` of control-plane's
  # public protos (.github/scripts/sync-controlplane-proto.mjs), and every
  # control-plane client here is generated from it.
  #
  # control-plane's CI already runs this comparison ("Validate KCL" → "Verify
  # reliant's vendored public proto matches this repo"). It runs only on
  # control-plane's commits, though, so a change made HERE was never judged here.
  # A re-vendor from a stale control-plane checkout, a hand edit, or a sync from
  # a control-plane branch that never merged all passed this repo's CI. Each one
  # surfaced later as a red control-plane main on some unrelated commit.
  #
  # This job is the other half. A PR that changes the vendored tree has to prove,
  # on the PR, that the tree is exactly what control-plane's main exports.
  #
  # Path-filtered by `changes` to what can break that pairing from this side:
  # proto-vendor/controlplane/ and the sync script. A PR touching neither cannot
  # move the tree relative to control-plane. A control-plane proto change is
  # control-plane's gate to catch.
  #
  # Reading control-plane, which is private, uses CONTROL_PLANE_DEPLOY_KEY: the
  # private half of a READ-ONLY deploy key on reliant-labs/control-plane (and
  # nothing else). A deploy key is scoped to that one repo, is not a person's
  # credential, and does not expire, which a PAT is not. Without it the job FAILS
  # rather than skipping: a drift gate that skips cannot be told apart from one
  # that passes, which is why control-plane passes --require. Fork PRs are the
  # one exception. GitHub never gives them secrets, so they are skipped with a
  # notice, and control-plane's gate judges the tree once it reaches main.
  #
  # Ordering: with a strict gate on each side, one side's PR is red until the
  # other merges (control-plane's release skill, "The public proto contract is
  # gated from BOTH sides"). Re-vendoring from a control-plane branch fails here
  # until that branch is on control-plane main. Re-run this job after it lands.
  cp-contract:
    name: Vendored control-plane contract matches control-plane main
    needs: changes
    if: needs.changes.outputs.cp_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether this run can read control-plane
        id: access
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_KEY: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice title=control-plane contract not checked::Fork PRs get no secrets, so control-plane (private) cannot be read. control-plane's CI gates proto-vendor/controlplane/ once it reaches main."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_KEY}" != "true" ]; then
            echo "::error title=CONTROL_PLANE_DEPLOY_KEY is not configured::This PR changes proto-vendor/controlplane/, which must match control-plane main, and control-plane is private. Add a read-only deploy key to reliant-labs/control-plane and its private half as the CONTROL_PLANE_DEPLOY_KEY Actions secret here. This gate fails rather than skipping, because a skip would report success without checking anything."
            exit 1
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.access.outputs.check == 'true'

      - name: Check out control-plane main (private, read-only)
        if: steps.access.outputs.check == 'true'
        uses: actions/checkout@v6
        with:
          repository: reliant-labs/control-plane
          ref: main
          path: control-plane-sibling
          ssh-key: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false

      # The vendored tree is a byte-for-byte `buf export`, so both sides must run
      # the same buf: this matches control-plane's .github/actions/setup-buf pin.
      - name: Install buf
        if: steps.access.outputs.check == 'true'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: '1.57.0'
          github_token: ${{ github.token }}

      - name: Verify proto-vendor/controlplane/ matches control-plane main
        if: steps.access.outputs.check == 'true'
        env:
          CONTROL_PLANE_DIR: ${{ github.workspace }}/control-plane-sibling
        run: |
          set -euo pipefail
          control_plane_sha="$(git -C "${CONTROL_PLANE_DIR}" rev-parse --short HEAD)"
          echo "comparing against reliant-labs/control-plane main @ ${control_plane_sha}"
          node .github/scripts/sync-controlplane-proto.mjs --check --require || {
            echo "::error title=proto-vendor/controlplane/ differs from control-plane main (${control_plane_sha})::Re-vendor from a control-plane tree at origin/main: CONTROL_PLANE_DIR=<cp-tree> node .github/scripts/sync-controlplane-proto.mjs && make proto-generate-controlplane. If this PR deliberately vendors an unmerged control-plane branch, this fails until that branch merges. Re-run the job then."
            exit 1
          }

  # The generators moved OFF the critical path, and this job is what keeps
  # that safe.
  #
  # .gitignore's "Generated code is committed" note makes the contract
  # explicit: a checkout must build as-cloned, and regenerating must be a
  # no-op. Every other job now relies on the committed output instead of
  # spending ~140s re-deriving it, so something has to prove the two agree —
  # otherwise stale generated code would ship silently, which is worse than a
  # slow build.
  #
  # This runs in PARALLEL with the test jobs rather than in front of them, so
  # it costs wall-clock only if it is the slowest job (it is not — measured
  # 20-65s for a full `make generate-all` locally, against 190s of Go tests).
  #
  # It is a hard gate: if regenerating produces a diff, the fix is to commit
  # that diff in the change that caused it.
  #
  # It runs `make generate-all` — EVERY generator, the exact command a
  # contributor runs — on every PR and every push to main, with no path filter.
  # Two consequences that used to be false:
  #
  #   - Nothing it runs is remote. The buf plugins are local `go tool` /
  #     tools/protoc-gen-es binaries pinned in this repo, and buf itself is
  #     the Makefile's pinned build, so the Buf Schema Registry's rate limit
  #     (`resource_exhausted`) can no longer fail it, and no BUF_API_KEY is
  #     needed. A path filter existed only to spare the BSR.
  #   - The docs references are gated too: cli.md (forge's command tree, so a
  #     forge pin bump changes it), models.md/.mdx, tools.md and the rest of
  #     `make generate`. Ungated, they drifted on main and every contributor
  #     who ran `make generate` inherited someone else's diff.
  #
  # DELIBERATELY NOT GATED on the `changes` job: a forge bump "only" touches
  # go.mod, but it CHANGES CODEGEN OUTPUT (cli.md, at minimum) — a real failure
  # mode this repo hit — and this job is the only thing that catches it.
  generate-drift:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      # The Makefile pins GOTOOLCHAIN to go.mod's version for generation, so
      # this must install that same version or `go` would download it again.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-drift-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-drift-${{ runner.os }}-

      # protoc-gen-es is a node script, pinned by tools/protoc-gen-es's
      # lockfile; `make` runs `npm ci` there itself.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/protoc-gen-es/package-lock.json

      # The Makefile builds buf and sqlc from source at the versions it pins,
      # into versioned paths it skips when present. Caching those two files
      # makes that a no-op on every run but the first after a bump.
      - name: Read pinned generator versions
        id: pins
        run: |
          set -euo pipefail
          echo "buf=$(sed -n 's/^BUF_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "sqlc=$(sed -n 's/^SQLC_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned buf and sqlc
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/buf-${{ steps.pins.outputs.buf }}
            ~/go/bin/sqlc-${{ steps.pins.outputs.sqlc }}
          key: gen-bins-${{ runner.os }}-${{ runner.arch }}-buf-${{ steps.pins.outputs.buf }}-sqlc-${{ steps.pins.outputs.sqlc }}

      - name: Regenerate everything
        run: make generate-all

      # The published docs are generated too: the CLI/tools/models/types
      # references, the changelog page and the Mintlify .mdx conversions. If a
      # change makes them stale, the fix is to commit the regenerated pages.
      - name: Generate docs
        run: >
          make generate-scenario-schema generate-cli generate-tools-ref
          generate-types generate-models generate-presets
          generate-workflow-builder-skill generate-changelog
          generate-mintlify-reference

      # `git status`, not `git diff`: a generator that emits a NEW file (a new
      # proto, a new control-plane service) leaves it untracked, and `git diff`
      # cannot see untracked files.
      - name: Fail if generated code differs from what is committed
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          if [ -n "${drift}" ]; then
            echo "::error::Generated code is out of date. Run 'make generate-all' and commit the result."
            echo "${drift}"
            echo "--- full diff (tracked files) ---"
            git diff
            exit 1
          fi
          echo "Generated code matches the committed output."

  backend:
    name: Backend (Go)
    # DELIBERATELY NOT GATED on the `changes` job. A dependency bump is
    # exactly the change this job exists to validate: a new forge/pkg can
    # break compilation or change behaviour, and that failure must surface
    # HERE, on the PR, rather than on main. Skipping Go tests on a go.mod
    # change would be strictly worse than a slow CI run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A REAL Postgres, for the same reason as the E2E job below. Without it
    # DATABASE_URL was unset here, every DB-backed unit test skipped (1426 of
    # them per run), and this job went green regardless. That is how a test
    # fixture that violated a foreign key added in #464 reached main with CI
    # green. REQUIRE_TEST_DB makes a skip a failure, so it cannot go dark again.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant?sslmode=disable
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # setup-go's `cache: true` caches the MODULE cache (~/go/pkg/mod) but
      # NOT the build cache (~/.cache/go-build), so every run recompiled the
      # whole dependency graph from source before a single test ran.
      #
      # Keyed on the resolved Go version + go.sum: a toolchain bump or a
      # dependency change invalidates it, which is exactly when the cached
      # objects stop being reusable. The restore-keys prefix means a go.sum
      # change still restores the previous cache and recompiles only what
      # actually changed, rather than starting cold.
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-backend-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-backend-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
            go-build-backend-${{ runner.os }}-

      # buf stays: `forge lint` wraps buf lint alongside golangci-lint, so
      # dropping it here would quietly reduce what the lint step checks.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.57.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          buf_api_token: ${{ secrets.BUF_API_KEY }}

      # Generated code is COMMITTED (see the "Generated code is committed"
      # note in .gitignore): a checkout compiles and tests as-cloned, and
      # regenerating is required to be a no-op. So this job does NOT need to
      # run the generators to build or test — that was ~140s of the critical
      # path producing, by contract, no change. Drift is caught by the
      # dedicated `generate-drift` job below, which runs in PARALLEL rather
      # than in front of the tests.
      #
      # goose was installed here for ~58s a job and never invoked: it is a
      # LIBRARY dependency (github.com/pressly/goose/v3, imported by
      # internal/db/connect.go, which embeds the migrations). Nothing in this
      # repo shells out to the goose BINARY except check-migrations.yml, which
      # installs it itself. Removed rather than cached.

      - name: Disable VCS stamping
        run: echo "GOFLAGS=-buildvcs=false" >> $GITHUB_ENV

      # ripgrep is a genuine RUNTIME dependency of this job: internal/llm/tools
      # shells out to `rg`, and requireRipgrep() SKIPS those tests when it is
      # missing — so without it the job goes green having silently not run
      # them. Installed from apt (prebuilt) rather than compiled from source.
      #
      # ubuntu-latest does not ship ripgrep, so the `command -v` guard this
      # replaces never once took its fast path.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Lint via FORGE rather than a raw golangci-lint pin.
      #
      # `forge lint` wraps golangci-lint (plus buf lint and the frontend
      # lint/typecheck) and ships a version built against the Go it targets, so
      # the toolchain-skew class of failure goes away. The previous pin —
      # golangci-lint v2.5.0, a go1.25 build — refused to start the moment
      # go.mod moved to 1.26.2:
      #   can't load config: the Go language version (go1.25) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.2)
      # That is exactly the maintenance forge exists to absorb.
      #
      # reliant is NOT a forge project (no forge.yaml) — forge is used here as
      # a toolchain, not a framework, which its lint command supports.
      #
      # NON-BLOCKING FOR NOW (`continue-on-error`). `forge lint` has no
      # only-new-issues mode, and this repo carries ~12 PRE-EXISTING findings
      # (gosec taint analysis, staticcheck SA4006, errcheck, goimports) that
      # predate this change. Gating on them would fail every PR from day one,
      # which is how a lint gate gets disabled wholesale instead of fixed.
      #
      # The findings are REPORTED on every PR so they stay visible and the
      # backlog shrinks. Flip this to a hard gate (drop continue-on-error) once
      # it reaches zero — that is a small, separate cleanup.
      # Resolve the forge version BEFORE the cache step, so the cache key can
      # be keyed on it. go.mod stays the single source of truth — @latest
      # silently switched forge mid-release once, and a hardcoded version is a
      # second place to remember to bump.
      - name: Resolve forge version
        id: forge-version
        run: |
          set -euo pipefail
          FORGE_VERSION="$(go list -m -f '{{.Version}}' github.com/reliant-labs/forge)"
          echo "version=$FORGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "forge $FORGE_VERSION"

      # Cache the BUILT binary keyed on the exact version, so the ~52s
      # `go install` from source happens once per forge bump instead of once
      # per run. No restore-keys: a stale binary from a different version is
      # not a partial hit, it is the wrong linter.
      - name: Cache forge binary
        id: forge-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/forge
          key: forge-${{ runner.os }}-${{ steps.forge-version.outputs.version }}

      - name: Install forge
        if: steps.forge-cache.outputs.cache-hit != 'true'
        # GOPRIVATE routes OUR OWN modules straight at GitHub instead of
        # proxy.golang.org. This is a real, measured delay, not a nicety: a
        # freshly pushed tag takes proxy.golang.org ~20 MINUTES to ingest, and
        # until it does, `go install ...@vX.Y.Z` fails with
        #   invalid version: unknown revision vX.Y.Z
        # on a tag that already exists and that `GOPROXY=direct` fetches
        # instantly. Because the release chain is forge -> reliant ->
        # control-plane, that stall is paid at EVERY hop of every release.
        #
        # It also removes a class of confusion the proxy's immutability
        # creates: a deleted-and-re-cut tag is served forever from its first
        # publish (that is how forge v0.1.12 became permanently unusable).
        # Going direct means the tag in git is the tag you build.
        #
        # Scoped to reliant-labs/* on purpose — third-party modules keep using
        # the proxy and the checksum database, which is where those are
        # actually worth having.
        env:
          GOPRIVATE: github.com/reliant-labs/*
          GONOSUMDB: github.com/reliant-labs/*
          GONOSUMCHECK: "1"
        run: go install "github.com/reliant-labs/forge/cmd/forge@${{ steps.forge-version.outputs.version }}"

      # The migration-safety lane alone IS a hard gate. It is clean, and it is
      # what enforces forge.yaml's
      # database.migration_safety.require_compat_declaration: every migration
      # after the baseline says whether the previous release keeps working on
      # the schema it leaves (internal/db/SCHEMA.md). It replaced a Go test,
      # so leaving it inside the non-blocking step below would have turned a
      # failing check into a warning.
      - name: Lint migrations (forge)
        run: forge lint --migration-safety

      - name: Lint (forge)
        continue-on-error: true
        run: forge lint --no-fix

      - name: Go tests (exclude e2e)
        run: |
          set -euo pipefail
          go test -buildvcs=false -timeout=10m -v $(go list -buildvcs=false ./... | grep -v '^github.com/reliant-labs/reliant/e2e$' | tr '\n' ' ')

  e2e-backend:
    name: E2E Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The stories need a REAL Postgres (the Temporal dev server they start
    # themselves). Without this service DATABASE_URL was unset, TestMain
    # skipped every DB-backed story, and this job went green running exactly
    # one story (09, which needs no DB) out of eleven. That is how
    # story_{08,10,11} stopped compiling after #292 without anything going
    # red until the compile error itself, and how stories 01/04/07 overwrote
    # each other's tool-call rows (shared scripted ids) for as long as they
    # existed. REQUIRE_TEST_DB below makes a skip a failure, so this gate
    # cannot go dark that way again.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant?sslmode=disable
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # See the backend job for why this is needed on top of setup-go's
      # module cache. Separate key prefix because this job compiles a
      # different package set (-tags=e2e), so sharing one cache entry would
      # have the two jobs evicting each other's objects.
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
            go-build-e2e-${{ runner.os }}-

      # buf is not needed here: nothing in this job generates code, and the
      # e2e tests run against the committed generated output.

      # Same reasoning as the backend job: generated code is committed, so the
      # generators are not a build input here, and the goose BINARY is never
      # invoked (goose is a library dependency). Both steps removed; drift is
      # covered by the parallel `generate-drift` job.

      - name: Disable VCS stamping
        run: echo "GOFLAGS=-buildvcs=false" >> $GITHUB_ENV

      - name: Go E2E tests
        # -tags=e2e is REQUIRED: every file under ./e2e/stories carries
        # `//go:build e2e`, so without the tag the pattern matches NO packages
        # and `go test` exits 1 with "matched no packages" — a job that has
        # never actually run a single e2e test while reporting failure.
        run: go test -tags=e2e -buildvcs=false -timeout=5m -v ./e2e/...

  web:
    name: Web (lint, test, build)
    # SAFE TO SKIP on a go.mod/go.sum-only PR. This job is pure Node — npm
    # lint / typecheck / vitest / vite build — with no Go toolchain in it at
    # all (see the note below on why the generators were removed). The
    # generated TypeScript under web/src/gen/** is COMMITTED, so nothing here
    # is derived from a Go dependency at build time. Changing the version of
    # a Go module cannot alter eslint, tsc, vitest or vite output.
    needs: changes
    if: needs.changes.outputs.non_gomod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # No Go toolchain and no buf here: with the generators gone (see below)
      # this job is pure Node — npm lint / typecheck / vitest / vite build.

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci || npm install

      # The generated TypeScript (web/src/gen/**, 44 files) and
      # web/src/store/shortcutsData.generated.ts are COMMITTED, so this job
      # lints, typechecks, tests and builds straight from the checkout.
      # Verified locally: `npm run typecheck` and `npm run build:alpha` both
      # succeed on a clean `git archive` of HEAD with no generator run.
      #
      # Removed from this job:
      #   - `buf generate` (TS protobufs) — output is committed
      #   - `go install goose` (~58s) — goose's BINARY is never invoked
      #     anywhere in this repo; it is a library dep of internal/db
      #   - `make generate` (~140s) — builds 14 Go-side docgen targets
      #     (CLI/tools/models/Mintlify reference…) that web/ does not consume
      #
      # Drift in any of that committed output is caught by the `generate-drift`
      # job, which runs in parallel.

      - name: Lint
        working-directory: web
        # Block PRs on lint errors, but allow warnings.
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        env:
          CI: true
        run: npm test -- --run

      - name: Upload vitest report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-artifacts
          path: |
            web/coverage
            web/test-results
          if-no-files-found: ignore

      - name: Build (alpha)
        working-directory: web
        run: npm run build:alpha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e-frontend:
    name: E2E Frontend (Playwright)
    # SAFE TO SKIP on a go.mod/go.sum-only PR, for the same reason as `web`:
    # this is a pure-Node job (vite build + Playwright against the built
    # renderer) and it starts NO Go backend. The suite drives the frontend
    # only, so no Go dependency version participates in the result.
    needs: changes
    if: needs.changes.outputs.non_gomod == 'true'
    runs-on: ubuntu-latest
    # Recent green runs take ~2 minutes (setup 2-3 min plus the suite), so 10
    # is ~4x typical. History: this was 20 when 26 onboarding.spec.ts tests were
    # genuinely failing and each failure cost 3 attempts (`retries: 2`, single
    # worker); that suite is healthy now, and a long-running job here means a
    # hang, which should fail fast rather than hold a runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Pure Node job now — no Go toolchain, no buf (see the note below).

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci || npm install

      # web/src/store/shortcutsData.generated.ts — the one generated file this
      # job's build genuinely needs (shortcutsStore.ts imports it; deleting it
      # breaks `vite build`) — is COMMITTED, as is the generated TypeScript
      # under web/src/gen/. So `make generate-shortcuts`, `buf generate` and
      # the goose install that supported them are all gone from this job;
      # `generate-drift` verifies the committed copies are current.

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Without this the renderer builds with no VITE_SUPABASE_ANON_KEY, and
      # supabase-js throws `supabaseKey is required.` — previously at module
      # load, which left #root empty and timed out every test in the suite on a
      # blank page. web/src/lib/supabase.ts now defers that failure to first
      # use, so the app mounts either way; supplying the key here is what lets
      # the auth-dependent tests actually exercise auth.
      #
      # Same mechanism as release.yml's "Export renderer build config". These
      # are the public KCL-sourced values only — no secrets are layered on
      # here, because Playwright needs none of them. VITE_SUPABASE_ANON_KEY is
      # a publishable client-side key that already ships inside every desktop
      # build and is committed in electron/release.config.json.
      - name: Export renderer build config
        run: jq -er '.vite | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Build (alpha)
        working-directory: web
        run: npm run build:alpha

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: web
        env:
          CI: true
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  electron:
    name: Electron (build smoke)
    # SAFE TO SKIP on a go.mod/go.sum-only PR. Verified from package.json
    # rather than assumed: `dist:pr` runs with-release-config -> build:config
    # -> build:web:alpha -> electron-builder --dir, and NONE of those compile
    # Go. The Go binaries would live in electron/resources/server, which is
    # untracked and which CI has never populated — this job has always
    # packaged an empty server dir (the comment below says as much). A Go
    # module bump therefore cannot change what it produces.
    needs: changes
    if: needs.changes.outputs.non_gomod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # No Go toolchain and no buf here. `npm run dist:pr` runs
      # build:config -> build:web:alpha -> electron-builder --dir; none of that
      # compiles Go. The backend binaries live in electron/resources/server,
      # which is UNTRACKED — CI has never populated it, so this job has always
      # packaged an empty server dir, and removing Go does not change what it
      # produces. (build:backend exists but is not on the dist:pr path.)
      #
      # Also removed: `buf generate` (committed TS output) and `make generate`
      # (~140s of Go docgen this job does not consume), plus the goose install
      # (~58s) whose binary is never invoked.

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci || npm install

      - name: Install electron deps
        working-directory: electron
        run: npm ci || npm install

      # One target, not a hand-assembled pair of steps.
      #
      # This used to be `npm run build:web:alpha` followed by a bare
      # `npx electron-builder`, which packaged whatever `web/dist` happened to
      # contain with NO release config exported — so the PR artifact was built
      # against undefined VITE_* endpoints and could not surface the class of
      # defect that shipped v1.7.5. dist:pr routes through
      # electron/scripts/with-release-config.mjs like every other build target,
      # so the PR build exercises the same config path a release does.
      - name: Build electron app (no publish)
        working-directory: electron
        env:
          # Ensure CI doesn't require signing/notarization credentials
          CI: true
        run: npm run dist:pr