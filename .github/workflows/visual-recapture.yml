name: Visual re-capture

# Re-capture a pull request's visual baselines and push them to its branch, on
# a hosted runner with docker (owner, 2026-11-24: a PR whose pixels change on
# purpose must not end at needs:human because whoever fixes it has no docker).
#
# Who starts it: control-plane's pr-fix, as the Reliant bot, when a PR's merge
# group failed only on the `Visual baseline` job (merge-queue.yml); or anyone
# with write access, by hand:
#
#   gh workflow run visual-recapture.yml --ref main -f pr=<n> -f head=<full head sha>
#
# Always dispatched on main (--ref main), so the workflow and the trusted step
# below are main's, never the PR's.
#
# TWO JOBS, ONE TRUST BOUNDARY. `capture` builds and runs the PR's code, so it
# holds contents: read and nothing else. It checks out the head, merges current
# main into it (the merge queue compares main plus the PR, so a capture on a
# stale base would fail again), runs `task test:web:visual --
# --update-snapshots=changed` in the pinned Playwright image (the baselines
# match the hosted runner byte for byte, reliant#3460), and uploads ONLY the
# baselines that changed. `push` runs none of the PR's code: it checks out
# main's .github/scripts, and visual-recapture-apply.sh accepts nothing but
# PNG files under frontends/web/e2e/visual/__screenshots__ (each checked),
# commits them onto the head, and pushes without force (a head that moved
# refuses it). It dispatches nothing: running a workflow on the PR's branch
# would run the PR's own definition of it, with this repository's secrets.
#
# THE PUSH IS THE RELIANT APP'S. The push job's GITHUB_TOKEN can only read; the
# push step alone gets an installation token of the Reliant App, minted for this
# one repository with contents: write (vars.RELIANT_APP_CLIENT_ID,
# secrets.RELIANT_APP_PRIVATE_KEY; revoked when the job ends). control-plane's
# push gate (cp#3624) trusts a same-repository head pushed by the bot, so the CI
# that follows the push (an App push starts `ci.yml` like any push; else
# pr-sweep's re-trigger) counts as trusted. A GITHUB_TOKEN push stays refused
# there, and this workflow makes none: without the App's credentials the push
# job fails and nothing is pushed. pr-review hears the push through the Reliant
# App's webhook and reviews the new head like any other.
#
# Every capture already matching is a result too (RECAPTURE=none): the visual
# failure came from an entry ahead in the queue, or a nondeterministic surface,
# which is deleted with a `flake:removed` issue, never re-captured to green
# (frontends/web/e2e/visual/README.md).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number
        required: true
        type: string
      head:
        description: The full head commit id to re-capture (the push refuses if the branch moved)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-recapture-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture on the head merged with main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a pull request number, not '$PR'"; exit 1; }
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head must be a full 40-character commit id"; exit 1; }
          read -r state sha repo base branch < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '[.state, .head.sha, .head.repo.full_name, .base.ref, .head.ref] | @tsv')
          [ "$state" = open ] || { echo "::error::#$PR is $state"; exit 1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::#$PR's head is in a fork ($repo): never re-captured here"; exit 1; }
          [ "$base" = main ] || { echo "::error::#$PR is based on $base, not main"; exit 1; }
          [ "$sha" = "$HEAD" ] || { echo "::error::#$PR's head is $sha, not $HEAD: it moved; dispatch again for the new head"; exit 1; }
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge current main into the head
        id: merge
        env:
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin main
          if ! git -c user.name=visual-recapture -c user.email=visual-recapture@invalid merge -q --no-edit origin/main; then
            echo "::error::#$PR conflicts with main: merge main into the branch first, then re-capture"
            exit 1
          fi
          echo "main=$(git rev-parse origin/main)" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
          github-read-token: ""
      - name: Re-capture the baselines that changed
        run: |
          set -euo pipefail
          pnpm install --dir frontends/web --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false --reporter=silent
          task test:web:visual -- --update-snapshots=changed
      - name: Collect them
        id: collect
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          MAIN: ${{ steps.merge.outputs.main }}
        run: |
          set -euo pipefail
          shots=frontends/web/e2e/visual/__screenshots__
          mkdir -p "$RUNNER_TEMP/recapture"
          printf 'head=%s\nmain=%s\n' "$HEAD" "$MAIN" >"$RUNNER_TEMP/recapture/manifest.txt"
          n=0
          while IFS= read -r -d '' f; do
            mkdir -p "$RUNNER_TEMP/recapture/$(dirname "$f")"
            cp -- "$f" "$RUNNER_TEMP/recapture/$f"; n=$((n + 1))
          done < <(git ls-files -z --modified --others --exclude-standard -- "$shots/*.png")
          echo "changed=$n" | tee -a "$GITHUB_OUTPUT"
          { echo "### visual re-capture of #$PR at \`$HEAD\` (merged with main \`$MAIN\`)"; echo
            if [ "$n" = 0 ]; then echo "Every capture already matches: nothing to push."
            else echo "$n baseline(s) changed:"; echo; git ls-files --modified --others --exclude-standard -- "$shots/*.png" | while IFS= read -r f; do printf -- '- %s\n' "$f"; done; fi
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-recapture
          path: ${{ runner.temp }}/recapture
          retention-days: 7
          if-no-files-found: error

  push:
    name: Commit them onto the head
    needs: capture
    if: needs.capture.outputs.changed != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: read: the push is the Reliant App's token, never this job's.
    permissions:
      contents: read
    steps:
      # main's scripts only: nothing from the PR runs in this job.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head }}
          path: pr
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: visual-recapture
          path: staged
      - name: Require the Reliant App's credentials
        env:
          HAS_ID: ${{ vars.RELIANT_APP_CLIENT_ID != '' }}
          HAS_KEY: ${{ secrets.RELIANT_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_ID" != true ] || [ "$HAS_KEY" != true ]; then
            echo "::error::the push is the Reliant App's: set the repository variable RELIANT_APP_CLIENT_ID and the secret RELIANT_APP_PRIVATE_KEY. Nothing was pushed; never a GITHUB_TOKEN push"
            exit 1
          fi
      # A token of the Reliant App for this repository alone, contents: write, used only by
      # the push step below (revoked when the job ends).
      - name: Mint the Reliant App's token for this repository
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELIANT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELIANT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ steps.app.outputs.token }}
          STAGED: ${{ github.workspace }}/staged
          TARGET: ${{ github.workspace }}/pr
          BRANCH: ${{ needs.capture.outputs.branch }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          trusted/.github/scripts/visual-recapture-apply.sh
