# Judges one commit of main by re-running only the Go tests that failed there.
#
# control-plane's main-revert workflow (scripts/main-revert/actions-bisect.sh,
# control-plane docs/pipeline/land-then-verify.md) dispatches it as the Reliant
# bot while it bisects a red main: one dispatch per candidate commit, found
# again by its run-name (which carries the token), judged by its conclusion
# (success = good, failure = failed) and by its log (`--- FAIL: <test>` /
# `FAIL\t<pkg>` tell a reproduced failure from a build error).
#
# Re-running a main push run cannot do this: a superseded main run is
# cancelled before any job exists, and a push-run rerun joins main's
# `ci-push-...` concurrency group, cancelling main's own pending run. So this
# workflow has no concurrency group (each dispatch is its own judgement, run in
# parallel with the others), and it is dispatch-only: it costs nothing unless
# dispatched and is never a required check.
name: Main bisect
run-name: main-bisect ${{ inputs.token }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to judge (40 lowercase hex)
        type: string
        required: true
      token:
        description: Correlation id the dispatcher finds the run by ([A-Za-z0-9-], 1-40)
        type: string
        required: true
      pkgs:
        description: Space-separated package directories relative to the repo root (`.` is the root), at most 20
        type: string
        required: true
      run:
        description: "`|`-separated top-level Go test names, at most 50; empty runs the whole packages"
        type: string
        required: false
        default: ""
      tags:
        description: Go build tags, comma-separated (e.g. integration)
        type: string
        required: false
        default: ""
      os:
        description: The runner to judge on
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
        default: ubuntu-latest
      race:
        description: Run with -race (ignored on windows)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # `|`, not `,`: fall back to the module's origin on ANY proxy error, as ci.yml.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  judge:
    name: Judge ${{ inputs.sha }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    # Inputs reach the scripts only through env, never interpolated into a
    # `run:` script (script injection).
    env:
      IN_SHA: ${{ inputs.sha }}
      IN_TOKEN: ${{ inputs.token }}
      IN_PKGS: ${{ inputs.pkgs }}
      IN_RUN: ${{ inputs.run }}
      IN_TAGS: ${{ inputs.tags }}
      IN_OS: ${{ inputs.os }}
      IN_RACE: ${{ inputs.race }}
    steps:
      - name: Validate inputs
        run: |
          invalid() { echo "MAIN_BISECT=invalid $*"; exit 1; }
          [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ ]] || invalid "sha must be 40 lowercase hex: '$IN_SHA'"
          [[ "$IN_TOKEN" =~ ^[A-Za-z0-9-]{1,40}$ ]] || invalid "token must match ^[A-Za-z0-9-]{1,40}\$: '$IN_TOKEN'"
          [[ "$IN_TAGS" =~ ^[a-z0-9_,]*$ ]] || invalid "tags must match ^[a-z0-9_,]*\$: '$IN_TAGS'"
          [[ "$IN_OS" == ubuntu-latest || "$IN_OS" == windows-latest ]] || invalid "os must be ubuntu-latest or windows-latest: '$IN_OS'"
          [[ "$IN_RACE" == true || "$IN_RACE" == false ]] || invalid "race must be true or false: '$IN_RACE'"
          read -ra pkgs <<<"$IN_PKGS"
          (( ${#pkgs[@]} >= 1 && ${#pkgs[@]} <= 20 )) || invalid "pkgs must name 1 to 20 packages, got ${#pkgs[@]}"
          for p in "${pkgs[@]}"; do
            [[ "$p" == . || "$p" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]] || invalid "package '$p' must be . or match ^[A-Za-z0-9_][A-Za-z0-9_./-]*\$"
            IFS=/ read -ra segs <<<"$p"
            for s in "${segs[@]}"; do [[ "$s" != .. ]] || invalid "package '$p' has a .. segment"; done
          done
          if [[ -n "$IN_RUN" ]]; then
            IFS='|' read -ra tests <<<"$IN_RUN"
            [[ "$IN_RUN" != *'|' ]] || invalid "run has an empty test name: '$IN_RUN'"
            (( ${#tests[@]} <= 50 )) || invalid "run must name at most 50 tests, got ${#tests[@]}"
            for t in "${tests[@]}"; do
              [[ "$t" =~ ^(Test|Example|Fuzz|Benchmark)[A-Za-z0-9_]*$ ]] || invalid "test name '$t' must match ^(Test|Example|Fuzz|Benchmark)[A-Za-z0-9_]*\$"
            done
          fi
          echo "MAIN_BISECT=valid sha=$IN_SHA token=$IN_TOKEN os=$IN_OS race=$IN_RACE tags=$IN_TAGS pkgs=$IN_PKGS run=$IN_RUN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      # As the setup action ci.yml's jobs share: go.mod's Go, and setup-go's
      # own cache off (its post step would save a cache from this run). No
      # cache restore: a re-run of a few tests does not need main's caches.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run the tests
        run: |
          args=(test -count=1)
          if [[ "$IN_RACE" == true && "$IN_OS" != windows-latest ]]; then args+=(-race); fi
          if [[ -n "$IN_TAGS" ]]; then args+=(-tags "$IN_TAGS"); fi
          if [[ -n "$IN_RUN" ]]; then args+=(-run "^(${IN_RUN})\$"); fi
          read -ra pkgs <<<"$IN_PKGS"
          for p in "${pkgs[@]}"; do
            if [[ "$p" == . ]]; then args+=(./); else args+=("./${p%/}/"); fi
          done
          echo "go ${args[*]}"
          set +e
          go "${args[@]}" 2>&1
          code=$?
          set -e
          echo "MAIN_BISECT_EXIT=$code"
          exit "$code"
