name: Release Electron App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        required: false
        default: false
        type: boolean
      prebuild_version:
        description: >-
          Prebuild this version (vX.Y.Z) from the dispatched commit (with dry_run: true):
          signed and notarized, published nowhere. rc-train dispatches it on an RC commit
          when the commit's release gate passes. When the repository variable
          ELECTRON_REUSE_PREBUILD is 'true', the tag push of vX.Y.Z on the same commit
          publishes these artifacts instead of building them again.
        required: false
        default: ""
        type: string

concurrency:
  group: releases
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read # find and download a prebuild's artifacts (prebuild_version)

env:
  # Optimize npm
  npm_config_fund: false
  npm_config_audit: false
  # Optimize Go
  GOFLAGS: "-trimpath"
  CGO_ENABLED: "0"

jobs:
  # ============================================================================
  # PREPARE: Build shared artifacts on fast Ubuntu runner
  # ============================================================================
  prepare:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      config: ${{ steps.config.outputs.config }}
      channel: ${{ steps.config.outputs.channel }}
      electron_version: ${{ steps.electron-versions.outputs.electron_version }}
      electron_builder_version: ${{ steps.electron-versions.outputs.electron_builder_version }}
      duration_seconds: ${{ steps.prepare-metrics.outputs.duration_seconds }}
      # A successful prebuild run of this tag's version on this tag's commit, whose
      # artifacts the platform jobs publish instead of building (empty: build).
      prebuilt_run: ${{ steps.prebuilt.outputs.run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # Full clone needed for tag-triggered workflows

      # PREBUILD (release-speed, control-plane designs/release-speed-2026-11-04.md):
      # rc-train dispatches this workflow with prebuild_version on the RC commit as
      # soon as its release gate passes, so the ~45m Electron build overlaps the
      # control-plane gate, the build and the deploy instead of starting at finalize.
      # A prebuild publishes nothing: it must be a dry run. Its marker artifact
      # (written after the renderer build, below) names the version, the commit
      # and the renderer's identity; the tag push reuses it only when all three
      # match. The decisions live in scripts/release-prebuild.sh, proven by
      # scripts/test-release-prebuild.sh.
      - name: Prebuild preconditions
        if: inputs.prebuild_version != ''
        env:
          V: ${{ inputs.prebuild_version }}
          DRY: ${{ inputs.dry_run }}
        run: bash scripts/release-prebuild.sh admit "$V" "$DRY" electron/package.json

      - name: Find a prebuild of this tag
        id: prebuilt
        if: github.ref_type == 'tag' && vars.ELECTRON_REUSE_PREBUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run="$(bash scripts/release-prebuild.sh find "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA")"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Record job start
        id: timing-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Load release endpoint config
        # Non-sensitive hostnames, projected from control-plane's KCL into the
        # generated electron/release.config.json. They are public facts a
        # packaged binary ships with and a `curl` reveals in seconds, so they
        # are reviewable in a diff rather than hidden in a secret.
        #
        # shell: bash is REQUIRED — windows-latest defaults to PowerShell,
        # where $GITHUB_ENV is not a shell variable.
        shell: bash
        run: jq -er '.main | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Validate release endpoints
        # Fails fast, once, before any platform build spends minutes on a
        # release that would ship a dead or unreachable hostname — this is
        # the check that would have caught api.reliant.so being NXDOMAIN.
        run: |
          node .github/scripts/validate-endpoint.mjs RELIANT_SERVER_URL "$RELIANT_SERVER_URL" --required
          node .github/scripts/validate-endpoint.mjs RELIANT_API_URL "$RELIANT_API_URL" --required
          node .github/scripts/validate-endpoint.mjs RELIANT_GATEWAY_URL "$RELIANT_GATEWAY_URL" --required
          # The platform-api origin now travels with the release too, so it
          # gets the same DNS + reachability check rather than only a
          # non-empty test — a dead domain passes "non-empty" (that is exactly
          # how api.reliant.so shipped).
          node .github/scripts/validate-endpoint.mjs RELIANT_CONTROL_PLANE_URL "$RELIANT_CONTROL_PLANE_URL" --required

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ inputs.prebuild_version }}" ]]; then
            echo "version=${{ inputs.prebuild_version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Detect release type and set config
        id: config
        run: |
          # A prebuild is named by its version, not its branch (release/vX-rc.N).
          TAG_NAME="${{ inputs.prebuild_version || github.ref_name }}"
          echo "Tag: $TAG_NAME"

          # The alpha channel is retired: every install follows `latest`
          # (electron/src/update-check.js, updateFeedFor). RC tags are
          # rc/vX.Y.Z-rc.N and never reach this workflow, so a prerelease-named
          # v* tag is a mistake. Refuse it rather than publish an RC to every
          # stable install. (A dispatch from a branch is named by the branch,
          # which may match by accident; it builds for latest like any other.)
          if [[ "${{ github.ref_type }}" == "tag" && $TAG_NAME =~ -rc\.|rc[0-9]+|-beta\.|beta[0-9]+|-alpha\.|alpha[0-9]+ ]]; then
            echo "::error::$TAG_NAME is a prerelease tag, and the alpha channel is retired. Release candidates are rc/vX.Y.Z-rc.N tags (rc-train); a v* tag publishes to the latest channel every install reads."
            exit 1
          fi
          echo "Stable release - using production config"
          echo "config=electron-builder.js" >> $GITHUB_OUTPUT
          echo "channel=latest" >> $GITHUB_OUTPUT

      - name: Install pnpm
        # The version that wrote frontends/web/pnpm-lock.yaml, read from the
        # root package.json's packageManager field. No `version:` here: the
        # action fails when one is named beside that field.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Extract Electron tool versions from package.json
        id: electron-versions
        run: |
          set -euo pipefail

          ELECTRON_VERSION=$(node -p "(require('./electron/package.json').devDependencies?.electron || require('./electron/package.json').dependencies?.electron || '')")
          ELECTRON_BUILDER_VERSION=$(node -p "(require('./electron/package.json').devDependencies?.['electron-builder'] || require('./electron/package.json').dependencies?.['electron-builder'] || '')")

          # Normalize common npm range prefixes for stable cache keys.
          ELECTRON_VERSION="${ELECTRON_VERSION#^}"
          ELECTRON_VERSION="${ELECTRON_VERSION#~}"
          ELECTRON_BUILDER_VERSION="${ELECTRON_BUILDER_VERSION#^}"
          ELECTRON_BUILDER_VERSION="${ELECTRON_BUILDER_VERSION#~}"

          if [[ -z "$ELECTRON_VERSION" || -z "$ELECTRON_BUILDER_VERSION" ]]; then
            echo "Failed to determine electron/electron-builder versions from electron/package.json" >&2
            exit 1
          fi

          echo "electron_version=$ELECTRON_VERSION" >> "$GITHUB_OUTPUT"
          echo "electron_builder_version=$ELECTRON_BUILDER_VERSION" >> "$GITHUB_OUTPUT"

          echo "Using Electron cache versions: electron=$ELECTRON_VERSION, electron-builder=$ELECTRON_BUILDER_VERSION"

      - name: Install web dependencies
        working-directory: frontends/web
        run: pnpm install --frozen-lockfile

      # NO CODE GENERATION HERE. Generated code is committed, and the gates
      # fail on any diff a regenerate makes: the merge gate whenever a change
      # reaches a generator's input, and the release gate (`task generate:check`,
      # `task generate:docs:check`) on the commit a release tags — so the tagged
      # commit already holds exactly what the generators produce, and a release
      # builds what was reviewed.
      #
      # This job used to regenerate anyway, which could only ever ship
      # UNREVIEWED code: protoc-gen-go/-connect-go `@latest` instead of the
      # go.mod pins, remote buf plugins on the rate-limited Buf Schema
      # Registry, and a cache keyed on proto/ alone that, on a hit, restored
      # a frontends/web/src/gen from some earlier release over the committed one.

      # The renderer's build-time config, from control-plane's KCL.
      #
      # THIS REPLACES A HAND-WRITTEN `.env` HEREDOC. That heredoc listed 15
      # variables; the app reads 22, so the packaged renderer shipped with
      # VITE_CONTROL_PLANE_API_URL and VITE_GATEWAY_URL simply undefined —
      # confirmed by grepping the released v1.7.5 .dmg, whose 87 renderer
      # assets contain `api.reliantapi.com` but neither `admin.reliantapi.com`
      # nor `gateway.reliantapi.com`. That is what made coupons throw
      # "Control plane API URL not configured" on the desktop app.
      #
      # electron/release.config.json is GENERATED from control-plane's
      # deploy/kcl/lib/env.k by .github/scripts/sync-release-config.mjs, and its
      # `renderer` block carries the SAME runtime_config keys the hosted app is
      # served. The step below verifies it has not drifted.
      - name: Verify release config matches control-plane KCL
        run: node .github/scripts/sync-release-config.mjs --check

      # No renderer build config is exported: the bundle reads every
      # per-environment value from config.js at runtime (R2a), and the
      # packaged app's config.js is answered by its main process from
      # release.config.json's `renderer` block (electron/src/runtime-config.js,
      # written by generate-build-config.mjs in each platform job). The one
      # build-time value is VITE_APP_VERSION, from scripts/release-identity.sh.

      # `build`, not `build:alpha` — the difference is `tsc -b`.
      #
      # build:alpha is bare `vite build`, which type-checks NOTHING. Because
      # the Electron path went through it (electron's build:web calls
      # build:alpha), the desktop release never type-checked, and 20 type
      # errors accumulated on main while builds kept "succeeding". The web
      # deploy runs plain `npm run build` and caught them; the release did not.
      #
      # A release is the LAST place to skip the check, so it runs the same
      # gate the hosted frontend does.
      - name: Build React frontend
        # NODE_ENV=production is scoped to this command, NOT the step, and NOT
        # the job. Vite honours NODE_ENV even under `vite build`, so a leaked
        # `development` folds `import.meta.env.DEV` to TRUE inside a production
        # bundle; isSameOriginTransport() then survives DCE and the packaged
        # app POSTs its RPCs at app://bundle, where there is no proxy — the
        # SPA fallback answers with index.html and the app hangs with every
        # request returning 200. verify-bundle's [2/4] assertion catches it,
        # and this makes it not happen in the first place.
        #
        # A fresh runner does not set NODE_ENV, so this is belt-and-braces
        # HERE — but it is load-bearing on any machine that does, which is why
        # control-plane's deploy-reliant-web.yml has carried it since the
        # hosted site broke this exact way. The two paths build the SAME
        # bundle; they should not disagree about the one variable that decides
        # whether it is a production build.
        #
        # Never set on `npm ci`/`npm install`: npm reads the same variable and
        # skips devDependencies, removing vite and typescript themselves.
        #
        # RELEASE_VERSION names the release to the renderer's identity resolver
        # (vite-plugin-version-json.ts -> scripts/release-identity.sh --tag). A
        # prebuild runs on the RC commit before its tag exists, so without it the
        # renderer would embed a dev identity and ship it inside the release.
        env:
          RELEASE_VERSION: ${{ startsWith(steps.version.outputs.version, 'v') && steps.version.outputs.version || '' }}
        working-directory: frontends/web
        run: NODE_ENV=production npm run build

      # A release's renderer reports exactly the release (version.json); for a
      # prebuild the marker records it, and the tag push reuses only a match.
      - name: Verify the renderer's release identity
        if: startsWith(steps.version.outputs.version, 'v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          got="$(jq -r .version frontends/web/dist/version.json)"
          [ "$got" = "${VERSION#v}" ] || { echo "::error::the renderer reports version '$got', not ${VERSION#v}"; exit 1; }

      - name: Write the prebuild marker
        if: inputs.prebuild_version != ''
        run: bash scripts/release-prebuild.sh marker "${{ inputs.prebuild_version }}" "$GITHUB_SHA" frontends/web/dist prebuild/prebuild.json

      - name: Upload the prebuild marker
        if: inputs.prebuild_version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuild-${{ inputs.prebuild_version }}
          path: prebuild/prebuild.json
          retention-days: 7

      # ── The artifact gate. Asserts on the BUILT BUNDLE, not the source. ────
      #
      # This runs HERE, in prepare, deliberately: it is one job that precedes
      # the three-platform matrix, so a bad bundle stops all three builds
      # instead of being packaged into a macOS, a Linux and a Windows
      # installer. `00a8698a` unthrottled that matrix specifically to save ~7
      # minutes; failing before it is worth more than failing inside it.
      #
      # Everything it checks is invisible in source review and produces a
      # green build — a missing VITE_* injection (the v1.7.5 coupon outage), a
      # leaked NODE_ENV=development, a relative asset base that white-screens
      # every 2+-segment OAuth and billing return URL. The expected endpoints
      # are DERIVED from electron/release.config.json, the same file exported
      # into the build env above, so there is no second list to keep in sync.
      #
      # Cost is a grep over dist/assets: sub-second, on a build already paid
      # for.
      #
      # ci.yml's `web-bundle` job (`task build:web:verify`) runs this same build
      # and this same check on every PR that can alter the bundle and every
      # push to main (pinned by .github/scripts/verify-bundle.test.mjs),
      # so a failure that first shows up here means the two have diverged. If
      # this run fails anyway, release-health.yml opens a `release:failed`
      # issue for the tag.
      - name: Verify the built bundle
        run: node .github/scripts/verify-bundle.mjs --dist frontends/web/dist

      # ── The renderer's source maps go to the platform, not the installers ──
      #
      # vite builds the renderer with `sourcemap: true`. Unfiled, a desktop
      # release's browser errors are never symbolicated: their culprits are
      # app://bundle/assets/main-<hash>.js, the content hash changes every
      # build, so every desktop release re-opens a copy of every browser issue
      # (reliant#2535). The `sourcemaps` job below files them from this
      # artifact, on a release tag only: a prebuild publishes nothing.
      #
      # MAPS AND INSTALLERS COME FROM ONE BUILD. A tag that reuses a prebuild
      # ships the PREBUILD's renderer, and a rebuild is not the same bytes (the
      # bundle embeds its build time, vite-plugin-version-json.ts
      # __RELIANT_BUILD__, so every content-hashed chunk differs). So a
      # prebuild uploads its maps too, kept as long as its marker, and the
      # sourcemaps job files the prebuild's when the tag publishes the
      # prebuild's installers (internal/version/release_sourcemaps_test.go).
      - name: Upload the renderer's source maps
        if: startsWith(steps.version.outputs.version, 'v') && (github.ref_type == 'tag' || inputs.prebuild_version != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist-sourcemaps
          path: frontends/web/dist
          retention-days: 7
          compression-level: 6

      # The installers ship the bundle without its maps: they serve nothing
      # there (the platform symbolicates from the registry) and only add size
      # and readable source to every download. The bundles keep their
      # sourceMappingURL comments, which a missing file leaves inert.
      - name: Keep source maps out of the installers
        if: startsWith(steps.version.outputs.version, 'v')
        run: |
          set -euo pipefail
          n="$(find frontends/web/dist -type f -name '*.map' | wc -l)"
          find frontends/web/dist -type f -name '*.map' -delete
          echo "Removed $n source map(s) from frontends/web/dist"

      - name: Upload web build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: frontends/web/dist
          retention-days: 1
          compression-level: 6 # Faster upload with good compression

      - name: Upload generated backend sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-backend-sources
          # `gen/` is TOP-LEVEL, not internal/gen — buf.gen.yaml writes
          # `out: gen`, and gen/controlplane/ is gitignored, so the backend
          # jobs cannot get it from the checkout and it has to travel as an
          # artifact. The stale `internal/gen` path (a layout this repo moved
          # away from) uploaded nothing, and every build-backend leg failed
          # with "no required module provides package
          # github.com/reliant-labs/reliant/gen/controlplane/v1".
          path: |
            gen
            internal/workflow/v3/reference
            internal/workflow/runtime/schema/field_descriptions.go
          retention-days: 1
          compression-level: 0

      - name: Prepare job timing and cache summary
        id: prepare-metrics
        if: always()
        run: |
          END_TS=$(date +%s)
          START_TS=${{ steps.timing-start.outputs.ts }}
          DURATION=$((END_TS - START_TS))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⏱️ Prepare Job Metrics

          - **Job:** Build Web
          - **Duration:** ${MINS}m ${SECS}s
          EOF

  # ============================================================================
  # BACKEND BINARIES: Matrix build (full-width fan-out)
  # ============================================================================
  # ============================================================================
  # SOURCEMAPS: file the renderer's source maps so its prod errors symbolicate
  # ============================================================================
  # `task release:sourcemaps` (forge ui sourcemaps push) into the platform
  # registry, under the env the desktop app reports into: tenant zero's prod,
  # frontend `desktop`, build id = the version the renderer reports
  # (reliant#2535). The credential is RELIANT_SOURCEMAPS_TOKEN, an org token
  # whose only scope is sourcemaps:write (registry-only: refused on every
  # control-plane RPC, push and pull on the org's *-sourcemaps repositories
  # only), stored as a secret of the `release` environment so only this job
  # can read it. Until it exists the job warns and files nothing.
  #
  # Best effort by design (continue-on-error): unfiled maps leave this
  # release's renderer errors unsymbolicated, which is today's state, and
  # must never fail a release that otherwise shipped (release-health.yml
  # opens `release:failed` for a red run).
  sourcemaps:
    name: File renderer source maps
    needs: prepare
    if: github.ref_type == 'tag' && startsWith(needs.prepare.outputs.version, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    environment: release
    permissions:
      contents: read
      actions: read # download web-dist-sourcemaps, from this run or the prebuild's
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Task and Go
        uses: ./.github/actions/setup
        with:
          postgres-cache: "false"

      # The maps of the renderer this release ships: this run's build, or,
      # when the tag publishes a prebuild's installers, that prebuild's.
      - name: Download the renderer's source maps
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist-sourcemaps
          path: frontends/web/dist

      - name: Download the prebuild renderer's source maps
        if: needs.prepare.outputs.prebuilt_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist-sourcemaps
          path: frontends/web/dist
          run-id: ${{ needs.prepare.outputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: File the source maps
        env:
          FORGE_CONTROL_PLANE_TOKEN: ${{ secrets.RELIANT_SOURCEMAPS_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          # Where the maps are filed: the org and forge project of the env the
          # renderer reports into. Repository variables override the defaults
          # in Taskfile.yml's release:sourcemaps.
          SOURCEMAPS_ORG: ${{ vars.RELIANT_SOURCEMAPS_ORG }}
          SOURCEMAPS_PROJECT: ${{ vars.RELIANT_SOURCEMAPS_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$FORGE_CONTROL_PLANE_TOKEN" ]; then
            echo "::warning::RELIANT_SOURCEMAPS_TOKEN is not set on the release environment: the renderer's source maps of $VERSION are not filed, so its prod errors stay unsymbolicated (reliant#2535)"
            exit 0
          fi
          got="$(jq -r .version frontends/web/dist/version.json)"
          [ "$got" = "${VERSION#v}" ] || { echo "::error::the renderer reports version '$got', not ${VERSION#v}: maps filed under another build id are never looked up"; exit 1; }
          task release:sourcemaps DIST=frontends/web/dist BUILD_ID="${VERSION#v}" \
            ${SOURCEMAPS_ORG:+ORG="$SOURCEMAPS_ORG"} ${SOURCEMAPS_PROJECT:+PROJECT="$SOURCEMAPS_PROJECT"}

  build-backend:
    name: Build backend (${{ matrix.target_os }}-${{ matrix.target_arch }})
    needs: prepare
    if: needs.prepare.outputs.prebuilt_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # fail-fast: false so ONE broken target reports its own failure instead of
      # cancelling the other five — you want all six results from a release run.
      fail-fast: false
      #
      # DELIBERATELY UNTHROTTLED — do not re-add `max-parallel`.
      #
      # These are six independent `go build` invocations that share nothing: no
      # registry, no signing service, no notarization, no rate-limited third
      # party. Every step in this job is a GitHub-native action
      # (checkout / setup-go / download-artifact / upload-artifact), so there is
      # no external quota for a throttle to protect.
      #
      # Nor is there a runner quota to protect. This org is on the GitHub Free
      # plan: 20 concurrent jobs, of which 5 may be macOS. Six ubuntu-latest
      # legs sit well inside that, and the `concurrency: releases` group at the
      # top of this file already serializes whole release runs, so two of these
      # matrices can never overlap.
      #
      # The previous `max-parallel: 2` cost ~7 minutes of pure waiting on every
      # release. Each leg takes ~3 minutes, but the throttle stair-stepped them
      # into ~10 (measured on the v1.7.11 run: linux pair 04:40:50-04:44:00,
      # then darwin 04:43:59, then windows 04:46:53, with the last leg not
      # finishing until 04:50:09). The three packaging jobs below are gated on
      # the whole matrix, so they inherit every second of that delay.
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            artifact_name: backend-linux-amd64
          - target_os: linux
            target_arch: arm64
            artifact_name: backend-linux-arm64
          - target_os: darwin
            target_arch: amd64
            artifact_name: backend-darwin-amd64
          - target_os: darwin
            target_arch: arm64
            artifact_name: backend-darwin-arm64
          - target_os: windows
            target_arch: amd64
            artifact_name: backend-windows-amd64
          - target_os: windows
            target_arch: arm64
            artifact_name: backend-windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Load release endpoint config
        # shell: bash is REQUIRED — windows-latest defaults to PowerShell,
        # where `grep` does not exist and $GITHUB_ENV is not a shell variable.
        # The step still reported success there while setting nothing, so the
        # build-config generator ran with empty endpoints and failed. GitHub
        # ships bash on the Windows runners, so this works on all three.
        shell: bash
        run: jq -er '.main | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download generated backend sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-backend-sources
          # `.`, not `internal`: upload-artifact roots a multi-path artifact at
          # the least common ancestor of its paths. Now that top-level `gen/`
          # is in that set, the ancestor is the REPO ROOT, so the archive
          # already carries the `gen/…` and `internal/…` prefixes. Unpacking
          # into `internal` would bury them at internal/gen and
          # internal/internal, and the build fails on the missing
          # gen/controlplane/v1 package.
          path: .

      - name: Disk usage before backend build
        run: |
          echo "=== Disk usage before build ==="
          df -h
          du -sh "$RUNNER_TEMP" "$HOME/.cache/go-build" "$HOME/go/pkg/mod" 2>/dev/null || true

      - name: Validate release endpoints
        run: |
          node .github/scripts/validate-endpoint.mjs RELIANT_SERVER_URL "$RELIANT_SERVER_URL" --required
          node .github/scripts/validate-endpoint.mjs RELIANT_GATEWAY_URL "$RELIANT_GATEWAY_URL" --required

      - name: Build backend binaries
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          # RELIANT_SERVER_URL / RELIANT_GATEWAY_URL come from
          # electron/release.config.json (generated from control-plane's KCL),
          # loaded into $GITHUB_ENV above — non-sensitive hostnames, not secrets.
          RELIANT_AUTH_URL: ${{ secrets.VITE_SUPABASE_URL }}
          RELIANT_AUTH_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # THE VERSION STAMP comes from scripts/release-identity.sh, the one
          # resolver the web bundle and control-plane's prod image use too, so
          # the About page's app and server lines agree. A tag build passes its
          # tag (-> 1.8.1); a dispatch from a branch gets the commit's dev
          # identity (-> 1.8.2-dev+<sha8>). --commit names HEAD so the generated
          # sources unpacked above do not read as a dirty tree. The script exits
          # non-zero rather than print nothing, and set -e makes that fatal: a
          # release must never ship a binary that reports "unknown".
          COMMIT="$(git rev-parse HEAD)"
          if [[ "$VERSION" == v[0-9]* ]]; then
            IDENTITY="$(bash scripts/release-identity.sh --tag "$VERSION" --commit "$COMMIT")"
          else
            IDENTITY="$(bash scripts/release-identity.sh --commit "$COMMIT")"
          fi
          COMMIT_TIME="$(bash scripts/release-identity.sh --commit-time --commit "$COMMIT")"
          echo "Stamping version=${IDENTITY} commit=${COMMIT} commit_time=${COMMIT_TIME}"
          LDFLAGS="-s -w -X github.com/reliant-labs/reliant/internal/build.BuildType=production -X github.com/reliant-labs/reliant/internal/version.Version=${IDENTITY} -X github.com/reliant-labs/reliant/internal/version.Commit=${COMMIT} -X github.com/reliant-labs/reliant/internal/version.CommitTime=${COMMIT_TIME}"

          # Build-time defaults: the release's hosted endpoints, stamped into
          # pkg/config.BuildDefaults (forge's build-defaults layer, between the
          # proto default_value and the config file / env / flags). One -X in
          # URL query form keyed by each field's env_var, every value
          # query-escaped. The proto defaults already ARE prod's endpoints, so
          # an unstamped build still works; the stamp is what lets another
          # environment's release config retarget a build. A key or value the
          # loader refuses fails every config load of the shipped binary.
          STAMP=""
          for key in RELIANT_SERVER_URL RELIANT_GATEWAY_URL RELIANT_AUTH_URL RELIANT_AUTH_KEY; do
            value="${!key:-}"
            if [[ -n "$value" ]]; then
              STAMP="${STAMP:+$STAMP&}${key}=$(jq -rn --arg v "$value" '$v|@uri')"
            fi
          done
          if [[ -n "$STAMP" ]]; then
            LDFLAGS="$LDFLAGS -X 'github.com/reliant-labs/reliant/pkg/config.BuildDefaults=${STAMP}'"
          fi

          echo "Build-default RELIANT_SERVER_URL = $RELIANT_SERVER_URL"
          echo "Build-default RELIANT_GATEWAY_URL = $RELIANT_GATEWAY_URL"

          if [[ "$TARGET_OS" == "windows" ]]; then
            BACKEND_BIN_NAME="reliant-backend.exe"
          else
            BACKEND_BIN_NAME="reliant-backend"
          fi

          OUT_DIR="backend-build/${TARGET_OS}-${TARGET_ARCH}"
          mkdir -p "$OUT_DIR"

          echo "Building backend for ${TARGET_OS}/${TARGET_ARCH}..."
          # `exp.winarm64` is a DELVE build tag, and it is what makes the
          # windows/arm64 leg compile at all.
          #
          # cmd/reliant registers `reliant forge` (cmd/reliant/cmd/forge.go),
          # which pulls github.com/reliant-labs/forge/cli -> internal/cli/debug ->
          # delve/service/debugger, so the shipped backend links Delve on every
          # target. Delve only supports windows/amd64 natively; for windows/arm64
          # it compiles a sentinel package whose whole job is to break the build.
          #
          # In delve v1.26.3 that sentinel was `windows && !amd64 && !arm64`, so
          # windows/arm64 slipped through and v1.7.11 shipped. v1.27.1 — pulled in
          # by the forge v0.1.11 -> v0.1.13 bump between v1.7.11 and v1.7.12 —
          # retightened it to `windows && !amd64 && !(arm64 && exp.winarm64)`,
          # which is what produced "found packages native and
          # your_windows_architecture_is_not_supported_by_delve" and left v1.7.12
          # with no Windows artifact.
          #
          # The tag selects delve's own experimental winarm64 backend instead of
          # the sentinel. It is compile-only for us: nothing in a released binary
          # ever starts a debugger, so this restores exactly the v1.7.11 behavior
          # rather than enabling anything new. It is a no-op on the other five
          # targets, so it stays on one shared command line that cannot drift.
          #
          # The durable fix is for the desktop backend not to link a debugger at
          # all — that is a forge-side change to how `forge/cli` pulls in
          # internal/cli/debug, tracked separately; it is not something this
          # release build can do on its own.
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -tags exp.winarm64 -ldflags="$LDFLAGS" -o "$OUT_DIR/$BACKEND_BIN_NAME" ./cmd/reliant/

          if [[ "$TARGET_OS" != "windows" ]]; then
            chmod +x "$OUT_DIR/$BACKEND_BIN_NAME"
          fi

          ls -la "$OUT_DIR"

      - name: Upload backend binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: backend-build/${{ matrix.target_os }}-${{ matrix.target_arch }}/
          retention-days: 1
          compression-level: 0

      - name: Disk usage after backend build
        if: always()
        run: |
          echo "=== Disk usage after build ==="
          df -h
          du -sh "$RUNNER_TEMP" "$HOME/.cache/go-build" "$HOME/go/pkg/mod" 2>/dev/null || true

  # ============================================================================
  # STANDALONE CLI: the backend binaries as `reliant` archives
  # ============================================================================
  # The same six binaries the installers bundle, repackaged as
  # reliant_<os>_<arch>.tar.gz + checksums.txt for self-run daemons and the
  # self-upgrade path (forge docs/proposals/self-upgrade.md §6, R0; reliant
  # dev-docs/cli-release-artifacts.md). Nothing is built twice: this job only
  # packages build-backend's artifacts. A prebuild run packages them too, and a
  # tag that reuses the prebuild takes its archives (release-prebuild.sh find
  # requires them), so the CLI and the installers always carry one binary.
  # Publishing and signing are cli-publish's, after Finalize.
  cli-archives:
    name: Package CLI archives
    needs: [prepare, build-backend]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.prebuilt_run != '' || needs.build-backend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Download the backend binaries
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # One directory per artifact: backend/backend-<os>-<arch>/.
          pattern: backend-*
          path: backend

      - name: Package the CLI archives
        if: needs.prepare.outputs.prebuilt_run == ''
        run: |
          set -euo pipefail
          # Reproducible archives: every entry is stamped with the commit time.
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" bash scripts/release-cli.sh package backend cli-dist

      - name: Take the prebuild's CLI archives
        if: needs.prepare.outputs.prebuilt_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-archives
          path: cli-dist
          run-id: ${{ needs.prepare.outputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: Verify the CLI archives
        run: bash scripts/release-cli.sh verify cli-dist

      - name: Upload the CLI archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-archives
          path: |
            cli-dist/reliant_*.tar.gz
            cli-dist/checksums.txt
          # As long as the platform builds: a tag reuses a prebuild's.
          retention-days: 90
          compression-level: 0

  # ============================================================================
  # macOS: Build, Sign, Notarize, and Publish
  # ============================================================================
  release-macos:
    name: Build macOS
    needs: [prepare, build-backend]
    # `always()` so a FAILING SIBLING PLATFORM does not skip this one.
    # build-backend is a 6-leg matrix, and a plain `needs:` treats the whole
    # matrix as one dependency — so the two Windows legs (which fail on
    # forge v0.0.6's Unix-only syscalls: syscall.Flock in pkg/pgtest and
    # syscall.Kill/Setsid in internal/hostinfra) skipped macOS and Linux even
    # though THEIR backends built fine. The guard below still requires this
    # platform's own inputs to have succeeded, so a genuinely broken build
    # cannot ship — it only stops one platform's breakage from grounding the
    # others.
    if: always() && needs.prepare.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 35
    outputs:
      duration_seconds: ${{ steps.macos-metrics.outputs.duration_seconds }}
      electron_cache_hit: ${{ steps.macos-metrics.outputs.electron_cache_hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Record job start
        id: timing-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Load release endpoint config
        # shell: bash is REQUIRED — windows-latest defaults to PowerShell,
        # where `grep` does not exist and $GITHUB_ENV is not a shell variable.
        # The step still reported success there while setting nothing, so the
        # build-config generator ran with empty endpoints and failed. GitHub
        # ships bash on the Windows runners, so this works on all three.
        shell: bash
        run: jq -er '.main | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Install pnpm
        if: needs.prepare.outputs.prebuilt_run == ''
        # The version electron/pnpm-lock.yaml was written with, read from the
        # root package.json's packageManager field (electron/package.json pins
        # the same). No `version:` here: the action fails when one is named
        # beside that field. Before setup-node, whose pnpm cache asks it for
        # the store path.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: electron/pnpm-lock.yaml

      # Platform-specific Electron cache (macOS uses ~/Library/Caches)
      - name: Cache Electron binaries
        if: needs.prepare.outputs.prebuilt_run == ''
        id: electron-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ needs.prepare.outputs.electron_version || 'unknown' }}-${{ needs.prepare.outputs.electron_builder_version || 'unknown' }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Download web build
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: frontends/web/dist

      - name: Download backend (darwin-amd64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-darwin-amd64
          path: electron/resources/server/mac-x64

      - name: Download backend (darwin-arm64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-darwin-arm64
          path: electron/resources/server/mac-arm64

      - name: Verify backend binaries (macOS)
        if: needs.prepare.outputs.prebuilt_run == ''
        run: |
          for dir in electron/resources/server/mac-*; do
            test -f "$dir/reliant-backend"
          done
          chmod +x electron/resources/server/mac-*/reliant-backend
          ls -la electron/resources/server/mac-*/

      - name: Install electron dependencies
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate runtime build config
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: ./.github/actions/generate-build-config
        with:
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          reliant-server-url: ${{ env.RELIANT_SERVER_URL }}
          reliant-api-url: ${{ env.RELIANT_API_URL }}
          reliant-gateway-url: ${{ env.RELIANT_GATEWAY_URL }}

      - name: Build and Publish macOS apps (Signed & Notarized)
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        env:
          # NOTARIZATION IDENTITY — two strategies, both passed; the hook
          # (electron/build/notarize-core.js) prefers the API key and falls back
          # to the Apple ID when the key secrets are absent.
          #
          # An App Store Connect API key belongs to the TEAM, an Apple ID belongs
          # to a PERSON. v1.7.14 shipped Windows and Linux but not macOS because
          # the account holder changed: signing kept working (certificate),
          # notarization began returning "HTTP status code: 403. A required
          # agreement is missing or has expired" (account identity). A key
          # survives that change, which is why it is preferred.
          #
          # APPLE_API_KEY holds the .p8 key's CONTENTS (the whole
          # -----BEGIN PRIVATE KEY----- block), not a path — a GitHub secret
          # cannot carry a file. The hook writes it to a 0600 temp file for the
          # duration of the call, because notarytool requires a path, and
          # removes it afterwards.
          #
          # Create the key at App Store Connect -> Users and Access ->
          # Integrations -> Keys (Developer role). The .p8 downloads ONCE.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Fallback. Keep these set until the API key has notarized a real
          # release; an unset secret is an empty string, and the hook treats a
          # partial API-key config as "use the Apple ID" rather than failing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Still required for SIGNING regardless of the notarization strategy.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          CONFIG="${{ needs.prepare.outputs.config }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          PUBLISH_FLAG="${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}"

          echo "Building and publishing signed macOS apps"
          echo "Config: $CONFIG | Channel: $CHANNEL | Publish: $PUBLISH_FLAG"

          # The one electron-builder call, shared with forge's reliant-desktop build.
          node scripts/pack-desktop.js mac "$CONFIG" "$PUBLISH_FLAG"

      # A prebuild of this version on this commit (prepare's prebuilt_run): publish its
      # signed artifacts exactly where electron-builder --publish puts them (the s3
      # provider of electron-builder*.js: bucket root of `downloads` on R2), the
      # update feeds (*.yml) last so no client sees a feed before its files.
      - name: Publish the prebuild
        if: needs.prepare.outputs.prebuilt_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-builds
          path: electron/dist
          run-id: ${{ needs.prepare.outputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: Upload the prebuild to R2
        if: needs.prepare.outputs.prebuilt_run != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # Refuses, uploading nothing, unless every update feed mac clients poll is
        # present and names VERSION; feeds go last.
        run: bash scripts/release-prebuild.sh publish mac "$CHANNEL" "$VERSION" electron/dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-builds
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*-mac.yml
            electron/dist/*.blockmap
          retention-days: 90

      - name: macOS job timing and cache summary
        id: macos-metrics
        if: always()
        run: |
          END_TS=$(date +%s)
          START_TS=${{ steps.timing-start.outputs.ts }}
          DURATION=$((END_TS - START_TS))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          CACHE_HIT_RAW="${{ steps.electron-cache.outputs.cache-hit }}"

          if [[ "$CACHE_HIT_RAW" == "true" ]]; then
            CACHE_HIT="exact-hit"
          elif [[ "$CACHE_HIT_RAW" == "false" ]]; then
            CACHE_HIT="partial-hit"
          else
            CACHE_HIT="miss"
          fi

          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          echo "electron_cache_hit=$CACHE_HIT" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⏱️ macOS Job Metrics

          - **Job:** Build macOS
          - **Duration:** ${MINS}m ${SECS}s
          - **Electron cache hit:** ${CACHE_HIT}
          EOF

  # ============================================================================
  # Linux: Build and Publish (runs in parallel with macOS and Windows)
  # ============================================================================
  release-linux:
    name: Build Linux
    needs: [prepare, build-backend]
    # `always()` so a FAILING SIBLING PLATFORM does not skip this one.
    # build-backend is a 6-leg matrix, and a plain `needs:` treats the whole
    # matrix as one dependency — so the two Windows legs (which fail on
    # forge v0.0.6's Unix-only syscalls: syscall.Flock in pkg/pgtest and
    # syscall.Kill/Setsid in internal/hostinfra) skipped macOS and Linux even
    # though THEIR backends built fine. The guard below still requires this
    # platform's own inputs to have succeeded, so a genuinely broken build
    # cannot ship — it only stops one platform's breakage from grounding the
    # others.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      duration_seconds: ${{ steps.linux-metrics.outputs.duration_seconds }}
      electron_cache_hit: ${{ steps.linux-metrics.outputs.electron_cache_hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Record job start
        id: timing-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Load release endpoint config
        # shell: bash is REQUIRED — windows-latest defaults to PowerShell,
        # where `grep` does not exist and $GITHUB_ENV is not a shell variable.
        # The step still reported success there while setting nothing, so the
        # build-config generator ran with empty endpoints and failed. GitHub
        # ships bash on the Windows runners, so this works on all three.
        shell: bash
        run: jq -er '.main | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Install pnpm
        if: needs.prepare.outputs.prebuilt_run == ''
        # The version electron/pnpm-lock.yaml was written with, read from the
        # root package.json's packageManager field (electron/package.json pins
        # the same). No `version:` here: the action fails when one is named
        # beside that field. Before setup-node, whose pnpm cache asks it for
        # the store path.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: electron/pnpm-lock.yaml

      # Platform-specific Electron cache (Linux uses ~/.cache)
      - name: Cache Electron binaries
        if: needs.prepare.outputs.prebuilt_run == ''
        id: electron-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ needs.prepare.outputs.electron_version || 'unknown' }}-${{ needs.prepare.outputs.electron_builder_version || 'unknown' }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Download web build
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: frontends/web/dist

      - name: Download backend (linux-amd64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-linux-amd64
          path: electron/resources/server/linux-amd64

      - name: Download backend (linux-arm64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-linux-arm64
          path: electron/resources/server/linux-arm64

      - name: Verify backend binaries (Linux)
        if: needs.prepare.outputs.prebuilt_run == ''
        run: |
          for dir in electron/resources/server/linux-*; do
            test -f "$dir/reliant-backend"
          done
          chmod +x electron/resources/server/linux-*/reliant-backend
          ls -la electron/resources/server/linux-*/

      - name: Install electron dependencies
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate runtime build config
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: ./.github/actions/generate-build-config
        with:
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          reliant-server-url: ${{ env.RELIANT_SERVER_URL }}
          reliant-api-url: ${{ env.RELIANT_API_URL }}
          reliant-gateway-url: ${{ env.RELIANT_GATEWAY_URL }}

      - name: Build and Publish Linux apps
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          CONFIG="${{ needs.prepare.outputs.config }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          PUBLISH_FLAG="${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}"

          echo "Building and publishing Linux apps"
          echo "Config: $CONFIG | Channel: $CHANNEL | Publish: $PUBLISH_FLAG"

          # The one electron-builder call, shared with forge's reliant-desktop build.
          node scripts/pack-desktop.js linux "$CONFIG" "$PUBLISH_FLAG"

      # A prebuild of this version on this commit (prepare's prebuilt_run): publish its
      # signed artifacts exactly where electron-builder --publish puts them (the s3
      # provider of electron-builder*.js: bucket root of `downloads` on R2), the
      # update feeds (*.yml) last so no client sees a feed before its files.
      - name: Publish the prebuild
        if: needs.prepare.outputs.prebuilt_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-builds
          path: electron/dist
          run-id: ${{ needs.prepare.outputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: Upload the prebuild to R2
        if: needs.prepare.outputs.prebuilt_run != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # Refuses, uploading nothing, unless every update feed linux clients poll is
        # present and names VERSION; feeds go last.
        run: bash scripts/release-prebuild.sh publish linux "$CHANNEL" "$VERSION" electron/dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-builds
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*-linux.yml
            electron/dist/*-linux-arm64.yml
            electron/dist/*.blockmap
          retention-days: 90

      - name: Linux job timing and cache summary
        id: linux-metrics
        if: always()
        run: |
          END_TS=$(date +%s)
          START_TS=${{ steps.timing-start.outputs.ts }}
          DURATION=$((END_TS - START_TS))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          CACHE_HIT_RAW="${{ steps.electron-cache.outputs.cache-hit }}"

          if [[ "$CACHE_HIT_RAW" == "true" ]]; then
            CACHE_HIT="exact-hit"
          elif [[ "$CACHE_HIT_RAW" == "false" ]]; then
            CACHE_HIT="partial-hit"
          else
            CACHE_HIT="miss"
          fi

          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          echo "electron_cache_hit=$CACHE_HIT" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⏱️ Linux Job Metrics

          - **Job:** Build Linux
          - **Duration:** ${MINS}m ${SECS}s
          - **Electron cache hit:** ${CACHE_HIT}
          EOF

  # ============================================================================
  # Windows: Build and Publish (runs in parallel with macOS and Linux)
  # ============================================================================
  release-windows:
    name: Build Windows
    needs: [prepare, build-backend]
    # As before (every backend leg built), or publishing a prebuild (no backend leg ran).
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.prebuilt_run != '' || needs.build-backend.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      duration_seconds: ${{ steps.windows-metrics.outputs.duration_seconds }}
      electron_cache_hit: ${{ steps.windows-metrics.outputs.electron_cache_hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Record job start
        id: timing-start
        shell: bash
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Load release endpoint config
        # shell: bash is REQUIRED — windows-latest defaults to PowerShell,
        # where `grep` does not exist and $GITHUB_ENV is not a shell variable.
        # The step still reported success there while setting nothing, so the
        # build-config generator ran with empty endpoints and failed. GitHub
        # ships bash on the Windows runners, so this works on all three.
        shell: bash
        run: jq -er '.main | to_entries[] | "\(.key)=\(.value)"' electron/release.config.json >> "$GITHUB_ENV"

      - name: Install pnpm
        if: needs.prepare.outputs.prebuilt_run == ''
        # The version electron/pnpm-lock.yaml was written with, read from the
        # root package.json's packageManager field (electron/package.json pins
        # the same). No `version:` here: the action fails when one is named
        # beside that field. Before setup-node, whose pnpm cache asks it for
        # the store path.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: electron/pnpm-lock.yaml

      # Platform-specific Electron cache (Windows)
      - name: Cache Electron binaries
        if: needs.prepare.outputs.prebuilt_run == ''
        id: electron-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ needs.prepare.outputs.electron_version || 'unknown' }}-${{ needs.prepare.outputs.electron_builder_version || 'unknown' }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Download web build
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: frontends/web/dist

      - name: Download backend (windows-amd64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-windows-amd64
          path: electron/resources/server/win32-amd64

      - name: Download backend (windows-arm64)
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-windows-arm64
          path: electron/resources/server/win32-arm64

      - name: Verify backend binaries
        if: needs.prepare.outputs.prebuilt_run == ''
        shell: bash
        run: |
          test -f electron/resources/server/win32-amd64/reliant-backend.exe
          test -f electron/resources/server/win32-arm64/reliant-backend.exe
          ls -la electron/resources/server/win32-*/

      - name: Install electron dependencies
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate runtime build config
        if: needs.prepare.outputs.prebuilt_run == ''
        uses: ./.github/actions/generate-build-config
        with:
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          reliant-server-url: ${{ env.RELIANT_SERVER_URL }}
          reliant-api-url: ${{ env.RELIANT_API_URL }}
          reliant-gateway-url: ${{ env.RELIANT_GATEWAY_URL }}

      - name: Build and Publish Windows apps
        if: needs.prepare.outputs.prebuilt_run == ''
        working-directory: electron
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # Azure Trusted Signing (Artifact Signing)
          # NOTE: electron-builder reads these via the Invoke-TrustedSigning PowerShell module.
          # Minimal supported auth method is service principal with secret.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Trusted Signing account details
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        shell: pwsh
        run: |
          $CONFIG = "${{ needs.prepare.outputs.config }}"
          $CHANNEL = "${{ needs.prepare.outputs.channel }}"
          $DRY_RUN = "${{ github.event.inputs.dry_run }}"

          if ($DRY_RUN -eq "true") {
            $PUBLISH = "never"
          } else {
            $PUBLISH = "always"
          }

          Write-Host "Building and publishing Windows apps"
          Write-Host "Config: $CONFIG | Channel: $CHANNEL | Publish: $PUBLISH"

          # The one electron-builder call, shared with forge's reliant-desktop build.
          # Still run from PowerShell: the script starts .\node_modules\.bin\electron-builder.cmd
          # (not npx) through cmd.exe, as this step did, with this step's environment.
          node scripts/pack-desktop.js win "$CONFIG" $PUBLISH

      # A prebuild of this version on this commit (prepare's prebuilt_run): publish its
      # signed artifacts exactly where electron-builder --publish puts them (the s3
      # provider of electron-builder*.js: bucket root of `downloads` on R2), the
      # update feeds (*.yml) last so no client sees a feed before its files.
      - name: Publish the prebuild
        if: needs.prepare.outputs.prebuilt_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-builds
          path: electron/dist
          run-id: ${{ needs.prepare.outputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: Upload the prebuild to R2
        if: needs.prepare.outputs.prebuilt_run != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # Refuses, uploading nothing, unless every update feed win clients poll is
        # present and names VERSION; feeds go last.
        run: bash scripts/release-prebuild.sh publish win "$CHANNEL" "$VERSION" electron/dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-builds
          # The Windows update feed is <channel>.yml (latest.yml), not
          # *-win.yml: publishing a prebuild needs it (scripts/release-prebuild.sh).
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          retention-days: 90

      - name: Windows job timing and cache summary
        id: windows-metrics
        if: always()
        shell: bash
        run: |
          END_TS=$(date +%s)
          START_TS=${{ steps.timing-start.outputs.ts }}
          DURATION=$((END_TS - START_TS))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          CACHE_HIT_RAW="${{ steps.electron-cache.outputs.cache-hit }}"

          if [[ "$CACHE_HIT_RAW" == "true" ]]; then
            CACHE_HIT="exact-hit"
          elif [[ "$CACHE_HIT_RAW" == "false" ]]; then
            CACHE_HIT="partial-hit"
          else
            CACHE_HIT="miss"
          fi

          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          echo "electron_cache_hit=$CACHE_HIT" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⏱️ Windows Job Metrics

          - **Job:** Build Windows
          - **Duration:** ${MINS}m ${SECS}s
          - **Electron cache hit:** ${CACHE_HIT}
          EOF

  # ============================================================================
  # The changelog/release-notes email is NOT sent from this workflow.
  #
  # It moved to control-plane: .github/workflows/release-notes.yml, a manual
  # workflow_dispatch a human runs after a release. control-plane already holds
  # the Customer.io credentials, and mailing customers should not be a side
  # effect of pushing a tag — which is exactly what this job's guard failed to
  # prevent (`skip_changelog_email` was a dispatch input, and a tag push leaves
  # dispatch inputs null, so the `!= 'true'` check passed).
  #
  # The release notes themselves are still authored HERE, in
  # docs/data/releases/<version>.yaml — that directory renders docs/changelog.mdx
  # via `task generate:docs:changelog` for the Mintlify docs site. control-plane
  # fetches the file at send time; nothing about authoring changes.
  # ============================================================================

  # ============================================================================
  # FINALIZE: Generate unified summary after all platforms complete
  # ============================================================================
  finalize:
    name: Finalize Release
    needs: [prepare, release-macos, release-linux, release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.prepare.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Record job start
        id: timing-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List all built files
        run: |
          echo "=== Release Artifacts ==="
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.yml" \) | head -30
          echo ""
          echo "=== File sizes ==="
          du -sh artifacts/*/* 2>/dev/null || true

      - name: Generate Release Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MACOS_RESULT: ${{ needs.release-macos.result }}
          LINUX_RESULT: ${{ needs.release-linux.result }}
          WINDOWS_RESULT: ${{ needs.release-windows.result }}
          PREPARE_DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
          ELECTRON_VERSION: ${{ needs.prepare.outputs.electron_version }}
          ELECTRON_BUILDER_VERSION: ${{ needs.prepare.outputs.electron_builder_version }}
          MACOS_DURATION_SECONDS: ${{ needs.release-macos.outputs.duration_seconds }}
          MACOS_ELECTRON_CACHE_HIT: ${{ needs.release-macos.outputs.electron_cache_hit }}
          LINUX_DURATION_SECONDS: ${{ needs.release-linux.outputs.duration_seconds }}
          LINUX_ELECTRON_CACHE_HIT: ${{ needs.release-linux.outputs.electron_cache_hit }}
          WINDOWS_DURATION_SECONDS: ${{ needs.release-windows.outputs.duration_seconds }}
          WINDOWS_ELECTRON_CACHE_HIT: ${{ needs.release-windows.outputs.electron_cache_hit }}
        run: |
          VERSION_NUM=${VERSION#v}
          BASE_URL="https://downloads.reliantlabs.io"

          format_duration() {
            local s="$1"
            if [[ -z "$s" || ! "$s" =~ ^[0-9]+$ ]]; then
              echo "n/a"
              return
            fi
            local m=$((s / 60))
            local r=$((s % 60))
            echo "${m}m ${r}s"
          }

          # Status emoji helper
          status_emoji() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":no_entry:" ;;
              skipped) echo ":next_track_button:" ;;
              *) echo ":question:" ;;
            esac
          }

          # Create summary header
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY_EOF'
          # :rocket: Reliant Release Complete
          SUMMARY_EOF

          cat >> $GITHUB_STEP_SUMMARY << EOF

          **Version:** \`${VERSION_NUM}\` | **Channel:** \`${CHANNEL}\` | **Mode:** \`${DRY_RUN:-false}\` dry-run | **Built:** $(date -u +"%Y-%m-%d %H:%M UTC")

          **Electron cache tuple:** electron=\`${ELECTRON_VERSION:-n/a}\`, electron-builder=\`${ELECTRON_BUILDER_VERSION:-n/a}\`

          ### Build Status

          | Platform | Status |
          |:---------|:-------|
          | macOS | $(status_emoji $MACOS_RESULT) ${MACOS_RESULT} |
          | Linux | $(status_emoji $LINUX_RESULT) ${LINUX_RESULT} |
          | Windows | $(status_emoji $WINDOWS_RESULT) ${WINDOWS_RESULT} |

          ---

          ### ⏱️ Build Performance (Consolidated)

          | Job | Duration | Cache |
          |:----|:---------|:------|
          | Prepare | $(format_duration "$PREPARE_DURATION_SECONDS") | n/a |
          | macOS | $(format_duration "$MACOS_DURATION_SECONDS") | electron: ${MACOS_ELECTRON_CACHE_HIT:-n/a} |
          | Linux | $(format_duration "$LINUX_DURATION_SECONDS") | electron: ${LINUX_ELECTRON_CACHE_HIT:-n/a} |
          | Windows | $(format_duration "$WINDOWS_DURATION_SECONDS") | electron: ${WINDOWS_ELECTRON_CACHE_HIT:-n/a} |

          ---

          EOF

          # macOS section (if succeeded)
          if [[ "$MACOS_RESULT" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## :apple: macOS Downloads

          | Architecture | Installer | Archive |
          |:------------|:----------|:--------|
          | **Apple Silicon** | [:arrow_down: DMG](${BASE_URL}/Reliant-${VERSION_NUM}-mac-arm64.dmg) | [:package: ZIP](${BASE_URL}/Reliant-${VERSION_NUM}-mac-arm64.zip) |
          | **Intel** (x64) | [:arrow_down: DMG](${BASE_URL}/Reliant-${VERSION_NUM}-mac-x64.dmg) | [:package: ZIP](${BASE_URL}/Reliant-${VERSION_NUM}-mac-x64.zip) |

          EOF
          fi

          # Linux section (if succeeded)
          if [[ "$LINUX_RESULT" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## :penguin: Linux Downloads

          | Architecture | Universal | Debian/Ubuntu |
          |:------------|:----------|:--------------|
          | **x64** (AMD/Intel) | [:arrow_down: AppImage](${BASE_URL}/Reliant-${VERSION_NUM}-linux-x86_64.AppImage) | [:package: .deb](${BASE_URL}/Reliant-${VERSION_NUM}-linux-amd64.deb) |
          | **ARM64** | [:arrow_down: AppImage](${BASE_URL}/Reliant-${VERSION_NUM}-linux-arm64.AppImage) | [:package: .deb](${BASE_URL}/Reliant-${VERSION_NUM}-linux-arm64.deb) |

          EOF
          fi

          # Windows section (if succeeded)
          if [[ "$WINDOWS_RESULT" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## :window: Windows Downloads

          | Architecture | Installer | Portable |
          |:------------|:----------|:---------|
          | **x64** (AMD/Intel) | [:arrow_down: Setup .exe](${BASE_URL}/Reliant-${VERSION_NUM}-win-x64.exe) | [:package: Portable](${BASE_URL}/Reliant-${VERSION_NUM}-win-x64-portable.exe) |
          | **ARM64** | [:arrow_down: Setup .exe](${BASE_URL}/Reliant-${VERSION_NUM}-win-arm64.exe) | - |

          EOF
          fi

          # Auto-update manifests section
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ---

          ## :gear: Auto-Update Manifests

          | Platform | Manifest |
          |:---------|:---------|
          EOF

          if [[ "$MACOS_RESULT" == "success" ]]; then
            echo "| macOS | [latest-mac.yml](${BASE_URL}/latest-mac.yml) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$LINUX_RESULT" == "success" ]]; then
            echo "| Linux | [latest-linux.yml](${BASE_URL}/latest-linux.yml) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$WINDOWS_RESULT" == "success" ]]; then
            echo "| Windows | [latest-win.yml](${BASE_URL}/latest-win.yml) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release summary generated!"

      - name: Purge Cloudflare CDN cache
        if: github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          MACOS_RESULT: ${{ needs.release-macos.result }}
          LINUX_RESULT: ${{ needs.release-linux.result }}
          WINDOWS_RESULT: ${{ needs.release-windows.result }}
        run: |
          VERSION_NUM=${VERSION#v}
          BASE_URL="https://downloads.reliantlabs.io"
          FILES=()

          # Always purge the auto-update manifests (these are what clients poll).
          #
          # The Windows manifest is `<channel>.yml`, NOT `<channel>-win.yml` —
          # electron-builder names the Windows feed after the channel alone and
          # only suffixes the other platforms. Purging `latest-win.yml` hit a
          # 404 and left the real feed cached: after v1.7.7 published, clients
          # were still served version 1.7.5 for ~20h (cf-cache-status HIT,
          # age 72856 against max-age 86400) while origin was already correct.
          #
          # Linux arm64 has a feed of its own, `<channel>-linux-arm64.yml`. It
          # was missing from this list through v1.8.6, so arm64 Linux clients
          # read a cached feed for up to a day after every release.
          # Only `latest` is published (prepare refuses a prerelease tag).
          FILES+=("${BASE_URL}/latest-mac.yml" "${BASE_URL}/latest-linux.yml" "${BASE_URL}/latest-linux-arm64.yml" "${BASE_URL}/latest.yml")

          # Purge versioned download URLs per platform
          if [[ "$MACOS_RESULT" == "success" ]]; then
            FILES+=(
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-arm64.dmg"
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-arm64.zip"
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-x64.dmg"
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-x64.zip"
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-arm64.dmg.blockmap"
              "${BASE_URL}/Reliant-${VERSION_NUM}-mac-x64.dmg.blockmap"
            )
          fi
          if [[ "$LINUX_RESULT" == "success" ]]; then
            FILES+=(
              # x86_64, not x64 — electron-builder uses the GNU arch name for
              # Linux AppImages while using x64 for mac/win.
              "${BASE_URL}/Reliant-${VERSION_NUM}-linux-x86_64.AppImage"
              "${BASE_URL}/Reliant-${VERSION_NUM}-linux-arm64.AppImage"
              "${BASE_URL}/Reliant-${VERSION_NUM}-linux-amd64.deb"
              "${BASE_URL}/Reliant-${VERSION_NUM}-linux-arm64.deb"
            )
          fi
          if [[ "$WINDOWS_RESULT" == "success" ]]; then
            FILES+=(
              "${BASE_URL}/Reliant-${VERSION_NUM}-win-x64.exe"
              "${BASE_URL}/Reliant-${VERSION_NUM}-win-arm64.exe"
              "${BASE_URL}/Reliant-${VERSION_NUM}-win-x64.exe.blockmap"
            )
          fi

          # Purging a URL that does not exist is accepted by Cloudflare with a
          # 200, so a misspelled name fails SILENTLY and the real object stays
          # cached — which is precisely how latest-win.yml went unnoticed. Check
          # that each URL resolves and fail the step if one does not, so a
          # rename in electron-builder's output surfaces here instead of as a
          # stale feed a day later.
          missing=0
          for url in "${FILES[@]}"; do
            # HEAD, not GET: a GET downloads the whole ~200 MB installer, which
            # does not fit in --max-time, and curl's exit 28 under `bash -e`
            # killed the step before anything was purged (v1.8.6: feeds stayed
            # cached at 1.8.5 while origin served 1.8.6). A transport error is
            # reported as code 000 rather than aborting the step.
            code=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
            if [[ "$code" != "200" ]]; then
              echo "::error::purge target does not exist (HTTP ${code}): ${url}"
              missing=$((missing + 1))
            fi
          done
          if [[ "$missing" -gt 0 ]]; then
            echo "::error::${missing} purge target(s) do not exist — the published artifact names have changed. Fix the list in this step; a purge of a non-existent URL is a silent no-op."
            exit 1
          fi

          echo "Purging ${#FILES[@]} URLs from Cloudflare cache..."

          # Cloudflare allows up to 30 files per purge request
          for ((i=0; i<${#FILES[@]}; i+=30)); do
            BATCH=("${FILES[@]:i:30}")
            JSON_ARRAY=$(printf '%s\n' "${BATCH[@]}" | jq -R . | jq -s .)

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"files\":${JSON_ARRAY}}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [[ "$HTTP_CODE" -ne 200 ]]; then
              echo "::warning::Cache purge request returned HTTP ${HTTP_CODE}: ${BODY}"
            else
              echo "Cache purge batch successful (${#BATCH[@]} URLs)"
            fi
          done

          echo "Cloudflare cache purge complete"

      - name: Publish the GitHub Release
        # WHY THIS EXISTS. Tagging alone leaves /releases empty — it sat frozen
        # at v1.4.0 (April) while /tags kept growing, because nothing in any
        # workflow ever created a Release. The two hand-made entries before
        # that were exactly that: hand-made. Artifacts go to R2, so nothing
        # here needed a Release and nobody noticed it had stopped.
        #
        # A Release is worth having anyway: it is the page that shows WHAT
        # CHANGED between two versions, with the commit list and PR links
        # generated by GitHub, and it is the canonical thing to link to.
        #
        # The body is built here, whole, and passed with --notes-file alone:
        # the human summary in docs/data/releases/<tag>.yaml (the same source
        # the Mintlify changelog renders) leads, and GitHub's generated commit
        # list follows. If that file is absent the list stands alone, which is
        # strictly better than no Release.
        #
        # WHY NOT --generate-notes. GitHub refuses a body over 125000
        # characters (HTTP 422), and `gh release create --generate-notes`
        # appends a list we cannot measure first. Release tags are cut on
        # release commits that are not ancestors of one another, so GitHub's
        # own choice of previous release fell back to v1.21.3 and listed every
        # PR since it: ~125k for v1.33.0, ~128k for v1.34.0. Both 422'd, no
        # Release was created, and the CLI publish that waits on the Release
        # never ran. So we pin previous_tag_name to the previous final tag by
        # version, and release-notes-body.py caps the whole body at 120000
        # bytes, cutting at a line and linking the full comparison.
        #
        # NOT gated on release-macos: a platform failing to build is exactly
        # when you most want the Release page to exist and say so. The R2 feeds
        # already encode per-platform availability. It IS gated on dry_run,
        # which must not publish anything.
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — leaving it alone."
            exit 0
          fi

          # The previous FINAL tag by version (no -rc), not by ancestry: the
          # tags are not ancestors of one another (see above). Read from the
          # API because this job's checkout is shallow and has no tags.
          TAGS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref')
          PREV=$(
            {
              printf '%s\n' "$TAGS" | sed 's#^refs/tags/##' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" || true
              echo "$VERSION"
            } | sort -V | grep -B1 -xF "$VERSION" | head -1
          )
          NOTES_ARGS=(-f tag_name="$VERSION")
          if [ -n "$PREV" ] && [ "$PREV" != "$VERSION" ]; then
            NOTES_ARGS+=(-f previous_tag_name="$PREV")
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${VERSION}"
          else
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}"
          fi
          echo "Generating notes for $VERSION since ${PREV:-the first commit}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${NOTES_ARGS[@]}" \
            --jq .body > /tmp/release-generated.md

          if [ ! -f "docs/data/releases/$VERSION.yaml" ]; then
            echo "::notice::docs/data/releases/$VERSION.yaml not found — publishing with generated notes only."
          fi
          python3 scripts/release-notes-body.py "$VERSION" \
            --generated /tmp/release-generated.md --compare-url "$COMPARE_URL" \
            > /tmp/release-body.md
          echo "Release body: $(wc -c < /tmp/release-body.md) bytes"

          # --verify-tag refuses to invent a tag that does not exist, so a
          # mistyped or unpushed version fails here rather than creating a
          # Release pointing at nothing.
          gh release create "$VERSION" --title "$VERSION" --verify-tag --notes-file /tmp/release-body.md
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION"

      - name: Trigger Homebrew tap update
        if: needs.release-macos.result == 'success' && github.event.inputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          VERSION_NUM=${VERSION#v}
          echo "Triggering Homebrew tap update for version: $VERSION_NUM"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/reliant-labs/homebrew-reliant/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"version\":\"$VERSION_NUM\"}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "GitHub dispatch HTTP status: $HTTP_CODE"
          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "::error::Homebrew dispatch failed: $BODY"
            exit 1
          fi

          echo "Homebrew dispatch succeeded"

      - name: Finalize job timing summary
        if: always()
        run: |
          END_TS=$(date +%s)
          START_TS=${{ steps.timing-start.outputs.ts }}
          DURATION=$((END_TS - START_TS))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⏱️ Finalize Job Metrics

          - **Job:** Finalize Release
          - **Duration:** ${MINS}m ${SECS}s
          EOF

  # ============================================================================
  # CLI: sign, attach to the GitHub Release, publish the channel manifest
  # ============================================================================
  # One keyless Sigstore attestation (actions/attest) over the six CLI archives,
  # checksums.txt and daemon-channels.json, attached to the GitHub Release as
  # reliant-release.sigstore.json, the shape forge's release-attest.yml signs
  # forge's releases with. Then everything goes to downloads.reliantlabs.io under
  # cli/<tag>/, and daemon-channels.json, the public channel manifest self-run
  # daemons read their target from, at the bucket root, last.
  #
  # The certificate names THIS workflow at the release tag
  # (SIGNER_IDENTITY); the predicate names {repository, release, commit}, so a
  # signed set cannot be replayed under another tag. Unlike forge's, the archives
  # are built in this same run (build-backend), not on a laptop.
  #
  # Only this job holds id-token: write. Tags only (the predicate names a
  # release), never a dry run, and after Finalize, which creates the Release.
  # Order: sign once, store the whole set on the GitHub Release, then on R2,
  # then (only then) the root manifest. A signature is never replaced: a re-run
  # recovers a signed set from either store and stores it again unchanged. Design, manifest schema and
  # verification commands: dev-docs/cli-release-artifacts.md;
  # tools/test-affected/release_cli_workflow_test.go holds this job to them.
  cli-publish:
    name: Sign and publish the CLI
    needs: [prepare, cli-archives, finalize]
    if: always() && needs.prepare.result == 'success' && needs.cli-archives.result == 'success' && needs.finalize.result == 'success' && github.ref_type == 'tag' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # gh release view/upload/download of the Release's assets.
      contents: write
      # The OIDC token Fulcio certifies, and the attestations API that stores it.
      id-token: write
      attestations: write
    env:
      SIGNATURE_ASSET: reliant-release.sigstore.json
      SIGNER_IDENTITY: '^https://github\.com/reliant-labs/reliant/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      SIGNER_ISSUER: https://token.actions.githubusercontent.com
      PREDICATE_TYPE: https://github.com/reliant-labs/reliant/attestations/release-assets/v1
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Download the CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-archives
          path: cli-dist

      # A signed set is signed ONCE. If the GitHub Release or cli/<tag>/ on R2
      # already holds one (an earlier attempt that stopped part way), it is
      # recovered and stored again unchanged, never re-signed or regenerated.
      - name: Recover an already signed set
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-cli.sh verify cli-dist
          FROM="$(bash scripts/release-cli.sh recover "$VERSION" cli-dist)"
          if [ "$FROM" = none ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$VERSION already has a signed set (on $FROM); a signature is never replaced: storing that set again"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the channel manifest and the predicate
        if: steps.release.outputs.signed == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_TIME="$(bash scripts/release-identity.sh --commit-time --commit "$COMMIT")"
          bash scripts/release-cli.sh fetch-manifest "$RUNNER_TEMP/current.json"
          bash scripts/release-cli.sh manifest "$RUNNER_TEMP/current.json" "$CHANNEL" "$VERSION" "$COMMIT" "$COMMIT_TIME" cli-dist > "$RUNNER_TEMP/daemon-channels.json"
          mv "$RUNNER_TEMP/daemon-channels.json" cli-dist/daemon-channels.json
          bash scripts/release-cli.sh predicate "$GITHUB_REPOSITORY" "$VERSION" "$COMMIT" > "$RUNNER_TEMP/predicate.json"
          cat cli-dist/daemon-channels.json "$RUNNER_TEMP/predicate.json"

      - name: Sign
        id: attest
        if: steps.release.outputs.signed == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            cli-dist/reliant_*.tar.gz
            cli-dist/checksums.txt
            cli-dist/daemon-channels.json
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/predicate.json

      - name: Take the new signature
        if: steps.release.outputs.signed == 'false'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "cli-dist/$SIGNATURE_ASSET"

      - name: Check the signature as a verifier will
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The certificate must name this workflow at a release tag, and the
          # signed predicate this repository, THIS release and its commit.
          for f in cli-dist/reliant_*.tar.gz cli-dist/checksums.txt cli-dist/daemon-channels.json; do
            gh attestation verify "$f" --bundle "cli-dist/$SIGNATURE_ASSET" --repo "$GITHUB_REPOSITORY" \
              --cert-identity-regex "$SIGNER_IDENTITY" --cert-oidc-issuer "$SIGNER_ISSUER" \
              --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners \
              --format json > "$RUNNER_TEMP/verified.json"
            jq -e --arg release "$VERSION" --arg repo "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
              'length > 0 and all(.[]; .verificationResult.statement.predicate | .release == $release and .repository == $repo and .commit == $commit)' \
              "$RUNNER_TEMP/verified.json" > /dev/null
            echo "verified $f"
          done

      # Durable first: the whole signed set (signature last) on the GitHub
      # Release, then under cli/<tag>/ on R2. A store already holding a signed
      # set must hold exactly this one (a no-op) or the step fails, changing
      # nothing. Only then does the root manifest change.
      - name: Attach the signed set to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-cli.sh store-github "$VERSION" cli-dist

      - name: Store the signed set on downloads.reliantlabs.io
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-cli.sh store-r2 "$VERSION" cli-dist

      - name: Publish the channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # Refuses unless both stores hold this set, and never moves a channel
        # backwards.
        run: bash scripts/release-cli.sh publish-root "$VERSION" cli-dist

      - name: Purge the channel manifest from the CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # The one mutable URL; everything under cli/<tag>/ is immutable.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://downloads.reliantlabs.io/daemon-channels.json"]}' || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [[ "$HTTP_CODE" -ne 200 ]]; then
            echo "::warning::Cache purge of daemon-channels.json returned HTTP ${HTTP_CODE}: $(echo "$RESPONSE" | head -n -1)"
          fi

      - name: CLI summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          {
            echo "## :package: Standalone CLI (${CHANNEL})"
            echo ""
            echo "| Platform | Archive |"
            echo "|:---------|:--------|"
            jq -r --arg ch "$CHANNEL" '.channels[$ch].platforms | to_entries[] | "| \(.key) | [\(.value.url | split("/") | last)](\(.value.url)) |"' cli-dist/daemon-channels.json
            echo ""
            echo "Channel manifest: https://downloads.reliantlabs.io/daemon-channels.json · signature: \`${SIGNATURE_ASSET}\` on the [GitHub Release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # SBOMs: a CycloneDX SBOM per CLI archive, beside the signed set
  # ============================================================================
  # The pinned forge's `forge vuln sbom --file` (its pinned syft) describes the
  # binary in each reliant_<os>_<arch>.tar.gz, its Go modules and toolchain,
  # named for the archive and the tag; the GitHub Release gets
  # <archive>.cdx.json beside each archive, as forge's own releases do
  # (forge#2691). The server image's SBOM is control-plane's release cut's.
  # These are evidence, outside the signed set: unsigned, never on R2, and a
  # re-run replaces them (scripts/release-cli.sh sbom / store-sbom-github).
  #
  # WARN-FIRST, like an SBOM at any forge cut: nothing needs this job and it is
  # continue-on-error, so it never fails or delays the release, and an archive
  # forge cannot describe is a warning. A prebuild or dry-run dispatch keeps
  # them as the cli-sboms artifact and attaches nothing.
  cli-sbom:
    name: CLI SBOMs
    needs: [prepare, cli-archives, cli-publish]
    if: always() && needs.cli-archives.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write # gh release view/upload of the SBOMs
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      # scripts/forge.sh builds the forge forge.yaml pins with it (go install).
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Only unpublished runs describe this run's build. A publisher may have
      # recovered older signed bytes instead of publishing these archives.
      - name: Download the CLI archives
        if: needs.cli-publish.result != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-archives
          path: cli-dist

      - name: Describe the unpublished archives
        if: needs.cli-publish.result != 'success'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-cli.sh sbom "$VERSION" cli-dist cli-sbom

      - name: Describe the published signed archives
        if: needs.cli-publish.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-cli.sh sbom-published "$VERSION" cli-sbom

      - name: Upload the SBOMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-sboms
          path: cli-sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Attach the SBOMs to the GitHub Release
        if: ${{ !cancelled() && needs.cli-publish.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-cli.sh store-sbom-github "$VERSION" cli-sbom

  # ============================================================================
  # VERIFY: the release is downloadable, as a client sees it
  # ============================================================================
  # A green build has not meant "released": v1.8.1 failed late and v1.8.6's
  # purge died, and both times the feeds kept serving the previous version
  # while the run looked done. This job reads what downloads.reliantlabs.io
  # serves through the CDN: every variant's installer and archive returns 200,
  # every update feed of the channel reads this version, every file a feed
  # names exists, and the GitHub Release page exists. Any miss fails the run,
  # which release-health.yml turns into a `release:failed` issue.
  #
  # The web SPA is not checked here: app.reliantlabs.io ships with the prod
  # API (control-plane scripts/promote-prod.sh), not with the tag, so that the
  # SPA never calls RPCs the deployed API does not have yet.
  verify-published:
    name: Verify published release
    needs: [prepare, finalize, cli-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.prepare.result == 'success' && github.event.inputs.dry_run != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Every variant and every feed is live
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: scripts/verify-release-artifacts.sh "$VERSION" --channel "$CHANNEL" --wait 600

      # The standalone CLI (cli-publish): daemon-channels.json names this release
      # for its channel, and every archive, checksums.txt and the signature it
      # names are live with the sha256s checksums.txt records.
      - name: The CLI archives and the channel manifest are live
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: bash scripts/release-cli.sh verify-published "$VERSION" "$CHANNEL" --wait 600

      - name: The GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$VERSION" --json tagName,url -q '"\(.tagName) \(.url)"' \
            || { echo "::error::no GitHub Release for $VERSION: Finalize's 'Publish the GitHub Release' did not run or failed"; exit 1; }
