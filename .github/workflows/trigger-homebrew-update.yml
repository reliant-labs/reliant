name: Trigger Homebrew Cask Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to send to homebrew-reliant (e.g. 1.3.0 or v1.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-homebrew-update:
    name: Dispatch Homebrew update
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Normalize version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION_NUM=${INPUT_VERSION#v}
          echo "version=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "Dispatching Homebrew update for version: $VERSION_NUM"

      - name: Trigger Homebrew tap update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/reliant-labs/homebrew-reliant/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"version\":\"$VERSION\"}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "GitHub dispatch HTTP status: $HTTP_CODE"
          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "::error::Homebrew dispatch failed: $BODY"
            exit 1
          fi

          echo "Homebrew dispatch succeeded"
