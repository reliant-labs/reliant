name: CI

# A thin wrapper over the two local gates (dev-docs/merge-and-release-gates.md).
# Every job is setup, then `task <name>`: what a check does lives once, in
# Taskfile.yml and the scripts it runs, so CI and a laptop cannot disagree.
#
# REVIEW FIRST (owner, 2026-10-30): no CI minutes on a head nobody has
# reviewed. pr-review (control-plane docs/pr-pipeline.md) reads the diff, not
# CI results, and a pull request is pushed about twice before it merges.
#
#   pull_request                      nothing heavy: "CI result", green in
#                                     about a minute, which is what lets GitHub
#                                     enqueue the PR once pr-review passes it.
#                                     The review itself is the separate
#                                     "Reliant review" check (reliant-review.yml),
#                                     which the ruleset also requires
#   merge_group                       NOT HERE: merge-queue.yml, one gate job,
#                                     `task ci:merge -- --queue`, five-minute
#                                     budget (owner, 2026-11-01), and beside
#                                     it `task ci:golangci` (owner, 2026-11-08)
#   push to main, schedule, dispatch  task release:gate  the whole suite plus
#                                     every lane, recorded per sha; never
#                                     blocks a merge, gates every release
#
# A pull request labelled `ci:run` gets the merge tier (the merge gate and
# golangci on the changed packages) and the lanes its paths reach, read on the
# next push (see `pull_request:` for why not on `labeled`).
#
# A red main does not block merges: pipeline-health files a fix
# (`pipeline:slo`), and `task release:tag` refuses a sha without a green
# release-gate record, so it is fixed before the next release. The release
# gate here records its verdict as a git note (refs/notes/release-gate), the
# same record a local `task release:gate` writes, so `task release:tag`
# accepts a green from either.
#
# Beside the gates run the lanes neither covers (scripts/ci-lanes.sh): the
# renderer's release build, Playwright, the electron package, and the vendored
# control-plane contract. A `ci:run` pull request runs those its paths reach;
# main runs all of them (the release build as the release gate's webbuild
# part), and the release record (`Release gate`) is written only when the
# release build, Playwright and the electron smoke passed, so a release is
# never cut over them. The merge queue runs none of them: they do not fit its
# five-minute budget (merge-queue.yml).
#
# DB-backed tests need no service container and no DATABASE_URL: forge pgtest
# boots an embedded Postgres per runner (internal/db/testutil.go).
on:
  # Default activity types only (opened, synchronize, reopened), NOT
  # `labeled`: every pipeline label (merge:queue, review:passed, ...) would
  # start a run, and a run on an unchanged head REPLACES that head's
  # "CI result". `ci:run` is read on the next push (an empty commit will do).
  pull_request:
    branches: [main]
  # No merge_group: the merge queue's "CI result" is merge-queue.yml's.
  push:
    branches: [main]
  schedule:
    # 06:17 UTC daily: off the top of the hour, where GitHub's scheduler
    # queues are longest, and before the Americas workday.
    - cron: "17 6 * * *"
  workflow_dispatch:

# A PR: a new push obsoletes the run in progress. Main: the run in progress
# always finishes, and a newer push SUPERSEDES the pending one (owner,
# 2026-11-01). Every push to main shares one group with cancel-in-progress
# false, and GitHub keeps at most one pending run per group, cancelling the
# older one when a newer one queues; so a burst of merges costs the run in
# progress plus one run of the newest commit. The release tags the newest
# commit with a green record (release-tag.sh --commit), and gate-health passes
# over a superseded (cancelled) run. The event is part of the group, so the
# daily schedule and a dispatch never supersede a push run, nor it them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `|`, not `,`: fall back to the module's origin on ANY proxy error, not only
  # a 404 (one transient stream reset failed five test binaries, run 39676414820).
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # ── What this run reaches ─────────────────────────────────────────────────
  # The diff base, and the path lanes neither gate decides. On a PR,
  # actions/checkout is GitHub's merge commit, whose first parent is the base it
  # merged onto, so HEAD^1..HEAD is exactly what merging brings in.
  lanes:
    name: Lanes
    # Not on an unlabelled pull request (REVIEW FIRST): every lane needs it.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.base.outputs.base }}
      web: ${{ steps.lanes.outputs.web }}
      playwright: ${{ steps.lanes.outputs.playwright }}
      electron: ${{ steps.lanes.outputs.electron }}
      cp_contract: ${{ steps.lanes.outputs.cp_contract }}
      go_timings_from: ${{ steps.go-timings.outputs.from }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = pull_request ]; then
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 3 ]; then base=$(git rev-parse HEAD^1)
            else base=$(git merge-base "origin/${BASE_REF}" HEAD); fi
          elif [ -n "${PUSH_BEFORE}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base=${PUSH_BEFORE}
          else
            base=$(git rev-parse HEAD^)
          fi
          echo "base=${base}" | tee -a "$GITHUB_OUTPUT"
      - name: Path lanes
        id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) task ci:lanes -- --base "${BASE}" ;;
            # The control-plane contract judges what a push changed here.
            push) task ci:lanes -- --full --base "${BASE}" ;;
            *) task ci:lanes -- --full ;;
          esac | tee -a "$GITHUB_OUTPUT"
      # The release gate's go shards balance on the package seconds the newest
      # record before this commit measured (scripts/release-gate.sh
      # go-timings-source). Picked ONCE, here, for every shard: shards that
      # each picked their own could split the packages on different timings,
      # which assemble refuses. None found: the committed
      # scripts/release-gate-go-timings.json.
      - name: Go shard timings
        id: go-timings
        if: github.event_name != 'pull_request'
        run: echo "from=$(scripts/release-gate.sh go-timings-source HEAD^ || true)" | tee -a "$GITHUB_OUTPUT"

  # ── Migration order (every event) ─────────────────────────────────────────
  # A migration versioned at or below main's newest is never applied, and the
  # migrator refuses to boot on it: every pod crash-loops. The merge gate runs
  # this check, but a PR merged without the queue skips the merge gate, which
  # is how #1666 landed 20261027140617 under prod's 20261029064544
  # (reliant#1970). So it runs on EVERY event, an unlabelled PR included: a PR
  # and a merge group against a freshly fetched origin/main, a push against the
  # commit before it, which fails main's CI result (and so its release record)
  # before a release can carry the file.
  migration-order:
    name: Migration order
    runs-on: ubuntu-latest
    # Includes cold toolchain/module setup, not just the seconds-long check.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # This standalone git/filesystem tool needs neither the full
          # application build cache nor embedded Postgres binaries.
          go-build-cache: "false"
          postgres-cache: "false"
      - name: New migrations are above main's newest
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) task ci:migration-order ;;
            *)
              if [ -n "${PUSH_BEFORE}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then base=${PUSH_BEFORE}
              else base=$(git rev-parse HEAD^); fi
              task ci:migration-order BASE="${base}" ;;
          esac

  # ── The merge tier on a ci:run pull request (the queue: merge-queue.yml) ──
  merge-gate:
    name: Merge gate
    needs: lanes
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: ubuntu-latest
    # The slowest green run was 25 min (a 208-file proto change). A runner that
    # dies holds the job, and the merge queue's entry, until this fires.
    timeout-minutes: 40
    env:
      BASE: ${{ needs.lanes.outputs.base }}
      # scripts/check-compat.sh reads the pull request's labels (an owner-accepted break).
      CI_PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "true"
          ripgrep: "true"
          free-disk: "true"
          buf: "true"
      # MG_LOGDIR keeps the phase logs where the upload below finds them.
      # --skip-golangci: the golangci job below lints the changed packages on
      # its own runner (with golangci-lint installed), as the merge queue's
      # does, so this runner neither installs it nor lints twice.
      - name: task ci:merge
        run: MG_LOGDIR="${RUNNER_TEMP}/merge-gate" task ci:merge -- --base "${BASE}" --skip-golangci
      - name: task test:flake (each new or changed test, three times)
        if: ${{ !cancelled() }}
        run: task test:flake -- --base "${BASE}"
      - name: task ci:repo-checks
        if: ${{ !cancelled() }}
        run: task ci:repo-checks BASE="${BASE}"
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "${RUNNER_TEMP}/merge-gate/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload the gate's phase logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-logs
          path: ${{ runner.temp }}/merge-gate
          retention-days: 7
          if-no-files-found: ignore

  # The merge queue's golangci job (merge-queue.yml) on a ci:run pull request,
  # beside the merge gate: golangci-lint on the changed packages, findings on
  # changed files only. Main runs the whole module in the release gate's lint.
  golangci:
    name: golangci (changed)
    needs: lanes
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ needs.lanes.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          golangci: "true"
          postgres-cache: "false"
      - name: task ci:golangci
        run: task ci:golangci -- --base "${BASE}"

  # ── The release tier (main, nightly, dispatch) ────────────────────────────
  # The whole suite on this commit, in a private checkout, recorded as a git
  # note pushed to origin, so `task release:tag` can cut a release from it. A
  # sha that already has a green record (a local run) passes at once. A
  # dispatch on a branch other than main runs it without publishing a record.
  #
  # PARALLEL PARTS. The gate's steps run as parts, one job each
  # (scripts/release-gate.sh's header lists them), and `Release gate` below
  # assembles their part records into the one record and publishes it. Run in
  # one job, one step after another, the gate took 45-70 minutes (2026-10-30:
  # test 1345-2112s, integration 591-897s, lint 365-549s, generate 201-396s),
  # and every release waited on it. A missing step, or a shard of a part, fails
  # the assembly closed: no record is written.
  #
  # STATIC IS THREE PARTS HERE (generate, webbuild, compile). As one part its
  # slow steps ran one after another, generate 283s then webbuild 223s, and it
  # was one of the three jobs that set the run's wall time (~15 min). The
  # webbuild part is also the renderer's release build on main: the
  # `web-bundle` job runs the same `task build:web:verify` and now runs only on
  # a ci:run pull request, where no release gate runs. It also holds the
  # forge demo bundle to its size budget (demo-size, task demo:bundle-size)
  # after the renderer's build: release-only. The RC train
  # (control-plane scripts/rc/rl-gate.sh) still runs static whole; assemble
  # takes either.
  #
  # FOUR GO SHARDS, balanced on the package seconds the newest earlier record
  # measured (Lanes' go_timings_from; the committed timings file without one).
  # Three shards on timings from 2026-11-10 ran 587-1030s of tests each.
  release-gate:
    name: Release gate (${{ matrix.label }})
    needs: lanes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every part reports: one failure must not hide another part's.
      fail-fast: false
      matrix:
        include:
          - { label: "generate", part: generate, shard: "" }
          - { label: "webbuild", part: webbuild, shard: "" }
          - { label: "compile", part: compile, shard: "" }
          - { label: "lint", part: lint, shard: "" }
          - { label: "go 1/4", part: go, shard: "1/4" }
          - { label: "go 2/4", part: go, shard: "2/4" }
          - { label: "go 3/4", part: go, shard: "3/4" }
          - { label: "go 4/4", part: go, shard: "4/4" }
          - { label: "web", part: web, shard: "" }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # webbuild is the renderer alone (node): no Go, buf or ripgrep to set up.
      - uses: ./.github/actions/setup
        id: setup
        with:
          go: ${{ matrix.part == 'webbuild' && 'false' || 'true' }}
          node: "true"
          ripgrep: ${{ matrix.part == 'webbuild' && 'false' || 'true' }}
          free-disk: ${{ matrix.part == 'webbuild' && 'false' || 'true' }}
          buf: ${{ matrix.part == 'webbuild' && 'false' || 'true' }}
          # lint: the pinned golangci-lint release on PATH (cached; the merge
          # queue's golangci job runs the same binary). With none on PATH,
          # forge lint built golangci-lint from source on every run first.
          golangci: ${{ matrix.part == 'lint' && 'true' || 'false' }}
      - name: Identify the record's author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The Temporal dev-server tests (internal/triggers, workflow/runtime,
      # e2e/stories, ...) use a `temporal` on PATH, and otherwise each test
      # process downloads the SDK's pinned CLI into one shared /tmp path on
      # first use. Several packages doing that at once on one runner failed
      # 16 tests with "start Temporal dev server: unexpected EOF" (release
      # gate go 3/3, 2026-10-30). One cached, retried install per runner.
      - name: Temporal CLI (cached)
        if: ${{ matrix.part == 'go' || matrix.part == 'web' }}
        id: temporal-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/temporal-cli
          key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-1.9.1
      - name: Install the Temporal CLI on PATH
        if: ${{ matrix.part == 'go' || matrix.part == 'web' }}
        env:
          # The CLI go.temporal.io/sdk v1.50.0's testsuite downloads itself.
          TEMPORAL_CLI_URL: https://temporal.download/assets/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          dir="$HOME/.local/temporal-cli"
          if [ ! -x "$dir/temporal" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$TEMPORAL_CLI_URL" | tar -xz -C "$dir" temporal
          fi
          "$dir/temporal" --version
          echo "$dir" >> "$GITHUB_PATH"
      # Every part's install phase installs electron, whose postinstall downloads
      # Electron's zip from github.com releases (static and go 2/3 failed on
      # it as well as web, 1f81a402e). Restored in every part from the entry
      # the Electron package smoke job keeps (see that job); saved here by the
      # web part on main if missing.
      - name: Read the Electron version
        id: electron-version
        # The version electron/pnpm-lock.yaml resolves for the app's direct
        # dependency (importers ".", peer suffix "(...)" dropped).
        run: |
          locked() {
            v=$(awk -v p="$1" '$0 == "      " p ":" { f = 1; next } f && /^        version: / { v = $2; sub(/\(.*/, "", v); print v; exit }' electron/pnpm-lock.yaml)
            [ -n "$v" ] || { echo "electron/pnpm-lock.yaml resolves no $1" >&2; return 1; }
            echo "$v"
          }
          electron=$(locked electron)
          echo "zip=electron-zip-${RUNNER_OS}-${RUNNER_ARCH}-${electron}" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron zip
        id: electron-zip
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-version.outputs.zip }}
      # golangci-lint's analysis cache, for the lint part. golangci-lint over
      # the whole module is most of the part's ~866s, and it ran cold on every
      # push: nothing restored ~/.cache/golangci-lint. The cache is
      # content-addressed (a package's entry is keyed on its files, its
      # dependencies' and the analyzers), so a warm run re-lints what changed
      # and reports the same findings. Measured on a 48-CPU host (2026-11-20):
      # cold 779s, the same commit warm 136s, four commits later (a change to
      # internal/workflow/cel, which most packages import) 616s. The key names
      # .golangci.yml and go.mod (the forge pin, so golangci-lint's release,
      # and Go's version): a change to either starts cold.
      - name: Note when golangci-lint's cache was restored
        if: matrix.part == 'lint'
        run: echo "LINT_CACHE_RESTORED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore golangci-lint's cache
        if: matrix.part == 'lint'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint
          key: release-gate-golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.mod') }}-${{ github.sha }}
          restore-keys: release-gate-golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.mod') }}-
      - name: task release:gate (part ${{ matrix.label }})
        env:
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
          RG_GO_TIMINGS_FROM: ${{ needs.lanes.outputs.go_timings_from }}
        run: RELEASE_GATE_DIR="${RUNNER_TEMP}/release-gate" task release:gate -- --part "${PART}" ${SHARD:+--shard "${SHARD}"} "${GITHUB_SHA}"
      # Saved on main, whatever the lint found, trimmed first to the entries
      # this run used, as go-cache trims the build cache (its header says
      # why): golangci-lint's cache is Go's format, which refreshes an entry's
      # mtime when it is used and over an hour old, so anything older than the
      # restore (minus an hour and five minutes) is an entry no package of
      # this commit needed, and saving it would grow the entry every push.
      - name: Trim golangci-lint's cache to this run's entries (main only)
        if: ${{ !cancelled() && matrix.part == 'lint' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/golangci-lint"
          [ -d "${dir}" ] || exit 0
          before="$(du -sh "${dir}" | cut -f1)"
          find "${dir}" -type f -mmin +"$(( ($(date +%s) - LINT_CACHE_RESTORED_AT) / 60 + 65 ))" -delete
          echo "golangci-lint cache: ${before} -> $(du -sh "${dir}" | cut -f1)"
      - name: Save golangci-lint's cache (main only)
        if: ${{ !cancelled() && matrix.part == 'lint' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/golangci-lint
          key: release-gate-golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.mod') }}-${{ github.sha }}
      # The renderer the webbuild part built and verified, also when the
      # verification failed, so the offending asset can be downloaded (what
      # the web-bundle job uploads on a pull request).
      - if: ${{ !cancelled() && matrix.part == 'webbuild' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ runner.temp }}/release-gate/snap/frontends/web/dist
          retention-days: 1
          if-no-files-found: ignore
      - name: Save the Electron zip (main only)
        if: ${{ matrix.part == 'web' && steps.electron-zip.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-version.outputs.zip }}
      - name: task ci:repo-checks
        if: ${{ !cancelled() && matrix.part == 'compile' }}
        run: task ci:repo-checks BASE="${{ needs.lanes.outputs.base }}"
      # ── The vulnerability scan: REPORT-ONLY (warn-first) ──────────────────
      # reliant dogfooding the scans forge ships, as forge's own CI does
      # (forge#2717), on main's pushes and on dispatch. It rides the compile
      # part, which already runs on main, so it adds no runner, and it runs
      # after the part's record is written, so it never changes it.
      #   - `forge ci vuln-scan --go`: govulncheck over every Go module (forge
      #     builds its pinned govulncheck), ci.vuln_scan.exemptions applied.
      #     "Does reliant CALL vulnerable Go code."
      #   - `forge ci vuln-sbom`: forge's pinned syft describes every lockfile
      #     and manifest (go.mod, the pnpm locks), its pinned grype scans that
      #     against the vulnerability database, judged by the default vuln_gate
      #     rule (KEV and fixable criticals block, high warns). "What does
      #     reliant depend on that is known vulnerable," npm included.
      #
      # IT NEVER FAILS MAIN: continue-on-error. Below the vuln-gate lint
      # rollout (forge.yaml's forge_version under v1.11.0) vuln-sbom prints a
      # blocking finding and exits 0, and a scan that cannot run exits 78, an
      # allowed SKIP, turned into a warning here. govulncheck has no warn-first
      # mode and the pin will cross v1.11.0, so the step as a whole must not
      # gate: whether a finding blocks main or a release is the owner's call
      # (dogfood/owner-reliant.md), not this step's. Read its warnings and the
      # step log; the release record does not look at it.
      #
      # THE DATABASE IS FETCHED PER RUN, NEVER CACHED. `forge ci vuln-sbom`
      # downloads nothing itself (no database = SKIP), so `forge vuln db pull`
      # fetches it first (~200 MB). It unpacks to ~3.4 GB: an actions/cache
      # entry of it would take a third of the repository's 10 GB budget and
      # evict the Go build caches (go-cache's header). It lives in RUNNER_TEMP
      # and is deleted after the scan.
      - name: Vulnerability scan (report-only; main and dispatch)
        if: ${{ !cancelled() && matrix.part == 'compile' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        continue-on-error: true
        env:
          FORGE_VULN_DB_DIR: ${{ runner.temp }}/vulndb
        run: |
          set -uo pipefail
          warn() { echo "::warning title=Vulnerability scan (report-only)::$*"; }
          # The forge go.mod pins, built once (scripts/forge.sh runs FORGE_BIN).
          GOFLAGS=-trimpath go build -o "${RUNNER_TEMP}/forge-pin/forge" github.com/reliant-labs/forge/cmd/forge || { warn "could not build the pinned forge; nothing scanned"; exit 1; }
          export FORGE_BIN="${RUNNER_TEMP}/forge-pin/forge"
          status=0
          scripts/forge.sh ci vuln-scan --go || { rc=$?; warn "forge ci vuln-scan --go exited ${rc}: a called Go vulnerability (or the scan could not run); see the log"; status=1; }
          if scripts/forge.sh vuln db pull; then
            rc=0
            scripts/forge.sh ci vuln-sbom || rc=$?
            case "${rc}" in
              0) ;;
              78) warn "forge ci vuln-sbom could not scan (no scanner or database): an allowed SKIP below the vuln-gate rollout" ;;
              *) warn "forge ci vuln-sbom exited ${rc}: a blocking finding, or the scan could not run; see the log"; status=1 ;;
            esac
          else
            warn "forge vuln db pull failed: the SBOM scan did not run"
            status=1
          fi
          rm -rf "${FORGE_VULN_DB_DIR}"
          exit "${status}"
      - name: Locate the part record and logs
        if: ${{ !cancelled() }}
        run: |
          echo "records=$(git rev-parse --path-format=absolute --git-common-dir)/release-gate" >> "$GITHUB_ENV"
          echo "artifact=$(echo "${{ matrix.label }}" | tr ' /' '--')" >> "$GITHUB_ENV"
      # The part record, pass or fail: `Release gate` assembles a red record
      # from a red part, as the single job recorded a red run. With it, the
      # part's Go cover profile (<part record>.cover.out), which assemble's
      # coverage step unions across the parts.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-part-${{ env.artifact }}
          path: |
            ${{ env.records }}/${{ github.sha }}.part-*.json
            ${{ env.records }}/${{ github.sha }}.part-*.cover.out
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs-${{ env.artifact }}
          path: ${{ env.records }}
          retention-days: 7
          if-no-files-found: ignore
      # The part's recorded test lanes (forge's test record, which
      # scripts/release-gate.sh writes in the private checkout), pass or
      # fail, for test-upload. Main only: a pull request's runs are never
      # uploaded (the merge gate's are, by test-upload-merge-queue.yml).
      - name: Keep the recorded test runs (main only)
        if: ${{ !cancelled() && (matrix.part == 'go' || matrix.part == 'web') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-runs-${{ env.artifact }}
          path: ${{ runner.temp }}/release-gate/snap/.forge/tests/runs
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      # Saves: main only, after the run, whatever it found. One part saves:
      # the key is the archive's, and a second save would only race it.
      - name: Save embedded Postgres binaries (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.label == 'go 1/4' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forge/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.embedded-pg }}
        continue-on-error: true

  # The record: every part's part record, assembled into this commit's
  # release-gate record and published as its git note (on main). Keeps the
  # name `Release gate`, the verdict gate-health and main-health key on.
  release-record:
    name: Release gate
    needs: [lanes, release-gate, playwright, electron-package]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # refs/notes/release-gate: the record of this run.
      contents: write
    env:
      RELEASE_GATE_PUBLISH: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Identify the record's author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The path lanes are release blockers (the merge queue does not run
      # them): no record for a commit whose Playwright or electron smoke did
      # not pass, so release:tag refuses it. The release build is the gate's
      # own webbuild step, which the record carries.
      - name: The path lanes passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries[] | select(.key == "playwright" or .key == "electron-package") | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "${RESULTS}")
          if [ -n "${bad}" ]; then echo "::error::release blockers that did not pass (no record is written):"; echo "${bad}"; exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-gate-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - name: Assemble the record
        run: |
          shopt -s nullglob
          scripts/release-gate.sh assemble "${GITHUB_SHA}" "${RUNNER_TEMP}"/parts/*.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "$(git rev-parse --git-common-dir)/release-gate/${GITHUB_SHA}.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── Main's test results, to the control plane (best effort) ───────────────
  # The release gate's parts recorded their test lanes (scripts/test-capture.sh)
  # and kept them as test-runs-* artifacts; this sends them to the control
  # plane with `forge test report --upload` (scripts/test-upload.sh), so the
  # Tests pages show main. It NEVER decides anything: not in CI result's needs
  # nor the release record's, continue-on-error, and the script exits 0 with a
  # warning when it cannot upload (no credential, a forge without --upload).
  #
  # The credential is this job's GitHub Actions OIDC identity (`id-token:
  # write`), which the control plane exchanges for a short-lived tests:write
  # token (forge's cloud.ResolveCredentialFor). The upload step passes no
  # FORGE_CONTROL_PLANE_TOKEN, so the exchange is what runs; the `tests-upload`
  # environment keeps its token (never a repository secret: reliant is
  # public) as the rollback. Only a push to main of this repository reaches
  # the job, so the code holding either is main's own, already merged, and a
  # fork's pull request never gets it.
  test-upload:
    name: Upload main's test results
    needs: [release-gate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'reliant-labs/reliant' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    environment: tests-upload
    permissions:
      contents: read
      # forge's GitHub Actions OIDC exchange: the upload's credential.
      id-token: write
    # Every action this job runs is pinned to a reviewed commit, as in any
    # privileged job (internal/version's action-pin test): it holds an OIDC
    # identity. So Go comes from setup-go directly, not ./.github/actions/setup,
    # whose steps run actions by tag; scripts/forge.sh builds the pinned forge.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # forge test report measures diff coverage against the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-runs-*
          merge-multiple: true
          path: .forge/tests/runs
      # No FORGE_CONTROL_PLANE_TOKEN: the upload uses the OIDC exchange alone
      # (TestMainTestUploadHoldsOIDC). Rollback is passing the environment's
      # token again, `FORGE_CONTROL_PLANE_TOKEN: secrets.FORGE_CONTROL_PLANE_TOKEN`
      # in this step's env, and dropping that test's assertion.
      - name: forge test report --upload
        run: scripts/test-upload.sh "${GITHUB_SHA}"

  # ── The compile cache every Go job restores (main only) ───────────────────
  # Plain -trimpath package compiles only: what a PR can reuse is the compile of
  # everything its change does not reach. Test binaries, -race variants and
  # linked tools would be dead weight that evicts this from the 10 GB budget.
  #
  # TRIMMED TO ONE COMMIT'S COMPILES before it is saved (reliant#2061). The job
  # restores the previous entry, recompiles what changed, and used to save the
  # union, so every superseded compile of every package stayed in it: 3.26 GB
  # compressed on 2026-11-09, 3.83 GB a day later, against ~3.5 GB UNcompressed
  # for a cold compile of one commit. Every Go job restores this entry first
  # (the merge queue's setup spent 52-147s extracting it, most of its
  # five-minute budget), and at that size the repository's 10 GB budget evicted
  # it outright. Go refreshes the mtime of an entry it uses that is over an
  # hour old, so after the builds everything older than the restore (minus an
  # hour and five minutes of slack) is a compile this commit did not use.
  go-cache:
    name: Go package cache (main only)
    needs: lanes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Note when the Go build cache was restored
        run: echo "GOCACHE_RESTORED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # golangci: its cached binary is saved here, on main, for the merge
      # queue's golangci job to restore.
      - uses: ./.github/actions/setup
        id: setup
        with:
          golangci: "true"
      - name: task build:packages
        run: task build:packages
      # The protoc plugins buf runs as `go tool`, so a pull request's generate
      # finds their executables in this cache instead of compiling them.
      - name: task deps:go-protoc-plugins
        run: task deps:go-protoc-plugins
      # After every build above, right before the save (the header says why).
      #
      # CHECKING IT AFTER THE MERGE. (1) The first push to main: this step's
      # "Go build cache: <before> -> <after>" line; expect <after> near 3.5 GB
      # (one commit's compiles, uncompressed). (2) Its `Save Go build cache`
      # "Cache Size": ~0.7-0.8 GB, against 3.3-3.8 GB before. (3) The next
      # merge-queue runs (merge-queue.yml, `CI result`): the go-build-trimpath
      # restore's "Cache Size" matches (2), the setup step falls from ~170s to
      # ~70s, and the gate's `build` phase in the merge-gate summary takes no
      # longer than it did on comparable groups before (a longer one means the
      # gate is compiling what the old cache held).
      #
      # ROLLING IT BACK, when (1) shows <after> under ~2 GB (the trim dropped
      # compiles this commit used), or (3) shows the `build` phase or
      # `task ci:merge` slower on comparable groups: revert the commit that
      # added this step and the "Note when ..." step above. The next push to
      # main then saves the untrimmed union again. If a bad trimmed entry is
      # what the jobs keep restoring, also delete it so that push starts cold
      # and saves a whole one: `gh cache list -R reliant-labs/reliant --key
      # go-build-trimpath-` and `gh cache delete <key>` for each listed key.
      - name: Trim the Go build cache to this commit's compiles
        run: |
          set -euo pipefail
          dir="$(go env GOCACHE)"
          before="$(du -sh "${dir}" | cut -f1)"
          stale_minutes=$(( ($(date +%s) - GOCACHE_RESTORED_AT) / 60 + 65 ))
          find "${dir}" -type f -mmin +"${stale_minutes}" -delete
          echo "Go build cache: ${before} -> $(du -sh "${dir}" | cut -f1) (dropped entries unused for ${stale_minutes}+ minutes)"
      - name: Save Go build cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: go-build-trimpath-${{ runner.os }}-${{ steps.setup.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Save Go module cache
        uses: actions/cache/save@v4
        continue-on-error: true # the exact key exists unless go.sum changed
        with:
          path: ~/go/pkg/mod
          key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}

  # ── The lanes no gate covers ──────────────────────────────────────────────

  # proto-vendor/controlplane/ must be exactly what the control-plane commit
  # its SOURCE declares exports, and that commit must be on control-plane main.
  # It judges the change under review against its OWN declaration: it used to
  # compare against control-plane main, so every control-plane proto merge
  # turned every PR reaching this lane red until someone re-vendored. Lag behind
  # control-plane main is cp-contract-drift.yml's report, never this gate.
  # control-plane is private, so this reads it with CONTROL_PLANE_DEPLOY_KEY (a
  # read-only deploy key) and FAILS without one: a gate that skips cannot be
  # told from one that passes. Fork PRs get no secrets.
  cp-contract:
    name: Vendored control-plane contract is its SOURCE commit's export
    needs: lanes
    if: needs.lanes.outputs.cp_contract == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: The control-plane commit proto-vendor/controlplane/SOURCE declares
        id: source
        run: |
          set -euo pipefail
          sha=$(sed -n 's/^control-plane \([0-9a-f]\{40\}\)$/\1/p' proto-vendor/controlplane/SOURCE 2>/dev/null | head -1)
          [ -n "${sha}" ] || { echo "::error::proto-vendor/controlplane/SOURCE names no control-plane commit; re-vendor with task contract:controlplane:sync"; exit 1; }
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"
      # At SOURCE, with main's history (commits and trees only: blob:none) so
      # the check can prove SOURCE is on control-plane main.
      - name: Check out control-plane at SOURCE (private, read-only)
        uses: actions/checkout@v6
        with:
          repository: reliant-labs/control-plane
          ref: ${{ steps.source.outputs.sha }}
          path: control-plane-sibling
          ssh-key: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
      # The vendored tree is a byte-for-byte `buf export`: the same buf as
      # control-plane's .github/actions/setup-buf pin.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.57.0"
          github_token: ${{ github.token }}
      - name: task contract:controlplane:check
        env:
          CONTROL_PLANE_DIR: ${{ github.workspace }}/control-plane-sibling
        run: task contract:controlplane:check

  # A ci:run pull request only. Off a pull request the release gate's webbuild
  # part runs this same `task build:web:verify` (scripts/release-gate.sh), and
  # its record carries the step; running both built the renderer twice.
  web-bundle:
    name: Web (lint, typecheck, release build, verify-bundle)
    needs: lanes
    if: needs.lanes.outputs.web == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
      - name: task deps:web
        run: task deps:web
      - name: task build:web:verify
        run: task build:web:verify
      # Also uploaded when verification fails, so the offending asset can be
      # downloaded and grepped.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontends/web/dist
          retention-days: 1
          if-no-files-found: ignore

  playwright:
    name: E2E Frontend (Playwright, ${{ matrix.suite }})
    needs: lanes
    if: needs.lanes.outputs.playwright == 'true'
    # In Playwright's own image, at the exact @playwright/test version
    # frontends/web resolves (pnpm-lock.yaml): the browsers and their system
    # packages are baked in, so no step installs anything from the Ubuntu
    # mirror (reliant#2880). The mirror cost the responsive leg 6.5 minutes,
    # then 14+ on 2026-11-18 (control-plane main-red #2909), and a .deb cache
    # keyed on the runner image missed on every image rollout and lockfile
    # change. TestPlaywrightRunsInThePinnedImage (tools/test-affected) fails
    # when the tag and the lockfile disagree: bump them together. The host's
    # Ubuntu no longer matters; 24.04 is kept because it is what the job
    # already ran on.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      # The runner's uid, as Playwright's CI docs run it: the workspace and
      # $HOME the runner mounts are owned by it.
      options: --user 1001
    # Two parallel jobs (Taskfile test:web:e2e:desktop and :responsive), so
    # one suite's failure or slowness never hides the other's. 20 minutes:
    # the suites' 15 before the mirror trouble, plus the image pull.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, responsive]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
      - name: task deps:web
        run: task deps:web
      # desktop: the Chromium suite (which also runs the responsive journeys
      # with mouse input). responsive: the required production-route
      # assertions in Chromium touch and WebKit phone/tablet. The image's
      # browsers are the ones this @playwright/test expects, so the task's
      # `playwright install` finds them in /ms-playwright and downloads none.
      - name: Browser guardrails (${{ matrix.suite }})
        run: task test:web:e2e:${{ matrix.suite }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            frontends/web/playwright-report
            frontends/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  electron-package:
    name: Electron (package smoke)
    needs: lanes
    if: needs.lanes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
      # Electron's postinstall fetches Electron's zip, and electron-builder its
      # packaging tools (AppImage runtime, fpm, ...), from github.com releases.
      # On 2026-11-08 those downloads answered 504 for hours and this job, and
      # the release gate's web part (its electron npm install), failed. Each is
      # cached by the version that decides its contents, restored before deps,
      # and saved on a push to main only, after a green step (the setup
      # action's header rule). The zip's entry is shared with the release gate.
      - name: Read the Electron versions
        id: electron-versions
        # The versions electron/pnpm-lock.yaml resolves for the app's direct
        # dependencies (importers ".", peer suffix "(...)" dropped).
        run: |
          locked() {
            v=$(awk -v p="$1" '$0 == "      " p ":" { f = 1; next } f && /^        version: / { v = $2; sub(/\(.*/, "", v); print v; exit }' electron/pnpm-lock.yaml)
            [ -n "$v" ] || { echo "electron/pnpm-lock.yaml resolves no $1" >&2; return 1; }
            echo "$v"
          }
          electron=$(locked electron)
          builder=$(locked electron-builder)
          echo "zip=electron-zip-${RUNNER_OS}-${RUNNER_ARCH}-${electron}" >> "$GITHUB_OUTPUT"
          echo "builder=electron-builder-${RUNNER_OS}-${RUNNER_ARCH}-${builder}" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron zip
        id: electron-zip
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-versions.outputs.zip }}
      - name: Restore electron-builder's tools
        id: electron-builder
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/electron-builder
          key: ${{ steps.electron-versions.outputs.builder }}
      - name: task deps:web deps:electron
        run: task deps:web deps:electron
      - name: Save the Electron zip (main only)
        if: steps.electron-zip.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-versions.outputs.zip }}
      - name: task build:electron:smoke
        run: task build:electron:smoke
      - name: Save electron-builder's tools (main only)
        if: steps.electron-builder.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/electron-builder
          key: ${{ steps.electron-versions.outputs.builder }}

  # ── One verdict ───────────────────────────────────────────────────────────
  # Green only when every job that ran passed. On an unlabelled PR nothing
  # heavy runs (REVIEW FIRST), so this is green within a minute and GitHub can
  # enqueue the PR once pr-review passes it (the separate, required "Reliant
  # review" check). On a ci:run PR a lane the change does not reach is
  # skipped, which is fine, but the merge gate and golangci must have run and
  # passed. (The merge queue's CI result is merge-queue.yml's.) Off a PR every
  # lane runs (scripts/ci-lanes.sh --full), so a skip there is a broken `if:`,
  # never a pass: everything but the merge gate and golangci (merge tier only;
  # the release gate lints the whole module), web-bundle (a pull request's;
  # the release gate's webbuild part off one), go-cache (only a push runs it)
  # and cp-contract (only a change to the vendored contract does) must have
  # succeeded.
  ci-result:
    name: CI result
    needs: [lanes, migration-order, merge-gate, golangci, release-gate, release-record, go-cache, cp-contract, web-bundle, playwright, electron-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CI_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run') }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "${RESULTS}")
          if [ "${EVENT_NAME}" = pull_request ] && [ "${CI_RUN}" != true ]; then
            # REVIEW FIRST: the merge tier runs in the merge queue.
            if [ -n "${bad}" ]; then echo "::error::jobs that did not pass:"; echo "${bad}"; exit 1; fi
            echo "review first: the merge tier runs in the merge queue (label ci:run and push to run it here)"
            exit 0
          fi
          merge_tier=$([ "${EVENT_NAME}" = pull_request ] && echo true || echo false)
          gate=$([ "${merge_tier}" = true ] && echo merge-gate || echo release-record)
          [ "$(jq -r .lanes.result <<< "${RESULTS}")" = success ] || bad="${bad}"$'\n'"lanes: no lane was selected"
          [ "$(jq -r --arg g "${gate}" '.[$g].result' <<< "${RESULTS}")" = success ] || bad="${bad}"$'\n'"${gate}: must run and pass on ${EVENT_NAME}"
          if [ "${merge_tier}" = true ]; then
            [ "$(jq -r '.golangci.result' <<< "${RESULTS}")" = success ] || bad="${bad}"$'\n'"golangci: must run and pass on ${EVENT_NAME}"
          fi
          if [ "${merge_tier}" != true ]; then
            skipped=$(jq -r --arg e "${EVENT_NAME}" 'to_entries[] | select(.value.result == "skipped") | select(.key != "merge-gate" and .key != "golangci" and .key != "web-bundle" and .key != "cp-contract" and (.key != "go-cache" or $e == "push")) | "\(.key): skipped on \($e), where every lane runs"' <<< "${RESULTS}")
            bad="${bad}"$'\n'"${skipped}"
          fi
          bad=$(grep . <<< "${bad}" | sort -u || true)
          if [ -n "${bad}" ]; then echo "::error::jobs that did not pass:"; echo "${bad}"; exit 1; fi
          echo "every job that ran passed"
