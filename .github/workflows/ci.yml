# Code generated by forge. DO NOT EDIT.
name: CI

on:
  push:
    branches: [main]
  # NO PATH FILTER. `CI gate` is the main ruleset's required check, and a
  # workflow a path filter skips never reports it: a docs-only pull request
  # would wait on it forever. A job-level `if:` would keep the skip and still
  # report, but it needs a detect-changes job that every other job waits
  # behind — one more runner queue (median 7 minutes on 2026-10-20) on every
  # pull request, to save a few runner-minutes on the ~4% that are prose only
  # (5 of the 120 merged before 2026-10-21). A pull request runs only the
  # cheap review-first jobs (REVIEW FIRST, below), so the filter would save
  # nothing anyway.
  #
  # Default activity types only (opened, synchronize, reopened), NOT
  # `labeled`: every pipeline label (merge:queue, review:passed, ...) would
  # start a run, and a run on an unchanged head REPLACES that head's `CI gate`
  # result, so a label event could turn a red pr-checks verdict green. The
  # `ci:run` label is read on the next push (an empty commit will do).
  pull_request:
    branches: [main]
  # The merge queue: each queued pull request is tested as main plus the
  # entries ahead of it, and lands only if `CI gate` passes on that. This is
  # the first time the merge tier runs for an unlabelled pull request.
  merge_group:
  # Run the push-to-main tier (full mode, -race, Windows) on any branch.
  workflow_dispatch:

permissions:
  contents: read

# ── REVIEW FIRST ───────────────────────────────────────────────────────────
#
# The owner's rule (2026-10-30): CI minutes are not spent on a head nobody has
# reviewed yet. The reviewer (control-plane pr-review) reads the diff, not CI
# results, and most pull requests are pushed more than once before they pass
# (1.7 pull-request runs per merged pull request, 2026-10-30). So:
#
#   pull request      pr-checks (CHANGELOG guard + pkg/ API gate: they read
#                     the pull request itself, ~1-2 min). `CI gate` is green
#                     on the head as soon as they pass, which is what lets
#                     GitHub enqueue it. The review itself is the separate,
#                     required `Reliant review` check (reliant-review.yml).
#   merge queue       the merge tier below, ONCE, on main plus the entry:
#                     the run that decides whether the commit lands.
#   push to main      the slow tier, after the merge. Never blocks a merge:
#                     a red main is filed and fixed by pipeline-health, and
#                     a release needs a green record (release-forge.sh).
#
# A pull request labelled `ci:run` also gets the merge tier on every push
# (read at push time; see `pull_request:` above for why not on `labeled`),
# and `ci:e2e` / `ci:canary` still start their own workflows.
#
# A required check that never runs on the PULL REQUEST cannot hold a pull
# request out of the queue for reasons that are not its own (16 reliant pull
# requests sat with review:passed and auto-merge armed on 2026-10-30, red for
# main-wide reasons). Only pr-checks can fail there, and both of its checks
# judge the pull request's own diff and description.
#
# ── THE MERGE TIER AND THE SLOW TIER ───────────────────────────────────────
#
# THE MERGE QUEUE gets the fast tier: a five-minute MEDIAN wall time, queue
# included, from jobs of about three minutes each:
#
#   test-short        two -short shards, no -race (scripts/ci-test-shard.sh),
#                     and an independent changed-test flake gate, -count=3.
#                     Whole-repo guard scans/renders run only on main/full.
#   checks            forge generate is a no-op, KCL validates, pre-commit hooks,
#                     Go and npm dependency licenses
#   golangci          golangci-lint over the packages the entry changed, findings
#                     in the files it changed (owner, 2026-11-08; #1947), a job
#                     of its own so it runs beside the two above, not after them
#
# THE RULE FOR THIS TIER: a check that cannot finish inside that budget is not
# on it. A slow test skips under -short and runs on main; a slow job runs on
# main. Measured on 2026-10-21 (24 pull-request runs, 8 jobs each): median
# 9.2 minutes, p90 17.7, 12% under five — and the jobs themselves ran 2-4
# minutes. The rest was the runner queue (below) and the gate waiting behind
# it. So what left the pull request that day, each to main:
#
#   golangci-lint (root and pkg/), go vet, go vet -tags e2e  -> lint (main)
#   govulncheck                                              -> build (main)
#   the windows/amd64 cross-compile                          -> windows (main, native)
#   the flake gate's -race                                   -> test, test-cli (main)
#
# `go test` still runs vet's high-confidence analyzers on every package it
# tests, so a pull request is not unvetted; a windows-only compile break is
# found on main and bisected from there. golangci-lint came back to the merge
# tier on 2026-11-08 (owner; #1947), after #1931 and #1930 each turned main's
# Lint red the moment they merged: the `golangci` job lints only the packages
# an entry changed, so its cost follows the diff, not the repo, and it is a job
# of its own beside test-short and checks so it never lengthens them. The
# whole-repo pass (what a change broke elsewhere) stays in lint, on main.
#
# The merge tier runs over main plus the entries ahead of it. The slow tier
# stays on main: in the queue it would hold every merge behind a 30-minute
# run, so a failure only it finds (e2e, the guards, full -race, native
# Windows) is bisected from main, and a release cannot be cut until it is
# fixed. Jobs select when they run with exactly one of these spellings
# (internal/ciguard holds every job to them; a job with no `if:` runs always):
#   merge tier:   github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:run'))
#   push-to-main: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
#   all but an unlabelled pull request (checks, which also saves main's tools cache):
#                 github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run')
#   pull request only (pr-checks): github.event_name == 'pull_request'
#
# A PUSH TO MAIN (and workflow_dispatch) gets `checks`, plus the slow tier
# (test-short-warm stands in for test-short there):
#
#   lint              golangci-lint (root and pkg/), go vet, go vet -tags e2e
#   test, test-cli    full mode (no -short) under -race
#   test-short-warm   the whole -short tier, then the guards (full mode, -p 1);
#                     saves the build cache test-short restores and the
#                     module cache
#   build             the release build, go-licenses, govulncheck
#   windows           native Windows: build, vet, -short tests, smoke
#
# FEWER JOBS. The org runs at most 20 jobs at once across every repository,
# and on 2026-10-21 half of all minutes had every slot busy (reliant's CI
# about half the load, forge's push-to-main tier about 30%, forge's pull
# requests about 10%). A busy org starts a pull request's jobs minutes apart,
# and `CI gate` queues again behind the last of them, so every job a pull
# request runs is another place to wait. It ran 8 (13 before the pre-commit,
# license-gate and Library Lint workflows were folded in, 9 once the guards
# joined it); in the merge queue it runs 4, gate included: test-short (one
# entry, the flake gate inside it), checks, golangci and the gate. No full
# guard runs extend those entries. golangci is the one job added back since
# (owner, 2026-11-08): a lint step at the end of test-short or checks would
# have lengthened the slower of them by the lint's own time, and the merge
# queue's budget is wall time, not runner slots.
#
# CACHE-SOUND REPLAY. The -short tier is held cache-sound (reliant.md,
# "Testing tiers"), so a package whose inputs did not change replays main's
# result instead of running. That needs two things this file provides:
# test-short-warm and test-short run the same `go test` flags
# (scripts/ci-test-shard.sh) under the same environment (the same steps in
# the same order, so the same PATH); and file mtimes that depend on content,
# not on when the checkout happened (scripts/ci-normalize-mtimes.sh says why
# Go needs that).
#
# NOT -trimpath, though it would key the tests' scaffolded temp-dir builds
# reusably: under it a forge test binary cannot show it was built from this
# checkout (buildinfo.SourceRoot comes from runtime.Caller), so
# internal/tierguard's renders delegate to a rebuilt checkout forge and fail
# (forgecompat.AssessSkew, SkewUnverifiable).
#
# plus e2e-suite.yml and e2e-scaffold.yml (which also run nightly). Speed on
# the pull request was chosen over catching everything before merge: a test
# that needs more than ~2s skips under -short (`if testing.Short()`) and runs
# on main, and a red main is bisected from there. Nothing was deleted — every
# check that left the pull request runs on every push to main.
#
# `gate` (CI gate) needs every job, fails if any failed, and writes each
# job's wall time and the run's critical path to the run summary.

# On a pull request a newer push cancels the run in progress. On main the run
# in progress always finishes, and a newer push SUPERSEDES the pending one:
# every push to main shares one group with cancel-in-progress false, and
# GitHub keeps at most one pending run per group, cancelling the older one
# when a newer one queues (owner, 2026-11-01). So a burst of merges costs the
# run in progress plus one run of the newest commit, and the commits between
# get no verdict; a release tags the newest commit whose run is green
# (release-forge.sh --commit). Cancelling the run in progress on main is never
# allowed: it let each merge kill the run before it, and control-plane lost
# every main run for 2.5 hours on 2026-10-11 (control-plane#831).
#
# The event is part of the group, so a dispatch never supersedes a push run,
# and a merge_group run is alone in its group (its ref names the group's own
# head). Every workflow here follows the same rule, and
# internal/templates/ci_concurrency_test.go holds them to it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Go version is read from go.mod's `go` directive via setup-go's
# `go-version-file` input so CI stays in sync with the project's declared
# version without a duplicate env var that drifts.
#
# Build-cache note (the "Restore Go build cache" steps below).
#
# Every Linux job restores through .github/actions/restore-go-caches with
# setup-go's `cache: false`: one go-mod entry per go.sum plus a build scope.
# FOUR scopes are saved, each by one job, and the budget is planned around
# them (10 GB for the repository):
#
#   go-build-short   test-short-warm, every push   test-short, lint     ~1.3 GB
#   go-build-tools   checks, every push            checks, build, e2e   ~1.0 GB
#   go-build-test    test, once a UTC day          test, test-cli       ~2.2 GB
#   go-build-windows windows, once a UTC day       windows              ~1.0 GB
#
# plus e2e-prepare (daily, ~0.5 GB) and the consumer canary (daily, ~1.5 GB).
# The two the merge tier restores are refreshed by every push; every
# other scope once a day (restore-go-caches, "<rev> IS THE COMMIT OR THE
# DAY"). Before that every job saved its own scope on every push, ~9.5 GB per
# push, and each push evicted the merge tier's entries: Checks then
# ran cold, 400-620s instead of ~185s. A job that would add a scope restores
# one of these instead, unless its artifacts share nothing with them.
#
# setup-go's own `cache: true` DOES cache the build cache — it saves
# `go env GOCACHE` alongside `go env GOMODCACHE`. What it does not do is
# give that cache any RESTORE-KEYS: cache-restore.ts calls
# restoreCache(paths, primaryKey) with no fallback list, and the primary
# key ends in a hash of go.sum. So the hit is all-or-nothing — touch a
# single dependency and the restore misses, and the job recompiles the
# world from cold rather than reusing the ~99% of build artifacts that
# did not change.
#
# A go.sum change is not the rare case here: Dependabot bumps it
# continuously, and that is exactly the PR where a cold compile is least
# affordable. The steps below add a second, keyed
# cache over the same GOCACHE directory with a restore-key ladder, so a
# go.sum change degrades to "reuse the previous commit's build cache"
# instead of "start from nothing".
#
# Keys are ordered most- to least-specific:
#   …-<go.sum hash>-<sha>  exact commit (a re-run reuses everything)
#   …-<go.sum hash>-       same deps, different code
#   …-                     same Go version, any deps  ← the Dependabot case
#
# GOCACHE is content-addressed and self-validating: every entry is keyed
# by the hash of its own inputs, so a stale entry is ignored rather than
# mis-used. That is what makes a loose restore-key safe here — the worst
# case of an old cache is a miss on the changed packages, never a wrong
# object.
#
# PULL REQUESTS RESTORE; ONLY MAIN SAVES. Each laddered cache is a
# `actions/cache/restore` step at the top of its job and an
# `actions/cache/save` step at the bottom that runs only on a push to main.
# A cache a pull request saves is scoped to that PR's ref: no other PR, and
# not main, can restore it. All it bought was a warm re-run of the same PR,
# and it cost everyone else their hits. The repository's cache budget is
# 10 GB, and with every PR job saving its own entry (the Windows job alone
# saved ~3.8 GB per run) the budget held about an hour of entries: on
# 2026-10-15 there was no main entry left for test-guards, windows or the
# tools scope, and the Test job ran 1045-1302s on a miss against 529s on a
# hit. Saving after the job's real work (not in a post step) also means a
# red main still saves what it compiled: `!cancelled()`, not `success()`.

jobs:
  # One job for every static check that needs the linux build: golangci-lint
  # over the root module, again over pkg/ under pkg/.golangci.yml (formerly
  # the Library Lint workflow; see the step), `go vet ./...`
  # (the pre-commit config's go-vet-mod hook, which checks skips) and
  # `go vet -tags e2e` (formerly the e2e-compile job). They share one build
  # cache scope.
  #
  # PUSH TO MAIN ONLY. At 2.5-4.5 minutes it was the longest job on a pull
  # request after the old Quick checks job, and a lint finding is the cheapest kind of
  # red main to bisect and fix. A pull request still gets vet's
  # high-confidence analyzers from `go test`. Run `forge lint` (or
  # `golangci-lint run`) locally to see a finding before main does.
  lint:
    name: Lint (golangci-lint, go vet, -tags e2e)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint type-checks the whole repo, which is a full compile
      # in all but name. Its own action caches the analyzer results; the
      # -short scope holds the Go build artifacts underneath them — the same
      # non-race linux compile `go vet` needs. Restore only: a scope of its
      # own (go-build-lint, ~0.7 GB a push) bought a few seconds over this
      # one and was evicted from the budget before its next run anyway.
      - uses: ./.github/actions/restore-go-caches
        with:
          scope: short
      # Not used by the step below (the action brings its own copy): this is
      # what saves the ci-tool-golangci-lint cache entry the merge tier's
      # `golangci` job restores, because install-release-tool saves only on a
      # push to main and no other main job installs golangci-lint through it.
      - name: Install golangci-lint (saves the merge tier's cache)
        uses: ./.github/actions/install-release-tool
        with:
          tool: golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and kept equal to templates.GolangciLintVersion by
          # TestGolangciLintVersionIsPinnedEverywhere. `latest` let v2.14.0
          # add seven findings on untouched lines with no commit in between.
          version: v2.14.0
          # No --timeout: it would override .golangci.yml's `timeout: 20m`,
          # which is deliberate — a cold cache on a busy runner crosses 5m and
          # exits 4 ("Timeout exceeded") with 0 issues, a red PR over clean code.
          # Whole-repo, not only-new-issues. The job analyses the whole repo
          # anyway (type-checking needs it); only-new-issues only HIDES what it
          # found outside the diff. That is how main stayed green while
          # failing its own linter, and the action cannot fetch a PR patch over
          # 20k lines, so large PRs silently fell back to whole-repo regardless.
          only-new-issues: false
      # Library lint: forge/pkg, the runtime library that compiles INTO every
      # generated binary, held to its own config, pkg/.golangci.yml.
      #
      # The root .golangci.yml excludes `(^|/)pkg/`, because the CLI's linter
      # set reports a backlog of findings there that is being paid down
      # separately (see that exclusion's comment). The library answers to
      # pkg/.golangci.yml instead, a narrow forbidigo gate against reading the
      # ambient environment. golangci-lint picks its config by walking up from
      # its working directory, so that config is only read by a run from pkg/,
      # which is what this step is. internal/pkgguard's
      # TestLibraryReadsNoAmbientEnvironment enforces the same rule in the test
      # jobs; this step is the only golangci-lint pass over pkg/ at all, and
      # TestLibraryLintIsGatedInCI pins that it exists.
      - name: golangci-lint (pkg/, under pkg/.golangci.yml)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned; see the step above and templates.GolangciLintVersion.
          version: v2.14.0
          # golangci-lint discovers pkg/.golangci.yml by walking up from its
          # working directory. Running from the repo root would pick the
          # root config, which excludes pkg/ entirely, and lint none of it.
          working-directory: pkg
          # No --timeout: pkg/.golangci.yml sets its own (20m).
          # NOT only-new-issues: the guardrail this library is held to is
          # whole-file, and a rule that only sees changed lines lets a
          # violation ride in on an untouched line of an edited file.
          only-new-issues: false
      # The pre-commit config's go-vet-mod hook, run here where the module is
      # already compiled; checks runs the other hooks with it skipped.
      - name: go vet ./...
        if: ${{ !cancelled() }}
        run: go vet ./...
      # The e2e files compile. They are behind `//go:build e2e`, so
      # golangci-lint (configured with no build tags) and every plain `go test`
      # never see them; the suite that runs them (e2e-suite.yml) is
      # push-to-main and nightly. The cheapest and commonest breakage in a
      # tagged file is that it stopped compiling, so that much is checked on
      # every pull request: `go vet` type-checks the test files, which
      # `go build` does not reach. The package set is derived from the build
      # constraints, not typed here.
      - name: go vet -tags e2e
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # testdata/ is excluded: the go command never builds it, and a
          # fixture there (codemod's legacy project, #998) is a copy of
          # someone else's code, not a package of this module. Naming it
          # explicitly made `go vet` compile it ("undefined: freePort").
          mapfile -t pkgs < <(git grep -lE '^//go:build.*\be2e\b' -- '*.go' ':(exclude,glob)**/testdata/**' | xargs -n1 dirname | sort -u | sed 's|^|./|')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::no file carries the e2e build tag — this check would inspect nothing"
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"
          go vet -tags e2e "${pkgs[@]}"

  # ── The pull-request test tier: -short, the guards, the flake gate ──────
  #
  # A shard is one invocation of scripts/ci-test-shard.sh over
  # scripts/ci-test-packages.sh's `short I N`: every package, dealt
  # round-robin. internal/ciguard fails if this matrix misses an index.
  #
  # The cost is compile, link and setup, not test bodies (the -short bodies
  # sum to ~134s, internal/cli's ~50s of it; the whole tier ran in 117-138s in
  # one job on main). Every entry is a runner to queue for, so the matrix is
  # as small as the guards allow (below); when a package grows the tier, mark
  # the slow test (`testing.Short()`) before adding an entry.
  #
  # No -race: it multiplies compile and run time several-fold, and the
  # race-detected run of every package happens on each push to main (`test`,
  # `test-cli`). No -count=1: the -short tier is held cache-sound, so a
  # package main's cache already holds a result for replays it (CACHE-SOUND
  # REPLAY at the top of this file).
  #
  # KEEP THIS JOB'S SETUP IN STEP WITH test-short-warm's. A replayed result is
  # keyed on the environment the tests read — PATH among it — so the two jobs
  # run the same steps in the same order, and a tool added to one goes into
  # the other.
  #
  # Whole-program guard scans/renders run in test-short-warm on main/full,
  # not serially after these shards. Their cheap assertions still run under
  # -short here. This deliberately trades premerge whole-repo diagnosis for
  # the five-minute test budget; full/main retains every assertion.
  #
  # Changed-test repetition runs after the tier in the same job: its compile
  # reuses the tier's, and a second runner cost more in queue than it saved.
  test-short:
    name: Test (${{ matrix.label }})
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:run')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports: one failure must not hide another shard's.
      fail-fast: false
      matrix:
        # ONE entry (owner, 2026-11-01: the merge queue's budget is five
        # minutes, runner queue included, and every entry is a slot under the
        # org's 20-job cap). On 2026-11-01 each of the three entries ran 1-4
        # minutes and waited 0-18 for a runner; the whole -short tier runs in
        # 2-3 minutes in one job, so three entries bought queue waits, not speed.
        include:
          - label: "-short + flake gate"
            shard: "1/1"
            args: "0 1"
            flake: "true"
    steps:
      # Depth 2 for the flake gate: the merge commit and its first parent,
      # the base branch's tip (in the merge queue: the entry's commit and the
      # one ahead of it).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Content-derived mtimes (for test-result replay)
        run: scripts/ci-normalize-mtimes.sh
      # cache: false — the two restores below are this job's whole cache.
      # setup-go's own saved GOMODCACHE + GOCACHE under one go.sum key, about
      # 1 GB that duplicated the build cache below and cost ~20s to restore.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/restore-go-caches
        with:
          scope: short
      # The same toolchain as `test`: postgres for pkg/pgtest, buf for the
      # generate pipeline, migrate for TestDBReset_*. A test that needs a
      # missing tool fails under CI=true rather than skipping.
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      # Match test-short-warm's PATH for cache-sound result replay.
      - name: Install Task
        uses: ./.github/actions/install-release-tool
        with:
          tool: task
      - name: Go tests (-short)
        if: ${{ matrix.args != '' }}
        env:
          CI_TEST_JSON: ${{ runner.temp }}/test-shard.json
        run: scripts/ci-test-shard.sh ${{ matrix.args }}
      # The flake gate: every test the pull request adds or edits, three
      # times (scripts/ci-changed-tests.sh says how it finds them, and why no
      # -race). A test that passes once and fails once is caught here, before
      # it lands, instead of in somebody else's pull request weeks later. The
      # restored -short scope holds the dependencies already compiled, so it
      # costs the changed packages' test binaries and the runs.
      - name: Flake gate (new and edited tests, -count=3)
        if: ${{ !cancelled() && matrix.flake == 'true' }}
        run: scripts/ci-changed-tests.sh HEAD^1
      - name: Upload the go test -json stream
        if: ${{ !cancelled() && matrix.args != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-short-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-shard.json
          retention-days: 7
          if-no-files-found: warn

  # ── Go tests, full mode: three jobs, partitioned by scripts/ci-test-packages.sh ──
  #
  # PUSH TO MAIN ONLY (and workflow_dispatch). A pull request runs the -short
  # tier above instead; these are the slow tier that catches what -short
  # skips, plus the race detector over everything.
  #
  # `test` runs every package under -race EXCEPT internal/cli and the
  # repo-wide guards (internal/tierguard, internal/removalguard,
  # internal/deadcodeguard); `test-cli` runs internal/cli under -race;
  # `test-short-warm` runs the guards after the whole -short tier. Each on a
  # runner of its own. The script is
  # the single list and each job's first step proves the three sets partition
  # `go list ./...`, so a package can neither drop out of every job nor run in
  # two. `task test` runs the same three sets locally.
  #
  # WHY internal/cli ALONE. Under -race it took 665-692s of `test`'s
  # 1215-1253s `go test` step by itself, sharing four cores with every other
  # package. In a job of its own the two halves run side by side, and the
  # lane's wall time is the slower half (the script's header has the detail).
  #
  # WHY THE GUARDS. They are the two slowest packages by a wide margin (~980s and
  # ~700s under -race; the next is ~410s) and the two largest in memory.
  # Inside `go test -race ./...` they co-resided with every other test binary
  # on one 16 GB runner, and the job was OOM-killed about one run in three —
  # "The runner has received a shutdown signal", exit 143, no test failed.
  # A job boundary bounds that by construction; go test's package
  # scheduling only ever bounded it by luck. Measured numbers are in the PR
  # that introduced this split (#304).
  #
  # deadcodeguard joined them when its scan began type-checking the whole
  # program once per target OS (#469) and held all three loads at once:
  # ~23 GB RSS under -race, measured locally, and the Test job died on most
  # runs from #469 on. Its scan now holds one load at a time (~12.7 GB under
  # -race, ~5.4 GB without), and here it is bounded by the job boundary too.
  #
  # WHY NO -race FOR THE GUARDS. Their own code has no concurrency worth
  # detecting — removalguard is a regex scan over files, tierguard diffs
  # rendered trees, deadcodeguard walks syntax trees after a load — and the
  # render work happens in child processes. The production code those
  # renders exercise (generate, codegen, cli) is race-tested by its own
  # packages in `test`. -race cost them ~100x in removalguard (10s → ~980s),
  # ~5x in tierguard and ~4x in deadcodeguard. e2e-suite.yml omits -race for
  # the same reason.
  # SHARDED, as is test-cli: a release waits on every full Test job
  # (scripts/check-release-tests.sh), and one 4-core runner took 15-17
  # minutes for this lane and 20 for internal/cli (2026-10-30), so a release
  # waited ~25 minutes on main. scripts/ci-test-full-shard.sh says how each
  # lane splits; internal/ciguard holds every matrix to every index.
  test:
    name: Test (${{ matrix.label }})
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one failure must not hide another shard's.
      fail-fast: false
      matrix:
        include:
          - label: "unit 1/2"
            args: "unit 0 2"
          - label: "unit 2/2"
            args: "unit 1 2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # This job compiles far more than it looks: the suite scaffolds real
      # projects and runs real `go build` / `go mod tidy` inside them, and
      # it runs under -race, which is a separate set of build artifacts
      # from the non-race ones every other job produces. It is the job
      # that benefits most from a warm GOCACHE.
      #
      # Refreshed DAILY, not per push (restore-go-caches says why): a day-old
      # -race cache still holds every dependency, and costs only the forge
      # packages that changed since. test-cli restores this same scope.
      - uses: ./.github/actions/restore-go-caches
        id: go-caches
        with:
          scope: test
          refresh: daily
      # pkg/pgtest boots postgres for the DB-backed tests; see the action.
      - uses: ./.github/actions/embedded-postgres-cache
      # internal/tierguard renders real fixture projects, which drives the
      # generate pipeline's "buf generate (Go stubs)" step. Without buf on
      # PATH those guards fail with `exec: "buf": executable file not found`
      # — they deliberately fail rather than report an empty inventory as a
      # pass, so this is a hard dependency of the test job, not a nicety.
      - name: Install buf
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      # TestDBReset_* shell out to the golang-migrate CLI and carry no e2e
      # tag. They live in internal/cli (test-cli installs it too); this job
      # keeps the install so no package here can lose a tool by moving.
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate

      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests
        # -timeout (30m per test binary, in the script) is explicit rather
        # than left to `go test`'s 10-minute default. A panicking timeout
        # fails the whole job and hides every other package's result behind
        # something that reads as a hang rather than as one slow package.
        env:
          CI_TEST_JSON: ${{ runner.temp }}/test-full.json
        run: scripts/ci-test-full-shard.sh ${{ matrix.args }}
      - name: Local registry maintenance integration
        if: ${{ matrix.args == 'unit 0 2' }}
        run: go test -race -tags=integration -count=1 -timeout=5m ./internal/storage
      # Main only: keeps any archive this job had to fetch, so the next run
      # does not (see embedded-postgres-cache's header).
      - name: Save the embedded postgres archives (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.args == 'unit 0 2' }}
        uses: ./.github/actions/embedded-postgres-cache-save
      # Main only; see "Build-cache note" at the top of this file. Skipped
      # when today's entry already exists (build-hit). One shard saves: the
      # key is per day, so a second save would only race the first.
      - name: Save the Go caches (main only, once a day)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.args == 'unit 0 2' }}
        uses: ./.github/actions/save-go-caches
        with:
          build-key: ${{ steps.go-caches.outputs.build-key }}
          build-hit: ${{ steps.go-caches.outputs.build-hit }}
          mod-key: ${{ steps.go-caches.outputs.mod-key }}
          mod-hit: ${{ steps.go-caches.outputs.mod-hit }}

  test-cli:
    name: Test (${{ matrix.label }})
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "internal/cli 1/3"
            args: "cli 0 3"
          - label: "internal/cli 2/3"
            args: "cli 1 3"
          - label: "internal/cli 3/3"
            args: "cli 2 3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # `test`'s scope, restore only: it holds the -race artifacts of every
      # package internal/cli imports. A scope of its own (go-build-test-cli,
      # ~1 GB a push) is what pushed the pull-request tier's caches out of
      # the 10 GB budget (restore-go-caches says how).
      - uses: ./.github/actions/restore-go-caches
        with:
          scope: test
          refresh: daily
      # The same toolchain as `test`, for the same reasons: postgres for the
      # DB-backed tests, buf for the generate pipeline, migrate for
      # TestDBReset_* (internal/cli/db_reset*_test.go).
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      # Full CLI tests execute rendered Taskfiles; do not skip them when a
      # runner lacks Task. Pin the version exercised by these fixtures.
      - name: Install Task
        uses: ./.github/actions/install-release-tool
        with:
          tool: task
      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests (internal/cli)
        # The same 30m per-binary budget as `test`: a hang detector, not a
        # speed bound.
        env:
          CI_TEST_JSON: ${{ runner.temp }}/test-full.json
        run: scripts/ci-test-full-shard.sh ${{ matrix.args }}
      # Main only: keeps any archive this job had to fetch, so the next run
      # does not (see embedded-postgres-cache's header).
      - name: Save the embedded postgres archives (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.args == 'cli 0 3' }}
        uses: ./.github/actions/embedded-postgres-cache-save

  # The pull-request tier, run whole on main, then the guards. Three jobs in
  # one: main's own check that the tier pull requests are judged by still
  # passes (the full jobs above run a superset, but under different flags),
  # the producer of the go-build-short cache test-short restores and the
  # go-mod cache every pull-request job does — non-race, -short artifacts and
  # test results that nothing else on main compiles, and the module cache —
  # and the guards (formerly `test-guards`), which
  # build without -race too, so they reuse that compile instead of a scope of
  # their own. One job, one entry per cache: the repository's cache budget is
  # 10 GB (see "Build-cache note").
  #
  # Its steps up to the -short tier match test-short's, in the same order:
  # see the note above test-short.
  test-short-warm:
    name: Test (-short whole tier, then guards)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Content-derived mtimes (for test-result replay)
        run: scripts/ci-normalize-mtimes.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/restore-go-caches
        id: go-caches
        with:
          scope: short
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      # Full-tier changed-test repetition can include the Taskfile fixtures.
      - name: Install Task
        uses: ./.github/actions/install-release-tool
        with:
          tool: task
      # The pull request's command, flags and all: a result is keyed on the
      # test flags, so any other spelling would replay nothing there.
      - name: Go tests (-short, every package)
        env:
          CI_TEST_JSON: ${{ runner.temp }}/test-shard.json
        run: scripts/ci-test-shard.sh 0 1
      - name: Check the test-job partition
        if: ${{ !cancelled() }}
        run: scripts/ci-test-packages.sh check
      - name: Changed tests (race, three runs, full tier)
        if: ${{ !cancelled() }}
        run: scripts/ci-changed-tests.sh HEAD^1 full
      - name: Go tests (guards)
        if: ${{ !cancelled() }}
        # -p 1: one guard at a time. Each is a whole-program or whole-project
        # workload that keeps every core busy by itself, so running them side
        # by side mostly stacks their memory peaks. Measured on a 16-core
        # laptop: 10.8 GB peak process-tree RSS at -p 4 against 6.9 GB at
        # -p 1, and -p 1 was not slower (132s against 217s). Full mode and
        # -count=1: the guards' whole-repo work skips under -short.
        run: go test -p 1 -count=1 -timeout 30m $(scripts/ci-test-packages.sh guards)
      # Main only: keeps any archive this job had to fetch, so the next run
      # does not (see embedded-postgres-cache's header).
      - name: Save the embedded postgres archives (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/embedded-postgres-cache-save
      # Main only, and after the tests so the entry carries their results.
      - name: Save the Go caches (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/save-go-caches
        with:
          build-key: ${{ steps.go-caches.outputs.build-key }}
          mod-key: ${{ steps.go-caches.outputs.mod-key }}
          mod-hit: ${{ steps.go-caches.outputs.mod-hit }}

  # ── Windows: first runtime coverage for the cgo-free, Windows-ported CLI ──
  #
  # forge is cgo-free (KCL is loaded through purego) and builds for
  # windows/{amd64,arm64}. This job is what keeps that true at RUNTIME: it
  # builds, vets, runs the -short tier, and drives a real scaffold + render
  # (scripts/ci-windows-smoke.sh), which is the proof the KCL native-library
  # extraction + load works on Windows.
  #
  # TESTS. Every package except the repo-wide guards (`unit cli`: the two
  # sets the Linux Test jobs run between them), from the same
  # scripts/ci-test-packages.sh the Linux jobs use, so the set cannot drift
  # from `go list ./...`. The guards (tierguard, removalguard, deadcodeguard)
  # are excluded: they render whole projects, scan the whole tree or load the
  # whole program, are the slowest packages by far, and exercise
  # platform-independent logic already gated on Linux (deadcodeguard merges
  # linux, darwin and windows loads on every host, so its verdict does not
  # depend on the host it runs on). -short keeps the tier the repo defines for
  # fast loops; no -race (Linux's `test` job owns it). Tools the Linux job installs (buf, migrate)
  # are not installed here: tests needing them must skip under -short.
  #
  # ONE BUILD CACHE, SAVED ONLY FROM MAIN. Saving is the expensive half on
  # Windows: tarring tens of thousands of GOCACHE files on NTFS measured
  # 229-380s per cache, and this job used to save TWO caches of the same
  # directory — setup-go's `cache: true` (GOMODCACHE + GOCACHE, keyed on
  # go.sum) and the laddered one below — both after every PR run, about 10
  # minutes of a ~25-minute critical path spent on bookkeeping. A PR's cache
  # is scoped to its own ref and no other PR can restore it, so every PR save
  # bought at most a warm re-run of that one PR. Now setup-go caches nothing
  # here, PRs only RESTORE, and a push to main SAVES (after the tests, so the
  # entry carries their cached results too). Modules are downloaded rather
  # than restored: a module-cache restore is the same NTFS extraction plus the
  # zips — setup-go's combined restore measured 238s where the GOCACHE-only
  # one below measured 62-144s.
  #
  # PUSH TO MAIN ONLY (and workflow_dispatch). At 17-19 minutes this was the
  # slowest job on every pull request. Its stand-in there, a windows/amd64
  # cross-compile and vet from Linux, went too (2026-10-21): 1.5 minutes warm
  # and 5 cold, on a runner of its own, for a break that is rare and that this
  # job finds on main.
  windows:
    name: Windows
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash ships on windows-latest. It is only the CI driver; forge
        # itself must not depend on bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The one cache is the laddered step below; see the job header.
          cache: false
      # GOCACHE is %LocalAppData%\go-build on Windows, not ~/.cache/go-build,
      # so ask Go rather than hardcode it. Ladder rationale: top of file.
      - name: Locate Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Note when the Go build cache was restored
        run: echo "GOCACHE_RESTORED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # Refreshed once per UTC day, not per push: restore-go-caches says why
      # (this job's own NTFS paths keep it off that action).
      - name: The build cache's day
        id: day
        run: echo "rev=day-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.day.outputs.rev }}
          restore-keys: |
            go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-windows-${{ runner.os }}-
      # CGO_ENABLED=0 is asserted, not assumed: the point is that no C
      # toolchain is needed, and windows-latest has one that would hide a
      # regression.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Vet (includes tests)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      # The arm64 BUILD stays on every PR: it is the proof forge still
      # compiles for windows/arm64. The arm64 VET does not: it re-vetted the
      # whole module (~4 min cold) to re-check what the amd64 vet above
      # already checked, since only GOARCH-specific files differ. It runs in
      # nightly.yml instead.
      - name: Cross-compile windows/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go build -o "$RUNNER_TEMP/forge-arm64.exe" ./cmd/forge
      # The postgres archive pkg/pgtest boots, from the cache rather than
      # Maven Central (see the action): an uncached fetch here is how a
      # registry 404 for a published version turned this job red.
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Go tests (-short)
        env:
          CGO_ENABLED: "0"
          # buf is not installed here (see the header), and a test that
          # needs it treats CI=true as "missing tool is a provisioning bug".
          # This is the documented override that turns that back into a skip.
          FORGE_E2E_REQUIRE_TOOLS: "0"
        # No -count=1: this is the -short tier, which the repo holds
        # cache-sound (reliant.md, "Testing tiers"), so a package whose
        # inputs did not change replays its result from the build cache main
        # last saved instead of re-running. -count=1 defeated exactly that.
        run: go test -short -timeout 30m $(scripts/ci-test-packages.sh unit cli)
      - name: Install forge
        env:
          CGO_ENABLED: "0"
        run: go install ./cmd/forge
      - name: Scaffold + render smoke
        run: scripts/ci-windows-smoke.sh
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-gocache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/trim-go-build-cache
        with:
          path: ${{ steps.gocache.outputs.dir }}
      # Main only, and after the tests so the entry carries their results.
      # !cancelled(): a red main still compiled everything, and the next run
      # restores the artifacts whether or not a test failed. Once a day: an
      # exact hit means today's entry already exists.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}
      # Main only: keeps any archive this job had to fetch, so the next run
      # does not (see embedded-postgres-cache's header).
      - name: Save the embedded postgres archives (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/embedded-postgres-cache-save

  # PUSH TO MAIN ONLY. On a pull request every package is already compiled
  # by test-short; what this adds is the release flags (-buildvcs), which a
  # code change almost never breaks differently, the go-licenses pass, and
  # govulncheck. No `needs:`: it used to wait for lint and every test job, for
  # no data dependency.
  build:
    name: Build (-trimpath) + go-licenses + govulncheck
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # -trimpath below is part of the cache identity: artifacts built with
      # it do not match the tests'. `checks` saves the scope that does match
      # — verify-generated builds through goexec, which adds -trimpath, and
      # both install the same non-trimpath forge — so this job restores
      # that one and saves none of its own (~0.7 GB a push; restore-go-caches
      # says why that mattered).
      - uses: ./.github/actions/restore-go-caches
        with:
          scope: tools
      - name: Go build
        # -trimpath makes builds reproducible across runners;
        # -buildvcs=true stamps the commit/dirty flag into runtime
        # debug/buildinfo so deployed binaries can be correlated to a
        # source commit without a separate manifest. Both flags must
        # match the Dockerfile / Taskfile so CI, Docker, and local
        # binaries hash identically from the same source.
        run: go build -trimpath -buildvcs=true ./cmd/...
      # The second license opinion (formerly the License Compliance job).
      # checks' scripts/check-licenses.sh checks every Go dependency's
      # license on each merge-queue entry in seconds; this go-licenses pass (~2 min,
      # most of it compiling go-licenses) is kept on main.
      - name: Install go-licenses
        if: ${{ !cancelled() }}
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        if: ${{ !cancelled() }}
        run: go-licenses check ./... --disallowed_types=forbidden,restricted
      # Vulnerability scan (formerly quick-checks', on every pull request,
      # where at 74-106s it was the longest step of the longest job). A pull
      # request that changes no dependency cannot add a known vulnerability
      # except by newly calling a vulnerable symbol, and a new advisory
      # arrives on its own schedule, not with a commit; nightly and every
      # push to main catch both. `forge ci vuln-scan` applies forge.yaml's
      # reviewed advisories, so it runs the forge built from this checkout.
      - name: Install forge
        if: ${{ !cancelled() }}
        run: go install ./cmd/forge
      - name: Install govulncheck
        if: ${{ !cancelled() }}
        # Pinned explicitly: @latest makes CI non-reproducible and lets a
        # compromised upstream release silently alter scan results. The
        # Dependabot config watches this file so bumps arrive as PRs.
        #
        # The pin has a FLOOR, not just a ceiling: govulncheck vendors
        # golang.org/x/tools to build the SSA it traces calls through, and a
        # copy older than the toolchain panics on syntax it cannot parse.
        # v1.1.4 vendored x/tools v0.29.0 and died with
        # `panic: unexpected expr: *ast.KeyValueExpr` the moment this repo
        # moved to Go 1.27 — a crash, not a finding, so the gate reported
        # nothing at all. Keep this at or above the release that supports the
        # Go version in go.mod.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Go vulnerability check
        if: ${{ !cancelled() }}
        run: forge ci vuln-scan --go

  # Every check that is not a Go test, in one job (they were the Verify
  # Generated Code and Quick checks jobs, and before those the pre-commit and
  # license-gate workflows):
  #
  #   verify-generated  `forge generate` over this checkout changes nothing
  #   validate-kcl      the KCL manifests validate
  #   pre-commit        the hooks in .pre-commit-config.yaml, so CI catches
  #                     contributors who haven't installed pre-commit locally
  #                     (hook versions are pinned there). go-vet-mod is
  #                     skipped: vet runs in `lint` on main, and `go test` runs
  #                     its high-confidence half on every package here.
  #                     proto-generated is skipped: verify-generated runs the
  #                     complete check.
  #   licenses          blocks a change that pulls a non-permissive license into
  #                     the Go import graph or the published web-runtime
  #                     package. The risk is linking, not hosting: running
  #                     unmodified copyleft software as a service is permitted
  #                     (AGPL-3.0 §2), but IMPORTING an AGPL/GPL library into a
  #                     proprietary binary reaches that binary's source. It
  #                     happens silently in a routine `go get` of something
  #                     with a transitive dep. The gate is an allowlist: an
  #                     unrecognized license FAILS and needs a reasoned entry
  #                     in .license-allowlist. web-runtime matters more than a
  #                     consuming app's deps would: it is PUBLISHED, so its
  #                     dependencies reach every project that installs it.
  #
  # Each check runs whatever the others concluded, so one red does not hide
  # another.
  #
  # Its own cache scope, `tools`, saved by its own run on main. Not the
  # -short scope: verify-generated regenerates into a scratch copy of the
  # checkout and validates it with forge's go invocations, which build with
  # -trimpath (goexec), so what it compiles is keyed apart from the tests'
  # artifacts. Restored from the -short scope it ran 250s cold against ~47s.
  # The two checks that judge the pull request itself rather than the code:
  # they read its head branch name, labels and body, which a merge-queue entry
  # does not carry. They are the whole of what an unlabelled pull request runs
  # (REVIEW FIRST, above): both are cheap, and neither can go red for a reason
  # outside the pull request's own diff and description, so neither can hold
  # a reviewed pull request out of the queue for main's sake.
  pr-checks:
    name: Pull request checks (CHANGELOG, pkg/ API)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read for the apigate step, which reads the pull request's
    # labels and body live (a label added after the run started is seen on a
    # re-run). Declaring any permission resets the others, so contents says it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history: HEAD is the merge commit, HEAD^1 the base branch's tip,
      # so HEAD^1..HEAD is exactly what the pull request changes. The binary
      # guard judges each of the pull request's commits against its parent,
      # which a depth-2 clone does not have (it fails such a clone, exit 2).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CHANGELOG.md is written only at release time, by scripts/release-forge.sh,
      # from the merged PR titles. A pull request that edits it is the conflict
      # that policy removes (203 of the last 319 commits on main appended under
      # [Unreleased]), so it fails here, in seconds. Pull requests only — a
      # merge-queue entry has no head branch name for the release/* exemption.
      - name: CHANGELOG.md is not edited by pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/check-changelog-untouched.sh HEAD^1
      # No binary file, and no new file over 1 MiB, in the pull request:
      # every commit of HEAD^1..HEAD, merges included, so a binary committed
      # and deleted again in the branch still fails. Git alone, seconds,
      # so every pull request runs it, labelled or not. pre-commit's
      # no-committed-binaries hook cannot stand in for it: it reads the staged
      # change, which is empty in CI (control-plane#1952 merged a 5.9 MB
      # build binary through that gap).
      - name: No committed binaries
        run: scripts/check-no-binaries.sh --range HEAD^1 HEAD
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          go-version-file: go.mod
          cache: false
      # The tools scope (saved by `checks` on main) holds apigate's
      # dependencies compiled, so `go run` builds one small package.
      - uses: ./.github/actions/restore-go-caches
        if: ${{ !cancelled() }}
        with:
          scope: tools
      # forge is semver at major 1: an incompatible change to pkg/ fails unless
      # the owner applied `breaking:approved`, and an accepted break must still
      # declare itself (the `api-break` label, or an `API-BREAK:` line in its
      # body) and ship the codemod or migration playbook in the same diff. An
      # `API-BREAK:` line with no break behind it fails too (the release refuses
      # on it). A diff that cannot change pkg/'s API exits in about a second.
      # dev-docs/api-breaks.md. Pull requests only: it reads the pull
      # request's labels and body, and a push to main is already merged.
      - name: pkg/ API compatibility (breaks fail unless the owner accepted them)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: go run ./internal/apigate -base HEAD^1 -pr "$PR"
      # forge's proto (the forge.v1 options every project's protos import) is
      # semver at major 1 too: buf breaking against the base, unless the owner
      # applied `breaking:approved` (scripts/check-compat.sh, the same file in
      # reliant and control-plane). Seconds when proto/ is untouched.
      - name: Install buf
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      - name: proto compatibility (buf breaking; breaks fail unless the owner accepted them)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_BASE: HEAD^1
          COMPAT_REPO: ${{ github.repository }}
        run: scripts/check-compat.sh proto

  # Merge tier and push-to-main; an unlabelled pull request skips it (REVIEW
  # FIRST). On main it also saves the tools cache pr-checks and e2e restore.
  checks:
    name: Checks (generated code, KCL, pre-commit, licenses)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/restore-go-caches
        id: go-caches
        with:
          scope: tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install forge
        # THIS repo is forge. A scaffolded project pins the published forge
        # that generated it, but forge's own CI must verify the checkout under
        # test — installing a tag would validate every PR against the last
        # release, so no change to a template or an emitter could ever go
        # green until after it shipped. Build from the working tree instead.
        run: go install ./cmd/forge
      # verify-generated runs `forge generate`, whose "buf generate (Go
      # stubs)" step regenerates pkg/forgepb from proto/forge/v1/forge.proto
      # (buf.gen.yaml). Without buf on PATH the job dies with
      # `exec: "buf": executable file not found` before checking anything.
      #
      # Every buf here is .github/actions/install-release-tool's pin,
      # templates.BufVersion (TestReleaseToolPinsMatchForge), so the version
      # cannot move under a byte-identical check. pre-commit runs after
      # failures too, so its formatter prerequisites must not be skipped
      # after an earlier failure.
      - name: Install buf
        if: ${{ !cancelled() }}
        uses: ./.github/actions/install-release-tool
        with:
          tool: buf
      # buf.gen.yaml runs protoc-gen-go as a `local:` plugin, and generate
      # formats its Go output with goimports. `forge tools install` puts both
      # on PATH at the versions go.mod resolves, the versions the committed
      # files were generated with (protoc-gen-go writes its own version into
      # pkg/forgepb/forge.pb.go's header). --force: a runner image's own copy
      # must not stand in for go.mod's version. Same step as the scaffolded
      # verify-generated job (internal/templates/ci/github/ci.yml.tmpl).
      - name: Install codegen tools
        if: ${{ !cancelled() }}
        run: forge tools install --force
      - name: Verify generated code
        run: forge ci verify-generated
      # Validate KCL used to be a job of its own; it shares this job's forge
      # install and cache scope, and a second runner bought only a second
      # minute of setup.
      # KCL is pinned, never "latest" (which install-cli.sh resolved through
      # api.github.com's unauthenticated 60/hour budget): the pin is
      # .github/actions/install-release-tool's, templates.KCLVersion, which
      # TestKCLVersionIsPinnedEverywhere holds equal to go.mod's kcl-lang.io
      # modules, so the `kcl` the tests shell out to is the KCL forge embeds.
      # The action caches the binary alone (never ~/.kcl: a cached EMPTY
      # ~/.kcl once skipped the install and left jobs with no kcl) and
      # reinstalls whenever the binary is missing, whatever the cache said.
      - name: Install KCL
        uses: ./.github/actions/install-release-tool
        with:
          tool: kcl
      - name: Validate KCL manifests
        if: ${{ !cancelled() }}
        run: forge ci validate-kcl
      # The go-imports hook shells out to a goimports BINARY. `forge tools
      # install` above put one on PATH at the golang.org/x/tools version
      # go.mod resolves, which is the version the module builds against (it
      # used to be a separate `go install goimports@<pin>` kept equal to
      # go.mod by hand).
      - name: pre-commit
        if: ${{ !cancelled() }}
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: go-vet-mod,proto-generated
      # The checker reads each dependency's LICENSE out of the module cache,
      # so the modules it scans (the import graph) must be there first. Not
      # `go mod download`: that insists on every module's .zip, which the
      # go-mod cache leaves out (restore-go-caches says why), and would
      # re-fetch ~420 MB of archives for directories already extracted.
      - name: Download modules
        if: ${{ !cancelled() }}
        run: go list -deps ./... > /dev/null
      - name: Check Go dependency licenses
        id: go-licenses
        if: ${{ !cancelled() }}
        run: ./scripts/check-licenses.sh
      # On failure, print the full inventory so the author can see every
      # dependency and its detected license without re-running locally.
      - name: Full Go license inventory (on failure)
        if: ${{ !cancelled() && steps.go-licenses.outcome == 'failure' }}
        run: ./scripts/check-licenses.sh --list
      - name: Install web-runtime's npm dependencies
        if: ${{ !cancelled() }}
        working-directory: web-runtime
        run: npm install --no-audit --no-fund
      - name: Check npm dependency licenses (web-runtime)
        id: npm-licenses
        if: ${{ !cancelled() }}
        run: ./scripts/check-npm-licenses.sh web-runtime
      - name: Full npm license inventory (on failure)
        if: ${{ !cancelled() && steps.npm-licenses.outcome == 'failure' }}
        run: ./scripts/check-npm-licenses.sh --list web-runtime
      - name: Save the Go caches (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/save-go-caches
        with:
          build-key: ${{ steps.go-caches.outputs.build-key }}
          mod-key: ${{ steps.go-caches.outputs.mod-key }}
          mod-hit: ${{ steps.go-caches.outputs.mod-hit }}

  # golangci-lint on the changed packages, in the merge tier (owner,
  # 2026-11-08; #1947). The Lint job above stays on main for the whole repo;
  # this one is the slice a queue entry can be blamed for: the packages its
  # diff (HEAD^1..HEAD, as the flake gate reads it) changed, findings in the
  # files it changed (--new-from-rev with --whole-files), root .golangci.yml
  # and, for pkg/, pkg/.golangci.yml (scripts/ci-golangci-changed.sh).
  # --whole-files, not changed lines only: #1930's nestif was reported on an
  # `if` line it never touched (it grew the block inside), and main's Lint is
  # whole-repo, so a changed file holds no backlog to trip over.
  #
  # A JOB OF ITS OWN, beside test-short and checks rather than a step in one
  # of them: those run 2.5-4 minutes, and the lint (a minute or two on a warm
  # -short scope, internal/cli the slow case) would go on the end of their
  # critical path. Here it starts with them and `CI gate` waits on all three.
  # It restores the -short scope (what golangci's package loads compile is the
  # same non-race linux build), saves nothing, and installs golangci-lint
  # through install-release-tool, so a release-download 504 cannot fail it.
  #
  # MEASURED on GitHub runners (2026-11-08), job wall time: 57s (pkg/pgtest,
  # under pkg/.golangci.yml), 77s (internal/npmoverlay), 136s
  # (internal/templates); with internal/cli in the diff 165s (#1946, one file),
  # 179s (#1930) and 185s (#1931), of which the lint was 110-126s: internal/cli
  # is one very large package and is analysed whole. The other two jobs ran
  # 152-240s (median ~211s) on the 11 merge groups before it that touched
  # internal/cli, so on such a diff this job can finish last, by up to ~30s.
  # Every other diff finishes well before them.
  #
  # CHECK AFTER MERGE, AND ROLLBACK. On the first merge groups after this
  # lands, read `CI gate`'s "Job wall times" and "Merge-queue budget" steps:
  # golangci should finish before test-short and checks except on an
  # internal/cli diff, and then by no more than ~30s, with the group inside
  # the tier's budget (five-minute median, ten at worst). If it is the
  # critical path on ordinary diffs, or groups exceed that budget, revert the
  # commit that added this job: the job, its `CI gate` dependency and its
  # merge_group skipped-check entry go together, golangci-lint goes back to
  # main's Lint alone, and the ci-tool-golangci-lint cache entry ages out.
  # No ruleset, schema or required-check change is involved (`CI gate` stays
  # the one required check).
  golangci:
    name: golangci-lint (changed packages)
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:run')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2: HEAD^1 is the base the diff is read from (the merge commit's
      # first parent on a pull request; the entry ahead in the merge queue).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # No Go file changed: done in seconds, before any toolchain is set up.
      - name: Changed Go files
        id: changed
        run: |
          set -euo pipefail
          n=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.go' | wc -l)
          echo "${n} changed .go file(s) since HEAD^1"
          echo "any=$([ "${n}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.changed.outputs.any == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/restore-go-caches
        if: steps.changed.outputs.any == 'true'
        with:
          scope: short
      - name: Install golangci-lint
        if: steps.changed.outputs.any == 'true'
        uses: ./.github/actions/install-release-tool
        with:
          tool: golangci-lint
      - name: golangci-lint (changed packages)
        if: steps.changed.outputs.any == 'true'
        run: scripts/ci-golangci-changed.sh HEAD^1

  # CI gate: one check that is red exactly when any job above failed or was
  # cancelled (a skipped job — a main-only lane on a pull request — is not a
  # failure). It is the main ruleset's required check and the one the merge
  # queue waits for, so its `name:` must not change, and a job added above
  # must be added to `needs` too; internal/ciguard fails on either. It also writes every job's wall time and the run's
  # critical path to the run summary (scripts/ci-run-timings.sh), so the
  # pull-request budget is visible on every run.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - lint
      - test-short
      - pr-checks
      - checks
      - golangci
      - test
      - test-cli
      - test-short-warm
      - windows
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # The main-red override reads the pull request's labels.
      pull-requests: read
      # The merge queue's budget report keeps one rolling pipeline:slo issue.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Job wall times
        env:
          GH_TOKEN: ${{ github.token }}
        # Reporting only: a failed API call must not turn the gate red.
        run: scripts/ci-run-timings.sh || echo "::warning::could not read this run's job timings"
      # The merge queue's five-minute budget (owner, 2026-11-01), runner wait
      # included. Reporting only, like the step above: it always exits 0.
      - name: Merge-queue budget
        if: ${{ github.event_name == 'merge_group' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-queue-budget.sh || true
      # A red run passes only through the main-red override: a pull request
      # labelled `ci:main-red` whose every failure also fails on main's latest
      # run (scripts/ci-main-red.sh says exactly what is matched, and refuses
      # Dependabot). It is the one way past this gate: no account bypasses
      # the main ruleset. After labelling, re-run this job alone
      # (`gh run rerun <run> --job <gate job id>`); the other jobs keep their
      # results.
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          red=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          # The merge queue is where the merge tier decides the merge: a tier
          # job that skipped there (a broken `if:`) is a gate that judged
          # nothing, never a pass.
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            unrun=$(jq -r 'to_entries[] | select(.key == "test-short" or .key == "checks" or .key == "golangci") | select(.value.result == "skipped") | "\(.key): skipped in the merge queue"' <<<"$RESULTS")
            if [ -n "$unrun" ]; then
              echo "::error::the merge tier did not run:"
              echo "$unrun"
              exit 1
            fi
          fi
          if [ -z "$red" ]; then
            echo "every job passed or was skipped"
            exit 0
          fi
          echo "not every job passed:"
          echo "$red"
          if scripts/ci-main-red.sh; then
            echo "::warning::CI gate passed over main's reds (ci:main-red); see the run summary"
            exit 0
          fi
          echo "::error::not every job passed"
          exit 1
