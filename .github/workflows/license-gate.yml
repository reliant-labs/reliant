# Blocks a PR that pulls a non-permissive license into the import graph.
#
# The risk this closes is linking, not hosting: running unmodified copyleft
# software as a service is permitted (AGPL-3.0 §2 affirms "unlimited permission
# to run the unmodified Program"), but IMPORTING an AGPL/GPL library into a
# proprietary binary reaches that binary's source. It happens silently during a
# routine `go get` of something that pulls a transitive dep, and it typically
# surfaces during diligence — years later, at the worst possible moment.
#
# The gate is an allowlist: unrecognized licenses FAIL and need an explicit,
# reasoned entry in .license-allowlist.
#
# Each job is a thin wrapper over `task licenses:go` / `task licenses:npm`, the
# commands a laptop runs (`task licenses` runs both).
name: license-gate

#
# PATH-FILTERED ON PULL REQUESTS. A dependency's license can only enter
# through a manifest or lockfile, so a PR that touches none of them cannot
# change this gate's verdict; it used to cost every PR two runner slots (and up
# to 19 minutes of queue). Pushes to main stay unfiltered, so main is judged
# on every merge whatever the PR touched.
# Path-filtered on BOTH events. The verdict is a function of the dependency
# manifests and the allowlists alone, so a push that touches none of them
# cannot change it; it used to run two jobs on every merge regardless.
on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "frontends/web/package.json"
      - "frontends/web/pnpm-lock.yaml"
      - "frontends/web/pnpm-workspace.yaml"
      - ".license-allowlist"
      - ".license-allowlist-npm"
      - "scripts/check-licenses.sh"
      - "scripts/check-npm-licenses.sh"
      - "Taskfile.yml"
      - ".github/workflows/license-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "frontends/web/package.json"
      - "frontends/web/pnpm-lock.yaml"
      - "frontends/web/pnpm-workspace.yaml"
      - ".license-allowlist"
      - ".license-allowlist-npm"
      - "scripts/check-licenses.sh"
      - "scripts/check-npm-licenses.sh"
      - "Taskfile.yml"
      - ".github/workflows/license-gate.yml"

permissions:
  contents: read

concurrency:
  group: license-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  licenses:
    name: permissive-licenses-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # The checker reads each dependency's LICENSE out of the module cache;
      # the task downloads the modules first (a no-op on a cache hit).
      - name: task licenses:go
        run: task licenses:go

      # On failure, print the full inventory so the PR author can see every
      # dependency and its detected license without re-running locally.
      - name: Full license inventory (on failure)
        if: failure()
        run: task licenses:go -- --list

  # The npm half. Separate job: it needs Node rather than Go, and a frontend
  # dependency problem should be reported on its own.
  npm-licenses:
    name: permissive-licenses-only (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"

      # A frozen install installs from the lockfile, which is what the gate inspects,
      # so the tree checked here is the tree that ships.
      - name: task deps:web
        run: task deps:web

      - name: task licenses:npm
        run: task licenses:npm

      - name: Full license inventory (on failure)
        if: failure()
        run: task licenses:npm -- --list
