name: Migration & DB Schema Check

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "internal/db/migrate*.go"
  push:
    branches:
      - main
    paths:
      - "db/migrations/**"
      - "internal/db/migrate*.go"

# A newer push to a PR obsoletes the run in progress; a run on main finishes.
concurrency:
  group: check-migrations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The one migration path (internal/db/migrate.go) against a real
      # Postgres: it builds a fresh database, leaves a current (and an
      # adopted) one alone, refuses what it must, and takes turns under
      # contention. Version and compatibility rules for db/migrations are
      # `forge lint --migration-safety`, in PR CI.
      - name: Validate migrations apply and refuse
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/reliant_ci?sslmode=disable
          REQUIRE_TEST_DB: "1"
        run: |
          go test ./internal/db/ -count=1 \
            -run 'TestMigrate_|TestPlanMigration|TestPendingMigrations|TestWaitForSchema'
