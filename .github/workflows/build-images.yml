name: Build & Push Image

# TRIGGERS: release tags, and manual dispatch. Deliberately NOT push-to-main.
#
# A merge is not a release. Publishing on every push to main made an unreviewed
# main commit the newest `latest` in the registry prod pulls from, and while we
# are still iterating the per-merge multi-arch build buys nothing anyone asked
# for. To publish from an arbitrary commit, dispatch this workflow with an
# image_tag.
#
# Tags are also what make docker/metadata-action's `type=semver` produce a real
# version. When this ran on branch pushes, `type=ref,event=branch` won the
# `steps.meta.outputs.version` slot and the binary was stamped with the literal
# string "main" — which the UI rendered as "vmain". Verified against the
# running prod pod.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: sha-<short>)"
        required: false
        type: string

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  # GAR only. This repo's image is consumed by three prod/preprod
  # Deployments (reliant-api-server, daemon-gateway, reliant-temporal-worker)
  # via control-plane's deploy/kcl/{prod,preprod}/main.k. GHCR was the
  # previous publish target (.github/workflows/docker.yml, removed in #167)
  # but nothing has pushed there since 2026-08-19 and control-plane's own
  # `build-images.yml` dropped GHCR as a push target for the same reason
  # (see its "GAR ONLY" comment) — matching that convention here rather than
  # reviving a registry this org is migrating off.
  GAR_NONPROD: "us-central1-docker.pkg.dev/reliant-nonprod-490701/reliant-nonprod"
  GAR_PROD: "us-central1-docker.pkg.dev/reliant-labs-475814/reliant-prod"

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP (nonprod)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NONPROD }}
          service_account: ${{ secrets.WIF_SA_NONPROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        # us-docker.pkg.dev: the pull-through Docker Hub mirror the Dockerfile's
        # `FROM` lines resolve against. us-central1-docker.pkg.dev: the nonprod
        # GAR push target (GAR_NONPROD, above).
        run: gcloud auth configure-docker us-docker.pkg.dev,us-central1-docker.pkg.dev --quiet

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "custom=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # The version STAMPED INTO THE BINARY, which is not the same thing as the
      # image tag above.
      #
      # This step exists because `${{ steps.meta.outputs.version }}` is not a
      # safe source for it. On a branch push metadata-action resolves that to
      # the branch name, so the published image reported `reliant version main`
      # and Settings → About rendered "vmain". A version that is a branch name
      # identifies no build.
      #
      # scripts/release-identity.sh decides it — the resolver release.yml, the
      # web bundle and control-plane's prod image all stamp from:
      #   tag push  -> the semver, without the leading "v" (1.8.1)
      #   otherwise -> the commit's dev identity (1.8.2-dev+<sha8>): the next
      #                release's dev build, naming the exact commit.
      # The script exits non-zero rather than print nothing; set -e makes that
      # fatal, so an image never ships reporting "unknown".
      - name: Determine stamped version
        id: stamp
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            STAMP_VERSION="$(bash scripts/release-identity.sh --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA")"
          else
            STAMP_VERSION="$(bash scripts/release-identity.sh --commit "$GITHUB_SHA")"
          fi
          echo "version=$STAMP_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_time=$(bash scripts/release-identity.sh --commit-time --commit "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "Stamping version=$STAMP_VERSION"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GAR_NONPROD }}/reliant
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.tag.outputs.tag }},enable=${{ steps.tag.outputs.custom }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps internal/version so `reliant version` reports the release
          # rather than "unknown" (see #166). All four, not just VERSION: a
          # version with no commit cannot be traced to a tree, which is the
          # state prod was in (`commit: unknown` in the running pod).
          #
          # VERSION comes from the `stamp` step, NOT steps.meta.outputs.version
          # — see that step for why the latter yields "main" on a branch push.
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
            BRANCH=${{ github.ref_name }}
            COMMIT_TIME=${{ steps.stamp.outputs.commit_time }}
          cache-from: type=gha,scope=reliant
          cache-to: type=gha,scope=reliant,mode=max

      # Reject an image whose binary asks for a loader the image does not
      # ship. `docker build` cannot catch this: the build succeeds, the
      # manifest is a valid linux/<arch>, and only exec fails — with
      # "no such file or directory" naming the BINARY, not the missing
      # interpreter. It crashlooped three prod deployments after the arm64
      # leg was built in a musl toolchain against a glibc runtime base.
      #
      # Runs BEFORE the prod mirror below, so a bad image is never copied
      # into the registry prod deploys from.
      # BLOCKING. A musl-linked binary on this glibc runtime cannot exec, and
      # nothing before this step can tell: the build succeeds, the manifest is
      # a valid linux/<arch>, and `crane config` reports the right platform.
      # Only running it fails — which is how three prod deployments ended up in
      # CrashLoopBackOff.
      #
      # This ran non-blocking for one build while two apparent false failures
      # were investigated. Both turned out to be expired local GCP credentials
      # rather than checker bugs: re-run against the same published image with
      # valid credentials, it reports
      #   amd64: OK (/lib64/ld-linux-x86-64.so.2 — ld-linux-x86-64.so.2 present)
      # so the check is trustworthy and is restored to blocking here.
      - name: Verify image interpreters
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          ./scripts/check-image-interp.sh "${{ env.GAR_NONPROD }}/reliant@${{ steps.build.outputs.digest }}" amd64 arm64

      # ── Prod GAR mirror ──────────────────────────────────────────────
      # Prod GAR (reliant-labs-475814) is a DIFFERENT GCP project from the
      # nonprod one used above, so it needs the prod WIF identity. Finish
      # the nonprod-authenticated build+push first, THEN swap identity with
      # a second auth@v2 call (replaces the active gcloud credentials for
      # the rest of the job) and mirror the digest already pushed to
      # nonprod GAR straight into prod GAR — a registry-to-registry manifest
      # copy, no rebuild.
      #
      # REQUIRED: a successful release build must publish the same multi-arch
      # index to prod, not silently leave it only in nonprod. Missing prod WIF
      # secrets or IAM permissions are release failures, not optional mirrors.
      # This does not provision credentials or change IAM.
      - name: Check prod WIF credentials are configured
        id: prod_wif
        env:
          WIF_PROVIDER_PROD: ${{ secrets.WIF_PROVIDER_PROD }}
          WIF_SA_PROD: ${{ secrets.WIF_SA_PROD }}
        run: |
          set -euo pipefail
          if [ -z "$WIF_PROVIDER_PROD" ] || [ -z "$WIF_SA_PROD" ]; then
            echo "::error::Required prod GAR mirror needs WIF_PROVIDER_PROD and WIF_SA_PROD; no release mirror was published."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Stage full OCI index for the prod mirror
        env:
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          SRC="${{ env.GAR_NONPROD }}/reliant@$SOURCE_DIGEST"
          # crane is already installed at v0.20.2 by Verify image interpreters.
          # No --platform: OCI format recursively stages ALL platform and
          # attestation manifests/blobs, unlike docker pull's host selection.
          crane pull --format=oci "$SRC" "$RUNNER_TEMP/prod-mirror-oci"
          INDEX="$RUNNER_TEMP/prod-mirror-oci/blobs/sha256/${SOURCE_DIGEST#sha256:}"
          echo "${SOURCE_DIGEST#sha256:}  $INDEX" | sha256sum --check
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            ([.manifests[].platform | select(.os == "linux") | .architecture] |
             index("amd64") != null and index("arm64") != null)
          ' "$INDEX" > /dev/null

      - name: Authenticate to GCP (prod)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SA_PROD }}

      - name: Configure Docker for Artifact Registry (prod)
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mirror digest to prod GAR
        # Both GAR projects share one credential host. Stage while nonprod
        # auth is active, then push the local OCI layout under prod auth.
        # Direct imagetools create SOURCE@digest would re-read nonprod with
        # prod-only credentials. Never docker pull/tag/push: that loses the
        # index, the other architecture and BuildKit's attestation children.
        #
        # ONE TAG, NEVER `latest`. Prod GAR (reliant-prod) is tag-immutable
        # (control-plane deploy/gcp/provision.sh): a tag cannot be moved to
        # another digest, so re-pushing `latest` is refused. A moved tag orphaned
        # the digest it pointed at, and the repo's 7-day untagged cleanup then
        # deleted bytes a recorded release still named (control-plane
        # research/clickstack-review/rollout-log.md, session D). Nothing reads
        # `reliant:latest`: every prod workload is pinned by the release
        # ledger's digest. The per-commit `sha-<short>` (or a dispatch's
        # image_tag) is written once; pushing an existing one is refused.
        env:
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          MIRROR_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$MIRROR_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ && "$MIRROR_TAG" != latest ]]
          TARGET="${{ env.GAR_PROD }}/reliant:$MIRROR_TAG"
          DEST="${{ env.GAR_PROD }}/reliant@$SOURCE_DIGEST"
          # Do NOT use --index: the layout has one entry, the original index.
          # --index would publish the extra layout wrapper with a NEW digest.
          crane push "$RUNNER_TEMP/prod-mirror-oci" "$TARGET"
          test "$(crane digest "$TARGET")" = "$SOURCE_DIGEST"
          crane manifest "$DEST" > "$RUNNER_TEMP/prod-mirror-index.json"
          echo "${SOURCE_DIGEST#sha256:}  $RUNNER_TEMP/prod-mirror-index.json" | sha256sum --check
          # Compare the complete index, not just a tag's platform listing:
          # every platform/attestation descriptor and annotation must survive.
          cmp "$RUNNER_TEMP/prod-mirror-oci/blobs/sha256/${SOURCE_DIGEST#sha256:}" "$RUNNER_TEMP/prod-mirror-index.json"
          # Read back the whole graph from PROD: every platform manifest,
          # config, layer and unknown/unknown attestation must be available.
          # crane validate treats layers as filesystem tars, which is wrong
          # for in-toto JSON attestations. Compare/hash the opaque blobs instead.
          crane pull --format=oci "$DEST" "$RUNNER_TEMP/prod-mirror-readback"
          for BLOB in "$RUNNER_TEMP/prod-mirror-oci/blobs/sha256/"*; do
            HASH="${BLOB##*/}"
            READBACK="$RUNNER_TEMP/prod-mirror-readback/blobs/sha256/$HASH"
            echo "$HASH  $BLOB" | sha256sum --check
            echo "$HASH  $READBACK" | sha256sum --check
            cmp "$BLOB" "$READBACK"
          done

  summary:
    name: Build Summary
    needs: build-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build Image Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| reliant | ${{ needs.build-push.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`sha-$(echo ${{ github.sha }} | cut -c1-7)\`" >> "$GITHUB_STEP_SUMMARY"
