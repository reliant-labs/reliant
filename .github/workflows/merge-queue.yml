name: Merge queue

# The merge queue's verdict: ONE job, named "CI result" (the ruleset's required
# check), on every merge group. Its budget is five minutes of wall time, runner
# queue included (owner, 2026-11-01: "merge-queue tests take at most 5 minutes;
# anything longer belongs in the pre-release gate").
#
# WHAT RUNS HERE: `task ci:merge -- --queue`, the affected tier relative to the
# group's base: build, the affected -short tests (direct importers; on a FULL
# web fallback the vitest files the group's own web modules reach), the web
# typecheck when web changed, forge lint's own lanes scoped to the changed
# directories (--optional-deps-guard and --tracing among them), the forge demo
# bundle's build when the change reaches it, forge generate / docs drift when
# their inputs changed, migration safety and order when a migration changed,
# buf lint when a proto changed; then each new or changed Go test three times,
# the cheap repo checks, and the vendored control-plane contract check when the
# group changes proto-vendor/controlplane/ (control-plane #2556). The scoped
# forge lint joined on 2026-11-13: until then `--queue` implied `--skip-lint`,
# and #2696 and #2662 turned main red on findings it names in 1-2 minutes
# (reverse-walk backtest, 2026-11-13).
#
# BESIDE IT, golangci-lint on the changed packages (owner, 2026-11-08): the
# `golangci` job, `task ci:golangci`, the Go packages the group changed since
# its base, findings in the files it changed only, the root .golangci.yml and the
# pinned forge's golangci-lint release. It runs on its own runner AT THE SAME
# TIME as the gate, so it adds nothing to the gate's five minutes, and `CI
# result` waits for it at the end (the "golangci (changed) passed" step) and
# fails unless it passed: the ruleset requires one check, and a job it does
# not require stops nothing. On 2026-11-08 main went red three times on
# findings only the release gate's whole-module lint saw (staticcheck QF1001
# from #2293 and #2427, gosec G101 from #2368); this job reproduces all three.
#
# WHAT DOES NOT: vet, forge lint's golangci, buf, whole-project and deploy
# lanes, golangci over packages the group did not change, buf lint on an
# unchanged proto, the race detector, slow and integration tests, the whole
# vitest suite, the renderer's release build, Playwright and the electron package smoke. ci.yml
# runs every one of them on each push to main and nightly, and the release
# gate's record requires them, so a release (an RC set) is never cut over them.
#
# WHY ONE GATE JOB. The org runs at most 20 jobs at once across every repository,
# and each job is a queue slot plus ~2 minutes of setup. The queue used to run
# ci.yml here: eight jobs per group (lanes, migration order, review marker,
# merge gate, web build, Playwright, CI result, plus Reliant review), and on
# 2026-11-01 a group took 20-38 minutes, of which 5-15 were waiting for a
# runner, five times, once per job hop. Its own review marker is not repeated
# here: Reliant review (reliant-review.yml) is required too and runs the same
# check from main. The golangci job is not a hop: nothing waits for it to
# START, both jobs queue for a runner at once, and `CI result` reads its
# verdict from the run's jobs API instead of `needs:`-ing it (a `needs:` would
# put the lint, then a second runner queue, in front of the gate).
#
# THE BUDGET is measured, not hoped for: the last step compares the run's wall
# time with 300s and, when it is over, says so on the run and on one rolling
# `pipeline:slo` issue (a warning; the step is continue-on-error and always
# exits 0). It does not fail the group: a slow runner is not the
# change's fault, and ejecting it would cost every entry behind it a rebuild.
on:
  merge_group:

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: write

env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    # A runner that dies holds the queue entry until this fires (the ruleset's
    # check timeout is 45 minutes).
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "true"
          ripgrep: "true"
          free-disk: background
          buf: "true"
      # Migration order is the gate's migorder phase whenever a migration changed.
      # CI_PR: the queued pull request (gh-readonly-queue/main/pr-<n>-<sha>), whose
      # labels scripts/check-compat.sh reads for an owner-accepted break. --queue
      # makes it judge only this entry's squash (HEAD against its parent), so an
      # entry ahead of this one is judged, against its own labels, in its own run.
      - name: task ci:merge -- --queue
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_PR="$(sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p' <<<"${HEAD_REF}")" \
            MG_LOGDIR="${RUNNER_TEMP}/merge-gate" task ci:merge -- --base "${BASE}" --queue
      - name: task test:flake (each new or changed test, three times)
        if: ${{ !cancelled() }}
        run: task test:flake -- --base "${BASE}"
      - name: task ci:repo-checks
        if: ${{ !cancelled() }}
        run: task ci:repo-checks BASE="${BASE}"
      # The vendored control-plane contract, when this group changes it: the
      # same check as ci.yml's cp-contract job (proto-vendor/controlplane/ is
      # exactly its SOURCE commit's export, and SOURCE is on control-plane
      # main), BEFORE the merge. It used to run only on the push to main, so
      # #2592 vendored an unmerged control-plane commit, merged, and turned main
      # red (control-plane #2556). scripts/ci-lanes.sh decides, as for ci.yml;
      # a group that does not touch the contract spends nothing here.
      # control-plane is private: read with CONTROL_PLANE_DEPLOY_KEY, read-only.
      - name: Vendored control-plane contract changed?
        id: cp_contract
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lane=$(scripts/ci-lanes.sh --base "${BASE}" | sed -n 's/^cp_contract=//p')
          echo "changed=${lane:-false}" | tee -a "$GITHUB_OUTPUT"
          [ "${lane}" = true ] || exit 0
          sha=$(sed -n 's/^control-plane \([0-9a-f]\{40\}\)$/\1/p' proto-vendor/controlplane/SOURCE 2>/dev/null | head -1)
          [ -n "${sha}" ] || { echo "::error::proto-vendor/controlplane/SOURCE names no control-plane commit; re-vendor with task contract:controlplane:sync"; exit 1; }
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"
      - name: Check out control-plane at SOURCE (private, read-only)
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: reliant-labs/control-plane
          ref: ${{ steps.cp_contract.outputs.sha }}
          path: control-plane-sibling
          ssh-key: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The vendored tree is a byte-for-byte `buf export`: the same buf as
      # control-plane's .github/actions/setup-buf pin (and ci.yml's cp-contract).
      - name: buf for the contract check
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.57.0"
          github_token: ${{ github.token }}
      - name: task contract:controlplane:check
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        env:
          CONTROL_PLANE_DIR: ${{ github.workspace }}/control-plane-sibling
        run: task contract:controlplane:check
      # The `golangci` job's verdict, read from this run attempt's jobs. It has
      # almost always finished by now (a typical diff lints in about a minute);
      # otherwise this waits for it, up to its own timeout. Not on a gate that
      # already failed: the group is red anyway, and waiting would only hold
      # every entry behind it.
      - name: golangci (changed) passed
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: golangci (changed)
          WAIT_S: "960"
          POLL_S: "10"
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          deadline=$(( $(date +%s) + WAIT_S ))
          while :; do
            # shellcheck disable=SC2016 # $ENV.JOB is jq's, not the shell's
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '[.jobs[] | select(.name == $ENV.JOB)][0] // {} | "\(.status // "absent") \(.conclusion // "")"' 2>/dev/null) || state="unreadable "
            case "${state}" in
              "completed success") echo "${JOB}: success"; exit 0 ;;
              completed\ *) echo "::error title=${JOB} did not pass::${JOB}: ${state#completed } (${url}); its log names each finding"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error title=${JOB} did not finish::${JOB} is still ${state% *} after ${WAIT_S}s (${url})"; exit 1
            fi
            echo "${JOB}: ${state% *}; waiting"
            sleep "${POLL_S}"
          done
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "${RUNNER_TEMP}/merge-gate/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload the gate's phase logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-logs
          path: ${{ runner.temp }}/merge-gate
          retention-days: 7
          if-no-files-found: ignore
      - name: Five-minute budget
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          BUDGET: "300"
        # Report-only: this step must NEVER fail the group (a slow runner is
        # not the change's fault), so every failure inside it is swallowed and
        # it always exits 0.
        run: |
          report() {
            now=$(date +%s)
            created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -q .created_at) || return 0
            c=$(date -d "${created}" +%s) || return 0
            wall=$(( now - c )) queue=$(( JOB_T0 - c )) run=$(( now - JOB_T0 ))
            line="merge-queue wall ${wall}s = ${queue}s waiting for a runner + ${run}s running (budget ${BUDGET}s); ${GROUP_REF}"
            echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${wall}" -le "${BUDGET}" ]; then echo "${line}"; return 0; fi
            echo "::warning title=Merge queue over its ${BUDGET}s budget::${line}"
            title="Merge queue CI over its 5-minute budget"
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh label create pipeline:slo --color B60205 --description "A pipeline SLO is breached" >/dev/null 2>&1
            issue=$(gh issue list --state open --label pipeline:slo --search "in:title \"${title}\"" --json number,updatedAt -q '.[0] // empty | "\(.number) \(.updatedAt)"' 2>/dev/null)
            if [ -z "${issue}" ]; then
              gh issue create --label pipeline:slo --title "${title}" --body "$(printf '%s\n\n%s\n\n%s' \
                "The merge queue's CI (.github/workflows/merge-queue.yml) has a five-minute wall-time budget, runner queue included (owner, 2026-11-01). This run was over it:" \
                "- ${line} ([run](${url}))" \
                "A large runner-queue share is a runner-capacity problem (the org's 20-job cap; self-hosted runners), not a test one. A large run share means a phase outgrew the tier: move it to the release gate. Further breaches are added as comments, at most one an hour.")" >/dev/null
              return 0
            fi
            # At most one comment an hour: one per group would bury the signal.
            last=$(date -d "${issue#* }" +%s 2>/dev/null) || return 0
            if [ $(( now - last )) -ge 3600 ]; then
              gh issue comment "${issue%% *}" --body "- ${line} ([run](${url}))" >/dev/null
            fi
            return 0
          }
          report || true
          exit 0

  # golangci-lint on the packages this group changed (header: BESIDE IT). Its
  # own runner, started with the gate; `CI result`'s "golangci (changed)
  # passed" step is what makes it gate. The job name is that step's key.
  golangci:
    name: golangci (changed)
    runs-on: ubuntu-latest
    # Below the wait in `CI result` (960s), so that wait sees a verdict.
    timeout-minutes: 15
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # No Go file changed: done in seconds, before any toolchain is set up.
      - name: Changed Go files
        id: changed
        run: |
          set -euo pipefail
          n=$(git diff --name-only --diff-filter=ACMR "${BASE}" HEAD -- '*.go' | wc -l)
          echo "${n} changed .go file(s) since ${BASE}"
          echo "any=$([ "${n}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        if: steps.changed.outputs.any == 'true'
        with:
          golangci: "true"
          postgres-cache: "false"
      - name: task ci:golangci
        if: steps.changed.outputs.any == 'true'
        run: task ci:golangci -- --base "${BASE}"
