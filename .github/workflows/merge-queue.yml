name: Merge queue

# The merge queue's verdict: the job named "CI result" (the ruleset's required
# check), on every merge group. It is a few seconds of aggregation over the
# jobs that do the work, `merge-gate`, `golangci` and `vitest`, which run at
# the same time, and `visual` when the group reaches the web UI: it passes
# only when each succeeded (THE VERDICT, below). The gate's
# budget is five minutes of wall time, runner queue included (owner,
# 2026-11-01: "merge-queue tests take at most 5 minutes; anything longer
# belongs in the pre-release gate").
#
# WHAT RUNS HERE: `task ci:merge -- --queue --skip-vitest`, the affected tier
# relative to the group's base: build, a compile of every test package
# (testbuild), the affected -short Go and electron tests (direct importers,
# and every transitive one when they add at most MG_REACH_CAP=20 packages),
# the web typecheck when web changed, forge lint's own lanes scoped to the changed
# directories (--optional-deps-guard and --tracing among them), its
# whole-project --graph --closed-sets --proto-format lanes on every group
# (projectlint), the forge demo
# bundle's build when the change reaches it, forge generate / docs drift when
# their inputs changed, migration safety and order when a migration changed
# (order against origin/main AND against HEAD^, the entries queued ahead),
# buf lint when a proto changed; then each new or changed Go test three times,
# the cheap repo checks, and the vendored control-plane contract check when the
# group changes proto-vendor/controlplane/ (control-plane #2556). The scoped
# forge lint joined on 2026-11-13: until then `--queue` implied `--skip-lint`,
# and #2696 and #2662 turned main red on findings it names in 1-2 minutes
# (reverse-walk backtest, 2026-11-13).
#
# BESIDE IT, golangci-lint on the changed packages (owner, 2026-11-08): the
# `golangci` job, `task ci:golangci`, the Go packages the group changed since
# its base, findings in the files it changed only, the root .golangci.yml and the
# pinned forge's golangci-lint release. It runs on its own runner AT THE SAME
# TIME as the gate, so it adds nothing to the gate's five minutes, and `CI
# result` needs it and fails unless it passed: the ruleset requires one check,
# and a job it does not require stops nothing. On 2026-11-08 main went red
# three times on findings only the release gate's whole-module lint saw (staticcheck QF1001
# from #2293 and #2427, gosec G101 from #2368); this job reproduces all three.
# When the group deprecates a declaration, the same script also runs
# staticcheck's SA1019 over the packages that use it (#3005).
#
# BESIDE IT TOO, the affected vitest files (owner, 2026-11-21): the `vitest`
# job, four legs, each `scripts/vitest-shard.sh --shard <i>/4`. Every leg plans
# the group exactly as the gate does (same rules, same base, same reach; on a
# FULL web fallback the files the group's own web modules reach) and runs
# vitest's shard i of that ONE file list, so the four run every selected file
# once and drop none. A hub web module reaches ~1100 files (#2935, #3009): one
# 4-CPU runner, in one process beside the Go tests, ran out of the gate's 30
# minutes. A group that selects no vitest file passes each leg in seconds,
# after the planner, so `vitest` concludes success or failure, never skipped.
#
# AND THE VISUAL BASELINE (owner, 2026-11-24; reliant#3446): the `visual` job,
# `scripts/visual-gate.sh`, the visual suite (frontends/web/e2e/visual) in the
# pinned Playwright image, COMPARE ONLY (--update-snapshots=none), on the merge
# group's own commit, when `scripts/ci-lanes.sh`'s `visual` lane says the
# group reaches it. Baselines used to go stale on main two ways: a PR captured
# on a base that lacked another PR's UI change, or a later commit on the PR
# (a pr-fix push) changed pixels after the capture. The group is main plus
# the entries ahead, so both now fail on the PR that causes them, naming the
# surfaces and the re-capture command. A group that reaches no visual input
# passes it in seconds with a notice saying why. It runs beside the gate, so
# it adds only what it runs past the other workers: on 2026-11-24 it ended
# 371-381s after the run's creation, where the last 20 web groups' workers
# ended at a median 374s (a median ~16s added, at most ~80s).
# visual-nightly.yml runs it on main every night.
#
# WHAT DOES NOT: vet, forge lint's golangci, buf, frontend and deploy lanes
# and its slow whole-project ones, golangci over packages the group did not
# change (but SA1019 where it deprecates), buf lint on an
# unchanged proto, the race detector, slow and integration tests, the whole
# vitest suite, the renderer's release build, Playwright and the electron package smoke. ci.yml
# runs every one of them on each push to main and nightly, and the release
# gate's record requires them, so a release (an RC set) is never cut over them.
#
# WHY ONE GATE JOB. The org runs at most 20 jobs at once across every repository,
# and each job is a queue slot plus ~2 minutes of setup. The queue used to run
# ci.yml here: eight jobs per group (lanes, migration order, review marker,
# merge gate, web build, Playwright, CI result, plus Reliant review), and on
# 2026-11-01 a group took 20-38 minutes, of which 5-15 were waiting for a
# runner, five times, once per job hop. Its own review marker is not repeated
# here: Reliant review (reliant-review.yml) is required too and runs the same
# check from main. The golangci job is not a hop: neither worker needs the
# other, so both queue for a runner at once and nothing waits for either to
# START (a `needs:` between them would put the lint, then a second runner
# queue, in front of the gate).
#
# THE VERDICT. `CI result` needs exactly the four workers, runs `if: always()`
# (a failed or cancelled worker must turn it red, never skip it: GitHub counts
# a skipped required check as passed), and passes only when every
# `needs.<job>.result` is `success`; `needs.vitest.result` is the matrix's
# roll-up, `success` only when all four legs succeeded. It reads nothing else: no checkout, no
# token, no API. Until 2026-11-21 it read the lint's verdict by polling this
# run's jobs API anonymously; that API answered 403, and a group whose gate
# and lint had both passed went red after eight polls (reliant #3095). The
# cost of `needs:` is one more runner start, after both workers finish.
#
# THE BUDGET is measured, not hoped for: the last step compares the run's wall
# time with 300s and records only structured timing evidence. The trusted
# default-branch workflow_run listener owns the rolling pipeline:slo issue.
# Report failures do not decide the required check; a slow runner is not the
# change's fault, and ejecting it would cost every entry behind it a rebuild.
#
# SELF-HOSTED RUNNERS ON cicd (owner, 2026-11-26: "The cicd machine is
# supposed to be exactly for this"). A merge group needs 8 jobs, and the org
# runs about 20 at once across every repository, so groups waited for a
# GitHub-hosted runner far longer than they ran. Every job but `visual` (it
# runs Playwright under docker, which the cicd runners are not given) runs on
# the runners labelled `self-hosted, cicd`: unprivileged users with no sudo,
# no docker and no view of the machine's agent workspaces or credentials, in a
# systemd slice that outweighs agent work for CPU, each held to 12 CPUs, with
# HOME, /tmp, the tool cache and the workspace emptied before and after every
# job. A root-owned job-started hook on those runners refuses any job that is
# not a merge group or a push to main of this repository. The `runs-on`
# expression keeps every other event (this workflow has none today) on
# GitHub-hosted runners. To roll back, set each `runs-on` to ubuntu-latest.
on:
  merge_group:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The gate (header: WHAT RUNS HERE). Its result is one of the three `CI result` reads.
  merge-gate:
    name: Merge gate
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted","cicd"]') || 'ubuntu-latest' }}
    # A runner that dies holds the queue entry until this fires, so it stays
    # under the ruleset's 45-minute check timeout. It is 44, not 30: a web
    # change to a hub module (paths.ts, a primitive) reaches ~1100 vitest
    # files at the merge tier's two-edge cut, and on this 4-CPU runner that
    # gate ran past 30 minutes and was cancelled (#2935, #3009).
    timeout-minutes: 44
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          ripgrep: "true"
          free-disk: background
          buf: "true"
          github-read-token: ""
      # Migration order is the gate's migorder phase whenever a migration changed.
      # CI_PR: the queued pull request (gh-readonly-queue/main/pr-<n>-<sha>), whose
      # labels scripts/check-compat.sh reads for an owner-accepted break. --queue
      # makes it judge only this entry's squash (HEAD against its parent), so an
      # entry ahead of this one is judged, against its own labels, in its own run.
      # The repository is public. Use only these two public compatibility
      # reads; no GitHub token or persisted checkout credential reaches tests.
      - name: task ci:merge -- --queue
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          COMPAT_REPO: reliant-labs/reliant
        run: |
          set -euo pipefail
          compat="${RUNNER_TEMP}/merge-compat-public-gh"
          cat > "$compat" <<'COMPAT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ ${1:-} == api ]] || exit 2
          shift
          if [[ ${1:-} == --paginate ]]; then shift; fi
          [[ $# == 3 && $2 == --jq ]] || exit 2
          [[ $1 =~ ^repos/reliant-labs/reliant/issues/[1-9][0-9]*/(labels|events)$ ]] || exit 2
          endpoint=$1 filter=$3 page=1
          while :; do
            body=$(curl --fail --silent --show-error --max-time 12 -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/${endpoint}?per_page=100&page=${page}") || exit 1
            jq -e 'type == "array"' <<<"$body" >/dev/null || exit 1
            jq -r "$filter" <<<"$body" || exit 1
            [[ $(jq length <<<"$body") -eq 100 ]] || break
            ((page < 20)) || exit 1
            page=$((page + 1))
          done
          COMPAT
          chmod 0700 "$compat"
          CI_PR="$(sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p' <<<"${HEAD_REF}")" \
            COMPAT_GH="$compat" MG_LOGDIR="${RUNNER_TEMP}/merge-gate" task ci:merge -- --base "${BASE}" --queue --skip-vitest
      - name: task test:flake (each new or changed test, three times)
        if: ${{ !cancelled() }}
        run: task test:flake -- --base "${BASE}"
      - name: task ci:repo-checks
        if: ${{ !cancelled() }}
        run: task ci:repo-checks BASE="${BASE}"
      # The vendored control-plane contract, when this group changes it: the
      # same check as ci.yml's cp-contract job (proto-vendor/controlplane/ is
      # exactly its SOURCE commit's export, and SOURCE is on control-plane
      # main), BEFORE the merge. It used to run only on the push to main, so
      # #2592 vendored an unmerged control-plane commit, merged, and turned main
      # red (control-plane #2556). scripts/ci-lanes.sh decides, as for ci.yml;
      # a group that does not touch the contract spends nothing here.
      # control-plane is private: read with CONTROL_PLANE_DEPLOY_KEY, read-only.
      - name: Vendored control-plane contract changed?
        id: cp_contract
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lane=$(scripts/ci-lanes.sh --base "${BASE}" | sed -n 's/^cp_contract=//p')
          echo "changed=${lane:-false}" | tee -a "$GITHUB_OUTPUT"
          [ "${lane}" = true ] || exit 0
          sha=$(sed -n 's/^control-plane \([0-9a-f]\{40\}\)$/\1/p' proto-vendor/controlplane/SOURCE 2>/dev/null | head -1)
          [ -n "${sha}" ] || { echo "::error::proto-vendor/controlplane/SOURCE names no control-plane commit; re-vendor with task contract:controlplane:sync"; exit 1; }
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"
      - name: Check out control-plane at SOURCE (private, read-only)
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: reliant-labs/control-plane
          ref: ${{ steps.cp_contract.outputs.sha }}
          path: control-plane-sibling
          ssh-key: ${{ secrets.CONTROL_PLANE_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The vendored tree is a byte-for-byte `buf export`: the same buf as
      # control-plane's .github/actions/setup-buf pin (and ci.yml's cp-contract).
      - name: buf for the contract check
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.57.0"
      - name: task contract:controlplane:check
        if: ${{ !cancelled() && steps.cp_contract.outputs.changed == 'true' }}
        env:
          CONTROL_PLANE_DIR: ${{ github.workspace }}/control-plane-sibling
        run: task contract:controlplane:check
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "${RUNNER_TEMP}/merge-gate/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # The gate's recorded test run (scripts/merge-gate.sh `forge test begin`:
      # lanes short and web-affected), pass or fail, as data for the Tests
      # view. This job holds no credential to upload it: the default-branch
      # listener test-upload-merge-queue.yml downloads it after the run and
      # uploads it with main's code, so the candidate never holds id-token.
      - name: Keep the recorded test run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-test-runs-${{ github.run_attempt }}
          path: .forge/tests/runs
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload the gate's phase logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-logs
          path: ${{ runner.temp }}/merge-gate
          retention-days: 7
          if-no-files-found: ignore
      - name: Five-minute budget
        if: always()
        continue-on-error: true
        env:
          BUDGET: "300"
        # Public Actions API, with no credential in this workflow.
        run: |
          set -euo pipefail
          now=$(date +%s)
          created=$(curl --fail --silent --show-error --max-time 10 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -er .created_at)
          c=$(date -d "${created}" +%s)
          [[ ${JOB_T0} =~ ^[0-9]+$ && ${JOB_T0} -ge ${c} && ${now} -ge ${JOB_T0} ]]
          wall=$(( now - c )) queue=$(( JOB_T0 - c )) run=$(( now - JOB_T0 ))
          line="merge-queue wall ${wall}s = ${queue}s waiting for a runner + ${run}s running (budget ${BUDGET}s)"
          echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${wall}" -le "${BUDGET}" ]; then exit 0; fi
          echo "::warning title=Merge queue over its ${BUDGET}s budget::${line}"
          jq -cn --arg repo "$GITHUB_REPOSITORY" --arg head "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson created "$c" --argjson started "$JOB_T0" --argjson measured "$now" \
            '{schema:"merge-queue-slo/v1",repo:$repo,head:$head,run_id:$run_id,attempt:$attempt,created:$created,started:$started,measured:$measured}' \
            > "${RUNNER_TEMP}/merge-queue-slo.json"
      - name: Upload over-budget timing evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: merge-queue-slo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-queue-slo.json
          retention-days: 7
          if-no-files-found: ignore

  # golangci-lint on the packages this group changed (header: BESIDE IT). Its
  # own runner, started with the gate; `CI result` needing it is what makes it
  # gate. With no changed Go file it skips its STEPS, not the job, so a no-op
  # lint is still a job success.
  golangci:
    name: golangci (changed)
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted","cicd"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # No Go file changed: done in seconds, before any toolchain is set up.
      - name: Changed Go files
        id: changed
        run: |
          set -euo pipefail
          n=$(git diff --name-only --diff-filter=ACMR "${BASE}" HEAD -- '*.go' | wc -l)
          echo "${n} changed .go file(s) since ${BASE}"
          echo "any=$([ "${n}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        if: steps.changed.outputs.any == 'true'
        with:
          golangci: "true"
          postgres-cache: "false"
          github-read-token: ""
      - name: task ci:golangci
        if: steps.changed.outputs.any == 'true'
        run: task ci:golangci -- --base "${BASE}"

  # The affected vitest files, in four shards (header: BESIDE IT TOO). The
  # gate passes --skip-vitest, so this job is the only one that runs them, and
  # `CI result` needs it. One matrix job: needs.vitest.result rolls the legs up.
  vitest:
    name: vitest (${{ matrix.shard }}/4)
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted","cicd"]') || 'ubuntu-latest' }}
    # Each leg runs a quarter of the files; CI result starts after the
    # slowest, inside the ruleset's 45-minute check timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Go for the planner (tools/test-affected: the standard library and
      # yaml, compiled in seconds, so main's build cache is not worth its
      # restore), Node and pnpm for vitest. The mock-value descriptor
      # regressions compile their proto fixture with the pinned buf binary.
      - uses: ./.github/actions/setup
        with:
          node: "true"
          buf: "true"
          go-build-cache: "false"
          postgres-cache: "false"
          github-read-token: ""
      - name: scripts/vitest-shard.sh
        run: scripts/vitest-shard.sh --base "${BASE}" --shard "${{ matrix.shard }}/4"

  # The visual baseline, compare only (header: AND THE VISUAL BASELINE). Its own
  # runner, started with the gate. A group that reaches no visual input skips
  # its STEPS, not the job, with a notice saying why, so the skip is a job
  # success (a skipped job would read as success too, but say nothing).
  visual:
    name: Visual baseline
    runs-on: ubuntu-latest
    # Advisory in the merge queue (owner, 2026-11-27): 29 group failures in 72h
    # were pixel diffs in surfaces the group never touched, and each one ejected
    # every group behind it. A mismatch still shows on the run and uploads its
    # diffs; visual-nightly.yml still files it on main. CI result reads this
    # job's result as success.
    continue-on-error: true
    # The build plus ~3 minutes of Playwright; CI result starts after it,
    # inside the ruleset's 45-minute check timeout.
    timeout-minutes: 25
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # scripts/ci-lanes.sh decides (its `visual` lane), as it does for the
      # control-plane contract. A diff it cannot compute turns the lane on.
      - name: Does the group reach the visual lane?
        id: lane
        run: |
          set -euo pipefail
          lane=$(scripts/ci-lanes.sh --base "${BASE}" | sed -n 's/^visual=//p')
          echo "run=${lane:-true}" | tee -a "$GITHUB_OUTPUT"
          if [ "${lane:-true}" != true ]; then
            echo "::notice title=Visual baseline: skipped, a pass::nothing since the group's base reaches the visual lane (scripts/ci-lanes.sh visual=false: no renderer source, style, asset, build config, lockfile, sdk/ts source or e2e/visual change)"
          fi
      - uses: ./.github/actions/setup
        if: steps.lane.outputs.run == 'true'
        with:
          go: "false"
          node: "true"
          github-read-token: ""
      # Docker is the hosted runner's own; the suite runs in the pinned
      # Playwright image through frontends/web/scripts/visual-docker.sh.
      - name: scripts/visual-gate.sh
        if: steps.lane.outputs.run == 'true'
        run: scripts/visual-gate.sh
      - name: Upload the visual diffs
        if: failure() && steps.lane.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            frontends/web/test-results-visual
            frontends/web/playwright-report-visual
            frontends/web/visual-results.json
          retention-days: 7
          if-no-files-found: ignore

  # The required check (header: THE VERDICT). The workers' results, from
  # `needs`, and nothing else: no checkout, no token, no API.
  ci-result:
    name: CI result
    needs: [merge-gate, golangci, vitest, visual]
    if: always()
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted","cicd"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Merge gate, golangci (changed), vitest and the visual baseline passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r '. as $needs | ("merge-gate", "golangci", "vitest", "visual") as $job
            | ($needs[$job].result // "missing") as $result
            | select($result != "success") | "\($job): \($result)"' <<<"${RESULTS}")
          if [ -n "${bad}" ]; then echo "::error title=CI result::jobs that did not pass:"; echo "${bad}"; exit 1; fi
          echo "merge-gate, golangci, vitest and visual all passed"
