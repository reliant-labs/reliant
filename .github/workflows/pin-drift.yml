# forge pin checks: drift reports and never blocks; ancestry (a pin that is
# not on forge's main) FAILS.
#
# WHY THIS EXISTS
# ===============
#
# Pre-launch we pin forge by COMMIT rather than by tag, because a tagged
# release costs three tags, three CI cycles and three merges (plus up to ~20
# minutes of module-proxy lag) before a one-line fix reaches prod — the only
# environment where our bugs actually appear. See docs/development/pinning.md.
#
# That trade has exactly one real cost, and this workflow is the thing that
# pays it. A commit pin has NO VERSION NUMBER TO NOTICE IS STALE. `v0.1.11`
# next to a `v0.1.14` release is obviously old at a glance;
# `v0.1.15-0.20260910160302-c195f15386be` looks equally current whether it is
# one commit behind or ninety. Nothing decays visibly, so nothing prompts a
# bump, and the pin quietly ages until someone wonders why a forge fix they
# merged weeks ago never reached prod.
#
# WHERE IT RUNS, AND WHY THERE
# ============================
#
# Separate from pr-ci.yml deliberately. pr-ci is a GATE — every job in it can
# fail the PR — and this check must never do that (see below). Folding a
# never-failing job into the gate blurs what a red PR-CI means, and it would
# inherit that workflow's change-detection plumbing for no benefit.
#
# It runs on `pull_request` (the annotation lands where somebody is holding the
# context) and on a weekly `schedule`. The schedule is the one that matters
# most: drift is caused by the SIBLING moving, so the commit that makes a pin
# stale never lands in this repo at all, and a quiet week with no PRs is
# exactly when a pin rots unobserved.
#
# WHY IT NEVER FAILS THE BUILD
# ============================
#
# A deliberately older pin is legitimate. Holding forge steady while chasing a
# regression is normal, and a check that failed CI for it would be one whose
# only remedy is to bypass it — and a check people routinely bypass has already
# stopped being a check.
#
# The invariants that genuinely MUST hold are enforced as hard failures where
# they belong: internal/buildmode's guards fail the test job if go.mod carries a
# forge `replace`, or requires no concrete forge version at all, and the
# `ancestry` job below fails if the pin is not on forge's main.
#
# ANCESTRY: THE ONE PIN PROBLEM THAT DOES FAIL
# ============================================
#
# Being BEHIND main is a choice. Pinning a commit that is NOT ON main is never
# one. It happens whenever a pin follows a sibling PR's head and that PR is
# squash-merged: main gets a new commit with the same tree, and the pinned one
# is kept alive only by a PR ref or a branch that is about to be deleted. With
# GOPRIVATE it already fails to resolve (`unknown revision`); without it, it
# builds only while proxy.golang.org still has it cached. reliant main pinned
# exactly such a commit (forge 1b0f7f55) on 2026-09-25.
#
# `push` to main catches a PR that was green when it ran but merged after the
# sibling squashed its pin away. The daily schedule catches the reverse order,
# where the sibling squashes after this repo merged, so no event lands here at
# all. The check is a ~2 MB blob-less fetch of public forge. It needs no token,
# which is why it can afford to run daily.
name: Pin Drift

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly: drift + ancestry
    - cron: "0 7 * * *" # daily: ancestry only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Report forge pin drift
    # Weekly cadence is deliberate for a warn-only report (see above). Skip the
    # daily ancestry-only cron and pushes to main, where no one reads a warning.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Report drift
        env:
          # The compare API reads reliant-labs/forge, which is private. The
          # default GITHUB_TOKEN is scoped to THIS repository only and cannot
          # see it. The script degrades honestly when a compare fails (it says
          # "skipped" rather than claiming up-to-date), so a missing
          # SIBLING_READ_TOKEN yields a useless-but-not-misleading report
          # instead of a false green.
          GH_TOKEN: ${{ secrets.SIBLING_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/pin-drift.sh --github

  ancestry:
    name: Forge pin is on forge main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Hermetic, about 1s. A detector that can pass vacuously is worse than
      # none, so prove it still FAILS on an off-main pin before trusting its
      # verdict on the real one.
      - name: Self-test the ancestry check
        run: ./scripts/test-pin-ancestry.sh

      - name: Check the forge pin is on forge main
        run: ./scripts/check-pin-ancestry.sh --github
