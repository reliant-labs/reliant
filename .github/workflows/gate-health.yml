# Notices when a CI gate has gone dark.
#
# WHY THIS EXISTS
# ===============
#
# The old PR CI workflow's own comment recorded the incident: the Playwright job "was
# cancelled at 15m in every one of the last 50 runs that reached the test step,"
# and "was never a slow-but-passing job; the Playwright suite itself was
# genuinely failing." Fifty consecutive runs producing no signal at all, and
# nothing noticed. Regressions shipped during that window that the gate existed
# to catch.
#
# A red job is loud exactly once — on the PR that turned it red. A PERMANENTLY
# red job is silent: people learn it is always red and stop reading it. A
# CANCELLED job is quieter still, because a timeout looks like infrastructure
# noise rather than a product defect. Nothing in GitHub Actions distinguishes
# "this gate is protecting us" from "this gate has not passed since March."
#
# WHY IT IS A SCHEDULED JOB READING HISTORY
# =========================================
#
# Actions cannot express "red for N consecutive runs" — a workflow run only ever
# sees itself. Branch protection knows required vs not-required, never healthy
# vs permanently broken; a required check that always fails just blocks every
# merge, which is what gets it marked not-required and sent fully dark.
#
# So the check has to read run history back out of the API after the fact, which
# is what `.github/scripts/check-gate-health.mjs` does with `gh run list` +
# `gh run view --json jobs`. That needs no new infrastructure, no external
# monitoring service, and no secret beyond the automatic GITHUB_TOKEN.
#
# WHAT IT DELIBERATELY DOES NOT DO
# ================================
#
# It does not fix, retry, or disable anything, and it does not gate merges. Its
# entire job is to convert silence into one failing run somebody sees. Fixing a
# dark gate — or deciding to delete it, which is also a legitimate answer — is a
# human call.

#
# MAIN IS GREEN (the second job)
# ==============================
#
# CI runs two tiers (ci.yml): the merge gate on pull requests and the release
# gate on pushes to main and nightly. Every slow test, the race detector,
# integration and e2e therefore run ONLY on main, and a red main is the one
# place those can fail at all. A red push run notifies only whoever merged; a
# red scheduled run, only whoever last edited its cron. So `main-health` runs
# after every CI run on main and keeps ONE issue, labelled `ci:main-red`, open
# for exactly as long as main's newest verdict is red. It also fails when
# main's run has no green "Release gate" job: the release tier stopping on
# main is the two tiers silently merging into one, and must not read as green.
#
# A failed RELEASE (a tag's "Release Electron App" run) is release-health.yml's
# job, not this workflow's: its tag runs never pass this workflow's
# `branches: [main]` filter. See that file's header.

name: Gate health

on:
  schedule:
    # Mondays 14:00 UTC. Weekly is the right cadence: the failure mode took
    # ~50 runs to go unnoticed, so a week is early, and a daily run for a
    # condition that changes this slowly is how an alert gets muted.
    - cron: "0 14 * * 1"
  # Every CI run on main (push, nightly, dispatch) that finishes. The
  # `branches` filter matches the triggering run's head branch, so PR runs do
  # not fire it; main-health's `if` re-checks the event anyway (a fork's branch
  # named `main`).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow file to audit
        required: false
        default: ci.yml
      threshold:
        description: Consecutive bad runs that count as dark
        required: false
        default: "5"

permissions:
  # actions:read is what `gh run list` / `gh run view` need. Nothing is written.
  actions: read
  contents: read

jobs:
  gate-health:
    name: No CI gate has gone dark
    # The weekly audit; a single main run finishing is main-health's business.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # No --branch on purpose: a gate goes dark on PRs as easily as on main,
      # and most runs are PR runs. The script treats "no runs found" as a
      # failure, because an audit that found nothing verified nothing.
      #
      # Each job's history is keyed by its NAME. The two tiers are separate
      # jobs ("Merge gate" on PRs, "Release gate" on main), so they have
      # separate streaks and green PR runs cannot hide a release gate that is
      # permanently red.
      - name: Audit recent runs for permanently-dark jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/check-gate-health.mjs \
            --workflow "${{ github.event.inputs.workflow || 'ci.yml' }}" \
            --runs 20 \
            --threshold "${{ github.event.inputs.threshold || '5' }}"

  main-health:
    name: Main's release gate is green
    # A run cancelled because a newer one superseded it carries no verdict;
    # the newer run's completion will fire this again.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      # The one write anywhere in this workflow: the `ci:main-red` issue.
      issues: write
    # Two main runs finishing together must not both open an issue.
    concurrency:
      group: gate-health-main-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # Exit 1 means red and still writes the verdict; anything else without a
      # verdict means the audit itself broke, which must not touch the issue.
      - name: Audit main's newest CI verdict
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-main-health.mjs --report "${RUNNER_TEMP}/main-health.md"

      - name: Open, update or close the ci:main-red issue
        if: steps.audit.outputs.verdict == 'red' || steps.audit.outputs.verdict == 'green'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.audit.outputs.verdict }}
          RUN_URL: ${{ steps.audit.outputs.run_url }}
          SHA: ${{ steps.audit.outputs.sha }}
        run: |
          set -euo pipefail
          label="ci:main-red"
          gh label create "${label}" --force --color B60205 \
            --description "CI is red on main; opened and closed by gate-health.yml" >/dev/null
          open="$(gh issue list --label "${label}" --state open --limit 1 --json number --jq '.[0].number // empty')"
          report="${RUNNER_TEMP}/main-health.md"

          if [ "${VERDICT}" = "red" ]; then
            if [ -z "${open}" ]; then
              gh issue create --title "main is red: CI" --label "${label}" --body-file "${report}"
            # The weekly backstop re-audits a run already reported: say it once.
            elif ! gh issue view "${open}" --json comments,body --jq '[.body, .comments[].body] | join("\n")' | grep -qF "${RUN_URL}"; then
              gh issue comment "${open}" --body-file "${report}"
            fi
          elif [ -n "${open}" ]; then
            gh issue close "${open}" --comment "main is green again at \`${SHA}\`: ${RUN_URL}"
          fi

      - name: Fail if main is red or the audit could not decide
        if: steps.audit.outputs.verdict != 'green'
        run: |
          echo "::error::main-health verdict: '${{ steps.audit.outputs.verdict || 'none (audit failed)' }}'. See the audit step above."
          exit 1
