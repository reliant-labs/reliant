name: Merge queue SLO

# workflow_run executes the default branch's workflow, never the merge group's
# copy. The issue writer therefore cannot be edited by the candidate it reports.
# Verification and safe disablement: dev-docs/merge-queue-readonly-recovery.md.
on:
  workflow_run:
    workflows: [Merge queue]
    types: [completed]

permissions: {}

concurrency:
  group: merge-queue-slo-issue
  cancel-in-progress: false

jobs:
  publish:
    name: Report the merge queue SLO
    if: ${{ github.repository == 'reliant-labs/reliant' && github.event.workflow_run.event == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Verify producer and publish bounded timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=reliant-labs/reliant
          # Event and Actions API must agree on the producing workflow, run,
          # attempt and head. Never trust those identities from the artifact.
          run=$(jq -er '.workflow_run.id | select(type == "number" and . > 0 and floor == .)' "$GITHUB_EVENT_PATH")
          attempt=$(jq -er '.workflow_run.run_attempt | select(type == "number" and . > 0 and floor == .)' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.workflow_run.head_sha | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")
          workflow=$(gh api "repos/$repo/actions/workflows/merge-queue.yml" --jq '.id')
          meta=$(gh api "repos/$repo/actions/runs/$run/attempts/$attempt")
          jq -e --arg repo "$repo" --arg head "$head" --argjson run "$run" --argjson attempt "$attempt" --argjson wf "$workflow" '
            .id == $run and .workflow_id == $wf and .run_attempt == $attempt and .event == "merge_group"
            and .status == "completed" and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_sha == $head and (.head_branch | test("^gh-readonly-queue/main/pr-[1-9][0-9]*-[0-9a-f]{7,40}$"))
            and (.path | split("@")[0]) == ".github/workflows/merge-queue.yml"
          ' <<<"$meta" >/dev/null
          artifact=$(gh api "repos/$repo/actions/runs/$run/artifacts?per_page=100" \
            | jq -r --arg n "merge-queue-slo-$attempt" --arg head "$head" --argjson run "$run" '
              [.artifacts[] | select(.name == $n and .expired == false and .size_in_bytes > 0 and .size_in_bytes <= 4096
                and .workflow_run.id == $run and .workflow_run.head_sha == $head)]
              | if length == 0 then empty elif length == 1 then .[0].id else error("ambiguous timing artifact") end')
          [[ -n $artifact ]] || exit 0
          [[ $artifact =~ ^[1-9][0-9]*$ ]]
          file=$(mktemp); trap 'rm -f "$file"' EXIT
          # Do not download an unbounded response even if the metadata's size
          # is stale. An oversized response is sliced, then rejected below.
          gh api "repos/$repo/actions/artifacts/$artifact/zip" | head -c 4097 >"$file"
          [[ $(wc -c <"$file") -le 4096 ]]
          created=$(jq -er '.created_at | fromdateiso8601' <<<"$meta")
          # Inspect, never extract an archive. Only numeric facts and fixed
          # identity fields from one bounded regular member reach the issue.
          facts=$(python3 -I - "$file" "$repo" "$head" "$run" "$attempt" "$created" <<'PY'
          import json, pathlib, stat, sys, time, zipfile
          path, repo, head, run, attempt, created = sys.argv[1:]
          if pathlib.Path(path).stat().st_size > 4096:
              raise SystemExit('timing archive exceeds byte budget')
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              if len(entries) != 1:
                  raise SystemExit('timing archive has unexpected members')
              entry = entries[0]
              mode = stat.S_IFMT(entry.external_attr >> 16)
              if entry.filename != 'merge-queue-slo.json' or mode not in (0, stat.S_IFREG) or entry.file_size > 1024:
                  raise SystemExit('invalid timing artifact member')
              with archive.open(entry) as data:
                  raw = data.read(1025)
          if len(raw) > 1024:
              raise SystemExit('timing record exceeds byte budget')
          fact = json.loads(raw)
          identity = dict(schema='merge-queue-slo/v1', repo=repo, head=head, run_id=int(run),
                          attempt=int(attempt), created=int(created))
          if not isinstance(fact, dict) or set(fact) != set(identity) | {'started', 'measured'}:
              raise SystemExit('invalid timing record shape')
          if any(type(fact[k]) != type(v) or fact[k] != v for k, v in identity.items()):
              raise SystemExit('timing record is for another run')
          start, end = fact['started'], fact['measured']
          origin = int(created)
          if type(start) is not int or type(end) is not int or not origin <= start <= end <= int(time.time()) + 60:
              raise SystemExit('invalid timing bounds')
          if end - origin > 3600 * 24:
              raise SystemExit('implausible merge queue run duration')
          print(end - origin, start - origin, end - start)
          PY
          )
          read -r wall queue elapsed <<<"$facts"
          [[ $wall =~ ^[0-9]+$ && $queue =~ ^[0-9]+$ && $elapsed =~ ^[0-9]+$ ]]
          [[ $wall -gt 300 ]] || exit 0
          title="Merge queue CI over its 5-minute budget"
          line="Merge-queue wall ${wall}s = ${queue}s waiting + ${elapsed}s running (budget 300s). [Run](https://github.com/${repo}/actions/runs/${run})"
          issues=$(gh issue list --repo "$repo" --state open --label pipeline:slo --search "in:title \"$title\"" --json number,title,updatedAt)
          issue=$(jq -r --arg title "$title" '[.[] | select(.title == $title)][0] // empty | "\(.number) \(.updatedAt)"' <<<"$issues")
          if [[ -z $issue ]]; then
            gh label create pipeline:slo --repo "$repo" --color B60205 --description "A pipeline SLO is breached" >/dev/null 2>&1 || true
            gh issue create --repo "$repo" --label pipeline:slo --title "$title" --body "$line"
          else
            read -r number last <<<"$issue"
            [[ $number =~ ^[1-9][0-9]*$ ]]
            last=$(date -d "$last" +%s)
            if (( $(date +%s) - last >= 3600 )); then gh issue comment "$number" --repo "$repo" --body "$line"; fi
          fi
