name: Visual nightly

# The visual baseline on main, every night (owner, 2026-11-24; reliant#3446):
# the backstop behind the merge queue's `visual` job.
#
# The queue runs the lane, compare only, on every group whose diff reaches its
# inputs (scripts/ci-lanes.sh `visual`). A surface can still move from outside
# those paths: a dependency the lockfile does not pin to the byte, the pinned
# image's fonts, a fixture the suite reads through a path the rule misses. So
# this runs `scripts/visual-gate.sh` (the same compare-only command) on main's
# tip and keeps ONE rolling `visual:stale` issue
# (.github/scripts/visual-stale-issue.sh): a mismatch opens it, or comments on
# it (reopening it if closed), listing each surface and what differed, with
# the run's diff images as its `visual-results` artifact; the next green run
# closes it. It never blocks a merge or a release.
#
# A run whose lane did not complete (no docker, a failed build, no report)
# carries no verdict: it fails the run without touching the issue, as
# gate-health.yml's main-health does for an audit that broke.
#
# A surface that differs on a commit whose UI did not move is
# nondeterministic: it is deleted with a `flake:removed` issue, never re-run
# to green (frontends/web/e2e/visual/README.md).

on:
  schedule:
    # 05:41 UTC daily: off the top of the hour, and before ci.yml's 06:17
    # nightly, so the two do not queue for runners together.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs (a dispatch beside the schedule) must not both open an issue.
concurrency:
  group: visual-nightly
  cancel-in-progress: false

jobs:
  visual:
    name: Visual baseline on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The one write in this workflow: the `visual:stale` issue.
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "true"
          github-read-token: ""
      # Exit 0 is a pass and 1 a mismatch; anything else means the lane did
      # not complete and must not touch the issue.
      - name: scripts/visual-gate.sh
        id: gate
        run: |
          set +e
          scripts/visual-gate.sh --summary "${RUNNER_TEMP}/visual.md"
          rc=$?
          set -e
          case "${rc}" in
            0) verdict=pass ;;
            1) verdict=mismatch ;;
            *) verdict=error ;;
          esac
          echo "verdict=${verdict}" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Upload the visual diffs
        if: ${{ !cancelled() && steps.gate.outputs.verdict != 'pass' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            frontends/web/test-results-visual
            frontends/web/playwright-report-visual
            frontends/web/visual-results.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Open, reopen, update or close the visual:stale issue
        if: ${{ !cancelled() && (steps.gate.outputs.verdict == 'pass' || steps.gate.outputs.verdict == 'mismatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          SHA: ${{ steps.gate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ runner.temp }}/visual.md
        run: .github/scripts/visual-stale-issue.sh
      - name: Fail unless every capture matched
        if: ${{ !cancelled() && steps.gate.outputs.verdict != 'pass' }}
        run: |
          echo "::error::visual baseline on main: '${{ steps.gate.outputs.verdict || 'none (the gate step failed)' }}'. See scripts/visual-gate.sh's report above."
          exit 1
