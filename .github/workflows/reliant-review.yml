name: Reliant review

# The review gate (control-plane docs/pr-pipeline.md). `Reliant review` is a
# required check in the main ruleset: a pull request merges only if its CURRENT
# head carries pr-review's pass marker for that exact sha
# (`<!-- review-passed sha=<head> -->` in a review whose commit_id is the head,
# by the pipeline's reviewer). pr-review's skip mode (the owner override,
# labelled review:skipped) posts the same exact-head marker, so it passes here
# too; a bare label is tied to no head and never counts. A later blocker on the
# same sha wins. In the merge queue it judges every pull request in the group.
#
# Red until pr-review passes the head, then green: the marker is a review
# (pull_request_review), and a pass also labels the PR (labeled). A push makes
# a new head with no marker, so it goes red again (synchronize).
#
# Its own workflow, not a ci.yml job: ci.yml must not run on `labeled` (a label
# run would replace the head's "CI result"). Seconds, no checkout: the gate is
# scripts/ci-review-marker.sh, read from main through the API (never the pull
# request's copy) and fed GitHub's own data.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [main]
  pull_request_review:
    types: [submitted]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  actions: write # re-run this head's earlier red verdicts (the last step)

# NO concurrency group. A cancelled run is NOT inert: GitHub holds a required
# check red while any check suite's newest run of it is cancelled ("Required
# status check \"Reliant review\" is cancelled", enqueuePullRequest,
# 2026-11-01). The pipeline adds three or four labels within a second of a pass,
# each a `labeled` run, and a shared group cancelled all but the last: the
# pull_request_review suite's run was left cancelled, auto-merge sat armed and
# BLOCKED, and the PR never entered the queue. Each run takes seconds and is
# idempotent, so every event keeps its own verdict.

jobs:
  reliant-review:
    name: Reliant review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: pr-review passed this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          gate="${RUNNER_TEMP}/ci-review-marker.sh"
          gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY}/contents/scripts/ci-review-marker.sh?ref=main" > "${gate}"
          if [ "${EVENT_NAME}" = merge_group ]; then
            bash "${gate}" group "${GROUP_REF}" "${GROUP_SHA}"
          else
            bash "${gate}" pr "${PR}"
          fi
      # A green verdict does not supersede a red or cancelled one: each event's
      # run is its own check suite, and GitHub holds the required check red
      # while any suite's newest run of it is red or cancelled. The run on
      # `opened`/`labeled` before pr-review posts its marker is red by design,
      # so without this every reviewed pull request sat BLOCKED with
      # auto-merge armed and never entered the queue (forge #1603,
      # 2026-11-01). So a green verdict re-runs this head's earlier red and
      # cancelled ones, ONE AT A TIME (scripts/ci-review-rerun.sh): a branch
      # cut before this workflow lost its concurrency group still runs that
      # definition, whose re-runs cancel each other when started together.
      # It first waits for runs created before it that are still in progress:
      # one may have read the gate before the marker existed and end red
      # after this run looked. A re-run (attempt > 1) heals nothing, so
      # re-runs never cascade. reliant-review-rerun.yml's schedule heals the
      # heads whose runs use an older definition of this file. Best-effort:
      # this step never turns the verdict red. The script is read from the
      # run's own commit, not main: it can only re-run this same check, whose
      # gate is still read from main.
      - name: re-run this head's earlier red verdicts
        if: github.event_name != 'merge_group' && github.run_attempt == 1
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          heal="${RUNNER_TEMP}/ci-review-rerun.sh"
          gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY}/contents/scripts/ci-review-rerun.sh?ref=${GITHUB_SHA}" > "${heal}"
          RERUN_STOP_AT=$(($(date +%s) + 10 * 60)) bash "${heal}" pr "${PR}" "${HEAD_SHA}" "${RUN_ID}"
