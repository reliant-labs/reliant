# The one setup every ci.yml job shares: Task, and Go / Node / ripgrep when the
# job needs them. After this step a job runs `task <name>`; what it runs lives
# in Taskfile.yml, not in a workflow.
#
# CACHES ARE RESTORED HERE AND SAVED ON MAIN ONLY. A cache saved by a
# pull_request run is visible to that PR alone, and saving one was pure cost
# that also pushed main's caches out of the repository's 10 GB budget. ci.yml's
# `go-cache` and `release-gate` jobs save on main; everything else restores.
name: Set up the CI toolchain
description: Task, plus Go (go.mod's version), Node, ripgrep and buf on request, with main's caches restored

inputs:
  go:
    description: Install Go and restore the module, build and embedded-Postgres caches
    default: "true"
  go-build-cache:
    description: Restore the Go build cache (disable for lightweight standalone tools)
    default: "true"
  postgres-cache:
    description: Restore embedded Postgres binaries (disable for jobs with no DB tests)
    default: "true"
  node:
    description: Install Node
    default: "false"
  ripgrep:
    description: Install ripgrep (internal/llm/tools shells out to rg and skips its tests without it)
    default: "false"
  free-disk:
    description: >-
      Delete the runner's preinstalled toolchains this repo never uses, for the gates' compiles:
      "true" waits for it (~100s); "background" starts it and moves on (the merge queue's
      five-minute budget), so the space frees while the caches restore
    default: "false"
  buf:
    description: Put go.mod's buf on PATH (forge lint's buf-lint lane refuses to run without it)
    default: "false"
  golangci:
    description: Put the pinned forge's golangci-lint on PATH, the release the release gate's forge lint runs (needs go)
    default: "false"

outputs:
  go-version:
    description: The installed Go version (cache keys)
    value: ${{ steps.go.outputs.go-version }}
  embedded-pg:
    description: go.mod's embedded-postgres module version (the pgtest binaries' cache key)
    value: ${{ steps.pins.outputs.embedded_pg }}

runs:
  using: composite
  steps:
    # The gates compile the whole module several times at once (generate and
    # docs in scratch checkouts beside build, test and lint), which overruns
    # the ~14 GB a hosted runner has free: the first merge-gate run on CI
    # failed every phase with "disk quota exceeded". The runner image ships
    # .NET, Android, GHC, Boost and CodeQL, none of which this repo uses;
    # removing them frees ~30 GB in seconds. First, so nothing installed
    # below can be in the way.
    - name: Free runner disk
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
        df -h / | tail -1
    # The same deletion without waiting for it: ~100s of rm, most of it the
    # Android SDK's small files, while the caches below restore. Output goes
    # to /dev/null so the step does not wait on the pipe; the runner reaps the
    # process when the job ends.
    - name: Free runner disk (background)
      if: inputs.free-disk == 'background'
      shell: bash
      run: |
        df -h / | tail -1
        sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL' >/dev/null 2>&1 </dev/null &

    # TOOL BINARIES (Task, ripgrep, buf) ARE CACHED PER TOOL AND VERSION, AND A
    # CACHE HIT NEVER TOUCHES github.com. On 2026-11-08 from ~08:46Z, github.com's
    # release downloads answered 504 for hours and every job failed here. On a
    # miss, fetch-release-asset.sh downloads with retries, falls back to the
    # REST API's asset endpoint (which kept serving), and checks the sha256.
    # Only the binary is cached, never the archive, and it is saved on a push to
    # main only (the header). A PR restores main's copy.
    #
    # Checking it after the merge: the first push to main runs "Save <tool>
    # (main only)" in each job that installs it, and the next PR's "Restore
    # <tool>" reports a cache hit and its install step downloads nothing.
    # Rolling it back: revert the commit that added these steps (Task goes back
    # to arduino/setup-task, buf to bufbuild/buf-action, ripgrep to plain curl);
    # the ci-tool-* caches then go unread and GitHub evicts them after 7 days.
    # A bad cached binary alone is dropped with `gh cache delete <key>` (keys
    # are ci-tool-<tool>-<version>-<os>-<arch>), so the next run re-downloads
    # and re-verifies it.
    #
    # Taskfile.yml needs Task 3.38+ (`if:` on a task call). Pinned, not `3.x`:
    # a cached binary needs a fixed version and checksum. To bump it, change all
    # three lines together; the sha256 is the asset's (`gh api
    # repos/go-task/task/releases/tags/<tag> --jq '.assets[].digest'`).
    - name: Restore Task
      id: task-cache
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ci-tools/task-3.54.0
        key: ci-tool-task-3.54.0-${{ runner.os }}-${{ runner.arch }}

    - name: Install Task
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        d="$HOME/.cache/ci-tools/task-3.54.0"
        if [ ! -x "$d/task" ]; then
          mkdir -p "$d"
          "${{ github.action_path }}/fetch-release-asset.sh" go-task/task v3.54.0 task_linux_amd64.tar.gz \
            "$RUNNER_TEMP/task.tgz" 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
          tar -xzf "$RUNNER_TEMP/task.tgz" -C "$d" task
        fi
        echo "$d" >> "$GITHUB_PATH"

    - name: Save Task (main only)
      if: runner.os == 'Linux' && runner.arch == 'X64' && steps.task-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ci-tools/task-3.54.0
        key: ci-tool-task-3.54.0-${{ runner.os }}-${{ runner.arch }}

    # Every job runs on ubuntu x64 today; any other runner keeps the action.
    - name: Install Task (other runners)
      if: runner.os != 'Linux' || runner.arch != 'X64'
      uses: arduino/setup-task@v2
      with:
        version: 3.54.0
        repo-token: ${{ github.token }}

    # setup-go's own cache always saves in its post step, which cannot be
    # limited to main, so it is off and the caches are restored explicitly.
    - name: Set up Go
      id: go
      if: inputs.go == 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false

    - name: Read cache pins
      id: pins
      if: inputs.go == 'true'
      shell: bash
      run: echo "embedded_pg=$(sed -n 's|^[[:space:]]*github.com/fergusstrange/embedded-postgres \(v[^[:space:]]*\).*|\1|p' go.mod)" >> "$GITHUB_OUTPUT"

    - name: Restore Go module cache
      if: inputs.go == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/go/pkg/mod
        key: go-mod-nozip-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-nozip-${{ runner.os }}-

    # Every compile here is -trimpath (the Taskfile and both gates add it), so
    # a package compiled on main's runner is a cache hit on a PR's.
    - name: Restore Go build cache
      if: inputs.go == 'true' && inputs.go-build-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/go-build
        key: go-build-trimpath-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-trimpath-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
          go-build-trimpath-${{ runner.os }}-${{ steps.go.outputs.go-version }}-

    # pgtest boots an embedded Postgres for every DB-backed test (no service
    # container, no DATABASE_URL); its binaries come from Maven Central unless
    # this cache holds them, and Maven answers a burst of runs with HTTP 429.
    # The archive is fixed by go.mod's embedded-postgres version, and its file
    # name carries the Postgres version, so the prefix fallback is safe.
    - name: Restore embedded Postgres binaries
      if: inputs.go == 'true' && inputs.postgres-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/forge/embedded-postgres
        key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.embedded_pg }}
        restore-keys: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-

    # forge lint's buf-lint lane runs `buf` from PATH and fails the lint as
    # "could NOT run" without it (the first CI release gate, d681008c). The
    # version is go.mod's buf pin, the one the Taskfile's BUF and forge
    # generate use.
    - name: Read the buf pin
      id: buf
      if: inputs.buf == 'true'
      shell: bash
      run: echo "version=$(awk '$1 == "github.com/bufbuild/buf" { sub(/^v/, "", $2); print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"

    # Cached like Task (above). Its checksum is the digest GitHub records for
    # the asset, since the version follows go.mod.
    - name: Restore buf
      id: buf-cache
      if: inputs.buf == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ci-tools/buf-${{ steps.buf.outputs.version }}
        key: ci-tool-buf-${{ steps.buf.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install buf
      if: inputs.buf == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUF_VERSION: ${{ steps.buf.outputs.version }}
      run: |
        set -euo pipefail
        d="$HOME/.cache/ci-tools/buf-${BUF_VERSION}"
        if [ ! -x "$d/buf" ]; then
          mkdir -p "$d"
          "${{ github.action_path }}/fetch-release-asset.sh" bufbuild/buf "v${BUF_VERSION}" buf-Linux-x86_64 "$d/buf.download"
          install -m 0755 "$d/buf.download" "$d/buf" && rm -f "$d/buf.download"
        fi
        echo "$d" >> "$GITHUB_PATH"

    - name: Save buf (main only)
      if: inputs.buf == 'true' && steps.buf-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ci-tools/buf-${{ steps.buf.outputs.version }}
        key: ci-tool-buf-${{ steps.buf.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # The merge queue's `golangci (changed)` job (merge-queue.yml). The version
    # is the pinned forge's templates.GolangciLintVersion, the release forge
    # lint requires in the release gate, read from that module's source so the
    # two can never disagree; a forge that moved the constant fails this step
    # rather than installing a guess. Cached like buf, checked against the
    # digest GitHub records for the asset (it is the release binary, built
    # with a Go new enough for go.mod).
    - name: Read the golangci-lint pin
      id: golangci
      if: inputs.golangci == 'true'
      shell: bash
      run: |
        set -euo pipefail
        dir="$(go mod download -json github.com/reliant-labs/forge | jq -r .Dir)"
        v="$(sed -n 's/^const GolangciLintVersion = "v\([0-9][0-9.]*\)"$/\1/p' "${dir}/internal/templates/toolversions.go")"
        [ -n "$v" ] || { echo "::error::no GolangciLintVersion in ${dir}/internal/templates/toolversions.go (the pinned forge moved it?)"; exit 1; }
        echo "version=${v}" | tee -a "$GITHUB_OUTPUT"

    - name: Restore golangci-lint
      id: golangci-cache
      if: inputs.golangci == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ci-tools/golangci-lint-${{ steps.golangci.outputs.version }}
        key: ci-tool-golangci-lint-${{ steps.golangci.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install golangci-lint
      if: inputs.golangci == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        V: ${{ steps.golangci.outputs.version }}
      run: |
        set -euo pipefail
        d="$HOME/.cache/ci-tools/golangci-lint-${V}" f="golangci-lint-${V}-linux-amd64"
        if [ ! -x "$d/golangci-lint" ]; then
          mkdir -p "$d"
          "${{ github.action_path }}/fetch-release-asset.sh" golangci/golangci-lint "v${V}" "${f}.tar.gz" "${RUNNER_TEMP}/golangci.tgz"
          tar -xzf "${RUNNER_TEMP}/golangci.tgz" -C "${RUNNER_TEMP}" "${f}/golangci-lint"
          install -m 0755 "${RUNNER_TEMP}/${f}/golangci-lint" "$d/golangci-lint"
        fi
        echo "$d" >> "$GITHUB_PATH"

    - name: Save golangci-lint (main only)
      if: inputs.golangci == 'true' && steps.golangci-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ci-tools/golangci-lint-${{ steps.golangci.outputs.version }}
        key: ci-tool-golangci-lint-${{ steps.golangci.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # frontends/web installs with pnpm, at the version that wrote its
    # pnpm-lock.yaml (frontends/web/package.json engines.pnpm). The npm cache
    # below covers the npm projects; pnpm fetches the web tree from the registry.
    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@v4
      with:
        version: 12.15.0

    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          electron/package-lock.json
          tools/protoc-gen-es/package-lock.json

    # A pinned, checksum-verified static build (apt-get cost ~15s a job),
    # cached like Task (above).
    - name: Restore ripgrep
      id: rg-cache
      if: inputs.ripgrep == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ci-tools/rg-14.1.1
        key: ci-tool-rg-14.1.1-${{ runner.os }}-${{ runner.arch }}

    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        v=14.1.1; f="ripgrep-${v}-x86_64-unknown-linux-musl"; d="$HOME/.cache/ci-tools/rg-${v}"
        if [ ! -x "$d/rg" ]; then
          mkdir -p "$d"
          "${{ github.action_path }}/fetch-release-asset.sh" BurntSushi/ripgrep "$v" "${f}.tar.gz" "${RUNNER_TEMP}/rg.tgz" \
            4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          tar -xzf "${RUNNER_TEMP}/rg.tgz" -C "${RUNNER_TEMP}" "${f}/rg"
          install -m 0755 "${RUNNER_TEMP}/${f}/rg" "$d/rg"
        fi
        sudo install -m 0755 "$d/rg" /usr/local/bin/rg

    - name: Save ripgrep (main only)
      if: inputs.ripgrep == 'true' && steps.rg-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ci-tools/rg-14.1.1
        key: ci-tool-rg-14.1.1-${{ runner.os }}-${{ runner.arch }}
