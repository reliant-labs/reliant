name: Restore the Go caches
description: >-
  Restores the module cache (go-mod, one entry per go.sum) and one scope of
  the Go build cache (go-build-<scope>, laddered), and records
  GOCACHE_RESTORED_AT for trim-go-build-cache. Restore only: a job that
  should save on main follows its work with save-go-caches.

# WHY ONE ACTION. A pull-request job's wall time is mostly setup, and these
# restores were spelled out per job with small differences that mattered: a
# scope that fell back to another's key, a job that also let setup-go restore
# a second ~1 GB copy of the same directories. Use with setup-go's
# `cache: false`, so this is the job's whole cache.
#
# THE MODULE CACHE is its own entry, keyed on go.sum alone, so it is saved
# once per dependency change rather than once per commit per scope. It holds
# the extracted module trees and their metadata, NOT the .zip archives
# (~420 MB of already-compressed bytes for forge): the go command builds from
# the extracted directory and checks it against the .ziphash beside it, and
# never reopens the zip (save-go-caches deletes them before saving). A
# module the restored cache lacks (a go.sum change
# since main last saved) is downloaded on first use as usual. `go mod
# download` would re-fetch every zip; use `go list -deps ./...` to warm what
# a step needs.
#
# THE BUILD CACHE ladder, most to least specific:
#   go-build-<scope>-<os>-<go.sum hash>-<rev>  exact revision (a re-run)
#   go-build-<scope>-<os>-<go.sum hash>-       same deps, newer main
#   go-build-<scope>-<os>-                     any deps (the Dependabot case)
# GOCACHE is content-addressed, so an older entry costs misses, never a wrong
# object (ci.yml's "Build-cache note").
#
# <rev> IS THE COMMIT OR THE DAY (`refresh`). The two scopes the pull-request
# tier restores, short and tools, are refreshed by every push to main: short
# carries the test results a pull request replays, so it must be main's
# newest. Every other scope is main-only and refreshes once per UTC day
# (`refresh: daily`): the first push of the day saves, and the rest restore
# that exact key and skip the save (save-go-caches' build-hit). Saving every
# scope on every push wrote ~9.5 GB per push into a 10 GB budget, and each
# push's saves evicted the pull-request tier's entries: 30 of the 54
# pull-request runs over five minutes between 2026-10-25 and 10-26 had a
# cold Checks job (go-mod, tools and even pre-commit all evicted), 400-620s
# against ~185s warm.
#
# An empty `scope` restores the module cache alone.

inputs:
  scope:
    description: The build-cache scope (the `<scope>` in go-build-<scope>-…); empty for the module cache only.
    required: true
  refresh:
    description: '"commit" (the default: a new entry per push to main) or "daily" (one per UTC day).'
    required: false
    default: commit

outputs:
  build-key:
    description: The build cache's primary key, for save-go-caches.
    value: ${{ steps.build.outputs.cache-primary-key }}
  build-hit:
    description: '"true" when the build cache restored its exact key: save-go-caches then skips the save.'
    value: ${{ steps.build.outputs.cache-hit }}
  mod-key:
    description: The module cache's primary key, for save-go-caches.
    value: ${{ steps.mod.outputs.cache-primary-key }}
  mod-hit:
    description: '"true" when the module cache restored its exact key.'
    value: ${{ steps.mod.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Note when the Go build cache was restored
      shell: bash
      run: echo "GOCACHE_RESTORED_AT=$(date +%s)" >> "$GITHUB_ENV"
    - name: Restore the Go module cache
      id: mod
      uses: actions/cache/restore@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-
    - name: The build cache's revision
      id: rev
      if: ${{ inputs.scope != '' }}
      shell: bash
      env:
        REFRESH: ${{ inputs.refresh }}
        SHA: ${{ github.sha }}
      run: |
        case "$REFRESH" in
          commit) echo "rev=$SHA" >> "$GITHUB_OUTPUT" ;;
          daily) echo "rev=day-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::refresh is \"$REFRESH\"; want commit or daily"; exit 1 ;;
        esac
    - name: Restore the Go build cache (${{ inputs.scope }})
      id: build
      if: ${{ inputs.scope != '' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/go-build
        key: go-build-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.rev.outputs.rev }}
        restore-keys: |
          go-build-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-build-${{ inputs.scope }}-${{ runner.os }}-
