    <circle cx="348" cy="220" r="11"/>
    <circle cx="194" cy="254" r="11"/>
    <circle cx="276" cy="254" r="11"/>
    <circle cx="170" cy="340" r="12"/>
    <circle cx="236" cy="312" r="12"/>
    <circle cx="300" cy="340" r="12"/>
