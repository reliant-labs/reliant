<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" data-audit="forge-logo-svg-primary-mark">
  <title id="title">Forge mesh anvil mark</title>
  <desc id="desc">A futuristic Forge logo: an anvil built from blueprint mesh, graph nodes, and support struts to represent production-ready AI scaffolding.</desc>
  <defs>
    <linearGradient id="tile" x1="92" y1="54" x2="432" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111A27"/>
      <stop offset="0.54" stop-color="#0A111B"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="36%" r="58%">
      <stop offset="0" stop-color="#5A9CFF" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#5A9CFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5A9CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meshStroke" x1="132" y1="120" x2="378" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE7FF"/>
      <stop offset="0.52" stop-color="#5A9CFF"/>
      <stop offset="1" stop-color="#325DFF"/>
    </linearGradient>
    <linearGradient id="steel" x1="166" y1="132" x2="338" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#E8EEF8"/>
      <stop offset="1" stop-color="#91A3BD"/>
    </linearGradient>
    <linearGradient id="ember" x1="184" y1="370" x2="328" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFBE66" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FFBE66" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#halo)"/>

  <g data-audit="blueprint-field" opacity="0.34" stroke="#263D59" stroke-width="2">
    <path d="M112 148H400M112 220H400M112 292H400M112 364H400"/>
    <path d="M148 112V400M220 112V400M292 112V400M364 112V400"/>
    <path d="M132 380L380 132M132 132L380 380" opacity="0.35"/>
  </g>

  <g data-audit="precision-frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#486583" stroke-width="4" opacity="0.74">
      <path d="M104 164V124H144"/>
      <path d="M408 164V124H368"/>
