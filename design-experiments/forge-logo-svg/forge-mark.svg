    <path d="M184 154L234 154L232 218L296 220L308 154M234 154L296 220M232 218L276 254M194 254L170 340M276 254L300 340M170 340L236 312L300 340M236 312L276 254" stroke="url(#meshStroke)" stroke-width="5" opacity="0.86"/>
    <path d="M170 340H300M140 354L236 312L372 354M168 410L236 354L344 410" stroke="url(#meshStroke)" stroke-width="5" opacity="0.72"/>
  </g>

  <g data-audit="production-nodes" fill="#E8EEF8" stroke="#07101A" stroke-width="5">
